name: Generar fichas

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min (GitHub peut décaler de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: fichas
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer les fiches en attente
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_DB_ID: ${{ vars.NOTION_DB_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          MODEL: ${{ vars.MODEL }}
        run: node scripts/generar.mjs
      - name: Publier
        run: |
          git config user.name "fichas-bot"
          git config user.email "fichas-bot@users.noreply.github.com"
          git add fichas data
          git diff --cached --quiet || (git commit -m "Nouvelles fiches" && git push)
