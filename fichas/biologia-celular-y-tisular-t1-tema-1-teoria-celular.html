<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tema 1. Teoría celular · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 1. Teoría celular","subtitulo":"La célula es la unidad de origen, estructural y funcional de todo ser vivo: qué define la vida, cómo surgió, cómo se clasifica y por qué los virus quedan fuera.","objetivos":["Al terminar, sabrás definir biología, ser vivo y biología celular, y distinguir la materia viva de la muerta (funciones) y de la inerte (estructura).","Al terminar, sabrás explicar la hipótesis de **Oparin (1923)** sobre el origen de la vida y ordenar la secuencia desde la Tierra primitiva hasta las primeras células.","Al terminar, sabrás enunciar los **cuatro postulados** de la teoría celular en el orden del temario y su formulación actual.","Al terminar, sabrás comparar células procariotas y eucariotas (organismos, tamaño, núcleo, membranas, división, número de células) y clasificar la vida según **Whittaker** y **Woese**.","Al terminar, sabrás argumentar por qué los virus no se consideran seres vivos y diferenciarlos de **priones** y **viroides**."],"ideas_clave":["La **célula** es la unidad anatómico-estructural, funcional y de replicación de los seres vivos. Su formulación actual: **unidad de origen, estructural y funcional** de todo ser vivo.","Un ser vivo es **diferente de muerto** por sus funciones (**autoconservación, autorregulación y autorreproducción**) y **diferente de inerte** por su estructura organizada en niveles (biomoléculas → orgánulos → células → tejidos → órganos → sistemas-aparatos → organismos).","La **autorregulación** asegura el equilibrio (**homeostasis**). Su pérdida provoca la **enfermedad**, y la acumulación de pérdidas de regulación conduce a la **muerte**.","**Oparin (1923)** propuso un origen de las moléculas orgánicas en una Tierra con muy poco oxígeno (H2, NH3, N2, CH4, H2O). La secuencia fue: energía (UV, calor, descargas) → grupos funcionales → caldo nutritivo → biomoléculas → **coacervados** → células.","Los 4 postulados en el orden del temario son: 1º todo organismo está formado por una o más células; 2º toda célula proviene de otra; 3º gametos y esporas también son células; 4º la célula es la unidad funcional.","La diferencia esencial entre ambos tipos celulares es el **sistema de endomembranas**: las eucariotas lo tienen (núcleo, vacuolas, orgánulos); las procariotas no tienen ni núcleo ni compartimentos. Tamaños: procariotas **1-10 µm**, eucariotas **10-100 µm**.","**Whittaker** propuso 5 reinos (moneras, protistas, hongos, plantas y animales). **Woese** propuso 3 dominios (Bacteria, Archaea y Eukarya) a partir de la secuenciación del **rRNA**, todos ellos derivados de un ancestro común universal.","Los **virus** son parásitos intracelulares obligados y acelulares, sin metabolismo propio, que usan la maquinaria de la célula huésped. Los **priones** son proteínas y los **viroides** son ARN sin proteínas; ambos pueden causar enfermedad."],"secciones":[{"id":"conceptos","titulo":"1. Conceptos básicos: biología, vida y biología celular","bloques":[{"tipo":"definicion","termino":"Biología","texto":"Del griego *bíos* (**vida**) y *-logos* (**tratado, estudio, ciencia**). Es la ciencia que estudia la vida."},{"tipo":"definicion","termino":"Ser vivo","texto":"**Organismo autónomo** capaz de **proporcionarse alimento**, **interaccionar con el ambiente** y **reproducirse**. Puede ser **unicelular** (p. ej., una bacteria) o **pluricelular** (plantas, animales, ser humano)."},{"tipo":"definicion","termino":"Célula","texto":"**Unidad anatómico-estructural, funcional y de replicación** de los organismos vivos."},{"tipo":"definicion","termino":"Biología celular","texto":"Estudio de la célula: sus **propiedades, estructuras, funciones, orgánulos**, su **interacción con el ambiente** y su **ciclo vital**."},{"tipo":"alerta","texto":"En la definición de ser vivo aparecen **tres capacidades**: alimentarse, interaccionar con el ambiente y reproducirse. La célula es unidad **anatómico-estructural, funcional y de replicación**. No confundas esta terna con la del **concepto actual** de la teoría celular, que habla de unidad **de origen, estructural y funcional**."}]},{"id":"origenes-vida","titulo":"2. Orígenes de la vida: la hipótesis de Oparin","bloques":[{"tipo":"parrafo","texto":"En **1923** el bioquímico **A. Oparin** sugirió que las primeras moléculas orgánicas surgieron en un mundo con **muy poco oxígeno**. La **Tierra primitiva** contenía principalmente **H2, NH3, N2, CH4 y H2O**. En condiciones normales estas moléculas son **poco reactivas**. Sin embargo, el aporte de energía de la **radiación UV**, el **calor** y las **descargas eléctricas** pudo hacerlas interactuar y formar **grupos funcionales**. Al **enfriarse la Tierra** se formó un **caldo nutritivo** en el que se ensamblaron **biomoléculas** (aminoácidos → proteínas). Estas se agruparon en **coacervados**, gotitas aisladas del medio que se consideran precursoras de las **células**."},{"tipo":"esquema","titulo":"Secuencia del origen de la vida según Oparin","mermaid":"flowchart TD\n  A[\"Tierra primitiva con muy poco O2\"] --> B[\"H2, NH3, N2, CH4 y H2O\"]\n  E[\"Radiación UV, calor y descargas eléctricas\"] -->|\"aportan energía\"| B\n  B --> C[\"Grupos funcionales\"]\n  C -->|\"enfriamiento de la Tierra\"| D[\"Caldo nutritivo\"]\n  D --> F[\"Biomoléculas\"]\n  F --> G[\"Coacervados\"]\n  G --> H[\"Células\"]","pie":"Memoriza el orden exacto: grupos funcionales, luego enfriamiento (caldo nutritivo), luego biomoléculas, luego coacervados y por último células."},{"tipo":"figura","pagina":3,"pie":"Lámina de la Tierra primitiva. Fíjate en las moléculas iniciales (H2O, H2, NH3, CH4), en el rayo como fuente de energía y en la secuencia aminoácidos → proteínas → coacervado.","src":"img/biologia-celular-y-tisular-t1-tema-1-teoria-celular-p3.jpg"},{"tipo":"tabla","titulo":"Datos examinables del origen de la vida","columnas":["Elemento","Dato del temario"],"filas":[["Autor y año","A. Oparin, bioquímico, 1923"],["Atmósfera primitiva","Muy poco oxígeno: H2, NH3, N2, CH4, H2O"],["Fuentes de energía","Radiación UV, calor, descargas eléctricas"],["Medio de síntesis","Caldo nutritivo, formado tras el enfriamiento de la Tierra"],["Precursor celular","Coacervados"],["Primera célula","Hace 3.800 \"billones\" de años, por recubrimiento de un ARN capaz de autorreplicarse"],["Ancestro","Se piensa que todas las células actuales evolucionaron de un único antecesor"]]},{"tipo":"alerta","texto":"El PDF dice **3.800 billones de años**, que es un calco del inglés *billion*. En español equivale a **3.800 millones de años** (complemento). Si el examen reproduce la cifra del temario, reconócela tal cual. Recuerda también que la primera célula surge del **recubrimiento de un ARN autorreplicante**, no de un ADN."}]},{"id":"ser-vivo","titulo":"3. El ser vivo: funciones, estructura y características","bloques":[{"tipo":"parrafo","texto":"Los conceptos de **materia viva** y **célula** están estrechamente ligados. La materia viva se distingue de dos cosas diferentes. Es **diferente de lo muerto** por sus **funciones**: un organismo muerto conserva la estructura, pero ha perdido la capacidad de conservarse, regularse y reproducirse. Es **diferente de lo inerte** por su **estructura**: la materia inerte no presenta organización jerárquica en biomoléculas, orgánulos, células y niveles superiores."},{"tipo":"esquema","titulo":"Qué distingue a un ser vivo","mermaid":"flowchart LR\n  SV[\"Ser vivo\"] --> M[\"Diferente de muerto\"]\n  SV --> I[\"Diferente de inerte\"]\n  M --> F[\"Funciones\"]\n  F --> F1[\"Autoconservación: nutrición y metabolismo\"]\n  F --> F2[\"Autorregulación: homeostasis\"]\n  F --> F3[\"Autorreproducción: perpetuar la especie\"]\n  I --> E[\"Estructura\"]\n  E --> N[\"Biomoléculas, orgánulos, células, tejidos, órganos, sistemas, organismos\"]","pie":"Funciones frente a muerto, estructura frente a inerte. Es una pregunta trampa clásica."},{"tipo":"tarjetas","items":[{"etiqueta":"Función 1","titulo":"Autoconservación","texto":"Asegura su **propia existencia**. Incluye la **nutrición** (obtención de **materia** y **energía**) y el **metabolismo**, que es el proceso de obtención de materia y energía a partir de la **descomposición de nutrientes**."},{"etiqueta":"Función 2","titulo":"Autorregulación","texto":"Asegura el **estado de equilibrio** del ser vivo (**equilibrio = homeostasis**). Su pérdida provoca la **enfermedad**, y la **acumulación** de pérdidas de regulación provoca la **muerte**."},{"etiqueta":"Función 3","titulo":"Autorreproducción","texto":"Asegura la **perpetuación de la especie**. Incluye las capacidades de **rejuvenecimiento**, **desarrollo** y **adaptación**."}]},{"tipo":"alerta","texto":"El **metabolismo** se encuadra en la **autoconservación**, no en la autorregulación. A su vez, **rejuvenecimiento, desarrollo y adaptación** se incluyen en la **autorreproducción**, no en la autorregulación. Ten cuidado con los distractores que mezclan funciones."},{"tipo":"perla","texto":"El binomio **homeostasis-enfermedad** es la base del razonamiento clínico en fisioterapia. La lesión o la patología suponen una pérdida de regulación, y el tratamiento busca restaurar el equilibrio. La **capacidad de adaptación** es lo que aprovechamos con el ejercicio terapéutico: aplicamos estímulos dosificados que el organismo integra para recuperar su función."},{"tipo":"figura","pagina":8,"pie":"Niveles de organización de los seres vivos: átomo → molécula → célula → tejido → órgano → sistema → organismo. Observa que la célula es el primer nivel con vida.","src":"img/biologia-celular-y-tisular-t1-tema-1-teoria-celular-p8.jpg"},{"tipo":"figura","pagina":9,"pie":"Clasificación según el número de células, la estructura y el grado de complejidad. Los unicelulares pueden ser procariotas (bacterias, como *Mycobacterium tuberculosis*) o eucariotas (como *Candida albicans*). Los multicelulares son siempre eucariotas: Fungi, plantas y animales (*Canis lupus familiaris*, *C. septempunctata*).","src":"img/biologia-celular-y-tisular-t1-tema-1-teoria-celular-p9.jpg"},{"tipo":"tabla","titulo":"Clasificación de los organismos vivos (diapositiva 9)","columnas":["Grupo","Tipo celular","Ejemplos del temario"],"filas":[["Unicelulares","Procariota (Bacteria)","*Mycobacterium tuberculosis*"],["Unicelulares","Eucariota","*Candida albicans*"],["Multicelulares","Eucariota: Fungi, Plantas, Animales","*Canis lupus familiaris* (perro), *C. septempunctata* (mariquita)"]]},{"tipo":"alerta","texto":"Existen **eucariotas unicelulares** (*Candida albicans*). La tabla procariota/eucariota asocia a las eucariotas con la condición de \"pluricelulares\", pero lo correcto es que **todos los multicelulares son eucariotas** y que **no todos los eucariotas son multicelulares**."},{"tipo":"tabla","titulo":"Resumen: características de los seres vivos (diapositiva 14)","columnas":["Característica","Concepto"],"filas":[["Organización precisa","Estructura jerárquica en niveles"],["Metabolismo","Perfectamente coordinado, regulado y adaptado"],["Conservación del medio interno","Homeostasis"],["Capacidad de respuesta al medio","Interacción con el ambiente"],["Movimiento","Desplazamiento o movimiento de partes"],["Crecimiento","Aumento de tamaño y desarrollo"],["Reproducción","Perpetuación de la especie"],["…y la evolución","Cambio de las poblaciones a lo largo del tiempo"]]}]},{"id":"teoria-celular","titulo":"4. La teoría celular","bloques":[{"tipo":"parrafo","texto":"La **teoría celular** es una parte fundamental de la Biología. Explica que la **materia viva** está constituida a base de células y aclara el papel que estas tienen en la constitución de la vida. Sus cuatro postulados integran tres ideas: la célula como **estructura** (todo está hecho de células), como **origen** (toda célula procede de otra, incluidas las unidades reproductoras) y como **función** (la célula es la unidad funcional)."},{"tipo":"tabla","titulo":"Postulados de la teoría celular (numeración del temario)","columnas":["Postulado","Enunciado","Idea que aporta"],"filas":[["1º","Todos los organismos están formados por una o más células","Unidad estructural"],["2º","Las células no se crean de nuevo: toda célula proviene siempre de otra","Unidad de origen"],["3º","Las unidades reproductoras (gametos y esporas) son también células","Continuidad reproductiva"],["4º","La célula es la unidad funcional de todo ser vivo","Unidad funcional"]]},{"tipo":"definicion","termino":"Teoría celular: concepto actual","texto":"**La célula es la unidad de origen, estructural y funcional de todo ser vivo.**"},{"tipo":"alerta","texto":"Ten presente la **numeración del temario**. El postulado de los **gametos y esporas** es el **3º** y el de la **unidad funcional** es el **4º**. Otros textos ordenan los postulados de forma distinta, pero en el examen se aplica este orden."},{"tipo":"perla","texto":"Clásicamente la teoría se atribuye a **Schleiden y Schwann** (1838-1839), y **Virchow** (1855) añadió el principio *omnis cellula e cellula* (complemento). Clínicamente, el 2º postulado explica que la reparación tisular tras una lesión dependa siempre de la **proliferación de células preexistentes**."}]},{"id":"procariotas-eucariotas","titulo":"5. Similitudes y diferencias entre células procariotas y eucariotas","bloques":[{"tipo":"parrafo","texto":"Solo existen **dos tipos de células básicas**: procariotas y eucariotas. El criterio decisivo es el **sistema de endomembranas**. En las **eucariotas**, las membranas internas definen **compartimentos celulares** (núcleo, vacuolas y otros orgánulos), lo que permite separar procesos y aumentar la complejidad. En las **procariotas** no hay endomembranas, así que el material genético queda libre en una región llamada **nucleoide**, sin envoltura nuclear. Las eucariotas tienen además **mayor cantidad de ADN** y son **estructuralmente más complejas**."},{"tipo":"figura","pagina":12,"pie":"Comparación eucariota/procariota. Elementos comunes: membrana celular y ribosomas. Exclusivos de la eucariota en el esquema: núcleo con envoltura, nucleolo y mitocondrias. En la procariota: nucleoide, flagelo y cápsula (solo en algunas procariotas). La pared celular aparece también en algunas eucariotas.","src":"img/biologia-celular-y-tisular-t1-tema-1-teoria-celular-p12.jpg"},{"tipo":"tabla","titulo":"Procariotas frente a eucariotas","columnas":["Rasgo","Procariotas","Eucariotas"],"filas":[["Organismos","Bacterias","Hongos, plantas, animales"],["Tamaño","1-10 µm","10-100 µm"],["Núcleo","No (nucleoide)","Sí (rodeado de membrana)"],["Membranas internas","↓↓ (sin endomembranas ni compartimentos)","↑↑ (sistema de endomembranas)"],["División celular","Bipartición","Mitosis y meiosis"],["Número de células","Unicelulares","Pluricelulares (también hay unicelulares, como *Candida*)"],["Cantidad de ADN y complejidad","Menor","Mayor"],["Comunes a ambas","Membrana celular, ribosomas, citoplasma","Membrana celular, ribosomas, citoplasma"]]},{"tipo":"alerta","texto":"Las procariotas **sí tienen ribosomas y membrana plasmática**. Lo que les falta son las **endomembranas**, no las membranas en general. También es falso que la pared celular sea exclusiva de procariotas: el esquema la sitúa en **algunas eucariotas**. La **meiosis** es propia de eucariotas; las procariotas se dividen por **bipartición**."},{"tipo":"perla","texto":"Existen también **diferencias entre células animales y vegetales** (el temario lo menciona como idea clave). Clásicamente, la célula vegetal tiene pared de celulosa, cloroplastos y una gran vacuola central (complemento). Las células humanas que tratamos en fisioterapia, como fibras musculares, fibroblastos o condrocitos, son **eucariotas animales**."}]},{"id":"clasificacion-vida","titulo":"6. Orígenes y clasificación de la vida: Whittaker y Woese","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"Sistema clásico","titulo":"Whittaker: 5 reinos","texto":"**Moneras, protistas, hongos, plantas y animales.** Agrupa a los seres vivos por rasgos estructurales y de organización."},{"etiqueta":"Sistema actual","titulo":"Woese: 3 dominios","texto":"Construido a partir de la **secuenciación del RNA ribosomal (rRNA)**. Distingue **Bacteria** y **Archaea** (procariotas) y **Eukarya** (eucariotas), todos derivados de un **ancestro común universal**."}]},{"tipo":"esquema","titulo":"Árbol filogenético universal (3 dominios de Woese)","mermaid":"flowchart TD\n  U[\"Ancestro común universal\"] --> P[\"Procariotas\"]\n  U --> EU[\"Eucariotas\"]\n  P --> B[\"Dominio Bacteria\"]\n  P --> AR[\"Dominio Archaea\"]\n  EU --> EK[\"Dominio Eukarya\"]\n  EK --> H[\"Hongos\"]\n  EK --> PL[\"Plantas\"]\n  EK --> AN[\"Animales\"]\n  EK --> PR[\"Protistas: ciliados, flagelados, Giardia\"]\n  B -->|\"ramas en el árbol\"| MC[\"Mitocondria y cloroplasto\"]","pie":"Archaea es procariota, pero es un dominio distinto de Bacteria. En el árbol, la mitocondria y el cloroplasto se sitúan dentro de la rama bacteriana, lo que refleja su origen endosimbiótico (complemento)."},{"tipo":"figura","pagina":15,"pie":"Árbol filogenético universal basado en el rRNA. Localiza los tres dominios (Bacteria en naranja, Archaea en marrón, Eukarya en verde), el ancestro común universal en la base, y la posición de Mitochondrion y Chloroplast dentro de Bacteria.","src":"img/biologia-celular-y-tisular-t1-tema-1-teoria-celular-p15.jpg"},{"tipo":"alerta","texto":"**Archaea no aparece entre los 5 reinos de Whittaker**: es un dominio del sistema de Woese. No confundas *reino* (Whittaker) con *dominio* (Woese). El criterio de Woese es **molecular (rRNA)**, no morfológico."}]},{"id":"virus","titulo":"7. Virus, priones y viroides","bloques":[{"tipo":"definicion","termino":"Parásito intracelular obligado","texto":"Agente que **carece de los constituyentes necesarios para crecer y multiplicarse** (ribosomas, sistemas enzimáticos, etc.). Por eso tiene que usar los de la célula que parasita. Los virus **no tienen metabolismo propio**."},{"tipo":"parrafo","texto":"¿Es un virus un ser vivo? Según el temario, **no**. Los virus **no son células**: carecen de estructura celular, que se considera la unidad básica de la vida. Son **pequeños paquetes de material genético**, agentes infecciosos microscópicos que **solo pueden multiplicarse dentro de las células** de otros organismos. **Aunque se reproducen**, no tienen **metabolismo**, **ni desarrollo**, ni **se relacionan con el medio** en el que viven. Usan la **maquinaria sintética** de la célula huésped para producir macromoléculas virales."},{"tipo":"tabla","titulo":"Virus frente a los criterios de ser vivo","columnas":["Criterio","¿Lo cumple el virus?"],"filas":[["Estructura celular","No"],["Metabolismo propio","No"],["Desarrollo","No"],["Relación con el medio","No"],["Reproducción","Sí, pero solo dentro de una célula huésped"]]},{"tipo":"esquema","titulo":"Agentes infecciosos acelulares","mermaid":"flowchart TD\n  A[\"Agentes infecciosos acelulares\"] --> V[\"Virus\"]\n  A --> PR[\"Priones\"]\n  A --> VI[\"Viroides\"]\n  V --> V1[\"Paquete de material genético\"]\n  V1 --> V2[\"Parásito intracelular obligado, sin metabolismo\"]\n  PR --> P1[\"Proteínas estructurales\"]\n  VI --> VI1[\"ARN pequeño sin proteínas asociadas\"]","pie":"Los virus no son los agentes más pequeños capaces de causar enfermedad: priones y viroides son aún más simples."},{"tipo":"tarjetas","items":[{"etiqueta":"Agente 1","titulo":"Virus","texto":"Material genético envuelto en una estructura que no es celular. Ejemplos de la lámina: **bacteriófago**, **virus del mosaico del tabaco**, **adenovirus** y **virus de la gripe**."},{"etiqueta":"Agente 2","titulo":"Priones","texto":"**Proteínas estructurales** capaces de generar enfermedades, sin ácido nucleico."},{"etiqueta":"Agente 3","titulo":"Viroides","texto":"**Pequeñas moléculas de ARN sin proteínas asociadas** que pueden causar enfermedad."}]},{"tipo":"alerta","texto":"Prión = **solo proteína**; viroide = **solo ARN**. Es la confusión más habitual. Las etiquetas ADN/ARN de la lámina de la diapositiva 16 no coinciden con la clasificación clásica: el virus de la gripe es un virus ARN y el bacteriófago T4 es un virus ADN (complemento). No memorices esa asignación de la lámina."},{"tipo":"perla","texto":"Como los virus no tienen metabolismo ni ribosomas propios, los **antibióticos** dirigidos a estructuras bacterianas **no actúan sobre ellos** (complemento). Los priones resisten los métodos de esterilización habituales y causan enfermedades neurodegenerativas como la de **Creutzfeldt-Jakob** (complemento). Esto es relevante para la higiene del material compartido en clínica."}]}],"caso_clinico":{"titulo":"Paciente con neumonía, candidiasis oral y dudas sobre qué está vivo","presentacion":"Hombre de 72 años, ingresado en planta de medicina interna. Inicialmente se sospechó tuberculosis pulmonar (*Mycobacterium tuberculosis*), sospecha que finalmente se descartó: el diagnóstico fue una gripe complicada. Tras varios días de antibióticos de amplio espectro presenta candidiasis oral (*Candida albicans*). Ha perdido fuerza y tolerancia al esfuerzo, y se le pauta fisioterapia respiratoria y movilización precoz. Su hija, estudiante de bachillerato, le pregunta al fisioterapeuta: «¿Por qué le dieron antibióticos si era gripe? ¿Y el hongo de la boca es una bacteria?».","preguntas":[{"pregunta":"¿Cómo clasificarías *Mycobacterium tuberculosis* y *Candida albicans* según el esquema del temario y según sus rasgos celulares?","respuesta":"*Mycobacterium tuberculosis* es un organismo **unicelular procariota** (dominio Bacteria). No tiene núcleo ni endomembranas, mide en torno a 1-10 µm y se divide por bipartición. *Candida albicans* es un organismo **unicelular eucariota** (un hongo). Tiene núcleo y sistema de endomembranas. Esto demuestra que \"eucariota\" no equivale a \"pluricelular\". Por tanto, el hongo de la boca **no es una bacteria**: es una célula estructuralmente más compleja y con más ADN."},{"pregunta":"¿Por qué el virus de la gripe no se trata como una bacteria y por qué el temario no lo considera un ser vivo?","respuesta":"El virus es un **parásito intracelular obligado**. Carece de ribosomas y sistemas enzimáticos propios, y **no tiene metabolismo**, así que usa la maquinaria sintética de las células respiratorias del paciente para fabricar sus macromoléculas. No tiene estructura celular, desarrollo ni relación con el medio. Aunque se reproduce, solo lo hace dentro de la célula huésped, por lo que no cumple la teoría celular. Los antibióticos actúan sobre estructuras y metabolismo bacterianos (complemento), por eso no sirven contra el virus. Se pautan cuando existe sospecha o riesgo de sobreinfección bacteriana."},{"pregunta":"Desde los conceptos de autorregulación y autorreproducción, ¿cómo justificarías la intervención de fisioterapia en este paciente?","respuesta":"La infección y el encamamiento suponen una **pérdida de autorregulación (homeostasis)**, lo que según el temario provoca **enfermedad**. Si se acumulan más pérdidas de regulación, como el desacondicionamiento o las complicaciones respiratorias, el pronóstico empeora hasta el extremo de la **muerte**. La fisioterapia respiratoria y la movilización precoz buscan restablecer ese equilibrio. Para ello se apoyan en la **capacidad de adaptación** (incluida en la autorreproducción): estímulos dosificados de ejercicio y ventilación que el organismo integra para recuperar su función."}]},"glosario":[{"termino":"Biología","definicion":"Del griego *bíos* (vida) y *-logos* (tratado, estudio, ciencia): ciencia que estudia la vida."},{"termino":"Ser vivo","definicion":"Organismo autónomo capaz de proporcionarse alimento, interaccionar con el ambiente y reproducirse."},{"termino":"Célula","definicion":"Unidad de origen, estructural y funcional de todo ser vivo; también unidad de replicación."},{"termino":"Homeostasis","definicion":"Estado de equilibrio del ser vivo, garantizado por la autorregulación; su pérdida provoca enfermedad."},{"termino":"Metabolismo","definicion":"Proceso de obtención de materia y energía a partir de la descomposición de nutrientes; forma parte de la autoconservación."},{"termino":"Coacervado","definicion":"Agregado de biomoléculas aislado del medio, considerado en la hipótesis de Oparin el paso previo a la célula."},{"termino":"Caldo nutritivo","definicion":"Medio acuoso de la Tierra primitiva, tras su enfriamiento, donde se formaron las biomoléculas."},{"termino":"Sistema de endomembranas","definicion":"Conjunto de membranas internas que definen compartimentos (núcleo, vacuolas, orgánulos); exclusivo de eucariotas."},{"termino":"Nucleoide","definicion":"Región del citoplasma procariota donde se localiza el material genético, sin envoltura nuclear."},{"termino":"Bipartición","definicion":"Mecanismo de división celular de las procariotas."},{"termino":"Dominio","definicion":"Categoría superior de clasificación de Woese (Bacteria, Archaea, Eukarya), basada en la secuenciación del rRNA."},{"termino":"Parásito intracelular obligado","definicion":"Agente sin ribosomas ni sistemas enzimáticos propios que solo se multiplica usando la maquinaria de una célula huésped; es el caso de los virus."},{"termino":"Prion","definicion":"Proteína estructural capaz de generar enfermedad."},{"termino":"Viroide","definicion":"Pequeña molécula de ARN sin proteínas asociadas capaz de causar enfermedad."}],"fuentes":["Universidad Europea. Biología Celular y Tisular. Tema 01: Teoría Celular (Grado en Fisioterapia / DG en Enfermería y Fisioterapia).","Oparin A. (1923). Hipótesis sobre el origen de las moléculas orgánicas en la Tierra primitiva (citado en el temario).","Whittaker. Clasificación de los seres vivos en 5 reinos (citado en el temario).","Woese. Sistema de 3 dominios basado en la secuenciación del rRNA (citado en el temario).","Riedel S, Hobden JA, Miller S, Morse SA, Mietzner TA, Detrick B, Mitchell TG, Sakanari JA, Hotez P, Mejia R. Jawetz, Melnick & Adelberg's Medical Microbiology, 28e. McGraw-Hill; 2019. Cap. 38."],"qcm":[{"pregunta":"Según la hipótesis de Oparin (1923) recogida en el temario, ¿en qué condiciones surgieron las primeras moléculas orgánicas?","opciones":["En una atmósfera con muy poco oxígeno, rica en H2, NH3, N2, CH4 y H2O","En una atmósfera de O2, H2 y N2 protegida de la radiación ultravioleta","En una atmósfera oxidante de O2, NH3 y CH4 con gran estabilidad química","En una atmósfera rica en oxígeno, con abundante CO2, N2 y vapor de agua"],"correcta":0,"explicacion":"Oparin propuso que las primeras moléculas orgánicas surgieron en un mundo con muy poco oxígeno. La Tierra primitiva contenía principalmente H2, NH3, N2, CH4 y H2O. Estas moléculas, poco reactivas, interactuaron gracias a la radiación UV, el calor y las descargas eléctricas.","por_opcion":["✅ Es literalmente la composición de la Tierra primitiva del temario: muy poco oxígeno y H2, NH3, N2, CH4 y H2O.","❌ La radiación UV fue precisamente una de las fuentes de energía que permitió las reacciones; tampoco había abundante O2.","❌ No era oxidante ni rica en O2. Además, las moléculas eran poco reactivas y necesitaron energía externa, no \"gran estabilidad\".","❌ La atmósfera primitiva tenía muy poco oxígeno; una atmósfera rica en O2 contradice la hipótesis."]},{"pregunta":"¿Cuál es el orden correcto de la secuencia que conduce desde la Tierra primitiva hasta las células según el temario?","opciones":["Biomoléculas → grupos funcionales → caldo nutritivo → coacervados → células","Grupos funcionales → coacervados → caldo nutritivo → biomoléculas → células","Caldo nutritivo → grupos funcionales → coacervados → biomoléculas → células","Grupos funcionales → caldo nutritivo → biomoléculas → coacervados → células"],"correcta":3,"explicacion":"La energía (UV, calor, descargas) genera primero grupos funcionales. Con el enfriamiento de la Tierra se forma el caldo nutritivo, donde se ensamblan biomoléculas. Estas se agrupan en coacervados, precursores de las células.","por_opcion":["❌ Las biomoléculas no son el primer paso: requieren grupos funcionales previos y el caldo nutritivo.","❌ Los coacervados son el último paso antes de la célula y se forman a partir de biomoléculas, no antes del caldo.","❌ El caldo nutritivo se forma tras el enfriamiento, una vez existen grupos funcionales; los coacervados van después de las biomoléculas.","✅ Reproduce exactamente la secuencia del temario."]},{"pregunta":"Un tejido pierde progresivamente su capacidad de mantener el equilibrio interno y aparece enfermedad; si estas pérdidas se suman, se produce la muerte. ¿Qué función del ser vivo está comprometida?","opciones":["Autorregulación, porque asegura el estado de homeostasis","Organización estructural, porque diferencia lo vivo de lo inerte","Autoconservación, porque engloba la nutrición y el metabolismo","Autorreproducción, porque incluye la capacidad de adaptación"],"correcta":0,"explicacion":"La autorregulación asegura el estado de equilibrio (homeostasis). El temario indica que su pérdida provoca la enfermedad y que la acumulación de estas pérdidas de regulación conduce a la muerte.","por_opcion":["✅ Equilibrio = homeostasis = autorregulación: su pérdida produce enfermedad y su acumulación, la muerte.","❌ La estructura distingue lo vivo de lo inerte, no de lo muerto; el escenario describe una función perdida.","❌ La autoconservación asegura la propia existencia mediante nutrición y metabolismo, pero no se define por el equilibrio.","❌ La adaptación forma parte de la autorreproducción, cuyo fin es la perpetuación de la especie."]},{"pregunta":"En el esquema funcional del ser vivo del temario, el proceso de obtención de materia y energía a partir de la descomposición de nutrientes se encuadra dentro de:","opciones":["La estructura, como rasgo que lo diferencia de la materia inerte","La autoconservación, junto con la nutrición de materia y energía","La autorreproducción, como base de la capacidad de desarrollo","La autorregulación, como mecanismo de control de la homeostasis"],"correcta":1,"explicacion":"El proceso descrito es el metabolismo. El temario lo incluye en la autoconservación, cuyo objetivo es asegurar la propia existencia, junto con la nutrición (materia y energía).","por_opcion":["❌ El metabolismo es una función, y las funciones distinguen lo vivo de lo muerto, no de lo inerte.","✅ Metabolismo y nutrición forman la autoconservación.","❌ La capacidad de desarrollo pertenece a la autorreproducción, pero el metabolismo no se ubica ahí.","❌ La autorregulación se ocupa del equilibrio (homeostasis), no de obtener materia y energía."]},{"pregunta":"Las capacidades de rejuvenecimiento, desarrollo y adaptación aparecen en el temario como componentes de:","opciones":["La autorregulación, que asegura el equilibrio del ser vivo","La autoconservación, que asegura la propia existencia","El metabolismo, que obtiene materia y energía de los nutrientes","La autorreproducción, que asegura la perpetuación de la especie"],"correcta":3,"explicacion":"La autorreproducción asegura la perpetuación de la especie e incluye las capacidades de rejuvenecimiento, desarrollo y adaptación.","por_opcion":["❌ La autorregulación se define por la homeostasis; la adaptación no figura en ella en el temario.","❌ La autoconservación comprende nutrición y metabolismo.","❌ El metabolismo forma parte de la autoconservación y no incluye estas capacidades.","✅ Es exactamente el contenido del recuadro de autorreproducción."]},{"pregunta":"Un cadáver recién fallecido conserva tejidos y órganos intactos. Según el temario, ¿qué le separa ya de un ser vivo?","opciones":["Ha perdido la estructura jerárquica, que distingue lo vivo de lo inerte","Ha perdido la estructura celular, que distingue lo vivo de lo muerto","Ha perdido las funciones de autoconservación, autorregulación y autorreproducción","Ha perdido sus biomoléculas, que son el primer nivel de organización"],"correcta":2,"explicacion":"Lo vivo es diferente de muerto por sus funciones (autoconservación, autorregulación y autorreproducción) y diferente de inerte por su estructura. El cadáver mantiene la estructura pero ha perdido las funciones.","por_opcion":["❌ El enunciado indica que la estructura se conserva; además, la estructura es el criterio frente a lo inerte.","❌ La estructura no es el criterio frente a lo muerto, y en el cadáver las células siguen presentes.","✅ Las funciones son el criterio que distingue lo vivo de lo muerto.","❌ Las biomoléculas persisten en el cadáver recién fallecido; no es esto lo que lo diferencia."]},{"pregunta":"Según la numeración de los postulados de la teoría celular empleada en el temario, ¿qué establece el tercer postulado?","opciones":["La célula es la unidad funcional de todo ser vivo","Todos los organismos están formados por una o más células","Las células no se crean de nuevo y proceden siempre de otra","Las unidades reproductoras, gametos y esporas, son también células"],"correcta":3,"explicacion":"El orden del temario es: 1º organismos formados por células; 2º toda célula proviene de otra; 3º gametos y esporas son células; 4º la célula es la unidad funcional.","por_opcion":["❌ Corresponde al 4º postulado.","❌ Corresponde al 1º postulado.","❌ Corresponde al 2º postulado.","✅ Es el 3º postulado según el temario."]},{"pregunta":"¿Cuál es la formulación actual de la teoría celular tal como la recoge el temario?","opciones":["La célula es la unidad anatómica, metabólica y reproductora de la vida","La célula es la unidad de origen, estructural y funcional de todo ser vivo","La célula es la unidad estructural, funcional y hereditaria del ser vivo","La célula es la unidad estructural y funcional, pero no la unidad de origen"],"correcta":1,"explicacion":"El concepto actual resume los postulados en una sola frase: la célula es la unidad de origen, estructural y funcional de todo ser vivo. Integra que toda célula procede de otra, que todo está hecho de células y que la célula es la unidad funcional.","por_opcion":["❌ Mezcla términos (\"metabólica\", \"reproductora\") que no componen la definición actual.","✅ Es la formulación literal del concepto actual.","❌ Sustituye \"de origen\" por \"hereditaria\", un término que no figura en la formulación del temario.","❌ Niega la unidad de origen, que es precisamente uno de los tres pilares (2º postulado)."]},{"pregunta":"En el esquema de clasificación por número de células, estructura y complejidad del temario, *Candida albicans* se ubica como:","opciones":["Organismo unicelular procariota del grupo Bacteria","Organismo procariota perteneciente al dominio Archaea","Organismo unicelular de tipo celular eucariota","Organismo multicelular eucariota del grupo Fungi"],"correcta":2,"explicacion":"El temario coloca *Candida albicans* en la rama de organismos unicelulares eucariotas. Demuestra que existen eucariotas unicelulares, aunque la tabla comparativa asocie a las eucariotas con la condición de pluricelulares.","por_opcion":["❌ El ejemplo de unicelular procariota (Bacteria) es *Mycobacterium tuberculosis*.","❌ No es procariota; Archaea es un dominio procariota del sistema de Woese.","✅ Aparece como ejemplo de unicelular eucariota.","❌ Aunque es un hongo, en el esquema no está en la rama multicelular Fungi."]},{"pregunta":"Se observa una célula de unos 5 µm, sin compartimentos membranosos internos, con ribosomas y material genético libre en el citoplasma. ¿Qué combinación de rasgos adicionales es coherente con ella?","opciones":["Sistema de endomembranas y mayor cantidad de ADN que la media","Núcleo rodeado de membrana y división por mitosis y meiosis","Mitocondrias propias y división exclusivamente por meiosis","Ausencia de núcleo y división celular por bipartición"],"correcta":3,"explicacion":"El tamaño de 1-10 µm y la ausencia de endomembranas definen una célula procariota. Las procariotas no tienen núcleo y se dividen por bipartición; mitosis y meiosis son propias de eucariotas.","por_opcion":["❌ Contradice el enunciado: las eucariotas tienen endomembranas y más ADN.","❌ Núcleo con membrana y mitosis/meiosis son rasgos eucariotas.","❌ Las mitocondrias son orgánulos membranosos eucariotas; la meiosis también es eucariota.","✅ Sin núcleo y con división por bipartición: célula procariota."]},{"pregunta":"¿Qué afirmación sobre las células procariotas es correcta según el temario y su esquema comparativo?","opciones":["Carecen de endomembranas, pero poseen ribosomas y membrana celular","Poseen núcleo sin nucleolo y carecen de sistema de endomembranas","Poseen mitocondrias, pero carecen de núcleo rodeado de membrana","Carecen de ribosomas y de membrana celular, pero tienen pared"],"correcta":0,"explicacion":"Las procariotas se definen por la ausencia de sistema de endomembranas, por lo que no tienen compartimentos ni núcleo. El esquema muestra que comparten con las eucariotas la membrana celular y los ribosomas.","por_opcion":["✅ Les faltan las endomembranas, no las membranas en general ni los ribosomas.","❌ No tienen núcleo, sino un nucleoide sin envoltura.","❌ Las mitocondrias son orgánulos de eucariotas.","❌ Ribosomas y membrana celular están presentes en ambos tipos celulares."]},{"pregunta":"En el sistema de Woese, ¿qué representa Archaea?","opciones":["Un grupo de agentes acelulares próximo a los viroides","Uno de los cinco reinos definidos por criterios morfológicos","Un dominio procariota distinto de Bacteria, definido por el rRNA","Un reino eucariota primitivo derivado de los protistas"],"correcta":2,"explicacion":"Woese establece tres dominios a partir de la secuenciación del rRNA: Bacteria y Archaea (procariotas) y Eukarya (eucariotas). Archaea es procariota pero constituye un dominio independiente de Bacteria.","por_opcion":["❌ Archaea está formado por organismos celulares, no por agentes acelulares.","❌ Los reinos son de Whittaker, y Archaea no figura entre ellos.","✅ Es un dominio procariota diferenciado de Bacteria por análisis molecular del rRNA.","❌ Archaea es procariota, no eucariota, y no deriva de protistas."]},{"pregunta":"¿Cuál de los siguientes grupos NO forma parte de los cinco reinos de Whittaker?","opciones":["Archaea","Protistas","Hongos","Moneras"],"correcta":0,"explicacion":"Whittaker agrupa a los seres vivos en moneras, protistas, hongos, plantas y animales. Archaea es un dominio del sistema posterior de Woese, basado en la secuenciación del rRNA.","por_opcion":["✅ Archaea pertenece a la clasificación en tres dominios de Woese.","❌ Protistas es un reino de Whittaker.","❌ Hongos es un reino de Whittaker.","❌ Moneras es un reino de Whittaker."]},{"pregunta":"¿Qué argumento recoge el temario para no considerar a los virus seres vivos?","opciones":["No son células y, aunque se reproducen, no tienen metabolismo ni desarrollo","Tienen metabolismo propio, pero carecen de ribosomas y de membrana","No se reproducen, aunque sí tienen metabolismo y estructura celular","Son células sin núcleo que dependen del huésped para obtener energía"],"correcta":0,"explicacion":"Los virus no son células y carecen de estructura celular. Son paquetes de material genético que solo se multiplican dentro de células ajenas. Aunque se reproducen, no tienen metabolismo propio, ni desarrollo, ni se relacionan con el medio.","por_opcion":["✅ Resume los argumentos del temario: acelular, sin metabolismo ni desarrollo, pese a reproducirse.","❌ El temario es explícito: los virus no tienen metabolismo propio.","❌ Los virus sí se reproducen (dentro del huésped) y no tienen metabolismo ni estructura celular.","❌ Eso describe una procariota; los virus no son células."]},{"pregunta":"Un agente infeccioso formado exclusivamente por una pequeña molécula de ARN, sin proteínas asociadas, corresponde a:","opciones":["Un bacteriófago","Un viroide","Un adenovirus","Un prión"],"correcta":1,"explicacion":"El temario define los viroides como pequeñas moléculas de ARN sin proteínas asociadas capaces de causar enfermedad. Los priones, en cambio, son proteínas estructurales sin ácido nucleico.","por_opcion":["❌ El bacteriófago es un virus con estructura proteica que envuelve su material genético.","✅ ARN sin proteínas asociadas es la definición de viroide.","❌ El adenovirus es un virus con cubierta proteica, no ARN desnudo.","❌ El prión es justo lo contrario: proteína estructural sin ácido nucleico."]}],"asignatura":"Biología celular y tisular","tema":1,"fecha":"2026-11-04","resumen":["La **célula** es la **unidad de origen, estructural y funcional** de todo ser vivo. La teoría celular tiene 4 postulados en el orden del temario: 1º todo organismo está formado por células, 2º toda célula proviene de otra, **3º gametos y esporas son células** y **4º la célula es la unidad funcional**.","La materia viva es **diferente de lo muerto por sus funciones** y **diferente de lo inerte por su estructura jerárquica**. Sus funciones son la **autoconservación** (incluye el *metabolismo*), la **autorregulación** (**homeostasis**: su pérdida causa enfermedad y su acumulación, muerte) y la **autorreproducción** (rejuvenecimiento, desarrollo y adaptación).","**Oparin (1923)** propuso que la vida surgió en una Tierra con **muy poco oxígeno** (H2, NH3, N2, CH4, H2O) según la secuencia energía → grupos funcionales → caldo nutritivo → biomoléculas → **coacervados** → células. La primera célula se formó por el recubrimiento de un **ARN autorreplicante**.","Lo que distingue a eucariotas de procariotas es el **sistema de endomembranas**: las procariotas (**1-10 µm**, nucleoide, bipartición) carecen de él y las eucariotas (**10-100 µm**, núcleo, mitosis y meiosis) lo tienen; ambas comparten membrana, ribosomas y citoplasma. **Whittaker** clasificó la vida en **5 reinos** y **Woese**, en **3 dominios** (Bacteria, Archaea, Eukarya) según el **rRNA**.","Los **virus** son **parásitos intracelulares obligados acelulares, sin metabolismo propio**, y el temario no los considera seres vivos. Los **priones** son **solo proteína** y los **viroides** son **solo ARN**, y ambos pueden causar enfermedad."],"preguntate":[{"pregunta":"Define *ser vivo* según el temario e indica las capacidades que incluye la definición.","respuesta":"Es un **organismo autónomo** capaz de **proporcionarse alimento**, **interaccionar con el ambiente** y **reproducirse**. Puede ser unicelular (una bacteria) o pluricelular (plantas, animales, ser humano)."},{"pregunta":"¿Qué diferencia hay entre la terna que define a la célula en los conceptos básicos y la terna del concepto actual de la teoría celular?","respuesta":"En los conceptos básicos, la célula es unidad **anatómico-estructural, funcional y de replicación**. En el concepto actual de la teoría celular, es unidad **de origen, estructural y funcional**."},{"pregunta":"¿En qué se diferencia la materia viva de la materia inerte?","respuesta":"Se diferencia en su **estructura**. La materia viva está organizada en niveles jerárquicos (biomoléculas → orgánulos → células → tejidos → órganos → sistemas → organismos) y la materia inerte carece de esa organización."},{"pregunta":"Explica cómo se formó la primera célula según el temario y qué cifra temporal da el texto.","respuesta":"Se formó por el **recubrimiento de una molécula de ARN capaz de autorreplicarse**, no de ADN. El temario la sitúa hace **3.800 \"billones\"** de años, un calco del inglés que en español equivale a 3.800 millones."},{"pregunta":"¿Qué estructuras comparten las células procariotas y eucariotas?","respuesta":"Ambas tienen **membrana celular, ribosomas y citoplasma**. A las procariotas les faltan las **endomembranas**, no las membranas en general."},{"pregunta":"Compara los criterios de clasificación de Whittaker y de Woese.","respuesta":"Whittaker agrupa a los seres vivos en **5 reinos** según rasgos **estructurales y de organización**. Woese usa un criterio **molecular**, la secuenciación del **rRNA**, y establece **3 dominios** derivados de un ancestro común universal."},{"pregunta":"¿Qué significa que un virus sea un *parásito intracelular obligado*?","respuesta":"Significa que **carece de los constituyentes necesarios para crecer y multiplicarse**, como ribosomas o sistemas enzimáticos. Por eso necesita usar la **maquinaria sintética de la célula huésped**."},{"pregunta":"Un paciente con gripe pregunta por qué no le recetan antibióticos. ¿Cómo lo explicas a partir de la biología del virus?","respuesta":"Los virus **no tienen metabolismo ni ribosomas propios**, sino que usan los de la célula huésped. Por eso los antibióticos, que actúan sobre estructuras bacterianas, **no les afectan**."},{"pregunta":"¿Qué son los priones y por qué son relevantes para la higiene del material en la clínica de fisioterapia?","respuesta":"Son **proteínas estructurales sin ácido nucleico** capaces de causar enfermedad, como la de **Creutzfeldt-Jakob**. Además, **resisten los métodos de esterilización habituales**, lo que hay que tener en cuenta con el material compartido."},{"pregunta":"Relaciona el binomio homeostasis-enfermedad y la capacidad de adaptación con el ejercicio terapéutico.","respuesta":"La lesión supone una **pérdida de regulación**, y el tratamiento busca **restaurar el equilibrio (homeostasis)**. El ejercicio terapéutico aprovecha la **capacidad de adaptación** mediante estímulos dosificados que el organismo integra para recuperar su función."}]}</script>

<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips">${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
