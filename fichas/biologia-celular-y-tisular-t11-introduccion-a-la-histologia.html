<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Introducción a la Histología · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Introducción a la Histología","subtitulo":"De la célula al sistema: qué estudia la histología, qué es un tejido, cuáles son los cuatro tejidos básicos y por qué la estructura celular refleja su función.","resumen":["La **histología** (del griego *histo*, tejido, y *logos*, ciencia) estudia la **anatomía microscópica de células y tejidos** y sienta las bases de la **histopatología**, el estudio del tejido alterado.","La **célula** es la unidad básica del ser vivo; la eucariota tiene **núcleo, citoplasma y orgánulos**, y los distintos tipos celulares se diferencian porque **expresan conjuntos de genes distintos**, lo que les da una composición molecular y una función diferentes.","Un **tejido** es un conjunto de células con **especialización similar** y **origen embriológico similar**, junto con la **matriz extracelular** que las rodea, que funcionan de forma colectiva; p. ej. el epitelio gástrico reúne células **mucosas (moco)**, **parietales (HCl)** y **zimógenas (enzimas)**.","Hay **cuatro tejidos básicos**: **epitelial** (cubre superficies, reviste cavidades y conductos y forma glándulas), **conjuntivo** (protege y sustenta a los otros tres), **muscular** (células contráctiles, movimiento) y **nervioso** (recibe, transmite e integra información).","Un **órgano** está formado por **al menos dos clases de tejidos** con forma y función definidas, un **sistema** es la asociación de **al menos dos órganos** con una función común (hay **11 sistemas**), y en todos los niveles **la estructura celular ha evolucionado para cumplir su función**."],"objetivos":["Al terminar, sabrás definir histología, su etimología y sus tres objetivos.","Al terminar, sabrás explicar por qué existen distintos tipos celulares en un mismo organismo.","Al terminar, sabrás definir tejido, órgano y sistema con sus criterios mínimos.","Al terminar, sabrás describir la función de los cuatro tejidos básicos y reconocer ejemplos.","Al terminar, sabrás relacionar estructuras celulares (cilios, flagelos, citoesqueleto, uniones) con la función de la célula."],"ideas_clave":["Histología = estudio de la **anatomía microscópica** de células y tejidos (*histo* = tejido, *logos* = ciencia).","Objetivos: entender las **estructuras tisulares**, su **relación con la función** y establecer las bases de la **histopatología**.","La célula eucariota: **núcleo + citoplasma + orgánulos**.","Células distintas porque **expresan distintos conjuntos de genes** → distinta composición molecular → distinta función.","Tejido = células con **especialización y origen embriológico similares** + **matriz extracelular**, que funcionan colectivamente.","Cuatro tejidos básicos: **epitelial, conjuntivo, muscular y nervioso**; el conjuntivo **sustenta a los otros tres**.","Órgano: **≥ 2 clases de tejidos**; sistema: **≥ 2 órganos**; el cuerpo humano tiene **11 sistemas**.","La **estructura y morfología** de la célula presuponen una evolución para cumplir **más eficazmente** su función."],"secciones":[{"id":"concepto-histologia","titulo":"Concepto y objetivos de la histología","bloques":[{"tipo":"definicion","termino":"Histología","texto":"Ciencia que estudia la **anatomía microscópica** de las células y los tejidos. Procede de las palabras griegas *histo* (tejido) y *logos* (ciencia, «-logía»)."},{"tipo":"lista","items":["**Objetivo 1:** entender las estructuras tisulares.","**Objetivo 2:** entender la relación entre las estructuras tisulares y su función.","**Objetivo 3:** establecer las bases para la **histopatología**."]},{"tipo":"definicion","termino":"Histopatología","texto":"Estudio del **tejido alterado**, con estructuras y funciones defectuosas."},{"tipo":"alerta","texto":"La histología estudia la anatomía **microscópica**, no la macroscópica; y la histopatología no es un objetivo «aparte», sino aquello para lo que la histología **establece las bases**."},{"tipo":"perla","texto":"Para el fisioterapeuta, conocer la histología normal es la base para entender lesiones de tendón, músculo o cartílago: el tejido alterado (histopatología) explica los plazos de reparación y la carga que tolera cada estructura **(complemento)**."}]},{"id":"celula","titulo":"La célula: unidad básica","bloques":[{"tipo":"parrafo","texto":"La **célula** es la **unidad básica del ser vivo**. La **célula eucariota** está formada por **núcleo**, **citoplasma** y **orgánulos**. Los organismos pluricelulares contienen **diferentes tipos de células**: son distintas porque cada una **expresa un determinado conjunto de genes**, y su distinta funcionalidad se debe a una **distinta composición molecular**."},{"tipo":"alerta","texto":"Todas las células de un individuo comparten el mismo genoma: lo que las diferencia **no son genes distintos**, sino **qué conjunto de genes expresa** cada una. Es una trampa clásica de redacción."},{"tipo":"figura","pagina":4,"pie":"Izquierda: célula eucariota con núcleo, citoplasma y orgánulos. Derecha: diferenciación a partir de células madre — la mesenquimal indiferenciada da condroblasto/condrocito, adipocito, fibroblasto, célula muscular, célula endotelial y osteoblasto/osteocito; la hematopoyética da la línea mieloide (eritrocito, plaquetas, neutrófilo, eosinófilo, basófilo, monocito → macrófago) y la linfoide (linfocitos B y T, célula NK).","src":"img/biologia-celular-y-tisular-t11-introduccion-a-la-histologia-p4.jpg"},{"tipo":"esquema","titulo":"Diferenciación celular (lámina del tema)","mermaid":"flowchart TD\n  M[\"Célula mesenquimal indiferenciada\"] --> M1[\"Fibroblasto\"]\n  M --> M2[\"Adipocito\"]\n  M --> M3[\"Condrocito\"]\n  M --> M4[\"Osteoblasto y osteocito\"]\n  M --> M5[\"Célula muscular y endotelial\"]\n  M --> H[\"Célula madre hematopoyética\"]\n  H --> H1[\"Célula madre mieloide\"]\n  H --> H2[\"Célula madre linfoide\"]\n  H1 --> H3[\"Eritrocito, plaquetas, granulocitos, monocito\"]\n  H2 --> H4[\"Linfocitos B, T y célula NK\"]","pie":"Mismo genoma, distinta expresión génica: así surgen tipos celulares con funciones diferentes."},{"tipo":"dato","valor":"3 componentes","texto":"La célula eucariota según el tema: núcleo, citoplasma y orgánulos."}]},{"id":"tejido","titulo":"El tejido","bloques":[{"tipo":"definicion","termino":"Tejido","texto":"Conjunto de **células con una especialización similar** y la **matriz extracelular** que las rodea, que **funcionan de forma colectiva** para realizar una función específica. Son células con un **origen embriológico similar**."},{"tipo":"parrafo","texto":"Dentro de un tejido, **cada célula tiene una función determinada**. El ejemplo del tema es el **epitelio que recubre el estómago**, en el que conviven tres tipos celulares con productos distintos."},{"tipo":"tabla","titulo":"Células del epitelio gástrico","columnas":["Célula","Producto","Función del producto"],"filas":[["Mucosa","**Moco**","Sustancia lubricante"],["Parietal","**Ácido clorhídrico (HCl)**","Acidifica el contenido gástrico"],["Zimógena","**Enzimas**","Digestión"]]},{"tipo":"figura","pagina":5,"pie":"Glándula gástrica: de la superficie al fondo se distribuyen células mucosas, parietales y zimógenas; a la derecha, las tres células aisladas con su morfología propia.","src":"img/biologia-celular-y-tisular-t11-introduccion-a-la-histologia-p5.jpg"},{"tipo":"alerta","texto":"La definición de tejido incluye **dos componentes**: las **células** y la **matriz extracelular**. Una opción que hable solo de «células similares» está incompleta. Y que las células tengan especialización similar no impide que cada una tenga **su propia función** (mucosa, parietal, zimógena)."}]},{"id":"cuatro-tejidos","titulo":"Los cuatro tejidos básicos","bloques":[{"tipo":"parrafo","texto":"Considerando su **función y su estructura**, los tejidos se clasifican en **cuatro tipos principales**."},{"tipo":"tarjetas","items":[{"etiqueta":"Epitelial","titulo":"Cubre y reviste","texto":"Cubre la **superficie del organismo**, **reviste cavidades y conductos** corporales y **forma las glándulas**."},{"etiqueta":"Conjuntivo","titulo":"Protege y sustenta","texto":"Protege y sustenta a los **otros tres tejidos básicos**, tanto **estructural como funcionalmente**."},{"etiqueta":"Muscular","titulo":"Contrae","texto":"Formado por **células contráctiles** responsables del **movimiento**."},{"etiqueta":"Nervioso","titulo":"Integra","texto":"**Recibe, transmite e integra** información del medio externo e interno para **controlar las actividades** del organismo."}]},{"tipo":"figura","pagina":6,"pie":"Imágenes microscópicas de los cuatro tejidos básicos: conjuntivo (fibras), epitelial (glándulas), muscular (células contráctiles) y nervioso (neurona con sus prolongaciones).","src":"img/biologia-celular-y-tisular-t11-introduccion-a-la-histologia-p6.jpg"},{"tipo":"esquema","titulo":"Clasificación de los tejidos básicos","mermaid":"flowchart TD\n  T[\"Tejidos básicos: según función y estructura\"] --> E[\"Epitelial\"]\n  T --> C[\"Conjuntivo\"]\n  T --> MU[\"Muscular\"]\n  T --> N[\"Nervioso\"]\n  E --> E1[\"Cubre superficies, reviste cavidades, forma glándulas\"]\n  C --> C1[\"Protege y sustenta a los otros tres\"]\n  MU --> MU1[\"Células contráctiles: movimiento\"]\n  N --> N1[\"Recibe, transmite e integra información\"]","pie":"Los cuatro tejidos y su función principal según el tema."},{"tipo":"alerta","texto":"Las **glándulas** las forma el tejido **epitelial**, no el conjuntivo. Y el tejido que **sustenta a los otros tres** es el **conjuntivo**: dos asociaciones muy preguntadas."},{"tipo":"perla","texto":"En fisioterapia trabajas sobre los cuatro: piel (epitelial), fascia, tendón y ligamento (conjuntivo), músculo (muscular) y nervio periférico (nervioso). Por eso una técnica manual nunca actúa sobre un único tejido **(complemento)**."}]},{"id":"organo-sistema","titulo":"Órganos y sistemas: niveles de organización","bloques":[{"tipo":"definicion","termino":"Órgano","texto":"Estructura formada por **al menos dos clases diferentes de tejidos**, con una **forma y una función definidas**. Ejemplos: pulmones, hígado, corazón, ojos, piel."},{"tipo":"figura","pagina":7,"pie":"El estómago como órgano: su pared superpone capas de distintos tejidos — mucosa, submucosa, capas musculares y serosa — y se relaciona con esófago, píloro y duodeno; se ven también el fundus y los pliegues (rugae).","src":"img/biologia-celular-y-tisular-t11-introduccion-a-la-histologia-p7.jpg"},{"tipo":"tabla","titulo":"Capas de la pared gástrica (figura del tema)","columnas":["Capa","Posición"],"filas":[["Mucosa","La más interna, en contacto con la luz (contiene el epitelio gástrico)"],["Submucosa","Por debajo de la mucosa"],["Capas musculares","Intermedias"],["Serosa","La más externa"]]},{"tipo":"definicion","termino":"Sistema","texto":"Asociación de órganos (**como mínimo dos**) que trabajan juntos para realizar una **función común**."},{"tipo":"tabla","titulo":"Los 11 sistemas del cuerpo humano","columnas":["N.º","Sistema","N.º","Sistema"],"filas":[["1","Tegumentario","7","Endocrino"],["2","Esquelético","8","Respiratorio"],["3","Muscular","9","Digestivo"],["4","Cardiovascular","10","Urinario"],["5","Linfático","11","Reproductivo"],["6","Nervioso","—","—"]]},{"tipo":"dato","valor":"≥ 2 · ≥ 2 · 11","texto":"Un órgano tiene al menos 2 clases de tejidos; un sistema, al menos 2 órganos; el cuerpo humano tiene 11 sistemas."},{"tipo":"esquema","titulo":"Niveles de organización","mermaid":"flowchart LR\n  A[\"Célula\"] -->|\"misma especialización + matriz extracelular\"| B[\"Tejido\"]\n  B -->|\"al menos 2 clases de tejidos\"| C[\"Órgano\"]\n  C -->|\"al menos 2 órganos, función común\"| D[\"Sistema\"]\n  D -->|\"11 sistemas\"| E[\"Organismo pluricelular\"]","pie":"Cada nivel se define por el criterio mínimo que el tema indica."},{"tipo":"alerta","texto":"No confundas los mínimos: **órgano = al menos 2 clases de TEJIDOS**; **sistema = al menos 2 ÓRGANOS**. La piel, con epitelio y conjuntivo, ya es un **órgano** (del sistema tegumentario)."}]},{"id":"estructura-funcion","titulo":"Relación entre estructura y función celular","bloques":[{"tipo":"parrafo","texto":"La **estructura y morfología** de una célula presuponen una **evolución** con el fin de cumplir de forma **más eficaz** la función que realiza. La lámina del tema lo ilustra con el interior de la célula y tres especializaciones."},{"tipo":"figura","pagina":9,"pie":"Interior celular: membrana plasmática, retículo endoplásmico, ribosomas, mitocondria y citoesqueleto (microtúbulos y microtrabéculas). Flechas hacia tres especializaciones: uniones intercelulares (cinturón de adhesión) sobre la membrana basal, cilios y flagelo.","src":"img/biologia-celular-y-tisular-t11-introduccion-a-la-histologia-p9.jpg"},{"tipo":"tabla","titulo":"Estructuras de la lámina y su función","columnas":["Estructura","Función"],"filas":[["Citoesqueleto (microtúbulos, microtrabéculas)","Forma, soporte y movimiento interno de la célula **(complemento)**"],["Cinturón de adhesión y membrana basal","Unión entre células epiteliales y anclaje al tejido subyacente **(complemento)**"],["Cilios","Mueven el contenido sobre la superficie celular, p. ej. el moco en las vías respiratorias **(complemento)**"],["Flagelo","Desplazamiento de la propia célula, p. ej. el espermatozoide **(complemento)**"],["Mitocondria","Producción de energía **(complemento)**"]]},{"tipo":"dato","valor":"Estructura ↔ función","texto":"Principio del tema: la forma de la célula es el resultado evolutivo de la función que debe cumplir con la máxima eficacia."},{"tipo":"parrafo","texto":"Este principio enlaza con el **objetivo 2** de la histología (relación estructura-función) y con el ejemplo del estómago: la célula mucosa, la parietal y la zimógena tienen **morfologías distintas** porque fabrican productos distintos."}]}],"caso_clinico":{"titulo":"Explicar una biopsia de tendón a un paciente","presentacion":"Un corredor de 38 años con tendinopatía aquílea crónica trae el informe de una biopsia que habla de «alteración del tejido conjuntivo con desorganización de la matriz extracelular». Pregunta al fisioterapeuta qué significa y por qué su tendón «no es solo un músculo». Usa los conceptos del tema para razonar.","preguntas":[{"pregunta":"¿Qué disciplina estudia lo que describe el informe y qué relación tiene con la histología?","respuesta":"Es **histopatología**: el estudio del tejido alterado con estructuras y funciones defectuosas. La histología, que estudia la anatomía microscópica de células y tejidos normales, establece precisamente las **bases** para la histopatología."},{"pregunta":"¿A qué tejido básico pertenece el tendón y por qué el informe menciona la matriz extracelular?","respuesta":"Al tejido **conjuntivo**, que protege y sustenta a los demás tejidos de forma estructural y funcional. La definición de tejido incluye las células **y la matriz extracelular** que las rodea; si la matriz se desorganiza, el tejido pierde su función colectiva."},{"pregunta":"¿Por qué el tendón y el músculo son tejidos distintos aunque formen una unidad funcional?","respuesta":"Porque sus células tienen **especializaciones distintas**: el músculo está formado por células **contráctiles** responsables del movimiento, mientras el conjuntivo sostiene. Cada tipo celular expresa un conjunto distinto de genes y tiene una composición molecular diferente; la unidad músculo-tendón combina al menos dos clases de tejidos, como ocurre en un órgano."}]},"preguntate":[{"pregunta":"Define histología y explica su etimología.","respuesta":"Ciencia que estudia la anatomía microscópica de células y tejidos; del griego histo (tejido) y logos (ciencia)."},{"pregunta":"¿Cuáles son los tres objetivos de la histología?","respuesta":"Entender las estructuras tisulares, entender su relación con la función y establecer las bases de la histopatología."},{"pregunta":"¿Qué es la histopatología?","respuesta":"El estudio del tejido alterado, con estructuras y funciones defectuosas."},{"pregunta":"¿Por qué en un mismo organismo hay células tan distintas?","respuesta":"Porque cada tipo celular expresa un determinado conjunto de genes, lo que le da una composición molecular y una funcionalidad distintas."},{"pregunta":"Define tejido indicando sus dos componentes.","respuesta":"Conjunto de células con especialización y origen embriológico similares y la matriz extracelular que las rodea, que funcionan colectivamente para una función específica."},{"pregunta":"¿Qué producen las células mucosas, parietales y zimógenas del epitelio gástrico?","respuesta":"Moco lubricante, ácido clorhídrico y enzimas, respectivamente."},{"pregunta":"Describe la función de cada uno de los cuatro tejidos básicos.","respuesta":"Epitelial: cubre superficies, reviste cavidades y conductos y forma glándulas. Conjuntivo: protege y sustenta a los otros tres. Muscular: células contráctiles para el movimiento. Nervioso: recibe, transmite e integra información para controlar el organismo."},{"pregunta":"Diferencia órgano y sistema con sus criterios mínimos.","respuesta":"Órgano: al menos dos clases de tejidos con forma y función definidas. Sistema: al menos dos órganos que trabajan juntos con una función común."},{"pregunta":"Enumera los 11 sistemas del cuerpo humano.","respuesta":"Tegumentario, esquelético, muscular, cardiovascular, linfático, nervioso, endocrino, respiratorio, digestivo, urinario y reproductivo."},{"pregunta":"¿Qué relación plantea el tema entre estructura y función celular?","respuesta":"La estructura y morfología de la célula presuponen una evolución para cumplir de forma más eficaz la función que realiza (p. ej. cilios, flagelo, uniones intercelulares)."}],"glosario":[{"termino":"Histología","definicion":"Ciencia que estudia la anatomía microscópica de células y tejidos."},{"termino":"Histopatología","definicion":"Estudio del tejido alterado con estructuras y funciones defectuosas."},{"termino":"Célula eucariota","definicion":"Célula formada por núcleo, citoplasma y orgánulos."},{"termino":"Tejido","definicion":"Células con especialización y origen embriológico similares más su matriz extracelular, con función colectiva."},{"termino":"Matriz extracelular","definicion":"Material que rodea a las células de un tejido y forma parte de su definición."},{"termino":"Célula parietal","definicion":"Célula del epitelio gástrico que produce ácido clorhídrico."},{"termino":"Célula zimógena","definicion":"Célula del epitelio gástrico que produce enzimas."},{"termino":"Tejido conjuntivo","definicion":"Tejido que protege y sustenta estructural y funcionalmente a los otros tres tejidos básicos."},{"termino":"Tejido epitelial","definicion":"Tejido que cubre la superficie del organismo, reviste cavidades y conductos y forma las glándulas."},{"termino":"Órgano","definicion":"Estructura de al menos dos clases de tejidos con forma y función definidas."},{"termino":"Sistema","definicion":"Asociación de al menos dos órganos con una función común."},{"termino":"Célula mesenquimal indiferenciada","definicion":"Célula madre de la que derivan fibroblastos, adipocitos, condrocitos, osteoblastos y otras células (lámina del tema)."}],"fuentes":["Universidad Europea. Biología Celular y Tisular, Tema 11: Introducción a la Histología. Curso 2025-2026 (Cristina Solana Manrique).","Wikipedia (figura del estómago citada en el tema)."],"qcm":[{"pregunta":"Según el tema, ¿cuál de los siguientes NO es uno de los objetivos de la histología?","opciones":["Describir la anatomía macroscópica de órganos y sistemas","Establecer las bases para el estudio del tejido alterado","Entender la relación entre las estructuras tisulares y su función","Entender las estructuras tisulares"],"correcta":0,"explicacion":"La histología estudia la anatomía microscópica de células y tejidos. Sus objetivos son entender las estructuras tisulares, su relación con la función y establecer las bases de la histopatología.","por_opcion":["✅ La histología es microscópica; la anatomía macroscópica no es su objeto.","❌ Es el tercer objetivo: sentar las bases de la histopatología.","❌ Es el segundo objetivo de la histología.","❌ Es el primer objetivo."]},{"pregunta":"¿Qué define con mayor precisión a la histopatología según el tema?","opciones":["El estudio del tejido alterado con estructuras y funciones defectuosas","El estudio de la relación entre estructura y función del tejido sano","El estudio de la anatomía microscópica de células y tejidos sanos","El estudio de la diferenciación de las células madre en tejidos"],"correcta":0,"explicacion":"La histopatología es el estudio del tejido alterado, con estructuras y funciones defectuosas; la histología establece sus bases.","por_opcion":["✅ Definición literal del tema.","❌ Es uno de los objetivos de la histología, no la histopatología.","❌ Es la definición de histología.","❌ La diferenciación celular no define la histopatología."]},{"pregunta":"¿Por qué un fibroblasto y un osteocito del mismo individuo tienen funciones distintas?","opciones":["Porque poseen genomas distintos adquiridos durante el desarrollo","Porque proceden de capas embrionarias sin relación entre sí","Porque cada uno expresa un conjunto distinto de genes","Porque uno es célula eucariota y el otro carece de núcleo"],"correcta":2,"explicacion":"Las células de un organismo pluricelular son distintas porque cada una expresa un determinado conjunto de genes; la distinta funcionalidad se debe a su distinta composición molecular.","por_opcion":["❌ No difieren en el genoma, sino en qué genes expresan.","❌ En la lámina del tema ambos derivan de la célula mesenquimal indiferenciada.","✅ Expresión génica diferencial → composición molecular y función distintas.","❌ Ambas son células eucariotas con núcleo."]},{"pregunta":"Según el tema, ¿cuáles son los componentes de la célula eucariota?","opciones":["Núcleo, matriz extracelular y orgánulos","Citoplasma, nucleoide y ribosomas","Membrana, ribosomas y pared celular","Núcleo, citoplasma y orgánulos"],"correcta":3,"explicacion":"El tema indica que la célula eucariota está formada por núcleo, citoplasma y orgánulos.","por_opcion":["❌ La matriz extracelular rodea a las células del tejido; no es componente de la célula.","❌ El nucleoide es propio de procariotas.","❌ La pared celular no es componente de la célula animal descrita.","✅ Núcleo, citoplasma y orgánulos."]},{"pregunta":"¿Qué definición de tejido es la más completa según el tema?","opciones":["Estructura de al menos dos clases de células con forma definida","Conjunto de células idénticas que realizan exactamente la misma función","Asociación de al menos dos órganos con una función común","Células de especialización similar y su matriz extracelular, con función colectiva"],"correcta":3,"explicacion":"Un tejido es el conjunto de células con especialización similar y la matriz extracelular que las rodea, que funcionan de forma colectiva para una función específica; además comparten origen embriológico similar.","por_opcion":["❌ Se parece a la de órgano (al menos dos clases de tejidos), no de tejido.","❌ Las células no son idénticas: cada una tiene una función determinada.","❌ Es la definición de sistema.","✅ Incluye células, matriz extracelular y función colectiva."]},{"pregunta":"Además de la especialización similar, ¿qué otra característica comparten las células de un tejido según el tema?","opciones":["Un origen embriológico similar","Una localización en el mismo sistema","Un mismo producto de secreción","Una misma morfología celular"],"correcta":0,"explicacion":"El tema señala que las células de un tejido tienen un origen embriológico similar. No comparten necesariamente producto ni morfología, como muestra el epitelio gástrico.","por_opcion":["✅ Origen embriológico similar.","❌ La pertenencia a un sistema no define al tejido.","❌ En el epitelio gástrico cada célula produce algo distinto (moco, HCl, enzimas).","❌ Las células mucosas, parietales y zimógenas tienen morfologías distintas."]},{"pregunta":"En el epitelio gástrico, ¿qué célula produce ácido clorhídrico?","opciones":["La célula mucosa","La célula caliciforme","La célula parietal","La célula zimógena"],"correcta":2,"explicacion":"Según el tema, en el epitelio que recubre el estómago las células mucosas producen moco, las parietales ácido clorhídrico y las zimógenas enzimas.","por_opcion":["❌ La mucosa produce moco lubricante.","❌ La célula caliciforme no aparece en el ejemplo gástrico del tema.","✅ La parietal produce HCl.","❌ La zimógena produce enzimas."]},{"pregunta":"¿Qué ilustra principalmente el ejemplo del epitelio gástrico en el tema?","opciones":["Que dentro de un tejido cada célula tiene una función determinada","Que todas las células de un tejido secretan el mismo producto","Que el tejido epitelial sustenta a los demás tejidos básicos","Que un órgano está formado por al menos dos tipos de tejidos"],"correcta":0,"explicacion":"El tema usa el epitelio gástrico para mostrar que, dentro de un tejido, cada célula tiene una función determinada: mucosas (moco), parietales (HCl) y zimógenas (enzimas).","por_opcion":["✅ Cada célula del tejido tiene su función.","❌ Cada tipo celular produce algo distinto.","❌ Sustentar a los otros tejidos es función del conjuntivo.","❌ Ese concepto se ilustra con la pared del estómago como órgano, no con su epitelio."]},{"pregunta":"¿Qué tejido básico se encarga de formar las glándulas?","opciones":["Muscular","Epitelial","Nervioso","Conjuntivo"],"correcta":1,"explicacion":"El tejido epitelial cubre la superficie del organismo, reviste cavidades y conductos corporales y forma las glándulas.","por_opcion":["❌ El muscular está formado por células contráctiles.","✅ El epitelial forma las glándulas.","❌ El nervioso recibe, transmite e integra información.","❌ El conjuntivo protege y sustenta a los otros tres."]},{"pregunta":"¿Qué tejido protege y sustenta a los otros tres tejidos básicos, tanto estructural como funcionalmente?","opciones":["Tejido conjuntivo","Tejido epitelial","Tejido muscular","Tejido nervioso"],"correcta":0,"explicacion":"El tejido conjuntivo protege y sustenta a los otros tres tejidos básicos, tanto estructural como funcionalmente.","por_opcion":["✅ Es la definición del conjuntivo.","❌ El epitelial cubre, reviste y forma glándulas.","❌ El muscular produce movimiento.","❌ El nervioso controla las actividades integrando información."]},{"pregunta":"¿Con qué criterio clasifica el tema los tejidos en cuatro tipos principales?","opciones":["Según el órgano en que se localizan","Según su función y su estructura","Según el sistema al que pertenecen","Según su origen embriológico exclusivamente"],"correcta":1,"explicacion":"El tema indica que, considerando su función y su estructura, los tejidos se clasifican en cuatro tipos principales: conjuntivo, epitelial, muscular y nervioso.","por_opcion":["❌ Un mismo tejido aparece en muchos órganos.","✅ Función y estructura.","❌ Los sistemas agrupan órganos, no tejidos.","❌ El origen embriológico similar forma parte de la definición de tejido, no del criterio de clasificación."]},{"pregunta":"¿Cuál es el requisito mínimo para considerar una estructura como órgano?","opciones":["Estar formada por al menos tres tipos celulares distintos","Estar formada por al menos dos clases diferentes de tejidos","Estar formada por al menos dos órganos con función común","Estar formada por un único tejido con forma definida"],"correcta":1,"explicacion":"Un órgano es una estructura formada por al menos dos clases diferentes de tejidos, con forma y función definidas.","por_opcion":["❌ El criterio se refiere a clases de tejidos, no a tipos celulares.","✅ Al menos dos clases de tejidos.","❌ Es el requisito de un sistema.","❌ Un único tejido no constituye un órgano."]},{"pregunta":"En la figura del estómago del tema, ¿qué capa de la pared es la más externa?","opciones":["Mucosa","Capa muscular","Serosa","Submucosa"],"correcta":2,"explicacion":"La figura muestra, de dentro hacia fuera, mucosa, submucosa, capas musculares y serosa; la serosa es la má   <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}

  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">

    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}

  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}

  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>

</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');

try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }

ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
