<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 12. Tejido epitelial · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 12. Tejido epitelial","subtitulo":"Células estrechamente unidas, polarizadas y avasculares que revisten superficies, forman glándulas y se renuevan a partir de células madre.","resumen":["El **tejido epitelial** tapiza la superficie del cuerpo, reviste cavidades y forma glándulas; sus células están muy unidas, con **poca sustancia intercelular**, son **polares** y **avasculares**.","Se apoya sobre la **membrana basal = lámina basal + lámina reticular**, que lo separa del tejido conjuntivo del que se nutre por difusión.","Cada célula tiene tres regiones: **apical** (cilios, microvellosidades, estereocilios), **lateral** (uniones estrechas, adherentes y gap) y **basal** (uniones focales, hemidesmosomas, membrana basal).","La clasificación descriptiva combina **número de capas** (simple, estratificado, pseudoestratificado, de transición) y **forma de las células más superficiales** (plano, cúbico, cilíndrico); en los estratificados las células basales son **siempre cúbicas**.","Las glándulas **exocrinas** vierten por un conducto (secreción **merocrina, apocrina u holocrina**) y las **endocrinas** carecen de conducto y vierten hormonas a la sangre por vía **merocrina**; el epitelio se renueva gracias a **células madre adultas en nichos**."],"objetivos":["Definir el tejido epitelial y enumerar sus características generales y sus funciones con un ejemplo de cada una.","Relacionar cada región de la célula polarizada (apical, lateral, basal) con sus especializaciones de superficie.","Clasificar los epitelios según origen embrionario, función, número de capas y morfología, y reconocer ejemplos de localización.","Diferenciar glándulas exocrinas y endocrinas, y clasificar las exocrinas por número de células, estructura, producto y forma de descarga.","Distinguir poblaciones epiteliales en renovación continua y estables, y aplicar estos conceptos a la bronquitis crónica y al acné."],"ideas_clave":["Epitelio = células estrechamente unidas estructural y funcionalmente formando un manto o un tubo, con **muy poca sustancia intercelular**.","**Membrana basal = lámina basal + lámina reticular** (más fibrosa); el epitelio es **avascular** y se nutre del conjuntivo subyacente.","Polaridad: **apical** (cilios, microvellosidades, estereocilios), **lateral** (uniones estrechas, adherentes, gap), **basal** (uniones focales, hemidesmosomas, membrana basal).","Clasificación tradicional: **nº de capas + forma de las células superficiales**; en estratificados las basales son **siempre cúbicas**.","**Pseudoestratificado**: todas las células tocan la membrana basal pero no todas llegan a la superficie (vías respiratorias).","**Urotelio**: 4–5 capas con la vejiga vacía y solo 2–3 con la vejiga llena; células superficiales grandes con **placas**.","Exocrinas: **adenómero + conducto excretor**; descarga **merocrina** (exocitosis), **apocrina** (vesículas rodeadas de membrana) u **holocrina** (toda la célula).","Endocrinas: **sin conductos**, hormonas a la sangre, secreción **merocrina**; productos: polipéptidos, aminas biógenas, esteroides y hormonas tiroideas."],"secciones":[{"id":"caracteristicas-funciones","titulo":"1. Características y funciones generales","bloques":[{"tipo":"definicion","termino":"Tejido epitelial","texto":"Tejido que **tapiza la superficie del cuerpo**, **reviste cavidades corporales** y se encarga de la **formación de glándulas**."},{"tipo":"parrafo","texto":"Sus células están **estrechamente unidas** formando un manto o una estructura tubular. Como apenas queda espacio entre ellas, la **sustancia intercelular es reducida**. Al no llegar los vasos al epitelio (rara vez atraviesan la membrana basal), las células dependen de la **difusión** desde el tejido conjuntivo subyacente, separado por la membrana basal."},{"tipo":"tabla","titulo":"Características generales de las células epiteliales","columnas":["Característica","Qué significa"],"filas":[["Membrana basal","Superficie basal especializada que **separa el epitelio del tejido conjuntivo** subyacente"],["Adhesión","Espacios intercelulares estrechos → **sustancia intercelular reducida**"],["Polaridad morfológica y funcional","Región **apical**, **lateral** y **basal** con estructuras y funciones distintas"],["Avascular","Los vasos sanguíneos **rara vez atraviesan** la membrana basal"]]},{"tipo":"dato","valor":"MB = LB + LR","texto":"**Membrana basal = lámina basal + lámina reticular**; la reticular es la parte más **fibrosa**. Es una capa fina con proteínas especializadas."},{"tipo":"figura","pagina":3,"pie":"Corte histológico: capa de células epiteliales arriba, **lámina basal** como línea fina, y debajo el **tejido conjuntivo** con fibroblastos y vasos. Fíjate en que los vasos quedan por debajo de la lámina basal: el epitelio es avascular.","src":"img/biologia-celular-y-tisular-t12-tema-12-tejido-epitelial-p3.jpg"},{"tipo":"tabla","titulo":"Funciones de los epitelios y ejemplos","columnas":["Función","Ejemplo del temario"],"filas":[["Cobertura, revestimiento y protección del tejido subyacente","Epidermis"],["Absorción","Mucosa intestinal"],["Secreción","Células del parénquima glandular"],["Difusión gaseosa","Epitelio del alveolo respiratorio"],["Filtración de la luz","Córnea y cristalino"],["Recepción sensorial","Mucosa olfatoria y receptores del tacto y del gusto"]]},{"tipo":"alerta","texto":"\"Avascular\" no quiere decir \"sin inervación\". En las características del epitelio glandular el temario cita **avascularidad** e **inervación** a la vez. No los confundas en un verdadero/falso."}]},{"id":"polaridad","titulo":"2. Polaridad y especializaciones de la superficie celular","bloques":[{"tipo":"definicion","termino":"Polaridad","texto":"**Asimetría estructural y funcional** característica de la mayoría de las células epiteliales, que permite distinguir **tres tipos de superficie o regiones**: apical, lateral y basal."},{"tipo":"esquema","titulo":"Regiones de la célula epitelial y sus especializaciones","mermaid":"flowchart TD\n  C[\"Célula epitelial polarizada\"] --> A[\"Región apical\"]\n  C --> L[\"Región lateral\"]\n  C --> B[\"Región basal\"]\n  A --> A1[\"Cilios y flagelos\"]\n  A --> A2[\"Microvellosidades\"]\n  A --> A3[\"Estereocilios\"]\n  L --> L1[\"Uniones estrechas\"]\n  L --> L2[\"Uniones adherentes\"]\n  L --> L3[\"Uniones gap\"]\n  B --> B1[\"Uniones focales\"]\n  B --> B2[\"Hemidesmosomas\"]\n  B --> B3[\"Membrana basal\"]","pie":"Cada región tiene sus especializaciones. Es una pregunta de examen frecuente: ¿a qué región pertenece cada estructura?"},{"tipo":"parrafo","texto":"La **cara apical** está en contacto con la superficie libre (luz o exterior) y la **cara basal** con la membrana basal y el tejido conectivo subyacente. La región lateral reúne las **uniones intercelulares**, que explican la fuerte **adhesión** del epitelio."},{"tipo":"tarjetas","items":[{"etiqueta":"Apical","titulo":"Microvellosidades","texto":"**Pequeñas proyecciones** de la región apical que **aumentan el área de absorción** del tejido (por ejemplo, el intestino)."},{"etiqueta":"Apical","titulo":"Estereocilios","texto":"Proyecciones de **mayor tamaño** con **función mecanosensorial**: oído interno y tracto reproductor masculino."},{"etiqueta":"Apical","titulo":"Cilios","texto":"Proyecciones **aún mayores**, con **movimiento de batida**, que reparten el material a lo largo del epitelio."}]},{"tipo":"alerta","texto":"Orden de tamaño según el temario: **microvellosidades \u003c estereocilios \u003c cilios**. Los estereocilios **no se mueven** como los cilios: su función es **mecanosensorial**. Los hemidesmosomas son **basales** y las uniones gap **laterales**."}]},{"id":"clasificacion-criterios","titulo":"3. Clasificación: origen embrionario, función, capas y forma","bloques":[{"tipo":"parrafo","texto":"Los epitelios se clasifican según **cuatro criterios**: 1) origen embrionario, 2) función, 3) número de capas celulares (estratos) y 4) morfología celular. Tras la fecundación hay **segmentación** (división celular: cigoto → 2, 4 y 8 células → mórula → blastocisto) y después **gastrulación** (diferenciación de las capas embrionarias: ectodermo, mesodermo y endodermo)."},{"tipo":"tabla","titulo":"Origen embrionario de los epitelios","columnas":["Capa germinal","Epitelios que origina"],"filas":[["Ectodermo","Piel, glándulas sudoríparas, glándulas mamarias"],["Mesodermo","Endotelio, mesotelio, revestimiento genitourinario"],["Endodermo","Revestimiento gastrointestinal, revestimiento respiratorio"]]},{"tipo":"alerta","texto":"Trampa clásica: el **endotelio** y el **mesotelio** vienen del **mesodermo**, no del endodermo, aunque el nombre \"endo-\" despiste. Las **glándulas mamarias** son **ectodérmicas**, como la piel."},{"tipo":"tarjetas","items":[{"etiqueta":"Función","titulo":"Epitelio de revestimiento","texto":"Forma una **lámina continua**, de una o varias capas, que recubre superficies corporales."},{"etiqueta":"Función","titulo":"Epitelio glandular","texto":"Participa en la **secreción de moléculas** formando estructuras llamadas **glándulas**."}]},{"tipo":"tabla","titulo":"Según el número de capas y según la morfología","columnas":["Criterio","Tipo","Definición"],"filas":[["Capas","Simple","Una sola capa de células de espesor"],["Capas","Estratificado","**≥ 2 estratos** celulares"],["Capas","Pseudoestratificado","Parece estratificado porque algunas células no alcanzan la superficie libre, pero **todas se apoyan en la membrana basal**"],["Capas","De transición (urotelio)","Morfología específica que **permite su distensión**"],["Forma","Escamoso o aplanado","Ancho = profundidad **>** altura"],["Forma","Cúbico o poligonal","Ancho = profundidad **=** altura"],["Forma","Columnar o cilíndrico","Ancho = profundidad **\u003c** altura"]]},{"tipo":"esquema","titulo":"Clasificación tradicional (descriptiva)","mermaid":"flowchart TD\n  E[\"Epitelios de revestimiento\"] --> S[\"Simple\"]\n  E --> ES[\"Estratificado\"]\n  E --> P[\"Pseudoestratificado\"]\n  E --> T[\"De transición\"]\n  S --> S1[\"Plano\"]\n  S --> S2[\"Cúbico\"]\n  S --> S3[\"Cilíndrico\"]\n  ES --> E1[\"Plano\"]\n  ES --> E2[\"Cúbico\"]\n  ES --> E3[\"Cilíndrico\"]\n  E1 --> Q[\"Queratinizado o no\"]","pie":"Se basa en dos factores: el número de capas celulares y la forma de las células más superficiales."},{"tipo":"figura","pagina":33,"pie":"Esquema de todos los tipos: simples (escamoso, cúbico, cilíndrico), estratificados (plano, plano queratinizado, cúbico, cilíndrico), de transición y pseudoestratificado, todos sobre la lámina basal.","src":"img/biologia-celular-y-tisular-t12-tema-12-tejido-epitelial-p33.jpg"}]},{"id":"epitelio-simple","titulo":"4. Epitelios simples","bloques":[{"tipo":"parrafo","texto":"Los epitelios simples tienen **una sola capa** de células. Permiten la **conexión entre compartimentos** y participan en la **difusión selectiva, la absorción o la secreción**; dan solo una **pequeña protección física**. Su forma depende de la función (suelen ser aplanadas o cilíndricas) y pueden presentar especializaciones como **microvellosidades o cilios**."},{"tipo":"tabla","titulo":"Tipos de epitelio simple","columnas":["Tipo","Rasgos","Ejemplos"],"filas":[["Plano o escamoso (pavimentoso)","Células aplanadas, irregulares, superficie continua (\"escamas de pescado\"); el núcleo sobresale hacia la luz","Endotelios (vasos), mesotelios (cavidades), alveolos pulmonares, capa parietal de los corpúsculos renales; cara interna de la córnea"],["Cúbico","Forma intermedia; en corte perpendicular son cuadradas (poligonales vistas desde la superficie); **núcleo redondo central**; forma pequeños conductos y túbulos","Pequeños conductos colectores renales, glándulas salivales y páncreas; superficie externa del ovario; tiroides; plexos coroideos"],["Cilíndrico","Como las cúbicas pero más altas; **núcleo alargado basal**; puede tener microvellosidades apicales; secreción y absorción","Intestino delgado y grueso (absorción), estómago (secreción), vesícula biliar (absorbe agua y concentra la bilis)"],["Cilíndrico ciliado","Células cilíndricas con **cilios**; **raro en humanos**; mueve sustancias sobre la superficie","Oviducto o trompa de Falopio (con algunas células secretoras no ciliadas)"]]},{"tipo":"alerta","texto":"Fíjate en el **núcleo**: **redondo y central** en el cúbico, **alargado y basal** en el cilíndrico. En el plano es aplanado y en el endotelio se reconoce porque **sobresale hacia la luz** del vaso."},{"tipo":"dato","valor":"Azán","texto":"Con la tinción de **Azán**, la membrana basal del túbulo colector renal aparece como una **línea azul** justo debajo de las células epiteliales."},{"tipo":"perla","texto":"En fisioterapia respiratoria y vascular conviene recordar que el **alveolo** y el **endotelio** son epitelios simples planos: una sola capa muy fina pensada para el **intercambio**, no para resistir el roce. Por eso se lesionan con facilidad y no protegen frente a la abrasión."}]},{"id":"epitelio-estratificado","titulo":"5. Epitelios estratificados, pseudoestratificado y de transición","bloques":[{"tipo":"parrafo","texto":"Los estratificados tienen **dos o más capas**; su función principal es la **protección** y, **por su grosor**, no secretan ni absorben. Tienen **polaridad en el crecimiento**: las células **basales son siempre cúbicas** y se dividen, mientras que el nombre del epitelio depende de la **morfología de las células superficiales**."},{"tipo":"esquema","titulo":"Transición en el estratificado plano","mermaid":"flowchart LR\n  B[\"Basales cúbicas, alta tasa mitótica\"] --> I[\"Poligonales intermedias, varias capas\"]\n  I --> S[\"Escamosas superficiales\"]\n  S -->|\"Exposición a abrasión o desecación\"| K[\"Queratinización: células muertas, anucleadas, con queratina\"]","pie":"Las células nacen en la capa basal, maduran hacia la superficie y se aplanan; en la piel acaban queratinizadas."},{"tipo":"tabla","titulo":"Epitelios estratificados","columnas":["Tipo","Rasgos","Ejemplos"],"filas":[["Plano no queratinizado","Basales cúbicas → poligonales intermedias → escamosas superficiales","Cavidad oral y bucal, esófago y faringe, vagina, canal anal; cérvix uterino"],["Plano queratinizado","Superficiales planas, **muertas, anucleadas y llenas de queratina** → capa superficial resistente **no celular**; barrera contra abrasión, infección y pérdida de agua","Piel (epidermis), piel fina y gruesa"],["Cúbico","Delgado, **2–3 capas** de células cúbicas; poco frecuente; recubrimiento más fuerte que un simple","Conductos de glándulas salivales y sudoríparas"],["Cilíndrico","Parece un cúbico estratificado pero con superficiales cilíndricas o prismáticas; poco habitual","Largos conductos de algunas glándulas; conjuntiva"]]},{"tipo":"dato","valor":"2–3 capas","texto":"El **estratificado cúbico** es delgado: solo **2–3 capas** de células cúbicas (glándulas salivales y sudoríparas)."},{"tipo":"parrafo","texto":"La queratinización puede aparecer en tejidos **normalmente no queratinizados**, como la **cavidad oral**, cuando están expuestos a **abrasión o desecación excesivas**."},{"tipo":"definicion","termino":"Pseudoestratificado cilíndrico ciliado","texto":"Variante del simple cilíndrico: **todas las células están unidas a la membrana basal pero no todas llegan a la superficie**; las que llegan suelen estar **ciliadas** y los núcleos aparecen a distintas alturas, cerca de la membrana basal. Recubre las **grandes vías respiratorias**: en el bronquio los cilios desplazan el moco que atrapa partículas **hacia la faringe**."},{"tipo":"perla","texto":"**Bronquitis crónica** (fumadores): aumentan mucho las **células caliciformes** → más moco; a la vez el tabaco reduce los cilios (**metaplasia escamosa**) → menos aclaramiento del moco → **obstrucción** de las vías aéreas. Es la base fisiopatológica de las técnicas de **drenaje bronquial** y de aclaramiento mucociliar en fisioterapia respiratoria."},{"tipo":"definicion","termino":"Epitelio de transición o urotelio","texto":"Epitelio estratificado que recubre el **tracto urinario** (vejiga, uréteres, cálices renales), con características **intermedias entre el estratificado cúbico y el estratificado escamoso**. Las células superficiales son **grandes y de tinción débil**, con la **membrana superficial engrosada y densamente teñida (placas)** y **núcleos grandes y redondos** (incluso binucleadas)."},{"tipo":"dato","valor":"4–5 → 2–3 capas","texto":"Con la vejiga **vacía (contraída)** el urotelio parece tener **4–5 capas**; con la vejiga **llena**, solo **2–3**, con las células intermedias y superficiales muy aplanadas."},{"tipo":"figura","pagina":31,"pie":"Urotelio: célula superficial, célula basal y **placas**. A la derecha, comparación entre la vejiga **vacía** (células altas, más capas) y la vejiga **repleta** de orina (células aplanadas, menos capas).","src":"img/biologia-celular-y-tisular-t12-tema-12-tejido-epitelial-p31.jpg"},{"tipo":"alerta","texto":"No confundas pseudoestratificado y estratificado: en el **pseudoestratificado todas las células tocan la membrana basal** (es en realidad una sola capa). En el **estratificado** solo la capa basal está en contacto con ella."}]},{"id":"glandular","titulo":"6. Epitelio de secreción y glandular","bloques":[{"tipo":"definicion","termino":"Glándula","texto":"**Una célula o un grupo de células** especializadas en la **secreción de moléculas**."},{"tipo":"lista","items":["**Adhesión**: células muy unidas por uniones celulares, con muy poco fluido extracelular entre ellas.","Presentan **polaridad** y **renovación**.","Tienen **membrana basal**, que proporciona anclaje a los tejidos epiteliales.","Aparecen **células mioepiteliales** por debajo de las células epiteliales.","**Avascularidad** e **inervación**."]},{"tipo":"parrafo","texto":"Las glándulas nacen por **proliferación de células del epitelio** y su crecimiento hacia el tejido conjuntivo subyacente. Si se **mantiene el conducto** que las une a la superficie se forma una glándula **exocrina** (conducto + porción secretora); si las **células del conducto desaparecen**, el cúmulo queda rodeado de **capilares** y se forma una glándula **endocrina**."},{"tipo":"figura","pagina":36,"pie":"Formación de las glándulas a partir del epitelio: a la izquierda la exocrina conserva conducto y porción secretora; a la derecha, en la endocrina desaparece el conducto y la porción secretora queda junto a los capilares.","src":"img/biologia-celular-y-tisular-t12-tema-12-tejido-epitelial-p36.jpg"},{"tipo":"tarjetas","items":[{"etiqueta":"Exocrinas","titulo":"Con conducto","texto":"Liberan su producto **dentro de un conducto** hacia la superficie epitelial, externa o interna, de la que se originan."},{"etiqueta":"Endocrinas","titulo":"Sin conducto","texto":"Liberan su secreción al **tejido conjuntivo, a los vasos sanguíneos o linfáticos**. Incluyen la señalización **endocrina, paracrina y autocrina**."}]},{"tipo":"tabla","titulo":"Partes de una glándula exocrina","columnas":["Zona","Características"],"filas":[["Zona secretora (adenómero)","Células secretoras recubiertas por **membrana basal**; algunas glándulas están rodeadas por **células contráctiles**"],["Zona ductal (conducto excretor)","Transporta la secreción **fuera de la glándula**"]]}]},{"id":"clasificacion-glandulas","titulo":"7. Clasificación de las glándulas exocrinas y endocrinas","bloques":[{"tipo":"esquema","titulo":"Criterios para clasificar las glándulas exocrinas","mermaid":"flowchart TD\n  G[\"Glándula exocrina\"] --> N[\"Nº de células\"]\n  G --> E[\"Estructura\"]\n  G --> P[\"Producto secretado\"]\n  G --> D[\"Forma de descarga\"]\n  N --> N1[\"Unicelular o multicelular\"]\n  E --> E1[\"Conducto: simple, ramificada, compuesta\"]\n  E --> E2[\"Zona secretora: tubular, acinar o alveolar, mixta\"]\n  P --> P1[\"Mucosa, serosa, seromucosa, otras\"]\n  D --> D1[\"Merocrina, apocrina, holocrina\"]","pie":"Cuatro criterios independientes: una misma glándula se describe con todos ellos."},{"tipo":"tabla","titulo":"Clasificación según número de células y estructura","columnas":["Criterio","Tipo","Definición / ejemplo"],"filas":[["Nº de células","Unicelulares","Células individuales entre células no secretoras: **células caliciformes**"],["Nº de células","Multicelulares","> 1 célula, de complejidad variable"],["Conducto","Simple","1 adenómero + 1 conducto secretor **no ramificado**"],["Conducto","Ramificada","≥ 1 zonas secretoras + 1 conducto secretor"],["Conducto","Compuesta","≥ 1 zonas secretoras + **conducto secretor ramificado**"],["Zona secretora","Tubular","Porción secretora en forma de tubo"],["Zona secretora","Acinar / alveolar","Acinar: esférica; alveolar: esférica con **luz más amplia**"],["Zona secretora","Túbulo-acinar o mixta","Acinos ramificados en una zona tubular recta"]]},{"tipo":"figura","pagina":41,"pie":"Células caliciformes (glándulas unicelulares) y esquema de las glándulas multicelulares: tubular simple (glándulas intestinales), tubular simple ramificada (gástricas), alveolar simple ramificada (sebáceas), tubular compuesta (Brunner), alveolar compuesta (mamaria) y tubuloalveolar compuesta (salivales).","src":"img/biologia-celular-y-tisular-t12-tema-12-tejido-epitelial-p41.jpg"},{"tipo":"tabla","titulo":"Según el producto y la forma de descarga","columnas":["Tipo","Descripción"],"filas":[["Mucosa","Secreciones **densas** de glicoproteínas muy glicosiladas y proteoglicanos (mucinas de la glándula **sublingual**)"],["Serosa","Secreciones **acuosas**, poco densas, con proteínas y glicoproteínas (**enzimas**); p. ej. acino seroso de la parótida"],["Seromucosa","Secreciones **mixtas** de densidad intermedia"],["Otras","Glándula mamaria, glándula sebácea…"],["Merocrina","Liberación por **exocitosis**: la célula queda intacta"],["Apocrina","Liberación de **vesículas íntegras rodeadas de membrana** con el producto (pellizcamiento de una porción de la célula)"],["Holocrina","Se libera **todo el contenido de la célula secretora**: la célula se desintegra y la sustituye una nueva"]]},{"tipo":"perla","texto":"**Acné**: las glándulas **holocrinas** (sebáceas) son las estructuras primarias implicadas. En la pubertad, la **testosterona** induce en ambos sexos una secreción holocrina excesiva de **sebo y queratina** que bloquea los conductos; la bacteria comensal *Propionibacterium acnes* en el conducto bloqueado provoca la inflamación."},{"tipo":"parrafo","texto":"Las **glándulas endocrinas** no tienen conductos: el producto **difunde directamente de la célula al torrente sanguíneo**. Se clasifican según el producto de secreción en **polipéptidos, aminas biógenas, hormonas esteroideas y hormonas tiroideas** (ejemplo histológico: folículos tiroideos)."},{"tipo":"tabla","titulo":"Exocrina frente a endocrina (ideas clave)","columnas":["Rasgo","Exocrina","Endocrina"],"filas":[["Transporte de la secreción","Conducto secretor","Torrente sanguíneo"],["Nº de células","Uni- o multicelular","Uni- o multicelular"],["Producto","Proteínas, glicoproteínas o mezclas con lípidos","Hormonas"],["Forma de secreción","Merocrina, apocrina u holocrina","**Merocrina**"]]},{"tipo":"alerta","texto":"Las endocrinas también pueden ser **unicelulares** (igual que las exocrinas). Y su forma de secreción es **solo merocrina**: si una opción dice \"endocrina holocrina\" o \"apocrina\", es falsa."}]},{"id":"renovacion","titulo":"8. Renovación del epitelio","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"a","titulo":"Renovación continua","texto":"Por ejemplo el **epitelio del intestino delgado**. La tasa de renovación varía según el epitelio y depende de **células madre adultas localizadas en nichos** (en la cripta intestinal, junto a las células de Paneth); las células migran por la vellosidad y se descaman en la punta."},{"etiqueta":"b","titulo":"Poblaciones estables","texto":"Por ejemplo el **hígado**: poblaciones celulares que no se renuevan de forma continua."}]},{"tipo":"esquema","titulo":"Renovación del epitelio intestinal","mermaid":"flowchart LR\n  M[\"Células madre en el nicho de la cripta\"] --> T[\"Compartimento de amplificación\"]\n  T --> V[\"Enterocitos y caliciformes en la vellosidad\"]\n  V --> D[\"Descamación en la punta\"]","pie":"Flujo continuo desde la cripta hasta la punta de la vellosidad."},{"tipo":"perla","texto":"La gran capacidad de renovación de los epitelios explica que una **erosión superficial de la piel** cicatrice bien sin secuelas si la capa basal (con alta tasa mitótica) se conserva: tenlo en cuenta al valorar heridas y zonas de roce por ortesis o vendajes."}]}],"caso_clinico":{"titulo":"Fumador con tos productiva crónica","presentacion":"Hombre de 58 años, fumador de 30 años, derivado a fisioterapia respiratoria por **bronquitis crónica**: tos con expectoración abundante casi a diario y sensación de obstrucción. El neumólogo comenta que la biopsia bronquial muestra **más células caliciformes** y zonas de **metaplasia escamosa**.","preguntas":[{"pregunta":"¿Qué epitelio recubre normalmente sus bronquios y cómo elimina las partículas inhaladas?","respuesta":"Un **epitelio pseudoestratificado cilíndrico ciliado**: todas las células se apoyan en la membrana basal y las que llegan a la superficie tienen cilios, que mueven el moco con las partículas atrapadas **hacia la faringe**."},{"pregunta":"¿Por qué tiene a la vez más moco y peor aclaramiento?","respuesta":"El aumento de **células caliciformes** (glándulas exocrinas unicelulares) produce más moco, mientras que el tabaco reduce los cilios por **metaplasia escamosa**; sin batida ciliar el moco se acumula y **obstruye** las vías respiratorias."},{"pregunta":"¿Qué implica para el tratamiento de fisioterapia?","respuesta":"Como el transporte mucociliar está alterado, hay que **suplir mecánicamente el aclaramiento** (técnicas de drenaje y de permeabilización bronquial, tos dirigida) y reforzar el **abandono del tabaco**, causa de la metaplasia."}]},"preguntate":[{"pregunta":"Define tejido epitelial y nombra sus cuatro características generales.","respuesta":"Tejido que tapiza la superficie corporal, reviste cavidades y forma glándulas. Características: membrana basal, adhesión con poca sustancia intercelular, polaridad y avascularidad."},{"pregunta":"¿De qué dos partes consta la membrana basal?","respuesta":"De la lámina basal y de la lámina reticular, más fibrosa."},{"pregunta":"Asigna a su región: hemidesmosomas, uniones gap, estereocilios.","respuesta":"Hemidesmosomas: basal. Uniones gap: lateral. Estereocilios: apical."},{"pregunta":"¿Qué diferencia funcional hay entre microvellosidades, estereocilios y cilios?","respuesta":"Las microvellosidades aumentan la superficie de absorción; los estereocilios, más grandes, son mecanosensoriales (oído interno, tracto reproductor masculino); los cilios, aún mayores, baten y desplazan material."},{"pregunta":"¿Qué capa embrionaria origina el endotelio, la piel y el revestimiento respiratorio?","respuesta":"Endotelio: mesodermo. Piel: ectodermo. Revestimiento respiratorio: endodermo."},{"pregunta":"¿En qué dos factores se basa la clasificación tradicional de los epitelios y qué regla cumplen las células basales de los estratificados?","respuesta":"En el número de capas y en la forma de las células más superficiales. En los estratificados las células basales son siempre cúbicas."},{"pregunta":"Explica por qué el pseudoestratificado no es un verdadero estratificado.","respuesta":"Porque todas sus células se apoyan en la membrana basal, aunque no todas llegan a la superficie; los núcleos a distintas alturas dan la falsa impresión de varias capas."},{"pregunta":"¿Cómo cambia el urotelio entre la vejiga vacía y la llena?","respuesta":"Vacía: parece tener 4–5 capas. Llena: solo 2–3, con las células intermedias y superficiales muy aplanadas."},{"pregunta":"Compara secreción merocrina, apocrina y holocrina.","respuesta":"Merocrina: exocitosis con la célula intacta. Apocrina: liberación de vesículas íntegras rodeadas de membrana. Holocrina: se libera todo el contenido de la célula, que se destruye (glándula sebácea)."},{"pregunta":"¿Qué dos tipos de poblaciones epiteliales hay según su renovación? Da un ejemplo de cada una.","respuesta":"En renovación continua, gracias a células madre adultas en nichos (intestino delgado), y estables (hígado)."}],"glosario":[{"termino":"Membrana basal","definicion":"Capa fina de proteínas especializadas (lámina basal + lámina reticular) que separa el epitelio del conjuntivo."},{"termino":"Polaridad","definicion":"Asimetría estructural y funcional de la célula epitelial en las regiones apical, lateral y basal."},{"termino":"Microvellosidades","definicion":"Pequeñas proyecciones apicales que aumentan el área de absorción."},{"termino":"Estereocilios","definicion":"Proyecciones apicales mayores con función mecanosensorial (oído interno, tracto reproductor masculino)."},{"termino":"Endotelio","definicion":"Epitelio simple plano que recubre los vasos sanguíneos; de origen mesodérmico."},{"termino":"Mesotelio","definicion":"Epitelio simple plano que recubre las cavidades corporales; de origen mesodérmico."},{"termino":"Pseudoestratificado","definicion":"Epitelio de una sola capa cuyas células tocan todas la membrana basal sin llegar todas a la superficie."},{"termino":"Urotelio","definicion":"Epitelio de transición del tracto urinario que permite la distensión; células superficiales con placas."},{"termino":"Adenómero","definicion":"Zona secretora de una glándula exocrina, recubierta por membrana basal."},{"termino":"Célula caliciforme","definicion":"Glándula exocrina unicelular secretora de moco, intercalada entre células no secretoras."},{"termino":"Células mioepiteliales","definicion":"Células contráctiles situadas por debajo de las células epiteliales glandulares."},{"termino":"Holocrina","definicion":"Secreción en la que se libera todo el contenido de la célula secretora (glándula sebácea)."},{"termino":"Metaplasia escamosa","definicion":"Sustitución del epitelio ciliado respiratorio por epitelio escamoso, p. ej. por el tabaco, con pérdida de cilios."}],"fuentes":["Junqueira's Basic Histology. Text and Atlas. 13ª ed., McGraw-Hill.","A. L. Kierszenbaum. Histología y biología celular, 2ª ed., Elsevier, 2008.","Ross & Pawlina. Histología.","Principles of Anatomy and Physiology, 11ª ed., John Wiley & Sons, 2006.","Universidad Europea – Biología Celular y Tisular, Tema 12. Tejido epitelial (curso 2025-2026)."],"qcm":[{"pregunta":"Un corte muestra un epitelio cuyas células tocan todas la membrana basal, con núcleos a diferentes alturas y cilios en las células que llegan a la luz. ¿Dónde es más probable que se haya tomado?","opciones":["Vesícula biliar","Trompa de Falopio","Uréter","Bronquio"],"correcta":3,"explicacion":"Las células que tocan todas la membrana basal con núcleos a varias alturas definen el epitelio pseudoestratificado; si es cilíndrico ciliado, recubre las grandes vías respiratorias, como el bronquio.","por_opcion":["❌ La vesícula biliar tiene epitelio simple cilíndrico sin cilios, que absorbe agua.","❌ La trompa tiene epitelio **simple** cilíndrico ciliado: los núcleos están alineados y no a distintas alturas.","❌ El uréter tiene urotelio (de transición), sin cilios.","✅ El bronquio tiene epitelio pseudoestratificado cilíndrico ciliado."]},{"pregunta":"¿Cuál de estos epitelios tiene origen mesodérmico según el temario?","opciones":["Glándulas mamarias","Mesotelio de las cavidades","Revestimiento gastrointestinal","Revestimiento respiratorio"],"correcta":1,"explicacion":"El mesodermo origina el endotelio, el mesotelio y el revestimiento genitourinario. Los revestimientos respiratorio y gastrointestinal son endodérmicos; piel, glándulas sudoríparas y mamarias, ectodérmicas.","por_opcion":["❌ Las glándulas mamarias son **ectodérmicas**, como la piel.","✅ El mesotelio, igual que el endotelio, procede del mesodermo.","❌ El revestimiento gastrointestinal es **endodérmico**.","❌ El revestimiento respiratorio es **endodérmico**."]},{"pregunta":"¿Qué pareja de especializaciones pertenece a la misma región de la célula epitelial?","opciones":["Uniones focales y uniones adherentes","Estereocilios y uniones estrechas","Uniones gap y uniones adherentes","Hemidesmosomas y uniones gap"],"correcta":2,"explicacion":"La región lateral reúne uniones estrechas, adherentes y gap. Los hemidesmosomas y las uniones focales son basales; los estereocilios, apicales.","por_opcion":["❌ Las uniones focales son basales y las adherentes, laterales.","❌ Los estereocilios son apicales y las uniones estrechas, laterales.","✅ Ambas son uniones de la región lateral.","❌ Los hemidesmosomas son basales y las uniones gap, laterales."]},{"pregunta":"¿Qué característica se cumple SIEMPRE en un epitelio estratificado, sea cual sea su tipo?","opciones":["Absorbe gracias a sus microvellosidades","Las células superficiales son planas","Las células superficiales tienen queratina","Las células basales son cúbicas"],"correcta":3,"explicacion":"En los estratificados las células basales son siempre cúbicas; el nombre del epitelio lo da la forma de las células superficiales. Por su grosor no absorben ni secretan.","por_opcion":["❌ Su grosor impide la absorción y la secreción.","❌ Hay estratificados cúbicos y cilíndricos, con superficiales no planas.","❌ Solo el estratificado plano **queratinizado** tiene queratina en superficie.","✅ El temario lo subraya: las basales son **siempre** cúbicas."]},{"pregunta":"En la biopsia de una vejiga distendida por la orina, ¿qué se espera ver en el urotelio?","opciones":["2–3 capas con células superficiales muy aplanadas","4–5 capas con células superficiales altas","Capa superficial de células anucleadas queratinizadas","Una sola capa de células cúbicas con núcleo central"],"correcta":0,"explicacion":"Con la vejiga llena el urotelio parece tener solo 2–3 capas y sus células intermedias y superficiales se aplanan mucho; con la vejiga vacía muestra 4–5 capas.","por_opcion":["✅ Distensión: menos capas aparentes y células aplanadas.","❌ Es lo que se ve con la vejiga **vacía** (contraída).","❌ Es el estratificado plano queratinizado de la piel.","❌ Es un epitelio simple cúbico (tiroides, ovario)."]},{"pregunta":"¿Qué rasgo histológico permite distinguir un epitelio simple cilíndrico de uno simple cúbico?","opciones":["Núcleos redondos en posición central","Presencia de membrana basal continua","Núcleos alargados en posición basal","Células unidas a la membrana basal"],"correcta":2,"explicacion":"El simple cúbico tiene núcleos redondos y centrales; el cilíndrico, células más altas con núcleos alargados basales. La membrana basal y la unión a ella son comunes a todos.","por_opcion":["❌ Es el rasgo del **cúbico**, no del cilíndrico.","❌ Todos los epitelios tienen membrana basal.","✅ Es el rasgo propio del cilíndrico.","❌ En todo epitelio simple las células se apoyan en la membrana basal."]},{"pregunta":"Una glándula con varias zonas secretoras que drenan en un conducto excretor ramificado se clasifica por su conducto como:","opciones":["Ramificada","Túbulo-acinar","Simple","Compuesta"],"correcta":3,"explicacion":"Por el conducto, la simple tiene 1 adenómero y 1 conducto no ramificado; la ramificada, varias zonas secretoras y 1 conducto; la compuesta, varias zonas secretoras y un conducto ramificado. Túbulo-acinar describe la zona secretora.","por_opcion":["❌ En la ramificada lo que se divide es la zona secretora, no el conducto.","❌ Túbulo-acinar (mixta) clasifica la **zona secretora**, no el conducto.","❌ La simple tiene un único conducto **no ramificado**.","✅ Lo que define a la compuesta es el conducto ramificado."]},{"pregunta":"¿Qué mecanismo de descarga explica el acné?","opciones":["Holocrino, liberando todo el contenido celular","Endocrino, por difusión de testosterona a la sangre","Merocrino, por exocitosis de sebo","Apocrino, por vesículas rodeadas de membrana"],"correcta":0,"explicacion":"Las glándulas holocrinas (sebáceas) son las estructuras primarias del acné: la testosterona induce una secreción holocrina excesiva de sebo y queratina que bloquea los conductos, donde *Propionibacterium acnes* causa inflamación.","por_opcion":["✅ El acné se debe a la secreción holocrina excesiva.","❌ La testosterona es el desencadenante hormonal; la glándula implicada es exocrina.","❌ La glándula sebácea no secreta por exocitosis.","❌ La secreción apocrina libera vesículas, no toda la célula."]},{"pregunta":"¿Qué afirmación sobre las glándulas endocrinas es correcta según el temario?","opciones":["Pueden secretar de forma holocrina","Solo pueden ser multicelulares","Su secreción es merocrina","Vierten su producto por un conducto"],"correcta":2,"explicacion":"Las endocrinas no tienen conductos, pueden ser uni- o multicelulares, secretan hormonas al torrente sanguíneo y su forma de secreción es merocrina.","por_opcion":["❌ Holocrina y apocrina son formas de secreción exocrinas.","❌ La tabla del temario indica que pueden ser **uni- o multicelulares**.","✅ Es su única forma de secreción.","❌ Lo propio de las endocrinas es **no tener conducto**."]},{"pregunta":"¿En qué localización se encuentra un epitelio simple cúbico?","opciones":["Alveolos pulmonares","Plexos coroideos","Mucosa del estómago","Capa parietal del corpúsculo renal"],"correcta":1,"explicacion":"El temario cita como simples cúbicos: pequeños conductos colectores renales, de glándulas salivales y del páncreas, superficie externa del ovario, tiroides y plexos coroideos.","por_opcion":["❌ Los alveolos tienen epitelio simple **plano**.","✅ Los plexos coroideos tienen epitelio simple cúbico.","❌ El estómago tiene epitelio simple **cilíndrico** secretor.","❌ La capa parietal del corpúsculo renal es simple **plana**."]},{"pregunta":"En un fumador con bronquitis crónica, ¿qué combinación explica la obstrucción de las vías aéreas?","opciones":["Transformación del epitelio en urotelio","Queratinización del epitelio alveolar","Menos células caliciformes y más cilios","Más células caliciformes y menos cilios"],"correcta":3,"explicacion":"En la bronquitis crónica aumentan las células caliciformes (más moco) y disminuyen los cilios por metaplasia escamosa, de modo que el moco no se elimina y obstruye los conductos.","por_opcion":["❌ El urotelio es exclusivo del tracto urinario.","❌ El temario describe metaplasia escamosa en las vías aéreas, no queratinización alveolar.","❌ Es justo al revés de lo que ocurre.","✅ Más producción de moco y menos aclaramiento ciliar."]},{"pregunta":"¿Qué estructura apical tiene función mecanosensorial y aparece en el oído interno y el tracto reproductor masculino?","opciones":["Microvellosidades","Estereocilios","Flagelos","Cilios móviles"],"correcta":1,"explicacion":"Los estereocilios son proyecciones apicales mayores que las microvellosidades, con función mecanosensorial, presentes en el oído interno y el tracto reproductor masculino.","por_opcion":["❌ Las microvellosidades aumentan la superficie de **absorción**.","✅ Son las proyecciones con función mecanosensorial.","❌ Los flagelos son estructuras de movilidad, no sensoriales.","❌ Los cilios baten para desplazar material."]},{"pregunta":"Una glándula serosa como la parótida se caracteriza por secretar:","opciones":["Hormonas esteroideas a la sangre","Mucinas densas muy glicosiladas","Sebo y queratina","Líquido acuoso rico en enzimas"],"correcta":3,"explicacion":"Las glándulas serosas producen secreciones acuosas, poco densas, con proteínas y glicoproteínas (enzimas); las mucosas, secreciones densas con mucinas, como la sublingual.","por_opcion":["❌ Las hormonas esteroideas son productos **endocrinos**.","❌ Las mucinas densas son propias de las glándulas **mucosas** (sublingual).","❌ El sebo lo produce la glándula sebácea (holocrina).","✅ Secreción serosa: acuosa y con enzimas."]},{"pregunta":"¿Por qué los epitelios estratificados no realizan absorción ni secreción?","opciones":["Por su grosor","Porque sus células están muertas","Porque no tienen membrana basal","Porque carecen de polaridad"],"correcta":0,"explicacion":"El temario indica que los estratificados no desarrollan funciones secretoras ni de absorción debido a su grosor; su función principal es la protección y presentan polaridad en el crecimiento.","por_opcion":["✅ Es la razón que da el temario.","❌ Solo las células superficiales del queratinizado están muertas.","❌ Todos los epitelios tienen membrana basal.","❌ Tienen polaridad en el crecimiento."]},{"pregunta":"¿Qué ejemplo corresponde a una población epitelial estable y no en renovación continua?","opciones":["Hígado","Epitelio del intestino delgado","Cripta intestinal","Epidermis"],"correcta":0,"explicacion":"El temario distingue poblaciones en renovación continua (intestino delgado, con células madre adultas en nichos) y estables (hígado).","por_opcion":["✅ Es el ejemplo de población estable.","❌ Es el ejemplo de **renovación continua**.","❌ La cripta es el **nicho** de células madre que asegura la renovación continua.","❌ La epidermis se renueva desde sus células basales con alta tasa mitótica."]}],"asignatura":"Biología celular y tisular","tema":12,"fecha":"2026-11-12"}</script>

<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
