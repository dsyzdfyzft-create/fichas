<script id="datos" type="application/json">{"titulo":"Tema 2. Membrana celular","subtitulo":"Bicapa lipídica asimétrica y fluida (mosaico fluido) que delimita la célula, controla el transporte de sustancias y forma especializaciones apicales, laterales y basales en los epitelios.","objetivos":["Explicar cómo la naturaleza **anfipática** de los fosfolípidos hace que formen bicapas cerradas y autoselladas en medio acuoso.","Describir la composición de la membrana (lípidos, proteínas, glúcidos) y los factores que condicionan su **fluidez**, **asimetría** y **permeabilidad selectiva**.","Diferenciar transporte **pasivo** (difusión simple y facilitada), **activo** (primario/secundario; uniporte, simporte, antiporte) y de **macromoléculas** (exocitosis y endocitosis).","Identificar las especializaciones apicales (cilios, microvellosidades, estereocilios, flagelos), las uniones laterales y basales, y la membrana basal, con sus proteínas y elementos del citoesqueleto.","Relacionar defectos de membrana con patología: **fibrosis quística** (canal CFTR) y **pénfigo** (desmosomas)."],"ideas_clave":["La membrana mide **5-10 nm**, tiene estructura **trilaminar** (*membrana unitaria*) y se describe con el **modelo del mosaico fluido** (Singer & Nicholson, 1972).","Los fosfolípidos (**2 ácidos grasos + glicerol + fosfato**) son anfipáticos: cabezas polares hacia fuera, colas apolares al centro; la bicapa tiende a cerrarse y se **autosella**.","El **colesterol** se distribuye **igual en ambas caras**, no existe en células vegetales y amortigua la fluidez: a **baja T separa** fosfolípidos (evita rigidez) y a **alta T los une** (evita excesiva fluidez); además **↓ permeabilidad**.","**↑ ácidos grasos insaturados** y **↑ temperatura** = **↑ fluidez**.","Asimetría: **azúcares solo en la cara extracelular** (glucocálix, 2-10 % del peso), proteínas distintas en cada cara y lípidos repartidos irregularmente entre monocapas.","Las **proteínas** son ~**52 %** de la membrana; pueden ser **integrales** (incluidas las transmembrana) o **periféricas** (unidas a proteínas o a lípidos).","Transporte **pasivo** = a favor de gradiente y sin energía; **activo** = contra gradiente y con gasto energético (**primario**: ATP directo; **secundario**: gradiente creado por el primario); **macromoléculas** = deformación de membrana.","Uniones: **estrecha** (claudina/ocludina, barrera hermética), **zónula adherens** (cadherinas + cateninas, actina), **desmosoma** (filamentos intermedios), **gap** (conexinas), **hemidesmosoma** (integrinas + filamentos intermedios), **unión focal** (integrinas + actina)."],"secciones":[{"id":"introduccion","titulo":"1. Introducción: qué es la membrana celular","bloques":[{"tipo":"parrafo","texto":"La membrana celular es una **lámina continua de poco grosor (5-10 nm)** que rodea totalmente a la célula y la separa del exterior. Al microscopio electrónico muestra una **estructura trilaminar** (dos líneas densas y una clara central), común a todas las membranas biológicas: por eso se habla de **unidad de membrana** o **membrana unitaria**. Su composición es **asimétrica** (lípidos + proteínas + glúcidos), divide compartimentos y presenta **continuidad espacial, temporal y funcional**."},{"tipo":"definicion","termino":"Membrana unitaria","texto":"Estructura **trilaminar** que se observa en todas las membranas celulares y que refleja la organización en bicapa lipídica."},{"tipo":"lista","items":["**Otorga individualidad** a la célula (la separa del medio).","Permite el **intercambio de nutrientes y de información**.","**Divide compartimentos**."]},{"tipo":"alerta","texto":"El grosor es de **5-10 nm** (nanómetros), no de micras. La cifra de **0,2 micras** del temario corresponde al tamaño máximo de rotura que la membrana puede **autosellar**, no a su grosor."}]},{"id":"mosaico-fluido","titulo":"2. Estructura y composición: modelo del mosaico fluido","bloques":[{"tipo":"parrafo","texto":"El **modelo del mosaico fluido (Singer & Nicholson, 1972)** describe cómo se organizan y comportan lípidos, proteínas e hidratos de carbono: (1) lípidos y proteínas adoptan una organización en **mosaico** y (2) la membrana es una estructura **casi líquida**, en la que lípidos y proteínas pueden **moverse con cierta libertad** dentro de la bicapa."},{"tipo":"figura","pagina":4,"pie":"Esquema del mosaico fluido: localiza las cabezas polares y las colas apolares, el colesterol intercalado, las proteínas integrales frente a las periféricas, los filamentos del citoesqueleto en la cara citoplasmática y los glucolípidos y glucoproteínas (glucocálix) solo en la cara extracelular.","src":"img/biologia-celular-y-tisular-t2-tema-2-membrana-celular-p4.jpg"},{"tipo":"esquema","titulo":"Componentes de la membrana plasmática","mermaid":"flowchart LR\n  M[\"Membrana plasmática\"] --> L[\"Lípidos\"]\n  M --> G[\"Glúcidos\"]\n  M --> P[\"Proteínas\"]\n  L --> L1[\"Fosfolípidos\"]\n  L --> L2[\"Esteroles: colesterol en animales\"]\n  L1 --> L3[\"Fosfoglicéridos: PC, PS, PE, PI\"]\n  L1 --> L4[\"Esfingolípidos: esfingomielina\"]\n  G --> G1[\"Glucolípidos\"]\n  G --> G2[\"Glicoproteínas\"]\n  P --> P1[\"Integrales\"]\n  P --> P2[\"Periféricas\"]\n  P2 --> P3[\"Unidas a lípidos\"]\n  P2 --> P4[\"Unidas a proteínas\"]","pie":"Clasificación jerárquica del temario. PC: fosfatidilcolina; PS: fosfatidilserina; PE: fosfatidiletanolamina; PI: fosfatidilinositol. Los glucolípidos aparecen a la vez como lípidos y como glúcidos de membrana."}]},{"id":"lipidos","titulo":"2.1. Lípidos: fosfolípidos y colesterol","bloques":[{"tipo":"definicion","termino":"Fosfolípido","texto":"Lípido formado por **2 ácidos grasos + glicerol + grupo fosfato** (con un sustituyente de cabeza). Es **anfipático**: cabeza polar (hidrófila) y colas apolares (hidrófobas)."},{"tipo":"parrafo","texto":"**Por qué se forma la bicapa:** en medio acuoso, las colas apolares se esconden del agua en el centro y las cabezas polares quedan mirando al medio extracelular y al citoplasma. Una bicapa plana tendría los bordes expuestos al agua (energéticamente desfavorable), así que **tiende a cerrarse sobre sí misma** formando **compartimentos herméticos** (energéticamente favorable). Una de las colas suele ser saturada (p. ej., ácido palmítico) y la otra insaturada (p. ej., ácido oleico), con un **doble enlace que la acoda**."},{"tipo":"tabla","titulo":"Tipos de fosfolípidos en membranas animales","columnas":["Grupo","Ejemplos"],"filas":[["Fosfoglicéridos","Fosfatidilcolina, fosfatidilserina, fosfatidiletanolamina, fosfatidilinositol (PI)"],["Esfingolípidos","Esfingomielina"]]},{"tipo":"tarjetas","items":[{"etiqueta":"a","titulo":"Difusión lateral","texto":"Desplazamiento de un lado a otro **dentro de la misma monocapa**."},{"etiqueta":"b","titulo":"Flip-flop","texto":"Paso **de una monocapa a la otra** (externa a interna o viceversa); también llamado difusión transversal."},{"etiqueta":"c","titulo":"Rotación","texto":"Giro del fosfolípido **sobre su propio eje**."},{"etiqueta":"d","titulo":"Flexión","texto":"Las **colas** se mueven o se doblan y cambian ligeramente de forma."}]},{"tipo":"alerta","texto":"El **flip-flop** es el único movimiento que obliga a la cabeza polar a atravesar el núcleo hidrófobo; no lo confundas con la **difusión lateral**, que ocurre sin salir de la monocapa."},{"tipo":"parrafo","texto":"El **colesterol** es el **tercer tipo de lípido** más importante de la membrana. Se distribuye **de la misma forma en ambas caras** y **no está presente en células vegetales**, que tienen otros esteroles. **Regula la fluidez** como un amortiguador: a **temperaturas bajas mantiene separados** los fosfolípidos para evitar que la membrana sea muy rígida, y a **temperaturas altas los mantiene unidos** para evitar que sea muy fluida."},{"tipo":"tabla","titulo":"Colesterol como amortiguador de la fluidez","columnas":["Situación","Acción del colesterol","Objetivo"],"filas":[["Temperaturas bajas","Mantiene **separados** los fosfolípidos","Evitar que la membrana sea **muy rígida**"],["Temperaturas altas","Mantiene **unidos** los fosfolípidos","Evitar que la membrana sea **muy fluida**"]]},{"tipo":"alerta","texto":"Trampa típica: la asimetría lipídica la aportan los fosfolípidos y los glucolípidos, **no el colesterol**, que según el temario se reparte **por igual** entre ambas monocapas."}]},{"id":"glucidos","titulo":"2.2. Hidratos de carbono: glucolípidos, glucoproteínas y glucocálix","bloques":[{"tipo":"lista","items":["Se disponen **asimétricamente** y solo en la **cara externa** de la membrana.","Están unidos **covalentemente** a lípidos (**glucolípidos**) o a proteínas (**glicoproteínas**).","Suponen entre el **2 y el 10 %** del peso de la membrana, según la especie."]},{"tipo":"definicion","termino":"Glucocálix","texto":"Conjunto de hidratos de carbono de la **superficie externa** de la membrana. A continuación se encuentra la **matriz extracelular**, el medio que rodea a la célula."},{"tipo":"tabla","titulo":"Funciones del glucocálix","columnas":["Función","Comentario"],"filas":[["Protección mecánica y química","Protege la superficie celular frente a lesiones"],["Viscosidad","Otorga viscosidad a la membrana"],["Identificación celular","Es crucial para el reconocimiento celular"],["Comunicación","Participa en los procesos de comunicación (el temario lo denomina *intracelular*)"]]},{"tipo":"perla","texto":"El glucocálix es la «huella dactilar» de la célula: el reconocimiento celular en que se basan la respuesta inmunitaria o la compatibilidad de los grupos sanguíneos depende de estos oligosacáridos *(complemento)*."}]},{"id":"proteinas","titulo":"2.3. Proteínas de membrana","bloques":[{"tipo":"parrafo","texto":"Las proteínas constituyen **aproximadamente el 52 %** de la membrana y su **tamaño es mayor que el de los lípidos**. Son cadenas de aminoácidos unidos por **enlaces peptídicos**: el grupo carboxilo de un aminoácido reacciona con el amino del siguiente y **se libera H2O**. La fórmula general de un aminoácido es H2N–Cα(R)–COOH, y se conocen **20 tipos**, clasificados según su **cadena lateral (R)**."},{"tipo":"tabla","titulo":"Niveles de plegamiento","columnas":["Nivel","Base","Formas"],"filas":[["Primaria","Secuencia lineal de aminoácidos (enlace peptídico)","-"],["Secundaria","**Puentes de hidrógeno** entre aminoácidos alejados","α hélice; láminas u hojas β"],["Terciaria","Interacciones entre las **cadenas laterales** (estructura 3D)","Fibrosas; glomerulares (globulares)"],["Cuaternaria","Interacción cooperativa entre **subunidades**","Solo en proteínas con más de una cadena"]]},{"tipo":"tabla","titulo":"Funciones de las proteínas de membrana","columnas":["Clase","Función"],"filas":[["Receptora","Reconoce a la molécula señal en la superficie extracelular y se une a ella"],["Enzima","Funciones catalíticas variadas según la enzima"],["Bomba","Transporte de iones y moléculas **con gasto de energía**"],["Canal","Transporte de iones y moléculas **sin gasto de energía**"],["Proteína de anclaje","Fijación de la célula a la matriz extracelular"],["Proteína estructural","Fijación entre células vecinas"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Integrales","titulo":"Integrales de membrana","texto":"Unidas **fuertemente** a los lípidos; se **introducen total o parcialmente** en la bicapa. Las que la atraviesan de lado a lado son las **transmembrana**. Tienen **regiones hidrofóbicas**, en contacto con las colas, y **regiones hidrofílicas** proyectadas al exterior o al citoplasma."},{"etiqueta":"Periféricas","titulo":"Unidas a proteínas","texto":"**Se separan con facilidad**. Se unen a proteínas transmembrana mediante **enlaces no covalentes**, en la cara interna o externa. Intervienen en la **señalización** y en el **anclaje del citoesqueleto** a la membrana."},{"etiqueta":"Periféricas","titulo":"Unidas a lípidos","texto":"**Se separan con facilidad**. Se unen a lípidos de la membrana **pero no se introducen en ella**; quedan en la superficie externa o interna."}]},{"tipo":"alerta","texto":"En la figura de la diapositiva 13 (procedente de un libro), las «unidas a lípidos» aparecen bajo la llave de *integrales*. Para el examen aplica la **clasificación del texto del temario**: periféricas = unidas a proteínas + unidas a lípidos."}]},{"id":"caracteristicas","titulo":"3. Características de la membrana","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Autosellado","texto":"Capacidad de **repararse espontáneamente** ante pequeñas roturas (la figura indica **\u003c 0,2 micras**). Los fosfolípidos se reacomodan para minimizar la exposición de las colas hidrofóbicas al agua."},{"etiqueta":"2","titulo":"Asimetría","texto":"Distribución desigual entre las dos caras: **azúcares en la cara extracelular**, **proteínas distintas** en cada cara y **lípidos irregulares** en cada monocapa."},{"etiqueta":"3","titulo":"Permeabilidad selectiva","texto":"Controla qué entra y qué sale y mantiene la **homeostasis**. Es permeable al **H2O** y a **pequeñas moléculas** polares o apolares; impide el paso de **iones y moléculas grandes**, que necesitan **proteínas transportadoras**."},{"etiqueta":"4","titulo":"Fluidez","texto":"**↑ ácidos grasos insaturados = ↑ fluidez**; **↑ temperatura = ↑ fluidez**; **↑ colesterol** afecta a la fluidez y **↓ la permeabilidad**."}]},{"tipo":"figura","pagina":20,"pie":"Asimetría de membrana. En la cara externa predominan la esfingomielina, la fosfatidilcolina y los glucolípidos; en la cara citosólica, la fosfatidilserina, la fosfatidiletanolamina y el fosfatidilinositol. Observa también la balsa lipídica y los hidratos de carbono, siempre en la cara extracelular.","src":"img/biologia-celular-y-tisular-t2-tema-2-membrana-celular-p20.jpg"},{"tipo":"tabla","titulo":"Permeabilidad de una bicapa fosfolipídica pura","columnas":["Tipo de molécula","Ejemplos","Paso por la bicapa"],"filas":[["Gases","CO2, N2, O2","Permeable"],["Polares pequeñas sin carga","Etanol","Permeable"],["Polares pequeñas sin carga","Agua, urea","**Ligeramente permeable**"],["Polares grandes sin carga","Glucosa, fructosa","Impermeable"],["Iones","K+, Mg2+, Ca2+, Cl-, HCO3-, HPO4 2-","Impermeable"],["Polares con carga","Aminoácidos, ATP, glucosa-6-fosfato, proteínas, ácidos nucleicos","Impermeable"]]},{"tipo":"alerta","texto":"La **carga** es más determinante que el tamaño: un ion pequeño como el K+ no atraviesa la bicapa, mientras que el etanol, polar pero sin carga, sí lo hace. El agua y la urea son solo **ligeramente** permeables."},{"tipo":"perla","texto":"Relación con la termoterapia y la crioterapia *(complemento conceptual)*: la temperatura modifica la fluidez de la membrana y, con ella, el funcionamiento de sus proteínas. El colesterol amortigua esos cambios dentro de un rango fisiológico."}]},{"id":"transporte","titulo":"4. Transporte de sustancias a través de membrana","bloques":[{"tipo":"parrafo","texto":"Por la membrana pasan los **nutrientes** necesarios para el metabolismo y las sustancias de **desecho**. Según la dirección y el tipo de sustancia se habla de **ingestión**, **excreción** y **secreción**. Según el consumo de energía, el transporte es **pasivo** (a favor de gradiente), **activo** (en contra de gradiente químico o eléctrico) o **de macromoléculas** (requiere deformar la membrana)."},{"tipo":"esquema","titulo":"Clasificación del transporte","mermaid":"flowchart TD\n  T[\"Transporte a través de membrana\"] --> PA[\"Pasivo: a favor de gradiente, sin energía\"]\n  T --> AC[\"Activo: contra gradiente, con energía\"]\n  T --> MA[\"Macromoléculas: deformación de membrana\"]\n  PA --> DS[\"Difusión simple por la bicapa\"]\n  PA --> DF[\"Difusión facilitada: canales y transportadoras\"]\n  AC --> PR[\"Primario: energía directa del ATP\"]\n  AC --> SE[\"Secundario: gradiente del primario\"]\n  MA --> EX[\"Exocitosis: constitutiva o regulada\"]\n  MA --> EN[\"Endocitosis\"]\n  EN --> E1[\"Pinocitosis\"]\n  EN --> E2[\"Mediada por receptor\"]\n  EN --> E3[\"Fagocitosis\"]","pie":"Árbol de decisión: ¿va a favor de gradiente? Entonces es pasivo. ¿Va en contra? Es activo; mira si gasta ATP directamente o aprovecha un gradiente. ¿Es una macromolécula? Hay deformación de la membrana."},{"tipo":"parrafo","texto":"**Transporte pasivo:** proceso **espontáneo**, a favor de gradiente de concentración o electroquímico, que **no requiere energía**. (a) La **difusión simple** ocurre a través de la fase lipídica y la usan sustancias lipídicas y moléculas pequeñas no polares o polares sin carga, como el O2. (b) La **difusión facilitada** necesita proteínas: **canales proteicos** (p. ej., **acuaporinas**, responsables de la ósmosis rápida) y **proteínas transportadoras o portadoras** (p. ej., para la glucosa). El temario cita como canales los **regulados por voltaje**, los **regulados mecánicamente** y los **regulados por ligando**."},{"tipo":"figura","pagina":25,"pie":"Permeabilidad relativa de una bicapa pura (figura 7-1): memoriza qué grupos son permeables (gases, etanol), ligeramente permeables (agua, urea) e impermeables (glucosa, iones, moléculas polares cargadas).","src":"img/biologia-celular-y-tisular-t2-tema-2-membrana-celular-p25.jpg"},{"tipo":"parrafo","texto":"**Fibrosis quística:** enfermedad hereditaria causada por una mutación en el gen **CFTR** (*regulador de la conductancia transmembrana de la fibrosis quística*). Produce **proteínas de canal de cloruro defectuosas**, es decir, un fallo de la **difusión facilitada** de Cl-."},{"tipo":"tabla","titulo":"Clasificación de las mutaciones de CFTR (Welsh & Smith, 1993)","columnas":["Clase","Proceso alterado","Dónde falla"],"filas":[["I","**Producción** de la proteína","Núcleo (ADN y ARN): no se sintetiza proteína"],["II","**Maduración**","Retículo endoplásmico y Golgi: la proteína no llega a la membrana"],["III","**Regulación**","La proteína está en la membrana pero no se activa"],["IV","**Conducción**","El canal se abre, pero conduce mal el Cl-"]]},{"tipo":"perla","texto":"En fisioterapia respiratoria, el paciente con fibrosis quística presenta un moco espeso y difícil de movilizar por los cilios *(complemento)*: el defecto de transporte de Cl- en el epitelio de las vías respiratorias justifica las técnicas de drenaje bronquial y de aclaramiento mucociliar."},{"tipo":"parrafo","texto":"**Transporte activo:** proceso **no espontáneo**, en contra de gradiente de concentración o electroquímico, que exige **gasto energético**. Según la **fuente de energía**, es **primario** (energía directa del **ATP**) o **secundario/acoplado** (la energía procede del **gradiente generado por el transporte activo primario**). Según la **forma de transporte**, puede ser **uniporte** o **cotransporte**: en el **simporte** las moléculas se mueven en la misma dirección y en el **antiporte**, en direcciones opuestas."},{"tipo":"tabla","titulo":"Ejemplos de transporte activo del temario","columnas":["Transportador","Forma","Fuente de energía"],"filas":[["Bomba H+-ATP (bomba de protones)","Uniporte","Primario (ATP)"],["Bomba de Ca2+","Uniporte","Primario (ATP)"],["Na+-glucosa (SGLT1/2, borde en cepillo)","**Simporte**","**Secundario**: gradiente de Na+"],["Bomba Na+/K+","**Antiporte**","Primario (ATP)"],["GLUT1/2 (membrana basolateral)","Uniporte","Pasivo: difusión facilitada de glucosa"]]},{"tipo":"figura","pagina":29,"pie":"Transporte activo: la bomba de protones dependiente de ATP, los esquemas de uniporte, simporte y antiporte, el ciclo de la bomba Na+/K+ y la célula intestinal (SGLT1/2 apical frente a GLUT1/2 y bomba Na+/K+ basolaterales), que muestra cómo el transporte secundario depende del primario.","src":"img/biologia-celular-y-tisular-t2-tema-2-membrana-celular-p29.jpg"},{"tipo":"alerta","texto":"El SGLT no gasta ATP directamente, pero **es transporte activo**: sube la glucosa contra su gradiente usando el gradiente de Na+ que mantiene la bomba Na+/K+, de ahí que sea **secundario**. La salida basolateral de glucosa por **GLUT** es **pasiva**."},{"tipo":"tabla","titulo":"Transporte de macromoléculas","columnas":["Tipo","Mecanismo","Dónde y para qué"],"filas":[["Exocitosis constitutiva","Flujo **continuo** de vesículas desde el Golgi al espacio extracelular","**Todas las células**; renovación de la membrana"],["Exocitosis inducida/regulada","Secreción en respuesta a un **estímulo** (señal)","**Células especializadas en secreción**; p. ej., acinos pancreáticos"],["Pinocitosis","Ingestión de sustancias disueltas en pequeñas gotitas","Captación de líquido extracelular"],["Endocitosis mediada por receptor","A través de un **receptor de superficie**; fosita y vesícula **recubiertas** (proteína de cubierta)","Captación específica"],["Fagocitosis","Ingestión de grandes partículas **sólidas** mediante **pseudópodos**","Alimentación (protozoos), eliminación de desechos"]]}]},{"id":"especializaciones","titulo":"5. Especializaciones de membrana","bloques":[{"tipo":"parrafo","texto":"A través de la membrana, las células contactan con la **matriz extracelular** (propio del conectivo) y con las **células vecinas** (propio del epitelio). En la célula epitelial se distinguen tres superficies: **apical** (en contacto con el exterior o la luz), **laterales** (en contacto con las células vecinas) y **basal** (unida a la membrana basal)."},{"tipo":"esquema","titulo":"Especializaciones según la superficie epitelial","mermaid":"flowchart TD\n  C[\"Célula epitelial\"] --> AP[\"Superficie apical\"]\n  C --> LA[\"Superficies laterales\"]\n  C --> BA[\"Superficie basal\"]\n  AP --> A1[\"Cilios, microvellosidades, estereocilios, flagelos\"]\n  LA --> U1[\"Unión estrecha: claudina u ocludina\"]\n  LA --> U2[\"Zónula adherens: cadherinas y actina\"]\n  LA --> U3[\"Desmosoma: filamentos intermedios\"]\n  LA --> U4[\"Unión gap: conexinas\"]\n  BA --> B1[\"Unión focal: integrinas y actina\"]\n  BA --> B2[\"Hemidesmosoma: integrinas y filamentos intermedios\"]\n  BA --> B3[\"Membrana basal: colágeno IV, laminina, proteoglicanos\"]","pie":"Regla mnemotécnica: «adherens y focal van con **actina**; desmosoma y hemidesmosoma, con **filamentos intermedios**». En la cara basal, la proteína de unión es siempre la **integrina**."},{"tipo":"tabla","titulo":"Especializaciones apicales (secreción, absorción y movimiento de contenidos)","columnas":["Estructura","Movilidad","Características","Función y ejemplo"],"filas":[["Cilios","**Móviles**","Proyecciones **cortas**","Desplazar fluidos o partículas; epitelio respiratorio (con células caliciformes)"],["Microvellosidades","**Inmóviles**","Delgadas; forman el **borde en cepillo**","Aumentar la superficie de **absorción**; dan soporte y estabilidad; intestino delgado"],["Estereocilios","**Inmóviles**","**Largos**, mayores que las microvellosidades, a veces **ramificados**","**Absorción** y **percepción de estímulos mecánicos**; epidídimo"],["Flagelos","**Móviles**","Más **largos** que los cilios y **menos numerosos** por célula","**Movimiento celular** en medio fluido; espermatozoide"]]},{"tipo":"alerta","texto":"A pesar de su nombre, los **estereocilios no son cilios**: son inmóviles y se parecen a microvellosidades largas. No confundas tampoco *cilio* (mueve fluido sobre la célula) con *flagelo* (desplaza la célula)."},{"tipo":"tabla","titulo":"Uniones intercelulares laterales","columnas":["Unión","Localización y forma","Proteínas","Función"],"filas":[["Estrecha / ocluyente (*zona occludens*)","Justo por debajo de la superficie apical o luminal","**Claudina u ocludina**","Sellan las membranas y forman una **barrera hermética**; impiden filtraciones entre células (p. ej., sistema digestivo)"],["Zónula adherens","Cerca de las uniones estrechas","**Cadherinas** (transmembrana) + **cateninas** (intracelulares); anclan **actina**","Unión fuerte; esencial en el desarrollo epitelial; **movimiento coordinado** de las células (cierre de heridas)"],["Desmosoma","Conexiones **puntuales en forma de disco**","Cadherinas (desmogleínas y desmocolinas); placa con desmoplaquina, placoglobina y placofilina; anclan **filamentos intermedios**","Unen células y permiten **cierto movimiento** entre ellas; relevancia en el **pénfigo**"],["Gap / comunicante","Zonas de contacto circulares con pequeños poros","**Conexinas**, que forman canales","Paso de pequeñas moléculas: **comunicación** y señalización"]]},{"tipo":"perla","texto":"**Pénfigo:** el temario relaciona los desmosomas con esta enfermedad ampollosa, en la que fallan las uniones entre queratinocitos (por autoanticuerpos contra desmogleínas *(complemento)*). En fisioterapia hay que evitar maniobras de fricción y cizalla sobre la piel afectada."},{"tipo":"perla","texto":"La **zónula adherens** permite el desplazamiento coordinado del epitelio para **tapar una herida**. Es la base celular de la reepitelización que se busca favorecer en el abordaje de heridas y úlceras."},{"tipo":"figura","pagina":44,"pie":"Complejo de unión de la célula epitelial, de apical a basal: unión estrecha, zónula adherens (actina), desmosoma (filamentos intermedios), unión gap y, en la base, hemidesmosomas sobre la membrana basal. Asocia cada unión con su función.","src":"img/biologia-celular-y-tisular-t2-tema-2-membrana-celular-p44.jpg"},{"tipo":"tabla","titulo":"Superficie basal: membrana basal y uniones célula-matriz","columnas":["Estructura","Composición o proteína","Citoesqueleto","Función"],"filas":[["Membrana basal","**Colágeno tipo IV, proteoglicanos y laminina**; lámina basal densa + lámina reticular (fibras de reticulina)","-","Estructura **no celular** que separa el epitelio del tejido de soporte; **barrera selectiva** entre el epitelio y el conjuntivo"],["Unión focal","**Integrinas**","**Actina**","Anclaje a la matriz extracelular y **detección de señales extracelulares**"],["Hemidesmosoma","**Integrinas**; es una variante de los desmosomas","**Filamentos intermedios**","Fijación a la membrana basal; **solo en células unidas a la lámina basal**"]]},{"tipo":"tabla","titulo":"Tabla resumen de uniones (la que el temario deja para completar)","columnas":["Unión","Proteína transmembrana","Función","Citoesqueleto","Tipo"],"filas":[["Estrecha","Claudina, ocludina","Sellado y barrera","No se especifica en el temario","Célula-célula"],["Adherente (zónula adherens)","Cadherinas","Adhesión y movimiento coordinado","Actina (vía cateninas)","Célula-célula"],["Desmosoma","Cadherinas (desmogleínas, desmocolinas)","Adhesión puntual","Filamentos intermedios","Célula-célula"],["Gap","Conexinas","Comunicación","Ninguno (forma canales)","Célula-célula"],["Hemidesmosoma","Integrinas","Fijación a la membrana basal","Filamentos intermedios","Célula-matriz"],["Focal","Integrinas","Anclaje y detección de señales","Actina","Célula-matriz"]]},{"tipo":"alerta","texto":"Diferencia clave: **desmosoma** (célula-célula, cadherinas) frente a **hemidesmosoma** (célula-matriz, **integrinas**). Ambos usan **filamentos intermedios**. Lo mismo ocurre con la **zónula adherens** (cadherinas) y la **unión focal** (integrinas), que comparten la **actina**."}]}],"caso_clinico":{"titulo":"Niño con fibrosis quística en fisioterapia respiratoria","presentacion":"Marcos, de 9 años, diagnosticado de fibrosis quística, acude a la unidad de fisioterapia respiratoria por tos productiva con secreciones espesas y difíciles de expectorar. El informe genético indica una mutación de CFTR en la que la proteína se sintetiza, pero queda retenida entre el retículo endoplásmico y el Golgi y no alcanza la membrana apical de las células epiteliales de la vía aérea. Sus padres preguntan por qué «una proteína» provoca tanto moco y en qué consiste el tratamiento.","preguntas":[{"pregunta":"¿Qué tipo de transporte de membrana está alterado y por qué no puede sustituirlo la difusión simple?","respuesta":"La proteína CFTR es un **canal de cloruro**, así que lo alterado es el **transporte pasivo por difusión facilitada** de Cl-. La difusión simple no puede sustituirlo porque la bicapa es **impermeable a los iones**: solo deja pasar gases y moléculas pequeñas sin carga. Sin canal funcional, el Cl- no sale a la luz de la vía aérea."},{"pregunta":"Según la clasificación de Welsh & Smith (1993), ¿a qué clase pertenece la mutación de Marcos? Justifícalo.","respuesta":"Es de **clase II (maduración)**. La proteína sí se produce, así que no es de clase I, pero se queda en el retículo y el Golgi y no llega a la membrana. Las clases III (regulación) y IV (conducción) implican que la proteína ya está en la membrana pero no se activa o conduce mal el Cl-."},{"pregunta":"¿Qué especialización apical del epitelio respiratorio queda comprometida y qué implica para la fisioterapia?","respuesta":"Quedan comprometidos los **cilios**, proyecciones cortas y móviles que desplazan fluidos sobre la superficie del epitelio respiratorio, intercalado con células caliciformes. Con un moco espeso por el fallo del transporte iónico *(complemento)*, el aclaramiento ciliar es insuficiente. Por eso la fisioterapia aplica técnicas de **drenaje y aclaramiento mucociliar** que suplen ese déficit de transporte del moco."}]},"glosario":[{"termino":"Anfipático","definicion":"Molécula con una región polar (hidrófila) y otra apolar (hidrófoba), como los fosfolípidos."},{"termino":"Membrana unitaria","definicion":"Estructura trilaminar común a todas las membranas biológicas, de 5-10 nm."},{"termino":"Mosaico fluido","definicion":"Modelo de Singer & Nicholson (1972): lípidos y proteínas en mosaico, con libertad de movimiento en una bicapa casi líquida."},{"termino":"Flip-flop","definicion":"Paso de un fosfolípido de una monocapa a la otra (difusión transversal)."},{"termino":"Glucocálix","definicion":"Conjunto de hidratos de carbono de la cara externa de la membrana, unidos covalentemente a lípidos o proteínas."},{"termino":"Proteína transmembrana","definicion":"Proteína integral que atraviesa la bicapa de lado a lado."},{"termino":"Acuaporina","definicion":"Canal proteico para el agua; permite la ósmosis por difusión facilitada."},{"termino":"CFTR","definicion":"Regulador de la conductancia transmembrana de la fibrosis quística; canal de cloruro cuya mutación causa la enfermedad."},{"termino":"Transporte activo secundario","definicion":"Transporte contra gradiente que usa la energía del gradiente generado por un transporte activo primario."},{"termino":"Simporte / antiporte","definicion":"Cotransporte de dos sustancias en la misma dirección (simporte) o en direcciones opuestas (antiporte)."},{"termino":"Exocitosis regulada","definicion":"Secreción en respuesta a un estímulo, propia de células secretoras como los acinos pancreáticos."},{"termino":"Estereocilios","definicion":"Prolongaciones apicales largas e inmóviles, de absorción y mecanopercepción; típicas del epidídimo."},{"termino":"Conexinas","definicion":"Proteínas que forman los canales de las uniones gap o comunicantes."},{"termino":"Integrinas","definicion":"Proteínas transmembrana de las uniones célula-matriz (uniones focales y hemidesmosomas)."},{"termino":"Membrana basal","definicion":"Estructura no celular de colágeno IV, laminina y proteoglicanos que separa el epitelio del conjuntivo y actúa como barrera selectiva."}],"fuentes":["Singer SJ, Nicholson GL (1972). Modelo del mosaico fluido.","Welsh MJ, Smith AE (1993). Clasificación de las mutaciones del gen CFTR (esquema de Pascale Fanen).","Nelson DL, Cox MM. Lehninger Principles of Biochemistry, 7ª ed.","Alberts B et al. Essential Cell Biology, 3ª ed. Garland Science, 2010.","Junqueira's Basic Histology. Text and Atlas, 13ª ed. McGraw-Hill.","Solana Manrique C. Tema 02. Membrana celular. Biología Celular y Tisular, Universidad Europea."],"qcm":[{"pregunta":"En el temario, el término «membrana unitaria» hace referencia a:","opciones":["La continuidad funcional entre la membrana plasmática y el retículo","La monocapa externa enriquecida en glucolípidos y esfingomielina","El conjunto formado por la bicapa lipídica y el glucocálix externo","La estructura trilaminar común que muestran las membranas al microscopio"],"correcta":3,"explicacion":"El temario define la estructura trilaminar como «unidad de membrana o membrana unitaria». Es el patrón que comparten todas las membranas biológicas y refleja la organización en bicapa lipídica.","por_opcion":["❌ La continuidad (espacial, temporal y funcional) es otra propiedad, distinta del concepto de membrana unitaria.","❌ Describe parte de la asimetría lipídica, no la membrana unitaria.","❌ El glucocálix es la cubierta glucídica externa y no define la membrana unitaria.","✅ Es exactamente la definición del temario: estructura trilaminar = membrana unitaria."]},{"pregunta":"Un fisiólogo enfría un cultivo celular por debajo de su temperatura habitual. ¿Qué papel desempeña el colesterol de la membrana en esa situación?","opciones":["Migra a la monocapa interna para compensar la pérdida de asimetría lipídica","Sustituye a los ácidos grasos insaturados y bloquea el autosellado de la bicapa","Mantiene separados los fosfolípidos para que la membrana no resulte demasiado rígida","Mantiene unidos los fosfolípidos para que la membrana no resulte demasiado fluida"],"correcta":2,"explicacion":"El colesterol amortigua la fluidez. A temperaturas bajas se intercala y separa los fosfolípidos para evitar que se empaqueten y la membrana se vuelva rígida; a temperaturas altas hace lo contrario, mantenerlos unidos.","por_opcion":["❌ El colesterol se distribuye igual en ambas caras y no migra para generar asimetría.","❌ No sustituye a los ácidos grasos ni bloquea el autosellado, que depende de la bicapa.","✅ A baja temperatura separa los fosfolípidos y evita la rigidez.","❌ Es su acción a temperaturas altas, no a bajas."]},{"pregunta":"¿Cuál de estos componentes NO contribuye a la asimetría de la membrana plasmática, según el temario?","opciones":["El colesterol intercalado entre los fosfolípidos","Los fosfoglicéridos como la fosfatidilserina","Los oligosacáridos unidos a las glucoproteínas","Las proteínas periféricas de la cara citosólica"],"correcta":0,"explicacion":"El temario indica que el colesterol se distribuye de la misma forma en ambas caras de la membrana. La asimetría procede de los azúcares (solo en la cara extracelular), de las proteínas (distintas en cada cara) y de los fosfolípidos, repartidos irregularmente.","por_opcion":["✅ Su distribución es igual en ambas monocapas.","❌ La fosfatidilserina se sitúa en la monocapa citosólica y contribuye a la asimetría lipídica.","❌ Los azúcares solo aparecen en la cara extracelular, así que son una fuente clara de asimetría.","❌ Las proteínas difieren en cada cara, lo que también genera asimetría."]},{"pregunta":"¿Qué movimiento lipídico obliga a la cabeza polar de un fosfolípido a atravesar el núcleo hidrófobo de la bicapa?","opciones":["La difusión lateral dentro de la misma monocapa","La rotación del fosfolípido sobre su propio eje","La flexión de las colas hidrocarbonadas","El flip-flop o difusión transversal"],"correcta":3,"explicacion":"El flip-flop es el paso de una monocapa a la otra. Para ello, la cabeza polar debe cruzar la zona central apolar, cosa que no ocurre en la difusión lateral, la rotación ni la flexión, que tienen lugar dentro de una misma monocapa.","por_opcion":["❌ En la difusión lateral el fosfolípido se mueve dentro de la misma monocapa.","❌ La rotación es un giro sobre el propio eje, sin cambiar de capa.","❌ La flexión solo afecta a la forma de las colas.","✅ El flip-flop implica el salto entre monocapas."]},{"pregunta":"Según la figura de permeabilidad de una bicapa fosfolipídica pura, ¿qué molécula es solo «ligeramente permeable»?","opciones":["Oxígeno","Fructosa","Urea","Etanol"],"correcta":2,"explicacion":"La bicapa pura es permeable a los gases y a las moléculas polares pequeñas sin carga como el etanol, solo ligeramente permeable al agua y a la urea, e impermeable a las moléculas polares grandes, los iones y las moléculas cargadas.","por_opcion":["❌ El O2, como gas, es plenamente permeable.","❌ La fructosa, polar grande sin carga, es impermeable.","✅ La urea, junto al agua, es ligeramente permeable.","❌ El etanol figura como permeable."]},{"pregunta":"Una paciente con lesiones ampollosas cutáneas atribuidas a un fallo de la adhesión puntual entre queratinocitos presenta, según el temario, una alteración de:","opciones":["Las uniones focales ancladas a actina","Los desmosomas ligados a filamentos intermedios","Las uniones gap formadas por conexinas","Las uniones estrechas de claudina y ocludina"],"correcta":1,"explicacion":"El temario asocia los desmosomas, conexiones puntuales en forma de disco que unen filamentos intermedios entre células, con el pénfigo, una enfermedad ampollosa. Su fallo separa células epidérmicas vecinas.","por_opcion":["❌ Las uniones focales son célula-matriz, no adhesiones puntuales entre células.","✅ Son las uniones puntuales célula-célula relacionadas con el pénfigo.","❌ Las uniones gap son comunicantes, no de adhesión mecánica.","❌ Las uniones estrechas sellan el espacio intercelular; no son puntuales."]},{"pregunta":"¿Qué caracteriza a las proteínas periféricas unidas a proteínas?","opciones":["Se anclan covalentemente a las colas de los fosfolípidos de la monocapa","Se unen a proteínas transmembrana mediante enlaces no covalentes","Penetran parcialmente la bicapa mediante regiones hidrofóbicas expuestas","Atraviesan la bicapa y fijan el glucocálix a la matriz extracelular"],"correcta":1,"explicacion":"Según el temario, las periféricas unidas a proteínas se separan con facilidad y se unen a proteínas transmembrana mediante enlaces no covalentes. Suelen intervenir en la señalización y en el anclaje del citoesqueleto.","por_opcion":["❌ Describe un anclaje a lípidos, no la unión a proteínas.","✅ Es la definición del temario.","❌ Introducirse en la bicapa con regiones hidrofóbicas es propio de las integrales.","❌ Atravesar la bicapa es propio de las transmembrana, que son integrales."]},{"pregunta":"Respecto a los hidratos de carbono de la membrana plasmática, es correcto que:","opciones":["Se concentran en la cara citosólica y anclan el citoesqueleto","Se asocian por enlaces débiles a la bicapa y aparecen en ambas caras","Suponen cerca del 52 % del peso y forman la matriz extracelular","Se unen covalentemente a lípidos o proteínas y se sitúan en la cara externa"],"correcta":3,"explicacion":"Los glúcidos de membrana se unen covalentemente a lípidos (glucolípidos) o a proteínas (glicoproteínas) y se disponen asimétricamente en la cara externa, formando el glucocálix. Suponen entre el 2 y el 10 % del peso de la membrana.","por_opcion":["❌ Nunca están en la cara citosólica; el anclaje del citoesqueleto lo hacen las proteínas.","❌ La unión es covalente y solo se encuentran en la cara externa.","❌ El 52 % corresponde a las proteínas; la matriz extracelular está a continuación del glucocálix.","✅ Coincide con el temario: unión covalente y localización en la cara externa."]},{"pregunta":"El transportador Na+-glucosa (SGLT) de la membrana en borde en cepillo del enterocito se clasifica como:","opciones":["Pasivo por difusión facilitada de tipo uniporte","Activo primario de tipo uniporte dependiente de ATP","Activo secundario de tipo antiporte con salida de Na+","Activo secundario de tipo simporte acoplado al Na+"],"correcta":3,"explicacion":"El SGLT transporta Na+ y glucosa en la misma dirección (simporte) y obtiene la energía del gradiente de Na+ que crea la bomba Na+/K+ (transporte activo primario). Por eso es transporte activo secundario o acoplado.","por_opcion":["❌ La difusión facilitada uniporte describe a GLUT en la membrana basolateral.","❌ No usa ATP directamente y mueve dos sustancias, así que no es uniporte.","❌ Na+ y glucosa van en la misma dirección; el antiporte en la figura es la bomba Na+/K+.","✅ Es un simporte que aprovecha el gradiente del transporte primario."]},{"pregunta":"La formación de α hélices y láminas β en una proteína de membrana corresponde a la estructura:","opciones":["Secundaria, por puentes de hidrógeno en la cadena","Cuaternaria, por asociación cooperativa de subunidades","Primaria, por la secuencia de enlaces peptídicos","Terciaria, por interacciones entre cadenas laterales"],"correcta":0,"explicacion":"La estructura secundaria se forma por puentes de hidrógeno entre aminoácidos alejados, que pliegan la cadena en α hélice o en láminas u hojas β. La terciaria depende de las cadenas laterales y la cuaternaria, de varias subunidades.","por_opcion":["✅ Puentes de hidrógeno que dan α hélice y láminas β.","❌ La cuaternaria solo existe en proteínas con más de una cadena.","❌ La primaria es la secuencia lineal, sin plegamiento.","❌ La terciaria es la conformación 3D (fibrosa o glomerular) debida a las cadenas laterales."]},{"pregunta":"En un paciente con fibrosis quística, la proteína CFTR se sintetiza pero queda retenida entre el retículo y el Golgi sin llegar a la membrana. Según Welsh & Smith (1993), la mutación es de clase:","opciones":["IV, por alteración de la conducción","III, por alteración de la regulación","II, por alteración de la maduración","I, por alteración de la producción"],"correcta":2,"explicacion":"En la clasificación del temario, la clase II altera la maduración: la proteína se produce pero se bloquea en el retículo y el Golgi. En la clase I no se produce la proteína, y en las clases III y IV la proteína está en la membrana pero falla su regulación o su conducción.","por_opcion":["❌ La clase IV implica un canal en la membrana que conduce mal el Cl-.","❌ La clase III afecta a una proteína ya situada en la membrana que no se activa.","✅ La retención en el retículo y el Golgi define el defecto de maduración.","❌ En la clase I no se sintetiza la proteína, y aquí sí se sintetiza."]},{"pregunta":"Las células de los acinos pancreáticos liberan su contenido vesicular solo tras recibir una señal. Este proceso es:","opciones":["Exocitosis constitutiva, que renueva la membrana en todas las células","Exocitosis regulada, propia de células especializadas en secreción","Endocitosis mediada por receptor, con fositas recubiertas en superficie","Pinocitosis, que capta gotitas de líquido con sustancias disueltas"],"correcta":1,"explicacion":"La exocitosis inducida o regulada es la secreción en respuesta a un estímulo apropiado en células especializadas, y el temario pone como ejemplo los acinos pancreáticos. La constitutiva es un flujo continuo, sin señal, presente en todas las células.","por_opcion":["❌ La constitutiva es continua e independiente de señal.","✅ Secreción dependiente de estímulo, ejemplificada con los acinos pancreáticos.","❌ Es un mecanismo de entrada, no de liberación.","❌ La pinocitosis también es de ingestión, no de secreción."]},{"pregunta":"Al microscopio electrónico se observa una invaginación con una cubierta proteica densa que se convierte en una vesícula recubierta. Corresponde a:","opciones":["Endocitosis mediada por receptor","Fagocitosis mediante pseudópodos","Pinocitosis de gotitas líquidas","Exocitosis constitutiva desde el Golgi"],"correcta":0,"explicacion":"La endocitosis mediada por receptor se produce a través de receptores de superficie que se concentran en una fosita recubierta por una proteína de cubierta, que da lugar a una vesícula recubierta. La fagocitosis usa pseudópodos y la pinocitosis capta líquido sin esa cubierta característica.","por_opcion":["✅ La fosita y la vesícula recubiertas son propias de este mecanismo.","❌ La fagocitosis engloba partículas sólidas grandes con pseudópodos, sin fosita recubierta.","❌ La pinocitosis forma vesículas sin la cubierta proteica característica.","❌ Es un proceso de salida y no forma fositas recubiertas."]},{"pregunta":"¿Qué unión ancla el citoesqueleto de actina a la matriz extracelular mediante integrinas y participa en la detección de señales extracelulares?","opciones":["Hemidesmosoma","Zónula adherens","Desmosoma","Unión focal"],"correcta":3,"explicacion":"La unión focal es una unión célula-matriz que ancla la actina a la matriz extracelular mediante integrinas y sirve para el anclaje y la detección de señales. El hemidesmosoma también usa integrinas, pero se asocia a filamentos intermedios.","por_opcion":["❌ Usa integrinas, pero ancla filamentos intermedios, no actina.","❌ Une actina, pero entre células y mediante cadherinas.","❌ Es una unión célula-célula con cadherinas y filamentos intermedios.","✅ Combina integrinas, actina y matriz extracelular."]},{"pregunta":"En el epitelio del epidídimo se observan prolongaciones apicales largas, inmóviles y a veces ramificadas, mayores que las microvellosidades. Son:","opciones":["Estereocilios","Flagelos","Microvellosidades","Cilios"],"correcta":0,"explicacion":"Los estereocilios son prolongaciones largas y delgadas, similares a las microvellosidades pero más grandes, sin movilidad y a veces ramificadas. Se dedican a la absorción y a la percepción de estímulos mecánicos, y el temario los ilustra en el epidídimo.","por_opcion":["✅ Es la descripción del temario, con el epidídimo como ejemplo.","❌ Los flagelos son móviles y desplazan la célula.","❌ Son más cortas y forman el borde en cepillo intestinal.","❌ Los cilios son cortos y móviles."]}],"asignatura":"Biología celular y tisular","tema":2,"fecha":"2026-11-04","resumen":["La membrana celular es una lámina de **5-10 nm** con estructura **trilaminar** (*membrana unitaria*) que se describe con el **modelo del mosaico fluido (Singer & Nicholson, 1972)**: lípidos y proteínas forman un mosaico y se mueven con cierta libertad.","Los fosfolípidos (**2 ácidos grasos + glicerol + fosfato**) son **anfipáticos** y forman una bicapa que tiende a cerrarse y **se autosella** ante roturas pequeñas (**\u003c 0,2 micras**).","La fluidez aumenta con **más ácidos grasos insaturados** y **más temperatura**, y el **colesterol**, repartido **igual en ambas caras**, la amortigua: **separa los fosfolípidos con frío y los une con calor**, además de **↓ la permeabilidad**.","La membrana es **asimétrica**: los **azúcares están solo en la cara extracelular** (glucocálix, **2-10 %** del peso), y las **proteínas (~52 %)** pueden ser **integrales** (incluidas las transmembrana) o **periféricas** (unidas a proteínas o a lípidos).","El transporte es **pasivo** (a favor de gradiente y sin energía), **activo** (contra gradiente; **primario con ATP**, **secundario con el gradiente del primario**) o **de macromoléculas** (deformación de membrana); las uniones son **estrecha** (claudina/ocludina), **zónula adherens** (cadherinas + actina), **desmosoma** (cadherinas + filamentos intermedios), **gap** (conexinas), **hemidesmosoma** (integrinas + filamentos intermedios) y **focal** (integrinas + actina)."],"preguntate":[{"pregunta":"Explica por qué los fosfolípidos, en medio acuoso, forman una bicapa que se cierra sobre sí misma.","respuesta":"Son **anfipáticos**: las colas apolares se esconden del agua en el centro y las cabezas polares miran al medio. Una bicapa plana dejaría bordes expuestos al agua, lo que es energéticamente desfavorable, así que **se cierra formando compartimentos herméticos**."},{"pregunta":"¿Qué diferencia hay entre la difusión simple y la difusión facilitada? Pon un ejemplo de cada una.","respuesta":"Ambas son **pasivas**, pero la simple atraviesa directamente la **fase lipídica** (p. ej., el O2). La facilitada necesita **proteínas**: **canales**, como las **acuaporinas** para el agua, o **portadoras**, como las de la **glucosa**."},{"pregunta":"¿Por qué un ion pequeño como el K+ no atraviesa una bicapa pura y el etanol sí?","respuesta":"Para atravesar la bicapa, la **carga** es más determinante que el tamaño. El etanol es polar pero **sin carga**, mientras que los **iones** son impermeables y necesitan **proteínas transportadoras**."},{"pregunta":"Define uniporte, simporte y antiporte, y pon un ejemplo del temario de cada uno.","respuesta":"En el **uniporte** se transporta una sola sustancia (p. ej., la **bomba de Ca2+**). En el **simporte** las moléculas van en la **misma dirección** (p. ej., **Na+-glucosa**) y en el **antiporte**, en **direcciones opuestas** (p. ej., la **bomba Na+/K+**)."},{"pregunta":"¿Qué funciones cumple el glucocálix?","respuesta":"Aporta **protección mecánica y química** y **viscosidad** a la membrana. Además, es clave en la **identificación celular** (la «huella dactilar» de la célula) y en la **comunicación**."},{"pregunta":"Compara el desmosoma con el hemidesmosoma: tipo de unión, proteína transmembrana y citoesqueleto.","respuesta":"El **desmosoma** une **célula con célula** mediante **cadherinas** (desmogleínas y desmocolinas). El **hemidesmosoma** une **célula con membrana basal** mediante **integrinas**. Ambos anclan **filamentos intermedios**."},{"pregunta":"¿Qué función tiene la unión estrecha y qué proteínas la forman?","respuesta":"Está formada por **claudina u ocludina** y se sitúa justo por debajo de la superficie apical. Sella las membranas de células vecinas y crea una **barrera hermética** que impide filtraciones entre células, por ejemplo en el sistema digestivo."},{"pregunta":"¿Cuál es el defecto celular de la fibrosis quística y cómo se relaciona con el tratamiento de fisioterapia respiratoria?","respuesta":"Una mutación del gen **CFTR** produce **canales de Cl- defectuosos**, es decir, un fallo de la **difusión facilitada** de Cl-. El resultado es un moco espeso, difícil de movilizar, que justifica las técnicas de **drenaje bronquial y aclaramiento mucociliar**."},{"pregunta":"Un paciente tiene una úlcera en fase de cierre. ¿Qué unión intercelular permite que el epitelio avance para cubrirla y cómo está formada?","respuesta":"La **zónula adherens**: **cadherinas** transmembrana unidas a **cateninas** que anclan la **actina**. Permite el **movimiento coordinado** de las células, base de la **reepitelización** de la herida."},{"pregunta":"Diferencia cilios, flagelos y microvellosidades según su movilidad y su función.","respuesta":"Los **cilios** son móviles y cortos y **desplazan fluidos** sobre la célula (epitelio respiratorio). Los **flagelos**, móviles, más largos y escasos, **desplazan la propia célula** (espermatozoide). Las **microvellosidades** son inmóviles y forman el **borde en cepillo** que aumenta la superficie de **absorción** (intestino delgado)."}]}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
