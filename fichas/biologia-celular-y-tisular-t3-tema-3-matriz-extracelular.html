<script id="datos" type="application/json">{"titulo":"Tema 3. Matriz extracelular","subtitulo":"La matriz extracelular combina fibras que resisten la tracción y un gel hidratado que resiste la presión. Además, sus componentes anclan las células y participan en la comunicación celular mediante moléculas señal y receptores.","objetivos":["Al terminar, sabrás definir la matriz extracelular (MEC) y enumerar sus tres componentes: células, proteínas fibrosas y sustancia fundamental amorfa.","Al terminar, sabrás diferenciar GAGs, proteoglicanos y glucoproteínas de adhesión. Podrás explicar por qué la carga negativa de los GAGs da resistencia a la compresión.","Al terminar, sabrás describir la estructura jerárquica del colágeno y la función de la elastina. Podrás explicar de qué depende la elasticidad de un tejido.","Al terminar, sabrás identificar la fibronectina, la laminina, las integrinas y la lámina basal, con su papel en la adhesión, la cicatrización y la regeneración.","Al terminar, sabrás clasificar la señalización celular (endocrina, paracrina, autocrina, yuxtacrina), los tipos de receptores y los pasos de una cascada de señalización."],"ideas_clave":["La MEC es una **red estructural compleja** que rodea las células y les da **soporte estructural y metabólico**. Se extiende desde la superficie de la membrana plasmática y su composición **varía según el tejido**.","Tiene tres componentes: **células** (fibroblastos, que producen la matriz), **proteínas fibrosas** (colágeno y elastina) y **sustancia fundamental amorfa** (GAGs, proteoglicanos, glucoproteínas de adhesión, agua e iones).","**Fibras → resistencia a la tracción**; **sustancia fundamental (gel) → resistencia a la presión**.","Los **GAGs** tienen grupos con carga negativa que atraen cationes (Na+). Los cationes arrastran grandes volúmenes de **agua**, y la matriz hidratada se opone a la compresión.","El **ácido hialurónico** es el único GAG que **no forma proteoglicanos** por unión covalente. Se une de forma **no covalente** a proteoglicanos y forma **agregados**; el mayor proteoglicano es el **agrecán**.","Los **proteoglicanos** son una proteína central con GAGs sulfatados unidos **covalentemente**. Tienen un **90-95 % de hidratos de carbono** y **1-200 cadenas de GAG**.","**Fibronectina**: puente entre MEC y células (adhesión, migración, cicatrización). **Laminina**: forma la **lámina basal**. **Integrinas**: proteínas transmembrana que conectan la MEC con el citoesqueleto.","**Una misma señal puede generar respuestas distintas** según el receptor y la célula: la acetilcolina frena el corazón, provoca secreción salival y contrae el músculo esquelético. Una célula privada de señales entra en **apoptosis**."],"secciones":[{"id":"introduccion","titulo":"1. Introducción: qué es la matriz extracelular","bloques":[{"tipo":"definicion","termino":"Matriz extracelular (MEC)","texto":"Red estructural compleja e intrincada que **rodea y da soporte estructural y metabólico** a las células de un tejido. Se extiende desde la superficie de la membrana plasmática."},{"tipo":"lista","items":["Favorece la existencia de **comunicación extracelular**.","Afecta al **desarrollo, movimiento celular, proliferación, forma y función celular**.","**Varía su composición y características** en función del tejido en el que se encuentra: hueso, cartílago, tejido conjuntivo laxo o incluso la mesoglea de una medusa."]},{"tipo":"parrafo","texto":"La MEC no es un simple relleno inerte. Es un entorno activo que condiciona el comportamiento de las células que lo habitan. En el tejido conjuntivo laxo aparecen juntos: **fibroblastos, macrófagos, células cebadas (mastocitos) y capilares**, inmersos entre **fibras de colágeno, fibras elásticas** y un gel de **ácido hialurónico, proteoglicanos y glucoproteínas**. Bajo el epitelio, la MEC se especializa en la **lámina basal**."},{"tipo":"figura","pagina":3,"pie":"Tejido conjuntivo bajo un epitelio (Alberts, fig. 19-53) y MEC de hueso, cartílago y conjuntivo al microscopio electrónico de barrido. Fíjate en la lámina basal (amarillo) entre epitelio y conjuntivo. Observa también las células residentes (fibroblasto, macrófago, célula cebada) y cómo cambia el aspecto de la matriz según el tejido.","src":"img/biologia-celular-y-tisular-t3-tema-3-matriz-extracelular-p3.jpg"},{"tipo":"perla","texto":"Para el fisioterapeuta, la MEC es el sustrato mecánico de tendones, ligamentos, fascia, cartílago y hueso. Las cargas que aplicamos con ejercicio, terapia manual o movilización actúan primero sobre la matriz. Después, a través de las moléculas de adhesión, actúan sobre las células que la fabrican."}]},{"id":"componentes-generales","titulo":"2. Componentes de la MEC: visión general","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"Células","titulo":"Fibroblastos","texto":"**Producen los componentes** de la matriz extracelular: fibras y sustancia fundamental."},{"etiqueta":"Fibras","titulo":"Colágeno y elastina","texto":"Proteínas que forman fibras. Dan **resistencia a la tracción** (colágeno) y **elasticidad** (elastina)."},{"etiqueta":"Gel","titulo":"Sustancia fundamental amorfa","texto":"GAGs, proteoglicanos, glucoproteínas de adhesión, agua e iones. Da **resistencia a la presión** (compresión)."}]},{"tipo":"esquema","titulo":"Organización de la matriz extracelular","mermaid":"flowchart TD\n  M[\"Matriz extracelular\"] --> C[\"Células: fibroblastos\"]\n  M --> F[\"Proteínas fibrosas\"]\n  M --> S[\"Sustancia fundamental amorfa\"]\n  C -->|\"sintetizan\"| F\n  C -->|\"sintetizan\"| S\n  F --> F1[\"Colágeno: tracción\"]\n  F --> F2[\"Elastina: elasticidad\"]\n  S --> S1[\"GAGs\"]\n  S --> S2[\"Proteoglicanos\"]\n  S --> S3[\"Glucoproteínas de adhesión\"]\n  S --> S4[\"Agua e iones\"]","pie":"Los fibroblastos fabrican tanto las fibras (que resisten la tracción) como el gel de la sustancia fundamental (que resiste la presión)."},{"tipo":"tabla","titulo":"Fibras frente a sustancia fundamental","columnas":["Componente","Naturaleza","Fuerza que resiste","Ejemplo tisular"],"filas":[["Fibras de colágeno","Proteína rígida y muy abundante","**Tracción** (estiramiento)","Tendones"],["Fibras elásticas","Elastina con enlaces cruzados","Estiramiento con **recuperación** de la forma","Arterias"],["Sustancia fundamental amorfa","Gel semifluido hidratado","**Presión** (compresión)","Cartílago articular"]]},{"tipo":"alerta","texto":"Trampa típica: atribuir al colágeno la resistencia a la compresión. **Colágeno = tracción; gel de GAGs/proteoglicanos = presión.**"}]},{"id":"sustancia-fundamental-gags","titulo":"3. Sustancia fundamental y glucosaminoglicanos (GAGs)","bloques":[{"tipo":"definicion","termino":"Sustancia fundamental amorfa","texto":"**Material transparente con propiedades de gel (semifluido)**. En algunos casos puede estar **calcificada (hueso)**. Está formada básicamente por GAGs, proteoglicanos, glucoproteínas de adhesión, H2O e iones."},{"tipo":"lista","items":["Función 1: **almacena agua**.","Función 2: **proporciona forma**.","Función 3: **ancla y comunica las células**."]},{"tipo":"definicion","termino":"Glucosaminoglicanos (GAGs)","texto":"**Cadenas de hidratos de carbono largas y flexibles** formadas por **unidades repetidas** de disacáridos, con grupos de **carga negativa** (sulfato y carboxilo)."},{"tipo":"tabla","titulo":"Grandes tipos de GAGs en los tejidos conectivos","columnas":["GAG","¿Forma proteoglicanos por unión covalente?","Datos examinables"],"filas":[["**Ácido hialurónico**","**No**","El más abundante del conjuntivo, sobre todo en **primeros estadios embrionarios**. Se presenta solo o formando **agregados** de proteoglicanos (unión **no covalente**). **Crece en la superficie celular**. Da **consistencia viscosa**. Disacárido: ácido glucurónico + N-acetilglucosamina."],["Condroitín sulfato y dermatán sulfato","Sí","Disacárido del condroitín sulfato: ácido glucurónico + **N-acetilgalactosamina** con grupo **SO3−**."],["Queratán sulfato","Sí","Presente en el agrecán junto al condroitín sulfato."],["Heparán sulfato y heparina","Sí","Agrupados como un tipo en el temario."]]},{"tipo":"alerta","texto":"La diapositiva dice \"5 grandes tipos\" pero los enumera en 4 apartados, porque agrupa condroitín/dermatán sulfato y heparán sulfato/heparina. Si te preguntan cuál **no** forma proteoglicanos, la respuesta es siempre el **ácido hialurónico**. Ojo: **sí** participa en los **agregados** de proteoglicanos, pero mediante unión **no covalente**."},{"tipo":"alerta","texto":"No confundas las unidades repetidas. **Ácido hialurónico** = glucurónico + N-acetil**glucosamina**, sin sulfato. **Condroitín sulfato** = glucurónico + N-acetil**galactosamina** sulfatada."},{"tipo":"parrafo","texto":"**Por qué el gel resiste la presión.** Los grupos sulfato y carboxilo dan a los GAGs una **elevada carga negativa**. En la diapositiva el carboxilo aparece como \"carbonato\". Esta carga atrae gran cantidad de **cationes como el Na+**, que generan un efecto osmótico y arrastran **grandes volúmenes de agua**: la matriz **se hidrata**. Un gel lleno de agua es prácticamente incompresible y por eso **se opone a las fuerzas de presión**. Además, las cadenas extendidas y cargadas se repelen entre sí y ocupan mucho volumen."},{"tipo":"esquema","titulo":"De la carga negativa a la resistencia a la compresión","mermaid":"flowchart LR\n  A[\"GAGs con sulfato y carboxilo\"] --> B[\"Elevada carga negativa\"]\n  B -->|\"atrae\"| C[\"Cationes como Na+\"]\n  C -->|\"arrastran\"| D[\"Grandes volúmenes de agua\"]\n  D --> E[\"Gel hidratado\"]\n  E --> F[\"Resistencia a la presión\"]\n  G[\"Pérdida de proteoglicanos\"] -->|\"reduce\"| B","pie":"La hidratación de la matriz depende de la densidad de carga negativa. Si se pierden proteoglicanos, como en el cartílago artrósico, el tejido retiene menos agua y amortigua peor."},{"tipo":"perla","texto":"El PDF ilustra este mecanismo con una **rodilla sana frente a una rodilla con artrosis**: cartílago desgastado, erosión, osteofitos, exposición ósea y fragmentos de cartílago. Cuando el cartílago pierde su matriz rica en proteoglicanos, retiene menos agua y transmite la carga al hueso subcondral. (complemento) La carga intermitente moderada se considera favorable para la nutrición del cartílago, que es avascular: la compresión y la descompresión facilitan el intercambio de líquido. Es el fundamento del ejercicio terapéutico con cargas progresivas en la artrosis."}]},{"id":"proteoglicanos","titulo":"4. Proteoglicanos y agregados","bloques":[{"tipo":"definicion","termino":"Proteoglicano","texto":"Molécula formada por una **proteína central** con **GAGs sulfatados unidos mediante enlace covalente**."},{"tipo":"tabla","titulo":"Características de los proteoglicanos","columnas":["Rasgo","Dato del temario"],"filas":[["Composición","Grandes moléculas con un **90-95 % de hidratos de carbono**"],["Número de cadenas","**De 1 a 200 cadenas de GAGs** unidas a una proteína central"],["Destino","**Secretados por exocitosis** o **anclados a la superficie celular**"],["Agregados","Uniones **no covalentes con ácido hialurónico**, mediante **proteínas de enlace**, que forman complejos mayores"],["Ejemplo máximo","**Agrecán**, el proteoglicano más grande (cadenas de condroitín sulfato y queratán sulfato)"],["Hialuronato del agregado","Hasta **50.000 disacáridos repetidos**; el agregado de agrecán alcanza un tamaño del orden de **1 µm**"]]},{"tipo":"figura","pagina":10,"pie":"Agregado de agrecán. Mira el eje central de hialuronato (hasta 50.000 disacáridos), las proteínas centrales del agrecán insertadas en él mediante proteínas de enlace y las cadenas laterales de queratán y condroitín sulfato. Fíjate en la escala de 1 µm.","src":"img/biologia-celular-y-tisular-t3-tema-3-matriz-extracelular-p10.jpg"},{"tipo":"alerta","texto":"Dos tipos de unión que se confunden en el examen. **GAG sulfatado → proteína central: covalente** (es lo que forma el proteoglicano). **Proteoglicano → ácido hialurónico: no covalente**, mediante proteínas de enlace (es lo que forma el agregado)."}]},{"id":"glucoproteinas-adhesion","titulo":"5. Glucoproteínas de adhesión y lámina basal","bloques":[{"tipo":"definicion","termino":"Glucoproteínas de adhesión","texto":"Macromoléculas con **hidratos de carbono ramificados** que desempeñan un papel importante en la **adhesión célula-MEC**. Presentan **varios dominios de unión** para integrinas, fibras de colágeno y proteoglicanos."},{"tipo":"tarjetas","items":[{"etiqueta":"a","titulo":"Fibronectina","texto":"Actúa como **puente entre la MEC y las células**. Facilita la **adhesión y migración celular** y contribuye a la **cicatrización**. Tiene dominios de autoensamblaje y de unión a colágena, a célula y a heparina. Su **secuencia RGD (Arg-Gly-Asp)** está en el dominio de unión a la célula, junto a una secuencia sinérgica. Es un dímero unido por puentes disulfuro en el extremo C-terminal."},{"etiqueta":"b","titulo":"Laminina","texto":"**Componente de la lámina basal** que mantiene unidas las células y los tejidos. Tiene cadenas **α, β y γ** con un dominio en hélice enrollada (coiled-coil). Se une a **integrinas, distroglicano, nidógeno y perlecano** y se autoensambla."},{"etiqueta":"c","titulo":"Integrinas","texto":"**Proteínas transmembrana** que funcionan como puente entre el interior y el exterior celular. **Conectan la MEC con el citoesqueleto**."}]},{"tipo":"alerta","texto":"El temario incluye las **integrinas** en la lista de \"glucoproteínas de importancia\", pero no son proteínas secretadas a la matriz como la fibronectina o la laminina. Son **receptores transmembrana** de la célula. Si una opción dice que la integrina \"forma la lámina basal\" o \"se secreta al gel\", es falsa."},{"tipo":"definicion","termino":"Lámina basal","texto":"Lámina de moléculas de matriz **esencial para sostener los epitelios**, que **también envuelve tipos celulares no epiteliales**: fibras musculares y glomérulo renal, entre endotelio y epitelio. Está **formada por laminina**."},{"tipo":"parrafo","texto":"**Experimento de regeneración neuromuscular.** Se seccionan la fibra muscular y el nervio, y ambos degeneran. Solo queda la **estructura residual de la lámina basal**. Cuando se regeneran, el **nervio vuelve al lugar de unión original** y los **nuevos receptores de acetilcolina se concentran en ese mismo lugar**. Conclusión: la lámina basal **no es un mero soporte pasivo**. Contiene información posicional que guía la reinervación y la organización de la sinapsis."},{"tipo":"figura","pagina":12,"pie":"Arriba, la laminina en forma de cruz con sus cadenas α, β y γ y sus sitios de unión (integrinas, distroglicano, nidógeno, perlecano). Abajo, la lámina basal en músculo, epitelio y glomérulo renal. A la derecha, el experimento en el que la lámina basal residual dirige el nervio y los receptores de ACh al sitio de unión original.","src":"img/biologia-celular-y-tisular-t3-tema-3-matriz-extracelular-p12.jpg"},{"tipo":"perla","texto":"La fibronectina interviene en la **cicatrización**: es el andamio por el que migran las células hacia la herida. La lámina basal guía la **regeneración nerviosa y neuromuscular**. (complemento) Esto ayuda a entender por qué la recuperación tras una lesión nerviosa periférica es mejor cuando se conservan las vainas y estructuras de soporte que cuando se pierde la continuidad del tejido."}]},{"id":"fibras","titulo":"6. Proteínas fibrosas: colágeno y elastina","bloques":[{"tipo":"parrafo","texto":"Las proteínas fibrosas **confieren propiedades a los tejidos en función de su abundancia**. El temario solo desarrolla **colágeno y elastina**."},{"tipo":"alerta","texto":"La diapositiva dice \"existen 4 proteínas principales\", pero solo desarrolla **colágeno y elastina** como proteínas que forman fibras. En el esquema general de componentes, las proteínas fibrosas son exclusivamente colágeno y elastina. La fibronectina y la laminina son **glucoproteínas de adhesión** de la sustancia fundamental, no fibras."},{"tipo":"tarjetas","items":[{"etiqueta":"Colágeno","titulo":"Rigidez y tracción","texto":"Proteínas **muy abundantes y rígidas** que proporcionan **resistencia a la tracción**. Su organización **difiere entre tejidos**. Ejemplo: **tendones**."},{"etiqueta":"Elastina","titulo":"Elasticidad","texto":"Confiere **elasticidad**. Las moléculas se unen entre sí por **enlaces cruzados**, de modo que al tensar una fibra **se estira todo el conjunto** y luego recupera su forma (estiramiento y relajación). Ejemplo: **arterias**."}]},{"tipo":"tabla","titulo":"Jerarquía estructural del colágeno","columnas":["Nivel","Descripción","Dimensión"],"filas":[["Cadena polipeptídica","Cadena simple de colágeno","—"],["Molécula de colágeno","**Triple hélice** de tres cadenas","**1,5 nm** de diámetro"],["Fibrilla de colágeno","Moléculas agrupadas de forma escalonada (aspecto estriado)","**10-300 nm**"],["Fibra de colágeno","Haces de fibrillas","**0,5-3 µm**"]]},{"tipo":"figura","pagina":14,"pie":"Jerarquía del colágeno, de la cadena a la triple hélice (1,5 nm), la fibrilla (10-300 nm) y la fibra (0,5-3 µm). A la derecha, el ratón Sagg/+: una mutación del colágeno tipo V produce piel laxa, con menor contenido de colágeno y propiedades biomecánicas disminuidas (Christner et al., 2006).","src":"img/biologia-celular-y-tisular-t3-tema-3-matriz-extracelular-p14.jpg"},{"tipo":"parrafo","texto":"**Modelo Sagg/+ (piel laxa).** Una **mutación en el colágeno tipo V** produce **haploinsuficiencia** y dos subpoblaciones de fibrillas: unas normales y otras de **forma irregular y mayor diámetro**. Además, hay **menor contenido de colágeno**, menores niveles de ARNm de procolágeno α1(I), α2(I), α1(V) y α2(V), y **propiedades biomecánicas de la piel significativamente disminuidas**. La consecuencia visible es que la piel se estira mucho más que la normal. Demuestra que la resistencia mecánica depende de la cantidad de colágeno y de cómo se organizan sus fibrillas."},{"tipo":"perla","texto":"**La elasticidad de un tejido depende principalmente de la proporción fibras de colágeno/fibras elásticas.** Un tendón, con predominio de colágeno, es rígido y transmite fuerza; una arteria, rica en elastina, se distiende y recupera. Al valorar la extensibilidad de piel, fascia o cápsula articular estamos explorando, en el fondo, esta proporción y la organización del colágeno."}]},{"id":"funciones","titulo":"7. Funciones de la MEC","bloques":[{"tipo":"tabla","titulo":"Funciones de la matriz extracelular","columnas":["Función","Explicación"],"filas":[["Soporte mecánico y estructural","Las fibras resisten la tracción y el gel resiste la presión"],["Relleno de espacios y migración celular","Rellena los espacios entre fibras y células y sirve de sustrato por el que migran las células"],["Barrera frente a patógenos","El gel dificulta la diseminación de microorganismos"],["Difusión de sustancias","Medio hidratado por el que difunden nutrientes, metabolitos y señales entre capilares y células"],["Comunicación celular","Las integrinas unen la MEC con el citoesqueleto y la matriz influye en la forma, la proliferación y la función celular"]]},{"tipo":"perla","texto":"La función de **difusión** explica la dependencia del cartílago, que es avascular, de su matriz hidratada para nutrirse. La de **migración** explica el papel de la fibronectina en la reparación de tejidos blandos."}]},{"id":"comunicacion-celular","titulo":"8. Comunicación e intercambio de información celular","bloques":[{"tipo":"parrafo","texto":"El temario arranca con un ejemplo: tras una **herida punzante con contaminación bacteriana**, los **glóbulos blancos acuden** al foco. Lo hacen **mediante la comunicación celular**. La comunicación entre células está mediada fundamentalmente por **moléculas de señal extracelulares**. Algunas actúan a **larga distancia**, viajando por la sangre, como las hormonas. Otras señalizan a **células vecinas**, como los mediadores locales. **La mayoría de las células de un organismo pluricelular emiten y reciben señales.**"},{"tipo":"definicion","termino":"Molécula señal o ligando","texto":"Pueden ser **proteínas, pequeños péptidos, aminoácidos, nucleótidos, esteroides, retinoides** e incluso **gases disueltos** como el **óxido nítrico (NO)** y el **monóxido de carbono (CO)**."},{"tipo":"tarjetas","items":[{"etiqueta":"Emisora 1","titulo":"Señal secretada","texto":"La célula señalizadora libera la señal **por exocitosis o por difusión a través de la membrana**, y esta alcanza el receptor de la célula receptora."},{"etiqueta":"Emisora 2","titulo":"Señal expuesta en superficie","texto":"La célula **expone la señal en su superficie**. Solo influye en células que están en **contacto estrecho** con ella."}]},{"tipo":"tabla","titulo":"Tipos de señalización","columnas":["Tipo","Diana","Ejemplos en el esquema del temario"],"filas":[["**Endocrina**","Células lejanas, a través de un **vaso sanguíneo**","Hormonas"],["**Paracrina**","Células **vecinas**","Factores de crecimiento, citocinas, eicosanoides, NO, ATP, S1P, neurotransmisores"],["**Autocrina**","La **propia célula** emisora","Factores de crecimiento y citocinas que actúan sobre la misma célula"],["**Yuxtacrina**","Célula en **contacto directo**","Estímulo **anclado a membrana**; puede liberarse por corte del ectodominio mediante ADAM"]]},{"tipo":"figura","pagina":20,"pie":"Tipos de señalización. Distingue la yuxtacrina (estímulo anclado a la membrana, contacto célula-célula), la autocrina (la señal vuelve a la propia célula), la paracrina (célula vecina) y la endocrina (a través del vaso sanguíneo). Observa también el corte del ectodominio por ADAM.","src":"img/biologia-celular-y-tisular-t3-tema-3-matriz-extracelular-p20.jpg"},{"tipo":"parrafo","texto":"La **célula receptora o diana** es la que recoge la señal y necesita **proteínas receptoras**. Que el receptor esté en la superficie o dentro de la célula depende de la **solubilidad del ligando**. Una molécula **hidrofílica** no atraviesa la bicapa lipídica y necesita un **receptor de superficie** (transmembrana), que transmite la señal al interior. Una molécula **pequeña e hidrofóbica** atraviesa la membrana y se une a un **receptor intracelular**, a menudo nuclear. Como es insoluble en agua, viaja por la sangre unida a una **proteína transportadora**."},{"tipo":"esquema","titulo":"Tipo de receptor según el ligando","mermaid":"flowchart TD\n  L[\"Molécula señal\"] --> Q{\"Naturaleza del ligando\"}\n  Q -->|\"hidrofílica\"| S1[\"No atraviesa la membrana\"]\n  S1 --> R1[\"Receptor de superficie transmembrana\"]\n  R1 --> T1[\"Transmite la señal al interior\"]\n  Q -->|\"pequeña e hidrofóbica\"| S2[\"Viaja con proteína transportadora\"]\n  S2 --> S3[\"Atraviesa la membrana\"]\n  S3 --> R2[\"Receptor intracelular\"]","pie":"La solubilidad del ligando determina dónde está su receptor."},{"tipo":"parrafo","texto":"**Complejidad del intercambio de información.** En el medio extracelular existen cientos de señales, pero **cada célula solo reconoce unas pocas**, según su función, porque **solo expresa los receptores necesarios**. Por eso **una misma señal puede generar respuestas diferentes**. Además, como una célula tiene **diversos receptores**, es **sensible a diversas señales** y la **combinación** de señales decide su destino."},{"tipo":"tabla","titulo":"Acetilcolina: una señal, tres respuestas","columnas":["Tejido diana","Respuesta a la acetilcolina"],"filas":[["Músculo cardíaco","**Disminución de la frecuencia e intensidad** de la contracción"],["Glándula salival","**Secreción**"],["Músculo esquelético","**Contracción**"]]},{"tipo":"tabla","titulo":"Combinaciones de señales y destino celular","columnas":["Señales recibidas","Resultado"],"filas":[["A + B + C","**Sobrevivir**"],["A + B + C + D + E","**Crecer y dividirse**"],["A + B + C + F + G","**Diferenciarse**"],["Ninguna señal","**Morir** (célula apoptótica)"]]},{"tipo":"alerta","texto":"Trampa: pensar que, sin señales, la célula queda \"en reposo\". Según el temario, **la ausencia de señales conduce a la muerte por apoptosis**. Hasta la supervivencia requiere señales (A, B y C)."},{"tipo":"lista","items":["1. **Captación** de la señal.","2. **Activación del receptor**.","3. **Transducción** al interior, a través de proteínas señalizadoras intracelulares.","4. **Activación de las dianas o proteínas efectoras**.","5. **Respuesta** (cambio en la célula)."]},{"tipo":"esquema","titulo":"Vía de señalización intracelular: elementos básicos","mermaid":"flowchart TD\n  A[\"Molécula señal extracelular\"] --> B[\"Proteína receptora en membrana\"]\n  B --> C[\"Proteínas señalizadoras intracelulares\"]\n  C --> D[\"Enzima metabólica\"]\n  C --> E[\"Proteína reguladora de expresión génica\"]\n  C --> F[\"Proteína del citoesqueleto\"]\n  D --> D2[\"Cambios en el metabolismo\"]\n  E --> E2[\"Cambios en la expresión génica\"]\n  F --> F2[\"Cambios de forma o movimiento\"]","pie":"Cada tipo de proteína efectora produce un tipo de respuesta: metabólica, génica o mecánica (forma y movimiento)."},{"tipo":"perla","texto":"La relación entre proteína efectora del citoesqueleto y **cambios de forma y movimiento** conecta con la MEC: las integrinas unen matriz y citoesqueleto. (complemento) Es la base biológica de la **mecanotransducción**. Las cargas mecánicas aplicadas en fisioterapia, como el ejercicio de carga en una tendinopatía, se convierten en señales que modifican la síntesis de matriz por parte de la célula."}]},{"id":"moleculas-adhesion","titulo":"9. Moléculas de adhesión (apartado del índice)","bloques":[{"tipo":"parrafo","texto":"El índice del tema incluye un apartado de **moléculas de adhesión**: **cadherinas, integrinas, selectinas e inmunoglobulinas**. Las diapositivas solo desarrollan las **integrinas**: proteína transmembrana que conecta la MEC con el citoesqueleto."},{"tipo":"tabla","titulo":"Familias de moléculas de adhesión (complemento salvo integrinas)","columnas":["Familia","Tipo de unión principal"],"filas":[["Cadherinas","(complemento) Unión célula-célula, dependiente de calcio"],["Integrinas","Unión **célula-MEC**: conectan la matriz con el citoesqueleto (temario)"],["Selectinas","(complemento) Unión célula-célula transitoria; por ejemplo, el rodamiento de leucocitos sobre el endotelio"],["Inmunoglobulinas (superfamilia Ig)","(complemento) Unión célula-célula, independiente de calcio"]]},{"tipo":"perla","texto":"(complemento) La llegada de leucocitos tras la herida punzante del ejemplo del temario depende de selectinas e integrinas. Las selectinas frenan al leucocito sobre el endotelio y las integrinas lo anclan antes de que migre hacia la MEC infectada."}]}],"caso_clinico":{"titulo":"Artrosis de rodilla y tendinopatía rotuliana en una corredora veterana","presentacion":"Mujer de 61 años, corredora popular, consulta por dolor mecánico en la rodilla derecha de 8 meses de evolución. La resonancia muestra disminución del grosor del cartílago femorotibial medial, con áreas de erosión y osteofitos marginales. Describe también dolor en el polo inferior de la rótula al bajar escaleras, compatible con tendinopatía rotuliana. Pregunta si \"el cartílago se ha secado\" y por qué el tendón le duele aunque no se ha roto.","preguntas":[{"pregunta":"¿Qué componente de la MEC del cartílago explica su capacidad para amortiguar la compresión? ¿Por qué su pérdida reduce esa capacidad?","respuesta":"La responsable es la **sustancia fundamental amorfa**, rica en **proteoglicanos (agrecán)** agregados sobre **ácido hialurónico**. Los GAGs sulfatados del agrecán (condroitín y queratán sulfato) tienen una **elevada carga negativa** que atrae Na+ y arrastra grandes volúmenes de agua. El gel hidratado resultante se opone a las fuerzas de presión. En la artrosis se pierde esta matriz: baja la densidad de carga, el tejido retiene menos agua y la carga se transmite al hueso subcondral (erosión, osteofitos). La expresión de la paciente, \"el cartílago se ha secado\", es una simplificación bastante acertada."},{"pregunta":"El tendón rotuliano y el cartílago soportan cargas distintas. ¿Qué componente de la MEC predomina en cada uno y qué fuerza resiste?","respuesta":"En el **tendón** predomina el **colágeno**: proteína rígida, organizada en triple hélice (1,5 nm), fibrillas (10-300 nm) y fibras (0,5-3 µm), que da **resistencia a la tracción**. En el **cartílago** predomina el **gel de proteoglicanos**, que resiste la **presión**. La baja elasticidad del tendón se explica por su alta proporción colágeno/elastina. La elasticidad de un tejido depende principalmente de esta proporción. El modelo Sagg/+ muestra que alterar la cantidad y la organización de las fibrillas de colágeno reduce la resistencia biomecánica."},{"pregunta":"¿Por qué tiene sentido biológico que un programa de ejercicio de carga progresiva pueda modificar la matriz del tendón y del cartílago?","respuesta":"Las células de estos tejidos (fibroblastos/tenocitos y condrocitos) **producen los componentes de la MEC**. Están unidas a la matriz mediante **integrinas**, que conectan la MEC con el **citoesqueleto**. La carga mecánica deforma la matriz y, a través de estas uniones, desencadena una **cascada de señalización**: captación, activación del receptor, transducción, activación de proteínas efectoras y respuesta. Esa cascada puede alterar la **expresión génica** y, con ella, la síntesis de colágeno y proteoglicanos (mecanotransducción, complemento). Además, en el cartílago avascular la compresión intermitente favorece la **difusión de sustancias** a través del gel, una de las funciones de la MEC (complemento)."}]},"glosario":[{"termino":"Matriz extracelular","definicion":"Red estructural que rodea a las células y les da soporte estructural y metabólico. Se compone de células, fibras y sustancia fundamental amorfa."},{"termino":"Sustancia fundamental amorfa","definicion":"Gel transparente y semifluido, calcificado en el hueso, formado por GAGs, proteoglicanos, glucoproteínas de adhesión, agua e iones. Resiste la presión."},{"termino":"Glucosaminoglicano (GAG)","definicion":"Cadena larga y flexible de hidratos de carbono formada por disacáridos repetidos, con carga negativa."},{"termino":"Ácido hialurónico","definicion":"GAG más abundante del conjuntivo. No forma proteoglicanos, crece en la superficie celular, da viscosidad y sirve de eje a los agregados de proteoglicanos."},{"termino":"Proteoglicano","definicion":"Proteína central con 1-200 cadenas de GAGs sulfatados unidas covalentemente; tiene un 90-95 % de hidratos de carbono."},{"termino":"Agrecán","definicion":"Proteoglicano más grande, con cadenas de condroitín y queratán sulfato. Se une de forma no covalente al ácido hialurónico mediante proteínas de enlace."},{"termino":"Fibronectina","definicion":"Glucoproteína de adhesión que hace de puente entre la MEC y las células. Contiene la secuencia RGD e interviene en la migración y la cicatrización."},{"termino":"Laminina","definicion":"Glucoproteína en forma de cruz (cadenas α, β y γ) que forma la lámina basal."},{"termino":"Integrina","definicion":"Proteína transmembrana que conecta la MEC con el citoesqueleto."},{"termino":"Lámina basal","definicion":"Lámina de matriz que sostiene los epitelios y envuelve células no epiteliales (músculo, glomérulo); formada por laminina."},{"termino":"Elastina","definicion":"Proteína fibrosa con enlaces cruzados que confiere elasticidad, abundante en las arterias."},{"termino":"Ligando","definicion":"Molécula señal que se une a un receptor: proteínas, péptidos, aminoácidos, nucleótidos, esteroides, retinoides, NO o CO."},{"termino":"Señalización yuxtacrina","definicion":"Comunicación mediante una señal anclada a la membrana que actúa sobre una célula en contacto directo."},{"termino":"Transducción de señal","definicion":"Paso de la información del receptor activado al interior celular mediante proteínas señalizadoras intracelulares."}],"fuentes":["Alberts B, et al. Biología molecular de la célula, 5ª ed. Garland Science, 2008; Ediciones Omega, 2010 (figura 19-53).","Alberts B, et al. Essential Cell Biology, 3ª ed. Garland Science, 2010 (figura 4-25b).","Cooper GM. La célula, 6ª ed.","Karp G. Biología celular y molecular, 5ª ed. McGraw-Hill.","Christner PJ, Gentiletti J, Peters J, et al. Collagen dysregulation in the dermis of the Sagg/+ mouse: a loose skin model. J Invest Dermatol. 2006;126:595-602.","Solana Manrique C. Tema 3. Matriz extracelular. Biología Celular y Tisular, Grado en Fisioterapia, Universidad Europea, 2024-2025."],"qcm":[{"pregunta":"Respecto al ácido hialurónico, ¿cuál de las siguientes afirmaciones se ajusta al temario?","opciones":["Es el GAG más abundante del conjuntivo, sobre todo en el embrión temprano","Se sintetiza en el interior celular y se libera después por exocitosis","Se une covalentemente a una proteína central formando el agrecán","Su disacárido repetido contiene N-acetilgalactosamina con grupo sulfato"],"correcta":0,"explicacion":"El ácido hialurónico es el GAG más abundante del tejido conjuntivo, principalmente en los primeros estadios embrionarios. No forma proteoglicanos y crece en la superficie celular. Su disacárido es ácido glucurónico + N-acetilglucosamina, sin sulfato.","por_opcion":["✅ Dato literal del temario: es el más abundante del conjuntivo, sobre todo en los primeros estadios embrionarios.","❌ El temario indica que crece en la superficie celular. La secreción por exocitosis se atribuye a los proteoglicanos.","❌ El ácido hialurónico no forma proteoglicanos. En el agregado de agrecán se une de forma no covalente; la unión covalente a la proteína central corresponde a los GAGs sulfatados.","❌ Esa unidad (N-acetilgalactosamina sulfatada) corresponde al condroitín sulfato. El ácido hialurónico lleva N-acetilglucosamina."]},{"pregunta":"¿Qué mecanismo explica que la sustancia fundamental del cartílago se oponga a las fuerzas de presión?","opciones":["Los grupos aniónicos de los GAGs atraen Na+, que arrastra agua al gel","Las fibras de colágeno en triple hélice absorben agua entre sus cadenas","Los enlaces cruzados de la elastina retienen K+ y expulsan el agua","Las cargas positivas de los GAGs repelen el agua y compactan el gel"],"correcta":0,"explicacion":"Los GAGs poseen grupos con carga negativa (sulfato y carboxilo) que atraen gran cantidad de cationes como el Na+. Esto produce la acumulación de grandes volúmenes de agua: la matriz se hidrata y se opone a la compresión.","por_opcion":["✅ Es el mecanismo del temario: carga negativa, atracción de Na+, hidratación del gel y oposición a la presión.","❌ El colágeno resiste la tracción. La resistencia a la presión depende del gel de GAGs y proteoglicanos.","❌ La elastina aporta elasticidad mediante enlaces cruzados, pero no es responsable de la hidratación del gel.","❌ Los GAGs tienen carga negativa, no positiva, y retienen agua en lugar de repelerla."]},{"pregunta":"¿Qué combinación de datos describe correctamente un proteoglicano según el temario?","opciones":["50 % de hidratos de carbono y hasta 50.000 cadenas de GAGs","90-95 % de hidratos de carbono y de 1 a 200 cadenas de GAGs","90-95 % de proteína y hasta 20 cadenas de GAGs no sulfatados","60-70 % de hidratos de carbono y de 200 a 500 cadenas de GAGs"],"correcta":1,"explicacion":"Los proteoglicanos son grandes moléculas con un 90-95 % de hidratos de carbono. Pueden contener de 1 a 200 cadenas de GAGs sulfatados unidas covalentemente a una proteína central.","por_opcion":["❌ La cifra de 50.000 corresponde a los disacáridos repetidos del hialuronato del agregado, no a las cadenas de GAG.","✅ Coincide con los dos datos numéricos del temario.","❌ Invierte la proporción: el componente mayoritario son los hidratos de carbono. Además, los GAGs de los proteoglicanos son sulfatados.","❌ Ni el porcentaje ni el rango de cadenas coinciden con el temario."]},{"pregunta":"En el esquema de la fibronectina del temario, ¿en qué dominio se localiza la secuencia RGD (Arg-Gly-Asp)?","opciones":["En el dominio de unión a la célula, junto a una secuencia sinérgica","En el dominio de unión a colágena, junto a la región de autoensamblaje","En la región de autoensamblaje del extremo N-terminal de cada cadena","En el dominio de unión a heparina, próximo al extremo C-terminal"],"correcta":0,"explicacion":"La ampliación del esquema muestra la secuencia RGD en el dominio de unión a la célula, acompañada de una secuencia sinérgica. Por ese dominio la fibronectina hace de puente entre la MEC y la célula, a la que se une a través de integrinas.","por_opcion":["✅ La secuencia RGD está en el dominio de unión a la célula, junto a la secuencia sinérgica.","❌ La unión a colágena es otro dominio, que ancla la fibronectina a las fibras de la matriz.","❌ El autoensamblaje permite la polimerización de la fibronectina, no la adhesión a la célula.","❌ El dominio de unión a heparina es distinto y no contiene la secuencia RGD."]},{"pregunta":"En el experimento del temario se seccionan músculo y nervio, y ambos degeneran salvo la lámina basal residual. ¿Qué se observa tras la regeneración?","opciones":["El nervio forma la sinapsis en cualquier punto y la lámina basal se desplaza hacia él","El nervio regenerado sintetiza una lámina basal nueva y abandona la residual","El nervio vuelve al sitio de unión original y allí se concentran nuevos receptores de ACh","Los receptores de ACh se distribuyen por igual por toda la fibra muscular regenerada"],"correcta":2,"explicacion":"La lámina basal residual guía la regeneración. El nervio regenerado vuelve al lugar de unión original y los nuevos receptores de acetilcolina se concentran en ese mismo lugar. Por tanto, la lámina basal contiene información posicional y no es solo un soporte pasivo.","por_opcion":["❌ Es al revés: la lámina basal residual determina dónde se forma la sinapsis, y el nervio regresa a ese punto.","❌ El experimento demuestra precisamente que la lámina basal residual dirige la reinervación.","✅ Resultado descrito en el esquema del temario.","❌ Los receptores no se dispersan, sino que se concentran en el sitio de unión original."]},{"pregunta":"¿Cuál de las siguientes moléculas NO figura entre los sitios de unión de la laminina en el esquema del temario?","opciones":["Agrecán","Distroglicano","Nidógeno","Perlecano"],"correcta":0,"explicacion":"El esquema de la laminina (cadenas α, β y γ) muestra sitios de unión a integrinas, distroglicano, nidógeno y perlecano, además de dominios de autoensamblaje. El agrecán es el gran proteoglicano del agregado con ácido hialurónico y no aparece como ligando de la laminina.","por_opcion":["✅ El agrecán se asocia al ácido hialurónico mediante proteínas de enlace y no figura entre los ligandos de la laminina.","❌ El distroglicano aparece como sitio de unión de la laminina.","❌ El nidógeno aparece como sitio de unión en la cadena γ de la laminina.","❌ El perlecano aparece como sitio de unión de la laminina."]},{"pregunta":"En la jerarquía estructural del colágeno, ¿qué correspondencia entre nivel y dimensión es correcta?","opciones":["Molécula en triple hélice: 10-300 nm de diámetro","Fibrilla de colágeno: 10-300 nm de diámetro","Fibra de colágeno: 1,5 nm de diámetro","Fibrilla de colágeno: 0,5-3 µm de diámetro"],"correcta":1,"explicacion":"Según el esquema, la molécula de colágeno en triple hélice mide 1,5 nm, la fibrilla 10-300 nm y la fibra 0,5-3 µm. Las opciones incorrectas intercambian estos valores entre niveles.","por_opcion":["❌ La triple hélice mide 1,5 nm. El rango de 10-300 nm corresponde a la fibrilla.","✅ La fibrilla de colágeno mide 10-300 nm de diámetro.","❌ La cifra de 1,5 nm es la de la molécula en triple hélice, no la de la fibra.","❌ El rango de 0,5-3 µm corresponde a la fibra, que es un haz de fibrillas."]},{"pregunta":"En el modelo de piel laxa Sagg/+ citado en el temario, ¿cuál es la alteración de base?","opciones":["Sobreexpresión de colágeno tipo I con fibrillas de diámetro muy reducido","Mutación del colágeno tipo V con haploinsuficiencia y fibrillas irregulares","Mutación de la elastina que suprime sus enlaces cruzados entre fibras","Déficit de fibronectina que impide la adhesión de fibroblastos dérmicos"],"correcta":1,"explicacion":"Christner et al. (2006) describen una mutación en el colágeno tipo V que causa haploinsuficiencia. Aparecen fibrillas de forma irregular y mayor diámetro, baja el contenido de colágeno y disminuyen las propiedades biomecánicas de la piel.","por_opcion":["❌ Hay menor contenido de colágeno y fibrillas de mayor diámetro, no sobreexpresión ni fibrillas finas.","✅ Coincide con el resumen del artículo incluido en el temario.","❌ El defecto está en el colágeno, no en la elastina.","❌ La fibronectina no interviene en este modelo."]},{"pregunta":"Al comparar la pared arterial con un tendón, ¿de qué depende principalmente la diferencia de elasticidad según el temario?","opciones":["Del número de cadenas de GAG unidas a cada proteína central","Del contenido de ácido hialurónico de su sustancia fundamental","Del grado de calcificación alcanzado por su sustancia fundamental","De la proporción entre fibras de colágeno y fibras elásticas"],"correcta":3,"explicacion":"El temario afirma que la elasticidad de un tejido depende principalmente de la ratio fibras de colágeno/fibras elásticas. Las arterias son ricas en elastina, cuyos enlaces cruzados permiten estirarse y recuperarse. Los tendones son ricos en colágeno, rígido y resistente a la tracción.","por_opcion":["❌ Las cadenas de GAG influyen en la hidratación y la resistencia a la presión, no en la elasticidad.","❌ El ácido hialurónico da viscosidad a la matriz, no elasticidad.","❌ La calcificación de la sustancia fundamental es propia del hueso y no explica la diferencia entre arteria y tendón.","✅ Afirmación literal del temario."]},{"pregunta":"Una célula presenta en su membrana una molécula señal anclada que solo activa a la célula adyacente en contacto directo. ¿Qué tipo de señalización es?","opciones":["Paracrina","Endocrina","Autocrina","Yuxtacrina"],"correcta":3,"explicacion":"Cuando la célula emisora expone la señal en su superficie, solo influye en células en contacto estrecho: es la señalización yuxtacrina. En el esquema del temario aparece como estímulo anclado a la membrana.","por_opcion":["❌ En la paracrina la señal se secreta y difunde hacia células vecinas, sin necesidad de contacto directo.","❌ En la endocrina la señal viaja por un vaso sanguíneo hasta células lejanas.","❌ En la autocrina la señal actúa sobre la propia célula que la emite.","✅ Señal anclada a la membrana con contacto célula-célula: señalización yuxtacrina."]},{"pregunta":"Una hormona esteroidea circula por la sangre hasta su célula diana. ¿Qué secuencia es coherente con el temario?","opciones":["Se une a un receptor de superficie porque, al ser hidrofílica, no atraviesa la bicapa","Viaja libre en plasma, se une a un receptor transmembrana y no entra en la célula","Viaja con una proteína transportadora, atraviesa la membrana y se une a un receptor intracelular","Se expone en la membrana de la célula emisora y activa por contacto a la célula diana"],"correcta":2,"explicacion":"Los ligandos pequeños e hidrofóbicos, como los esteroides, viajan unidos a una proteína transportadora. Después atraviesan la membrana y se unen a receptores intracelulares. Los receptores de superficie transmembrana son propios de las moléculas hidrofílicas.","por_opcion":["❌ Los esteroides son hidrofóbicos, no hidrofílicos.","❌ Describe el comportamiento de un ligando hidrofílico con receptor de superficie, no el de un esteroide.","✅ Ligando hidrofóbico: proteína transportadora, paso a través de la membrana y receptor intracelular.","❌ Describe la señalización yuxtacrina, incompatible con una hormona circulante."]},{"pregunta":"La acetilcolina induce respuestas distintas en diversos tejidos. ¿Qué emparejamiento es correcto según el temario?","opciones":["Músculo cardíaco: menor frecuencia e intensidad; glándula salival: secreción","Músculo cardíaco: aumento de frecuencia; músculo esquelético: contracción","Glándula salival: inhibición de la secreción; músculo cardíaco: contracción","Músculo esquelético: relajación; glándula salival: secreción aumentada"],"correcta":0,"explicacion":"Ante la acetilcolina, el músculo cardíaco disminuye la frecuencia e intensidad de la contracción, la glándula salival secreta y el músculo esquelético se contrae. La señal es la misma, pero la proteína receptora y la célula diana difieren.","por_opcion":["✅ Ambas respuestas coinciden con el esquema del temario.","❌ En el corazón la acetilcolina disminuye la frecuencia, no la aumenta.","❌ En la glándula salival provoca secreción, no inhibición, y en el corazón frena la contracción.","❌ En el músculo esquelético la acetilcolina produce contracción, no relajación."]},{"pregunta":"Según el modelo de combinaciones de señales del temario, ¿qué le ocurre a una célula privada de todas las señales extracelulares?","opciones":["Entra en proliferación al perder la inhibición externa","Permanece quiescente, sobreviviendo sin dividirse","Muere por apoptosis al faltarle señales de supervivencia","Se diferencia por defecto hacia su linaje de origen"],"correcta":2,"explicacion":"En el modelo, las señales A, B y C permiten sobrevivir. Añadir D y E induce crecimiento y división, y añadir F y G induce diferenciación. Sin ninguna señal, la célula muere por apoptosis.","por_opcion":["❌ La proliferación requiere señales D y E además de las de supervivencia.","❌ Sobrevivir también requiere señales (A, B y C).","✅ En ausencia de señales la célula entra en apoptosis.","❌ La diferenciación requiere señales específicas adicionales (F y G)."]},{"pregunta":"¿Cuál es el orden correcto de los pasos básicos de una cascada de señalización según el temario?","opciones":["Captación, transducción, activación del receptor, respuesta, activación de efectoras","Activación del receptor, captación, activación de efectoras, transducción, respuesta","Transducción, captación, activación del receptor, activación de efectoras, respuesta","Captación, activación del receptor, transducción, activación de efectoras, respuesta"],"correcta":3,"explicacion":"La cascada empieza con la captación de la señal y sigue con la activación del receptor. Después viene la transducción al interior mediante proteínas señalizadoras intracelulares, la activación de las proteínas efectoras y, por último, la respuesta o cambio en la célula.","por_opcion":["❌ La transducción ocurre tras activarse el receptor, y la respuesta es siempre el último paso.","❌ El receptor no puede activarse antes de captar la señal, y la transducción precede a la activación de las efectoras.","❌ La transducción no puede preceder a la captación de la señal.","✅ Coincide con el orden del temario."]},{"pregunta":"¿Cuál de las siguientes NO es una función atribuida a la sustancia fundamental amorfa en el temario?","opciones":["Anclar y comunicar células","Almacenar agua","Proporcionar forma","Resistir la tracción"],"correcta":3,"explicacion":"El temario atribuye a la sustancia fundamental tres funciones: almacenar agua, proporcionar forma y anclar y comunicar las células. Su aporte mecánico es la resistencia a la presión. La resistencia a la tracción corresponde a las fibras, sobre todo al colágeno.","por_opcion":["❌ Anclar y comunicar las células sí figura entre sus funciones, mediante las glucoproteínas de adhesión.","❌ Almacenar agua sí es una función de la sustancia fundamental, gracias a la carga negativa de los GAGs.","❌ Proporcionar forma sí figura entre sus funciones.","✅ La resistencia a la tracción corresponde a las fibras; el gel resiste la presión."]}],"asignatura":"Biología celular y tisular","tema":3,"fecha":"2026-11-04","resumen":["La **matriz extracelular (MEC)** es una red estructural compleja que rodea las células y les da **soporte estructural y metabólico**. Está formada por **fibroblastos**, **proteínas fibrosas (colágeno y elastina)** y **sustancia fundamental amorfa**, y su composición **varía según el tejido**.","Las fibras y el gel resisten fuerzas distintas: el **colágeno resiste la tracción** (tendones), la **elastina da elasticidad** gracias a sus enlaces cruzados (arterias) y la **sustancia fundamental resiste la presión** (cartílago). La elasticidad de un tejido depende de la **proporción colágeno/fibras elásticas**.","Los **GAGs** tienen **carga negativa** (sulfato y carboxilo) que atrae **cationes como el Na+**; estos arrastran **grandes volúmenes de agua** y la matriz hidratada se opone a la compresión, función que se pierde en el cartílago con **artrosis**.","Los **proteoglicanos** son una proteína central con GAGs sulfatados unidos de forma **covalente** (**90-95 % de hidratos de carbono**). El **ácido hialurónico** es el único GAG que no forma proteoglicanos, pero se une a ellos de forma **no covalente** y forma agregados como el del **agrecán**. La **fibronectina** une MEC y células (cicatrización), la **laminina** forma la **lámina basal** y las **integrinas** conectan la MEC con el **citoesqueleto**.","La comunicación celular puede ser **endocrina, paracrina, autocrina o yuxtacrina**, y cada célula solo responde a las señales para las que **expresa receptores**. Por eso una misma señal (la **acetilcolina**) genera respuestas distintas, y una célula privada de señales muere por **apoptosis**."],"preguntate":[{"pregunta":"Define la matriz extracelular y enumera sus tres grandes componentes.","respuesta":"Es una red estructural compleja que rodea las células, se extiende desde la membrana plasmática y les da **soporte estructural y metabólico**. Sus componentes son las **células (fibroblastos)**, las **proteínas fibrosas (colágeno y elastina)** y la **sustancia fundamental amorfa** (GAGs, proteoglicanos, glucoproteínas de adhesión, agua e iones)."},{"pregunta":"Compara el colágeno, la elastina y la sustancia fundamental según la fuerza que resiste cada uno, con un tejido de ejemplo.","respuesta":"El **colágeno** resiste la **tracción** (tendón). La **elastina** permite el estiramiento con **recuperación de la forma** (arteria). La **sustancia fundamental** resiste la **presión o compresión** (cartílago articular)."},{"pregunta":"Explica cómo se construye un agregado de agrecán, distinguiendo los dos tipos de unión implicados.","respuesta":"Las cadenas de GAG sulfatados (condroitín y queratán sulfato) se unen **covalentemente** a una proteína central y forman el proteoglicano agrecán. Muchos agrecanes se unen después de forma **no covalente**, mediante **proteínas de enlace**, a una larga molécula de **ácido hialurónico**, y así se forma un agregado del orden de **1 µm**."},{"pregunta":"¿En qué se diferencian las unidades repetidas del ácido hialurónico y del condroitín sulfato?","respuesta":"El **ácido hialurónico** está formado por ácido glucurónico + **N-acetilglucosamina**, sin sulfato. El **condroitín sulfato** está formado por ácido glucurónico + **N-acetilgalactosamina** con grupo **sulfato (SO3−)**."},{"pregunta":"Un paciente con artrosis de rodilla tiene el cartílago desgastado. ¿Por qué pierde capacidad de amortiguar y por qué se le prescriben cargas intermitentes moderadas?","respuesta":"Al perder la matriz rica en **proteoglicanos**, el cartílago retiene menos agua y **transmite la carga al hueso subcondral**. Como es **avascular**, se nutre por difusión: la compresión y la descompresión intermitentes facilitan el **intercambio de líquido** y favorecen su nutrición."},{"pregunta":"¿Por qué las integrinas no deben considerarse proteínas de la matriz como la fibronectina o la laminina, y qué papel tienen en fisioterapia?","respuesta":"Porque no se secretan al gel: son **receptores transmembrana** que **conectan la MEC con el citoesqueleto**. Son la base de la **mecanotransducción**, por la que las cargas terapéuticas se convierten en señales que modifican la síntesis de matriz."},{"pregunta":"¿Qué función cumple la fibronectina en la reparación de una lesión de tejido blando?","respuesta":"Actúa como **puente entre la MEC y las células** y facilita su **adhesión y migración**. Sirve de **andamio** por el que las células migran hacia la herida durante la **cicatrización**."},{"pregunta":"¿Qué es la lámina basal, de qué está formada y qué estructuras no epiteliales envuelve?","respuesta":"Es una lámina de moléculas de matriz, formada por **laminina**, esencial para **sostener los epitelios**. También envuelve las **fibras musculares** y se sitúa en el **glomérulo renal**, entre el endotelio y el epitelio."},{"pregunta":"Diferencia la señalización endocrina, la paracrina y la autocrina según su célula diana.","respuesta":"La **endocrina** actúa sobre células lejanas a través de la **sangre** (hormonas). La **paracrina** actúa sobre **células vecinas** (citocinas, NO, neurotransmisores). La **autocrina** actúa sobre la **propia célula emisora**."},{"pregunta":"Si en el medio extracelular hay cientos de señales, ¿por qué cada célula solo responde a unas pocas y cómo se decide su destino?","respuesta":"Porque cada célula **solo expresa los receptores necesarios** para su función. Como posee **diversos receptores**, la **combinación de señales** que recibe decide si sobrevive, crece y se divide, se diferencia o muere."}]}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
