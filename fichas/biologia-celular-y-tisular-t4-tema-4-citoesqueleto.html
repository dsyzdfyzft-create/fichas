<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tema 4. Citoesqueleto · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>

<script id="datos" type="application/json">{"titulo":"Tema 4. Citoesqueleto","subtitulo":"Red dinámica de polímeros proteicos (microtúbulos, filamentos intermedios y microfilamentos) que da forma a la célula, organiza su interior, transporta orgánulos y genera movimiento y contracción.","objetivos":["Al terminar, sabrás diferenciar los tres componentes del citoesqueleto por su subunidad, diámetro, polaridad, dinámica, proteínas motoras y función principal.","Al terminar, sabrás explicar la estructura del microtúbulo (heterodímero α/β, 13 protofilamentos, extremos + y −) y su dinámica basada en la concentración crítica y el GTP.","Al terminar, sabrás describir la organización de cilios, flagelos y centriolos (9+2, 9+0, 9 tripletes) e identificar cada nivel en un corte transversal.","Al terminar, sabrás relacionar cada tipo de filamento intermedio con su tejido y entender por qué estos filamentos aportan resistencia mecánica.","Al terminar, sabrás explicar la estructura de la actina (G y F) y de la miosina II, y el papel de las proteínas accesorias y motoras."],"ideas_clave":["El citoesqueleto es una **red de filamentos proteicos** que recorre todo el citoplasma, mantiene su volumen (clave en células animales, sin pared celular) y se **reorganiza rápidamente** al cambiar de forma, dividirse o responder a estímulos.","Sus tres componentes son **polímeros de subunidades unidas por enlaces débiles no covalentes**: microtúbulos (**25 nm**), filamentos intermedios (**8-10 nm**) y microfilamentos de actina (**7 nm**; 8 nm en la tabla de Karp).","Funciones de referencia: **microtúbulos** = posición de orgánulos y transporte intracelular; **filamentos intermedios** = fuerza y resistencia al estrés mecánico; **microfilamentos** = forma de la superficie celular y locomoción.","Microtúbulo = cilindro hueco y rígido de **13 protofilamentos** paralelos de heterodímeros **α/β-tubulina**; es **polar**: el extremo **+** (expone β) suele crecer y el extremo **−** se despolimeriza.","La **concentración crítica** es aquella en la que ganancia y pérdida de subunidades se igualan: por encima polimeriza, por debajo despolimeriza. Los microtúbulos nacen en los **MTOC** (p. ej., centrosoma).","Microtúbulos **lábiles** (huso mitótico) frente a **estables** (centriolos, cilios, flagelos). Axonema **9 dobletes + 2 centrales**; zona de transición **9 dobletes sin par central**; cuerpo basal y centriolo **9 tripletes**.","Filamentos intermedios: los **más estables**, sin polaridad ni proteínas motoras; tipos: **neurofilamentos** (neuronas), **queratina** (epitelio), **desmina** (músculo liso y estriado) y **vimentina** (alrededor del núcleo).","Actina G → actina F (dos cadenas enrolladas, polar: + rápido, − lento). **Miosina II**: 2 cadenas pesadas (cabezas con actividad ATPasa), cadenas ligeras (cuello), 2 α-hélices (cola). El batido de cilios y flagelos depende de **microtúbulos, sin actina-miosina**."],"secciones":[{"id":"introduccion","titulo":"1. Introducción: qué es el citoesqueleto y cómo se forman los filamentos","bloques":[{"tipo":"definicion","termino":"Citoesqueleto","texto":"**Red de filamentos de proteína** que se extiende por todo el citoplasma de las células eucariotas. Es una estructura **altamente dinámica** que se reorganiza rápidamente cuando la célula cambia de forma, se divide o responde a estímulos extracelulares."},{"tipo":"parrafo","texto":"Su estructura ayuda a **mantener el gran volumen del citoplasma**, algo especialmente importante en las **células animales**, que carecen de pared celular: el citoesqueleto hace de armazón interno donde la célula vegetal tiene un soporte externo rígido. En las imágenes de inmunofluorescencia del tema, la **tubulina (microtúbulos) se marca en verde**, la **actina (microfilamentos) en rojo** y el **núcleo en azul**."},{"tipo":"parrafo","texto":"El tema plantea una paradoja: una célula de unos **10 µm de diámetro** está organizada espacialmente por proteínas unas **20.000 veces más pequeñas**. La solución es el **mecanismo de polimerización**: centenares de subunidades se unen formando **polímeros lineales de longitud suficiente** para recorrer toda la célula. Al estar las subunidades unidas por **enlaces débiles no covalentes**, el polímero puede crecer o desmontarse con rapidez, lo que explica que sea a la vez resistente y dinámico."},{"tipo":"alerta","texto":"No confundas **10 µm** (diámetro aproximado de la célula) con los **nanómetros** de los filamentos (25, 8-10 y 7 nm). El factor de diferencia citado es **20.000 veces**."}]},{"id":"componentes","titulo":"2. Componentes del citoesqueleto","bloques":[{"tipo":"parrafo","texto":"Los tres sistemas de filamentos comparten un principio común: son **polímeros de subunidades proteicas unidas por enlaces débiles no covalentes**, que **se ensamblan y desensamblan** bajo una fina y compleja regulación celular. Sin embargo, cada uno tiene **propiedades mecánicas, dinámicas y funciones biológicas distintas**."},{"tipo":"tarjetas","items":[{"etiqueta":"25 nm","titulo":"Microtúbulos","texto":"Determinan las **posiciones de los orgánulos rodeados de membrana** y dirigen el **transporte intracelular**. Subunidad: heterodímero α/β-tubulina."},{"etiqueta":"8-10 nm","titulo":"Filamentos intermedios","texto":"Proporcionan **fuerza y resistencia al estrés mecánico**. Son los más estables."},{"etiqueta":"7 nm","titulo":"Microfilamentos","texto":"Determinan la **forma de la superficie celular** y son necesarios para la **locomoción**. Subunidad: actina G."}]},{"tipo":"tabla","titulo":"Comparativa de los tres componentes (PDF + tabla de Karp, 5ª ed.)","columnas":["Característica","Microtúbulos","Filamentos intermedios","Filamentos de actina"],"filas":[["Subunidad incorporada","Heterodímero GTP-αβ-tubulina","Varias proteínas (monómeros fibrosos en el PDF; globulares en la tabla de Karp)","Monómeros de ATP-actina"],["Sitio preferente de incorporación","Extremo + (tubulina β)","Interno","Extremo + (barbado)"],["Polaridad","Sí","No","Sí"],["Actividad enzimática","GTPasa","Ninguna","ATPasa"],["Proteínas motoras","Cinesinas (quinesinas) y dineínas","Ninguna","Miosinas"],["Proteínas relacionadas principales","MAP","Plaquinas","Proteínas de unión a actina"],["Estructura","Tubo rígido y hueco","Fibras gruesas similares a cuerdas","Filamento helicoidal flexible"],["Diámetro","25 nm (pared 5 nm)","8-10 nm (10 nm en Karp)","7 nm (8 nm en Karp)"],["Distribución","Todos los eucariotas","Animales","Todos los eucariotas"],["Funciones principales","Soporte, transporte intracelular, organización celular","Soporte estructural","Movilidad, contractilidad"]]},{"tipo":"alerta","texto":"El PDF da cifras ligeramente distintas según la diapositiva: actina **7 nm** (introducción) frente a **8 nm** (tabla de Karp); filamentos intermedios **8-10 nm** frente a **10 nm** (Karp) u **8-12 nm** (figura). En el examen, lo seguro es el **orden**: microtúbulo (el más grueso) > filamento intermedio > actina (el más fino)."},{"tipo":"alerta","texto":"Trampa frecuente: los filamentos intermedios **no tienen polaridad ni proteínas motoras** y **solo existen en animales** según Karp; microtúbulos y actina están en **todos los eucariotas**."},{"tipo":"figura","pagina":33,"pie":"Tabla comparativa de Karp: memoriza fila a fila subunidad, sitio de incorporación, polaridad, actividad enzimática (GTPasa/ninguna/ATPasa), motores (cinesinas-dineínas/ninguno/miosinas) y distribución. Es la tabla más examinable del tema.","src":"img/biologia-celular-y-tisular-t4-tema-4-citoesqueleto-p33.jpg"}]},{"id":"microtubulos-estructura","titulo":"3. Microtúbulos: estructura y polaridad","bloques":[{"tipo":"lista","items":["**Cilindros huecos** de **25 nm de diámetro** y **pared de 5 nm** de grosor.","**Longitud variable**: desde décimas de micra hasta varias micras.","Pueden ser **rectos o presentar un gran ángulo de curvatura**."]},{"tipo":"parrafo","texto":"La unidad básica es la **tubulina**, un **heterodímero** de **tubulina α + tubulina β** unidas íntimamente por **enlaces no covalentes**. Los heterodímeros se unen **cabeza (β) con cola (α)**, alternando α y β, y forman los **protofilamentos**. **13 protofilamentos paralelos** se asocian lateralmente y cierran una estructura **cilíndrica, rígida y hueca**: el microtúbulo."},{"tipo":"esquema","titulo":"Jerarquía de ensamblaje del microtúbulo","mermaid":"flowchart TD\n  A[\"Tubulina α + tubulina β\"] -->|\"enlaces no covalentes\"| B[\"Heterodímero de tubulina\"]\n  B -->|\"unión cabeza β con cola α\"| C[\"Protofilamento\"]\n  C -->|\"13 protofilamentos paralelos\"| D[\"Microtúbulo hueco de 25 nm\"]\n  D --> E[\"Extremo + expone β\"]\n  D --> F[\"Extremo − expone α\"]","pie":"De la subunidad al polímero: la unión siempre en el mismo sentido (β con α) hace que el microtúbulo sea polar, con β expuesta en el extremo + y α en el extremo −."},{"tipo":"parrafo","texto":"**¿Cómo se estabiliza?** Por dos tipos de contactos: (1) **longitudinales**, unión de la cabeza de una subunidad β con la cola de una subunidad α; (2) **laterales**, entre **subunidades iguales** de protofilamentos vecinos (α con α, β con β). Como todos los dímeros se orientan igual, en un extremo quedan expuestas las subunidades α y en el otro las β: **estructura diferencial polarizada**, con un **extremo (+)** y un **extremo (−)**."},{"tipo":"alerta","texto":"Los contactos **laterales** se dan entre subunidades **iguales** (α-α, β-β), no entre α y β. Y el extremo **+** es el que expone **tubulina β** (tabla de Karp: sitio preferente de incorporación = extremo + (tubulina β))."},{"tipo":"figura","pagina":7,"pie":"Estructura del microtúbulo: observa el paso heterodímero → protofilamento → microtúbulo de 13 protofilamentos, el corte transversal circular hueco y la alternancia de α (roja) y β (amarilla) en el modelo 3D.","src":"img/biologia-celular-y-tisular-t4-tema-4-citoesqueleto-p7.jpg"}]},{"id":"microtubulos-labiles","titulo":"3a. Microtúbulos lábiles: dinámica, MAPs y MTOC","bloques":[{"tipo":"tabla","titulo":"Los dos tipos de microtúbulos","columnas":["Rasgo","Microtúbulos lábiles","Microtúbulos estables"],"filas":[["Disposición","Agrupados paralelamente entre ellos","Asociados formando estructuras complejas"],["Origen","Se originan en el MTOC (p. ej., centrosoma)","Forman ellos mismos estructuras como el centriolo, que actúa de MTOC"],["Estructuras que forman","Huso mitótico (acromático)","Centriolos, cilios y flagelos"],["Dinámica","Ganan y pierden subunidades constantemente","Permanentes, organizados geométricamente"]]},{"tipo":"parrafo","texto":"Los extremos del microtúbulo lábil **ganan y pierden subunidades constantemente**. La **velocidad** de ganancia o pérdida depende de la **concentración de subunidades libres**. Existe una concentración en la que ganancia y pérdida ocurren a la misma velocidad: la **concentración crítica**. En condiciones habituales, **el extremo + suele polimerizarse (crece) y el extremo − se despolimeriza (desaparece)**."},{"tipo":"definicion","termino":"Concentración crítica","texto":"Concentración de subunidades libres de tubulina en la que la **ganancia y la pérdida de subunidades se dan a la misma velocidad**. Por encima → el microtúbulo **polimeriza**; por debajo → **despolimeriza**."},{"tipo":"esquema","titulo":"Decisión polimerizar/despolimerizar según la concentración crítica","mermaid":"flowchart TD\n  A[\"Dímeros de tubulina libres\"] --> B[\"Comparar con la concentración crítica\"]\n  B -->|\"Superior\"| C[\"Polimerización: el microtúbulo crece\"]\n  B -->|\"Igual\"| D[\"Ganancia igual a pérdida\"]\n  B -->|\"Inferior\"| E[\"Despolimerización: el microtúbulo se acorta\"]\n  C --> F[\"Crece sobre todo el extremo +\"]\n  E --> G[\"Pierde subunidades, típicamente por el extremo −\"]","pie":"La longitud neta del microtúbulo depende de la concentración de subunidades libres respecto a la concentración crítica."},{"tipo":"parrafo","texto":"La figura de la diapositiva añade el papel del **GTP**: el **dímero-GTP** se incorpora en el extremo + formando un **casquete de GTP** (frente de polimerización); tras incorporarse, el GTP se hidroliza a GDP liberando Pi (frente de hidrólisis). El **dímero-GDP** liberado se recarga con GTP. Mientras se mantiene el casquete de GTP el microtúbulo crece; cuando se pierde, los protofilamentos se abren y el microtúbulo **decrece**. Por eso la tabla de Karp asigna a los microtúbulos **actividad GTPasa**."},{"tipo":"figura","pagina":10,"pie":"Inestabilidad dinámica: compara el microtúbulo en crecimiento (casquete de GTP en el extremo +, frentes de polimerización e hidrólisis) con el microtúbulo en decrecimiento (protofilamentos curvados que se separan) y el ciclo dímero-GDP ⇄ dímero-GTP.","src":"img/biologia-celular-y-tisular-t4-tema-4-citoesqueleto-p10.jpg"},{"tipo":"parrafo","texto":"**Alargamiento o acortamiento total.** Los microtúbulos son **relativamente inertes**: no interaccionan directamente con otras estructuras celulares. Su crecimiento y organización los controlan las **proteínas asociadas a los microtúbulos o MAPs** (*microtubule associated proteins*), la mayoría de las cuales **interaccionan con el extremo más**, **favoreciendo o inhibiendo el crecimiento**. Un ejemplo destacado es la **katanina**, que **rompe (secciona) los microtúbulos**. La figura muestra además la espastina (corte), SCG10/estatmina (despolimerización, catástrofe), +TIPs y CRMP-2 en el extremo +, y los procesos de **catástrofe** y **rescate**."},{"tipo":"perla","texto":"Relevancia neurológica: según el tema, **mutaciones en un gen concreto de la tubulina β** producen un tipo de **parálisis ocular por hipoplasia del nervio oculomotor**, y **numerosas enfermedades neurológicas** se asocian a mutaciones en diferentes genes de tubulina (el tema ilustra la **ELA**). Para el fisioterapeuta neurológico, entender que el transporte axonal depende de microtúbulos ayuda a comprender por qué la neurona motora, con axones muy largos, es tan vulnerable."},{"tipo":"alerta","texto":"El par craneal citado es el **nervio oculomotor** (III par), no el nervio óptico. Y la mutación es de **tubulina β**, no de un filamento intermedio."},{"tipo":"parrafo","texto":"**¿Dónde se forman? En los MTOC.** Los dímeros de tubulina del citosol **no son suficientes para la formación espontánea** de microtúbulos; necesitan un punto de nucleación. Los **MTOC** (*microtubule organizing centers*) son los centros organizadores donde **comienza la polimerización**. El ejemplo típico es el **centrosoma**, formado por microtúbulos estables (un **par de centriolos**, cada uno de **9 tripletes**, rodeados de **material pericentriolar** con anillos de **γ-tubulina**). El centrosoma **determina el número, la localización y la orientación** de los microtúbulos citoplasmáticos; en la figura, el extremo − queda en el anillo de γ-tubulina y el extremo + hacia la periferia."},{"tipo":"alerta","texto":"Paradoja típica de examen: el **centrosoma está formado por microtúbulos estables** (centriolos), pero **origina microtúbulos lábiles** (huso mitótico/acromático)."}]},{"id":"microtubulos-estables","titulo":"3b. Microtúbulos estables: cilios, flagelos y centriolos","bloques":[{"tipo":"definicion","termino":"Cilios y flagelos","texto":"**Proyecciones celulares que contienen microtúbulos y están limitadas por membrana plasmática.** La célula los utiliza para **desplazarse**, para **remover el medio que la rodea** o como **estructuras sensoriales**."},{"tipo":"parrafo","texto":"Ambos tienen **tres partes**: el **eje o axonema**, que permite el movimiento gracias a su **flexión** y está formado por microtúbulos paralelos a su eje longitudinal con una **disposición geométrica muy precisa**; la **zona de transición**; y el **corpúsculo basal, cuerpo basal o kinetosoma**."},{"tipo":"esquema","titulo":"Organización de un cilio o flagelo desde la punta a la base","mermaid":"flowchart TD\n  A[\"Axonema: 9 dobletes + 2 centrales\"] --> B[\"Zona de transición: 9 dobletes sin par central\"]\n  B --> C[\"Placa basal: origina el par central\"]\n  B --> D[\"Cuerpo basal o kinetosoma: 9 tripletes\"]\n  D --> E[\"Raíces ciliares: anclaje al citoesqueleto\"]\n  D --> F[\"Similar al centriolo\"]","pie":"Recorrido de un corte longitudinal: el número de microtúbulos por unidad periférica pasa de 2 (dobletes) a 3 (tripletes) en la base, y el par central desaparece por debajo de la placa basal."},{"tipo":"tabla","titulo":"Qué se ve en un corte transversal de cada nivel","columnas":["Nivel","Patrón","Detalles examinables"],"filas":[["Axonema","9 dobletes externos + 2 túbulos centrales (9+2)","Par central rodeado por la vaina central; los túbulos A y B de cada doblete comparten longitudinalmente parte de su pared"],["Zona de transición","9 dobletes sin par central","Entre cuerpo basal y axonema; contiene la placa basal, que forma el par central"],["Cuerpo basal (kinetosoma)","9 tripletes, sin par central","En la base, bajo la membrana plasmática; de él polimerizan los microtúbulos del axonema; se une al citoesqueleto por radios o raíces ciliares"],["Centriolo","9 tripletes","Los tripletes (A, B, C) comparten longitudinalmente parte de su pared; siempre en pareja y perpendiculares"]]},{"tipo":"lista","items":["Elementos que aseguran la estructura del axonema: la **vaina central**.","Los **puentes** entre túbulos A y B de dobletes vecinos (puentes de **nexina** en las figuras).","Las **fibras radiales** (espinas radiales) que unen los dobletes con la vaina central.","En las figuras aparecen además los **brazos externo e interno de dineína** sobre el túbulo A."]},{"tipo":"figura","pagina":15,"pie":"Cilio/flagelo: localiza las tres partes (axonema, zona de transición con la placa basal y cuerpo basal con raíces ciliares) y, en el corte del axonema, los dobletes A-B, brazos de dineína, puentes de nexina, espinas radiales y par central.","src":"img/biologia-celular-y-tisular-t4-tema-4-citoesqueleto-p15.jpg"},{"tipo":"alerta","texto":"No confundas las **fibras radiales** (unen los dobletes del axonema con la vaina central) con los **radios o raíces ciliares** (anclan la parte interna del cuerpo basal al citoesqueleto)."},{"tipo":"parrafo","texto":"**Centriolos.** Están **siempre en la célula animal** y **siempre son dos estructuras cilíndricas perpendiculares** entre sí. Cada uno tiene **9 tripletes de microtúbulos** que comparten longitudinalmente parte de su pared. Se sitúan **cerca del núcleo**, rodeados de un **hialoplasma espeso**, y juntos se denominan **centrosoma**. A partir del centrosoma se origina el **huso acromático** (de microtúbulos lábiles), imprescindible en la división celular: por eso el centrosoma **es un MTOC**."},{"tipo":"perla","texto":"El batido ciliar del epitelio respiratorio mueve el moco hacia la faringe. Si el axonema es defectuoso, el aclaramiento mucociliar falla y se acumulan secreciones: es la base de la fisioterapia respiratoria con técnicas de drenaje y aclaramiento bronquial (complemento)."}]},{"id":"filamentos-intermedios","titulo":"4. Filamentos intermedios","bloques":[{"tipo":"parrafo","texto":"Se llaman así por su **diámetro de 8-10 nm**, **intermedio entre los filamentos de actina** (más finos) y **los de miosina** (más gruesos). Son las **estructuras más estables** del citoesqueleto: no están formados por subunidades que se ensamblen y desensamblen continuamente. Su función es **principalmente estructural**: **proporcionan fuerza y resistencia al estrés mecánico**, gracias a su organización en forma de **cuerda** (varias hebras retorcidas que reparten la tensión)."},{"tipo":"alerta","texto":"La comparación del nombre se hace con **actina y miosina**, no con los microtúbulos. Pregunta trampa clásica: el filamento intermedio es más grueso que la actina y más fino que el filamento de miosina."},{"tipo":"tabla","titulo":"Tipos de filamentos intermedios","columnas":["Tipo","Localización / papel según el tema"],"filas":[["Neurofilamentos","Mantienen la forma de las neuronas"],["Queratina","Tejido epitelial"],["Desmina","Células musculares, tanto lisas como estriadas"],["Vimentina","Se disponen alrededor del núcleo y lo mantienen en su sitio"]]},{"tipo":"parrafo","texto":"**Composición y ensamblaje.** El **monómero** es una molécula alargada con los **extremos plegados**, formada (según el PDF) por **3 cadenas polipeptídicas** que se enrollan en hélice. Dos monómeros forman un **dímero paralelo** (misma dirección); dos dímeros se asocian de forma **antiparalela** formando un **tetrámero**. Los tetrámeros se alinean **extremo con extremo** formando un **protofilamento**, y **8 protofilamentos** se asocian para formar el **filamento** (en la figura, ocho tetrámeros retorcidos en un filamento tipo cuerda de 10 nm)."},{"tipo":"esquema","titulo":"Ensamblaje del filamento intermedio","mermaid":"flowchart LR\n  A[\"Monómero alargado\"] -->|\"2 en paralelo\"| B[\"Dímero\"]\n  B -->|\"2 dímeros antiparalelos\"| C[\"Tetrámero\"]\n  C -->|\"extremo con extremo\"| D[\"Protofilamento\"]\n  D -->|\"8 protofilamentos\"| E[\"Filamento intermedio tipo cuerda\"]","pie":"El tetrámero antiparalelo es la clave: anula la orientación de los dímeros, por eso el filamento intermedio carece de polaridad y de proteínas motoras."},{"tipo":"figura","pagina":22,"pie":"Ensamblaje del filamento intermedio: sigue monómero (extremos N y C plegados) → dímero → tetrámero → protofilamento → filamento, y la imagen de ocho tetrámeros retorcidos en un filamento de 10 nm.","src":"img/biologia-celular-y-tisular-t4-tema-4-citoesqueleto-p22.jpg"},{"tipo":"alerta","texto":"Compara números: microtúbulo = **13 protofilamentos** de heterodímeros; filamento intermedio = **8 protofilamentos** de tetrámeros. Dímeros **paralelos**, tetrámeros **antiparalelos** (no al revés)."},{"tipo":"perla","texto":"La **desmina** está en el músculo liso y estriado y la **queratina** en los epitelios: ambos tejidos soportan tracción y presión constantes, justo la función de resistencia al estrés mecánico de estos filamentos. Es útil para entender la tolerancia de piel y músculo a las cargas en terapia manual y ejercicio."}]},{"id":"microfilamentos","titulo":"5. Microfilamentos: actina y miosina","bloques":[{"tipo":"parrafo","texto":"En este tema, los microfilamentos se presentan como filamentos formados por **centenares de moléculas** que forman **polímeros lineales de longitud suficiente**, e incluyen **filamentos de actina** y **filamentos de miosina**, que actúan conjuntamente."},{"tipo":"definicion","termino":"Actina G / actina F","texto":"**Actina G**: monómero globular. **Actina F**: filamento formado por la polimerización de actina G en **dos cadenas enrolladas a modo de dos collares de perlas**."},{"tipo":"parrafo","texto":"El filamento de actina tiene **polaridad**: el **extremo (−) crece despacio** y el **extremo (+) crece rápido** (extremo barbado en Karp). Según la figura, la actina G se **activa uniéndose a ATP**, forma un **oligómero estable (nucleación)**, se **ensambla** en el filamento y, dentro de él, el ATP se hidroliza a **actina-ADP** con liberación de Pi: de ahí la **actividad ATPasa** de la actina. Se organiza en dos tipos de estructuras: **haces** (filamentos paralelos unidos por proteínas de entrecruzamiento) y **redes** (filamentos entrecruzados en malla)."},{"tipo":"tabla","titulo":"Funciones de actina frente a miosina según el tema","columnas":["Filamentos de actina","Filamentos de miosina"],"filas":[["Contracción muscular (junto con la miosina)","Actividad contráctil"],["Formación de pseudópodos","Movimientos de desplazamiento durante la migración celular"],["Formación del anillo contráctil de la división celular","Citocinesis"],["Estructural: microvellosidades y uniones celulares","—"],["Soporte mecánico","—"]]},{"tipo":"parrafo","texto":"**Miosina.** Muy abundante en células musculares, donde junto con la actina produce la **contracción**. La **miosina II**, la más abundante en el tejido muscular, es una **proteína dimérica con 2 cabezas globulares y 1 larga cola**. Muchas moléculas de miosina II se unen **por las colas** formando un **filamento grueso** con las **cabezas hacia fuera**, que pueden **hidrolizar ATP** y así interactuar con la actina."},{"tipo":"tarjetas","items":[{"etiqueta":"Cabezas","titulo":"2 cadenas pesadas","texto":"Forman las dos cabezas globulares, con capacidad de hidrolizar ATP."},{"etiqueta":"Cuello","titulo":"Cadenas ligeras","texto":"Se sitúan en el cuello o región bisagra."},{"etiqueta":"Cola","titulo":"2 α-hélices","texto":"Enrolladas entre sí (*coiled-coil*); en la figura, unos 150 nm de longitud y 2 nm de grosor, terminando en el extremo C-terminal."}]},{"tipo":"perla","texto":"En la sarcómera (figura del tema) la miosina ocupa la **banda A**, con la **zona H** y la **línea M** en el centro; la actina se ancla en las **líneas Z** y ocupa la **banda I**. La mayor parte del movimiento eucariota se debe al **deslizamiento de miosina sobre actina**: es la base celular de toda la contracción que el fisioterapeuta evalúa y entrena."},{"tipo":"alerta","texto":"La **cola** de la miosina II la forman **2 α-hélices**, el **cuello** las **cadenas ligeras** y las **cabezas** las **2 cadenas pesadas**. Intercambiar estas asignaciones es la trampa más típica."}]},{"id":"proteinas-accesorias","titulo":"6. Proteínas accesorias","bloques":[{"tipo":"parrafo","texto":"Las proteínas accesorias **unen los filamentos al resto de componentes celulares**, **controlando la polimerización-despolimerización** de las subunidades. Gracias a ellas el citoesqueleto es una estructura **muy organizada pero flexible**. Las proteínas **motoras** se **unen a un filamento polarizado**, **hidrolizan ATP** y aprovechan la energía para **desplazarse a lo largo del filamento**, transportando su carga (por ejemplo, una vesícula unida a un receptor para la proteína motora)."},{"tipo":"lista","items":["Criterios de clasificación: **tipo de filamento** al que se unen.","**Dirección** en la que se mueven.","**Cargamento** que llevan consigo (orgánulos)."]},{"tipo":"tabla","titulo":"Proteínas motoras y su filamento","columnas":["Filamento","Proteínas motoras","Proteínas relacionadas"],"filas":[["Microtúbulos","Cinesinas (quinesinas) y dineínas","MAP"],["Filamentos de actina","Miosinas","Proteínas de unión a actina"],["Filamentos intermedios","Ninguna (no hay filamento polarizado)","Plaquinas"]]},{"tipo":"alerta","texto":"Las proteínas motoras necesitan un **filamento polarizado**: por eso los **filamentos intermedios, apolares, no tienen proteínas motoras**. Las motoras hidrolizan **ATP**; la GTPasa es propiedad de la tubulina, no del motor."}]},{"id":"funciones","titulo":"7. Funciones del citoesqueleto e ideas clave","bloques":[{"tipo":"lista","items":["Control de la **posición de las estructuras intracelulares**.","Control de la **forma celular**.","Control **transmembrana** de la organización intracelular.","**Movimientos celulares**.","**Contracción muscular**.","Participación en la **división celular**."]},{"tipo":"parrafo","texto":"Estudiar estas funciones es difícil por la **compleja relación entre los distintos filamentos y los cientos de proteínas accesorias**, relaciones que **no son fáciles de reproducir *in vitro***. La figura de Karp resume cuatro funciones: (1) **estructura y soporte**, (2) **transporte intracelular**, (3) **contractilidad y movilidad** y (4) **organización espacial**, ilustradas en una célula epitelial, una neurona y una célula en división."},{"tipo":"lista","items":["Constituyentes principales según las ideas clave: **filamentos de actina, microtúbulos y las proteínas motoras miosina, dineína y quinesina**.","Los filamentos de actina se fijan a la **membrana plasmática**, a la **envoltura nuclear** y a otras estructuras mediante diversas proteínas.","En eucariotas, gran parte de los movimientos se deben al **deslizamiento de miosina sobre actina**.","El movimiento de **cilios y flagelos** depende de **microtúbulos, sin necesidad de actina-miosina**.","Se piensa que todas las células actuales evolucionaron de un **único antecesor**."]},{"tipo":"alerta","texto":"Excepción clave: **no todo movimiento celular es actina-miosina**. El batido ciliar y flagelar es un mecanismo **microtubular** (con brazos de dineína en el axonema)."}]}],"caso_clinico":{"titulo":"Infecciones respiratorias de repetición en un joven con secreciones retenidas","presentacion":"Javier, 24 años, estudiante, es derivado a fisioterapia respiratoria por **bronquitis y neumonías de repetición desde la infancia**, tos productiva crónica y sinusitis. En estudios previos de fertilidad se observó **espermatozoides inmóviles**. La biopsia de mucosa nasal analizada con microscopía electrónica muestra, en cortes transversales de los cilios, el patrón 9+2 conservado pero **ausencia de los brazos de dineína** en los dobletes. El neumólogo sospecha una **discinesia ciliar primaria** (complemento).","preguntas":[{"pregunta":"¿Qué estructura celular está alterada y por qué explica a la vez los problemas respiratorios y la infertilidad?","respuesta":"Está alterado el **axonema**, formado por **microtúbulos estables** en patrón **9 dobletes + 2 centrales**. Cilios del epitelio respiratorio y flagelo del espermatozoide comparten esta misma arquitectura, por lo que un defecto de sus componentes (aquí los brazos de dineína, visibles en las figuras del tema) paraliza ambos: el cilio no remueve el moco y el flagelo no impulsa al espermatozoide. Es coherente con la definición del tema: cilios y flagelos sirven para **desplazarse** y para **remover el medio**."},{"pregunta":"Un compañero propone que el problema podría ser un fallo del sistema actina-miosina del cilio. ¿Es correcto?","respuesta":"No. Según las ideas clave, **el movimiento de cilios y flagelos se debe a microtúbulos, sin necesidad de actina-miosina**. El deslizamiento de miosina sobre actina explica la mayoría de movimientos eucariotas (contracción muscular, migración, citocinesis), pero el batido ciliar es una excepción microtubular cuyo motor son los **brazos de dineína**, una proteína motora de microtúbulos (tabla de Karp: cinesinas y dineínas)."},{"pregunta":"Si se cortara transversalmente la base de un cilio a distintos niveles, ¿qué patrones esperarías ver y qué implicación tiene para el tratamiento de fisioterapia?","respuesta":"Desde la punta: **axonema 9+2** (con vaina central, puentes entre dobletes y fibras radiales), **zona de transición con 9 dobletes sin par central** (y la placa basal, que forma el par central) y **cuerpo basal con 9 tripletes**, anclado al citoesqueleto por las raíces ciliares. Como el aclaramiento mucociliar está abolido, el fisioterapeuta debe **sustituir mecánicamente la función ciliar** con técnicas de aclaramiento bronquial, drenaje y tos asistida, de forma diaria y mantenida, ya que el defecto estructural es permanente (complemento)."}]},"glosario":[{"termino":"Citoesqueleto","definicion":"Red dinámica de filamentos proteicos que recorre el citoplasma y da forma, soporte, transporte y movimiento a la célula."},{"termino":"Heterodímero de tubulina","definicion":"Unidad formada por tubulina α y tubulina β unidas por enlaces no covalentes; se incorpora unida a GTP."},{"termino":"Protofilamento","definicion":"Cadena lineal de subunidades: heterodímeros alternando α y β en el microtúbulo (13 por microtúbulo) o tetrámeros extremo con extremo en el filamento intermedio (8 por filamento)."},{"termino":"Extremo + / extremo −","definicion":"Extremos de un filamento polar; en el microtúbulo el + expone β y suele crecer, el − expone α y se despolimeriza. En la actina el + crece rápido y el − despacio."},{"termino":"Concentración crítica","definicion":"Concentración de subunidades libres en la que la ganancia y la pérdida de subunidades se igualan."},{"termino":"MAPs","definicion":"Proteínas asociadas a los microtúbulos que controlan su crecimiento y organización, sobre todo actuando en el extremo +."},{"termino":"Katanina","definicion":"Proteína que rompe (secciona) los microtúbulos."},{"termino":"MTOC","definicion":"Centro organizador de microtúbulos donde comienza la polimerización; ejemplo: el centrosoma."},{"termino":"Centrosoma","definicion":"Par de centriolos perpendiculares rodeados de hialoplasma espeso (material pericentriolar), cerca del núcleo; origina el huso acromático."},{"termino":"Axonema","definicion":"Eje de cilios y flagelos con 9 dobletes externos y 2 túbulos centrales rodeados por una vaina central."},{"termino":"Cuerpo basal (kinetosoma)","definicion":"Estructura de 9 tripletes en la base del cilio/flagelo, bajo la membrana, a partir de la cual polimeriza el axonema."},{"termino":"Zona de transición","definicion":"Región entre cuerpo basal y axonema con 9 dobletes sin par central; contiene la placa basal que forma el par central."},{"termino":"Actina G / actina F","definicion":"Monómero globular de actina / filamento de dos cadenas enrolladas resultante de su polimerización."},{"termino":"Miosina II","definicion":"Proteína motora dimérica con 2 cabezas (cadenas pesadas, actividad ATPasa), cuello (cadenas ligeras) y cola de 2 α-hélices; forma filamentos gruesos."},{"termino":"Desmina","definicion":"Filamento intermedio de las células musculares lisas y estriadas."}],"fuentes":["Karp G. Biología celular y molecular. 5ª ed.","Solana Manrique C. Tema 4. Citoesqueleto. Biología Celular y Tisular, Grado en Fisioterapia, Universidad Europea, curso 2025-2026."],"qcm":[{"pregunta":"¿Qué combinación de características describe correctamente un microtúbulo según el temario?","opciones":["Diámetro de 25 nm, pared de 2 nm y 8 protofilamentos paralelos","Diámetro de 25 nm, pared de 5 nm y 13 protofilamentos paralelos","Diámetro de 8-10 nm, pared de 5 nm y 13 protofilamentos paralelos","Diámetro de 25 nm, pared de 5 nm y 9 protofilamentos paralelos"],"correcta":1,"explicacion":"El microtúbulo es un cilindro hueco de 25 nm de diámetro con pared de 5 nm, formado por 13 protofilamentos paralelos de heterodímeros α/β-tubulina. Las otras cifras pertenecen a otras estructuras: 8-10 nm es el filamento intermedio, 8 protofilamentos forman el filamento intermedio y 9 es el número de dobletes o tripletes de cilios y centriolos.","por_opcion":["❌ 8 protofilamentos forman el filamento intermedio; 2 nm es el grosor de la cola de miosina en la figura.","✅ Coincide exactamente con el temario: 25 nm de diámetro, 5 nm de pared y 13 protofilamentos.","❌ 8-10 nm es el diámetro del filamento intermedio, no del microtúbulo.","❌ El 9 corresponde a los dobletes del axonema o a los tripletes del centriolo, no a los protofilamentos del microtúbulo."]},{"pregunta":"En un experimento se diluye el medio de modo que la concentración de dímeros de tubulina libres queda por debajo de la concentración crítica. ¿Qué cabe esperar?","opciones":["Despolimerización neta, con acortamiento progresivo del microtúbulo","Crecimiento exclusivo por el extremo − hasta recuperar el equilibrio","Equilibrio estable en el que la longitud del microtúbulo no cambia","Polimerización neta, con crecimiento preferente por el extremo +"],"correcta":0,"explicacion":"La concentración crítica es aquella en la que ganancia y pérdida de subunidades se igualan. Si la concentración de subunidades libres es inferior, predomina la pérdida y el microtúbulo despolimeriza; si es superior, polimeriza.","por_opcion":["✅ Por debajo de la concentración crítica la pérdida de subunidades supera a la ganancia: despolimerización.","❌ El extremo − es el que habitualmente se despolimeriza; no compensa creciendo en esta situación.","❌ El equilibrio sin cambio neto se da justamente en la concentración crítica, no por debajo.","❌ La polimerización neta ocurre cuando la concentración libre es superior a la crítica, no inferior."]},{"pregunta":"¿A qué se debe la estructura diferencial polarizada del microtúbulo según el tema?","opciones":["A la asociación antiparalela de heterodímeros, que expone β en ambos extremos","A contactos laterales entre α y β de protofilamentos vecinos, que alternan la orientación","A enlaces covalentes entre dímeros que fijan α en el extremo + y β en el −","A la unión cabeza β-cola α y a contactos laterales entre subunidades iguales vecinas"],"correcta":3,"explicacion":"La estabilización del microtúbulo combina uniones longitudinales cabeza de β con cola de α y contactos laterales entre subunidades iguales de filamentos vecinos. Al orientarse todos los dímeros igual, en un extremo quedan expuestas las α y en el otro las β, lo que genera la polaridad.","por_opcion":["❌ La asociación antiparalela es propia del tetrámero de filamentos intermedios y anula la polaridad.","❌ Los contactos laterales son entre subunidades iguales (α-α, β-β), no entre α y β.","❌ Las uniones son no covalentes y el extremo + expone β, no α.","✅ Es la descripción literal del temario sobre cómo se estabiliza y polariza el microtúbulo."]},{"pregunta":"Respecto a la regulación del alargamiento y acortamiento de los microtúbulos, ¿qué afirmación es correcta según el tema?","opciones":["Las MAPs son necesarias porque el microtúbulo interacciona directamente con los orgánulos","La mayoría de las MAPs actúan sobre el extremo menos, inhibiendo siempre su crecimiento","La mayoría de las MAPs interaccionan con el extremo más, favoreciendo o inhibiendo el crecimiento","La katanina es una MAP que estabiliza el extremo más e impide la catástrofe del polímero"],"correcta":2,"explicacion":"Los microtúbulos son relativamente inertes y no interaccionan directamente con otras estructuras; su crecimiento y organización los controlan las MAPs, la mayoría de las cuales actúan sobre el extremo + favoreciendo o inhibiendo el crecimiento. La katanina rompe microtúbulos.","por_opcion":["❌ Es al revés: el microtúbulo es relativamente inerte y no interacciona directamente con otras estructuras.","❌ Actúan sobre todo en el extremo más y pueden favorecer o inhibir, no solo inhibir.","✅ Es la definición del tema sobre la acción mayoritaria de las MAPs.","❌ La katanina rompe (secciona) microtúbulos; no los estabiliza."]},{"pregunta":"En un corte transversal de un cilio realizado exactamente a nivel de la zona de transición, ¿qué patrón se observaría?","opciones":["Nueve tripletes periféricos con un par central rodeado de vaina","Nueve dobletes periféricos sin ningún par central de microtúbulos","Nueve dobletes periféricos con un par central rodeado de vaina","Nueve tripletes periféricos sin ningún par central de microtúbulos"],"correcta":1,"explicacion":"La zona de transición, situada entre el cuerpo basal y el axonema, tiene 9 dobletes pero sin el par central; en ella se encuentra la placa basal, que forma el par central del axonema. El cuerpo basal tiene 9 tripletes y el axonema 9 dobletes + 2 centrales.","por_opcion":["❌ Este patrón no existe en el tema: los tripletes nunca se acompañan de par central.","✅ Es el patrón descrito para la zona de transición: 9 dobletes sin par central.","❌ Nueve dobletes más par central con vaina es el axonema, por encima de la zona de transición.","❌ Nueve tripletes sin par central es el patrón del cuerpo basal (y del centriolo)."]},{"pregunta":"Según el tema, ¿qué alteración se asocia a mutaciones en un gen concreto de la tubulina β?","opciones":["Desplazamiento nuclear por déficit de vimentina perinuclear","Parálisis ocular por hipoplasia del nervio oculomotor","Miopatía por acúmulo anómalo de desmina en fibras musculares estriadas","Parálisis ocular por hipoplasia del nervio óptico secundaria a defecto axonal"],"correcta":1,"explicacion":"El temario indica que las mutaciones en un gen particular de la tubulina β producen un tipo de desorden o parálisis ocular por hipoplasia del nervio oculomotor, y que numerosas enfermedades neurológicas se asocian a mutaciones de genes de tubulina.","por_opcion":["❌ La vimentina mantiene el núcleo en su sitio, pero no es tubulina ni aparece asociada a esta patología.","✅ Es literalmente la asociación que recoge el tema.","❌ La desmina es un filamento intermedio; el tema no la relaciona con mutaciones de tubulina β.","❌ El nervio citado es el oculomotor, no el nervio óptico."]},{"pregunta":"¿Qué emparejamiento entre filamento intermedio y localización o función es correcto según el temario?","opciones":["Vimentina: se dispone alrededor del núcleo y lo mantiene en su sitio","Queratina: responsable de mantener la forma de las neuronas","Neurofilamentos: propios del tejido epitelial de revestimiento","Desmina: exclusiva de las células musculares estriadas esqueléticas"],"correcta":0,"explicacion":"El tema define cuatro tipos: neurofilamentos (forma de las neuronas), queratina (tejido epitelial), desmina (células musculares lisas y estriadas) y vimentina (alrededor del núcleo, manteniéndolo en su sitio).","por_opcion":["✅ Coincide con la descripción de la vimentina en el tema.","❌ La forma neuronal la mantienen los neurofilamentos; la queratina es epitelial.","❌ El tejido epitelial corresponde a la queratina; los neurofilamentos son neuronales.","❌ La desmina está en células musculares tanto lisas como estriadas, no solo en las esqueléticas."]},{"pregunta":"Sobre el ensamblaje de los filamentos intermedios, ¿qué afirmación es correcta?","opciones":["Los dímeros son antiparalelos y dos de ellos forman un tetrámero paralelo","Trece protofilamentos de tetrámeros se cierran en un cilindro hueco","Los tetrámeros se incorporan por el extremo + gracias a su polaridad","Los dímeros son paralelos y dos de ellos forman un tetrámero antiparalelo"],"correcta":3,"explicacion":"Dos monómeros forman un dímero paralelo (misma dirección) y dos dímeros se asocian de forma antiparalela formando un tetrámero. Los tetrámeros se alinean extremo con extremo en protofilamentos y 8 protofilamentos forman el filamento, que carece de polaridad.","por_opcion":["❌ Invierte la orientación: el dímero es paralelo y el tetrámero antiparalelo.","❌ Trece protofilamentos y cilindro hueco describen al microtúbulo; el filamento intermedio tiene 8.","❌ El filamento intermedio no tiene polaridad y su sitio de incorporación es interno.","✅ Es la secuencia de ensamblaje descrita en el tema."]},{"pregunta":"Según la tabla comparativa de Karp incluida en el tema, los filamentos intermedios:","opciones":["Carecen de polaridad, de actividad enzimática y de proteínas motoras","Existen en todos los eucariotas y su proteína asociada principal es la MAP","Tienen polaridad y utilizan las plaquinas como proteínas motoras","Incorporan subunidades por el extremo + y poseen actividad GTPasa"],"correcta":0,"explicacion":"En la tabla de Karp, los filamentos intermedios no tienen polaridad, no presentan actividad enzimática ni proteínas motoras, incorporan subunidades en posición interna, se asocian a plaquinas y solo están en animales.","por_opcion":["✅ Coincide con las filas de polaridad, actividad enzimática y proteínas motoras de la tabla.","❌ Están solo en animales y su grupo relacionado son las plaquinas; la MAP es del microtúbulo.","❌ No tienen polaridad, y las plaquinas son proteínas relacionadas, no motoras.","❌ Extremo + y actividad GTPasa son propios del microtúbulo; en el filamento intermedio la incorporación es interna."]},{"pregunta":"¿Qué afirmación sobre los filamentos de actina es correcta según el tema?","opciones":["La actina F es el monómero globular y el extremo − es el de crecimiento rápido","La actina G polimeriza en 13 protofilamentos y el extremo + crece lentamente","La actina G polimeriza en dos cadenas enrolladas y el extremo + crece rápido","La actina G se incorpora unida a GTP y lo hace preferentemente por el extremo −"],"correcta":2,"explicacion":"La actina G (monómero globular) polimeriza formando dos cadenas enrolladas como dos collares de perlas, la actina F. El filamento es polar: el extremo − crece despacio y el + rápido. La subunidad se incorpora unida a ATP y la actina tiene actividad ATPasa.","por_opcion":["❌ La actina F es el filamento; el monómero globular es la actina G, y el extremo rápido es el +.","❌ Los 13 protofilamentos son del microtúbulo y el extremo + de la actina crece rápido.","✅ Resume correctamente la estructura y la polaridad del filamento de actina.","❌ La actina se une a ATP (no GTP) y se incorpora preferentemente por el extremo + (barbado)."]},{"pregunta":"En la molécula de miosina II, ¿qué asignación entre componentes y regiones es correcta?","opciones":["Cadenas pesadas en las cabezas, dos α-hélices en el cuello y cadenas ligeras en la cola","Dos α-hélices en las cabezas, cadenas ligeras en el cuello y cadenas pesadas en la cola","Cadenas ligeras en las cabezas, cadenas pesadas en el cuello y dos α-hélices en la cola","Cadenas pesadas en las cabezas, cadenas ligeras en el cuello y dos α-hélices en la cola"],"correcta":3,"explicacion":"La miosina II es una proteína dimérica con 2 cabezas globulares y una larga cola: las 2 cadenas pesadas forman las cabezas, las cadenas ligeras se sitúan en el cuello y 2 α-hélices enrolladas forman la cola.","por_opcion":["❌ Intercambia cuello y cola: las α-hélices forman la cola y las cadenas ligeras el cuello.","❌ Las α-hélices forman la cola, no las cabezas globulares.","❌ Intercambia cadenas ligeras y pesadas: las cabezas son de cadenas pesadas.","✅ Es la asignación literal del tema."]},{"pregunta":"Según las ideas clave del tema, el movimiento de los cilios y flagelos en células eucariotas:","opciones":["Requiere el deslizamiento de miosina II sobre la actina del axonema","Se produce por polimerización de actina en el extremo + del cilio","Se debe a la acción de microtúbulos, sin necesidad de actina-miosina","Depende de filamentos intermedios de queratina dispuestos en el eje"],"correcta":2,"explicacion":"Aunque gran parte de los movimientos eucariotas se deben al deslizamiento de miosina sobre actina, el tema especifica que el movimiento de cilios y flagelos se debe a la acción de microtúbulos, sin necesidad de actina-miosina. El axonema es una estructura de microtúbulos estables.","por_opcion":["❌ El axonema no contiene un sistema actina-miosina; el tema lo excluye expresamente.","❌ La polimerización de actina explica pseudópodos, no el batido ciliar.","✅ Es la idea clave literal sobre el movimiento de cilios y flagelos.","❌ El eje del cilio está formado por microtúbulos, no por filamentos intermedios."]},{"pregunta":"¿Qué afirmación sobre el centrosoma es correcta según el tema?","opciones":["Dos centriolos perpendiculares de 9 tripletes que originan un huso de microtúbulos estables","Un centriolo único de 9 tripletes con par central que origina el huso de microtúbulos lábiles","Dos centriolos paralelos de 9 dobletes que originan un huso de microtúbulos estables","Dos centriolos perpendiculares de 9 tripletes que originan un huso de microtúbulos lábiles"],"correcta":3,"explicacion":"El centrosoma está formado por dos centriolos perpendiculares, cada uno de 9 tripletes de microtúbulos, rodeados de hialoplasma espeso. Aunque está formado por microtúbulos estables, origina el huso acromático, formado por microtúbulos lábiles, y por eso es un MTOC.","por_opcion":["❌ El centrosoma es estable, pero el huso que origina está formado por microtúbulos lábiles.","❌ Siempre son dos centriolos y no poseen par central.","❌ Los centriolos son perpendiculares, de tripletes, y el huso es de microtúbulos lábiles.","✅ Recoge la estructura del centrosoma y la naturaleza lábil del huso que origina."]},{"pregunta":"¿Cómo consiguen las proteínas motoras desplazarse a lo largo del citoesqueleto según el tema?","opciones":["Se unen a cualquier filamento, incluso apolar, e hidrolizan GTP para avanzar","Se anclan a filamentos intermedios e hidrolizan ATP para avanzar sobre ellos","Polimerizan subunidades por delante de sí y avanzan sin consumir energía","Se unen a un filamento polarizado e hidrolizan ATP para avanzar sobre él"],"correcta":3,"explicacion":"Las proteínas motoras se unen a un filamento polarizado, hidrolizan ATP y aprovechan esa energía para desplazarse a lo largo del filamento con su carga. Por eso solo actúan sobre microtúbulos (cinesinas, dineínas) y actina (miosinas), no sobre filamentos intermedios apolares.","por_opcion":["❌ Requieren un filamento polarizado y la energía procede del ATP.","❌ Los filamentos intermedios no tienen polaridad ni proteínas motoras.","❌ El desplazamiento consume ATP; no se basa en polimerizar subunidades.","✅ Es el mecanismo descrito en el apartado de proteínas accesorias."]},{"pregunta":"¿Qué función atribuye el tema a los filamentos de actina pero no figura en la lista de funciones de los filamentos de miosina?","opciones":["Papel estructural en microvellosidades y uniones celulares","Desarrollo de actividad contráctil en la célula muscular","Participación en la citocinesis de la célula en división","Desplazamiento de la célula durante la migración celular"],"correcta":0,"explicacion":"Las funciones de la actina incluyen contracción, pseudópodos, papel estructural en microvellosidades y uniones celulares, soporte mecánico y anillo contráctil. La miosina tiene citocinesis, movimientos de migración y actividad contráctil; la función estructural en microvellosidades y uniones es exclusiva de la actina en el tema.","por_opcion":["✅ Las microvellosidades y uniones celulares solo se atribuyen a la actina.","❌ La actividad contráctil aparece en la lista de la miosina.","❌ La citocinesis figura entre las funciones de la miosina (y la actina forma el anillo contráctil).","❌ Los movimientos durante la migración celular aparecen entre las funciones de la miosina."]}],"asignatura":"Biología celular y tisular","tema":4,"fecha":"2026-11-04","resumen":["El citoesqueleto es una **red dinámica de filamentos proteicos** unidos por enlaces débiles no covalentes. Mantiene el volumen del citoplasma, algo clave en células animales sin pared, y se reorganiza rápidamente cuando la célula cambia de forma, se divide o responde a estímulos.","Sus tres componentes, de más grueso a más fino, son los **microtúbulos (25 nm)**, los **filamentos intermedios (8-10 nm)** y los **microfilamentos de actina (7 nm)**. Se encargan, respectivamente, de la posición de orgánulos y el transporte intracelular, de la resistencia al estrés mecánico y de la forma de la superficie y la locomoción.","El microtúbulo es un cilindro hueco de **13 protofilamentos de heterodímeros α/β-tubulina**, polar (el extremo **+** expone β y suele crecer). Nace en los **MTOC** (centrosoma) y su dinámica depende de la **concentración crítica**, del casquete de GTP y de las MAPs.","Los microtúbulos **estables** forman el axonema de cilios y flagelos (**9 dobletes + 2 centrales**), la zona de transición (**9 dobletes sin par central**), y el cuerpo basal y el centriolo (**9 tripletes**). El batido ciliar es **microtubular, sin actina-miosina**.","Los filamentos intermedios son **los más estables, sin polaridad ni proteínas motoras** (neurofilamentos, queratina, desmina, vimentina). La actina F es polar y con actividad ATPasa, y la **miosina II** (cabezas = 2 cadenas pesadas con ATPasa) se desliza sobre ella para producir la contracción. Los motores de los microtúbulos son las **cinesinas y dineínas**, y los de la actina, las **miosinas**."],"preguntate":[{"pregunta":"¿Cómo puede una célula de unos 10 µm estar organizada por proteínas unas 20.000 veces más pequeñas?","respuesta":"Gracias a la **polimerización**: centenares de subunidades se unen en polímeros lineales lo bastante largos para recorrer toda la célula. Al estar unidas por enlaces débiles no covalentes, el polímero es resistente y a la vez puede montarse y desmontarse con rapidez."},{"pregunta":"Explica el papel del casquete de GTP en el crecimiento y el acortamiento de un microtúbulo.","respuesta":"Los **dímeros-GTP** se incorporan al extremo + formando un casquete de GTP. Tras incorporarse, el GTP se hidroliza a GDP. Mientras se mantiene el casquete, el microtúbulo crece; si se pierde, los protofilamentos se abren y el microtúbulo **decrece** (catástrofe)."},{"pregunta":"Compara los microtúbulos lábiles y los estables en disposición, dinámica y estructuras que forman.","respuesta":"Los **lábiles** se agrupan en paralelo, nacen en el MTOC, ganan y pierden subunidades constantemente y forman el **huso mitótico**. Los **estables** son permanentes, se organizan geométricamente en estructuras complejas y forman **centriolos, cilios y flagelos**."},{"pregunta":"Compara la organización interna de un microtúbulo con la de un filamento intermedio.","respuesta":"El microtúbulo tiene **13 protofilamentos** de heterodímeros α/β-tubulina que forman un tubo hueco y rígido. El filamento intermedio tiene **8 protofilamentos** de tetrámeros (dímeros paralelos asociados de forma antiparalela) organizados como una **cuerda**."},{"pregunta":"¿Por qué los filamentos intermedios carecen de proteínas motoras?","respuesta":"Porque las proteínas motoras necesitan un **filamento polarizado** sobre el que desplazarse. Los filamentos intermedios son **apolares**, así que no tienen motores; su proteína relacionada principal son las **plaquinas**."},{"pregunta":"Un paciente tiene cilios del epitelio respiratorio con un axonema defectuoso. ¿Qué consecuencia esperas y qué implica para la fisioterapia?","respuesta":"Falla el **aclaramiento mucociliar**: el moco no se desplaza hacia la faringe y se acumulan secreciones. Esto justifica las técnicas de **drenaje y aclaramiento bronquial**."},{"pregunta":"¿Por qué la neurona motora es especialmente vulnerable a las alteraciones de la tubulina?","respuesta":"Porque su **transporte axonal depende de los microtúbulos** y sus axones son muy largos. Por eso las mutaciones en genes de tubulina se asocian a enfermedades neurológicas como la **ELA**."},{"pregunta":"Describe la localización de la actina y la miosina en la sarcómera.","respuesta":"La **miosina** ocupa la **banda A**, con la zona H y la línea M en el centro. La **actina** se ancla en las **líneas Z** y ocupa la **banda I**; la contracción se produce por el deslizamiento de la miosina sobre la actina."},{"pregunta":"Diferencia las fibras radiales de las raíces ciliares.","respuesta":"Las **fibras radiales** unen los dobletes del axonema con la vaina central y aseguran su estructura. Las **raíces ciliares** anclan la parte interna del cuerpo basal al citoesqueleto."},{"pregunta":"¿Por qué la presencia de desmina y queratina ayuda a entender la tolerancia de músculo y piel a las cargas?","respuesta":"Porque ambas son **filamentos intermedios**, cuya función es dar **fuerza y resistencia al estrés mecánico**. Se localizan en tejidos sometidos a tracción y presión constantes: la **desmina** en el músculo liso y estriado, y la **queratina** en los epitelios."}]}</script>

  </div>`:''}

  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
