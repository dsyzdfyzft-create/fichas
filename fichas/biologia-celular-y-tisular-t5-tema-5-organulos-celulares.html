<!DOCTYPE html>
<html lang="es">
<head>

<title>Tema 5. Orgánulos celulares · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#f6f4ef; --hoja:#fffdf9; --tinta:#1b2427; --suave:#5b676b; --linea:#e2ddd2; --acento:#1f6f6b; --acento-suave:#dcebe8;
  --ocre:#b37a1c; --ocre-suave:#f6ead3; --rojo:#a8402f; --rojo-suave:#f5e0db; --verde:#2f7a46; --verde-suave:#dcefe1;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --texto:"Spectral",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:19px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);line-height:1.12;margin:0;font-variation-settings:"SOFT" 50}
h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.9rem;font-weight:600;letter-spacing:-.015em;margin:0 0 18px}
h3{font-size:1.2rem;font-weight:600}
b,strong{font-weight:600}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px}
.envoltura{max-width:820px;margin:0 auto;padding:0 22px}
/* cabecera */
header.portada{padding:64px 0 36px;border-bottom:1px solid var(--linea)}
.etiquetas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.etiqueta{font:600 .78rem/1 var(--serif);padding:7px 11px;border-radius:999px;background:var(--acento-suave);color:var(--acento)}
.etiqueta.o{background:var(--ocre-suave);color:var(--ocre)}
.sub{font-size:1.25rem;color:var(--suave);margin:16px 0 0;max-width:62ch;font-style:italic}
.meta{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap}
.meta div{font-family:var(--serif)}
.meta b{display:block;font-size:1.7rem;font-weight:800;line-height:1}
.meta span{font-size:.8rem;color:var(--suave)}
/* navegación */
nav.indice{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px)}
nav.indice .envoltura{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .envoltura::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .85rem var(--serif);padding:7px 12px;border-radius:999px}
nav.indice a:hover{color:var(--tinta);background:var(--hoja)}
nav.indice a.qcm{background:var(--tinta);color:var(--papel);margin-left:auto}
main section{padding:56px 0 8px}
.num{font:800 .85rem var(--serif);color:var(--ocre);display:block;margin-bottom:6px}
p{margin:0 0 16px;max-width:68ch}
/* bloques */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:14px;padding:22px 24px}
.caja h3{margin-bottom:12px}
.caja ul,.caja ol{margin:0;padding-left:1.2em}
.caja li{margin:6px 0}
.claves{counter-reset:k;list-style:none;padding:0!important}
.claves li{counter-increment:k;padding-left:38px;position:relative;margin:10px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--acento);color:var(--papel);font:800 .8rem/26px var(--serif);text-align:center}
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
.tw{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--linea);border-radius:12px;background:var(--hoja)}
table{border-collapse:collapse;width:100%;font-size:.92rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:600 .95rem var(--serif);padding:14px 16px 4px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--linea)}
th{font:600 .82rem var(--serif);color:var(--suave);border-top:0}
tbody tr:nth-child(odd){background:color-mix(in srgb,var(--papel) 50%,transparent)}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 22px}
.tarjeta{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;font-size:.95rem;line-height:1.5}
.tarjeta .et{font:700 .72rem var(--serif);color:var(--ocre);display:block;margin-bottom:4px}
.tarjeta h3{font-size:1.05rem;margin-bottom:6px}
.def{border-left:3px solid var(--acento);padding:4px 0 4px 16px;margin:0 0 18px}
.def b{font-family:var(--serif);color:var(--acento)}
.nota{border-radius:12px;padding:14px 18px 14px 50px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;font-size:1.15rem}
.nota .t{font:700 .78rem var(--serif);display:block;margin-bottom:2px}
.perla{background:var(--verde-suave)} .perla::before{content:"🩺"} .perla .t{color:var(--verde)}
.alerta{background:var(--rojo-suave)} .alerta::before{content:"⚠️"} .alerta .t{color:var(--rojo)}
/* figuras y esquemas */
figure{margin:8px 0 26px;background:var(--hoja);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:20px 16px 8px;overflow-x:auto;text-align:center}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq .lienzo pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap;text-align:left}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{font-family:var(--serif);color:var(--tinta)}
/* caso clínico */
.caso{background:var(--tinta);color:var(--papel);border-radius:18px;padding:30px 30px 18px}
.caso h2{color:var(--papel)}
.caso p{color:color-mix(in srgb,var(--papel) 85%,transparent)}
.caso details{border-top:1px solid color-mix(in srgb,var(--papel) 18%,transparent);padding:12px 0}
.caso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
.caso details p{margin:10px 0 0}
dl.glosario{display:grid;grid-template-columns:max-content 1fr;gap:10px 20px;margin:0}
dl.glosario dt{font:600 1rem var(--serif);color:var(--acento)}
dl.glosario dd{margin:0}
.fuentes{font-size:.9rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border:1px solid var(--linea);border-radius:18px;padding:28px}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:600 .85rem var(--serif);color:var(--suave)}
.barra{flex:1;height:8px;border-radius:4px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--acento);transition:width .3s}
.pregunta{font:600 1.3rem/1.35 var(--serif);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer}
.op:hover:not([disabled]){border-color:var(--acento)}
.op .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 .9rem var(--serif);background:var(--hoja);border:1px solid var(--linea)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--verde);background:var(--verde-suave)}
.op.bien .l{background:var(--verde);color:#fff;border-color:var(--verde)}
.op.mal{border-color:var(--rojo);background:var(--rojo-suave)}
.op.mal .l{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{font:600 .95rem var(--serif);padding:11px 20px;border-radius:999px;border:0;background:var(--tinta);color:var(--papel);cursor:pointer}
.btn.sec{background:transparent;color:var(--tinta);border:1.5px solid var(--linea)}
.btn[disabled]{opacity:.35;cursor:default}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:800 4.4rem/1 var(--serif);letter-spacing:-.03em}
.resultado .gran small{font-size:1.6rem;color:var(--suave)}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:700px){body{font-size:17.5px}.dos{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}dl.glosario{grid-template-columns:1fr}dl.glosario dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i{transition:none}}
@media print{nav.indice,#qcm{display:none}body{background:#fff}}
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script id="datos" type="application/json">{"titulo":"Tema 5. Orgánulos celulares","subtitulo":"Sistema de endomembranas, mitocondrias y ribosomas: cómo la célula fabrica, modifica, distribuye, digiere y obtiene energía.","objetivos":["Al terminar, sabrás describir el sistema de endomembranas y diferenciar la vía biosintética-secretora de la vía endocítica, así como los tres tipos de tráfico de proteínas (transporte cerrado, translocación y transporte vesicular).","Al terminar, sabrás explicar paso a paso la entrada de una proteína en el RER mediante péptido señal, SRP, receptor de SRP y translocador, y distinguir las funciones del RER, del REL y del aparato de Golgi.","Al terminar, sabrás clasificar los lisosomas, explicar por qué su interior es ácido y diferenciarlos de peroxisomas y vacuolas por estructura, enzimas y función.","Al terminar, sabrás describir la estructura, la composición, las funciones y la biogénesis de la mitocondria, incluido el acoplamiento quimiosmótico y su relación con las fibras musculares rápidas y lentas.","Al terminar, sabrás detallar la localización, los tipos (70S/80S), la composición de las subunidades y el ensamblaje de los ribosomas."],"ideas_clave":["El **sistema de endomembranas** (RE, Golgi, vesículas, lisosomas y membrana plasmática) está interconectado directamente o mediante **vesículas** que se desplazan sobre microtúbulos y microfilamentos, impulsadas por **proteínas motoras**.","La síntesis de proteínas empieza **siempre en ribosomas libres**. Si la proteína lleva **péptido señal**, la **SRP** la dirige al **receptor de SRP** del RER. Después la SRP se libera y el ribosoma queda unido al **translocador**.","**RER** (ribosomas, cisternas concéntricas): síntesis y **glicosilación** de proteínas. **REL** (túbulos sin ribosomas): **síntesis de lípidos** de membrana, **detoxificación** (citocromo P450) y **almacén de Ca²⁺**. En el músculo estriado el REL se llama **retículo sarcoplásmico**.","El **Golgi** tiene una cara **cis** (proximal, de formación, orientada al núcleo) y una cara **trans** (distal, de maduración). Sus 5 regiones son CGN, cisternas cis, medial y trans, y TGN. La **TGN** es el centro de organización y distribución.","Los **lisosomas** contienen unas **40 hidrolasas ácidas**. Una **bomba H⁺ ATPasa** mantiene su interior a **pH ≈5** (citosol ≈7,2). Realizan **heterofagia** y **autofagia**.","Los **peroxisomas** tienen membrana limitante y una matriz con **núcleo cristalizado**. Contienen **enzimas oxidativas** (catalasa o peroxidasa). Sus proteínas se sintetizan en **polirribosomas libres** y llevan **PTS**.","**Mitocondria**: membrana externa 40% lípidos/60% proteínas, permeable por **porinas**. Membrana interna 25% lípidos/75% proteínas, rica en **cardiolipina** (origen bacteriano). El **Krebs** ocurre en la matriz y la **ATP sintasa** está en la membrana de las crestas. **Nunca se forma de novo** y su genoma se hereda **por vía materna**.","**Ribosomas**: 80S en eucariotas (60S: rRNA 28S + 5,8S + 5S y 49 proteínas; 40S: rRNA 18S y 33 proteínas) y 70S en bacterias, mitocondrias y cloroplastos. Las subunidades se forman en el **nucléolo** y se unen en el **citoplasma**."],"secciones":[{"id":"endomembranas","titulo":"1. Sistema de endomembranas: concepto, vías y tráfico de proteínas","bloques":[{"tipo":"definicion","termino":"Sistema de endomembranas","texto":"Conjunto de **estructuras membranosas internas** de las células eucariotas que trabajan de forma coordinada para **modificar, empaquetar y transportar** moléculas dentro y fuera de la célula. Incluye **retículo endoplasmático, aparato de Golgi, vesículas, lisosomas y membrana plasmática**. Es esencial para la síntesis de proteínas y lípidos y para la digestión y el transporte de materiales."},{"tipo":"parrafo","texto":"Funciona como una **red dinámica integrada**: los materiales se envían de un compartimento a otro. Las membranas están conectadas **directamente** (por ejemplo, el RE es continuo con la membrana nuclear externa) o mediante **vesículas de transporte**. Estas vesículas viajan por el citoplasma **sobre microtúbulos y microfilamentos**, arrastradas por **proteínas motoras**. Como cada vesícula se fusiona con su destino, la membrana y el contenido de un compartimento pasan al siguiente sin mezclarse con el citosol."},{"tipo":"tarjetas","items":[{"etiqueta":"Vía 1","titulo":"Biosintética o secretora","texto":"RE → Golgi → destino: **membrana plasmática, lisosoma o vesícula en espera** (secreción regulada)."},{"etiqueta":"Vía 2","titulo":"Endocítica","texto":"**Superficie celular → endosoma o lisosoma**. Es la vía de entrada de material externo."}]},{"tipo":"esquema","titulo":"Vías citoplasmáticas del sistema de endomembranas","mermaid":"flowchart LR\n  subgraph S1[\"Vía biosintética o secretora\"]\n    RE[\"Retículo endoplasmático\"] --> G[\"Aparato de Golgi\"]\n    G --> M[\"Membrana plasmática\"]\n    G --> V[\"Vesícula en espera\"]\n    G --> L[\"Lisosoma\"]\n  end\n  subgraph S2[\"Vía endocítica\"]\n    S[\"Superficie celular\"] -->|\"endocitosis\"| E[\"Endosoma\"]\n    E --> L2[\"Lisosoma\"]\n  end","pie":"La vía secretora sale del RE hacia el exterior o hacia los lisosomas. La vía endocítica entra desde la superficie. Ambas convergen en el lisosoma."},{"tipo":"tabla","titulo":"Tráfico de proteínas (Alberts)","columnas":["Tipo","Mecanismo","Ejemplo según el esquema"],"filas":[["**Transporte cerrado**","Paso entre citosol y núcleo a través de los **complejos de poro** de la envoltura nuclear","Citosol ↔ núcleo"],["**Translocación de proteínas**","**Transportadores proteicos transmembrana** dirigen la proteína desde el citosol hacia un espacio específico","Citosol → mitocondria, plastos, peroxisomas, RE"],["**Transporte vesicular**","**Vesículas de transporte** (fragmentos de membrana) llevan proteínas de un compartimento a otro","RE → Golgi → lisosomas, vesículas secretoras, exterior; endosomas"]]},{"tipo":"alerta","texto":"No confundas **transporte cerrado** con **translocación**. El cerrado usa los **poros nucleares** y solo conecta citosol y núcleo. La translocación atraviesa una membrana mediante **transportadores transmembrana**: así entran las proteínas en la mitocondria, el peroxisoma o el RE. El paso **RE → Golgi** no es translocación, sino **transporte vesicular**."}]},{"id":"reticulo-endoplasmatico","titulo":"2. Retículo endoplasmático: RER y REL","bloques":[{"tipo":"parrafo","texto":"El RE es un sistema de **cisternas apiladas continuas con la membrana nuclear externa**. Delimita un espacio separado del citoplasma llamado **lumen**. Su función global es sintetizar **proteínas y lípidos** destinados a la secreción o a la renovación de estructuras celulares. La presencia o ausencia de **ribosomas** en su cara citoplasmática define sus dos tipos."},{"tipo":"tabla","titulo":"RER frente a REL","columnas":["Rasgo","RE rugoso o granular (RER)","RE liso (REL)"],"filas":[["Morfología","Red de **sacos aplanados (cisternas)** en **capas concéntricas paralelas al núcleo**","Serie de **elementos tubulares**"],["Ribosomas","**Sí**, adheridos a la cara citoplasmática","**No**"],["Funciones","**Síntesis de proteínas** y **glicosilación de proteínas**","**Síntesis de lípidos de membrana**, **detoxificación** y **almacén de Ca²⁺**"],["Células donde abunda","**Células secretoras de glicoproteínas**","**Células musculares, hepatocitos y glándulas endocrinas esteroideas**"]]},{"tipo":"figura","pagina":10,"pie":"Entrada cotraduccional en el RER (Karp). Sigue los pasos 1→4: el péptido señal (rojo) es reconocido por la SRP, la SRP se une a su receptor, la SRP se libera y el ribosoma queda sobre el translocón (fíjate en el tapón). Por último, la cadena entra en la luz, donde la recibe la chaperona BiP.","src":"img/biologia-celular-y-tisular-t5-tema-5-organulos-celulares-p10.jpg"},{"tipo":"esquema","titulo":"Síntesis de proteínas dirigidas al RER","mermaid":"flowchart TD\n  A[\"Ribosoma libre inicia la síntesis\"] --> B[\"Emerge el péptido señal\"]\n  B --> C[\"SRP se une al péptido señal y al ribosoma\"]\n  C --> D[\"SRP se une a su receptor en la membrana del RER\"]\n  D --> E[\"SRP se libera\"]\n  E --> F[\"Ribosoma unido al translocador\"]\n  F --> G[\"Proteína entra en el lumen\"]\n  F --> H[\"Subunidades quedan en el citosol\"]\n  G --> I[\"Glicosilación en RER y Golgi\"]","pie":"La SRP solo actúa como guía: no entra en el lumen. Al terminar la síntesis, la proteína queda dentro y las subunidades ribosómicas, fuera."},{"tipo":"alerta","texto":"Trampa clásica: la síntesis **no** empieza en ribosomas ya unidos al RER. Empieza **siempre en ribosomas libres**, y es el **péptido señal** reconocido por la **SRP en el citosol** lo que lleva el ribosoma al RER. La SRP **se libera** tras unirse a su receptor; no acompaña a la proteína al lumen."},{"tipo":"definicion","termino":"Glicosilación de proteínas","texto":"Incorporación de **cadenas de oligosacáridos** a las proteínas. La realizan **conjuntamente el RER y el aparato de Golgi**. Permite a la célula **identificar las proteínas según su destino y función**. **La mayor parte** de las proteínas sintetizadas en el RER se glicosilan. En el esquema del tema, el oligosacárido unido al lípido **dolicol** se transfiere a una **asparagina (Asn)** del polipéptido en crecimiento (N-glicosilación, complemento)."},{"tipo":"tarjetas","items":[{"etiqueta":"REL · 1","titulo":"Síntesis de lípidos","texto":"Sintetiza **fosfolípidos y colesterol** de las membranas. La estructura básica se forma en el REL, pero **la maduración termina en el Golgi**. Los lípidos llegan a otros orgánulos y a la membrana plasmática por **transporte vesicular**: la membrana de la vesícula se fusiona con la de destino."},{"etiqueta":"REL · 2","titulo":"Detoxificación","texto":"Las enzimas del **citocromo P450** convierten **compuestos hidrófobos en hidrófilos**. Muchos fármacos y toxinas no son hidrosolubles y el riñón no puede eliminarlos con eficacia. El **hígado** los hace más solubles en agua gracias al REL de sus células."},{"etiqueta":"REL · 3","titulo":"Almacén de calcio","texto":"Almacena **Ca²⁺** y lo libera para **permitir la contracción muscular**. En el **músculo estriado** es muy abundante y se llama **retículo sarcoplásmico**."}]},{"tipo":"figura","pagina":14,"pie":"Detoxificación hepática. En la **fase 1** (citocromo P450 del REL: oxidación, reducción, hidrólisis, hidratación, deshalogenación), las toxinas no polares pasan a metabolitos intermedios. En la **fase 2** (conjugación con glutatión, acetilación, aminoácidos, metilación) se obtienen productos polares excretables. Observa que la fase 1 genera **radicales libres** que dañan al hepatocito, de ahí la importancia de los antioxidantes (vitaminas A, C, E y selenio).","src":"img/biologia-celular-y-tisular-t5-tema-5-organulos-celulares-p14.jpg"},{"tipo":"tabla","titulo":"Fases de la detoxificación hepática (esquema del tema)","columnas":["Fase","Reacciones","Producto"],"filas":[["Fase 1 (citocromo P450, REL)","Oxidación, reducción, hidrólisis, hidratación, deshalogenación","Metabolitos intermedios: más polares y menos liposolubles. Se generan **radicales libres**"],["Fase 2","Conjugación con glutatión, acetilación, conjugación con aminoácidos, metilación","Productos de excreción **polares, solubles en agua**"]]},{"tipo":"perla","texto":"**Retículo sarcoplásmico y fisioterapia**: la liberación de Ca²⁺ desde el REL del músculo estriado activa el complejo troponina-tropomiosina y permite que los puentes de miosina se unan a la actina (esquema de la diapositiva). Cuando trabajes la contracción, la fatiga o la electroestimulación, recuerda que la respuesta mecánica depende de este almacén intracelular de Ca²⁺. Además, el paciente **polimedicado** depende de la capacidad detoxificadora del REL hepático para eliminar fármacos liposolubles."}]},{"id":"golgi","titulo":"3. Aparato de Golgi","bloques":[{"tipo":"parrafo","texto":"El Golgi es un conjunto de **cisternas membranosas apiladas, incurvadas y concéntricas**. El conjunto de sacos se llama **dictiosoma** y **varía según el tipo celular**. Recibe las proteínas sintetizadas en el RE y las **modifica y distribuye**. Tiene polaridad: el material entra por una cara y sale, ya procesado, por la opuesta, recorriendo los compartimentos **en una secuencia ordenada**."},{"tipo":"tarjetas","items":[{"etiqueta":"Cara","titulo":"Cis","texto":"**Proximal, de formación**. Normalmente orientada **hacia el núcleo** y hacia el RE. Recibe vesículas del RE."},{"etiqueta":"Cara","titulo":"Trans","texto":"**Distal, de maduración**. Por ella salen las proteínas o lípidos **ya modificados** para su distribución."}]},{"tipo":"tabla","titulo":"Las 5 regiones funcionales del Golgi (esquema del tema)","columnas":["Región","Función general","Procesos concretos del esquema"],"filas":[["**Red cis de Golgi (CGN)**","Modificaciones y clasificación","**Fosforilación de oligosacáridos de las proteínas lisosomales**"],["Cisterna cis","Más modificaciones","Eliminación de manosa"],["Cisterna medial","Más modificaciones","Eliminación de manosa y adición de N-acetilglucosamina (GlcNAc)"],["Cisterna trans","Más modificaciones","Adición de galactosa y de ácido siálico (NANA)"],["**Red trans de Golgi (TGN)**","**Centro de organización y distribución**","Sulfatación de tirosinas y carbohidratos. Clasificación hacia lisosoma, membrana plasmática o vesícula secretora"]]},{"tipo":"figura","pagina":18,"pie":"Compartimentos del Golgi. A la izquierda, la secuencia de modificaciones de cada región, desde la CGN hasta la TGN, y los tres destinos de salida (lisosoma, membrana plasmática, vesícula secretora). A la derecha, el compartimento intermedio RE-Golgi y la orientación cis (hacia el RE) y trans.","src":"img/biologia-celular-y-tisular-t5-tema-5-organulos-celulares-p18.jpg"},{"tipo":"tabla","titulo":"Funciones del aparato de Golgi","columnas":["Función","Contenido examinable"],"filas":[["**Glicosilación**","Modifica los hidratos de carbono unidos a proteínas para que sigan madurando. También **sintetiza polisacáridos complejos de GAGs y de proteoglicanos**"],["**Reciclaje de membrana**","El flujo continuo de vesículas Golgi → membrana plasmática **renueva componentes** de la membrana y **aumenta su superficie**. Las membranas se fusionan en la **exocitosis**"],["**Secreción proteica en vesículas**","Termina de modificar las proteínas del RE y las empaqueta en vesículas hacia el exterior. Puede ser **secreción constitutiva** (fusión no regulada) o **regulada** (depende de una señal y de una ruta de señalización intracelular)"],["**Empaquetamiento de enzimas lisosómicas**","Las proteínas dirigidas a lisosomas están **marcadas**. Desde las **cisternas intermedias** se desprenden vesículas que forman los **lisosomas primarios**. El esquema del tema muestra el receptor de **manosa-6-fosfato** en la red trans"]]},{"tipo":"alerta","texto":"La glicosilación **empieza en el RER** y **continúa en el Golgi**: no es exclusiva de ninguno de los dos. Además, la síntesis de **GAGs y proteoglicanos** corresponde al **Golgi**, no al RE. Y los lípidos se sintetizan en el REL pero **terminan de madurar en el Golgi**."},{"tipo":"perla","texto":"Los **GAGs y proteoglicanos** sintetizados en el Golgi forman parte de la matriz extracelular de tejidos con los que trabaja el fisioterapeuta, como el cartílago o el tendón (complemento). Por eso las células productoras de matriz dependen de un Golgi muy activo."}]},{"id":"lisosomas","titulo":"4. Lisosomas","bloques":[{"tipo":"definicion","termino":"Lisosoma","texto":"**Orgánulo digestivo de la célula animal**. Es esférico, relativamente grande (0,2–0,5 µm en el esquema) y **se forma en el aparato de Golgi**. Contiene enzimas **hidrolíticas y proteolíticas** que degradan material de origen externo (**heterofagia**) e interno (**autofagia**). Un lisosoma típico contiene **unas 40 enzimas** distintas, todas **hidrolasas ácidas**."},{"tipo":"tabla","titulo":"Estructura del lisosoma","columnas":["Componente","Características"],"filas":[["Membrana","Envuelve y protege. Es crítica: si se rompe, las enzimas podrían **destruir toda la célula**"],["Enzimas","**Hidrolasas ácidas**: nucleasas, proteasas, glucosidasas, lipasas, fosfatasas, sulfatasas, fosfolipasas"],["Proteínas transportadoras","**Bomba H⁺ ATPasa**: gasta ATP para introducir H⁺ y mantener el **medio interno ácido (pH ≈5,0)** frente al citosol (pH ≈7,2)"]]},{"tipo":"parrafo","texto":"**¿Por qué un interior ácido?** Las hidrolasas son **ácidas**: solo funcionan bien a pH ≈5. Así la célula queda protegida por partida doble. La membrana mantiene las enzimas aisladas, y si escapan al citosol (pH ≈7,2) pierden gran parte de su actividad (complemento). Si se bloquea la bomba H⁺ ATPasa, el pH interno sube y la digestión lisosomal se frena."},{"tipo":"tabla","titulo":"Tipos de lisosomas","columnas":["Tipo","Definición según el tema"],"filas":[["**Lisosoma primario**","Solo contiene enzimas digestivas (recién salido del Golgi)"],["**Lisosoma secundario**","Enzimas digestivas **más sustratos en proceso de digestión**. Se forma por fusión de varios lisosomas primarios (con el material que se va a digerir)"],["**Fagolisosoma o vacuola digestiva**","Unión de varios lisosomas. Relacionado con la **nutrición** (heterofagia)"],["**Autofagolisosoma**","Elimina **restos celulares para el reciclaje** (autofagia)"],["**Cuerpo residual**","Lo que queda de un lisosoma secundario **tras la absorción**"]]},{"tipo":"esquema","titulo":"Formación de los distintos tipos de lisosomas","mermaid":"flowchart TD\n  G[\"Aparato de Golgi\"] --> P[\"Lisosoma primario\"]\n  F[\"Fagocitosis o pinocitosis\"] --> FG[\"Fagosoma o endosoma\"]\n  AU[\"Orgánulo dañado envuelto\"] --> AF[\"Autofagosoma\"]\n  FG --> S[\"Lisosoma secundario o fagolisosoma\"]\n  P --> S\n  AF --> AFL[\"Autofagolisosoma\"]\n  P --> AFL\n  S --> CR[\"Cuerpo residual\"]\n  AFL --> CR","pie":"La heterofagia (material externo) y la autofagia (material propio, por ejemplo una mitocondria envuelta por membrana del RE) convergen en la fusión con lisosomas primarios. Lo no digerido queda como cuerpo residual."},{"tipo":"figura","pagina":24,"pie":"Vías de digestión lisosomal: fagocitosis de una bacteria (fagosoma), pinocitosis (endosoma temprano → tardío) y autofagia de una mitocondria (autofagosoma). Todas confluyen en el lisosoma secundario, que termina como cuerpo residual.","src":"img/biologia-celular-y-tisular-t5-tema-5-organulos-celulares-p24.jpg"},{"tipo":"lista","items":["Digieren sustancias de origen externo (**heterofagia**) e interno (**autofagia**).","Metabolizan **grasas, proteínas y ácidos nucleicos**.","**Digestión interna**: degradan partes de la célula que están dañadas.","**Defensa**: cuando la célula es atacada por bacterias, las digieren y **activan el sistema inmunológico**."]},{"tipo":"alerta","texto":"**Lisosoma ≠ peroxisoma**. El lisosoma tiene **hidrolasas ácidas** y pH ≈5, y se forma en el **Golgi**. El peroxisoma tiene **enzimas oxidativas** (catalasa o peroxidasa) y un **núcleo cristalizado**, y sus proteínas llegan desde **polirribosomas libres** mediante PTS."}]},{"id":"vacuolas-peroxisomas","titulo":"5. Vacuolas y peroxisomas","bloques":[{"tipo":"tabla","titulo":"Vacuolas: animal frente a vegetal","columnas":["Rasgo","Célula animal","Célula vegetal"],"filas":[["Número y tamaño","**Varias y muy pequeñas**","**Una o dos, de gran tamaño**"],["Volumen celular","Pequeño","Hasta el **90%** del volumen celular"],["Abundancia","Menor","**Más abundantes**"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Vacuola","titulo":"Membrana vacuolar","texto":"Parte externa del orgánulo, formada por **fosfolípidos, proteínas de transporte y proteínas estructurales** (estas dan forma al orgánulo)."},{"etiqueta":"Vacuola","titulo":"Jugo celular","texto":"Parte interna: **agua, sustancias dañinas para la célula y productos de desecho**. Su gran contenido hídrico está limitado por la membrana."},{"etiqueta":"Vacuola","titulo":"Funciones","texto":"**Almacén**, **homeostasis**, **regulación de la densidad** e **intercambio acuoso**."}]},{"tipo":"definicion","termino":"Peroxisoma","texto":"Orgánulo **muy sencillo** de las células eucariotas, con **dos compartimentos**: una **membrana limitante** (bicapa lipídica) y una **matriz interna** con un **núcleo cristalizado**. Contiene **enzimas oxidativas (catalasa o peroxidasa)**."},{"tipo":"lista","items":["Función a) **Degradación de ácidos grasos y aminoácidos**.","Función b) **Detoxificación** de diversas moléculas en **células hepáticas y renales**.","Origen de sus proteínas: se sintetizan en **polirribosomas libres**, se liberan al **citosol** y llevan un **péptido señal de dirección peroxisomal (PTS)** que las dirige al peroxisoma (translocación, no vía Golgi)."]},{"tipo":"alerta","texto":"Aunque el temario incluye el peroxisoma en el bloque de endomembranas, sus proteínas **no** pasan por RE ni Golgi. Se fabrican en ribosomas libres y entran gracias al **PTS**, que es distinto del péptido señal reconocido por la SRP. También hay dos detoxificaciones distintas: la del **REL** (citocromo P450, hidrófobo → hidrófilo) y la **peroxisomal** (enzimas oxidativas)."}]},{"id":"mitocondrias","titulo":"6. Mitocondrias","bloques":[{"tipo":"parrafo","texto":"Las mitocondrias son **orgánulos convertidores de energía**: transforman moléculas en energía. Miden **1–4 µm de longitud y 0,5–1 µm de diámetro**. Su **número y forma varían** con el tipo celular, el estado funcional y las necesidades energéticas de la célula. Constan de **dos membranas**, un **espacio intermembranoso**, una **matriz** y **crestas** (pliegues de la membrana interna)."},{"tipo":"tabla","titulo":"Estructura y composición mitocondrial","columnas":["Componente","Composición","Características"],"filas":[["**Membrana externa**","**40% lípidos + 60% proteínas**","Da forma y separa del citosol. **Muy permeable (porinas que forman canales)**. Contiene muchas proteínas y enzimas de **síntesis y metabolismo de lípidos** para su uso en la matriz"],["**Membrana interna**","**25% lípidos + 75% proteínas**, con mucha **cardiolipina** (≈20% de sus lípidos)","Enzimas y transportadores de tránsito citosol-matriz. **Acumula H⁺**. La cardiolipina indica **origen bacteriano**"],["**Espacio intermembranoso**","Similar al **hialoplasma**","Entre ambas membranas. Allí se acumulan los H⁺ bombeados"],["**Matriz**","**Iones + enzimas + ribosomas + DNA mitocondrial**","Sede del **ciclo de Krebs**"],["**Crestas**","Pliegues de la membrana interna","Contienen las partículas de **ATP sintasa**"]]},{"tipo":"figura","pagina":32,"pie":"Esquema de la mitocondria. Localiza la membrana externa e interna, el espacio intermembrana, la matriz con ADN, ribosomas y gránulos, y las crestas con las partículas de ATP sintasa.","src":"img/biologia-celular-y-tisular-t5-tema-5-organulos-celulares-p32.jpg"},{"tipo":"lista","items":["a) **Metabolismo celular**: producción de **ATP por fosforilación oxidativa** y **síntesis de precursores**.","b) **Síntesis de proteínas**: **solo el 1%** de las proteínas celulares.","c) **Participación en la apoptosis**."]},{"tipo":"esquema","titulo":"Acoplamiento quimiosmótico","mermaid":"flowchart TD\n  A[\"Glucólisis en citosol\"] --> B[\"Piruvato\"]\n  C[\"Ácidos grasos\"] --> D[\"Ciclo de Krebs en matriz\"]\n  B --> D\n  D --> E[\"NADH\"]\n  E --> F[\"Cadena de transporte electrónico\"]\n  F -->|\"Fase 1\"| G[\"Gradiente transmembrana de H+\"]\n  G -->|\"Fase 2: H+ vuelven\"| H[\"ATP sintasa en crestas\"]\n  H --> I[\"ADP + Pi a ATP\"]","pie":"Fase 1: los electrones de la oxidación de los alimentos generan un gradiente de H⁺. Fase 2: los H⁺ regresan a través de la ATP sintasa, que usa esa energía para sintetizar ATP."},{"tipo":"tabla","titulo":"Fibras musculares y metabolismo energético","columnas":["Rasgo","Fibras de sacudida rápida","Fibras de sacudida lenta"],"filas":[["Duración de la sacudida","**15–40 ms**","**40–100 ms**"],["Fuente de energía","**Glucólisis** → ácido láctico","**ATP de la respiración aerobia**"],["Mitocondrias","Pocas (complemento)","**Muchas**"],["Consecuencia","**Descenso del pH a 6,35** → **dolor y calambres** tras ejercicio vigoroso","Resistencia a la fatiga (complemento)"],["Actividad típica","**Carreras cortas, levantamiento de pesas**","**Ir en bicicleta, andar rápido**"]]},{"tipo":"perla","texto":"En la readaptación, el trabajo **aeróbico** de baja-moderada intensidad solicita las fibras lentas, ricas en mitocondrias. El número de mitocondrias se adapta a las necesidades energéticas, y aumenta por **división de mitocondrias preexistentes**, nunca de novo. Los esfuerzos intensos y cortos dependen de la glucólisis: el ácido láctico baja el pH a ≈6,35 y explica el dolor y los calambres tras el ejercicio vigoroso."},{"tipo":"tabla","titulo":"Biogénesis mitocondrial","columnas":["Principio","Detalle"],"filas":[["Origen","**Nunca se forman de novo**"],["División","Duplican su masa y se dividen cuando la célula se divide: **bipartición, estrangulamiento o gemación**"],["Proteínas","Sintetizan proteínas mitocondriales (con sus ribosomas 70S y su DNA)"],["Herencia","**No mendeliana**: el genoma mitocondrial se transmite **solo por vía materna**"],["Dinámica","Ciclos de **fisión** (división) y **fusión** según la demanda fisiológica, regulados y señalizados"]]},{"tipo":"alerta","texto":"Ojo a los porcentajes: la **externa** es la de más lípidos (40/60) y la **interna** la más proteica (25/75). La **ATP sintasa** no está en la membrana externa sino en la de las **crestas** (interna). El **Krebs** ocurre en la **matriz**, no en el espacio intermembranoso. Y la mitocondria aporta solo el **1%** de la síntesis proteica."}]},{"id":"ribosomas","titulo":"7. Ribosomas","bloques":[{"tipo":"definicion","termino":"Ribosoma","texto":"Orgánulo intracitoplasmático **no membranoso** donde se **sintetizan las proteínas**. Está compuesto por **proteínas ribosómicas** y **rRNA**, con un **70% de agua**. Tiene una **subunidad mayor** y una **menor**, que suelen estar **separadas en el citosol** y se unen para la síntesis proteica."},{"tipo":"lista","items":["**Libres** en el citoplasma.","**Unidos al RER**.","**En hileras de 5 a 20** sobre un mismo mRNA: **polirribosomas**."]},{"tipo":"tabla","titulo":"Tipos y composición de los ribosomas","columnas":["Ribosoma","Dónde","Subunidad mayor","Subunidad menor"],"filas":[["**80S**","Células eucariotas (citosol, RER)","**60S**: rRNA **28S + 5,8S + 5S** y **49 proteínas**","**40S**: rRNA **18S** y **33 proteínas**"],["**70S**","**Bacterias, mitocondrias y cloroplastos**","50S: rRNA 23S + 5S (esquema)","30S: rRNA 16S (esquema)"]]},{"tipo":"parrafo","texto":"**Ensamblaje**: el **rRNA se sintetiza en el núcleo** y las **proteínas ribosómicas en el citoplasma**, desde donde **migran al núcleo**. En el **nucléolo** se unen rRNA y proteínas para formar las **dos subunidades por separado**. Estas salen al citoplasma por los **poros nucleares**, y **es allí donde se unen** para formar el ribosoma funcional. La función ribosómica (síntesis de proteínas, sitios A y P) se desarrolla en el Tema 10."},{"tipo":"alerta","texto":"El ribosoma **completo no se ensambla en el nucléolo**: allí solo se forman las **subunidades**, que se unen ya en el citoplasma. Tampoco confundas los coeficientes: los valores S **no son sumables** (60S + 40S = 80S; 50S + 30S = 70S). El 70S de la mitocondria apoya su origen bacteriano, igual que la cardiolipina."}]}],"caso_clinico":{"titulo":"Futbolista en fase de readaptación con calambres tras sprints","presentacion":"Varón de 24 años, futbolista semiprofesional, en la 6.ª semana de readaptación tras una rotura fibrilar de isquiotibiales. Esta semana ha empezado con series de **sprint de 30 m** y refiere **dolor intenso y calambres** al final de las series. Ha tomado antiinflamatorios orales varios días. El fisioterapeuta quiere entender el fenómeno a nivel celular para ajustar la carga: combinar trabajo **aeróbico en bicicleta** con fuerza progresiva.","preguntas":[{"pregunta":"¿Qué tipo de fibra y qué vía energética explican el dolor y los calambres al final de los sprints?","respuesta":"Los sprints cortos reclutan sobre todo **fibras de sacudida rápida (15–40 ms)**, que obtienen energía de la **glucólisis**. Su producto es el **ácido láctico**, que hace **descender el pH hasta ≈6,35** y se asocia a **dolor y calambres** tras el ejercicio vigoroso. No dependen principalmente de la fosforilación oxidativa mitocondrial, propia de las fibras lentas."},{"pregunta":"¿Qué orgánulo libera el Ca²⁺ necesario para cada contracción de esas fibras y cómo se relaciona con el sistema de endomembranas?","respuesta":"El **retículo sarcoplásmico**, que es el **REL** del músculo estriado. El REL es muy abundante en las células musculares y actúa como **almacén de Ca²⁺**. Lo libera para permitir la contracción: el Ca²⁺ actúa sobre troponina y tropomiosina y permite que la miosina se una a la actina. Forma parte del retículo endoplasmático, continuo con la envoltura nuclear e integrado en el sistema de endomembranas."},{"pregunta":"¿Por qué incluir trabajo aeróbico en bicicleta y qué ocurre con las mitocondrias? ¿Qué orgánulo hepático es clave para eliminar el antiinflamatorio?","respuesta":"La bicicleta solicita las **fibras de sacudida lenta (40–100 ms)**, que usan ATP de la **respiración aerobia**. Ese ATP procede del ciclo de Krebs en la matriz, la cadena de transporte electrónico y la **ATP sintasa** de las crestas. Las mitocondrias adaptan su **número a las necesidades energéticas**, pero **nunca se forman de novo**: aumentan por **división (bipartición, estrangulamiento o gemación)** y ciclos de fisión y fusión. El fármaco liposoluble se elimina gracias al **REL de los hepatocitos**, cuyo **citocromo P450** lo convierte en un compuesto más hidrosoluble, excretable por el riñón."}]},"glosario":[{"termino":"Lumen","definicion":"Espacio interno del RE (y de otros compartimentos) delimitado por su membrana y separado del citoplasma."},{"termino":"Péptido señal","definicion":"Secuencia de la proteína naciente que la SRP reconoce en el citosol para dirigir el ribosoma al RER."},{"termino":"SRP","definicion":"Partícula reconocedora de señal. Se une al péptido señal y al ribosoma, los lleva al receptor de SRP del RER y luego se libera."},{"termino":"Translocador","definicion":"Canal proteico de la membrana del RER al que queda unido el ribosoma y por el que la cadena entra en el lumen."},{"termino":"Glicosilación","definicion":"Adición de cadenas de oligosacáridos a proteínas, iniciada en el RER y completada en el Golgi. Marca el destino y la función de la proteína."},{"termino":"Citocromo P450","definicion":"Sistema enzimático del REL (sobre todo hepático) que convierte compuestos hidrófobos en hidrófilos para su eliminación renal."},{"termino":"Retículo sarcoplásmico","definicion":"REL del músculo estriado. Almacena Ca²⁺ y lo libera para la contracción."},{"termino":"Dictiosoma","definicion":"Conjunto de sacos o cisternas apiladas del aparato de Golgi. Varía según el tipo celular."},{"termino":"Red trans de Golgi (TGN)","definicion":"Región distal del Golgi que actúa como centro de organización y distribución hacia lisosomas, membrana o vesículas secretoras."},{"termino":"Hidrolasas ácidas","definicion":"Enzimas lisosomales (unas 40) activas a pH ≈5, mantenido por la bomba H⁺ ATPasa."},{"termino":"Cuerpo residual","definicion":"Resto de un lisosoma secundario tras la absorción de los productos digeridos."},{"termino":"PTS","definicion":"Péptido señal de dirección peroxisomal. Dirige al peroxisoma las proteínas sintetizadas en polirribosomas libres."},{"termino":"Cardiolipina","definicion":"Lípido abundante en la membrana mitocondrial interna (≈20% de sus lípidos), característico de membranas bacterianas."},{"termino":"Acoplamiento quimiosmótico","definicion":"Mecanismo de síntesis de ATP en dos fases: los electrones generan un gradiente de H⁺, y el reflujo de H⁺ por la ATP sintasa produce ATP."},{"termino":"Polirribosoma","definicion":"Hilera de 5 a 20 ribosomas que traducen simultáneamente un mismo mRNA."}],"fuentes":["Alberts B, et al. Biología celular.","Karp G. Biología Celular y Molecular. 5ª ed.","Blausen.com staff (2014). Blausen gallery 2014. Wikiversity Journal of Medicine. DOI:10.15347/wjm/2014.010.","Universidad Europea. Tema 5. Orgánulos celulares. Biología Celular y Tisular, curso 2025-26."],"qcm":[{"pregunta":"Durante la síntesis de una glicoproteína de secreción, ¿qué ocurre con la SRP una vez que el complejo ribosoma-péptido señal llega a la membrana del RER?","opciones":["Permanece unida al ribosoma hasta terminar la síntesis y se disocia junto con las subunidades","Se une a su receptor de membrana y después se libera, dejando el ribosoma acoplado al translocador","Se separa del péptido señal en el citosol, antes de alcanzar el receptor situado en la membrana","Atraviesa el translocador junto al péptido señal y se degrada después en el lumen del RER"],"correcta":1,"explicacion":"Según el tema, la SRP se une al péptido señal y al ribosoma y los dirige al RER. Allí se une a los receptores para SRP de la membrana y **se libera**, dejando el ribosoma unido al **translocador**. La SRP actúa como guía citosólica y nunca entra en el lumen.","por_opcion":["❌ La SRP no permanece hasta el final. Al terminar la síntesis, las que quedan fuera son las subunidades ribosómicas.","✅ Es la secuencia exacta: unión al receptor de SRP, liberación de la SRP y acoplamiento del ribosoma al translocador.","❌ Si se separara antes, el ribosoma no llegaría al RER: es precisamente la SRP la que lo lleva hasta su receptor.","❌ La SRP no entra en el lumen. Lo que entra es la cadena polipeptídica, que allí recibe la chaperona BiP."]},{"pregunta":"Una enzima oxidativa con PTS se dirige a su orgánulo de destino. ¿Cuál es su ruta de síntesis y llegada según el tema?","opciones":["Se traduce en ribosomas 70S de la matriz mitocondrial y sale hacia el peroxisoma por porinas","Se traduce en ribosomas del RER, madura en la red cis de Golgi y llega en vesículas al peroxisoma","Se traduce en polirribosomas libres, se libera al citosol y el PTS la dirige al peroxisoma","Se traduce en polirribosomas libres, entra en el RER por la SRP y alcanza el lisosoma primario"],"correcta":2,"explicacion":"Las proteínas peroxisomales (catalasa, peroxidasa) se sintetizan en **polirribosomas libres**, se liberan al **citosol** y llevan un **péptido señal de dirección peroxisomal (PTS)** que las dirige al peroxisoma. No pasan por la vía RE-Golgi.","por_opcion":["❌ Los ribosomas mitocondriales solo sintetizan ≈1% de las proteínas, de uso mitocondrial. Las porinas están en la membrana mitocondrial externa.","❌ Describe la vía secretora o lisosomal (RE → Golgi → vesículas), que no corresponde a las proteínas peroxisomales.","✅ Es la ruta que indica el tema: polirribosomas libres → citosol → PTS → peroxisoma.","❌ La SRP reconoce el péptido señal del RER, no el PTS. Además, el destino final sería el lisosoma, con hidrolasas ácidas, no enzimas oxidativas."]},{"pregunta":"Según el esquema de compartimentos del aparato de Golgi del tema, ¿en qué región se produce la fosforilación de oligosacáridos de las proteínas lisosomales?","opciones":["En la cisterna trans, junto a la adición de galactosa y NANA","En la red cis de Golgi, primera región de clasificación del material","En la red trans de Golgi, junto a la sulfatación de tirosinas","En la cisterna medial, junto a la adición de N-acetilglucosamina"],"correcta":1,"explicacion":"El esquema sitúa la **fosforilación de oligosacáridos de proteínas lisosomales** en la **red cis de Golgi (CGN)**, la primera región que recibe el material del RE. Las cisternas siguientes eliminan manosa y añaden GlcNAc, galactosa y NANA. La TGN sulfata y distribuye.","por_opcion":["❌ La cisterna trans añade galactosa y ácido siálico (NANA).","✅ La CGN es donde el esquema sitúa la fosforilación que marca las enzimas lisosomales.","❌ La TGN realiza la sulfatación de tirosinas y carbohidratos y la clasificación final, no esta fosforilación.","❌ En la cisterna medial se elimina manosa y se añade GlcNAc, pero no se fosforilan las proteínas lisosomales."]},{"pregunta":"Según el esquema de tráfico de proteínas de Alberts, la entrada de una proteína sintetizada en el citosol hacia la mitocondria corresponde a:","opciones":["Transporte vesicular, mediante vesículas desprendidas de la red trans del aparato de Golgi","Transporte cerrado, a través de complejos de poro semejantes a los de la envoltura nuclear","Vía endocítica, desde la superficie celular hasta el endosoma temprano y luego la mitocondria","Translocación de proteínas, mediante transportadores proteicos transmembrana específicos"],"correcta":3,"explicacion":"La **translocación** usa **transportadores proteicos transmembrana** que llevan la proteína desde el citosol a un espacio específico. En el esquema de Alberts así llegan las proteínas a la mitocondria, los plastos, los peroxisomas y el RE. El transporte cerrado se reserva al paso citosol-núcleo por los poros.","por_opcion":["❌ El transporte vesicular conecta RE, Golgi, endosomas, lisosomas y exterior, pero no abastece a la mitocondria.","❌ El transporte cerrado solo conecta citosol y núcleo a través de los complejos de poro nuclear.","❌ La vía endocítica lleva material de la superficie a endosomas y lisosomas, no a la mitocondria.","✅ El paso citosol → mitocondria es translocación mediante transportadores transmembrana."]},{"pregunta":"En una fibra de músculo estriado esquelético, ¿qué afirmación sobre el compartimento que almacena y libera el Ca²⁺ para la contracción es correcta?","opciones":["Es el REL, que en el músculo estriado es muy abundante y recibe el nombre de sarcoplásmico","Es el RER, cuyos ribosomas sintetizan las proteínas que secuestran el calcio del sarcoplasma","Es la vacuola muscular, encargada de la homeostasis y del intercambio acuoso de la fibra","Es el espacio intermembranoso mitocondrial, que acumula H⁺ y Ca²⁺ durante la fosforilación"],"correcta":0,"explicacion":"Una de las tres funciones del REL es ser **almacén de Ca²⁺**, que libera para permitir la **contracción muscular**. En el músculo estriado el REL es muy abundante y se llama **retículo sarcoplásmico**.","por_opcion":["✅ El REL del músculo estriado es el retículo sarcoplásmico, almacén y fuente de Ca²⁺ para la contracción.","❌ El RER se dedica a la síntesis y glicosilación de proteínas. El almacén de calcio es función del REL.","❌ Las vacuolas animales son pequeñas y sus funciones (almacén, homeostasis, densidad, intercambio acuoso) no incluyen liberar Ca²⁺ contráctil.","❌ El tema atribuye a la membrana interna la acumulación de H⁺, no la función de almacén de Ca²⁺ para la contracción."]},{"pregunta":"Un paciente toma un fármaco muy liposoluble que el riñón apenas puede eliminar sin transformación previa. ¿Qué mecanismo hepático descrito en el tema lo hace eliminable?","opciones":["La glicosilación del RER le añade oligosacáridos que permiten su secreción por vía biliar","La catalasa peroxisomal oxida el fármaco y lo vuelve más liposoluble para atravesar membranas","El citocromo P450 del REL lo convierte en un compuesto hidrófilo, apto para la excreción renal","Las hidrolasas ácidas del lisosoma lo degradan completamente a pH ≈5 dentro del hepatocito"],"correcta":2,"explicacion":"Muchos fármacos y toxinas **no son hidrosolubles**, por eso los riñones no los eliminan con eficacia. El hígado los transforma en formas más solubles en agua gracias a las enzimas del **citocromo P450 del REL**, que convierten **compuestos hidrófobos en hidrófilos** (fase 1 de la detoxificación).","por_opcion":["❌ La glicosilación marca proteínas según su destino y no es el mecanismo de detoxificación de fármacos.","❌ El peroxisoma también detoxifica, pero el tema atribuye la conversión hidrófobo → hidrófilo al REL. Además, el objetivo es hacer el compuesto más hidrosoluble, no más liposoluble.","✅ Es la función detoxificadora del REL: citocromo P450, de hidrófobo a hidrófilo, para que el riñón pueda eliminarlo.","❌ Las hidrolasas lisosomales digieren macromoléculas y material fagocitado, no biotransforman fármacos para su excreción renal."]},{"pregunta":"Un fibroblasto tendinoso produce grandes cantidades de matriz extracelular rica en proteoglicanos. ¿En qué orgánulo se sintetizan, según el tema, los polisacáridos complejos de GAGs y proteoglicanos?","opciones":["En el lisosoma secundario, a partir de los sustratos parcialmente digeridos que contiene","En el retículo endoplasmático liso, junto a los fosfolípidos y el colesterol de membrana","En el retículo endoplasmático rugoso, durante la translocación cotraduccional al lumen","En el aparato de Golgi, como parte de su función de glicosilación de las proteínas"],"correcta":3,"explicacion":"Dentro de la función de **glicosilación del aparato de Golgi**, el tema indica que, además de modificar los hidratos de carbono unidos a proteínas, **se sintetizan polisacáridos complejos de GAGs y de proteoglicanos**.","por_opcion":["❌ El lisosoma degrada sustancias. No sintetiza polisacáridos de la matriz.","❌ El REL sintetiza lípidos de membrana (fosfolípidos y colesterol), no GAGs.","❌ El RER sintetiza proteínas e inicia la glicosilación, pero el tema atribuye la síntesis de GAGs y proteoglicanos al Golgi.","✅ La síntesis de GAGs y proteoglicanos figura entre las funciones de glicosilación del Golgi."]},{"pregunta":"Se trata una célula con un inhibidor selectivo de la bomba H⁺ ATPasa de la membrana lisosomal. ¿Cuál es la consecuencia más coherente con el tema?","opciones":["El pH lisosomal se acercaría al del citosol (≈7,2) y bajaría la actividad de las hidrolasas ácidas","El RER dejaría de sintetizar enzimas lisosomales al no recibir la señal de acidez desde el Golgi","Las enzimas pasarían a ser oxidativas, de tipo catalasa, y el lisosoma actuaría como peroxisoma","El pH lisosomal descendería por debajo de 5 y las hidrolasas ácidas digerirían su propia membrana"],"correcta":0,"explicacion":"La **bomba H⁺ ATPasa** introduce H⁺ para mantener un **medio interno ácido (pH ≈5)** frente al citosol (pH ≈7,2). Todas las enzimas lisosomales son **hidrolasas ácidas**. Sin la bomba, el pH sube y la capacidad digestiva disminuye.","por_opcion":["✅ Sin bombeo de H⁺ se pierde la acidez y, con ella, la actividad óptima de las hidrolasas ácidas.","❌ La síntesis de enzimas en el RER no depende de una señal de acidez del lisosoma: es un efecto inventado.","❌ El tipo de enzima no cambia con el pH. Las enzimas oxidativas son propias del peroxisoma.","❌ Inhibir la bomba alcaliniza el lisosoma, no lo acidifica más."]},{"pregunta":"Una mitocondria envejecida queda rodeada por membrana procedente del RE y luego se fusiona con lisosomas primarios para reciclar sus componentes. La estructura resultante es:","opciones":["Un lisosoma primario, ya que aún contiene solamente enzimas digestivas activas","Un cuerpo residual, que es lo que queda tras absorber los productos digeridos","Un fagolisosoma, propio de la heterofagia relacionada con la nutrición","Un autofagolisosoma, encargado de eliminar restos celulares para su reciclaje"],"correcta":3,"explicacion":"La degradación de material propio (una mitocondria) es **autofagia**. El autofagosoma se fusiona con lisosomas primarios y forma el **autofagolisosoma**, que según el tema **elimina restos celulares para el reciclaje**.","por_opcion":["❌ El lisosoma primario no contiene sustrato. Al fusionarse con la mitocondria deja de serlo.","❌ El cuerpo residual es el resto que queda después de la digestión y absorción, no la fase activa de digestión.","❌ El fagolisosoma o vacuola digestiva procesa material externo (heterofagia, nutrición), no orgánulos propios.","✅ Material de origen interno más lisosomas primarios da un autofagolisosoma."]},{"pregunta":"Respecto a las vacuolas, ¿qué afirmación se ajusta exactamente a lo descrito en el tema?","opciones":["En células animales son varias y muy pequeñas; en vegetales pueden ocupar el 90%","Su jugo celular está formado por fosfolípidos, proteínas de transporte y estructurales","Sus funciones principales son la síntesis de lípidos, la detoxificación y el calcio","En células animales son una o dos y grandes; en vegetales, muy numerosas y pequeñas"],"correcta":0,"explicacion":"Las vacuolas son **más abundantes en células vegetales**, donde suele haber **una o dos de gran tamaño** que pueden ocupar hasta el **90% del volumen celular**. En células animales suelen ser **varias y muy pequeñas**.","por_opcion":["✅ Coincide con el tema: varias y pequeñas en la célula animal, y hasta el 90% del volumen en la vegetal.","❌ Esos componentes forman la membrana vacuolar. El jugo celular contiene agua, sustancias dañinas y desechos.","❌ Esas son las funciones del REL. Las de la vacuola son almacén, homeostasis, regulación de la densidad e intercambio acuoso.","❌ Invierte la descripción: una o dos grandes es lo propio de la célula vegetal."]},{"pregunta":"¿Qué dato de composición mitocondrial utiliza el tema como argumento a favor de su origen bacteriano?","opciones":["La matriz, con ribosomas 80S idénticos a los citosólicos y DNA asociado a histonas","La membrana externa, con 40% de lípidos y 60% de proteínas y porinas formando canales","El espacio intermembranoso, cuya composición es muy similar a la del hialoplasma celular","La membrana interna, con 25% de lípidos y 75% de proteínas y muy rica en cardiolipina"],"correcta":3,"explicacion":"La **membrana interna** tiene un 25% de lípidos y un 75% de proteínas, con gran cantidad de **cardiolipina**, un lípido que se encuentra en la membrana bacteriana y en la mitocondrial interna. El tema lo relaciona directamente con el **origen bacteriano**.","por_opcion":["❌ Los ribosomas mitocondriales son 70S, como los bacterianos, no 80S.","❌ Es la composición real de la membrana externa, pero el tema no la usa como prueba de origen bacteriano.","❌ La similitud con el hialoplasma describe el espacio intermembranoso y no se relaciona con el origen bacteriano.","✅ La riqueza en cardiolipina de la membrana interna es el marcador de origen bacteriano que señala el tema."]},{"pregunta":"En el acoplamiento quimiosmótico, ¿qué combinación de localizaciones es correcta?","opciones":["Ciclo de Krebs en el citosol; ATP sintasa disuelta libremente en la matriz","Ciclo de Krebs en las crestas; ATP sintasa en el espacio intermembranoso","Ciclo de Krebs en la matriz; ATP sintasa en la membrana de las crestas","Ciclo de Krebs en el espacio intermembranoso; ATP sintasa en la membrana externa"],"correcta":2,"explicacion":"El piruvato (de la glucólisis) y los ácidos grasos entran en el **ciclo de Krebs en la matriz**, que genera NADH. La cadena de transporte electrónico crea un gradiente de H⁺ (fase 1). Los H⁺ vuelven a través de la **ATP sintasa situada en la membrana de las crestas**, que usa esa energía para sintetizar ATP (fase 2).","por_opcion":["❌ En el citosol ocurre la glucólisis, no el Krebs. La ATP sintasa es una proteína de membrana.","❌ Las crestas contienen la ATP sintasa, no el Krebs. El espacio intermembranoso es donde se acumulan los H⁺.","✅ Coincide con el tema: Krebs en la matriz y ATP sintasa en las crestas (membrana interna).","❌ La membrana externa es permeable por porinas y no alberga la ATP sintasa. El Krebs tampoco ocurre en el espacio intermembranoso."]},{"pregunta":"Un velocista refiere dolor y calambres tras varias series de 60 m. Según el tema, ¿qué descripción corresponde a las fibras predominantes en ese esfuerzo?","opciones":["Sacudida rápida (15–40 ms), con glucólisis, ácido láctico y descenso del pH a 6,35","Sacudida rápida (40–100 ms), con ATP aerobio y descenso del pH hasta valores de 6,35","Sacudida lenta (40–100 ms), ricas en mitocondrias y dependientes de la respiración aerobia","Sacudida lenta (15–40 ms), con glucólisis, ácido láctico y calambres tras el esfuerzo"],"correcta":0,"explicacion":"Las **fibras de sacudida rápida (15–40 ms)** usan la energía de la **glucólisis**. Producen **ácido láctico**, que baja el **pH a 6,35** y provoca **dolor y calambres** tras el ejercicio vigoroso. Son las propias de carreras cortas y levantamiento de pesas.","por_opcion":["✅ Tiempo, vía energética y consecuencia coinciden con las fibras rápidas del tema.","❌ Asigna a las fibras rápidas el tiempo de las lentas (40–100 ms) y el metabolismo aerobio.","❌ Describe bien las fibras lentas, pero estas son propias de la bicicleta o la marcha rápida, no de los sprints.","❌ Atribuye a las fibras lentas el tiempo y el metabolismo de las rápidas."]},{"pregunta":"Sobre la biogénesis mitocondrial, ¿cuál de estas afirmaciones es correcta según el tema?","opciones":["Sintetizan la mayor parte de sus proteínas y solo un 1% procede de ribosomas citosólicos","Su genoma se transmite solo por vía materna, sin seguir las pautas de herencia mendeliana","Se dividen exclusivamente por gemación y no presentan ciclos de fusión entre ellas","Pueden formarse de novo a partir de membranas del RE cuando aumenta la demanda energética"],"correcta":1,"explicacion":"El tema establece que las mitocondrias **nunca se forman de novo**, que se dividen por **bipartición, estrangulamiento o gemación**, que tienen ciclos de **fisión y fusión** según la demanda, y que su genoma **no sigue las pautas mendelianas: se transmite solo por vía materna**.","por_opcion":["❌ El dato está invertido: la síntesis proteica mitocondrial supone solo el 1%.","✅ Es la herencia materna, no mendeliana, del genoma mitocondrial.","❌ Hay tres modalidades de división (bipartición, estrangulamiento, gemación) y ciclos regulados de fisión y fusión.","❌ Contradice el primer principio de la biogénesis: nunca se forman de novo."]},{"pregunta":"¿Qué descripción de las subunidades del ribosoma eucariota y de su ensamblaje es correcta?","opciones":["60S con rRNA 28S, 18S y 5S y 33 proteínas; 40S con rRNA 5,8S y 49 proteínas; se unen en el nucléolo","60S con rRNA 23S y 5S y 49 proteínas; 40S con rRNA 16S y 33 proteínas; se unen sobre la membrana del RER","60S con rRNA 28S, 5,8S y 5S y 33 proteínas; 40S con rRNA 18S y 49 proteínas; se unen en el núcleo","60S con rRNA 28S, 5,8S y 5S y 49 proteínas; 40S con rRNA 18S y 33 proteínas; se unen en el citoplasma"],"correcta":3,"explicacion":"La subunidad **60S** contiene rRNA **28S + 5,8S + 5S** y **49 proteínas**. La **40S** contiene rRNA **18S** y **33 proteínas**. Ambas se forman en el **nucléolo**, salen por los poros nucleares y **se unen en el citoplasma** para formar el ribosoma 80S.","por_opcion":["❌ El 18S pertenece a la 40S, el número de proteínas está invertido, y en el nucléolo se forman las subunidades, no el ribosoma completo.","❌ Los rRNA 23S y 16S son de ribosomas 70S (bacterias, mitocondrias), no del 80S eucariota.","❌ El número de proteínas está invertido (49 en la 60S, 33 en la 40S), y la unión ocurre en el citoplasma, no en el núcleo.","✅ Composición y lugar de unión coinciden con el tema."]}],"asignatura":"Biología celular y tisular","tema":5,"fecha":"2026-11-04"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const L = 'ABCD';
const secs = F.secciones || [];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="tarjetas">${(b.items||[]).map(t=>`<div class="tarjeta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="def"><b>${md(b.termino)}</b> — ${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota perla"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota alerta"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${md(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const nav = secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`).join('') + (F.caso_clinico?'<a href="#caso">Caso clínico</a>':'') + (F.glosario?.length?'<a href="#glosario">Glosario</a>':'') + `<a class="qcm" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`;

document.getElementById('app').innerHTML = `
<header class="portada"><div class="envoltura">
  <div class="etiquetas">${F.asignatura?`<span class="etiqueta">${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="etiqueta o">Tema ${esc(F.tema)}</span>`:''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="meta">${F.tipo==='grand-qcm'?`<div><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div><b>${secs.length}</b><span>secciones</span></div><div><b>${(F.ideas_clave||[]).length}</b><span>ideas clave</span></div>`}<div><b>${(F.qcm||[]).length}</b><span>preguntas</span></div><div id="ultimo"></div></div>
</div></header>
<nav class="indice" aria-label="Índice"><div class="envoltura">${nav}</div></nav>
<main class="envoltura">
  ${(F.objetivos||[]).length?`<div class="dos">
    <div class="caja"><h3>Objetivos</h3><ul>${(F.objetivos||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>
    <div class="caja"><h3>Lo que hay que saber</h3><ol class="claves">${(F.ideas_clave||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>
  </div>`:''}
  ${F.tipo==='grand-qcm'&&(F.fichas||[]).length?`<div class="caja" style="margin-top:40px"><h3>Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="num">Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd>`).join('')}</dl></section>`:''}
  <section id="qcm"><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="envoltura">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* ---------- esquemas ---------- */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:oscuro?'dark':'neutral',fontFamily:'Spectral, Georgia, serif',flowchart:{htmlLabels:true,curve:'basis'}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* ---------- QCM ---------- */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u) document.getElementById('ultimo').innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; }catch(e){} }
ultimo();
const marco = document.getElementById('marco');

function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${(pos)/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="etiqueta o" style="display:inline-block;margin-bottom:12px">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="btn sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="btn" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'Dominado. Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'Bien, pero repasa las preguntas falladas.':'Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="btn" id="rep">Repetir todo</button>${fallos.length?'<button class="btn sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
