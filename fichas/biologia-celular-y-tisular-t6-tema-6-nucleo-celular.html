<html lang="es">
<head>

<title>Tema 6. Núcleo celular · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#f6f4ef; --hoja:#fffdf9; --tinta:#1b2427; --suave:#5b676b; --linea:#e2ddd2; --acento:#1f6f6b; --acento-suave:#dcebe8;
  --ocre:#b37a1c; --ocre-suave:#f6ead3; --rojo:#a8402f; --rojo-suave:#f5e0db; --verde:#2f7a46; --verde-suave:#dcefe1;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --texto:"Spectral",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:19px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);line-height:1.12;margin:0;font-variation-settings:"SOFT" 50}
h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.9rem;font-weight:600;letter-spacing:-.015em;margin:0 0 18px}
h3{font-size:1.2rem;font-weight:600}
b,strong{font-weight:600}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px}
.envoltura{max-width:820px;margin:0 auto;padding:0 22px}
/* cabecera */
header.portada{padding:64px 0 36px;border-bottom:1px solid var(--linea)}
.etiquetas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.etiqueta{font:600 .78rem/1 var(--serif);padding:7px 11px;border-radius:999px;background:var(--acento-suave);color:var(--acento)}
.etiqueta.o{background:var(--ocre-suave);color:var(--ocre)}
.sub{font-size:1.25rem;color:var(--suave);margin:16px 0 0;max-width:62ch;font-style:italic}
.meta{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap}
.meta div{font-family:var(--serif)}
.meta b{display:block;font-size:1.7rem;font-weight:800;line-height:1}
.meta span{font-size:.8rem;color:var(--suave)}
/* navegación */
nav.indice{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px)}
nav.indice .envoltura{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .envoltura::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .85rem var(--serif);padding:7px 12px;border-radius:999px}
nav.indice a:hover{color:var(--tinta);background:var(--hoja)}
nav.indice a.qcm{background:var(--tinta);color:var(--papel);margin-left:auto}
main section{padding:56px 0 8px}
.num{font:800 .85rem var(--serif);color:var(--ocre);display:block;margin-bottom:6px}
p{margin:0 0 16px;max-width:68ch}
/* bloques */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:14px;padding:22px 24px}
.caja h3{margin-bottom:12px}
.caja ul,.caja ol{margin:0;padding-left:1.2em}
.caja li{margin:6px 0}
.claves{counter-reset:k;list-style:none;padding:0!important}
.claves li{counter-increment:k;padding-left:38px;position:relative;margin:10px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--acento);color:var(--papel);font:800 .8rem/26px var(--serif);text-align:center}
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
.tw{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--linea);border-radius:12px;background:var(--hoja)}
table{border-collapse:collapse;width:100%;font-size:.92rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:600 .95rem var(--serif);padding:14px 16px 4px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--linea)}
th{font:600 .82rem var(--serif);color:var(--suave);border-top:0}
tbody tr:nth-child(odd){background:color-mix(in srgb,var(--papel) 50%,transparent)}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 22px}
.tarjeta{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;font-size:.95rem;line-height:1.5}
.tarjeta .et{font:700 .72rem var(--serif);color:var(--ocre);display:block;margin-bottom:4px}
.tarjeta h3{font-size:1.05rem;margin-bottom:6px}
.def{border-left:3px solid var(--acento);padding:4px 0 4px 16px;margin:0 0 18px}
.def b{font-family:var(--serif);color:var(--acento)}
.nota{border-radius:12px;padding:14px 18px 14px 50px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;font-size:1.15rem}
.nota .t{font:700 .78rem var(--serif);display:block;margin-bottom:2px}
.perla{background:var(--verde-suave)} .perla::before{content:"🩺"} .perla .t{color:var(--verde)}
.alerta{background:var(--rojo-suave)} .alerta::before{content:"⚠️"} .alerta .t{color:var(--rojo)}
/* figuras y esquemas */
figure{margin:8px 0 26px;background:var(--hoja);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:20px 16px 8px;overflow-x:auto;text-align:center}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq .lienzo pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap;text-align:left}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{font-family:var(--serif);color:var(--tinta)}
/* caso clínico */
.caso{background:var(--tinta);color:var(--papel);border-radius:18px;padding:30px 30px 18px}
.caso h2{color:var(--papel)}
.caso p{color:color-mix(in srgb,var(--papel) 85%,transparent)}
.caso details{border-top:1px solid color-mix(in srgb,var(--papel) 18%,transparent);padding:12px 0}
.caso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
.caso details p{margin:10px 0 0}
dl.glosario{display:grid;grid-template-columns:max-content 1fr;gap:10px 20px;margin:0}
dl.glosario dt{font:600 1rem var(--serif);color:var(--acento)}
dl.glosario dd{margin:0}
.fuentes{font-size:.9rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border:1px solid var(--linea);border-radius:18px;padding:28px}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:600 .85rem var(--serif);color:var(--suave)}
.barra{flex:1;height:8px;border-radius:4px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--acento);transition:width .3s}
.pregunta{font:600 1.3rem/1.35 var(--serif);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer}
.op:hover:not([disabled]){border-color:var(--acento)}
.op .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 .9rem var(--serif);background:var(--hoja);border:1px solid var(--linea)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--verde);background:var(--verde-suave)}
.op.bien .l{background:var(--verde);color:#fff;border-color:var(--verde)}
.op.mal{border-color:var(--rojo);background:var(--rojo-suave)}
.op.mal .l{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{font:600 .95rem var(--serif);padding:11px 20px;border-radius:999px;border:0;background:var(--tinta);color:var(--papel);cursor:pointer}
.btn.sec{background:transparent;color:var(--tinta);border:1.5px solid var(--linea)}
.btn[disabled]{opacity:.35;cursor:default}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:800 4.4rem/1 var(--serif);letter-spacing:-.03em}
.resultado .gran small{font-size:1.6rem;color:var(--suave)}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:700px){body{font-size:17.5px}.dos{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}dl.glosario{grid-template-columns:1fr}dl.glosario dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i{transition:none}}
@media print{nav.indice,#qcm{display:none}body{background:#fff}}
</style>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script id="datos" type="application/json">{"titulo":"Tema 6. Núcleo celular","subtitulo":"Estructura del núcleo interfásico (envoltura, poro, lámina, carioplasma, nucléolo y cromatina), empaquetamiento del ADN desde el nucleosoma hasta el cromosoma mitótico y bases del cariotipo.","objetivos":["Al terminar, sabrás describir las capas de la envoltura nuclear y sus continuidades con el retículo endoplasmático, con sus medidas.","Al terminar, sabrás explicar la arquitectura del complejo poro y diferenciar el transporte pasivo del activo, tanto de entrada (NLS, importinas) como de salida (exportinas, ribonucleoproteínas, NES).","Al terminar, sabrás distinguir eucromatina y heterocromatina (constitutiva y facultativa) y relacionar el nucléolo con su ciclo y con las constricciones secundarias.","Al terminar, sabrás ordenar los niveles de compactación del ADN con sus diámetros (11, 30, 300 y 700 nm) y su composición.","Al terminar, sabrás identificar las partes de un cromosoma metafásico, sus tipos morfológicos y diferenciar cariotipo de cariograma."],"ideas_clave":["La **envoltura nuclear** son **dos membranas** separadas por el **espacio perinuclear (10-50 nm)**. La externa se continúa con el RE y lleva ribosomas, la interna se une a la lámina densa y el espacio perinuclear se continúa con la **luz del RER**.","La **lámina nuclear (densa)** es una red de filamentos adosada a la **membrana interna**. Da **apoyo mecánico** y sirve de **inserción a la cromatina periférica**. Sus subunidades se **despolimerizan en mitosis**.","El **complejo poro** tiene **~30 nucleoporinas** dispuestas en **8 bloques con simetría octogonal**. Sus componentes son columnar, anular y luminal, además de fibrillas y una canastilla nuclear. El transporte es **bidireccional y selectivo**.","Por **transporte pasivo** pasan las **pequeñas moléculas apolares** y las **proteínas \u003c 50 kDa**. Por **transporte activo** entran las proteínas con **NLS (4-8 aa)** mediante **importinas**. Salen snRNA, miRNA y tRNA por **exportinas**, el mRNA como **ribonucleoproteína** y las proteínas con **NES**.","El **nucléolo** sintetiza y ensambla el **ARNr**. **No tiene membrana** y contiene **ADN 1-3 %** y **ARN 10-30 %**. Se reduce antes de la mitosis y **desaparece en ella**. Después reaparece como muchos nucléolos pequeños que se fusionan.","La **cromatina** (ADN + proteínas) da la **basofilia** al núcleo. La **eucromatina** está dispersa y activa. La **heterocromatina** está condensada y sin transcripción, y puede ser constitutiva (secuencias muy repetitivas) o facultativa.","La compactación sigue esta secuencia: **nucleosoma 11 nm** (octámero H2A, H2B, H3 y H4 + ~147 pb, 2 vueltas) → **solenoide 30 nm** (6 nucleosomas, gracias a H1) → **asas de 300 nm** → **cromosoma de 700 nm**.","En el **cromosoma metafásico**, el **centrómero** es la constricción primaria y contiene el **cinetócoro**. El **telómero** es el extremo. Las **constricciones secundarias** son los **organizadores nucleolares** (genes de ARNr). El **cariograma** es la representación ordenada de los cromosomas obtenida en **metafase**."],"secciones":[{"id":"introduccion","titulo":"1. Introducción: el núcleo y el ciclo celular","bloques":[{"tipo":"parrafo","texto":"El núcleo es un **orgánulo membranoso característico de eucariotas** que **separa el ADN del resto de la célula**. Contiene la información para sintetizar todo lo que la célula necesita. Entre núcleo y citoplasma hay un **intercambio continuo e intenso** de moléculas e información, que el temario denomina **transporte cerrado**: todo el tráfico pasa por la envoltura a través de los poros. La **forma y la función** del núcleo dependen de la fase del ciclo, por eso se distinguen el **núcleo interfásico** y el **núcleo mitótico**."},{"tipo":"tabla","titulo":"Interfase dentro del ciclo celular","columnas":["Concepto","Dato del temario"],"filas":[["Interfase","Periodo entre dos divisiones (fases M) sucesivas"],["Duración relativa","Fase más larga del ciclo: **~95 %**"],["Subfases","**G1, S y G2**. G1 prepara la replicación, S replica el ADN y G2 prepara la mitosis"],["G0","Salida del ciclo desde G1 (aparece en el esquema del ciclo)"],["Fase M","Mitosis: profase, metafase, anafase y telofase"]]},{"tipo":"alerta","texto":"La interfase **no es una fase de reposo**. En ella el núcleo transcribe y, en la fase S, replica el ADN. El núcleo \"típico\" que describen los libros (envoltura, nucléolo, cromatina) es el **interfásico**. El ADN solo se ve en forma de cromosomas en el núcleo mitótico."},{"tipo":"alerta","texto":"El índice del PDF incluye un apartado de **Epigenética**, pero las diapositivas no desarrollan ningún contenido sobre él. Confirma en clase si entra en el examen."}]},{"id":"caracteristicas-generales","titulo":"2. Características generales del núcleo interfásico","bloques":[{"tipo":"tabla","titulo":"Rasgos del núcleo interfásico","columnas":["Rasgo","Lo habitual","Matices examinables"],"filas":[["Aspecto","Esfera grande con cromatina y **1-2 nucléolos**","Contiene eucromatina (dispersa, activa) y heterocromatina (condensada, sin transcripción)"],["Número","Normalmente **uno**","Algunas **células especializadas** tienen más de uno. Ejemplos (complemento): fibra muscular esquelética, osteoclasto"],["Ubicación","Normalmente **central**","Puede desplazarse según el tipo celular"],["Tamaño","**Constante dentro del mismo tipo celular**","**Muy grande en células indiferenciadas o muy activas**. Si cambia de volumen, indica **división celular**"]]},{"tipo":"perla","texto":"La **fibra muscular esquelética** es una célula **multinucleada** (complemento), y sus núcleos se sitúan en la periferia. Por eso la integridad de la envoltura y de la lámina nuclear es crítica en el músculo, que soporta tensión mecánica constante. Esta idea conecta directamente con el síndrome de Emery-Dreifuss."}]},{"id":"envoltura-nuclear","titulo":"3a. Envoltura nuclear, lámina y complejo poro","bloques":[{"tipo":"parrafo","texto":"La **envoltura nuclear** tiene como función **proteger el ADN** y controlar el tráfico núcleo-citoplasma, manteniendo constante la composición de cada espacio. Está formada por **dos membranas** (cada una, una bicapa fosfolipídica) separadas por el **espacio perinuclear, de 10-50 nm**. **No es continua**: presenta numerosos **poros nucleares**, donde **ambas membranas se fusionan**."},{"tipo":"tabla","titulo":"Componentes de la envoltura nuclear","columnas":["Componente","Características clave"],"filas":[["Membrana externa","**Se continúa con el RE** y presenta **ribosomas adheridos**"],["Espacio perinuclear","10-50 nm entre ambas membranas. **Se continúa con el lumen del RER**"],["Membrana interna","Tiene **proteínas específicas para unirse a la lámina densa**"],["Lámina densa (nuclear)","Red delgada de filamentos **adosada a la membrana interna**"],["Complejo poro","Zona de fusión de ambas membranas. Formado por ~30 nucleoporinas"]]},{"tipo":"figura","pagina":7,"pie":"Envoltura nuclear. Fíjate en los ribosomas sobre la membrana externa, en la continuidad de la membrana externa con el RE y en cómo, en cada poro, la membrana externa y la interna se fusionan. La lámina fibrosa queda adosada por dentro.","src":"img/biologia-celular-y-tisular-t6-tema-6-nucleo-celular-p7.jpg"},{"tipo":"definicion","termino":"Lámina nuclear (lámina densa o fibrosa)","texto":"Delgada **red de filamentos adosada a la membrana nuclear interna**. Está formada por subunidades que el PDF llama \"lamininas nucleares\" (en la figura de Cooper, *lamins A, B y C*), que se **despolimerizan durante la mitosis**. Sus funciones son el **apoyo mecánico a la envoltura** y la **inserción de la cromatina periférica**."},{"tipo":"alerta","texto":"No confundas las **láminas nucleares** (*lamins* A, B y C, filamentos intermedios del núcleo) con la **laminina** de la matriz extracelular (complemento). El PDF usa el término \"lamininas nucleares\": en el examen, reconócelo como la proteína de la **lámina nuclear**."},{"tipo":"parrafo","texto":"El **complejo poro** está formado por unas **30 proteínas diferentes (nucleoporinas)**, que forman un anillo de **8 bloques proteicos dispuestos octogonalmente**. Por su forma, se asemeja a una **canasta con simetría octogonal** compuesta de anillos, cubiertas y filamentos."},{"tipo":"tarjetas","items":[{"etiqueta":"Columnar","titulo":"Componente columnar","texto":"Forma la **pared del poro**."},{"etiqueta":"Anular","titulo":"Componente anular","texto":"Extiende sus **radios hacia el centro** del poro."},{"etiqueta":"Luminal","titulo":"Componente luminal","texto":"**Glucoproteína de anclaje** del poro a la envoltura nuclear (se sitúa en el espacio perinuclear)."},{"etiqueta":"Fibrillas","titulo":"Fibrillas y canastilla","texto":"Fibrillas que se proyectan **hacia el citosol y hacia el carioplasma**. Las nucleares forman una estructura fibrilar en **canastilla**."}]},{"tipo":"alerta","texto":"Pregunta del propio PDF: ¿qué componentes del anillo **no** se nombran en la descripción? Son los **anillos citosólico y nuclear** (*cytosolic ring* y *nuclear ring subunit*), que aparecen en la figura pero no en el texto."},{"tipo":"figura","pagina":9,"pie":"Complejo poro nuclear en 3D. Localiza la subunidad columnar (pared), la anular (radios al centro), la luminal (anclaje en el espacio perinuclear), los anillos citosólico y nuclear, las fibrillas citosólicas y la canastilla nuclear.","src":"img/biologia-celular-y-tisular-t6-tema-6-nucleo-celular-p9.jpg"},{"tipo":"parrafo","texto":"El transporte a través del poro es **bidireccional y selectivo**. Por **transporte pasivo** atraviesan las moléculas pequeñas apolares y las proteínas de menos de 50 kDa. Las moléculas mayores necesitan una **señal**: una **NLS** para entrar o una **NES** para salir, que reconocen los receptores de transporte (importinas y exportinas). Según la figura (complemento), el ciclo de Ran-GTP/GDP, con Ran GAP en el citoplasma y Ran GEF en el núcleo, da direccionalidad al proceso."},{"tipo":"tabla","titulo":"Transporte núcleo-citoplasma","columnas":["Tipo","Qué pasa","Mecanismo"],"filas":[["Pasivo","Pequeñas moléculas apolares y **proteínas \u003c 50 kDa**","Difusión libre por el poro"],["Activo: entrada","Proteínas con **señal de localización nuclear (NLS) de 4-8 aminoácidos**","**Importinas**. El PDF también menciona las exportinas en el ciclo de transporte"],["Activo: salida","**snRNA, miRNA y tRNA**","**Exportinas**"],["Activo: salida","**mRNA unido a proteínas**","Sale como **ribonucleoproteína**"],["Activo: salida","**Proteínas**","Secuencias **NES** (señal de exportación nuclear)"]]},{"tipo":"esquema","titulo":"Algoritmo del transporte a través del poro","mermaid":"flowchart TD\n  A[\"Molécula ante el complejo poro\"] --> B[\"Pequeña apolar o proteína menor de 50 kDa\"]\n  B --> C[\"Transporte pasivo\"]\n  A --> D[\"Transporte activo\"]\n  D -->|\"entrada\"| E[\"Proteína con NLS de 4-8 aa\"]\n  E --> F[\"Importinas\"]\n  D -->|\"salida\"| G[\"snRNA, miRNA y tRNA\"]\n  G --> H[\"Exportinas\"]\n  D -->|\"salida\"| I[\"ARNm\"]\n  I --> J[\"Como ribonucleoproteína\"]\n  D -->|\"salida\"| K[\"Proteínas con NES\"]","pie":"Primero pregúntate por el tamaño y la naturaleza de la molécula. Si no puede pasar libremente, identifica su señal (NLS o NES) o el tipo de ARN."},{"tipo":"parrafo","texto":"**Síndrome de Emery-Dreifuss.** Es una **distrofia muscular ligada al cromosoma X**. Se caracteriza por **contracturas articulares en tendones de Aquiles, cuello y codos**, **atrofia muscular progresiva** y **anomalías cardíacas**. Se debe a la **ausencia de una proteína de la envoltura nuclear en todas las células del cuerpo**. En la forma ligada a X, esa proteína es la **emerina** (complemento), una proteína de la membrana nuclear interna unida a la lámina; aparece rotulada como *Emerin* en las figuras."},{"tipo":"perla","texto":"En un paciente con Emery-Dreifuss, el fisioterapeuta trabaja sobre las **contracturas precoces** (tríceps sural/Aquiles, codos, columna cervical) con estiramientos, ortesis y mantenimiento del rango articular. Siempre debe **vigilar la respuesta cardíaca** al ejercicio, porque la afectación cardíaca forma parte del cuadro. Aunque la proteína falta en todas las células, la clínica predomina en los tejidos sometidos a **estrés mecánico** (músculo esquelético y corazón), lo que concuerda con la función de **apoyo mecánico** de la envoltura y la lámina."}]},{"id":"carioplasma","titulo":"3b. Carioplasma (nucleoplasma)","bloques":[{"tipo":"definicion","termino":"Carioplasma = nucleoplasma","texto":"**Medio interno acuoso** en el que están inmersos los demás componentes nucleares. Es un **gel de estructura y composición similar al hialoplasma**, formado por **agua, proteínas, ARN e iones**, y **no tiene citoesqueleto**."},{"tipo":"lista","items":["**Función:** es el lugar de la **síntesis de ARN (transcripción)** y de la **síntesis de ADN (replicación)**.","La rigidez de la periferia nuclear depende de la **lámina nuclear**, no de un citoesqueleto interno."]},{"tipo":"alerta","texto":"Trampa típica: atribuir al carioplasma un citoesqueleto propio. El PDF lo niega expresamente. El soporte mecánico del núcleo es la **lámina nuclear**, adosada a la membrana interna."}]},{"id":"nucleolo","titulo":"3c. Nucléolo","bloques":[{"tipo":"parrafo","texto":"El **nucléolo** es una estructura **esférica, visible en el núcleo interfásico**, cuya función principal es la **síntesis y ensamblaje del ARN ribosómico**. **No tiene membrana**. Está formado por **proteínas, ADN (1-3 %) y ARN (10-30 %)**, y algunas células tienen más de uno. Se forma alrededor de los **organizadores nucleolares**, situados en las **constricciones secundarias** de ciertos cromosomas, donde están los genes del ARNr. Por eso su tamaño refleja la actividad de síntesis ribosómica de la célula."},{"tipo":"tabla","titulo":"Composición del nucléolo","columnas":["Componente","Proporción"],"filas":[["Proteínas","Componente mayoritario"],["ARN","**10-30 %**"],["ADN","**1-3 %**"],["Membrana","**Ausente**"]]},{"tipo":"esquema","titulo":"El nucléolo a lo largo del ciclo celular","mermaid":"flowchart LR\n  A[\"Interfase: nucléolo visible\"] --> B[\"Cerca de la mitosis: disminuye de tamaño\"]\n  B --> C[\"Cromosomas se condensan y cesa la transcripción de ARN\"]\n  C --> D[\"Mitosis: el nucléolo desaparece\"]\n  D --> E[\"Reinicio de síntesis de ARN: muchos nucléolos pequeños\"]\n  E --> F[\"Crecen rápido y se fusionan\"]\n  F --> A","pie":"La desaparición del nucléolo en la mitosis es consecuencia de la condensación cromosómica y del cese de la transcripción. Reaparece fragmentado y luego se fusiona."},{"tipo":"figura","pagina":13,"pie":"Abajo, la barra del ciclo (G2, mitosis, G1 y S) con los dibujos del núcleo: observa cómo el nucléolo se reduce en G2, desaparece en la mitosis y reaparece en G1 como múltiples nucléolos pequeños que se fusionan.","src":"img/biologia-celular-y-tisular-t6-tema-6-nucleo-celular-p13.jpg"}]},{"id":"cromatina","titulo":"3d. Cromatina","bloques":[{"tipo":"definicion","termino":"Cromatina","texto":"**Complejo de ADN y proteínas estructurales** responsable del **carácter basófilo del núcleo**. Es la forma en que el ADN se presenta en el **núcleo interfásico**."},{"tipo":"tabla","titulo":"Eucromatina frente a heterocromatina","columnas":["Rasgo","Eucromatina","Heterocromatina"],"filas":[["Condensación","Dispersa","**Altamente condensada**"],["Transcripción","**Activa**","**Sin transcripción**"],["Aspecto en microscopía electrónica","Zonas claras","Grumos oscuros"],["Subtipos","—","**Constitutiva** (secuencias altamente repetitivas) y **facultativa**"],["Localización","Difusa en el carioplasma","**Marginal, nucleolar o cariosómica**"]]},{"tipo":"esquema","titulo":"Clasificación de la cromatina interfásica","mermaid":"flowchart TD\n  A[\"Cromatina: ADN y proteínas\"] --> B[\"Eucromatina dispersa\"]\n  A --> C[\"Heterocromatina condensada\"]\n  B --> B1[\"Transcripción activa\"]\n  C --> C0[\"Sin transcripción\"]\n  C --> C1[\"Constitutiva: secuencias altamente repetitivas\"]\n  C --> C2[\"Facultativa\"]\n  C --> C3[\"Marginal, nucleolar o cariosómica\"]","pie":"La clasificación se basa en el grado de condensación, que determina si el ADN es accesible para la transcripción."},{"tipo":"parrafo","texto":"El problema físico es enorme: un núcleo es una **esfera de 5-8 µm de diámetro** que debe alojar **~2 m de material genético**. Esto solo es posible gracias a **niveles jerárquicos de compactación**."}]},{"id":"empaquetamiento","titulo":"4. Empaquetamiento del genoma","bloques":[{"tipo":"tabla","titulo":"Niveles de compactación del ADN","columnas":["Nivel","Diámetro","Estructura y responsable"],"filas":[["ADN desnudo","2 nm","Doble hélice"],["Nucleosoma (\"collar de perlas\", fibra de 10-11 nm)","**11 nm**","**Octámero de histonas** (H2A, H2B, H3 y H4, dos de cada) + **2 vueltas de ADN (~147 pb)**. Entre nucleosomas, **ADN espaciador de 0-80 pb**"],["Solenoide","**30 nm**","Enrollamiento de **6 nucleosomas** por vuelta (polinucleosoma). El empaquetamiento se debe a la **histona H1**"],["Asas cromatínicas","**300 nm**","El solenoide se pliega en **asas amplias superenrolladas**"],["Cromosoma mitótico","**700 nm**","Las asas se compactan en un cromosoma condensado"]]},{"tipo":"esquema","titulo":"De la doble hélice al cromosoma","mermaid":"flowchart LR\n  A[\"ADN doble hélice 2 nm\"] -->|\"octámero H2A H2B H3 H4\"| B[\"Nucleosoma 11 nm\"]\n  B -->|\"H1, 6 nucleosomas por vuelta\"| C[\"Solenoide 30 nm\"]\n  C -->|\"asas superenrolladas\"| D[\"Fibra de 300 nm\"]\n  D -->|\"compactación máxima\"| E[\"Cromosoma 700 nm\"]","pie":"Memoriza la secuencia 2, 11, 30, 300 y 700 nm, y qué proteína o proceso permite cada salto."},{"tipo":"alerta","texto":"La **H1 no forma parte del octámero**. El octámero está formado por **H2A, H2B, H3 y H4** (dos de cada). La H1 se une al ADN espaciador y es la responsable del paso a la fibra de 30 nm. En el examen también aparece mucho el dato de los **~147 pb y 2 vueltas** por nucleosoma."},{"tipo":"figura","pagina":16,"pie":"Los cuatro niveles de empaquetamiento. Arriba a la izquierda, el octámero con la histona H1 y el *linker DNA*. Abajo, la progresión de la fibra de 10 nm a la de 30 nm (solenoide), los lazos de 300 nm y el brazo cromosómico de 700 nm.","src":"img/biologia-celular-y-tisular-t6-tema-6-nucleo-celular-p16.jpg"}]},{"id":"nucleo-mitotico","titulo":"5. Núcleo mitótico: cromosomas y cariotipo","bloques":[{"tipo":"parrafo","texto":"Los **cromosomas** son estructuras **cilíndricas** que representan el **máximo grado de empaquetamiento del ADN**. Son un complejo ADN-histonas perfectamente definido. **Cromatina y cromosoma son el mismo material en distinto estado morfológico**: la cromatina corresponde a la interfase y el cromosoma a la división. Su estructura se describe en **metafase**."},{"tipo":"tabla","titulo":"Partes del cromosoma metafásico","columnas":["Estructura","Descripción y función"],"filas":[["Cromátidas","Componentes **simétricos**. Cada una es **una molécula de ADN con igual información** y están unidas por el centrómero"],["Centrómero (constricción primaria)","Parte **más delgada** del cromosoma, con **ADN muy repetitivo**. Asegura la **correcta distribución** de los cromosomas duplicados y divide cada cromátida en brazo corto y brazo largo"],["Cinetócoro","**Región especializada del centrómero** por la que el cromosoma se une al **huso mitótico (microtúbulos)**"],["Telómero","**Extremo** del cromosoma. Aporta **estabilidad estructural** y es crítico en la **replicación y el mantenimiento** del cromosoma (impide que los extremos se fusionen)"],["Constricción secundaria","**Constante en posición y tamaño**. Es el **organizador nucleolar**, donde están los genes que codifican el **ARNr**"],["Satélite","**Cuerpo esférico** separado del cromosoma por una **constricción secundaria**. Formado por secuencias repetidas similares a las de los centrómeros"],["Bandas","Sirven para identificar y nombrar dónde se encuentra un gen"]]},{"tipo":"alerta","texto":"**Centrómero y cinetócoro no son sinónimos.** El centrómero es la constricción primaria. El cinetócoro es la **región especializada** dentro de ella donde se anclan los microtúbulos del huso. Igualmente, la constricción **primaria** es el centrómero y la **secundaria** es el organizador nucleolar."},{"tipo":"tarjetas","items":[{"etiqueta":"D","titulo":"Metacéntrico","texto":"Centrómero en posición central, con brazos de longitud similar (figura D del PDF)."},{"etiqueta":"C","titulo":"Submetacéntrico","texto":"Centrómero algo desplazado, con un brazo corto y otro largo (figura C)."},{"etiqueta":"A","titulo":"Acrocéntrico","texto":"Centrómero muy próximo a un extremo, con brazo corto muy pequeño (figura A)."},{"etiqueta":"B","titulo":"Con satélites","texto":"Constricciones secundarias que forman satélites (figura B)."}]},{"tipo":"figura","pagina":19,"pie":"Morfologías cromosómicas según la posición del centrómero: A acrocéntrico, B con satélites (constricción secundaria), C submetacéntrico y D metacéntrico. A la izquierda, una metafase con los telómeros marcados en los extremos.","src":"img/biologia-celular-y-tisular-t6-tema-6-nucleo-celular-p19.jpg"},{"tipo":"tabla","titulo":"Ploidía y número cromosómico","columnas":["Concepto","Dato"],"filas":[["Haploide","**n** cromosomas"],["Diploide","**2n** cromosomas. Los eucariotas son diploides (un juego de la madre y otro del padre)"],["Poliploide","**Más de 2n** cromosomas"],["Ser humano","**46**"],["Mosca de la fruta","**8**"],["Chimpancé","**48**"],["Perro","**78**"],["Cangrejo ermitaño","**254**"]]},{"tipo":"definicion","termino":"Cariotipo frente a cariograma","texto":"El **cariotipo** es el **conjunto de cromosomas** de una célula y, por tanto, el rasgo característico de cada especie. El **cariograma** es la **representación ordenada** de los cromosomas de un individuo, que se obtiene **deteniendo la célula en metafase**. En él, **cada pareja de homólogos se designa con un número**."},{"tipo":"alerta","texto":"El número de cromosomas **no refleja la complejidad** del organismo: el perro tiene 78 y el cangrejo ermitaño 254, frente a 46 en el ser humano. Además, el cariotipo es el **conjunto**, mientras que el cariograma es su **representación gráfica ordenada**."}]}],"caso_clinico":{"titulo":"Contracturas precoces y palpitaciones en un adolescente","presentacion":"Varón de 16 años derivado a fisioterapia por marcha en puntillas y dificultad para extender completamente los codos. Refiere rigidez cervical progresiva desde los 12 años. Presenta debilidad y atrofia en la musculatura húmero-peroneal. Un tío materno tuvo una evolución similar y falleció por un problema cardíaco. El cardiólogo ha detectado alteraciones de la conducción. El estudio genético confirma un **síndrome de Emery-Dreifuss ligado al cromosoma X**.","preguntas":[{"pregunta":"¿Qué estructura celular está alterada y qué función normal suya explica la clínica?","respuesta":"Falta una **proteína de la envoltura nuclear**. En la forma ligada a X es la emerina (complemento), una proteína de la **membrana nuclear interna** asociada a la **lámina nuclear**. La membrana interna posee proteínas específicas para unirse a la lámina densa, y esta da **apoyo mecánico a la envoltura** y sirve de **inserción a la cromatina periférica**. Sin esa unión, el núcleo resiste peor el estrés mecánico."},{"pregunta":"Si la proteína falta en todas las células del cuerpo, ¿por qué la afectación es sobre todo muscular y cardíaca?","respuesta":"Porque el **músculo esquelético y el miocardio** son los tejidos sometidos a **mayor carga mecánica** repetida. La fibra muscular, además, es multinucleada (complemento), con muchos núcleos expuestos a la tensión. Un defecto en el **soporte mecánico** que proporciona el complejo envoltura-lámina se manifiesta antes donde la exigencia mecánica es máxima. En el resto de tejidos la proteína también falta, pero la exigencia mecánica no basta para dar síntomas."},{"pregunta":"¿Qué implicaciones tiene para el plan de fisioterapia?","respuesta":"El objetivo es **prevenir y frenar las contracturas** típicas: tríceps sural/tendón de Aquiles, flexores de codo y extensores cervicales. Para ello se usan estiramientos mantenidos, movilizaciones, posicionamiento y ortesis nocturnas. El fortalecimiento debe ser submáximo para no agravar la atrofia. Por la **afectación cardíaca** asociada, el ejercicio exige **monitorizar frecuencia y síntomas**, adaptarse a las indicaciones del cardiólogo y evitar esfuerzos intensos."}]},"glosario":[{"termino":"Envoltura nuclear","definicion":"Doble membrana que delimita el núcleo, separada por el espacio perinuclear (10-50 nm) e interrumpida por poros."},{"termino":"Espacio perinuclear","definicion":"Espacio de 10-50 nm entre las dos membranas nucleares. Se continúa con la luz del RER."},{"termino":"Lámina nuclear (densa)","definicion":"Red de filamentos adosada a la membrana interna. Da soporte mecánico y ancla la cromatina periférica, y se despolimeriza en mitosis."},{"termino":"Nucleoporinas","definicion":"Unas 30 proteínas que forman el complejo poro, organizado en 8 bloques con simetría octogonal."},{"termino":"NLS","definicion":"Señal de localización nuclear de 4-8 aminoácidos que permite la entrada activa de proteínas mediante importinas."},{"termino":"NES","definicion":"Secuencia de exportación nuclear que permite la salida activa de proteínas del núcleo."},{"termino":"Carioplasma (nucleoplasma)","definicion":"Gel acuoso nuclear, similar al hialoplasma y sin citoesqueleto. En él ocurren la transcripción y la replicación."},{"termino":"Nucléolo","definicion":"Estructura esférica sin membrana donde se sintetiza y ensambla el ARNr. Contiene ADN 1-3 % y ARN 10-30 %."},{"termino":"Eucromatina","definicion":"Cromatina dispersa y transcripcionalmente activa."},{"termino":"Heterocromatina","definicion":"Cromatina muy condensada y sin transcripción. Puede ser constitutiva (secuencias repetitivas) o facultativa."},{"termino":"Nucleosoma","definicion":"Partícula de 11 nm formada por un octámero de histonas (H2A, H2B, H3 y H4) con ~147 pb de ADN en 2 vueltas."},{"termino":"Solenoide","definicion":"Fibra de 30 nm formada por 6 nucleosomas por vuelta, gracias a la histona H1."},{"termino":"Cinetócoro","definicion":"Región especializada del centrómero donde se unen los microtúbulos del huso mitótico."},{"termino":"Organizador nucleolar","definicion":"Constricción secundaria del cromosoma que contiene los genes del ARNr."},{"termino":"Cariograma","definicion":"Representación ordenada de los cromosomas de un individuo, obtenida en metafase y con los homólogos numerados."}],"fuentes":["Solana Manrique, C. Tema 6. Núcleo celular. Biología Celular y Tisular, Grado en Fisioterapia, Universidad Europea, curso 2025-2026.","Cooper, G. M. La célula, 6ª ed.","Alberts et al. Molecular Biology of the Cell, 5ª ed. Garland Science, 2008 (figura 12-9a).","van Steensel lab, 2011 (figura de empaquetamiento).","Commons.wikimedia.org (figuras)."],"qcm":[{"pregunta":"Sobre la organización de la envoltura nuclear descrita en el temario, ¿qué afirmación es correcta?","opciones":["La membrana interna lleva ribosomas adheridos y se continúa con el RE","La membrana externa posee proteínas específicas de unión a la lámina","Ambas membranas se fusionan únicamente donde se ancla la lámina densa","El espacio perinuclear mide 10-50 nm y se continúa con la luz del RER"],"correcta":3,"explicacion":"Las dos membranas están separadas por el espacio perinuclear, de 10-50 nm, que se continúa con el lumen del RER. Los ribosomas y la continuidad con el RE corresponden a la membrana externa. Las proteínas de unión a la lámina están en la interna, y la fusión de ambas membranas ocurre en los poros.","por_opcion":["❌ Los ribosomas adheridos y la continuidad con el RE son rasgos de la membrana externa, no de la interna.","❌ Las proteínas de unión a la lámina densa están en la membrana interna, que es la que está en contacto con ella.","❌ La fusión de ambas membranas ocurre en los poros nucleares, no en la lámina.","✅ El dato exacto del temario: 10-50 nm y continuidad con la luz del RER."]},{"pregunta":"Una proteína nuclear de 120 kDa sintetizada en el citosol debe alcanzar el carioplasma. ¿Qué requiere según el temario?","opciones":["Una secuencia NES reconocida por exportinas en la cara citosólica","Una señal NLS de 4-8 aminoácidos reconocida por importinas","Una señal NLS de 20-30 aminoácidos reconocida por nucleoporinas","Difusión libre por el poro gracias a su carácter polar y soluble"],"correcta":1,"explicacion":"Las proteínas de más de 50 kDa no pasan por transporte pasivo. Para entrar necesitan transporte activo mediante una señal de localización nuclear (NLS) de 4-8 aminoácidos, reconocida por importinas. La NES es la señal de salida.","por_opcion":["❌ La NES es la señal de exportación de proteínas, no de entrada.","✅ La entrada activa depende de una NLS de 4-8 aminoácidos y de las importinas.","❌ La longitud de la NLS es de 4-8 aminoácidos, y el reconocimiento lo hacen receptores de transporte (importinas).","❌ Solo difunden libremente las moléculas pequeñas apolares y las proteínas menores de 50 kDa."]},{"pregunta":"¿Qué tipo de ARN abandona el núcleo formando un complejo ribonucleoproteico, en lugar de hacerlo unido a exportinas?","opciones":["ARN pequeño nuclear (snRNA)","ARN de transferencia (tRNA)","ARN mensajero (mRNA)","MicroARN (miRNA)"],"correcta":2,"explicacion":"Según el temario, snRNA, miRNA y tRNA salen mediante exportinas. El mRNA sale unido a proteínas, en forma de ribonucleoproteínas. Las proteínas, por su parte, salen mediante secuencias NES.","por_opcion":["❌ El snRNA sale mediante exportinas.","❌ El tRNA sale mediante exportinas.","✅ El mRNA sale unido a proteínas, como ribonucleoproteína.","❌ El miRNA sale mediante exportinas."]},{"pregunta":"En un tejido cuyo tamaño nuclear es constante para su tipo celular, se observa que un núcleo aumenta claramente de volumen. ¿Qué indica según el temario?","opciones":["Que la célula se prepara para la división celular","Que predomina la heterocromatina sobre la eucromatina","Que la célula ha salido del ciclo y entra en G0","Que el nucléolo ha desaparecido por cese de la transcripción"],"correcta":0,"explicacion":"El tamaño nuclear es constante dentro de un mismo tipo celular. Un cambio de volumen indica división celular. Los núcleos muy grandes son propios de células indiferenciadas o muy activas.","por_opcion":["✅ El temario lo dice así: si el núcleo cambia de volumen, la célula se va a dividir.","❌ El predominio de heterocromatina indica baja actividad transcripcional, no un aumento de volumen.","❌ G0 es la salida del ciclo y no se asocia a un aumento de volumen nuclear.","❌ La desaparición del nucléolo ocurre en la mitosis y no define el cambio de volumen nuclear."]},{"pregunta":"Respecto a la lámina nuclear, ¿qué afirmación es correcta?","opciones":["Sus subunidades se despolimerizan en mitosis y anclan la cromatina periférica","Es una red estable que persiste intacta durante toda la mitosis","Es una red adosada a la membrana externa que ancla el RER","Es el citoesqueleto propio que estructura todo el carioplasma"],"correcta":0,"explicacion":"La lámina nuclear es una red delgada adosada a la membrana interna. Da apoyo mecánico y sirve de inserción a la cromatina periférica. Sus subunidades se despolimerizan durante la mitosis.","por_opcion":["✅ Las dos funciones y su despolimerización mitótica coinciden con el temario.","❌ Se despolimeriza durante la mitosis.","❌ Está adosada a la membrana interna, no a la externa.","❌ El carioplasma no tiene citoesqueleto, y la lámina es periférica."]},{"pregunta":"En la descripción del complejo poro en corte transversal, ¿qué componente corresponde a una glucoproteína de anclaje a la envoltura nuclear?","opciones":["Componente anular","Canastilla nuclear","Componente columnar","Componente luminal"],"correcta":3,"explicacion":"El componente luminal es la glucoproteína que ancla el poro a la envoltura y se sitúa en el espacio perinuclear. El columnar forma la pared, el anular extiende radios al centro y la canastilla es la estructura fibrilar de la cara nuclear.","por_opcion":["❌ El componente anular extiende sus radios hacia el centro del poro.","❌ La canastilla es la estructura fibrilar de la cara nuclear del poro.","❌ El componente columnar forma la pared del poro.","✅ El luminal es la glucoproteína de anclaje a la envoltura."]},{"pregunta":"Según el temario, ¿cómo está organizado el complejo poro?","opciones":["Unas 30 nucleoporinas en 6 bloques con simetría hexagonal","Unas 8 nucleoporinas en 30 bloques con simetría radial","Unas 30 nucleoporinas en 8 bloques con simetría octogonal","Unas 50 nucleoporinas en 8 bloques con simetría bilateral"],"correcta":2,"explicacion":"El complejo poro está formado por unas 30 proteínas diferentes (nucleoporinas) que forman un anillo de 8 bloques dispuestos octogonalmente. Por eso se describe como una canasta con simetría octogonal.","por_opcion":["❌ El 6 corresponde a los nucleosomas por vuelta del solenoide, no al poro.","❌ Invierte las cifras: son 30 proteínas y 8 bloques.","✅ 30 nucleoporinas, 8 bloques y simetría octogonal.","❌ 50 es el umbral en kDa del transporte pasivo, y la simetría es octogonal."]},{"pregunta":"¿Qué afirmación sobre la composición del nucléolo es correcta?","opciones":["Contiene ARN 10-30 % y ADN 1-3 %, y carece de membrana","Contiene ADN 10-30 % y ARN 1-3 %, y carece de membrana","Contiene ADN 10-30 % y ARN 1-3 %, rodeados de una membrana","Contiene ARN 10-30 % y ADN 1-3 %, rodeados de una membrana"],"correcta":0,"explicacion":"El nucléolo está formado por proteínas, ADN (1-3 %) y ARN (10-30 %), y no tiene membrana. El ARN abundante refleja su función: síntesis y ensamblaje del ARNr.","por_opcion":["✅ Porcentajes correctos y ausencia de membrana.","❌ Invierte los porcentajes de ADN y ARN.","❌ Invierte los porcentajes y además le atribuye una membrana.","❌ Los porcentajes son correctos, pero el nucléolo no tiene membrana."]},{"pregunta":"Al terminar la mitosis, cuando se reinicia la síntesis de ARN, ¿qué ocurre con el nucléolo?","opciones":["Reaparece de inmediato como un único nucléolo grande central","Permanece ausente hasta el final de la fase S siguiente","Aparecen muchos nucléolos pequeños que crecen y se fusionan","Se forma a partir de la heterocromatina constitutiva marginal"],"correcta":2,"explicacion":"Cuando se reinicia la síntesis de ARN aparecen muchos nucléolos pequeños, que crecen rápidamente y se fusionan. Antes de la mitosis el nucléolo se reduce, y durante la mitosis desaparece.","por_opcion":["❌ No reaparece como uno solo: primero surgen varios pequeños.","❌ Reaparece en cuanto se reinicia la síntesis de ARN tras la mitosis (G1), no después de S.","✅ Así lo describe el temario: muchos pequeños que crecen y se fusionan.","❌ El nucléolo se forma en los organizadores nucleolares (genes del ARNr), no a partir de heterocromatina constitutiva."]},{"pregunta":"¿Qué afirmación sobre la heterocromatina es correcta?","opciones":["Se localiza solo en la periferia, unida a la lámina nuclear","La facultativa contiene secuencias muy repetitivas y se transcribe activamente","Es la forma dispersa de la cromatina, responsable de la basofilia","La constitutiva contiene secuencias altamente repetitivas y no se transcribe"],"correcta":3,"explicacion":"La heterocromatina es cromatina altamente condensada y sin transcripción. La constitutiva contiene secuencias altamente repetitivas. Puede localizarse en posición marginal, nucleolar o cariosómica.","por_opcion":["❌ Además de la localización marginal, puede ser nucleolar o cariosómica.","❌ Las secuencias altamente repetitivas definen la constitutiva, y la heterocromatina no se transcribe.","❌ La forma dispersa es la eucromatina. La basofilia corresponde a la cromatina en general.","✅ La constitutiva corresponde a secuencias altamente repetitivas, y la heterocromatina no se transcribe."]},{"pregunta":"Sobre el primer nivel de compactación del ADN, ¿qué afirmación es correcta?","opciones":["Cada nucleosoma mide 30 nm y enrolla unas 2 vueltas de ADN (~147 pb)","Cada nucleosoma mide 11 nm y enrolla unas 2 vueltas de ADN (~147 pb)","El ADN espaciador entre nucleosomas mide unos 147 pb y está libre de H1","El octámero incluye H1, H2A, H3 y H4, y enrolla unas 2 vueltas de ADN"],"correcta":1,"explicacion":"El nucleosoma es una partícula de 11 nm formada por un octámero de H2A, H2B, H3 y H4, con 2 vueltas de ADN (~147 pb). El ADN espaciador mide 0-80 pb y es donde actúa la H1, que no forma parte del octámero.","por_opcion":["❌ 30 nm es el diámetro del solenoide, no del nucleosoma.","✅ 11 nm, 2 vueltas y ~147 pb son los datos del temario.","❌ El espaciador mide 0-80 pb. Los 147 pb son el ADN enrollado en el nucleosoma.","❌ La H1 no forma parte del octámero, y falta H2B."]},{"pregunta":"¿Qué describe correctamente el paso de la fibra de nucleosomas a la fibra de 30 nm?","opciones":["Compactación de asas cromatínicas en una hebra de 700 nm","Plegamiento en asas superenrolladas ancladas a un eje proteico","Enrollamiento de 8 nucleosomas por vuelta mediado por el octámero","Enrollamiento de 6 nucleosomas por vuelta dependiente de la H1"],"correcta":3,"explicacion":"El solenoide (fibra de 30 nm) se forma por el enrollamiento de 6 nucleosomas por vuelta, que generan un polinucleosoma. El temario atribuye este empaquetamiento a la histona H1.","por_opcion":["❌ Los 700 nm corresponden al cromosoma mitótico.","❌ Las asas superenrolladas corresponden al nivel de 300 nm.","❌ Son 6 nucleosomas por vuelta. El 8 corresponde a las histonas del octámero.","✅ 6 nucleosomas por vuelta y papel de la H1."]},{"pregunta":"En un cromosoma metafásico, ¿dónde se localizan los genes que codifican el ARNr, en relación con la formación del nucléolo?","opciones":["En el telómero, en el extremo del cromosoma","En la constricción secundaria, organizador nucleolar","En las bandas oscuras de heterocromatina constitutiva","En el centrómero, junto al cinetócoro"],"correcta":1,"explicacion":"Las constricciones secundarias son constantes en posición y tamaño y actúan como organizadores nucleolares, ya que contienen los genes que codifican el ARNr. Allí se forma el nucléolo, encargado de sintetizar y ensamblar el ARNr.","por_opcion":["❌ El telómero aporta estabilidad estructural y participa en la replicación de los extremos.","✅ La constricción secundaria es el organizador nucleolar con los genes del ARNr.","❌ La heterocromatina constitutiva no se transcribe, así que no aloja genes activos de ARNr.","❌ El centrómero es la constricción primaria y une el cromosoma al huso mediante el cinetócoro."]},{"pregunta":"¿Qué estructura cromosómica es una región especializada del centrómero que permite la unión a los microtúbulos del huso mitótico?","opciones":["Cinetócoro","Cromátida","Telómero","Satélite"],"correcta":0,"explicacion":"El centrómero (constricción primaria, con ADN muy repetitivo) se une al huso mitótico a través de una región especializada, el cinetócoro. Así se asegura la correcta distribución de los cromosomas duplicados.","por_opcion":["✅ El cinetócoro es la región especializada de unión al huso.","❌ La cromátida es cada una de las dos mitades simétricas del cromosoma, con una molécula de ADN cada una.","❌ El telómero es el extremo del cromosoma y aporta estabilidad estructural.","❌ El satélite es un cuerpo esférico separado del cromosoma por una constricción secundaria."]},{"pregunta":"¿Qué afirmación sobre el síndrome de Emery-Dreifuss es correcta según el temario?","opciones":["Está ligado al cromosoma X y cursa con contracturas y afectación cardíaca","Es autosómico dominante, por mutación de las histonas del octámero","Se debe a la falta de una proteína de envoltura nuclear, solo en el músculo","Es una miopatía metabólica por alteración del poro nuclear sin cardiopatía"],"correcta":0,"explicacion":"Es una distrofia muscular ligada al cromosoma X, con contracturas en tendones de Aquiles, cuello y codos, atrofia progresiva y anomalías cardíacas. Se debe a la ausencia de una proteína de la envoltura nuclear en todas las células del cuerpo.","por_opcion":["✅ Herencia ligada al X, contracturas y anomalías cardíacas, como describe el temario.","❌ Está ligado al X y no se relaciona con las histonas, sino con una proteína de la envoltura nuclear.","❌ La proteína falta en todas las células, aunque la clínica sea sobre todo muscular y cardíaca.","❌ Es una distrofia muscular, no metabólica, y sí cursa con afectación cardíaca."]}],"asignatura":"Biología celular y tisular","tema":6,"fecha":"2026-11-04"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const L = 'ABCD';
const secs = F.secciones || [];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="tarjetas">${(b.items||[]).map(t=>`<div class="tarjeta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="def"><b>${md(b.termino)}</b> — ${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota perla"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota alerta"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${md(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const nav = secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`).join('') + (F.caso_clinico?'<a href="#caso">Caso clínico</a>':'') + (F.glosario?.length?'<a href="#glosario">Glosario</a>':'') + `<a class="qcm" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`;

document.getElementById('app').innerHTML = `
<header class="portada"><div class="envoltura">
  <div class="etiquetas">${F.asignatura?`<span class="etiqueta">${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="etiqueta o">Tema ${esc(F.tema)}</span>`:''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="meta">${F.tipo==='grand-qcm'?`<div><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div><b>${secs.length}</b><span>secciones</span></div><div><b>${(F.ideas_clave||[]).length}</b><span>ideas clave</span></div>`}<div><b>${(F.qcm||[]).length}</b><span>preguntas</span></div><div id="ultimo"></div></div>
</div></header>
<nav class="indice" aria-label="Índice"><div class="envoltura">${nav}</div></nav>
<main class="envoltura">
  ${(F.objetivos||[]).length?`<div class="dos">
    <div class="caja"><h3>Objetivos</h3><ul>${(F.objetivos||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>
    <div class="caja"><h3>Lo que hay que saber</h3><ol class="claves">${(F.ideas_clave||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>
  </div>`:''}
  ${F.tipo==='grand-qcm'&&(F.fichas||[]).length?`<div class="caja" style="margin-top:40px"><h3>Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="num">Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd>`).join('')}</dl></section>`:''}
  <section id="qcm"><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="envoltura">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* ---------- esquemas ---------- */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:oscuro?'dark':'neutral',fontFamily:'Spectral, Georgia, serif',flowchart:{htmlLabels:true,curve:'basis'}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* ---------- QCM ---------- */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u) document.getElementById('ultimo').innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; }catch(e){} }
ultimo();
const marco = document.getElementById('marco');

function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${(pos)/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="etiqueta o" style="display:inline-block;margin-bottom:12px">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="btn sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="btn" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'Dominado. Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'Bien, pero repasa las preguntas falladas.':'Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="btn" id="rep">Repetir todo</button>${fallos.length?'<button class="btn sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
