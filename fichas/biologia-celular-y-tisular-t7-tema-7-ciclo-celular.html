<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tema 7. Ciclo celular · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>

<script id="datos" type="application/json">{"titulo":"Tema 7. Ciclo celular","subtitulo":"Cómo una célula crece, verifica su ADN y se divide por mitosis o meiosis, y cómo los fallos de los puntos de control y de la muerte celular rompen el equilibrio tisular.","objetivos":["Al terminar, sabrás diferenciar ploidía, cromosoma, cromátida, cromosomas homólogos, genoma y locus, y calcular cromosomas y cromátidas en cada fase.","Al terminar, sabrás describir las fases del ciclo celular y los tres puntos de control con sus reguladores: p53, ciclina B-CDK1 y el factor MPF.","Al terminar, sabrás secuenciar las fases de la mitosis y de la meiosis, incluidas las cinco subetapas de la profase I, con sus rasgos distintivos.","Al terminar, sabrás explicar la no-disyunción meiótica y el origen de la trisomía 21.","Al terminar, sabrás relacionar el desequilibrio entre proliferación y muerte celular (apoptosis y necrosis) con el cáncer, la hiperplasia y la atrofia."],"ideas_clave":["Las células somáticas humanas son **diploides (2n = 46)**: 22 pares de autosomas y 1 par sexual (XX o XY). Los gametos son **haploides (n = 23)**. Un cromosoma replicado tiene **dos cromátidas hermanas** unidas por el centrómero.","El ciclo celular consta de **interfase (G1, S, G2; ≈95 % del ciclo)** y **fase M (mitosis + citocinesis)**. Desde G1 la célula puede salir a **G0** (no división, diferenciación).","Hay tres puntos de control. **G1 (punto de restricción, el más importante)** comprueba tamaño, entorno, señales y ADN, y está regulado por **p53**. **G2/M** comprueba la replicación completa y el ADN reparado, y está regulado por **ciclina B + CDK1**. **M (metafase)** comprueba la alineación y la unión al huso. Además existe un checkpoint de lesiones del ADN activo en G1, S y G2.","El **factor MPF** (Cdk + ciclina) dirige la entrada en fase M.","Fases de la mitosis: profase → prometafase → metafase → anafase → telofase, más la citocinesis. La **metafase es la fase más larga** y la **anafase la más corta**. La envoltura nuclear se desintegra en la **prometafase**, no en la profase.","La citocinesis **se inicia en anafase** con un surco en el plano ecuatorial del huso, producido por un **anillo contráctil de actina y miosina**.","La meiosis tiene **una sola fase S y dos cariocinesis**. La **meiosis I** separa los homólogos y da 2 células n con cromosomas dobles. La **meiosis II** separa las cromátidas y da 4 células n. Las **tétradas** son exclusivas de la meiosis.","La **no-disyunción en meiosis I** del par 21 causa el síndrome de Down. La producción celular neta depende del equilibrio entre proliferación y muerte: si la apoptosis falla, hay acumulación celular (tumor); si predomina la pérdida, hay atrofia o enfermedades degenerativas."],"secciones":[{"id":"introduccion","titulo":"1. Introducción: cromosomas, ploidía y genoma","bloques":[{"tipo":"parrafo","texto":"La **ploidía** es el número de juegos completos de cromosomas de una célula. Una célula **haploide (n)** tiene un solo juego y una **diploide (2n)** tiene dos. En los humanos, cada par de **cromosomas homólogos** está formado por dos cromosomas de idéntica morfología: uno procede del padre y otro de la madre. Esta organización por pares explica por qué la meiosis debe separar los homólogos para pasar de 2n a n."},{"tipo":"tabla","titulo":"Conceptos básicos que se confunden en el examen","columnas":["Concepto","Definición según el temario","Clave para no fallar"],"filas":[["Cromátida","Molécula de cromatina condensada (una molécula de ADN)","1 cromátida = 1 molécula de ADN"],["Cromosoma","Puede tener una cromátida o dos (replicado)","Tras la fase S: 46 cromosomas con 92 cromátidas"],["Cromosomas homólogos","Pareja de idéntica morfología, uno paterno y otro materno","No son copias idénticas: pueden llevar alelos distintos"],["Cromátidas hermanas","Resultado de la replicación en la fase S, unidas por el centrómero","Sí son copias idénticas (salvo recombinación)"],["Genoma","Dotación completa de genes del conjunto de cromosomas","Se refiere a la célula o al organismo"],["Locus (plural: loci)","Ubicación específica de un gen en un cromosoma","El plural es **loci**"]]},{"tipo":"tarjetas","items":[{"etiqueta":"n","titulo":"Células germinales y gametos","texto":"A partir de ellas se forman los gametos (óvulos y espermatozoides). En los organismos superiores los gametos tienen un solo juego de cromosomas: son **haploides, 23 cromosomas**."},{"etiqueta":"2n","titulo":"Células somáticas","texto":"Producen el **crecimiento de tejidos y órganos**. Tienen **46 cromosomas** organizados en homólogos: **22 pares de autosomas + 1 par sexual (XX o XY)**."}]},{"tipo":"alerta","texto":"Trampa: un cromosoma con dos cromátidas sigue siendo **un** cromosoma. Una célula somática en G2 tiene **46 cromosomas y 92 cromátidas**, no 92 cromosomas. El número de cromosomas se cuenta por centrómeros."}]},{"id":"reproduccion","titulo":"2. Tipos de reproducción y renovación celular","bloques":[{"tipo":"tabla","titulo":"Reproducción asexual frente a sexual","columnas":["Rasgo","Asexual","Sexual"],"filas":[["Mecanismo de división","Mitosis","Meiosis (2n → n) + fecundación (n + n → 2n)"],["Progenitores","Uno","Dos (fusión de gametos)"],["Descendencia","Dos individuos genéticamente idénticos","Mezcla de genomas: **variabilidad genética**"]]},{"tipo":"parrafo","texto":"La reproducción sexual se basa en dos fenómenos complementarios. La **meiosis** reduce el número de cromosomas a la mitad y la **fecundación** lo restablece. Sin la reducción meiótica, la ploidía se duplicaría en cada generación. Después, el cigoto diploide se divide por **mitosis** para formar todas las células somáticas y germinales del organismo."},{"tipo":"alerta","texto":"El índice incluye «Renovación celular», pero el PDF no desarrolla este apartado. (complemento) Suelen distinguirse poblaciones **lábiles** (en división continua, como el epitelio), **estables** (en G0, que pueden volver a dividirse, como los hepatocitos) y **permanentes** (sin capacidad de división, como las neuronas o el músculo cardíaco)."}]},{"id":"ciclo-celular","titulo":"3. El ciclo celular: interfase y fase M","bloques":[{"tipo":"definicion","termino":"Ciclo celular","texto":"Secuencia **autorregulada** de eventos que controlan la **proliferación** y la **división** celular. Su finalidad es el **reparto equitativo del material genético y de la masa celular en dos células hijas**."},{"tipo":"tabla","titulo":"Fases del ciclo celular","columnas":["Fase","Etapa","Qué ocurre"],"filas":[["G1 (growth)","Interfase","Crecimiento celular. Al final está el punto de restricción, desde el que la célula puede salir a G0"],["S (DNA synthesis)","Interfase","Replicación del ADN: cada cromosoma pasa a tener dos cromátidas hermanas"],["G2 (growth and preparation for mitosis)","Interfase","Crecimiento y preparación. La envoltura nuclear está intacta, ya hay dos centrosomas por duplicación y los cromosomas están duplicados"],["M","Fase M","Mitosis (cariocinesis) + citocinesis"],["G0","Fuera del ciclo","Estado de no división y diferenciación (por ejemplo, células musculares y nerviosas)"]]},{"tipo":"parrafo","texto":"La **interfase** es el periodo entre dos fases M sucesivas y la **fase más larga del ciclo (≈95 %)**. Es la fase de recuperación, crecimiento y preparación para la mitosis. La mitosis, aunque es la parte más visible, ocupa solo una pequeña fracción del tiempo."},{"tipo":"figura","pagina":12,"pie":"Ciclo celular con sus tres puntos de control: START al final de G1, paso de G2 a M y salida de M (checkpoint de metafase). Fíjate en la pregunta que verifica cada punto y en el recuadro del checkpoint de lesiones del ADN, activo en G1, S y G2.","src":"img/biologia-celular-y-tisular-t7-tema-7-ciclo-celular-p12.jpg"}]},{"id":"puntos-control","titulo":"4. Puntos de control (checkpoints) y su fallo","bloques":[{"tipo":"parrafo","texto":"Los **puntos de control** son mecanismos internos de control de calidad. Verifican que todo funcione bien y que el ADN esté íntegro antes de avanzar a la siguiente etapa. Si detectan un error, **detienen el ciclo**. Si fallan, la célula se divide sin asegurar la fidelidad genética y acumula mutaciones, lo que puede conducir al **cáncer**."},{"tipo":"tabla","titulo":"Los tres puntos de control","columnas":["Punto","Qué verifica","Reguladores (según el temario)"],"filas":[["G1: punto de restricción o START (**el más importante**)","Tamaño suficiente, entorno adecuado (nutrientes, señales de crecimiento) y ADN sin daño","**Proteína p53**"],["G2/M","ADN totalmente replicado y reparado. También ambiente favorable y tamaño suficiente","**Ciclina B + CDK1**"],["M (metafase, salida de M)","Cromosomas alineados en el plano ecuatorial y unidos al huso mitótico, para que cada hija reciba una copia exacta","No se especifican en el PDF"],["Checkpoint de lesiones del ADN","Daño en el ADN","Activo durante G1, S y G2"]]},{"tipo":"definicion","termino":"Factor MPF","texto":"Complejo formado por una **quinasa dependiente de ciclina (Cdk)** y una **ciclina**. Participa en la **entrada de la célula en la fase M**."},{"tipo":"esquema","titulo":"Ciclo celular y puntos de control","mermaid":"flowchart LR\n  G1[\"G1: crecimiento\"] -->|\"Punto de restricción, p53\"| S[\"S: síntesis de ADN\"]\n  S --> G2[\"G2: crecimiento y preparación\"]\n  G2 -->|\"Checkpoint G2/M: ciclina B y CDK1\"| M[\"M: mitosis y citocinesis\"]\n  M -->|\"Checkpoint de metafase\"| G1\n  G1 -->|\"Sin señal adecuada\"| G0[\"G0: no división\"]\n  G0 --> D[\"Diferenciación: músculo, neurona\"]","pie":"La decisión clave se toma al final de G1: o la célula entra en S y se compromete a dividirse, o sale a G0 y puede diferenciarse."},{"tipo":"parrafo","texto":"En el **punto de restricción**, la célula necesita nutrientes adecuados, tamaño suficiente y las **señales extracelulares correctas**. Si no recibe la señal de avance, pasa a **G0**, un estado de no división, y puede especializarse. El temario lo llama «punto de no retorno» → G0: diferenciación celular."},{"tipo":"esquema","titulo":"Del fallo de los checkpoints al tumor","mermaid":"flowchart TD\n  A[\"Fallo de puntos de control\"] --> B[\"División sin fidelidad genética\"]\n  B --> C[\"Acumulación de mutaciones\"]\n  C --> D[\"¿Se activa la apoptosis?\"]\n  D -->|\"Sí\"| E[\"Célula eliminada: homeostasis\"]\n  D -->|\"No\"| F[\"Células dañadas siguen dividiéndose\"]\n  F --> G[\"Nuevas mutaciones\"]\n  G --> H[\"Tumor maligno\"]","pie":"La apoptosis es la última barrera. Hay tumor tanto si aumenta la división (con apoptosis normal) como si se reduce la apoptosis (con división normal)."},{"tipo":"tabla","titulo":"Equilibrio división/apoptosis (figura de la página 10)","columnas":["División celular","Apoptosis","Resultado"],"filas":[["Normal","Normal","Homeostasis"],["Aumentada","Normal","Tumor"],["Normal","Reducida","Tumor (las células dañadas, envejecidas o mutadas se acumulan)"]]},{"tipo":"perla","texto":"Las **células musculares y nerviosas** son el ejemplo del temario de células que salen a **G0** y se diferencian. Esto ayuda a entender por qué la reparación de estos tejidos tras una lesión es limitada y lenta. (complemento) En el músculo esquelético, la regeneración depende de las células satélite, no de la división de las fibras maduras."},{"tipo":"alerta","texto":"No confundas los reguladores: **p53 → checkpoint de G1**; **ciclina B + CDK1 (MPF) → paso G2/M**. Recuerda también que el checkpoint de **lesiones del ADN** no se limita a G1: actúa en **G1, S y G2**. Según las ideas clave, los puntos de control están **principalmente en G1 y G2**."},{"tipo":"perla","texto":"Pregunta abierta del temario: la fusión de una célula en G1 con otra en S no da el mismo resultado que la fusión de una célula en G2 con otra en S. (complemento: experimentos clásicos de Rao y Johnson, 1970) El citoplasma en S induce la replicación prematura del núcleo en G1, que está preparado para replicarse. El núcleo en G2 no se replica de nuevo porque su ADN ya está duplicado y está bloqueado frente a una nueva replicación."}]},{"id":"mitosis","titulo":"5. Mitosis y citocinesis","bloques":[{"tipo":"definicion","termino":"Mitosis (fase M)","texto":"Proceso de partición del genoma que produce **dos células hijas con la misma información genética que la célula madre**. Incluye la **cariocinesis** (división nuclear) y la **citocinesis** (división citoplasmática)."},{"tipo":"tabla","titulo":"Fases de la mitosis","columnas":["Fase","Rasgos característicos","Dato de examen"],"filas":[["1. Profase","Desaparece el nucleolo. Los cromosomas se condensan (dos cromátidas). El citoesqueleto se transforma (centrosomas). Se forma el huso mitótico","La envoltura nuclear sigue **intacta**"],["2. Prometafase","Se desintegra la envoltura nuclear, se forman los cinetocoros y el huso se extiende","Los cromosomas se unen a los microtúbulos y empiezan a moverse"],["3. Metafase","El cinetocoro de cada cromátida hermana interacciona solo con microtúbulos de **un** polo. Los cromosomas quedan en la placa metafásica","**Fase más larga** (según el temario)"],["4. Anafase","Las cromátidas hermanas se separan (**disyunción**). Se desplazan con el centrómero por delante y los brazos plegados hacia atrás. Queda un conjunto de cromosomas en cada polo","**Fase más corta**. Los microtúbulos cinetocóricos se acortan y los polos se separan"],["5. Telofase","Se reconstruye la envoltura nuclear (dos núcleos), los cromosomas se descondensan, reaparece el nucleolo y desaparecen los cinetocoros","Marca el final de la mitosis"],["6. Citocinesis","División del citoplasma por un surco en el plano ecuatorial del huso, generado por un **anillo contráctil de actina y miosina**","**Se inicia en anafase**"]]},{"tipo":"tarjetas","items":[{"etiqueta":"MT","titulo":"Microtúbulos polares","texto":"Parten de los polos y se solapan en el centro del huso."},{"etiqueta":"MT","titulo":"Microtúbulos astrales","texto":"Irradian desde el centrosoma hacia la periferia celular."},{"etiqueta":"MT","titulo":"Microtúbulos cinetocóricos","texto":"Se unen al cinetocoro de cada cromátida. Se acortan en anafase y arrastran las cromátidas hacia los polos."}]},{"tipo":"parrafo","texto":"El **huso mitótico** tiene dos funciones: **alinear los cromosomas en el plano medio** de la célula y **conducirlos a polos opuestos**. Para eso, cada cromátida hermana debe estar unida a un único polo. Si las dos cromátidas se unieran al mismo polo, una hija recibiría ambas copias y la otra ninguna. Por eso el checkpoint de metafase vigila la unión correcta al huso. En la citocinesis, el **RE, el Golgi y la envoltura nuclear se vesiculizan**, y el resto de orgánulos se fragmentan y se reparten equitativamente."},{"tipo":"figura","pagina":20,"pie":"Los seis paneles de la mitosis (profase a citocinesis) con micrografías de fluorescencia: cromosomas en naranja y microtúbulos en verde. Observa la envoltura intacta en la profase y fragmentada en la prometafase, la placa en la metafase y el anillo contráctil en la telofase y la citocinesis.","src":"img/biologia-celular-y-tisular-t7-tema-7-ciclo-celular-p20.jpg"},{"tipo":"alerta","texto":"Trampas típicas: (1) la envoltura nuclear se desintegra en la **prometafase**, no en la profase; (2) según el temario, la fase más larga es la **metafase** y la más corta la **anafase**; (3) el anillo contráctil es de **actina y miosina** (microfilamentos), no de microtúbulos; (4) la citocinesis **empieza en anafase**, aunque la contracción del anillo es evidente en la telofase."}]},{"id":"meiosis","titulo":"6. Meiosis y no-disyunción","bloques":[{"tipo":"parrafo","texto":"La **meiosis** produce células con la **mitad de la información** de la célula progenitora: a partir de una célula germinal 2n se forman gametos n. Tiene **dos cariocinesis secuenciales y una sola fase S**, lo que permite mantener la ploidía de la especie tras la fecundación. Su finalidad es asegurar la **variabilidad genética** entre generaciones mediante la **recombinación genética**."},{"tipo":"tarjetas","items":[{"etiqueta":"Concepto","titulo":"Bivalente o tétrada","texto":"Emparejamiento de los dos cromosomas homólogos duplicados (4 cromátidas). Es una **característica exclusiva de la meiosis**."},{"etiqueta":"Concepto","titulo":"Quiasma","texto":"Región en forma de X donde se ha producido el entrecruzamiento de segmentos homólogos entre cromosomas paterno y materno."},{"etiqueta":"Concepto","titulo":"Complejo sinaptonémico","texto":"Estructura proteica que mantiene unidos los homólogos durante la sinapsis. Se forma en el zigoteno y se disuelve en el diploteno."}]},{"tipo":"tabla","titulo":"Subetapas de la profase I","columnas":["Subetapa","Eventos según el temario"],"filas":[["a) Leptoteno","Condensación de los cromosomas y emparejamiento de homólogos"],["b) Zigoteno","Sinapsis (complejo sinaptonémico) y formación de tétradas"],["c) Paquiteno","Entrecruzamiento y recombinación del material genético"],["d) Diploteno","Disolución del complejo sinaptonémico, separación de homólogos y quiasmas visibles"],["e) Diacinesis","Ensamblaje del huso meiótico y desaparición del nucleolo"]]},{"tipo":"figura","pagina":25,"pie":"Etapas de la profase I (leptoteno, zigoteno, paquiteno, diploteno, diacinesis) y detalle del complejo sinaptonémico entre las cromátidas paternas y maternas. Mira dónde se forma el bivalente y dónde aparecen los quiasmas.","src":"img/biologia-celular-y-tisular-t7-tema-7-ciclo-celular-p25.jpg"},{"tipo":"tabla","titulo":"Resto de la meiosis I y meiosis II","columnas":["Fase","Rasgos"],"filas":[["Prometafase I","Desintegración de la envoltura nuclear y unión a microtúbulos cinetocóricos"],["Metafase I","Formación de la placa metafásica con **tétradas alineadas**"],["Anafase I","Se separan los bivalentes: cada homólogo va a un polo y las **cromátidas hermanas permanecen unidas**"],["Telofase I + citocinesis","Reaparecen el nucleolo y la envoltura. Resultan **2 células n con cromosomas aún dobles**"],["Meiosis II (profase II → prometafase II → metafase II → anafase II → telofase II → citocinesis)","Se separan las cromátidas hermanas y se obtienen **4 células n con cromosomas únicos**"]]},{"tipo":"esquema","titulo":"Meiosis y origen de la trisomía 21","mermaid":"flowchart TD\n  A[\"Célula germinal 2n\"] -->|\"Una sola fase S\"| B[\"2n con cromosomas duplicados\"]\n  B --> C[\"Profase I: tétradas y quiasmas\"]\n  C --> D[\"Anafase I: se separan homólogos\"]\n  D --> E[\"2 células n con cromosomas dobles\"]\n  E --> F[\"Anafase II: se separan cromátidas\"]\n  F --> G[\"4 células n con cromosomas simples\"]\n  D -.->|\"No-disyunción del par 21\"| H[\"Gameto con dos cromosomas 21\"]\n  H -->|\"Fecundación con gameto normal\"| I[\"Trisomía 21: síndrome de Down\"]","pie":"La meiosis I es reduccional (separa homólogos). Un error en ese paso deja una célula con dos cromosomas 21 y otra sin ninguno."},{"tipo":"tabla","titulo":"Mitosis frente a meiosis","columnas":["Rasgo","Mitosis","Meiosis"],"filas":[["Células que la realizan","Somáticas","Germinales"],["Fases S / divisiones","1 / 1","1 / 2"],["Ploidía","2n → 2n","2n → n"],["Células hijas","2, genéticamente idénticas","4, con distintas combinaciones de cromosomas paternos y maternos"],["Tétradas y recombinación","No","Sí (profase I)"],["Qué se separa en anafase","Cromátidas hermanas","Anafase I: homólogos. Anafase II: cromátidas"]]},{"tipo":"parrafo","texto":"La **no-disyunción** es el fallo en la separación de los cromosomas homólogos durante la meiosis. Origina **trisomías o monosomías**. En el síndrome de Down suele ocurrir en la **meiosis I**: los dos cromosomas 21 acaban en la misma célula hija y la otra no recibe ninguno. Si el gameto anormal se fecunda con uno normal, el embrión tiene **tres copias del cromosoma 21**."},{"tipo":"perla","texto":"En fisioterapia pediátrica, el síndrome de Down es una población frecuente. (complemento) La hipotonía y la laxitud ligamentosa justifican el trabajo de control postural y estabilidad. Comprender que el error es cromosómico y está presente en todas las células, porque el cigoto lo transmite por mitosis, explica que sea una condición sistémica y no localizada."},{"tipo":"alerta","texto":"Trampa: en la **anafase I** no se separan las cromátidas, sino los **homólogos**. Las cromátidas hermanas siguen unidas hasta la **anafase II**. La duplicación cromosómica en la interfase meiótica es **igual que en la mitosis**: lo exclusivo de la meiosis es la **formación de tétradas**."}]},{"id":"muerte-celular","titulo":"7. Muerte celular","bloques":[{"tipo":"parrafo","texto":"En el ser humano, la **producción celular neta** depende del equilibrio entre la tasa de **proliferación** y la de **muerte** celular. Si cualquiera de los dos niveles se altera, aparecen desórdenes por **acumulación** o por **pérdida** celular."},{"tipo":"tabla","titulo":"Desórdenes por desequilibrio proliferación/muerte","columnas":["Tipo","Ejemplos del temario"],"filas":[["Por acumulación celular","Hiperplasia, cáncer, **enfermedades autoinmunes**"],["Por pérdida celular","Atrofia, enfermedades degenerativas"]]},{"tipo":"tabla","titulo":"Apoptosis frente a necrosis","columnas":["Rasgo","Apoptosis","Necrosis"],"filas":[["Naturaleza","Muerte celular **programada** (incluye la anoikis)","Muerte no programada"],["Núcleo","Condensación y fragmentación","Alterado"],["Membrana plasmática","**Intacta**","**Rota**"],["Producto","**Cuerpos apoptóticos**","Liberación del contenido celular"]]},{"tipo":"figura","pagina":32,"pie":"Comparación entre apoptosis y necrosis: en la apoptosis hay condensación y fragmentación del núcleo, membrana intacta y cuerpos apoptóticos; en la necrosis, la membrana está rota.","src":"img/biologia-celular-y-tisular-t7-tema-7-ciclo-celular-p32.jpg"},{"tipo":"alerta","texto":"Trampa: las **enfermedades autoinmunes** se clasifican como desórdenes por **acumulación** celular, junto a la hiperplasia y el cáncer, no por pérdida. La **anoikis** se menciona como forma de **apoptosis**, no de necrosis."},{"tipo":"perla","texto":"La **atrofia** figura en el temario como un desorden por pérdida celular, uno de los problemas más habituales en rehabilitación. El concepto de balance entre producción y eliminación celular sirve de base para entender la pérdida tisular en las enfermedades degenerativas que trata el fisioterapeuta."}]}],"caso_clinico":{"titulo":"Niña con síndrome de Down en fisioterapia pediátrica","presentacion":"Lucía tiene 4 años y acude a fisioterapia por retraso motor y disminución del tono muscular. Tiene un diagnóstico citogenético de **trisomía 21 libre**. Su madre pregunta cómo se produjo la alteración y por qué afecta a todo el cuerpo. El fisioterapeuta quiere explicarlo con rigor y relacionarlo con el ciclo celular.","preguntas":[{"pregunta":"¿Qué error celular explica la trisomía de Lucía y en qué fase ocurre habitualmente según el temario?","respuesta":"Una **no-disyunción** durante la gametogénesis de uno de los progenitores. Según el temario suele ocurrir en la **meiosis I**: en la anafase I, los dos homólogos del par 21 no se separan y migran juntos a la misma célula hija. Ese gameto, con dos cromosomas 21, se fusiona en la fecundación con un gameto normal (con uno), y el cigoto queda con **tres copias del cromosoma 21**."},{"pregunta":"¿Por qué la alteración está presente en prácticamente todas sus células y no solo en un tejido?","respuesta":"Porque el error ya existía en el **cigoto**. Todas las células somáticas derivan de él por **mitosis**, que produce células hijas con la **misma información genética** que la madre. Cada división copia fielmente los 47 cromosomas (46 + 1 cromosoma 21 extra), de modo que la trisomía se transmite a todos los tejidos, incluidos el músculo y el sistema nervioso. Esto explica la afectación sistémica (complemento: hipotonía generalizada)."},{"pregunta":"En esa misma meiosis I defectuosa, ¿qué ocurrió con la otra célula hija y qué habría resultado si ese gameto hubiera sido fecundado?","respuesta":"La otra célula hija **no recibió ningún cromosoma 21**. Si ese gameto se hubiera fecundado con uno normal, el cigoto habría tenido un solo cromosoma 21: una **monosomía**. El temario recoge las monosomías, junto a las trisomías, como consecuencias posibles de la no-disyunción. Ambas resultan de un reparto desigual de los homólogos en la división reduccional."}]},"glosario":[{"termino":"Ploidía","definicion":"Número de juegos completos de cromosomas de una célula: haploide (n) o diploide (2n)."},{"termino":"Cromátida","definicion":"Molécula de cromatina condensada, equivalente a una molécula de ADN."},{"termino":"Cromosomas homólogos","definicion":"Pareja de cromosomas de idéntica morfología, uno de origen paterno y otro materno."},{"termino":"Locus","definicion":"Lugar específico que ocupa un gen en un cromosoma. Su plural es loci."},{"termino":"Genoma","definicion":"Dotación completa de genes contenida en el conjunto de cromosomas de una célula u organismo."},{"termino":"Punto de restricción","definicion":"Punto de control del final de G1, el más importante del ciclo. Si no se superan sus requisitos, la célula pasa a G0."},{"termino":"G0","definicion":"Estado de no división al que sale la célula desde G1, en el que puede diferenciarse."},{"termino":"Factor MPF","definicion":"Complejo Cdk-ciclina que promueve la entrada de la célula en la fase M."},{"termino":"Cinetocoro","definicion":"Estructura del centrómero a la que se unen los microtúbulos cinetocóricos. Se forma en la prometafase y desaparece en la telofase."},{"termino":"Anillo contráctil","definicion":"Anillo de microfilamentos de actina y miosina que genera el surco de segmentación en la citocinesis."},{"termino":"Tétrada o bivalente","definicion":"Emparejamiento de los dos homólogos duplicados (4 cromátidas), exclusivo de la meiosis."},{"termino":"Complejo sinaptonémico","definicion":"Estructura que une los homólogos durante la sinapsis. Se forma en el zigoteno y se disuelve en el diploteno."},{"termino":"Quiasma","definicion":"Punto en forma de X donde se ha producido el entrecruzamiento entre cromosomas homólogos."},{"termino":"No-disyunción","definicion":"Fallo en la separación de los cromosomas homólogos en la meiosis, que origina trisomías o monosomías."},{"termino":"Apoptosis","definicion":"Muerte celular programada con condensación nuclear, membrana intacta y cuerpos apoptóticos. Incluye la anoikis."}],"fuentes":["Klug WS et al. Genética. 10.ª ed.","Pearson Education, Inc. (Pearson Benjamin Cummings), 2005 (figuras de meiosis).","Micrografías de mitosis cortesía de Julie Canman y Ted Salmon.","Wikipedia.org (figura de fases de la mitosis).","Amoeba Sisters. The Cell Cycle and Cancer (vídeo).","Solana Manrique C. Tema 7. Ciclo celular. Biología Celular y Tisular. Universidad Europea, curso 2025-2026."],"qcm":[{"pregunta":"Una célula somática humana normal se encuentra en G2. ¿Cuántos cromosomas y cuántas cromátidas contiene?","opciones":["46 cromosomas y 92 cromátidas","46 cromosomas y 46 cromátidas","92 cromosomas y 92 cromátidas","23 cromosomas y 46 cromátidas"],"correcta":0,"explicacion":"Tras la fase S, cada cromosoma está replicado y formado por dos cromátidas hermanas unidas por el centrómero. El número de cromosomas no cambia (46, diploide), pero el de cromátidas se duplica (92).","por_opcion":["✅ En G2 los cromosomas están duplicados: 46 cromosomas, cada uno con dos cromátidas hermanas.","❌ Corresponde a una célula en G1, con cromosomas de una sola cromátida antes de la replicación.","❌ La replicación duplica las cromátidas, no los cromosomas. Se cuentan por centrómeros.","❌ Corresponde a una célula haploide con cromosomas dobles, como tras la meiosis I, no a una somática."]},{"pregunta":"Una célula ha completado la fase S, pero conserva lesiones sin reparar en su ADN, y se detiene justo antes de iniciar la mitosis. ¿Qué punto de control actúa y qué reguladores le atribuye el temario?","opciones":["Checkpoint de G2/M, regulado por la ciclina B y la CDK1","Checkpoint de metafase, regulado por los cinetocoros","Checkpoint de salida de M, regulado por la ciclina B","Punto de restricción de G1, regulado por la proteína p53"],"correcta":0,"explicacion":"El checkpoint de G2 impide la entrada en mitosis si no se ha reparado todo el ADN dañado o no se ha completado la replicación. El temario le asigna como reguladores la ciclina B y la CDK1, componentes del MPF.","por_opcion":["✅ El paso de G2 a M exige ADN replicado y reparado. Sus reguladores son la ciclina B y la CDK1.","❌ El checkpoint de metafase verifica la alineación y la unión al huso, no la reparación del ADN previa a la mitosis.","❌ La salida de M corresponde al checkpoint de metafase, que se produce una vez iniciada la mitosis.","❌ El punto de restricción está al final de G1, antes de la fase S. La célula descrita ya ha replicado su ADN."]},{"pregunta":"Un mioblasto al final de G1 tiene nutrientes y tamaño suficientes, pero no recibe las señales extracelulares de avance. Según el temario, ¿qué le ocurre?","opciones":["Pasa a G0, deja de dividirse y puede diferenciarse","Entra en S, pero queda retenido en el checkpoint G2/M","Avanza a M y se detiene en metafase hasta recibirlas","Activa la necrosis al no superar el punto de restricción"],"correcta":0,"explicacion":"En el punto de restricción se exigen tres requisitos: nutrientes, tamaño y señales extracelulares correctas. Si falta la señal, la célula pasa a G0, un estado de no división, y puede especializarse, como ocurre con las células musculares o nerviosas.","por_opcion":["✅ Sin señal adecuada, la célula sale a G0 y puede diferenciarse (por ejemplo, músculo o nervio).","❌ Sin superar el punto de restricción no entra en la fase S, así que nunca llega a G2.","❌ La célula no puede saltarse S y G2. El checkpoint de metafase vigila la unión al huso.","❌ La necrosis es muerte no programada con rotura de membrana. No es la consecuencia de no recibir señales en G1."]},{"pregunta":"Según el temario, ¿qué combinación de duraciones de las fases de la mitosis es correcta?","opciones":["La profase es la más larga y la telofase la más corta","La metafase es la más larga y la telofase la más corta","La metafase es la más larga y la anafase la más corta","La prometafase es la más larga y la metafase la más corta"],"correcta":2,"explicacion":"El temario indica expresamente que la metafase es la fase más larga de la mitosis y la anafase la etapa más corta. En la anafase, la separación de las cromátidas hermanas ocurre de forma rápida y sincrónica.","por_opcion":["❌ Algunos textos señalan la profase como la más larga, pero el temario atribuye esa duración a la metafase.","❌ La metafase es la más larga, pero la más corta es la anafase, no la telofase.","✅ Así lo recoge el temario: metafase, fase más larga; anafase, etapa más corta.","❌ La prometafase no se describe como la más larga, y la metafase es precisamente la más larga."]},{"pregunta":"¿En qué fase de la mitosis se desintegra la envoltura nuclear y qué otro acontecimiento ocurre en esa misma fase?","opciones":["En profase, a la vez que se forman los cinetocoros","En prometafase, a la vez que se forman los cinetocoros","En profase, a la vez que desaparece el nucleolo","En metafase, a la vez que se forma la placa ecuatorial"],"correcta":1,"explicacion":"La prometafase se caracteriza por la desintegración de la envoltura nuclear, la formación de los cinetocoros y la extensión del huso. Solo entonces los cromosomas pueden unirse a los microtúbulos y moverse activamente.","por_opcion":["❌ Los cinetocoros se forman en la prometafase, y la envoltura no se desintegra en la profase.","✅ La prometafase reúne la desintegración de la envoltura, la formación de cinetocoros y la extensión del huso.","❌ En la profase desaparece el nucleolo, pero la envoltura nuclear sigue intacta.","❌ En la metafase la envoltura ya se ha desintegrado. Lo propio de esta fase es la placa metafásica."]},{"pregunta":"Sobre la citocinesis, ¿qué afirmación es correcta según el temario?","opciones":["Se inicia en anafase con un anillo de microtúbulos cinetocóricos","Se inicia en telofase con un anillo de microtúbulos polares","Se inicia en metafase con un anillo de microtúbulos astrales","Se inicia en anafase con un anillo de actina y miosina"],"correcta":3,"explicacion":"La citocinesis comienza en la anafase con la formación de un surco de división en el plano ecuatorial del huso. Ese surco lo genera un anillo contráctil de microfilamentos de actina y miosina, no de microtúbulos.","por_opcion":["❌ Los microtúbulos cinetocóricos arrastran las cromátidas, no estrangulan el citoplasma.","❌ El anillo no está formado por microtúbulos, y su inicio se sitúa en anafase, no en telofase.","❌ Los microtúbulos astrales irradian del centrosoma. La citocinesis no empieza en metafase.","✅ El surco de segmentación se inicia en anafase gracias al anillo contráctil de actina y miosina."]},{"pregunta":"Durante la citocinesis, ¿qué estructuras se vesiculizan según el temario, en lugar de fragmentarse y repartirse como el resto de orgánulos?","opciones":["Retículo endoplasmático, Golgi y envoltura nuclear","Mitocondrias, lisosomas y retículo endoplasmático","Envoltura nuclear, nucleolo y peroxisomas","Aparato de Golgi, centrosomas y mitocondrias"],"correcta":0,"explicacion":"El temario indica que el RE, el aparato de Golgi y la envoltura nuclear se vesiculizan. El resto de orgánulos se fragmentan y se reparten equitativamente entre las dos células hijas.","por_opcion":["✅ El RE, el Golgi y la envoltura nuclear son las estructuras que el temario describe como vesiculizadas.","❌ Las mitocondrias y los lisosomas pertenecen al grupo de orgánulos que se fragmentan y se reparten.","❌ El nucleolo desaparece y reaparece, y los peroxisomas se reparten. Solo la envoltura nuclear es correcta.","❌ Los centrosomas se duplican en G2 y las mitocondrias se reparten. No forman parte de este trío."]},{"pregunta":"¿En qué subetapa de la profase I se disuelve el complejo sinaptonémico, empiezan a separarse los homólogos y se hacen visibles los quiasmas?","opciones":["Paquiteno","Diacinesis","Diploteno","Zigoteno"],"correcta":2,"explicacion":"En el diploteno se disuelve el complejo sinaptonémico y los homólogos se separan parcialmente. Siguen unidos solo por los quiasmas, que se hacen visibles en los puntos donde hubo entrecruzamiento durante el paquiteno.","por_opcion":["❌ En el paquiteno ocurren el entrecruzamiento y la recombinación con los homólogos aún sinapsados.","❌ En la diacinesis se ensambla el huso meiótico y desaparece el nucleolo.","✅ El diploteno reúne la disolución del complejo sinaptonémico, la separación de homólogos y los quiasmas.","❌ En el zigoteno se forma el complejo sinaptonémico (sinapsis) y las tétradas. No se disuelve."]},{"pregunta":"En una célula con 2n = 6 que se encuentra en anafase I, ¿qué migra hacia cada polo?","opciones":["6 cromosomas, cada uno con dos cromátidas","6 cromosomas, cada uno con una cromátida","3 cromosomas, cada uno con una cromátida","3 cromosomas, cada uno con dos cromátidas"],"correcta":3,"explicacion":"En la anafase I se separan los bivalentes: cada homólogo, todavía duplicado, va a un polo, y las cromátidas hermanas permanecen unidas. De 3 pares de homólogos, cada polo recibe 3 cromosomas de dos cromátidas.","por_opcion":["❌ Supondría que no se ha separado nada. En la anafase I cada polo recibe la mitad de los cromosomas.","❌ Es lo que ocurre en la anafase mitótica de esa célula: cada polo recibe 6 cromátidas separadas.","❌ Es lo que se obtiene en la anafase II, cuando ya se separan las cromátidas hermanas.","✅ La meiosis I es reduccional: separa los homólogos con sus cromátidas aún unidas (n = 3 cromosomas dobles)."]},{"pregunta":"Según el temario, ¿cuál es el mecanismo habitual de la trisomía 21?","opciones":["No-disyunción de cromátidas en la primera mitosis del cigoto","No-disyunción de cromátidas 21 durante la meiosis II","No-disyunción de los homólogos 21 durante la meiosis I","Ausencia de entrecruzamiento del par 21 en el paquiteno"],"correcta":2,"explicacion":"El temario indica que en el síndrome de Down la no-disyunción suele ocurrir en la meiosis I. Los dos cromosomas 21 homólogos no se separan y acaban en la misma célula hija. Tras la fecundación con un gameto normal, el embrión tiene tres copias del cromosoma 21.","por_opcion":["❌ El temario describe un error meiótico en la gametogénesis, no un error mitótico del cigoto.","❌ El temario sitúa la no-disyunción habitual en la meiosis I y la define como fallo de separación de homólogos.","✅ Los homólogos 21 no se separan en la meiosis I y el gameto resultante lleva dos cromosomas 21.","❌ La recombinación del paquiteno no es el mecanismo descrito, sino la falta de separación de los homólogos."]},{"pregunta":"¿Qué característica del proceso meiótico permite pasar de 2n a n y mantener la ploidía de la especie tras la fecundación?","opciones":["Dos fases S seguidas de dos cariocinesis sucesivas","Ninguna fase S previa y una única cariocinesis","Una fase S y una única cariocinesis sin citocinesis","Una sola fase S seguida de dos cariocinesis sucesivas"],"correcta":3,"explicacion":"La meiosis implica dos cariocinesis secuenciales pero solo una fase S de duplicación. Al dividir dos veces un material duplicado una sola vez, los gametos quedan con la mitad de cromosomas, y la fecundación (n + n) restablece la dotación 2n.","por_opcion":["❌ Con dos duplicaciones y dos divisiones, la dotación no se reduciría a la mitad.","❌ En la interfase meiótica sí hay duplicación de todos los cromosomas, igual que en la mitosis.","❌ Una duplicación y una división equivalen a una mitosis: el resultado sería 2n, no n.","✅ Una sola fase S y dos cariocinesis: así lo define el temario para mantener la ploidía."]},{"pregunta":"¿Cuál de los siguientes acontecimientos señala el temario como característica exclusiva de la meiosis frente a la mitosis?","opciones":["Duplicación cromosómica con cromátidas unidas por el centrómero","Emparejamiento de homólogos duplicados formando tétradas","Desintegración de la envoltura y unión a microtúbulos cinetocóricos","Desaparición del nucleolo y condensación de los cromosomas"],"correcta":1,"explicacion":"Tras la duplicación en la interfase, que es igual que en la mitosis, los homólogos duplicados se buscan y se emparejan formando tétradas. El temario la define como característica exclusiva de la meiosis y es la base de la recombinación.","por_opcion":["❌ El temario subraya que la duplicación con cromátidas unidas ocurre igual que en la mitosis.","✅ La formación de tétradas o bivalentes es exclusiva de la meiosis (profase I).","❌ Ambas ocurren también en la prometafase mitótica. No son exclusivas de la meiosis.","❌ La desaparición del nucleolo y la condensación cromosómica también ocurren en la profase mitótica."]},{"pregunta":"En un tejido, la tasa de división celular es normal, pero la apoptosis está reducida. Según el esquema del temario, ¿qué resultado se espera?","opciones":["Tumor, por acumulación de células dañadas no eliminadas","Homeostasis, porque la tasa de división no se modifica","Necrosis, por rotura de membrana de células envejecidas","Atrofia, por desequilibrio a favor de la pérdida celular"],"correcta":0,"explicacion":"La producción celular neta depende del balance entre proliferación y muerte. Si las células dañadas, envejecidas o mutadas no se eliminan por apoptosis, se acumulan, adquieren nuevas mutaciones y se forma un tumor, aunque la división sea normal.","por_opcion":["✅ El temario muestra que la combinación de división normal y apoptosis reducida conduce a un tumor.","❌ La homeostasis requiere que tanto la división como la apoptosis sean normales.","❌ Una apoptosis reducida no implica necrosis. La necrosis es otro mecanismo de muerte, con rotura de membrana.","❌ La atrofia es un desorden por pérdida celular. Aquí predomina la acumulación."]},{"pregunta":"¿Qué hallazgo morfológico es propio de la necrosis y la diferencia de la apoptosis?","opciones":["Condensación y fragmentación nuclear con membrana intacta","Rotura de la membrana plasmática de la célula","Muerte por pérdida de anclaje del tipo anoikis","Formación de cuerpos apoptóticos rodeados de membrana"],"correcta":1,"explicacion":"En la figura comparativa del temario, la necrosis se distingue por la membrana plasmática rota. La apoptosis, en cambio, mantiene la membrana intacta, condensa y fragmenta el núcleo y forma cuerpos apoptóticos.","por_opcion":["❌ La condensación y fragmentación nuclear con membrana intacta definen la apoptosis.","✅ La rotura de la membrana es el rasgo distintivo de la necrosis.","❌ La anoikis aparece en el temario como forma de apoptosis, no de necrosis.","❌ Los cuerpos apoptóticos son el producto de la apoptosis, no de la necrosis."]},{"pregunta":"Según el temario, ¿cuál de las siguientes alteraciones pertenece al mismo grupo de desórdenes que la hiperplasia?","opciones":["Atrofia del tejido muscular","Pérdida celular por necrosis","Enfermedades degenerativas","Enfermedades autoinmunes"],"correcta":3,"explicacion":"El temario clasifica como desórdenes por acumulación celular la hiperplasia, el cáncer y las enfermedades autoinmunes. La atrofia y las enfermedades degenerativas son desórdenes por pérdida celular.","por_opcion":["❌ La atrofia aparece en el temario como desorden por pérdida celular.","❌ Una pérdida de células va en sentido contrario a la acumulación propia de la hiperplasia.","❌ Las enfermedades degenerativas se clasifican como desórdenes por pérdida celular.","✅ Las enfermedades autoinmunes se agrupan con la hiperplasia y el cáncer como desórdenes por acumulación."]}],"asignatura":"Biología celular y tisular","tema":7,"fecha":"2026-11-04","resumen":["Las células somáticas humanas son **diploides (2n = 46: 22 pares de autosomas + 1 par sexual)** y los gametos son **haploides (n = 23)**; un cromosoma replicado tiene **dos cromátidas hermanas** unidas por el centrómero y se cuenta como un solo cromosoma.","El ciclo celular consta de **interfase (G1, S y G2; ≈95 % del ciclo)** y **fase M (mitosis + citocinesis)**, y desde G1 la célula puede salir a **G0** para no dividirse y diferenciarse.","Los puntos de control son **G1 (punto de restricción, el más importante, regulado por p53)**, **G2/M (ciclina B + CDK1)** y **M (alineación y unión al huso)**; si fallan los controles o la apoptosis hay **acumulación celular (tumor)**, y si predomina la pérdida aparecen **atrofia o enfermedades degenerativas**.","La mitosis sigue el orden **profase → prometafase (se desintegra la envoltura nuclear) → metafase (la más larga) → anafase (la más corta) → telofase**, y la citocinesis **se inicia en anafase** mediante un **anillo contráctil de actina y miosina**.","La meiosis tiene **una sola fase S y dos divisiones**: la meiosis I separa los **homólogos** y la meiosis II las **cromátidas**, y se obtienen **4 células n**; las **tétradas son exclusivas de la meiosis** y la **no-disyunción del par 21 en meiosis I** causa el síndrome de Down."],"preguntate":[{"pregunta":"¿En qué se diferencian los cromosomas homólogos de las cromátidas hermanas?","respuesta":"Los **homólogos** son una pareja de idéntica morfología, uno paterno y otro materno, que pueden llevar **alelos distintos**. Las **cromátidas hermanas** proceden de la replicación en la fase S, están unidas por el centrómero y son **copias idénticas**, salvo recombinación."},{"pregunta":"Define el ciclo celular e indica cuál es su finalidad.","respuesta":"Es una **secuencia autorregulada de eventos** que controla la proliferación y la división celular. Su finalidad es el **reparto equitativo del material genético y de la masa celular** entre dos células hijas."},{"pregunta":"¿Por qué la reproducción sexual necesita la meiosis además de la fecundación?","respuesta":"La meiosis **reduce el número de cromosomas a la mitad (2n → n)** y la fecundación lo restablece (n + n → 2n). Sin la reducción meiótica, la **ploidía se duplicaría en cada generación**."},{"pregunta":"¿Qué es el factor MPF y en qué momento del ciclo actúa?","respuesta":"Es un complejo formado por una **quinasa dependiente de ciclina (Cdk)** y una **ciclina**. Dirige la **entrada de la célula en la fase M**."},{"pregunta":"Explica por qué cada cromátida hermana debe unirse a microtúbulos de un único polo y qué punto de control lo vigila.","respuesta":"Si las dos cromátidas se unieran al mismo polo, una hija recibiría ambas copias y la otra ninguna. El **checkpoint de metafase (M)** comprueba la alineación y la **unión correcta al huso** para que cada hija reciba una copia exacta."},{"pregunta":"Compara la función de los microtúbulos cinetocóricos, polares y astrales del huso mitótico.","respuesta":"Los **cinetocóricos** se unen al cinetocoro y, al acortarse en anafase, arrastran las cromátidas hacia los polos. Los **polares** parten de los polos y se solapan en el centro del huso. Los **astrales** irradian desde el centrosoma hacia la periferia celular."},{"pregunta":"¿Por qué no se obtiene el mismo resultado al fusionar una célula en G1 con otra en S que al fusionar una en G2 con otra en S?","respuesta":"El citoplasma en S induce la **replicación prematura del núcleo en G1**, que está preparado para replicarse. El **núcleo en G2 no se replica** de nuevo porque su ADN ya está duplicado y está bloqueado frente a una nueva replicación."},{"pregunta":"¿En qué subetapa de la profase I se produce la recombinación y qué es un quiasma?","respuesta":"La recombinación ocurre en el **paquiteno** mediante el entrecruzamiento. El **quiasma** es la región en forma de X donde se han intercambiado segmentos homólogos entre los cromosomas paterno y materno."},{"pregunta":"Compara mitosis y meiosis en cuanto a ploidía, número de células hijas y su identidad genética.","respuesta":"La **mitosis** (células somáticas) pasa de 2n a 2n y da **2 células genéticamente idénticas**. La **meiosis** (células germinales) pasa de 2n a n y da **4 células** con distintas combinaciones de cromosomas paternos y maternos."},{"pregunta":"Un niño con síndrome de Down acude a fisioterapia pediátrica. ¿Por qué su alteración es sistémica y no localizada?","respuesta":"El error es **cromosómico** (tres copias del cromosoma 21) y está ya en el cigoto, que lo transmite **por mitosis a todas las células** del organismo. Por eso afecta a todo el cuerpo, por ejemplo con **hipotonía y laxitud ligamentosa**."}]}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips">${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
