<html lang="es">
<head>

<title>Tema 8. Replicación del ADN · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#f6f4ef; --hoja:#fffdf9; --tinta:#1b2427; --suave:#5b676b; --linea:#e2ddd2; --acento:#1f6f6b; --acento-suave:#dcebe8;
  --ocre:#b37a1c; --ocre-suave:#f6ead3; --rojo:#a8402f; --rojo-suave:#f5e0db; --verde:#2f7a46; --verde-suave:#dcefe1;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --texto:"Spectral",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:19px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);line-height:1.12;margin:0;font-variation-settings:"SOFT" 50}
h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.9rem;font-weight:600;letter-spacing:-.015em;margin:0 0 18px}
h3{font-size:1.2rem;font-weight:600}
b,strong{font-weight:600}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px}
.envoltura{max-width:820px;margin:0 auto;padding:0 22px}
/* cabecera */
header.portada{padding:64px 0 36px;border-bottom:1px solid var(--linea)}
.etiquetas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.etiqueta{font:600 .78rem/1 var(--serif);padding:7px 11px;border-radius:999px;background:var(--acento-suave);color:var(--acento)}
.etiqueta.o{background:var(--ocre-suave);color:var(--ocre)}
.sub{font-size:1.25rem;color:var(--suave);margin:16px 0 0;max-width:62ch;font-style:italic}
.meta{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap}
.meta div{font-family:var(--serif)}
.meta b{display:block;font-size:1.7rem;font-weight:800;line-height:1}
.meta span{font-size:.8rem;color:var(--suave)}
/* navegación */
nav.indice{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px)}
nav.indice .envoltura{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .envoltura::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .85rem var(--serif);padding:7px 12px;border-radius:999px}
nav.indice a:hover{color:var(--tinta);background:var(--hoja)}
nav.indice a.qcm{background:var(--tinta);color:var(--papel);margin-left:auto}
main section{padding:56px 0 8px}
.num{font:800 .85rem var(--serif);color:var(--ocre);display:block;margin-bottom:6px}
p{margin:0 0 16px;max-width:68ch}
/* bloques */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:14px;padding:22px 24px}
.caja h3{margin-bottom:12px}
.caja ul,.caja ol{margin:0;padding-left:1.2em}
.caja li{margin:6px 0}
.claves{counter-reset:k;list-style:none;padding:0!important}
.claves li{counter-increment:k;padding-left:38px;position:relative;margin:10px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--acento);color:var(--papel);font:800 .8rem/26px var(--serif);text-align:center}
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
.tw{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--linea);border-radius:12px;background:var(--hoja)}
table{border-collapse:collapse;width:100%;font-size:.92rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:600 .95rem var(--serif);padding:14px 16px 4px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--linea)}
th{font:600 .82rem var(--serif);color:var(--suave);border-top:0}
tbody tr:nth-child(odd){background:color-mix(in srgb,var(--papel) 50%,transparent)}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 22px}
.tarjeta{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;font-size:.95rem;line-height:1.5}
.tarjeta .et{font:700 .72rem var(--serif);color:var(--ocre);display:block;margin-bottom:4px}
.tarjeta h3{font-size:1.05rem;margin-bottom:6px}
.def{border-left:3px solid var(--acento);padding:4px 0 4px 16px;margin:0 0 18px}
.def b{font-family:var(--serif);color:var(--acento)}
.nota{border-radius:12px;padding:14px 18px 14px 50px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;font-size:1.15rem}
.nota .t{font:700 .78rem var(--serif);display:block;margin-bottom:2px}
.perla{background:var(--verde-suave)} .perla::before{content:"🩺"} .perla .t{color:var(--verde)}
.alerta{background:var(--rojo-suave)} .alerta::before{content:"⚠️"} .alerta .t{color:var(--rojo)}
/* figuras y esquemas */
figure{margin:8px 0 26px;background:var(--hoja);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:20px 16px 8px;overflow-x:auto;text-align:center}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq .lienzo pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap;text-align:left}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{font-family:var(--serif);color:var(--tinta)}
/* caso clínico */
.caso{background:var(--tinta);color:var(--papel);border-radius:18px;padding:30px 30px 18px}
.caso h2{color:var(--papel)}
.caso p{color:color-mix(in srgb,var(--papel) 85%,transparent)}
.caso details{border-top:1px solid color-mix(in srgb,var(--papel) 18%,transparent);padding:12px 0}
.caso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
.caso details p{margin:10px 0 0}
dl.glosario{display:grid;grid-template-columns:max-content 1fr;gap:10px 20px;margin:0}
dl.glosario dt{font:600 1rem var(--serif);color:var(--acento)}
dl.glosario dd{margin:0}
.fuentes{font-size:.9rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border:1px solid var(--linea);border-radius:18px;padding:28px}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:600 .85rem var(--serif);color:var(--suave)}
.barra{flex:1;height:8px;border-radius:4px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--acento);transition:width .3s}
.pregunta{font:600 1.3rem/1.35 var(--serif);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer}
.op:hover:not([disabled]){border-color:var(--acento)}
.op .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 .9rem var(--serif);background:var(--hoja);border:1px solid var(--linea)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--verde);background:var(--verde-suave)}
.op.bien .l{background:var(--verde);color:#fff;border-color:var(--verde)}
.op.mal{border-color:var(--rojo);background:var(--rojo-suave)}
.op.mal .l{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{font:600 .95rem var(--serif);padding:11px 20px;border-radius:999px;border:0;background:var(--tinta);color:var(--papel);cursor:pointer}
.btn.sec{background:transparent;color:var(--tinta);border:1.5px solid var(--linea)}
.btn[disabled]{opacity:.35;cursor:default}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:800 4.4rem/1 var(--serif);letter-spacing:-.03em}
.resultado .gran small{font-size:1.6rem;color:var(--suave)}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:700px){body{font-size:17.5px}.dos{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}dl.glosario{grid-template-columns:1fr}dl.glosario dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i{transition:none}}
@media print{nav.indice,#qcm{display:none}body{background:#fff}}
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script id="datos" type="application/json">{"titulo":"Tema 8. Replicación del ADN","subtitulo":"Cómo la célula copia su ADN antes de dividirse: proceso semiconservativo, bidireccional y semidiscontinuo, catalizado por el replisoma, con diferencias entre procariotas, eucariotas y mitocondrias.","objetivos":["Al terminar, sabrás describir la estructura del nucleótido y de la doble hélice antiparalela, y aplicar la complementariedad de bases y la ley de Chargaff.","Al terminar, sabrás explicar las cinco características de la replicación: semiconservativa, inicio en un origen, bidireccional, síntesis 5'→3' y semidiscontinua.","Al terminar, sabrás identificar la función de cada componente del replisoma: ADN polimerasas, helicasa, topoisomerasa, SSB, primasa, ligasa y telomerasa.","Al terminar, sabrás ordenar los acontecimientos de las etapas de inicio, elongación y terminación.","Al terminar, sabrás comparar la replicación procariota, eucariota y mitocondrial con sus datos concretos."],"ideas_clave":["La replicación es **semiconservativa**: cada molécula hija tiene una hebra parental y una nueva. Ocurre en la **fase S** del ciclo celular.","Las ADN polimerasas solo sintetizan en sentido **5'→3'**. Añaden nucleótidos al extremo **3'-OH**, leen el molde **3'→5'** y **necesitan un cebador de ARN**, porque no pueden empezar de cero.","La replicación es **semidiscontinua**. La **hebra líder** se sintetiza de forma continua con **un cebador**. La **hebra rezagada** se sintetiza en **fragmentos de Okazaki**, con **varios cebadores**.","**A=T** se unen por 2 puentes de hidrógeno y **C≡G** por 3. Según la **ley de Chargaff**, A = T, C = G y A + G = T + C (purinas = pirimidinas).","Reparto de funciones en el replisoma: la **helicasa** rompe los puentes de H (con ATP), la **topoisomerasa** alivia la tensión introduciendo superenrollamientos negativos (con ATP), las **SSB** estabilizan las hebras simples, la **primasa** (una ARN polimerasa) sintetiza los cebadores y la **ligasa** sella los fragmentos con enlaces fosfodiéster.","En procariotas, la **Pol III** elonga y la **Pol I** retira los cebadores (exonucleasa 5'→3'), rellena los huecos y corrige errores. En eucariotas, **δ y ε** equivalen a la Pol III, y la **Pol γ** es la mitocondrial.","En procariotas hay **un origen (oriC)** y la terminación se produce por el **complejo Tus-ter**. En eucariotas hay **múltiples replicones** y los extremos se protegen con la **telomerasa**, una transcriptasa inversa con molde de ARN.","El ADN mitocondrial tiene **dos orígenes (OH y OL)**. Su replicación es **unidireccional y asimétrica**, **sin fragmentos de Okazaki**, y **puede producirse fuera de la fase S**."],"secciones":[{"id":"introduccion","titulo":"1. Introducción: historia y funciones del ADN","bloques":[{"tipo":"tabla","titulo":"Hitos históricos del ADN (datos examinables)","columnas":["Investigador/es","Fecha","Aportación"],"filas":[["Johann Friedrich **Miescher** (biólogo suizo)","1869","Descubre el ADN."],["P. A. **Levene** (bioquímico)","Años 20","El ADN se fragmenta en **nucleótidos** (base + azúcar + fosfato), unidos en el orden **fosfato-azúcar-base**. Los nucleótidos se enlazan **por los fosfatos**. El ácido nucleico es una cadena de nucleótidos, como la proteína lo es de aminoácidos."],["Rosalind **Franklin**, James **Watson** y Francis **Crick**","1953 (ilustración del PDF)","Estructura en **doble hélice**, que permite replicarse y transmitir la información. Franklin aportó la difracción de rayos X (**Fotografía 51**)."],["Francis **Crick**","1970","Propuesta inicial del **Dogma Central**: ADN → ARN → proteína, con replicación del ADN."]]},{"tipo":"definicion","termino":"¿Por qué ácidos nucleicos?","texto":"Se llaman **ácidos** porque tienen propiedades ácidas. Se llaman **nucleicos** porque se aislaron por primera vez en el **núcleo**."},{"tipo":"parrafo","texto":"La función principal de los ácidos nucleicos es **almacenar, transmitir y expresar** la información genética. Es lo que recoge el **Dogma Central de la Biología Molecular**. A nivel molecular, el ADN tiene una **doble función**:\n\n- La **replicación** duplica la información antes de la división, para que cada célula hija reciba una **copia idéntica**.\n- La **expresión génica** usa la información de los genes para producir moléculas funcionales. Comprende la **transcripción** (síntesis de ARN a partir de ADN molde, Tema 9) y la **traducción** (síntesis de proteínas a partir de ARNm, Tema 10)."},{"tipo":"esquema","titulo":"Dogma Central: propuesta inicial y modificaciones posteriores","mermaid":"flowchart LR\n  A[\"ADN\"] -->|\"Replicación\"| A\n  A -->|\"Transcripción\"| B[\"ARN\"]\n  B -->|\"Transcripción inversa\"| A\n  B -->|\"Replicación\"| B\n  B -->|\"Traducción\"| C[\"PROTEÍNA\"]","pie":"La propuesta de Crick (1970) solo incluía la replicación del ADN, la transcripción y la traducción. Después se añadieron la **transcripción inversa** (ARN → ADN) y la **replicación del ARN**. La telomerasa es un ejemplo de transcriptasa inversa."},{"tipo":"perla","texto":"Si la información del ADN es correcta, la célula sintetiza todas las proteínas que necesita para su metabolismo. Si contiene **mutaciones**, fabrica proteínas no funcionales o deja de producirlas. El resultado es un funcionamiento celular deficiente (**enfermedad**) o incluso la muerte. Muchas patologías musculares y neurológicas que ve el fisioterapeuta tienen esta base molecular (complemento)."}]},{"id":"estructura","titulo":"2. Conocimientos básicos: estructura de los ácidos nucleicos","bloques":[{"tipo":"parrafo","texto":"Cada **nucleótido** está formado por **base nitrogenada + azúcar + fosfato**. En el ADN el azúcar es la **desoxirribosa**. En el ARN es la **ribosa**, que tiene un OH adicional en el carbono 2'. Cada molécula de ADN consta de **dos cadenas de nucleótidos unidas a través de las bases nitrogenadas**, que forman una doble hélice."},{"tipo":"tabla","titulo":"Bases nitrogenadas y azúcares","columnas":["Grupo","Bases","Presencia"],"filas":[["**Purinas** (doble anillo)","Adenina (A), Guanina (G)","ADN y ARN"],["**Pirimidinas** (anillo simple)","Citosina (C), Timina (T), Uracilo (U)","C en ADN y ARN; **T solo en ADN**; **U solo en ARN**"],["Azúcar","Desoxirribosa","ADN"],["Azúcar","Ribosa","ARN"]]},{"tipo":"tabla","titulo":"Complementariedad de bases","columnas":["Par","Puentes de hidrógeno","Observación"],"filas":[["A = T (A = U en ARN)","**2**","Unión más débil"],["C ≡ G","**3**","Unión más estable"]]},{"tipo":"definicion","termino":"Ley de Chargaff","texto":"La cantidad de **A es igual a la de T** y la de **G es igual a la de C**. Por tanto, el total de **bases púricas es igual al de pirimidínicas**: **A + G = T + C**."},{"tipo":"alerta","texto":"Trampa de cálculo con Chargaff. Si A = 30 %, entonces T = 30 % y G + C = 40 %, así que **C = 20 %** (no 40 % ni 30 %). Recuerda también que Chargaff iguala purinas con pirimidinas, **no** A + T con G + C."},{"tipo":"definicion","termino":"Antiparalelismo","texto":"Las dos cadenas del ADN bicatenario discurren en **direcciones opuestas**. El extremo **5'** (termina en un **grupo fosfato**) de una cadena se alinea con el extremo **3'** (termina en un **grupo hidroxilo**) de la otra, y viceversa."},{"tipo":"figura","pagina":8,"pie":"Fíjate en el número de puentes de hidrógeno de cada par: **dos en A-T** y **tres en C-G**. Debajo aparece la ley de Chargaff (A + G = T + C).","src":"img/biologia-celular-y-tisular-t8-tema-8-replicacion-del-adn-p8.jpg"}]},{"id":"caracteristicas","titulo":"3. La replicación: características principales","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Semiconservativa","texto":"Cada cadena parental actúa de **molde**. Cada molécula nueva tiene **una cadena vieja y una nueva**. Ocurre en la **fase S**."},{"etiqueta":"2","titulo":"Comienza en un origen","texto":"Las dos cadenas se replican **a la vez** desde un punto llamado **origen**. Allí la hélice se desenrolla y forma la **burbuja de replicación**."},{"etiqueta":"3","titulo":"Bidireccional","texto":"Desde el origen avanza hacia ambos lados, formando **dos horquillas de replicación** (puntos de crecimiento) que progresan hasta completar la copia."},{"etiqueta":"4","titulo":"Síntesis 5'→3'","texto":"La dirección de la ADN polimerasa es **fija y única, 5'→3'**. El molde se lee **3'→5'** y la cadena nueva es complementaria y antiparalela."},{"etiqueta":"5","titulo":"Semidiscontinua","texto":"La **hebra líder** (conductora) es continua. La **hebra rezagada** (retrasada) es discontinua, en **fragmentos de Okazaki** que avanzan en sentido contrario a la horquilla."}]},{"tipo":"parrafo","texto":"**Por qué es semidiscontinua:** las dos hebras molde son antiparalelas y la polimerasa solo avanza 5'→3'. Sobre el molde orientado **3'→5'** la síntesis sigue a la horquilla sin interrupciones (hebra líder). Sobre el molde **5'→3'** la polimerasa tiene que trabajar \"hacia atrás\": espera a que se abra un tramo, sintetiza un fragmento y vuelve a empezar con un **nuevo cebador**. Los **fragmentos de Okazaki** miden unos centenares o miles de nucleótidos según la célula."},{"tipo":"alerta","texto":"En el temario, \"cadena 3'→5'\" y \"cadena 5'→3'\" se refieren a la **orientación de la hebra molde**, no a la de la hebra nueva. **Toda** hebra nueva, también cada fragmento de Okazaki, se sintetiza **5'→3'**. Nunca existe síntesis 3'→5'."},{"tipo":"esquema","titulo":"Lógica de la horquilla de replicación","mermaid":"flowchart TD\n  A[\"Hebras molde antiparalelas\"] --> B[\"Polimerasa solo sintetiza 5'→3'\"]\n  B --> C[\"Molde 3'→5'\"]\n  B --> D[\"Molde 5'→3'\"]\n  C --> E[\"Hebra líder continua\"]\n  E --> F[\"Un solo cebador\"]\n  D --> G[\"Hebra rezagada discontinua\"]\n  G --> H[\"Fragmentos de Okazaki\"]\n  H --> I[\"Varios cebadores\"]\n  I --> J[\"Pol I retira ARN y ligasa sella\"]","pie":"La antiparalelidad, unida a la direccionalidad fija de la polimerasa, explica que la replicación sea semidiscontinua y que la hebra rezagada necesite varios cebadores."},{"tipo":"figura","pagina":13,"pie":"Burbuja con dos horquillas. En cada horquilla, una hebra es continua y la otra rezagada, formada por fragmentos de Okazaki. Observa que la líder de una horquilla es la rezagada de la horquilla opuesta y localiza el cebador de ARN de cada fragmento.","src":"img/biologia-celular-y-tisular-t8-tema-8-replicacion-del-adn-p13.jpg"}]},{"id":"enzimas","titulo":"4. Enzimas que participan: ADN polimerasas y replisoma","bloques":[{"tipo":"definicion","termino":"ADN polimerasa","texto":"Enzima encargada de **formar nuevas hebras de ADN**. Hay varias, cada una con una actividad muy específica. Cataliza la formación de **enlaces fosfodiéster** entre nucleótidos (actividad polimerasa 5'→3'). Algunas corrigen errores gracias a su **actividad exonucleasa 3'→5'**."},{"tipo":"lista","items":["**Requisito 1. Molde de ADN:** marca qué nucleótido se incorpora, según la complementariedad de bases.","**Requisito 2. Cebador:** pequeña cadena preexistente de **ARN** (5'→3'). Es imprescindible porque la polimerasa **no puede empezar de cero**.","**Requisito 3. Dirección fija 5'→3':** añade nucleótidos **siempre por el extremo 3'**."]},{"tipo":"tabla","titulo":"ADN polimerasas según el tema","columnas":["","Procariotas","Eucariotas"],"filas":[["Número de tipos","**3**: I, II y III","**5**: α, β, δ, γ y ε"],["Polimerasa principal (elongación)","**Pol III**","**Pol δ y ε**"],["Actividad exonucleasa 5'→3' y 3'→5' (corrección)","**Pol I**","**Pol δ y ε**"],["Retirada del cebador y relleno del hueco","**Pol I** (exonucleasa 5'→3')","—"],["Replicación mitocondrial","—","**Pol γ**"]]},{"tipo":"alerta","texto":"La **exonucleasa 5'→3'** de la Pol I sirve para **eliminar cebadores** de ARN. La **exonucleasa 3'→5'** sirve para **corregir errores**: la polimerasa detecta un mal emparejamiento y retira el último nucleótido incorrecto. No confundas ninguna de las dos con la dirección de síntesis (5'→3')."},{"tipo":"definicion","termino":"Replisoma","texto":"Conjunto de moléculas que participan en la síntesis de ADN. Además de las polimerasas, son unas **20 proteínas**. **No forman una unidad física, pero sí una unidad funcional**."},{"tipo":"tabla","titulo":"Componentes del replisoma","columnas":["Proteína","Función","Detalle examinable"],"filas":[["**Helicasa**","Separa las dos hebras parentales desplazándose por el ADN.","Rompe los **puentes de hidrógeno** entre bases **consumiendo ATP**. Se une en los orígenes."],["**Topoisomerasa (girasa)**","Desenrolla el ADN y alivia la tensión generada al separar las hebras.","Introduce **superenrollamientos negativos** consumiendo **ATP**."],["**SSB**","Se unen a las hebras simples y las estabilizan.","Evitan que las hebras **vuelvan a unirse**."],["**Primasa**","Sintetiza el **cebador** (fragmento corto de ARN).","Es una **ARN polimerasa**. El cebador se elimina después y la Pol I lo sustituye por ADN."],["**ADN ligasa**","Une los fragmentos de Okazaki y los huecos que quedan tras retirar el cebador.","Forma un **enlace fosfodiéster** entre el **3'-OH** de un fragmento y el **5'-fosfato** del siguiente."],["**Telomerasa**","Sintetiza los telómeros de los cromosomas eucariotas.","Es una **transcriptasa inversa** con **molde de ARN**."]]},{"tipo":"figura","pagina":16,"pie":"Mapa completo del replisoma en la horquilla: topoisomerasa por delante, helicasa, SSB, primasa con su cebador ARN, Pol III con pinza deslizante en ambas hebras, Pol I y ligasa sobre la hebra rezagada.","src":"img/biologia-celular-y-tisular-t8-tema-8-replicacion-del-adn-p16.jpg"},{"tipo":"alerta","texto":"Helicasa y topoisomerasa consumen ATP las dos, pero hacen cosas distintas. La helicasa **rompe puentes de hidrógeno**. La topoisomerasa **alivia la tensión** con superenrollamientos **negativos**. Las SSB **no gastan ATP ni desenrollan**: solo estabilizan."}]},{"id":"etapas","titulo":"5. Etapas de la replicación","bloques":[{"tipo":"parrafo","texto":"Se distinguen **tres fases** según las enzimas que participan: **inicio**, **elongación** y **terminación**. La replicación empieza en lugares específicos. En **procariotas** hay un **origen único**, el **locus oriC**, y el cromosoma de *E. coli* es un único replicón. En **eucariotas** hay **múltiples sitios de iniciación**, los **replicones**; según el tema, cada replicón sintetiza fragmentos de **100-150 pb**."},{"tipo":"esquema","titulo":"Secuencia de la etapa de inicio y de la elongación","mermaid":"flowchart TD\n  A[\"DnaA o complejo ORC reconocen el origen\"] --> B[\"Helicasa rompe puentes de H\"]\n  B --> C[\"Burbuja y dos horquillas\"]\n  C --> D[\"SSB estabilizan hebras simples\"]\n  D --> E[\"Topoisomerasa alivia tensión con ATP\"]\n  E --> F[\"Primasa sintetiza cebadores ARN\"]\n  F --> G[\"Pol III elonga 5'→3'\"]\n  G --> H[\"Pol I retira cebador y rellena\"]\n  H --> I[\"Ligasa forma enlace fosfodiéster\"]","pie":"Orden del temario: los pasos 1 a 5 corresponden al inicio y el resto a la elongación. DnaA actúa en bacterias y ORC en eucariotas."},{"tipo":"tarjetas","items":[{"etiqueta":"Inicio","titulo":"Apertura y cebado","texto":"1) **DnaA** (bacterias) o **ORC** (eucariotas) se unen al origen. 2) La **helicasa** separa las hebras y se forman la burbuja y dos horquillas. 3) Las **SSB** estabilizan las hebras. 4) La **topoisomerasa** introduce superenrollamientos negativos con ATP. 5) La **primasa** sintetiza los cebadores."},{"etiqueta":"Elongación","titulo":"Síntesis y maduración","texto":"La **Pol III** añade nucleótidos desde el cebador. La líder crece de forma continua; la retardada forma un **bucle** y crece en fragmentos de Okazaki. La **Pol I** retira el ARN (exonucleasa 5'→3'), rellena y corrige. La **ligasa** sella."},{"etiqueta":"Terminación","titulo":"Final distinto según el organismo","texto":"En **procariotas**, la proteína **Tus** se une a los sitios **ter** (TerA, TerB, TerC, TerD…) y detiene las horquillas. En **eucariotas**, la **telomerasa** evita la pérdida del extremo 3'."}]},{"tipo":"parrafo","texto":"**El problema de los extremos en eucariotas:** el cromosoma eucariota es una molécula **lineal**, y la ADN polimerasa **no puede copiar el último fragmento del extremo 3' de la cadena molde**. Los extremos, los **telómeros**, contienen secuencias **repetidas unas 1000 veces**. La **telomerasa**, una enzima con **actividad transcriptasa inversa**, alarga el telómero en sentido **5'→3'** usando un **molde de ARN propio**. Después, la ADN polimerasa puede \"copiar\" ese extremo 3' extendiendo un cebador de ARN."},{"tipo":"figura","pagina":22,"pie":"Mecanismo de la telomerasa: se une a la protuberancia 3' del telómero, añade repeticiones usando su ARN como molde, se desplaza y repite el proceso. Al final, la ADN polimerasa completa la cadena complementaria. Arriba a la izquierda aparecen los sitios ter de terminación procariota.","src":"img/biologia-celular-y-tisular-t8-tema-8-replicacion-del-adn-p22.jpg"},{"tipo":"perla","texto":"El acortamiento telomérico en cada división se relaciona con el envejecimiento celular y con la menor capacidad regenerativa de los tejidos (complemento). Ayuda a entender por qué la reparación de piel, tendón o músculo es más lenta en pacientes mayores, algo que el fisioterapeuta debe tener en cuenta al dosificar las cargas y los plazos de recuperación (complemento)."}]},{"id":"eucariotas-procariotas","titulo":"6. Eucariotas vs procariotas","bloques":[{"tipo":"tabla","titulo":"Comparativa de la replicación (tabla del temario)","columnas":["Rasgo","Procariotas","Eucariotas"],"filas":[["Histonas","ADN **no asociado** a histonas","ADN **asociado** a histonas. Las histonas se **sintetizan simultáneamente** a la replicación y se forman nuevos nucleosomas"],["Tamaño del ADN","**1 mm**","**50 mm**"],["Orígenes","**Uno** (oriC), con una burbuja","**Varios** (replicones) que se activan **simultáneamente**"],["Fragmentos de Okazaki","**Grandes**: unos **1000 nucleótidos**","**Pequeños**: **100-200 nucleótidos**"],["Terminación","Complejo **Tus-ter**","**Telomerasas**"],["Polimerasa principal","Pol III","Pol δ y ε"],["Proteína de reconocimiento del origen","DnaA","Complejo ORC"],["Velocidad","Proceso **rápido**","Proceso **lento**"]]},{"tipo":"alerta","texto":"No mezcles cifras. **100-150 pb** es lo que el tema atribuye a cada **replicón** eucariota. **100-200 nucleótidos** es el tamaño de los **fragmentos de Okazaki eucariotas**. **1000 nucleótidos** corresponde a los fragmentos de Okazaki **procariotas**. A su vez, **1000 veces** es el número de repeticiones del telómero."},{"tipo":"perla","texto":"En eucariotas, la lentitud de la polimerasa se compensa con los **múltiples replicones activados a la vez**. Sin ellos sería imposible replicar 50 mm de ADN en una sola fase S."}]},{"id":"mitocondrias","titulo":"7. Otros tipos de replicación: ADN mitocondrial","bloques":[{"tipo":"lista","items":["Tiene **dos orígenes**: **OH** (hebra pesada, H) y **OL** (hebra ligera, L).","La replicación es **unidireccional y asimétrica**.","Usa una polimerasa específica, la **Pol γ**.","La síntesis es **continua y unidireccional** desde OH hasta llegar a **OL**. Allí comienza la síntesis de la segunda cadena en **dirección opuesta**.","A diferencia de procariotas y eucariotas (nuclear), **puede producirse fuera de la fase S**.","**No necesita fragmentos de Okazaki**."]},{"tipo":"tabla","titulo":"Replicación nuclear eucariota vs mitocondrial","columnas":["Rasgo","Nuclear eucariota","Mitocondrial"],"filas":[["Orígenes","Múltiples replicones","Dos (OH y OL)"],["Direccionalidad","Bidireccional","Unidireccional y asimétrica"],["Okazaki","Sí (semidiscontinua)","No (continua en ambas hebras)"],["Polimerasa","δ y ε","γ"],["Momento","Fase S","También fuera de la fase S"]]},{"tipo":"figura","pagina":24,"pie":"Replicación del ADN mitocondrial circular. La síntesis empieza en OH sobre la hebra pesada. Cuando la horquilla expone OL, comienza la síntesis de la segunda cadena en sentido opuesto. No hay fragmentos de Okazaki.","src":"img/biologia-celular-y-tisular-t8-tema-8-replicacion-del-adn-p24.jpg"},{"tipo":"perla","texto":"La fibra muscular esquelética es posmitótica (no entra en fase S), pero sigue replicando su ADN mitocondrial porque este proceso es **independiente de la fase S** (complemento). Por eso los defectos de la Pol γ o del ADN mitocondrial se manifiestan en tejidos de alta demanda energética, como el músculo y el sistema nervioso, con intolerancia al ejercicio (complemento)."}]}],"caso_clinico":{"titulo":"Intolerancia al esfuerzo en una paciente con miopatía mitocondrial","presentacion":"Mujer de 34 años derivada a fisioterapia por fatiga precoz, debilidad proximal y ptosis palpebral progresiva. El estudio genético identificó una mutación en el gen de la **ADN polimerasa γ** (complemento) con deleciones múltiples del ADN mitocondrial en la biopsia muscular. Su ADN nuclear y su replicación celular general son normales. El neurólogo solicita un programa de ejercicio terapéutico adaptado.","preguntas":[{"pregunta":"¿Por qué una mutación en la Pol γ altera el ADN mitocondrial pero no la replicación del ADN nuclear?","respuesta":"Según el tema, la mitocondria tiene una **polimerasa específica, la Pol γ**. La replicación nuclear eucariota la llevan a cabo principalmente las **Pol δ y ε**. Un defecto de la Pol γ compromete la copia fiel del ADN mitocondrial, que no puede corregirse bien. El ADN nuclear sigue replicándose con normalidad en la fase S."},{"pregunta":"Las fibras musculares de la paciente no se dividen. ¿Cómo es posible que acumulen errores de replicación en su ADN mitocondrial?","respuesta":"La replicación mitocondrial **puede producirse fuera de la fase S**: es independiente del ciclo celular. Aunque la fibra sea posmitótica, su ADN mitocondrial se sigue replicando de forma continua y unidireccional desde OH hasta OL. Con una Pol γ defectuosa, cada ronda acumula alteraciones (deleciones) que reducen las copias funcionales."},{"pregunta":"Relaciona el defecto molecular con la clínica y con una precaución en el tratamiento de fisioterapia.","respuesta":"Si el ADN contiene errores, la célula fabrica proteínas no funcionales o deja de producirlas, y el funcionamiento celular es deficiente (enfermedad). Aquí fallan proteínas mitocondriales necesarias para la producción de energía (complemento), de ahí la fatiga y la intolerancia al esfuerzo. Precaución: ejercicio aeróbico de **intensidad baja-moderada y progresiva**, con pausas, vigilando la fatiga y evitando esfuerzos máximos y prolongados (complemento)."}]},"glosario":[{"termino":"Replicación semiconservativa","definicion":"Cada molécula hija conserva una hebra parental y una hebra recién sintetizada."},{"termino":"Origen de replicación","definicion":"Punto específico donde comienza la replicación. Es oriC en procariotas y múltiples replicones en eucariotas."},{"termino":"Burbuja de replicación","definicion":"Zona desenrollada en el origen, delimitada por dos horquillas que avanzan en sentidos opuestos."},{"termino":"Horquilla de replicación","definicion":"Punto de crecimiento donde se separan las hebras parentales y se sintetizan las nuevas."},{"termino":"Hebra líder (conductora)","definicion":"Hebra nueva sintetizada de forma continua sobre el molde 3'→5', con un único cebador."},{"termino":"Hebra rezagada (retrasada)","definicion":"Hebra nueva sintetizada de forma discontinua en fragmentos de Okazaki, con varios cebadores."},{"termino":"Fragmentos de Okazaki","definicion":"Segmentos de la hebra rezagada sintetizados 5'→3'. Miden unos 1000 nucleótidos en procariotas y 100-200 en eucariotas."},{"termino":"Cebador (primer)","definicion":"Fragmento corto de ARN sintetizado por la primasa que aporta el 3'-OH inicial para la ADN polimerasa."},{"termino":"Replisoma","definicion":"Unidad funcional, no física, de unas 20 proteínas además de las ADN polimerasas, que realiza la replicación."},{"termino":"Helicasa","definicion":"Enzima que separa las hebras rompiendo los puentes de hidrógeno con consumo de ATP."},{"termino":"Topoisomerasa (girasa)","definicion":"Enzima que alivia la tensión de desenrollamiento introduciendo superenrollamientos negativos con ATP."},{"termino":"ADN ligasa","definicion":"Enzima que forma un enlace fosfodiéster entre el 3' de un fragmento y el 5' del siguiente."},{"termino":"Telómero","definicion":"Extremo del cromosoma eucariota lineal formado por secuencias repetidas unas 1000 veces."},{"termino":"Telomerasa","definicion":"Transcriptasa inversa que alarga el telómero 5'→3' usando un molde de ARN propio."},{"termino":"Complejo Tus-ter","definicion":"Unión de la proteína Tus a los sitios ter que detiene las horquillas en procariotas."}],"fuentes":["Universidad Europea. Biología Celular y Tisular, Tema 8: Replicación. Grado en Fisioterapia, curso 2025-2026.","Salazar Montes A., Sandoval Rodríguez A. S., Armendáriz Borunda J. S. Biología molecular. Fundamentos y aplicaciones en las ciencias de la salud. McGraw-Hill Education / AccessMedicina (figura de replicación mitocondrial)."],"qcm":[{"pregunta":"En la terminación de la replicación de un cromosoma eucariota, ¿qué enzima evita el acortamiento progresivo del extremo 3' de la cadena molde y mediante qué mecanismo?","opciones":["La primasa, que sintetiza un cebador de ARN permanente sobre la secuencia telomérica","La ADN ligasa, que sella el extremo 3' libre del telómero mediante un enlace fosfodiéster","La ADN polimerasa I, que rellena el hueco del último cebador con desoxirribonucleótidos","La telomerasa, que alarga el telómero en sentido 5'→3' usando un molde de ARN propio"],"correcta":3,"explicacion":"La ADN polimerasa no puede copiar el último fragmento del extremo 3' del molde en una molécula lineal. La telomerasa, con actividad transcriptasa inversa, alarga el telómero 5'→3' usando su propio ARN como molde. Así la polimerasa puede completar la cadena complementaria.","por_opcion":["❌ La primasa sintetiza cebadores que luego se eliminan. No existe un cebador permanente que proteja el telómero.","❌ La ligasa une fragmentos de Okazaki entre sí. No puede añadir secuencia nueva al extremo del cromosoma.","❌ La Pol I es procariota y rellena los huecos de los cebadores internos. No resuelve el problema del extremo de los cromosomas lineales eucariotas.","✅ La telomerasa es una transcriptasa inversa que alarga el telómero 5'→3' con un molde de ARN, evitando la pérdida del extremo 3'."]},{"pregunta":"Un fragmento de ADN bicatenario contiene un 30 % de adenina. Aplicando la ley de Chargaff, ¿qué porcentaje de citosina tendrá?","opciones":["30 %","40 %","35 %","20 %"],"correcta":3,"explicacion":"Según Chargaff, A = T y C = G. Si A = 30 %, T = 30 %, y entre ambas suman el 60 %. El 40 % restante se reparte a partes iguales entre G y C, así que C = 20 %.","por_opcion":["❌ El 30 % corresponde a la timina, que es igual a la adenina, no a la citosina.","❌ El 40 % es la suma de G + C, no el porcentaje de citosina sola.","❌ El 35 % resultaría de repartir mal el total entre las cuatro bases sin aplicar A = T y C = G.","✅ A + T = 60 %, luego G + C = 40 % y C = 20 %."]},{"pregunta":"En procariotas, ¿qué enzima y qué actividad catalítica eliminan los cebadores de ARN de los fragmentos de Okazaki?","opciones":["La ADN ligasa, mediante la hidrólisis del enlace fosfodiéster ARN-ADN","La ADN polimerasa III, mediante su actividad exonucleasa 3'→5'","La ADN polimerasa I, mediante su actividad exonucleasa 5'→3'","La primasa, mediante una actividad ribonucleasa sobre su propio producto"],"correcta":2,"explicacion":"El tema indica que los cebadores de ARN se eliminan por la actividad exonucleasa 5'→3' de la ADN polimerasa I. Esta enzima también rellena los huecos con ADN y corrige errores. Después la ligasa sella los fragmentos.","por_opcion":["❌ La ligasa forma enlaces fosfodiéster, no los hidroliza.","❌ La Pol III es la polimerasa principal de elongación. La exonucleasa 3'→5' se asocia a la corrección de errores, no a la retirada de cebadores.","✅ La Pol I retira el ARN cebador con su exonucleasa 5'→3' y rellena el hueco con ADN.","❌ La primasa solo sintetiza los cebadores. No los elimina."]},{"pregunta":"Al separarse las hebras en el origen se acumula tensión de enrollamiento por delante de la horquilla. Según el temario, ¿cómo se resuelve?","opciones":["La helicasa invierte su avance y relaja el ADN consumiendo ATP","La topoisomerasa introduce superenrollamientos negativos consumiendo ATP","Las proteínas SSB introducen superenrollamientos negativos sin gasto energético","La topoisomerasa introduce superenrollamientos positivos sin consumir ATP"],"correcta":1,"explicacion":"La topoisomerasa (o girasa) alivia la tensión generada por la separación de las hebras introduciendo superenrollamientos negativos con consumo de ATP. La helicasa también consume ATP, pero su función es romper los puentes de hidrógeno.","por_opcion":["❌ La helicasa rompe los puentes de hidrógeno y avanza en un solo sentido. No relaja la tensión.","✅ La topoisomerasa introduce superenrollamientos negativos con gasto de ATP y elimina la tensión.","❌ Las SSB solo estabilizan las hebras simples para que no se vuelvan a unir. No modifican el superenrollamiento.","❌ La topoisomerasa introduce superenrollamientos negativos, no positivos, y sí consume ATP."]},{"pregunta":"¿Qué combinación de tamaños de fragmentos de Okazaki recoge la tabla comparativa del tema?","opciones":["Procariotas unos 1000 nucleótidos; eucariotas 100-150 pb","Procariotas 100-150 pb; eucariotas 100-200 nucleótidos","Procariotas 100-200 nucleótidos; eucariotas unos 1000 nucleótidos","Procariotas unos 1000 nucleótidos; eucariotas 100-200 nucleótidos"],"correcta":3,"explicacion":"La tabla del tema indica fragmentos de Okazaki grandes en procariotas (unos 1000 nucleótidos) y pequeños en eucariotas (100-200 nucleótidos). La cifra de 100-150 pb corresponde a lo que el tema atribuye a cada replicón eucariota.","por_opcion":["❌ Confunde el tamaño de los fragmentos de Okazaki eucariotas con la cifra del replicón (100-150 pb).","❌ La cifra de 100-150 pb se refiere a los replicones eucariotas, no a los fragmentos procariotas.","❌ Invierte las cifras: los fragmentos grandes son los procariotas.","✅ Coincide con la tabla: unos 1000 nucleótidos en procariotas y 100-200 en eucariotas."]},{"pregunta":"¿Qué afirmación sobre la replicación del ADN mitocondrial es correcta según el tema?","opciones":["Es bidireccional y simétrica a partir de un único origen","Requiere fragmentos de Okazaki en la hebra ligera (L)","La lleva a cabo la ADN polimerasa δ de forma discontinua","Puede producirse fuera de la fase S del ciclo celular"],"correcta":3,"explicacion":"A diferencia de la replicación procariota y de la eucariota nuclear, la mitocondrial puede ocurrir fuera de la fase S. Tiene dos orígenes (OH y OL), es unidireccional y asimétrica, la realiza la Pol γ y no necesita fragmentos de Okazaki.","por_opcion":["❌ Tiene dos orígenes (OH y OL) y es unidireccional y asimétrica.","❌ No necesita fragmentos de Okazaki. La segunda cadena empieza en OL en sentido opuesto.","❌ Usa la polimerasa específica γ, y la síntesis es continua.","✅ La replicación mitocondrial es independiente de la fase S."]},{"pregunta":"¿Qué ADN polimerasas eucariotas desempeñan la función equivalente a la ADN polimerasa III bacteriana?","opciones":["Las polimerasas δ y ε","Las polimerasas α y β","Las polimerasas α y γ","La polimerasa γ en exclusiva"],"correcta":0,"explicacion":"La Pol III es la enzima principal de la replicación bacteriana, porque añade los nucleótidos a la nueva cadena. El tema indica que las Pol δ y ε desempeñan la misma función en eucariotas y que, además, tienen actividad exonucleasa correctora.","por_opcion":["✅ δ y ε son las equivalentes eucariotas de la Pol III.","❌ α y β forman parte de las cinco polimerasas eucariotas, pero el tema no les asigna la función de la Pol III.","❌ Combina una polimerasa sin esa función con la mitocondrial (γ).","❌ La Pol γ es la polimerasa específica de la mitocondria."]},{"pregunta":"En una misma horquilla de replicación, ¿cómo se distribuyen los cebadores de ARN entre las dos hebras nuevas?","opciones":["Uno en la hebra líder y varios en la hebra retrasada","Ninguno en la hebra líder y uno por cada fragmento retrasado","Uno por hebra, sintetizado por la primasa al inicio de cada una","Varios en la hebra líder y uno solo en la hebra retrasada"],"correcta":0,"explicacion":"La hebra líder se sintetiza de forma continua y necesita un único ARN iniciador. La retrasada se sintetiza en fragmentos de Okazaki y cada fragmento requiere su propio cebador, por lo que tiene varios.","por_opcion":["✅ Un ARN iniciador en la hebra líder y varios en la retrasada, como dicen las ideas clave del tema.","❌ La hebra líder también necesita cebador, porque la polimerasa no puede empezar de cero.","❌ Ignora que cada fragmento de Okazaki necesita un cebador nuevo.","❌ Invierte la relación: la hebra continua es la líder."]},{"pregunta":"Una ADN polimerasa incorpora un nuevo nucleótido a la cadena en formación. ¿Qué describe correctamente su funcionamiento?","opciones":["Lee el molde 3'→5' y añade nucleótidos al extremo 3' hidroxilo","Lee el molde 5'→3' y añade nucleótidos al extremo 5' fosfato","Lee el molde 5'→3' y añade nucleótidos al extremo 3' hidroxilo","Lee el molde 3'→5' y añade nucleótidos al extremo 5' fosfato"],"correcta":0,"explicacion":"La síntesis es fija 5'→3': la polimerasa añade nucleótidos siempre al extremo 3' (hidroxilo). Como la cadena nueva es antiparalela, el molde se lee 3'→5'.","por_opcion":["✅ Lectura del molde 3'→5' y adición al extremo 3'-OH, es decir, síntesis 5'→3'.","❌ Ambos datos son incorrectos: el molde se lee 3'→5' y se añade al 3'-OH.","❌ El extremo es correcto, pero la lectura del molde sería paralela, no antiparalela.","❌ La lectura es correcta, pero la adición al 5' implicaría una síntesis 3'→5', que no existe."]},{"pregunta":"¿Cuál es la secuencia correcta de acontecimientos en la etapa de inicio de la replicación, según el temario?","opciones":["Topoisomerasa → ORC/DnaA → helicasa → primasa → SSB","ORC/DnaA → helicasa → SSB → topoisomerasa → primasa","Helicasa → ORC/DnaA → topoisomerasa → SSB → primasa","ORC/DnaA → primasa → helicasa → SSB → topoisomerasa"],"correcta":1,"explicacion":"Primero DnaA (bacterias) u ORC (eucariotas) reconocen el origen. Después la helicasa separa las hebras y forma la burbuja, y las SSB estabilizan las hebras simples. A continuación la topoisomerasa alivia la tensión y, por último, la primasa sintetiza los cebadores.","por_opcion":["❌ La tensión que alivia la topoisomerasa se genera al separar las hebras, así que no puede ser el primer paso.","✅ Coincide con los cinco pasos del inicio descritos en el tema.","❌ La helicasa se une al origen después de que DnaA u ORC lo reconozcan.","❌ La primasa necesita hebras ya separadas: actúa al final del inicio."]},{"pregunta":"¿Qué mecanismo detiene las horquillas de replicación en el cromosoma de *E. coli*?","opciones":["La proteína Tus, que se une a los sitios de terminación ter","El complejo ORC, que bloquea las horquillas al llegar al oriC","La proteína DnaA, que se une a las secuencias ter del cromosoma","La telomerasa, que alarga los extremos del cromosoma bacteriano"],"correcta":0,"explicacion":"En procariotas, la terminación está mediada por la unión de la proteína Tus a los sitios ter, que detiene el avance de las horquillas. La telomerasa es exclusiva de los cromosomas lineales eucariotas.","por_opcion":["✅ El complejo Tus-ter marca el final de la replicación procariota.","❌ ORC es el complejo eucariota de reconocimiento del origen.","❌ DnaA reconoce el origen (oriC) en el inicio, no los sitios ter.","❌ El cromosoma bacteriano es circular y no tiene telómeros. La telomerasa es propia de eucariotas."]},{"pregunta":"Una molécula de ADN se replica dos veces consecutivas. ¿Cuántas de las moléculas resultantes conservan una hebra parental original?","opciones":["Una de las cuatro, que mantiene intacta la doble hélice parental","Las cuatro, porque cada hebra parental se reparte en fragmentos","Dos de las cuatro, cada una con una hebra parental y otra nueva","Ninguna, porque en la segunda ronda se renuevan ambas hebras"],"correcta":2,"explicacion":"En la replicación semiconservativa, cada hebra parental sirve de molde y se mantiene íntegra en una molécula hija. Las dos hebras originales acaban en dos de las cuatro moléculas de la segunda generación, cada una emparejada con una hebra nueva.","por_opcion":["❌ Describe el modelo conservativo: la doble hélice parental no se mantiene unida.","❌ Las hebras parentales no se fragmentan ni se reparten: se conservan enteras.","✅ Las dos hebras parentales persisten en dos de las cuatro moléculas.","❌ Las hebras parentales nunca se degradan: siguen actuando como molde."]},{"pregunta":"¿A quién atribuye el tema la descripción de que los nucleótidos se unen en el orden fosfato-azúcar-base y se enlazan entre sí por los fosfatos?","opciones":["A P. A. Levene, en la década de 1920","A Francis Crick, en su propuesta de 1970","A Rosalind Franklin, con la Fotografía 51","A Johann Friedrich Miescher, en 1869"],"correcta":0,"explicacion":"El bioquímico P. A. Levene, en los años 20, fragmentó el ADN en nucleótidos y describió su composición, el orden fosfato-azúcar-base y la unión entre nucleótidos por los fosfatos.","por_opcion":["✅ Levene describió el nucleótido y su orden fosfato-azúcar-base.","❌ En 1970 Crick propuso el Dogma Central, no la composición del nucleótido.","❌ Franklin aportó la difracción de rayos X que ayudó a establecer la doble hélice.","❌ Miescher descubrió el ADN en 1869, pero no describió la composición de los nucleótidos."]},{"pregunta":"Una región de ADN con un 70 % de pares G-C requiere más energía para que la helicasa separe sus hebras que una región rica en A-T. ¿Por qué?","opciones":["Porque cada par G-C se une por un enlace fosfodiéster","Porque G y C son purinas, más voluminosas que A y T","Porque cada par G-C establece tres puentes de hidrógeno","Porque cada par G-C establece dos puentes más estables"],"correcta":2,"explicacion":"La helicasa rompe los puentes de hidrógeno entre bases complementarias. Citosina y guanina se unen por tres puentes de hidrógeno, y adenina y timina solo por dos. Por eso las regiones ricas en G-C necesitan más energía para separarse.","por_opcion":["❌ Los enlaces fosfodiéster unen nucleótidos de la misma cadena, no las bases complementarias.","❌ Solo G es purina. C es pirimidina, y A es purina.","✅ El par C-G tiene tres puentes de hidrógeno y el A-T dos.","❌ Dos puentes de hidrógeno es lo que corresponde al par A-T."]},{"pregunta":"Según la tabla comparativa del tema, ¿qué rasgo corresponde a la replicación eucariota?","opciones":["Terminación mediante el complejo Tus-ter y proceso rápido","Síntesis de histonas simultánea a la replicación y nuevos nucleosomas","ADN de 1 mm de longitud no asociado a proteínas histonas","Un único origen de replicación que forma una sola burbuja"],"correcta":1,"explicacion":"En eucariotas el ADN está asociado a histonas, que se sintetizan simultáneamente a la replicación para formar nuevos nucleosomas. El ADN mide unos 50 mm, hay varios replicones activados a la vez, la terminación depende de las telomerasas y el proceso es lento.","por_opcion":["❌ El complejo Tus-ter y la rapidez son propios de procariotas.","✅ Rasgo exclusivo eucariota recogido en la tabla.","❌ Un ADN de 1 mm sin histonas corresponde a procariotas. En eucariotas mide 50 mm.","❌ Un único origen (oriC) y una burbuja corresponden a procariotas."]}],"asignatura":"Biología celular y tisular","tema":8,"fecha":"2026-11-04"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const L = 'ABCD';
const secs = F.secciones || [];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="tarjetas">${(b.items||[]).map(t=>`<div class="tarjeta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="def"><b>${md(b.termino)}</b> — ${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota perla"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota alerta"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${md(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const nav = secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`).join('') + (F.caso_clinico?'<a href="#caso">Caso clínico</a>':'') + (F.glosario?.length?'<a href="#glosario">Glosario</a>':'') + `<a class="qcm" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`;

document.getElementById('app').innerHTML = `
<header class="portada"><div class="envoltura">
  <div class="etiquetas">${F.asignatura?`<span class="etiqueta">${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="etiqueta o">Tema ${esc(F.tema)}</span>`:''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="meta">${F.tipo==='grand-qcm'?`<div><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div><b>${secs.length}</b><span>secciones</span></div><div><b>${(F.ideas_clave||[]).length}</b><span>ideas clave</span></div>`}<div><b>${(F.qcm||[]).length}</b><span>preguntas</span></div><div id="ultimo"></div></div>
</div></header>
<nav class="indice" aria-label="Índice"><div class="envoltura">${nav}</div></nav>
<main class="envoltura">
  ${(F.objetivos||[]).length?`<div class="dos">
    <div class="caja"><h3>Objetivos</h3><ul>${(F.objetivos||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>
    <div class="caja"><h3>Lo que hay que saber</h3><ol class="claves">${(F.ideas_clave||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>
  </div>`:''}
  ${F.tipo==='grand-qcm'&&(F.fichas||[]).length?`<div class="caja" style="margin-top:40px"><h3>Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="num">Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd>`).join('')}</dl></section>`:''}
  <section id="qcm"><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="envoltura">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* ---------- esquemas ---------- */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:oscuro?'dark':'neutral',fontFamily:'Spectral, Georgia, serif',flowchart:{htmlLabels:true,curve:'basis'}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* ---------- QCM ---------- */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u) document.getElementById('ultimo').innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; }catch(e){} }
ultimo();
const marco = document.getElementById('marco');

function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${(pos)/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="etiqueta o" style="display:inline-block;margin-bottom:12px">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="btn sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="btn" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'Dominado. Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'Bien, pero repasa las preguntas falladas.':'Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="btn" id="rep">Repetir todo</button>${fallos.length?'<button class="btn sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
