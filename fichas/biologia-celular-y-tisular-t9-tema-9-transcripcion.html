<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tema 9. Transcripción · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>

<script id="datos" type="application/json">{"titulo":"Tema 9. Transcripción","subtitulo":"Cómo la ARN polimerasa copia un gen de ADN en ARN, en qué se diferencia el proceso entre procariotas y eucariotas, cómo madura el ARNm eucariota y qué es la transcripción inversa de los retrovirus.","resumen":["La **transcripción** es la síntesis de una monohebra de ARN complementaria a la **hebra molde (-)** del ADN. Su secuencia es igual a la de la **hebra codificante (+)**, cambiando **T por U**.","La **ARN polimerasa** sintetiza siempre en dirección **5'→3'**, **no necesita cebador** y **no corrige errores** porque carece de actividad exonucleasa. Se une a un **promotor** y se detiene en un **terminador**.","En procariotas, el **factor sigma** reconoce las cajas **-35 (TTGACA)** y **-10 (TATAAT, caja de Pribnow)**. En eucariotas, **factores de transcripción** se unen a la **caja TATA** y forman el complejo de inicio con una de las **3 ARN polimerasas (I, II y III)**.","Durante la elongación se forma una **burbuja de transcripción** con un **híbrido ADN/ARN de ~8 pb**, y las **topoisomerasas** resuelven el superenrollamiento. La terminación es **rho-dependiente o rho-independiente** en procariotas; en eucariotas depende de la señal **AAUAAA** (ARN pol II) o de una serie **TTTTT** (ARN pol III).","Solo en eucariotas el transcrito primario **madura en el núcleo** mediante **capping 5', poliadenilación 3' (40–250 A) y splicing**. El **splicing alternativo** permite obtener varias proteínas de un mismo gen, y la **transcriptasa inversa** de los retrovirus sintetiza ADN usando ARN vírico como molde."],"objetivos":["Al terminar, sabrás distinguir los tipos de ARN (ARNm, ARNr, ARNt, miARN, siARN) por su función, su abundancia y su estructura.","Al terminar, sabrás describir las características, los componentes y las etapas de la transcripción (inicio, elongación, terminación) con sus secuencias señal.","Al terminar, sabrás comparar punto por punto la transcripción procariota y la eucariota.","Al terminar, sabrás explicar los tres procesos de maduración del ARNm eucariota y el significado del splicing alternativo.","Al terminar, sabrás explicar la transcripción inversa en los retrovirus (VIH): enzima, molde, cebador y destino del ADN."],"ideas_clave":["El ARN transcrito es **complementario a la hebra molde** e **idéntico a la hebra codificante**, con **U en lugar de T**.","La ARN polimerasa **no requiere cebador** y **no tiene actividad exonucleasa**, de modo que no corrige errores. Sintetiza en dirección **5'→3'**.","Abundancia del ARN celular: **ARNr 80% > ARNt 15% > ARNm 5%**. El ARNm es el más grande y el más heterogéneo.","Procariotas: **una sola ARN polimerasa** de 6 subunidades, cuyo **factor sigma** reconoce las cajas **-35 y -10** y se disocia tras unos **10 nt**. Eucariotas: **ARN pol I, II y III**, con más de 10 subunidades y numerosos factores de transcripción que reconocen la **caja TATA**.","La **burbuja de transcripción** contiene la ARN pol y un **híbrido ADN/ARN de ~8 pb**. Las **topoisomerasas** alivian el superenrollamiento.","Terminación: en procariotas es **rho-independiente** (horquilla formada por una repetición invertida) o **rho-dependiente**. En eucariotas, la ARN pol II usa **AAUAAA**, la pol III una serie **TTTTT** y la pol I una secuencia específica con proteínas auxiliares.","Maduración, **solo en eucariotas**: **capping** (guanina modificada en 5', a los ~20 nt), **cola poli-A** (40–250 A en 3') y **splicing** (se eliminan los intrones y se unen los exones). El **splicing alternativo** genera varias proteínas a partir de un gen.","La **transcriptasa inversa** de los retrovirus sintetiza **ADN a partir de ARN**, usando el **ARN vírico como molde** y un **ARNt vírico como cebador**. El ADN resultante se integra en el genoma de la célula."],"secciones":[{"id":"introduccion","titulo":"1. Introducción: dogma central y expresión génica","bloques":[{"tipo":"parrafo","texto":"La función principal de los ácidos nucleicos es **almacenar, transmitir y expresar** la información genética, tal como resume el **Dogma Central de la Biología Molecular**. La información fluye del ADN al ARN y del ARN a la proteína. La transcripción es el primer paso: copia selectivamente un fragmento del ADN (un gen) en una molécula de ARN que puede salir del núcleo o actuar directamente en la célula."},{"tipo":"definicion","termino":"Expresión génica","texto":"Conjunto de procesos que permiten que la información del ADN se **transcriba en ARN** y se **traduzca en proteínas**. Consta de dos procesos: **transcripción** (síntesis de ARN a partir de un ADN molde) y **traducción** (síntesis de proteínas a partir de un molde de ARNm)."},{"tipo":"esquema","titulo":"Flujo de la información genética","mermaid":"flowchart LR\n  A[\"ADN\"] -->|\"Transcripción: ARN polimerasa\"| B[\"ARN\"]\n  B -->|\"Traducción: ribosoma\"| C[\"Proteína\"]\n  B -->|\"Transcripción inversa: retrovirus\"| A","pie":"Dogma central: la transcripción va de ADN a ARN y la traducción de ARN a proteína. Los retrovirus invierten el primer paso mediante la transcriptasa inversa."},{"tipo":"perla","texto":"Cualquier adaptación tisular que estudiarás en fisioterapia empieza por un cambio en la expresión génica: es decir, en qué genes se transcriben y en qué cantidad. Ejemplos son la síntesis de colágeno en la reparación tendinosa o la producción de proteínas contráctiles en el músculo. Entender la transcripción es la base molecular de la plasticidad de los tejidos."}]},{"id":"tipos-arn","titulo":"2. Tipos de ARN","bloques":[{"tipo":"tabla","titulo":"Tipos de ARN: función y abundancia","columnas":["Tipo","Función","% del ARN celular","Rasgo clave"],"filas":[["ARNm (mensajero)","Contiene la información genética para sintetizar proteínas; sirve de molde","5%","El más grande y el más heterogéneo; en eucariotas debe madurar (splicing)"],["ARNr (ribosómico)","Forma parte de la estructura de los ribosomas","80%","Algunos actúan como catalizadores (ribozimas)"],["ARNt (transferencia)","Identifica los aminoácidos y los lleva al ribosoma (adaptador)","15%","Un ARNt por aminoácido; lleva un anticodón"],["miARN (microARN)","Bloquea la traducción del ARNm o induce su degradación","—","Precursor en horquilla con complementariedad imperfecta; procesado por Drosha y Dicer"],["siARN (interferente pequeño)","Corta el ARNm y evita que se produzca su proteína","—","Bicatenario, perfectamente complementario, de ~20–21 nt"]]},{"tipo":"dato","valor":"80 / 15 / 5 %","texto":"Proporción de **ARNr / ARNt / ARNm** respecto del ARN celular total. El ARNm es el menos abundante aunque sea el más grande."},{"tipo":"tarjetas","items":[{"etiqueta":"ARNm","titulo":"Policistrónico","texto":"Codifica **más de una proteína**, porque lleva la información de varios genes. Es típico de los **procariotas**."},{"etiqueta":"ARNm","titulo":"Monocistrónico","texto":"Codifica **una sola proteína**. La **mayoría** de los ARNm eucariotas son monocistrónicos."}]},{"tipo":"tabla","titulo":"ARN ribosómico y ribosomas","columnas":["","Procariotas","Eucariotas (vertebrados)"],"filas":[["Tipos de ARNr","23S, 16S y 5S","28S, 18S, 5.8S y 5S"],["Subunidad grande","50S = ARNr 23S (2900 nt) + 5S (120 nt) + 31 proteínas","60S = ARNr 28S (4800 nt) + 5.8S (160 nt) + 5S (120 nt) + 50 proteínas"],["Subunidad pequeña","30S = ARNr 16S (1500 nt) + 21 proteínas","40S = ARNr 18S (1900 nt) + 33 proteínas"],["Ribosoma completo","70S","80S"]]},{"tipo":"figura","pagina":6,"pie":"Composición de los ribosomas. Compara la columna de ARNr (23S/16S/5S frente a 28S/5.8S/18S/5S), el número de proteínas de cada subunidad y el ribosoma ensamblado (70S frente a 80S).","src":"img/biologia-celular-y-tisular-t9-tema-9-transcripcion-p6.jpg"},{"tipo":"alerta","texto":"Los coeficientes S **no se suman**: 50S + 30S = **70S** y 60S + 40S = **80S**. El ARNr **5.8S** es **exclusivo de eucariotas**, mientras que el **5S** está en ambos tipos de célula. El 16S es procariota y el 18S eucariota (subunidad pequeña)."},{"tipo":"definicion","termino":"Anticodón","texto":"Triplete de bases (A, C, G, U) del **ARNt**, **complementario al codón del ARNm** y antiparalelo a él. Por ejemplo, al codón GAG le corresponde el anticodón CUC. El aminoácido se une al **extremo 3'** del ARNt. En su estructura destacan el **bucle D**, el **bucle T** y el **bucle del anticodón**."},{"tipo":"tabla","titulo":"miARN frente a siARN","columnas":["Rasgo","miARN","siARN"],"filas":[["Origen","Precursores específicos codificados en el genoma que se pliegan en horquillas (hairpins)","Moléculas largas de ARN bicatenario (dsARN) o shARN"],["Complementariedad","Imperfecta","Perfecta"],["Procesamiento","Dos etapas: **Drosha en el núcleo** y **Dicer en el citoplasma**","**Dicer** corta el dsARN en varios siARN"],["Estructura","Dúplex maduro tras Dicer","Bicatenario de ~20–21 nt, con 2 nt desemparejados en cada 3', fosfato en 5' y OH en 3'"],["Complejo efector","Hebra antisentido en un complejo similar al RISC","Hebra antisentido en el RISC (con Ago), que actúa como guía"],["Efecto","Inhibe la traducción o induce la degradación, según el grado de complementariedad","Corta el ARNm (silenciamiento)"]]},{"tipo":"dato","valor":"~20–21 nt","texto":"Longitud del **siARN**, que presenta **2 nucleótidos desemparejados** en cada extremo 3'."},{"tipo":"alerta","texto":"Trampa frecuente: **Dicer** actúa en **ambos** (miARN y siARN), y ambos usan la **hebra antisentido** dentro de RISC. Lo que distingue al **miARN** es su **procesamiento previo por Drosha en el núcleo** y su **complementariedad imperfecta**. El siARN es perfectamente complementario y corta el ARNm."},{"tipo":"figura","pagina":7,"pie":"Estructura del ARNt en hoja de trébol. Localiza el extremo 3' (sitio de unión del aminoácido), los bucles D y T, el anticodón CUC y su codón complementario GAG en el ARNm.","src":"img/biologia-celular-y-tisular-t9-tema-9-transcripcion-p7.jpg"}]},{"id":"caracteristicas","titulo":"3. La transcripción: definición y características","bloques":[{"tipo":"definicion","termino":"Transcripción","texto":"Formación del **transcrito de ARN** mediante la unión de nucleótidos libres a la **cadena molde de ADN**. Da lugar a una **monohebra de ARN** que sigue las reglas de la **complementariedad de bases**."},{"tipo":"parrafo","texto":"El ARN se diferencia químicamente del ADN en dos aspectos: usa **ribosa** (con OH en el carbono 2') en lugar de desoxirribosa, y **uracilo** en lugar de timina (la timina lleva un grupo metilo que le falta al uracilo). Por eso, frente a una A de la hebra molde, la ARN polimerasa coloca una **U**."},{"tipo":"lista","items":["Siempre se produce en dirección **5'→3'**: los nucleótidos se añaden al extremo 3' del ARN.","**No requiere cebador**.","Afecta a **segmentos cortos** (regiones codificadoras) que no se transcriben necesariamente de forma simultánea.","Ocurre **múltiples veces** a lo largo de la vida de la célula, a diferencia de la replicación.","Tiene lugar en el **núcleo en eucariotas** y en el **citoplasma en procariotas**."]},{"tipo":"tarjetas","items":[{"etiqueta":"(-)","titulo":"Hebra molde","texto":"Es la única hebra que se lee. El ARN es **complementario** a ella. Se lee en sentido 3'→5' para que el ARN crezca 5'→3'."},{"etiqueta":"(+)","titulo":"Hebra codificadora / codificante","texto":"También se llama no molde. Tiene la **misma secuencia que el ARN**, cambiando **T por U**."}]},{"tipo":"dato","valor":"5'-ATGATC-3' → 5'-AUGAUC-3'","texto":"Si la **hebra codificante** es 5'-ATGATC-3', el ARN es 5'-AUGAUC-3'. La hebra molde correspondiente es 3'-TACTAG-5'."},{"tipo":"alerta","texto":"Si el enunciado da la **hebra molde**, el ARN es su complementaria **antiparalela**, cambiando A por U. Si da la **codificante**, basta con copiarla y cambiar T por U. Fíjate siempre en la orientación 5'/3' de las opciones: un ARN escrito 3'→5' puede ser correcto o una trampa."}]},{"id":"componentes","titulo":"3. Componentes de la transcripción","bloques":[{"tipo":"lista","items":["Una **cadena de ADN molde**, organizada en una unidad de transcripción con **promotor** y **terminador**.","**Ribonucleótidos trifosfato** de A, G, C y U (NTP).","Enzima: **ARN polimerasa**.","**Factores de transcripción**, que ayudan a unir la ARN polimerasa al ADN."]},{"tipo":"definicion","termino":"Promotor","texto":"Secuencia específica, de localización concreta, donde se une la ARN polimerasa. Define el **punto exacto de inicio** y la **dirección** de la transcripción, es decir, **qué cadena se usa como molde**."},{"tipo":"definicion","termino":"Terminador","texto":"Secuencia que indica dónde **termina** la transcripción. Los promotores y terminadores dictan a la ARN polimerasa dónde empezar y dónde acabar."},{"tipo":"dato","valor":"-35 TTGACA / -10 TATAAT","texto":"Promotor procariota estándar. La secuencia **-10 (TATAAT)** es la **caja de Pribnow**. El sitio de inicio es la posición **+1**."},{"tipo":"tabla","titulo":"ARN polimerasa procariota frente a eucariota","columnas":["Rasgo","Procariota","Eucariota"],"filas":[["Tipos","Un solo tipo, que sintetiza todos los ARN","3 tipos: ARN pol I, II y III"],["Subunidades","6 subunidades","Más de 10 subunidades"],["Reconocimiento del promotor","La subunidad **sigma (σ)** actúa como factor de transcripción","Numerosos factores de transcripción"],["Cebador","No requiere","No requiere"],["Corrección de errores","No (sin actividad exonucleasa)","No (sin actividad exonucleasa)"]]},{"tipo":"alerta","texto":"No confundas la ARN polimerasa con la ADN polimerasa de la replicación. La ARN polimerasa **no necesita primer** y **no corrige errores** porque no tiene actividad exonucleasa. Ambas sintetizan en dirección 5'→3'."}]},{"id":"etapas","titulo":"3. Etapas de la transcripción","bloques":[{"tipo":"parrafo","texto":"Las etapas son: **1) Inicio, 2) Elongación, 3) Terminación** y **4) Maduración**, esta última **solo en eucariotas**. La ARN polimerasa se une al promotor y desenrolla localmente el ADN. Después cataliza la unión de NTP complementarios a la hebra molde. A medida que avanza, el ARN se despega del molde y la doble hélice se vuelve a formar. Al reconocer el terminador, se liberan la polimerasa y el ARN."},{"tipo":"tarjetas","items":[{"etiqueta":"Inicio","titulo":"Procariotas","texto":"El **factor σ** reconoce las cajas -35 y -10. La holoenzima desenrolla el ADN y cataliza la unión del primer nucleótido. Cuando se han sintetizado unos **10 nt**, **σ se disocia** y el núcleo enzimático continúa la síntesis."},{"etiqueta":"Inicio","titulo":"Eucariotas","texto":"Los **factores de transcripción** reconocen la **caja TATA**, situada a unos **-20 pb** del inicio según el temario. A ella se une un complejo proteico y después la **ARN pol II** y otros factores, formando el **complejo de inicio de la transcripción**."},{"etiqueta":"Elongación","titulo":"Burbuja de transcripción","texto":"Los nucleótidos se seleccionan por apareamiento con la hebra molde. Se forma una **hélice híbrida ADN/ARN de ~8 pb**. La región que contiene la ARN pol y el híbrido es la **burbuja de transcripción**."},{"etiqueta":"Elongación","titulo":"Superenrollamiento","texto":"El ADN se desenrolla por delante de la burbuja y se vuelve a enrollar por detrás. Esto genera puntos de superenrollamiento que resuelven las **topoisomerasas**."}]},{"tipo":"dato","valor":"~10 nt","texto":"Longitud de ARN sintetizada antes de que el **factor sigma se disocie** de la ARN polimerasa procariota."},{"tipo":"dato","valor":"~8 pb","texto":"Longitud de la **hélice dúplex híbrida ADN/ARN** dentro de la burbuja de transcripción."},{"tipo":"figura","pagina":16,"pie":"Inicio en procariotas. Fíjate en las secuencias -35 (TTGACA) y -10 (TATATT, caja de Pribnow) resaltadas, en el sitio +1 y en la secuencia lateral: unión débil de la enzima central, unión de la holoenzima con σ y pérdida de σ cuando el ARN se alarga.","src":"img/biologia-celular-y-tisular-t9-tema-9-transcripcion-p16.jpg"},{"tipo":"figura","pagina":18,"pie":"Burbuja de transcripción. Observa la hebra molde frente a la codificadora, la doble hélice híbrida ARN-ADN, el desenrollamiento por delante y el enrollamiento por detrás, y el ARN naciente con su extremo 5' ppp.","src":"img/biologia-celular-y-tisular-t9-tema-9-transcripcion-p18.jpg"},{"tipo":"alerta","texto":"**Caja de Pribnow (-10, TATAAT)** = procariotas. **Caja TATA (~-20 pb según el PDF)** = eucariotas. El temario menciona que el «codón de inicio suele ser ATG». Ojo: ATG es el codón de inicio de la **traducción** (AUG en el ARNm), no el sitio de inicio de la transcripción. Clásicamente la caja TATA se sitúa hacia -25/-30 (complemento), pero para el examen usa el dato del temario."},{"tipo":"esquema","titulo":"Terminación de la transcripción según célula y polimerasa","mermaid":"flowchart TD\n  A[\"Llegada a la señal de terminación\"] --> P[\"Procariotas\"]\n  A --> E[\"Eucariotas\"]\n  P --> P1[\"Independiente de rho: repetición invertida forma horquilla en el ARN\"]\n  P --> P2[\"Dependiente de rho: la proteína rho se une al ARN y libera la ARN pol\"]\n  E --> E1[\"ARN pol I: secuencia específica y proteínas auxiliares\"]\n  E --> E2[\"ARN pol II: señal AAUAAA, corte y poliadenilación\"]\n  E --> E3[\"ARN pol III: serie de timinas TTTTT\"]\n  E2 --> D[\"Híbrido inestable, se cierra el ADN y se suelta la polimerasa\"]","pie":"Algoritmo para identificar el mecanismo de terminación: primero el tipo de célula y, en eucariotas, el tipo de ARN polimerasa."},{"tipo":"parrafo","texto":"En **procariotas**, la terminación **rho-independiente** se produce porque el ADN molde contiene una **secuencia repetida en orientación inversa** (palindrómica). Al transcribirse, forma una **horquilla** en el ARN que promueve su liberación de la burbuja. En la **rho-dependiente**, la **proteína rho** se une al transcrito y provoca la liberación de la ARN polimerasa. En **eucariotas** (ARN pol II), la síntesis continúa hasta transcribir **AAUAAA**, que actúa como señal de corte. La polimerasa se para, el híbrido se desestabiliza, se separa del ADN, el ADN se vuelve a enrollar y la polimerasa se desprende."},{"tipo":"dato","valor":"AAUAAA","texto":"Señal de corte y terminación del ARNm transcrito por la **ARN polimerasa II**. Es también la señal de poliadenilación."},{"tipo":"dato","valor":"TTTTT","texto":"Serie de timinas en el ADN que reconoce la **ARN polimerasa III** para detenerse."}]},{"id":"eucariotas-procariotas","titulo":"4. Eucariotas frente a procariotas","bloques":[{"tipo":"tabla","titulo":"Diferencias en la transcripción","columnas":["Aspecto","Procariotas","Eucariotas"],"filas":[["Complejidad","Proceso simple","Proceso complejo"],["ADN transcribible","Se puede transcribir todo el ADN","Solo se transcribe la **eucromatina**"],["ARN polimerasas","Un solo tipo para todos los ARN","3 tipos (I, II y III)"],["Relación con la traducción","El ARNm se traduce **mientras se transcribe**","El ARNm debe **transportarse al citoplasma**"],["Transcrito primario","Funcional; no precisa maduración","Sufre **maduración postranscripcional en el núcleo**"],["Tipo de ARNm","Policistrónico","Mayoritariamente monocistrónico"],["Señal de terminación","Secuencia palindrómica (rho-independiente) o proteína rho","Suele ser AAUAAA"],["Localización","Citoplasma","Núcleo"]]},{"tipo":"perla","texto":"El acoplamiento transcripción-traducción es posible en bacterias porque no tienen envoltura nuclear y su ARN no necesita madurar. En la célula humana, en cambio, la envoltura nuclear separa ambos procesos. Esto permite controlar la calidad del ARNm (capping, cola poli-A, splicing) antes de que llegue a los ribosomas, y es un punto clave de regulación de la expresión génica en tejidos como el músculo o el tendón."},{"tipo":"alerta","texto":"«Solo se transcribe la eucromatina» es un rasgo **eucariota**: la heterocromatina, más condensada, no es accesible a la maquinaria transcripcional. En procariotas no existe esta distinción."},{"tipo":"figura","pagina":29,"pie":"Comparación global. En procariotas, transcripción y traducción ocurren en el mismo compartimento. En eucariotas, el ARN con intrones se procesa en el núcleo (cap y cola poli-A) y sale por el poro nuclear para traducirse en el citoplasma.","src":"img/biologia-celular-y-tisular-t9-tema-9-transcripcion-p29.jpg"}]},{"id":"maduracion","titulo":"5. Maduración del ARN en eucariotas","bloques":[{"tipo":"definicion","termino":"Maduración (procesamiento del ARN)","texto":"Conjunto de reacciones necesarias para transformar el **transcrito primario** (pre-ARNm) en **ARN maduro**. Comprende tres procesos: **capping**, **poliadenilación** y **splicing**."},{"tipo":"esquema","titulo":"Del pre-ARNm al ARNm maduro","mermaid":"flowchart LR\n  A[\"Transcrito primario con intrones\"] --> B[\"Capping 5': guanina modificada a los ~20 nt\"]\n  B --> C[\"Poliadenilación 3': 40-250 adeninas\"]\n  C --> D[\"Splicing: se eliminan intrones y se unen exones\"]\n  D --> E[\"ARNm maduro\"]\n  E -->|\"Poro nuclear\"| F[\"Traducción en el citoplasma\"]\n  D -->|\"Splicing alternativo\"| G[\"Varias proteínas de un mismo gen\"]","pie":"Secuencia didáctica de la maduración. El capping es cotranscripcional: ocurre mientras el ARN aún se está sintetizando."},{"tipo":"tabla","titulo":"Los tres procesos de maduración","columnas":["Proceso","Qué se hace","Cuándo / dónde","Función"],"filas":[["Capping","Se añade una caperuza de **guanina modificada** (metilada) en el extremo 5'","Durante la transcripción, cuando se han transcrito unos **20 nt**","Protege el **extremo 5'** frente a las **exonucleasas 5'**"],["Poliadenilación","Se añade una **cola de 40–250 adeninas** en el extremo 3'","Tras la señal AAUAAA; intervienen **dos enzimas** (una de reconocimiento y otra de adición)","Impide que las **exonucleasas 3'** degraden la región codificante"],["Splicing","Corte y eliminación de los **intrones** y empalme de los **exones**","En el núcleo, antes de la traducción","Genera la secuencia codificante continua; permite el splicing alternativo"]]},{"tipo":"dato","valor":"~20 nt","texto":"Longitud del ARN naciente cuando se añade la **caperuza 5'**. Indica que el capping es **cotranscripcional**."},{"tipo":"dato","valor":"40–250 A","texto":"Longitud de la **cola poli-A** en el extremo 3' según el texto del temario. La figura muestra 150–250."},{"tipo":"figura","pagina":24,"pie":"Capping y poliadenilación. Identifica la G metilada (CH3) unida por tres fosfatos en 5', la secuencia codificante, las regiones no codificantes y la cola AAAAA en 3'.","src":""},{"tipo":"alerta","texto":"Cruce de extremos típico de examen: **caperuza = 5' = exonucleasas 5'**; **cola poli-A = 3' = exonucleasas 3'**. Además, el capping **no** ocurre al final, sino mientras se transcribe (~20 nt)."},{"tipo":"definicion","termino":"Splicing alternativo","texto":"Fenómeno por el que, a partir de un mismo pre-ARNm, la combinación distinta de exones produce **diferentes versiones de un gen** y, por tanto, **diferentes proteínas**. Es la ventaja biológica de tener intrones y exones."},{"tipo":"figura","pagina":26,"pie":"Splicing alternativo. A la izquierda, un gen de 5 exones origina las proteínas A, B y C. A la derecha, el gen de la α-tropomiosina produce ARNm distintos en músculo estriado, músculo liso, fibroblasto y cerebro.","src":""},{"tipo":"perla","texto":"El ejemplo de la **α-tropomiosina** es directamente fisioterapéutico. El mismo gen produce, mediante splicing alternativo, isoformas distintas en el **músculo estriado**, el **músculo liso**, los **fibroblastos** y el **cerebro**. Así, una proteína reguladora de la contracción se adapta a la función de cada tejido sin necesidad de genes diferentes."},{"tipo":"alerta","texto":"Aunque el temario incluye la maduración como «4.ª etapa» de la transcripción, es **exclusiva de eucariotas**. En procariotas el transcrito primario ya es funcional."}]},{"id":"transcripcion-inversa","titulo":"6. Transcripción inversa","bloques":[{"tipo":"definicion","termino":"Transcripción inversa","texto":"Síntesis de **ADN a partir de ARN**. La realiza la enzima **transcriptasa inversa** en algunos virus, los **retrovirus** (por ejemplo, el VIH). Utiliza el **ARN vírico como molde** y un **ARNt vírico como cebador**."},{"tipo":"lista","items":["1. El VIH libre se une a los **receptores CD4** de los linfocitos T.","2. La transcriptasa inversa convierte el ARN del VIH en ADN.","3. El ADN vírico de doble cadena entra en el núcleo y **se inserta en el genoma** celular.","4. El virus utiliza la maquinaria enzimática de la célula para sintetizar sus propias proteínas.","5. Se acumula ARN viral, se ensamblan nuevas envolturas víricas y se produce la **muerte celular**."]},{"tipo":"alerta","texto":"La diapositiva de ideas clave llama a las transcriptasas inversas «ARN polimerasas dependientes de ADN». La denominación correcta es **ADN polimerasa dependiente de ARN** (complemento): **sintetiza ADN** usando **ARN** como molde. La ARN polimerasa dependiente de ADN es la enzima de la transcripción normal. Además, a diferencia de la ARN polimerasa celular, la transcriptasa inversa **sí usa cebador** (ARNt vírico)."},{"tipo":"perla","texto":"Los pacientes con VIH en tratamiento antirretroviral son cada vez más frecuentes en las consultas de fisioterapia. Algunos fármacos actúan inhibiendo la transcriptasa inversa (complemento). Su lógica es molecular: bloquean una enzima que la célula humana no necesita para transcribir sus propios genes."}]}],"caso_clinico":{"titulo":"Paciente con VIH en programa de entrenamiento de fuerza","presentacion":"Hombre de 38 años, diagnosticado de infección por VIH hace 6 años, con carga viral indetectable gracias al tratamiento antirretroviral, que incluye un inhibidor de la transcriptasa inversa (complemento). Acude a la Unidad de Fisioterapia de la Universidad Europea de Valencia tras una tendinopatía rotuliana. Se le pauta un programa de ejercicio de fuerza progresivo. Durante la sesión pregunta: «¿Cómo hace el virus para meterse en mis genes? ¿La medicación no estropea también mis propias células? ¿Por qué el ejercicio cambia mi músculo de forma distinta a mi tendón si tengo los mismos genes en todas las células?».","preguntas":[{"pregunta":"¿Cómo pasa la información genética del VIH a formar parte del genoma de sus linfocitos T?","respuesta":"El VIH es un **retrovirus** que se une a los **receptores CD4** del linfocito T. Su **transcriptasa inversa** sintetiza **ADN a partir del ARN vírico**, usándolo como molde y con un **ARNt vírico como cebador**. El ADN de doble cadena resultante entra en el núcleo y se **inserta en el genoma** celular. A partir de ahí, la maquinaria de transcripción y traducción de la célula fabrica proteínas virales."},{"pregunta":"¿Por qué inhibir la transcriptasa inversa no bloquea la transcripción de los genes propios del paciente?","respuesta":"La célula humana transcribe sus genes con **ARN polimerasas (I, II y III)**, que son **dependientes de ADN**: usan ADN como molde, sintetizan ARN 5'→3' y **no requieren cebador**. La transcriptasa inversa es una enzima distinta, con una función inversa (**ARN → ADN**) y que **sí usa cebador**. Por eso un fármaco dirigido contra ella actúa sobre el ciclo vírico sin impedir la expresión génica normal de la célula."},{"pregunta":"Si todas sus células tienen el mismo ADN, ¿cómo pueden su músculo y los fibroblastos de su tendón producir versiones distintas de una misma proteína, como la α-tropomiosina?","respuesta":"Gracias al **splicing alternativo**. El gen de la α-tropomiosina se transcribe a un pre-ARNm con exones e intrones. Durante la **maduración nuclear** (capping, poliadenilación y splicing), cada tipo celular combina exones distintos. Así se obtienen ARNm diferentes en el **músculo estriado** y en los **fibroblastos**, que se traducen en isoformas adaptadas a cada tejido. Además, cada tipo celular transcribe solo su **eucromatina** accesible."}]},"preguntate":[{"pregunta":"Dada una hebra de ADN, ¿cómo deduces la secuencia del ARN transcrito según sea la hebra molde o la codificante?","respuesta":"Si es la **codificante**, el ARN tiene su misma secuencia con **T→U**. Si es la **molde**, el ARN es su **complementaria antiparalela** (A→U, T→A, G→C, C→G)."},{"pregunta":"Enumera tres diferencias funcionales entre la ARN polimerasa y una ADN polimerasa replicativa según el temario.","respuesta":"La ARN polimerasa **no requiere cebador**, **no corrige errores** (carece de actividad exonucleasa) y transcribe **segmentos cortos múltiples veces** a lo largo de la vida celular. Ambas sintetizan 5'→3'."},{"pregunta":"¿Qué papel tiene el factor sigma y cuándo abandona la polimerasa?","respuesta":"Es la subunidad de la ARN pol procariota que actúa como **factor de transcripción**: reconoce las cajas **-35 (TTGACA) y -10 (TATAAT)**. Se **disocia** cuando se han sintetizado unos **10 nucleótidos**."},{"pregunta":"Describe cómo se forma el complejo de inicio en eucariotas.","respuesta":"Unos factores de transcripción reconocen la **caja TATA** (~-20 pb según el temario). Sobre ellos se une un complejo proteico y después la **ARN polimerasa II** y otros factores, formando el **complejo de inicio de la transcripción**."},{"pregunta":"¿Qué es la burbuja de transcripción y qué problema topológico genera su avance?","respuesta":"Es la región que contiene la ARN pol y el **híbrido ADN/ARN de ~8 pb**. Al avanzar, el ADN se desenrolla por delante y se enrolla por detrás, lo que crea **superenrollamiento**, que resuelven las **topoisomerasas**."},{"pregunta":"Compara los dos mecanismos de terminación procariota.","respuesta":"**Rho-independiente**: una repetición invertida del molde forma una **horquilla** en el ARN que lo libera. **Rho-dependiente**: la **proteína rho** se une al transcrito y provoca la liberación de la ARN polimerasa."},{"pregunta":"¿Qué señal de terminación reconoce cada ARN polimerasa eucariota?","respuesta":"La **pol II** reconoce **AAUAAA** (señal de corte). La **pol III**, una serie de **timinas (TTTTT)**. La **pol I**, una secuencia específica de terminación con proteínas auxiliares."},{"pregunta":"Explica qué protege la caperuza y qué protege la cola poli-A, y en qué momento se añade la caperuza.","respuesta":"La caperuza (guanina modificada) protege el **extremo 5'** frente a las exonucleasas 5' y se añade **durante la transcripción**, a los ~20 nt. La cola poli-A (40–250 A) protege el **extremo 3'** frente a las exonucleasas 3'."},{"pregunta":"¿En qué se diferencian miARN y siARN en origen, complementariedad y efecto?","respuesta":"El **miARN** procede de precursores genómicos en horquilla con **complementariedad imperfecta**, procesados por **Drosha (núcleo) y Dicer (citoplasma)**; inhibe la traducción o degrada el ARNm. El **siARN** procede de dsARN cortado por Dicer, es **perfectamente complementario** (~20–21 nt) y **corta el ARNm** vía RISC."},{"pregunta":"¿Por qué en procariotas la traducción puede empezar antes de terminar la transcripción?","respuesta":"Porque la transcripción ocurre en el **citoplasma** (no hay núcleo) y el **transcrito primario es funcional**, sin necesidad de maduración. En eucariotas, el ARNm debe madurar en el núcleo y transportarse al citoplasma."}],"glosario":[{"termino":"Hebra molde (-)","definicion":"Hebra de ADN que lee la ARN polimerasa; el ARN es complementario a ella."},{"termino":"Hebra codificante (+)","definicion":"Hebra de ADN con la misma secuencia que el ARN transcrito, salvo T por U."},{"termino":"Promotor","definicion":"Secuencia de unión de la ARN polimerasa que fija el punto de inicio, la dirección y la hebra molde."},{"termino":"Caja de Pribnow","definicion":"Secuencia -10 (TATAAT) del promotor procariota."},{"termino":"Caja TATA","definicion":"Secuencia promotora eucariota (~-20 pb según el temario) reconocida por factores de transcripción."},{"termino":"Factor sigma (σ)","definicion":"Subunidad de la ARN polimerasa procariota que reconoce el promotor y se disocia tras unos 10 nt."},{"termino":"Factores de transcripción","definicion":"Proteínas que reconocen el promotor y reclutan la ARN polimerasa."},{"termino":"Burbuja de transcripción","definicion":"Región con la ARN polimerasa y el híbrido ADN/ARN de ~8 pb."},{"termino":"Topoisomerasas","definicion":"Enzimas que resuelven el superenrollamiento generado al avanzar la burbuja."},{"termino":"Proteína rho","definicion":"Proteína procariota que se une al transcrito y libera la ARN polimerasa (terminación rho-dependiente)."},{"termino":"Capping","definicion":"Adición de una guanina modificada en el extremo 5' del pre-ARNm, a los ~20 nt."},{"termino":"Poliadenilación","definicion":"Adición de 40–250 adeninas en el extremo 3' del pre-ARNm."},{"termino":"Splicing","definicion":"Eliminación de intrones y empalme de exones del transcrito primario."},{"termino":"RISC","definicion":"Complejo silenciador inducido por ARN que usa la hebra antisentido de siARN/miARN como guía."},{"termino":"Transcriptasa inversa","definicion":"Enzima retroviral que sintetiza ADN a partir de un molde de ARN, con un ARNt vírico como cebador."}],"fuentes":["Solana Manrique, C. Tema 9. Transcripción. Biología Celular y Tisular, Grado en Fisioterapia, Universidad Europea, curso 2025-2026.","Nelson, D. L. y Cox, M. M. Lehninger. Principios de Bioquímica, 7.ª ed. (figura de ARNm mono/policistrónico).","Alberts, B. et al. Essential Cell Biology, 3.ª ed. Garland Science, 2010 (figura 7-21, splicing alternativo de la α-tropomiosina).","Pearson Education / Benjamin Cummings, 2005 y 2012 (figuras de inicio eucariota y visión general de la transcripción).","University of Miami School of Nursing & Health Studies (figura del ciclo del VIH)."],"qcm":[{"pregunta":"La hebra codificante de un fragmento génico es 5'-ATGATC-3'. ¿Cuál es la secuencia del ARN transcrito a partir de ese fragmento?","opciones":["5'-ATGATC-3'","5'-UAGUAC-3'","5'-AUGAUC-3'","3'-UACUAG-5'"],"correcta":2,"explicacion":"El ARN es complementario a la hebra molde y, por tanto, idéntico a la hebra codificante, cambiando T por U. La copia de 5'-ATGATC-3' es 5'-AUGAUC-3'.","por_opcion":["❌ Conserva la timina, que no forma parte del ARN: el ARN usa uracilo.","❌ Es la hebra molde (3'-TACTAG-5') escrita al revés y con U: no respeta la complementariedad antiparalela.","✅ Misma secuencia y misma orientación que la hebra codificante, con U en lugar de T.","❌ Es la complementaria de la hebra codificante en ribonucleótidos. Correspondería a copiar la hebra codificante como si fuera el molde."]},{"pregunta":"Respecto a la abundancia relativa de los distintos ARN en una célula, ¿qué afirmación es correcta según el temario?","opciones":["El ARNr supone el 15% y el ARNt, de menor tamaño, el 80%","El ARNm supone el 15% y es el más homogéneo de los tres","El ARNt supone el 80% por existir uno por cada aminoácido","El ARNr supone el 80% y el ARNm, aun siendo el mayor, el 5%"],"correcta":3,"explicacion":"El ARNr constituye el 80% del ARN celular, el ARNt el 15% y el ARNm el 5%. El ARNm es, además, el más grande y el más heterogéneo.","por_opcion":["❌ Invierte los porcentajes de ARNr (80%) y ARNt (15%).","❌ El 15% corresponde al ARNt, y el ARNm es el más heterogéneo, no el más homogéneo.","❌ El ARNt supone el 15%. Que exista un ARNt por aminoácido no lo convierte en el más abundante.","✅ ARNr 80% y ARNm 5%. El ARNm es el más grande pero el menos abundante."]},{"pregunta":"En el inicio de la transcripción procariota, ¿en qué momento abandona el factor sigma el complejo de la ARN polimerasa?","opciones":["Cuando la polimerasa ha sintetizado unos 10 nucleótidos de ARN","Inmediatamente después de reconocer la secuencia -35 del promotor","Tras unirse al transcrito, para provocar la liberación del ARN","Al alcanzar la polimerasa la secuencia terminadora palindrómica"],"correcta":0,"explicacion":"El factor σ reconoce las cajas -35 y -10 y permite que la holoenzima desenrolle el ADN e incorpore el primer nucleótido. Una vez sintetizados unos 10 nucleótidos, σ se disocia y el núcleo enzimático continúa la elongación.","por_opcion":["✅ Es el dato del temario: σ se disocia tras unos 10 nt sintetizados.","❌ Sigma sigue unido tras reconocer -35 y -10: es necesario para abrir la doble hélice e iniciar la síntesis.","❌ Describe la acción de la proteína rho en la terminación rho-dependiente, no la del factor sigma.","❌ Sigma ya se ha separado mucho antes; la terminación palindrómica no tiene relación con él."]},{"pregunta":"¿Qué rasgo es propio de los miARN y NO se da en los siARN, según el temario?","opciones":["Su generación requiere el corte de un precursor por la enzima Dicer","Su hebra antisentido se incorpora a un complejo de tipo RISC","Su efecto final reduce la síntesis de la proteína codificada por el ARNm","Su precursor se procesa primero por la enzima Drosha en el núcleo"],"correcta":3,"explicacion":"Los miARN proceden de precursores genómicos en horquilla que se procesan en dos etapas: Drosha en el núcleo y Dicer en el citoplasma. Los siARN se originan cuando Dicer corta un ARN bicatenario largo. Ambos usan la hebra antisentido en RISC y ambos silencian la expresión génica.","por_opcion":["❌ Dicer interviene tanto en miARN como en siARN.","❌ Es común a ambos: miARN y siARN incorporan su hebra antisentido a RISC o a un complejo similar.","❌ Ambos reducen la producción de la proteína, por inhibición de la traducción o por corte del ARNm.","✅ El procesamiento nuclear por Drosha es exclusivo de la vía de los miARN."]},{"pregunta":"¿Cuál de los siguientes ARN ribosómicos se encuentra exclusivamente en los ribosomas eucariotas?","opciones":["ARNr 5.8S","ARNr 16S","ARNr 5S","ARNr 23S"],"correcta":0,"explicacion":"Los procariotas tienen ARNr 23S, 16S y 5S; los eucariotas, 28S, 18S, 5.8S y 5S. El 5.8S, que en eucariotas acompaña al 28S en la subunidad 60S, es el único de la lista exclusivo de eucariotas.","por_opcion":["✅ El 5.8S solo aparece en eucariotas, asociado al 28S en la subunidad 60S.","❌ El 16S es el ARNr de la subunidad pequeña procariota (30S).","❌ El 5S está presente en ambos tipos de ribosoma, en la subunidad grande.","❌ El 23S es exclusivo de procariotas (subunidad 50S)."]},{"pregunta":"Una ARN polimerasa eucariota detiene la síntesis al reconocer en el ADN una serie de timinas (TTTTT). ¿De qué polimerasa se trata?","opciones":["ARN polimerasa II","ARN polimerasa procariota","ARN polimerasa III","ARN polimerasa I"],"correcta":2,"explicacion":"Según el temario, la ARN polimerasa III reconoce secuencias simples, como una serie de timinas, para detenerse. La pol II termina tras transcribir AAUAAA y la pol I usa una secuencia específica con proteínas auxiliares.","por_opcion":["❌ La ARN pol II termina tras transcribir la señal AAUAAA, que provoca el corte del transcrito.","❌ El enunciado se refiere a una polimerasa eucariota; la procariota termina por horquilla o por rho.","✅ La serie TTTTT es la señal de parada de la ARN pol III.","❌ La ARN pol I termina mediante una secuencia específica de terminación y proteínas auxiliares."]},{"pregunta":"La transcripción tiene una tasa de errores mayor que la replicación. ¿Qué propiedad de la ARN polimerasa explica este hecho según el temario?","opciones":["Que sintetiza la nueva cadena siempre en sentido 5'→3'","Que carece de actividad exonucleasa y no corrige errores","Que transcribe un mismo gen muchas veces en la vida celular","Que inicia la síntesis sin necesidad de un cebador previo"],"correcta":1,"explicacion":"La ARN polimerasa no tiene actividad exonucleasa, por lo que no funciona la corrección de errores. Las demás opciones son características reales de la transcripción, pero no explican su menor fidelidad.","por_opcion":["❌ La dirección 5'→3' es común a las polimerasas de ADN y de ARN; no explica la diferencia.","✅ Sin actividad exonucleasa no hay corrección de pruebas, de ahí su mayor tasa de errores.","❌ Es una característica real, pero se refiere a la frecuencia de transcripción, no a la exactitud.","❌ Es cierto que no requiere cebador, pero eso no condiciona la fidelidad de la copia."]},{"pregunta":"Respecto al capping del pre-ARNm eucariota, ¿qué afirmación es correcta?","opciones":["Se añade en el citoplasma antes de que el ARNm se una a la subunidad pequeña","Consiste en añadir adeninas tras la señal AAUAAA para proteger el extremo 5'","Se añade al terminar la transcripción y protege frente a las exonucleasas 3'","Se añade cuando hay unos 20 nt transcritos y protege frente a exonucleasas 5'"],"correcta":3,"explicacion":"La caperuza es una guanina modificada que se añade de forma cotranscripcional, cuando se han transcrito unos 20 nucleótidos. Protege el extremo 5' de la degradación por las exonucleasas 5'.","por_opcion":["❌ La maduración ocurre en el núcleo, antes del transporte al citoplasma.","❌ Mezcla conceptos: las adeninas tras AAUAAA forman la cola poli-A, que está en el extremo 3'.","❌ El capping es cotranscripcional, no posterior. Además, la protección frente a exonucleasas 3' corresponde a la cola poli-A.","✅ Coincide con el momento (~20 nt) y con la función (proteger el extremo 5') descritos en el temario."]},{"pregunta":"Al avanzar la burbuja de transcripción, el ADN se desenrolla por delante de la ARN polimerasa y se vuelve a enrollar por detrás. ¿Qué consecuencia tiene y cómo se resuelve?","opciones":["Se acumulan horquillas en el molde, que eliminan las helicasas","Se generan puntos de superenrollamiento, que resuelven topoisomerasas","Se forma una horquilla en el ARN, que libera la proteína rho","Se acorta el híbrido ADN/ARN, que estabiliza el factor sigma"],"correcta":1,"explicacion":"El desenrollamiento por delante y el reenrollamiento por detrás crean tensión torsional, es decir, puntos de superenrollamiento. Según el temario, las topoisomerasas son las enzimas que los resuelven.","por_opcion":["❌ El problema topológico no son horquillas en el molde, y el temario no atribuye su resolución a helicasas.","✅ El superenrollamiento lo alivian las topoisomerasas.","❌ La horquilla en el ARN es el mecanismo de terminación rho-independiente, no un efecto del avance de la burbuja.","❌ El híbrido se mantiene en ~8 pb, y el factor sigma ya se ha disociado durante la elongación."]},{"pregunta":"En un promotor procariota estándar, ¿qué secuencia constituye la denominada caja de Pribnow?","opciones":["La secuencia AAUAAA situada al final del transcrito","La secuencia TATA situada a unos -20 pb del inicio","La secuencia TTGACA situada en la posición -35","La secuencia TATAAT situada en la posición -10"],"correcta":3,"explicacion":"El promotor procariota tiene dos secuencias consenso reconocidas por el factor sigma: -35 (TTGACA) y -10 (TATAAT). La secuencia -10 es la caja de Pribnow.","por_opcion":["❌ Es la señal de corte y terminación de la ARN polimerasa II eucariota.","❌ Es la caja TATA de los eucariotas, reconocida por factores de transcripción.","❌ TTGACA en -35 es el otro elemento del promotor procariota, pero no es la caja de Pribnow.","✅ La caja de Pribnow es la secuencia -10, TATAAT."]},{"pregunta":"Durante la transcripción inversa del VIH, ¿qué actúa como molde y qué actúa como cebador?","opciones":["Molde: ARN vírico; no se requiere cebador, igual que en la ARN pol","Molde: ARNm celular; cebador: un fragmento de ADN del linfocito","Molde: ARN vírico; cebador: un ARNt de origen vírico","Molde: ADN celular; cebador: ARN sintetizado por una primasa"],"correcta":2,"explicacion":"La transcriptasa inversa de los retrovirus sintetiza ADN usando el ARN vírico como molde y un ARNt vírico como cebador. Después, el ADN de doble cadena se integra en el genoma del linfocito T.","por_opcion":["❌ A diferencia de la ARN polimerasa, la transcriptasa inversa sí utiliza cebador.","❌ El molde es el ARN del propio virus, y el cebador es un ARNt vírico, no ADN celular.","✅ Molde de ARN vírico y cebador de ARNt vírico, tal como recoge el temario.","❌ El molde es ARN, no ADN. El cebador sintetizado por primasa corresponde a la replicación del ADN."]},{"pregunta":"¿Qué combinación de hechos permite que en una bacteria la traducción de un ARNm comience antes de que termine su transcripción?","opciones":["Se transcribe todo el ADN y el factor sigma se separa tras unos 10 nucleótidos","Una sola ARN polimerasa produce todos los ARN y el ARNm es policistrónico","La terminación depende de rho y el ARNm carece de caperuza en su extremo 5'","La transcripción ocurre en el citoplasma y el transcrito primario ya es funcional"],"correcta":3,"explicacion":"En procariotas no hay envoltura nuclear: la transcripción tiene lugar en el citoplasma, y el transcrito primario no necesita maduración postranscripcional. Por eso los ribosomas pueden traducir el ARNm a medida que se transcribe.","por_opcion":["❌ Son datos ciertos sobre procariotas, pero no tienen relación con el inicio simultáneo de la traducción.","❌ Son diferencias reales con los eucariotas, pero no explican por qué se puede traducir durante la transcripción.","❌ La terminación por rho no es siempre así (también existe la rho-independiente) y no explica el acoplamiento.","✅ La localización citoplasmática y la ausencia de maduración explican el acoplamiento entre transcripción y traducción."]},{"pregunta":"El gen de la α-tropomiosina genera ARNm distintos en el músculo estriado, el músculo liso, los fibroblastos y el cerebro. ¿Qué mecanismo explica principalmente esta diversidad según el temario?","opciones":["El splicing alternativo de un mismo pre-ARNm en cada tipo celular","La transcripción de genes diferentes por cada tipo de ARN polimerasa","El silenciamiento selectivo de exones por la acción de los siARN","La organización policistrónica del ARNm de la α-tropomiosina"],"correcta":0,"explicacion":"El splicing alternativo combina exones de forma distinta a partir del mismo transcrito primario. Así se obtienen diferentes versiones de un gen y diferentes proteínas en cada tejido, como muestra el ejemplo de la α-tropomiosina.","por_opcion":["✅ El mismo pre-ARNm se procesa de forma alternativa en cada tejido.","❌ Se trata de un único gen; las tres ARN polimerasas no originan isoformas de una misma proteína.","❌ Los siARN cortan ARNm completos para silenciarlos; no seleccionan exones.","❌ Los ARNm eucariotas son mayoritariamente monocistrónicos; las isoformas no se deben a un ARNm policistrónico."]},{"pregunta":"Un codón del ARNm es 5'-GAG-3'. ¿Cuál es el anticodón del ARNt que se aparea con él?","opciones":["3'-CTC-5'","3'-CUC-5'","3'-GAG-5'","5'-CUC-3'"],"correcta":1,"explicacion":"El anticodón es un triplete de bases A, C, G y U, complementario y antiparalelo al codón. Frente a 5'-GAG-3' se aparea 3'-CUC-5', tal como muestra la figura del temario.","por_opcion":["❌ Incluye timina, que no existe en el ARNt: el anticodón contiene U.","✅ Es complementario (G-C, A-U) y antiparalelo al codón.","❌ Repite la secuencia del codón en lugar de su complementaria.","❌ Las bases son complementarias, pero la orientación es paralela: el apareamiento exige antiparalelismo."]},{"pregunta":"Respecto a la poliadenilación del pre-ARNm eucariota, ¿qué afirmación es correcta según el temario?","opciones":["Añade 40–250 adeninas en 3' con una enzima de reconocimiento y otra de adición","Añade adeninas en 3' mientras se han transcrito los primeros 20 nucleótidos","Añade una guanina metilada en 3' para bloquear las exonucleasas 3'","Añade 40–250 adeninas en 5' y la cataliza una única enzima"],"correcta":0,"explicacion":"La poliadenilación añade una cola de 40–250 adeninas en el extremo 3' para evitar que las exonucleasas 3' degraden la región codificante. En ella participan dos enzimas: una de reconocimiento y otra de adición de la secuencia.","por_opcion":["✅ Coinciden el extremo, la longitud y las dos enzimas descritas en el temario.","❌ El momento de los ~20 nt corresponde al capping; la cola poli-A se añade al final del transcrito.","❌ La guanina modificada es la caperuza, y se sitúa en el extremo 5', no en el 3'.","❌ La cola se añade en el extremo 3' e intervienen dos enzimas, no una."]}],"asignatura":"Biología celular y tisular","tema":9,"fecha":"2026-11-05"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips">${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
