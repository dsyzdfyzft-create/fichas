<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 1: Introducción al drenaje linfático manual · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 1: Introducción al drenaje linfático manual","subtitulo":"Historia, escuelas, principios técnicos, efectos, indicaciones y contraindicaciones del DLM, y el mapa de líneas divisorias, cuadrantes y anastomosis linfáticas.","resumen":["El **drenaje linfático manual (DLM)** es una técnica de masaje cuyo objetivo es **favorecer la reabsorción del edema** y su paso del intersticio al sistema linfático y venoso **sin aumentar la filtración**.","Fue descubierto por **Emil y Estrid Vodder en 1932** y presentado en **París en 1936**; de él derivan las escuelas de **Leduc** (maniobras de llamada y reabsorción), **Földi** (Terapia Descongestiva Compleja), **Casley-Smith** (Terapia Linfática Compuesta) y **Godoy** (movimientos lineales).","A diferencia del masaje terapéutico, el DLM es **lento, suave, rítmico, indoloro, sin lubricantes y sin vasodilatación**, con sesiones de **30 a 90 minutos** y trabajo de **proximal a distal**.","Sus cuatro efectos son **drenante** (tixotropía, ↑ linfangiomotricidad, vasoconstricción de metaarteriolas), **neurovegetativo** (parasimpático: sedante y analgésico), **muscular** e **inmunitario indirecto**.","Las **líneas divisorias** (solo subcutáneas) delimitan **4 cuadrantes** que drenan a ganglios **axilares o inguinales**, comunicados por **anastomosis** (axilo-axilar, axilo-inguinal, interilíacas) que el DLM puede activar."],"objetivos":["Situar históricamente el DLM y diferenciar las principales escuelas (Vodder, Leduc, Földi, Casley-Smith, Godoy).","Distinguir el DLM del masaje terapéutico por mecanismo de acción y por aspectos prácticos.","Enumerar las 14 características generales de la técnica y los 4 grupos de efectos del DLM.","Clasificar indicaciones, contraindicaciones relativas y absolutas.","Localizar líneas divisorias, cuadrantes linfáticos y anastomosis para decidir la dirección del drenaje."],"ideas_clave":["DLM ≠ masaje terapéutico: el DLM **no produce vasodilatación ni aumenta la filtración** de los capilares sanguíneos.","Vodder descubrió el DLM **por casualidad en 1932** y lo presentó en **París en 1936** con la idea de “finos estímulos táctiles”.","Leduc añadió **maniobra de llamada** y **maniobra de reabsorción**; Földi describió los **estadios del linfedema** y la **TDC** (DLM + vendaje + ejercicios + cuidados de piel).","Sesión de **30–90 min**, sin cremas ni aceites, de **proximal a distal**; la activación del flujo **no es instantánea**.","Efecto drenante por **tixotropía** (gel → líquido) y aumento de la **linfangiomotricidad**; efecto sedante y analgésico vía **parasimpático**.","Contraindicaciones absolutas: **cáncer no tratado, alergias e infecciones agudas, TVP/flebitis, insuficiencia cardiaca, crisis asmática aguda, varices tortuosas**.","Las líneas divisorias **solo existen a nivel subcutáneo**; la línea transversal posterior pasa **por encima de L2–L3**.","Cuadrantes superiores → **ganglios axilares**; inferiores → **ganglios inguinales**; las anastomosis son vasos “en desuso” activables."],"secciones":[{"id":"historia","titulo":"Historia del sistema linfático y del DLM","bloques":[{"tipo":"parrafo","texto":"La linfa se describe desde la Antigüedad: **Hipócrates** (460–377 a.C.) hablaba de “**sangre blanca**” y **Aristóteles** (384–322 a.C.) de un “**líquido incoloro**”. Siguieron casi **2000 años sin progresos** hasta la anatomía moderna."},{"tipo":"tabla","titulo":"Hitos históricos","columnas":["Autor","Fecha","Aportación"],"filas":[["Hipócrates","460–377 a.C.","La linfa como “sangre blanca”"],["Aristóteles","384–322 a.C.","La linfa como “líquido incoloro”"],["Thomas Bartholin","1652","Describe la circulación linfática"],["Pecquet","1704–1762","Cisterna de Pecquet"],["F. Sappey","1883","Gran Atlas de la Circulación Linfática"],["Alexis Carrel","1912","Nobel de Medicina (regeneración celular), muestra la importancia de la linfa"],["Emil y Estrid Vodder","1932 / 1936","Descubren el DLM por casualidad; lo presentan en París"]]},{"tipo":"definicion","termino":"Linfología","texto":"Disciplina que estudia la estructura y función del sistema linfático, todavía hoy con un conocimiento **superficial** pese a los avances."},{"tipo":"parrafo","texto":"El sistema linfático está formado por **linfa, vasos linfáticos y órganos linfáticos**, y contribuye a mantener el **equilibrio en los tejidos** con un doble papel: **ayudante** (drenaje) y **seguridad** (defensa; los ganglios actúan como **filtro**)."}]},{"id":"dlm-vs-masaje","titulo":"DLM frente a masaje terapéutico","bloques":[{"tipo":"alerta","texto":"**Drenaje ≠ masaje terapéutico.** Es una pregunta clásica: el DLM no busca vasodilatación ni más aporte sanguíneo, porque más sangre = más filtración = **más agua en el intersticio**."},{"tipo":"tabla","titulo":"Mecanismo de acción y objetivo","columnas":["DLM","Masaje terapéutico"],"filas":[["Favorece la circulación linfática","Dirigido a músculos, tendones, ligamentos, tejido conjuntivo"],["Actúa secundariamente sobre la musculatura lisa (linfangión y válvulas linfáticas)","Regula elasticidad y tono de la musculatura estriada; aumenta la capacidad contráctil"],["Efecto relajante","Efecto estimulante"],["No aumenta la filtración de los capilares sanguíneos","Activa la filtración"],["Respuesta defensivo-inmunitaria","Respuesta antálgica refleja"]]},{"tipo":"tabla","titulo":"Aspectos prácticos","columnas":["DLM","Masaje terapéutico"],"filas":[["No debe producir vasodilatación","Produce vasodilatación"],["Presiones suaves","Presiones mayores y más profundas"],["No produce dolor","Puede producir cierto dolor"],["Ritmo lento","Ritmo más rápido"],["Manos y muñecas relajadas, dedos pasivos","Manos tensas, muñecas rígidas, dedos activos"],["Sin lubricantes","Aceites y cremas"]]},{"tipo":"figura","pagina":21,"pie":"Equilibrio de Starling (Wittlinger): la filtración arterial se compensa con la reabsorción venosa y el drenaje linfático. Si el sistema venoso o linfático falla, el tejido conjuntivo se congestiona y aparece el edema.","src":"img/drenaje-linfatico-t1-tema-1-introduccion-al-drenaje-linfatico-manual-p21.jpg"},{"tipo":"perla","texto":"Regla del equilibrio tisular: **tejido blando y esponjoso → relajación y drenaje (DLM)**; **tejido rígido y tenso → activación de la circulación sanguínea** (masaje)."}]},{"id":"escuelas","titulo":"Escuelas de DLM","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"Dinamarca/Francia","titulo":"Vodder","texto":"Pionero, presentado en **París 1936**. Creía que los ganglios inflamados producían migraña, sinusitis… Usa “**finos estímulos táctiles**” para liberar el estancamiento de la linfa."},{"etiqueta":"Bélgica","titulo":"Leduc","texto":"Perfecciona Vodder con **bases científicas rigurosas**. Incluye **maniobra de llamada** y **maniobra de reabsorción**. Sigue avalándose con evidencias médicas."},{"etiqueta":"Alemania","titulo":"Földi","texto":"**Terapia Descongestiva Compleja**: DLM + vendaje + ejercicios + cuidados de la piel. Describió los **estadios del linfedema**; en **1979** fundó la **Földiklinik**."},{"etiqueta":"Australia","titulo":"Casley-Smith","texto":"**Terapia Linfática Compuesta** sobre principios de Vodder. Estudio de la **microcirculación**, **benzopironas** para filariasis y edemas ricos en proteínas, secuencias de ejercicio."},{"etiqueta":"Brasil","titulo":"Godoy-Godoy","texto":"El más novedoso: DLM con **movimientos lineales**, aparatos de **gimnasia pasiva**, **terapia linfática cervical**, nuevas compresiones (tejido especial). Estudios de alto impacto."}]},{"tipo":"alerta","texto":"No confundir: **Terapia Descongestiva Compleja = Földi**; **Terapia Linfática Compuesta = Casley-Smith**. Las **maniobras de llamada y reabsorción = Leduc**."},{"tipo":"dato","valor":"1932 · 1936 · 1979","texto":"Descubrimiento del DLM (Vodder), presentación en París, fundación de la Földiklinik."}]},{"id":"definicion-caracteristicas","titulo":"Definición y características generales de la técnica","bloques":[{"tipo":"definicion","termino":"Drenaje linfático manual","texto":"Técnica de masaje cuyo objetivo es **mejorar la reabsorción del edema (drenar)**, favoreciendo su paso del **espacio intersticial al sistema linfático y venoso sin que aumente la filtración**."},{"tipo":"lista","items":["1. Todas las técnicas tienen un efecto de **captación y evacuación**.","2. Movimientos **lentos, suaves y rítmicos**.","3. Empujan la piel al máximo en la **dirección y sentido natural** de la circulación linfática (si no hay impedimentos).","4. Presiones **suaves, pero pueden variar**.","5. A toda fase de presión de empuje le sigue una **relajación**.","6. Cada movimiento estira la piel: solicita el **plano superficial respecto a los profundos**.","7. **No es doloroso**.","8. Empuje **tangencial** hasta el límite de elasticidad de la piel, **sin friccionar ni resbalar**.","9. Paciente **estirado y cómodo**.","10. **No se debe provocar vasodilatación**.","11. Sesión **no inferior a 30 min ni superior a 90 min**.","12. **Sin cremas ni aceites**.","13. La activación del flujo linfático **no es instantánea**.","14. Se trabaja de **PROXIMAL a DISTAL**."]},{"tipo":"dato","valor":"30–90 min","texto":"Duración mínima y máxima de una sesión de DLM."},{"tipo":"alerta","texto":"Trampa: “de proximal a distal” se refiere al **orden de trabajo de las zonas** (vaciar primero lo proximal para hacer sitio), mientras que el **empuje** de cada maniobra sigue el sentido natural del flujo, hacia los ganglios."},{"tipo":"esquema","titulo":"Lógica del trabajo de proximal a distal","mermaid":"flowchart LR\n  A[\"Zona proximal: ganglios\"] -->|\"se vacía primero\"| B[\"Segmento intermedio\"]\n  B -->|\"crea efecto de aspiración\"| C[\"Segmento distal\"]\n  C -->|\"empuje en sentido del flujo\"| A","pie":"Se libera primero la estación proximal para que la linfa distal tenga hacia dónde avanzar."}]},{"id":"efectos","titulo":"Efectos del DLM","bloques":[{"tipo":"esquema","titulo":"Los cuatro efectos del DLM","mermaid":"flowchart TD\n  D[\"DLM\"] --> E1[\"1 Drenante\"]\n  D --> E2[\"2 Neurovegetativo\"]\n  D --> E3[\"3 Muscular\"]\n  D --> E4[\"4 Inmunitario\"]\n  E1 --> T[\"Tixotropia y linfangiomotricidad\"]\n  E2 --> P[\"Parasimpatico: sedante y analgesico\"]\n  E3 --> M[\"Tono estriado y musculatura lisa\"]\n  E4 --> I[\"Indirecto: mejora el medio extracelular\"]","pie":"Pirámide de efectos tal como la presenta el tema."},{"tipo":"definicion","termino":"Tixotropía","texto":"Transformación del tejido conjuntivo del **estado gel al estado líquido**, que permite que las moléculas se transporten con mayor facilidad."},{"tipo":"lista","items":["**Efecto drenante**: tixotropía; normaliza composición y función del tejido conectivo; **aumenta la linfangiomotricidad**; **vasoconstricción de las metaarteriolas**; drena el líquido intersticial hacia la circulación linfática; favorece la entrada de la **precarga** linfática en los capilares; restablece la laxitud de las fibras elásticas; **deriva la linfa hacia áreas funcionantes**.","**Efecto neurovegetativo**: actúa sobre el **parasimpático** → sedación, relajación generalizada e inhibición de estímulos dolorosos (**analgésico y sedante**).","**Efecto muscular**: estiramiento longitudinal y transversal → aumento de la contracción de los vasos linfáticos → aceleración del flujo. En **estriada**: regula el tono (sobre todo **hipertonías**). En **lisa**: regula el peristaltismo, tonifica vasos sanguíneos y estimula los linfáticos.","**Efecto inmunitario**: **no se ha demostrado una acción directa**; mejora el estado de los líquidos extracelulares donde viven las células."]},{"tipo":"alerta","texto":"El DLM provoca **vasoconstricción** (de metaarteriolas), no vasodilatación. Y su efecto inmunitario es **indirecto**, no demostrado como acción directa."}]},{"id":"indicaciones","titulo":"Indicaciones y contraindicaciones","bloques":[{"tipo":"tabla","titulo":"Semáforo del DLM","columnas":["Verde: indicaciones","Amarillo: contraindicaciones relativas","Rojo: contraindicaciones absolutas"],"filas":[["Linfedemas","Estados precancerosos de piel, nevus","Cáncer no tratado"],["Fleboedemas","Hipotensión","Alergias agudas"],["Flebolinfedemas","Trastornos funcionales del tiroides","Infecciones agudas"],["Lipedemas","Asma bronquial y bronquitis asmática","TVP, flebitis, tromboflebitis"],["Edemas traumáticos","Infecciones crónicas","Insuficiencia cardiaca"],["Distrofia simpático-refleja (Sudeck)","Embarazo","Crisis asmática en fase aguda"],["Patologías reumáticas (complemento)","Después de trombosis, flebitis y tromboflebitis","Varices tortuosas y con relieve (por encima)"],["","Trastornos del abdomen (menstruaciones copiosas, inflamatorias)",""],["","Síndrome del seno carotídeo",""]]},{"tipo":"parrafo","texto":"Se aplica también, **sin estudios clínicos que avalen su eficacia**, en acné, estrías y cicatrices, quemaduras, síndrome cervical postraumático, síndrome de Down y alteraciones vegetativas (estrés, personas mayores)."},{"tipo":"alerta","texto":"La trombosis **activa** (TVP, flebitis) es **absoluta**; el antecedente (**después de** trombosis) es **relativa**. Igual con el asma: **crisis aguda = absoluta**, asma bronquial de base = relativa. Infección **aguda = absoluta**, crónica = relativa."},{"tipo":"perla","texto":"En insuficiencia cardiaca, movilizar líquido intersticial hacia el sistema venoso **aumenta la precarga cardiaca**: por eso es contraindicación absoluta (complemento)."}]},{"id":"lineas-cuadrantes","titulo":"Líneas divisorias, cuadrantes y anastomosis","bloques":[{"tipo":"definicion","termino":"Líneas divisorias","texto":"Líneas ficticias que resultan de la **dirección del flujo linfático**; existen **solo a nivel subcutáneo**. La dirección del flujo en los colectores cutáneos determina la **dirección del empuje** en el DLM."},{"tipo":"tabla","titulo":"Líneas divisorias","columnas":["Plano","Líneas"],"filas":[["Anterior","Infraclavicular; sagital anterior (mitad derecha/izquierda); transversal anterior (horizontal **por encima del ombligo**)"],["Posterior","Espino-escapular; sagital posterior; transversal posterior (**por encima de L2–L3**); costura posterior (extremidad inferior)"],["Cabeza","Frontal o interauricular; oblicua; sagital"]]},{"tipo":"figura","pagina":42,"pie":"Líneas divisorias en zona ventral y dorsal: sagitales, clavicular/escapular, transversales y línea posterior de la extremidad inferior; los puntos marcan los grupos ganglionares.","src":"img/drenaje-linfatico-t1-tema-1-introduccion-al-drenaje-linfatico-manual-p42.jpg"},{"tipo":"definicion","termino":"Cuadrante linfático","texto":"Porción de superficie corporal delimitada por las líneas divisorias; entre cuadrantes existen **interconexiones anastomóticas**."},{"tipo":"tabla","titulo":"Cuadrantes y su estación ganglionar","columnas":["Cuadrante","Drena a"],"filas":[["Superior derecho","Ganglios axilares derechos"],["Superior izquierdo","Ganglios axilares izquierdos"],["Inferior derecho","Ganglios inguinales derechos"],["Inferior izquierdo","Ganglios inguinales izquierdos"]]},{"tipo":"figura","pagina":46,"pie":"Cuadrantes linfáticos: las flechas convergen hacia los ganglios axilares (cuadrantes superiores) e inguinales (cuadrantes inferiores).","src":"img/drenaje-linfatico-t1-tema-1-introduccion-al-drenaje-linfatico-manual-p46.jpg"},{"tipo":"definicion","termino":"Anastomosis linfáticas","texto":"Vasos “**en desuso**” que se activan cuando hay un **cambio de presión por estancamiento** o mediante **DLM en la dirección deseada**."},{"tipo":"tabla","titulo":"Anastomosis","columnas":["Plano anterior","Plano posterior"],"filas":[["Axilo-axilar (interaxilar): por encima del esternón","Interaxilar"],["Axilo-inguinal: entre ganglios axilares e inguinales del mismo lado","Interilíacas: por encima del sacro"],["Suprapúbicas o interilíacas","Entre vasos intercostales y la piel"],["Entre vasos intercostales y la piel",""]]},{"tipo":"figura","pagina":49,"pie":"Anastomosis del plano anterior: las flechas cruzan las líneas divisorias (interaxilar sobre el esternón, axilo-inguinal, suprapúbica).","src":"img/drenaje-linfatico-t1-tema-1-introduccion-al-drenaje-linfatico-manual-p49.jpg"},{"tipo":"esquema","titulo":"Derivación de la linfa ante un bloqueo axilar","mermaid":"flowchart TD\n  B[\"Ganglios axilares bloqueados\"] --> C[\"Cuadrante superior estancado\"]\n  C -->|\"anastomosis axilo-axilar\"| X[\"Axila contralateral\"]\n  C -->|\"anastomosis axilo-inguinal\"| G[\"Ingle homolateral\"]\n  X --> F[\"Area linfatica funcionante\"]\n  G --> F","pie":"El DLM activa las anastomosis para derivar la linfa hacia cuadrantes sanos."},{"tipo":"perla","texto":"Tras una linfadenectomía axilar, el DLM no empuja hacia la axila afectada: abre primero la axila contralateral y la ingle homolateral y deriva la linfa por las **anastomosis axilo-axilar y axilo-inguinal**."}]},{"id":"respiracion","titulo":"Respiración profunda","bloques":[{"tipo":"parrafo","texto":"La **respiración profunda** actúa como bomba: el descenso del diafragma en la **inspiración** y su ascenso en la **espiración** cambian las presiones toraco-abdominales y movilizan la linfa en el **conducto torácico** y la cisterna, de forma análoga a un sistema de válvulas."},{"tipo":"perla","texto":"Por eso se incorpora la respiración diafragmática a la sesión de DLM: favorece el vaciado central antes de trabajar la periferia (complemento)."}]}],"caso_clinico":{"titulo":"Edema de miembro superior tras cirugía de mama","presentacion":"Mujer de 52 años, intervenida hace 8 meses de cáncer de mama izquierda con vaciamiento axilar; tratamiento oncológico terminado y sin signos de recidiva. Presenta edema blando del brazo izquierdo. Tensión arterial baja habitual y antecedente de tromboflebitis en la pierna hace 3 años, ya resuelta.","preguntas":[{"pregunta":"¿Hay contraindicación para el DLM?","respuesta":"No absoluta: el cáncer está tratado. La **hipotensión** y el **antecedente** de tromboflebitis son **contraindicaciones relativas**: se puede tratar con precaución (vigilar al incorporarse, no trabajar sobre la pierna afectada sin valoración)."},{"pregunta":"¿Hacia dónde debes derivar la linfa del cuadrante superior izquierdo?","respuesta":"Los ganglios axilares izquierdos están extirpados: se deriva por la **anastomosis axilo-axilar** (hacia la axila derecha, por encima del esternón) y por la **axilo-inguinal** (hacia la ingle izquierda), abriendo primero esas estaciones."},{"pregunta":"¿Qué parámetros técnicos debe respetar la sesión?","respuesta":"Sesión de **30–90 min**, paciente estirada y cómoda, **sin cremas**, presiones suaves con fase de relajación, ritmo lento, sin dolor ni vasodilatación, trabajando de **proximal a distal**, con respiración profunda al inicio."}]},"preguntate":[{"pregunta":"Define el DLM y su objetivo.","respuesta":"Técnica de masaje que mejora la reabsorción del edema favoreciendo su paso del intersticio al sistema linfático y venoso sin aumentar la filtración."},{"pregunta":"¿Por qué el DLM no debe producir vasodilatación?","respuesta":"Porque más flujo sanguíneo aumenta la filtración capilar y lleva más agua al intersticio, empeorando el edema."},{"pregunta":"¿Qué aportó Leduc respecto a Vodder?","respuesta":"Bases científicas rigurosas y dos maniobras: la de llamada y la de reabsorción."},{"pregunta":"¿Qué componentes tiene la Terapia Descongestiva Compleja y quién la propuso?","respuesta":"Földi: DLM, vendaje, ejercicios y cuidados de la piel."},{"pregunta":"Explica la tixotropía.","respuesta":"Paso del tejido conjuntivo de estado gel a líquido, lo que facilita el transporte de moléculas y el drenaje."},{"pregunta":"¿Por qué el DLM es sedante y analgésico?","respuesta":"Porque actúa sobre el sistema parasimpático, generando relajación generalizada e inhibición de estímulos dolorosos."},{"pregunta":"Diferencia una contraindicación absoluta y relativa relacionada con trombosis.","respuesta":"TVP/flebitis/tromboflebitis activa es absoluta; haber tenido trombosis (después de) es relativa."},{"pregunta":"¿Dónde pasa la línea transversal posterior y qué separa?","respuesta":"Por encima de L2–L3; separa la piel en una parte superior (drena a axila) e inferior (drena a ingle)."},{"pregunta":"¿Qué son las anastomosis linfáticas y cuándo se activan?","respuesta":"Vasos en desuso que se activan por cambios de presión debidos a un estancamiento o mediante DLM en la dirección deseada."}],"glosario":[{"termino":"DLM","definicion":"Drenaje linfático manual."},{"termino":"Linfangión","definicion":"Segmento de vaso linfático entre dos válvulas, con musculatura lisa contráctil."},{"termino":"Linfangiomotricidad","definicion":"Capacidad contráctil de los vasos linfáticos; el DLM la aumenta."},{"termino":"Tixotropía","definicion":"Paso del estado gel al líquido del tejido conjuntivo."},{"termino":"Precarga linfática","definicion":"Carga de líquido intersticial que entra en los capilares linfáticos."},{"termino":"Metaarteriolas","definicion":"Vasos entre arteriolas y capilares; el DLM provoca su vasoconstricción."},{"termino":"Equilibrio de Starling","definicion":"Balance entre filtración arterial y reabsorción venosa/linfática en el tejido."},{"termino":"TDC","definicion":"Terapia Descongestiva Compleja (Földi)."},{"termino":"Terapia Linfática Compuesta","definicion":"Método de Casley-Smith basado en Vodder."},{"termino":"Línea divisoria","definicion":"Línea ficticia subcutánea que separa territorios de drenaje linfático."},{"termino":"Cuadrante linfático","definicion":"Superficie corporal delimitada por líneas divisorias que drena a un grupo ganglionar."},{"termino":"Anastomosis linfática","definicion":"Conexión entre cuadrantes, activable en caso de estancamiento o por DLM."},{"termino":"Cisterna de Pecquet","definicion":"Dilatación inicial del conducto torácico descrita por Pecquet."}],"fuentes":["Ferrandez, J. El Sistema Linfático. Historia, Iconografía e Implicaciones Fisioterapéuticas. Editorial Médica Panamericana.","Wittlinger. Drenaje linfático manual. Editorial Médica Panamericana.","T1- Introducción DLM (Universidad Europea)."],"qcm":[{"pregunta":"¿Cuál de las siguientes afirmaciones sobre el mecanismo de acción del DLM frente al masaje terapéutico es correcta?","opciones":["El DLM produce una respuesta antálgica refleja estimulante","El DLM regula sobre todo el tono de la musculatura estriada","El DLM activa la filtración capilar para movilizar el edema","El DLM no aumenta la filtración de los capilares sanguíneos"],"correcta":3,"explicacion":"El DLM busca el paso del líquido intersticial al sistema linfático y venoso sin aumentar la filtración. Activar la filtración, regular la estriada y la respuesta antálgica refleja son propias del masaje terapéutico.","por_opcion":["❌ La respuesta antálgica refleja y el efecto estimulante son del masaje; el DLM es relajante.","❌ Regular el tono de la musculatura estriada es objetivo del masaje; el DLM actúa secundariamente sobre la lisa.","❌ Activar la filtración es característico del masaje terapéutico.","✅ Es la diferencia fundamental: el DLM no incrementa la filtración capilar."]},{"pregunta":"¿Qué escuela incorporó las maniobras de llamada y de reabsorción?","opciones":["Leduc","Földi","Casley-Smith","Vodder"],"correcta":0,"explicacion":"Leduc perfeccionó la técnica de Vodder con bases científicas e incluyó dos maniobras: llamada y reabsorción.","por_opcion":["✅ Leduc introdujo ambas maniobras.","❌ Földi desarrolló la Terapia Descongestiva Compleja.","❌ Casley-Smith desarrolló la Terapia Linfática Compuesta.","❌ Vodder es el pionero de los finos estímulos táctiles."]},{"pregunta":"Un tratamiento que combina DLM, vendaje, ejercicios y cuidados de la piel corresponde a:","opciones":["Terapia Descongestiva Compleja de Földi","Terapia Linfática Compuesta de Casley-Smith","Método Godoy con gimnasia pasiva","Método Leduc con maniobras de llamada"],"correcta":0,"explicacion":"La TDC de Földi integra DLM, vendaje, ejercicios y cuidados de la piel; Földi describió además los estadios del linfedema.","por_opcion":["✅ Son exactamente los cuatro componentes de la TDC.","❌ La Terapia Linfática Compuesta es de Casley-Smith y no se define por esos cuatro pilares en el tema.","❌ Godoy aporta movimientos lineales, gimnasia pasiva y compresión con tejido especial.","❌ Leduc se define por sus maniobras, no por este programa combinado."]},{"pregunta":"¿Qué aportación se atribuye a Casley-Smith?","opciones":["Presentación del DLM en París en 1936","Terapia linfática cervical con movimientos lineales","Fundar en 1979 una clínica linfológica","Uso de benzopironas en edemas ricos en proteínas"],"correcta":3,"explicacion":"Casley-Smith estudió la microcirculación, usó benzopironas para la filariasis linfática y otros edemas altos en proteínas y desarrolló secuencias de ejercicio.","por_opcion":["❌ La presentación en París (1936) fue de Vodder.","❌ La terapia linfática cervical es una innovación de Godoy.","❌ La Földiklinik la fundó Földi en 1979.","✅ Las benzopironas forman parte de su investigación."]},{"pregunta":"Respecto a la duración de una sesión de DLM, el tema establece:","opciones":["Entre 15 y 45 minutos","Entre 20 y 60 minutos","Entre 45 y 120 minutos","Entre 30 y 90 minutos"],"correcta":3,"explicacion":"La sesión no debe ser inferior a 30 minutos ni superior a 90 minutos.","por_opcion":["❌ 15 minutos es insuficiente: la activación del flujo no es instantánea.","❌ El mínimo indicado es 30 minutos, no 20.","❌ 120 minutos supera el máximo de 90.","✅ Es el rango literal del tema."]},{"pregunta":"¿Qué efecto vascular local produce el DLM a nivel de la microcirculación?","opciones":["Aumento de la presión hidrostática capilar","Vasodilatación venosa refleja","Vasoconstricción de las metaarteriolas","Vasodilatación de las arteriolas"],"correcta":2,"explicacion":"Dentro del efecto drenante, el DLM provoca vasoconstricción de las metaarteriolas, coherente con no aumentar la filtración.","por_opcion":["❌ Aumentar la presión hidrostática favorecería la filtración, lo contrario.","❌ No se describe vasodilatación venosa refleja.","✅ Es uno de los efectos drenantes listados.","❌ La vasodilatación es propia del masaje y aumentaría la filtración."]},{"pregunta":"La tixotropía que se atribuye al efecto drenante del DLM consiste en:","opciones":["La apertura de anastomosis entre cuadrantes","La contracción rítmica de los linfangiones","El paso del tejido conjuntivo de estado líquido a gel","El paso del tejido conjuntivo de estado gel a líquido"],"correcta":3,"explicacion":"La tixotropía es la transformación del estado gel al estado líquido, lo que facilita el transporte de moléculas.","por_opcion":["❌ La activación de anastomosis es otro fenómeno.","❌ Eso es la linfangiomotricidad.","❌ Es el sentido inverso.","✅ Definición literal del tema."]},{"pregunta":"El efecto sedante y analgésico del DLM se explica por su acción sobre:","opciones":["Los ganglios linfáticos como filtro inmunitario","El sistema simpático, con inhibición nociceptiva","El sistema parasimpático, con relajación generalizada","La musculatura estriada hipertónica exclusivamente"],"correcta":2,"explicacion":"El DLM actúa a nivel del parasimpático, provocando sedación, relajación generalizada e inhibición de los estímulos dolorosos.","por_opcion":["❌ El efecto inmunitario es indirecto y no explica la sedación.","❌ La vía descrita es parasimpática, no simpática.","✅ Es el mecanismo neurovegetativo del tema.","❌ La regulación del tono estriado es el efecto muscular, no el neurovegetativo."]},{"pregunta":"Sobre el efecto inmunitario del DLM, ¿qué es correcto según el tema?","opciones":["No se ha demostrado una acción directa, pero mejora el medio extracelular","Está contraindicado por movilizar gérmenes","Es el efecto principal y más documentado","Se ha demostrado que aumenta los linfocitos circulantes"],"correcta":0,"explicacion":"No se ha demostrado incidencia directa sobre el sistema defensivo, pero mejora el estado de los líquidos extracelulares en que viven las células.","por_opcion":["✅ Formulación literal del tema.","❌ Las infecciones agudas sí son contraindicación, pero no es lo que define el efecto inmunitario.","❌ El efecto principal es el drenante.","❌ No hay demostración de efecto directo."]},{"pregunta":"¿Cuál de estas situaciones es una contraindicación RELATIVA del DLM?","opciones":["Trastornos funcionales del tiroides","Infección aguda","Insuficiencia cardiaca","Crisis asmática en fase aguda"],"correcta":0,"explicacion":"Los trastornos funcionales del tiroides figuran entre las contraindicaciones relativas; las otras tres son absolutas.","por_opcion":["✅ Relativa según el tema.","❌ La infección aguda es absoluta (la crónica es relativa).","❌ La insuficiencia cardiaca es absoluta.","❌ La crisis asmática aguda es absoluta (el asma de base es relativa)."]},{"pregunta":"Paciente con antecedente de tromboflebitis resuelta hace dos años. Para el DLM esto constituye:","opciones":["Una situación sin relevancia","Una indicación preferente","Una contraindicación relativa","Una contraindicación absoluta"],"correcta":2,"explicacion":"“Después de trombosis, flebitis y tromboflebitis” es relativa; la trombosis, flebitis o tromboflebitis actual es absoluta.","por_opcion":["❌ Sí tiene relevancia: obliga a precaución.","❌ No figura entre las indicaciones.","✅ El antecedente es una contraindicación relativa.","❌ Sería absoluta si estuviera activa."]},{"pregunta":"¿Cuál de las siguientes se aplica con DLM sin que existan estudios clínicos que avalen su eficacia?","opciones":["Lipedema","Síndrome cervical postraumático","Síndrome de Sudeck","Flebolinfedema"],"correcta":1,"explicacion":"El síndrome cervical postraumático aparece en la lista de aplicaciones sin aval clínico (junto a acné, cicatrices, quemaduras, Down, alteraciones vegetativas).","por_opcion":["❌ El lipedema es una indicación.","✅ Figura entre las aplicaciones sin estudios clínicos.","❌ La distrofia simpático-refleja (Sudeck) es una indicación.","❌ El flebolinfedema es una indicación."]},{"pregunta":"La línea transversal posterior se sitúa:","opciones":["A la altura de la línea espino-escapular","Por encima de L2–L3","Por encima del ombligo, en el plano dorsal","Por debajo del sacro"],"correcta":1,"explicacion":"La línea transversal posterior pasa por encima de L2–L3 y divide la piel dorsal en parte superior e inferior.","por_opcion":["❌ La espino-escapular es otra línea del plano posterior.","✅ Dato literal del tema.","❌ “Por encima del ombligo” describe la transversal anterior.","❌ No se sitúa por debajo del sacro."]},{"pregunta":"¿Qué afirmación sobre las líneas divisorias es correcta?","opciones":["Existen en todos los planos, incluido el profundo","Solo existen a nivel subcutáneo","Se definen por la irrigación arterial","Coinciden con los dermatomas"],"correcta":1,"explicacion":"Son líneas ficticias derivadas de la dirección del flujo linfático y solo existen a nivel subcutáneo.","por_opcion":["❌ No existen en el plano profundo.","✅ Literal del tema.","❌ Se definen por el flujo linfático, no arterial.","❌ No se definen por la inervación."]},{"pregunta":"Las anastomosis interilíacas del plano posterior se localizan:","opciones":["Por encima del esternón","Entre axila e ingle homolateral","En la línea sagital de la cabeza","Por encima del sacro"],"correcta":3,"explicacion":"En el plano posterior las anastomosis interilíacas se sitúan por encima del sacro.","por_opcion":["❌ Por encima del esternón está la axilo-axilar anterior.","❌ Esa es la axilo-inguinal.","❌ No se describen anastomosis en la sagital craneal.","✅ Localización indicada en el tema."]}],"asignatura":"Drenaje linfático","tema":1,"fecha":"2026-11-09"}</script>

  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
