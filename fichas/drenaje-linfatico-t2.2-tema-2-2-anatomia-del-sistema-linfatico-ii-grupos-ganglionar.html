<style>
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;

*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}

a{color:var(--acento-tinta)}
b,strong{font-weight:700}

.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}

/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}

nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}

.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}

figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}

.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}

.preg .auto{display:flex;gap:8px;margin-top:10px}

.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}

.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}

#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}

.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}

.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}

.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}

@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}

  a{color:#000;text-decoration:none}
}

<script id="datos" type="application/json">{"titulo":"Tema 2.2: Anatomía del sistema linfático (II) – grupos ganglionares y corrientes","subtitulo":"Mapa topográfico de los ganglios de cabeza y cuello, miembro superior, miembro inferior, tórax, pelvis y abdomen, con sus aferencias, eferencias y corrientes linfáticas.","resumen":["El cuello tiene **cinco grupos**: **pericervical** (occipitales, mastoideos, parotídeos, submaxilares, submentonianos), **superficial** (yugular anterior y externa), **posterior**, **lateral profundo** (yugular interna, nervio espinal y cervical transversa = **triángulo de Rouvière**) y **yuxtavisceral**.","La **cadena yugular interna (~30 ganglios)** recibe la linfa superficial de cara y cuello y forma el **tronco yugular**: el izquierdo va al **cayado del conducto torácico**, el derecho al **ángulo venoso o a la gran vena linfática**; el ganglio supraclavicular clave es el de **Virchow (Troisier)**.","La axila tiene **5 grupos**: **lateral/humeral (4–6), anterior/pectoral (4–5), posterior/subescapular (6–7), central (3–4) y apical (6–12)**; el **apical** forma el **tronco subclavio**; fuera de la axila están los **supratrocleares, infraclaviculares y la vía de Caplan (60 %)**.","En el brazo, las corrientes **basílica y bicipital anterior** van a la axila, y la **cefálica** a los **infraclaviculares** o, por encima de la clavícula, a la **cadena cervical transversa (vía de Mascagni)**.","En el miembro inferior, los **inguinales superficiales** (inferiores/internos y superiores/externos) y los **poplíteos** drenan a los **inguinales profundos** (ganglio constante de **Cloquet/Rosenmüller**), luego a **ilíacos externos → ilíacos comunes → lumboaórticos → tronco lumbar → cisterna de Pecquet**."],"objetivos":["Clasificar los grupos ganglionares de cara y cuello y describir el triángulo de Rouvière.","Localizar los ganglios del miembro superior (extraaxilares y 5 grupos axilares) con sus aferencias y eferencias.","Describir las corrientes linfáticas de mano, antebrazo y brazo, incluidas las vías de Caplan y Mascagni.","Seguir la ruta de la linfa del miembro inferior hasta la cisterna de Pecquet.","Enumerar los ganglios torácicos, pélvicos y abdominales y los conductos terminales."],"ideas_clave":["**Triángulo de Rouvière**: vértice = unión yugular interna + nervio espinal; base = cadena cervical transversa.","Cadena **yugular interna ≈ 30** ganglios; cadena del **nervio espinal ≈ 20** ganglios.","**Ganglio de Virchow (nódulo de Troisier)** = supraclavicular más importante; drena parte del tórax y abdomen.","Ganglios axilares **apicales (6–12)** → **tronco subclavio**; todos los demás convergen en central y/o apical.","**Vía de Caplan**: cadena interpectoral, escape posterior del hombro hacia el trapecio; presente en el **60 %**.","**Vía de Mascagni**: la cefálica salta la clavícula y drena en la **cadena cervical transversa**.","Inguinales profundos: borde interno de la vena femoral; único constante = **ganglio de Cloquet o Rosenmüller**.","Poplíteos drenan **directamente a los inguinales profundos**; reciben la corriente **posteroexterna (safena menor)**."],"secciones":[{"id":"cara-cuello","titulo":"Grupos ganglionares de cara y cuello","bloques":[{"tipo":"tabla","titulo":"Los cinco grupos cervicales","columnas":["Grupo","Componentes"],"filas":[["1. Pericervical","Occipitales (superficiales y profundos), mastoideos o retroauriculares, parotídeos (superficiales y profundos), submaxilares, submentonianos"],["2. Cervical superficial","Anteriores (cadena yugular anterior) y laterales (cadena yugular externa)"],["3. Cervicales posteriores","Línea posterior al ECOM y anterior al trapecio, de la mastoides a la clavícula"],["4. Lateral profundo","Cadena yugular interna, cadena del nervio espinal, cadena cervical transversa"],["5. Yuxtavisceral (profundos anteriores)","Retrofaríngeos, prelaríngeos, pretraqueales, cadena recurrencial paratraqueal"]]},{"tipo":"tabla","titulo":"Cadena pericervical: territorios aferentes","columnas":["Ganglios","Recogen la linfa de"],"filas":[["Occipitales","Región occipital del cuero cabelludo; tegumentos, músculos y fascias de la parte alta de la nuca"],["Mastoideos (retroauriculares)","Región parietal, pabellón auricular, región mastoidea"],["Parotídeos","Zona frontal y parietal del cuero cabelludo; parte **externa** de párpados, conjuntiva y glándula lagrimal; encías molares e incisivos superiores; pabellón y cavidad timpánica; parótida"],["Submaxilares","Parte externa y raíz de la nariz, cavidad nasal anterior, centro de la frente, mejilla medial, parte **interna** de párpados, labio superior, parte lateral del labio inferior, mucosa de mejilla y labios"],["Submentonianos","Parte **central** del labio inferior, mentón, encías de incisivos inferiores, suelo de la boca, **punta de la lengua**"]]},{"tipo":"alerta","texto":"Párpados: parte **externa → parotídeos**, parte **interna → submaxilares**. Labio inferior: parte **lateral → submaxilares**, parte **central → submentonianos**."},{"tipo":"parrafo","texto":"La **cadena yugular anterior** recoge la parte anterior del cuello y drena a la yugular interna y a la cervical transversa. La **cadena yugular externa** es un rosario de pequeños ganglios desde los **parotídeos inferiores hasta la mitad del ECOM**."},{"tipo":"figura","pagina":11,"pie":"Triángulo de Rouvière y grupos cervicales: preauriculares, retroauriculares, submentonianos, yugulodigástrico y cadenas que siguen al ECOM.","src":"img/drenaje-linfatico-t2.2-tema-2-2-anatomia-del-sistema-linfatico-ii-grupos-ganglionar-p11.jpg"},{"tipo":"tarjetas","items":[{"etiqueta":"≈30 ganglios","titulo":"Cadena yugular interna","texto":"Superiores, medios e inferiores junto a la vena yugular interna. Recibe eferentes de **submandibulares, submentonianos, parotídeos y yugular anterior**. Forma el **tronco yugular**."},{"etiqueta":"≈20 ganglios","titulo":"Cadena del nervio espinal","texto":"Superiores (bajo el **ECOM**, mezclados con la yugular interna), medios (bajo el **escaleno**), inferiores (bajo el **trapecio**). Recibe **occipitales y mastoideos**; drena a la **cervical transversa**."},{"etiqueta":"Base","titulo":"Cadena cervical transversa","texto":"Sigue la **arteria transversa cervical** sobre el **escaleno anterior**. Une la parte inferior de las otras dos formando el **grupo cervical profundo inferior**, con los **ganglios supraclaviculares**."}]},{"tipo":"definicion","termino":"Ganglio de Virchow (nódulo de Troisier)","texto":"El ganglio supraclavicular más importante, en el hueco supraclavicular junto a la articulación esternoclavicular; drena **parte de la cavidad torácica y del abdomen**."},{"tipo":"perla","texto":"Un ganglio de Virchow palpable puede indicar patología torácica o abdominal: es un **signo de alarma** que justifica derivar al médico antes de aplicar DLM cervical."},{"tipo":"esquema","titulo":"Desembocadura de los troncos yugulares","mermaid":"flowchart TD\n  P[\"Pericervicales y superficiales\"] --> YI[\"Cadena yugular interna\"]\n  O[\"Occipitales y mastoideos\"] --> NE[\"Cadena del nervio espinal\"]\n  NE --> CT[\"Cadena cervical transversa\"]\n  YI --> CT\n  CT --> TY[\"Tronco yugular\"]\n  YI --> TY\n  TY -->|\"izquierdo\"| CTO[\"Cayado del conducto toracico\"]\n  TY -->|\"derecho\"| D[\"Angulo venoso D o gran vena linfatica\"]","pie":"Convergencia cervical hacia los troncos yugulares."},{"tipo":"parrafo","texto":"El **grupo yuxtavisceral** rodea tráquea, laringe, faringe y tiroides; sus eferentes van a la yugular interna o, en su mayoría, directamente al **cayado del conducto torácico (I)** o al **ángulo yugulo-subclavio (D)**."}]},{"id":"miembro-superior","titulo":"Ganglios del miembro superior","bloques":[{"tipo":"tabla","titulo":"Ganglios superficiales extraaxilares","columnas":["Grupo","Localización","Aferencias","Eferencias"],"filas":[["Supratrocleares","Por encima del epicóndilo medial, junto a la **vena basílica**","Parte interna de mano y antebrazo","Axilares, siguiendo la basílica"],["Infraclaviculares","Fosa infraclavicular, **surco deltopectoral**, junto a la **vena cefálica**","Hombro y pecho","Axilar **apical**"],["Vía de Caplan","Cadena interpectoral, ganglios escalonados","Parte posterior del hombro (escape hacia el trapecio)","Grupo cervical profundo inferior"]]},{"tipo":"dato","valor":"60 %","texto":"Personas en las que está presente la vía de Caplan."},{"tipo":"tabla","titulo":"Los 5 grupos axilares","columnas":["Grupo","Nº","Localización","Aferencias","Eferencias"],"filas":[["Lateral o humeral","4–6","A lo largo de la arteria y vena axilar","Mayor parte del MS **excepto la vena cefálica**","Central, apical y cervicales profundos inferiores"],["Anterior o pectoral","4–5","Borde lateral del **pectoral menor**","Piel y músculos de la pared anterolateral del tórax, **glándula mamaria**","Central y apical"],["Posterior o subescapular","6–7","Borde inferior de la pared posterior de la axila","Piel y músculos superficiales de espalda, hombro y cuello (posteroinferior)","Central y apical"],["Central","3–4","Grasa de la axila","Humerales, pectorales y subescapulares","Apical"],["Apical","**6–12**","Grasa del vértice de la axila","Vasos de la vena cefálica y región superior de la mama","Forman el **tronco subclavio**"]]},{"tipo":"figura","pagina":27,"pie":"Ganglios axilares numerados: 1 lateral/humeral, 2 anterior/pectoral, 3 posterior/subescapular, 4 central, 5 apical; también paraesternales e interpectorales (de Rotter).","src":"img/drenaje-linfatico-t2.2-tema-2-2-anatomia-del-sistema-linfatico-ii-grupos-ganglionar-p27.jpg"},{"tipo":"alerta","texto":"El grupo **más numeroso** es el **apical (6–12)** y el **menos numeroso** el **central (3–4)**. El que recibe la **mama** es el **anterior o pectoral** (y el apical su parte superior)."}]},{"id":"corrientes-ms","titulo":"Corrientes linfáticas del miembro superior","bloques":[{"tipo":"parrafo","texto":"En el **dorso de la mano**, la linfa nace en la **yema de los dedos**, recorre los **bordes laterales** hasta la zona **interdigital** y se une a la red dorsal hacia la muñeca. La **palma** drena hacia la muñeca uniéndose a los vasos del **borde cubital** (lado interno) y **radial** (lado externo)."},{"tipo":"tabla","titulo":"Antebrazo (cara ventral)","columnas":["Grupo","Origen","Acompaña a"],"filas":[["Externo","Pulgar e índice","Vena **cefálica**"],["Interno","Meñique y anular","Vena **basílica**"],["Medial anterior","Palma de la mano","Vena **mediana**"]]},{"tipo":"parrafo","texto":"Durante el trayecto, gran parte de los colectores dorsales se hacen **ventrales**. En la flexura del codo hay **ganglios supraepitrocleares cubitales** (extraarticulares)."},{"tipo":"tabla","titulo":"Brazo (cara anterior)","columnas":["Corriente","Descripción","Destino"],"filas":[["Bicipital interna (basílica)","Continuación preferente de las corrientes cubitales","Ganglios axilares"],["Bicipital anterior","Continuación de la radial y parte de la cubital","Ganglios axilares"],["Bicipital externa (cefálica)","Menos provista, a menudo un único colector; nace en la parte inferior del brazo","Infraclaviculares (surco deltopectoral) o **cadena cervical transversa (vía de Mascagni)**"]]},{"tipo":"parrafo","texto":"En la cara posterior del brazo, el **territorio posterointerno** drena a la **vía basílica** y el **posteroexterno** a la **vía cefálica**."},{"tipo":"figura","pagina":37,"pie":"Brazo: colectores que ascienden hacia axilares e infraclaviculares, ganglio supratroclear y relación con las venas cefálica, basílica y mediana.","src":"img/drenaje-linfatico-t2.2-tema-2-2-anatomia-del-sistema-linfatico-ii-grupos-ganglionar-p37.jpg"},{"tipo":"esquema","titulo":"Vías de salida del miembro superior","mermaid":"flowchart TD\n  A[\"Corriente basilica\"] --> AX[\"Ganglios axilares\"]\n  B[\"Bicipital anterior\"] --> AX\n  C[\"Corriente cefalica\"] -->|\"surco deltopectoral\"| IC[\"Infraclaviculares\"]\n  C -->|\"Mascagni: sobre la clavicula\"| CT[\"Cadena cervical transversa\"]\n  H[\"Hombro posterior\"] -->|\"Caplan 60%\"| CP[\"Cervical profundo inferior\"]\n  IC --> AP[\"Axilar apical\"]\n  AX --> AP\n  AP --> TS[\"Tronco subclavio\"]","pie":"Vías alternativas (Mascagni, Caplan) que evitan la axila: clave en el linfedema postmastectomía."},{"tipo":"perla","texto":"Tras un vaciamiento axilar, la **vía cefálica (Mascagni)** y la **vía de Caplan** son rutas que sortean la axila: el DLM las aprovecha dirigiendo la linfa hacia la región supraclavicular."}]},{"id":"miembro-inferior","titulo":"Ganglios y corrientes del miembro inferior","bloques":[{"tipo":"tabla","titulo":"Ganglios inguinales y poplíteos","columnas":["Grupo","Localización","Aferencias","Eferencias"],"filas":[["Inguinales superficiales inferiores/internos","Porción terminal de la **vena safena interna**","Colectores superficiales del MI (corriente **safena mayor**), región glútea interna","Inguinales profundos"],["Inguinales superficiales superiores/externos","Inmediatamente **bajo el ligamento inguinal**","Región glútea externa, pared abdominal **infraumbilical**, genitales externos, parte del conducto anal","Inguinales profundos"],["Inguinales profundos","Borde interno de la **vena femoral**; constante: **Cloquet/Rosenmüller**","Inguinales superficiales, **poplíteos**, genitales internos (1/3 inferior de vagina, útero, trompas)","**Ilíacos externos**"],["Poplíteos","Hueco poplíteo","Corriente **posteroexterna (safena menor)**, rodilla, hueco poplíteo, colectores tibiales","**Directamente** a inguinales profundos"],["Tibial ant./post., peroneo, femoral","Profundos, intercalados en los colectores satélites","—","Ganglios **de relevo**"]]},{"tipo":"dato","valor":"Cloquet / Rosenmüller","texto":"Único ganglio inguinal profundo constante."},{"tipo":"tabla","titulo":"Corrientes del miembro inferior","columnas":["Segmento","Corrientes"],"filas":[["Inferior (pierna)","Anterointerna o safena tibial; anteroexterna o safena posterior"],["Superior (muslo)","Anterointerna o safena interna; anteroexterna; posteroexterna; posterointerna"]]},{"tipo":"figura","pagina":49,"pie":"Ruta de la linfa del miembro inferior derecho: safena externa → poplíteos; safena interna → inguinales superficiales; todos → inguinales profundos → ilíacos externos → ilíaco común → lumboaórticos → tronco lumbar derecho.","src":"img/drenaje-linfatico-t2.2-tema-2-2-anatomia-del-sistema-linfatico-ii-grupos-ganglionar-p49.jpg"},{"tipo":"esquema","titulo":"Del pie a la cisterna de Pecquet","mermaid":"flowchart TD\n  SM[\"Corriente safena menor\"] --> PO[\"Popliteos\"]\n  SI[\"Corriente safena interna\"] --> IS[\"Inguinales superficiales\"]\n  GL[\"Region glutea\"] --> IS\n  PO --> IP[\"Inguinales profundos\"]\n  IS --> IP\n  IP --> IE[\"Iliacos externos\"]\n  IE --> IC[\"Iliacos comunes\"]\n  IC --> LA[\"Lumboaorticos\"]\n  LA --> TL[\"Tronco lumbar\"]\n  TL --> CP[\"Cisterna de Pecquet\"]","pie":"Las vísceras pélvicas entran por ilíacos internos y externos."},{"tipo":"alerta","texto":"Los **poplíteos no pasan por los inguinales superficiales**: van **directamente a los inguinales profundos**. Y los inguinales profundos drenan en los **ilíacos externos**, no en los comunes."}]},{"id":"torax-pelvis-abdomen","titulo":"Ganglios de tórax, pelvis y abdomen; conductos terminales","bloques":[{"tipo":"tabla","titulo":"Tórax","columnas":["Grupo","Aferencias","Eferencias"],"filas":[["Intercostales (paravertebrales)","Intercostales, tejido subpleural, pleura parietal","Superiores (3–4 primeros espacios) → tronco broncomediastínico → conducto linfático derecho; inferiores → colector único que cruza el diafragma → **cisterna de Pecquet**"],["Paraesternales (6–8)","Recto del abdomen superior, espacios intercostales anteriores, pared torácica anterior, **tercio medial de la mama**","Conducto torácico, conducto linfático derecho o confluencia yugulosubclavia"],["Frénicos superiores","Diafragma","Solidarios de la cadena torácica interna (delante) y mediastínicas (detrás)"],["Mediastínicos anteriores","Pulmón, pericardio, corazón, pleura, timo","Base del cuello (confluentes venosos)"],["Mediastínicos intermedios","Pulmonares, esofágicos","Cadenas paratraqueales (Winckler) → confluencia yugulosubclavia homolateral"],["Mediastínicos posteriores","Diafragma, esófago","Conducto torácico, linfático derecho o confluencia"]]},{"tipo":"tabla","titulo":"Pelvis","columnas":["Grupo","Aferencias","Eferencias"],"filas":[["Ilíacos externos","Ingle, pared abdominal infraumbilical, foramen obturador, vísceras pélvicas anteriores (vejiga, próstata, uretra posterior, vagina, cuello uterino)","Ilíacos comunes o lumboaórticos"],["Ilíacos internos","Región glútea, periné, vísceras pélvicas","Ilíacos externos y comunes"],["Sacros","Detrás del recto, cara anterior del sacro (arteria sacra media)","—"],["Ilíacos comunes","Ilíacos externos, internos y sacros","Ganglios abdominales homo o contralaterales"]]},{"tipo":"parrafo","texto":"En el abdomen se distinguen ganglios **parietales**: **lumbares izquierdos** (aórticos laterales, preaórticos, retroaórticos), **intermedios** (entre aorta y cava), **derechos** (laterocavos, precavos, retrocavos), **inferiores** (bajo el diafragma, junto al hiato aórtico) y **epigástricos inferiores**; y **viscerales**: celíacos, gástricos, pilóricos, pancreáticos, esplénicos, hepáticos y mesentéricos superiores e inferiores."},{"tipo":"tarjetas","items":[{"etiqueta":"L1","titulo":"Cisterna de Pecquet","texto":"A la altura de **L1**, **detrás de la aorta**, entre los **pilares del diafragma**; forma variable. Recibe troncos **lumbares D e I** y **abdominales**."},{"etiqueta":"Izquierdo","titulo":"Conducto torácico","texto":"De la cisterna a la **confluencia yugulosubclavia**, donde presenta una **pequeña dilatación**, a veces con válvulas."},{"etiqueta":"8–15 cm","titulo":"Conducto linfático derecho","texto":"Entre la **vena yugular interna y la arteria subclavia derechas**; termina en la confluencia venosa subclavia derecha."}]},{"tipo":"dato","valor":"8–15 cm","texto":"Longitud del conducto linfático derecho (gran vena linfática)."},{"tipo":"perla","texto":"La mama drena sobre todo a la **axila (pectorales, apicales)** pero su **tercio medial** va a los **paraesternales**: un vaciamiento axilar no elimina todas las vías mamarias."}]}],"caso_clinico":{"titulo":"Linfedema de brazo tras vaciamiento axilar","presentacion":"Mujer de 47 años, mastectomía derecha con vaciamiento axilar (niveles lateral, pectoral, central y apical). Presenta edema de la cara posterior del brazo y del antebrazo radial. No hay signos de infección.","preguntas":[{"pregunta":"¿Qué corrientes del brazo quedan sin su estación ganglionar habitual?","respuesta":"La **basílica** y la **bicipital anterior**, que drenan a los **ganglios axilares**. La cefálica conserva su salida por **infraclaviculares** o por la **vía de Mascagni**."},{"pregunta":"¿Qué rutas alternativas puedes potenciar con el DLM?","respuesta":"La **vía cefálica/Mascagni** hacia la **cadena cervical transversa** (supraclavicular), la **vía de Caplan** del hombro posterior hacia el **cervical profundo inferior** (si existe, 60 %), y las anastomosis hacia la axila contralateral e ingle homolateral."},{"pregunta":"¿Por qué conviene preparar primero la región supraclavicular?","respuesta":"Porque es la desembocadura (troncos yugular y subclavio, ángulo venoso) de las vías alternativas: vaciarla primero crea el efecto de aspiración para la linfa que llega por Mascagni y Caplan."}]},"preguntate":[{"pregunta":"¿Qué forma el triángulo de Rouvière?","respuesta":"Vértice: confluencia de la cadena yugular interna y la del nervio espinal; base: cadena cervical transversa que las une."},{"pregunta":"¿Qué ganglios drenan la punta de la lengua y el mentón?","respuesta":"Los submentonianos."},{"pregunta":"¿Dónde desemboca cada tronco yugular?","respuesta":"El izquierdo en el cayado del conducto torácico; el derecho en el ángulo yugulo-subclavio derecho o en la gran vena linfática."},{"pregunta":"¿Qué es el ganglio de Virchow y por qué importa?","respuesta":"El supraclavicular más importante (nódulo de Troisier); drena parte del tórax y abdomen y su aumento es signo de alarma."},{"pregunta":"Enumera los 5 grupos axilares con su número.","respuesta":"Lateral/humeral 4–6, anterior/pectoral 4–5, posterior/subescapular 6–7, central 3–4, apical 6–12."},{"pregunta":"¿Qué es la vía de Caplan?","respuesta":"Cadena interpectoral por la que la linfa posterior del hombro escapa hacia el trapecio y el grupo cervical profundo inferior; presente en el 60 %."},{"pregunta":"¿Qué es la vía de Mascagni?","respuesta":"Terminación de la vía cefálica pasando por encima de la clavícula para drenar en la cadena cervical transversa."},{"pregunta":"¿A dónde drenan los ganglios poplíteos?","respuesta":"Directamente a los inguinales profundos."},{"pregunta":"¿Qué ganglio inguinal profundo es constante?","respuesta":"El de Cloquet o Rosenmüller."},{"pregunta":"¿Dónde se sitúa la cisterna de Pecquet?","respuesta":"A la altura de L1, detrás de la aorta, entre los pilares del diafragma."}],"glosario":[{"termino":"Triángulo de Rouvière","definicion":"Figura de las tres cadenas del grupo cervical lateral profundo."},{"termino":"Cadena yugular interna","definicion":"Unos 30 ganglios junto a la vena yugular interna; origen del tronco yugular."},{"termino":"Cadena del nervio espinal","definicion":"Unos 20 ganglios bajo ECOM, escaleno y trapecio."},{"termino":"Cadena cervical transversa","definicion":"Base del triángulo; sigue la arteria transversa cervical sobre el escaleno anterior."},{"termino":"Ganglio de Virchow","definicion":"Supraclavicular principal o nódulo de Troisier."},{"termino":"Supratrocleares","definicion":"Ganglios sobre el epicóndilo medial junto a la vena basílica."},{"termino":"Vía de Caplan","definicion":"Cadena interpectoral de escape posterior del hombro (60 %)."},{"termino":"Vía de Mascagni","definicion":"Salida de la corriente cefálica por encima de la clavícula a la cadena cervical transversa."},{"termino":"Tronco subclavio","definicion":"Tronco formado por los ganglios axilares apicales."},{"termino":"Ganglio de Cloquet","definicion":"Inguinal profundo constante (o de Rosenmüller)."},{"termino":"Ganglios de relevo","definicion":"Ganglios profundos intercalados en colectores satélites (tibiales, peroneo, femoral)."},{"termino":"Cadenas de Winckler","definicion":"Cadenas paratraqueales que reciben los mediastínicos intermedios."},{"termino":"Cisterna de Pecquet","definicion":"Origen del conducto torácico, en L1 tras la aorta."}],"fuentes":["T2- Anatomía del Sistema Linfático (II) (Universidad Europea)."],"qcm":[{"pregunta":"¿Qué estructuras forman el vértice superior del triángulo de Rouvière?","opciones":["Cadena yugular anterior y cadena yugular externa","Cadena yugular interna y cadena del nervio espinal","Ganglios occipitales y mastoideos","Cadena cervical transversa y ganglios supraclaviculares"],"correcta":1,"explicacion":"El vértice lo forman la cadena yugular interna y la del nervio espinal; la base es la cadena cervical transversa.","por_opcion":["❌ Son cadenas superficiales, no del grupo lateral profundo.","✅ Definición literal.","❌ Son grupos pericervicales que drenan a la cadena del espinal.","❌ La cervical transversa es la base."]},{"pregunta":"La parte externa de los párpados y la glándula lagrimal drenan a los ganglios:","opciones":["Submaxilares","Mastoideos","Submentonianos","Parotídeos"],"correcta":3,"explicacion":"Los parotídeos reciben la parte externa de párpados, conjuntiva y glándula lagrimal; la parte interna va a los submaxilares.","por_opcion":["❌ Reciben la parte interna de los párpados.","❌ Reciben región parietal, pabellón y mastoides.","❌ Reciben mentón, labio inferior central y punta de la lengua.","✅ Territorio parotídeo."]},{"pregunta":"¿Qué ganglios reciben la linfa de la parte central del labio inferior y la punta de la lengua?","opciones":["Submentonianos","Submaxilares","Retrofaríngeos","Parotídeos profundos"],"correcta":0,"explicacion":"Los submentonianos drenan la parte central del labio inferior, mentón, encías de incisivos inferiores, suelo de la boca y punta de la lengua.","por_opcion":["✅ Territorio submentoniano.","❌ Reciben la parte lateral del labio inferior.","❌ Son yuxtaviscerales faríngeos.","❌ No reciben esas zonas."]},{"pregunta":"Los ganglios medios de la cadena del nervio espinal están cubiertos por el músculo:","opciones":["Esternocleidomastoideo","Trapecio","Escaleno","Omohioideo"],"correcta":2,"explicacion":"Superiores bajo el ECOM, medios bajo el escaleno, inferiores bajo el trapecio.","por_opcion":["❌ Cubre los superiores.","❌ Cubre los inferiores.","✅ Cubre los medios.","❌ No se menciona."]},{"pregunta":"¿Dónde desemboca el tronco yugular izquierdo?","opciones":["En la cisterna de Pecquet","En la gran vena linfática","En el cayado del conducto torácico","En el tronco broncomediastínico izquierdo"],"correcta":2,"explicacion":"El tronco yugular izquierdo desemboca en el cayado del conducto torácico; el derecho en el ángulo venoso o la gran vena linfática.","por_opcion":["❌ La cisterna recibe los troncos lumbares e intestinal.","❌ Destino del tronco yugular derecho.","✅ Literal del tema.","❌ No es su desembocadura."]},{"pregunta":"¿Qué grupo axilar es el más numeroso y forma el tronco subclavio?","opciones":["Lateral o humeral","Central","Apical","Posterior o subescapular"],"correcta":2,"explicacion":"Los apicales (6–12) son los más numerosos y convergen formando el tronco subclavio.","por_opcion":["❌ Tiene 4–6 ganglios.","❌ Es el menos numeroso (3–4).","✅ Literal del tema.","❌ Tiene 6–7 ganglios y drena a central y apical."]},{"pregunta":"Los ganglios axilares laterales o humerales reciben la linfa de la mayor parte del miembro superior EXCEPTO:","opciones":["La cara cubital del antebrazo","La vía basílica","Los ganglios supratrocleares","La vía de la vena cefálica"],"correcta":3,"explicacion":"Los laterales reciben la mayor parte del MS excepto lo que sigue a la vena cefálica, que va a infraclaviculares/apicales o a la vía de Mascagni.","por_opcion":["❌ La cubital sigue la basílica hacia la axila.","❌ La basílica sí llega a la axila.","❌ Los supratrocleares drenan a los axilares.","✅ La cefálica es la excepción."]},{"pregunta":"La glándula mamaria drena fundamentalmente a los ganglios axilares:","opciones":["Laterales o humerales","Centrales","Posteriores o subescapulares","Anteriores o pectorales"],"correcta":3,"explicacion":"El grupo anterior o pectoral, en el borde lateral del pectoral menor, recibe la pared anterolateral del tórax y la glándula mamaria.","por_opcion":["❌ Reciben el miembro superior.","❌ Reciben de los otros grupos axilares.","❌ Reciben espalda, hombro y cuello posteroinferior.","✅ Literal del tema."]},{"pregunta":"¿En qué porcentaje de personas está presente la vía de Caplan?","opciones":["60 %","20 %","40 %","80 %"],"correcta":0,"explicacion":"La corriente interpectoral de Caplan está presente en un 60 % de las personas.","por_opcion":["✅ Dato literal.","❌ Inferior al dato.","❌ Inferior al dato.","❌ Superior al dato; además el 80 % es la cifra del retorno venoso profundo."]},{"pregunta":"La vía de Mascagni corresponde a:","opciones":["El paso de la corriente basílica a los supratrocleares","La conexión de los poplíteos con los inguinales profundos","La cadena interpectoral del hombro posterior","La terminación de la vía cefálica sobre la clavícula en la cadena cervical transversa"],"correcta":3,"explicacion":"La vía cefálica termina en los infraclaviculares o, punteando la clavícula por arriba, en la cadena cervical transversa: vía de Mascagni.","por_opcion":["❌ No describe Mascagni.","❌ No tiene relación con el miembro superior.","❌ Esa es la vía de Caplan.","✅ Literal del tema."]},{"pregunta":"En el antebrazo, el grupo de colectores que proviene de pulgar e índice acompaña a la vena:","opciones":["Cubital profunda","Cefálica","Mediana","Basílica"],"correcta":1,"explicacion":"Grupo externo (pulgar e índice) → vena cefálica; interno (meñique y anular) → basílica; medial anterior (palma) → mediana.","por_opcion":["❌ No se describe.","✅ Grupo externo.","❌ La acompaña el grupo medial anterior.","❌ La acompaña el grupo interno."]},{"pregunta":"¿A dónde drenan los vasos eferentes de los ganglios poplíteos?","opciones":["Directamente a los inguinales profundos","A los ganglios tibiales de relevo","A los ilíacos externos","A los inguinales superficiales inferiores"],"correcta":0,"explicacion":"Los eferentes poplíteos drenan directamente en los ganglios inguinales profundos.","por_opcion":["✅ Literal del tema.","❌ Los de relevo están intercalados en colectores profundos, no son su destino.","❌ Los ilíacos externos reciben de los inguinales profundos.","❌ No pasan por los superficiales."]},{"pregunta":"¿Cuál es el único ganglio inguinal profundo constante?","opciones":["Ganglio de Virchow","Ganglio de Troisier","Ganglio de Rotter","Ganglio de Cloquet o Rosenmüller"],"correcta":3,"explicacion":"Entre los inguinales profundos, a lo largo del borde interno de la vena femoral, solo es constante el de Cloquet o Rosenmüller.","por_opcion":["❌ Es supraclavicular.","❌ Troisier es sinónimo de Virchow.","❌ Los de Rotter son interpectorales.","✅ Literal del tema."]},{"pregunta":"Los ganglios inguinales superficiales superiores o externos reciben la linfa de:","opciones":["El tercio inferior de la vagina y el útero","La pared abdominal infraumbilical y genitales externos","La rodilla y el hueco poplíteo","La corriente safena mayor de toda la extremidad"],"correcta":1,"explicacion":"Los superiores/externos, bajo el ligamento inguinal, reciben región glútea externa, pared abdominal infraumbilical, genitales externos y parte del conducto anal.","por_opcion":["❌ Los genitales internos van a los inguinales profundos.","✅ Territorio descrito.","❌ Es territorio poplíteo.","❌ La corriente safena mayor va a los inferiores/internos."]},{"pregunta":"Los ganglios intercostales superiores (3–4 primeros espacios) drenan en:","opciones":["El tronco broncomediastínico hacia el conducto linfático derecho","La cisterna de Pecquet mediante un colector transdiafragmático","Los ganglios frénicos superiores","Los ganglios paraesternales"],"correcta":0,"explicacion":"Los superiores drenan al tronco broncomediastínico (conducto linfático derecho); los inferiores forman un colector único que cruza el diafragma hasta la cisterna de Pecquet.","por_opcion":["✅ Literal del tema.","❌ Ese es el destino de los intercostales inferiores.","❌ Los frénicos drenan el diafragma.","❌ Los paraesternales son otra cadena parietal."]}],"asignatura":"Drenaje linfático","tema":2.2,"fecha":"2026-11-09"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips">${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
