<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Edemas (II): linfedemas especiales · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Edemas (II): linfedemas especiales","subtitulo":"Linfedema genital, de la mama, de cabeza-cara-cuello y secundario maligno: características, clasificaciones y tratamiento conservador y quirúrgico con DLM.","resumen":["El **linfedema genital** puede ser **primario** (linfodisplasia) o **secundario** (exéresis ganglionar y radioterapia), tiene una incidencia de **100 casos/100.000 habitantes y año**, está **infradiagnosticado** y su tratamiento conservador es **DLM + vendaje**, con **presoterapia contraindicada**.","Su DLM sigue la secuencia **cuello → ejercicios respiratorios → ganglios axilares bilaterales → abdominal profundo → zona suprapúbica → escroto hacia el peritoneo**, y se clasifica en tipos **I, IIA, IIB, IIC y III** distintos en varón y mujer.","El **linfedema de la mama** es más frecuente **tras radioterapia**, se relaciona con el **IMC**, tiene **3 estadios** (el III con **dolor nocturno**) y su DLM empieza por cuello y respiración y drena hacia la **axila contralateral** y el **inguinal homolateral**.","El **linfedema de cabeza, cara y cuello** es poco frecuente, su causa secundaria más habitual es el **cáncer de laringe**, **empeora por la noche en decúbito**, se gradúa de **1 a 4** y se trata con DLM incluyendo la **cavidad bucal**, autodrenaje **15 min 3 veces al día** y dormir semisentado.","El **linfedema secundario maligno** se debe a **infiltración, obstrucción o compresión tumoral** (**0,7–9 %** de neoplasias), es **agudo, de progresión rápida y centrífuga y doloroso**, puede ser el **primer signo de recidiva** y su tratamiento es **paliativo**; DLM y presoterapia estaban tradicionalmente contraindicados por falta de evidencia."],"objetivos":["Reconocer las causas, la epidemiología y la clasificación del linfedema genital en varón y mujer.","Ordenar la secuencia de DLM y el resto del tratamiento conservador en el linfedema genital y en el de la mama.","Diferenciar los estadios del linfedema de la mama y los grados del linfedema de cabeza, cara y cuello.","Identificar los síntomas y signos del linfedema secundario maligno y adaptar los objetivos terapéuticos.","Aplicar las precauciones y contraindicaciones específicas de cada linfedema especial."],"ideas_clave":["Linfedema genital: **primario** (linfodisplasia) o **secundario** (exéresis ganglionar + radioterapia en cáncer); **100/100.000 hab./año**; infradiagnosticado, muy discapacitante, **linfangitis frecuentes**.","En el linfedema genital la **presoterapia está contraindicada**; el autodrenaje se hace **varias veces al día y siempre con guantes**.","Vendaje genital: **vendas independientes para pene y escroto**; en mujeres, **almohadillado protegido por compresas**.","Mama: **más frecuente tras radioterapia**, relacionado con el **IMC**; estadio II con **piel de naranja y fóvea positiva**; estadio III igual pero con **dolor sobre todo nocturno**.","DLM de la mama: drenar hacia la **axila contralateral** e **inguinal homolateral**, anastomosis hacia el lado sano y **posterior en decúbito lateral**; fibrosis con **círculos fijos**.","Cabeza y cuello: **Melkersson-Rosenthal** (primario), **cáncer de laringe** (secundario); **empeora de noche**; autodrenaje **15 min, 3 veces/día**; no cubrir **orificios vitales**.","Maligno: **agudo, rápido, centrífugo, doloroso**, piel **tensa, delgada y translúcida**, **linforrea** abundante; puede ser el **primer signo de recidiva o de cáncer oculto**."],"secciones":[{"id":"linfedema-genital","titulo":"Linfedema genital: características y clasificación","bloques":[{"tipo":"parrafo","texto":"El linfedema genital aparece como forma **primaria** dentro de un cuadro de **linfodisplasia**, o como forma **secundaria** tras **exéresis ganglionar y radioterapia** en el tratamiento del cáncer. Es un cuadro **infradiagnosticado**, **muy discapacitante**, con **linfangitis frecuentes** y **difícil de tratar**: la zona es húmeda, con pliegues y difícil de vendar, lo que favorece infecciones."},{"tipo":"dato","valor":"100 / 100.000","texto":"Incidencia del linfedema genital: **100 casos por 100.000 habitantes y año**."},{"tipo":"figura","pagina":3,"pie":"Linfedema genital masculino avanzado: aumento masivo del escroto con piel engrosada; fíjate en el volumen y en la alteración cutánea, que explican la discapacidad y el riesgo de linfangitis.","src":"img/drenaje-linfatico-t4.2-edemas-ii-linfedemas-especiales-p3.jpg"},{"tipo":"tabla","titulo":"Clasificación del linfedema genital","columnas":["Tipo","Varón","Mujer"],"filas":[["**I**","En **prepucio** con tejido redundante","**Linfangiectasias sin piel redundante**"],["**IIA**","Piel redundante en **pene**","Piel redundante en **labios menores**"],["**IIB**","Piel redundante en **escroto**","Piel redundante en **labios mayores**"],["**IIC**","Piel redundante en **pene y escroto**","Características de **A y B**"],["**III**","**Pene enterrado u oculto**","Piel redundante en **labios y pubis**"]]},{"tipo":"alerta","texto":"Trampa de correspondencias: en la mujer **IIA = labios menores** y **IIB = labios mayores** (en el varón IIA = pene, IIB = escroto). El **tipo I femenino** son **linfangiectasias sin piel redundante**, y el **tipo III masculino** es el **pene enterrado u oculto**."}]},{"id":"genital-tratamiento","titulo":"Linfedema genital: tratamiento","bloques":[{"tipo":"lista","items":["**DLM y vendaje**.","**Presoterapia contraindicada**.","**Autodrenaje**: debe drenarse **varias veces al día**, **siempre con guantes**.","**Evitar sobrepeso**.","**Evitar prendas que opriman la cintura**.","**Higiene exhaustiva**: buen lavado y secado."]},{"tipo":"esquema","titulo":"Secuencia de DLM en el linfedema genital","mermaid":"flowchart TD\n  A[\"1. Cuello\"] --> B[\"2. Ejercicios respiratorios\"]\n  B --> C[\"3. Ganglios axilares bilaterales\"]\n  C --> D[\"4. Tratamiento abdominal profundo\"]\n  D --> E[\"5. Zona suprapúbica\"]\n  E --> F[\"6. Escroto hacia el peritoneo\"]","pie":"Se desbloquean primero las zonas proximales (cuello, respiración, axilas, abdomen) y al final se drena la zona edematosa hacia ellas."},{"tipo":"figura","pagina":6,"pie":"Direcciones del DLM en el linfedema genital: desde escroto y región suprapúbica hacia las axilas, rodeando la raíz de los muslos.","src":"img/drenaje-linfatico-t4.2-edemas-ii-linfedemas-especiales-p6.jpg"},{"tipo":"parrafo","texto":"**Vendaje**: se usan **vendas independientes para pene y escroto**; en mujeres se emplean **materiales de almohadillado protegidos por compresas**. Después se pasa a **prendas de compresión**. El **tratamiento quirúrgico** se reserva para **cuando el tratamiento conservador no es efectivo** (p. ej. resección en la elefantiasis escrotal)."},{"tipo":"perla","texto":"En el linfedema genital la **higiene y el secado** son tan importantes como el drenaje: los pliegues húmedos favorecen las **linfangitis** recurrentes, que a su vez dañan más los linfáticos. Enseña al paciente el autodrenaje con guantes y revisa la piel en cada sesión."},{"tipo":"alerta","texto":"No confundir: en el linfedema genital la **presoterapia está contraindicada** (en el maligno solo «falta de estudios, inicialmente contraindicada»). Tampoco se empieza por la zona genital: el escroto es el **último** paso de la secuencia."}]},{"id":"linfedema-mama","titulo":"Linfedema de la mama","bloques":[{"tipo":"parrafo","texto":"El linfedema de la mama está **infradiagnosticado** y **afecta mucho a la calidad de vida**. Es **más frecuente tras radioterapia** y está **relacionado con el índice de masa corporal**: la radiación fibrosa los linfáticos y una mama voluminosa tiene más carga linfática que drenar."},{"tipo":"tabla","titulo":"Estadios del linfedema de la mama","columnas":["Estadio","Clínica"],"filas":[["**I**","**Edema ligero** y **talla normal**"],["**II**","**Edema visible**, **asimetría**, poros dilatados **«piel de naranja»**, **pesadez**, **fóvea positiva**"],["**III**","Clínicamente **parecido al II** pero con **dolor, sobre todo nocturno**"]]},{"tipo":"figura","pagina":9,"pie":"Linfedema de la mama derecha: asimetría y, en el detalle, poros dilatados con aspecto de piel de naranja (estadio II).","src":"img/drenaje-linfatico-t4.2-edemas-ii-linfedemas-especiales-p9.jpg"},{"tipo":"esquema","titulo":"Secuencia de DLM en el linfedema de la mama","mermaid":"flowchart TD\n  A[\"1. Cuello\"] --> B[\"2. Ejercicios respiratorios\"]\n  B --> C[\"3. Axila contralateral e inguinal homolateral\"]\n  C --> D[\"4. Anastomosis hacia el lado sano\"]\n  D --> D2[\"y posterior en decúbito lateral\"]\n  D2 --> E[\"5. Zonas de fibrosis con círculos fijos\"]\n  E --> F[\"Vendaje multicapa o neuromuscular\"]\n  F --> G[\"Prenda de compresión\"]","pie":"Se abren las vías de drenaje alternativas (axila sana, ingle del mismo lado, anastomosis posteriores) antes de tratar la mama."},{"tipo":"tarjetas","items":[{"etiqueta":"Vendaje 1","titulo":"Vendaje multicapa","texto":"Contención de la mama y la pared torácica tras el DLM."},{"etiqueta":"Vendaje 2","titulo":"Vendaje neuromuscular","texto":"Tiras en abanico desde la mama hacia las vías de drenaje (axila sana, zona posterior)."},{"etiqueta":"Mantenimiento","titulo":"Prenda de compresión","texto":"Sujetadores y prendas específicas para mantener el resultado."}]},{"tipo":"figura","pagina":10,"pie":"Opciones de contención en la mama: vendaje multicapa, vendaje neuromuscular en abanico hacia la axila y la espalda, y prendas de compresión.","src":"img/drenaje-linfatico-t4.2-edemas-ii-linfedemas-especiales-p10.jpg"},{"tipo":"alerta","texto":"En la mama se drena hacia la **axila contralateral** (la homolateral suele estar vaciada o irradiada) y hacia el **inguinal homolateral**. El **dolor nocturno** es lo que distingue el **estadio III** del II."}]},{"id":"cabeza-cuello","titulo":"Linfedema de cabeza, cara y cuello","bloques":[{"tipo":"parrafo","texto":"Son linfedemas **poco frecuentes**. Los **primarios** aparecen en el **síndrome de Melkersson-Rosenthal** (edema labial, parálisis facial y lengua escrotal) o **asociados a linfedema de miembro superior**. Los **secundarios** se deben a **procesos oncológicos**, sobre todo al **cáncer de laringe**."},{"tipo":"definicion","termino":"Síndrome de Melkersson-Rosenthal","texto":"Causa de linfedema facial **primario** caracterizada por la tríada **edema labial, parálisis facial y lengua escrotal**."},{"tipo":"tabla","titulo":"Grados del linfedema de cabeza, cara y cuello","columnas":["Grado","Descripción"],"filas":[["**1**","Linfedema facial o de cuello **localizado sin déficit funcional**"],["**2**","Localizado **con déficit funcional** asociado"],["**3**","Localizado con déficit funcional: **déficit de movilidad cervical y de apertura de la boca**"],["**4**","**Edema generalizado** con **úlceras y/o edema cerebral**, pacientes **intubados** y con **limitación de la alimentación oral**"]]},{"tipo":"parrafo","texto":"El edema **aumenta durante el decúbito**, por lo que **empeora por la noche** y **mejora durante el día** gracias a la bipedestación (la gravedad favorece el drenaje cefálico). La cara tiene una **superficie irregular** y **orificios vitales que no deben cubrirse**, lo que complica vendajes y prendas."},{"tipo":"dato","valor":"15 min × 3/día","texto":"Pauta de **autodrenaje** a enseñar en el linfedema de cabeza y cuello: **15 minutos, 3 veces al día**."},{"tipo":"lista","items":["**DLM**, importante tratar la **cavidad bucal** y usar una **postura que favorezca la gravedad**.","**Ejercicios de mímica facial**.","**Vendajes faciales**.","**Prendas de compresión especiales** (**mal toleradas**).","**Correcta higiene bucal**.","**Normas posturales**: dormir **semisentado** o con **elevación de la cabeza**.","**Tratamiento quirúrgico**: **en estudio**, para realizar **anastomosis linfovenulares**."]},{"tipo":"perla","texto":"En un paciente laringectomizado con traqueostoma, cualquier vendaje o prenda debe dejar libres **traqueostoma, boca, nariz y ojos**; prioriza DLM intrabucal, mímica facial y la posición semisentada nocturna, ya que las prendas faciales se toleran mal."},{"tipo":"alerta","texto":"Al contrario que en los miembros inferiores, el linfedema facial **empeora de noche** (decúbito) y **mejora de día**. La causa secundaria más frecuente es el **cáncer de laringe**, no el de mama."}]},{"id":"secundario-maligno","titulo":"Linfedema secundario maligno","bloques":[{"tipo":"definicion","termino":"Linfedema secundario maligno","texto":"Alteración del flujo linfático debida a **infiltración, obstrucción o compresión** de los vasos y/o ganglios linfáticos por **acción directa de un tumor maligno**, incluida la **infiltración tumoral de los linfáticos cutáneos**."},{"tipo":"dato","valor":"0,7 – 9 %","texto":"Frecuencia del linfedema maligno en **pacientes con neoplasias malignas**; más frecuente en **cáncer de mama, melanoma y tumores ginecológicos**."},{"tipo":"parrafo","texto":"Puede ser el **primer signo de una recidiva tumoral** o de un **cáncer oculto o desconocido**. Es una **enfermedad crónica con mal pronóstico**, por lo que el **diagnóstico temprano** es fundamental: ante un linfedema de aparición brusca, rápido y doloroso, el fisioterapeuta debe derivar."},{"tipo":"tabla","titulo":"Síntomas y signos del linfedema maligno","columnas":["Síntomas","Signos"],"filas":[["**Agudo**","Miembro **tenso** con **piel delgada y translúcida**"],["**Progresión rápida y centrífuga**","**Fóvea positiva**"],["**Con dolor**","Consistencia que puede ser **dura** con **placas extensas de fibrosis**"],["Dolor que **puede ser neuropático**","**Rigidez articular y músculo-tendinosa**"],["**Debilidad e impotencia funcional** del miembro","**Úlceras cutáneas**"],["—","**Linforrea** abundante, gran malestar"]]},{"tipo":"figura","pagina":16,"pie":"Linfedema maligno de miembro inferior con lesiones cutáneas violáceas (angiosarcoma sobre linfedema crónico): observa la piel tensa y alterada.","src":"img/drenaje-linfatico-t4.2-edemas-ii-linfedemas-especiales-p16.jpg"},{"tipo":"esquema","titulo":"Decisión clínica ante un linfedema sospechoso de malignidad","mermaid":"flowchart TD\n  A[\"Linfedema de inicio agudo\"] --> B{\"Rápido, centrífugo y doloroso\"}\n  B -->|\"sí\"| C[\"Sospecha de malignidad o recidiva\"]\n  C --> D[\"Derivar para diagnóstico temprano\"]\n  D --> E{\"Tratamiento oncológico activo\"}\n  E -->|\"sí o no\"| F[\"Objetivos según situación del paciente\"]\n  F --> G[\"Paliativo: alivio de síntomas e impotencia funcional\"]\n  G --> H[\"DLM con anastomosis, vendaje multicapa, ejercicio, piel, prenda\"]","pie":"Los objetivos dependen de si hay tratamiento oncológico o no; con frecuencia son paliativos."},{"tipo":"parrafo","texto":"**Tratamiento**: el **DLM estaba tradicionalmente contraindicado**, aunque **falta evidencia** y hay pocos estudios. Los **objetivos** dependen de la situación del paciente (si recibe tratamiento oncológico o no), a menudo **paliativos**: **alivio de síntomas** y **mejoría de la impotencia funcional**. Medios: **DLM (anastomosis)**, **vendaje multicapa + ejercicio físico + cuidado de la piel**, **prenda de contención** y **presoterapia** (falta de estudios, **inicialmente contraindicada**)."},{"tipo":"perla","texto":"En el linfedema maligno el DLM se orienta a **anastomosis** hacia territorios sanos, sin insistir sobre la zona tumoral; el cuidado de la piel es clave por las **úlceras** y la **linforrea**."},{"tipo":"alerta","texto":"El linfedema maligno se distingue del benigno por ser **agudo, rápidamente progresivo, centrífugo y doloroso**. El temario no dice que el DLM esté «absolutamente contraindicado» hoy: era **tradicionalmente** contraindicado y **falta evidencia**."}]}],"caso_clinico":{"titulo":"Linfedema de mama tras cáncer","presentacion":"Mujer de 56 años, IMC 31, tratada hace 14 meses de un cáncer de mama derecha con tumorectomía, vaciamiento axilar derecho y radioterapia. Consulta por pesadez en la mama derecha, asimetría visible, poros dilatados y fóvea positiva; desde hace dos semanas refiere además dolor que la despierta por la noche y un aumento rápido del edema hacia el brazo.","preguntas":[{"pregunta":"¿En qué estadio situarías su linfedema de mama y por qué?","respuesta":"Por la clínica del estadio II (edema visible, asimetría, piel de naranja, pesadez, fóvea positiva) más **dolor sobre todo nocturno**, correspondería al **estadio III**. Radioterapia e IMC elevado son factores relacionados."},{"pregunta":"¿Qué dato te haría derivar antes de iniciar el tratamiento?","respuesta":"La aparición **aguda**, la **progresión rápida y centrífuga** y el **dolor** sugieren un posible **linfedema secundario maligno**, que puede ser el **primer signo de recidiva**: requiere diagnóstico temprano."},{"pregunta":"Si se descarta la recidiva, ¿cómo ordenarías el DLM?","respuesta":"Cuello → ejercicios respiratorios → **axila contralateral e inguinal homolateral** → anastomosis hacia el lado sano y posteriores en decúbito lateral → zonas de fibrosis con **círculos fijos**; después vendaje multicapa o neuromuscular y prenda de compresión."}]},"preguntate":[{"pregunta":"¿Cuáles son las causas primaria y secundaria del linfedema genital?","respuesta":"Primaria: linfodisplasia. Secundaria: exéresis ganglionar y radioterapia en el tratamiento del cáncer."},{"pregunta":"Describe los tipos I y III del linfedema genital en ambos sexos.","respuesta":"Tipo I: varón, prepucio con tejido redundante; mujer, linfangiectasias sin piel redundante. Tipo III: varón, pene enterrado u oculto; mujer, piel redundante en labios y pubis."},{"pregunta":"Enumera la secuencia de DLM en el linfedema genital.","respuesta":"Cuello, ejercicios respiratorios, ganglios axilares bilaterales, abdominal profundo, zona suprapúbica y escroto hacia el peritoneo."},{"pregunta":"¿Qué medidas conservadoras complementan el DLM en el linfedema genital?","respuesta":"Vendaje (vendas independientes pene/escroto, almohadillado en mujer), autodrenaje varias veces al día con guantes, evitar sobrepeso y prendas que opriman la cintura, higiene exhaustiva; presoterapia contraindicada."},{"pregunta":"¿Qué distingue los estadios II y III del linfedema de la mama?","respuesta":"Ambos tienen edema visible, asimetría, piel de naranja, pesadez y fóvea positiva; el III añade dolor, sobre todo nocturno."},{"pregunta":"¿Hacia dónde se drena en el linfedema de la mama?","respuesta":"Hacia la axila contralateral y el inguinal homolateral, con anastomosis hacia el lado sano y posteriores en decúbito lateral."},{"pregunta":"¿Por qué el linfedema facial empeora por la noche y qué norma postural se da?","respuesta":"Porque aumenta en decúbito al perder la ayuda de la gravedad; se recomienda dormir semisentado o con la cabeza elevada."},{"pregunta":"Describe el grado 4 del linfedema de cabeza y cuello.","respuesta":"Edema generalizado asociado a úlceras y/o edema cerebral, en pacientes intubados y con limitación de la alimentación oral."},{"pregunta":"¿Qué síntomas sugieren un linfedema secundario maligno?","respuesta":"Inicio agudo, progresión rápida y centrífuga, dolor (a veces neuropático), debilidad e impotencia funcional."},{"pregunta":"¿Cuál es el planteamiento del tratamiento en el linfedema maligno?","respuesta":"Objetivos según la situación oncológica, a menudo paliativos; DLM con anastomosis, vendaje multicapa, ejercicio, cuidado de la piel y prenda; DLM y presoterapia tradicionalmente contraindicados por falta de evidencia."}],"glosario":[{"termino":"Linfodisplasia","definicion":"Malformación del sistema linfático que causa linfedema primario."},{"termino":"Linfangitis","definicion":"Infección/inflamación de los vasos linfáticos, frecuente en el linfedema genital."},{"termino":"Linfangiectasia","definicion":"Dilatación de vasos linfáticos; define el tipo I del linfedema genital femenino."},{"termino":"Piel de naranja","definicion":"Aspecto cutáneo con poros dilatados por edema dérmico; típico del estadio II de la mama."},{"termino":"Fóvea","definicion":"Depresión que persiste tras presionar un tejido edematoso."},{"termino":"Anastomosis linfática","definicion":"Vía de comunicación hacia territorios linfáticos sanos que se aprovecha en el DLM."},{"termino":"Círculos fijos","definicion":"Maniobra de DLM empleada sobre zonas de fibrosis."},{"termino":"Melkersson-Rosenthal","definicion":"Síndrome con edema labial, parálisis facial y lengua escrotal; causa de linfedema facial primario."},{"termino":"Anastomosis linfovenular","definicion":"Técnica quirúrgica que une linfáticos y vénulas; en estudio para el linfedema de cabeza y cuello."},{"termino":"Linforrea","definicion":"Salida de linfa a través de la piel; abundante en el linfedema maligno."},{"termino":"Progresión centrífuga","definicion":"Avance del edema desde la raíz hacia la periferia del miembro; típico del linfedema maligno."}],"fuentes":["Guía de linfedema, segunda edición, 2017","Resende JHC, Ern AL, Correia JAB, Paz JA. Rev. Bras. Cir. Plást. 2006;21(4):217-226","Recalde-Losada C et al. (2014). Cirugía Plástica Ibero-Latinoamericana, 40(2), 205-212","Rodríguez-Bujaldón A et al. (2006). Actas Dermo-Sifiliográficas, 97(8), 525-528","T4: Edemas (II): linfedemas especiales — Drenaje linfático manual, Universidad Europea"],"qcm":[{"pregunta":"En el tratamiento conservador del linfedema genital, ¿qué medida está contraindicada?","opciones":["Autodrenaje varias veces al día","Presoterapia","Vendaje independiente de pene y escroto","Prendas de compresión"],"correcta":1,"explicacion":"El temario indica DLM y vendaje, autodrenaje con guantes, evitar sobrepeso y prendas que opriman la cintura e higiene exhaustiva; la presoterapia está contraindicada.","por_opcion":["❌ Se recomienda, siempre con guantes.","✅ Contraindicada.","❌ Es la forma indicada de vendar.","❌ Forman parte del tratamiento conservador."]},{"pregunta":"¿Cuál es el último paso de la secuencia de DLM en el linfedema genital?","opciones":["Escroto hacia el peritoneo","Ganglios axilares bilaterales","Zona suprapúbica","Tratamiento abdominal profundo"],"correcta":0,"explicacion":"Secuencia: cuello, ejercicios respiratorios, axilares bilaterales, abdominal profundo, suprapúbica y, finalmente, escroto hacia el peritoneo.","por_opcion":["✅ Sexto y último.","❌ Es el tercer paso.","❌ Es el quinto paso.","❌ Es el cuarto paso."]},{"pregunta":"En la clasificación del linfedema genital femenino, el tipo IIB corresponde a:","opciones":["Linfangiectasias sin piel redundante","Piel redundante en labios menores","Piel redundante en labios mayores","Piel redundante en labios y pubis"],"correcta":2,"explicacion":"En la mujer: I linfangiectasias sin piel redundante, IIA labios menores, IIB labios mayores, IIC características de A y B, III labios y pubis.","por_opcion":["❌ Es tipo I.","❌ Es IIA.","✅ IIB.","❌ Es tipo III."]},{"pregunta":"Un varón con linfedema genital presenta pene enterrado. Según la clasificación es tipo:","opciones":["I","III","IIC","IIA"],"correcta":1,"explicacion":"En el varón el tipo III corresponde a pene enterrado u oculto; IIC es piel redundante en pene y escroto.","por_opcion":["❌ I: prepucio con tejido redundante.","✅ III.","❌ IIC: pene y escroto.","❌ IIA: piel redundante en pene."]},{"pregunta":"¿Qué dato epidemiológico da el temario para el linfedema genital?","opciones":["0,7–9 % de los pacientes oncológicos","100 casos/100.000 habitantes y año","10 casos/100.000 habitantes y año","1 caso/10.000 habitantes y año"],"correcta":1,"explicacion":"La incidencia del linfedema genital es de 100 casos por 100.000 habitantes y año, y está infradiagnosticado.","por_opcion":["❌ Es la frecuencia del linfedema maligno.","✅ Dato literal.","❌ Cifra diez veces menor.","❌ No es la cifra del temario."]},{"pregunta":"Una paciente con linfedema de mama tiene edema visible, piel de naranja, fóvea positiva y dolor que la despierta por la noche. Su estadio es:","opciones":["IV","I","II","III"],"correcta":3,"explicacion":"El estadio III es clínicamente parecido al II pero con dolor, sobre todo nocturno.","por_opcion":["❌ El temario describe solo tres estadios para la mama.","❌ I: edema ligero y talla normal.","❌ El II no incluye dolor nocturno.","✅ III."]},{"pregunta":"En el DLM del linfedema de la mama, tras cuello y ejercicios respiratorios se trabaja:","opciones":["Axila contralateral e inguinal homolateral","Zona suprapúbica y abdomen profundo","Ganglios axilares bilaterales","Axila homolateral e inguinal contralateral"],"correcta":0,"explicacion":"La secuencia es cuello, respiratorios, axila contralateral e inguinal homolateral, anastomosis hacia el lado sano y posterior en decúbito lateral, y fibrosis con círculos fijos.","por_opcion":["✅ Paso 3 de la secuencia.","❌ Corresponde a la secuencia genital.","❌ Corresponde a la secuencia genital.","❌ Lados invertidos."]},{"pregunta":"Según el temario, las zonas de fibrosis del linfedema de la mama se tratan con:","opciones":["Presoterapia secuencial","Vendaje neuromuscular exclusivo","Bombeos en dirección distal","Círculos fijos"],"correcta":3,"explicacion":"El último paso del DLM en la mama es el tratamiento de las zonas de fibrosis con círculos fijos.","por_opcion":["❌ No figura en la secuencia de la mama.","❌ El vendaje es complementario, no la técnica para la fibrosis.","❌ No es la maniobra indicada.","✅ Círculos fijos."]},{"pregunta":"¿Qué factor relaciona el temario con el linfedema de la mama?","opciones":["El índice de masa corporal","La ausencia de radioterapia","La quimioterapia exclusiva","La edad menor de 40 años"],"correcta":0,"explicacion":"Es más frecuente tras radioterapia y está relacionado con el índice de masa corporal.","por_opcion":["✅ IMC.","❌ Es al revés: más frecuente tras radioterapia.","❌ El factor destacado es la radioterapia.","❌ No se menciona la edad."]},{"pregunta":"La tríada edema labial, parálisis facial y lengua escrotal corresponde a:","opciones":["Linfedema secundario a cáncer de laringe","Linfedema facial grado 4","Linfedema maligno cutáneo","Síndrome de Melkersson-Rosenthal"],"correcta":3,"explicacion":"El síndrome de Melkersson-Rosenthal es una causa de linfedema primario de cabeza, cara y cuello.","por_opcion":["❌ Es causa secundaria, sin esta tríada.","❌ El grado 4 implica edema generalizado, úlceras o edema cerebral.","❌ No se define por esta tríada.","✅ Melkersson-Rosenthal."]},{"pregunta":"Un paciente con linfedema facial tiene déficit de movilidad cervical y de apertura de la boca, sin úlceras. Su grado es:","opciones":["1","4","3","2"],"correcta":2,"explicacion":"El grado 3 es linfedema localizado con déficit funcional asociado concretado en movilidad cervical y apertura de la boca.","por_opcion":["❌ Grado 1: sin déficit funcional.","❌ Grado 4: generalizado, úlceras y/o edema cerebral.","✅ Grado 3.","❌ Grado 2: déficit funcional sin especificar estos déficits."]},{"pregunta":"¿Qué pauta de autodrenaje se enseña en el linfedema de cabeza y cuello?","opciones":["15 minutos, 3 veces al día","30 minutos, 1 vez al día","5 minutos, 6 veces al día","10 minutos, 2 veces al día"],"correcta":0,"explicacion":"El temario indica enseñar autodrenaje durante 15 minutos 3 veces al día, junto con higiene bucal y dormir semisentado.","por_opcion":["✅ Dato literal.","❌ No es la pauta.","❌ No es la pauta.","❌ No es la pauta."]},{"pregunta":"¿Por qué el linfedema de cabeza y cuello empeora por la noche?","opciones":["Por el ritmo circadiano de la linfa","Por la retirada de la prenda compresiva","Por el aumento de la presión arterial nocturna","Porque aumenta durante el decúbito"],"correcta":3,"explicacion":"Aumenta durante el decúbito, por lo que empeora de noche y mejora durante el día con la bipedestación; de ahí dormir semisentado.","por_opcion":["❌ No es el mecanismo descrito.","❌ Las prendas faciales son mal toleradas, pero no es la explicación.","❌ No es el mecanismo del temario.","✅ Efecto postural."]},{"pregunta":"Respecto al linfedema secundario maligno, ¿qué afirmación es correcta?","opciones":["Cursa siempre sin dolor","Afecta a más del 20 % de neoplasias","Puede ser el primer signo de recidiva","Es crónico, lento y centrípeto"],"correcta":2,"explicacion":"Puede ser el primer signo de una recidiva tumoral o de un cáncer oculto; afecta al 0,7–9 % de neoplasias y es agudo, rápido, centrífugo y doloroso.","por_opcion":["❌ Cursa con dolor, a veces neuropático.","❌ La cifra es 0,7–9 %.","✅ Dato del temario.","❌ Es agudo, rápido y centrífugo."]},{"pregunta":"¿Qué signo cutáneo describe el temario en el linfedema maligno?","opciones":["Piel gruesa, seca y opaca","Piel de naranja sin fóvea","Hiperqueratosis con papilomatosis","Piel delgada y translúcida en miembro tenso"],"correcta":3,"explicacion":"Signos: miembro tenso con piel delgada y translúcida, fóvea positiva, posibles placas de fibrosis, rigidez, úlceras y linforrea abundante.","por_opcion":["❌ No es la descripción del temario.","❌ La fóvea es positiva.","❌ No se describe en el linfedema maligno.","✅ Signo característico."]}],"asignatura":"Drenaje linfático","tema":4.2,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>
(function(){

const secs = F.secciones || [];

function bloque(b){

    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;

    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}

  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">

  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}

  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */

  const els=[...document.querySelectorAll('pre.mermaid')];

      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');

try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
