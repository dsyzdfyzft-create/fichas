<style>

:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;

*,*::before,*::after{box-sizing:inherit}

.env{max-width:860px;margin:0 auto;padding:0 22px}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}

.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}

.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}

/* navegación */

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}

.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}

p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}

/* código de colores */

.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}

.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}

.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */

ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}

.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}

.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}

<script id="datos" type="application/json">{"titulo":"Tema 4.3: Edemas (III) – lipedema, otros edemas y fisioterapia dermatofuncional","subtitulo":"El lipedema como trastorno doloroso y bilateral de la distribución de la grasa: cómo reconocerlo, diferenciarlo del linfedema y tratarlo; la retención de líquidos por mala circulación y la fisioterapia dermatofuncional.","resumen":["El **lipedema** es un **trastorno de la distribución del tejido graso**, sobre todo en MMII, de causa desconocida pero **relacionado con problemas hormonales** (afecta al **16 % de las mujeres**) y reconocido como enfermedad por la **OMS en 2018**.","Se caracteriza por ser **bilateral y simétrico**, evolucionar de **proximal a distal** (cresta ilíaca → tobillo) **respetando pies y manos** (signo del «hombro inverso»), con **aspecto de columna**, **hematomas fáciles**, **dolor/alodinia**, **Stemmer negativo**, **fóvea negativa** y **sin mejoría con el reposo nocturno**.","Su diagnóstico es **clínico** (historia y examen físico, **test de la pinza rodada positivo**) y debe diferenciarse del **linfedema** (unilateral, pies afectados, Stemmer +, sin dolor), de la **insuficiencia venosa crónica**, de la **enfermedad de Dercum**, de la fibromialgia y de la obesidad.","Se describen **5 tipos topográficos** (I caderas-nalgas, II caderas-rodillas, III caderas-tobillos, IV brazos o pantorrillas, V caderas-tobillos y brazos) y **3 estadios cutáneos** (piel de naranja, piel de colchón, piel ondeada con gran deformidad), además de formas mixtas (**flebolipedema, lipoflebolinfedema**).","El tratamiento conservador es la **TDC** (DLM, presoterapia, **compresión**, movilizaciones, ejercicio aeróbico, vendaje multicapa nocturno), control de peso (**IMC ≤ 25**) y nutrición antiinflamatoria; el quirúrgico es la **liposucción tumescente microcanular** con TDC **antes y después**; la **fisioterapia dermatofuncional** (Brasil, 1997) aborda el sistema tegumentario con técnicas manuales y aparatología."],"objetivos":["Definir el lipedema y enumerar sus características clínicas y su perfil epidemiológico.","Aplicar los criterios diagnósticos (historia, examen físico, pinza rodada) y diferenciar lipedema de linfedema, insuficiencia venosa crónica, Dercum y obesidad.","Clasificar el lipedema por tipos topográficos y estadios cutáneos y reconocer las formas mixtas.","Diseñar el tratamiento conservador y conocer las indicaciones y límites de la liposucción.","Describir la retención de líquidos por mala circulación y los fundamentos, técnicas y efectos de la fisioterapia dermatofuncional."],"ideas_clave":["Lipedema = trastorno de la **distribución de la grasa**, **bilateral y simétrico**, casi exclusivo de **mujeres** (16 %), relacionado con **hormonas**; enfermedad para la **OMS desde 2018**.","**Respeta pies y manos** → «hombro inverso» / «aspecto de columna»; evoluciona de **proximal a distal**.","**Stemmer negativo** (lipedema puro), **fóvea negativa** o de desaparición inmediata, **no mejora con el reposo nocturno** ni con elevación o pérdida de peso.","**Dolor** sordo y pesado, sobre todo femoral y tibial anterior, con **alodinia**; **hematomas fáciles** por fragilidad capilar; **no hay erisipelas**.","**Test de la pinza rodada positivo**: consistencia más compacta, peor rodamiento y dolor.","Tipos I–V (el IV puede ser brazos o pantorrillas y suele pasar a III o V) y estadios 1–3 (naranja, colchón, ondeada).","Las **dietas no suelen ser eficaces** para la grasa del lipedema, pero el control del peso ayuda (no superar **IMC 25**).","La **liposucción tumescente microcanular** busca **reducir el dolor y mejorar la calidad de vida**, no quitar mucha grasa; siempre **TDC antes y después**."],"secciones":[{"id":"lipedema-definicion","titulo":"Lipedema: definición y características clínicas","bloques":[{"tipo":"definicion","termino":"Lipedema","texto":"**Trastorno de la distribución del tejido graso** que afecta **principalmente a los miembros inferiores**. Su causa exacta se desconoce, pero se relaciona con **problemas hormonales**, por lo que predomina en **mujeres**. Fue **declarado enfermedad por la OMS en 2018**."},{"tipo":"dato","valor":"16 %","texto":"Prevalencia del lipedema en mujeres según el PDF."},{"tipo":"dato","valor":"OMS 2018","texto":"Año en que la OMS declaró el lipedema como enfermedad."},{"tipo":"parrafo","texto":"El tejido graso del lipedema no es una simple acumulación de grasa normal: la imagen del PDF compara la grasa normal (homogénea) con la **grasa del lipedema**, más fibrosa, nodular y vascularizada. Esto explica por qué **no responde a la dieta** como la grasa de la obesidad y por qué duele: el tejido es anómalo, frágil y sensible."},{"tipo":"tabla","titulo":"Características clínicas del lipedema","columnas":["Rasgo","Qué se observa","Por qué importa"],"filas":[["Evolución","De **proximal a distal**, desde la **cresta ilíaca hasta el tobillo**","Opuesto al linfedema, que suele empezar distal"],["Pies y dedos","**No afectados**","Clave frente al linfedema"],["Forma","MMII con **aspecto de columna**; desproporción tronco/miembros","Ganancia desproporcionada en miembros"],["Piel / vasos","**Fragilidad capilar → hematomas**","Moratones con traumatismos mínimos"],["Síntomas","**Pesadez**, tensión y tirantez; **doloroso** e **infradiagnosticado**","La obesidad no duele"],["Bipedestación","Clara **tendencia al edema** en ortostatismo","Componente edematoso asociado"],["Stemmer","**Negativo** en lipedema puro","Positivo = linfedema"],["Infecciones","**No presenta erisipelas** ni infecciones frecuentes","Las erisipelas orientan a linfedema"],["Fóvea","**Negativa** o de desaparición inmediata","No hay edema rico en proteínas"],["Reposo","**No mejora con el reposo nocturno**","La grasa no se moviliza con la elevación"],["Lateralidad","**Bilateral**","Linfedema: unilateral o asimétrico"]]},{"tipo":"figura","pagina":3,"pie":"Rasgos del lipedema sobre la silueta: proporciones desiguales, moratones, grandes variaciones de perímetro, dolor punzante y a la presión, piernas pesadas y pies sin hinchazón.","src":"img/drenaje-linfatico-t4.3-tema-4-3-edemas-iii-lipedema-otros-edemas-y-fisioterapia-der-p3.jpg"},{"tipo":"parrafo","texto":"**Lipedema vs sobrepeso/obesidad**: en la obesidad hay una **ganancia de volumen global**, mientras que en el lipedema la ganancia es **desproporcionada en los miembros**. Además, el sobrepeso y la obesidad **no producen dolor, molestias ni pesadez continuada**; en el lipedema sí se sufren todos estos síntomas."},{"tipo":"alerta","texto":"Trampa: «el lipedema mejora con el reposo nocturno y la elevación». **Falso**: no mejora con el reposo nocturno, y el agrandamiento persistente **no responde a la elevación ni a la pérdida de peso**. Lo que sí mejora con reposo y elevación es el **flebedema** (insuficiencia venosa)."}]},{"id":"dolor-diagnostico","titulo":"Dolor en el lipedema y diagnóstico clínico","bloques":[{"tipo":"parrafo","texto":"El **dolor del lipedema** (Aksoy et al., 2021) es **inespecífico**: **sordo, pesado y apremiante**, localizado sobre todo en las **regiones femoral y tibial anterior**. Puede provocarlo el **tacto o una presión menor** (**alodinia**), o aparecer tras estar mucho tiempo **de pie o sentado** y **al final del día**. Se han propuesto varias hipótesis sobre su patogenia, pero **ninguna ha sido confirmada** hasta la fecha."},{"tipo":"definicion","termino":"Alodinia","texto":"Dolor provocado por un estímulo que normalmente no es doloroso (tacto, presión ligera). En el lipedema condiciona la presión del DLM y la tolerancia a la compresión."},{"tipo":"tabla","titulo":"Criterios de historia clínica y examen físico (Herbst)","columnas":["Criterio","Interpretación"],"filas":[["Género femenino; cambios hormonales","Aparición o empeoramiento en pubertad, embarazo, menopausia"],["Compromiso **bilateral y simétrico** respetando **pies y manos**","Apariencia de «**hombro inverso**» (manguito de grasa que acaba en tobillo o muñeca)"],["Edema **mínimo / sin fóvea**","No hay linfedema puro asociado"],["**Dolor y textura** anómala","Tejido nodular, sensible"],["Agrandamiento persistente que **no responde a elevación ni pérdida de peso**","Diferencia con edema venoso y obesidad"],["**Stemmer negativo**","Diferencia con linfedema"],["**Hipotermia de la piel**","Piel fría al tacto"],["**Telangiectasias**","Pequeños vasos dilatados visibles"],["**Fragilidad vascular, hematomas fáciles**","Moratones espontáneos"]]},{"tipo":"definicion","termino":"Test de la pinza rodada","texto":"Con pulgares e índices se **levanta un pliegue de piel y se hace rodar**, registrando la **densidad y la resistencia del rodamiento** del «pliegue cutáneo móvil». Es **positivo** en el lipedema: **consistencia más compacta, peor rodamiento y dolor** en el entorno de la zona hiperálgica."},{"tipo":"figura","pagina":8,"pie":"Técnica del test de la pinza rodada: el pliegue se levanta y se hace rodar entre pulgares e índices; las flechas indican el sentido del rodamiento.","src":"img/drenaje-linfatico-t4.3-tema-4-3-edemas-iii-lipedema-otros-edemas-y-fisioterapia-der-p8.jpg"},{"tipo":"esquema","titulo":"Algoritmo clínico ante un aumento de volumen de MMII","mermaid":"flowchart TD\n  A[\"Aumento de volumen en MMII\"] --> B{\"¿Bilateral y simétrico, respeta pies?\"}\n  B -->|\"No: unilateral, pies afectados\"| L[\"Sospecha linfedema: Stemmer +\"]\n  B -->|\"Sí\"| C{\"¿Dolor, hematomas, pinza rodada +?\"}\n  C -->|\"No\"| O[\"Obesidad: volumen global sin dolor\"]\n  C -->|\"Sí\"| D{\"¿Fóvea, varices, mejora con reposo?\"}\n  D -->|\"Sí\"| F[\"Componente venoso: flebolipedema\"]\n  D -->|\"No\"| LI[\"Lipedema puro\"]","pie":"Razonamiento diferencial basado en los criterios del PDF."},{"tipo":"perla","texto":"Por la **alodinia** y la **fragilidad capilar**, el DLM en el lipedema debe ser especialmente **suave**: presiones excesivas causan dolor y hematomas. Empieza siempre preguntando por la tolerancia y observa la piel tras la sesión."}]},{"id":"diagnostico-diferencial","titulo":"Diagnóstico diferencial","bloques":[{"tipo":"parrafo","texto":"El lipedema se diagnostica **erróneamente con frecuencia** como **linfedema, insuficiencia venosa crónica, fibromialgia u obesidad** (Shavit et al., 2018). Conocer los rasgos discriminantes evita tratamientos inadecuados."},{"tipo":"tabla","titulo":"Linfedema vs lipedema","columnas":["Linfedema","Lipedema"],"filas":[["**Unilateral** o mayor en un lado","**Bilateral**"],["**Afectación de pies**","**No afectación de pies**"],["**Stemmer +**","Stemmer **ausente** en lipedema puro"],["Decoloración de la piel, **verrugas o esclerosis**","**Piel intacta**"],["**No hematomas**","**Hematomas fáciles**"],["**No dolor**","**Dolor**"]]},{"tipo":"tarjetas","items":[{"etiqueta":"IVC","titulo":"Insuficiencia venosa crónica (flebedema)","texto":"**Hiperpigmentación**, **venas varicosas**, **úlceras en las piernas** y **edema con fóvea que responde bien al reposo en cama, la elevación, la compresión y el ejercicio**."},{"etiqueta":"Dercum","titulo":"Enfermedad de Dercum","texto":"Síndrome de **crecimientos de grasa dolorosa en el tejido adiposo subcutáneo** de todo el cuerpo. Incluye **trastornos del sueño, ansiedad, depresión, dificultades cognitivas, taquicardia, falta de aliento y trastornos gastrointestinales**."},{"etiqueta":"Obesidad","titulo":"Sobrepeso / obesidad","texto":"Ganancia de **volumen global**, **sin dolor, molestias ni pesadez continuada**; responde a la pérdida de peso."},{"etiqueta":"Muslos","titulo":"Adiposidad en muslos","texto":"Acúmulo graso localizado sin el cuadro doloroso, hematomas ni la desproporción en columna del lipedema (comparación fotográfica del PDF)."}]},{"tipo":"alerta","texto":"La **fóvea positiva que mejora con reposo y elevación** es típica del **flebedema** (IVC), no del lipedema. Si en un lipedema aparece fóvea, hay que sospechar una **patología mixta** (flebolipedema)."},{"tipo":"alerta","texto":"No confundas **Dercum** con lipedema: ambos tienen grasa dolorosa, pero Dercum afecta al tejido subcutáneo **de todo el cuerpo** y se acompaña de **síntomas sistémicos** (sueño, ansiedad, depresión, taquicardia, disnea, digestivos)."}]},{"id":"tipos-estadios","titulo":"Tipos, estadios y patología mixta","bloques":[{"tipo":"tabla","titulo":"Tipos topográficos del lipedema","columnas":["Tipo","Localización","Nota"],"filas":[["I","**Caderas, nalgas y pelvis**","—"],["II","Desde **caderas hasta rodillas**","—"],["III","De **caderas hasta tobillos**","**El pie no se ve afectado**"],["IV (A)","**Solo brazos**","Poco frecuente; suele transformarse rápidamente en tipo **3 o 5**"],["IV (B)","**Solo pantorrillas**","Poco frecuente; suele transformarse en tipo **3 o 5**"],["V","De **caderas a tobillos y brazos**","Suele ser la **evolución del tipo 3** al aumentar de peso y progresar la enfermedad"]]},{"tipo":"figura","pagina":12,"pie":"Tipos de lipedema (imagen del Dr. Simarro): I caderas-nalgas, II caderas-rodillas, III caderas-tobillos, IV A solo brazos, IV B solo pantorrillas, V caderas-tobillos y brazos.","src":"img/drenaje-linfatico-t4.3-tema-4-3-edemas-iii-lipedema-otros-edemas-y-fisioterapia-der-p12.jpg"},{"tipo":"tabla","titulo":"Estadios (clasificación cutánea)","columnas":["Estadio","Piel","Descripción"],"filas":[["1","**Piel de naranja**","Pequeños nódulos en la superficie"],["2","**Piel de colchón**","Nódulos en la superficie con **grandes hoyos**"],["3","**Piel ondeada**","**Gran deformidad** (lóbulos)"]]},{"tipo":"figura","pagina":13,"pie":"Estadios 1, 2 y 3 del lipedema: de la piel de naranja con silueta casi normal a la piel ondeada con grandes lóbulos y deformidad.","src":"img/drenaje-linfatico-t4.3-tema-4-3-edemas-iii-lipedema-otros-edemas-y-fisioterapia-der-p13.jpg"},{"tipo":"dato","valor":"5 tipos · 3 estadios","texto":"Los **tipos** describen **dónde** está la grasa; los **estadios** describen **cómo está la piel**."},{"tipo":"esquema","titulo":"Evolución y complicaciones del lipedema","mermaid":"flowchart LR\n  T4[\"Tipo IV: brazos o pantorrillas\"] -->|\"rápido\"| T3[\"Tipo III: caderas-tobillos\"]\n  T4 --> T5[\"Tipo V: caderas-tobillos y brazos\"]\n  T3 -->|\"aumento de peso\"| T5\n  LP[\"Lipedema\"] --> FL[\"Flebolipedema: + insuficiencia venosa\"]\n  FL --> LFL[\"Lipoflebolinfedema: + fallo linfático\"]","pie":"Progresión topográfica y patología mixta descritas en el PDF."},{"tipo":"parrafo","texto":"**Patología mixta o complicaciones**: el lipedema puede asociarse a insuficiencia venosa (**flebolipedema**) y, en fases avanzadas, a fallo linfático añadido (**lipoflebolinfedema**), con afectación de pies, cambios cutáneos y edema con fóvea. En estas formas los signos «puros» (Stemmer negativo, pies respetados) dejan de cumplirse."},{"tipo":"figura","pagina":16,"pie":"Lipoflebolinfedema: combinación de lipedema, insuficiencia venosa y linfedema, con afectación de pies y cambios cutáneos.","src":"img/drenaje-linfatico-t4.3-tema-4-3-edemas-iii-lipedema-otros-edemas-y-fisioterapia-der-p16.jpg"},{"tipo":"alerta","texto":"El **tipo IV** tiene dos variantes (**solo brazos** y **solo pantorrillas**), ambas poco frecuentes y que evolucionan a **3 o 5**. El **tipo V** es la evolución del **tipo 3**, no del 2."}]},{"id":"tratamiento-lipedema","titulo":"Tratamiento del lipedema","bloques":[{"tipo":"parrafo","texto":"El **tratamiento conservador** combina la **Terapia Descongestiva Compleja (TDC)** —**DLM, presoterapia, compresión y movilizaciones**— con **control de peso, medicamentos y suplementos**. La compresión es el pilar con **mejores resultados** y el DLM ayuda a reducir el componente edematoso y el dolor."},{"tipo":"tabla","titulo":"Componentes del tratamiento conservador","columnas":["Medida","Detalle del PDF"],"filas":[["DLM","Parte de la TDC"],["Compresión","**Buenos resultados**; el **pantalón tipo ciclista** es una opción **económica** en pacientes **sin síntomas venosos**"],["Vendaje","**Vendajes multicapa de baja elasticidad sin almohadillado de uso nocturno** pueden ser beneficiosos"],["Ejercicio","**Ejercicios aeróbicos**; ejercicios leves como **caminar, nadar, aeróbic o Pilates**"],["Peso","Las **dietas no suelen ser eficaces**, pero el control de peso ayuda: **no sobrepasar IMC 25**; no reduce la grasa acumulada en MMII"],["Nutrición","**No inflamatoria, cetogénica y limitada en carbohidratos**: con ejercicio leve alivia el dolor al **reducir edema, hipoxia e inflamación** (Al-Ghadban et al., 2019)"],["Otros","Medicamentos y suplementos"]]},{"tipo":"dato","valor":"IMC ≤ 25","texto":"Objetivo de control de peso en el lipedema (no sobrepasar un IMC de 25)."},{"tipo":"perla","texto":"En una paciente con lipedema sin varices ni síntomas venosos, una **mallas/pantalón tipo ciclista** de compresión es una alternativa accesible para empezar; combínala con caminar o nadar a diario y, si tolera, vendaje multicapa de baja elasticidad nocturno."},{"tipo":"parrafo","texto":"**Tratamiento quirúrgico**: la **liposucción tumescente microcanular**. **No pretende reducir grandes cantidades de masa grasa**, sino **reducir el dolor, mejorar la calidad de vida** y **prevenir la progresión** de la enfermedad y de patologías secundarias. **No está indicada en todos los casos**, **no siempre** se obtienen buenos resultados y **antes y después** de la intervención se debe aplicar **Terapia Linfática Descongestiva**."},{"tipo":"esquema","titulo":"Itinerario terapéutico del lipedema","mermaid":"flowchart TD\n  D[\"Diagnóstico clínico de lipedema\"] --> C[\"Tratamiento conservador\"]\n  C --> C1[\"TDC: DLM, presoterapia, compresión, movilizaciones\"]\n  C --> C2[\"Ejercicio aeróbico leve\"]\n  C --> C3[\"Peso IMC menor o igual a 25 y nutrición antiinflamatoria\"]\n  C --> Q{\"¿Dolor y limitación persisten?\"}\n  Q -->|\"Sí, caso seleccionado\"| P[\"TDC preoperatoria\"]\n  P --> L[\"Liposucción tumescente microcanular\"]\n  L --> PO[\"TDC postoperatoria\"]\n  Q -->|\"No\"| M[\"Mantenimiento conservador\"]","pie":"La cirugía se intercala entre dos fases de TDC."},{"tipo":"alerta","texto":"Trampa: «el objetivo de la liposucción en el lipedema es eliminar la mayor cantidad posible de grasa». **Falso**: busca **reducir el dolor y mejorar la calidad de vida**, y siempre se acompaña de TDC antes y después."}]},{"id":"otros-edemas","titulo":"Otros edemas: mala circulación y retención de líquidos","bloques":[{"tipo":"parrafo","texto":"La **retención de líquidos por mala circulación** se debe a una **dilatación de las venas** que **entorpece el retorno de la sangre hacia el corazón**, provocando acumulación de líquido. El **calor** la favorece, pero hay muchos más factores."},{"tipo":"tabla","titulo":"Factores y tratamiento de la retención de líquidos","columnas":["Factores favorecedores","Medidas de tratamiento"],"filas":[["Mala alimentación","Buena alimentación"],["Tabaco, alcohol y cafeína","Control del estrés"],["Inactividad física","Vida activa y ejercicio físico"],["Ropa ajustada","Ropa cómoda"],["Estrés","Medidas posturales"],["Deshidratación (sangre más densa)","Buena hidratación"],["Edad, enfermedades vasculares, factor hormonal","Evitar altas temperaturas, duchas frías, **DLM**"]]},{"tipo":"perla","texto":"Para la retención de líquidos funcional, las pautas de autocuidado (elevar piernas, duchas frías descendentes, evitar calor y ropa ajustada, hidratarse y caminar) son tan importantes como las sesiones de DLM: entrégalas por escrito al paciente."},{"tipo":"alerta","texto":"La **deshidratación** es un factor de retención (la **sangre se vuelve más densa**), por eso la **buena hidratación** forma parte del tratamiento: no se trata de beber menos para «retener menos»."}]},{"id":"dermatofuncional","titulo":"Fisioestética o fisioterapia dermatofuncional","bloques":[{"tipo":"dato","valor":"Brasil 1997","texto":"Origen de la fisioterapia dermatofuncional; actuación del fisioterapeuta reconocida en **2000–2001** por el Congreso Brasileiro de Fisioterapia/Kinesiología Dermatofuncional y el Consejo Regional de Terapia Física y Terapia Ocupacional de la Primera Región de Brasil (Milani et al., 2006)."},{"tipo":"parrafo","texto":"Se valora **fundamentalmente el sistema tegumentario** y se detectan las disfunciones de otros sistemas que repercuten negativamente en él. Su objetivo es **recuperar la funcionalidad de la piel** (epidermis, dermis, hipodermis) mediante **las manos del fisioterapeuta** y **aparatos tecnológicos específicos**."},{"tipo":"tarjetas","items":[{"etiqueta":"Manual","titulo":"Técnicas manuales","texto":"**DLM**; **liberación o inducción miofascial** (disminuir y eliminar restricciones del sistema de fascias); **masaje terapéutico** tonificante, reafirmante o relajante."},{"etiqueta":"Aparatos","titulo":"Aparatología","texto":"**Tecarterapia (INDIBA)**: transferencia eléctrica **capacitiva y resistiva** por radiofrecuencia que genera **calor profundo**; ultrasonido; microdermoabrasión; láser; termo- y crioterapia; presoterapia; **microcorrientes** (baja frecuencia enfocada en estimular la piel); electroterapia de baja, media y alta frecuencia según el efecto buscado."}]},{"tipo":"lista","items":["1. **Afinamiento del tejido epitelial**: piel de textura fina y sana por **incremento de proteínas de colágeno**.","2. Mejora y acelera la **reparación del tejido tegumentario**.","3. Restaura el equilibrio y las funciones del **sistema circulatorio y linfático**.","4. Aumenta el desplazamiento y la **flexibilidad de las fibras musculares** y promueve la **organización de los haces de colágeno** en procesos reparativos.","5. Mejora la **circulación y la oxigenación del medio intersticial**.","6. Elimina la retención de **tejido adiposo localizado**.","7. **Disminuye la flacidez y reduce las medidas**."]},{"tipo":"tabla","titulo":"Tratamiento de las disfunciones estéticas","columnas":["Disfunción","Efecto de la fisioterapia dermatofuncional"],"filas":[["**Estrías**","Mejora la consistencia de la piel y **aumenta la producción de colágeno**"],["**Edema** (linfedema, hinchazón)","Fomenta la eliminación del **líquido intersticial**"],["**Celulitis** (lipodistrofia ginecoide)","Restablece funciones **linfática y venosa** afectadas por la retención de tejido adiposo"],["**Problemas circulatorios**","Venosos o linfáticos: varices, arañas vasculares, linfedemas"],["**Aumento de peso**","Aumenta el drenaje de líquidos"],["**Pre y postoperatorio** (cirugía estética, embarazo, parto)","Restablece el tono, mejora la flexibilidad y **acelera la reparación**"],["**Cicatrices**","**Libera el tejido fibrótico** que restringe el desplazamiento tegumentario"],["**Quemaduras**","Fomenta el colágeno y mejora la circulación → llegada de **fibroblastos** y células reparadoras"]]},{"tipo":"alerta","texto":"En el temario, **celulitis** = **lipodistrofia ginecoide** (alteración estética del tejido adiposo), **no** la infección bacteriana de la piel. No la confundas con la erisipela."}]}],"caso_clinico":{"titulo":"Marta, 38 años: «tengo las piernas gordas y me duelen»","presentacion":"Marta, 38 años, consulta por aumento de volumen de ambas piernas desde la pubertad, que empeoró tras su embarazo. Ha hecho varias dietas: adelgaza de cara y tronco, pero no de las piernas. Refiere pesadez al final del día, dolor al roce y moratones frecuentes sin golpes. Exploración: aumento bilateral y simétrico de caderas a tobillos con «manguito» sobre el tobillo, pies normales, Stemmer negativo, fóvea negativa, piel fría con nódulos pequeños (piel de naranja) y pinza rodada dolorosa. No tiene varices. IMC 27.","preguntas":[{"pregunta":"¿Cuál es el diagnóstico más probable y qué datos lo apoyan frente a un linfedema?","respuesta":"**Lipedema**: mujer, inicio hormonal, bilateral y simétrico, **respeta los pies** («hombro inverso»), dolor/alodinia, hematomas fáciles, **Stemmer negativo**, fóvea negativa, sin respuesta a la dieta y **pinza rodada positiva**. El linfedema sería unilateral o asimétrico, con pies afectados, Stemmer + y sin dolor."},{"pregunta":"Clasifícalo por tipo y estadio.","respuesta":"Afectación de **caderas a tobillos sin pies = tipo III**; piel de naranja con pequeños nódulos = **estadio 1**."},{"pregunta":"Plantea su tratamiento fisioterápico.","respuesta":"**TDC**: DLM suave (alodinia, fragilidad capilar), compresión (al no tener síntomas venosos, un **pantalón tipo ciclista** es opción económica), vendaje multicapa de baja elasticidad nocturno si lo tolera, movilizaciones y **ejercicio aeróbico leve** (caminar, nadar, Pilates). Control de peso hacia **IMC ≤ 25** con nutrición antiinflamatoria y baja en carbohidratos. Si el dolor persiste, valorar liposucción tumescente con TDC antes y después."}]},"preguntate":[{"pregunta":"Define lipedema y cita su relación etiológica y su prevalencia.","respuesta":"Trastorno de la distribución del tejido graso, principalmente en MMII, de causa desconocida relacionada con problemas hormonales; afecta al 16 % de las mujeres. La OMS lo reconoció como enfermedad en 2018."},{"pregunta":"¿Qué significa el signo del «hombro inverso»?","respuesta":"El compromiso bilateral y simétrico que respeta pies y manos, de modo que la grasa termina bruscamente sobre el tobillo o la muñeca formando un reborde."},{"pregunta":"Enumera seis diferencias entre linfedema y lipedema.","respuesta":"Linfedema: unilateral, pies afectados, Stemmer +, cambios cutáneos (verrugas, esclerosis), sin hematomas, sin dolor. Lipedema: bilateral, pies respetados, Stemmer negativo, piel intacta, hematomas fáciles, dolor."},{"pregunta":"¿Cómo se realiza el test de la pinza rodada y qué indica un resultado positivo?","respuesta":"Se levanta un pliegue cutáneo con pulgares e índices y se hace rodar valorando densidad y resistencia. Positivo: consistencia más compacta, peor rodamiento y dolor alrededor de la zona hiperálgica."},{"pregunta":"Describe el dolor del lipedema.","respuesta":"Inespecífico, sordo, pesado y apremiante, sobre todo femoral y tibial anterior; provocado por tacto o presión ligera (alodinia), tras estar de pie o sentado mucho tiempo y al final del día. Su patogenia no está confirmada."},{"pregunta":"¿Qué caracteriza al flebedema de la insuficiencia venosa crónica?","respuesta":"Hiperpigmentación, varices, úlceras en las piernas y edema con fóvea que responde bien al reposo, la elevación, la compresión y el ejercicio."},{"pregunta":"Enumera los tipos de lipedema.","respuesta":"I caderas, nalgas y pelvis; II caderas a rodillas; III caderas a tobillos (sin pie); IV solo brazos o solo pantorrillas (poco frecuentes, evolucionan a 3 o 5); V caderas a tobillos y brazos (evolución del 3)."},{"pregunta":"¿Por qué las dietas no son eficaces en el lipedema y qué papel tiene el peso?","respuesta":"Porque no reducen el tejido graso acumulado en MMII; aun así, controlar el peso (no superar IMC 25) ayuda a controlar la enfermedad, y una nutrición antiinflamatoria con ejercicio leve reduce edema, hipoxia e inflamación."},{"pregunta":"¿Qué objetivo tiene la liposucción en el lipedema y qué condiciones la rodean?","respuesta":"Reducir el dolor, mejorar la calidad de vida y prevenir la progresión, no quitar mucha grasa. No está indicada en todos los casos, no siempre da buenos resultados y requiere TDC antes y después."},{"pregunta":"¿Qué es la tecarterapia y en qué se diferencian sus modos?","respuesta":"Transferencia eléctrica mediante radiofrecuencia que genera calor profundo en los tejidos; puede aplicarse en modo capacitivo o resistivo."}],"glosario":[{"termino":"Lipedema","definicion":"Trastorno doloroso y bilateral de la distribución del tejido graso, sobre todo en MMII."},{"termino":"Signo de Stemmer","definicion":"Imposibilidad de pellizcar la piel del dorso del 2.º dedo del pie; positivo en linfedema, negativo en lipedema puro."},{"termino":"Fóvea","definicion":"Hundimiento que deja la presión digital sobre un edema; negativa o fugaz en el lipedema."},{"termino":"Alodinia","definicion":"Dolor ante estímulos normalmente no dolorosos, como el tacto."},{"termino":"Pinza rodada","definicion":"Test que hace rodar un pliegue cutáneo para valorar densidad, resistencia y dolor."},{"termino":"Hombro inverso","definicion":"Reborde de grasa sobre tobillo o muñeca al respetarse pies y manos."},{"termino":"Flebedema","definicion":"Edema de origen venoso, con fóvea, que mejora con reposo y elevación."},{"termino":"Flebolipedema","definicion":"Lipedema asociado a insuficiencia venosa."},{"termino":"Lipoflebolinfedema","definicion":"Combinación de lipedema, insuficiencia venosa y linfedema."},{"termino":"Enfermedad de Dercum","definicion":"Crecimientos de grasa dolorosa subcutánea en todo el cuerpo con síntomas sistémicos."},{"termino":"Liposucción tumescente microcanular","definicion":"Técnica quirúrgica de aspiración grasa con microcánulas tras infiltrar solución tumescente."},{"termino":"Tecarterapia (INDIBA)","definicion":"Radiofrecuencia capacitiva y resistiva que produce calor profundo."},{"termino":"Lipodistrofia ginecoide","definicion":"Nombre técnico de la «celulitis» estética."},{"termino":"Fisioterapia dermatofuncional","definicion":"Rama que valora y trata la funcionalidad del sistema tegumentario."}],"fuentes":["Aksoy, H., Karadag, A. S., & Wollina, U. (2021). Cause and management of lipedema-associated pain. Dermatologic Therapy, 34(1), e14364.","Buck, D. W. 2.º & Herbst, K. L. (2016). Lipedema: a relatively common disease with extremely common misconceptions. Plast Reconstr Surg Glob Open, 4(9), e1043.","Shavit, E., Wollina, U., & Alavi, A. (2018). Lipoedema is not lymphoedema: a review of current literature. Int Wound J, 15, 921–928.","Al-Ghadban, S., Herbst, K. L., & Bunnell, B. A. (2019). Lipedema: a painful adipose tissue disorder. En: Szablewski, L. (ed.), Adipose Tissue: An Update. IntechOpen.","Milani, G. B., João, S. M. A., & Farah, E. A. (2006). Fundamentos da Fisioterapia dermato-funcional: revisão de literatura. Fisioterapia e Pesquisa, 13(1), 37–43.","Instituto Lipedema – Dr. Simarro (imágenes de tipos de lipedema)."],"qcm":[{"pregunta":"Según el PDF, ¿qué porcentaje de mujeres presenta lipedema y en qué año fue reconocido como enfermedad por la OMS?","opciones":["16 % y 2018","11 % y 2016","16 % y 2021","21 % y 2018"],"correcta":0,"explicacion":"El PDF indica que el lipedema, relacionado con problemas hormonales, predomina en mujeres (16 %) y fue declarado enfermedad por la OMS en 2018.","por_opcion":["✅ Datos literales del PDF.","❌ Ni la prevalencia ni el año coinciden con el PDF.","❌ La prevalencia es correcta, pero el año es 2018.","❌ El año es correcto, pero la prevalencia es del 16 %."]},{"pregunta":"¿Cuál de los siguientes hallazgos es propio de un lipedema puro?","opciones":["Erisipelas de repetición en la pierna","Edema con fóvea que mejora tras el reposo nocturno","Hematomas ante traumatismos mínimos","Signo de Stemmer positivo en el segundo dedo"],"correcta":2,"explicacion":"La fragilidad capilar del lipedema provoca hematomas fáciles. Stemmer es negativo, la fóvea es negativa, no mejora con reposo y no hay erisipelas.","por_opcion":["❌ El lipedema no presenta erisipelas ni infecciones frecuentes.","❌ El lipedema no mejora con el reposo nocturno y su fóvea es negativa.","✅ Fragilidad capilar → hematomas.","❌ Stemmer es negativo en el lipedema puro."]},{"pregunta":"La evolución típica del aumento de volumen en el lipedema es:","opciones":["Proximal, limitada siempre a nalgas y caderas","De proximal a distal, de la cresta ilíaca al tobillo","Unilateral, desde la raíz del muslo a los dedos","De distal a proximal, desde el dorso del pie"],"correcta":1,"explicacion":"El PDF describe una evolución de proximal a distal, extendiéndose desde la cresta ilíaca hasta el tobillo, sin afectar pies ni dedos.","por_opcion":["❌ Limitada a caderas y nalgas solo en el tipo I.","✅ Descripción literal del PDF.","❌ Es bilateral y respeta los dedos.","❌ El inicio distal desde el pie es propio del linfedema."]},{"pregunta":"Una mujer con aumento de volumen bilateral de MMII presenta hiperpigmentación, varices y edema con fóvea que mejora con el reposo en cama y la elevación. ¿Qué cuadro sugiere?","opciones":["Lipedema tipo V","Lipedema estadio 2","Insuficiencia venosa crónica (flebedema)","Enfermedad de Dercum"],"correcta":2,"explicacion":"La IVC se presenta con hiperpigmentación, venas varicosas, úlceras y edema con fóvea que responde al reposo, la elevación, la compresión y el ejercicio.","por_opcion":["❌ El tipo V es topográfico; no explica fóvea ni varices.","❌ El lipedema tiene fóvea negativa y no mejora con el reposo.","✅ Cuadro típico de flebedema.","❌ Dercum cursa con grasa dolorosa generalizada y síntomas sistémicos."]},{"pregunta":"En el test de la pinza rodada, ¿qué hallazgo se considera patológico?","opciones":["Pliegue fino que rueda con facilidad e indoloro","Hundimiento persistente tras presión digital","Imposibilidad de pellizcar la piel del segundo dedo","Consistencia más compacta, peor rodamiento y dolor"],"correcta":3,"explicacion":"Hallazgos patológicos de la pinza rodada: consistencia más compacta, peor rodamiento y dolor en el entorno de la zona hiperálgica.","por_opcion":["❌ Es un resultado normal.","❌ Describe el signo de la fóvea.","❌ Describe el signo de Stemmer.","✅ Definición del PDF."]},{"pregunta":"¿Qué criterio de la historia clínica y examen físico NO corresponde al lipedema según la tabla de Herbst?","opciones":["Telangiectasias","Hipotermia de la piel","Agrandamiento que no responde a la pérdida de peso","Hipertermia y rubor local"],"correcta":3,"explicacion":"La tabla incluye hipotermia de la piel, telangiectasias, fragilidad vascular y agrandamiento persistente que no responde a elevación ni pérdida de peso. La piel es fría, no caliente.","por_opcion":["❌ Sí figura en la tabla.","❌ Sí figura: hipotermia cutánea.","❌ Sí figura como criterio.","✅ Lo contrario de lo descrito: la piel está fría."]},{"pregunta":"La afectación de caderas a tobillos respetando el pie corresponde al lipedema tipo:","opciones":["IV","V","III","II"],"correcta":2,"explicacion":"Tipo III: afectación de caderas hasta tobillos, sin afectar el pie.","por_opcion":["❌ El tipo IV afecta solo brazos o solo pantorrillas.","❌ El tipo V añade los brazos.","✅ Definición del tipo III.","❌ El tipo II llega de caderas a rodillas."]},{"pregunta":"Respecto al tipo IV de lipedema, es correcto que:","opciones":["Es la evolución natural del tipo 3 con el aumento de peso","Es el más frecuente y permanece estable","Afecta a caderas, nalgas y pelvis","Afecta solo a brazos o solo a pantorrillas y suele evolucionar a 3 o 5"],"correcta":3,"explicacion":"El PDF describe el tipo IV con afectación solo de brazos o solo de pantorrillas; es poco frecuente y suele transformarse en tipo 3 o 5.","por_opcion":["❌ Eso corresponde al tipo V.","❌ Es poco frecuente y tiende a progresar.","❌ Eso es el tipo I.","✅ Descripción del PDF."]},{"pregunta":"La piel «de colchón», con nódulos en superficie y grandes hoyos, define el estadio:","opciones":["2","1","3","4"],"correcta":0,"explicacion":"Estadio 1: piel de naranja; estadio 2: piel de colchón con grandes hoyos; estadio 3: piel ondeada con gran deformidad.","por_opcion":["✅ Piel de colchón = estadio 2.","❌ El estadio 1 es piel de naranja con pequeños nódulos.","❌ El estadio 3 es piel ondeada con gran deformidad.","❌ El PDF describe solo tres estadios."]},{"pregunta":"En una paciente con lipedema sin síntomas venosos, el PDF propone como opción económica de compresión:","opciones":["Pantalón tipo ciclista","Medias de compresión a medida de tejido plano","Vendaje multicapa de alta elasticidad diurno","Presoterapia neumática domiciliaria"],"correcta":0,"explicacion":"El pantalón tipo ciclista resulta una opción económica en pacientes que no tienen síntomas venosos.","por_opcion":["✅ Literal del PDF.","❌ No se presenta como la opción económica.","❌ El PDF habla de vendajes multicapa de baja elasticidad, sin almohadillado y nocturnos.","❌ Forma parte de la TDC, pero no es la opción económica citada."]},{"pregunta":"¿Qué vendaje puede ser beneficioso en el lipedema según el PDF?","opciones":["Multicapa de alta elasticidad con almohadillado, de uso diurno","Multicapa de baja elasticidad sin almohadillado, de uso nocturno","Vendaje adhesivo neuromuscular continuo","Vendaje de baja elasticidad con almohadillado, solo diurno"],"correcta":1,"explicacion":"Los vendajes multicapa con vendas de baja elasticidad sin almohadillado de uso nocturno pueden ser beneficiosos.","por_opcion":["❌ Elasticidad, almohadillado y horario incorrectos.","✅ Descripción literal.","❌ No se cita en el tema.","❌ El PDF especifica sin almohadillado y nocturno."]},{"pregunta":"Sobre el control del peso en el lipedema, ¿qué afirma el PDF?","opciones":["Se recomienda una dieta rica en carbohidratos complejos","Las dietas hipocalóricas reducen eficazmente la grasa de los MMII","El peso no influye en la evolución de la enfermedad","Las dietas no suelen ser eficaces, pero conviene no sobrepasar un IMC de 25"],"correcta":3,"explicacion":"Las dietas no suelen ser eficaces y no reducen la grasa de los MMII, aunque el control del peso ayuda (no sobrepasar IMC 25). Se recomienda nutrición no inflamatoria, cetogénica y limitada en carbohidratos.","por_opcion":["❌ Se recomienda limitar los carbohidratos.","❌ No reducen el tejido graso acumulado en MMII.","❌ El aumento de peso favorece la evolución del tipo 3 al 5.","✅ Literal del PDF."]},{"pregunta":"¿Cuál es el objetivo principal de la liposucción tumescente microcanular en el lipedema?","opciones":["Sustituir de forma definitiva a la TDC","Extraer el máximo volumen graso posible en una sesión","Corregir la insuficiencia venosa asociada","Reducir el dolor y mejorar la calidad de vida"],"correcta":3,"explicacion":"No pretende reducir grandes cantidades de grasa, sino reducir el dolor, mejorar la calidad de vida y prevenir la progresión; requiere TDC antes y después.","por_opcion":["❌ La TDC se aplica antes y después de la intervención.","❌ El PDF dice explícitamente que no es ese su objetivo.","❌ No actúa sobre el sistema venoso.","✅ Objetivo descrito en el PDF."]},{"pregunta":"La enfermedad de Dercum se diferencia del lipedema porque:","opciones":["No produce dolor","Asocia grasa dolorosa generalizada con síntomas como taquicardia, ansiedad o trastornos digestivos","Afecta solo a los pies","Siempre presenta Stemmer positivo"],"correcta":1,"explicacion":"Dercum es un síndrome de crecimientos de grasa dolorosa en el tejido subcutáneo de todo el cuerpo con trastornos del sueño, ansiedad, depresión, dificultades cognitivas, taquicardia, disnea y trastornos gastrointestinales.","por_opcion":["❌ La grasa de Dercum es dolorosa.","✅ Síntomas sistémicos descritos en el PDF.","❌ Es de distribución corporal generalizada.","❌ Stemmer es un signo de linfedema, no de Dercum."]},{"pregunta":"En fisioterapia dermatofuncional, la tecarterapia (INDIBA) se define como:","opciones":["Transferencia eléctrica capacitiva y resistiva por radiofrecuencia que genera calor profundo","Corriente de baja frecuencia enfocada a estimular la piel","Compresión neumática secuencial","Abrasión mecánica de la capa córnea"],"correcta":0,"explicacion":"La tecarterapia es una transferencia eléctrica capacitiva y resistiva mediante un equipo de radiofrecuencia que genera calor profundo en los tejidos.","por_opcion":["✅ Definición del PDF.","❌ Son las microcorrientes.","❌ Es la presoterapia.","❌ Es la microdermoabrasión."]}],"asignatura":"Drenaje linfático","tema":4.3,"fecha":"2026-11-10"}</script>

<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
