<style>

<script id="datos" type="application/json">{"titulo":"Tema 4.3: Edemas (III) – lipedema, otros edemas y fisioterapia dermatofuncional","subtitulo":"Lipedema (características, diagnóstico diferencial, tipos, estadios y tratamiento), retención de líquidos por mala circulación y fisioestética.","resumen":["El **lipedema** es un **trastorno de la distribución de la grasa**, sobre todo en **MMII**, de causa desconocida y relación hormonal, casi exclusivo de **mujeres (16 %)**, reconocido como enfermedad por la **OMS en 2018**.","Es **bilateral y simétrico**, progresa de **proximal a distal** (cresta ilíaca–tobillo), **respeta pies y manos** (“hombro inverso”), con **Stemmer negativo**, **fóvea negativa** o fugaz, **hematomas fáciles**, **dolor** (alodinia) y **sin infecciones frecuentes**.","A diferencia de la obesidad, el aumento de volumen es **desproporcionado en los miembros**, **doloroso** y **no responde a la elevación ni a la pérdida de peso**; el **test de la pinza rodada** es positivo.","Hay **5 tipos** según la localización (1 caderas-nalgas; 2 hasta rodillas; 3 hasta tobillos; 4 brazos o pantorrillas; 5 caderas-tobillos y brazos) y **3 estadios** (piel de **naranja**, de **colchón** y **ondeada** con deformidad).","Se trata con **Terapia Descongestiva Compleja** (DLM, compresión, presoterapia, ejercicio aeróbico), control de peso (**IMC ≤ 25**) y, si procede, **liposucción tumescente microcanular** con terapia linfática antes y después; la **fisioterapia dermatofuncional** nació en **Brasil (1997)**."],"objetivos":["Definir el lipedema y describir sus características clínicas.","Diferenciar el lipedema del linfedema, la IVC, la obesidad y la enfermedad de Dercum.","Clasificar el lipedema por tipos y estadios.","Plantear su tratamiento conservador y quirúrgico.","Conocer el manejo de la retención de líquidos y el ámbito de la fisioterapia dermatofuncional."],"ideas_clave":["Lipedema: mujeres (**16 %**), MMII, **OMS 2018**, relación **hormonal**.","**No afecta pies ni dedos**; miembros en **columna**; **bilateral**.","**Stemmer negativo** (en el puro), **fóvea negativa** o de desaparición inmediata, **sin erisipelas**.","**No mejora con el reposo nocturno** ni con la elevación o la pérdida de peso.","**Dolor**: sordo, pesado, femoral y tibial anterior, provocado por tacto o presión leve (**alodinia**); patogenia no confirmada.","**Pinza rodada +**: pliegue más compacto, peor rodamiento y dolor.","Tipo 5 = caderas a tobillos **+ brazos**; estadio 3 = piel **ondeada** con gran deformidad.","Liposucción: busca **reducir el dolor y mejorar la calidad de vida**, no grandes volúmenes."],"secciones":[{"id":"lipedema-clinica","titulo":"Lipedema: concepto y características","bloques":[{"tipo":"definicion","termino":"Lipedema","texto":"**Trastorno de la distribución del tejido graso** que afecta principalmente a los **miembros inferiores**; causa desconocida, relacionada con **problemas hormonales**, predominante en **mujeres (16 %)**. Declarado enfermedad por la **OMS en 2018**."},{"tipo":"lista","items":["Evolución **de proximal a distal**, desde la **cresta ilíaca hasta el tobillo**.","**No afecta a pies ni dedos**; extremidades con aspecto de **columna**.","**Fragilidad capilar**: hematomas.","Pesadez, tensión y tirantez; **doloroso e infradiagnosticado**.","Tendencia al edema en **ortostatismo**.","**Stemmer negativo** en el lipedema puro.","**Sin erisipelas** ni infecciones frecuentes.","**Fóvea negativa** o de desaparición inmediata.","**No mejora con el reposo nocturno**.","**Bilateral**."]},{"tipo":"parrafo","texto":"En el **sobrepeso y la obesidad** hay ganancia **global** de volumen **sin dolor**; en el lipedema la ganancia es **desproporcionada en los miembros** y se acompaña de **dolor, molestias y pesadez continuada**."},{"tipo":"parrafo","texto":"El **dolor** es inespecífico, **sordo, pesado y apremiante**, sobre todo en regiones **femoral y tibial anterior**; aparece con el **tacto o presiones leves (alodinia)**, tras estar de pie o sentado mucho tiempo y al final del día. Ninguna hipótesis sobre su patogenia está confirmada."},{"tipo":"figura","pagina":14,"pie":"Lipedema frente a adiposidad en muslos: en el lipedema el volumen es desproporcionado en los miembros, en columna y respetando los pies.","src":"img/drenaje-linfatico-t4.3-tema-4-3-edemas-iii-lipedema-otros-edemas-y-fisioterapia-der-p14.jpg"}]},{"id":"diagnostico","titulo":"Diagnóstico y diagnóstico diferencial","bloques":[{"tipo":"parrafo","texto":"Historia y exploración: **sexo femenino**, cambios hormonales, afectación **bilateral y simétrica** respetando pies y manos (“**hombro inverso**”), edema mínimo/sin fóvea, dolor y textura alterada, agrandamiento que **no responde a elevación ni pérdida de peso**, **Stemmer negativo**, **hipotermia cutánea**, telangiectasias, fragilidad vascular y hematomas fáciles."},{"tipo":"definicion","termino":"Test de la pinza rodada","texto":"Con pulgares e índices se levanta un pliegue de piel y se hace rodar. **Positivo**: consistencia más compacta, peor rodamiento y **dolor** en la zona hiperálgica."},{"tipo":"tabla","titulo":"Linfedema vs lipedema","columnas":["Linfedema","Lipedema"],"filas":[["Unilateral o mayor en un lado","**Bilateral**"],["Afecta pies","**No afecta pies**"],["Stemmer +","Stemmer ausente (lipedema puro)"],["Decoloración, verrugas o esclerosis","Piel intacta"],["No hematomas","**Hematomas fáciles**"],["No dolor","**Dolor**"]]},{"tipo":"parrafo","texto":"Se confunde con **linfedema, IVC, fibromialgia u obesidad**. La **IVC (flebedema)** cursa con hiperpigmentación, varices, úlceras y **edema con fóvea que mejora con reposo, elevación, compresión y ejercicio**. La **enfermedad de Dercum** presenta **crecimientos de grasa dolorosa** subcutánea con trastornos del sueño, ansiedad, depresión, dificultades cognitivas, taquicardia, disnea y trastornos digestivos."},{"tipo":"alerta","texto":"Trampa: el lipedema puede tener edema ortostático, pero la **fóvea es negativa o desaparece al instante** y **no mejora con la noche**; en el edema venoso la fóvea es positiva y mejora con el decúbito."},{"tipo":"esquema","titulo":"Orientación diagnóstica de un miembro inferior grueso","mermaid":"flowchart TD\n  A[\"Aumento de volumen MMII\"] --> B{\"Afecta los pies\"}\n  B -->|\"si, Stemmer +\"| L[\"Linfedema\"]\n  B -->|\"no\"| C{\"Dolor y hematomas, bilateral\"}\n  C -->|\"si\"| LI[\"Lipedema\"]\n  C -->|\"no, volumen global\"| O[\"Obesidad\"]\n  A --> V{\"Fovea + que mejora en decubito, varices\"}\n  V -->|\"si\"| IVC[\"Flebedema IVC\"]","pie":"Orientación didáctica basada en los criterios del tema."}]},{"id":"tipos-estadios","titulo":"Tipos, estadios y formas mixtas","bloques":[{"tipo":"tabla","titulo":"Tipos de lipedema","columnas":["Tipo","Localización"],"filas":[["1","Caderas, nalgas y pelvis"],["2","Caderas hasta **rodillas**"],["3","Caderas hasta **tobillos** (pie no afectado)"],["4","Solo **brazos** o solo **pantorrillas** (poco frecuentes; suelen pasar a tipo 3 o 5)"],["5","Caderas a tobillos **y brazos** (evolución del 3 al ganar peso)"]]},{"tipo":"tabla","titulo":"Estadios","columnas":["Estadio","Piel"],"filas":[["1","**Piel de naranja**, pequeños nódulos en superficie"],["2","**Piel de colchón**, nódulos con grandes hoyos"],["3","**Piel ondeada** con gran deformidad"]]},{"tipo":"alerta","texto":"El tema enumera **dos “tipo 4”** (solo brazos / solo pantorrillas): ambos poco frecuentes y evolucionan a tipo 3 o 5."},{"tipo":"parrafo","texto":"Formas **mixtas o complicaciones**: **flebolipedema** (lipedema + componente venoso) y **lipoflebolinfedema** (lipedema + venoso + linfático)."},{"tipo":"figura","pagina":15,"pie":"Flebolipedema: piernas en columna con componente venoso añadido en el tercio distal.","src":"img/drenaje-linfatico-t4.3-tema-4-3-edemas-iii-lipedema-otros-edemas-y-fisioterapia-der-p15.jpg"}]},{"id":"tratamiento","titulo":"Tratamiento del lipedema","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"Conservador","titulo":"Terapia Descongestiva Compleja","texto":"**DLM**, presoterapia, **compresión** (buenos resultados; el **pantalón tipo ciclista** es una opción económica sin síntomas venosos), movilizaciones y **ejercicio aeróbico**. **Vendaje multicapa de baja elasticidad sin almohadillado nocturno** puede ser beneficioso."},{"etiqueta":"Peso","titulo":"Control de peso y nutrición","texto":"Las dietas **no suelen ser eficaces** sobre la grasa de los miembros, pero conviene **IMC ≤ 25**. Nutrición **antiinflamatoria, cetogénica y baja en carbohidratos** + ejercicio suave (caminar, nadar, Pilates) alivia el dolor al reducir edema, hipoxia e inflamación."},{"etiqueta":"Quirúrgico","titulo":"Liposucción tumescente microcanular","texto":"Objetivo: **reducir el dolor y mejorar la calidad de vida** y prevenir progresión, **no** quitar grandes masas de grasa. No siempre indicada ni con buenos resultados. **Terapia linfática descongestiva antes y después**."}]},{"tipo":"dato","valor":"IMC ≤ 25","texto":"Objetivo de peso recomendado en el lipedema."},{"tipo":"perla","texto":"Como el lipedema duele al tacto (alodinia), el DLM con sus **presiones suaves e indoloras** es especialmente bien tolerado, a diferencia de un masaje profundo."}]},{"id":"otros","titulo":"Retención de líquidos y fisioterapia dermatofuncional","bloques":[{"tipo":"parrafo","texto":"La **mala circulación y retención de líquidos** se debe a dilatación venosa que dificulta el retorno; factores: calor, mala alimentación, tabaco, alcohol y cafeína, inactividad, ropa ajustada, estrés, **deshidratación (sangre más densa)**, edad, enfermedades vasculares y hormonales. Tratamiento: evitar calor, medidas posturales, **duchas frías**, ropa cómoda, **DLM**, control del estrés, buena alimentación e hidratación y ejercicio."},{"tipo":"definicion","termino":"Fisioterapia dermatofuncional (fisioestética)","texto":"Área que valora sobre todo el **sistema tegumentario** y las disfunciones de otros sistemas que repercuten en él, para **recuperar la funcionalidad de la piel**. Origen en **Brasil (1997)**, reconocida en **2000–2001**."},{"tipo":"tabla","titulo":"Herramientas","columnas":["Manuales","Aparatología"],"filas":[["Drenaje linfático manual","Tecarterapia (INDIBA): radiofrecuencia capacitiva y resistiva, calor profundo"],["Liberación o inducción miofascial","Ultrasonido, láser, microdermoabrasión"],["Masaje terapéutico (tonificante, reafirmante, relajante)","Termo y crioterapia, presoterapia, microcorrientes, electroterapia"]]},{"tipo":"lista","items":["**Efectos**: afina el epitelio aumentando el colágeno; acelera la reparación tegumentaria; restaura la función circulatoria y linfática; flexibiliza fibras y organiza el colágeno reparativo; mejora la oxigenación intersticial; elimina tejido adiposo localizado; reduce flacidez y medidas.","**Aplicaciones**: estrías, edema, **celulitis (lipodistrofia ginecoide)**, problemas circulatorios, aumento de peso, pre y posoperatorio (cirugía estética, embarazo y parto), cicatrices, quemaduras."]}]}],"caso_clinico":{"titulo":"Piernas gruesas y dolorosas que no adelgazan","presentacion":"Mujer de 34 años que desde la pubertad presenta aumento progresivo de volumen de caderas a tobillos en ambas piernas, con pies normales. Refiere dolor al roce, hematomas frecuentes y pesadez vespertina. Ha perdido 8 kg con dieta sin reducir el volumen de las piernas. Stemmer negativo, fóvea negativa.","preguntas":[{"pregunta":"¿Cuál es el diagnóstico más probable y su tipo?","respuesta":"**Lipedema tipo 3** (caderas hasta tobillos, respetando pies): bilateral, doloroso (alodinia), hematomas fáciles, Stemmer y fóvea negativos, sin respuesta a la pérdida de peso."},{"pregunta":"¿Cómo lo diferencias del linfedema?","respuesta":"En el linfedema hay afectación de **pies** y **Stemmer +**, suele ser unilateral o asimétrico, sin hematomas ni dolor; aquí ocurre lo contrario."},{"pregunta":"¿Qué tratamiento propones?","respuesta":"**TDC**: DLM con presiones suaves, **compresión** (incluso pantalón tipo ciclista), ejercicio aeróbico suave, control de peso (**IMC ≤ 25**) con nutrición antiinflamatoria; valorar **liposucción tumescente** si el dolor persiste, con terapia linfática antes y después."}]},"preguntate":[{"pregunta":"Define el lipedema y su epidemiología.","respuesta":"Trastorno de distribución de la grasa sobre todo en MMII, relacionado con hormonas, en el 16 % de mujeres; enfermedad según la OMS desde 2018."},{"pregunta":"¿Qué zonas respeta el lipedema?","respuesta":"Pies y manos (apariencia de hombro inverso)."},{"pregunta":"¿Cómo son el Stemmer y la fóvea en el lipedema puro?","respuesta":"Stemmer negativo; fóvea negativa o de desaparición inmediata."},{"pregunta":"Describe el dolor del lipedema.","respuesta":"Sordo, pesado y apremiante, femoral y tibial anterior, provocado por tacto o presión leve (alodinia), peor al final del día."},{"pregunta":"¿En qué consiste el test de la pinza rodada?","respuesta":"Rodar un pliegue de piel entre pulgares e índices: positivo si es más compacto, rueda peor y duele."},{"pregunta":"Diferencia lipedema y obesidad.","respuesta":"La obesidad aumenta el volumen globalmente sin dolor; el lipedema, de forma desproporcionada en los miembros y con dolor."},{"pregunta":"Enumera los estadios del lipedema.","respuesta":"1 piel de naranja, 2 piel de colchón, 3 piel ondeada con gran deformidad."},{"pregunta":"¿Cuál es el objetivo de la liposucción en el lipedema?","respuesta":"Reducir el dolor, mejorar la calidad de vida y prevenir la progresión, no eliminar grandes volúmenes de grasa."},{"pregunta":"¿Qué es la enfermedad de Dercum?","respuesta":"Un síndrome de grasa subcutánea dolorosa con alteraciones del sueño, ansiedad, depresión, cognitivas, taquicardia, disnea y digestivas."}],"glosario":[{"termino":"Lipedema","definicion":"Acumulación desproporcionada y dolorosa de grasa en los miembros."},{"termino":"Hombro inverso","definicion":"Imagen del lipedema que respeta pies y manos."},{"termino":"Alodinia","definicion":"Dolor provocado por un estímulo normalmente indoloro, como el tacto."},{"termino":"Pinza rodada","definicion":"Test de rodar un pliegue cutáneo para valorar densidad y dolor."},{"termino":"Enfermedad de Dercum","definicion":"Síndrome de lipomas dolorosos con síntomas sistémicos."},{"termino":"Flebolipedema","definicion":"Lipedema con componente venoso asociado."},{"termino":"Lipoflebolinfedema","definicion":"Lipedema con componente venoso y linfático."},{"termino":"Liposucción tumescente","definicion":"Extracción de grasa con infiltración previa de solución, mediante microcánulas."},{"termino":"Fisioterapia dermatofuncional","definicion":"Fisioterapia orientada a la función del sistema tegumentario."},{"termino":"Tecarterapia","definicion":"Radiofrecuencia capacitiva/resistiva que produce calor profundo."},{"termino":"Lipodistrofia ginecoide","definicion":"Celulitis estética."}],"fuentes":["Aksoy H, Karadag AS, Wollina U. Cause and management of lipedema-associated pain. Dermatol Ther. 2021;34(1):e14364.","Herbst KL, et al. Lipedema: una enfermedad relativamente común con conceptos erróneos extremadamente comunes. Plast Reconstr Surg Glob Open. 2016;4(9):e1043.","Shavit E, Wollina U, Alavi A. El lipoedema no es linfedema. Int Wound J. 2018;15:921-928.","Al-Ghadban S, Herbst KL, Bunnell BA. Lipedema: un trastorno doloroso del tejido adiposo. IntechOpen; 2019.","Milani GB, João SMA, Farah EA. Fundamentos da Fisioterapia dermato-funcional. Fisioter Pesqui. 2006;13(1):37-43.","T4- Edemas (III): Lipedemas (Universidad Europea)."],"qcm":[{"pregunta":"¿En qué año declaró la OMS el lipedema como enfermedad según el tema?","opciones":["2021","2018","2008","2014"],"correcta":1,"explicacion":"El lipedema fue declarado enfermedad por la OMS en 2018.","por_opcion":["❌ Es el año del artículo de Aksoy sobre el dolor.","✅ Literal.","❌ No es el año citado.","❌ No es el año citado."]},{"pregunta":"¿Qué rasgo corresponde al lipedema y NO al linfedema?","opciones":["Hematomas con facilidad","Signo de Stemmer positivo","Afectación de los pies","Erisipelas de repetición"],"correcta":0,"explicacion":"El lipedema presenta fragilidad capilar con hematomas fáciles; el linfedema afecta pies, tiene Stemmer + y erisipelas frecuentes.","por_opcion":["✅ Rasgo del lipedema.","❌ Rasgo del linfedema.","❌ Rasgo del linfedema.","❌ Rasgo del linfedema; el lipedema no presenta erisipelas."]},{"pregunta":"¿Cómo es la evolución del lipedema?","opciones":["De distal a proximal, desde el pie","Centrífuga y rápida","Unilateral, de la rodilla al pie","De proximal a distal, desde la cresta ilíaca al tobillo"],"correcta":3,"explicacion":"Evoluciona de proximal a distal, de la cresta ilíaca hasta el tobillo, sin afectar pies ni dedos.","por_opcion":["❌ Típico del linfedema primario.","❌ Típico del linfedema maligno.","❌ Es bilateral y no afecta el pie.","✅ Literal."]},{"pregunta":"Respecto al signo de la fóvea en el lipedema:","opciones":["Siempre es positivo y persistente","No se puede explorar","Es negativo o de desaparición inmediata","Solo es positivo en el estadio 1"],"correcta":2,"explicacion":"El signo de fóvea es negativo o de desaparición inmediata.","por_opcion":["❌ Eso describe edemas con líquido libre.","❌ Sí se explora.","✅ Literal.","❌ No se describe así."]},{"pregunta":"¿Qué diferencia esencial hay entre obesidad y lipedema?","opciones":["La obesidad produce dolor continuado y el lipedema no","El lipedema responde bien a la dieta","En el lipedema el aumento de volumen es desproporcionado en los miembros y doloroso","La obesidad respeta los pies y el lipedema no"],"correcta":2,"explicacion":"En la obesidad la ganancia es global y no dolorosa; en el lipedema es desproporcionada en los miembros con dolor y pesadez.","por_opcion":["❌ Es al revés.","❌ No responde a la pérdida de peso.","✅ Literal.","❌ Es el lipedema el que respeta los pies."]},{"pregunta":"El dolor del lipedema provocado por el tacto o una presión leve se denomina:","opciones":["Disestesia","Alodinia","Hiperpatía","Causalgia"],"correcta":1,"explicacion":"El tema califica de alodinia el dolor desencadenado por tacto o presión menor.","por_opcion":["❌ No es el término usado.","✅ Literal.","❌ No es el término usado.","❌ No es el término usado."]},{"pregunta":"Un test de la pinza rodada positivo en el lipedema muestra:","opciones":["Pliegue más compacto, peor rodamiento y dolor","Pliegue que no se puede formar en el 2.º dedo","Ausencia de pliegue por fibrosis total","Hundimiento persistente tras presión"],"correcta":0,"explicacion":"Hallazgos patológicos: consistencia más compacta, peor rodamiento y dolor en la zona hiperálgica.","por_opcion":["✅ Literal.","❌ Es el signo de Stemmer.","❌ No se describe.","❌ Es el signo de la fóvea."]},{"pregunta":"Lipedema de caderas hasta rodillas: tipo","opciones":["1","3","5","2"],"correcta":3,"explicacion":"Tipo 1 caderas, nalgas y pelvis; tipo 2 caderas a rodillas; tipo 3 caderas a tobillos; tipo 5 caderas a tobillos y brazos.","por_opcion":["❌ Solo caderas, nalgas y pelvis.","❌ Llega a tobillos.","❌ Incluye brazos.","✅ Literal."]},{"pregunta":"Lipedema con piel de colchón y nódulos con grandes hoyos: estadio","opciones":["1","4","2","3"],"correcta":2,"explicacion":"Estadio 1 piel de naranja; 2 piel de colchón con grandes hoyos; 3 piel ondeada con gran deformidad.","por_opcion":["❌ Piel de naranja.","❌ No existe estadio 4 en esta clasificación.","✅ Literal.","❌ Piel ondeada."]},{"pregunta":"¿Cuál de estos rasgos orienta a IVC (flebedema) y no a lipedema?","opciones":["Hematomas fáciles","Edema con fóvea que mejora con reposo y elevación","Dolor a la presión leve","Respeto de los pies"],"correcta":1,"explicacion":"La IVC presenta hiperpigmentación, varices, úlceras y edema con fóvea que responde a reposo, elevación, compresión y ejercicio.","por_opcion":["❌ Rasgo del lipedema.","✅ Rasgo de la IVC.","❌ Rasgo del lipedema.","❌ Rasgo del lipedema."]},{"pregunta":"¿Qué caracteriza a la enfermedad de Dercum?","opciones":["Crecimientos de grasa dolorosa con síntomas sistémicos como ansiedad y trastornos del sueño","Varices y úlceras maleolares","Edema unilateral con Stemmer positivo","Edema matutino periorbitario"],"correcta":0,"explicacion":"Dercum: grasa dolorosa en tejido subcutáneo con trastornos del sueño, ansiedad, depresión, dificultades cognitivas, taquicardia, disnea y digestivos.","por_opcion":["✅ Literal.","❌ Describe la IVC.","❌ Describe el linfedema.","❌ Describe el edema renal."]},{"pregunta":"¿Qué opción de compresión cita el tema como económica en lipedema sin síntomas venosos?","opciones":["Vendaje multicapa con almohadillado diurno","Presoterapia secuencial diaria","Media de compresión clase IV a medida","Pantalón tipo ciclista"],"correcta":3,"explicacion":"El pantalón tipo ciclista es una opción económica en pacientes sin síntomas venosos.","por_opcion":["❌ El tema cita vendaje de baja elasticidad sin almohadillado de uso nocturno.","❌ No se cita como opción económica.","❌ No se cita.","✅ Literal."]},{"pregunta":"¿Cuál es el objetivo principal de la liposucción tumescente microcanular en el lipedema?","opciones":["Reducir el dolor y mejorar la calidad de vida","Corregir el linfedema asociado","Sustituir de forma definitiva la terapia descongestiva","Eliminar grandes cantidades de masa grasa"],"correcta":0,"explicacion":"No pretende reducir grandes cantidades de grasa, sino reducir el dolor, mejorar la calidad de vida y prevenir la progresión; antes y después se aplica terapia linfática.","por_opcion":["✅ Literal.","❌ No es su objetivo.","❌ Se aplica terapia descongestiva antes y después.","❌ El tema lo niega."]},{"pregunta":"Según el tema, ¿qué IMC no debería sobrepasarse en el control del lipedema?","opciones":["25","35","20","30"],"correcta":0,"explicacion":"El control del peso ayuda (no sobrepasar IMC > 25), aunque no reduce la grasa acumulada en los MMII.","por_opcion":["✅ Literal.","❌ No es la cifra.","❌ No es la cifra.","❌ Umbral de obesidad, no el citado."]},{"pregunta":"¿Dónde y cuándo surge la fisioterapia dermatofuncional?","opciones":["España, 1987","Australia, 2005","Alemania, 1979","Brasil, 1997"],"correcta":3,"explicacion":"Surge en Brasil en 1997 y se reconoce la actuación del fisioterapeuta en 2000–2001.","por_opcion":["❌ No corresponde.","❌ No corresponde.","❌ 1979 es la fundación de la Földiklinik.","✅ Literal."]}],"asignatura":"Drenaje linfático","tema":4.3,"fecha":"2026-11-09"}</script>

const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips">${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
