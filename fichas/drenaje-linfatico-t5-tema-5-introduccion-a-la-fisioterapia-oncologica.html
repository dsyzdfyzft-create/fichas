<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 5: Introducción a la fisioterapia oncológica · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>

<script id="datos" type="application/json">{"titulo":"Tema 5: Introducción a la fisioterapia oncológica","subtitulo":"Qué es el cáncer, cómo se clasifica y se trata, qué efectos secundarios generan sus tratamientos y cómo interviene el fisioterapeuta antes, durante y después del proceso oncológico.","resumen":["Según la **OMS**, el cáncer es un **amplio grupo de enfermedades** caracterizadas por la **multiplicación rápida de células anormales que se propagan más allá de sus límites** y pueden invadir otros órganos (**metástasis**, principal causa de muerte por cáncer); la progresión típica es **normal → hiperplasia → displasia → cáncer**.","Es el **principal problema de salud pública mundial** y una de las **4 principales causas de muerte antes de los 70 años**: en 2020 hubo **19.292.789 casos nuevos** (mama 11,7 %, pulmón 11,4 %, colorrecto 10 %) y el **pulmón** encabeza la mortalidad (18,4 %).","Se clasifica por su **tejido de origen** (carcinoma, sarcoma, teratoma, adenocarcinoma, blastoma, leucemia, mieloma, linfoma) y se trata con **tratamiento local** (cirugía, radioterapia) y **farmacológico** (quimioterapia, inmunoterapia, terapia dirigida, hormonal), cada uno con efectos secundarios propios.","La **fisioterapia oncológica** busca **preservar, mantener, desarrollar y restaurar el sistema cinético funcional** y **prevenir, mejorar y tratar las secuelas** de cualquier tratamiento oncológico, dentro de un **equipo multidisciplinar** y **antes, durante y después** del tratamiento.","Interviene en el **prequirúrgico (idealmente 15 días antes)**, en **UCI** y en el postquirúrgico (dolor, respiratorio, fatiga, linfático-venoso, cicatriz), con el **ejercicio terapéutico** como eje frente a **dolor, fatiga, problemas articulares y astenia**, y con **prevención del linfedema**, ya que tras cirugía, linfadenectomía o radioterapia existe un **linfedema subclínico o estadio 0 (ISL)**."],"objetivos":["Definir cáncer, metástasis, hiperplasia y displasia y conocer los datos epidemiológicos de GLOBOCAN 2020.","Clasificar los cánceres según su tejido de origen.","Diferenciar los tratamientos locales y farmacológicos y sus efectos secundarios principales.","Definir la fisioterapia oncológica, sus objetivos y su campo de actuación dentro del equipo multidisciplinar.","Planificar la intervención fisioterápica pre y postquirúrgica, incluida la prevención del linfedema."],"ideas_clave":["La **metástasis** (diseminación a otros órganos) es la **principal causa de muerte por cáncer**.","**Hiperplasia** = más células de aspecto normal; **displasia** = células anormales pero **no cancerosas**; ambas **a veces, no siempre**, evolucionan a cáncer.","Incidencia mundial 2020: **mama (11,7 %) > pulmón (11,4 %) > colorrecto (10 %)**; mortalidad: **pulmón (18,4 %) > colorrecto (9,9 %) > hígado (7,6 %)**.","**Carcinoma** = epitelios; **sarcoma** = tejido conectivo; **linfoma** = tejido linfático; **mieloma** = médula ósea; **leucemia** = tejidos formadores de células sanguíneas.","**Quimioterapia** = citotóxica y **sistémica** (actúa en primario y metástasis); **terapia dirigida** = más precisa y **menos tóxica**; **inmunoterapia** = usa el propio sistema inmunitario.","Radioterapia: efectos **tempranos** (fatiga y piel, leves y tratables) y **tardíos** (meses o años), que **dependen del área tratada y de la dosis**.","Fisioterapia oncológica: **preservar, mantener, desarrollar y restaurar** el sistema cinético funcional y **prevenir, mejorar y tratar secuelas**.","Tras **cirugía, linfadenectomía y/o radioterapia** existe un **linfedema subclínico o estadio 0 (ISL)** → la **prevención** es obligatoria."],"secciones":[{"id":"cancer-definicion","titulo":"Cáncer: definición y carcinogénesis","bloques":[{"tipo":"definicion","termino":"Cáncer (OMS)","texto":"Término genérico que designa un **amplio grupo de enfermedades que pueden afectar a cualquier parte del organismo**; es la **multiplicación rápida de células anormales que se propagan más allá de sus límites habituales** y pueden invadir partes adyacentes del cuerpo o extenderse a otros órganos."},{"tipo":"definicion","termino":"Metástasis","texto":"Proceso por el que las células cancerosas se **extienden a otros órganos**. Las metástasis son la **principal causa de muerte por cáncer**."},{"tipo":"parrafo","texto":"En condiciones normales, las células se forman y se multiplican (**división celular**) a medida que el cuerpo las necesita; cuando envejecen o se dañan, **mueren** y son reemplazadas. En el cáncer este orden se rompe: células anormales o dañadas se **multiplican cuando no deberían** y pueden formar **tumores** (bultos de tejido), que pueden ser **malignos** (cancerosos) o **benignos** (no cancerosos)."},{"tipo":"esquema","titulo":"De la célula normal al cáncer","mermaid":"flowchart LR\n  N[\"Célula normal\"] --> H[\"Hiperplasia: más células, aspecto normal\"]\n  H --> D[\"Displasia: células anormales, no cancerosas\"]\n  D --> C[\"Cáncer: invasión de límites\"]\n  C --> M[\"Metástasis: otros órganos\"]\n  H -.->|\"a veces no progresa\"| N2[\"Sin cáncer\"]\n  D -.->|\"a veces no progresa\"| N2","pie":"Hiperplasia y displasia pueden, pero no siempre, evolucionar a cáncer."},{"tipo":"figura","pagina":4,"pie":"Secuencia histológica normal → hiperplasia → displasia → cáncer: observa cómo la hiperplasia solo aumenta el número de células, la displasia altera su aspecto y el cáncer rompe la arquitectura del tejido.","src":"img/drenaje-linfatico-t5-tema-5-introduccion-a-la-fisioterapia-oncologica-p4.jpg"},{"tipo":"tabla","titulo":"Hiperplasia vs displasia vs cáncer","columnas":["Estado","Número de células","Aspecto al microscopio","¿Canceroso?"],"filas":[["Hiperplasia","**Aumentado**","**Normal**","No (a veces evoluciona)"],["Displasia","Variable","**Anormal**","**No** (a veces evoluciona)"],["Cáncer","Multiplicación sin control","Anormal e invasivo","**Sí**; puede metastatizar"]]},{"tipo":"alerta","texto":"Trampa: «la displasia es un cáncer en fase inicial». **Falso** según el PDF: en la displasia las células se ven anormales **pero no son cancerosas**; tanto la hiperplasia como la displasia **a veces, pero no siempre**, se convierten en cáncer."}]},{"id":"epidemiologia-clasificacion","titulo":"Epidemiología y clasificación","bloques":[{"tipo":"parrafo","texto":"El cáncer es **el principal problema de salud pública en el mundo** y **una de las 4 principales causas de muerte antes de los 70 años**. Los datos del PDF proceden de **GLOBOCAN 2020** (Global Cancer Observatory, IARC/OMS)."},{"tipo":"dato","valor":"19.292.789","texto":"Casos nuevos estimados de cáncer en el mundo en 2020 (ambos sexos, todas las edades)."},{"tipo":"tabla","titulo":"GLOBOCAN 2020: incidencia y mortalidad","columnas":["Puesto","Casos nuevos (mundo)","Muertes (gráfico del PDF)"],"filas":[["1.º","**Mama**: 2.261.419 (11,7 %)","**Pulmón**: 2.230.670 (18,4 %)"],["2.º","**Pulmón**: 2.206.771 (11,4 %)","**Colorrecto**: 1.198.487 (9,9 %)"],["3.º","**Colorrecto**: 1.931.590 (10 %)","**Hígado**: 919.310 (7,6 %)"],["4.º","Próstata: 1.414.259 (7,3 %)","Estómago: 886.383 (7,3 %)"],["5.º","Estómago: 1.089.103 (5,6 %)","Mama: 842.107 (6,9 %)"],["6.º","Hígado: 905.677 (4,7 %)","Páncreas: 611.013 (5 %)"],["7.º","Cuello uterino: 604.127 (3,1 %)","Esófago: 595.218 (4,9 %)"],["Otros","8.879.843 (46 %)","4.849.010 (40 %)"],["Total","**19.292.789**","**12.132.198**"]]},{"tipo":"figura","pagina":5,"pie":"Casos nuevos de cáncer en el mundo en 2020 (GLOBOCAN): mama, pulmón y colorrecto encabezan la incidencia.","src":"img/drenaje-linfatico-t5-tema-5-introduccion-a-la-fisioterapia-oncologica-p5.jpg"},{"tipo":"figura","pagina":6,"pie":"Muertes por cáncer en 2020 (GLOBOCAN): el pulmón domina la mortalidad, seguido de colorrecto e hígado; la mama baja al 5.º puesto.","src":"img/drenaje-linfatico-t5-tema-5-introduccion-a-la-fisioterapia-oncologica-p6.jpg"},{"tipo":"alerta","texto":"No confundas incidencia con mortalidad: el cáncer **más frecuente** en 2020 es el de **mama (11,7 %)**, pero el que **más muertes** causa es el de **pulmón (18,4 %)**."},{"tipo":"tabla","titulo":"Clasificación según localización (tejido de origen)","columnas":["Tipo","Tejido de origen"],"filas":[["**Carcinoma**","Epitelios"],["**Sarcoma**","Tejido conectivo (hueso, cartílago o músculo)"],["**Teratoma**","Células germinales"],["**Adenocarcinoma**","Tejido glandular"],["**Blastoma**","Tejido embrionario de los órganos"],["**Leucemia**","Tejidos que forman células sanguíneas"],["**Mieloma**","Médula ósea"],["**Linfoma**","Tejido linfático"]]},{"tipo":"alerta","texto":"**Leucemia** (tejidos formadores de células sanguíneas) ≠ **mieloma** (médula ósea) ≠ **linfoma** (tejido linfático). Y el **sarcoma** nace del tejido **conectivo**, no del epitelio (eso es el carcinoma)."}]},{"id":"tratamiento-cancer","titulo":"Tratamiento del cáncer","bloques":[{"tipo":"esquema","titulo":"Tratamientos oncológicos","mermaid":"flowchart TD\n  T[\"Tratamiento del cáncer\"] --> L[\"Local\"]\n  T --> F[\"Farmacológico\"]\n  L --> CI[\"Cirugía: prevenir, diagnosticar, estadificar, tratar\"]\n  L --> RT[\"Radioterapia: rupturas en el ADN\"]\n  F --> QT[\"Quimioterapia: citotóxica, sistémica\"]\n  F --> IT[\"Inmunoterapia: sistema inmunitario propio\"]\n  F --> TD[\"Terapia dirigida: precisa, menos tóxica\"]\n  F --> TH[\"Hormonal: mama y próstata\"]","pie":"Clasificación de los tratamientos según el PDF (Cancer.org)."},{"tipo":"tarjetas","items":[{"etiqueta":"Local","titulo":"Cirugía","texto":"Para **prevenir**, **diagnosticar** (biopsia), **clasificar por etapas** (cuánto cáncer hay y cuánto se ha propagado) y **tratar**."},{"etiqueta":"Local","titulo":"Radioterapia","texto":"Sola o con otros tratamientos. Usa partículas u ondas de **alta energía** (rayos X, gamma, electrones, protones) que producen **pequeñas rupturas en el ADN**, impidiendo que las células crezcan y se dividan y provocando su muerte."},{"etiqueta":"Fármaco","titulo":"Quimioterapia","texto":"Medicamentos **citotóxicos**; tratamiento **sistémico** (actúa en metástasis y tumor primario). Objetivos: **curar, controlar** (detener crecimiento y propagación) y **paliar** síntomas. Puede darse **antes o después** de cirugía o radioterapia."},{"etiqueta":"Fármaco","titulo":"Inmunoterapia","texto":"Utiliza el **propio sistema inmunitario** del paciente, cambiando su funcionamiento para atacar las células cancerígenas."},{"etiqueta":"Fármaco","titulo":"Terapia dirigida","texto":"Fármacos que **identifican y atacan con precisión** ciertos tipos de células cancerosas; sola o combinada; **menos tóxica que la quimioterapia**."},{"etiqueta":"Fármaco","titulo":"Tratamiento hormonal","texto":"Bloquea o altera hormonas: **evitar que el cuerpo la produzca**, **impedir que se adhiera** a las células cancerosas o **alterarla** para que no funcione. Sobre todo en cáncer de **mama o próstata** (dependientes de hormonas sexuales)."}]},{"tipo":"dato","valor":"3 objetivos de la QT","texto":"**Curar** (intención curativa), **controlar** (detener crecimiento y propagación) y **paliar** (disminuir síntomas)."},{"tipo":"alerta","texto":"La radioterapia y la cirugía son tratamientos **locales**; la quimioterapia es **sistémica** porque actúa tanto en el tumor primario como en las metástasis."}]},{"id":"efectos-secundarios","titulo":"Efectos secundarios de los tratamientos","bloques":[{"tipo":"tabla","titulo":"Radioterapia: efectos tempranos vs tardíos","columnas":["Aspecto","Tempranos","Tardíos"],"filas":[["Duración","Corto plazo; **desaparecen pocas semanas** tras el tratamiento","Pueden tardar **meses o incluso años** en aparecer"],["Gravedad","**Leves y tratables**","Pueden afectar a cualquier tejido irradiado"],["Determinante","—","**Área tratada y dosis** utilizada"],["Más comunes","**Fatiga** y **cambios en la piel**","Fatiga, piel, pérdida de cabello, **dolor, inflamación, complicaciones cardiacas, daño pulmonar, daño neural**, problemas intestinales"]]},{"tipo":"tabla","titulo":"Efectos secundarios de los tratamientos farmacológicos","columnas":["Tratamiento","Efectos secundarios del PDF"],"filas":[["Quimioterapia","Fatiga; alteraciones de cabello, piel y uñas; **trastornos hematológicos** (hematomas, sangrado fácil, anemia); infecciones; **problemas intestinales y renales** (náuseas, vómitos, diarrea, apetito, boca, ardores); **problemas cognitivos**; **dolor y neuropatías periféricas**; cambios de peso; **problemas cardiacos**"],["Inmunoterapia","La mayoría **no duran mucho** tras el tratamiento; fatiga; raros a largo plazo: **daño a los nervios** (incluidos cerebro y médula espinal)"],["Terapia dirigida","Diarrea y problemas de hígado; problemas de **coagulación y cicatrización**; **presión arterial alta**; **fatiga**; úlceras en la boca; problemas de piel y cabello"],["Hormonal – hombres","Sofocos; disminución del deseo sexual; disfunción eréctil; **pérdida ósea y riesgo de fracturas**; **fatiga**; **aumento de peso abdominal con pérdida de masa muscular**; **problemas de memoria**"],["Hormonal – mujeres","Sofocos; flujo, sequedad o irritación vaginal; disminución del deseo; **fatiga**; náuseas; dolor muscular y articular; **pérdida ósea y riesgo de fracturas**; más riesgo de otros cánceres, ACV, coágulos, cataratas y **enfermedades del corazón**"]]},{"tipo":"perla","texto":"Antes de cargar a un paciente en tratamiento hormonal, recuerda la **pérdida ósea con riesgo de fracturas**: progresa la carga de forma gradual y prioriza ejercicio de fuerza seguro. En quimioterapia, la **neuropatía periférica** obliga a vigilar equilibrio y sensibilidad en pies y manos."},{"tipo":"perla","texto":"Los trastornos hematológicos de la quimioterapia (**hematomas y sangrado fácil, anemia**) condicionan la presión de la masoterapia y la intensidad del ejercicio: adapta la dosis a la tolerancia y a la fatiga del día."},{"tipo":"alerta","texto":"Los efectos **tardíos** de la radioterapia **dependen del área tratada y de la dosis**: un paciente irradiado en tórax puede desarrollar meses o años después **daño pulmonar o complicaciones cardiacas** aunque se encuentre bien al terminar el tratamiento."}]},{"id":"fisioterapia-oncologica","titulo":"Rehabilitación y fisioterapia oncológica","bloques":[{"tipo":"definicion","termino":"Rehabilitación oncológica","texto":"Programa que ayuda a las personas con cáncer a **mantener y recuperar el bienestar físico y emocional**, **antes, durante y después** del tratamiento oncológico; permite una **recuperación más rápida y mejor** y una importante mejora de la **calidad de vida**."},{"tipo":"definicion","termino":"Fisioterapia oncológica","texto":"Campo de la Fisioterapia que tiene como objetivo **preservar, mantener, desarrollar y restaurar el sistema cinético funcional** y **prevenir, mejorar y tratar las secuelas** que se producen a causa de cualquier tratamiento oncológico."},{"tipo":"parrafo","texto":"Su finalidad última es **mejorar la funcionalidad y la calidad de vida**, **recuperando y/o minimizando secuelas físicas, sociales y emocionales**. El fisioterapeuta trabaja en un **equipo multidisciplinar** con oncólogos, enfermeros, terapeutas ocupacionales, psicólogos, neurólogos, nutricionistas, logopedas y trabajadores sociales."},{"tipo":"lista","items":["Alteraciones **respiratorias**, **cardíacas**, **ortopédicas** y **neurológicas**.","Alteraciones **circulatorias** y **locomotoras**.","Alteraciones **uroginecológicas** y **postquirúrgicas**.","Alteraciones **cognitivas** y **dolor**."]},{"tipo":"figura","pagina":21,"pie":"Campo de actuación de la fisioterapia oncológica: dolor de hombro, linfedema de MS, fatiga y dolor abdominal/pélvico convergen en el ejercicio terapéutico supervisado.","src":"img/drenaje-linfatico-t5-tema-5-introduccion-a-la-fisioterapia-oncologica-p21.jpg"},{"tipo":"parrafo","texto":"Las **alteraciones comunes** se relacionan con la **propia enfermedad, la intervención quirúrgica, la quimioterapia, la radiación, la terapia hormonal y la inmunoterapia**, y son **dolor, fatiga, problemas articulares y astenia**."},{"tipo":"tabla","titulo":"Alteraciones específicas según el tipo de cáncer","columnas":["Cáncer","Alteraciones que trata el fisioterapeuta"],"filas":[["**Mama**","**Prevención y/o tratamiento del linfedema**; secuelas de cirugía: **cicatriz, limitación funcional, síndromes axilares, alteraciones vasculonerviosas**"],["**Ginecológico y uroginecológico**","**Incontinencia** y **dolor**"],["**Cabeza y cuello**","Cirugía reconstructiva; **movilidad de mandíbula y cuello**; alteraciones de movilidad y equilibrio; **problemas articulares de hombro**"]]},{"tipo":"alerta","texto":"La fisioterapia oncológica **no empieza solo tras el alta**: actúa **antes, durante y después** del tratamiento, y su objetivo incluye **prevenir** secuelas, no únicamente tratarlas."}]},{"id":"pre-postquirurgico","titulo":"Intervención pre y postquirúrgica","bloques":[{"tipo":"dato","valor":"15 días antes","texto":"Inicio ideal del tratamiento prequirúrgico (si es posible) para preparar al paciente a nivel físico y psicológico."},{"tipo":"tabla","titulo":"Fases de intervención","columnas":["Fase","Contenidos"],"filas":[["**Prequirúrgica**","Enseñar **fisioterapia respiratoria** (respiraciones dirigidas, expansión torácica, drenaje de secreciones); **cuidados posturales**; **acondicionamiento físico** (ejercicio aeróbico y de fuerza)"],["**Postquirúrgica en UCI**","**Prevención de úlceras y tratamiento postural**; movilizaciones pasivas y/o activas generales; fisioterapia respiratoria; tratamiento del dolor; prevención; recuperación funcional"]]},{"tipo":"tabla","titulo":"Tratamiento postquirúrgico por problema","columnas":["Problema","Herramientas fisioterápicas"],"filas":[["**Dolor**","**Masoterapia** (criomasaje, digitopresión, roces, amasamiento, vibración); **puntos gatillo**; **electroterapia** (electroanalgesia, electroestimulación); **ejercicio y estiramientos (FCM)**; **hidroterapia (baños de contraste)**"],["**Alteraciones respiratorias**","Respiraciones dirigidas; fortalecimiento de musculatura respiratoria; expansiones costales; entrenamiento de capacidad inspiratoria; **espirometría incentivada**; drenaje de secreciones; **EDIC, ETGOL, CATR**"],["**Fatiga**","**Ejercicio físico aeróbico y de fuerza** con principios de **sobrecarga, supercompensación y especificidad**; estiramientos; **técnicas de relajación** (respiración)"],["**Alteraciones linfáticas y venosas**","Masaje circulatorio; **DLM**; ejercicio físico; prevención; movilizaciones activas; respiraciones; **TFD**"],["**Cicatriz**","**No si hay puntos o drenaje**; mantener la piel hidratada; minimizar riesgo de infección; **evitar adherencias**; **prevenir fibrosis**"]]},{"tipo":"alerta","texto":"Trampa: tratar la cicatriz desde el primer día. El PDF indica **no intervenir si hay puntos o drenaje**; después, el objetivo es hidratar, evitar infección, **adherencias y fibrosis**."},{"tipo":"parrafo","texto":"El **ejercicio terapéutico** es la herramienta transversal: actúa a la vez sobre **dolor, fatiga, problemas articulares y astenia**, que son las alteraciones comunes del paciente oncológico. Combina trabajo **aeróbico**, de **fuerza**, **flexibilidad** y **equilibrio**, dosificado según la fase del tratamiento."},{"tipo":"perla","texto":"Frente a la **fatiga oncológica**, el reposo absoluto no es la respuesta: el PDF propone **ejercicio aeróbico y de fuerza** aplicando sobrecarga, supercompensación y especificidad, junto a estiramientos y relajación respiratoria."}]},{"id":"prevencion-linfedema","titulo":"Prevención del linfedema","bloques":[{"tipo":"parrafo","texto":"En **cualquier tratamiento oncológico en el que haya existido cirugía, extirpación de ganglios y/o radioterapia**, existe un **linfedema subclínico o estadio 0** según la **International Society of Lymphology (ISL)**: la capacidad de transporte linfático ya está reducida aunque aún no haya edema visible. Por eso la palabra clave es **PREVENCIÓN**."},{"tipo":"definicion","termino":"Linfedema subclínico (estadio 0 ISL)","texto":"Fase latente en la que el sistema linfático está dañado (cirugía, linfadenectomía, radioterapia) pero **sin edema clínico**; obliga a aplicar medidas preventivas de por vida."},{"tipo":"esquema","titulo":"Del tratamiento oncológico a la prevención","mermaid":"flowchart TD\n  A[\"Cirugía, linfadenectomía o radioterapia\"] --> B[\"Linfedema subclínico: estadio 0 ISL\"]\n  B --> C[\"Prevención\"]\n  C --> C1[\"Medidas posturales en postoperatorio inmediato\"]\n  C --> C2[\"Higiene postural y cuidados\"]\n  C2 --> D1[\"Hospital: evitar punciones y tensión en el brazo\"]\n  C2 --> D2[\"Aseo, tareas domésticas, alimentación\"]\n  C2 --> D3[\"Otros: picaduras, heridas, calor\"]\n  C2 --> D4[\"MMII: calzado adecuado, no ir descalzo\"]","pie":"Toda paciente operada o irradiada parte de un estadio 0 y requiere prevención."},{"tipo":"tabla","titulo":"Recomendaciones de prevención (PDF)","columnas":["Ámbito","Ejemplos ilustrados en el PDF"],"filas":[["Medidas posturales en el **postoperatorio inmediato**","Posición declive del miembro afectado"],["**Ámbito hospitalario**","Evitar **extracciones de sangre** y tomas de tensión en el miembro afectado"],["**Aseo personal**, **trabajos domésticos**, **alimentación**","Evitar depilación agresiva, heridas, cortes y quemaduras"],["**Otros**","Evitar **picaduras de insectos** y técnicas invasivas sobre la zona"],["**Si el linfedema es de MMII**","Evitar **tacones altos** e **ir descalzo**"]]},{"tipo":"figura","pagina":29,"pie":"Recomendaciones de prevención del linfedema: se desaconsejan tacones, ir descalzo, punciones venosas en el miembro afectado, depilación/compresión agresiva y se alerta sobre picaduras.","src":"img/drenaje-linfatico-t5-tema-5-introduccion-a-la-fisioterapia-oncologica-p29.jpg"},{"tipo":"perla","texto":"Desde la primera sesión con una paciente operada de mama con linfadenectomía, explícale que está en **estadio 0**: nada de punciones ni tensión en ese brazo, proteger la piel de heridas y picaduras y comunicar cualquier sensación de pesadez o aumento de volumen."},{"tipo":"alerta","texto":"No esperes a ver edema para actuar: según la ISL, **el linfedema ya existe en estadio 0** tras cirugía, extirpación ganglionar o radioterapia. La ausencia de hinchazón **no** significa ausencia de riesgo."}]}],"caso_clinico":{"titulo":"Elena, 52 años: cáncer de mama con linfadenectomía","presentacion":"Elena, 52 años, diagnosticada de cáncer de mama izquierda, ha sido operada (mastectomía con linfadenectomía axilar) y va a recibir radioterapia y tratamiento hormonal. Antes de la cirugía tuvo dos semanas de preparación con el fisioterapeuta. Ahora, a los 10 días de la intervención, conserva el drenaje, refiere dolor en la axila, limitación de la elevación del hombro y mucho cansancio. No presenta aumento de volumen del brazo.","preguntas":[{"pregunta":"¿Tiene Elena linfedema? ¿Qué implica para su tratamiento?","respuesta":"Aunque no tenga aumento de volumen, tras **cirugía con extirpación ganglionar y radioterapia** presenta un **linfedema subclínico o estadio 0 (ISL)**. Implica aplicar desde ya **medidas de prevención**: posturales en el postoperatorio inmediato, higiene postural y cuidados (no punciones ni tomas de tensión en el brazo izquierdo, proteger la piel, evitar picaduras)."},{"pregunta":"¿Se puede tratar ya la cicatriz? Justifícalo.","respuesta":"**No**, porque aún tiene **drenaje**: el PDF indica no tratar la cicatriz si hay puntos o drenaje. Cuando se retiren, el objetivo será mantener la piel hidratada, minimizar el riesgo de infección, **evitar adherencias y prevenir fibrosis**."},{"pregunta":"¿Cómo abordarías su dolor, la limitación del hombro y la fatiga, teniendo en cuenta los tratamientos que va a recibir?","respuesta":"Dolor: masoterapia suave lejos de la herida, electroanalgesia, ejercicio y estiramientos. Hombro: movilizaciones activas progresivas (secuelas de cirugía de mama: limitación funcional, síndromes axilares). Fatiga: **ejercicio aeróbico y de fuerza** con sobrecarga, supercompensación y especificidad, más relajación respiratoria. Vigilar efectos de la radioterapia (fatiga y piel tempranos) y de la terapia hormonal (**pérdida ósea y riesgo de fracturas**, fatiga, dolor articular)."}]},"preguntate":[{"pregunta":"Define cáncer según la OMS y explica qué es la metástasis.","respuesta":"Amplio grupo de enfermedades con multiplicación rápida de células anormales que se propagan más allá de sus límites y pueden invadir otros órganos. La metástasis es esa extensión a otros órganos y es la principal causa de muerte por cáncer."},{"pregunta":"Diferencia hiperplasia y displasia.","respuesta":"En la hiperplasia hay más células de aspecto normal; en la displasia las células se ven anormales pero no son cancerosas. Ambas pueden, aunque no siempre, evolucionar a cáncer."},{"pregunta":"¿Cuáles fueron los tres cánceres más incidentes y los tres más mortales en 2020?","respuesta":"Incidencia: mama (11,7 %), pulmón (11,4 %) y colorrecto (10 %). Mortalidad: pulmón (18,4 %), colorrecto (9,9 %) e hígado (7,6 %)."},{"pregunta":"¿De qué tejido se origina cada uno: carcinoma, sarcoma, linfoma, mieloma?","respuesta":"Carcinoma: epitelios. Sarcoma: tejido conectivo (hueso, cartílago, músculo). Linfoma: tejido linfático. Mieloma: médula ósea."},{"pregunta":"Explica el mecanismo de acción de la radioterapia y la diferencia entre sus efectos tempranos y tardíos.","respuesta":"Partículas u ondas de alta energía producen pequeñas rupturas en el ADN que impiden el crecimiento y la división celular. Los efectos tempranos (fatiga, piel) son leves, tratables y desaparecen en semanas; los tardíos aparecen meses o años después y dependen del área y la dosis."},{"pregunta":"¿Por qué la quimioterapia es un tratamiento sistémico y cuáles son sus objetivos?","respuesta":"Porque actúa en todo el organismo, sobre el tumor primario y las metástasis. Sus objetivos son curar, controlar el crecimiento y la propagación y paliar síntomas."},{"pregunta":"¿Qué mecanismos utiliza el tratamiento hormonal y en qué cánceres se usa sobre todo?","respuesta":"Evitar que el cuerpo produzca la hormona, impedir que se adhiera a las células cancerosas o alterarla para que no funcione. Sobre todo en cáncer de mama y próstata."},{"pregunta":"Define fisioterapia oncológica y su finalidad.","respuesta":"Campo de la fisioterapia que busca preservar, mantener, desarrollar y restaurar el sistema cinético funcional y prevenir, mejorar y tratar las secuelas de cualquier tratamiento oncológico, para mejorar funcionalidad y calidad de vida minimizando secuelas físicas, sociales y emocionales."},{"pregunta":"¿Qué incluye el tratamiento prequirúrgico y cuándo conviene iniciarlo?","respuesta":"Si es posible, 15 días antes: enseñar fisioterapia respiratoria (respiraciones dirigidas, expansión torácica, drenaje de secreciones), cuidados posturales y acondicionamiento aeróbico y de fuerza."},{"pregunta":"¿Por qué toda paciente con linfadenectomía o radioterapia requiere prevención del linfedema?","respuesta":"Porque, según la ISL, tras cirugía, extirpación de ganglios y/o radioterapia ya existe un linfedema subclínico o estadio 0, aunque no haya edema visible."}],"glosario":[{"termino":"Metástasis","definicion":"Extensión del cáncer a órganos distintos del de origen; principal causa de muerte por cáncer."},{"termino":"Hiperplasia","definicion":"Aumento del número de células de aspecto normal en un tejido."},{"termino":"Displasia","definicion":"Células de aspecto anormal que todavía no son cancerosas."},{"termino":"Carcinoma","definicion":"Cáncer originado en epitelios."},{"termino":"Sarcoma","definicion":"Cáncer del tejido conectivo (hueso, cartílago, músculo)."},{"termino":"Linfoma","definicion":"Cáncer del tejido linfático."},{"termino":"Citotóxico","definicion":"Capaz de destruir células; propiedad de la quimioterapia estándar."},{"termino":"Terapia dirigida","definicion":"Fármacos que atacan con precisión ciertos tipos de células cancerosas; menos tóxica que la quimioterapia."},{"termino":"Inmunoterapia","definicion":"Tratamiento que modifica el sistema inmunitario propio para atacar el cáncer."},{"termino":"Astenia","definicion":"Debilidad o falta de energía generalizada; alteración común del paciente oncológico."},{"termino":"Linfedema subclínico (estadio 0 ISL)","definicion":"Daño linfático latente sin edema visible tras cirugía, linfadenectomía o radioterapia."},{"termino":"Espirometría incentivada","definicion":"Dispositivo que estimula inspiraciones profundas con retroalimentación visual."},{"termino":"GLOBOCAN","definicion":"Base de datos de incidencia y mortalidad del cáncer del Global Cancer Observatory (IARC/OMS)."}],"fuentes":["Organización Mundial de la Salud (OMS). Definición de cáncer.","GLOBOCAN 2020. Global Cancer Observatory (gco.iarc.fr), IARC/OMS.","Cancer.org (American Cancer Society): tratamientos y efectos secundarios.","International Society of Lymphology (ISL): estadio 0 del linfedema."],"qcm":[{"pregunta":"Según la OMS, ¿cuál es la principal causa de muerte por cáncer?","opciones":["Las metástasis","Las infecciones secundarias a la inmunosupresión","La toxicidad de la quimioterapia","La invasión local del tumor primario"],"correcta":0,"explicacion":"La OMS define la metástasis como la extensión de las células cancerosas a otros órganos y señala que las metástasis son la principal causa de muerte por cáncer.","por_opcion":["✅ Dato literal de la definición de la OMS.","❌ Las infecciones son un efecto secundario de la quimioterapia.","❌ La toxicidad es un efecto secundario, no la principal causa de muerte.","❌ La invasión local es grave, pero la OMS señala a las metástasis."]},{"pregunta":"Al microscopio, un tejido muestra células de aspecto anormal que todavía no son cancerosas. ¿Qué describe?","opciones":["Displasia","Carcinoma in situ invasivo","Metástasis","Hiperplasia"],"correcta":0,"explicacion":"En la displasia las células se ven anormales al microscopio pero no son cancerosas; en la hiperplasia hay más células de aspecto normal.","por_opcion":["✅ Definición del PDF.","❌ Un tumor invasivo ya es cáncer.","❌ La metástasis es diseminación de un cáncer ya establecido.","❌ La hiperplasia aumenta el número de células, pero su aspecto es normal."]},{"pregunta":"Según GLOBOCAN 2020, ¿qué cáncer tuvo mayor número de casos nuevos en el mundo?","opciones":["Colorrecto","Mama","Pulmón","Próstata"],"correcta":1,"explicacion":"El cáncer de mama fue el más incidente en 2020 (2.261.419 casos, 11,7 %), seguido del de pulmón (11,4 %) y colorrecto (10 %).","por_opcion":["❌ El colorrecto fue 3.º (10 %).","✅ 11,7 % de los casos nuevos.","❌ El pulmón fue 2.º en incidencia (11,4 %), aunque 1.º en mortalidad.","❌ La próstata fue 4.ª (7,3 %)."]},{"pregunta":"En el gráfico de mortalidad por cáncer de 2020 del PDF, el segundo puesto corresponde al cáncer de:","opciones":["Estómago","Hígado","Colorrecto","Mama"],"correcta":2,"explicacion":"Mortalidad 2020: pulmón (18,4 %), colorrecto (9,9 %), hígado (7,6 %), estómago (7,3 %), mama (6,9 %).","por_opcion":["❌ El estómago es 4.º (7,3 %).","❌ El hígado es 3.º (7,6 %).","✅ 1.198.487 muertes (9,9 %).","❌ La mama ocupa el 5.º puesto en mortalidad."]},{"pregunta":"Un tumor originado en el tejido glandular se denomina:","opciones":["Adenocarcinoma","Blastoma","Teratoma","Sarcoma"],"correcta":0,"explicacion":"Según la clasificación por localización, el adenocarcinoma se origina en el tejido glandular.","por_opcion":["✅ Tejido glandular.","❌ El blastoma surge del tejido embrionario de los órganos.","❌ El teratoma surge de células germinales.","❌ El sarcoma surge del tejido conectivo."]},{"pregunta":"¿Cuál de las siguientes asociaciones tumor–tejido de origen es correcta?","opciones":["Linfoma – tejido linfático","Mieloma – tejido linfático","Sarcoma – epitelios","Leucemia – médula ósea exclusivamente"],"correcta":0,"explicacion":"El PDF asocia linfoma con tejido linfático, mieloma con médula ósea, leucemia con tejidos formadores de células sanguíneas y sarcoma con tejido conectivo.","por_opcion":["✅ Asociación correcta.","❌ El mieloma se origina en la médula ósea.","❌ Los epitelios originan carcinomas.","❌ El PDF define la leucemia en tejidos que forman células sanguíneas."]},{"pregunta":"¿Qué función de la cirugía oncológica implica determinar cuánto cáncer hay y cuánto se ha propagado?","opciones":["Paliar","Diagnosticar mediante biopsia","Prevenir","Clasificar por etapas"],"correcta":3,"explicacion":"La cirugía sirve para prevenir, diagnosticar (biopsia), clasificar por etapas (cuánto cáncer hay y cuánto se ha propagado) y tratar.","por_opcion":["❌ La paliación se cita como objetivo de la quimioterapia.","❌ La biopsia confirma el diagnóstico, no la extensión.","❌ Prevenir consiste en extirpar tejido de riesgo.","✅ Definición de estadificación del PDF."]},{"pregunta":"El mecanismo por el que la radioterapia destruye las células cancerosas es:","opciones":["Producir pequeñas rupturas en el ADN que impiden crecer y dividirse","Inhibir de forma selectiva proteínas de señalización","Activar el sistema inmunitario contra el tumor","Bloquear los receptores hormonales tumorales"],"correcta":0,"explicacion":"La radiación de alta energía produce pequeñas rupturas en el ADN que evitan que las células cancerosas crezcan y se dividan y hacen que mueran.","por_opcion":["✅ Mecanismo descrito en el PDF.","❌ Se acerca a la terapia dirigida.","❌ Es el mecanismo de la inmunoterapia.","❌ Es el tratamiento hormonal."]},{"pregunta":"¿Por qué la quimioterapia se considera un tratamiento sistémico?","opciones":["Porque se administra siempre antes de la cirugía","Porque actúa sobre el tumor primario y las metástasis","Porque solo actúa sobre el sistema inmunitario","Porque se aplica localmente sobre el tumor"],"correcta":1,"explicacion":"La quimioterapia es citotóxica y sistémica: actúa en el tumor primario y en las metástasis. Puede administrarse antes o después de cirugía o radioterapia.","por_opcion":["❌ Puede darse antes o después de cirugía o radioterapia.","✅ Definición del PDF.","❌ Eso describiría la inmunoterapia.","❌ Lo local son la cirugía y la radioterapia."]},{"pregunta":"¿Qué tratamiento farmacológico describe el PDF como menos tóxico que la quimioterapia?","opciones":["Radioterapia","Tratamiento hormonal","Terapia dirigida","Inmunoterapia"],"correcta":2,"explicacion":"La terapia dirigida usa fármacos que identifican y atacan con precisión ciertos tipos de células cancerosas, sola o combinada, y es menos tóxica que la quimioterapia.","por_opcion":["❌ Es un tratamiento local, no farmacológico.","❌ No se describe así en el PDF.","✅ Literal del PDF.","❌ El PDF no la compara en toxicidad con la quimioterapia."]},{"pregunta":"Respecto a los efectos secundarios tardíos de la radioterapia, es correcto que:","opciones":["Desaparecen pocas semanas después del tratamiento","Se limitan a fatiga y cambios en la piel","Dependen del área tratada y de la dosis de radiación","Solo afectan al tumor irradiado"],"correcta":2,"explicacion":"Los efectos tardíos pueden tardar meses o años, pueden ocurrir en cualquier tejido normal irradiado y dependen del área tratada y de la dosis.","por_opcion":["❌ Eso describe los efectos tempranos.","❌ Fatiga y piel son los tempranos más comunes; los tardíos incluyen daño cardiaco, pulmonar y neural.","✅ Literal del PDF.","❌ Pueden afectar a cualquier tejido normal que haya recibido radiación."]},{"pregunta":"¿Cuál de los siguientes efectos secundarios atribuye el PDF específicamente a la terapia dirigida?","opciones":["Disfunción eréctil","Pérdida ósea con riesgo de fracturas","Sofocos","Presión arterial alta"],"correcta":3,"explicacion":"La terapia dirigida puede producir diarrea y problemas de hígado, de coagulación y cicatrización, presión arterial alta, fatiga, úlceras bucales y problemas de piel y cabello.","por_opcion":["❌ Es un efecto de la terapia hormonal en hombres.","❌ Es un efecto de la terapia hormonal en ambos sexos.","❌ Es un efecto de la terapia hormonal.","✅ Figura en la lista de la terapia dirigida."]},{"pregunta":"La fisioterapia oncológica se define como el campo que busca:","opciones":["Curar el tumor mediante agentes físicos","Tratar exclusivamente el linfedema postquirúrgico","Sustituir a la rehabilitación oncológica multidisciplinar","Preservar, mantener, desarrollar y restaurar el sistema cinético funcional y prevenir, mejorar y tratar secuelas"],"correcta":3,"explicacion":"La fisioterapia oncológica tiene como objetivo preservar, mantener, desarrollar y restaurar el sistema cinético funcional y prevenir, mejorar y tratar las secuelas de cualquier tratamiento oncológico.","por_opcion":["❌ La fisioterapia no tiene intención curativa del tumor.","❌ Su campo es mucho más amplio (respiratorio, cardiaco, neurológico, dolor…).","❌ Forma parte de un equipo multidisciplinar.","✅ Definición literal del PDF."]},{"pregunta":"Según el PDF, ¿cuándo se debería iniciar idealmente el tratamiento fisioterápico prequirúrgico?","opciones":["Un mes antes","15 días antes","48 horas antes de la cirugía","7 días antes"],"correcta":1,"explicacion":"Si es posible, el tratamiento prequirúrgico se inicia 15 días antes para preparar al paciente a nivel físico y psicológico.","por_opcion":["❌ No es el plazo del PDF.","✅ Dato literal.","❌ Plazo demasiado corto, no citado en el PDF.","❌ No es el plazo del PDF."]},{"pregunta":"Una paciente sin edema visible tras linfadenectomía axilar y radioterapia se encuentra, según la ISL, en:","opciones":["Linfedema estadio I reversible","Lipedema secundario","Ausencia de linfedema, sin necesidad de medidas","Linfedema subclínico o estadio 0"],"correcta":3,"explicacion":"En cualquier tratamiento oncológico con cirugía, extirpación de ganglios y/o radioterapia existe un linfedema subclínico o estadio 0 según la ISL; por eso la prevención es imprescindible.","por_opcion":["❌ El estadio I implica ya edema clínico.","❌ El lipedema es un trastorno de la grasa, no una secuela oncológica.","❌ La ausencia de edema no significa ausencia de daño linfático.","✅ Definición del PDF según la ISL."]}],"asignatura":"Drenaje linfático","tema":5,"fecha":"2026-11-10"}</script>

<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
