<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Terapia descongestiva compleja (TDC) y técnicas complementarias · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Terapia descongestiva compleja (TDC) y técnicas complementarias","subtitulo":"Cómo se combinan el DLM, la compresión, el ejercicio, la presoterapia y las medidas higiénicas para reducir y mantener el volumen del linfedema.","resumen":["La **Terapia Descongestiva Compleja (TDC)** o Terapia Linfática Descongestiva combina el DLM con técnicas complementarias, porque **una sola técnica aislada no da un resultado satisfactorio**.","La **presoterapia** se aplica a **≤ 40 mmHg en MMSS**, 60 mmHg (edema significativo) u 80 mmHg (muy voluminoso) en MMII y 60–80 mmHg en edema venoso, y está contraindicada en **infección activa, TVP, anticoagulación, edemas sistémicos, arteriopatía e HTA (> 30 mmHg)**.","Las **vendas de baja elasticidad (≤ 70 %)** dan **alta presión de trabajo y baja de reposo**, se toleran de noche y son la base del **vendaje multicapa** de la fase intensiva, que se coloca **siempre después del DLM**, día y noche, con presión distal mayor que proximal.","Las **prendas de compresión** se usan en mantenimiento y profilaxis: en MI se clasifican por la presión en el **tobillo** (100 % → rodilla 65–75 % → muslo 50 %) y en MS solo existe la norma alemana **RAL-GZ 387/2** (clase I 18–21, II 23–32, III 34–46 mmHg en la muñeca); se contraindican con **ITB \u003c 0,5**.","El ejercicio se hace **con la prenda o el vendaje**, lento, con respiración y progresión **de proximal a distal**; el agua ideal está a **28 ºC** (> 34 ºC aumenta el edema), y el **calor y el masaje tradicional están contraindicados** en la zona del edema y sus cuadrantes."],"objetivos":["Al terminar, sabrás enumerar las 10 técnicas complementarias de la TDC y los objetivos principales y secundarios del tratamiento del linfedema.","Al terminar, sabrás elegir los parámetros de presoterapia (presión, orden respecto al DLM) según la localización y el tipo de edema, y reconocer sus contraindicaciones.","Al terminar, sabrás diferenciar vendas de baja, media y alta elasticidad y justificar por qué el vendaje multicapa usa vendas de baja elasticidad.","Al terminar, sabrás interpretar las clases de compresión de las prendas en MI y MS, sus medidas (A-D, A-F, A-G, A-T) y sus contraindicaciones.","Al terminar, sabrás pautar ejercicio, cuidados de la piel, dieta y manejo pre y postquirúrgico en el paciente con linfedema."],"ideas_clave":["La TDC es un tratamiento **combinado**: el DLM solo no basta para una reducción efectiva y duradera del edema.","La elección de técnicas depende sobre todo del **tipo de edema**, pero también de la edad, actividad física, motivación y recursos económicos del paciente.","Presoterapia: **≤ 40 mmHg en MMSS**; antes del DLM si el edema es duro y la piel poco flexible, después si es blando; en HTA no sobrepasar **30 mmHg**.","**Vendajes = fase intensiva** (siempre tras el DLM); **prendas = fase de mantenimiento y profilaxis**.","Baja elasticidad: **alta presión de trabajo / baja de reposo** (bien tolerada de noche). Alta elasticidad: **alta presión de reposo / baja de trabajo** (solo uso diurno).","En MI la clase de la media se define por la presión en el **tobillo**; en MS solo existe la norma **RAL-GZ 387/2**, medida en la muñeca.","Ejercicio con compresión, 30 minutos, lento, con pausas de relajación de 1–2 s y progresión **de proximal a distal**; esfuerzos importantes contraindicados.","**Calor, saunas y masaje tradicional/conectivo** están contraindicados en la zona del edema y en sus cuadrantes; la crioterapia sí, esperando unos 20 minutos antes de la terapia."],"secciones":[{"id":"concepto-objetivos","titulo":"Concepto de TDC y objetivos del tratamiento","bloques":[{"tipo":"parrafo","texto":"Para que la reducción del edema sea **efectiva y duradera**, el DLM debe complementarse con otras técnicas: la aplicación aislada de una sola técnica no da un resultado satisfactorio. En los **linfedemas** (y lipedemas, flebolinfedemas) se habla de **Terapia Linfática Descongestiva (TLD)** o **Terapia Descongestiva Compleja (TDC)**; en edemas de otras etiologías se prefiere el término **medidas higiénico-terapéuticas**."},{"tipo":"definicion","termino":"Terapia Descongestiva Compleja (TDC)","texto":"Tratamiento combinado del linfedema que asocia el DLM a técnicas complementarias (compresión, ejercicio, presoterapia, cuidados de la piel, dieta, apoyo psicológico…) para reducir el volumen y mantener el resultado."},{"tipo":"parrafo","texto":"La elección de las técnicas complementarias depende **sobre todo del tipo de edema**, pero también de las características del paciente: **edad, actividad física, motivación y recursos económicos**."},{"tipo":"tabla","titulo":"Objetivos del tratamiento del linfedema","columnas":["Principales","Secundarios"],"filas":[["Minimizar los factores de riesgo","Disminuir o controlar los síntomas: dolor, pesadez, tirantez"],["Mejorar el equilibrio entre formación y evacuación de la linfa","Evitar la limitación de la movilidad articular"],["Reducir el volumen de la zona o miembro","Mantener o mejorar el aspecto de la extremidad"],["Disminuir la consistencia del edema o la fibrosis","Mejorar la calidad de vida"],["Mantener o restablecer la función; prevenir complicaciones","—"]]},{"tipo":"figura","pagina":7,"pie":"«Olimpíada terapéutica» (Mabel Bussati): cada anillo es un pilar del tratamiento — DLM/fisioterapia, educación del paciente, compresión (multicapa, soportes elásticos, taping, ejercicios miolinfocinéticos), cuidados de piel y nutrición, y tratamiento farmacológico (diosmina-hesperidina). Ilustra que ningún pilar funciona solo.","src":"img/drenaje-linfatico-t6-terapia-descongestiva-compleja-tdc-y-tecnicas-complementaria-p7.jpg"},{"tipo":"esquema","titulo":"Las 10 técnicas complementarias de la TDC","mermaid":"flowchart LR\n  T[\"TDC: DLM + técnicas complementarias\"]\n  T --> A[\"1 Posturas en declive\"]\n  T --> B[\"2 Presoterapia\"]\n  T --> C[\"3 Ejercicio terapéutico\"]\n  T --> D[\"4 Terapia compresiva\"]\n  T --> E[\"5 Cuidados de la piel\"]\n  T --> F[\"6 Dieta\"]\n  T --> G[\"7 Movilizaciones pasivas\"]\n  T --> H[\"8 Termo y crioterapia\"]\n  T --> I[\"9 Masoterapia\"]\n  T --> J[\"10 Apoyo psicológico\"]","pie":"Orden en que el temario presenta las técnicas complementarias al DLM."},{"tipo":"alerta","texto":"El término **TDC/TLD** se reserva para los **linfedemas** (y lipedema, flebolinfedema). En edemas de otra etiología se habla de **medidas higiénico-terapéuticas**: es una distinción terminológica que suele preguntarse."}]},{"id":"declive-presoterapia","titulo":"Posturas en declive y presoterapia","bloques":[{"tipo":"parrafo","texto":"El **declive** es el medio más simple para **reducir la presión hidrostática capilar**: disminuye la filtración y, en consecuencia, el edema. Desplaza el edema por el espacio intersticial (útil en edema de **consistencia líquida**) y aumenta el retorno venoso."},{"tipo":"definicion","termino":"Presoterapia","texto":"Técnica que aplica una fuerza mecánica para incrementar la presión de ciertos tejidos (venosa, arterial y linfática): la presión estimula el paso del líquido intersticial a los capilares sanguíneos y vasos linfáticos, y el masaje producido facilita la circulación venosa y linfática."},{"tipo":"tarjetas","items":[{"etiqueta":"1.ª generación","titulo":"Intermitente","texto":"Funda neumática con **un único alveolo**. Objetivo inicial: retorno venoso de MMII. Demasiado global, cada vez más en desuso."},{"etiqueta":"2.ª generación","titulo":"Secuencial","texto":"Se hinchan **sucesivamente varios alveolos**: primero en «collar de perlas» (uno al lado de otro), luego botas con alveolos en **semi-superposición**."},{"etiqueta":"3.ª generación","titulo":"Gradiente de presión negativo","texto":"Se fija la presión distal y el aparato **reduce la presión del alveolo siguiente**; la presión de un alveolo aumenta durante el hinchado del siguiente."},{"etiqueta":"4.ª generación","titulo":"Programable","texto":"Programas **anterógrado** (distal → raíz), **retrógrado** (empieza proximal pero conserva la orientación centrípeta) y de **deslizamiento** (insuficiencia venolinfática)."}]},{"tipo":"tabla","titulo":"Parámetros de aplicación de la presoterapia","columnas":["Situación","Presión","Momento respecto al DLM"],"filas":[["Linfedema de MMSS","Suave, **≤ 40 mmHg**","Antes del DLM si muy edematoso y piel poco flexible; después si el edema es blando"],["Linfedema de MMII, edema significativo","**60 mmHg**, presión y reposo de 5 s","—"],["Linfedema de MMII, edema muy voluminoso","**80 mmHg**, mantener unos 10 s","—"],["Edema de origen venoso","**60–80 mmHg** (sí indicada)","Indiferentemente antes o después del DLM"],["Paciente hipertenso","No sobrepasar **30 mmHg**","—"]]},{"tipo":"lista","items":["**Beneficios:** mejora la circulación de retorno; postquirúrgico para eliminar inflamación; recuperación tras la fatiga (relajación y bienestar); mejora del trofismo y aspecto cutáneo; aplicación indolora.","**Contraindicaciones:** infección activa, trombosis venosa profunda, tratamiento anticoagulante, edemas sistémicos (descompensación cardiaca, insuficiencia respiratoria, renal o hepática), arteriopatía periférica, HTA (no sobrepasar 30 mmHg)."]},{"tipo":"dato","valor":"≤ 40 mmHg","texto":"Presión máxima de la presoterapia en el linfedema de miembro superior (frente a 60–80 mmHg en MMII y edema venoso)."},{"tipo":"alerta","texto":"En el **linfedema de MMSS** el orden respecto al DLM depende de la consistencia: **duro/piel poco flexible → antes**; **blando → después**. En el **edema venoso** el orden es **indiferente**. No los confundas."},{"tipo":"esquema","titulo":"Decisión rápida de presoterapia","mermaid":"flowchart TD\n  A[\"Paciente con edema\"] --> B{\"Contraindicación?\"}\n  B -->|\"Infección, TVP, anticoagulante, edema sistémico, arteriopatía\"| X[\"No aplicar\"]\n  B -->|\"HTA\"| H[\"Máximo 30 mmHg\"]\n  B -->|\"No\"| C{\"Tipo y zona\"}\n  C -->|\"Linfedema MMSS\"| D[\"40 mmHg o menos\"]\n  C -->|\"Linfedema MMII\"| E[\"60 mmHg o 80 mmHg si muy voluminoso\"]\n  C -->|\"Edema venoso\"| F[\"60 a 80 mmHg, antes o después del DLM\"]\n  D --> G{\"Consistencia\"}\n  G -->|\"Dura, piel poco flexible\"| G1[\"Antes del DLM\"]\n  G -->|\"Blanda\"| G2[\"Después del DLM\"]","pie":"Algoritmo construido con los datos de las diapositivas 19–20."}]},{"id":"ejercicio","titulo":"Ejercicio terapéutico / cinesiterapia","bloques":[{"tipo":"parrafo","texto":"El ejercicio busca **aumentar la efectividad de la bomba muscular**, mantener o aumentar la movilidad articular, promover la respiración, **aumentar la velocidad y el retorno del flujo venoso y linfático** y mejorar al paciente física y psicológicamente. Incluye ejercicios respiratorios, ejercicios circulatorios de **Buerger-Allen**, estiramientos, tonificación y ejercicio aeróbico."},{"tipo":"lista","items":["Se realiza **con la media/manguito o con el vendaje** durante la fase intensiva.","Duración orientativa: **30 minutos**.","Ejecución **lenta y acompañada de la respiración**.","Contracciones **moderadas, progresivas y de corta duración**, con **1–2 s de relajación** entre cada contracción.","**Esfuerzos importantes contraindicados.**","Progresión **de proximal a distal**."]},{"tipo":"parrafo","texto":"Los **ejercicios respiratorios** favorecen el drenaje linfático, aseguran una oxigenación adecuada durante el ejercicio y, con respiración lenta y controlada, facilitan la relajación. Los **ejercicios de Buerger-Allen** se basan en la **hiperemia local** para mejorar el flujo sanguíneo colateral: se hacen **3 a 5 veces al día** e implican cambios posturales sucesivos (elevación, declive, horizontal)."},{"tipo":"figura","pagina":26,"pie":"Ejercicios de Buerger-Allen: secuencia elevación del miembro → sedestación con piernas colgando → decúbito horizontal. Indicados en trastornos arteriales, venosos, arteriovenosos y linfáticos; contraindicados en gangrena, trombosis reciente o extensa, o si producen mucho dolor.","src":"img/drenaje-linfatico-t6-terapia-descongestiva-compleja-tdc-y-tecnicas-complementaria-p26.jpg"},{"tipo":"tabla","titulo":"Ejercicio en el agua: factores","columnas":["Factor","Efecto"],"filas":[["Temperatura","Ideal **28 ºC**; por encima de **34 ºC** aumenta el edema"],["Presión hidrostática","Aumenta con la profundidad y comprime la extremidad favoreciendo el flujo linfático; sustituye a la prenda (se nada sin ella)"],["Movimientos naturales (oleaje)","Efecto de masaje drenante"],["Salinidad","Acción antiedematosa (el mar es aún más beneficioso)"],["Velocidad","A mayor velocidad del paciente y del agua, mayor resistencia"]]},{"tipo":"dato","valor":"28 ºC / > 34 ºC","texto":"Temperatura ideal del agua para el ejercicio en linfedema / umbral a partir del cual el agua aumenta el edema."},{"tipo":"parrafo","texto":"El **Nordic Walking** (caminar con bastones) es un deporte de resistencia al aire libre, fácil de aprender y biomecánicamente correcto: usa el **90 % de los músculos**, puede reducir el **IMC en 12 semanas**, carga menos las articulaciones que correr y es especialmente beneficioso con **sobrepeso**."},{"tipo":"tabla","titulo":"Deportes en el linfedema","columnas":["Beneficiosos","Contraindicados MMSS","Contraindicados MMII"],"filas":[["Natación, caminar (dentro del agua, mejor en el mar), ejercicio colectivo, bicicleta","Fuerza excesiva con el brazo; repeticiones mecánicas bruscas","Salto brusco y repetitivo; tracción o movimiento brusco de la pierna"]]},{"tipo":"perla","texto":"En la paciente con linfedema postmastectomía, pauta ejercicios lentos con el manguito puesto, empezando por hombro y codo antes de mano y dedos (proximal → distal): primero se «abren» las vías proximales para que el líquido distal tenga adónde ir."}]},{"id":"terapia-compresiva","titulo":"Terapia compresiva: vendajes","bloques":[{"tipo":"parrafo","texto":"Los **vendajes** se usan en las **fases intensivas** y se colocan **siempre después de la sesión de DLM** para mantener la reducción de volumen entre sesiones. Las **prendas** se reservan para la **fase de mantenimiento y la profilaxis**."},{"tipo":"tarjetas","items":[{"etiqueta":"Venosos","titulo":"Efectos venosos","texto":"Aumentan el retorno venoso, mejoran la continencia valvular, crean un **efecto de aspiración (Venturi)** sobre venas adyacentes, disminuyen la presión venosa y mejoran la bomba muscular."},{"etiqueta":"Tisulares","titulo":"Efectos tisulares","texto":"Asociados a actividad muscular son descongestionantes, refuerzan la reabsorción en los capilares sanguíneos y mejoran la troficidad de los tejidos."},{"etiqueta":"Linfáticos","titulo":"Efectos linfáticos","texto":"Mejoran la captación-evacuación y la capacidad de contracción de los **linfangiones**."}]},{"tipo":"definicion","termino":"Extensibilidad vs elasticidad","texto":"**Extensibilidad**: capacidad de estirarse ante una tensión aplicada. **Elasticidad**: capacidad de volver a la longitud original al reducirse esa tensión. La **tensión** es la fuerza dada al tejido durante la aplicación."},{"tipo":"tabla","titulo":"Tipos de vendas según elasticidad","columnas":["Tipo","Extensibilidad","Presión","Uso"],"filas":[["Baja elasticidad","**≤ 70 %**","Alta de trabajo, baja de reposo","Bien tolerada de noche; mantiene la descongestión; base del multicapa"],["Media elasticidad","**70–140 %**","Alta de reposo, baja de trabajo (como la alta)","—"],["Alta elasticidad","**> 140 %**","Alta de reposo, baja de trabajo","Comprime bien venas superficiales; mal tolerada de noche → uso diurno"]]},{"tipo":"alerta","texto":"Trampa clásica: **baja elasticidad = alta presión de TRABAJO** (al contraer el músculo contra un vendaje poco extensible, la presión sube mucho) y **baja de REPOSO**. La **alta elasticidad** es justo lo contrario y por eso comprime incluso en reposo y se tolera mal por la noche."},{"tipo":"parrafo","texto":"El **vendaje multicapa** (elastorígido) intercala **espumas, esponjas de látex o almohadillas** bajo vendas de baja elasticidad. Se usa en la **fase intensiva** de linfedemas, en **úlceras venosas**, **lipedemas estadios II-III** y **flebolinfedemas**. Disminuye el trabajo del sistema linfático (se opone a la ultrafiltración capilar), potencia el efecto de la musculatura sobre la circulación, evita el reflujo con válvulas insuficientes y **suaviza la fibrosis**. Es casi siempre necesario, **a diario y día y noche**, con **presión distal mayor que la proximal**."},{"tipo":"figura","pagina":45,"pie":"Vendaje multicapa: vendas de baja elasticidad sobre almohadillado (espuma) y almohadillado retromaleolar para rellenar los relieves y repartir la presión.","src":"img/drenaje-linfatico-t6-terapia-descongestiva-compleja-tdc-y-tecnicas-complementaria-p45.jpg"},{"tipo":"perla","texto":"El multicapa se soporta bien físicamente, pero a veces se tolera **mal psicológicamente**: explica al paciente su finalidad y duración (fase intensiva) para mejorar la adhesión."},{"tipo":"lista","items":["Formas de colocación: **circular**, **semiespiga**, **espiga**.","**Técnica mixta**: combinación de las anteriores, p. ej. espiga en la parte distal y terminar en circular."]}]},{"id":"prendas","titulo":"Terapia compresiva: prendas de compresión","bloques":[{"tipo":"tabla","titulo":"Tricotado circular vs plano","columnas":["Tricotado circular","Tricotado plano"],"filas":[["**Sin costuras**","**Con costuras**"],["Tienden a enrollarse → arrugas y surcos en la piel","Mejor adaptación"],["No sirven para miembros con deformaciones","N.º de puntos variable → forma individual, compresión óptima incluso en edemas extremos"],["—","Normalmente **a medida**; más rígido, menor expansión horizontal"]]},{"tipo":"figura","pagina":52,"pie":"Corte horizontal de una prenda: el tricotado circular es más elástico y cede ante el edema; el plano, al ser más rígido, ofrece mayor resistencia a la expansión muscular (mayor presión de trabajo).","src":"img/drenaje-linfatico-t6-terapia-descongestiva-compleja-tdc-y-tecnicas-complementaria-p52.jpg"},{"tipo":"parrafo","texto":"En el **miembro inferior** la clase se define por la **presión medida en el tobillo**, que decrece de forma gradual: tobillo **100 %**, rodilla **65–75 %**, muslo **50 %**. Existen además prendas de **compresión inelástica** (sistemas ajustables con velcro) para MS y MI."},{"tipo":"tabla","titulo":"Clases de compresión en miembro inferior (presión en tobillo)","columnas":["Clase","Británica BS 6612:1985","Francesa ASQUAL","Alemana RAL-GZ 387:2000"],"filas":[["I","14–17 mmHg","10–15 mmHg","18–21 mmHg"],["II","18–24 mmHg","15–20 mmHg","23–32 mmHg"],["III","25–35 mmHg","20–36 mmHg","34–46 mmHg"],["IV","—","> 36 mmHg","> 49 mmHg"]]},{"tipo":"tabla","titulo":"Indicaciones por clase (MI)","columnas":["Clase","Efecto","Indicaciones"],"filas":[["I","Ligero efecto de presión superficial","Profilaxis; varices leves sin tendencia al edema; varices iniciales del embarazo; linfedema subclínico; pacientes mayores con artrosis; lipedema"],["II","Efecto superficial medio","Marcada varicosis con tendencia al edema; hinchazón postraumática; varices pronunciadas del embarazo; linfedema estadios I y II; mínima distorsión de la extremidad"],["III","Importante efecto superficial y profundo","Síndrome postrombótico; varices secundarias; úlceras venosas (tratamiento y prevención); distorsión moderada; linfedema II-III; lipedema; flebolinfedema; ancianos con razonable destreza"],["IV","Importante efecto profundo","Linfedema estadio III; edema que no se contiene con clase II-III; flebolinfedema"]]},{"tipo":"dato","valor":"≤ 17 mmHg","texto":"Medias antitrombosis: compresión muy ligera, solo para profilaxis de trombosis y embolia en pacientes encamados."},{"tipo":"figura","pagina":59,"pie":"Medidas de las medias: A-D corta (bajo la rodilla), A-F larga (mitad del muslo), A-G larga hasta la ingle (con sujeción), A-T hasta la cintura (panty).","src":"img/drenaje-linfatico-t6-terapia-descongestiva-compleja-tdc-y-tecnicas-complementaria-p59.jpg"},{"tipo":"parrafo","texto":"En el **miembro superior** hay pocos datos y las recomendaciones suelen extrapolarse del MI; solo existe la norma alemana **RAL-GZ 387/2**, con tres clases según la presión en la **muñeca**: **I 18–21**, **II 23–32**, **III 34–46 mmHg**."},{"tipo":"alerta","texto":"Las cifras «18–21 / 23–32 / 34–46 mmHg» son las de la **norma alemana** y valen tanto para MI (tobillo) como para MS (muñeca). La británica y la francesa dan valores distintos: fíjate siempre en qué norma pregunta el enunciado."},{"tipo":"lista","items":["**Criterios de prescripción (intensidad y tejido):** localización del edema; tipo (flebedema, linfedema, lipedema…); estadio; alteraciones cutáneas; edad; destreza del paciente o cuidador; motivación; capacidad para tolerar y manejar la prenda; actividad o profesión.","**Contraindicaciones:** insuficiencia arterial con **ITB \u003c 0,5** en MMII; fallo cardiaco agudo; distorsión extrema del miembro; surcos cutáneos muy profundos; linforrea o herida que supure; infecciones (linfangitis, erisipela); neuropatía periférica."]}]},{"id":"vendaje-neuromuscular","titulo":"Vendaje neuromuscular (kinesiotaping) y Punch tape","bloques":[{"tipo":"parrafo","texto":"El **vendaje neuromuscular** eleva la piel y **descomprime los vasos linfáticos**, permitiendo el flujo de la linfa. A diferencia del vendaje compresivo, permite una **vida totalmente normal** sin limitar la movilidad, y no hace falta retirarlo para continuar las sesiones de DLM."},{"tipo":"tabla","titulo":"Vendaje neuromuscular en linfedema","columnas":["Indicaciones","Contraindicaciones","Precauciones"],"filas":[["**Complemento** del tratamiento físico combinado tradicional","Insuficiencia cardiaca o renal; edema generalizado","Retirar inmediatamente si hay irritación o picor"],["Sectores donde no llega bien la compresión elástica","Carcinomas, metástasis","Precaución sobre piel irradiada"],["Linfedema de genitales externos-pubis, abdomen, tórax, cuello y cabeza","Trombosis; heridas; piel irritada","Precaución sobre piel con cirugía reciente"],["Dolor, inflamación y alteraciones funcionales asociadas","Desconocimiento de la técnica; alergia al material","—"]]},{"tipo":"alerta","texto":"El kinesiotaping es un **complemento**, no un sustituto de la compresión: su indicación estrella son las **zonas donde la prenda no llega** (genitales, abdomen, tórax, cuello, cabeza)."},{"tipo":"parrafo","texto":"El **Punch tape** es una cinta perforada para linfedema y cicatrices, de aparición reciente y con **poca evidencia**. Sus agujeros aumentan la capacidad elástica, la estimulación propioceptiva y la ventilación (prometedor en zonas húmedas y calientes) y ahorra tiempo de aplicación. El estudio presentado concluye que fue efectivo incluso en linfedema no agudo, con alta fidelidad de las pacientes, y que comparar lado afecto y sano puede servir de **biofeedback** en fases finales sin grandes linfedemas."}]},{"id":"otras-medidas","titulo":"Piel, dieta, movilizaciones, termo-crioterapia, masoterapia y apoyo psicológico","bloques":[{"tipo":"tabla","titulo":"Medidas complementarias","columnas":["Medida","Pauta del temario"],"filas":[["Cuidados de la piel","Piel flexible e hidratada; limpieza cuidadosa de **espacios interdigitales**; crema hidratante de **pH 5 antes de los vendajes**; evitar jabones irritantes"],["Dieta","Restringir la sal; **no** dieta pobre en proteínas; agua en cantidades normales; peso adecuado; dieta baja en grasas, rica en verduras y fibra"],["Movilizaciones pasivas","Pie y tobillo: aumentan el llenado venoso y reducen la presión venosa. Cintura escapulohumeral: expanden los troncos subclavios y aceleran el retorno en la vena subclavia"],["Termoterapia","La hiperemia aumenta la carga linfática: **no calor en el edema ni en sus cuadrantes**; sí calor local en zonas sin edema; saunas y baños termales contraindicados"],["Crioterapia","Se puede usar, esperando **unos 20 minutos** antes de iniciar la terapia"],["Masoterapia","Masaje tradicional y del tejido conectivo **contraindicados** en el área del edema y cuadrantes relacionados"],["Apoyo psicológico","Alteraciones del ánimo y limitaciones laborales, sociales, familiares y económicas; el **ejercicio en grupo** ayuda en estados depresivos; vida tranquila, priorizar cuidarse, adhesión al tratamiento"]]},{"tipo":"esquema","titulo":"Por qué el calor empeora el linfedema","mermaid":"flowchart LR\n  A[\"Calor, sauna, baño termal\"] --> B[\"Vasodilatación e hiperemia\"]\n  B --> C[\"Más filtración capilar\"]\n  C --> D[\"Aumento de la carga linfática\"]\n  D --> E[\"Sistema linfático insuficiente\"]\n  E --> F[\"Más edema\"]","pie":"Mismo razonamiento que el agua por encima de 34 ºC y que el masaje tradicional en el cuadrante afecto."},{"tipo":"alerta","texto":"**No restringir las proteínas** ni el agua: la dieta del linfedema limita la **sal** y las **grasas**, no las proteínas. Es una opción-trampa frecuente."},{"tipo":"perla","texto":"Antes de colocar el vendaje, hidrata la piel con crema de **pH 5** y revisa los espacios interdigitales: una piel seca o con grietas es puerta de entrada de **erisipela/linfangitis**, que contraindicaría la compresión."}]},{"id":"cirugia","titulo":"Tratamiento quirúrgico del linfedema y fisioterapia peri-operatoria","bloques":[{"tipo":"parrafo","texto":"La cirugía del linfedema existe desde comienzos del siglo pasado con resultados poco satisfactorios; en la última década ha mejorado gracias a las técnicas de imagen, la **microcirugía y supermicrocirugía**. Reduce peso y volumen de la extremidad, minimiza las linfangitis y mejora estética y función."},{"tipo":"tarjetas","items":[{"etiqueta":"Paliativa","titulo":"Cirugía escisional","texto":"Linfedema severo; prácticamente en desuso salvo limitación funcional extrema. Sustituida por la **liposucción** (elimina tejido adiposo hipertrófico). Riesgo de dañar linfáticos → **prenda de por vida**."},{"etiqueta":"Reconstructiva 1","titulo":"Reconstrucción linfática","texto":"**Anastomosis linfático-venosas** o **linfo-linfáticas**."},{"etiqueta":"Reconstructiva 2","titulo":"Transferencia tisular","texto":"**Trasplante autólogo de ganglios linfáticos**."},{"etiqueta":"Preventiva","titulo":"Cirugía preventiva","texto":"Reemplazar los ganglios resecados por otros vascularizados en la misma intervención (p. ej. **T-BAR**, Restauración Total de la Anatomía Mamaria)."}]},{"tipo":"esquema","titulo":"Fisioterapia pre y postquirúrgica","mermaid":"flowchart TD\n  P[\"PREQUIRÚRGICO\"] --> P1[\"DLM y vendaje si hay descompensación de volumen\"]\n  P --> P2[\"Prenda si linfedema estabilizado\"]\n  P --> P3[\"Transferencia ganglionar: DLM en zona donante 2 semanas antes y después\"]\n  Q[\"POSTQUIRÚRGICO\"] --> Q1[\"Elevación del miembro al menos 24 h\"]\n  Q --> Q2[\"MMII: carga parcial al 2.º día\"]\n  Q --> Q3[\"Vendaje elástico 4 semanas, luego baja elasticidad o prenda\"]\n  Q --> Q4[\"DLM: anastomosis tras 1.ª-2.ª semana; transferencia desde día 1-2, 3-5 días por semana el 1.er mes\"]\n  Q --> Q5[\"Prenda cuando el edema esté estable 6 meses\"]","pie":"Plazos de las diapositivas 89–90."},{"tipo":"dato","valor":"1.ª–2.ª semana vs 1.er–2.º día","texto":"Inicio del DLM tras **anastomosis linfático-venosa** (esperar para no traccionar las suturas) frente a tras **transferencia ganglionar** (precoz, 3–5 días/semana el primer mes)."},{"tipo":"perla","texto":"En una transferencia ganglionar, la **zona donante** también puede desarrollar linfedema: por eso se le hace DLM al menos 2 semanas antes y después de la cirugía."}]}],"caso_clinico":{"titulo":"Linfedema de miembro superior tras cáncer de mama","presentacion":"Mujer de 54 años, mastectomía con linfadenectomía axilar derecha hace 2 años. Presenta linfedema de MSD estadio II, con edema duro en antebrazo, piel seca y poco flexible. Es hipertensa controlada. Trabaja como cajera y le gustaría volver a jugar al pádel. Inicia la fase intensiva de TDC.","preguntas":[{"pregunta":"¿Qué parámetros de presoterapia elegirías y en qué orden respecto al DLM?","respuesta":"En linfedema de MMSS la presión debe ser suave (≤ 40 mmHg), pero al ser **hipertensa no se deben sobrepasar 30 mmHg**. Al tratarse de un edema muy duro con piel poco flexible, la presoterapia puede aplicarse **antes del DLM**. Antes, descartar infección activa, TVP o anticoagulación."},{"pregunta":"¿Qué compresión usarías en esta fase y por qué ese tipo de venda?","respuesta":"En la fase intensiva, **vendaje multicapa** con almohadillado y **vendas de baja elasticidad**, colocado **siempre después del DLM**, día y noche, con mayor presión distal. La baja elasticidad da alta presión de trabajo y baja de reposo, se tolera de noche y suaviza la fibrosis. La prenda (norma RAL-GZ 387/2 según presión en muñeca) se reservará para el mantenimiento."},{"pregunta":"¿Qué consejos le darías sobre ejercicio, deporte y vida diaria?","respuesta":"Ejercicio con el vendaje, unos 30 min, lento, con respiración y pausas de 1–2 s, progresando de proximal a distal y sin esfuerzos importantes. El pádel implica **fuerza excesiva y repeticiones bruscas del brazo**, contraindicadas en MMSS; mejor natación o Nordic Walking. Evitar saunas y calor sobre el brazo, hidratar la piel con crema pH 5, restringir sal y grasas sin reducir proteínas, y valorar apoyo psicológico y ejercicio en grupo."}]},"preguntate":[{"pregunta":"¿Por qué se habla de terapia «compleja» y en qué casos se usa ese término frente a «medidas higiénico-terapéuticas»?","respuesta":"Porque combina el DLM con varias técnicas complementarias, ya que una sola no basta. TDC/TLD se usa en linfedemas (y lipedema, flebolinfedema); en edemas de otras etiologías se habla de medidas higiénico-terapéuticas."},{"pregunta":"Explica el mecanismo por el que la postura en declive reduce el edema.","respuesta":"Disminuye la presión hidrostática del capilar, lo que reduce la filtración; además desplaza el edema líquido por el intersticio y aumenta el retorno venoso."},{"pregunta":"Describe las cuatro generaciones de presoterapia.","respuesta":"Intermitente (un único alveolo), secuencial (varios alveolos sucesivos, collar de perlas o semi-superpuestos), de gradiente de presión negativo (reduce la presión del alveolo siguiente) y programable (anterógrado, retrógrado, deslizamiento)."},{"pregunta":"Enumera las contraindicaciones de la presoterapia.","respuesta":"Infección activa, TVP, tratamiento anticoagulante, edemas sistémicos (cardiaco, respiratorio, renal, hepático), arteriopatía periférica e HTA (no superar 30 mmHg)."},{"pregunta":"Compara la presión de trabajo y de reposo de las vendas de baja y alta elasticidad y su tolerancia nocturna.","respuesta":"Baja elasticidad: alta presión de trabajo y baja de reposo, bien tolerada de noche. Alta elasticidad: alta presión de reposo y baja de trabajo, mal tolerada de noche, uso diurno."},{"pregunta":"¿Cuáles son los efectos generales del vendaje multicapa y cómo se pauta?","respuesta":"Se opone a la ultrafiltración capilar, potencia la bomba muscular, evita el reflujo con válvulas insuficientes y suaviza la fibrosis. Se aplica a diario, día y noche, con presión distal mayor que proximal."},{"pregunta":"¿Dónde se mide la presión para clasificar una media de MI y cómo se reparte a lo largo de la pierna?","respuesta":"En el tobillo (100 %); disminuye a 65–75 % en la rodilla y 50 % en el muslo."},{"pregunta":"¿Qué norma existe para las prendas de MS y cuáles son sus clases?","respuesta":"Solo la alemana RAL-GZ 387/2, medida en la muñeca: clase I 18–21, II 23–32 y III 34–46 mmHg."},{"pregunta":"¿Por qué están contraindicados el calor y el masaje tradicional en la zona del edema?","respuesta":"Porque la hiperemia aumenta la filtración y la carga linfática sobre un sistema ya insuficiente, empeorando el edema; se prohíben en la zona y en sus cuadrantes relacionados."},{"pregunta":"¿Cuándo se inicia el DLM tras una anastomosis linfático-venosa y tras una transferencia ganglionar?","respuesta":"Tras anastomosis, a la primera o segunda semana para no traccionar suturas; tras transferencia, desde el primer o segundo día, 3–5 días por semana durante el primer mes."}],"glosario":[{"termino":"TDC / TLD","definicion":"Terapia Descongestiva Compleja o Linfática Descongestiva: DLM + técnicas complementarias en el linfedema."},{"termino":"Presoterapia secuencial","definicion":"Presoterapia en la que varios alveolos se hinchan sucesivamente de forma centrípeta."},{"termino":"Presión de trabajo","definicion":"Presión que ejerce el vendaje durante la contracción muscular; alta en vendas de baja elasticidad."},{"termino":"Presión de reposo","definicion":"Presión que ejerce el vendaje con el músculo relajado; alta en vendas de alta elasticidad."},{"termino":"Vendaje multicapa","definicion":"Vendaje elastorígido con almohadillado (espuma, látex) bajo vendas de baja elasticidad, usado en la fase intensiva."},{"termino":"Efecto Venturi","definicion":"Efecto de aspiración que crea la compresión sobre las venas adyacentes."},{"termino":"Linfangión","definicion":"Unidad contráctil del vaso linfático entre dos válvulas; la compresión mejora su capacidad de contracción."},{"termino":"Tricotado plano","definicion":"Tejido de prenda con costuras, a medida y más rígido, apto para miembros deformados."},{"termino":"RAL-GZ 387","definicion":"Norma alemana de clases de compresión; la 387/2 es la única para el miembro superior."},{"termino":"ITB","definicion":"Índice tobillo-brazo; \u003c 0,5 contraindica la compresión en MMII por insuficiencia arterial."},{"termino":"Buerger-Allen","definicion":"Ejercicios posturales basados en la hiperemia local para mejorar el flujo colateral, 3–5 veces al día."},{"termino":"Punch tape","definicion":"Cinta neuromuscular perforada para linfedema y cicatrices, con poca evidencia aún."},{"termino":"T-BAR","definicion":"Restauración Total de la Anatomía Mamaria: cirugía preventiva que sustituye ganglios resecados por otros vascularizados."}],"fuentes":["Universidad Europea. Drenaje linfático manual. Tema 6: Terapia descongestiva compleja (TDC) y técnicas complementarias.","Bussati M. «Olimpíada terapéutica» (esquema citado en el tema)."],"qcm":[{"pregunta":"Paciente con linfedema de miembro superior, edema blando y piel flexible, sin otras patologías. ¿Qué pauta de presoterapia se ajusta al temario?","opciones":["40 mmHg como máximo, aplicada preferiblemente después del DLM","60–80 mmHg, indistintamente antes o después del DLM","60 mmHg con ciclos de presión y reposo de 5 segundos","40 mmHg como máximo, aplicada preferiblemente antes del DLM"],"correcta":0,"explicacion":"En los linfedemas de MMSS la presión debe ser suave, ≤ 40 mmHg. El orden depende de la consistencia: con edema blando se aplica preferiblemente después del DLM; solo si es muy edematoso con piel poco flexible se aplica antes.","por_opcion":["✅ Presión ≤ 40 mmHg y, con edema blando, después del DLM.","❌ 60–80 mmHg con orden indiferente es la pauta del edema venoso.","❌ 60 mmHg con 5 s es la pauta del linfedema significativo de MMII.","❌ «Antes del DLM» corresponde al edema muy duro con piel poco flexible."]},{"pregunta":"En un paciente hipertenso que requiere presoterapia por insuficiencia venosa, ¿qué indica el temario?","opciones":["Puede aplicarse a 60 mmHg con tiempos cortos","Puede aplicarse sin superar los 40 mmHg","Está contraindicada de forma absoluta en cualquier caso","Puede aplicarse sin superar los 30 mmHg"],"correcta":3,"explicacion":"La HTA figura entre las contraindicaciones de la presoterapia con un matiz: no sobrepasar 30 mmHg. Es por tanto una limitación de la presión, no una prohibición absoluta.","por_opcion":["❌ 60 mmHg supera ampliamente el límite indicado para el hipertenso.","❌ 40 mmHg es el límite general del linfedema de MMSS, no el de la HTA.","❌ El temario no la prohíbe de forma absoluta en la HTA: limita la presión.","✅ En HTA no se deben sobrepasar los 30 mmHg."]},{"pregunta":"¿Qué generación de presoterapia se caracteriza porque, fijada la presión distal, el aparato reduce la presión producida por el alveolo siguiente?","opciones":["Presoterapia programable en modo retrógrado","Presoterapia intermitente de alveolo único","Presoterapia secuencial en collar de perlas","Presoterapia de gradiente de presión negativo"],"correcta":3,"explicacion":"En la presoterapia de gradiente de presión negativo se define la presión distal y el aparato reduce la presión del alveolo siguiente; la presión de un alveolo aumenta durante el hinchado del siguiente. Es la 3.ª generación.","por_opcion":["❌ El modo retrógrado empieza proximal manteniendo la orientación centrípeta.","❌ La intermitente tiene un único alveolo, no puede haber gradiente entre alveolos.","❌ La secuencial hincha alveolos sucesivos sin ese gradiente decreciente programado.","✅ Es la definición de la presoterapia de gradiente de presión negativo."]},{"pregunta":"¿Cuál de las siguientes NO figura entre las contraindicaciones de la presoterapia?","opciones":["Insuficiencia renal con edema sistémico","Edema de origen venoso crónico","Arteriopatía periférica de miembros inferiores","Tratamiento anticoagulante en curso"],"correcta":1,"explicacion":"En los edemas de origen venoso la presoterapia sí está indicada, a 60–80 mmHg. Las contraindicaciones son infección activa, TVP, anticoagulación, edemas sistémicos, arteriopatía periférica e HTA.","por_opcion":["❌ Los edemas sistémicos (renal, cardiaco, hepático, respiratorio) la contraindican.","✅ El edema venoso es indicación, no contraindicación.","❌ La arteriopatía periférica es contraindicación.","❌ El tratamiento anticoagulante es contraindicación."]},{"pregunta":"Respecto a las vendas de baja elasticidad, señala la afirmación correcta:","opciones":["Extensibilidad > 140 %, alta presión de trabajo y uso nocturno","Extensibilidad ≤ 70 %, alta presión de trabajo y buena tolerancia nocturna","Extensibilidad de 70–140 %, alta presión de reposo y uso diurno","Extensibilidad ≤ 70 %, alta presión de reposo y mala tolerancia nocturna"],"correcta":1,"explicacion":"Las vendas de baja elasticidad tienen una extensibilidad limitada al 70 %, ejercen alta presión de trabajo y baja de reposo y se toleran bien durante la noche, manteniendo la descongestión.","por_opcion":["❌ > 140 % define la alta elasticidad, que tiene alta presión de reposo y uso diurno.","✅ ≤ 70 %, alta presión de trabajo y bien tolerada de noche.","❌ 70–140 % es la media elasticidad, que se comporta como la alta (presión de reposo).","❌ La extensibilidad es correcta, pero la presión alta de reposo y la mala tolerancia nocturna son de la alta elasticidad."]},{"pregunta":"¿Por qué las vendas de alta elasticidad se suelen limitar al uso diurno?","opciones":["Porque comprimen incluso en reposo y se toleran mal por la noche","Porque no comprimen las venas superficiales en decúbito","Porque pierden su elasticidad tras pocas horas de uso","Porque su presión de trabajo es tan alta que dificulta caminar"],"correcta":0,"explicacion":"Las vendas de alta/media elasticidad ejercen alta presión de reposo (comprimen aun en reposo) y baja de trabajo; por eso se toleran mal por la noche y se limitan al día.","por_opcion":["✅ La alta presión de reposo hace que se toleren mal de noche.","❌ Al contrario: su alta presión de reposo comprime eficazmente las venas superficiales.","❌ El temario no menciona pérdida de elasticidad como motivo.","❌ Su presión de trabajo es baja, no alta."]},{"pregunta":"En el vendaje multicapa de la fase intensiva, ¿qué pauta es correcta?","opciones":["Colocarlo tras el DLM, día y noche, con presión distal mayor","Colocarlo tras el DLM, solo de día, con presión uniforme","Colocarlo antes del DLM, solo de día, con presión proximal mayor","Colocarlo antes del DLM, día y noche, con presión distal mayor"],"correcta":0,"explicacion":"Los vendajes se colocan siempre después de la sesión de DLM para mantener la reducción de volumen. El multicapa se lleva a diario, día y noche, con presión distal mayor que la proximal.","por_opcion":["✅ Tras el DLM, día y noche, presión distal > proximal.","❌ Se mantiene día y noche y la presión debe ser decreciente, no uniforme.","❌ Se coloca después del DLM, también de noche, y la presión mayor es distal.","❌ El vendaje nunca se coloca antes del DLM: su función es mantener la reducción conseguida."]},{"pregunta":"¿En cuál de estas situaciones NO se cita el vendaje multicapa como indicación?","opciones":["Fase intensiva del linfedema","Flebolinfedema","Úlceras venosas","Lipedema en estadio I"],"correcta":3,"explicacion":"El multicapa se utiliza en la fase intensiva de los linfedemas, úlceras venosas, lipedemas en estadios II-III y flebolinfedemas. El lipedema en estadio I no aparece.","por_opcion":["❌ La fase intensiva del linfedema es su indicación principal.","❌ El flebolinfedema es indicación del multicapa.","❌ Las úlceras venosas son indicación del multicapa.","✅ Solo se citan los lipedemas en estadios II-III."]},{"pregunta":"Paciente con miembro inferior muy deformado por linfedema estadio III. ¿Qué prenda es más adecuada?","opciones":["Tricotado plano, porque permite un número de puntos variable","Media antitrombosis de hasta 17 mmHg","Tricotado circular de clase I según norma británica","Tricotado circular, porque al no tener costuras se adapta mejor"],"correcta":0,"explicacion":"El tricotado plano tiene costuras, se hace a medida y su número de puntos varía según el edema, lo que garantiza una compresión óptima incluso en formas edematosas extremas. El circular no sirve para miembros con deformaciones.","por_opcion":["✅ El tricotado plano se adapta a deformaciones extremas.","❌ Las medias antitrombosis solo sirven para profilaxis en encamados.","❌ La clase I y el tricotado circular son insuficientes para un estadio III deformado.","❌ El circular no tiene costuras pero se enrolla y no sirve para miembros deformados; la mejor adaptación es del plano."]},{"pregunta":"Según la norma alemana RAL-GZ 387, ¿qué presión corresponde a la clase III?","opciones":["23–32 mmHg","20–36 mmHg","34–46 mmHg","25–35 mmHg"],"correcta":2,"explicacion":"En la norma alemana: clase I 18–21, clase II 23–32, clase III 34–46 y clase IV > 49 mmHg. Estas mismas cifras de I-III se aplican al MS (RAL-GZ 387/2, en la muñeca).","por_opcion":["❌ 23–32 mmHg es la clase II alemana.","❌ 20–36 mmHg es la clase III francesa.","✅ 34–46 mmHg es la clase III alemana.","❌ 25–35 mmHg es la clase III británica."]},{"pregunta":"Una media de compresión de MI tiene 30 mmHg en el tobillo. Según el temario, ¿qué presión aproximada ejercerá en el muslo?","opciones":["Unos 15 mmHg","Unos 20–22 mmHg","Unos 10 mmHg","Unos 30 mmHg"],"correcta":0,"explicacion":"La presión decrece desde el tobillo (100 %) a la rodilla (65–75 %) y al muslo (50 %). El 50 % de 30 mmHg son unos 15 mmHg.","por_opcion":["✅ El muslo recibe ~50 % de la presión del tobillo.","❌ 20–22 mmHg (65–75 %) corresponde a la rodilla.","❌ 10 mmHg sería un tercio, no el 50 % del tobillo.","❌ La presión no es uniforme: decrece de distal a proximal."]},{"pregunta":"¿Qué hallazgo contraindica la prescripción de una prenda de compresión en miembros inferiores?","opciones":["Síndrome postrombótico crónico","Linfedema estadio III con fibrosis","Índice tobillo-brazo inferior a 0,5","Paciente anciano con artrosis"],"correcta":2,"explicacion":"La insuficiencia arterial con ITB \u003c 0,5 contraindica la compresión en MMII. Las demás son indicaciones de distintas clases de compresión.","por_opcion":["❌ El síndrome postrombótico es indicación de clase III.","❌ El linfedema estadio III es indicación de clase III-IV.","✅ ITB \u003c 0,5 indica insuficiencia arterial: contraindicación.","❌ Los pacientes mayores con artrosis aparecen como indicación de clase I."]},{"pregunta":"¿Cuál es la indicación más característica del vendaje neuromuscular en el linfedema según el temario?","opciones":["Edema generalizado de origen cardiaco o renal","Zonas como pubis, abdomen, tórax, cuello o cabeza","Sustituir al vendaje multicapa en la fase intensiva","Tratar el linfedema asociado a metástasis activas"],"correcta":1,"explicacion":"El vendaje neuromuscular es un complemento del tratamiento físico combinado y está indicado en sectores donde no llega bien la compresión elástica, como genitales externos-pubis, abdomen, tórax, cuello y cabeza.","por_opcion":["❌ La insuficiencia cardiaca o renal y el edema generalizado son contraindicación.","✅ Son las zonas donde la compresión elástica no llega bien.","❌ Es un complemento, no un sustituto del tratamiento tradicional.","❌ Carcinomas y metástasis son contraindicación."]},{"pregunta":"En el ejercicio terapéutico del paciente con linfedema durante la fase intensiva, ¿qué pauta es correcta?","opciones":["Sin compresión, contracciones intensas y progresión de distal a proximal","Sin compresión, ejecución rápida y progresión de proximal a distal","Con compresión, contracciones mantenidas y progresión de distal a proximal","Con compresión, pausas de 1–2 s y progresión de proximal a distal"],"correcta":3,"explicacion":"Se realiza con la media/manguito o el vendaje, unos 30 minutos, lento y con la respiración, con contracciones moderadas, progresivas y cortas separadas por 1–2 s de relajación, y progresando de proximal a distal.","por_opcion":["❌ Se hace con compresión, las contracciones son moderadas y la progresión es de proximal a distal.","❌ Se hace con compresión y la ejecución es lenta (sin prenda solo en el agua).","❌ Las contracciones deben ser de corta duración y la progresión es de proximal a distal.","✅ Con compresión, pausas de 1–2 s y de proximal a distal."]},{"pregunta":"Tras una anastomosis linfático-venosa, ¿cuándo se recomienda iniciar el DLM?","opciones":["A partir de las 4 semanas, con la prenda","Cuando el edema esté estable 6 meses","Tras la primera o segunda semana","El primer o segundo día postquirúrgico"],"correcta":2,"explicacion":"En las anastomosis linfático-venosas el DLM se inicia tras la primera o segunda semana para evitar la tracción de las suturas. En las transferencias ganglionares, en cambio, se empieza el primer o segundo día.","por_opcion":["❌ Las 4 semanas marcan el cambio de vendaje elástico a baja elasticidad o prenda.","❌ Los 6 meses de estabilidad son el criterio para la prenda de compresión.","✅ Tras 1–2 semanas, para no traccionar las suturas.","❌ El 1.er–2.º día es el inicio del DLM tras transferencia ganglionar."]}],"asignatura":"Drenaje linfático","tema":6,"fecha":"2026-11-12"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
