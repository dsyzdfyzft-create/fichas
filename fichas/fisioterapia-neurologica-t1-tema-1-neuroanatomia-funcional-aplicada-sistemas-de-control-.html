<title>Tema 1. Neuroanatomía funcional aplicada: sistemas de control motor y reflejos medulares · Ficha</title>

<style>
:root{
  --papel:#f6f4ef; --hoja:#fffdf9; --tinta:#1b2427; --suave:#5b676b; --linea:#e2ddd2; --acento:#1f6f6b; --acento-suave:#dcebe8;
  --ocre:#b37a1c; --ocre-suave:#f6ead3; --rojo:#a8402f; --rojo-suave:#f5e0db; --verde:#2f7a46; --verde-suave:#dcefe1;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --texto:"Spectral",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:19px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);line-height:1.12;margin:0;font-variation-settings:"SOFT" 50}
h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.9rem;font-weight:600;letter-spacing:-.015em;margin:0 0 18px}
h3{font-size:1.2rem;font-weight:600}
b,strong{font-weight:600}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px}
.envoltura{max-width:820px;margin:0 auto;padding:0 22px}
/* cabecera */
header.portada{padding:64px 0 36px;border-bottom:1px solid var(--linea)}
.etiquetas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.etiqueta{font:600 .78rem/1 var(--serif);padding:7px 11px;border-radius:999px;background:var(--acento-suave);color:var(--acento)}
.etiqueta.o{background:var(--ocre-suave);color:var(--ocre)}
.sub{font-size:1.25rem;color:var(--suave);margin:16px 0 0;max-width:62ch;font-style:italic}
.meta{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap}
.meta div{font-family:var(--serif)}
.meta b{display:block;font-size:1.7rem;font-weight:800;line-height:1}
.meta span{font-size:.8rem;color:var(--suave)}
/* navegación */
nav.indice{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px)}
nav.indice .envoltura{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .envoltura::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .85rem var(--serif);padding:7px 12px;border-radius:999px}
nav.indice a:hover{color:var(--tinta);background:var(--hoja)}
nav.indice a.qcm{background:var(--tinta);color:var(--papel);margin-left:auto}
main section{padding:56px 0 8px}
.num{font:800 .85rem var(--serif);color:var(--ocre);display:block;margin-bottom:6px}
p{margin:0 0 16px;max-width:68ch}
/* bloques */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:14px;padding:22px 24px}
.caja h3{margin-bottom:12px}
.caja ul,.caja ol{margin:0;padding-left:1.2em}
.caja li{margin:6px 0}
.claves{counter-reset:k;list-style:none;padding:0!important}
.claves li{counter-increment:k;padding-left:38px;position:relative;margin:10px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--acento);color:var(--papel);font:800 .8rem/26px var(--serif);text-align:center}
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
.tw{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--linea);border-radius:12px;background:var(--hoja)}
table{border-collapse:collapse;width:100%;font-size:.92rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:600 .95rem var(--serif);padding:14px 16px 4px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--linea)}
th{font:600 .82rem var(--serif);color:var(--suave);border-top:0}
tbody tr:nth-child(odd){background:color-mix(in srgb,var(--papel) 50%,transparent)}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 22px}
.tarjeta{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;font-size:.95rem;line-height:1.5}
.tarjeta .et{font:700 .72rem var(--serif);color:var(--ocre);display:block;margin-bottom:4px}
.tarjeta h3{font-size:1.05rem;margin-bottom:6px}
.def{border-left:3px solid var(--acento);padding:4px 0 4px 16px;margin:0 0 18px}
.def b{font-family:var(--serif);color:var(--acento)}
.nota{border-radius:12px;padding:14px 18px 14px 50px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;font-size:1.15rem}
.nota .t{font:700 .78rem var(--serif);display:block;margin-bottom:2px}
.perla{background:var(--verde-suave)} .perla::before{content:"🩺"} .perla .t{color:var(--verde)}
.alerta{background:var(--rojo-suave)} .alerta::before{content:"⚠️"} .alerta .t{color:var(--rojo)}
/* figuras y esquemas */
figure{margin:8px 0 26px;background:var(--hoja);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:20px 16px 8px;overflow-x:auto;text-align:center}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq .lienzo pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap;text-align:left}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{font-family:var(--serif);color:var(--tinta)}
/* caso clínico */
.caso{background:var(--tinta);color:var(--papel);border-radius:18px;padding:30px 30px 18px}
.caso h2{color:var(--papel)}
.caso p{color:color-mix(in srgb,var(--papel) 85%,transparent)}
.caso details{border-top:1px solid color-mix(in srgb,var(--papel) 18%,transparent);padding:12px 0}
.caso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
.caso details p{margin:10px 0 0}
dl.glosario{display:grid;grid-template-columns:max-content 1fr;gap:10px 20px;margin:0}
dl.glosario dt{font:600 1rem var(--serif);color:var(--acento)}
dl.glosario dd{margin:0}
.fuentes{font-size:.9rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border:1px solid var(--linea);border-radius:18px;padding:28px}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:600 .85rem var(--serif);color:var(--suave)}
.barra{flex:1;height:8px;border-radius:4px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--acento);transition:width .3s}
.pregunta{font:600 1.3rem/1.35 var(--serif);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer}
.op:hover:not([disabled]){border-color:var(--acento)}
.op .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 .9rem var(--serif);background:var(--hoja);border:1px solid var(--linea)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--verde);background:var(--verde-suave)}
.op.bien .l{background:var(--verde);color:#fff;border-color:var(--verde)}
.op.mal{border-color:var(--rojo);background:var(--rojo-suave)}
.op.mal .l{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{font:600 .95rem var(--serif);padding:11px 20px;border-radius:999px;border:0;background:var(--tinta);color:var(--papel);cursor:pointer}
.btn.sec{background:transparent;color:var(--tinta);border:1.5px solid var(--linea)}
.btn[disabled]{opacity:.35;cursor:default}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:800 4.4rem/1 var(--serif);letter-spacing:-.03em}
.resultado .gran small{font-size:1.6rem;color:var(--suave)}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:700px){body{font-size:17.5px}.dos{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}dl.glosario{grid-template-columns:1fr}dl.glosario dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i{transition:none}}
@media print{nav.indice,#qcm{display:none}body{background:#fff}}

<body>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script id="datos" type="application/json">{"titulo":"Tema 1. Neuroanatomía funcional aplicada: sistemas de control motor y reflejos medulares","subtitulo":"El movimiento surge de la integración sensitivo-motora del SN. Se organiza en niveles jerárquicos (médula, tronco, corteza) con el control en paralelo de ganglios basales y cerebelo. La médula, nivel más bajo, genera reflejos y automatismos gracias al huso muscular y al órgano tendinoso de Golgi.","objetivos":["Al terminar, sabrás explicar la organización jerárquica (3 niveles) y en paralelo (ganglios basales y cerebelo) del control motor, y por qué una lesión del SNC altera el movimiento según su localización.","Al terminar, sabrás diferenciar el huso muscular del órgano tendinoso de Golgi: localización, variable que miden, tipo de fibra aferente y reflejo que generan.","Al terminar, sabrás distinguir las motoneuronas α y γ, las fibras intrafusales en saco y en cadena, y qué vía descendente (piramidal o extrapiramidal) llega a cada motoneurona.","Al terminar, sabrás describir paso a paso el reflejo monosináptico, la inhibición recíproca, el reflejo flexor de retirada, el extensor cruzado y el reflejo del OTG.","Al terminar, sabrás aplicar estos mecanismos a la valoración (reflejos osteotendinosos) y al tratamiento en fisioterapia neurológica."],"ideas_clave":["La **capacidad motora** nace de la interacción de los sistemas **motor y sensitivo**. Una lesión del SNC produce un movimiento descoordinado, poco adaptado al entorno, dificultoso y poco funcional. El déficit concreto **depende de dónde esté la lesión**.","El control motor es a la vez **jerárquico** (médula espinal → tronco del encéfalo → corteza cerebral) y **en paralelo** (ganglios basales y cerebelo, estructuras subcorticales independientes). La información sensitiva puede modificar la orden descendente **en cualquier nivel**.","La **médula** es el nivel más bajo de la jerarquía: produce **motricidad refleja y automatismos rítmicos**, como la **locomoción**.","**Huso muscular**: propioceptor intramuscular que mide **longitud y velocidad** de estiramiento. Su porción receptora es **central**, sin actina ni miosina. Fibras **en saco**: dinámicas, aferencia **Ia**. Fibras **en cadena**: estáticas, aferencia **II**. Inervación motora intrafusal **γ**.","**Órgano tendinoso de Golgi**: receptor encapsulado en el **tendón** que mide la **tensión**. Está conectado a **10-15 fibras musculares**, transmite por fibras **Ib** grandes y rápidas y genera reflejos **inhibitorios**. Con una tensión excesiva aparece la **reacción de alargamiento** (protectora).","**Motoneuronas α**: fibras Aα grandes que inervan las fibras **extrafusales** (de 3 a cientos cada una). **Motoneuronas γ**: fibras Aγ pequeñas que inervan las **intrafusales**. La **vía piramidal** (voluntaria) llega a α. La **extrapiramidal** (involuntaria) llega a **α y γ**.","**Reflejo monosináptico**: estiramiento → huso → **Ia** → sinapsis **directa** con la motoneurona α → contracción extrafusal compensatoria. Simultáneamente, la Ia activa una **interneurona inhibitoria** que relaja al **antagonista** (inhibición recíproca, polisináptica).","**Reflejo flexor de retirada**: los **circuitos divergentes** de interneuronas reclutan los músculos necesarios para retirar el miembro. A los **0,2-0,5 s**, el **extensor cruzado** extiende la extremidad contraria para sostener el peso."],"secciones":[{"id":"capacidad-motora","titulo":"La capacidad motora y los sistemas de control motor","bloques":[{"tipo":"parrafo","texto":"La **capacidad motora** se genera gracias a las **acciones integradoras del sistema nervioso**, es decir, a la interacción continua entre el **sistema motor** y el **sistema sensitivo**. El movimiento no es una simple orden descendente: se corrige y adapta constantemente con la información que llega de músculos, tendones y articulaciones. Por eso, una **lesión del SNC** hace que el movimiento deje de estar **coordinado y adaptado a las exigencias del entorno**, y se vuelva **dificultoso y poco funcional**."},{"tipo":"parrafo","texto":"Para permitir la gran diversidad de movimientos existen **diferentes sistemas de control motor**. Las conductas motoras siguen **a la vez** una organización **JERÁRQUICA** y **EN PARALELO**. Los problemas concretos de movilidad **dependen de dónde se encuentre la lesión**."},{"tipo":"tarjetas","items":[{"etiqueta":"I","titulo":"Organización jerárquica","texto":"Tres niveles: **médula espinal**, **tronco del encéfalo** y **corteza cerebral**. Cada uno tiene sus propios **circuitos de entrada y salida** para coordinar y regular las respuestas motoras."},{"etiqueta":"II","titulo":"Organización en paralelo","texto":"En el sistema motor influyen dos **estructuras subcorticales independientes**: los **ganglios basales** y el **cerebelo**. La información sensitiva relacionada con el movimiento puede modificar la orden motora descendente **en cualquiera de sus niveles**."}]},{"tipo":"esquema","titulo":"Esquema general de los sistemas de control motor","mermaid":"flowchart TD\n  GB[\"Ganglios basales\"] --> T[\"Tálamo\"]\n  CB[\"Cerebelo\"] --> T\n  T --> CA[\"Corteza parietal, premotora y suplementaria\"]\n  T --> CM\n  CA --> CM\n  subgraph S1[\"Niveles jerárquicos\"]\n    CM[\"Corteza motora primaria\"] --> TE[\"Tronco del encéfalo\"]\n    TE --> ME[\"Médula espinal\"]\n  end\n  CB --> TE\n  SE[\"Información sensitiva del movimiento\"] -.->|\"modifica la orden\"| ME\n  SE -.-> TE\n  SE -.-> CM","pie":"Ganglios basales y cerebelo actúan en paralelo y llegan a la corteza a través del tálamo. El cerebelo también proyecta al tronco del encéfalo. La orden desciende corteza → tronco → médula, y la información sensitiva puede modularla en cualquier nivel."},{"tipo":"alerta","texto":"Trampa típica: el **tálamo** aparece en el esquema como **estación de relevo** entre ganglios basales/cerebelo y corteza. Sin embargo, **no** es uno de los tres niveles jerárquicos ni una de las dos estructuras en paralelo. Las dos estructuras **en paralelo** son **ganglios basales y cerebelo**. Los niveles **jerárquicos** son **médula, tronco y corteza**."},{"tipo":"perla","texto":"En la valoración neurológica, la pregunta clave es **dónde está la lesión**: el patrón de alteración motora orienta el nivel afectado. La exploración refleja (sección de reflejos) es una herramienta directa para ubicarla."}]},{"id":"medula-espinal","titulo":"La médula espinal: organización para las funciones motoras","bloques":[{"tipo":"parrafo","texto":"La médula es el **nivel más bajo de la jerarquía motora**. Aun así, tiene capacidad propia para producir **motricidad refleja** y **automatismos rítmicos**, y en ella se encuentran los **reflejos**. Esto es posible porque en su sustancia gris conviven **motoneuronas anteriores** (salida motora) e **interneuronas** (procesamiento y conexión)."},{"tipo":"definicion","termino":"Motoneuronas anteriores","texto":"Neuronas situadas en **cada segmento de las astas anteriores** de la sustancia gris medular. Hay **varios miles** por segmento y son **entre un 50% y un 100% más grandes** que el resto de neuronas. Son de dos tipos: **α** y **γ**."},{"tipo":"tabla","titulo":"Motoneuronas α frente a motoneuronas γ","columnas":["Característica","Motoneurona α","Motoneurona γ"],"filas":[["Fibra que originan","Fibras motoras **grandes tipo Aα**","Fibras motoras **pequeñas tipo Aγ**"],["Diana","**Fibras extrafusales** (grandes fibras del músculo esquelético)","**Fibras intrafusales** dentro del huso muscular"],["Ramificación","Se ramifican muchas veces: cada fibra Aα inerva **de 3 a cientos** de fibras musculares","Inervación intrafusal (polos del huso)"],["Diámetro en la lámina de Guyton","**14 µm**","**5 µm**"],["Vía descendente que llega","**Piramidal** (voluntaria) y **extrapiramidal**","**Extrapiramidal** (involuntaria)"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Vía piramidal","titulo":"Movimiento voluntario","texto":"Llega a las **motoneuronas α**."},{"etiqueta":"Vía extrapiramidal","titulo":"Motricidad involuntaria","texto":"Llega a las **motoneuronas α y γ**. Por eso influye directamente sobre la sensibilidad del huso y el tono muscular."}]},{"tipo":"definicion","termino":"Interneuronas","texto":"Neuronas medulares de **tamaño pequeño** y **naturaleza muy excitable**, con **múltiples interconexiones**. Son la base de los reflejos **polisinápticos** (inhibición recíproca, retirada, extensor cruzado) y de los automatismos rítmicos."},{"tipo":"figura","pagina":17,"pie":"Esquema del profesor. Observa el huso muscular con su inervación sensitiva (Ia y II), la inervación motora **extrafusal α** (rojo) y la **intrafusal γ** (rosa), el órgano de Golgi en el tendón con su fibra Ib, y la diferencia entre fibras en saco (dinámicas, Ia) y en cadena (estáticas, II).","src":"img/fisioterapia-neurologica-t1-tema-1-neuroanatomia-funcional-aplicada-sistemas-de-control--p17.jpg"},{"tipo":"alerta","texto":"No confundas: la **α** contrae el músculo (extrafusal). La **γ** no produce fuerza útil: ajusta el huso (intrafusal). Si te preguntan qué vía llega a las **γ**, la respuesta es la **extrapiramidal**, no la piramidal."},{"tipo":"perla","texto":"La lámina de Rexed y los núcleos medulares (página 20) sitúan las **motoneuronas del asta anterior** en la **lámina IX** (complemento: dato de la imagen, no del texto). Las interneuronas se sitúan en la zona intermedia, donde también llega el **tracto corticoespinal**."}]},{"id":"receptores-musculares","titulo":"Receptores sensitivos musculares: huso muscular y órgano tendinoso de Golgi","bloques":[{"tipo":"parrafo","texto":"Su función básica es la **retroalimentación permanente de información sensitiva** desde cualquier músculo, para indicar su estado en todo momento. Informan de tres variables: **longitud** del músculo, **tensión** del músculo y **velocidad** a la que varían ambas. Para ello existen dos receptores específicos: los **husos musculares** y los **órganos tendinosos de Golgi**."},{"tipo":"definicion","termino":"Huso muscular","texto":"**Receptor sensorial propioceptor** situado **dentro de la estructura del músculo**. Se estimula ante **estiramientos lo suficientemente fuertes**. Mide la **longitud** (grado de estiramiento), el **grado de estimulación mecánica** y la **velocidad** con que se aplica el estiramiento, y envía la información al SNC. Su **porción receptora** está en la **parte central**, donde las fibras intrafusales **carecen de actina y miosina**."},{"tipo":"tabla","titulo":"Fibras intrafusales del huso","columnas":["Tipo de fibra","Qué perciben","Carácter del receptor","Aferencia sensitiva"],"filas":[["**Fibras en saco**","El **estiramiento** muscular y su **movimiento**","**Dinámico o fásico**","**Ia**"],["**Fibras en cadena**","La **longitud** del músculo y la **posición** de la articulación o segmento corporal","**Estático**","**II**"]]},{"tipo":"definicion","termino":"Órgano tendinoso de Golgi (OTG)","texto":"Receptor sensorial **encapsulado** situado **en los tendones**, atravesado por fibras del tendón muscular. Se encarga de **medir la tensión** desarrollada por el músculo. Suele estar conectado a **10 ó 15 fibras musculares**, que lo estimulan cuando se tensan por **contracción o estiramiento**. Sus señales viajan por fibras **grandes de conducción rápida tipo Ib**."},{"tipo":"tabla","titulo":"Huso muscular frente a órgano tendinoso de Golgi","columnas":["Criterio","Huso muscular","Órgano tendinoso de Golgi"],"filas":[["Localización","Dentro del vientre muscular (en paralelo a fibras extrafusales)","En el tendón (unión musculotendinosa)"],["Variable que mide","**Longitud** y **velocidad** del estiramiento","**Tensión**"],["Estímulo","Estiramiento suficientemente fuerte","Tensión por contracción o estiramiento"],["Aferencia","**Ia** (saco, dinámica) y **II** (cadena, estática)","**Ib**"],["Inervación motora propia","Sí: **γ** (intrafusal)","No"],["Reflejo que genera","Excitador del propio músculo (miotático, monosináptico)","**Inhibitorio** del propio músculo; reacción de alargamiento"],["Diámetros (láminas Guyton)","Ia **17 µm**; II **8 µm**","Fibra nerviosa **16 µm**"]]},{"tipo":"figura","pagina":13,"pie":"Huso muscular (Guyton & Hall). Mira los diámetros: α 14 µm, γ 5 µm, Ia 17 µm, II 8 µm. Localiza la terminación primaria (Ia) en el centro, la secundaria (II) a su lado, las terminaciones motoras γ en los polos, y la diferencia entre fibras intrafusales y extrafusales. Longitud aproximada: 1 cm.","src":"img/fisioterapia-neurologica-t1-tema-1-neuroanatomia-funcional-aplicada-sistemas-de-control--p13.jpg"},{"tipo":"figura","pagina":15,"pie":"Órgano tendinoso de Golgi. Observa la fibra nerviosa (16 µm, tipo Ib) ramificándose entre las fibras de colágeno del tendón, en la unión con las fibras musculares.","src":"img/fisioterapia-neurologica-t1-tema-1-neuroanatomia-funcional-aplicada-sistemas-de-control--p15.jpg"},{"tipo":"alerta","texto":"Trampas frecuentes: **Ia = saco = dinámico** e **II = cadena = estático**. No los cruces. El **huso** no mide tensión, y el **OTG** no mide longitud. La zona **central** del huso es la **receptora** y **no contrae** (sin actina ni miosina). Lo contráctil son los **polos**, inervados por γ (complemento)."},{"tipo":"tabla","titulo":"Funciones de los husos musculares (amortiguamiento básico)","columnas":["Función","Significado"],"filas":[["**Amortiguamiento de longitud**","Se oponen a cambios de longitud muscular"],["**Compensación de variaciones en la carga**","Ajustan la contracción cuando cambia la carga"],["**Amortiguamiento de la velocidad**","**Controlan los temblores**"],["**Ajuste continuo del tono muscular**","**Preparan el movimiento**"]]},{"tipo":"perla","texto":"Las fibras en saco (Ia) son **sensibles a la velocidad**. Por eso, en un paciente con hiperexcitabilidad refleja, los **estiramientos lentos y mantenidos** provocan menos respuesta refleja que los rápidos. Aplica este razonamiento al movilizar y estirar segmentos en fisioterapia neurológica."}]},{"id":"reflejo-monosinaptico","titulo":"Reflejo monosináptico (miotático o de estiramiento)","bloques":[{"tipo":"parrafo","texto":"El **estiramiento** del músculo **estimula el huso muscular**. Las **fibras aferentes Ia**, con soma en el **ganglio de la raíz dorsal**, sinaptan en la médula **directamente con la motoneurona α**. Esta activa el **músculo extrafusal** y produce la **contracción**. Al haber una sola sinapsis central, es **monosináptico**. El resultado es una **contracción compensatoria** frente al estiramiento."},{"tipo":"tarjetas","items":[{"etiqueta":"Dinámico","titulo":"Se opone a cambios súbitos","texto":"Contrarresta los **cambios bruscos de longitud** muscular."},{"etiqueta":"Estático","titulo":"Mantiene la contracción","texto":"Mantiene un **grado de contracción relativamente constante**."}]},{"tipo":"esquema","titulo":"Reflejo miotático e inhibición recíproca","mermaid":"flowchart LR\n  E[\"Estiramiento del agonista\"] --> H[\"Huso muscular\"]\n  H -->|\"Aferente Ia\"| G[\"Ganglio raíz dorsal\"]\n  G -->|\"sinapsis directa\"| MA[\"Motoneurona α agonista\"]\n  G --> II[\"Interneurona inhibitoria\"]\n  MA --> C[\"Contracción del agonista\"]\n  II -->|\"inhibe\"| MB[\"Motoneurona α antagonista\"]\n  MB --> R[\"Relajación del antagonista\"]","pie":"Rama superior: arco monosináptico (Ia → α del mismo músculo). Rama inferior: ruta inhibitoria directa a través de una interneurona, que relaja al antagonista para que no se oponga al agonista."},{"tipo":"perla","texto":"**Aplicación clínica**: el reflejo rotuliano (percusión del tendón del cuádriceps) explora el arco monosináptico y ayuda a la **ubicación de la lesión**. Valora su presencia, intensidad y simetría."},{"tipo":"alerta","texto":"El reflejo de estiramiento **no tiene interneurona** en su rama excitadora. La interneurona aparece en la **inhibición recíproca** del antagonista, que por eso se clasifica como **polisináptica**."}]},{"id":"reflejos-polisinapticos","titulo":"Reflejos polisinápticos: inhibición recíproca, retirada y extensor cruzado","bloques":[{"tipo":"definicion","termino":"Inhibición e inervación recíprocas (ruta inhibitoria directa)","texto":"La fibra procedente del huso muscular también sinapta en la médula con una **interneurona inhibitoria**. Esta **inhibe la salida de señal de la motoneurona α al músculo ANTAGONISTA**. Así se asegura la **relajación de los antagonistas mientras trabajan los agonistas**, y se evita que el antagonista se oponga a la acción del agonista."},{"tipo":"parrafo","texto":"La excitación de las fibras aferentes **excita las motoneuronas del asta anterior** para producir movimiento y, **al mismo tiempo**, se **inhiben las motoneuronas de los músculos antagonistas**. Este juego coordinado agonista-antagonista es también la base de los automatismos rítmicos: **la locomoción es un ejemplo de automatismo rítmico de control medular**."},{"tipo":"figura","pagina":27,"pie":"Ruta inhibitoria directa. Sigue la aferente Ia (azul claro) desde el huso del agonista: excita a la motoneurona α del agonista (rosa) y a la interneurona inhibitoria (azul oscuro). Esta frena la motoneurona α del antagonista (verde), que se relaja.","src":"img/fisioterapia-neurologica-t1-tema-1-neuroanatomia-funcional-aplicada-sistemas-de-control--p27.jpg"},{"tipo":"definicion","termino":"Reflejo flexor con patrón de retirada","texto":"Ante un **estímulo doloroso** en una extremidad, las **fibras nociceptivas** alcanzan un conjunto de **interneuronas** medulares que distribuyen la información en circuitos básicos. Los **circuitos divergentes** **diseminan el reflejo** hasta todos los músculos necesarios para efectuar la **retirada**. Clásicamente se añaden circuitos de inhibición recíproca y de posdescarga (complemento)."},{"tipo":"definicion","termino":"Reflejo extensor cruzado","texto":"**0,2-0,5 s** después de un reflejo flexor en una extremidad, la **extremidad contraria comienza a extenderse**. Puede **tirar de todo el cuerpo** para alejarlo del objeto que originó el estímulo doloroso. En el miembro de apoyo, los extensores se contraen y los flexores se inhiben, de modo que **soporta el peso** que se desplaza."},{"tipo":"esquema","titulo":"Cascada del reflejo de retirada y extensor cruzado","mermaid":"flowchart TD\n  N[\"Estímulo doloroso en el pie\"] --> NC[\"Nociceptor y fibra nociceptiva\"]\n  NC --> IN[\"Interneuronas medulares\"]\n  IN -->|\"colateral\"| AS[\"Vías ascendentes: dolor y ajuste postural\"]\n  IN -->|\"circuitos divergentes\"| IP[\"Miembro ipsilateral\"]\n  IN -->|\"cruza la línea media\"| CL[\"Miembro contralateral\"]\n  IP --> FX[\"Flexores se contraen\"]\n  IP --> EI[\"Extensores inhibidos\"]\n  CL -->|\"0,2-0,5 s\"| EX[\"Extensores se contraen\"]\n  CL --> FI[\"Flexores inhibidos\"]\n  FX --> RT[\"Retirada del pie\"]\n  EX --> SP[\"Soporte del peso corporal\"]","pie":"Una sola aferencia nociceptiva diverge: retira el miembro estimulado, sostiene el cuerpo con el contralateral y envía una colateral ascendente para la sensación de dolor y el ajuste del centro de gravedad."},{"tipo":"figura","pagina":31,"pie":"Integración del reflejo de retirada y del extensor cruzado. Pasos: 1) el nociceptor se activa; 2) la neurona sensitiva primaria entra y diverge; 3a) una colateral sube por vías ascendentes (dolor y ajuste postural); 3b) retirada ipsilateral; 3c) extensor cruzado que soporta el peso. Fíjate en las interneuronas inhibitorias (negro, signo −).","src":"img/fisioterapia-neurologica-t1-tema-1-neuroanatomia-funcional-aplicada-sistemas-de-control--p31.jpg"},{"tipo":"tabla","titulo":"Resumen comparativo de los reflejos medulares del tema","columnas":["Reflejo","Receptor / aferencia","Sinapsis","Respuesta"],"filas":[["Miotático (estiramiento)","Huso / **Ia**","**Monosináptico** (Ia → α)","Contracción del músculo estirado"],["Inhibición recíproca","Huso / **Ia**","Polisináptico (interneurona inhibitoria)","Relajación del antagonista"],["Flexor de retirada","Nociceptor / fibras nociceptivas","Polisináptico (circuitos divergentes)","Flexión y retirada del miembro"],["Extensor cruzado","Nociceptor (contralateral)","Polisináptico, cruza la médula","Extensión contralateral a los **0,2-0,5 s**"],["Reflejo del OTG","OTG / **Ib**","Polisináptico (interneuronas)","**Inhibición** del músculo; **reacción de alargamiento** si la tensión es excesiva"]]}]},{"id":"reflejo-golgi","titulo":"Reflejo del órgano tendinoso de Golgi","bloques":[{"tipo":"parrafo","texto":"La estimulación del OTG por la **tensión** provoca **reflejos de carácter inhibitorio** sobre el propio músculo. En el esquema del temario, la aferencia del OTG llega a una **neurona de asociación inhibitoria**, que inhibe al efector (p. ej., el **extensor de la pierna**), y a una **neurona de asociación estimuladora**, que activa al **antagonista** (el **flexor**). Cuando la tensión es **muy intensa y excesiva** se produce una **reacción de alargamiento**: el músculo se relaja bruscamente. Es una **función protectora** frente a lesiones por sobrecarga."},{"tipo":"alerta","texto":"Contraste clave: el **huso** (estiramiento) produce **contracción** del mismo músculo. El **OTG** (tensión) produce **inhibición** del mismo músculo. Son reflejos de **signo opuesto** sobre el músculo de origen."},{"tipo":"perla","texto":"Las técnicas de **tensión mantenida o contracción isométrica previa a un estiramiento** se explican clásicamente por la inhibición autógena mediada por el OTG (complemento). Su efecto real es discutido, pero el mecanismo neural de base es el reflejo Ib inhibitorio de este tema."}]}],"caso_clinico":{"titulo":"Reflejos exaltados y estiramiento en un paciente con lesión del SNC","presentacion":"Hombre de 62 años, 6 semanas tras un ictus hemisférico izquierdo. Presenta hemiparesia derecha con movimiento voluntario dificultoso y poco funcional. Al percutir el tendón rotuliano derecho, la respuesta es mucho más amplia que en el lado izquierdo. Al movilizar pasivamente y de forma rápida la rodilla derecha hacia la flexión, se nota una resistencia que cede si el movimiento se hace lento. El paciente camina con dificultad para alternar flexión y extensión.","preguntas":[{"pregunta":"¿Qué arco reflejo exploramos con la percusión rotuliana y por qué un reflejo exaltado orienta a una lesión del SNC y no del propio arco?","respuesta":"Exploramos el **reflejo monosináptico**: estiramiento del cuádriceps → huso → aferente **Ia** → sinapsis **directa** con la **motoneurona α** → contracción extrafusal. El arco está íntegro, porque el reflejo existe e incluso está aumentado. Lo alterado es su **modulación descendente**. Según el temario, la orden descendente (piramidal sobre α; **extrapiramidal sobre α y γ**) regula los niveles inferiores. Al perderse esa regulación, la médula queda con su **motricidad refleja** sin modular (complemento: hiperreflexia por liberación de centros inferiores). Si el arco estuviera lesionado (raíz, nervio), el reflejo estaría disminuido."},{"pregunta":"¿Por qué la resistencia aparece con la movilización rápida y disminuye con la lenta?","respuesta":"El huso mide **longitud y velocidad** del estiramiento. Las **fibras en saco**, inervadas por **Ia**, son receptores **dinámicos o fásicos** que responden al cambio rápido. Una movilización rápida descarga intensamente las Ia y desencadena la contracción compensatoria del reflejo miotático. Una movilización lenta estimula sobre todo las respuestas **estáticas** (fibras en cadena, **II**) y genera menos reflejo. En clínica conviene movilizar y estirar **lento y mantenido** para no provocar la respuesta refleja."},{"pregunta":"¿Qué mecanismos medulares del tema puedes aprovechar para facilitar la alternancia flexo-extensora de la marcha?","respuesta":"1) La **inhibición recíproca**: activar el agonista (p. ej., isquiotibiales) inhibe, vía **interneurona inhibitoria**, la motoneurona α del antagonista (cuádriceps hiperreactivo), lo que facilita la flexión. 2) La **locomoción** es un **automatismo rítmico de control medular**: la práctica rítmica y repetida de la marcha aprovecha esos circuitos de interneuronas. 3) La **tensión mantenida** sobre el tendón activa el **OTG**, cuyo reflejo es **inhibitorio** del propio músculo (complemento sobre su uso terapéutico). El fisioterapeuta combina estos recursos sabiendo que el déficit global depende de la **localización de la lesión**."}]},"glosario":[{"termino":"Control motor jerárquico","definicion":"Organización del control del movimiento en tres niveles: médula espinal, tronco del encéfalo y corteza cerebral. Cada nivel tiene sus propios circuitos de entrada y salida."},{"termino":"Control motor en paralelo","definicion":"Influencia sobre el sistema motor de dos estructuras subcorticales independientes: ganglios basales y cerebelo."},{"termino":"Propioceptor","definicion":"Receptor que informa del estado del aparato locomotor (longitud, tensión, posición, velocidad). El huso muscular es un propioceptor."},{"termino":"Huso muscular","definicion":"Propioceptor intramuscular que mide la longitud, la estimulación mecánica y la velocidad del estiramiento. Su zona receptora central carece de actina y miosina."},{"termino":"Fibras intrafusales","definicion":"Fibras musculares especializadas del interior del huso, inervadas por motoneuronas γ. Pueden ser en saco o en cadena."},{"termino":"Fibras extrafusales","definicion":"Fibras musculares esqueléticas que generan la fuerza. Están inervadas por motoneuronas α."},{"termino":"Fibras en saco","definicion":"Fibras intrafusales que perciben el estiramiento y su movimiento. Son receptores dinámicos o fásicos con aferencia Ia."},{"termino":"Fibras en cadena","definicion":"Fibras intrafusales que perciben la longitud muscular y la posición articular. Son receptores estáticos con aferencia II."},{"termino":"Órgano tendinoso de Golgi","definicion":"Receptor encapsulado del tendón que mide la tensión. Está conectado a 10-15 fibras musculares y transmite por fibras Ib."},{"termino":"Motoneurona α","definicion":"Motoneurona grande del asta anterior que origina fibras Aα e inerva de 3 a cientos de fibras extrafusales."},{"termino":"Motoneurona γ","definicion":"Motoneurona del asta anterior que origina fibras pequeñas Aγ e inerva las fibras intrafusales del huso."},{"termino":"Interneurona","definicion":"Neurona medular pequeña, muy excitable y con múltiples interconexiones. Media los reflejos polisinápticos."},{"termino":"Inhibición recíproca","definicion":"Inhibición de la motoneurona α del antagonista a través de una interneurona inhibitoria, mientras se activa el agonista."},{"termino":"Reflejo extensor cruzado","definicion":"Extensión de la extremidad contralateral que aparece 0,2-0,5 s después de un reflejo flexor de retirada."},{"termino":"Reacción de alargamiento","definicion":"Relajación brusca del músculo mediada por el OTG ante una tensión muy intensa o excesiva. Tiene función protectora."}],"fuentes":["Guyton AC, Hall JE. Textbook of Medical Physiology, 11.ª ed. Elsevier (figuras del huso muscular, del órgano tendinoso de Golgi y del reflejo extensor cruzado).","Tema 1. Neuroanatomía funcional aplicada. Fisioterapia neurológica. Universidad Europea (Villarón C, Herrmann C, Polo López A, Sirvent Pinar MA, Valdés P, Ferreira C)."],"qcm":[{"pregunta":"Un paciente muestra una alteración selectiva en la percepción de la posición articular mantenida, pero responde con normalidad a los estiramientos bruscos. Según el temario, ¿qué componente estaría más comprometido?","opciones":["Fibras intrafusales del huso con su inervación motora Aγ","Fibras en saco del huso con su aferencia sensitiva Ia","Órgano tendinoso de Golgi con su aferencia sensitiva Ib","Fibras en cadena del huso con su aferencia sensitiva II"],"correcta":3,"explicacion":"Las fibras en cadena perciben la longitud del músculo y la posición de la articulación o segmento corporal. Son receptores estáticos con aferencia II. La respuesta al estiramiento brusco depende de las fibras en saco (dinámicas, Ia), que en este paciente están conservadas.","por_opcion":["❌ La inervación Aγ es motora (eferente) y ajusta el huso. No es la vía sensitiva que informa de la posición.","❌ Las fibras en saco (Ia) son dinámicas o fásicas y detectan el estiramiento y su movimiento. Esa respuesta está conservada en el paciente.","❌ El OTG mide tensión, no posición articular. Su aferencia Ib no codifica la longitud estática.","✅ Fibras en cadena = longitud y posición articular = receptor estático = aferencia II."]},{"pregunta":"¿Qué característica estructural atribuye el temario a la porción receptora del huso muscular?","opciones":["Se sitúa en el centro, donde las fibras intrafusales carecen de actina y miosina","Se sitúa en los polos, donde las fibras intrafusales concentran actina y miosina","Se sitúa en el centro, donde terminan las fibras motoras alfa sobre el huso","Se sitúa en los polos, donde la cápsula se une a las fibras extrafusales"],"correcta":0,"explicacion":"El temario indica que la porción receptora del huso está en su parte central. En esa zona las fibras intrafusales carecen de los elementos contráctiles actina y miosina. Por eso es la zona sensible al estiramiento, mientras que lo contráctil queda en los polos.","por_opcion":["✅ Porción receptora central, sin actina ni miosina.","❌ Los polos son la zona contráctil (con inervación γ), no la receptora.","❌ La zona central es la de las terminaciones sensitivas (primaria Ia y secundaria II). Las α inervan fibras extrafusales.","❌ La porción receptora no está en los polos, y las fibras extrafusales no forman parte del huso."]},{"pregunta":"Respecto al órgano tendinoso de Golgi, ¿qué combinación de datos es correcta según el temario?","opciones":["Conectado a 10-15 fibras musculares, con aferencia II lenta","Conectado a 3-cientos fibras musculares, con aferencia Ia rápida","Conectado a 10-15 fibras musculares, con aferencia Ib rápida","Conectado a 3-cientos fibras musculares, con aferencia Ib rápida"],"correcta":2,"explicacion":"El OTG suele estar conectado a 10 ó 15 fibras musculares, que lo estimulan al tensarse por contracción o estiramiento. Sus señales viajan por fibras nerviosas grandes de conducción rápida tipo Ib.","por_opcion":["❌ El número de fibras es correcto, pero la aferencia II pertenece a las fibras en cadena del huso.","❌ La cifra de 3 a cientos corresponde a las fibras que inerva cada fibra Aα, y la aferencia Ia pertenece al huso.","✅ 10-15 fibras musculares y fibras Ib grandes de conducción rápida.","❌ La aferencia Ib es correcta, pero la cifra de 3 a cientos describe la motoneurona α, no el OTG."]},{"pregunta":"¿Qué afirmación diferencia correctamente las dianas medulares de las vías descendentes según el temario?","opciones":["La piramidal llega a α; la extrapiramidal llega a α y γ","La piramidal llega a γ; la extrapiramidal llega solo a α","La piramidal llega a α y γ; la extrapiramidal solo a α","Ambas vías llegan exclusivamente a las motoneuronas γ"],"correcta":0,"explicacion":"El temario asocia la vía piramidal al movimiento voluntario sobre motoneuronas α. La vía extrapiramidal (motricidad involuntaria) llega a las motoneuronas α y γ. Por eso la vía extrapiramidal influye en la sensibilidad del huso y el tono.","por_opcion":["✅ Piramidal → α (voluntario). Extrapiramidal → α y γ (involuntario).","❌ Atribuye las γ a la piramidal y excluye las γ de la extrapiramidal. Ambas cosas son falsas.","❌ Invierte las dianas: es la extrapiramidal la que llega a α y γ.","❌ La piramidal se dirige a las α, y la extrapiramidal no se limita a las γ."]},{"pregunta":"Un paciente pisa un objeto punzante con el pie derecho y retira la pierna. ¿Cuándo empieza a extenderse la pierna izquierda según el temario?","opciones":["Unos 0,02-0,05 s tras el reflejo flexor","Unos 2-5 s tras el reflejo flexor","Unos 0,5-1 s tras el reflejo flexor","Unos 0,2-0,5 s tras el reflejo flexor"],"correcta":3,"explicacion":"El reflejo extensor cruzado aparece 0,2-0,5 s después del reflejo flexor en una extremidad. La extremidad contraria se extiende y puede tirar de todo el cuerpo para alejarlo del estímulo doloroso.","por_opcion":["❌ Latencia diez veces menor que la indicada. No corresponde al dato del temario.","❌ Una latencia de segundos sería incompatible con un reflejo protector medular.","❌ Intervalo demasiado largo. El temario da 0,2-0,5 s.","✅ El extensor cruzado comienza 0,2-0,5 s tras el reflejo flexor."]},{"pregunta":"En el modelo de control motor del temario, ¿qué par de estructuras ejerce la influencia en paralelo sobre el sistema motor?","opciones":["Tronco del encéfalo y cerebelo","Ganglios basales y tálamo","Tálamo y cerebelo","Ganglios basales y cerebelo"],"correcta":3,"explicacion":"La organización en paralelo se basa en dos estructuras subcorticales independientes: los ganglios basales y el cerebelo. El tálamo actúa como relevo hacia la corteza en el esquema. El tronco del encéfalo es uno de los tres niveles jerárquicos.","por_opcion":["❌ El tronco del encéfalo pertenece a la organización jerárquica (médula, tronco, corteza).","❌ Incluye al tálamo, que no es estructura de control en paralelo según el temario.","❌ El tálamo es una estación de relevo en el esquema, no una de las dos estructuras en paralelo.","✅ Ganglios basales y cerebelo: estructuras subcorticales independientes que actúan en paralelo."]},{"pregunta":"En el reflejo rotuliano descrito como monosináptico, ¿qué elemento NO forma parte de su rama excitadora?","opciones":["Motoneurona α del cuádriceps","Aferente Ia del ganglio dorsal","Interneurona excitadora medular","Huso muscular del cuádriceps"],"correcta":2,"explicacion":"En el reflejo monosináptico, la aferente Ia sinapta directamente con la motoneurona α, sin interneurona intercalada. Las interneuronas aparecen en los reflejos polisinápticos, como la inhibición recíproca o la retirada.","por_opcion":["❌ La motoneurona α es la vía eferente que contrae el músculo extrafusal.","❌ La aferente Ia, con soma en el ganglio de la raíz dorsal, es la vía sensitiva del arco.","✅ No hay interneurona: la sinapsis Ia → α es directa (monosináptica).","❌ El huso es el receptor estimulado por el estiramiento del cuádriceps al percutir el tendón."]},{"pregunta":"Al percutir el tendón rotuliano, ¿qué ocurre en los isquiotibiales y por qué mecanismo, según el temario?","opciones":["Se relajan por inhibición de su motoneurona α a través de una interneurona","Se relajan por activación de su OTG a través de la aferente Ib del cuádriceps","Se contraen por excitación de su motoneurona α a través de la aferente Ia","Se contraen por activación de su motoneurona γ a través de una interneurona"],"correcta":0,"explicacion":"La aferente Ia del huso del agonista también sinapta con una interneurona inhibitoria. Esta inhibe la motoneurona α del antagonista (isquiotibiales). Es la ruta inhibitoria directa o inhibición recíproca, que evita que el antagonista se oponga al agonista.","por_opcion":["✅ Inhibición recíproca: Ia → interneurona inhibitoria → inhibición de la α antagonista → relajación.","❌ El mecanismo descrito es la Ia del huso sobre una interneurona inhibitoria, no el OTG ni la aferencia Ib.","❌ La Ia del cuádriceps excita la α del propio cuádriceps, no la del antagonista.","❌ El antagonista no se contrae, y la diana de la interneurona es la motoneurona α, no la γ."]},{"pregunta":"¿Cuál de las funciones de los husos musculares se relaciona específicamente con el control de los temblores según el temario?","opciones":["Compensación de variaciones de carga","Amortiguamiento de la longitud","Amortiguamiento de la velocidad","Ajuste continuo del tono muscular"],"correcta":2,"explicacion":"El temario enumera cuatro funciones de amortiguamiento básico de los husos. Asocia explícitamente el amortiguamiento de la velocidad con el control de temblores. El ajuste continuo del tono se vincula con la preparación del movimiento.","por_opcion":["❌ Compensar variaciones en la carga es otra función distinta, sin relación con los temblores en el temario.","❌ El amortiguamiento de longitud se opone a los cambios de longitud. El temario no lo vincula a los temblores.","✅ Amortiguamiento de la velocidad: controlan temblores.","❌ El ajuste continuo del tono se asocia a preparar el movimiento, no al control de temblores."]},{"pregunta":"Un halterófilo sostiene una carga que supera su capacidad y, de repente, su musculatura cede y suelta el peso. ¿Qué mecanismo explica esta respuesta?","opciones":["Reacción de alargamiento mediada por el órgano tendinoso de Golgi","Reflejo miotático dinámico mediado por las fibras en saco","Inhibición recíproca mediada por la aferencia Ia del antagonista","Reflejo extensor cruzado mediado por circuitos polisinápticos"],"correcta":0,"explicacion":"La estimulación del OTG por la tensión produce reflejos inhibitorios. Cuando la tensión es muy intensa y excesiva aparece la reacción de alargamiento, con función protectora: el músculo se relaja para evitar lesiones.","por_opcion":["✅ Tensión excesiva → OTG (Ib) → inhibición → reacción de alargamiento protectora.","❌ El reflejo miotático produce contracción ante el estiramiento, no relajación ante una tensión excesiva.","❌ La inhibición recíproca relaja al antagonista de un agonista activado. No explica la claudicación del propio músculo sobrecargado.","❌ El extensor cruzado responde a estímulos nociceptivos contralaterales, no a tensión tendinosa."]},{"pregunta":"¿Qué descripción de las motoneuronas anteriores de la médula es fiel al temario?","opciones":["Varios miles por segmento, de tamaño similar a las interneuronas","Varios miles por segmento, un 50-100% mayores que el resto","Varios cientos por segmento, un 50-100% menores que el resto","Varios cientos por segmento, un 10-20% mayores que el resto"],"correcta":1,"explicacion":"En cada segmento de las astas anteriores hay varios miles de motoneuronas, entre un 50% y un 100% más grandes que el resto de neuronas. Las interneuronas, en cambio, son de tamaño pequeño.","por_opcion":["❌ Las interneuronas son pequeñas, y las motoneuronas anteriores son claramente mayores.","✅ Varios miles por segmento y un 50-100% más grandes.","❌ Son mayores, no menores, y hay miles por segmento, no cientos.","❌ Tanto el número (cientos) como el porcentaje (10-20%) son incorrectos."]},{"pregunta":"Según el temario, la locomoción se presenta como ejemplo de:","opciones":["reflejo monosináptico de origen fusal","automatismo rítmico de control medular","conducta voluntaria de control piramidal","programa motor exclusivo del cerebelo"],"correcta":1,"explicacion":"La médula tiene capacidad para producir motricidad refleja y automatismos rítmicos. El temario cita la locomoción como ejemplo de automatismo rítmico de control medular, apoyado en circuitos de interneuronas e inhibición recíproca.","por_opcion":["❌ El reflejo monosináptico es la respuesta Ia → α al estiramiento, no un patrón rítmico como la marcha.","✅ La locomoción es un automatismo rítmico de control medular.","❌ La vía piramidal media el movimiento voluntario. El temario no atribuye a ella la locomoción.","❌ El cerebelo influye en paralelo, pero el temario no le atribuye la locomoción en exclusiva."]},{"pregunta":"¿Cuál de estas variables NO atribuye el temario a la medición del huso muscular?","opciones":["Longitud o grado de estiramiento","Velocidad de aplicación del estiramiento","Grado de estimulación mecánica","Tensión desarrollada por el músculo"],"correcta":3,"explicacion":"Según el temario, el huso mide la longitud, el grado de estimulación mecánica y la velocidad del estiramiento. La tensión desarrollada por el músculo es la variable que mide el órgano tendinoso de Golgi.","por_opcion":["❌ La longitud es la variable principal del huso.","❌ La velocidad con que se aplica el estiramiento también la mide el huso.","❌ El temario incluye expresamente el grado de estimulación mecánica entre lo que mide el huso.","✅ La tensión corresponde al OTG, no al huso."]},{"pregunta":"En las láminas de Guyton & Hall del temario sobre el huso, ¿qué ordenación de diámetros de fibra, de mayor a menor, es correcta?","opciones":["Ia (17 µm) > II (14 µm) > α (8 µm) > γ (5 µm)","α (14 µm) > Ia (8 µm) > II (5 µm) > γ (3 µm)","α (17 µm) > Ia (14 µm) > γ (8 µm) > II (5 µm)","Ia (17 µm) > α (14 µm) > II (8 µm) > γ (5 µm)"],"correcta":3,"explicacion":"La figura del huso indica Ia 17 µm, α 14 µm, II 8 µm y γ 5 µm. La aferente Ia es la fibra más gruesa del esquema, y la eferente γ la más fina, en coherencia con que las γ originan fibras motoras pequeñas.","por_opcion":["❌ Asigna a la fibra II el diámetro de la α y desplaza la α a 8 µm.","❌ Cifras desplazadas e inventadas (γ a 3 µm, Ia a 8 µm).","❌ Intercambia α con Ia y γ con II.","✅ Ia 17 > α 14 > II 8 > γ 5 µm."]},{"pregunta":"En el reflejo flexor de retirada, ¿qué circuito medular permite que el reflejo alcance todos los músculos necesarios para alejar el miembro del estímulo?","opciones":["Ruta monosináptica directa entre Ia y α","Circuitos divergentes de interneuronas","Circuito inhibitorio Ib del tendón","Circuitos convergentes sobre motoneuronas γ"],"correcta":1,"explicacion":"Las fibras nociceptivas alcanzan un conjunto de interneuronas medulares. Los circuitos divergentes diseminan el reflejo hasta los músculos necesarios para efectuar la retirada. Es un reflejo polisináptico, sin relación con las aferencias del huso o del OTG.","por_opcion":["❌ La ruta Ia → α es el reflejo miotático, desencadenado por estiramiento, no por dolor.","✅ Circuitos divergentes: diseminan el reflejo a todos los músculos de la retirada.","❌ La vía Ib del OTG responde a la tensión, no a estímulos nociceptivos.","❌ El temario no describe circuitos convergentes sobre γ en la retirada. La salida es hacia motoneuronas α de flexores."]}],"asignatura":"Fisioterapia neurológica","tema":1,"fecha":"2026-11-04"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const L = 'ABCD';
const secs = F.secciones || [];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="tarjetas">${(b.items||[]).map(t=>`<div class="tarjeta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="def"><b>${md(b.termino)}</b> — ${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota perla"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota alerta"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${md(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const nav = secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`).join('') + (F.caso_clinico?'<a href="#caso">Caso clínico</a>':'') + (F.glosario?.length?'<a href="#glosario">Glosario</a>':'') + `<a class="qcm" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`;

document.getElementById('app').innerHTML = `
<header class="portada"><div class="envoltura">
  <div class="etiquetas">${F.asignatura?`<span class="etiqueta">${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="etiqueta o">Tema ${esc(F.tema)}</span>`:''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="meta">${F.tipo==='grand-qcm'?`<div><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div><b>${secs.length}</b><span>secciones</span></div><div><b>${(F.ideas_clave||[]).length}</b><span>ideas clave</span></div>`}<div><b>${(F.qcm||[]).length}</b><span>preguntas</span></div><div id="ultimo"></div></div>
</div></header>
<nav class="indice" aria-label="Índice"><div class="envoltura">${nav}</div></nav>
<main class="envoltura">
  ${(F.objetivos||[]).length?`<div class="dos">
    <div class="caja"><h3>Objetivos</h3><ul>${(F.objetivos||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>
    <div class="caja"><h3>Lo que hay que saber</h3><ol class="claves">${(F.ideas_clave||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>
  </div>`:''}
  ${F.tipo==='grand-qcm'&&(F.fichas||[]).length?`<div class="caja" style="margin-top:40px"><h3>Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="num">Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd>`).join('')}</dl></section>`:''}
  <section id="qcm"><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="envoltura">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* ---------- esquemas ---------- */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:oscuro?'dark':'neutral',fontFamily:'Spectral, Georgia, serif',flowchart:{htmlLabels:true,curve:'basis'}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* ---------- QCM ---------- */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u) document.getElementById('ultimo').innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; }catch(e){} }
ultimo();
const marco = document.getElementById('marco');

function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${(pos)/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="etiqueta o" style="display:inline-block;margin-bottom:12px">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="btn sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="btn" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'Dominado. Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'Bien, pero repasa las preguntas falladas.':'Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="btn" id="rep">Repetir todo</button>${fallos.length?'<button class="btn sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
