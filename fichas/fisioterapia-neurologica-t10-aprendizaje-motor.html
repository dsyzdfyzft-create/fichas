<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Aprendizaje motor · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Aprendizaje motor","subtitulo":"Qué es el aprendizaje motor, qué factores lo modulan y cómo se aplica en neurorrehabilitación al miembro superior, al equilibrio y a la doble tarea.","resumen":["El **aprendizaje motor** es el conjunto de procesos internos asociados a la práctica y la experiencia que producen **cambios relativamente permanentes** en la capacidad de producir actividades motoras; **el rendimiento motor (cambio temporal en una sesión) no es aprendizaje**.","Lo modulan las **instrucciones**, la **participación activa y la motivación**, la **práctica** (distribuida vs masiva, aleatoria vs bloqueada), la **memoria**, la posibilidad de **cometer errores**, el **feedback** (intrínseco/extrínseco; el refuerzo positivo da más progreso), el entrenamiento **todo vs parte** y la **transferencia**.","En el miembro superior conviven el **entrenamiento bilateral** (fases **precoces** tras el ictus, para reorganizar el córtex) y la **terapia por restricción del lado sano (TRMLS)** (fases **crónicas**); la práctica será **distribuida al principio** (20 min × 3 días) y **masiva después** (60 min en un día).","El equilibrio puede ser **estático, reactivo o proactivo/anticipatorio**; ante una perturbación actúa primero la **estrategia de tobillo** (distal → proximal) y, si la fuerza es mayor, la **de cadera** (proximal → distal); los límites de estabilidad son **8º frontal (izq./dcha.) y 4,5º posterior**.","Equilibrio y marcha **requieren atención**: la mayoría de caídas del paciente neurológico ocurren al hacer **otra tarea a la vez**, por lo que se entrena la **doble tarea** (práctica, intensidad, progresividad, todos los componentes), separando el componente cognitivo en los **primeros estadios**."],"objetivos":["Al terminar, sabrás definir aprendizaje motor y diferenciarlo del rendimiento motor y de la memoria.","Al terminar, sabrás explicar los factores que influyen en el aprendizaje motor y cómo manipularlos (práctica, feedback, todo/parte, transferencia).","Al terminar, sabrás decidir entre entrenamiento bilateral y TRMLS, y entre práctica masiva/distribuida y aleatoria/bloqueada según la fase.","Al terminar, sabrás clasificar los tipos de equilibrio, describir las estrategias de tobillo y cadera y elegir escalas de valoración.","Al terminar, sabrás diseñar ejercicios de doble tarea para ictus, esclerosis múltiple y Parkinson."],"ideas_clave":["Aprendizaje motor = cambio **relativamente permanente** fruto de la práctica; las modificaciones a corto plazo **no** se consideran aprendizaje.","**Rendimiento motor ≠ aprendizaje motor**: el rendimiento es temporal y se ve influido por fatiga, ansiedad o motivación.","Formas de aprendizaje: **no asociativas** (estímulo único repetido → respuesta, p. ej. reflejo, **Vojta**) y **asociativas** (asociación de ideas, **tareas**).","El **feedback** es un factor muy importante, pero crea **dependencia**: darlo solo cuando sea necesario; el refuerzo positivo es más eficaz que el negativo.","La **transferencia** depende de la **similitud** entre actividades o entornos: entrenar en un contexto lo más parecido posible al habitual.","**Bilateral en fase precoz, TRMLS en fase crónica**; práctica **distribuida al inicio**, **masiva después**; tareas difíciles **al principio** de la sesión.","Equilibrio: **estático, reactivo y proactivo**; estrategia de **tobillo primero**, **cadera** si la perturbación es mayor; límites **8º frontal / 4,5º posterior**.","En patología neurológica la actividad muscular es **menor, inversa y más lenta**; evaluar primero barreras **neuromusculares primarias** y después las **musculoesqueléticas secundarias**."],"secciones":[{"id":"concepto","titulo":"Concepto de aprendizaje motor","bloques":[{"tipo":"definicion","termino":"Aprendizaje motor (AM)","texto":"Conjunto de procesos internos asociados a la **práctica y la experiencia** que producen **cambios relativamente permanentes** en la capacidad de producir actividades motoras, a través de una habilidad específica."},{"tipo":"parrafo","texto":"Lo aprendido se retiene en el cerebro y constituye la **memoria**; las modificaciones a corto plazo **no** se consideran aprendizaje. Aplicado a pacientes, el AM implica la **readquisición** de habilidades de movimiento previamente aprendidas que se pierden por patología **sensorial, motora o cognitiva**. Se apoya en la **neuroplasticidad** y es resultado de la experiencia o de la práctica/repeticiones."},{"tipo":"tabla","titulo":"Rendimiento motor vs aprendizaje motor","columnas":["","Rendimiento motor","Aprendizaje motor"],"filas":[["Duración del cambio","**Temporal**, visible durante una sesión","**Relativamente permanente**"],["Ejemplo","El paciente empuja un objeto al final de la sesión","El paciente mantiene la habilidad días después y la usa en casa"],["Variables que lo distorsionan","Fatiga, nivel de aprendizaje, ansiedad, motivación","Se valora con retención y transferencia, no solo con la ejecución inmediata"]]},{"tipo":"alerta","texto":"«**Rendimiento motor NO es aprendizaje motor**»: que el paciente lo haga bien al final de la sesión no demuestra que lo haya aprendido. Es la idea que el temario subraya con más fuerza."},{"tipo":"tarjetas","items":[{"etiqueta":"No asociativo","titulo":"Estímulo único repetido","texto":"Un único estímulo dado de forma repetida produce una respuesta. Ejemplo: **reacción refleja**, **Vojta**."},{"etiqueta":"Asociativo","titulo":"Asociación de ideas","texto":"Implica asociar ideas; es el aprendizaje de **tareas**."}]},{"tipo":"parrafo","texto":"**Aprendizaje y memoria** son inseparables: el aprendizaje es el proceso por el que adquirimos conocimiento sobre el mundo, y la memoria el proceso por el que ese conocimiento se **codifica, almacena y recupera**. Si la memoria está muy afectada, el AM es muy difícil."}]},{"id":"teorias","titulo":"Teorías del aprendizaje motor","bloques":[{"tipo":"parrafo","texto":"Las teorías del AM son grupos de **ideas abstractas** sobre la naturaleza y la adquisición del control o la modificación del movimiento, basadas en el conocimiento actual sobre la estructura y el funcionamiento del SNC."},{"tipo":"tabla","titulo":"Teorías citadas en el temario","columnas":["Teoría / modelo","Autor"],"filas":[["Teoría de circuito cerrado","**Adams**"],["Teoría del esquema","**Schmidt**"],["Modelo de los tres estadios","**Fitts y Posner**"],["Modelo de sistema de tres fases","**Bernstein**"],["Modelo de dos fases","**Gentile**"],["Teoría ecológica","—"]]},{"tipo":"alerta","texto":"Cuidado con los **números**: Fitts y Posner = **tres estadios**; Bernstein = **tres fases**; Gentile = **dos fases**. Adams = **circuito cerrado**; Schmidt = **esquema**. Son emparejamientos típicos de examen."}]},{"id":"factores","titulo":"Factores que influyen en el aprendizaje motor","bloques":[{"tipo":"esquema","titulo":"Factores que modulan el aprendizaje motor","mermaid":"flowchart LR\n  AM[\"Aprendizaje motor\"]\n  I[\"Instrucciones verbales, visuales, escritas\"] --> AM\n  M[\"Participación activa y motivación\"] --> AM\n  P[\"Características y variabilidad de la práctica\"] --> AM\n  ME[\"Memoria\"] --> AM\n  E[\"Posibilidad de cometer errores\"] --> AM\n  F[\"Feedback intrínseco y extrínseco\"] --> AM\n  T[\"Entrenamiento todo vs parte\"] --> AM\n  TR[\"Transferencia\"] --> AM","pie":"Los ocho factores en el orden del temario."},{"tipo":"parrafo","texto":"**Instrucciones**: las verbales requieren preservar la capacidad de **atención y observación directa**; importan también las visuales, las escritas, su cantidad y su tipo. **Participación activa y motivación**: los resultados del aprendizaje dependen del **tiempo total** de práctica; el temario menciona el **bombardeo sensorial**."},{"tipo":"tabla","titulo":"Práctica distribuida vs masiva","columnas":["","Distribuida","Masiva (tareas continuas)"],"filas":[["Definición","Tiempos de descanso **prolongados y programados**","Trabajo **sin tiempo de descanso**"],["Ventaja","Aumenta la **transferencia** del aprendizaje; evita la fatiga","Mayor volumen en un bloque"],["Riesgo","—","Más errores por agotamiento físico y mental"],["Cuándo","Etapa temprana (p. ej. **20 min × 3 días**); ataxias, EM, Parkinson","Etapa posterior (p. ej. **60 min en un día**)"]]},{"tipo":"perla","texto":"En **ataxias, esclerosis múltiple y Parkinson** el temario recomienda **práctica distribuida**: la fatiga es la principal razón para intercalar descansos, y el descanso se ajusta a cada paciente y momento evolutivo."},{"tipo":"parrafo","texto":"**Memoria**: elemento clave del AM. **Posibilidad de cometer errores**: analizar cada actividad para decidir qué componentes del movimiento enfatizar."},{"tipo":"definicion","termino":"Feedback (retroalimentación)","texto":"Información que busca **motivar** la consecución de objetivos, **reforzar** el desarrollo de una actividad e **informar** sobre la acción. **Intrínseco**: llega por los sistemas sensoriales como resultado normal del movimiento. **Extrínseco**: lo aporta el terapeuta, **simultáneo** (correcciones durante la tarea) o **terminal** (al acabar)."},{"tipo":"alerta","texto":"El feedback es un factor **muy importante**, pero puede crear **dependencia**: el terapeuta debe darlo **solo cuando sea necesario**. Y la evidencia indica que el **refuerzo positivo** (verbal o no verbal) produce más progreso que el negativo."},{"tipo":"parrafo","texto":"**Entrenamiento todo vs parte**: dividir la actividad en pasos intermedios y dominar cada parte antes de la actividad completa, p. ej. practicar aisladamente las **fases de la marcha** antes de combinarlas en un patrón completo (**Bobath**). **Transferencia**: el gran problema de la rehabilitación es trasladar lo entrenado a otra actividad o entorno; la cantidad de transferencia depende de la **similitud** entre actividades o entornos, por lo que las tareas en sala deben parecerse lo más posible al entorno habitual."}]},{"id":"miembro-superior","titulo":"Aplicaciones clínicas: control postural y miembro superior","bloques":[{"tipo":"parrafo","texto":"El **ejercicio físico** es eficaz para mejorar el equilibrio del paciente neurológico, lo que puede mejorar la funcionalidad y **reducir las caídas**. Su efectividad depende de incluir ejercicios **multidimensionales** más que dirigidos a un solo aspecto; a ello se añaden metodologías globales como el **entrenamiento sensorial** y la **tarea dual** (motora + cognitiva)."},{"tipo":"lista","items":["**Alcance, agarre y manipulación** — tipos de intervención: las que se focalizan en las **deficiencias**, las que tratan de **recuperar la función** y las que proponen la **práctica de la tarea concreta**.","**Práctica orientada a la tarea**: practicar la tarea en sí (AVD) es lo que mejora la función."]},{"tipo":"tarjetas","items":[{"etiqueta":"Fase precoz","titulo":"Entrenamiento bilateral / bimanual","texto":"En hemiplejía mejora la coordinación entre ambas manos y también, de forma aislada, el lado afectado. Útil **tras el ictus precoz** para generar nuevas redes de **reorganización cortical**."},{"etiqueta":"Fase crónica","titulo":"TRMLS","texto":"Terapia por restricción del movimiento del lado sano (terapia de movimiento inducido por restricción): estudios prometedores en la función del MS. Indicada en **fases más crónicas**."}]},{"tipo":"alerta","texto":"El tratamiento **bimanual contradice** a la TRMLS (uno usa ambas manos, el otro inmoviliza la sana). El temario los concilia por **fase**: **bilateral precoz**, **TRMLS crónica**. No al revés."},{"tipo":"tabla","titulo":"Condiciones de la práctica","columnas":["Variable","Recomendación del temario"],"filas":[["Masiva vs distribuida","Distribuida en etapa temprana (20 min × 3 días) para evitar fatiga; masiva en etapa posterior (60 min en un día)"],["Dificultad","Tareas **más difíciles al principio** de la sesión: se retienen mejor porque la fatiga aún no afecta"],["Aleatoria vs bloqueada","**Aleatoria** (varias tareas en 15 min) da mejor aprendizaje que **bloqueada** (una tarea en 15 min) **en adultos sanos**, pero no necesariamente en pacientes"]]},{"tipo":"dato","valor":"20 min × 3 días vs 60 min/1 día","texto":"Ejemplos del temario de práctica distribuida (etapa temprana) frente a práctica masiva (etapa posterior)."}]},{"id":"equilibrio","titulo":"Equilibrio: conceptos, tipos y estrategias posturales","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"Definición","titulo":"Equilibrio","texto":"Facultad de mantener la postura en sedestación o bipedestación y de conocer la orientación y posición en el espacio."},{"etiqueta":"Definición","titulo":"Postura","texto":"Facultad de mantener el cuerpo en una composición global de los segmentos entre sí y respecto a su orientación en el espacio."},{"etiqueta":"Definición","titulo":"Estabilidad","texto":"Propiedad de un cuerpo, apartado de su equilibrio, de volver a su estado general (Bobath → **reacciones de enderezamiento**)."}]},{"tipo":"parrafo","texto":"En el control motor el equilibrio se trabaja a través de la **tarea** y del **aspecto cognitivo**. Incluye **sistemas sensoriales** (percibir y organizar la información sobre la posición del cuerpo) y **sistemas motores** (generar, coordinar y aplicar fuerzas). Depende del **entorno, el individuo y la tarea**."},{"tipo":"figura","pagina":39,"pie":"El control del equilibrio como interacción de sistemas: visual, cognitivo, cerebeloso, motor, vestibular y propioceptivo. Cualquiera de ellos alterado puede explicar el déficit.","src":"img/fisioterapia-neurologica-t10-aprendizaje-motor-p39.jpg"},{"tipo":"tabla","titulo":"Tipos de equilibrio","columnas":["Tipo","Definición","Claves"],"filas":[["Estático","Mantener una posición estable","Alineación y tono postural (muy relacionado con Bobath)"],["Reactivo","Recuperarse de una alteración **inesperada** de un agente externo","Respuesta a perturbación"],["Proactivo o anticipatorio","Anticiparse y estabilizarse **antes** de un movimiento voluntario","Clave en el **alcance del MS**"]]},{"tipo":"esquema","titulo":"Secuencia de equilibrios en una tarea cotidiana","mermaid":"flowchart LR\n  A[\"Equilibrio estático\"] --> B[\"Equilibrio proactivo\"]\n  B --> C[\"Equilibrio reactivo\"]\n  C --> D[\"Vuelta al equilibrio estático\"]","pie":"En la mayoría de tareas coexisten los tres tipos en este orden."},{"tipo":"parrafo","texto":"Realizamos **estrategias posturales** cuando varía la **base de apoyo** (a menor base de apoyo, más estrategias **vestibulares**), según la **posición y velocidad del centro de gravedad** respecto a la base, y según la **percepción individual de los límites** del equilibrio (alterada en pacientes neurológicos y ancianos)."},{"tipo":"figura","pagina":36,"pie":"Cono de estabilidad: el centro de gravedad debe mantenerse dentro de los límites sobre la base de apoyo. A y B ilustran el balanceo en bloque (tobillo) frente a la flexión de tronco-cadera.","src":"img/fisioterapia-neurologica-t10-aprendizaje-motor-p36.jpg"},{"tipo":"tabla","titulo":"Estrategias de tobillo y de cadera","columnas":["","Estrategia de tobillo","Estrategia de cadera"],"filas":[["Orden de activación","**Distal → proximal**","**Proximal → distal**"],["Cadena posterior","Gemelos, paravertebrales, isquiotibiales","Paravertebrales, isquiotibiales"],["Cadena anterior","Tibial anterior, cuádriceps, abdominales","Abdominales, cuádriceps"],["Cuándo","**Primera** en actuar","Si la fuerza externa es **más intensa**"]]},{"tipo":"figura","pagina":37,"pie":"Estrategias posturales: a la izquierda oscilación desde el tobillo con el cuerpo en bloque; a la derecha flexión de cadera ante una perturbación mayor.","src":"img/fisioterapia-neurologica-t10-aprendizaje-motor-p37.jpg"},{"tipo":"dato","valor":"8º frontal · 4,5º posterior","texto":"Límites de estabilidad cuantificados: 8º en el plano frontal a izquierda y derecha y 4,5º hacia posterior; disminuyen en condiciones patológicas."},{"tipo":"alerta","texto":"Ambas estrategias funcionan **tanto en equilibrio proactivo como reactivo**. Y en patología neurológica la actividad muscular es **menor, inversa y más lenta**."}]},{"id":"valoracion-equilibrio","titulo":"Valoración del equilibrio","bloques":[{"tipo":"lista","items":["**Escalas y pruebas citadas:** Tándem, Romberg, Berg, Escala de Tinetti, Test de empuje, CTSIB, BESTest, Alcance lateral, Alcance funcional, Trunk Impairment Scale (TIS), Prueba de los 10 m, Timed Up and Go, Dynamic Gait Index."]},{"tipo":"perla","texto":"No hace falta pasarlas todas: **CTSIB, Dynamic Gait Index y las pruebas de alcance** dan bastante información. Una buena valoración hace el tratamiento mucho más específico; cuántas más escalas mejor, pero **dependerá del paciente**."},{"tipo":"esquema","titulo":"Razonamiento clínico ante un déficit de equilibrio","mermaid":"flowchart TD\n  A[\"Paciente con equilibrio alterado\"] --> B[\"Valorar con escalas: CTSIB, DGI, alcances\"]\n  B --> C[\"Barreras primarias neuromusculares\"]\n  C --> C1[\"Paresia, espasticidad, coordinación\"]\n  B --> D[\"Barreras secundarias musculoesqueléticas\"]\n  D --> D1[\"Contracturas, alineación\"]\n  C1 --> E[\"Qué tipo de equilibrio está más alterado\"]\n  D1 --> E\n  E --> F[\"Qué estrategias usa: tobillo o cadera\"]\n  F --> G[\"Tratamiento específico y doble tarea\"]","pie":"Primero las barreras neuromusculares primarias, después las secundarias."},{"tipo":"parrafo","texto":"Problemas que aparecen durante la evolución del paciente neurológico: problemas de **control motor** (incluso 15 minutos después de un problema leve), **atrofia muscular**, alteración del **equilibrio**, **espasticidad**, **modificaciones estructurales** de los músculos con aumento del **tejido conectivo**, **rigidez** y **dolor**."}]},{"id":"doble-tarea","titulo":"Equilibrio, atención y doble tarea","bloques":[{"tipo":"parrafo","texto":"Tradicionalmente se decía que equilibrio y marcha eran **automáticos**; la investigación actual demuestra que **requieren atención**. La mayoría de las AVD combinan varias actividades (andar y hablar por teléfono, andar portando objetos). Cuando dos tareas se realizan a la vez **compiten por los recursos atencionales** y el rendimiento empeora; la mayor parte de las **caídas** del paciente neurológico ocurren mientras hace otra tarea a la vez, porque el componente de **atención prevalece** sobre el de equilibrio."},{"tipo":"definicion","termino":"Concepto dual-task (control motor)","texto":"Orientar el componente **cognitivo, visual y atencional** hacia la tarea, mediante la adaptación sistemática del entorno sensorial (estímulos visuales y somatosensoriales). La doble tarea puede ser **cognitiva y/o motora**. Reglas: **práctica**, **intensidad** (desafiar al equilibrio), **progresividad** y trabajar **todos los componentes** del equilibrio."},{"tipo":"alerta","texto":"En los **primeros estadios** del tratamiento conviene **separar** el trabajo cognitivo: la doble tarea se introduce progresivamente. El tratamiento depende de la **tarea**, el **estado de salud** y la **edad** de la persona."},{"tipo":"tabla","titulo":"Ejemplos de doble tarea por patología","columnas":["Patología (estudio)","Ejemplos"],"filas":[["Ictus (Bayouk et al., 2006)","Pasos adelante, atrás y laterales; caminar sobre bloques de distintas alturas; levantarse, caminar 4 pasos, tocar un taburete y volver hacia atrás; equilibrio en sedestación sobre pelota Bobath; pies juntos o tándem 10 s; levantarse sin brazos; pata coja 10 s"],["Ictus crónico / marcha (Yang et al., 2007)","Caminar sujetando o botando 1–2 pelotas; golpear una pelota con la pierna (con o sin red) mientras se sujeta otra"],["Esclerosis múltiple (Kirkland et al., 2015)","Caminar diciendo letras de 2 en 2; contar hacia atrás desde 100 de 7 en 7; contar evitando los 3; nombrar palabras con «D» o frutas y verduras"],["Parkinson (Rochester et al., 2004)","Levantarse/sentarse o caminar sujetando una bandeja; llevar la bandeja con objetos a otra mesa; lo anterior respondiendo preguntas sobre sus familiares"]]},{"tipo":"dato","valor":"100 − 7","texto":"Tarea cognitiva clásica de doble tarea en EM: caminar contando hacia atrás desde 100 de 7 en 7."},{"tipo":"perla","texto":"En el paciente con Parkinson, entrena la marcha **llevando una bandeja** y después añade preguntas sobre su familia: reproduces la situación real de caída (atención dividida) en un entorno seguro y similar al de casa, lo que además favorece la **transferencia**."}]}],"caso_clinico":{"titulo":"Hemiparesia izquierda tras ictus: del alta hospitalaria a la fase crónica","presentacion":"Hombre de 67 años, ictus isquémico derecho hace 3 semanas, hemiparesia izquierda de predominio braquial. Se fatiga rápido, camina con supervisión y ha tenido dos tropiezos al hablar mientras andaba por el pasillo. Al final de cada sesión consigue llevar un vaso a la boca, pero al día siguiente no lo reproduce en casa.","preguntas":[{"pregunta":"El paciente lleva el vaso a la boca al final de la sesión pero no al día siguiente. ¿Ha habido aprendizaje motor? ¿Qué factores ajustarías?","respuesta":"No: es **rendimiento motor**, un cambio temporal dentro de la sesión. Para favorecer el aprendizaje, entrenar la tarea concreta en un contexto parecido al de casa (**transferencia** por similitud), reducir progresivamente el **feedback extrínseco** para evitar dependencia, usar refuerzo positivo y colocar la tarea difícil al **principio** de la sesión."},{"pregunta":"¿Qué enfoque de miembro superior y qué organización de la práctica elegirías ahora y dentro de un año?","respuesta":"Ahora, en fase precoz, **entrenamiento bilateral/bimanual** para favorecer la reorganización cortical, con **práctica distribuida** (p. ej. 20 min × 3 días) por su fatiga. En fase crónica podrá plantearse la **TRMLS** y una **práctica más masiva** (p. ej. 60 min en un día)."},{"pregunta":"¿Cómo explicas sus tropiezos y cómo los tratarías?","respuesta":"Equilibrio y marcha requieren **atención**; al hablar, ambas tareas compiten por los recursos atencionales y la atención prevalece sobre el equilibrio. Primero separar el componente cognitivo, después introducir **doble tarea** progresiva (p. ej. ejercicios de Bayouk: pasos en todas direcciones, tándem 10 s, levantarse sin brazos; luego caminar sujetando pelotas, Yang 2007), siguiendo las reglas de práctica, intensidad, progresividad y todos los componentes."}]},"preguntate":[{"pregunta":"Define aprendizaje motor y explica por qué una mejora observada al final de la sesión no basta para demostrarlo.","respuesta":"Son procesos internos asociados a la práctica que producen cambios relativamente permanentes en la capacidad motora. La mejora al final de la sesión es rendimiento motor, temporal e influido por fatiga, ansiedad o motivación."},{"pregunta":"¿Qué diferencia hay entre aprendizaje y memoria?","respuesta":"El aprendizaje es el proceso por el que adquirimos conocimiento; la memoria, el proceso por el que se codifica, almacena y recupera. Con la memoria muy afectada, el AM es muy difícil."},{"pregunta":"Distingue formas asociativas y no asociativas de aprendizaje con un ejemplo de cada una.","respuesta":"No asociativa: un único estímulo repetido genera una respuesta (reflejo, Vojta). Asociativa: implica asociación de ideas, como el aprendizaje de tareas."},{"pregunta":"¿Por qué el feedback extrínseco debe dosificarse y qué tipo de refuerzo es más eficaz?","respuesta":"Porque crea dependencia; el terapeuta debe darlo solo cuando sea necesario. El refuerzo positivo, verbal o no verbal, produce más progreso que el negativo."},{"pregunta":"Explica el entrenamiento «todo vs parte» con el ejemplo del temario.","respuesta":"Se divide la actividad en pasos intermedios y se domina cada uno antes de la tarea completa, como practicar aisladamente las fases de la marcha antes de combinarlas (Bobath)."},{"pregunta":"¿De qué depende la cantidad de transferencia y qué implica para el diseño de la sesión?","respuesta":"De la similitud entre actividades o entornos; por eso hay que entrenar en un contexto lo más parecido posible al entorno habitual del paciente."},{"pregunta":"¿Cómo se concilian el entrenamiento bimanual y la TRMLS?","respuesta":"Por fases: el bilateral en etapas precoces tras el ictus para generar redes de reorganización cortical, y la TRMLS en fases más crónicas."},{"pregunta":"Describe los tres tipos de equilibrio y el orden en que aparecen en una tarea cotidiana.","respuesta":"Estático (mantener posición), proactivo (anticiparse a un movimiento voluntario) y reactivo (recuperarse de una perturbación inesperada); la secuencia es estático → proactivo → reactivo → estático."},{"pregunta":"Compara las estrategias de tobillo y de cadera.","respuesta":"Tobillo: activación distal → proximal, primera en actuar. Cadera: activación proximal → distal, entra si la perturbación es mayor. Ambas actúan en equilibrio proactivo y reactivo."},{"pregunta":"¿Por qué la mayoría de caídas del paciente neurológico ocurren en doble tarea?","respuesta":"Porque equilibrio y marcha requieren atención y, al competir dos tareas por los recursos atencionales, el componente de atención prevalece sobre el de equilibrio."}],"glosario":[{"termino":"Aprendizaje motor","definicion":"Procesos internos ligados a la práctica que producen cambios relativamente permanentes en la capacidad motora."},{"termino":"Rendimiento motor","definicion":"Cambio temporal del comportamiento motor observado durante una sesión de práctica."},{"termino":"Feedback intrínseco","definicion":"Información sensorial que llega al paciente como resultado normal del movimiento."},{"termino":"Feedback extrínseco","definicion":"Información externa, simultánea a la tarea o terminal al acabarla."},{"termino":"Práctica distribuida","definicion":"Práctica con tiempos de descanso prolongados y programados."},{"termino":"Práctica aleatoria","definicion":"Practicar varias tareas mezcladas en un mismo periodo (p. ej. 15 min)."},{"termino":"Transferencia","definicion":"Traslado de lo entrenado a una nueva actividad o entorno; depende de su similitud."},{"termino":"TRMLS","definicion":"Terapia por restricción del movimiento del lado sano o terapia de movimiento inducido por restricción."},{"termino":"Equilibrio proactivo","definicion":"Capacidad de anticiparse y estabilizarse antes de un movimiento voluntario."},{"termino":"Equilibrio reactivo","definicion":"Capacidad de recuperarse de una perturbación externa inesperada."},{"termino":"Estrategia de tobillo","definicion":"Respuesta postural con activación muscular de distal a proximal; la primera en actuar."},{"termino":"Límites de estabilidad","definicion":"Ángulos máximos de oscilación: 8º frontal a cada lado y 4,5º posterior."},{"termino":"Doble tarea","definicion":"Ejecución simultánea de una tarea motora con otra cognitiva y/o motora."}],"fuentes":["Universidad Europea. Fisioterapia neurológica. Tema 10: Aprendizaje motor.","Bayouk J-F, Boucher JP, Leroux A. Balance training following stroke: effects of task-oriented exercises with and without altered sensory input. 2006.","Yang YR, Wang RY, Chen YC, Kao MJ. Dual-task exercise improves walking ability in chronic stroke: a randomized controlled trial. 2007.","Kirkland MC, Wallack EM, Rancourt SN, Ploughman M. Comparing three dual-task methods and the relationship to physical and cognitive impairment in people with multiple sclerosis and controls. 2015.","Rochester L, Hetherington V, Jones D, Nieuwboer A, Willems AM, Kwakkel G, Van Wegen E. Attending to the task: interference effects of functional tasks on walking in Parkinson's disease. 2004;85(10):1578-85."],"qcm":[{"pregunta":"Un paciente con ictus consigue al final de la sesión empujar un objeto con el brazo parético, pero no lo reproduce a la sesión siguiente. ¿Cómo debe interpretarse?","opciones":["Como rendimiento motor, un cambio temporal que no garantiza aprendizaje","Como aprendizaje no asociativo, por la repetición de un único estímulo","Como aprendizaje motor consolidado que la fatiga enmascara después","Como transferencia negativa por cambio de entorno entre sesiones"],"correcta":0,"explicacion":"El rendimiento motor es el cambio temporal del comportamiento visto durante una sesión; el aprendizaje motor es relativamente permanente. Que el paciente lo logre al final de la sesión no demuestra que haya aprendido.","por_opcion":["✅ Es exactamente el ejemplo de rendimiento motor del temario.","❌ El aprendizaje no asociativo es la respuesta a un estímulo único repetido (reflejo, Vojta), no una tarea.","❌ Si no se mantiene, no puede considerarse aprendizaje consolidado.","❌ El temario no habla de transferencia negativa; el fallo es de retención, no de entorno."]},{"pregunta":"¿Qué emparejamiento entre teoría de aprendizaje motor y autor es correcto?","opciones":["Teoría de circuito cerrado — Gentile","Modelo de sistema de tres fases — Bernstein","Modelo de dos fases — Fitts y Posner","Teoría del esquema — Adams"],"correcta":1,"explicacion":"El temario cita: circuito cerrado de Adams, esquema de Schmidt, tres estadios de Fitts y Posner, sistema de tres fases de Bernstein, dos fases de Gentile y teoría ecológica.","por_opcion":["❌ El circuito cerrado es de Adams; Gentile es el modelo de dos fases.","✅ Bernstein: modelo de sistema de tres fases.","❌ Fitts y Posner proponen tres estadios; el modelo de dos fases es de Gentile.","❌ La teoría del esquema es de Schmidt; Adams es el circuito cerrado."]},{"pregunta":"¿Cuál de los siguientes es un ejemplo de forma no asociativa de aprendizaje según el temario?","opciones":["Ejercicio de caminar mientras se cuentan números","Respuesta refleja a un estímulo aplicado de forma repetida","Práctica de alcance de un vaso en la cocina de casa","Entrenamiento de las fases de la marcha por separado"],"correcta":1,"explicacion":"Las formas no asociativas se dan cuando un único estímulo se aplica de forma repetida y produce una respuesta, como una reacción refleja (Vojta). Las asociativas implican asociación de ideas (tareas).","por_opcion":["❌ Es una doble tarea, aprendizaje de tareas (asociativo).","✅ Estímulo único repetido → respuesta refleja: no asociativo.","❌ Es práctica orientada a una tarea funcional (asociativo).","❌ Es entrenamiento por partes de una tarea (asociativo)."]},{"pregunta":"Según el temario, ¿qué tipo de práctica es preferible en pacientes con ataxia, esclerosis múltiple o Parkinson y por qué?","opciones":["Distribuida, porque la fatiga justifica intercalar descansos","Aleatoria, porque da mejor retención que la bloqueada en todos","Bloqueada, porque reduce la carga atencional de cambiar de tarea","Masiva, porque el tiempo total de práctica determina el resultado"],"correcta":0,"explicacion":"El temario concluye que el descanso depende del paciente y que en ataxias, EM y Parkinson es mejor la práctica distributiva; la fatiga es una de las razones que la justifican y aumenta la transferencia.","por_opcion":["✅ Distribuida, por la fatiga.","❌ La ventaja de la aleatoria se demostró en adultos sanos, no necesariamente en pacientes.","❌ El temario no recomienda la bloqueada para estas patologías.","❌ La práctica masiva aumenta los errores por agotamiento físico y mental."]},{"pregunta":"Respecto a la práctica aleatoria frente a la bloqueada, ¿qué afirma el temario?","opciones":["Ambas producen el mismo aprendizaje si dura 15 minutos","La aleatoria aprende más en pacientes, pero no en adultos sanos","La bloqueada aprende más que la aleatoria tanto en sanos como en pacientes","La aleatoria aprende más en adultos sanos, pero no necesariamente en pacientes"],"correcta":3,"explicacion":"La práctica aleatoria (múltiples tareas en 15 min) ofrece mejores resultados que la bloqueada (una tarea en 15 min) en adultos sanos, pero no necesariamente en los pacientes.","por_opcion":["❌ Los 15 minutos son el ejemplo, no una condición de equivalencia.","❌ Invierte la población: la ventaja demostrada es en sanos.","❌ En sanos la aleatoria supera a la bloqueada.","✅ Es la conclusión literal del temario."]},{"pregunta":"¿Cuándo conviene plantear las tareas más difíciles dentro de una sesión de aprendizaje motor?","opciones":["Solo en sesiones de práctica masiva de al menos 60 minutos","Al final, cuando el paciente ya ha calentado y está más preparado","Al principio, porque se retienen mejor antes de que influya la fatiga","En la mitad, alternándolas con tareas fáciles en práctica bloqueada"],"correcta":2,"explicacion":"Plantear las tareas más difíciles al principio de la sesión hace que se retengan mejor que si se dejan para el final, porque la fatiga va a afectar.","por_opcion":["❌ La dificultad no se vincula a la práctica masiva.","❌ Al final la fatiga reduce la retención.","✅ Al principio, antes de la fatiga.","❌ El temario no propone esta organización."]},{"pregunta":"Sobre el feedback en el aprendizaje motor, señala la afirmación correcta:","opciones":["El refuerzo negativo produce un progreso similar al positivo","Debe proporcionarse en todas las repeticiones para evitar errores","El feedback terminal es un tipo de feedback intrínseco","Puede generar dependencia, por lo que se da solo cuando es necesario"],"correcta":3,"explicacion":"El feedback motiva, refuerza e informa, pero puede crear dependencia; el terapeuta debe darlo solo cuando sea necesario. El refuerzo positivo produce más progreso que el negativo.","por_opcion":["❌ La evidencia indica que el positivo produce más progreso.","❌ Darlo siempre crea dependencia.","❌ El terminal es extrínseco (al acabar la actividad).","✅ Riesgo de dependencia: dosificarlo."]},{"pregunta":"Durante la reeducación, el fisioterapeuta practica por separado cada fase de la marcha antes de combinarlas en el patrón completo. ¿A qué factor del aprendizaje motor corresponde?","opciones":["Práctica aleatoria","Feedback simultáneo","Entrenamiento todo vs parte","Transferencia"],"correcta":2,"explicacion":"El entrenamiento todo vs parte divide la actividad en pasos intermedios que el paciente domina antes de aprender la actividad completa; el temario pone el ejemplo de las fases de la marcha (Bobath).","por_opcion":["❌ La práctica aleatoria mezcla varias tareas distintas.","❌ El feedback simultáneo son correcciones durante la tarea.","✅ Es el ejemplo del temario de entrenamiento por partes.","❌ La transferencia es trasladar lo aprendido a otra actividad o entorno."]},{"pregunta":"Según el temario, ¿de qué depende fundamentalmente la cantidad de transferencia del aprendizaje?","opciones":["De la cantidad de feedback extrínseco recibido","Del tiempo total empleado en la práctica","Del tipo de instrucciones verbales empleadas","De la similitud entre las actividades o entornos"],"correcta":3,"explicacion":"La investigación muestra que la cantidad de transferencia depende de la similitud entre dos actividades o dos entornos, por lo que las tareas en la sala deben parecerse al entorno habitual.","por_opcion":["❌ El exceso de feedback genera dependencia, no transferencia.","❌ El tiempo total se asocia a participación activa y motivación.","❌ Las instrucciones influyen en el AM, pero no determinan la transferencia.","✅ Similitud entre actividades o entornos."]},{"pregunta":"Paciente con hemiplejía a las 2 semanas de un ictus. Según el temario, ¿qué abordaje del miembro superior es más adecuado en esta fase?","opciones":["Intervención centrada solo en las deficiencias, sin práctica de tareas","Terapia por restricción del lado sano, para forzar el uso del afectado","Práctica masiva de 60 minutos en un día con el lado afectado","Entrenamiento bilateral, para generar redes de reorganización cortical"],"correcta":3,"explicacion":"El temario propone el tratamiento bilateral en etapas precoces tras el ictus para generar nuevas redes de reorganización del córtex, y la TRMLS en fases más crónicas. En fase temprana la práctica debe ser distribuida.","por_opcion":["❌ La función mejora con la práctica de la tarea en sí, no solo tratando deficiencias.","❌ La TRMLS se reserva para fases más crónicas.","❌ La práctica masiva se recomienda en etapa posterior, no temprana.","✅ Bilateral en fase precoz."]},{"pregunta":"Un paciente debe estabilizar el tronco antes de alcanzar un objeto en una estantería. ¿Qué tipo de equilibrio predomina en esa preparación?","opciones":["Equilibrio estático","Estabilidad por reacciones de enderezamiento","Equilibrio proactivo o anticipatorio","Equilibrio reactivo"],"correcta":2,"explicacion":"El equilibrio proactivo o anticipatorio es la habilidad de anticiparse y estabilizarse antes de un movimiento voluntario; el temario destaca su importancia en las actividades de alcance del MS.","por_opcion":["❌ El estático mantiene una posición estable, sin anticipar un movimiento.","❌ La estabilidad es volver al estado general tras ser apartado del equilibrio.","✅ Anticipación postural previa al alcance.","❌ El reactivo responde a una perturbación externa inesperada."]},{"pregunta":"Ante un empujón posterior moderado en bipedestación, ¿qué estrategia postural actúa primero y con qué patrón de activación?","opciones":["Estrategia de cadera, con activación de proximal a distal","Estrategia de tobillo, con activación de distal a proximal","Estrategia de cadera, con activación de distal a proximal","Estrategia de tobillo, con activación de proximal a distal"],"correcta":1,"explicacion":"La estrategia de tobillo es la primera que actúa y su activación es de distal a proximal; si la fuerza externa es más intensa entra la estrategia de cadera, con activación de proximal a distal.","por_opcion":["❌ La de cadera solo entra si la fuerza es más intensa.","✅ Tobillo primero, distal → proximal.","❌ La de cadera activa de proximal a distal y no es la primera.","❌ La estrategia es correcta, pero su activación es distal → proximal."]},{"pregunta":"¿Qué valores de límites de estabilidad recoge el temario?","opciones":["8º frontal a cada lado y 4,5º posterior","4,5º frontal a cada lado y 8º posterior","8º frontal a cada lado y 8º posterior","12º anterior y 4,5º frontal a cada lado"],"correcta":0,"explicacion":"Los límites de estabilidad cuantificados son 8º en el plano frontal a izquierda y derecha y 4,5º hacia posterior; disminuyen en condiciones patológicas.","por_opcion":["✅ 8º frontal (LI y LD) y 4,5º posterior.","❌ Invierte los valores frontal y posterior.","❌ El límite posterior es menor: 4,5º.","❌ El temario no da un límite anterior de 12º."]},{"pregunta":"Al valorar el equilibrio de un paciente neurológico, ¿qué orden propone el temario?","opciones":["Primero la escala de Tinetti y después el resto de escalas","Primero estrategias posturales, después barreras neuromusculares","Primero contracturas y alineación, después paresia y espasticidad","Primero paresia, espasticidad y coordinación, después contracturas y alineación"],"correcta":3,"explicacion":"Primero hay que evaluar las barreras neuromusculares primarias (paresia, espasticidad, coordinación) y después las secundarias musculoesqueléticas (contracturas, alineación); luego identificar el equilibrio más alterado y las estrategias que usa.","por_opcion":["❌ El temario no prioriza Tinetti; destaca CTSIB, DGI y alcances.","❌ Las estrategias se identifican después de evaluar las barreras.","❌ Invierte el orden: las musculoesqueléticas son secundarias.","✅ Primarias neuromusculares → secundarias musculoesqueléticas."]},{"pregunta":"¿Por qué se producen la mayoría de las caídas en el paciente neurológico según el temario?","opciones":["Porque al hacer otra tarea, la atención prevalece sobre el equilibrio","Porque la estrategia de cadera se activa antes que la de tobillo","Porque la práctica distribuida reduce la automatización de la marcha","Porque la marcha es automática y se pierde con la lesión cortical"],"correcta":0,"explicacion":"Equilibrio y marcha requieren atención; la mayoría de caídas ocurren mientras el paciente hace otra tarea, porque ambas compiten por los recursos atencionales y el componente de atención prevalece sobre el de equilibrio.","por_opcion":["✅ Competencia por recursos atencionales en doble tarea.","❌ El temario no atribuye las caídas a una inversión del orden de las estrategias.","❌ La práctica distribuida se recomienda en estas patologías; no causa caídas.","❌ La investigación actual demuestra que la marcha no es puramente automática: requiere atención."]}],"asignatura":"Fisioterapia neurológica","tema":10,"fecha":"2026-11-12"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
