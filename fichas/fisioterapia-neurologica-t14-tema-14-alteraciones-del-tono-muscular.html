<!DOCTYPE html>
<html lang="es">
<head>

<title>Tema 14. Alteraciones del tono muscular · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 14. Alteraciones del tono muscular","subtitulo":"Qué altera el tono según la lesión, cómo se distingue y se mide en la camilla y qué tratamientos sostiene la evidencia.","resumen":["Un tono normal debe ser **suficientemente alto para moverse contra la gravedad, suficientemente bajo para no interferir y adaptable** a la posición (el de bipedestación no es el de decúbito).","La lesión localiza el cuadro: **neurona inferior** = hipotonía, arreflexia y fasciculaciones homolaterales; **neurona superior** = espasticidad, Babinski y reflejos exaltados contralaterales; **ganglios basales** = rigidez bilateral; **cerebelo** = ataxia e hipotonía homolaterales.","**La velocidad es la prueba**: la espasticidad es velocidad-dependiente (signo de la navaja), la rigidez resiste igual en todo el arco y a cualquier velocidad (tubo de plomo o rueda dentada), y la retracción fija no cambia con la velocidad.","La **neuroplasticidad** (habituación, aprendizaje y reorganización tras la lesión) se mantiene toda la vida y **la función practicada determina la reorganización**, también cuando se practica una compensación.","El tono se mide con **Ashworth modificada** (0–4, incluido 1+) y **Tardieu**, pero se trata solo si limita una función: **bajar el tono es la ventana** (punción, ondas, toxina, EENM) y dentro hay que **entrenar** (ejercicio con evidencia sólida, estirar aislado no sirve)."],"objetivos":["Localizar una lesión a partir de los signos de neurona inferior, neurona superior, ganglios basales y cerebelo.","Distinguir en la camilla espasticidad, rigidez, hipotonía y retracción fija usando la velocidad de movilización.","Explicar el mecanismo de control postural (Bobath), la inervación recíproca y la actividad refleja anormal.","Describir las modalidades de neuroplasticidad y sus consecuencias para la reeducación.","Valorar el tono con Ashworth modificada y Tardieu, y elegir un abordaje basado en la evidencia y en la función."],"ideas_clave":["Tono normal: **alto** para vencer la gravedad, **bajo** para no estorbar y **adaptable** a la posición.","Hipertonías: **espasticidad y rigidez**; hipotonías: **flaccidez y atrofia**.","Espasticidad **velocidad-dependiente**, signo de la navaja, **flexora en el brazo y extensora en la pierna**; rigidez constante (**tubo de plomo / rueda dentada**), propia de **ganglios basales**.","Lateralidad: neurona inferior **homolateral**, neurona superior **contralateral**, ganglios basales **bilateral**, cerebelo **homolateral**.","Inervación recíproca: excitación del agonista e **inhibición simultánea graduada** del antagonista; si se pierde la graduación → **cocontracción y patrones globales**.","Neuroplasticidad: habituación (corto plazo), aprendizaje (largo plazo) y reorganización tras la lesión; **la función practicada determina la reorganización**.","**Ashworth modificada** (Bohannon y Smith, 1987) no separa lo neural de la retracción; **Tardieu** sí (ángulo a velocidad lenta y rápida).","Regla de oro: **abrir la ventana y entrenar dentro**; no toda hipertonía se trata."],"secciones":[{"id":"tono-normal","titulo":"1. Qué es un tono normal y el movimiento normal","bloques":[{"tipo":"definicion","termino":"Tono normal","texto":"Tono **suficientemente alto para moverse contra la gravedad**, **suficientemente bajo para no interferir** con el movimiento y **adaptable**: cambia con la posición del cuerpo (en bipedestación no es el mismo que en decúbito)."},{"tipo":"definicion","termino":"Movimiento normal","texto":"**Integración entre la información sensorial que llega al sistema nervioso y la orden motora que sale.** Es propio de cada persona (depende de la edad, el sexo, la altura y las proporciones) y tiene una finalidad: es **específico, económico y adaptado**, y puede ser **automático, voluntario o automatizado**."},{"tipo":"alerta","texto":"**Sin información somatosensitiva no hay tono postural normal ni movimiento normal.** Un paciente con buena fuerza pero sin sensibilidad no tendrá un tono adaptable: la sensibilidad es la primera pieza del control postural."},{"tipo":"tabla","titulo":"Mecanismo de control postural (concepto Bobath)","columnas":["Componente","Para qué sirve"],"filas":[["1. La sensibilidad","Sin ella el sistema no sabe dónde está el cuerpo ni cuánta fuerza hace falta"],["2. El tono postural","Lo mantiene en el rango que permite moverse sin bloquear el movimiento"],["3. La inervación recíproca","Gradúa la relación entre agonistas y antagonistas en cada instante"],["4. Coordinación y equilibrio","Ordena en tiempo y espacio y ajusta la respuesta a los cambios de peso"]]},{"tipo":"parrafo","texto":"El mecanismo de control postural actúa de forma **automática e inconsciente** y se instala durante el **desarrollo neuromotor**. Por eso, cuando una lesión lo altera, el paciente no puede corregir su tono \"pensando\" en él: hay que reeducar la entrada sensorial, la graduación agonista-antagonista y el equilibrio en tareas reales."},{"tipo":"tarjetas","items":[{"etiqueta":"Hipertonías","titulo":"Espasticidad y rigidez","texto":"Tono por encima del necesario: bloquea el movimiento y favorece patrones globales."},{"etiqueta":"Hipotonías","titulo":"Flaccidez y atrofia","texto":"Tono insuficiente: cuesta sostener el segmento contra la gravedad."}]},{"tipo":"perla","texto":"**Cuál incapacita más depende de la función que se quiera recuperar, no de la escala.** Antes de pensar en el número de Ashworth, pregúntate qué tarea concreta limita ese tono (andar, vestirse, la higiene de la palma)."}]},{"id":"localizacion","titulo":"2. Signos según la localización de la lesión","bloques":[{"tipo":"tabla","titulo":"Signos de localización (Bisbe, 2016)","columnas":["Lesión","Signos","Lado"],"filas":[["Neurona inferior","Parálisis flácida, amiotrofia, fasciculaciones, hipo o arreflexia e **hipotonía**","**Homolateral** a la lesión"],["Neurona superior","Debilidad motora, amiotrofia, **reflejos exaltados**, cutáneos abolidos, **Babinski** y **espasticidad**","**Contralateral**"],["Ganglios basales","Hipocinesia o hipercinesia, movimientos involuntarios anormales, reflejos posturales alterados y **rigidez**","**Bilateral**"],["Cerebelo","**Ataxia**, alteración del equilibrio y de la marcha, dismetría, disartria, **temblor de intención** e **hipotonía**","**Homolateral**"]]},{"tipo":"esquema","titulo":"Del signo de tono a la localización","mermaid":"flowchart TD\n  T[\"Tono alterado\"] --> H[\"Hipertonía\"]\n  T --> Ho[\"Hipotonía\"]\n  H --> E[\"Espasticidad\"]\n  H --> R[\"Rigidez\"]\n  E --> NS[\"Neurona superior, contralateral\"]\n  R --> GB[\"Ganglios basales, bilateral\"]\n  Ho --> NI[\"Neurona inferior, homolateral\"]\n  Ho --> CB[\"Cerebelo, homolateral\"]\n  NI --> NI2[\"Arreflexia y fasciculaciones\"]\n  CB --> CB2[\"Ataxia y temblor de intención\"]","pie":"La hipotonía aparece en dos localizaciones: distínguelas por los signos acompañantes."},{"tipo":"alerta","texto":"La **hipotonía** no localiza sola: aparece tanto en la **neurona inferior** como en el **cerebelo**, ambos **homolaterales**. Lo que las separa son los signos acompañantes: fasciculaciones y arreflexia en la neurona inferior; ataxia, dismetría y temblor de intención en el cerebelo."},{"tipo":"parrafo","texto":"**El tono es una pieza del cuadro, no el cuadro entero.** La **rigidez bilateral** y la **ataxia cerebelosa homolateral** son dos pistas que localizan solas; los demás signos (reflejos, Babinski, fasciculaciones) completan el diagnóstico de localización."}]},{"id":"camilla","titulo":"3. Hipertonía e hipotonía: cómo se distinguen en la camilla","bloques":[{"tipo":"tabla","titulo":"Espasticidad, rigidez e hipotonía","columnas":["","Espasticidad","Rigidez","Hipotonía"],"filas":[["Resistencia","**Velocidad-dependiente**: cuanto más rápido, más resiste","**Constante** en todo el arco y a cualquier velocidad","Disminuida"],["Signo típico","Cede de golpe: **signo de la navaja**","**Tubo de plomo** o **rueda dentada**","Articulaciones laxas, dificultad para sostener el segmento contra la gravedad"],["Patrón","**Flexora en el brazo, extensora en la pierna**","—","—"],["Lesión","Neurona superior","**Ganglios basales**","Neurona inferior y cerebelo"]]},{"tipo":"dato","valor":"Lento vs rápido","texto":"**La velocidad es la prueba**: movilizar lento y rápido separa la **espasticidad** (cambia con la velocidad) de la **rigidez** y de la **retracción fija** (no cambian)."},{"tipo":"alerta","texto":"Trampa: \"resiste igual a cualquier velocidad\" **no** es espasticidad, es **rigidez** (o retracción). Y el signo de la navaja (resistencia que cede de golpe) es de la **espasticidad**, no de la rigidez en rueda dentada."},{"tipo":"tabla","titulo":"Consecuencias de un tono alterado","columnas":["En la movilidad (lo que se pierde al moverse)","En la postura (lo que se instala si nadie lo evita)"],"filas":[["Menos movimiento, debilidad o parálisis","Hemipléjico: carga el peso en el lado sano"],["Patrones globales y sincinesias tras el ictus","Parkinson: actitud flexionada hacia delante"],["No disocia movimientos selectivos","Marcha en abducción del lado afecto"],["Coordinación alterada en tiempo y espacio","Fallan equilibrio y enderezamiento"]]},{"tipo":"perla","texto":"**El paciente no elige la postura: es la única que le permite sostenerse con el tono que tiene.** Corregirla \"a la fuerza\" sin darle otra forma de sostenerse no funciona; hay que cambiar el tono y la estrategia a la vez."}]},{"id":"reflejos","titulo":"4. Inervación recíproca y actividad refleja anormal","bloques":[{"tipo":"definicion","termino":"Inervación recíproca","texto":"**Excitación de un grupo muscular e inhibición simultánea de sus antagonistas, graduada en cada instante.** Sirve **para moverse** (músculos de acciones opuestas trabajan ordenados en el movimiento voluntario) y **para fijar** (contracción simultánea que estabiliza una articulación para que se mueva otra)."},{"tipo":"alerta","texto":"La cocontracción no es siempre patológica: **fijar** una articulación para mover otra es una función normal de la inervación recíproca. Lo patológico es **perder la graduación**: aparecen la **cocontracción** y los **patrones globales**."},{"tipo":"tarjetas","items":[{"etiqueta":"Reflejo","titulo":"Tónico asimétrico","texto":"Girar la cabeza **extiende el hemicuerpo de la cara** y **flexiona el contrario**."},{"etiqueta":"Reflejo","titulo":"Tónico simétrico","texto":"Flexionar o extender el cuello cambia el tono de **los cuatro miembros**."},{"etiqueta":"Reflejo","titulo":"Tónico laberíntico","texto":"La posición de la cabeza en el espacio cambia el tono: **extensor en supino, flexor en prono**."},{"etiqueta":"Anormal","titulo":"Reacciones asociadas","texto":"El esfuerzo en un segmento sube el tono en otro; aparecen al **forzar la marcha o el agarre**."},{"etiqueta":"Anormal","titulo":"Clonus","texto":"Respuesta **repetitiva al estiramiento rápido**; muy visible en el **tríceps sural**."},{"etiqueta":"Consecuencia","titulo":"Patrones instalados","texto":"Los patrones anormales, si se repiten, **se instalan y condicionan la función**."}]},{"tipo":"perla","texto":"**Un reflejo primitivo en un adulto cambia el tono en cada giro de cabeza.** Al colocar al paciente en la cama o la silla, controla la orientación de la cabeza (tónico asimétrico) y la posición supino/prono (tónico laberíntico) para no disparar patrones."},{"tipo":"tabla","titulo":"Prevención: por qué importa cómo se coloca","columnas":["Principio","Explicación"],"filas":[["La postura enseña","Las posiciones en las que se coloca previenen o instalan patrones anormales"],["El tiempo cuenta","Pasa muchas más horas colocado que en tratamiento: **la cama también es terapia**"],["El equilibrio","Si el tono no se adapta al peso, fallan equilibrio y enderezamiento"],["La coordinación","Exige orden temporal y espacial; el tono alterado lo desordena"]]}]},{"id":"neuroplasticidad","titulo":"5. Neuroplasticidad y qué significa reeducar","bloques":[{"tipo":"definicion","termino":"Neuroplasticidad","texto":"Capacidad de **crear caminos nuevos de comunicación o reorganizar los que ya existen**. Se mantiene **toda la vida**."},{"tipo":"tabla","titulo":"Las tres modalidades","columnas":["Modalidad","Descripción"],"filas":[["1. Habituación","Cambio **a corto plazo**. Sherrington: si el estímulo doloroso se mantiene, la respuesta disminuye, y al cesar se restablece"],["2. Aprendizaje","Cambios **a largo plazo** en las sinapsis implicadas: modificación estable de las redes neuronales"],["3. Tras la lesión","Reorganización a partir de las **neuronas indemnes**, con formación de dendritas y axones para nuevas sinapsis"]]},{"tipo":"esquema","titulo":"Mecanismos de reorganización tras la lesión","mermaid":"flowchart TD\n  L[\"Lesión cerebral\"] --> C[\"Cerca de la lesión\"]\n  L --> F[\"Lejos de la lesión\"]\n  C --> C1[\"Expansión del mapa\"]\n  C --> C2[\"Mascarada compensatoria\"]\n  F --> F1[\"Región homóloga contralateral\"]\n  F --> F2[\"Reasignación cruzada\"]\n  C1 --> P[\"Fase precoz muy rentable\"]\n  C2 --> P","pie":"Los dos mecanismos cercanos ocurren en el tejido vecino: por eso la fase precoz es tan rentable."},{"tipo":"tabla","titulo":"Reorganización cerca y lejos de la lesión","columnas":["Mecanismo","Qué ocurre"],"filas":[["Expansión del mapa","Las células sanas que rodean la zona lesionada **cambian su función** y asumen lo que resolvían las neuronas dañadas"],["Mascarada compensatoria","**Caminos sinápticos recién creados** que colindan con el área dañada responden a demandas de otra área"],["Región homóloga","Un área cerebral **no colindante** asume las funciones de otra distante, habitualmente la **homóloga contralateral**"],["Reasignación cruzada","Una **entrada sensorial reemplaza a otra** lesionada; ejemplo clásico: la **lectura en braille del ciego**"]]},{"tipo":"alerta","texto":"No confundas **mascarada compensatoria** (caminos nuevos junto a la lesión) con **reasignación cruzada** (una modalidad sensorial sustituye a otra, como el braille) ni con **región homóloga** (área lejana, contralateral)."},{"tipo":"parrafo","texto":"**Reeducar = remodelar las vías de transmisión de la información y facilitar los patrones motores normales**: eliminar conexiones viejas y posibilitar otras nuevas. Dos consecuencias: **la función practicada determina la reorganización** (practicar una compensación también deja huella) y, **sin sensibilidad**, si la información perceptiva no llega, la reorganización se hace a ciegas, así que hay que trabajar la entrada. Por eso el tratamiento del tono **no puede consistir en estirar y marcharse**."}]},{"id":"valoracion","titulo":"6. Valoración del tono","bloques":[{"tipo":"tabla","titulo":"Escala de Ashworth modificada (Bohannon y Smith, 1987): resistencia al movimiento pasivo","columnas":["Grado","Descripción"],"filas":[["0","Tono normal: no hay aumento de la resistencia al movimiento pasivo"],["1","Ligero aumento con **mínima resistencia al final** del arco de movimiento"],["1+","Ligero aumento con resistencia en **menos de la mitad** del arco"],["2","Aumento marcado en **casi todo el arco**; el segmento **se moviliza con facilidad**"],["3","Aumento importante de la resistencia: el movimiento pasivo **es difícil**"],["4","El segmento permanece **rígido** en flexión o en extensión: **no se moviliza**"]]},{"tipo":"dato","valor":"0 · 1 · 1+ · 2 · 3 · 4","texto":"La Ashworth **modificada** tiene **6 grados** porque añade el **1+** (resistencia en menos de la mitad del arco) entre el 1 y el 2."},{"tipo":"alerta","texto":"La Ashworth **mezcla el componente neural con la rigidez del tejido**: **no separa espasticidad de retracción**. Para separar lo neural se usa **Tardieu**, que compara el ángulo de resistencia a velocidad lenta y rápida."},{"tipo":"tabla","titulo":"Qué medir además del tono","columnas":["Medida","Cómo"],"filas":[["Tardieu","Compara el ángulo de resistencia a **velocidad lenta y rápida**: separa lo neural"],["Recorrido articular","Goniometría en el **mismo punto y a la misma hora**, siempre igual"],["Espasmos y dolor","Espasmos al día, **escala de Penn** y escala numérica de dolor"],["Función","Velocidad de marcha, tiempo de vestido, higiene de la palma, ortesis"]]},{"tipo":"perla","texto":"**Si el tratamiento no cambia ninguna de estas medidas, no ha funcionado.** Mide siempre algo funcional (velocidad de marcha, tiempo de vestido) antes y después, no solo el grado de Ashworth."}]},{"id":"abordaje","titulo":"7. Abordaje y evidencia","bloques":[{"tipo":"esquema","titulo":"Antes de tratar: tres preguntas","mermaid":"flowchart TD\n  A[\"Paciente con hipertonía\"] --> Q1{\"¿Molesta o ayuda?\"}\n  Q1 -->|\"Le permite estar de pie o transferirse\"| N[\"No bajarla, decidir con el paciente\"]\n  Q1 -->|\"Limita una función\"| Q2{\"¿Qué la está subiendo?\"}\n  Q2 -->|\"Dolor, úlcera, uña, sonda, estreñimiento, ropa\"| D[\"Quitar el desencadenante\"]\n  Q2 --> Q3{\"¿Qué quiero conseguir?\"}\n  D --> Q3\n  Q3 --> O[\"El objetivo elige técnica y medida\"]","pie":"No toda hipertonía se trata: hay pacientes que se sostienen de pie gracias a ella."},{"tipo":"tabla","titulo":"Qué dice la evidencia","columnas":["Intervención","Nivel de evidencia","Efecto"],"filas":[["Estirar (aislado)","**Sólida en contra** como tratamiento aislado","No cambia arco, dolor ni tono"],["Ejercicio","**Sólida a favor**","Mejora fuerza y función; **no aumenta la espasticidad**"],["EENM y FES","Moderada","Baja el tono a corto plazo y mejora el pie equino en la marcha"],["Ondas de choque","Moderada-baja","Reduce el Ashworth de **4 a 12 semanas**; parámetros muy dispares"],["Punción seca","Limitada","Efecto inmediato sobre tono, arco y dolor; sin datos a medio plazo"],["Toxina botulínica","**Sólida en espasticidad focal**","Dura **3–4 meses**; sin fisioterapia después no da función"],["Baclofeno","—","Oral con **sedación frecuente**; **intratecal** en espasticidad generalizada grave"]]},{"tipo":"dato","valor":"3–4 meses","texto":"Duración del efecto de la **toxina botulínica** en la espasticidad focal; el efecto de las **ondas de choque** sobre el Ashworth se describe de **4 a 12 semanas**."},{"tipo":"definicion","termino":"Regla de oro: abrir la ventana y entrenar dentro","texto":"**Bajar el tono no es el tratamiento: es la ventana en la que se puede entrenar la función.** Punción, ondas, toxina o electroestimulación bajan el tono un rato; sin trabajo activo dentro de la ventana, el tono vuelve y la función no cambia. **La relajación es la preparación para poder entrenar.**"},{"tipo":"tabla","titulo":"Qué hacemos en la práctica (el orden importa)","columnas":["Paso","Contenido"],"filas":[["1. Movilizar","Pasivas **suaves y de amplitud creciente**, **sin estiramiento rápido**"],["2. Colocar","Posicionamiento y **ortesis** para mantener longitud y prevenir la retracción"],["3. Activar","Trabajo activo del **antagonista** y entrenamiento **orientado a la tarea**"],["4. Modular","Hidroterapia, trabajo respiratorio y relajación como preparación"]]},{"tipo":"tabla","titulo":"Lo que se sostiene y lo que no","columnas":["Se sostiene","No se sostiene"],"filas":[["Trabajar la función, no el Ashworth","Estirar y esperar cambios duraderos"],["Quitar antes los desencadenantes","No fortalecer por miedo a la espasticidad"],["Combinar toxina con entrenamiento","Bajar la hipertonía que usa para estar de pie"],["Medir con objetivos y volver a medir","Infiltrar sobre una retracción fija"]]},{"tipo":"alerta","texto":"**Los cinco fallos que se repiten**: 1) tratar el Ashworth y no la función perdida; 2) estirar como tratamiento único; 3) no buscar el desencadenante (dolor, sonda, estreñimiento, ropa apretada); 4) evitar la fuerza por miedo a aumentar la espasticidad; 5) confundir una retracción fija con espasticidad y tratarla como neural."},{"tipo":"perla","texto":"**Ninguna de estas opciones (punción, toxina, fármacos) cambia la función por sí sola.** La pregunta no es qué técnica es mejor, sino qué problema tiene este paciente y qué se va a medir."}]}],"caso_clinico":{"titulo":"Hemiparesia tras ictus con pie equino","presentacion":"Mujer de 64 años, 5 meses tras un **ictus** de la arteria cerebral media izquierda. Hemiparesia **derecha**, Babinski derecho, Ashworth **2** en tríceps sural y flexores de codo, clonus aquilíneo. Camina despacio con pie equino y tarda mucho en vestirse. Lleva semanas con estiramientos pasivos diarios sin cambios. Comenta que la pierna \"se pone más dura\" desde que tiene estreñimiento y cuando lleva pantalones ajustados.","preguntas":[{"pregunta":"¿Cómo encaja la localización con los signos y cómo confirmarías que la resistencia es espasticidad y no retracción?","respuesta":"Lesión de **neurona superior** izquierda → signos **contralaterales** (derechos): espasticidad, Babinski, reflejos exaltados y clonus. Para separar lo neural de la retracción se moviliza **lento y rápido** (Tardieu): si la resistencia aumenta con la velocidad es espasticidad; la Ashworth sola no lo distingue."},{"pregunta":"¿Qué harías antes de cualquier técnica para bajar el tono?","respuesta":"Las tres preguntas: ¿molesta o ayuda? (si el extensor le sostiene en bipedestación, no eliminarlo); **¿qué la está subiendo?** (estreñimiento y ropa apretada: resolverlos); ¿qué quiero conseguir? (velocidad de marcha y tiempo de vestido como medidas)."},{"pregunta":"¿Qué plan sostiene la evidencia?","respuesta":"Dejar el **estiramiento aislado** (evidencia sólida en contra). Abrir la ventana, por ejemplo con **toxina botulínica** focal en el tríceps sural (3–4 meses) o **FES** para el pie equino, y **entrenar dentro**: fuerza y trabajo del antagonista (tibial anterior), marcha orientada a la tarea, posicionamiento y ortesis; volver a medir la función."}]},"preguntate":[{"pregunta":"¿Qué tres condiciones debe cumplir un tono normal?","respuesta":"Ser suficientemente alto para moverse contra la gravedad, suficientemente bajo para no interferir y adaptable a la posición del cuerpo."},{"pregunta":"Compara la lateralidad de los signos en lesiones de neurona inferior, neurona superior, ganglios basales y cerebelo.","respuesta":"Neurona inferior: homolateral. Neurona superior: contralateral. Ganglios basales: bilateral. Cerebelo: homolateral."},{"pregunta":"¿Cómo distingues en la camilla espasticidad de rigidez?","respuesta":"Por la velocidad: la espasticidad aumenta con la velocidad y cede de golpe (navaja); la rigidez es constante en todo el arco y a cualquier velocidad (tubo de plomo o rueda dentada)."},{"pregunta":"Enumera los cuatro componentes del mecanismo de control postural según Bobath.","respuesta":"Sensibilidad, tono postural, inervación recíproca, y coordinación y equilibrio. Actúa de forma automática e inconsciente y se instala durante el desarrollo neuromotor."},{"pregunta":"Describe el reflejo tónico asimétrico y el tónico laberíntico.","respuesta":"Tónico asimétrico: girar la cabeza extiende el hemicuerpo de la cara y flexiona el contrario. Tónico laberíntico: tono extensor en supino y flexor en prono."},{"pregunta":"¿Qué ocurre cuando se pierde la graduación de la inervación recíproca?","respuesta":"Aparecen la cocontracción y los patrones globales, y el paciente no disocia movimientos selectivos."},{"pregunta":"Explica la diferencia entre expansión del mapa, región homóloga y reasignación cruzada.","respuesta":"Expansión del mapa: células sanas vecinas asumen la función perdida. Región homóloga: un área lejana, habitualmente la contralateral, la asume. Reasignación cruzada: una entrada sensorial reemplaza a otra (braille del ciego)."},{"pregunta":"¿Por qué la Ashworth modificada no basta para decidir un tratamiento neural?","respuesta":"Porque mezcla el componente neural con la rigidez del tejido y no separa espasticidad de retracción; para eso se usa Tardieu (velocidad lenta frente a rápida)."},{"pregunta":"¿Qué significa «abrir la ventana y entrenar dentro»?","respuesta":"Que las técnicas que bajan el tono (punción, ondas, toxina, EENM) solo crean un periodo en el que entrenar la función; sin trabajo activo, el tono vuelve y la función no cambia."},{"pregunta":"Nombra tres desencadenantes que pueden subir el tono y que se resuelven sin tocar el músculo.","respuesta":"Dolor, úlcera, uña encarnada, sonda obstruida, estreñimiento o ropa apretada."}],"glosario":[{"termino":"Espasticidad","definicion":"Hipertonía velocidad-dependiente con signo de la navaja, propia de la neurona superior; flexora en el brazo y extensora en la pierna."},{"termino":"Rigidez","definicion":"Resistencia constante en todo el arco y a cualquier velocidad (tubo de plomo o rueda dentada), propia de los ganglios basales."},{"termino":"Hipotonía","definicion":"Resistencia disminuida con articulaciones laxas y dificultad para sostener el segmento; neurona inferior y cerebelo."},{"termino":"Signo de la navaja","definicion":"Resistencia que aumenta con la velocidad y cede de golpe, típica de la espasticidad."},{"termino":"Inervación recíproca","definicion":"Excitación de un grupo muscular con inhibición simultánea y graduada de sus antagonistas."},{"termino":"Reacciones asociadas","definicion":"Aumento del tono en un segmento por el esfuerzo realizado con otro, por ejemplo al forzar la marcha o el agarre."},{"termino":"Clonus","definicion":"Respuesta repetitiva al estiramiento rápido, muy visible en el tríceps sural."},{"termino":"Neuroplasticidad","definicion":"Capacidad de crear caminos nuevos de comunicación o reorganizar los existentes; se mantiene toda la vida."},{"termino":"Reasignación cruzada","definicion":"Sustitución de una entrada sensorial lesionada por otra (braille del ciego)."},{"termino":"Ashworth modificada","definicion":"Escala de 0 a 4 con grado 1+ (Bohannon y Smith, 1987) que mide la resistencia al movimiento pasivo."},{"termino":"Tardieu","definicion":"Valoración que compara el ángulo de resistencia a velocidad lenta y rápida para separar lo neural."},{"termino":"EENM / FES","definicion":"Electroestimulación neuromuscular / estimulación eléctrica funcional."},{"termino":"Retracción fija","definicion":"Acortamiento del tejido que no cambia con la velocidad de movilización y no debe tratarse como neural."}],"fuentes":["Bisbe M, Santoyo C, Segarra VT. Fisioterapia en neurología. Editorial Médica Panamericana (2016), pág. 58.","Paeth Rohlfs B. Experiencias con el concepto Bobath. Editorial Médica Panamericana. Control postural y tono.","Katalinic OM, Harvey LA, Herbert RD y cols. Stretch for the treatment of contracture. Cochrane Database, revisión.","Bohannon y Smith (1987). Escala de Ashworth modificada."],"qcm":[{"pregunta":"Un paciente presenta parálisis flácida, fasciculaciones y arreflexia en la pierna derecha. ¿Dónde está la lesión más probable?","opciones":["Neurona superior izquierda","Neurona inferior derecha","Ganglios basales de ambos lados","Hemisferio cerebeloso izquierdo"],"correcta":1,"explicacion":"Parálisis flácida, amiotrofia, fasciculaciones, arreflexia e hipotonía son signos de neurona inferior, que se manifiestan en el mismo lado de la lesión.","por_opcion":["❌ La neurona superior produce espasticidad y reflejos exaltados, no fasciculaciones ni arreflexia.","✅ Signos de neurona inferior, homolaterales a la lesión.","❌ Los ganglios basales dan rigidez bilateral y movimientos involuntarios.","❌ El cerebelo da ataxia y temblor de intención, homolaterales; un hemisferio izquierdo afectaría al lado izquierdo."]},{"pregunta":"Al movilizar el codo, la resistencia es la misma lento o rápido y en todo el arco, con sensación de rueda dentada. ¿Qué indica?","opciones":["Rigidez por lesión de ganglios basales","Clonus por estiramiento rápido","Espasticidad por lesión de neurona superior","Hipotonía cerebelosa homolateral"],"correcta":0,"explicacion":"La rigidez ofrece resistencia constante en todo el arco y a cualquier velocidad, en tubo de plomo o rueda dentada, y es propia de la lesión de ganglios basales.","por_opcion":["✅ Resistencia constante a cualquier velocidad: rigidez de ganglios basales.","❌ El clonus es una respuesta repetitiva al estiramiento rápido, no una resistencia constante.","❌ La espasticidad depende de la velocidad y cede de golpe (navaja).","❌ La hipotonía es una resistencia disminuida, no aumentada."]},{"pregunta":"¿Qué combinación de signos es propia de la lesión cerebelosa según Bisbe?","opciones":["Babinski, espasticidad y afectación contralateral","Ataxia, Babinski e hipertonía contralaterales","Rigidez, hipocinesia y afectación bilateral","Ataxia, temblor de intención e hipotonía homolaterales"],"correcta":3,"explicacion":"El cerebelo produce ataxia, alteración del equilibrio y de la marcha, dismetría, disartria, temblor de intención e hipotonía, todo homolateral.","por_opcion":["❌ Es el cuadro de neurona superior.","❌ Mezcla signos de cerebelo y de neurona superior, y la lateralidad es incorrecta.","❌ Es el cuadro de los ganglios basales.","✅ Cuadro cerebeloso, homolateral."]},{"pregunta":"¿Cuál es el patrón espástico típico descrito en el temario?","opciones":["Flexor en el brazo y extensor en la pierna","Extensor en los cuatro miembros","Extensor en el brazo y flexor en la pierna","Flexor en los cuatro miembros"],"correcta":0,"explicacion":"La espasticidad es velocidad-dependiente, presenta el signo de la navaja y predomina en la musculatura flexora del brazo y extensora de la pierna.","por_opcion":["✅ Es el patrón descrito.","❌ No coincide con la distribución descrita.","❌ Es el patrón inverso.","❌ No es el patrón espástico descrito."]},{"pregunta":"Según la escala de Ashworth modificada, un ligero aumento del tono con resistencia en menos de la mitad del arco corresponde al grado:","opciones":["3","1+","2","1"],"correcta":1,"explicacion":"Grado 1: mínima resistencia al final del arco. Grado 1+: resistencia en menos de la mitad del arco. Grado 2: aumento marcado en casi todo el arco pero se moviliza con facilidad.","por_opcion":["❌ En el grado 3 el movimiento pasivo es difícil.","✅ Es la definición del 1+.","❌ El grado 2 es un aumento marcado en casi todo el arco.","❌ El grado 1 es una resistencia mínima solo al final del arco."]},{"pregunta":"¿Cuál es la principal limitación de la escala de Ashworth modificada según el temario?","opciones":["Requiere comparar dos velocidades","Solo puede aplicarse en miembros inferiores","No separa espasticidad de retracción","No tiene grados intermedios"],"correcta":2,"explicacion":"La Ashworth mezcla el componente neural con la rigidez del tejido, por lo que no separa la espasticidad de la retracción; Tardieu lo hace comparando dos velocidades.","por_opcion":["❌ Comparar dos velocidades es lo propio de **Tardieu**.","❌ El temario no la limita a los miembros inferiores.","✅ Mezcla lo neural con la rigidez del tejido.","❌ Incluye el grado intermedio 1+."]},{"pregunta":"En un paciente en supino con reflejo tónico laberíntico activo, ¿qué cambio de tono esperas?","opciones":["Extensión del hemicuerpo de la cara","Cambio en los cuatro miembros al flexionar el cuello","Aumento del tono extensor","Aumento del tono flexor"],"correcta":2,"explicacion":"En el tónico laberíntico la posición de la cabeza en el espacio cambia el tono: extensor en supino y flexor en prono.","por_opcion":["❌ Corresponde al **tónico asimétrico** al girar la cabeza.","❌ Corresponde al **tónico simétrico**.","✅ En supino predomina el tono extensor.","❌ El tono flexor predomina en **prono**."]},{"pregunta":"¿Qué describe mejor la función de «fijar» de la inervación recíproca?","opciones":["Inhibición total del antagonista durante el movimiento","Aumento del tono en un segmento por el esfuerzo de otro","Contracción simultánea que estabiliza una articulación para mover otra","Respuesta repetitiva tras un estiramiento rápido"],"correcta":2,"explicacion":"La inervación recíproca sirve para moverse (agonistas y antagonistas ordenados) y para fijar: una contracción simultánea que estabiliza una articulación para que se mueva otra.","por_opcion":["❌ La inhibición es graduada, no total, y eso es para moverse, no para fijar.","❌ Son las reacciones asociadas.","✅ Es la función de fijación.","❌ Es el clonus."]},{"pregunta":"Tras un ictus, un área no colindante del hemisferio contralateral asume la función perdida. ¿Qué mecanismo es?","opciones":["Mascarada compensatoria","Expansión del mapa","Reasignación cruzada","Región homóloga"],"correcta":3,"explicacion":"En la región homóloga, un área cerebral no colindante asume las funciones de otra distante, habitualmente la homóloga contralateral; es una reorganización lejos de la lesión.","por_opcion":["❌ La mascarada usa caminos nuevos **colindantes** con el área dañada.","❌ La expansión del mapa ocurre en las células sanas **vecinas**.","❌ La reasignación cruzada sustituye una **entrada sensorial** por otra.","✅ Área lejana, habitualmente la contralateral."]},{"pregunta":"Según Sherrington, si un estímulo doloroso se mantiene, la respuesta disminuye y se restablece al cesar. ¿Qué modalidad de neuroplasticidad es?","opciones":["Habituación","Reorganización tras la lesión","Reasignación cruzada","Aprendizaje"],"correcta":0,"explicacion":"La habituación es un cambio a corto plazo: la respuesta disminuye con el estímulo mantenido y se restablece al cesar. El aprendizaje implica cambios estables a largo plazo.","por_opcion":["✅ Cambio a corto plazo y reversible.","❌ La reorganización tras la lesión parte de neuronas indemnes con nuevas sinapsis.","❌ Es un mecanismo de sustitución sensorial.","❌ El aprendizaje produce cambios **estables a largo plazo**."]},{"pregunta":"¿Qué afirmación sobre el estiramiento en la espasticidad recoge la evidencia del temario?","opciones":["Evidencia sólida en contra como tratamiento aislado","Evidencia limitada sin datos a medio plazo","Evidencia moderada: mejora el pie equino","Evidencia sólida a favor en arco y dolor"],"correcta":0,"explicacion":"El estiramiento aislado tiene evidencia sólida en contra: no cambia el arco, el dolor ni el tono. El ejercicio, en cambio, tiene evidencia sólida a favor.","por_opcion":["✅ No cambia arco, dolor ni tono.","❌ Es la evidencia de la **punción seca**.","❌ La mejora del pie equino corresponde a **EENM y FES**.","❌ Es justo lo contrario."]},{"pregunta":"¿Qué intervención tiene evidencia sólida en espasticidad focal con efecto de tres o cuatro meses?","opciones":["Toxina botulínica","Ondas de choque","Baclofeno oral","Punción seca"],"correcta":0,"explicacion":"La toxina botulínica tiene evidencia sólida en espasticidad focal durante tres o cuatro meses, pero sin fisioterapia después no da función.","por_opcion":["✅ Evidencia sólida, 3–4 meses.","❌ Las ondas tienen evidencia moderada-baja y efecto de 4 a 12 semanas.","❌ El baclofeno oral produce sedación frecuente; el intratecal se reserva a espasticidad generalizada grave.","❌ La punción seca tiene evidencia limitada."]},{"pregunta":"Un paciente con hipertonía extensora de la pierna consigue estar de pie y transferirse gracias a ella. ¿Qué es lo correcto?","opciones":["Infiltrar punción seca para mejorar el arco","Decidir con el paciente si tratarla, porque ayuda a la función","Estirar a diario el cuádriceps","Bajarla con toxina para normalizar el Ashworth"],"correcta":1,"explicacion":"Antes de tratar hay que preguntarse si la hipertonía molesta o ayuda: si permite la bipedestación o la transferencia, bajarla puede empeorar la función y se decide con el paciente.","por_opcion":["❌ Bajar la hipertonía que usa para estar de pie «no se sostiene».","✅ No toda hipertonía se trata.","❌ El estiramiento aislado no tiene evidencia y aquí la hipertonía ayuda.","❌ Tratar el Ashworth y no la función es uno de los cinco fallos."]},{"pregunta":"¿Qué medida separa lo neural comparando el ángulo de resistencia a dos velocidades?","opciones":["Goniometría estandarizada","Ashworth modificada","Escala de Penn","Tardieu"],"correcta":3,"explicacion":"Tardieu compara el ángulo de resistencia a velocidad lenta y rápida y así separa el componente neural; la Ashworth no lo hace y la Penn mide espasmos.","por_opcion":["❌ La goniometría mide el recorrido articular.","❌ La Ashworth mezcla neural y tejido.","❌ La escala de Penn cuantifica los **espasmos**.","✅ Compara velocidad lenta y rápida."]},{"pregunta":"¿En qué orden recomienda el temario organizar la sesión para el tono?","opciones":["Relajar como tratamiento principal y medir el Ashworth","Estirar rápido, electroestimular y colocar","Entrenar la función, estirar y relajar al final","Quitar lo que sube el tono, modular y terminar entrenando la función"],"correcta":3,"explicacion":"El orden importa: quitar lo que sube el tono, modular (hidroterapia, respiración, relajación como preparación) y terminar entrenando la función; la relajación no es el tratamiento.","por_opcion":["❌ La relajación es solo preparación, y el objetivo es la función, no el Ashworth.","❌ Se moviliza sin estiramiento rápido.","❌ El entrenamiento debe ir dentro de la ventana, al final, y el estiramiento aislado no sirve.","✅ Es la secuencia del temario."]}],"asignatura":"Fisioterapia neurológica","tema":14,"fecha":"2026-11-12"}</script>

document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';

function bloque(b){

    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
