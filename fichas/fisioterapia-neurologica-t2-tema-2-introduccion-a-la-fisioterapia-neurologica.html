<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Tema 2. Introducción a la Fisioterapia Neurológica · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 2. Introducción a la Fisioterapia Neurológica","subtitulo":"Qué es la fisioterapia neurológica, qué objetivos persigue, qué técnicas utiliza, cómo se adapta el tratamiento al estado del paciente y qué consecuencias tiene lesionar cada estructura encefálica, con nociones básicas de exploración del trofismo y de los reflejos.","objetivos":["Al terminar, sabrás definir la fisioterapia neurológica, sus sinónimos y sus cuatro implicaciones: evaluación, tratamiento personalizado, plasticidad y trabajo interdisciplinar.","Al terminar, sabrás enumerar el papel del fisioterapeuta, los factores de los que depende el resultado y la regla de oro de la intervención.","Al terminar, sabrás relacionar cada técnica de tratamiento (FNP, Bobath, Perfetti, CIMT, etc.) con su descripción y sus aplicaciones según el temario.","Al terminar, sabrás asignar objetivos y tratamientos a cada uno de los cuatro estados funcionales del paciente: encamado, sedestación, deambulación y alta discapacidad.","Al terminar, sabrás reconocer la función y el cuadro lesional de cada estructura encefálica (Ratliffe) y los niveles segmentarios de los reflejos superficiales."],"ideas_clave":["La **fisioterapia neurológica** (también llamada **neurorrehabilitación** o **fisioterapia del sistema nervioso**) evalúa y trata disfunciones del **SNC o del SNP** para optimizar la función física, mejorar la calidad de vida y promover la independencia.","**Regla de oro:** *No matarás, ni agravarás el estado del paciente.*","El **máximo grado de funcionalidad** alcanzable depende del nivel y tipo de lesión (y de sus complicaciones), de la constitución física y psíquica, de la edad, de la colaboración del paciente y del ambiente sociofamiliar.","**CIMT:** aplicación descrita solo en el **ictus**. **Bobath:** ictus y **parálisis cerebral**. **Perfetti:** ictus y lesiones medulares. **FNP:** ictus, lesiones medulares y enfermedades neurodegenerativas.","Hay cuatro estados funcionales, cada uno con sus propios objetivos: **encamado** (prevenir complicaciones y preparar la sedestación y la bipedestación), **sedestación** (control postural, transferencias y preparación de la marcha), **deambulación** (velocidad, seguridad, eficiencia y resistencia) y **alta discapacidad** (independencia máxima, cuidador y ayudas técnicas).","La elección del tratamiento depende de la **patología** (déficits y estrategias), de la **fase** (aguda, subaguda o crónica: intensidad y tipo), de la **edad y las condiciones generales** (capacidad de respuesta) y de los **objetivos del paciente y de su familia**.","Lesiones según Ratliffe: **parietal** (afasia, apraxia, atopognosia), **cerebelo** (dismetría, ataxia, disartria, hipotonía, nistagmo, distonía, temblor), **diencéfalo** (conciencia y funciones vegetativas), **mesencéfalo y médula** (oculomotricidad y funciones vitales).","**Reflejos abdominales:** superior D6-D7, medio D8-D9, inferior D10-D12. **Reflejo plantar:** S1-S2. **Reflejos de las mucosas:** faríngeo y corneal."],"secciones":[{"id":"definicion-implicaciones","titulo":"Definición e implicaciones de la fisioterapia neurológica","bloques":[{"tipo":"definicion","termino":"Fisioterapia neurológica","texto":"Rama de la fisioterapia que se enfoca en la **evaluación y tratamiento** de personas con **disfunciones del sistema nervioso central o periférico**. Mediante técnicas y estrategias específicas busca **optimizar la función física, mejorar la calidad de vida y promover la independencia** de los pacientes con enfermedades o lesiones neurológicas."},{"tipo":"parrafo","texto":"El temario recoge dos **denominaciones equivalentes**: **neurorrehabilitación** y **fisioterapia del sistema nervioso**. Conviene recordar que el ámbito abarca tanto el **SNC** (ictus, lesión medular, parálisis cerebral, enfermedades neurodegenerativas) como el **SNP**, y no solo el encéfalo."},{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Evaluación exhaustiva","texto":"Valoración detallada de **capacidades y limitaciones**: identifica los déficits y permite **establecer objetivos terapéuticos**."},{"etiqueta":"2","titulo":"Tratamiento personalizado","texto":"Programas de ejercicio y actividades terapéuticas **adaptados a las necesidades individuales** de cada paciente."},{"etiqueta":"3","titulo":"Fomento de la plasticidad cerebral","texto":"Se aprovecha la capacidad del cerebro para **reorganizarse y formar nuevas conexiones neuronales**, lo que promueve la recuperación funcional."},{"etiqueta":"4","titulo":"Colaboración interdisciplinaria","texto":"Trabajo en equipo con **neurólogos, neurocirujanos y terapeutas ocupacionales**, entre otros profesionales."}]},{"tipo":"perla","texto":"La plasticidad es el *porqué* de la neurorrehabilitación. Si el sistema nervioso no pudiera reorganizarse, solo cabría compensar. Por eso el tratamiento busca a la vez **recuperar** (estimular nuevas conexiones con práctica funcional) y **compensar** lo que no se recupere (enseñar al paciente a vivir con su incapacidad)."}]},{"id":"papel-fisioterapeuta","titulo":"Papel del fisioterapeuta y regla de oro","bloques":[{"tipo":"lista","items":["Lograr el **máximo grado de funcionalidad**, que depende de las características de la lesión y del individuo.","**Prevenir secuelas:** parálisis, espasticidad, **UPP** (úlceras por presión)…","**Adiestrar a la familia** en el manejo del paciente.","Facilitar la **reinserción social y laboral** del enfermo en su mejor estado, en el seno de un **equipo multidisciplinar**."]},{"tipo":"tabla","titulo":"Factores de los que depende el resultado (papel del fisioterapeuta)","columnas":["Factor","Por qué condiciona el pronóstico funcional"],"filas":[["Nivel y tipo de lesión y complicaciones postlesionales","Determinan qué funciones se pierden y cuánto margen de recuperación queda."],["Constitución física y psíquica","Condicionan la tolerancia al esfuerzo y la capacidad de afrontamiento."],["Edad","Modula la reserva funcional y la respuesta al tratamiento."],["Colaboración del paciente","Sin participación activa no hay aprendizaje motor."],["Ambiente sociofamiliar","Determina el apoyo en el domicilio y la continuidad del tratamiento."]]},{"tipo":"alerta","texto":"No confundas dos listas parecidas. Los factores del **papel del fisioterapeuta** (nivel y tipo de lesión, constitución física y psíquica, edad, colaboración, ambiente sociofamiliar) no son los **factores de elección del tratamiento** (patología, fase de la enfermedad, edad y condiciones generales, objetivos del paciente y de la familia). La **fase aguda, subaguda o crónica** solo aparece en la segunda lista."},{"tipo":"definicion","termino":"Regla de oro","texto":"*No matarás, ni agravarás el estado del paciente.* Es el principio de seguridad (*primum non nocere*) que preside cualquier intervención neurológica."},{"tipo":"perla","texto":"La regla de oro tiene una traducción práctica. Antes de progresar de un estado a otro (por ejemplo, de la cama a la sedestación o de la sedestación a la bipedestación), comprueba la estabilidad clínica del paciente y su seguridad. Sobrepasar sus capacidades puede provocar caídas o complicaciones que agraven su estado."}]},{"id":"objetivos","titulo":"Objetivos de la fisioterapia neurológica","bloques":[{"tipo":"parrafo","texto":"Hay dos **objetivos principales**: **optimizar la función física** y **mejorar la calidad de vida** de las personas con lesión o enfermedad neurológica. De ellos se derivan objetivos específicos, que actúan sobre el déficit (movilidad, fuerza, equilibrio), el síntoma (dolor), la prevención (complicaciones) y la participación (independencia y calidad de vida)."},{"tipo":"tabla","titulo":"Objetivos específicos según el temario","columnas":["Objetivo","Contenido / justificación"],"filas":[["Recuperar la movilidad y el control motor","Restaurar movimientos funcionales y cotidianos: caminar, agarrar objetos, comer."],["Mejorar el equilibrio y la coordinación","Ejercicios específicos de estabilidad y coordinación que **reducen el riesgo de caídas** y aumentan la seguridad en las AVD."],["Reducir el dolor","Muchas patologías neurológicas cursan con dolor: técnicas de manejo del dolor y modalidades terapéuticas."],["Aumentar la fuerza muscular","Mejora la funcionalidad y **previene complicaciones secundarias**."],["Fomentar la independencia","Realizar las AVD de forma autónoma en la medida de lo posible."],["Prevenir complicaciones","Contracturas, atrofias musculares y úlceras por presión."],["Mejorar la calidad de vida","Recuperar la función y reducir síntomas mejora la calidad de vida y la **participación en la sociedad**."]]},{"tipo":"tarjetas","items":[{"etiqueta":"Aliviar","titulo":"Síntomas incapacitantes","texto":"Dolor, espasticidad y otros síntomas que limitan la función."},{"etiqueta":"Adiestrar","titulo":"Funciones que permanecen","texto":"Potenciar lo que el paciente conserva."},{"etiqueta":"Prevenir","titulo":"Contracturas y deformidades","texto":"Mediante posicionamiento y movilización."},{"etiqueta":"Mantener y mejorar","titulo":"Movilidad articular","texto":"Conservar y ampliar el rango articular."},{"etiqueta":"Enseñar","titulo":"A vivir y compensar la incapacidad","texto":"Estrategias compensatorias cuando la recuperación es incompleta."}]},{"tipo":"alerta","texto":"Fíjate en los verbos del temario: *aliviar* síntomas, *adiestrar* funciones remanentes, *prevenir* contracturas y deformidades, *mantener y mejorar* la movilidad articular, *enseñar* a compensar. Una pregunta trampa típica cambia el verbo, por ejemplo «*curar* la incapacidad» o «*suprimir* todos los síntomas»."}]},{"id":"tecnicas","titulo":"Técnicas de tratamiento más comunes","bloques":[{"tipo":"tabla","titulo":"Técnicas: descripción y aplicaciones (según el temario)","columnas":["Técnica","Descripción","Aplicaciones"],"filas":[["**FNP** (facilitación neuromuscular propioceptiva)","Utiliza **estímulos sensoriales** para facilitar el movimiento y mejorar la fuerza muscular.","Ictus, lesiones medulares, enfermedades neurodegenerativas."],["**Método Bobath**","**Inhibición de patrones de movimiento anormales** y facilitación de movimientos funcionales.","Ictus, **parálisis cerebral**."],["**Método Perfetti**","Reeducar el movimiento mediante la **repetición de patrones funcionales y la corrección de errores**.","Ictus, lesiones medulares."],["**CIMT** (terapia de restricción inducida del movimiento)","**Restringir el miembro no afectado** para forzar el uso del afectado.","**Solo ictus**."],["Terapia ocupacional","Aborda las **AVD** para mejorar la independencia y la participación social.","Todas las patologías neurológicas."],["Ejercicios terapéuticos","Fuerza, equilibrio, coordinación y movilidad.","Todas las patologías neurológicas."],["Terapia manual","Manipulación de **tejidos blandos** para mejorar la movilidad y reducir el dolor.","Todas las patologías neurológicas."],["Electroterapia","Uso de corrientes eléctricas para crear **neuromodulación**.","Reducción del dolor, estimulación neuromuscular."],["Realidad virtual","Entornos virtuales para ejercicios **más interactivos y motivadores**.","Rehabilitación de la marcha, el equilibrio y la coordinación."]]},{"tipo":"alerta","texto":"Trampas frecuentes. La **parálisis cerebral** solo figura en Bobath. Las **enfermedades neurodegenerativas** solo en FNP. La **CIMT** tiene una única aplicación (ictus). Las técnicas para *todas las patologías neurológicas* son tres: **terapia ocupacional, ejercicios terapéuticos y terapia manual**. La realidad virtual y la electroterapia no están en ese grupo."},{"tipo":"perla","texto":"La CIMT exige que el paciente tenga **algo de movilidad activa** en el miembro parético; si no la hay, no hay movimiento que forzar (complemento). Su lógica es combatir el *no uso aprendido* del lado afectado y aprovechar la plasticidad dependiente del uso."},{"tipo":"parrafo","texto":"En la bibliografía clásica, el método Perfetti se conoce como **ejercicio terapéutico cognoscitivo** e insiste en los procesos cognitivos y perceptivos del movimiento (complemento). Para el examen, usa la definición del temario: **repetición de patrones funcionales y corrección de errores**."}]},{"id":"tratamiento-estado","titulo":"Tipos de tratamiento según el estado del paciente","bloques":[{"tipo":"esquema","titulo":"Progresión funcional y objetivo puente de cada estado","mermaid":"flowchart LR\n  A[\"1. Paciente encamado\"] -->|\"preparar sedestación y bipedestación\"| B[\"2. Capacidad de sedestación\"]\n  B -->|\"preparar deambulación\"| C[\"3. Capacidad de deambulación\"]\n  C --> E[\"Marcha más rápida, segura y eficiente\"]\n  A -->|\"si no progresa\"| D[\"4. Alta discapacidad\"]\n  D --> F[\"Entorno, ayudas técnicas y cuidadores\"]","pie":"Cada estado prepara el siguiente. El encamado prepara la posición sentada y de pie; la sedestación prepara la marcha. La alta discapacidad se aborda con adaptación del entorno, ayudas técnicas y formación del cuidador."},{"tipo":"tabla","titulo":"Objetivos y tratamientos por estado funcional","columnas":["Estado","Objetivos","Tratamientos"],"filas":[["**1. Encamado**","Prevenir complicaciones (UPP, contracturas, atrofia muscular). Mantener la movilidad articular y muscular en las **zonas no afectadas**. **Preparar la posición sentada y de pie.**","**Movilizaciones pasivas** (mantener la amplitud articular). **Posicionamientos** (favorecer la función y evitar deformidades). **Ejercicios activos asistidos**."],["**2. Sedestación**","Mejorar el control postural y el equilibrio en sedestación. Facilitar las transferencias a otras posiciones. **Preparar para la deambulación.**","**Fortalecimiento del tronco**. Entrenamiento del equilibrio (**superficies inestables**, desplazamientos controlados). **Transferencias cama ↔ silla de ruedas**."],["**3. Deambulación**","Mejorar la marcha en **velocidad, seguridad y eficiencia**. Aumentar la distancia y la resistencia. Reeducar patrones alterados.","Entrenamiento de la marcha **con o sin ayudas técnicas** (andadores, bastones). **Equilibrio dinámico**. Entrenamiento de la coordinación de distintos grupos musculares."],["**4. Alta discapacidad**","Maximizar la independencia funcional. Mejorar la calidad de vida **del paciente y de su cuidador**. Prevenir complicaciones secundarias.","**Adaptación del entorno**. **Ayudas técnicas** (sillas de ruedas, grúas). **Entrenamiento de los cuidadores**."]]},{"tipo":"alerta","texto":"El objetivo «**preparación para la posición sentada y de pie**» corresponde al **encamado**, y «**preparar para la deambulación**» a la **sedestación**. El equilibrio **en superficies inestables** se trabaja en sedestación; el equilibrio **dinámico** durante la marcha, en deambulación. Las **grúas** y el **cuidador** pertenecen a la alta discapacidad."},{"tipo":"perla","texto":"En el paciente encamado, el objetivo de movilidad del temario se refiere a las **zonas no afectadas**. Las zonas afectadas se protegen con movilizaciones pasivas y posicionamientos que eviten deformidades. Un posicionamiento cuidadoso con cambios posturales es, además, la primera barrera frente a las UPP."}]},{"id":"factores-eleccion","titulo":"Factores que influyen en la elección del tratamiento","bloques":[{"tipo":"esquema","titulo":"Del razonamiento clínico al tratamiento personalizado","mermaid":"flowchart TD\n  V[\"Evaluación exhaustiva\"] --> P[\"Patología: déficits y estrategias\"]\n  V --> F[\"Fase aguda, subaguda o crónica: intensidad y tipo\"]\n  V --> E[\"Edad y condiciones generales: capacidad de respuesta\"]\n  V --> O[\"Objetivos del paciente y la familia\"]\n  P --> T[\"Tratamiento personalizado\"]\n  F --> T\n  E --> T\n  O --> T\n  T --> R[\"Regla de oro: no agravar\"]","pie":"Los cuatro factores del temario confluyen en un plan individualizado, siempre bajo la regla de oro."},{"tipo":"tabla","titulo":"Factor y aspecto que condiciona","columnas":["Factor","Qué determina"],"filas":[["Patología","Los **déficits funcionales** y las **estrategias terapéuticas**."],["Fase de la enfermedad (aguda, subaguda, crónica)","La **intensidad** y el **tipo** de tratamiento."],["Edad y condiciones generales (comorbilidad, estado físico)","La **capacidad de respuesta** al tratamiento."],["Objetivos del paciente y su familia","Las **expectativas y metas** que orientan el plan."]]},{"tipo":"perla","texto":"Pactar objetivos con el paciente y la familia no es una cortesía: mejora la **colaboración**, que es uno de los factores de los que depende el resultado funcional."}]},{"id":"estructuras-encefalo","titulo":"Función de las estructuras del encéfalo e implicación en la lesión (Ratliffe)","bloques":[{"tipo":"figura","pagina":24,"pie":"Lóbulos cerebrales: frontal (azul), parietal (amarillo), temporal (verde) y occipital (rosa). Localiza el frontal por delante, el parietal por detrás y arriba, el temporal por debajo de la cisura lateral y el occipital en el polo posterior.","src":"img/fisioterapia-neurologica-t2-tema-2-introduccion-a-la-fisioterapia-neurologica-p24.jpg"},{"tipo":"tabla","titulo":"Estructura – función – consecuencias de la lesión","columnas":["Estructura","Función","Lesión"],"filas":[["**Lóbulo frontal**","Pensamiento, **lenguaje expresivo**, **base de la interacción social**; su porción posterior contiene las células que controlan la actividad motriz.","**Cambios de personalidad**, funcionamiento intelectual alterado, déficit de memoria, déficit de lenguaje, habilidades motrices afectadas."],["**Lóbulo parietal**","**Apreciación de la sensación**, interpretación e integración somatosensorial.","**Afasia** (oral, escrita o mixta), **apraxia** (incapacidad para un movimiento complejo o habilidoso), **atopognosia** (incapacidad para localizar estímulos táctiles)."],["**Lóbulo occipital**","Corteza visual, orientación espacial, **reconocimiento visual**.","**Déficit visual** o disminución visual funcional."],["**Lóbulo temporal**","**Recibe e interpreta estímulos**: gustativos, visuales, sonoros y olfatorios.","Incapacidad para interpretar estímulos sensoriales, **afasia**, **disfunción auditiva**."],["**Cerebelo**","**Refinamiento y coordinación de todos los movimientos**: marcha, habla, control del tono y equilibrio.","**Dismetría**, **ataxia**, **disartria**, **hipotonía**, **nistagmo**, **distonía**, temblor."],["**Diencéfalo** (tálamo e hipotálamo)","Control de **funciones vitales involuntarias**: presión sanguínea, ira, temperatura, regulación del sueño.","Alteración de la **conciencia** y de las **funciones vegetativas**: somnolencia, coma, ausencia, pérdida de peso, fiebre, pérdida de libido, desorden endocrino."],["**Mesencéfalo y médula**","**Movimientos oculares**, centros vitales de la **respiración y control vasomotor**.","Afectación de los movimientos oculares, **musculatura facial flácida**, ausencia de respuesta a estímulos, afectación de las funciones vitales."]]},{"tipo":"esquema","titulo":"Mapa rápido: dónde está la lesión y qué signo aparece","mermaid":"flowchart TD\n  A[\"Encéfalo\"] --> F[\"Frontal: personalidad, lenguaje, motricidad\"]\n  A --> P[\"Parietal: afasia, apraxia, atopognosia\"]\n  A --> O[\"Occipital: déficit visual\"]\n  A --> T[\"Temporal: afasia, disfunción auditiva\"]\n  A --> C[\"Cerebelo: dismetría, ataxia, disartria, hipotonía\"]\n  A --> D[\"Diencéfalo: conciencia y funciones vegetativas\"]\n  A --> M[\"Mesencéfalo y médula: ojos, cara flácida, funciones vitales\"]","pie":"Asocia cada estructura con su signo más característico; así resolverás rápido las preguntas de localización."},{"tipo":"figura","pagina":29,"pie":"Componentes del diencéfalo en corte sagital: tálamo (óptico), epitálamo, hipotálamo y subtálamo. Observa su posición central, por encima del tronco del encéfalo.","src":"img/fisioterapia-neurologica-t2-tema-2-introduccion-a-la-fisioterapia-neurologica-p29.jpg"},{"tipo":"alerta","texto":"**Afasia ≠ disartria.** Según Ratliffe, la **afasia** aparece en la lesión **parietal** y en la **temporal**; en la frontal se habla de *déficit de lenguaje*, en coherencia con su función de *lenguaje expresivo*. La **disartria** (incapacidad para formar o articular palabras) es **cerebelosa**. Ojo también: el cerebelo da **hipotonía**, no espasticidad."},{"tipo":"definicion","termino":"Atopognosia","texto":"Incapacidad para **localizar estímulos táctiles**. Es un signo de lesión **parietal**. En la diapositiva aparece escrito como «atopgnosia»."},{"tipo":"perla","texto":"Las lesiones del tronco (mesencéfalo y médula) y del diencéfalo afectan a la **conciencia** y a las **funciones vitales**. Ante un paciente con alteración de la conciencia o inestabilidad respiratoria o vasomotora, aplica la regla de oro: monitoriza y coordínate con el equipo médico antes de intervenir."}]},{"id":"exploracion","titulo":"Exploración básica: trofismo y reflejos","bloques":[{"tipo":"tabla","titulo":"Exploración del trofismo","columnas":["Método","Qué se explora"],"filas":[["**Inspección**","Coloración de la piel y alteraciones cutáneas: atrofia, hipertrofia, úlceras, alteraciones vasculares, etc."],["**Palpación**","Textura (**elasticidad y humedad**) y **temperatura** de la piel, **con el dorso de la mano** del examinador. Estado de las articulaciones y deformidades presentes. Estado de la masa muscular, **objetivable midiendo los perímetros** de las extremidades."]]},{"tipo":"tabla","titulo":"Reflejos superficiales y de las mucosas","columnas":["Reflejo","Tipo","Nivel segmentario"],"filas":[["Abdominal superior","Superficial","**D6-D7**"],["Abdominal medio","Superficial","**D8-D9**"],["Abdominal inferior","Superficial","**D10-D12**"],["Plantar","Superficial","**S1-S2**"],["Faríngeo","De las mucosas","No especificado en el temario"],["Corneal","De las mucosas","No especificado en el temario"]]},{"tipo":"figura","pagina":34,"pie":"Esquema de los reflejos cutáneos abdominales con sus niveles: superior D6-D7, medio D8-D9 e inferior D10-D12. Memoriza la secuencia craneocaudal.","src":"img/fisioterapia-neurologica-t2-tema-2-introduccion-a-la-fisioterapia-neurologica-p34.jpg"},{"tipo":"alerta","texto":"El abdominal **inferior abarca tres segmentos (D10-D12)**, mientras que el superior y el medio abarcan dos cada uno. El **plantar es S1-S2**, no L5-S1. El **corneal** y el **faríngeo** son reflejos *de las mucosas*, no cutáneos superficiales."},{"tipo":"perla","texto":"La medición de perímetros permite **cuantificar la atrofia** y seguir su evolución. Mide siempre a la misma distancia de una referencia ósea y compara con el lado contralateral (complemento)."}]},{"id":"actividad-ia","titulo":"Actividad de aula: IA en fisioterapia neurológica","bloques":[{"tipo":"parrafo","texto":"**Objetivo:** fomentar la reflexión crítica sobre el impacto de la inteligencia artificial en la práctica clínica. **Actividad:** debate sobre beneficios y riesgos de implantar la IA en fisioterapia neurológica. Temas: **ética, privacidad de los datos, accesibilidad y necesidad de formación continua**."}]}],"caso_clinico":{"titulo":"Mujer con ictus en fase subaguda","presentacion":"Carmen, 63 años, administrativa, sufrió hace 3 semanas un ictus isquémico izquierdo. Presenta hemiparesia derecha con algo de movilidad activa en la mano y dificultad para expresarse verbalmente. Mantiene la sedestación con supervisión, pero se desestabiliza al girar el tronco y todavía no camina. Tiene hipertensión controlada. Vive con su marido, muy implicado, y su objetivo prioritario es volver a casa y llegar a caminar dentro del domicilio. En la inspección del sacro se aprecia un eritema que no blanquea.","preguntas":[{"pregunta":"¿En qué estado funcional se encuentra Carmen y qué objetivos y tratamientos le corresponden según el temario?","respuesta":"Está en el estado **«paciente con capacidad de sedestación»**. Objetivos: mejorar el **control postural y el equilibrio en sedestación**, facilitar las **transferencias** y **preparar la deambulación**. Tratamientos: **fortalecimiento del tronco**, **entrenamiento del equilibrio** (superficies inestables, desplazamientos controlados) y **transferencias cama ↔ silla de ruedas**. El eritema sacro obliga a mantener la **prevención de complicaciones** (UPP) propia del paciente encamado mediante posicionamiento y cambios posturales."},{"pregunta":"¿Qué técnicas del temario están indicadas en su caso y por qué?","respuesta":"Todas las que recogen el **ictus** entre sus aplicaciones: **FNP**, **Bobath**, **Perfetti** y **CIMT**. La CIMT es especialmente pertinente porque conserva **movilidad activa en la mano**: restringir el miembro sano fuerza el uso del afectado y aprovecha la **plasticidad cerebral**. Además pueden usarse ejercicios terapéuticos, terapia manual y terapia ocupacional (aplicables a todas las patologías neurológicas). La **realidad virtual** puede apoyar el equilibrio y, más adelante, la marcha."},{"pregunta":"¿Qué factores condicionan la elección del tratamiento y qué papel debe tener su marido?","respuesta":"Según el temario: **patología** (ictus con hemiparesia y déficit de lenguaje expresivo, compatible con afectación frontal), **fase subaguda** (condiciona la intensidad y el tipo de tratamiento), **edad y condiciones generales** (63 años, HTA controlada: buena capacidad de respuesta previsible) y **objetivos del paciente y de la familia** (volver a casa y caminar). El fisioterapeuta debe **adiestrar a la familia** en el manejo de Carmen (transferencias seguras, posicionamiento) y orientar hacia la **reinserción** dentro del equipo multidisciplinar. Todo ello sin progresar más deprisa de lo que permita su seguridad, según la **regla de oro**."}]},"glosario":[{"termino":"Neurorrehabilitación","definicion":"Sinónimo de fisioterapia neurológica o fisioterapia del sistema nervioso."},{"termino":"Plasticidad cerebral","definicion":"Capacidad del cerebro para reorganizarse y formar nuevas conexiones neuronales; base de la recuperación funcional."},{"termino":"UPP","definicion":"Úlceras por presión; complicación que hay que prevenir, sobre todo en el paciente encamado."},{"termino":"Afasia","definicion":"Alteración del lenguaje (oral, escrita o mixta); en la tabla de Ratliffe aparece en las lesiones parietal y temporal."},{"termino":"Apraxia","definicion":"Incapacidad para llevar a cabo un movimiento complejo o habilidoso; lesión parietal."},{"termino":"Atopognosia","definicion":"Incapacidad para localizar estímulos táctiles; lesión parietal."},{"termino":"Dismetría","definicion":"Falta de cálculo en los movimientos; signo cerebeloso."},{"termino":"Disartria","definicion":"Incapacidad para formar o articular palabras; signo cerebeloso."},{"termino":"Ataxia","definicion":"Falta de coordinación del movimiento; signo cerebeloso."},{"termino":"Nistagmo","definicion":"Movimientos oculares rítmicos involuntarios; aparece en la lesión cerebelosa."},{"termino":"CIMT","definicion":"Terapia de restricción inducida del movimiento: restringe el miembro sano para forzar el uso del afectado; aplicación: ictus."},{"termino":"FNP","definicion":"Facilitación neuromuscular propioceptiva: estímulos sensoriales para facilitar el movimiento y la fuerza."},{"termino":"Neuromodulación","definicion":"Modificación de la actividad nerviosa; finalidad de la electroterapia según el temario."},{"termino":"Trofismo","definicion":"Estado nutricional de los tejidos (piel, músculo, articulaciones); se explora por inspección y palpación."},{"termino":"Sedestación","definicion":"Posición sentada; segundo estado funcional en la progresión terapéutica."}],"fuentes":["Ratliffe KT. Clinical Pediatric Physical Therapy.","Universidad Europea. Tema 2: Introducción a la Fisioterapia Neurológica (Villarón C, Herrmann C, Chimeno A, Sirvent MÁ, Izquierdo R)."],"qcm":[{"pregunta":"Tras una lesión cortical, un paciente percibe que le tocan el antebrazo, pero no sabe señalar en qué punto exacto. Según la tabla de Ratliffe del temario, ¿qué signo presenta y a qué estructura se atribuye?","opciones":["Apraxia, por lesión del lóbulo parietal","Atopognosia, por lesión del lóbulo parietal","Agnosia sensorial, por lesión del lóbulo temporal","Dismetría, por lesión del hemisferio cerebeloso"],"correcta":1,"explicacion":"La incapacidad para localizar estímulos táctiles es la **atopognosia**. El temario la incluye entre las lesiones del **lóbulo parietal**, cuya función es la apreciación de la sensación y la integración somatosensorial.","por_opcion":["❌ La apraxia también es parietal, pero es la incapacidad para realizar un movimiento complejo o habilidoso, no para localizar un estímulo.","✅ Atopognosia = incapacidad para localizar estímulos táctiles; lesión parietal según Ratliffe.","❌ El temporal se asocia a la incapacidad para interpretar estímulos sensoriales, afasia y disfunción auditiva, no a la localización táctil.","❌ La dismetría es la falta de cálculo en los movimientos, un signo cerebeloso motor, no sensitivo."]},{"pregunta":"Un niño presenta habla mal articulada, tono muscular disminuido y movimientos oculares rítmicos involuntarios. ¿Qué estructura recoge el temario como responsable de este conjunto de signos?","opciones":["Cerebelo","Mesencéfalo y médula","Diencéfalo","Lóbulo temporal"],"correcta":0,"explicacion":"Disartria, hipotonía y nistagmo figuran entre las lesiones del **cerebelo**, junto con dismetría, ataxia, distonía y temblor. El cerebelo refina y coordina todos los movimientos, incluidos el habla y el control del tono.","por_opcion":["✅ El cerebelo agrupa disartria, hipotonía y nistagmo en la tabla de Ratliffe.","❌ Mesencéfalo y médula: afectación oculomotora, musculatura facial flácida y funciones vitales, no disartria con hipotonía global.","❌ El diencéfalo altera la conciencia y las funciones vegetativas (fiebre, somnolencia, trastorno endocrino).","❌ El lóbulo temporal produce afasia (trastorno del lenguaje, no de la articulación) y disfunción auditiva."]},{"pregunta":"Según la tabla de Ratliffe del temario, ¿en qué par de estructuras se cita expresamente el término «afasia» como consecuencia de la lesión?","opciones":["Lóbulo frontal y lóbulo occipital","Lóbulo parietal y lóbulo temporal","Lóbulo frontal y cerebelo","Lóbulo temporal y diencéfalo"],"correcta":1,"explicacion":"El temario cita la **afasia** (oral, escrita o mixta) en el **parietal** y la **afasia** en el **temporal**. En el frontal, cuya función es el lenguaje expresivo, la lesión se describe como «déficit de lenguaje», sin usar el término afasia.","por_opcion":["❌ El frontal recoge «déficit de lenguaje» y el occipital solo déficit visual.","✅ Parietal y temporal son las dos estructuras en las que figura literalmente «afasia».","❌ El cerebelo produce disartria (articulación), no afasia; el frontal no usa el término.","❌ El diencéfalo se asocia a alteraciones de la conciencia y vegetativas, no del lenguaje."]},{"pregunta":"En la exploración, el reflejo cutáneo abdominal periumbilical (medio) está abolido, mientras que el superior y el inferior están conservados. ¿Qué segmentos sugiere afectados el temario?","opciones":["D6-D7","S1-S2","D10-D12","D8-D9"],"correcta":3,"explicacion":"El temario asigna el reflejo abdominal **medio** a **D8-D9**, el superior a D6-D7 y el inferior a D10-D12. La abolición aislada del medio orienta, por tanto, a D8-D9.","por_opcion":["❌ D6-D7 corresponde al reflejo abdominal superior, que está conservado.","❌ S1-S2 es el nivel del reflejo plantar, no de los abdominales.","❌ D10-D12 corresponde al reflejo abdominal inferior, también conservado.","✅ El abdominal medio se integra en D8-D9."]},{"pregunta":"¿Cuál de los siguientes emparejamientos reflejo–clasificación–nivel coincide con lo recogido en el temario?","opciones":["Plantar – superficial cutáneo – S1-S2","Faríngeo – superficial cutáneo – S1-S2","Corneal – superficial cutáneo – D6-D7","Abdominal inferior – de mucosas – D10-D12"],"correcta":0,"explicacion":"El **reflejo plantar** se clasifica como **superficial** y se integra en **S1-S2**. Corneal y faríngeo son **reflejos de las mucosas**, y los abdominales son superficiales.","por_opcion":["✅ Plantar: reflejo superficial, nivel S1-S2.","❌ El faríngeo es un reflejo de las mucosas, y S1-S2 pertenece al plantar.","❌ El corneal es un reflejo de las mucosas, y D6-D7 es el nivel del abdominal superior.","❌ El nivel D10-D12 es correcto, pero el abdominal inferior es superficial, no de mucosas."]},{"pregunta":"Durante la exploración del trofismo de un paciente con lesión neurológica, ¿qué procedimiento se ajusta a lo descrito en el temario?","opciones":["Objetivar la masa muscular mediante la inspección de la coloración","Valorar la temperatura cutánea por palpación con el dorso de la mano","Valorar la temperatura cutánea por palpación con la palma de la mano","Valorar la elasticidad cutánea mediante la inspección de las úlceras"],"correcta":1,"explicacion":"La textura (elasticidad y humedad) y la **temperatura** de la piel se valoran por **palpación con el dorso de la mano** del examinador. La masa muscular se objetiva **midiendo perímetros**, y la coloración y las úlceras se valoran por inspección.","por_opcion":["❌ La masa muscular se objetiva midiendo los perímetros de las extremidades, no por la coloración.","✅ Coincide literalmente con el temario: palpación de la temperatura con el dorso de la mano.","❌ El temario especifica el dorso, no la palma, de la mano del examinador.","❌ La elasticidad forma parte de la textura y se valora por palpación; las úlceras se inspeccionan."]},{"pregunta":"De las siguientes técnicas, ¿cuál tiene en el temario una única aplicación descrita, el ictus?","opciones":["Terapia de restricción inducida del movimiento","Facilitación neuromuscular propioceptiva","Método Perfetti","Método Bobath"],"correcta":0,"explicacion":"La **CIMT** restringe el miembro no afectado para forzar el uso del afectado, y el temario solo le asigna una aplicación: el **ictus**. Las demás técnicas tienen al menos dos aplicaciones.","por_opcion":["✅ CIMT: aplicación exclusiva en el ictus según el temario.","❌ FNP: ictus, lesiones medulares y enfermedades neurodegenerativas.","❌ Perfetti: ictus y lesiones medulares.","❌ Bobath: ictus y parálisis cerebral."]},{"pregunta":"En la consulta de neuropediatría se valora a un niño con parálisis cerebral. De las técnicas recogidas en el temario, ¿cuál incluye expresamente la parálisis cerebral entre sus aplicaciones?","opciones":["Método Bobath","Facilitación neuromuscular propioceptiva","Método Perfetti","Terapia de restricción inducida del movimiento"],"correcta":0,"explicacion":"El **método Bobath**, centrado en la inhibición de patrones de movimiento anormales y la facilitación de movimientos funcionales, es la única técnica del temario que cita la **parálisis cerebral** (junto con el ictus).","por_opcion":["✅ Bobath: ictus y parálisis cerebral.","❌ FNP: ictus, lesiones medulares y enfermedades neurodegenerativas, pero no parálisis cerebral.","❌ Perfetti se aplica a ictus y lesiones medulares.","❌ CIMT: solo ictus."]},{"pregunta":"¿Cuál de las siguientes técnicas NO figura en el temario con la aplicación «todas las patologías neurológicas»?","opciones":["Terapia ocupacional","Terapia manual","Realidad virtual","Ejercicios terapéuticos"],"correcta":2,"explicacion":"Solo **terapia manual, terapia ocupacional y ejercicios terapéuticos** se aplican a todas las patologías neurológicas. La **realidad virtual** tiene aplicaciones concretas: rehabilitación de la marcha, el equilibrio y la coordinación.","por_opcion":["❌ La terapia ocupacional (AVD, independencia y participación) se aplica a todas.","❌ La terapia manual (tejidos blandos, movilidad y dolor) se aplica a todas las patologías neurológicas.","✅ La realidad virtual se limita a marcha, equilibrio y coordinación.","❌ Los ejercicios terapéuticos se aplican a todas las patologías neurológicas."]},{"pregunta":"Según el temario, el grado máximo de funcionalidad que el fisioterapeuta puede lograr depende de varios factores. ¿Cuál de los siguientes NO figura en esa lista?","opciones":["Nivel educativo del paciente","Ambiente sociofamiliar del paciente","Constitución física y psíquica","Colaboración del propio paciente"],"correcta":0,"explicacion":"El temario enumera: nivel y tipo de lesión y complicaciones postlesionales, constitución física y psíquica, edad, colaboración del paciente y ambiente sociofamiliar. El **nivel educativo** no aparece.","por_opcion":["✅ El nivel educativo no es uno de los factores del temario.","❌ El ambiente sociofamiliar figura expresamente en la lista.","❌ La constitución física y psíquica figura en la lista.","❌ La colaboración del paciente figura en la lista."]},{"pregunta":"¿Cuál de los siguientes tratamientos NO forma parte de los que el temario asigna al paciente encamado?","opciones":["Posicionamientos antideformidad","Movilizaciones pasivas articulares","Ejercicios activos asistidos","Equilibrio en superficies inestables"],"correcta":3,"explicacion":"Al paciente encamado le corresponden **movilizaciones pasivas, posicionamientos y ejercicios activos asistidos**. El entrenamiento del equilibrio en **superficies inestables** pertenece al paciente con **capacidad de sedestación**.","por_opcion":["❌ Los posicionamientos favorecen la función y evitan deformidades en el encamado.","❌ Las movilizaciones pasivas mantienen la amplitud articular en el encamado.","❌ Los ejercicios activos asistidos están incluidos en el paciente encamado.","✅ El equilibrio en superficies inestables es un tratamiento del paciente en sedestación."]},{"pregunta":"Según el temario, ¿a qué estado funcional corresponde específicamente el objetivo «preparar para la deambulación»?","opciones":["Paciente con alta discapacidad","Paciente con capacidad de deambulación","Paciente encamado","Paciente con capacidad de sedestación"],"correcta":3,"explicacion":"«Preparar para la deambulación» es un objetivo del **paciente con capacidad de sedestación**, junto con el control postural y las transferencias. El encamado tiene como objetivo prepararse para la posición sentada y de pie.","por_opcion":["❌ En la alta discapacidad se busca la independencia máxima, la calidad de vida del cuidador y la prevención de complicaciones.","❌ En la deambulación ya se trabaja la marcha: velocidad, seguridad, eficiencia y resistencia.","❌ En el encamado el objetivo es la preparación para la posición sentada y de pie, no para la marcha.","✅ Sedestación: control postural, transferencias y preparación de la deambulación."]},{"pregunta":"¿En qué estado funcional sitúa el temario el objetivo de mejorar la calidad de vida del paciente y de su cuidador, junto con el uso de grúas?","opciones":["Paciente con capacidad de deambulación","Paciente encamado","Paciente con alta discapacidad","Paciente con capacidad de sedestación"],"correcta":2,"explicacion":"El **paciente con alta discapacidad** tiene como objetivos maximizar la independencia, mejorar la calidad de vida **del paciente y del cuidador** y prevenir complicaciones. Sus tratamientos son la adaptación del entorno, las **ayudas técnicas (sillas de ruedas, grúas)** y el entrenamiento de los cuidadores.","por_opcion":["❌ En la deambulación las ayudas técnicas son andadores o bastones, y el cuidador no figura en los objetivos.","❌ En el encamado los tratamientos son movilizaciones pasivas, posicionamientos y activos asistidos.","✅ Alta discapacidad: calidad de vida del paciente y del cuidador, grúas y entrenamiento de cuidadores.","❌ En la sedestación se entrenan las transferencias, pero el cuidador no forma parte de los objetivos."]},{"pregunta":"Entre los factores que influyen en la elección del tratamiento, ¿qué determina, según el temario, la fase de la enfermedad (aguda, subaguda o crónica)?","opciones":["Las expectativas y metas del paciente y su entorno","La capacidad de respuesta del paciente al tratamiento","La intensidad y el tipo de tratamiento que se aplica","Los déficits funcionales y las estrategias terapéuticas"],"correcta":2,"explicacion":"El temario indica que la **fase aguda, subaguda o crónica** influye en la **intensidad y el tipo de tratamiento**. Cada uno de los demás factores (patología, edad y condiciones generales, objetivos) determina un aspecto distinto.","por_opcion":["❌ Las expectativas y metas corresponden a los objetivos del paciente y de su familia.","❌ La capacidad de respuesta depende de la edad y las condiciones generales.","✅ La fase de la enfermedad condiciona la intensidad y el tipo de tratamiento.","❌ Los déficits funcionales y las estrategias los determina la patología."]},{"pregunta":"Un paciente presenta somnolencia, episodios de ausencia, fiebre sin foco, pérdida de peso, pérdida de libido y un trastorno endocrino. Según Ratliffe, ¿qué estructura está más probablemente lesionada?","opciones":["Lóbulo frontal","Lóbulo occipital","Mesencéfalo y médula","Diencéfalo (tálamo e hipotálamo)"],"correcta":3,"explicacion":"El **diencéfalo** controla funciones vitales involuntarias (presión sanguínea, ira, temperatura, sueño). Su lesión produce alteración de la conciencia y de las funciones vegetativas: somnolencia, coma, ausencia, pérdida de peso, fiebre, pérdida de libido y desorden endocrino.","por_opcion":["❌ Frontal: cambios de personalidad, alteración intelectual, memoria, lenguaje y motricidad.","❌ Occipital: déficit visual o disminución visual funcional.","❌ Mesencéfalo y médula: movimientos oculares, musculatura facial flácida, respiración y control vasomotor.","✅ El cuadro reproduce literalmente las consecuencias de la lesión diencefálica."]}],"asignatura":"Fisioterapia neurológica","tema":2,"fecha":"2026-11-04","resumen":["La **fisioterapia neurológica** (o **neurorrehabilitación**) evalúa y trata disfunciones del **SNC o del SNP** para optimizar la función física, mejorar la calidad de vida y promover la independencia, apoyándose en la **plasticidad cerebral** y bajo la **regla de oro**: *No matarás, ni agravarás el estado del paciente*.","El **máximo grado de funcionalidad** depende del nivel y tipo de lesión, la constitución física y psíquica, la edad, la colaboración y el ambiente sociofamiliar, mientras que la **elección del tratamiento** depende de la patología, la **fase (aguda, subaguda o crónica)**, la edad y condiciones generales y los objetivos del paciente y su familia.","La **CIMT** solo se aplica en el **ictus**, **Bobath** en ictus y **parálisis cerebral**, **Perfetti** en ictus y lesiones medulares, y la **FNP** además en **enfermedades neurodegenerativas**; las técnicas para todas las patologías neurológicas son **terapia ocupacional, ejercicios terapéuticos y terapia manual**.","Los cuatro estados funcionales tienen objetivos propios: **encamado** (prevenir complicaciones y preparar sedestación y bipedestación), **sedestación** (control postural, transferencias y **preparar la deambulación**), **deambulación** (velocidad, seguridad, eficiencia y resistencia) y **alta discapacidad** (independencia máxima, **cuidador** y **grúas**).","Según Ratliffe, la lesión **parietal** da afasia, apraxia y atopognosia, la **cerebelosa** dismetría, ataxia, disartria, hipotonía y nistagmo, y la del **diencéfalo y tronco** altera conciencia y funciones vitales; los reflejos abdominales son **D6-D7, D8-D9 y D10-D12**, y el plantar es **S1-S2**."],"preguntate":[{"pregunta":"Define la fisioterapia neurológica y nombra sus dos denominaciones equivalentes según el temario.","respuesta":"Es la rama de la fisioterapia que **evalúa y trata** a personas con **disfunciones del SNC o del SNP** para optimizar la función física, mejorar la calidad de vida y promover la independencia. También se llama **neurorrehabilitación** o **fisioterapia del sistema nervioso**."},{"pregunta":"¿Por qué se dice que la plasticidad cerebral es el *porqué* de la neurorrehabilitación y qué dos estrategias combina el tratamiento?","respuesta":"Porque el cerebro puede **reorganizarse y formar nuevas conexiones**; sin esa capacidad solo cabría compensar. El tratamiento busca a la vez **recuperar** con práctica funcional y **compensar** lo que no se recupere."},{"pregunta":"Enuncia la regla de oro y explica cómo se aplica al progresar a un paciente de la cama a la sedestación.","respuesta":"*No matarás, ni agravarás el estado del paciente* (*primum non nocere*). Antes de cambiar de estado hay que comprobar la **estabilidad clínica y la seguridad**, porque sobrepasar sus capacidades puede causar caídas o complicaciones."},{"pregunta":"Compara los factores de los que depende el máximo grado de funcionalidad con los factores que influyen en la elección del tratamiento. ¿Qué factor aparece solo en la segunda lista?","respuesta":"Funcionalidad: nivel y tipo de lesión y complicaciones, constitución física y psíquica, edad, colaboración y ambiente sociofamiliar. Elección del tratamiento: patología, fase, edad y condiciones generales, y objetivos del paciente y la familia. La **fase (aguda, subaguda o crónica)** solo está en la segunda."},{"pregunta":"Explica el mecanismo de la CIMT y qué requisito debe cumplir el paciente para aplicarla.","respuesta":"Se **restringe el miembro no afectado** para forzar el uso del afectado, combatiendo el *no uso aprendido* y aprovechando la plasticidad dependiente del uso. Exige **algo de movilidad activa** en el miembro parético."},{"pregunta":"Un paciente ya mantiene la sedestación. ¿Qué objetivos y tratamientos le corresponden según el temario?","respuesta":"Objetivos: mejorar el **control postural y el equilibrio** en sedestación, facilitar las transferencias y **preparar la deambulación**. Tratamientos: **fortalecimiento del tronco**, equilibrio en **superficies inestables** y **transferencias cama ↔ silla de ruedas**."},{"pregunta":"¿Qué objetivos y tratamientos se plantean en un paciente encamado y a qué zonas se refiere el objetivo de movilidad?","respuesta":"Prevenir **UPP, contracturas y atrofia**, mantener la movilidad de las **zonas no afectadas** y preparar la posición sentada y de pie. Se usan **movilizaciones pasivas, posicionamientos y ejercicios activos asistidos**."},{"pregunta":"Indica los verbos del temario que acompañan a cada objetivo de la fisioterapia neurológica y explica por qué son importantes en el examen.","respuesta":"*Aliviar* síntomas, *adiestrar* funciones remanentes, *prevenir* contracturas y deformidades, *mantener y mejorar* la movilidad articular y *enseñar* a compensar la incapacidad. Las preguntas trampa cambian el verbo, por ejemplo por *curar* o *suprimir*."},{"pregunta":"¿Qué funciones tiene el lóbulo frontal y qué consecuencias produce su lesión según Ratliffe?","respuesta":"Se encarga del pensamiento, el **lenguaje expresivo** y la base de la interacción social, y su porción posterior controla la actividad motriz. Su lesión provoca **cambios de personalidad**, alteración intelectual, déficit de memoria y de lenguaje, y afectación motriz."},{"pregunta":"Ante un paciente con musculatura facial flácida, alteración de los movimientos oculares e inestabilidad respiratoria, ¿qué estructura sospechas y cómo actúas?","respuesta":"Sospecho una lesión de **mesencéfalo y médula**, donde están los centros de la **respiración y del control vasomotor**. Aplico la regla de oro: **monitorizar y coordinarse con el equipo médico** antes de intervenir."}]}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
