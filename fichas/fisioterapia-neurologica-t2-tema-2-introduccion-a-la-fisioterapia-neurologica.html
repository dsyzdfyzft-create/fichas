<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tema 2. Introducción a la Fisioterapia Neurológica · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#f6f4ef; --hoja:#fffdf9; --tinta:#1b2427; --suave:#5b676b; --linea:#e2ddd2; --acento:#1f6f6b; --acento-suave:#dcebe8;
  --ocre:#b37a1c; --ocre-suave:#f6ead3; --rojo:#a8402f; --rojo-suave:#f5e0db; --verde:#2f7a46; --verde-suave:#dcefe1;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --texto:"Spectral",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:19px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);line-height:1.12;margin:0;font-variation-settings:"SOFT" 50}
h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.9rem;font-weight:600;letter-spacing:-.015em;margin:0 0 18px}
h3{font-size:1.2rem;font-weight:600}
b,strong{font-weight:600}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px}
.envoltura{max-width:820px;margin:0 auto;padding:0 22px}
/* cabecera */
header.portada{padding:64px 0 36px;border-bottom:1px solid var(--linea)}
.etiquetas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.etiqueta{font:600 .78rem/1 var(--serif);padding:7px 11px;border-radius:999px;background:var(--acento-suave);color:var(--acento)}
.etiqueta.o{background:var(--ocre-suave);color:var(--ocre)}
.sub{font-size:1.25rem;color:var(--suave);margin:16px 0 0;max-width:62ch;font-style:italic}
.meta{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap}
.meta div{font-family:var(--serif)}
.meta b{display:block;font-size:1.7rem;font-weight:800;line-height:1}
.meta span{font-size:.8rem;color:var(--suave)}
/* navegación */
nav.indice{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px)}
nav.indice .envoltura{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .envoltura::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .85rem var(--serif);padding:7px 12px;border-radius:999px}
nav.indice a:hover{color:var(--tinta);background:var(--hoja)}
nav.indice a.qcm{background:var(--tinta);color:var(--papel);margin-left:auto}
main section{padding:56px 0 8px}
.num{font:800 .85rem var(--serif);color:var(--ocre);display:block;margin-bottom:6px}
p{margin:0 0 16px;max-width:68ch}
/* bloques */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:14px;padding:22px 24px}
.caja h3{margin-bottom:12px}
.caja ul,.caja ol{margin:0;padding-left:1.2em}
.caja li{margin:6px 0}
.claves{counter-reset:k;list-style:none;padding:0!important}
.claves li{counter-increment:k;padding-left:38px;position:relative;margin:10px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--acento);color:var(--papel);font:800 .8rem/26px var(--serif);text-align:center}
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
.tw{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--linea);border-radius:12px;background:var(--hoja)}
table{border-collapse:collapse;width:100%;font-size:.92rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:600 .95rem var(--serif);padding:14px 16px 4px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--linea)}
th{font:600 .82rem var(--serif);color:var(--suave);border-top:0}
tbody tr:nth-child(odd){background:color-mix(in srgb,var(--papel) 50%,transparent)}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 22px}
.tarjeta{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;font-size:.95rem;line-height:1.5}
.tarjeta .et{font:700 .72rem var(--serif);color:var(--ocre);display:block;margin-bottom:4px}
.tarjeta h3{font-size:1.05rem;margin-bottom:6px}
.def{border-left:3px solid var(--acento);padding:4px 0 4px 16px;margin:0 0 18px}
.def b{font-family:var(--serif);color:var(--acento)}
.nota{border-radius:12px;padding:14px 18px 14px 50px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;font-size:1.15rem}
.nota .t{font:700 .78rem var(--serif);display:block;margin-bottom:2px}
.perla{background:var(--verde-suave)} .perla::before{content:"🩺"} .perla .t{color:var(--verde)}
.alerta{background:var(--rojo-suave)} .alerta::before{content:"⚠️"} .alerta .t{color:var(--rojo)}
/* figuras y esquemas */
figure{margin:8px 0 26px;background:var(--hoja);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:20px 16px 8px;overflow-x:auto;text-align:center}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq .lienzo pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap;text-align:left}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{font-family:var(--serif);color:var(--tinta)}
/* caso clínico */
.caso{background:var(--tinta);color:var(--papel);border-radius:18px;padding:30px 30px 18px}
.caso h2{color:var(--papel)}
.caso p{color:color-mix(in srgb,var(--papel) 85%,transparent)}
.caso details{border-top:1px solid color-mix(in srgb,var(--papel) 18%,transparent);padding:12px 0}
.caso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
.caso details p{margin:10px 0 0}
dl.glosario{display:grid;grid-template-columns:max-content 1fr;gap:10px 20px;margin:0}
dl.glosario dt{font:600 1rem var(--serif);color:var(--acento)}
dl.glosario dd{margin:0}
.fuentes{font-size:.9rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border:1px solid var(--linea);border-radius:18px;padding:28px}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:600 .85rem var(--serif);color:var(--suave)}
.barra{flex:1;height:8px;border-radius:4px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--acento);transition:width .3s}
.pregunta{font:600 1.3rem/1.35 var(--serif);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer}
.op:hover:not([disabled]){border-color:var(--acento)}
.op .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 .9rem var(--serif);background:var(--hoja);border:1px solid var(--linea)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--verde);background:var(--verde-suave)}
.op.bien .l{background:var(--verde);color:#fff;border-color:var(--verde)}
.op.mal{border-color:var(--rojo);background:var(--rojo-suave)}
.op.mal .l{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{font:600 .95rem var(--serif);padding:11px 20px;border-radius:999px;border:0;background:var(--tinta);color:var(--papel);cursor:pointer}
.btn.sec{background:transparent;color:var(--tinta);border:1.5px solid var(--linea)}
.btn[disabled]{opacity:.35;cursor:default}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:800 4.4rem/1 var(--serif);letter-spacing:-.03em}
.resultado .gran small{font-size:1.6rem;color:var(--suave)}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:700px){body{font-size:17.5px}.dos{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}dl.glosario{grid-template-columns:1fr}dl.glosario dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i{transition:none}}
@media print{nav.indice,#qcm{display:none}body{background:#fff}}
</style>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script id="datos" type="application/json">{"titulo":"Tema 2. Introducción a la Fisioterapia Neurológica","subtitulo":"Qué es la fisioterapia neurológica, qué objetivos persigue, qué técnicas utiliza, cómo se adapta el tratamiento al estado del paciente y qué consecuencias tiene lesionar cada estructura encefálica, con nociones básicas de exploración del trofismo y de los reflejos.","objetivos":["Al terminar, sabrás definir la fisioterapia neurológica, sus sinónimos y sus cuatro implicaciones: evaluación, tratamiento personalizado, plasticidad y trabajo interdisciplinar.","Al terminar, sabrás enumerar el papel del fisioterapeuta, los factores de los que depende el resultado y la regla de oro de la intervención.","Al terminar, sabrás relacionar cada técnica de tratamiento (FNP, Bobath, Perfetti, CIMT, etc.) con su descripción y sus aplicaciones según el temario.","Al terminar, sabrás asignar objetivos y tratamientos a cada uno de los cuatro estados funcionales del paciente: encamado, sedestación, deambulación y alta discapacidad.","Al terminar, sabrás reconocer la función y el cuadro lesional de cada estructura encefálica (Ratliffe) y los niveles segmentarios de los reflejos superficiales."],"ideas_clave":["La **fisioterapia neurológica** (también llamada **neurorrehabilitación** o **fisioterapia del sistema nervioso**) evalúa y trata disfunciones del **SNC o del SNP** para optimizar la función física, mejorar la calidad de vida y promover la independencia.","**Regla de oro:** *No matarás, ni agravarás el estado del paciente.*","El **máximo grado de funcionalidad** alcanzable depende del nivel y tipo de lesión (y de sus complicaciones), de la constitución física y psíquica, de la edad, de la colaboración del paciente y del ambiente sociofamiliar.","**CIMT:** aplicación descrita solo en el **ictus**. **Bobath:** ictus y **parálisis cerebral**. **Perfetti:** ictus y lesiones medulares. **FNP:** ictus, lesiones medulares y enfermedades neurodegenerativas.","Hay cuatro estados funcionales, cada uno con sus propios objetivos: **encamado** (prevenir complicaciones y preparar la sedestación y la bipedestación), **sedestación** (control postural, transferencias y preparación de la marcha), **deambulación** (velocidad, seguridad, eficiencia y resistencia) y **alta discapacidad** (independencia máxima, cuidador y ayudas técnicas).","La elección del tratamiento depende de la **patología** (déficits y estrategias), de la **fase** (aguda, subaguda o crónica: intensidad y tipo), de la **edad y las condiciones generales** (capacidad de respuesta) y de los **objetivos del paciente y de su familia**.","Lesiones según Ratliffe: **parietal** (afasia, apraxia, atopognosia), **cerebelo** (dismetría, ataxia, disartria, hipotonía, nistagmo, distonía, temblor), **diencéfalo** (conciencia y funciones vegetativas), **mesencéfalo y médula** (oculomotricidad y funciones vitales).","**Reflejos abdominales:** superior D6-D7, medio D8-D9, inferior D10-D12. **Reflejo plantar:** S1-S2. **Reflejos de las mucosas:** faríngeo y corneal."],"secciones":[{"id":"definicion-implicaciones","titulo":"Definición e implicaciones de la fisioterapia neurológica","bloques":[{"tipo":"definicion","termino":"Fisioterapia neurológica","texto":"Rama de la fisioterapia que se enfoca en la **evaluación y tratamiento** de personas con **disfunciones del sistema nervioso central o periférico**. Mediante técnicas y estrategias específicas busca **optimizar la función física, mejorar la calidad de vida y promover la independencia** de los pacientes con enfermedades o lesiones neurológicas."},{"tipo":"parrafo","texto":"El temario recoge dos **denominaciones equivalentes**: **neurorrehabilitación** y **fisioterapia del sistema nervioso**. Conviene recordar que el ámbito abarca tanto el **SNC** (ictus, lesión medular, parálisis cerebral, enfermedades neurodegenerativas) como el **SNP**, y no solo el encéfalo."},{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Evaluación exhaustiva","texto":"Valoración detallada de **capacidades y limitaciones**: identifica los déficits y permite **establecer objetivos terapéuticos**."},{"etiqueta":"2","titulo":"Tratamiento personalizado","texto":"Programas de ejercicio y actividades terapéuticas **adaptados a las necesidades individuales** de cada paciente."},{"etiqueta":"3","titulo":"Fomento de la plasticidad cerebral","texto":"Se aprovecha la capacidad del cerebro para **reorganizarse y formar nuevas conexiones neuronales**, lo que promueve la recuperación funcional."},{"etiqueta":"4","titulo":"Colaboración interdisciplinaria","texto":"Trabajo en equipo con **neurólogos, neurocirujanos y terapeutas ocupacionales**, entre otros profesionales."}]},{"tipo":"perla","texto":"La plasticidad es el *porqué* de la neurorrehabilitación. Si el sistema nervioso no pudiera reorganizarse, solo cabría compensar. Por eso el tratamiento busca a la vez **recuperar** (estimular nuevas conexiones con práctica funcional) y **compensar** lo que no se recupere (enseñar al paciente a vivir con su incapacidad)."}]},{"id":"papel-fisioterapeuta","titulo":"Papel del fisioterapeuta y regla de oro","bloques":[{"tipo":"lista","items":["Lograr el **máximo grado de funcionalidad**, que depende de las características de la lesión y del individuo.","**Prevenir secuelas:** parálisis, espasticidad, **UPP** (úlceras por presión)…","**Adiestrar a la familia** en el manejo del paciente.","Facilitar la **reinserción social y laboral** del enfermo en su mejor estado, en el seno de un **equipo multidisciplinar**."]},{"tipo":"tabla","titulo":"Factores de los que depende el resultado (papel del fisioterapeuta)","columnas":["Factor","Por qué condiciona el pronóstico funcional"],"filas":[["Nivel y tipo de lesión y complicaciones postlesionales","Determinan qué funciones se pierden y cuánto margen de recuperación queda."],["Constitución física y psíquica","Condicionan la tolerancia al esfuerzo y la capacidad de afrontamiento."],["Edad","Modula la reserva funcional y la respuesta al tratamiento."],["Colaboración del paciente","Sin participación activa no hay aprendizaje motor."],["Ambiente sociofamiliar","Determina el apoyo en el domicilio y la continuidad del tratamiento."]]},{"tipo":"alerta","texto":"No confundas dos listas parecidas. Los factores del **papel del fisioterapeuta** (nivel y tipo de lesión, constitución física y psíquica, edad, colaboración, ambiente sociofamiliar) no son los **factores de elección del tratamiento** (patología, fase de la enfermedad, edad y condiciones generales, objetivos del paciente y de la familia). La **fase aguda, subaguda o crónica** solo aparece en la segunda lista."},{"tipo":"definicion","termino":"Regla de oro","texto":"*No matarás, ni agravarás el estado del paciente.* Es el principio de seguridad (*primum non nocere*) que preside cualquier intervención neurológica."},{"tipo":"perla","texto":"La regla de oro tiene una traducción práctica. Antes de progresar de un estado a otro (por ejemplo, de la cama a la sedestación o de la sedestación a la bipedestación), comprueba la estabilidad clínica del paciente y su seguridad. Sobrepasar sus capacidades puede provocar caídas o complicaciones que agraven su estado."}]},{"id":"objetivos","titulo":"Objetivos de la fisioterapia neurológica","bloques":[{"tipo":"parrafo","texto":"Hay dos **objetivos principales**: **optimizar la función física** y **mejorar la calidad de vida** de las personas con lesión o enfermedad neurológica. De ellos se derivan objetivos específicos, que actúan sobre el déficit (movilidad, fuerza, equilibrio), el síntoma (dolor), la prevención (complicaciones) y la participación (independencia y calidad de vida)."},{"tipo":"tabla","titulo":"Objetivos específicos según el temario","columnas":["Objetivo","Contenido / justificación"],"filas":[["Recuperar la movilidad y el control motor","Restaurar movimientos funcionales y cotidianos: caminar, agarrar objetos, comer."],["Mejorar el equilibrio y la coordinación","Ejercicios específicos de estabilidad y coordinación que **reducen el riesgo de caídas** y aumentan la seguridad en las AVD."],["Reducir el dolor","Muchas patologías neurológicas cursan con dolor: técnicas de manejo del dolor y modalidades terapéuticas."],["Aumentar la fuerza muscular","Mejora la funcionalidad y **previene complicaciones secundarias**."],["Fomentar la independencia","Realizar las AVD de forma autónoma en la medida de lo posible."],["Prevenir complicaciones","Contracturas, atrofias musculares y úlceras por presión."],["Mejorar la calidad de vida","Recuperar la función y reducir síntomas mejora la calidad de vida y la **participación en la sociedad**."]]},{"tipo":"tarjetas","items":[{"etiqueta":"Aliviar","titulo":"Síntomas incapacitantes","texto":"Dolor, espasticidad y otros síntomas que limitan la función."},{"etiqueta":"Adiestrar","titulo":"Funciones que permanecen","texto":"Potenciar lo que el paciente conserva."},{"etiqueta":"Prevenir","titulo":"Contracturas y deformidades","texto":"Mediante posicionamiento y movilización."},{"etiqueta":"Mantener y mejorar","titulo":"Movilidad articular","texto":"Conservar y ampliar el rango articular."},{"etiqueta":"Enseñar","titulo":"A vivir y compensar la incapacidad","texto":"Estrategias compensatorias cuando la recuperación es incompleta."}]},{"tipo":"alerta","texto":"Fíjate en los verbos del temario: *aliviar* síntomas, *adiestrar* funciones remanentes, *prevenir* contracturas y deformidades, *mantener y mejorar* la movilidad articular, *enseñar* a compensar. Una pregunta trampa típica cambia el verbo, por ejemplo «*curar* la incapacidad» o «*suprimir* todos los síntomas»."}]},{"id":"tecnicas","titulo":"Técnicas de tratamiento más comunes","bloques":[{"tipo":"tabla","titulo":"Técnicas: descripción y aplicaciones (según el temario)","columnas":["Técnica","Descripción","Aplicaciones"],"filas":[["**FNP** (facilitación neuromuscular propioceptiva)","Utiliza **estímulos sensoriales** para facilitar el movimiento y mejorar la fuerza muscular.","Ictus, lesiones medulares, enfermedades neurodegenerativas."],["**Método Bobath**","**Inhibición de patrones de movimiento anormales** y facilitación de movimientos funcionales.","Ictus, **parálisis cerebral**."],["**Método Perfetti**","Reeducar el movimiento mediante la **repetición de patrones funcionales y la corrección de errores**.","Ictus, lesiones medulares."],["**CIMT** (terapia de restricción inducida del movimiento)","**Restringir el miembro no afectado** para forzar el uso del afectado.","**Solo ictus**."],["Terapia ocupacional","Aborda las **AVD** para mejorar la independencia y la participación social.","Todas las patologías neurológicas."],["Ejercicios terapéuticos","Fuerza, equilibrio, coordinación y movilidad.","Todas las patologías neurológicas."],["Terapia manual","Manipulación de **tejidos blandos** para mejorar la movilidad y reducir el dolor.","Todas las patologías neurológicas."],["Electroterapia","Uso de corrientes eléctricas para crear **neuromodulación**.","Reducción del dolor, estimulación neuromuscular."],["Realidad virtual","Entornos virtuales para ejercicios **más interactivos y motivadores**.","Rehabilitación de la marcha, el equilibrio y la coordinación."]]},{"tipo":"alerta","texto":"Trampas frecuentes. La **parálisis cerebral** solo figura en Bobath. Las **enfermedades neurodegenerativas** solo en FNP. La **CIMT** tiene una única aplicación (ictus). Las técnicas para *todas las patologías neurológicas* son tres: **terapia ocupacional, ejercicios terapéuticos y terapia manual**. La realidad virtual y la electroterapia no están en ese grupo."},{"tipo":"perla","texto":"La CIMT exige que el paciente tenga **algo de movilidad activa** en el miembro parético; si no la hay, no hay movimiento que forzar (complemento). Su lógica es combatir el *no uso aprendido* del lado afectado y aprovechar la plasticidad dependiente del uso."},{"tipo":"parrafo","texto":"En la bibliografía clásica, el método Perfetti se conoce como **ejercicio terapéutico cognoscitivo** e insiste en los procesos cognitivos y perceptivos del movimiento (complemento). Para el examen, usa la definición del temario: **repetición de patrones funcionales y corrección de errores**."}]},{"id":"tratamiento-estado","titulo":"Tipos de tratamiento según el estado del paciente","bloques":[{"tipo":"esquema","titulo":"Progresión funcional y objetivo puente de cada estado","mermaid":"flowchart LR\n  A[\"1. Paciente encamado\"] -->|\"preparar sedestación y bipedestación\"| B[\"2. Capacidad de sedestación\"]\n  B -->|\"preparar deambulación\"| C[\"3. Capacidad de deambulación\"]\n  C --> E[\"Marcha más rápida, segura y eficiente\"]\n  A -->|\"si no progresa\"| D[\"4. Alta discapacidad\"]\n  D --> F[\"Entorno, ayudas técnicas y cuidadores\"]","pie":"Cada estado prepara el siguiente. El encamado prepara la posición sentada y de pie; la sedestación prepara la marcha. La alta discapacidad se aborda con adaptación del entorno, ayudas técnicas y formación del cuidador."},{"tipo":"tabla","titulo":"Objetivos y tratamientos por estado funcional","columnas":["Estado","Objetivos","Tratamientos"],"filas":[["**1. Encamado**","Prevenir complicaciones (UPP, contracturas, atrofia muscular). Mantener la movilidad articular y muscular en las **zonas no afectadas**. **Preparar la posición sentada y de pie.**","**Movilizaciones pasivas** (mantener la amplitud articular). **Posicionamientos** (favorecer la función y evitar deformidades). **Ejercicios activos asistidos**."],["**2. Sedestación**","Mejorar el control postural y el equilibrio en sedestación. Facilitar las transferencias a otras posiciones. **Preparar para la deambulación.**","**Fortalecimiento del tronco**. Entrenamiento del equilibrio (**superficies inestables**, desplazamientos controlados). **Transferencias cama ↔ silla de ruedas**."],["**3. Deambulación**","Mejorar la marcha en **velocidad, seguridad y eficiencia**. Aumentar la distancia y la resistencia. Reeducar patrones alterados.","Entrenamiento de la marcha **con o sin ayudas técnicas** (andadores, bastones). **Equilibrio dinámico**. Entrenamiento de la coordinación de distintos grupos musculares."],["**4. Alta discapacidad**","Maximizar la independencia funcional. Mejorar la calidad de vida **del paciente y de su cuidador**. Prevenir complicaciones secundarias.","**Adaptación del entorno**. **Ayudas técnicas** (sillas de ruedas, grúas). **Entrenamiento de los cuidadores**."]]},{"tipo":"alerta","texto":"El objetivo «**preparación para la posición sentada y de pie**» corresponde al **encamado**, y «**preparar para la deambulación**» a la **sedestación**. El equilibrio **en superficies inestables** se trabaja en sedestación; el equilibrio **dinámico** durante la marcha, en deambulación. Las **grúas** y el **cuidador** pertenecen a la alta discapacidad."},{"tipo":"perla","texto":"En el paciente encamado, el objetivo de movilidad del temario se refiere a las **zonas no afectadas**. Las zonas afectadas se protegen con movilizaciones pasivas y posicionamientos que eviten deformidades. Un posicionamiento cuidadoso con cambios posturales es, además, la primera barrera frente a las UPP."}]},{"id":"factores-eleccion","titulo":"Factores que influyen en la elección del tratamiento","bloques":[{"tipo":"esquema","titulo":"Del razonamiento clínico al tratamiento personalizado","mermaid":"flowchart TD\n  V[\"Evaluación exhaustiva\"] --> P[\"Patología: déficits y estrategias\"]\n  V --> F[\"Fase aguda, subaguda o crónica: intensidad y tipo\"]\n  V --> E[\"Edad y condiciones generales: capacidad de respuesta\"]\n  V --> O[\"Objetivos del paciente y la familia\"]\n  P --> T[\"Tratamiento personalizado\"]\n  F --> T\n  E --> T\n  O --> T\n  T --> R[\"Regla de oro: no agravar\"]","pie":"Los cuatro factores del temario confluyen en un plan individualizado, siempre bajo la regla de oro."},{"tipo":"tabla","titulo":"Factor y aspecto que condiciona","columnas":["Factor","Qué determina"],"filas":[["Patología","Los **déficits funcionales** y las **estrategias terapéuticas**."],["Fase de la enfermedad (aguda, subaguda, crónica)","La **intensidad** y el **tipo** de tratamiento."],["Edad y condiciones generales (comorbilidad, estado físico)","La **capacidad de respuesta** al tratamiento."],["Objetivos del paciente y su familia","Las **expectativas y metas** que orientan el plan."]]},{"tipo":"perla","texto":"Pactar objetivos con el paciente y la familia no es una cortesía: mejora la **colaboración**, que es uno de los factores de los que depende el resultado funcional."}]},{"id":"estructuras-encefalo","titulo":"Función de las estructuras del encéfalo e implicación en la lesión (Ratliffe)","bloques":[{"tipo":"figura","pagina":24,"pie":"Lóbulos cerebrales: frontal (azul), parietal (amarillo), temporal (verde) y occipital (rosa). Localiza el frontal por delante, el parietal por detrás y arriba, el temporal por debajo de la cisura lateral y el occipital en el polo posterior.","src":"img/fisioterapia-neurologica-t2-tema-2-introduccion-a-la-fisioterapia-neurologica-p24.jpg"},{"tipo":"tabla","titulo":"Estructura – función – consecuencias de la lesión","columnas":["Estructura","Función","Lesión"],"filas":[["**Lóbulo frontal**","Pensamiento, **lenguaje expresivo**, **base de la interacción social**; su porción posterior contiene las células que controlan la actividad motriz.","**Cambios de personalidad**, funcionamiento intelectual alterado, déficit de memoria, déficit de lenguaje, habilidades motrices afectadas."],["**Lóbulo parietal**","**Apreciación de la sensación**, interpretación e integración somatosensorial.","**Afasia** (oral, escrita o mixta), **apraxia** (incapacidad para un movimiento complejo o habilidoso), **atopognosia** (incapacidad para localizar estímulos táctiles)."],["**Lóbulo occipital**","Corteza visual, orientación espacial, **reconocimiento visual**.","**Déficit visual** o disminución visual funcional."],["**Lóbulo temporal**","**Recibe e interpreta estímulos**: gustativos, visuales, sonoros y olfatorios.","Incapacidad para interpretar estímulos sensoriales, **afasia**, **disfunción auditiva**."],["**Cerebelo**","**Refinamiento y coordinación de todos los movimientos**: marcha, habla, control del tono y equilibrio.","**Dismetría**, **ataxia**, **disartria**, **hipotonía**, **nistagmo**, **distonía**, temblor."],["**Diencéfalo** (tálamo e hipotálamo)","Control de **funciones vitales involuntarias**: presión sanguínea, ira, temperatura, regulación del sueño.","Alteración de la **conciencia** y de las **funciones vegetativas**: somnolencia, coma, ausencia, pérdida de peso, fiebre, pérdida de libido, desorden endocrino."],["**Mesencéfalo y médula**","**Movimientos oculares**, centros vitales de la **respiración y control vasomotor**.","Afectación de los movimientos oculares, **musculatura facial flácida**, ausencia de respuesta a estímulos, afectación de las funciones vitales."]]},{"tipo":"esquema","titulo":"Mapa rápido: dónde está la lesión y qué signo aparece","mermaid":"flowchart TD\n  A[\"Encéfalo\"] --> F[\"Frontal: personalidad, lenguaje, motricidad\"]\n  A --> P[\"Parietal: afasia, apraxia, atopognosia\"]\n  A --> O[\"Occipital: déficit visual\"]\n  A --> T[\"Temporal: afasia, disfunción auditiva\"]\n  A --> C[\"Cerebelo: dismetría, ataxia, disartria, hipotonía\"]\n  A --> D[\"Diencéfalo: conciencia y funciones vegetativas\"]\n  A --> M[\"Mesencéfalo y médula: ojos, cara flácida, funciones vitales\"]","pie":"Asocia cada estructura con su signo más característico; así resolverás rápido las preguntas de localización."},{"tipo":"figura","pagina":29,"pie":"Componentes del diencéfalo en corte sagital: tálamo (óptico), epitálamo, hipotálamo y subtálamo. Observa su posición central, por encima del tronco del encéfalo.","src":"img/fisioterapia-neurologica-t2-tema-2-introduccion-a-la-fisioterapia-neurologica-p29.jpg"},{"tipo":"alerta","texto":"**Afasia ≠ disartria.** Según Ratliffe, la **afasia** aparece en la lesión **parietal** y en la **temporal**; en la frontal se habla de *déficit de lenguaje*, en coherencia con su función de *lenguaje expresivo*. La **disartria** (incapacidad para formar o articular palabras) es **cerebelosa**. Ojo también: el cerebelo da **hipotonía**, no espasticidad."},{"tipo":"definicion","termino":"Atopognosia","texto":"Incapacidad para **localizar estímulos táctiles**. Es un signo de lesión **parietal**. En la diapositiva aparece escrito como «atopgnosia»."},{"tipo":"perla","texto":"Las lesiones del tronco (mesencéfalo y médula) y del diencéfalo afectan a la **conciencia** y a las **funciones vitales**. Ante un paciente con alteración de la conciencia o inestabilidad respiratoria o vasomotora, aplica la regla de oro: monitoriza y coordínate con el equipo médico antes de intervenir."}]},{"id":"exploracion","titulo":"Exploración básica: trofismo y reflejos","bloques":[{"tipo":"tabla","titulo":"Exploración del trofismo","columnas":["Método","Qué se explora"],"filas":[["**Inspección**","Coloración de la piel y alteraciones cutáneas: atrofia, hipertrofia, úlceras, alteraciones vasculares, etc."],["**Palpación**","Textura (**elasticidad y humedad**) y **temperatura** de la piel, **con el dorso de la mano** del examinador. Estado de las articulaciones y deformidades presentes. Estado de la masa muscular, **objetivable midiendo los perímetros** de las extremidades."]]},{"tipo":"tabla","titulo":"Reflejos superficiales y de las mucosas","columnas":["Reflejo","Tipo","Nivel segmentario"],"filas":[["Abdominal superior","Superficial","**D6-D7**"],["Abdominal medio","Superficial","**D8-D9**"],["Abdominal inferior","Superficial","**D10-D12**"],["Plantar","Superficial","**S1-S2**"],["Faríngeo","De las mucosas","No especificado en el temario"],["Corneal","De las mucosas","No especificado en el temario"]]},{"tipo":"figura","pagina":34,"pie":"Esquema de los reflejos cutáneos abdominales con sus niveles: superior D6-D7, medio D8-D9 e inferior D10-D12. Memoriza la secuencia craneocaudal.","src":"img/fisioterapia-neurologica-t2-tema-2-introduccion-a-la-fisioterapia-neurologica-p34.jpg"},{"tipo":"alerta","texto":"El abdominal **inferior abarca tres segmentos (D10-D12)**, mientras que el superior y el medio abarcan dos cada uno. El **plantar es S1-S2**, no L5-S1. El **corneal** y el **faríngeo** son reflejos *de las mucosas*, no cutáneos superficiales."},{"tipo":"perla","texto":"La medición de perímetros permite **cuantificar la atrofia** y seguir su evolución. Mide siempre a la misma distancia de una referencia ósea y compara con el lado contralateral (complemento)."}]},{"id":"actividad-ia","titulo":"Actividad de aula: IA en fisioterapia neurológica","bloques":[{"tipo":"parrafo","texto":"**Objetivo:** fomentar la reflexión crítica sobre el impacto de la inteligencia artificial en la práctica clínica. **Actividad:** debate sobre beneficios y riesgos de implantar la IA en fisioterapia neurológica. Temas: **ética, privacidad de los datos, accesibilidad y necesidad de formación continua**."}]}],"caso_clinico":{"titulo":"Mujer con ictus en fase subaguda","presentacion":"Carmen, 63 años, administrativa, sufrió hace 3 semanas un ictus isquémico izquierdo. Presenta hemiparesia derecha con algo de movilidad activa en la mano y dificultad para expresarse verbalmente. Mantiene la sedestación con supervisión, pero se desestabiliza al girar el tronco y todavía no camina. Tiene hipertensión controlada. Vive con su marido, muy implicado, y su objetivo prioritario es volver a casa y llegar a caminar dentro del domicilio. En la inspección del sacro se aprecia un eritema que no blanquea.","preguntas":[{"pregunta":"¿En qué estado funcional se encuentra Carmen y qué objetivos y tratamientos le corresponden según el temario?","respuesta":"Está en el estado **«paciente con capacidad de sedestación»**. Objetivos: mejorar el **control postural y el equilibrio en sedestación**, facilitar las **transferencias** y **preparar la deambulación**. Tratamientos: **fortalecimiento del tronco**, **entrenamiento del equilibrio** (superficies inestables, desplazamientos controlados) y **transferencias cama ↔ silla de ruedas**. El eritema sacro obliga a mantener la **prevención de complicaciones** (UPP) propia del paciente encamado mediante posicionamiento y cambios posturales."},{"pregunta":"¿Qué técnicas del temario están indicadas en su caso y por qué?","respuesta":"Todas las que recogen el **ictus** entre sus aplicaciones: **FNP**, **Bobath**, **Perfetti** y **CIMT**. La CIMT es especialmente pertinente porque conserva **movilidad activa en la mano**: restringir el miembro sano fuerza el uso del afectado y aprovecha la **plasticidad cerebral**. Además pueden usarse ejercicios terapéuticos, terapia manual y terapia ocupacional (aplicables a todas las patologías neurológicas). La **realidad virtual** puede apoyar el equilibrio y, más adelante, la marcha."},{"pregunta":"¿Qué factores condicionan la elección del tratamiento y qué papel debe tener su marido?","respuesta":"Según el temario: **patología** (ictus con hemiparesia y déficit de lenguaje expresivo, compatible con afectación frontal), **fase subaguda** (condiciona la intensidad y el tipo de tratamiento), **edad y condiciones generales** (63 años, HTA controlada: buena capacidad de respuesta previsible) y **objetivos del paciente y de la familia** (volver a casa y caminar). El fisioterapeuta debe **adiestrar a la familia** en el manejo de Carmen (transferencias seguras, posicionamiento) y orientar hacia la **reinserción** dentro del equipo multidisciplinar. Todo ello sin progresar más deprisa de lo que permita su seguridad, según la **regla de oro**."}]},"glosario":[{"termino":"Neurorrehabilitación","definicion":"Sinónimo de fisioterapia neurológica o fisioterapia del sistema nervioso."},{"termino":"Plasticidad cerebral","definicion":"Capacidad del cerebro para reorganizarse y formar nuevas conexiones neuronales; base de la recuperación funcional."},{"termino":"UPP","definicion":"Úlceras por presión; complicación que hay que prevenir, sobre todo en el paciente encamado."},{"termino":"Afasia","definicion":"Alteración del lenguaje (oral, escrita o mixta); en la tabla de Ratliffe aparece en las lesiones parietal y temporal."},{"termino":"Apraxia","definicion":"Incapacidad para llevar a cabo un movimiento complejo o habilidoso; lesión parietal."},{"termino":"Atopognosia","definicion":"Incapacidad para localizar estímulos táctiles; lesión parietal."},{"termino":"Dismetría","definicion":"Falta de cálculo en los movimientos; signo cerebeloso."},{"termino":"Disartria","definicion":"Incapacidad para formar o articular palabras; signo cerebeloso."},{"termino":"Ataxia","definicion":"Falta de coordinación del movimiento; signo cerebeloso."},{"termino":"Nistagmo","definicion":"Movimientos oculares rítmicos involuntarios; aparece en la lesión cerebelosa."},{"termino":"CIMT","definicion":"Terapia de restricción inducida del movimiento: restringe el miembro sano para forzar el uso del afectado; aplicación: ictus."},{"termino":"FNP","definicion":"Facilitación neuromuscular propioceptiva: estímulos sensoriales para facilitar el movimiento y la fuerza."},{"termino":"Neuromodulación","definicion":"Modificación de la actividad nerviosa; finalidad de la electroterapia según el temario."},{"termino":"Trofismo","definicion":"Estado nutricional de los tejidos (piel, músculo, articulaciones); se explora por inspección y palpación."},{"termino":"Sedestación","definicion":"Posición sentada; segundo estado funcional en la progresión terapéutica."}],"fuentes":["Ratliffe KT. Clinical Pediatric Physical Therapy.","Universidad Europea. Tema 2: Introducción a la Fisioterapia Neurológica (Villarón C, Herrmann C, Chimeno A, Sirvent MÁ, Izquierdo R)."],"qcm":[{"pregunta":"Tras una lesión cortical, un paciente percibe que le tocan el antebrazo, pero no sabe señalar en qué punto exacto. Según la tabla de Ratliffe del temario, ¿qué signo presenta y a qué estructura se atribuye?","opciones":["Apraxia, por lesión del lóbulo parietal","Atopognosia, por lesión del lóbulo parietal","Agnosia sensorial, por lesión del lóbulo temporal","Dismetría, por lesión del hemisferio cerebeloso"],"correcta":1,"explicacion":"La incapacidad para localizar estímulos táctiles es la **atopognosia**. El temario la incluye entre las lesiones del **lóbulo parietal**, cuya función es la apreciación de la sensación y la integración somatosensorial.","por_opcion":["❌ La apraxia también es parietal, pero es la incapacidad para realizar un movimiento complejo o habilidoso, no para localizar un estímulo.","✅ Atopognosia = incapacidad para localizar estímulos táctiles; lesión parietal según Ratliffe.","❌ El temporal se asocia a la incapacidad para interpretar estímulos sensoriales, afasia y disfunción auditiva, no a la localización táctil.","❌ La dismetría es la falta de cálculo en los movimientos, un signo cerebeloso motor, no sensitivo."]},{"pregunta":"Un niño presenta habla mal articulada, tono muscular disminuido y movimientos oculares rítmicos involuntarios. ¿Qué estructura recoge el temario como responsable de este conjunto de signos?","opciones":["Cerebelo","Mesencéfalo y médula","Diencéfalo","Lóbulo temporal"],"correcta":0,"explicacion":"Disartria, hipotonía y nistagmo figuran entre las lesiones del **cerebelo**, junto con dismetría, ataxia, distonía y temblor. El cerebelo refina y coordina todos los movimientos, incluidos el habla y el control del tono.","por_opcion":["✅ El cerebelo agrupa disartria, hipotonía y nistagmo en la tabla de Ratliffe.","❌ Mesencéfalo y médula: afectación oculomotora, musculatura facial flácida y funciones vitales, no disartria con hipotonía global.","❌ El diencéfalo altera la conciencia y las funciones vegetativas (fiebre, somnolencia, trastorno endocrino).","❌ El lóbulo temporal produce afasia (trastorno del lenguaje, no de la articulación) y disfunción auditiva."]},{"pregunta":"Según la tabla de Ratliffe del temario, ¿en qué par de estructuras se cita expresamente el término «afasia» como consecuencia de la lesión?","opciones":["Lóbulo frontal y lóbulo occipital","Lóbulo parietal y lóbulo temporal","Lóbulo frontal y cerebelo","Lóbulo temporal y diencéfalo"],"correcta":1,"explicacion":"El temario cita la **afasia** (oral, escrita o mixta) en el **parietal** y la **afasia** en el **temporal**. En el frontal, cuya función es el lenguaje expresivo, la lesión se describe como «déficit de lenguaje», sin usar el término afasia.","por_opcion":["❌ El frontal recoge «déficit de lenguaje» y el occipital solo déficit visual.","✅ Parietal y temporal son las dos estructuras en las que figura literalmente «afasia».","❌ El cerebelo produce disartria (articulación), no afasia; el frontal no usa el término.","❌ El diencéfalo se asocia a alteraciones de la conciencia y vegetativas, no del lenguaje."]},{"pregunta":"En la exploración, el reflejo cutáneo abdominal periumbilical (medio) está abolido, mientras que el superior y el inferior están conservados. ¿Qué segmentos sugiere afectados el temario?","opciones":["D6-D7","S1-S2","D10-D12","D8-D9"],"correcta":3,"explicacion":"El temario asigna el reflejo abdominal **medio** a **D8-D9**, el superior a D6-D7 y el inferior a D10-D12. La abolición aislada del medio orienta, por tanto, a D8-D9.","por_opcion":["❌ D6-D7 corresponde al reflejo abdominal superior, que está conservado.","❌ S1-S2 es el nivel del reflejo plantar, no de los abdominales.","❌ D10-D12 corresponde al reflejo abdominal inferior, también conservado.","✅ El abdominal medio se integra en D8-D9."]},{"pregunta":"¿Cuál de los siguientes emparejamientos reflejo–clasificación–nivel coincide con lo recogido en el temario?","opciones":["Plantar – superficial cutáneo – S1-S2","Faríngeo – superficial cutáneo – S1-S2","Corneal – superficial cutáneo – D6-D7","Abdominal inferior – de mucosas – D10-D12"],"correcta":0,"explicacion":"El **reflejo plantar** se clasifica como **superficial** y se integra en **S1-S2**. Corneal y faríngeo son **reflejos de las mucosas**, y los abdominales son superficiales.","por_opcion":["✅ Plantar: reflejo superficial, nivel S1-S2.","❌ El faríngeo es un reflejo de las mucosas, y S1-S2 pertenece al plantar.","❌ El corneal es un reflejo de las mucosas, y D6-D7 es el nivel del abdominal superior.","❌ El nivel D10-D12 es correcto, pero el abdominal inferior es superficial, no de mucosas."]},{"pregunta":"Durante la exploración del trofismo de un paciente con lesión neurológica, ¿qué procedimiento se ajusta a lo descrito en el temario?","opciones":["Objetivar la masa muscular mediante la inspección de la coloración","Valorar la temperatura cutánea por palpación con el dorso de la mano","Valorar la temperatura cutánea por palpación con la palma de la mano","Valorar la elasticidad cutánea mediante la inspección de las úlceras"],"correcta":1,"explicacion":"La textura (elasticidad y humedad) y la **temperatura** de la piel se valoran por **palpación con el dorso de la mano** del examinador. La masa muscular se objetiva **midiendo perímetros**, y la coloración y las úlceras se valoran por inspección.","por_opcion":["❌ La masa muscular se objetiva midiendo los perímetros de las extremidades, no por la coloración.","✅ Coincide literalmente con el temario: palpación de la temperatura con el dorso de la mano.","❌ El temario especifica el dorso, no la palma, de la mano del examinador.","❌ La elasticidad forma parte de la textura y se valora por palpación; las úlceras se inspeccionan."]},{"pregunta":"De las siguientes técnicas, ¿cuál tiene en el temario una única aplicación descrita, el ictus?","opciones":["Terapia de restricción inducida del movimiento","Facilitación neuromuscular propioceptiva","Método Perfetti","Método Bobath"],"correcta":0,"explicacion":"La **CIMT** restringe el miembro no afectado para forzar el uso del afectado, y el temario solo le asigna una aplicación: el **ictus**. Las demás técnicas tienen al menos dos aplicaciones.","por_opcion":["✅ CIMT: aplicación exclusiva en el ictus según el temario.","❌ FNP: ictus, lesiones medulares y enfermedades neurodegenerativas.","❌ Perfetti: ictus y lesiones medulares.","❌ Bobath: ictus y parálisis cerebral."]},{"pregunta":"En la consulta de neuropediatría se valora a un niño con parálisis cerebral. De las técnicas recogidas en el temario, ¿cuál incluye expresamente la parálisis cerebral entre sus aplicaciones?","opciones":["Método Bobath","Facilitación neuromuscular propioceptiva","Método Perfetti","Terapia de restricción inducida del movimiento"],"correcta":0,"explicacion":"El **método Bobath**, centrado en la inhibición de patrones de movimiento anormales y la facilitación de movimientos funcionales, es la única técnica del temario que cita la **parálisis cerebral** (junto con el ictus).","por_opcion":["✅ Bobath: ictus y parálisis cerebral.","❌ FNP: ictus, lesiones medulares y enfermedades neurodegenerativas, pero no parálisis cerebral.","❌ Perfetti se aplica a ictus y lesiones medulares.","❌ CIMT: solo ictus."]},{"pregunta":"¿Cuál de las siguientes técnicas NO figura en el temario con la aplicación «todas las patologías neurológicas»?","opciones":["Terapia ocupacional","Terapia manual","Realidad virtual","Ejercicios terapéuticos"],"correcta":2,"explicacion":"Solo **terapia manual, terapia ocupacional y ejercicios terapéuticos** se aplican a todas las patologías neurológicas. La **realidad virtual** tiene aplicaciones concretas: rehabilitación de la marcha, el equilibrio y la coordinación.","por_opcion":["❌ La terapia ocupacional (AVD, independencia y participación) se aplica a todas.","❌ La terapia manual (tejidos blandos, movilidad y dolor) se aplica a todas las patologías neurológicas.","✅ La realidad virtual se limita a marcha, equilibrio y coordinación.","❌ Los ejercicios terapéuticos se aplican a todas las patologías neurológicas."]},{"pregunta":"Según el temario, el grado máximo de funcionalidad que el fisioterapeuta puede lograr depende de varios factores. ¿Cuál de los siguientes NO figura en esa lista?","opciones":["Nivel educativo del paciente","Ambiente sociofamiliar del paciente","Constitución física y psíquica","Colaboración del propio paciente"],"correcta":0,"explicacion":"El temario enumera: nivel y tipo de lesión y complicaciones postlesionales, constitución física y psíquica, edad, colaboración del paciente y ambiente sociofamiliar. El **nivel educativo** no aparece.","por_opcion":["✅ El nivel educativo no es uno de los factores del temario.","❌ El ambiente sociofamiliar figura expresamente en la lista.","❌ La constitución física y psíquica figura en la lista.","❌ La colaboración del paciente figura en la lista."]},{"pregunta":"¿Cuál de los siguientes tratamientos NO forma parte de los que el temario asigna al paciente encamado?","opciones":["Posicionamientos antideformidad","Movilizaciones pasivas articulares","Ejercicios activos asistidos","Equilibrio en superficies inestables"],"correcta":3,"explicacion":"Al paciente encamado le corresponden **movilizaciones pasivas, posicionamientos y ejercicios activos asistidos**. El entrenamiento del equilibrio en **superficies inestables** pertenece al paciente con **capacidad de sedestación**.","por_opcion":["❌ Los posicionamientos favorecen la función y evitan deformidades en el encamado.","❌ Las movilizaciones pasivas mantienen la amplitud articular en el encamado.","❌ Los ejercicios activos asistidos están incluidos en el paciente encamado.","✅ El equilibrio en superficies inestables es un tratamiento del paciente en sedestación."]},{"pregunta":"Según el temario, ¿a qué estado funcional corresponde específicamente el objetivo «preparar para la deambulación»?","opciones":["Paciente con alta discapacidad","Paciente con capacidad de deambulación","Paciente encamado","Paciente con capacidad de sedestación"],"correcta":3,"explicacion":"«Preparar para la deambulación» es un objetivo del **paciente con capacidad de sedestación**, junto con el control postural y las transferencias. El encamado tiene como objetivo prepararse para la posición sentada y de pie.","por_opcion":["❌ En la alta discapacidad se busca la independencia máxima, la calidad de vida del cuidador y la prevención de complicaciones.","❌ En la deambulación ya se trabaja la marcha: velocidad, seguridad, eficiencia y resistencia.","❌ En el encamado el objetivo es la preparación para la posición sentada y de pie, no para la marcha.","✅ Sedestación: control postural, transferencias y preparación de la deambulación."]},{"pregunta":"¿En qué estado funcional sitúa el temario el objetivo de mejorar la calidad de vida del paciente y de su cuidador, junto con el uso de grúas?","opciones":["Paciente con capacidad de deambulación","Paciente encamado","Paciente con alta discapacidad","Paciente con capacidad de sedestación"],"correcta":2,"explicacion":"El **paciente con alta discapacidad** tiene como objetivos maximizar la independencia, mejorar la calidad de vida **del paciente y del cuidador** y prevenir complicaciones. Sus tratamientos son la adaptación del entorno, las **ayudas técnicas (sillas de ruedas, grúas)** y el entrenamiento de los cuidadores.","por_opcion":["❌ En la deambulación las ayudas técnicas son andadores o bastones, y el cuidador no figura en los objetivos.","❌ En el encamado los tratamientos son movilizaciones pasivas, posicionamientos y activos asistidos.","✅ Alta discapacidad: calidad de vida del paciente y del cuidador, grúas y entrenamiento de cuidadores.","❌ En la sedestación se entrenan las transferencias, pero el cuidador no forma parte de los objetivos."]},{"pregunta":"Entre los factores que influyen en la elección del tratamiento, ¿qué determina, según el temario, la fase de la enfermedad (aguda, subaguda o crónica)?","opciones":["Las expectativas y metas del paciente y su entorno","La capacidad de respuesta del paciente al tratamiento","La intensidad y el tipo de tratamiento que se aplica","Los déficits funcionales y las estrategias terapéuticas"],"correcta":2,"explicacion":"El temario indica que la **fase aguda, subaguda o crónica** influye en la **intensidad y el tipo de tratamiento**. Cada uno de los demás factores (patología, edad y condiciones generales, objetivos) determina un aspecto distinto.","por_opcion":["❌ Las expectativas y metas corresponden a los objetivos del paciente y de su familia.","❌ La capacidad de respuesta depende de la edad y las condiciones generales.","✅ La fase de la enfermedad condiciona la intensidad y el tipo de tratamiento.","❌ Los déficits funcionales y las estrategias los determina la patología."]},{"pregunta":"Un paciente presenta somnolencia, episodios de ausencia, fiebre sin foco, pérdida de peso, pérdida de libido y un trastorno endocrino. Según Ratliffe, ¿qué estructura está más probablemente lesionada?","opciones":["Lóbulo frontal","Lóbulo occipital","Mesencéfalo y médula","Diencéfalo (tálamo e hipotálamo)"],"correcta":3,"explicacion":"El **diencéfalo** controla funciones vitales involuntarias (presión sanguínea, ira, temperatura, sueño). Su lesión produce alteración de la conciencia y de las funciones vegetativas: somnolencia, coma, ausencia, pérdida de peso, fiebre, pérdida de libido y desorden endocrino.","por_opcion":["❌ Frontal: cambios de personalidad, alteración intelectual, memoria, lenguaje y motricidad.","❌ Occipital: déficit visual o disminución visual funcional.","❌ Mesencéfalo y médula: movimientos oculares, musculatura facial flácida, respiración y control vasomotor.","✅ El cuadro reproduce literalmente las consecuencias de la lesión diencefálica."]}],"asignatura":"Fisioterapia neurológica","tema":2,"fecha":"2026-11-04"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const L = 'ABCD';
const secs = F.secciones || [];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="tarjetas">${(b.items||[]).map(t=>`<div class="tarjeta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="def"><b>${md(b.termino)}</b> — ${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota perla"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota alerta"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${md(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const nav = secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`).join('') + (F.caso_clinico?'<a href="#caso">Caso clínico</a>':'') + (F.glosario?.length?'<a href="#glosario">Glosario</a>':'') + `<a class="qcm" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`;

document.getElementById('app').innerHTML = `
<header class="portada"><div class="envoltura">
  <div class="etiquetas">${F.asignatura?`<span class="etiqueta">${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="etiqueta o">Tema ${esc(F.tema)}</span>`:''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="meta">${F.tipo==='grand-qcm'?`<div><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div><b>${secs.length}</b><span>secciones</span></div><div><b>${(F.ideas_clave||[]).length}</b><span>ideas clave</span></div>`}<div><b>${(F.qcm||[]).length}</b><span>preguntas</span></div><div id="ultimo"></div></div>
</div></header>
<nav class="indice" aria-label="Índice"><div class="envoltura">${nav}</div></nav>
<main class="envoltura">
  ${(F.objetivos||[]).length?`<div class="dos">
    <div class="caja"><h3>Objetivos</h3><ul>${(F.objetivos||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>
    <div class="caja"><h3>Lo que hay que saber</h3><ol class="claves">${(F.ideas_clave||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>
  </div>`:''}
  ${F.tipo==='grand-qcm'&&(F.fichas||[]).length?`<div class="caja" style="margin-top:40px"><h3>Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="num">Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd>`).join('')}</dl></section>`:''}
  <section id="qcm"><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="envoltura">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* ---------- esquemas ---------- */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:oscuro?'dark':'neutral',fontFamily:'Spectral, Georgia, serif',flowchart:{htmlLabels:true,curve:'basis'}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* ---------- QCM ---------- */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u) document.getElementById('ultimo').innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; }catch(e){} }
ultimo();
const marco = document.getElementById('marco');

function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${(pos)/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="etiqueta o" style="display:inline-block;margin-bottom:12px">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="btn sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="btn" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'Dominado. Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'Bien, pero repasa las preguntas falladas.':'Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="btn" id="rep">Repetir todo</button>${fallos.length?'<button class="btn sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
