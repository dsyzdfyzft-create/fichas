<style>
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;

*,*::before,*::after{box-sizing:inherit}

a{color:var(--acento-tinta)}
b,strong{font-weight:700}

.env{max-width:860px;margin:0 auto;padding:0 22px}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}

.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}

.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}

/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}

nav.indice .env::-webkit-scrollbar{display:none}

nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}

figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}

.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}

.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}

.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}

.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}

dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}

dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}

@media print{
  @page{margin:14mm}

  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}

  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}

<script id="datos" type="application/json">{"titulo":"Tema 3. Valoración de la marcha y tipos de marcha patológica","subtitulo":"Del ciclo normal de la marcha (fases, parámetros y mecanismos de ahorro energético) al reconocimiento clínico de las marchas patológicas neurológicas y la elección de ayudas técnicas.","objetivos":["Al terminar, sabrás describir el ciclo de la marcha con sus fases, periodos y porcentajes, y cómo los modifica la velocidad.","Al terminar, sabrás medir e interpretar los parámetros observables de la marcha y explicar el doble movimiento sinusoidal del centro de gravedad.","Al terminar, sabrás relacionar cada nivel de lesión neurológica (piramidal, ganglios basales, cerebelo, médula, unidad motora, músculo) con sus déficits motores en miembros inferiores.","Al terminar, sabrás reconocer y diferenciar las marchas patológicas estereotipadas (segador, Geisha, tijera, cerebelosa, tabética, vestibular, parkinsoniana, coreica, distónica, medular, estepaje y Duchenne).","Al terminar, sabrás seleccionar y adaptar una ayuda técnica según la evaluación del paciente y planificar su retirada progresiva."],"ideas_clave":["**Ciclo de la marcha** = actividad de una extremidad entre dos contactos consecutivos del talón del mismo pie: **apoyo 60%** + **oscilación 40%**.","Apoyo: choque de talón **15%**, apoyo plantar, apoyo medio **15%**, despegue de talón **25%** (el más largo), despegue de antepié **5%**. Oscilación: aceleración **10%**, balanceo medio **80%**, desaceleración **10%** de la fase.","A **mayor velocidad**, **menor tiempo de apoyo** y **menor tiempo de doble apoyo**.","El centro de gravedad (delante de **S2**) está fuera de la base de apoyo el **80%** del tiempo y describe un **doble movimiento sinusoidal** (lateral y vertical); su aplanamiento indica patología o envejecimiento.","**Romberg**: **negativo** en la marcha cerebelosa (ebrio) y **positivo** en la tabética (cordones posteriores, taloneante, mira sus pies).","Lesión corticoespinal **unilateral** → marcha en **segador**; **bilateral** → **Geisha** (rodillas en extensión, equino, puntillas) o **tijera** (rodillas en ligera flexión y aducción).","Déficit de **glúteo medio**: **Trendelenburg** = cae la pelvis del **lado sano**; **Duchenne** = el tronco se desvía hacia el **lado de apoyo**.","Lesión medular: >C7 sin marcha; C7-D6 semipéndulo; D6-D12 péndulo; \u003cD12 cuatro puntos (todas con bitutores); L4 con ortesis antiequinas; S1-S2 sin ortesis."],"secciones":[{"id":"introduccion","titulo":"Introducción: definición, desarrollo y control de la marcha","bloques":[{"tipo":"definicion","termino":"Marcha humana","texto":"Proceso de locomoción en el que el cuerpo, en **posición erguida**, se mueve hacia delante, siendo su peso **soportado alternativamente por ambas piernas**. Es un fenómeno de extrema complejidad."},{"tipo":"definicion","termino":"Marcha normal","texto":"Serie de movimientos **alternantes y rítmicos** de extremidades y tronco que determinan un **desplazamiento hacia delante del centro de gravedad** con un **mínimo gasto de energía**. El centro de gravedad se sitúa **delante de la 2ª vértebra sacra** (punto medio entre ambas coxofemorales)."},{"tipo":"tabla","titulo":"Adquisición de la marcha","columnas":["Edad","Hito"],"filas":[["8 meses","Bipedestación inducida"],["10 meses","Bipedestación espontánea"],["12 meses","Marcha con ayuda"],["14-15 meses","Marcha independiente"],["7 años","Patrón de marcha adulto"],["≈15 años","Parámetros relacionados con la estatura"]]},{"tipo":"perla","texto":"La **valoración comienza cuando el paciente entra en la consulta**: observa la marcha espontánea antes de que el paciente sepa que lo estás evaluando; es la más fiel a su patrón real."},{"tipo":"parrafo","texto":"La marcha exige la **integración de múltiples sistemas**: control postural y **equilibrio dinámico**, modulación del movimiento coordinando extremidades y tronco, e **integración neuromuscular**. Participan las **aferencias sensitivas** (oído, vista, sentido espacial, orientación), las **áreas motoras corticales** (corteza motora primaria, premotora y área motora suplementaria), el tronco del encéfalo, los núcleos diencefálicos, los ganglios basales, el cerebelo, la médula espinal, la unidad motora y el músculo. Una lesión en cualquier eslabón produce un patrón de marcha característico, que es la base de este tema."},{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Control proactivo del movimiento","texto":"Por **anticipación** (contrarresta las perturbaciones generadas por los propios movimientos de la marcha) y por **experiencia** (permite **predecir** causas potenciales de desequilibrio)."},{"etiqueta":"2","titulo":"Control reactivo de la estabilidad","texto":"Depende de las **aferencias sensoriales**: permite reaccionar ante **alteraciones inesperadas** del equilibrio."},{"etiqueta":"3","titulo":"Coordinación muscular","texto":"Coordinación de los diferentes grupos musculares en acción."}]},{"tipo":"alerta","texto":"No confundas **proactivo** (anticipación/experiencia, perturbaciones previsibles) con **reactivo** (aferencias sensoriales, perturbaciones inesperadas). Es pregunta típica."},{"tipo":"parrafo","texto":"**Patrón básico**: uso alternante de los MMII con desplazamiento contrario de los MMSS (brazo izquierdo-pierna derecha; brazo derecho-pierna izquierda). **Factores de eficacia** para una marcha funcional: **desenvoltura y seguridad** (base de la eficacia: caminar seguro por terrenos variados, con o sin carga), **facultad de adaptación** (reacción rápida ante obstáculos, cambios de dirección y sentido, reequilibrio) y **velocidad y resistencia** (definen la marcha normal y varían con sexo, edad, altura, peso)."}]},{"id":"ciclo-marcha","titulo":"El ciclo de la marcha y sus fases","bloques":[{"tipo":"definicion","termino":"Ciclo de la marcha","texto":"Secuencia de acciones de **una pierna** desde una posición inicial hasta volver a ella: actividad de una extremidad inferior **entre dos contactos consecutivos del talón con el suelo realizados con el mismo pie**."},{"tipo":"esquema","titulo":"Fases y periodos del ciclo","mermaid":"flowchart LR\n  C[\"Ciclo de la marcha 100%\"] --> A[\"Apoyo 60%\"]\n  C --> O[\"Oscilación 40%\"]\n  A --> A1[\"Choque de talón 15%\"]\n  A --> A2[\"Apoyo plantar\"]\n  A --> A3[\"Apoyo medio 15%\"]\n  A --> A4[\"Despegue de talón 25%\"]\n  A --> A5[\"Despegue de antepié 5%\"]\n  O --> O1[\"Aceleración 10% de la fase\"]\n  O --> O2[\"Balanceo medio 80% de la fase\"]\n  O --> O3[\"Desaceleración 10% de la fase\"]","pie":"Los porcentajes del apoyo se expresan sobre la marcha; los de la oscilación, sobre la propia fase de oscilación. El apoyo plantar no tiene cifra en el temario."},{"tipo":"tabla","titulo":"Periodos del ciclo de la marcha","columnas":["Fase","Periodo","Inicio / acontecimiento","Duración"],"filas":[["Apoyo (60%)","Choque o apoyo del talón","El talón de la extremidad delantera contacta con el suelo","15%"],["Apoyo","Apoyo plantar","La planta contacta con el suelo y soporta el peso corporal","—"],["Apoyo","Apoyo medio","Pierna y cuerpo avanzan sobre el pie; el CG se desplaza hacia delante","15%"],["Apoyo","Despegue del talón","El talón empieza a despegarse; impulso ascendente","25%"],["Apoyo","Despegue del antepié","Termina cuando los dedos pierden contacto con el suelo","5%"],["Oscilación (40%)","Oscilación inicial o aceleración","Los dedos dejan de tocar el suelo","10% de la fase"],["Oscilación","Balanceo medio","La pierna oscilante avanza cruzando la vertical","80% de la fase"],["Oscilación","Desaceleración","Frenado y preparación para el apoyo del talón","10% de la fase"]]},{"tipo":"alerta","texto":"Trampa de cálculo: el balanceo medio es el 80% **de la oscilación**, no del ciclo. Sobre el ciclo completo supone ≈**32%** (0,8 × 40%). Aceleración y desaceleración ≈4% del ciclo cada una."},{"tipo":"figura","pagina":15,"pie":"Secuencia de los cinco periodos de la fase de apoyo: fíjate en la progresión talón → planta → apoyo medio → despegue de talón → despegue de antepié y en cómo la pierna pasa de oblicua anterior a oblicua posterior.","src":"img/fisioterapia-neurologica-t3-tema-3-valoracion-de-la-marcha-y-tipos-de-marcha-patologica-p15.jpg"},{"tipo":"parrafo","texto":"La duración de cada fase **depende de la velocidad**: a **mayor velocidad, menor tiempo de apoyo** y **menor tiempo de doble apoyo** (periodo en que ambas extremidades contactan con el suelo, presente en la marcha normal). La desaparición del doble apoyo marca el paso a la carrera (complemento)."},{"tipo":"tabla","titulo":"Parámetros observables de la marcha","columnas":["Parámetro","Definición"],"filas":[["Amplitud del paso sencillo (E)","Distancia entre los centros de ambas huellas de los pies"],["Amplitud del paso doble (D)","Distancia entre 2 huellas consecutivas del mismo pie"],["Anchura del paso (AP)","Separación lateral entre las huellas"],["Ángulo bipodal (BP)","Ángulo entre la línea de progresión de la marcha y el eje longitudinal de la huella del pie"]]},{"tipo":"figura","pagina":21,"pie":"Esquema de huellas con los cuatro parámetros: paso sencillo (flecha azul), paso doble (flecha naranja), anchura de paso AP (flecha verde) y ángulo bipodal BP (arco rojo).","src":"img/fisioterapia-neurologica-t3-tema-3-valoracion-de-la-marcha-y-tipos-de-marcha-patologica-p21.jpg"},{"tipo":"parrafo","texto":"El **centro de gravedad** se desplaza **de izquierda a derecha** por el apoyo unipodal alternativo y **arriba y abajo** por el periodo oscilante alternativo, describiendo un **doble movimiento sinusoidal**. Su **aplanamiento** aparece por alteración del patrón normal, **envejecimiento normal** o alteraciones neurológicas."},{"tipo":"perla","texto":"Una marcha con CG muy plano (sin oscilaciones) y en bloque orienta a patología (p. ej., parkinsoniana) o a envejecimiento; una amplitud lateral exagerada sugiere base amplia (cerebelosa, tabética) o compensaciones como las oscilaciones de tronco de la marcha en tijera."}]},{"id":"optimizacion-energia","titulo":"Mecanismos de optimización y transferencia de energía","bloques":[{"tipo":"parrafo","texto":"Como el CG no se mueve de forma rectilínea sino sinuosa, existen cambios de energía. Para una marcha eficaz se describen **6 mecanismos** que suavizan esa trayectoria (conocidos clásicamente como determinantes de la marcha de Saunders, complemento). **Si se pierde cualquiera de ellos, aumenta el gasto energético**."},{"tipo":"lista","items":["**Rotación pélvica** (plano transversal)","**Inclinación pélvica** (plano frontal)","**Flexión de rodilla**","**Contacto mediante el talón**","**Despegue mediante el antepié**","**Ligera angulación fisiológica en valgo de la rodilla**"]},{"tipo":"parrafo","texto":"**Acción de los MMSS**: los brazos se impulsan en sentido opuesto a las piernas (pierna derecha adelante → brazo izquierdo adelante). Es una **acción refleja** que **equilibra la rotación de la pelvis** y, al disociar cintura escapular y pélvica, contribuye a la **elongación del tronco**. Si el braceo se impide, la parte inferior del tronco tiende a rotar en la misma dirección que la pelvis, generando tensión y dificultando la marcha. La **flexión máxima de hombro y codo** coincide con el **apoyo del talón del pie opuesto**; la **extensión máxima**, con el **apoyo del talón del mismo lado**."},{"tipo":"tabla","titulo":"Análisis anatómico por fases","columnas":["Segmento","Fase de apoyo","Fase de oscilación"],"filas":[["Columna y pelvis","Pelvis rota hacia el lado del apoyo y columna hacia el contrario; inclinación lateral de la pierna de apoyo","La pelvis rota en sentido contrario a la pierna de apoyo y a la columna"],["Cadera","Extensión","Flexión; rotación externa (por la rotación pélvica); abducción al comienzo y al final de la fase"],["Rodilla","Ligera flexión en el contacto, extensión hasta el despegue del talón, y flexión para el impulso","Flexión en la primera mitad, extensión en la segunda"],["Tobillo y pie","Flexión plantar seguida de dorsiflexión","Dorsiflexión (evita la flexión plantar)"]]},{"tipo":"perla","texto":"La **dorsiflexión en oscilación** es la que permite que el pie no arrastre: si falla (tibial anterior débil, equino espástico) aparecen estepaje o circunducción, ambos con mayor gasto energético."}]},{"id":"factores-marcha","titulo":"Factores que intervienen en la marcha","bloques":[{"tipo":"lista","items":["**Factores intrínsecos**: dimensiones y configuración de los huesos; restricción de movimientos articulares; distribución de la masa de los miembros."]},{"tipo":"tabla","titulo":"Influencia de la edad","columnas":["Marcha del niño","Marcha del anciano"],"filas":[["Menor longitud de paso y velocidad","Disminución de la longitud del paso"],["Mayor anchura relativa del apoyo","Reducción total del rango de flexoextensión de cadera"],["Contacto inicial con el pie completo en lugar del talón","Reducción de la flexión de rodilla en la oscilación"],["Escasa flexión de rodilla en la fase de apoyo","Reducción de la flexión plantar del tobillo en el despegue"],["Postura en rotación externa del MI","Condicionada por debilidad, patologías, osteoartritis degenerativa"],["Ausencia de braceo recíproco","Cambios significativos entre los **60 y 70 años**"]]},{"tipo":"alerta","texto":"Rodilla: en el **niño** falta flexión en el **apoyo**; en el **anciano** falta flexión en la **oscilación**. Es la diferencia fina más preguntada."},{"tipo":"parrafo","texto":"**Calzado**: el tacón aumenta la flexión plantar (según su altura), provoca flexión de rodilla y **aumenta la lordosis lumbar** (lumbalgias). Un tacón de **4-5 cm** puede ser beneficioso al repartir mejor las cargas entre retropié y antepié."}]},{"id":"mecanismos-patologicos","titulo":"Mecanismos patológicos de la marcha","bloques":[{"tipo":"parrafo","texto":"Causas de marcha patológica: **estructurales** (longitud anormal, deformidad ósea), **articulares y de tejidos blandos** (contracturas) y **neuromusculares** (músculo, SNC y SNP). Se manifiestan en la fase postural (apoyo) y en la de oscilación."},{"tipo":"tabla","titulo":"Alteraciones en fase postural y de oscilación","columnas":["Mecanismo","Ejemplo / resultado"],"filas":[["Debilidad de tibial anterior (L4)","Marcha de **pie caído**"],["Debilidad de glúteo medio (L5)","Marcha con **inclinación en abducción**"],["Debilidad de gemelos y sóleo (S1-S2)","Marcha de **pie plano**"],["Inestabilidad","Base de sustentación **> 10 cm** (p. ej., cerebelosos); rodillas inestables por luxación rotuliana, meniscopatías, ligamentos laterales"],["Dolor","Marcha antiálgica: espolón calcáneo, calzado, primer dedo rígido"],["Articulaciones fusionadas","Tobillo, rodilla o cadera artrodesados alteran la marcha"],["Discrepancia de longitud de MMII","Asimetría del patrón"]]},{"tipo":"parrafo","texto":"Los trastornos de la marcha son **uno de los principales objetivos del tratamiento neurológico** por su frecuencia y repercusión: elevada **morbimortalidad por caídas** (sobre todo en **mayores de 65 años**, más aún con patología neurológica), empeoramiento del estado basal, gran repercusión socioeconómica y pérdida de **autonomía e independencia funcional** (aislamiento social, peor calidad de vida). Por eso la rehabilitación de la marcha es fundamental en fisioterapia neurológica."}]},{"id":"deficits-lesion","titulo":"Déficits motores en MMII según la lesión neurológica","bloques":[{"tipo":"tabla","titulo":"Síndromes motores por nivel lesional","columnas":["Lesión","Signos"],"filas":[["Vía corticoespinal (síndrome piramidal)","Hipertonía espástica, hiperreflexia, clonus, signo de Babinski, sincinesias"],["Ganglios basales","Síndrome rigidoacinético (temblor, acinesia, bradicinesia, bloqueos, festinación, alteración de reflejos posturales); movimientos involuntarios: temblor de actitud o acción, corea, impersistencia motora, distonía, atetosis"],["Cerebelo","Dismetría, disdiadococinesia, nistagmo, disartria, temblor intencional, alteración del equilibrio y del tono"],["Médula: haz corticoespinal","Babinski, espasticidad; clínica sensitiva y vegetativa; signos segmentarios de asta anterior"],["Médula: cordones posteriores","Ataxia sensorial: alteración de la sensibilidad profunda, arreflexia, signo de Romberg"],["Unidad motora (asta anterior, nervio, unión NM)","Hipotonía, hipo/arreflexia, atrofia, fasciculaciones, miotonías, calambres"],["Músculo","Atrofia (lo más frecuente); a veces hipertrofia o seudohipertrofia, fibrosis, retracciones, mialgias; reflejos y sensibilidad conservados salvo fases muy avanzadas"]]},{"tipo":"alerta","texto":"El PDF recoge **hiporreflexia** en la lesión medular del haz corticoespinal: se explica por la afectación **segmentaria de la motoneurona del asta anterior** a nivel de la lesión (y por la fase de shock medular, complemento); por debajo, lo esperable es el patrón piramidal (hiperreflexia)."},{"tipo":"tarjetas","items":[{"etiqueta":"2ª MN","titulo":"Lesión pura de motoneurona","texto":"**Sin trastornos sensitivos**."},{"etiqueta":"Nervio","titulo":"Nervio periférico","texto":"Déficit motor **con trastornos sensitivos y dolor**."},{"etiqueta":"UNM","titulo":"Unión neuromuscular","texto":"**Debilidad y fatiga** con reflejos y sensibilidad **preservados** y atrofia muy leve o ausente."}]},{"tipo":"esquema","titulo":"Del nivel lesional al patrón de marcha","mermaid":"flowchart TD\n  L[\"Lesión neurológica\"] --> P[\"Vía corticoespinal\"]\n  L --> G[\"Ganglios basales\"]\n  L --> CB[\"Cerebelo\"]\n  L --> CP[\"Cordones posteriores\"]\n  L --> V[\"Sistema vestibular\"]\n  L --> UM[\"Unidad motora y músculo\"]\n  P -->|\"unilateral\"| P1[\"Marcha en segador\"]\n  P -->|\"bilateral\"| P2[\"Geisha o tijera\"]\n  G --> G1[\"Parkinsoniana, coreica, distónica\"]\n  CB --> C1[\"Marcha de ebrio\"]\n  CP --> CP1[\"Marcha tabética\"]\n  V --> V1[\"Marcha en estrella\"]\n  UM --> U1[\"Estepaje o Duchenne\"]","pie":"Mapa mental para relacionar la topografía de la lesión con el patrón estereotipado de marcha."}]},{"id":"marchas-patologicas","titulo":"Características de las principales marchas patológicas neurológicas","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"1a","titulo":"Marcha en segador (guadaña)","texto":"Lesión **unilateral** de corteza motora o vía corticoespinal (**ACV, esclerosis múltiple**). Hipertonía extensora: cadera y rodilla en extensión rígida, flexión de rodilla inhibida, **pie equino**; semicírculo en cada paso. Compensa con **elevación de pelvis, inclinación del tronco hacia el lado sano y abducción de cadera**. Contacto con **borde externo del antepié** y dedos flexionados, apoyo muy reducido, menos carga en la pierna afecta, braceo perdido (brazo pegado). **Pierna sana**: más tiempo de apoyo y paso más corto. Gran gasto energético y fatiga precoz."},{"etiqueta":"1b","titulo":"Marcha espástica de Geisha","texto":"Lesión **bilateral** corticoespinal (EM, mielopatía cervical, siringomielia, ELA, diplejía espástica infantil, compresiones medulares). Hipertonía en MMII, **rodillas en extensión**, **pies en equino**, pasos lentos y cortos **sobre la punta** (desgaste del zapato en puntera)."},{"etiqueta":"1c","titulo":"Marcha en tijera","texto":"Lesión **bilateral** corticoespinal. **Rodillas en ligera flexión y aducción** por gran hipertonía de aductores; pasos cortos, rodillas pegadas, **cruzando las piernas**; **oscilaciones laterales del tronco** para avanzar. Gran esfuerzo y fatiga."}]},{"tipo":"figura","pagina":50,"pie":"Marcha en segador: observa la flecha de circunducción del pie afecto en cada paso y la inclinación compensadora del tronco.","src":"img/fisioterapia-neurologica-t3-tema-3-valoracion-de-la-marcha-y-tipos-de-marcha-patologica-p50.jpg"},{"tipo":"tabla","titulo":"Ataxias de la marcha: diagnóstico diferencial","columnas":["Rasgo","Cerebelosa (ebrio)","Tabética (taloneante)","Vestibular (estrella o brújula)"],"filas":[["Lesión","Cerebelo","Cordones posteriores (sensibilidad profunda)","Sistema vestibular (laberinto)"],["Base","Marcadamente aumentada","Aumentada","Inestable con desviación"],["Rasgo típico","Piernas separadas, brazos apartados, pasos cortos inestables, zig-zag, oscila a un lado","Eleva las piernas, talonea, cuerpo ligeramente flexionado, **se mira los pies**","Desviación y caída hacia el **mismo lado de la lesión**"],["Caída","Tendencia hacia atrás","Empeora sin control visual","Hacia el lado lesionado"],["Prueba","**Romberg negativo**","**Romberg positivo**","**Marcha en estrella positiva**"],["Etiología","Vascular, infecciosa, EM, tóxico-metabólica (alcohol, fármacos, hipotiroidismo), degenerativa, ataxia congénita, tumoral","EM (lesiones focales), neurosífilis, déficit de vitamina B, polineuritis sensitiva, Guillain-Barré","Afectación laberíntica"]]},{"tipo":"esquema","titulo":"Algoritmo ante una marcha atáxica","mermaid":"flowchart TD\n  A[\"Marcha inestable de base amplia\"] --> Q{\"Desviación sistemática a un lado\"}\n  Q -->|\"sí\"| V[\"Sospecha vestibular\"]\n  V --> V2[\"Estrella positiva, cae al lado lesionado\"]\n  Q -->|\"no\"| R{\"Signo de Romberg\"}\n  R -->|\"negativo\"| CB[\"Marcha cerebelosa\"]\n  CB --> CB2[\"Zig-zag, cae hacia atrás\"]\n  R -->|\"positivo\"| T[\"Marcha tabética\"]\n  T --> T2[\"Taloneo y mira los pies\"]","pie":"Esquema didáctico simplificado: la clave del temario es Romberg negativo en la cerebelosa y positivo en la tabética."},{"tipo":"figura","pagina":63,"pie":"Marcha tabética: elevación exagerada de la pierna, flexión ligera del tronco, mirada a los pies y apoyo brusco con el talón (flecha).","src":"img/fisioterapia-neurologica-t3-tema-3-valoracion-de-la-marcha-y-tipos-de-marcha-patologica-p63.jpg"},{"tipo":"alerta","texto":"Romberg valora el **déficit propioceptivo**: el cerebeloso es inestable con ojos abiertos y cerrados (Romberg **negativo**); el tabético compensa con la vista y se cae al cerrarlos (**positivo**)."},{"tipo":"parrafo","texto":"**Marcha parkinsoniana**. Etiología: síndromes rigidoacinéticos, Parkinson, lesión vascular de ganglios basales, demencias, lesiones frontales o del cuerpo calloso, hematoma subdural crónico (en el PDF, *subluxal*), fármacos antidopaminérgicos. Rasgos: **flexión de tronco**, pasos **muy cortos, lentos y torpes**, apoyo inicial **con la planta o dedos-talón** (no talón-dedos), oscilación reducida (arrastra los pies, muy juntos), **braceo disminuido asimétrico**, marcha **en bloque sin disociación de cinturas**, dificultad para transferir peso, **festinación** (pasos cada vez más cortos y rápidos), **congelación** (pies *pegados al suelo* al iniciar la marcha, pasar por puertas o lugares estrechos) y **giros con el cuerpo, no con los pies**. Grave afectación de respuestas posturales: inestable, sin ritmo, descoordinada."},{"tipo":"perla","texto":"En el parkinsoniano entrena específicamente **inicio de marcha, giros y paso por puertas** (zonas de congelación) y la **disociación de cinturas** con braceo amplio; son los puntos de mayor riesgo de caída."},{"tipo":"tabla","titulo":"Marchas por movimientos anormales","columnas":["Marcha","Características","Etiología"],"filas":[["Coreica (danzante)","Movimientos exagerados, bruscos, irregulares, breves e impredecibles en MMII y braceo; en fases avanzadas limita deambulación y sedestación","Huntington (hereditaria neurodegenerativa), inmunitaria, vascular, farmacológica (levodopa), tóxica"],["Distónica","Contracción muscular sostenida y posturas anómalas; en distonías focales de MMII, **flexión plantar e inversión del pie**; se desencadena con la acción y empeora con estrés y ansiedad","Lesión de ganglios basales"]]},{"tipo":"tabla","titulo":"Marcha en la lesión medular según nivel","columnas":["Nivel","Capacidad de marcha"],"filas":[["Por encima de C7","No es posible la marcha"],["C7-D6","Marcha en **semipéndulo** con bitutores"],["D6-D12","Marcha en **péndulo** con bitutores"],["Por debajo de D12","Bipedestación activa, marcha en **cuatro puntos** con bitutores"],["L4","Marcha normal con **ortesis antiequinas**"],["S1-S2","Marcha normal **sin ortesis**"]]},{"tipo":"parrafo","texto":"**Lesiones periféricas**. *Marcha en estepaje (equina)*: debilidad de elevadores del pie/tibial anterior; dificultad para subir escaleras; el pie cae pasivamente golpeando el suelo con ruido (para no arrastrarlo, el paciente eleva en exceso la rodilla, complemento). Típica en polineuritis, neuropatía del peroneo común, polineuropatías, cola de caballo y ELA. *Marcha de Duchenne*: déficit de **glúteo medio**; **signo de Trendelenburg** (caída de la pelvis del **lado sano**) y **signo de Duchenne de Boulogne** (desviación del tronco hacia el **lado de apoyo**, es decir, el del déficit). Típica en **poliomielitis** y fases iniciales de las distrofias de **Duchenne y Becker**."},{"tipo":"figura","pagina":78,"pie":"Déficit del glúteo medio: compara la caída de la pelvis hacia el lado sano (Trendelenburg) con la inclinación del tronco hacia el lado del déficit (Duchenne).","src":"img/fisioterapia-neurologica-t3-tema-3-valoracion-de-la-marcha-y-tipos-de-marcha-patologica-p78.jpg"},{"tipo":"alerta","texto":"No confundas la marcha en **estepaje** (pie caído flácido por lesión periférica, golpe del antepié) con el **equino espástico** del segador (hipertonía, circunducción). Y la **marcha de Duchenne** (glúteo medio) no es lo mismo que la **distrofia de Duchenne**, aunque esta la produzca al inicio."}]},{"id":"ayudas-tecnicas","titulo":"Ayudas técnicas para la marcha","bloques":[{"tipo":"tabla","titulo":"Tipos de ayudas técnicas","columnas":["Ayuda","Variantes","Indicación principal"],"filas":[["Andadores","Con o sin ruedas; con o sin asiento","**Mayor estabilidad**"],["Muletas","Axilares o de antebrazo","**Apoyo y descarga de peso**"],["Bastones","Simples o cuadrípodes","**Menor inestabilidad**"]]},{"tipo":"parrafo","texto":"**Selección**: evaluación personalizada (fuerza muscular, equilibrio, coordinación, necesidades funcionales) y criterios de tipo de lesión, fase de rehabilitación y entorno. **Adaptación**: altura, empuñadura, accesorios. **Entrenamiento**: objetivos de mejorar la marcha, aumentar distancia y velocidad, reducir el miedo a caer y aumentar la autonomía, mediante entrenamiento en diferentes superficies, ejercicios de equilibrio y coordinación y fortalecimiento."},{"tipo":"perla","texto":"Principio rector: **reducir gradualmente el apoyo de la ayuda técnica** (andador → bastón cuadrípode → bastón simple) conforme mejoran equilibrio y fuerza, para no crear dependencia."}]}],"caso_clinico":{"titulo":"Hemiparesia derecha tras ACV: análisis y abordaje de la marcha","presentacion":"Varón de 68 años, 4 meses después de un ACV isquémico de la arteria cerebral media izquierda. Camina con dificultad: el MI derecho avanza describiendo un semicírculo, con rodilla y cadera en extensión rígida y pie en equino; contacta con el suelo con el borde externo del antepié y los dedos flexionados. El brazo derecho no bracea y permanece pegado al cuerpo. Presenta hiperreflexia rotuliana derecha, clonus aquíleo y Babinski derecho. Refiere fatigarse a los pocos minutos y ha tenido dos caídas en casa.","preguntas":[{"pregunta":"¿Qué patrón de marcha presenta y qué lesión lo justifica?","respuesta":"**Marcha en segador o guadaña**, por lesión **unilateral** de la corteza motora/vía corticoespinal (síndrome piramidal: espasticidad, hiperreflexia, clonus, Babinski). La hipertonía extensora inhibe la flexión de rodilla y mantiene el pie equino, por lo que el paciente no puede acortar el miembro en la oscilación y lo lleva en circunducción."},{"pregunta":"¿Qué compensaciones esperarías y por qué se fatiga tanto?","respuesta":"Para despejar el pie: **elevación de la pelvis, inclinación del tronco hacia el lado sano y abducción de cadera**. La **pierna sana** aumenta su tiempo de apoyo y acorta el paso, porque la afecta tolera poca carga (apoyo muy reducido). Se pierden mecanismos de optimización (contacto con talón, flexión de rodilla, braceo que equilibra la rotación pélvica), y **perder cualquiera de ellos aumenta el gasto energético**: de ahí la fatiga precoz."},{"pregunta":"¿Cómo plantearías la ayuda técnica y los objetivos?","respuesta":"Tras evaluar fuerza, equilibrio, coordinación, necesidades y entorno (caídas en casa), un **bastón cuadrípode** en el lado sano aporta estabilidad para una inestabilidad moderada; si el equilibrio fuera muy malo, andador. Se ajusta altura y empuñadura. Objetivos: mejorar el patrón, aumentar distancia y velocidad, **reducir el miedo a caer** y ganar autonomía, entrenando superficies variadas, equilibrio, coordinación y fuerza, y **reduciendo gradualmente** el apoyo de la ayuda. Puede valorarse una ortesis antiequina para el pie (complemento)."}]},"glosario":[{"termino":"Ciclo de la marcha","definicion":"Actividad de un MI entre dos contactos consecutivos del talón del mismo pie; 60% apoyo y 40% oscilación."},{"termino":"Doble apoyo","definicion":"Periodo en que ambos pies contactan con el suelo; se acorta al aumentar la velocidad."},{"termino":"Paso doble","definicion":"Distancia entre dos huellas consecutivas del mismo pie."},{"termino":"Ángulo bipodal","definicion":"Ángulo entre la línea de progresión y el eje longitudinal de la huella."},{"termino":"Doble movimiento sinusoidal","definicion":"Trayectoria lateral y vertical del centro de gravedad durante la marcha."},{"termino":"Equilibrio dinámico","definicion":"Mantenimiento de la estabilidad en movimiento mediante control proactivo, reactivo y coordinación muscular."},{"termino":"Circunducción","definicion":"Avance del MI en semicírculo por imposibilidad de flexionar rodilla; típica de la marcha en segador."},{"termino":"Festinación","definicion":"Pasos progresivamente más cortos y rápidos que pueden causar caídas; típica del parkinsonismo."},{"termino":"Congelación (freezing)","definicion":"Bloqueo con los pies pegados al suelo al iniciar la marcha o pasar por puertas o lugares estrechos."},{"termino":"Signo de Romberg","definicion":"Pérdida de equilibrio al cerrar los ojos en bipedestación; positivo en la ataxia sensorial (tabética), negativo en la cerebelosa."},{"termino":"Estepaje","definicion":"Marcha con pie caído por debilidad de los elevadores del pie, que golpea el suelo con ruido."},{"termino":"Signo de Trendelenburg","definicion":"Caída de la pelvis del lado sano en apoyo sobre el lado con déficit de glúteo medio."},{"termino":"Signo de Duchenne de Boulogne","definicion":"Desviación del tronco hacia el lado de apoyo para compensar el déficit de glúteo medio."},{"termino":"Marcha en péndulo","definicion":"Marcha con bitutores en la lesión medular D6-D12 (semipéndulo en C7-D6)."}],"fuentes":["Tema 3. Fisioterapia Neurológica: Valoración de la marcha. Tipos de marcha patológica. Universidad Europea (Villarón C, Herrmann C, Ferreira C, Polo A, Valbol P, Benaboura I, Sirvent MÁ).","Stanford Medicine 25. Gaits Examination (vídeo, YouTube), citado en el PDF."],"qcm":[{"pregunta":"Según el temario, de los periodos de la fase de apoyo que tienen porcentaje asignado, ¿cuál presenta la mayor duración?","opciones":["Apoyo medio del pie","Despegue del antepié","Choque o apoyo del talón","Despegue del talón"],"correcta":3,"explicacion":"El despegue del talón, iniciado cuando el talón empieza a separarse del suelo e impulso ascendente, ocupa el 25%. El choque de talón y el apoyo medio ocupan un 15% cada uno y el despegue del antepié un 5%.","por_opcion":["❌ El apoyo medio del pie también supone el 15%.","❌ El despegue del antepié es el más breve, con un 5%.","❌ El choque de talón supone el 15%.","✅ Es el periodo más largo del apoyo, con un 25%."]},{"pregunta":"La fase de oscilación ocupa el 40% del ciclo. Aplicando las proporciones internas del temario, ¿qué porcentaje del ciclo completo corresponde al balanceo medio?","opciones":["Un 40% del ciclo","Un 80% del ciclo","Un 4% del ciclo","Un 32% del ciclo"],"correcta":3,"explicacion":"El balanceo medio es el 80% de la fase de oscilación; como esta es el 40% del ciclo, el balanceo medio supone 0,8 × 40 = 32% del ciclo completo.","por_opcion":["❌ El 40% es la duración de toda la fase de oscilación.","❌ El 80% es el porcentaje respecto a la fase, no respecto al ciclo.","❌ El 4% corresponde a la aceleración o a la desaceleración (10% de la fase).","✅ 80% de una fase que ocupa el 40% del ciclo equivale al 32%."]},{"pregunta":"Un paciente aumenta progresivamente su velocidad de marcha en cinta. ¿Qué modificación temporal predice el temario?","opciones":["Disminuyen el apoyo y también el doble apoyo","Aumenta el apoyo y se acorta el doble apoyo","Se mantiene fija la proporción 60/40 del ciclo","Disminuye el apoyo y se alarga el doble apoyo"],"correcta":0,"explicacion":"La duración de cada fase depende de la velocidad: a mayor velocidad, menor tiempo de fase de apoyo y menor tiempo de doble apoyo.","por_opcion":["✅ Ambos tiempos se reducen al aumentar la velocidad.","❌ El tiempo de apoyo no aumenta, se reduce.","❌ La proporción 60/40 es de referencia, pero varía con la velocidad.","❌ El doble apoyo se acorta con la velocidad, no se alarga."]},{"pregunta":"Durante la marcha normal, ¿en qué instante alcanzan su flexión máxima el hombro y el codo derechos?","opciones":["En el balanceo medio del pie derecho","En el despegue del antepié izquierdo","En el apoyo del talón del pie derecho","En el apoyo del talón del pie izquierdo"],"correcta":3,"explicacion":"La flexión máxima de hombro y codo ocurre en el apoyo del talón del pie opuesto, coherente con el braceo contralateral que equilibra la rotación pélvica; la extensión máxima coincide con el apoyo del talón del mismo lado.","por_opcion":["❌ El balanceo medio no es el momento de referencia del temario.","❌ El temario no vincula la flexión máxima al despegue del antepié.","❌ El apoyo del talón homolateral coincide con la extensión máxima.","✅ Para el brazo derecho, el pie opuesto es el izquierdo."]},{"pregunta":"Paciente con marcha de base amplia y taloneo marcado, que camina mirándose los pies y pierde el equilibrio al cerrar los ojos. ¿Qué estructura está más probablemente lesionada?","opciones":["Los hemisferios cerebelosos","Los cordones posteriores medulares","El laberinto vestibular","Los ganglios basales"],"correcta":1,"explicacion":"Es una marcha tabética: degeneración de los cordones posteriores, por donde discurre la sensibilidad profunda. El déficit propioceptivo se compensa con la vista, por eso mira sus pies y el Romberg es positivo.","por_opcion":["❌ La marcha cerebelosa tiene base amplia pero Romberg negativo y no es taloneante.","✅ Taloneo, mirada a los pies y Romberg positivo definen la marcha tabética.","❌ La vestibular se caracteriza por desviación hacia el lado lesionado y marcha en estrella positiva.","❌ Los ganglios basales producen marcha parkinsoniana de pasos cortos y arrastrados."]},{"pregunta":"Paciente con hipofunción laberíntica izquierda aislada al que se realiza la prueba de marcha en estrella. ¿Qué hallazgo es concordante con el temario?","opciones":["Prueba de marcha en estrella negativa","Desviación y tendencia a caer hacia la izquierda","Tendencia a caer hacia atrás sin lateralidad","Desviación y tendencia a caer hacia la derecha"],"correcta":1,"explicacion":"En la marcha vestibular la desviación y la caída se producen hacia el mismo lado de la lesión vestibular, y la marcha en estrella es positiva.","por_opcion":["❌ En la marcha vestibular la prueba en estrella es positiva.","✅ La desviación es hacia el lado lesionado, aquí el izquierdo.","❌ La caída hacia atrás es propia de la marcha cerebelosa.","❌ La desviación no es contralateral a la lesión."]},{"pregunta":"Paciente con déficit del glúteo medio izquierdo. En el apoyo monopodal sobre la pierna izquierda, ¿qué combinación de signos se espera?","opciones":["Caída de la pelvis derecha y tronco inclinado a la derecha","Caída de la pelvis izquierda y tronco inclinado a la derecha","Caída de la pelvis derecha y tronco inclinado a la izquierda","Elevación de la pelvis derecha y tronco inclinado a la derecha"],"correcta":2,"explicacion":"El signo de Trendelenburg es la caída de la pelvis del lado sano (derecho) y el signo de Duchenne de Boulogne es la desviación del tronco hacia el lado de apoyo, que es el del déficit (izquierdo).","por_opcion":["❌ El tronco se desvía hacia el lado de apoyo, no hacia el sano.","❌ La pelvis que cae es la del lado sano, no la del lado del déficit.","✅ Trendelenburg (pelvis derecha cae) más Duchenne (tronco hacia la izquierda).","❌ La pelvis contralateral cae, no se eleva."]},{"pregunta":"Paciente con lesión medular a nivel D8. Según la clasificación del temario, ¿qué patrón de marcha cabe esperar?","opciones":["Marcha en cuatro puntos con bitutores","Marcha en semipéndulo con bitutores","Marcha en péndulo con bitutores","Marcha normal con ortesis antiequinas"],"correcta":2,"explicacion":"Entre D6 y D12 el temario establece marcha en péndulo con bitutores. El semipéndulo corresponde a C7-D6 y la marcha en cuatro puntos a lesiones por debajo de D12.","por_opcion":["❌ La marcha en cuatro puntos es por debajo de D12.","❌ El semipéndulo corresponde al intervalo C7-D6.","✅ D8 está en el intervalo D6-D12: marcha en péndulo.","❌ La marcha con ortesis antiequinas corresponde a L4."]},{"pregunta":"¿Qué asociación entre músculo debilitado, raíz y patrón de marcha recoge correctamente el temario?","opciones":["Glúteo medio, L5, inclinación en abducción","Tibial anterior, S1-S2, marcha de pie plano","Tibial anterior, L5, inclinación en abducción","Gemelos y sóleo, L4, marcha de pie caído"],"correcta":0,"explicacion":"El temario asocia glúteo medio (L5) con marcha con inclinación en abducción, tibial anterior (L4) con pie caído y gemelos-sóleo (S1-S2) con pie plano.","por_opcion":["✅ Glúteo medio, L5 e inclinación en abducción es la tríada correcta.","❌ S1-S2 y pie plano corresponden a gemelos y sóleo.","❌ El tibial anterior es L4 y produce pie caído.","❌ Gemelos y sóleo son S1-S2 y producen pie plano."]},{"pregunta":"Paciente con debilidad de MMII que empeora con el esfuerzo repetido, reflejos conservados, sensibilidad normal y atrofia apenas perceptible. ¿Dónde se localiza más probablemente la lesión?","opciones":["En la unión neuromuscular","En la motoneurona del asta anterior","En los cordones posteriores","En el nervio periférico"],"correcta":0,"explicacion":"La lesión de la unión neuromuscular produce debilidad y fatiga con reflejos y sensibilidad preservados y atrofia muy leve o ausente.","por_opcion":["✅ Debilidad fatigable con reflejos y sensibilidad conservados es lo típico.","❌ La motoneurona del asta anterior da hiporreflexia, atrofia y fasciculaciones.","❌ Los cordones posteriores dan alteración de sensibilidad profunda y arreflexia.","❌ El nervio periférico asocia trastornos sensitivos y dolor."]},{"pregunta":"¿Cuál de los siguientes rasgos pertenece a la marcha del niño y no a la del anciano, según el temario?","opciones":["Escasa flexión de rodilla durante el apoyo","Reducción de la flexión plantar en el despegue","Reducción del rango de flexoextensión de cadera","Reducción de la flexión de rodilla en la oscilación"],"correcta":0,"explicacion":"La escasa flexión de rodilla en la fase de apoyo es propia del niño, junto con el contacto inicial con el pie completo y la ausencia de braceo recíproco. Los otros tres rasgos describen la marcha del anciano.","por_opcion":["✅ Es un rasgo de la marcha infantil, referido a la fase de apoyo.","❌ La menor flexión plantar en el despegue es propia del anciano.","❌ La reducción del rango de cadera se describe en el anciano.","❌ La menor flexión de rodilla en oscilación caracteriza al anciano."]},{"pregunta":"¿Cuál de las siguientes características corresponde a la marcha parkinsoniana según el temario?","opciones":["Base aumentada con tendencia a caer hacia atrás","Elevación exagerada de las piernas y taloneo al apoyar","Contacto con el borde externo del antepié y dedos en flexión","Apoyo inicial con planta o dedos-talón y giros en bloque"],"correcta":3,"explicacion":"En la marcha parkinsoniana el apoyo inicial tiende a realizarse con la planta o en secuencia dedos-talón, y los giros se hacen con el cuerpo y no con los pies, por la marcha en bloque sin disociación de cinturas.","por_opcion":["❌ Describe la marcha cerebelosa.","❌ Corresponde a la marcha tabética.","❌ Es propio de la marcha en segador.","✅ Apoyo dedos-talón y giros en bloque son rasgos parkinsonianos."]},{"pregunta":"En la marcha en segador secundaria a un ACV, ¿qué modificación se describe en la pierna sana?","opciones":["Mayor tiempo de apoyo y menor longitud de paso","Menor tiempo de apoyo y mayor longitud de paso","Circunducción compensadora con abducción de cadera","Contacto inicial con el borde externo del antepié"],"correcta":0,"explicacion":"El temario indica que la pierna sana aumenta su tiempo de apoyo y reduce la longitud de paso, porque la pierna afecta tolera poca carga y tiene una fase de apoyo muy reducida.","por_opcion":["✅ Es exactamente lo descrito para la pierna sana.","❌ Es la tendencia contraria a la descrita.","❌ La circunducción y la abducción ocurren en el lado lesionado.","❌ El contacto con el borde externo es del pie afecto."]},{"pregunta":"Ambas por lesión bilateral corticoespinal, ¿qué rasgo diferencia la marcha en tijera de la marcha espástica de Geisha?","opciones":["En la de Geisha hay oscilaciones laterales constantes del tronco","En la de tijera las rodillas van en ligera flexión y aducción","En la de Geisha las rodillas van en ligera flexión y aducción","En la de tijera se camina de puntillas con rodillas extendidas"],"correcta":1,"explicacion":"En la marcha en tijera la gran hipertonía de aductores lleva las rodillas a ligera flexión y aducción, cruzando las piernas con oscilaciones de tronco. En la de Geisha las rodillas van en extensión y se camina sobre la punta con pies en equino.","por_opcion":["❌ Las oscilaciones laterales del tronco son de la marcha en tijera.","✅ Flexión ligera y aducción de rodillas es propio de la tijera.","❌ En la de Geisha las rodillas están en extensión.","❌ Caminar de puntillas con rodillas extendidas define la de Geisha."]},{"pregunta":"Según el análisis anatómico del temario, ¿qué combinación de movimientos realiza la cadera durante la fase de oscilación?","opciones":["Extensión, rotación interna y aducción mantenida","Extensión progresiva con rotación externa pélvica","Flexión, rotación externa y abducción al inicio y al final","Flexión, rotación interna y abducción en mitad de la fase"],"correcta":2,"explicacion":"En la oscilación la cadera se flexiona, rota externamente por la rotación de la pelvis y se abduce al comienzo y al final de la fase. La extensión es el movimiento de la cadera en la fase de apoyo.","por_opcion":["❌ La extensión es de la fase de apoyo y no se describe rotación interna.","❌ La extensión de cadera corresponde a la fase de apoyo.","✅ Flexión, rotación externa y abducción inicial y final es lo descrito.","❌ La rotación es externa y la abducción se da al inicio y al final."]}],"asignatura":"Fisioterapia neurológica","tema":3,"fecha":"2026-11-04","resumen":["El **ciclo de la marcha** es la actividad de una extremidad entre **dos contactos consecutivos del talón del mismo pie** y se divide en **apoyo (60%)** y **oscilación (40%)**; a **mayor velocidad, menor tiempo de apoyo y de doble apoyo**.","El **centro de gravedad**, situado **delante de S2**, describe un **doble movimiento sinusoidal** (lateral y vertical) que suavizan **6 mecanismos de optimización**; perder cualquiera de ellos **aumenta el gasto energético**, y el aplanamiento de la sinusoide indica **patología o envejecimiento**.","La lesión corticoespinal **unilateral** produce la **marcha en segador** (extensión rígida, pie equino, circunducción), y la **bilateral** produce la **marcha de Geisha** (rodillas en extensión, puntillas) o la **marcha en tijera** (rodillas en ligera flexión y aducción); la **parkinsoniana** es **en bloque**, con **festinación** y **congelación**.","En las ataxias, el **Romberg** es **negativo en la cerebelosa** (ebrio, base muy amplia) y **positivo en la tabética** (cordones posteriores, taloneante), y la **vestibular** cae hacia el **lado de la lesión** (marcha en estrella); en lo periférico destacan el **estepaje** (tibial anterior) y la **marcha de Duchenne** (glúteo medio: la pelvis cae hacia el **lado sano**).","En la lesión medular **no hay marcha por encima de C7**, se camina **en semipéndulo (C7-D6)**, **en péndulo (D6-D12)** o **en cuatro puntos (\u003cD12)** con bitutores, con **antiequinas en L4** y **sin ortesis en S1-S2**; las ayudas técnicas (**andador, muletas, bastón**) se retiran **de forma gradual** para no crear dependencia."],"preguntate":[{"pregunta":"Define la marcha normal y explica dónde se sitúa el centro de gravedad.","respuesta":"Es una serie de movimientos **alternantes y rítmicos** de extremidades y tronco que desplazan hacia delante el centro de gravedad con un **mínimo gasto de energía**. El centro de gravedad se sitúa **delante de la 2ª vértebra sacra**, en el punto medio entre ambas coxofemorales."},{"pregunta":"Compara el control proactivo del movimiento con el control reactivo de la estabilidad.","respuesta":"El **proactivo** actúa por **anticipación**, contrarrestando las perturbaciones que generan los propios movimientos, y por **experiencia**, prediciendo causas de desequilibrio. El **reactivo** depende de las **aferencias sensoriales** y responde a **alteraciones inesperadas** del equilibrio."},{"pregunta":"Enumera los seis mecanismos de optimización de la marcha y explica qué ocurre si se pierde uno.","respuesta":"Son la **rotación pélvica**, la **inclinación pélvica**, la **flexión de rodilla**, el **contacto mediante el talón**, el **despegue mediante el antepié** y el **ligero valgo fisiológico de la rodilla**. Todos suavizan la trayectoria sinuosa del centro de gravedad, y la pérdida de cualquiera de ellos **aumenta el gasto energético**."},{"pregunta":"Explica la función del braceo en la marcha y qué sucede si se impide.","respuesta":"Es una **acción refleja** en sentido opuesto a las piernas que **equilibra la rotación pélvica** y, al disociar las cinturas, favorece la **elongación del tronco**. Si se impide, la parte inferior del tronco rota en la misma dirección que la pelvis, lo que genera tensión y dificulta la marcha."},{"pregunta":"¿Cómo distinguirías una marcha en estepaje del pie equino de la marcha en segador?","respuesta":"El **estepaje** se debe a un pie caído **flácido** por lesión periférica del tibial anterior: el antepié golpea el suelo con ruido y el paciente eleva en exceso la rodilla. El **equino del segador** es **espástico**, por lesión central con hipertonía extensora, y se compensa con **circunducción**."},{"pregunta":"Describe las compensaciones de la pierna afectada en la marcha en segador.","respuesta":"Con cadera y rodilla en extensión rígida y pie equino, el paciente traza un **semicírculo** mediante **elevación de la pelvis**, **inclinación del tronco hacia el lado sano** y **abducción de cadera**. El contacto se hace con el **borde externo del antepié**, con poco apoyo, menos carga y braceo perdido."},{"pregunta":"Paciente con Parkinson: ¿qué aspectos de la marcha priorizarías en el entrenamiento y por qué?","respuesta":"Priorizaría el **inicio de la marcha**, los **giros** y el **paso por puertas**, porque son las zonas de **congelación** y de mayor riesgo de caída. También trabajaría la **disociación de cinturas** con braceo amplio, para contrarrestar la marcha en bloque."},{"pregunta":"Explica los efectos del tacón en la marcha.","respuesta":"El tacón aumenta la **flexión plantar** según su altura, provoca **flexión de rodilla** y **aumenta la lordosis lumbar**, lo que favorece las lumbalgias. Un tacón de **4-5 cm** puede ser beneficioso al repartir mejor las cargas entre retropié y antepié."},{"pregunta":"Diferencia clínicamente una lesión pura de motoneurona, una de nervio periférico y una miopatía.","respuesta":"La **motoneurona pura** produce déficit motor **sin trastornos sensitivos**. El **nervio periférico** añade **trastornos sensitivos y dolor**. En el **músculo** predomina la **atrofia**, con reflejos y sensibilidad conservados salvo en fases muy avanzadas."},{"pregunta":"Indica para qué se usa cada ayuda técnica y cómo se progresa en su retirada.","respuesta":"El **andador** aporta la **mayor estabilidad**, las **muletas** sirven para el **apoyo y la descarga de peso** y el **bastón** se indica cuando hay **menor inestabilidad**. Se retira el apoyo de forma gradual (**andador → bastón cuadrípode → bastón simple**) conforme mejoran el equilibrio y la fuerza."}]}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips">${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
