<title>Tema 4. Patologías neurológicas: introducción, ACV, TCE y enfermedad de Parkinson · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --papel:#f6f4ef; --hoja:#fffdf9; --tinta:#1b2427; --suave:#5b676b; --linea:#e2ddd2; --acento:#1f6f6b; --acento-suave:#dcebe8;
  --ocre:#b37a1c; --ocre-suave:#f6ead3; --rojo:#a8402f; --rojo-suave:#f5e0db; --verde:#2f7a46; --verde-suave:#dcefe1;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --texto:"Spectral",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:19px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);line-height:1.12;margin:0;font-variation-settings:"SOFT" 50}
h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.9rem;font-weight:600;letter-spacing:-.015em;margin:0 0 18px}
h3{font-size:1.2rem;font-weight:600}
b,strong{font-weight:600}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px}
.envoltura{max-width:820px;margin:0 auto;padding:0 22px}
/* cabecera */
header.portada{padding:64px 0 36px;border-bottom:1px solid var(--linea)}
.etiquetas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.etiqueta{font:600 .78rem/1 var(--serif);padding:7px 11px;border-radius:999px;background:var(--acento-suave);color:var(--acento)}
.etiqueta.o{background:var(--ocre-suave);color:var(--ocre)}
.sub{font-size:1.25rem;color:var(--suave);margin:16px 0 0;max-width:62ch;font-style:italic}
.meta{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap}
.meta div{font-family:var(--serif)}
.meta b{display:block;font-size:1.7rem;font-weight:800;line-height:1}
.meta span{font-size:.8rem;color:var(--suave)}
/* navegación */
nav.indice{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px)}
nav.indice .envoltura{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .envoltura::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .85rem var(--serif);padding:7px 12px;border-radius:999px}
nav.indice a:hover{color:var(--tinta);background:var(--hoja)}
nav.indice a.qcm{background:var(--tinta);color:var(--papel);margin-left:auto}
main section{padding:56px 0 8px}
.num{font:800 .85rem var(--serif);color:var(--ocre);display:block;margin-bottom:6px}
p{margin:0 0 16px;max-width:68ch}
/* bloques */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:14px;padding:22px 24px}
.caja h3{margin-bottom:12px}
.caja ul,.caja ol{margin:0;padding-left:1.2em}
.caja li{margin:6px 0}
.claves{counter-reset:k;list-style:none;padding:0!important}
.claves li{counter-increment:k;padding-left:38px;position:relative;margin:10px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--acento);color:var(--papel);font:800 .8rem/26px var(--serif);text-align:center}
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
.tw{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--linea);border-radius:12px;background:var(--hoja)}
table{border-collapse:collapse;width:100%;font-size:.92rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:600 .95rem var(--serif);padding:14px 16px 4px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--linea)}
th{font:600 .82rem var(--serif);color:var(--suave);border-top:0}
tbody tr:nth-child(odd){background:color-mix(in srgb,var(--papel) 50%,transparent)}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 22px}
.tarjeta{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;font-size:.95rem;line-height:1.5}
.tarjeta .et{font:700 .72rem var(--serif);color:var(--ocre);display:block;margin-bottom:4px}
.tarjeta h3{font-size:1.05rem;margin-bottom:6px}
.def{border-left:3px solid var(--acento);padding:4px 0 4px 16px;margin:0 0 18px}
.def b{font-family:var(--serif);color:var(--acento)}
.nota{border-radius:12px;padding:14px 18px 14px 50px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;font-size:1.15rem}
.nota .t{font:700 .78rem var(--serif);display:block;margin-bottom:2px}
.perla{background:var(--verde-suave)} .perla::before{content:"🩺"} .perla .t{color:var(--verde)}
.alerta{background:var(--rojo-suave)} .alerta::before{content:"⚠️"} .alerta .t{color:var(--rojo)}
/* figuras y esquemas */
figure{margin:8px 0 26px;background:var(--hoja);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:20px 16px 8px;overflow-x:auto;text-align:center}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq .lienzo pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap;text-align:left}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{font-family:var(--serif);color:var(--tinta)}
/* caso clínico */
.caso{background:var(--tinta);color:var(--papel);border-radius:18px;padding:30px 30px 18px}
.caso h2{color:var(--papel)}
.caso p{color:color-mix(in srgb,var(--papel) 85%,transparent)}
.caso details{border-top:1px solid color-mix(in srgb,var(--papel) 18%,transparent);padding:12px 0}
.caso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
.caso details p{margin:10px 0 0}
dl.glosario{display:grid;grid-template-columns:max-content 1fr;gap:10px 20px;margin:0}
dl.glosario dt{font:600 1rem var(--serif);color:var(--acento)}
dl.glosario dd{margin:0}
.fuentes{font-size:.9rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border:1px solid var(--linea);border-radius:18px;padding:28px}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:600 .85rem var(--serif);color:var(--suave)}
.barra{flex:1;height:8px;border-radius:4px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--acento);transition:width .3s}
.pregunta{font:600 1.3rem/1.35 var(--serif);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer}
.op:hover:not([disabled]){border-color:var(--acento)}
.op .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 .9rem var(--serif);background:var(--hoja);border:1px solid var(--linea)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--verde);background:var(--verde-suave)}
.op.bien .l{background:var(--verde);color:#fff;border-color:var(--verde)}
.op.mal{border-color:var(--rojo);background:var(--rojo-suave)}
.op.mal .l{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{font:600 .95rem var(--serif);padding:11px 20px;border-radius:999px;border:0;background:var(--tinta);color:var(--papel);cursor:pointer}
.btn.sec{background:transparent;color:var(--tinta);border:1.5px solid var(--linea)}
.btn[disabled]{opacity:.35;cursor:default}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:800 4.4rem/1 var(--serif);letter-spacing:-.03em}
.resultado .gran small{font-size:1.6rem;color:var(--suave)}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:700px){body{font-size:17.5px}.dos{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}dl.glosario{grid-template-columns:1fr}dl.glosario dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i{transition:none}}
@media print{nav.indice,#qcm{display:none}body{background:#fff}}

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script id="datos" type="application/json">{"titulo":"Tema 4. Patologías neurológicas: introducción, ACV, TCE y enfermedad de Parkinson","subtitulo":"Qué son las patologías neurológicas, por qué importa diagnosticarlas pronto y cómo se presentan, se valoran y se tratan en fisioterapia el ictus, el traumatismo craneoencefálico y la enfermedad de Parkinson.","objetivos":["Al terminar, sabrás definir las patologías neurológicas, enumerar sus causas y explicar el papel del diagnóstico precoz y de la fisioterapia (funcionalidad, discapacidad, calidad de vida).","Al terminar, sabrás clasificar el ACV (isquémico 80-85 % / hemorrágico 15-20 % y sus subtipos), sus factores de riesgo y los signos de sospecha con su sensibilidad y especificidad.","Al terminar, sabrás diferenciar las manifestaciones de una lesión del hemisferio derecho frente al izquierdo (dualidad hemisférica) y sus consecuencias en fisioterapia.","Al terminar, sabrás elegir la escala adecuada (NIHSS, Barthel, Ashworth, Fugl-Meyer, Tinetti, 10 m, MMSE, Glasgow, Romberg, Berg) según lo que quieras medir en ACV y TCE.","Al terminar, sabrás explicar la fisiopatología de la enfermedad de Parkinson y caracterizar con precisión temblor, rigidez, bradicinesia e inestabilidad postural."],"ideas_clave":["Las patologías neurológicas afectan al **SNC y al SNP** y tienen causas estructurales, funcionales, metabólicas, infecciosas, genéticas, autoinmunes, degenerativas y traumáticas.","**ACV**: 2.ª causa de muerte y **1.ª causa de discapacidad a largo plazo** en adultos; 15 millones/año en el mundo (5 M mueren, 5 M con discapacidad permanente). **Isquémico 80-85 %** (trombosis, embolia, hipoperfusión) y **hemorrágico 15-20 %** (intracerebral, subaracnoidea).","Factores de riesgo de ictus: no modificables (**edad >55**, sexo con **más prevalencia en hombres y más mortalidad en mujeres**, raza negra o asiática, antecedente familiar) y modificables (HTA, DM, tabaco, hiperlipemia, cardiopatía); potencialmente modificables (obesidad, inactividad, nutrición, alcohol, drogas, anticonceptivos orales).","Signos de sospecha de ictus (**paresia facial aguda, alteración del lenguaje, descenso del brazo**): **sensibilidad 100 %, especificidad 88 %**. Llamar al **112 reduce 6 h** la espera de atención médica.","**Hemisferio derecho**: heminegligencia, déficit somatosensorial y de campo visual, mayores déficits motores e **inestabilidad postural**. **Hemisferio izquierdo**: afasia, agrafia, acalculia, alteración de praxias y de los **movimientos voluntarios del tronco**.","**TCE**: principal causa de discapacidad y mortalidad en **\u003c45 años**; 200-500/100.000 hab/año; hombres jóvenes. **Tráfico** = causa más común de TCE grave; **caídas** en niños y mayores. Consciencia con **Glasgow**; equilibrio con **Romberg y Berg**.","**Parkinson**: 2.ª enfermedad neurodegenerativa (tras Alzheimer); prevalencia 682/100.000, incidencia 1,5-22/100.000/año; más en varones. Degeneración de la **sustancia negra** → depleción de dopamina en ganglios basales → alteración motora.","Tétrada motora del Parkinson: **temblor en reposo** (síntoma inicial, cede con el movimiento activo y el sueño, empeora con estrés), **rigidez** (tubo de plomo o rueda dentada), **bradicinesia** (mejora mucho con tratamiento) e **inestabilidad postural** (aparece tardíamente)."],"secciones":[{"id":"introduccion","titulo":"Introducción a las patologías neurológicas","bloques":[{"tipo":"definicion","termino":"Patologías neurológicas","texto":"Grupo diverso de trastornos que afectan al **sistema nervioso central (SNC)** y al **sistema nervioso periférico (SNP)**. Pueden deberse a daño estructural, disfunción funcional o alteraciones metabólicas, infecciosas, genéticas, autoinmunes, degenerativas y traumáticas."},{"tipo":"parrafo","texto":"El **diagnóstico precoz y preciso** es fundamental porque condiciona un plan de tratamiento eficaz. La fisioterapia tiene un papel crucial en la rehabilitación y el manejo de estas patologías con tres objetivos: **maximizar la funcionalidad, minimizar las discapacidades y mejorar la calidad de vida**."},{"tipo":"tarjetas","items":[{"etiqueta":"Diagnóstico 1","titulo":"Evaluación neurológica integral","texto":"Estado mental, función motora, coordinación, equilibrio, marcha, función sensorial y fuerza muscular."},{"etiqueta":"Diagnóstico 2","titulo":"Pruebas funcionales y clínicas","texto":"Escalas estandarizadas para medir el nivel de discapacidad y planificar el tratamiento."},{"etiqueta":"Diagnóstico 3","titulo":"Colaboración multidisciplinar","texto":"Con neurólogos, terapeutas ocupacionales, logopedas y otros profesionales."}]},{"tipo":"tabla","titulo":"Importancia del tratamiento en fisioterapia","columnas":["Beneficio","Cómo se consigue / qué incluye"],"filas":[["Mejora de la calidad de vida","Mejora de la movilidad, la independencia y la participación social"],["Prevención de complicaciones","Úlceras por presión, infecciones respiratorias, deformidades posturales"],["Reducción del impacto psicológico","La intervención temprana y eficaz reduce la depresión y la ansiedad asociadas a la discapacidad"]]},{"tipo":"lista","items":["1. Accidente cerebrovascular (ACV)","2. Traumatismo craneoencefálico (TCE)","3. Enfermedad de Parkinson","4. Esclerosis lateral amiotrófica (ELA)","5. Esclerosis múltiple (EM)","6. Neuropatías periféricas"]},{"tipo":"alerta","texto":"Esta parte del tema (diapositivas 1-49) desarrolla en detalle **ACV, TCE y Parkinson**. ELA, EM y neuropatías periféricas solo aparecen en el índice de las patologías más comunes en fisioterapia neurológica."}]},{"id":"acv-epidemiologia-tipos","titulo":"ACV: epidemiología, etiología y tipos","bloques":[{"tipo":"tabla","titulo":"Epidemiología del ACV","columnas":["Dato","Valor"],"filas":[["Mortalidad","**2.ª causa** principal de muerte"],["Discapacidad","**1.ª causa** de discapacidad a largo plazo en adultos"],["Casos anuales en el mundo","≈ **15 millones** de personas/año"],["Fallecen","≈ **5 millones**"],["Discapacidad permanente","≈ **5 millones**"]]},{"tipo":"tabla","titulo":"Tipos de ACV y subtipos","columnas":["Tipo","Frecuencia","Subtipo / mecanismo","Definición"],"filas":[["Isquémico","80-85 %","Trombosis","Obstrucción de una arteria cerebral por un coágulo formado en ella"],["Isquémico","80-85 %","Embolia","Coágulo que viaja desde otra parte del cuerpo al cerebro"],["Isquémico","80-85 %","Hipoperfusión","Disminución **generalizada** del flujo sanguíneo cerebral"],["Hemorrágico","15-20 %","Hemorragia intracerebral","Rotura de un vaso dentro del cerebro (tejido encefálico)"],["Hemorrágico","15-20 %","Hemorragia subaracnoidea","Sangrado en el espacio entre el cerebro y la membrana que lo cubre"]]},{"tipo":"parrafo","texto":"**Ictus isquémico**: una **placa de ateroma** produce la oclusión de la arteria cerebral **anterior, media, posterior o de las perforantes**, lo que genera **isquemia cerebral**. Esta puede ser **global (difusa)** o **focal** (una sola zona del encéfalo). Dentro de la isquemia focal se sitúa el **AIT** (accidente isquémico transitorio): episodio **breve y reversible**. Los ictus isquémicos se clasifican según su **extensión y localización**."},{"tipo":"parrafo","texto":"**Ictus hemorrágico**: hay **extravasación de sangre**. Causas que recoge el temario: **hipertensión** (la diapositiva la rotula como hipertensión intracraneal), **aneurisma** y **malformación arteriovenosa**. Según la localización puede ser **intracerebral** (en el tejido encefálico) o **intracraneal** (por lo general entre cráneo y meninges)."},{"tipo":"esquema","titulo":"Clasificación del ACV según el temario","mermaid":"flowchart TD\n  A[\"ACV\"] --> B[\"Isquémico 80-85%\"]\n  A --> C[\"Hemorrágico 15-20%\"]\n  B --> B1[\"Trombosis\"]\n  B --> B2[\"Embolia\"]\n  B --> B3[\"Hipoperfusión\"]\n  B --> D[\"Isquemia global difusa\"]\n  B --> E[\"Isquemia focal\"]\n  E --> F[\"AIT breve y reversible\"]\n  C --> C1[\"Intracerebral: tejido encefálico\"]\n  C --> C2[\"Intracraneal: cráneo-meninges\"]\n  C --> C3[\"Causas: HTA, aneurisma, MAV\"]","pie":"El isquémico se subdivide por mecanismo (trombosis, embolia, hipoperfusión) y por extensión (global o focal); el hemorrágico por localización y causa."},{"tipo":"figura","pagina":12,"pie":"Ictus isquémico: fíjate en la cadena placa de ateroma → oclusión arterial (cerebral anterior, media, posterior o perforantes) → isquemia global o focal, con el AIT como forma breve y reversible.","src":"img/fisioterapia-neurologica-t4-tema-4-patologias-neurologicas-introduccion-acv-tce-y-enferm-p12.jpg"},{"tipo":"alerta","texto":"Trampa: **hipoperfusión = isquémico**, aunque no haya coágulo, porque es una caída generalizada del flujo. Y no confundas **trombosis** (el coágulo se forma en la propia arteria cerebral) con **embolia** (el coágulo viene de otra parte del cuerpo)."},{"tipo":"alerta","texto":"El AIT no es un tipo de ictus hemorrágico ni una isquemia global: es una **isquemia focal breve y reversible**."}]},{"id":"acv-factores-riesgo","titulo":"ACV: factores de riesgo","bloques":[{"tipo":"tabla","titulo":"Factores de riesgo del ictus","columnas":["Categoría","Factores"],"filas":[["No modificables","Edad **>55 años**; sexo (**mayor prevalencia en hombres, mayor mortalidad en mujeres**); **raza negra o asiática**; antecedente familiar de ictus"],["Modificables","Hipertensión, diabetes mellitus, tabaquismo, hiperlipemia (colesterol alto), cardiopatía"],["Potencialmente modificables","Obesidad, inactividad física, factores nutricionales, hábito alcohólico, abuso de drogas, **anticonceptivos orales**"]]},{"tipo":"figura","pagina":15,"pie":"Cuadro de factores de riesgo: memoriza los cuatro no modificables (edad >55, sexo, raza negra o asiática, antecedente familiar) y los cinco modificables (HTA, DM, tabaco, hiperlipemia, cardiopatía).","src":"img/fisioterapia-neurologica-t4-tema-4-patologias-neurologicas-introduccion-acv-tce-y-enferm-p15.jpg"},{"tipo":"alerta","texto":"El sexo tiene doble lectura: los hombres presentan **más prevalencia**, pero las mujeres presentan **más mortalidad**. La **obesidad** aparece como modificable en una diapositiva y como **potencialmente modificable** en otra (Velasco Juanes, 2003). Si te piden la clasificación fina, ponla en potencialmente modificables."},{"tipo":"perla","texto":"En la consulta de fisioterapia, la **inactividad física** y la obesidad son factores sobre los que se puede intervenir directamente con prescripción de ejercicio y educación. Es prevención primaria y también secundaria tras un primer ictus."}]},{"id":"acv-clinica","titulo":"ACV: manifestaciones clínicas y signos de sospecha","bloques":[{"tipo":"tabla","titulo":"Manifestaciones clínicas del ACV","columnas":["Dominio","Manifestaciones"],"filas":[["Motoras","Hemiparesia o hemiplejia, alteraciones del tono muscular, espasticidad"],["Sensitivas","Pérdida de sensibilidad en un hemicuerpo, parestesias (hormigueo)"],["Cognitivas","Afasia (lenguaje), apraxia (el temario la define como dificultad en la coordinación motora), agnosia (incapacidad para reconocer objetos)"],["Visuales","Hemianopsia (pérdida de la mitad del campo visual), diplopía (visión doble)"],["Otras","Inestabilidad postural, disartria (dificultad para hablar), disfagia (dificultad para tragar)"]]},{"tipo":"alerta","texto":"**Afasia** es un trastorno del lenguaje (cognitivo) y **disartria** un trastorno de la articulación del habla (motor). **Disfagia** es la dificultad para tragar, no un trastorno del habla. Son pares clásicos de confusión."},{"tipo":"tarjetas","items":[{"etiqueta":"Signo 1","titulo":"Paresia facial aguda","texto":"Asimetría facial de instauración brusca."},{"etiqueta":"Signo 2","titulo":"Alteración del lenguaje","texto":"Dificultad brusca para hablar o comprender."},{"etiqueta":"Signo 3","titulo":"Descenso del brazo","texto":"Caída de un miembro superior al mantenerlo elevado."}]},{"tipo":"parrafo","texto":"Según la **Guía de Práctica Clínica para el Manejo de Pacientes con Ictus en Atención Primaria**, estos tres signos identifican un ictus con **sensibilidad del 100 %** (no se escapa ningún ictus) y **especificidad del 88 %** (hay algún falso positivo). Además, **llamar al 112 reduce el tiempo de espera de atención médica en 6 h**."},{"tipo":"esquema","titulo":"Actuación ante la sospecha de ictus","mermaid":"flowchart TD\n  A[\"Inicio brusco de síntomas\"] --> B{\"Paresia facial, lenguaje alterado o brazo que cae\"}\n  B -->|\"Sí\"| C[\"Sospecha de ictus: S 100% E 88%\"]\n  B -->|\"No\"| D[\"Valorar otras causas\"]\n  C --> E[\"Llamar al 112\"]\n  E --> F[\"Atención médica 6 h antes\"]\n  F --> G[\"Diagnóstico precoz y tratamiento\"]","pie":"Los tres signos sirven de cribado de alta sensibilidad: ante cualquiera de ellos se activa el 112."},{"tipo":"figura","pagina":19,"pie":"Signos de sospecha de ictus de la GPC de Atención Primaria: sensibilidad 100 %, especificidad 88 % y el dato de que llamar al 112 ahorra 6 h.","src":"img/fisioterapia-neurologica-t4-tema-4-patologias-neurologicas-introduccion-acv-tce-y-enferm-p19.jpg"},{"tipo":"perla","texto":"Si durante una sesión un paciente presenta de golpe asimetría facial, habla alterada o un brazo que cae, el fisioterapeuta debe **suspender la sesión y activar el 112** de inmediato: el tiempo es tejido cerebral."}]},{"id":"dualidad-hemisferica","titulo":"Dualidad hemisférica tras el ictus","bloques":[{"tipo":"tabla","titulo":"Hemisferio derecho vs izquierdo lesionado","columnas":["Hemisferio derecho lesionado","Hemisferio izquierdo lesionado"],"filas":[["Heminegligencia","Alteración de las praxias"],["Deficiencias somatosensoriales","Afasia"],["Pérdida del campo de visión","Agrafia"],["Mayores déficits motores","Alteración de los **movimientos voluntarios** del tronco"],["Aumento de las oscilaciones del tronco","Acalculia"],["Reducción de la estabilidad; respuestas posturales erróneas","—"]]},{"tipo":"parrafo","texto":"El tronco se afecta en ambos casos, pero de forma distinta, como muestran Spinazzola, Cubelli y Della Sala (*Brain*, 2003). La lesión **izquierda** produce errores **apráxicos** en el movimiento voluntario del tronco. La lesión **derecha** produce **inestabilidad postural**: más oscilaciones, menos estabilidad y respuestas posturales erróneas. Es una disociación entre praxia y control postural."},{"tipo":"alerta","texto":"No atribuyas la **heminegligencia** ni la mayor inestabilidad postural al hemisferio izquierdo. Tampoco atribuyas **afasia, agrafia o acalculia** al derecho. En el listado del temario, la acalculia figura en el **izquierdo**, aunque el artículo de Benavides-Varela et al. (2017) estudia una acalculia espacial en lesionados derechos."},{"tipo":"perla","texto":"En el paciente con lesión derecha y heminegligencia, el riesgo de caídas es mayor: trabaja la **estabilidad del tronco** y las reacciones posturales, y la **exploración del hemiespacio olvidado**. En la lesión izquierda con afasia, adapta las consignas (demostración, órdenes simples) y trabaja las praxias."}]},{"id":"acv-valoracion-intervencion","titulo":"ACV: evaluación e intervención fisioterapéutica","bloques":[{"tipo":"tabla","titulo":"Herramientas de evaluación en el ACV","columnas":["Área","Herramienta","Qué mide"],"filas":[["Escalas funcionales","**NIHSS**","Severidad (gravedad) del ictus"],["Escalas funcionales","**Barthel**","Independencia en actividades de la vida diaria (AVD)"],["Funcionalidad motora","**Fugl-Meyer**","Recuperación motora tras ictus (citada como escala de funcionalidad)"],["Motora","**Ashworth**","Tono muscular (espasticidad); además, fuerza y reflejos patológicos"],["Marcha y equilibrio","**Prueba de marcha de 10 m** y **Test de Tinetti**","Marcha y equilibrio"],["Cognitiva","**MMSE** (Mini-Mental State Examination)","Estado cognitivo; también lenguaje y memoria"]]},{"tipo":"lista","items":["Objetivo 1: restaurar la funcionalidad perdida.","Objetivo 2: prevenir complicaciones secundarias.","Objetivo 3: mejorar la calidad de vida del paciente."]},{"tipo":"tarjetas","items":[{"etiqueta":"Intervención","titulo":"Reeducación motora","texto":"Fortalecimiento, control motor, movilidad articular; técnicas de facilitación neuromuscular."},{"etiqueta":"Intervención","titulo":"Manejo de la espasticidad","texto":"Estiramientos pasivos, técnicas de inhibición, ortesis."},{"etiqueta":"Intervención","titulo":"Marcha y equilibrio","texto":"Cinta de marcha, ejercicios de estabilidad, dispositivos de asistencia."},{"etiqueta":"Intervención","titulo":"Rehabilitación funcional","texto":"Entrenamiento en AVD y terapia ocupacional para ganar independencia."},{"etiqueta":"Intervención","titulo":"Neuroplasticidad","texto":"Ejercicios repetitivos y tareas orientadas a metas que estimulan la reorganización cerebral."},{"etiqueta":"Intervención","titulo":"Educación y apoyo familiar","texto":"Manejo en el hogar, prevención de caídas, técnicas de seguridad."}]},{"tipo":"perla","texto":"La neuroplasticidad depende de la **repetición** y de la **orientación a la tarea**. Diez repeticiones de una tarea con sentido (por ejemplo, coger un vaso) aportan más que un ejercicio analítico sin finalidad funcional."},{"tipo":"alerta","texto":"**NIHSS** mide gravedad, **Barthel** mide AVD y **Ashworth** mide tono. El **Glasgow** aparece en el bloque de TCE para el nivel de consciencia, no como escala del ACV."}]},{"id":"tce","titulo":"Traumatismo craneoencefálico (TCE)","bloques":[{"tipo":"tabla","titulo":"Epidemiología y etiología del TCE","columnas":["Aspecto","Dato del temario"],"filas":[["Incidencia","Una de las principales causas de discapacidad y mortalidad en **menores de 45 años**"],["Prevalencia","**200-500 personas/100.000 hab/año**; más afectados los **hombres jóvenes**"],["Accidentes de tráfico","Causa **más común de TCE grave**"],["Caídas","Más frecuentes en **niños y adultos mayores**"],["Agresiones físicas","Violencia interpersonal y abuso doméstico"],["Lesiones deportivas","Deportes de contacto (fútbol americano, boxeo…)"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Tipo","titulo":"TCE cerrado","texto":"Daño cerebral **sin fractura craneal**."},{"etiqueta":"Tipo","titulo":"TCE abierto","texto":"Daño cerebral **con fractura del cráneo** y posible exposición del tejido cerebral."}]},{"tipo":"tabla","titulo":"Manifestaciones clínicas del TCE","columnas":["Dominio","Manifestaciones"],"filas":[["Físicas","Cefalea, mareos, náuseas, vómitos, convulsiones, fatiga, trastornos del sueño"],["Cognitivas","Pérdida de memoria, confusión, dificultad de concentración, alteraciones del juicio"],["Emocionales","Cambios de humor, irritabilidad, depresión, ansiedad"],["Sensoriales","Visión borrosa, diplopía, sensibilidad al ruido y a la luz"],["Motoras","Debilidad, parálisis, espasticidad, ataxia (incoordinación)"]]},{"tipo":"tabla","titulo":"Evaluación fisioterápica del TCE","columnas":["Área","Herramienta / contenido"],"filas":[["Nivel de consciencia","**Escala de Coma de Glasgow (GCS)** (puntúa de 3 a 15 (complemento))"],["Motora","Fuerza, tono, reflejos anormales"],["Funcional","Capacidad para las AVD"],["Equilibrio y marcha","**Test de Romberg** y **Escala de Equilibrio de Berg**"],["Cognitiva","Atención, memoria y función ejecutiva"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Objetivo","titulo":"Restaurar","texto":"La funcionalidad **física y cognitiva**."},{"etiqueta":"Objetivo","titulo":"Prevenir","texto":"Complicaciones secundarias."},{"etiqueta":"Objetivo","titulo":"Reintegrar","texto":"Mejorar la calidad de vida y la **reintegración social**."}]},{"tipo":"lista","items":["**Reeducación motora**: fortalecimiento, coordinación, control motor.","**Manejo del tono**: técnicas de inhibición de la espasticidad, estiramientos pasivos.","**Marcha y equilibrio**: terapia de marcha, estabilidad postural.","**Rehabilitación funcional**: terapia ocupacional para AVD, adaptación a dispositivos de asistencia.","**Estimulación cognitiva**: actividades que integran la función cognitiva y la motora.","**Prevención de complicaciones**: movilizaciones pasivas, ejercicios respiratorios, educación sobre cambios posturales."]},{"tipo":"perla","texto":"En el TCE, el componente cognitivo-conductual (irritabilidad, falta de atención, alteración del juicio) condiciona la sesión. Usa **tareas dual cognitivo-motoras** graduadas y entornos con pocos estímulos, porque es frecuente la sensibilidad al ruido y a la luz."},{"tipo":"alerta","texto":"Los accidentes de tráfico son la causa más común de TCE **grave**. Las **caídas** predominan en niños y mayores. Y lo que define el TCE abierto es la **fractura craneal**, no la gravedad."}]},{"id":"parkinson-epi-etio","titulo":"Enfermedad de Parkinson: epidemiología y etiología","bloques":[{"tipo":"tabla","titulo":"Epidemiología de la EP","columnas":["Dato","Valor"],"filas":[["Afectación en >60 años","≈ 1 de cada 100 personas (dato rotulado como incidencia en el temario)"],["Personas con EP en el mundo","Más de 10 millones"],["Prevalencia","**682/100.000 hab**"],["Incidencia","**1,5-22/100.000 hab/año**"],["Sexo","Más común en **varones**"],["Posición","**2.ª** enfermedad neurodegenerativa más frecuente (la 1.ª es el **Alzheimer**)"],["Mortalidad","Una de las principales causas de muerte"]]},{"tipo":"parrafo","texto":"**Etiología**: es un proceso neurodegenerativo de las **neuronas dopaminérgicas**, sobre todo de la **sustancia negra**, que produce dopamina. La mayoría de los casos son **esporádicos y de causa desconocida**, aunque contribuyen factores genéticos y ambientales. **Factores de riesgo**: edad avanzada, antecedentes familiares, exposición a **pesticidas** y **traumatismos craneales repetidos**."},{"tipo":"esquema","titulo":"Cascada etiopatogénica de la EP según el temario","mermaid":"flowchart LR\n  subgraph S1[\"Vía no motora\"]\n    A[\"Disfunción bulbo olfatorio y plexos entéricos\"] --> B[\"Información alterada al núcleo dorsal del vago\"]\n    B --> C[\"Alteración de la motilidad visceral\"]\n  end\n  subgraph S2[\"Vía motora\"]\n    D[\"Alteración neuronas dopaminérgicas\"] --> E[\"Degeneración de la sustancia negra\"]\n    E --> F[\"Depleción de dopamina en ganglios basales\"]\n    F --> G[\"Alteración motora\"]\n  end","pie":"Dos secuencias: una periférica-visceral (bulbo olfatorio, plexos entéricos y núcleo dorsal del vago) y otra central-motora (sustancia negra y ganglios basales)."},{"tipo":"figura","pagina":42,"pie":"Esquema de la etiología: fila superior con la disfunción del bulbo olfatorio y los plexos entéricos que llega al núcleo dorsal del vago; fila inferior con la degeneración de la sustancia negra hasta la alteración motora.","src":"img/fisioterapia-neurologica-t4-tema-4-patologias-neurologicas-introduccion-acv-tce-y-enferm-p42.jpg"},{"tipo":"alerta","texto":"La sustancia negra **produce** dopamina; la **depleción** ocurre en los **ganglios basales**. El núcleo dorsal del vago pertenece a la vía visceral, no a la vía motora."}]},{"id":"parkinson-clinica","titulo":"Enfermedad de Parkinson: manifestaciones clínicas","bloques":[{"tipo":"tabla","titulo":"Síntomas motores cardinales y sus rasgos","columnas":["Síntoma","Características según el temario"],"filas":[["Temblor en reposo","Síntoma más característico y **síntoma inicial**; manos (a veces mandíbula o pies); **afecta más a MMSS**; **se reduce con el sueño**; **aumenta con el estrés**; **desaparece con el movimiento activo**"],["Rigidez","Aumento del tono con **resistencia al movimiento pasivo**; **produce dolor**; **varía según las horas o los días**; en **tubo de plomo** o en **rueda dentada**"],["Bradicinesia","Lentitud del movimiento voluntario: hipocinesia o acinesia, menor amplitud y/o velocidad, hipomimia, menor braceo, micrografía, habla suave y alargada; **mejora mucho con el tratamiento**; reduce la capacidad para las AVD"],["Inestabilidad postural","**Aparece tardíamente**; tronco encorvado con flexión de cadera y rodillas; menor amplitud del paso; festinación; paso congelado; dificultad para los ajustes compensatorios; **anteropulsión o retropulsión**"]]},{"tipo":"tabla","titulo":"Otros aspectos y síntomas","columnas":["Manifestación","Significado"],"filas":[["Festinación","Pasos cortos que se aceleran progresivamente"],["Paso congelado","Bloqueo brusco de la marcha"],["Micrografía","Disminución del tamaño de la escritura"],["Hipomimia facial","Pérdida de expresividad facial"],["Otros","Alteraciones del habla, depresión, disfunción autonómica"]]},{"tipo":"figura","pagina":49,"pie":"Inestabilidad postural: fíjate en que aparece tardíamente, en la postura en flexión, la festinación y el paso congelado, y en la anteropulsión o retropulsión.","src":"img/fisioterapia-neurologica-t4-tema-4-patologias-neurologicas-introduccion-acv-tce-y-enferm-p49.jpg"},{"tipo":"alerta","texto":"El temblor parkinsoniano es **de reposo**: **desaparece** al moverse. Si aumenta con la acción, no encaja con la descripción del temario. Y la rigidez parkinsoniana (tubo de plomo o rueda dentada) **no es espasticidad**, que es típica del ACV y del TCE."},{"tipo":"alerta","texto":"La micrografía y la hipomimia figuran en el temario tanto entre los otros aspectos como dentro de la **bradicinesia**: son expresiones de la bradicinesia."},{"tipo":"perla","texto":"Para la festinación y el paso congelado son útiles las **señales externas** (marcas en el suelo, ritmo auditivo) y las consignas de pasos amplios (complemento). Trabaja la extensión de tronco y las reacciones de equilibrio para contrarrestar la anteropulsión o retropulsión y reducir caídas."}]}],"caso_clinico":{"titulo":"Ictus isquémico de hemisferio derecho en varón hipertenso","presentacion":"Varón de **67 años**, hipertenso, diabético tipo 2 y fumador de 20 cigarrillos/día, con antecedente de ictus en su padre. Su esposa nota de forma brusca que tiene la boca torcida y que el brazo izquierdo se le cae. Llama al 112 y se diagnostica un **ictus isquémico** por oclusión de la arteria cerebral media derecha. A las 3 semanas, en la unidad de rehabilitación, presenta hemiparesia izquierda con espasticidad en flexores de codo, **heminegligencia izquierda**, pérdida de campo visual izquierdo y gran oscilación del tronco en sedestación, con respuestas posturales inadecuadas. Habla con fluidez y comprende las órdenes.","preguntas":[{"pregunta":"Clasifica sus factores de riesgo según el temario y explica qué aportó la actuación de su esposa.","respuesta":"**No modificables**: edad >55, sexo varón (mayor prevalencia) y antecedente familiar de ictus. **Modificables**: hipertensión, diabetes mellitus y tabaquismo. La esposa detectó dos de los tres **signos de sospecha** (paresia facial aguda y descenso del brazo), que tienen sensibilidad del 100 % y especificidad del 88 %. Al llamar al **112** redujo unas **6 h** la espera de atención médica, algo clave para limitar el daño isquémico."},{"pregunta":"¿Es coherente su cuadro con la lesión del hemisferio derecho? ¿Qué hallazgos no esperarías?","respuesta":"Sí. La heminegligencia, la pérdida de campo visual, las deficiencias somatosensoriales, los mayores déficits motores, el aumento de las oscilaciones del tronco y las respuestas posturales erróneas son propios del **hemisferio derecho**. No esperarías afasia, agrafia, acalculia, alteración de las praxias ni alteración de los movimientos voluntarios del tronco, que corresponden al **hemisferio izquierdo**. Que hable con fluidez apoya esta localización."},{"pregunta":"Diseña la valoración y las líneas de intervención fisioterapéutica.","respuesta":"**Valoración**: NIHSS (severidad), Barthel (AVD), Fugl-Meyer (función motora), Ashworth (tono del codo), marcha de 10 m y Tinetti cuando pueda deambular, y MMSE para el estado cognitivo. **Intervención**: reeducación motora con técnicas de facilitación neuromuscular; manejo de la espasticidad (estiramientos pasivos, técnicas de inhibición, ortesis); trabajo intensivo de control de tronco y equilibrio, por su inestabilidad; tareas repetitivas orientadas a metas que incluyan el hemiespacio izquierdo (neuroplasticidad); entrenamiento de AVD; y educación familiar en prevención de caídas, porque la heminegligencia y la inestabilidad aumentan mucho ese riesgo."}]},"glosario":[{"termino":"AIT","definicion":"Accidente isquémico transitorio: isquemia cerebral focal breve y reversible."},{"termino":"Hipoperfusión","definicion":"Disminución generalizada del flujo sanguíneo cerebral; mecanismo de ictus isquémico."},{"termino":"Hemianopsia","definicion":"Pérdida de visión en la mitad del campo visual."},{"termino":"Heminegligencia","definicion":"No atender ni responder a los estímulos de un hemiespacio; típica de la lesión del hemisferio derecho."},{"termino":"Afasia","definicion":"Trastorno del lenguaje; típica de la lesión del hemisferio izquierdo."},{"termino":"Disartria","definicion":"Dificultad para articular el habla."},{"termino":"Disfagia","definicion":"Dificultad para tragar."},{"termino":"Agnosia","definicion":"Incapacidad para reconocer objetos."},{"termino":"Acalculia","definicion":"Alteración de la capacidad de cálculo; listada en el temario en la lesión del hemisferio izquierdo."},{"termino":"Ataxia","definicion":"Incoordinación del movimiento; manifestación motora del TCE."},{"termino":"Bradicinesia","definicion":"Lentitud del movimiento voluntario (hipocinesia o acinesia, menor amplitud o velocidad)."},{"termino":"Rigidez en rueda dentada","definicion":"Resistencia al movimiento pasivo con cesiones intermitentes; la variante continua es la rigidez en tubo de plomo."},{"termino":"Festinación","definicion":"Marcha con pasos cortos que se aceleran progresivamente, como si el paciente persiguiera su centro de gravedad."},{"termino":"Paso congelado","definicion":"Bloqueo súbito de la marcha (freezing) en la EP."},{"termino":"Micrografía","definicion":"Disminución del tamaño de la escritura, expresión de la bradicinesia."}],"fuentes":["Velasco Juanes F. Prevención primaria del ictus. Gac Med Bilbao. 2003;100:99-104.","Guía de Práctica Clínica para el Manejo de Pacientes con Ictus en Atención Primaria. Ministerio de Ciencia e Innovación / Ministerio de Sanidad y Política Social; Agencia Laín Entralgo.","Benavides-Varela S, Piva D, Burgio F, Passarini L, Rolma G, Meneghello F, Semenza C. Re-assessing acalculia: Distinguishing spatial and purely arithmetical deficits in right-hemisphere damaged patients. Cortex. 2017;88:151-164.","Buxbaum LJ, Ferraro MK, Veramonti T, Farne A, Whyte J, Ladavas E, Frassinetti F, Coslett HB. Hemispatial neglect: Subtypes, neuroanatomy, and disability.","Spinazzola L, Cubelli R, Della Sala S. Impairments of trunk movements following left or right hemisphere lesions: dissociation between apraxic errors and postural instability. Brain. 2003;126:2656-2666.","Universidad Europea de Valencia. Tema 4: Patologías neurológicas (Villarón C. et al.)."],"qcm":[{"pregunta":"Un paciente sufre una parada cardiorrespiratoria prolongada con caída generalizada del flujo sanguíneo cerebral. Según la clasificación del temario, ¿cómo se encuadra la lesión cerebral resultante?","opciones":["Ictus hemorrágico intracerebral por rotura vascular","Accidente isquémico transitorio de carácter focal","Ictus isquémico embólico con isquemia de tipo focal","Ictus isquémico por hipoperfusión con isquemia global"],"correcta":3,"explicacion":"El temario define la hipoperfusión como una disminución generalizada del flujo sanguíneo cerebral y la incluye entre los mecanismos del ictus isquémico. Al ser generalizada, produce isquemia global (difusa), no focal.","por_opcion":["❌ El ictus hemorrágico implica extravasación de sangre por rotura de un vaso, no un descenso global del flujo.","❌ El AIT es una isquemia focal breve y reversible; una hipoperfusión generalizada no es focal.","❌ La embolia es un coágulo que viaja desde otra parte del cuerpo y suele producir isquemia focal; aquí no hay émbolo.","✅ Hipoperfusión = disminución generalizada del flujo, mecanismo isquémico que produce isquemia global (difusa)."]},{"pregunta":"Según la terminología del temario para el ictus hemorrágico, un sangrado situado por lo general entre el cráneo y las meninges se denomina de localización:","opciones":["Parenquimatosa","Intraventricular","Intracerebral","Intracraneal"],"correcta":3,"explicacion":"El temario distingue dos localizaciones del ictus hemorrágico: intracerebral (en el tejido encefálico) e intracraneal (por lo general entre el cráneo y las meninges).","por_opcion":["❌ Parenquimatosa equivaldría a una hemorragia en el tejido cerebral (intracerebral), no entre cráneo y meninges.","❌ Intraventricular no es una categoría recogida en el temario y alude al sistema ventricular, no al espacio cráneo-meninges.","❌ Intracerebral corresponde al sangrado dentro del tejido encefálico.","✅ Intracraneal: por lo general entre cráneo y meninges, según la diapositiva del ictus hemorrágico."]},{"pregunta":"Respecto al sexo como factor de riesgo no modificable del ictus, el temario indica que:","opciones":["Hay más prevalencia en hombres y más mortalidad en mujeres","Hay más prevalencia en mujeres y más mortalidad en hombres","Hay igual prevalencia y más mortalidad en los hombres","Hay más prevalencia y también más mortalidad en hombres"],"correcta":0,"explicacion":"La tabla de factores no modificables especifica el sexo con doble matiz: mayor prevalencia en hombres y mayor mortalidad en mujeres. Es una disociación típica de pregunta de examen.","por_opcion":["✅ Literal del temario: mayor prevalencia en hombres, mayor mortalidad en mujeres.","❌ Invierte ambos datos: la prevalencia es mayor en hombres y la mortalidad en mujeres.","❌ La prevalencia no es igual (es mayor en hombres) y la mortalidad es mayor en mujeres.","❌ La mortalidad es mayor en mujeres, no en hombres."]},{"pregunta":"¿Cuál de los siguientes figura en el temario como factor de riesgo de ictus potencialmente modificable, en una categoría distinta a la de los factores modificables clásicos?","opciones":["La hiperlipemia","Los anticonceptivos orales","La raza negra o asiática","La cardiopatía"],"correcta":1,"explicacion":"Los factores potencialmente modificables son obesidad, inactividad física, factores nutricionales, hábito alcohólico, abuso de drogas y anticonceptivos orales. Cardiopatía e hiperlipemia están entre los modificables, y la raza entre los no modificables.","por_opcion":["❌ La hiperlipemia es un factor modificable clásico, junto con HTA, DM y tabaco.","✅ Los anticonceptivos orales figuran entre los potencialmente modificables (Velasco Juanes, 2003).","❌ La raza negra o asiática es un factor no modificable.","❌ La cardiopatía aparece en la tabla como factor modificable."]},{"pregunta":"La combinación de paresia facial aguda, alteración del lenguaje y descenso del brazo identifica un ictus, según la GPC citada, con:","opciones":["Sensibilidad del 100 % y especificidad del 80 %","Sensibilidad del 95 % y especificidad del 88 %","Sensibilidad del 100 % y especificidad del 88 %","Sensibilidad del 88 % y especificidad del 100 %"],"correcta":2,"explicacion":"Según la GPC de Atención Primaria, los tres signos de sospecha tienen sensibilidad del 100 % y especificidad del 88 %. Es decir, no se escapa ningún ictus, aunque hay algún falso positivo.","por_opcion":["❌ La sensibilidad es correcta, pero la especificidad es del 88 %, no del 80 %.","❌ La especificidad es correcta, pero la sensibilidad es del 100 %.","✅ Sensibilidad 100 %, especificidad 88 %, dato literal del temario.","❌ Intercambia los valores: el 100 % corresponde a la sensibilidad."]},{"pregunta":"Tras un ictus, un paciente ignora los estímulos de su hemicuerpo izquierdo, presenta gran oscilación del tronco y respuestas posturales erróneas. ¿Qué hemisferio está lesionado y qué otro hallazgo es esperable?","opciones":["Izquierdo; afasia con lenguaje alterado","Izquierdo; acalculia con cálculo alterado","Derecho; pérdida del campo de visión","Derecho; agrafia con escritura alterada"],"correcta":2,"explicacion":"La heminegligencia, el aumento de las oscilaciones del tronco y las respuestas posturales erróneas son propios de la lesión del hemisferio derecho. En ese mismo hemisferio el temario incluye la pérdida del campo de visión.","por_opcion":["❌ La afasia corresponde al hemisferio izquierdo, y el cuadro descrito es derecho.","❌ La acalculia figura en la lesión izquierda y el cuadro no es izquierdo.","✅ La lesión derecha incluye heminegligencia, déficit somatosensorial, pérdida de campo visual, mayores déficits motores e inestabilidad postural.","❌ El hemisferio es correcto, pero la agrafia figura en la lesión izquierda."]},{"pregunta":"Un paciente con ictus presenta agrafia, acalculia y alteración de las praxias. Según el modelo de dualidad hemisférica, ¿qué afectación del tronco cabe esperar?","opciones":["Lesión derecha, con respuestas posturales erróneas","Lesión izquierda, con más oscilaciones y peor estabilidad","Lesión derecha, con heminegligencia y tronco apráxico","Lesión izquierda, con alteración del movimiento voluntario"],"correcta":3,"explicacion":"Agrafia, acalculia y apraxia sitúan la lesión en el hemisferio izquierdo, que en el tronco altera los movimientos voluntarios (errores apráxicos). La inestabilidad postural (oscilaciones, menor estabilidad, respuestas erróneas) es propia del hemisferio derecho (Spinazzola et al., 2003).","por_opcion":["❌ Las respuestas posturales erróneas son derechas, y el cuadro descrito es izquierdo.","❌ El hemisferio es correcto, pero las oscilaciones y la menor estabilidad corresponden a la lesión derecha.","❌ Los síntomas son de lesión izquierda; la heminegligencia es derecha.","✅ La lesión izquierda altera los movimientos voluntarios del tronco: disociación entre errores apráxicos e inestabilidad postural."]},{"pregunta":"En un paciente con ictus quieres cuantificar, por este orden, la gravedad del déficit, la independencia en AVD y el tono muscular. Según el temario, debes usar:","opciones":["Glasgow, Barthel y Tinetti","NIHSS, Barthel y Ashworth","NIHSS, Tinetti y Fugl-Meyer","Barthel, NIHSS y Ashworth"],"correcta":1,"explicacion":"El temario asigna la NIHSS a la severidad, el índice de Barthel a las AVD y la escala de Ashworth al tono. Tinetti se usa para marcha y equilibrio, y Glasgow para el nivel de consciencia en el TCE.","por_opcion":["❌ Glasgow mide nivel de consciencia y Tinetti no mide tono.","✅ NIHSS (severidad), Barthel (AVD) y Ashworth (tono), según la evaluación fisioterapéutica del ACV.","❌ Tinetti valora marcha y equilibrio, no AVD; Fugl-Meyer no es la escala de tono.","❌ Invierte NIHSS y Barthel: Barthel mide AVD, no gravedad."]},{"pregunta":"Sobre la epidemiología del traumatismo craneoencefálico recogida en el temario, es correcto que:","opciones":["Afecta a unos 15 millones de personas al año en el mundo","Es la primera causa de discapacidad a largo plazo en adultos","Afecta a 200-500 por 100.000 hab/año, sobre todo hombres jóvenes","Afecta a 682 por 100.000 habitantes y predomina en varones"],"correcta":2,"explicacion":"El temario estima que el TCE afecta a 200-500 personas por 100.000 habitantes al año, siendo los hombres jóvenes los más afectados, y lo sitúa entre las principales causas de discapacidad y mortalidad en menores de 45 años.","por_opcion":["❌ Los 15 millones de casos anuales corresponden al ACV.","❌ La primera causa de discapacidad a largo plazo en adultos es el ACV.","✅ Dato literal: 200-500/100.000 hab/año, con predominio en hombres jóvenes.","❌ 682/100.000 es la prevalencia de la enfermedad de Parkinson."]},{"pregunta":"Llegan a urgencias una mujer de 84 años y un niño de 3 años, ambos con un TCE. Según el temario, ¿cuál es la etiología más probable en estos dos grupos de edad?","opciones":["Lesiones deportivas","Agresiones físicas","Accidentes de tráfico","Caídas"],"correcta":3,"explicacion":"El temario señala que las caídas son más frecuentes en niños y adultos mayores. Los accidentes de tráfico son la causa más común de TCE grave, y las lesiones deportivas se asocian a deportes de contacto.","por_opcion":["❌ Las lesiones deportivas se vinculan a deportes de contacto como el fútbol americano o el boxeo.","❌ Las agresiones (violencia interpersonal, abuso doméstico) no se asocian específicamente a estas edades en el temario.","❌ Los accidentes de tráfico se destacan como causa más común de TCE grave, no por edades extremas.","✅ Las caídas son más frecuentes en niños y adultos mayores."]},{"pregunta":"¿Qué emparejamiento entre herramienta de evaluación y constructo medido es correcto según el apartado de TCE?","opciones":["Escala de Glasgow y nivel de consciencia","Escala de Berg y nivel de consciencia","Test de Romberg y función ejecutiva","Escala de Glasgow y equilibrio estático"],"correcta":0,"explicacion":"En el TCE, la Escala de Coma de Glasgow evalúa el nivel de consciencia, mientras que el Test de Romberg y la Escala de Berg evalúan el equilibrio y la marcha. La función ejecutiva se valora con pruebas cognitivas.","por_opcion":["✅ La GCS es la herramienta del temario para el nivel de consciencia.","❌ La escala de Berg evalúa el equilibrio, no la consciencia.","❌ El Romberg evalúa el equilibrio; la función ejecutiva se valora en la evaluación cognitiva.","❌ Glasgow no mide equilibrio; para ello están Romberg y Berg."]},{"pregunta":"Según los datos epidemiológicos del temario sobre la enfermedad de Parkinson, ¿qué afirmación es correcta?","opciones":["Tiene una prevalencia de 200-500/100.000 y predomina en varones","Su prevalencia es de 682/100.000 y es la segunda tras el Alzheimer","Su incidencia es de 682/100.000 hab/año y es la segunda tras el Alzheimer","Es la primera enfermedad neurodegenerativa y predomina en mujeres"],"correcta":1,"explicacion":"El temario da una prevalencia de 682/100.000 habitantes y una incidencia de 1,5-22/100.000 hab/año, con más casos en varones. La EP es la 2.ª enfermedad neurodegenerativa más frecuente, después del Alzheimer.","por_opcion":["❌ 200-500/100.000 es la cifra del TCE.","✅ Prevalencia de 682/100.000 y segunda enfermedad neurodegenerativa tras el Alzheimer.","❌ 682/100.000 es la prevalencia, no la incidencia (1,5-22/100.000/año).","❌ La primera enfermedad neurodegenerativa es el Alzheimer y la EP es más común en varones."]},{"pregunta":"En el modelo etiológico de la EP que presenta el temario, ¿qué estructura recibe la información alterada procedente del bulbo olfatorio y de los plexos entéricos antes de la alteración de la motilidad visceral?","opciones":["El núcleo dorsal del vago","Los ganglios basales","El núcleo subtalámico","La sustancia negra"],"correcta":0,"explicacion":"La secuencia no motora del esquema es: disfunción del bulbo olfatorio y de los plexos entéricos → información alterada al núcleo dorsal del vago → alteración de la motilidad visceral. La sustancia negra y los ganglios basales forman parte de la secuencia motora.","por_opcion":["✅ El núcleo dorsal del vago recibe la información alterada y conduce a la alteración de la motilidad visceral.","❌ Los ganglios basales son el lugar de la depleción de dopamina en la vía motora.","❌ El núcleo subtalámico no aparece en el esquema etiológico del temario.","❌ La sustancia negra pertenece a la vía motora (degeneración y déficit de dopamina)."]},{"pregunta":"Un paciente con sospecha de EP describe su temblor. ¿Qué característica no concuerda con el temblor parkinsoniano descrito en el temario?","opciones":["Disminuye de forma clara durante el sueño","Predomina en los miembros superiores","Se intensifica en situaciones de estrés","Se acentúa al llevarse un vaso a la boca"],"correcta":3,"explicacion":"El temblor de la EP es de reposo: es el síntoma inicial, se reduce con el sueño, aumenta con el estrés, afecta más a los MMSS y desaparece con el movimiento activo. Un temblor que aumenta durante una acción voluntaria contradice esta descripción.","por_opcion":["❌ Es concordante: el temario indica que se reduce con el sueño.","❌ Es concordante: afecta más a los MMSS.","❌ Es concordante: se incrementa con el estrés.","✅ No concuerda: el temblor parkinsoniano desaparece con el movimiento activo."]},{"pregunta":"En un paciente con EP de diagnóstico muy reciente, ¿qué manifestación sería la menos esperable según la cronología que plantea el temario?","opciones":["Festinación con anteropulsión y ajustes compensatorios fallidos","Temblor de la mano que se reduce claramente durante el sueño","Temblor de reposo en una mano que cede al coger un objeto","Temblor de la mano que se acentúa ante una situación de estrés"],"correcta":0,"explicacion":"El temario define el temblor como síntoma inicial y la inestabilidad postural (con festinación, paso congelado, anteropulsión o retropulsión y dificultad para los ajustes compensatorios) como de aparición tardía. Por eso es lo menos esperable al inicio.","por_opcion":["✅ La inestabilidad postural y sus componentes aparecen tardíamente.","❌ La reducción con el sueño es una característica del temblor, que es síntoma inicial.","❌ El temblor de reposo que desaparece con el movimiento activo es el síntoma inicial típico.","❌ El aumento del temblor con el estrés es un rasgo propio del temblor inicial."]}],"asignatura":"Fisioterapia neurológica","tema":4,"fecha":"2026-11-04"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const L = 'ABCD';
const secs = F.secciones || [];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="tarjetas">${(b.items||[]).map(t=>`<div class="tarjeta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="def"><b>${md(b.termino)}</b> — ${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota perla"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota alerta"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${md(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const nav = secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`).join('') + (F.caso_clinico?'<a href="#caso">Caso clínico</a>':'') + (F.glosario?.length?'<a href="#glosario">Glosario</a>':'') + `<a class="qcm" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`;

document.getElementById('app').innerHTML = `
<header class="portada"><div class="envoltura">
  <div class="etiquetas">${F.asignatura?`<span class="etiqueta">${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="etiqueta o">Tema ${esc(F.tema)}</span>`:''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="meta">${F.tipo==='grand-qcm'?`<div><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div><b>${secs.length}</b><span>secciones</span></div><div><b>${(F.ideas_clave||[]).length}</b><span>ideas clave</span></div>`}<div><b>${(F.qcm||[]).length}</b><span>preguntas</span></div><div id="ultimo"></div></div>
</div></header>
<nav class="indice" aria-label="Índice"><div class="envoltura">${nav}</div></nav>
<main class="envoltura">
  ${(F.objetivos||[]).length?`<div class="dos">
    <div class="caja"><h3>Objetivos</h3><ul>${(F.objetivos||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>
    <div class="caja"><h3>Lo que hay que saber</h3><ol class="claves">${(F.ideas_clave||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>
  </div>`:''}
  ${F.tipo==='grand-qcm'&&(F.fichas||[]).length?`<div class="caja" style="margin-top:40px"><h3>Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="num">Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd>`).join('')}</dl></section>`:''}
  <section id="qcm"><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="envoltura">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* ---------- esquemas ---------- */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:oscuro?'dark':'neutral',fontFamily:'Spectral, Georgia, serif',flowchart:{htmlLabels:true,curve:'basis'}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* ---------- QCM ---------- */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u) document.getElementById('ultimo').innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; }catch(e){} }
ultimo();
const marco = document.getElementById('marco');

function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${(pos)/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="etiqueta o" style="display:inline-block;margin-bottom:12px">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="btn sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="btn" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'Dominado. Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'Bien, pero repasa las preguntas falladas.':'Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="btn" id="rep">Repetir todo</button>${fallos.length?'<button class="btn sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
