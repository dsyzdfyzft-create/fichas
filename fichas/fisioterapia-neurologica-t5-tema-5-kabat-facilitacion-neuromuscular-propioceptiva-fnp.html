<!DOCTYPE html>
<html lang="es">
<head>

<title>Tema 5. Kabat: Facilitación Neuromuscular Propioceptiva (FNP) · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}

<script id="datos" type="application/json">{"titulo":"Tema 5. Kabat: Facilitación Neuromuscular Propioceptiva (FNP)","subtitulo":"Método creado por Herman Kabat en 1940 que usa un bombardeo sensorial exteroceptivo y propioceptivo, aplicado mediante patrones globales en diagonal y espiral, para excitar el SNC y obtener una respuesta motora funcional.","objetivos":["Al terminar, sabrás definir la FNP, situar su origen (Kabat, 1940; base de Sherrington) y explicar su filosofía: método integral, enfoque positivo y máxima funcionalidad.","Al terminar, sabrás explicar el fundamento del **bombardeo sensorial** y por qué a mayor estimulación sensitiva hay mayor facilitación neuromuscular.","Al terminar, sabrás describir y aplicar los 9 principios básicos: patrones, resistencia máxima, contactos manuales, estímulos verbal y visual, estiramiento, receptores articulares, sincronismo y posición del fisioterapeuta.","Al terminar, sabrás construir los 4 patrones del hombro derecho (pívot) con sus 3 componentes y reconocer qué patrones son antagonistas dentro de cada diagonal.","Al terminar, sabrás elegir el comando verbal y el estímulo articular correctos (tracción o coaptación) según el tipo de contracción y de patrón."],"ideas_clave":["La **FNP** utiliza información **superficial** (tacto, exteroceptores) y **profunda** (posición articular, estiramiento de tendón y músculo, propioceptores) para excitar el SNC y desencadenar una respuesta motora.","Creada por el **Dr. Herman Kabat en 1940**, se basa en estudios de desarrollo motor y en los conocimientos de **Sherrington** (inhibición recíproca, irradiación, inducción sucesiva, sumación espacial y temporal).","Fundamento: **movimiento natural** mediante **bombardeo sensorial**. A mayor estimulación sensitiva, mayor facilitación neuromuscular.","Los patrones son **globales, en masa, en diagonal y espiral**, con **3 componentes** (F-E, ABD-ADD y rotación) organizados alrededor de una **articulación pívot**. En cada diagonal hay **2 patrones antagonistas**.","**Resistencia máxima** = la mayor resistencia manual con la que el paciente **todavía puede realizar el movimiento**. Aumenta la excitación central (más unidades motoras) y produce **irradiación** a la musculatura débil por desbordamiento de excitación.","**Tracción en patrones de flexión** (favorece la amplitud articular) y **coaptación en patrones de extensión** (favorece los reflejos posturales).","El estiramiento facilita el músculo elongado y **sus sinérgicos de la misma articulación**. Debe ser **breve y sincrónico** con el esfuerzo voluntario.","Sincronismo normal: primero se corrigen las deficiencias proximales, pero el movimiento coordinado va de **distal a proximal**, porque a nivel distal hay mayor recepción de estímulos."],"secciones":[{"id":"introduccion","titulo":"Introducción: origen, filosofía y definición","bloques":[{"tipo":"parrafo","texto":"La **Facilitación Neuromuscular Propioceptiva (FNP)**, o método **Kabat**, fue creada por el **Dr. Herman Kabat en 1940**. Se basa en **estudios sobre desarrollo motor** y combina dos cosas: los conocimientos neurofisiológicos de **Sherrington** y el *arte* o forma de aplicar las técnicas y principios básicos del método. Kabat lo desarrolló **trabajando directamente con pacientes**, hasta dar con combinaciones de movimiento que resultaban acertadas. Por eso es un método empírico-clínico apoyado en una base neurofisiológica."},{"tipo":"perla","texto":"La frase de **Kabat (1950)** resume su filosofía: *Todos los seres humanos, incluyendo aquellos con discapacidades, tienen un potencial real sin explorar*. En la práctica, se valora y se trata a partir de lo que el paciente **sí puede hacer**, no a partir de su déficit."},{"tipo":"tarjetas","items":[{"etiqueta":"Principio 1","titulo":"Método integral","texto":"Cada tratamiento se dirige a la **globalidad del ser humano**, no a un problema específico ni a un segmento corporal aislado."},{"etiqueta":"Principio 2","titulo":"Enfoque positivo","texto":"Se **refuerza y emplea lo que el paciente puede hacer**, tanto a nivel **físico** como **psicológico**."},{"etiqueta":"Meta","titulo":"Máxima funcionalidad","texto":"Ayudar al paciente a alcanzar su **nivel de funcionalidad más alto**."}]},{"tipo":"definicion","termino":"FNP (definición del tema)","texto":"Utilización de información de origen **superficial** (tacto, **exteroceptores**) y **profundo** (posición articular, estiramiento de tendón y músculo, **propioceptores**) para producir la **excitación del SNC** y desencadenar una **respuesta motora**. La reeducación neuromuscular se interesa por la función de las zonas y grupos musculares que **efectúan conjuntamente el movimiento** a partir de un estímulo sensorial."},{"tipo":"alerta","texto":"En el PDF aparecen dos nombres: *Facilitación Neuromuscular Propioceptiva* (portada) y *Facilitación Neuronal Propioceptiva* (diapositiva de definición). Ambos se refieren al mismo método Kabat. Recuerda además la clasificación de la definición: el **tacto** es información **superficial/exteroceptiva**; la **posición articular** y el **estiramiento de tendón y músculo** son información **profunda/propioceptiva**."},{"tipo":"parrafo","texto":"El **fundamento** de la FNP es el **movimiento natural**. Para lograrlo se recurre al **bombardeo sensorial**: se suman estímulos táctiles, propioceptivos (estiramiento, articulaciones), auditivos (voz) y visuales. El objetivo es **excitar el sistema nervioso** y así **conseguir una respuesta motora**. El mecanismo es la sumación de aferencias: cuanto más estímulo converge sobre las motoneuronas, más fácil resulta que alcancen el umbral. De ahí la regla: **a mayor estimulación sensitiva, mayor facilitación neuromuscular**."},{"tipo":"esquema","titulo":"Bombardeo sensorial en la FNP","mermaid":"flowchart TD\n  E1[\"Tacto y contactos manuales\"] --> B[\"Bombardeo sensorial\"]\n  P1[\"Estiramiento y receptores articulares\"] --> B\n  V1[\"Estímulo verbal\"] --> B\n  O1[\"Estímulo visual\"] --> B\n  B --> S[\"Excitación del SNC\"]\n  S --> R[\"Respuesta motora\"]\n  R --> F[\"Movimiento natural y funcional\"]","pie":"Todas las aferencias convergen para excitar el SNC: a mayor estimulación sensitiva, mayor facilitación neuromuscular."},{"tipo":"figura","pagina":5,"pie":"Diagrama del profesor sobre el bombardeo sensorial. Fíjate en las cuatro vías de entrada (músculo y tendón, contacto manual, oído, vista), en la secuencia excitar el SN y conseguir una respuesta motora, y en el lema del óvalo azul.","src":"img/fisioterapia-neurologica-t5-tema-5-kabat-facilitacion-neuromuscular-propioceptiva-fnp-p5.jpg"},{"tipo":"tabla","titulo":"Patrones funcionales que busca reproducir la FNP","columnas":["Tipo","Ejemplos del temario"],"filas":[["Actividades básicas","Marcha, mano-boca, peinarse, levantarse"],["Actividades específicas","Gestos profesionales, gestos deportivos"]]},{"tipo":"tabla","titulo":"Mecanismos de Sherrington en los que se apoya la FNP (el PDF pide buscarlos)","columnas":["Mecanismo","Significado (complemento)"],"filas":[["Inhibición recíproca","Al contraerse el agonista se inhibe refleja y simultáneamente el antagonista (complemento)."],["Irradiación","Propagación de la excitación a otros músculos cuando el estímulo o la resistencia aumentan. El PDF la describe como desbordamiento de excitación hacia la musculatura más débil."],["Inducción sucesiva","La contracción de un antagonista facilita la contracción posterior del agonista (complemento)."],["Sumación espacial","Estímulos simultáneos desde distintos puntos se suman hasta alcanzar el umbral (complemento)."],["Sumación temporal","Estímulos sucesivos y repetidos en el tiempo se suman hasta alcanzar el umbral (complemento)."]]}]},{"id":"principios-patrones-resistencia","titulo":"Principios básicos (I): patrones de movimiento y resistencia máxima","bloques":[{"tipo":"lista","items":["Patrones de movimiento","Resistencia máxima","Contactos manuales","Estimulación verbal","Estimulación visual","Estímulo de estiramiento","Estímulo de receptores articulares","Sincronismo normal / para el énfasis","Posición del fisioterapeuta"]},{"tipo":"parrafo","texto":"**Patrones de movimiento.** Son **globales y en masa**, parecidos a los movimientos de las actividades de la vida diaria. Tienen forma de **diagonal y espiral** porque combinan **3 dimensiones**: flexión-extensión, abducción-aducción y un componente rotatorio. En la diapositiva 9 este componente aparece como *prono-supinación*. Cada patrón se organiza alrededor de una **articulación principal o pívot**. Se trabaja así porque el movimiento funcional humano nunca es uniplanar."},{"tipo":"figura","pagina":9,"pie":"Fotografías de un patrón de miembro superior en diagonal. Observa el contacto manual distal y proximal, y cómo el brazo atraviesa los tres planos alrededor del pívot (hombro).","src":"img/fisioterapia-neurologica-t5-tema-5-kabat-facilitacion-neuromuscular-propioceptiva-fnp-p9.jpg"},{"tipo":"parrafo","texto":"**Resistencia máxima / irradiación.** Es una **resistencia manual**. Se aplica la **máxima resistencia con la que el paciente todavía pueda realizar el movimiento**. Es fundamental para desarrollar la **resistencia y la potencia muscular**. Al exigir más, **aumenta la excitación central** y se **reclutan más unidades motoras**. Según **Gellhorn (1949)**, cuando la contracción es resistida aumentan la excitación cortical y la respuesta del músculo. Esta excitación aumentada facilita los mecanismos de **irradiación e inducción sucesiva** de Sherrington: el excedente se *desborda* hacia la **musculatura más débil**. La resistencia se combina siempre con otros estímulos (**resistencia + estímulos**)."},{"tipo":"esquema","titulo":"De la resistencia máxima a la irradiación","mermaid":"flowchart TD\n  A[\"Resistencia manual máxima tolerable\"] --> B[\"Aumento de la excitación cortical y central\"]\n  B --> C[\"Reclutamiento de más unidades motoras\"]\n  C --> D[\"Desbordamiento de la excitación\"]\n  D --> E[\"Irradiación a la musculatura débil\"]\n  B --> F[\"Facilita la inducción sucesiva\"]\n  C --> G[\"Desarrollo de resistencia y potencia\"]","pie":"Cadena fisiológica según el tema (Gellhorn, 1949; Sherrington)."},{"tipo":"alerta","texto":"Resistencia máxima **no** significa bloquear el movimiento ni aplicar la mayor fuerza posible del terapeuta. Es la **máxima resistencia que permite que el movimiento se siga realizando**. Si el paciente no consigue moverse, la resistencia ha dejado de ser máxima y se ha vuelto excesiva."},{"tipo":"figura","pagina":11,"pie":"Resistencia más estímulos en miembro superior e inferior. Mira cómo el fisioterapeuta usa ambas manos para resistir y orientar el patrón a la vez.","src":"img/fisioterapia-neurologica-t5-tema-5-kabat-facilitacion-neuromuscular-propioceptiva-fnp-p11.jpg"},{"tipo":"perla","texto":"Si un segmento está muy débil, se puede resistir intensamente el **segmento o patrón fuerte**. Por **irradiación**, el desbordamiento de excitación activa la musculatura débil que no responde por sí sola."}]},{"id":"principios-estimulos","titulo":"Principios básicos (II): contactos manuales y estímulos verbal, visual, de estiramiento y articular","bloques":[{"tipo":"parrafo","texto":"**Contactos manuales.** Aportan a la vez **estímulos propioceptivos y exteroceptivos**. Son un **mecanismo facilitador** que **orienta la dirección del movimiento** y **demanda la respuesta motora de los músculos agonistas**: la mano se coloca sobre la superficie hacia la que se dirige el movimiento. Así el movimiento queda **resistido y dirigido**. **No se usan presas en brazalete**: rodear el segmento estimularía también la cara antagonista y el estímulo direccional se volvería confuso (razonamiento complementario)."},{"tipo":"parrafo","texto":"**Estimulación verbal.** Los **comandos preparatorios** deben ser **claros**. Los **comandos de acción** deben ser **breves y enérgicos**. **Johansson (1983)** mostró que el **volumen** con el que se da la orden puede afectar a la contracción muscular resultante."},{"tipo":"tabla","titulo":"Comandos verbales según el tipo de trabajo","columnas":["Tipo de trabajo","Comando"],"filas":[["Isométrico","Mantenga"],["Concéntrico","Empuje / tire"],["Excéntrico","Deje ir / deje mover"],["Relajación","Relaje"]]},{"tipo":"alerta","texto":"Trampa típica: *deje ir* no es una orden de relajación. Corresponde al trabajo **excéntrico**: el paciente sigue contrayendo mientras el músculo se alarga de forma controlada. La relajación se pide con *relaje*."},{"tipo":"parrafo","texto":"**Estimulación visual.** El paciente **sigue el movimiento con la vista**, lo que funciona como **retroalimentación**. Tiene tres efectos: **refuerza el patrón de movimiento**, **aumenta la concentración** y **mejora la idea de espacio y el esquema corporal**."},{"tipo":"parrafo","texto":"**Estimulación por estiramiento.** El estiramiento facilita la contracción del **músculo elongado** y de los **músculos sinérgicos de la misma articulación**. El movimiento que se imprime para obtener el reflejo de estiramiento debe ser **breve** y **sincrónico con el esfuerzo voluntario** del paciente. Así se suman la aferencia refleja del huso y la orden voluntaria."},{"tipo":"parrafo","texto":"**Estímulo de receptores articulares.** Estos receptores se sitúan en la **cápsula periarticular**, la **cápsula profunda** y los **ligamentos**. La **compresión** y la **tracción** los estimulan y favorecen, **respectivamente**, los **reflejos posturales** (compresión) y la **amplitud articular** (tracción). Por eso se aplica **tracción en los patrones de flexión** y **coaptación en los patrones de extensión**."},{"tipo":"esquema","titulo":"Estímulo articular según el patrón","mermaid":"flowchart TD\n  A[\"Receptores articulares: cápsula y ligamentos\"] --> B[\"Patrón de flexión\"]\n  A --> C[\"Patrón de extensión\"]\n  B --> D[\"Tracción\"]\n  C --> E[\"Coaptación o compresión\"]\n  D --> F[\"Favorece la amplitud articular\"]\n  E --> G[\"Favorece los reflejos posturales\"]","pie":"Regla de oro: flexión con tracción, extensión con coaptación."},{"tipo":"perla","texto":"Lógica funcional de la regla: los patrones de extensión se relacionan con el apoyo y el soporte de carga, y la coaptación activa las reacciones posturales. Los patrones de flexión buscan alcance y recorrido, y la tracción favorece la amplitud articular."},{"tipo":"alerta","texto":"No inviertas el *respectivamente*: **compresión** se asocia a **reflejos posturales** y **tracción** a **amplitud articular**. Es una de las confusiones más preguntadas."}]},{"id":"principios-sincronismo-posicion","titulo":"Principios básicos (III): sincronismo y posición del fisioterapeuta","bloques":[{"tipo":"definicion","termino":"Sincronismo normal","texto":"Secuencia de contracción muscular en la realización de un **movimiento coordinado**."},{"tipo":"parrafo","texto":"En el desarrollo morfogenético normal, el **control proximal se adquiere antes que el distal**. Sin embargo, la **secuencia del movimiento coordinado va de distal a proximal**, porque a nivel distal existe **mayor recepción de estímulos motores**. En la práctica: **primero se corrigen las deficiencias proximales** (base estable) y después se ejecuta el patrón con su sincronismo normal, de **distal a proximal**."},{"tipo":"alerta","texto":"Trampa: *el control se adquiere de proximal a distal* y *el movimiento coordinado se ejecuta de distal a proximal* son afirmaciones **compatibles** y ambas correctas. Lo que se corrige primero son las deficiencias **proximales**."},{"tipo":"perla","texto":"**Sincronismo para el énfasis** (complemento, el PDF solo lo nombra): consiste en alterar deliberadamente la secuencia normal, frenando las partes fuertes, para concentrar el estímulo y la irradiación sobre el segmento débil que se quiere reforzar."},{"tipo":"parrafo","texto":"**Posición del fisioterapeuta.** Al inicio debe colocarse **en paralelo con el patrón**, es decir, alineado con la diagonal de movimiento. La **resistencia se aplica aprovechando el peso del cuerpo**, no solo la fuerza de los brazos. Esto da una resistencia más eficaz, mejor dosificada y más ergonómica."},{"tipo":"figura","pagina":18,"pie":"Posición del fisioterapeuta en un patrón de miembro inferior. Observa su alineación con la diagonal y cómo inclina el tronco para resistir con el peso corporal.","src":"img/fisioterapia-neurologica-t5-tema-5-kabat-facilitacion-neuromuscular-propioceptiva-fnp-p18.jpg"}]},{"id":"componentes-patrones","titulo":"Componentes de los patrones de movimiento","bloques":[{"tipo":"parrafo","texto":"Todo patrón tiene **3 componentes de dirección**: **flexión-extensión**, **abducción-aducción** y **rotación interna-externa**. En **cada diagonal hay dos patrones de movimiento**, que son **antagonistas** entre sí: cada uno es la inversión exacta de los tres componentes del otro."},{"tipo":"tabla","titulo":"Patrones con pívot en el hombro derecho (según el PDF)","columnas":["Patrón","Componentes","Antagonista en la misma diagonal"],"filas":[["A","Flexión, abducción, rotación externa","B (E, ADD, RI)"],["B","Extensión, aducción, rotación interna","A (F, ABD, RE)"],["C","Flexión, aducción, rotación externa","D (E, ABD, RI)"],["D","Extensión, abducción, rotación interna","C (F, ADD, RE)"]]},{"tipo":"esquema","titulo":"Las dos diagonales del hombro derecho","mermaid":"flowchart LR\n  P[\"Pívot: hombro derecho\"]\n  subgraph S1[\"Diagonal A-B\"]\n    A[\"A: F, ABD, RE\"] -->|\"antagonista\"| B[\"B: E, ADD, RI\"]\n  end\n  subgraph S2[\"Diagonal C-D\"]\n    C[\"C: F, ADD, RE\"] -->|\"antagonista\"| D[\"D: E, ABD, RI\"]\n  end\n  P --> A\n  P --> C","pie":"Cada diagonal contiene dos patrones opuestos en sus tres componentes. En el hombro, la flexión va con rotación externa y la extensión con rotación interna."},{"tipo":"figura","pagina":20,"pie":"Esquema del profesor con las dos diagonales cruzadas sobre el pívot del hombro derecho. Lee cada flecha de extremo a extremo: A (arriba izquierda) se opone a B (abajo derecha) y C (arriba derecha) se opone a D (abajo izquierda).","src":"img/fisioterapia-neurologica-t5-tema-5-kabat-facilitacion-neuromuscular-propioceptiva-fnp-p20.jpg"},{"tipo":"perla","texto":"Truco para el examen: en el hombro, **la flexión siempre lleva rotación externa** y **la extensión rotación interna**. Para hallar el antagonista de un patrón, invierte los tres componentes. En la nomenclatura clásica (complemento), F-ADD-RE corresponde a la flexión de la diagonal 1 y F-ABD-RE a la flexión de la diagonal 2."},{"tipo":"alerta","texto":"El tercer componente se nombra de dos formas en el PDF: *prono-supinación* (diapositiva 9) y *rotación interna-externa* (diapositiva 19). Son el componente rotatorio del patrón. En el hombro se expresa como RI/RE. Nunca combines F-ABD con RI ni E-ADD con RE en el esquema del tema."}]}],"caso_clinico":{"titulo":"Hemiparesia derecha leve: recuperar el gesto de peinarse","presentacion":"Varón de 58 años, diestro, con hemiparesia derecha leve tras un ictus hace 3 meses. Camina de forma independiente. Su principal queja es que no consigue llevar la mano a la cabeza para peinarse ni llevarse la cuchara a la boca. En la valoración, la musculatura proximal del hombro derecho (estabilizadores escapulares) está débil. La flexión de cadera y la extensión de rodilla homolaterales tienen buena fuerza. El paciente está motivado, pero se frustra con los ejercicios analíticos.","preguntas":[{"pregunta":"¿Qué patrón del hombro derecho elegirías para reproducir el gesto de peinarse y qué estímulo articular asociarías?","respuesta":"Peinarse exige elevar el brazo hacia arriba y afuera con rotación externa. Corresponde al patrón **A: flexión, abducción y rotación externa** con pívot en el hombro. Es un patrón de **flexión**, así que se asocia **tracción**, que estimula los receptores articulares y favorece la **amplitud articular**. Su antagonista, **B (extensión, aducción, rotación interna)**, se trabajaría con **coaptación**, que favorece los reflejos posturales."},{"pregunta":"La debilidad es proximal. ¿Cómo aplicas el sincronismo normal y por dónde empiezas?","respuesta":"Según el temario, **primero se corrigen las deficiencias proximales**: hay que estabilizar el hombro y la escápula antes de exigir el patrón completo. Una vez lograda la base proximal, el patrón se ejecuta con su **sincronismo normal, de distal a proximal**, porque a nivel distal hay mayor recepción de estímulos. Esto no contradice que el control se adquiera de proximal a distal en el desarrollo."},{"pregunta":"¿Qué recursos de la FNP usarías para potenciar la respuesta del hombro débil, respetando el enfoque del método?","respuesta":"1) **Resistencia máxima** sobre el patrón o los segmentos fuertes, para aprovechar la **irradiación** (desbordamiento de excitación) hacia la musculatura débil. La resistencia nunca debe impedir el movimiento. 2) **Contactos manuales** sobre la superficie de los agonistas, sin presas en brazalete. 3) **Estiramiento breve y sincrónico** al inicio del patrón. 4) Comandos de acción **breves y enérgicos** (*tire*, *mantenga*), sabiendo que el volumen influye en la contracción (Johansson, 1983). 5) Pedir que **siga la mano con la vista** como retroalimentación. Todo ello con un **enfoque positivo**, partiendo de lo que ya hace bien, y orientado a patrones funcionales como mano-boca y peinarse, que encajan con su motivación."}]},"glosario":[{"termino":"FNP","definicion":"Facilitación Neuromuscular Propioceptiva: uso de estímulos superficiales y profundos para excitar el SNC y desencadenar una respuesta motora."},{"termino":"Bombardeo sensorial","definicion":"Suma de estímulos táctiles, propioceptivos, verbales y visuales para facilitar la respuesta motora."},{"termino":"Exteroceptores","definicion":"Receptores de la información superficial, como el tacto."},{"termino":"Propioceptores","definicion":"Receptores de la información profunda: posición articular y estiramiento de tendón y músculo."},{"termino":"Patrón de movimiento","definicion":"Movimiento global, en masa, en diagonal y espiral, con tres componentes alrededor de una articulación pívot."},{"termino":"Pívot","definicion":"Articulación principal alrededor de la cual se organiza un patrón."},{"termino":"Resistencia máxima","definicion":"Máxima resistencia manual con la que el paciente todavía puede realizar el movimiento."},{"termino":"Irradiación","definicion":"Propagación de la excitación hacia la musculatura más débil por desbordamiento, facilitada por la resistencia."},{"termino":"Inducción sucesiva","definicion":"Mecanismo de Sherrington por el que la contracción del antagonista facilita al agonista (complemento)."},{"termino":"Coaptación","definicion":"Compresión articular aplicada en patrones de extensión; favorece los reflejos posturales."},{"termino":"Tracción","definicion":"Separación articular aplicada en patrones de flexión; favorece la amplitud articular."},{"termino":"Sincronismo normal","definicion":"Secuencia de contracción del movimiento coordinado, de distal a proximal."},{"termino":"Presa en brazalete","definicion":"Agarre que rodea el segmento; se evita en FNP porque no orienta bien la dirección del movimiento."}],"fuentes":["Kabat H. (1940; cita de 1950)","Sherrington C. (principios neurofisiológicos de base)","Gellhorn E. (1949), citado en el PDF como Guellhorn","Johansson (1983)","Tema 5. Kabat: Facilitación Neuromuscular Propioceptiva. Universidad Europea"],"qcm":[{"pregunta":"Con pívot en el hombro derecho, ¿cuál es el patrón antagonista, dentro de la misma diagonal, del patrón flexión-aducción-rotación externa?","opciones":["Flexión, abducción y rotación externa","Extensión, aducción y rotación interna","Extensión, abducción y rotación externa","Extensión, abducción y rotación interna"],"correcta":3,"explicacion":"En cada diagonal hay dos patrones antagonistas, y cada uno invierte los tres componentes del otro. El patrón C (F, ADD, RE) se opone al D (E, ABD, RI), según el esquema del hombro derecho del tema.","por_opcion":["❌ Es el patrón A, que pertenece a la otra diagonal y no es antagonista del C.","❌ Es el patrón B, antagonista del A (F, ABD, RE), no del C.","❌ Combina extensión con rotación externa, combinación que no existe en el esquema del tema.","✅ Invierte los tres componentes de F-ADD-RE: es el patrón D."]},{"pregunta":"Durante un patrón de extensión de miembro inferior se quiere estimular los receptores articulares según los principios de la FNP. ¿Qué maniobra corresponde y qué favorece principalmente?","opciones":["Coaptación, que favorece sobre todo los reflejos posturales","Tracción, que favorece sobre todo los reflejos posturales","Tracción, que favorece sobre todo la amplitud articular","Coaptación, que favorece sobre todo la amplitud articular"],"correcta":0,"explicacion":"El tema indica coaptación en patrones de extensión y tracción en patrones de flexión. Compresión y tracción favorecen, respectivamente, los reflejos posturales y la amplitud articular.","por_opcion":["✅ Extensión con coaptación, y la compresión favorece los reflejos posturales.","❌ Invierte ambos datos: la tracción va con la flexión y favorece la amplitud.","❌ La tracción se aplica en patrones de flexión.","❌ La maniobra es correcta, pero la amplitud articular se asocia a la tracción."]},{"pregunta":"Según el tema, el estímulo de estiramiento facilita la contracción de:","opciones":["El músculo elongado y sus sinérgicos de la misma articulación","El músculo elongado y sus antagonistas de la misma articulación","El músculo elongado y los sinérgicos de las articulaciones vecinas","Solo el músculo elongado, con inhibición de sus sinérgicos"],"correcta":0,"explicacion":"El PDF afirma que el estiramiento facilita la contracción del músculo elongado y de los músculos sinérgicos de la misma articulación. Su efecto facilitador se limita a ese grupo funcional.","por_opcion":["✅ Dato literal del temario.","❌ El antagonista no se facilita; si acaso se inhibe por inhibición recíproca.","❌ El tema restringe el efecto a los sinérgicos de la misma articulación.","❌ Los sinérgicos se facilitan, no se inhiben."]},{"pregunta":"¿Qué característica debe tener el movimiento impreso por el fisioterapeuta para obtener el reflejo de estiramiento en FNP?","opciones":["Breve y sincrónico con el esfuerzo voluntario del paciente","Sostenido y sincrónico con el esfuerzo voluntario","Sostenido y previo al esfuerzo voluntario del paciente","Lento y posterior al inicio del esfuerzo voluntario"],"correcta":0,"explicacion":"El temario especifica que el estiramiento debe ser breve y sincrónico con el esfuerzo voluntario. Así coinciden la aferencia refleja y la orden voluntaria, y sus efectos se suman.","por_opcion":["✅ Breve y sincrónico, tal como lo define el tema.","❌ El sincronismo es correcto, pero el estímulo debe ser breve, no sostenido.","❌ Ni sostenido ni previo: perdería la coincidencia con la orden voluntaria.","❌ Ni lento ni posterior: el reflejo debe coincidir con el esfuerzo."]},{"pregunta":"El fisioterapeuta quiere que el paciente descienda el brazo de forma controlada mientras le opone resistencia, alargando el músculo activo. ¿Qué comando corresponde según el tema?","opciones":["Relaje","Deje ir, deje mover","Empuje, tire","Mantenga"],"correcta":1,"explicacion":"El descenso controlado con el músculo alargándose bajo tensión es trabajo excéntrico. El tema asigna al excéntrico el comando deje ir, deje mover.","por_opcion":["❌ Corresponde a la relajación, sin contracción activa.","✅ Comando del trabajo excéntrico.","❌ Corresponde al trabajo concéntrico.","❌ Corresponde al trabajo isométrico."]},{"pregunta":"¿Qué asociación entre autor y aportación es correcta según el temario?","opciones":["Gellhorn (1983): el volumen de la orden modifica la contracción","Johansson (1983): la contracción resistida aumenta la excitación cortical","Johansson (1949): el volumen de la orden modifica la contracción","Gellhorn (1949): la contracción resistida aumenta la excitación cortical"],"correcta":3,"explicacion":"El tema atribuye a Gellhorn (1949) que la contracción resistida aumenta la excitación cortical y la respuesta muscular. A Johansson (1983) le atribuye que el volumen de la orden verbal puede afectar a la contracción.","por_opcion":["❌ Mezcla el autor de 1949 con el año y la aportación de Johansson.","❌ Año de Johansson correcto, pero la aportación es la de Gellhorn.","❌ Aportación de Johansson, pero con el año de Gellhorn.","✅ Autor, año y aportación correctos."]},{"pregunta":"Según el tema, ¿por qué el movimiento coordinado sigue una secuencia de distal a proximal?","opciones":["Porque a nivel distal existe mayor recepción de estímulos motores","Porque las deficiencias distales deben corregirse en primer lugar","Porque la musculatura proximal posee menos unidades motoras","Porque el control distal se adquiere antes que el proximal en el desarrollo"],"correcta":0,"explicacion":"El control proximal se adquiere antes que el distal, pero la secuencia del movimiento coordinado es la contraria. El motivo que da el tema es que a nivel distal existe mayor recepción de estímulos.","por_opcion":["✅ Justificación literal del temario.","❌ Lo primero que se corrige son las deficiencias proximales.","❌ El tema no da este argumento.","❌ Es al revés: el control proximal se adquiere antes."]},{"pregunta":"En la FNP, la resistencia máxima se define como:","opciones":["La resistencia manual mayor que puede generar el fisioterapeuta","La resistencia que detiene el movimiento y lo convierte en isométrico","La resistencia mecánica externa ajustada a la fuerza máxima del paciente","La resistencia manual mayor con la que el paciente aún realiza el movimiento"],"correcta":3,"explicacion":"El tema la describe como resistencia manual y como la máxima con la que el paciente pueda realizar el movimiento. Así se aumenta la excitación central y se recluta un mayor número de unidades motoras.","por_opcion":["❌ La referencia es la capacidad del paciente, no la fuerza del terapeuta.","❌ Si bloquea el movimiento deja de ser máxima y se vuelve excesiva.","❌ En FNP la resistencia es manual, no mecánica.","✅ Definición del temario."]},{"pregunta":"Un paciente no activa los extensores de muñeca débiles. Al resistir intensamente un patrón global con sus músculos fuertes, aparece contracción en los débiles. ¿Qué mecanismo lo explica según el tema?","opciones":["Sumación temporal por repetición de estímulos","Inhibición recíproca de la musculatura antagonista","Irradiación por desbordamiento de la excitación","Reflejo de estiramiento de los músculos sinérgicos"],"correcta":2,"explicacion":"La resistencia máxima aumenta la excitación central. Según el tema, esa excitación se irradia a la musculatura más débil mediante el desbordamiento de la excitación, un mecanismo descrito por Sherrington.","por_opcion":["❌ La activación procede de la intensidad de la resistencia, no de repetir estímulos.","❌ La inhibición recíproca relaja al antagonista; no activa músculos débiles a distancia.","✅ Es el mecanismo ligado a la resistencia máxima.","❌ En el caso no se aplica ningún estiramiento rápido."]},{"pregunta":"Sobre los contactos manuales en FNP, ¿qué afirmación es correcta?","opciones":["Aportan estímulos exclusivamente propioceptivos y orientan la dirección","Orientan la dirección y demandan respuesta de los agonistas, sin presas en brazalete","Se colocan sobre los antagonistas para inhibirlos y facilitar el movimiento","Utilizan presas en brazalete para estimular toda la circunferencia del segmento"],"correcta":1,"explicacion":"El tema define los contactos manuales como un mecanismo facilitador que orienta la dirección del movimiento y demanda la respuesta motora de los agonistas. Aportan estímulos propioceptivos y exteroceptivos, y prohíbe las presas en brazalete.","por_opcion":["❌ Los estímulos son propioceptivos y también exteroceptivos.","✅ Recoge su función y la prohibición del brazalete.","❌ La respuesta que se demanda es la de los agonistas.","❌ El tema prohíbe expresamente las presas en brazalete."]},{"pregunta":"Según la definición de FNP del tema, ¿cuál de estas informaciones se clasifica como superficial o exteroceptiva?","opciones":["Estiramiento tendinoso","Posición articular","Estiramiento muscular","Tacto"],"correcta":3,"explicacion":"La definición distingue entre información superficial (tacto, exteroceptores) e información profunda (posición articular, estiramiento de tendón y músculo, propioceptores).","por_opcion":["❌ Es información profunda o propioceptiva.","❌ Es información profunda o propioceptiva.","❌ Es información profunda o propioceptiva.","✅ Es la información superficial de la definición."]},{"pregunta":"¿Cuál de estas afirmaciones sobre los patrones de movimiento de Kabat es falsa?","opciones":["Se organizan alrededor de una articulación principal o pívot","Son globales y en masa, similares a los de la vida diaria","Aíslan cada plano para trabajarlo de manera analítica","Combinan flexo-extensión, abducción-aducción y rotación"],"correcta":2,"explicacion":"Los patrones son globales, en diagonal y espiral, y combinan tres dimensiones a la vez alrededor de un pívot. Aislar cada plano de forma analítica contradice su naturaleza.","por_opcion":["❌ Es verdadera: se organizan alrededor de un pívot.","❌ Es verdadera: es la descripción del tema.","✅ Es la falsa: los patrones son tridimensionales y globales, no analíticos.","❌ Es verdadera: son los tres componentes de dirección."]},{"pregunta":"¿Cómo debe colocarse el fisioterapeuta al inicio de un patrón y cómo aplica la resistencia, según el tema?","opciones":["En paralelo con el patrón, resistiendo con la fuerza de sus brazos","En paralelo con el patrón, resistiendo con el peso de su cuerpo","Perpendicular a la diagonal, resistiendo con la fuerza de sus brazos","Al final de la diagonal, resistiendo con el peso de su cuerpo"],"correcta":1,"explicacion":"El tema indica que el fisioterapeuta debe estar al inicio en paralelo con el patrón y aplicar la resistencia aprovechando el peso de su cuerpo.","por_opcion":["❌ La posición es correcta, pero la resistencia debe aprovechar el peso corporal.","✅ Posición y forma de resistir correctas.","❌ Falla en la posición y en la fuente de la resistencia.","❌ La posición de partida es en paralelo con el patrón, no al final de la diagonal."]},{"pregunta":"Una fisioterapeuta inicia la sesión de un paciente desmotivado con las actividades que ya ejecuta con éxito y refuerza sus logros también a nivel psicológico. ¿Qué principio de la FNP aplica?","opciones":["Enfoque positivo","Bombardeo sensorial","Sincronismo para el énfasis","Método integral"],"correcta":0,"explicacion":"El enfoque positivo consiste en reforzar y emplear lo que el paciente puede hacer, a nivel físico y psicológico. Es justo lo que describe el enunciado.","por_opcion":["✅ Coincide con la definición del tema.","❌ Es el fundamento de facilitación por suma de estímulos, no un principio motivacional.","❌ Se refiere a alterar la secuencia de contracción para enfatizar un segmento.","❌ El método integral se refiere a tratar la globalidad del ser humano, no a partir de lo que el paciente logra."]},{"pregunta":"¿Qué efecto atribuye el tema a la estimulación visual, es decir, a que el paciente siga el movimiento con la vista?","opciones":["Aumenta la amplitud articular del pívot","Desencadena el reflejo de estiramiento sinérgico","Mejora la idea de espacio y el esquema corporal","Inhibe la musculatura antagonista del patrón"],"correcta":2,"explicacion":"La estimulación visual actúa como retroalimentación. Según el tema, refuerza el patrón, aumenta la concentración y mejora la idea de espacio y el esquema corporal.","por_opcion":["❌ La amplitud articular se asocia a la tracción.","❌ El reflejo de estiramiento depende del estímulo de estiramiento.","✅ Efecto literal del temario.","❌ No es un efecto descrito para el estímulo visual."]}],"asignatura":"Fisioterapia neurológica","tema":5,"fecha":"2026-11-04","resumen":["La **FNP o método Kabat (Herman Kabat, 1940)** usa información **superficial (exteroceptiva)** y **profunda (propioceptiva)** para excitar el SNC y obtener una respuesta motora, mediante un **bombardeo sensorial** basado en los mecanismos de **Sherrington**: **a mayor estimulación sensitiva, mayor facilitación**.","Sus patrones son **globales, en masa, en diagonal y espiral**, con **3 componentes** (F-E, ABD-ADD y rotación) alrededor de una **articulación pívot**, y cada diagonal contiene **2 patrones antagonistas** (en el hombro, **la flexión va con rotación externa y la extensión con rotación interna**).","La **resistencia máxima** es la mayor resistencia manual con la que el paciente **todavía puede moverse**: recluta más unidades motoras y produce **irradiación** hacia la musculatura débil.","Se aplica **tracción en los patrones de flexión (amplitud articular)** y **coaptación en los de extensión (reflejos posturales)**, y el estiramiento debe ser **breve y sincrónico con el esfuerzo voluntario**, ya que facilita al músculo elongado y a **sus sinérgicos de la misma articulación**.","Los **contactos manuales** se colocan en la superficie hacia la que va el movimiento, los **comandos de acción son breves y enérgicos**, la vista aporta **retroalimentación**, y el movimiento coordinado se ejecuta **de distal a proximal**, tras **corregir antes las deficiencias proximales**."],"preguntate":[{"pregunta":"Explica el mecanismo por el que el **bombardeo sensorial** facilita la respuesta motora en la FNP.","respuesta":"Se suman estímulos táctiles, propioceptivos, auditivos y visuales que convergen sobre las motoneuronas. Por **sumación de aferencias**, estas alcanzan más fácilmente el umbral, de modo que a mayor estimulación sensitiva, mayor facilitación neuromuscular."},{"pregunta":"¿En qué se diferencian la **sumación espacial** y la **sumación temporal** de Sherrington?","respuesta":"En la espacial se suman **estímulos simultáneos procedentes de distintos puntos**. En la temporal se suman **estímulos sucesivos y repetidos en el tiempo**. En ambos casos el resultado es alcanzar el umbral de excitación."},{"pregunta":"Compara la **inhibición recíproca** y la **inducción sucesiva**.","respuesta":"En la inhibición recíproca, al contraerse el agonista se **inhibe** refleja y simultáneamente el antagonista. En la inducción sucesiva, la contracción previa del antagonista **facilita** la contracción posterior del agonista."},{"pregunta":"¿Por qué los patrones de Kabat tienen forma de **diagonal y espiral** y no se trabajan en un solo plano?","respuesta":"Porque combinan **3 dimensiones** (flexión-extensión, abducción-aducción y rotación) alrededor de una articulación pívot. Así reproducen el movimiento funcional humano, que **nunca es uniplanar**."},{"pregunta":"Enumera los **cuatro patrones con pívot en el hombro derecho**, indicando cuáles comparten diagonal.","respuesta":"**F-ABD-RE** con su antagonista **E-ADD-RI**, y **F-ADD-RE** con su antagonista **E-ABD-RI**. Cada antagonista invierte los tres componentes del otro."},{"pregunta":"Explica la **lógica funcional** de aplicar **tracción** en los patrones de flexión.","respuesta":"Los patrones de flexión buscan **alcance y recorrido**, y la tracción estimula los receptores articulares favoreciendo la **amplitud articular**. La coaptación se reserva para la extensión, que se relaciona con el apoyo y la carga."},{"pregunta":"¿Cómo deben ser los **comandos preparatorios** y los **comandos de acción**, y qué orden se usa para el trabajo **isométrico**, el **concéntrico** y la **relajación**?","respuesta":"Los preparatorios deben ser **claros**, y los de acción **breves y enérgicos**. Se usa *mantenga* para el isométrico, *empuje/tire* para el concéntrico y *relaje* para la relajación."},{"pregunta":"¿Qué es el **sincronismo para el énfasis** y cuándo lo usarías?","respuesta":"Es la **alteración deliberada de la secuencia normal**, frenando las partes fuertes para concentrar el estímulo y la irradiación sobre el **segmento débil**. Se usa cuando se quiere reforzar específicamente ese segmento."},{"pregunta":"Un paciente tiene mal control escapular y debilidad en la mano. ¿Qué corriges primero y en qué orden ejecutas después el patrón?","respuesta":"Primero se corrigen las **deficiencias proximales**, para obtener una base estable. Después se ejecuta el patrón con su sincronismo normal, **de distal a proximal**."},{"pregunta":"Resume la **filosofía de Kabat (1950)** y explica qué significa que la FNP sea un **método integral** orientado a la **máxima funcionalidad**.","respuesta":"Kabat sostenía que *todos los seres humanos, incluso con discapacidad, tienen un potencial real sin explorar*. Por eso se trata la **globalidad de la persona**, no un segmento aislado, para llevarla a su **nivel funcional más alto**, con patrones básicos (marcha, mano-boca, peinarse, levantarse) o específicos (gestos profesionales y deportivos)."}]}</script>
<div id="app"></div>
<script>
(function(){

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips">${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
