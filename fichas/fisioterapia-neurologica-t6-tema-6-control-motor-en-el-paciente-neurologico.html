<title>Tema 6. Control motor en el paciente neurológico · Ficha</title>

<style>
:root{
  --papel:#f6f4ef; --hoja:#fffdf9; --tinta:#1b2427; --suave:#5b676b; --linea:#e2ddd2; --acento:#1f6f6b; --acento-suave:#dcebe8;
  --ocre:#b37a1c; --ocre-suave:#f6ead3; --rojo:#a8402f; --rojo-suave:#f5e0db; --verde:#2f7a46; --verde-suave:#dcefe1;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --texto:"Spectral",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:19px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);line-height:1.12;margin:0;font-variation-settings:"SOFT" 50}
h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.9rem;font-weight:600;letter-spacing:-.015em;margin:0 0 18px}
h3{font-size:1.2rem;font-weight:600}
b,strong{font-weight:600}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px}
.envoltura{max-width:820px;margin:0 auto;padding:0 22px}
/* cabecera */
header.portada{padding:64px 0 36px;border-bottom:1px solid var(--linea)}
.etiquetas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.etiqueta{font:600 .78rem/1 var(--serif);padding:7px 11px;border-radius:999px;background:var(--acento-suave);color:var(--acento)}
.etiqueta.o{background:var(--ocre-suave);color:var(--ocre)}
.sub{font-size:1.25rem;color:var(--suave);margin:16px 0 0;max-width:62ch;font-style:italic}
.meta{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap}
.meta div{font-family:var(--serif)}
.meta b{display:block;font-size:1.7rem;font-weight:800;line-height:1}
.meta span{font-size:.8rem;color:var(--suave)}
/* navegación */
nav.indice{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px)}
nav.indice .envoltura{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .envoltura::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .85rem var(--serif);padding:7px 12px;border-radius:999px}
nav.indice a:hover{color:var(--tinta);background:var(--hoja)}
nav.indice a.qcm{background:var(--tinta);color:var(--papel);margin-left:auto}
main section{padding:56px 0 8px}
.num{font:800 .85rem var(--serif);color:var(--ocre);display:block;margin-bottom:6px}
p{margin:0 0 16px;max-width:68ch}
/* bloques */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:14px;padding:22px 24px}
.caja h3{margin-bottom:12px}
.caja ul,.caja ol{margin:0;padding-left:1.2em}
.caja li{margin:6px 0}
.claves{counter-reset:k;list-style:none;padding:0!important}
.claves li{counter-increment:k;padding-left:38px;position:relative;margin:10px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--acento);color:var(--papel);font:800 .8rem/26px var(--serif);text-align:center}
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
.tw{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--linea);border-radius:12px;background:var(--hoja)}
table{border-collapse:collapse;width:100%;font-size:.92rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:600 .95rem var(--serif);padding:14px 16px 4px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--linea)}
th{font:600 .82rem var(--serif);color:var(--suave);border-top:0}
tbody tr:nth-child(odd){background:color-mix(in srgb,var(--papel) 50%,transparent)}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 22px}
.tarjeta{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;font-size:.95rem;line-height:1.5}
.tarjeta .et{font:700 .72rem var(--serif);color:var(--ocre);display:block;margin-bottom:4px}
.tarjeta h3{font-size:1.05rem;margin-bottom:6px}
.def{border-left:3px solid var(--acento);padding:4px 0 4px 16px;margin:0 0 18px}
.def b{font-family:var(--serif);color:var(--acento)}
.nota{border-radius:12px;padding:14px 18px 14px 50px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;font-size:1.15rem}
.nota .t{font:700 .78rem var(--serif);display:block;margin-bottom:2px}
.perla{background:var(--verde-suave)} .perla::before{content:"🩺"} .perla .t{color:var(--verde)}
.alerta{background:var(--rojo-suave)} .alerta::before{content:"⚠️"} .alerta .t{color:var(--rojo)}
/* figuras y esquemas */
figure{margin:8px 0 26px;background:var(--hoja);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:20px 16px 8px;overflow-x:auto;text-align:center}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq .lienzo pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap;text-align:left}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{font-family:var(--serif);color:var(--tinta)}
/* caso clínico */
.caso{background:var(--tinta);color:var(--papel);border-radius:18px;padding:30px 30px 18px}
.caso h2{color:var(--papel)}
.caso p{color:color-mix(in srgb,var(--papel) 85%,transparent)}
.caso details{border-top:1px solid color-mix(in srgb,var(--papel) 18%,transparent);padding:12px 0}
.caso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
.caso details p{margin:10px 0 0}
dl.glosario{display:grid;grid-template-columns:max-content 1fr;gap:10px 20px;margin:0}
dl.glosario dt{font:600 1rem var(--serif);color:var(--acento)}
dl.glosario dd{margin:0}
.fuentes{font-size:.9rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border:1px solid var(--linea);border-radius:18px;padding:28px}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:600 .85rem var(--serif);color:var(--suave)}
.barra{flex:1;height:8px;border-radius:4px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--acento);transition:width .3s}
.pregunta{font:600 1.3rem/1.35 var(--serif);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer}
.op:hover:not([disabled]){border-color:var(--acento)}
.op .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 .9rem var(--serif);background:var(--hoja);border:1px solid var(--linea)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--verde);background:var(--verde-suave)}
.op.bien .l{background:var(--verde);color:#fff;border-color:var(--verde)}
.op.mal{border-color:var(--rojo);background:var(--rojo-suave)}
.op.mal .l{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{font:600 .95rem var(--serif);padding:11px 20px;border-radius:999px;border:0;background:var(--tinta);color:var(--papel);cursor:pointer}
.btn.sec{background:transparent;color:var(--tinta);border:1.5px solid var(--linea)}
.btn[disabled]{opacity:.35;cursor:default}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:800 4.4rem/1 var(--serif);letter-spacing:-.03em}
.resultado .gran small{font-size:1.6rem;color:var(--suave)}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:700px){body{font-size:17.5px}.dos{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}dl.glosario{grid-template-columns:1fr}dl.glosario dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i{transition:none}}
@media print{nav.indice,#qcm{display:none}body{background:#fff}}

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script id="datos" type="application/json">{"titulo":"Tema 6. Control motor en el paciente neurológico","subtitulo":"La neuroplasticidad es la base de la recuperación tras una lesión del SNC. Hay que potenciar su vertiente adaptativa, frenar la maladaptativa (espasticidad, dolor neuropático) y elegir el abordaje según la teoría de control motor que mejor explique cada déficit.","objetivos":["Definir neuroplasticidad (OMS 1982, Bisbe et al. 2019) y explicar sus cinco mecanismos: neurogénesis, colateralización/sinaptogénesis reactiva, sinapsis silentes, circuitos modulatorios y reorganización cortical.","Aplicar los principios de plasticidad dependiente de la experiencia de Kleim y Jones (2008) al diseño y a la revisión de un plan de fisioterapia neurológica.","Diferenciar la neuroplasticidad adaptativa de la maladaptativa y razonar el abordaje de la espasticidad (toxina botulínica, electroterapia tonolítica) y del dolor neuropático.","Relacionar cada signo clínico de control motor con su localización probable y con lo que hay que descartar.","Comparar las teorías refleja, jerárquica, de programación motora, de sistemas y de orientación a la actividad: autores, fundamentos, limitaciones e implicaciones clínicas."],"ideas_clave":["La neuroplasticidad se mantiene **toda la vida**, pero sus mecanismos **son limitados**. La recuperación espontánea es insuficiente, así que el tratamiento debe estimularla. El **cerebelo** acelera la recuperación sobre todo en los **6 primeros meses**.","Las **sinapsis silentes** se activan según la **demanda funcional** y solo con **entrenamiento y repetición**. De forma pasiva no se activan.","La **fisioterapia pasiva** no facilita el aprendizaje motor ni da buenos resultados en control motor ni en dolor neuropático. Sirve para **mantener el rango articular** y aumenta la modulación inhibitoria medular. La **activa** es más eficaz.","Principios de Kleim y Jones (2008): úsalo o piérdelo, úsalo y mejóralo, especificidad, repetición, intensidad, tiempo, calidad, edad, transferencia e interferencia. Si el tratamiento no avanza, revisa **especificidad, repetición e intensidad**.","Espasticidad: pérdida de inputs supraespinales → desinhibición de interneuronas medulares → aumento del reflejo de estiramiento → hipertonía e hiperreflexia. Es neuroplasticidad **maladaptativa**.","La toxina botulínica bloquea la liberación de acetilcolina y su efecto dura unos **3 meses**. El **sprouting** puede generar una **hipertonía reactiva**.","En el dolor neuropático, la desaferenciación **disminuye la representación cortical y aumenta el dolor**. El objetivo es aumentar la representación cortical con aferencias propioceptivas, táctiles y barométricas, terapia de espejo, imaginería motora, neurodinamia y educación.","No hay una teoría de control motor definitiva: el control motor **surge de la interacción individuo–actividad–ambiente**."],"secciones":[{"id":"introduccion","titulo":"Introducción: qué observamos en el paciente neurológico y por qué evaluamos","bloques":[{"tipo":"parrafo","texto":"Ante un trastorno de la realización del movimiento, el razonamiento clínico sigue tres pasos. Primero se describe **qué vemos** (en qué fase falla el movimiento). Después se plantea la **localización** probable de la lesión. Por último se **descartan** otras causas que imitan un problema de control motor. Este esquema evita atribuir al SNC lo que en realidad es cognitivo, de memoria o biomecánico."},{"tipo":"tabla","titulo":"Signo observado y localización probable","columnas":["¿Qué vemos?","Localización probable"],"filas":[["Problema en el **inicio** del movimiento","Región premotora / cerebelo lateral / ganglios basales"],["Problema **durante** el movimiento","Corteza motora / espinocerebelo"],["Problema en un movimiento que **debería ser automático**","Área motora suplementaria / tálamo"],["**Movimientos bruscos, reacciones asociadas**","Cerebelo / coordinación interhemisférica"],["**Negligencia** (trastorno para la realización del movimiento)","Se recoge como hallazgo aparte en el esquema del temario"]]},{"tipo":"lista","items":["**Descartar** antes de hablar de déficit de control motor: problemas cognitivos.","**Descartar**: alteraciones en la memoria de procesamiento.","**Descartar**: problemas biomecánicos agudos y crónicos."]},{"tipo":"figura","pagina":3,"pie":"Esquema del profesor en tres columnas: ¿qué vemos?, localización y descartar. Memoriza la correspondencia fila a fila (inicio, durante, automático, bruscos) y fíjate en que la negligencia aparece aparte, en rojo.","src":"img/fisioterapia-neurologica-t6-tema-6-control-motor-en-el-paciente-neurologico-p3.jpg"},{"tipo":"alerta","texto":"Trampa típica: el problema en un movimiento **automático** se asocia a **área motora suplementaria/tálamo**, no a los ganglios basales. Los ganglios basales aparecen en el problema de **inicio**, junto a la región premotora y el cerebelo lateral. El **espinocerebelo** va con la corteza motora en el problema **durante** el movimiento."},{"tipo":"tabla","titulo":"Problemas durante la evolución de los cuadros neurológicos","columnas":["Problema","Matiz del temario"],"filas":[["Problemas de control motor","Pueden aparecer incluso **15 minutos** después de un problema leve"],["Atrofia muscular","Por **desuso**"],["Alteraciones del equilibrio","—"],["Espasticidad","Neuroplasticidad maladaptativa"],["Modificaciones estructurales del músculo con **aumento del tejido conectivo**","Ej.: patología degenerativa (**Duchenne**)"],["Rigidez","—"],["Dolor","Incluye el dolor neuropático"]]},{"tipo":"figura","pagina":5,"pie":"Fotografías clínicas: pseudohipertrofia de gemelos en Duchenne (aumento de tejido conectivo, no de músculo funcional), patrón flexor espástico de muñeca y dedos, y atrofias por desuso en miembros inferiores.","src":"img/fisioterapia-neurologica-t6-tema-6-control-motor-en-el-paciente-neurologico-p5.jpg"},{"tipo":"tabla","titulo":"¿Por qué evaluamos? y ¿qué deberemos hacer?","columnas":["Objetivos de la evaluación","Por tanto, deberemos…"],"filas":[["Detectar afectaciones neurológicas o distintas patologías","Tener conceptos neuroestructurales"],["Ayudar a establecer objetivos a corto y largo plazo","Tener en cuenta aspectos biomecánicos"],["Formular un plan de tratamiento para recuperar el **control postural**","Ver las consecuencias en activación y AVD (**CIF**)"],["Documentar los cambios en la evolución del tratamiento","Ver las consecuencias y los efectos secundarios; activar las regiones que lo necesiten"],["Evaluar la independencia en la vida diaria; investigación","Prevenir consecuencias, rigidez y deformidades"]]}]},{"id":"neuroplasticidad-concepto","titulo":"Neuroplasticidad: concepto y principios","bloques":[{"tipo":"definicion","termino":"Neuroplasticidad (OMS, 1982)","texto":"Capacidad de las células del sistema nervioso para **regenerarse morfológica y funcionalmente** después de estar sujetas a influencias patológicas ambientales o del desarrollo, incluidos traumatismos y enfermedades. Permite una respuesta **adaptativa (o maladaptativa)** a la demanda funcional."},{"tipo":"definicion","termino":"Otra definición","texto":"Potencial dinámico del cerebro y de la médula espinal (**SNC**) para **reorganizarse** a sí mismo durante el **desarrollo, el aprendizaje o tras una lesión**. Es un **proceso continuo** que permite, a corto, medio y largo plazo, **remodelar** el mapa sináptico y **optimizar** el funcionamiento de las redes neuronales."},{"tipo":"lista","items":["Es la capacidad del cerebro para actuar y reaccionar ante situaciones siempre cambiantes (Bisbe et al., 2019).","Permite a los estimados **100 billones** de células nerviosas crear constantemente nuevos caminos de comunicación neural o reorganizar los existentes.","La capacidad plástica **se mantiene a lo largo de toda la vida**, también en el cerebro adulto.","Ocurre tanto en **condiciones normales de aprendizaje y adaptación** como en respuesta a **lesiones o enfermedades** que causen daño neuronal."]},{"tipo":"perla","texto":"El **cerebelo** es el que, tras una lesión neurológica, se encarga de **acelerar la recuperación**, sobre todo en los **6 primeros meses**. Después el paciente sigue aprendiendo, pero mucho más despacio. Por eso hay que concentrar intensidad terapéutica en esa ventana."},{"tipo":"alerta","texto":"Medicaciones y tóxicos como **benzodiacepinas (diazepam), barbitúricos y disolventes** no ayudan a la neuroplasticidad. Los antidepresivos y relajantes musculares también **pueden interferir**, a través de los circuitos modulatorios. Revisa siempre la medicación del paciente."}]},{"id":"mecanismos-plasticidad","titulo":"Mecanismos de plasticidad del sistema nervioso","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Neurogénesis","texto":"Producción de **nuevas células del SNC** (neuronas y glía). En humanos ocurre principalmente en **bulbo olfatorio, hipocampo y áreas de corteza cerebral**. Tras una lesión, la célula puede **migrar a zonas distales dañadas** y adoptar la función de la zona que ocupa, a una velocidad de **1 mm²/día**."},{"etiqueta":"2","titulo":"Colateralización y sinaptogénesis reactiva","texto":"Es **un único proceso**: se forman ramificaciones a partir de **axones intactos** que actúan como puentes entre neuronas sanas y dañadas. Puede darse en axones del **mismo o de distinto tipo** que el dañado. La colateralización es la conexión **anatómica**; la sinaptogénesis reactiva es la parte **funcional** posterior."},{"etiqueta":"3","titulo":"Sinapsis silentes","texto":"Conexiones normalmente **inactivas** que pueden activarse tras una lesión **según la demanda funcional**. Requieren **entrenamiento y repetición**: **de forma pasiva no se activan**."},{"etiqueta":"4","titulo":"Cambios en circuitos modulatorios","texto":"La actividad neuronal, normal o patológica, puede ser **modulada (facilitada o inhibida)** por mecanismos neurofisiológicos, y eso repercute en la funcionalidad del SNC. El **tratamiento farmacológico** (antidepresivos, relajantes musculares…) puede **interferir** en la neuroplasticidad."},{"etiqueta":"5","titulo":"Reorganización cortical","texto":"El SNC refleja en todo momento el estado de la musculatura y de todos los receptores (homúnculos somatosensorial y motor). Un **mayor uso** aumenta la representación cortical; un **menor uso** la reduce."}]},{"tipo":"alerta","texto":"No separes colateralización y sinaptogénesis como dos mecanismos distintos: el temario dice que son **un único proceso**. Primero se produce la conexión anatómica (colateralización) y después la sinapsis funcional (sinaptogénesis). El orden inverso es una trampa clásica."},{"tipo":"figura","pagina":17,"pie":"Homúnculos somatosensorial (izquierda) y motor (derecha). Observa la enorme representación de mano, cara y lengua: la representación cortical depende del uso y es la que se reduce con la desaferenciación o el desuso.","src":"img/fisioterapia-neurologica-t6-tema-6-control-motor-en-el-paciente-neurologico-p17.jpg"},{"tipo":"esquema","titulo":"Reorganización cortical dependiente del uso","mermaid":"flowchart LR\n  U[\"Uso de una región\"] --> M1[\"Mayor uso\"]\n  U --> M2[\"Menor uso\"]\n  M1 --> A1[\"Mayor activación\"]\n  A1 --> C1[\"Más conexiones nuevas\"]\n  C1 --> R1[\"Aumenta la representación cortical\"]\n  M2 --> A2[\"Menor activación\"]\n  A2 --> C2[\"Menos conexiones\"]\n  C2 --> R2[\"Disminuye la representación cortical\"]","pie":"Este circuito explica el «úsalo o piérdelo» y el «úsalo y mejóralo». También explica por qué la desaferenciación del dolor neuropático reduce el mapa cortical."},{"tipo":"perla","texto":"Para activar sinapsis silentes, programa **práctica activa y repetitiva** ligada a una demanda funcional real, por ejemplo coger objetos con la mano parética. Las movilizaciones pasivas aisladas no reclutan este mecanismo."}]},{"id":"fisioterapia-neuroplasticidad","titulo":"Neuroplasticidad y fisioterapia neurológica: pasiva, activa y principios de Kleim y Jones","bloques":[{"tipo":"parrafo","texto":"Los mecanismos de neuroplasticidad **son limitados** y la recuperación espontánea suele ser **limitada e insuficiente**. Por eso hay que promover la neurorrehabilitación, que produce cambios plásticos en todos los planos: **morfológicos, fisiológicos y neuroquímicos**. Las estrategias más utilizadas han sido el ejercicio pasivo, el movimiento activo y las aplicaciones farmacológicas."},{"tipo":"tabla","titulo":"Fisioterapia pasiva frente a activa","columnas":["Aspecto","Fisioterapia pasiva","Fisioterapia activa"],"filas":[["Ventajas","Aplicación **precoz**, evitando la neuroplasticidad maladaptativa. Actúa sobre **circuitos medulares** aumentando la **modulación inhibitoria** de receptores y reflejos.","**Más eficaz**: implica más sistemas moduladores del SNC (percepción, memoria, atención, emociones). **Disminuye moléculas inhibidoras** y favorece **factores neurotróficos**."],["Inconvenientes","Actúa **solo sobre el sistema musculoesquelético**. **No facilita el aprendizaje motor**.","Requiere la **participación** del paciente, que es fundamental."],["Indicación clave","No da buenos resultados en control motor ni en dolor neuropático. **Sí para mantener el rango articular**.","Recuperación motriz voluntaria: entrenamiento repetitivo orientado a la tarea, **restricción del lado sano**, programas de ejercicio físico, **Bobath, Perfetti**, control motor, **terapia de espejo, imaginería motora**."]]},{"tipo":"tabla","titulo":"Principios de plasticidad dependiente de la experiencia (Kleim y Jones, 2008)","columnas":["Principio","Contenido","Aplicación / ejemplo del temario"],"filas":[["Úsalo o piérdelo","El desuso de funciones cerebrales específicas puede llevar a pérdida funcional","Evitar el no uso del lado afecto"],["Úsalo y mejóralo","Entrenar una función específica la mejora","Práctica activa dirigida"],["Especificidad","La naturaleza del entrenamiento marca la naturaleza de la plasticidad","Si necesito trabajar la **pinza**, hago ejercicios de pinza"],["La repetición importa","Se requiere suficiente repetición, mejor con distintas tareas","**Dual task**: caminar mientras se deletrean palabras o se cuenta"],["La intensidad importa","Se requiere suficiente intensidad","Cuidado con la **fatiga** en patologías **degenerativas**"],["El tiempo importa","Distintas formas de plasticidad ocurren en distintos momentos del entrenamiento","No se puede trabajar cualquier objetivo en cualquier momento: hay que secuenciar"],["La calidad importa","La experiencia debe tener calidad suficiente","Ejecución correcta"],["La edad importa","La plasticidad se induce más fácilmente en cerebros jóvenes","Pronóstico"],["Transmisión / transferencia","La plasticidad de un entrenamiento facilita adquirir comportamientos similares","**Adaptar el entorno del tratamiento al entorno social**, a la vida del paciente"],["Interferencia","La plasticidad de una experiencia puede interferir en otros comportamientos","**Miedo tras una caída**: por ello, **protección siempre**"]]},{"tipo":"alerta","texto":"El **dual task** aparece en el principio **«la repetición importa»** (repetir con distintas actividades), no en especificidad ni en transferencia. Y si el tratamiento no avanza, el temario manda revisar **tres aspectos**: especificidad, repetición e intensidad."},{"tipo":"lista","items":["Conclusión: hay que favorecer los mecanismos de neuroplasticidad (morfológicos, fisiológicos y neuroquímicos).","La **repetición** favorece cambios celulares y en la estructuración cortical.","Son fundamentales la **participación** y la **motivación** del paciente.","El tratamiento es una **facilitación** para que el paciente **aprenda** movimientos.","La forma más importante en que el entorno cambia el comportamiento humano es el **aprendizaje**.","Los cambios a **corto plazo** reflejan cambios temporales en la **eficiencia sináptica**; las **variaciones estructurales** son el sello del aprendizaje a **largo plazo**."]}]},{"id":"adaptativa-maladaptativa","titulo":"Neuroplasticidad adaptativa y maladaptativa: espasticidad","bloques":[{"tipo":"tabla","titulo":"Tipos de neuroplasticidad","columnas":["Tipo","Definición","Ejemplos"],"filas":[["Adaptativa","La adecuada, la que se espera y se busca. El SNC refuerza habilidades específicas. También es la capacidad de compensar la lesión o los cambios del input sensorial **tras el shock inicial**, y coincide con la reorganización neuronal natural o inducida","Destrezas motoras por práctica consciente, segundo idioma, instrumento musical; reorganización de la **corteza auditiva tras implante coclear** en sordera precoz; reorganización de la corteza motora tras un **AVC**"],["Maladaptativa","Procesos fisiopatológicos que activan **áreas compensatorias inadecuadas** y desarrollan **síntomas adversos**","**Espasticidad** y **dolor neuropático**"]]},{"tipo":"parrafo","texto":"La **espasticidad**, igual que el resto de **síntomas positivos del síndrome de neurona motora superior**, es una adaptación del sistema nervioso y muscular a una lesión primaria. Al perder los inputs supraespinales, las interneuronas medulares que inervan las motoneuronas dejan de estar controladas. Esa desinhibición aumenta la actividad refleja."},{"tipo":"esquema","titulo":"Cascada fisiopatológica de la espasticidad","mermaid":"flowchart TD\n  L[\"Lesión primaria de neurona motora superior\"] --> P[\"Pérdida de inputs supraespinales\"]\n  P --> D[\"Desinhibición de interneuronas medulares\"]\n  D --> R[\"Aumento de reflejos de estiramiento\"]\n  R --> H1[\"Hipertonía\"]\n  R --> H2[\"Hiperreflexia\"]\n  R --> H3[\"Probable actividad muscular involuntaria\"]","pie":"Es el mismo mecanismo que se describe para la neuroplasticidad maladaptativa: interrupción supraespinal, desinhibición y exceso de actividad refleja."},{"tipo":"esquema","titulo":"Toxina botulínica y plasticidad maladaptativa","mermaid":"flowchart TD\n  T[\"Toxina botulínica en unión neuromuscular\"] --> B[\"Bloqueo de liberación de acetilcolina\"]\n  B --> P[\"Parálisis muscular temporal\"]\n  P --> S[\"Supersensibilidad y denervación\"]\n  S --> SP[\"Sprouting: nuevas conexiones nervio-músculo\"]\n  SP --> E[\"Fin del efecto hacia los 3 meses\"]\n  E --> HR[\"Posible hipertonía reactiva\"]","pie":"El propio bloqueo induce sprouting. Por eso el efecto es transitorio (unos 3 meses) y puede aparecer una hipertonía reactiva."},{"tipo":"perla","texto":"Aprovecha la **ventana de la toxina** (unos 3 meses) para trabajar de forma activa el antagonista y la tarea funcional. Si no, al revertir el efecto por sprouting, el paciente vuelve al patrón previo o empeora con una hipertonía reactiva."},{"tipo":"tabla","titulo":"Electroterapia en espasticidad (terapia tonolítica)","columnas":["Modalidad","Músculo / nivel estimulado"],"filas":[["Tonolítica **directa**","Músculo **agonista (el espástico)**"],["Tonolítica **indirecta**","Músculo **antagonista** al espástico"],["Tonolítica por estimulación **supraliminal**","Otros **niveles superiores**"]]},{"tipo":"lista","items":["Tratamiento **nunca aislado**.","**Suspenderlo** si no se obtienen resultados.","Referencia de interés: estudios de **McDonough y Kitchen (2002)**.","Medición con la **escala de Ashworth modificada**. Es difícil medir la espasticidad: unos estudios muestran disminución y otros no."]},{"tipo":"alerta","texto":"Confusión frecuente: en la tonolítica **directa** se estimula el **propio músculo espástico**; en la **indirecta**, el **antagonista**. «Supraliminal» aquí significa estimular **niveles superiores**, no una intensidad por encima del umbral."}]},{"id":"dolor-neuropatico","titulo":"Neuroplasticidad maladaptativa: dolor neuropático","bloques":[{"tipo":"definicion","termino":"Dolor neuropático","texto":"Dolor causado por una **lesión o disfunción del sistema nervioso**, producido por respuestas maladaptativas activadas tras la lesión y por una alteración de las aferencias que conducen el dolor."},{"tipo":"tabla","titulo":"Mecanismos maladaptativos del dolor neuropático","columnas":["Mecanismo","Explicación"],"filas":[["Impulsos ectópicos en vías nociceptivas","Por **sobreaumento de la sustancia P**, neurotransmisor implicado en el aumento de la respuesta inflamatoria y en la sensibilización nociceptiva"],["Sensibilización central","Las neuronas medulares nociceptivas **bajan su umbral**, lo que produce **hiperalgesia y alodinia** (percepción anormal del dolor)"],["Cambios secundarios a la desaferenciación","**Disminuye la representación cortical y aumenta el dolor**"]]},{"tipo":"esquema","titulo":"Del dolor neuropático al objetivo terapéutico","mermaid":"flowchart TD\n  L[\"Lesión o disfunción del SN\"] --> D[\"Desaferenciación\"]\n  D --> RC[\"Disminuye la representación cortical\"]\n  RC --> DO[\"Aumenta el dolor\"]\n  DO --> OB[\"Objetivo: aumentar la representación cortical\"]\n  OB --> A1[\"Aferencias propioceptivas\"]\n  OB --> A2[\"Aferencias táctiles\"]\n  OB --> A3[\"Aferencias barométricas\"]\n  OB --> A4[\"Terapia de espejo e imaginería motora\"]","pie":"La lógica terapéutica invierte la cascada: si la desaferenciación encoge el mapa cortical, hay que aumentar la entrada sensitiva."},{"tipo":"tarjetas","items":[{"etiqueta":"Tto 1","titulo":"Terapia de espejo","texto":"Combina un **componente visual** y **elementos propioceptivos**. Se relaciona con las **neuronas espejo**."},{"etiqueta":"Tto 2","titulo":"Imaginería motora / práctica mental","texto":"**Acelera** la adquisición de una nueva destreza motora y es muy utilizada en deporte. **Práctica mental + física** mejora más la ejecución que la práctica física sola."},{"etiqueta":"Tto 3","titulo":"Neurodinamia y educación para el dolor","texto":"Tratamiento de fisioterapia propuesto. Referencia: *Explicando el dolor* (**Butler y Moseley**, arte de Sunyata). Hay un vídeo traducido por la **Sociedad Española del Dolor (SED)**."}]},{"tipo":"alerta","texto":"La **movilización pasiva** no da buenos resultados en el dolor neuropático, igual que en el control motor. Que el paciente tenga dolor no justifica pasar a un abordaje pasivo."}]},{"id":"control-motor-bases","titulo":"Control motor: definición y bases neurofisiológicas","bloques":[{"tipo":"definicion","termino":"Control motor","texto":"Capacidad para **regular o dirigir los mecanismos esenciales para el movimiento**. Surge de la **interacción del individuo, la actividad (tarea) y el ambiente**. También se define como la **transmisión sistemática de impulsos nerviosos desde la corteza motora a las unidades motoras**, que produce contracciones musculares coordinadas."},{"tipo":"lista","items":["Estudia la naturaleza del movimiento y de su control.","Se centra en el **dominio de un movimiento ya adquirido**, a diferencia del aprendizaje motor, que estudia la adquisición.","Explica cómo un sujeto realiza una tarea en un ambiente determinado.","Tiene dos elementos: la **estabilización** del cuerpo en el espacio (**postura y equilibrio**) y el **desplazamiento** del cuerpo en el espacio (**movimiento**)."]},{"tipo":"alerta","texto":"**Tarea ≠ AVD**. El temario lo subraya al contraponer fisioterapia y terapia ocupacional: la tarea de control motor no equivale a la actividad de la vida diaria."},{"tipo":"parrafo","texto":"En la organización del movimiento intervienen, por este orden, **movimiento → estabilidad proximal → manipulación distal**. Es la idea del **concepto Bobath**: sin estabilidad proximal no hay manipulación distal eficaz. Además, los **procesos cognitivos** son fundamentales, porque ningún movimiento se realiza sin un propósito. La **atención, la motivación y los aspectos emocionales** son la base para fijar objetivos, y el control motor incluye **sistemas perceptivos y de acción** organizados para alcanzarlos."},{"tipo":"tabla","titulo":"Implicación del SN en el control motor","columnas":["Sistemas de acción","Sistemas sensoriales"],"filas":[["Corteza cerebral","**Somatosensorial**: husos neuromusculares, órganos tendinosos de Golgi, receptores articulares y cutáneos"],["Ganglios basales","**Visión**: identifica objetos en el espacio y su movimiento (**sensibilidad exteroceptiva**). También informa de dónde está el cuerpo, de la relación entre sus partes y de su movimiento (**propiocepción visual**)"],["Diencéfalo","**Vestibular**: posición de la cabeza en el espacio y movimientos **repentinos** de esta. Es necesaria primero una estabilidad postural de **cabeza y mirada**"],["Cerebelo, tronco encefálico, médula espinal","Corteza cerebral (integración)"]]},{"tipo":"perla","texto":"La **corteza cerebral** figura a la vez como sistema de acción y como sistema sensorial (Cano de la Cuerda y Collado Vázquez, 2012). Ante un paciente con inestabilidad, explora por separado los aportes visual, vestibular y somatosensorial antes de entrenar el equilibrio."}]},{"id":"teorias-control-motor","titulo":"Teorías del control motor","bloques":[{"tipo":"parrafo","texto":"Una **teoría** es un grupo de ideas sobre la causa y la naturaleza del movimiento. Con frecuencia, aunque no siempre, se basa en **modelos de función del SN**. Un **modelo** es una representación simplificada de lo real, en este caso de la estructura y función cerebral asociadas al movimiento. Teorías y modelos están unidos, reflejan distintos enfoques de fisioterapia y todas tienen base empírica y científica."},{"tipo":"tabla","titulo":"Comparativa de las teorías del control motor","columnas":["Teoría","Autor","Idea central","Limitación / implicación clínica"],"filas":[["Refleja","**Sherrington** (1857–1952)","Estímulo → receptores → respuesta ajustada. Los reflejos simples se combinan en acciones mayores. Los estímulos aferentes son **prerrequisito**: si el sistema somatosensorial está afectado, **no hay aprendizaje motor**","No explica movimientos **novedosos** ni el movimiento **sin estímulo sensorial**. Clínica: regular el efecto de los reflejos durante la tarea (**Vojta**, en parte **Bobath**)"],["Jerárquica","**Rudolf Magnus** (1920)","Organización de arriba abajo: los **centros superiores inhiben** la actividad refleja de los inferiores. Los reflejos de niveles inferiores **solo aparecen si se dañan los centros corticales** (triple flexión, Babinski, espasticidad)","No explica que un reflejo de nivel inferior domine la función en adultos **normales** (**reflejo de retirada**). Clínica: análisis de reflejos para evaluar, estimar la **maduración neural** y predecir la capacidad funcional (Bobath control cortical, Perfetti control cognitivo)"],["Programación motora","—","Automatización del movimiento: el movimiento es posible **sin control de centros superiores** sobre la acción refleja. Puede haber respuesta por estímulo sensorial **o por proceso central sin aferencia**","Reaprender patrones correctos ante trastornos de niveles superiores. Recuperar **movimientos clave funcionales** en lugar de reeducar músculos aislados. Ejemplo: **Lokomat**"],["Sistemas","**Nicolai Bernstein** (1896–1966)","El cuerpo es un **sistema mecánico** con masa, sometido a fuerzas externas (gravedad) e internas (inercia, dependientes del movimiento). El mismo comando da movimientos distintos y el mismo movimiento puede venir de comandos distintos. **Modelo distributivo**","Enfoque **global**: evaluar la interacción entre sistemas, incluido el musculoesquelético. **No recomienda estiramientos** para reducir la espasticidad"],["Orientación a la actividad","**Peter Greene**","Importa entender los **problemas que el SNC debe resolver**, más que los circuitos. El objetivo es dominar el movimiento para una **acción concreta**, no moverse por moverse","Recuperación centrada en **actividades esencialmente funcionales**, con análisis de componentes y de la biomecánica de las acciones diarias (muy usada en T.O.)"]]},{"tipo":"esquema","titulo":"Modelo de reflejos jerárquicos (teoría jerárquica)","mermaid":"flowchart TD\n  C[\"Nivel cortical-cerebral\"] -->|\"inhibe\"| M[\"Nivel mesencefálico\"]\n  M -->|\"inhibe\"| T[\"Nivel tronco del encéfalo\"]\n  T -->|\"inhibe\"| E[\"Nivel espinal\"]\n  C --- C1[\"Reacciones de equilibrio\"]\n  M --- M1[\"Reacciones de enderezamiento\"]\n  T --- T1[\"Tónico cervical asimétrico y simétrico, tónico laberíntico\"]\n  E --- E1[\"Reflejos primitivos y de estiramiento\"]","pie":"Los centros más altos inhiben la actividad refleja de los más bajos. Una lesión cortical libera los reflejos inferiores."},{"tipo":"tabla","titulo":"Niveles del modelo de reflejos jerárquicos","columnas":["Nivel","Reflejos / reacciones"],"filas":[["Espinal","Reflejos primitivos (**Moro, succión, presión**) y reflejos de estiramiento"],["Tronco del encéfalo","**Tónico cervical asimétrico**, **tónico cervical simétrico**, **tónico laberíntico**"],["Mesencefálico","**Reacciones de enderezamiento**: alineación del cuerpo respecto a la gravedad y recuperación de la posición tras un giro"],["Cortical-cerebral","**Reacciones de equilibrio**: respuesta a inclinaciones de la superficie de soporte"]]},{"tipo":"figura","pagina":69,"pie":"Modelo de reflejos jerárquicos con el esquema córtex, mesencéfalo, tronco y médula. Asocia cada nivel con su reacción: equilibrio (córtex), enderezamiento (mesencéfalo), reflejos posturales tónicos (tronco) y reflejos fásicos/primitivos (médula).","src":"img/fisioterapia-neurologica-t6-tema-6-control-motor-en-el-paciente-neurologico-p69.jpg"},{"tipo":"alerta","texto":"Trampa: el **enderezamiento** es **mesencefálico** y el **equilibrio** es **cortical**. Los reflejos **tónicos** (cervicales y laberíntico) son de **tronco**. El Moro es **espinal**, no de tronco."},{"tipo":"tarjetas","items":[{"etiqueta":"PM-1","titulo":"Neuronal set innatos","texto":"Circuitos para movimientos automáticos como la **deglución**, las reacciones de enderezamiento o el equilibrio."},{"etiqueta":"PM-2","titulo":"Neuronal set adquiridos","texto":"Movimientos aprendidos voluntariamente y **automatizados por repetición**: bicicleta, conducir."},{"etiqueta":"PM-3","titulo":"Generadores centrales de patrones (CPG)","texto":"Circuitos **de la médula espinal** que generan patrones de **marcha y alcance** (también nado y rascado en las extremidades posteriores). Base del entrenamiento con **Lokomat**, un robot de marcha sobre cinta que combina locomoción intensiva y evaluación."}]},{"tipo":"figura","pagina":72,"pie":"Teoría de la programación motora: el tallo cerebral genera respiración, masticación, deglución y movimientos oculares; los segmentos lumbosacros albergan los generadores centrales de patrones (marcha, nado, rascado) y el reflejo de retirada.","src":"img/fisioterapia-neurologica-t6-tema-6-control-motor-en-el-paciente-neurologico-p72.jpg"},{"tipo":"perla","texto":"Ejemplos clínicos de la teoría refleja aplicada: **Vojta** desencadena patrones de **locomoción refleja** a partir de estímulos definidos en posturas determinadas. En Bobath se usa el choque del calcáneo para la extensión refleja de los dedos o la estimulación sensitiva de los dedos para obtener flexión dorsal refleja."},{"tipo":"parrafo","texto":"**¿Cuál es la mejor teoría?** No existe consenso. La más útil es la que **combina elementos de todas**, entendiendo el control motor como una **interacción dinámica** de los sistemas perceptivo, cognitivo y de acción. En resumen, el control motor surge de la interacción entre **individuo, actividad y ambiente**."}]}],"caso_clinico":{"titulo":"Ictus de arteria cerebral media con espasticidad, dolor y miedo a caer","presentacion":"Varón de 61 años, carpintero, con ictus isquémico de arteria cerebral media derecha hace 7 semanas. Presenta hemiparesia izquierda con patrón flexor espástico de codo, muñeca y dedos (Ashworth modificada elevada) y dolor quemante con alodinia en la mano izquierda. Hace 10 días sufrió una caída en casa y desde entonces evita caminar sin ayuda. El neurólogo le infiltró toxina botulínica en flexores de muñeca hace 2 semanas. Toma diazepam por la noche. En sesión, otro profesional solo le aplica movilizaciones pasivas y estiramientos del miembro superior.","preguntas":[{"pregunta":"¿Por qué es urgente cambiar el abordaje pasivo actual y qué mecanismos plásticos quieres reclutar en este momento evolutivo?","respuesta":"El paciente está dentro de los **6 primeros meses**, el periodo en que el **cerebelo acelera la recuperación**, así que la intensidad terapéutica rinde más ahora. La fisioterapia pasiva solo actúa sobre el sistema musculoesquelético y **no facilita el aprendizaje motor**; sirve únicamente para mantener el rango articular. Hay que reclutar las **sinapsis silentes**, que solo se activan con **entrenamiento y repetición** según la demanda funcional, y la **reorganización cortical** por uso. Por eso conviene pasar a práctica **activa, específica** (pinza y agarre para su trabajo), **repetida** e **intensa**, con tareas funcionales. También hay que comentar con el médico que el **diazepam** no favorece la neuroplasticidad."},{"pregunta":"¿Cómo planificas el manejo de la espasticidad teniendo en cuenta la toxina y las distintas teorías del control motor?","respuesta":"La toxina bloquea la liberación de acetilcolina y su efecto dura unos **3 meses**. Después, el **sprouting** puede producir una **hipertonía reactiva**, así que la ventana actual debe usarse para entrenar de forma activa los **extensores** y la tarea. Se puede añadir electroterapia **tonolítica indirecta** (estimulación del antagonista), siempre como **tratamiento no aislado**, suspendiéndola si no hay resultados y midiendo con la Ashworth modificada, sabiendo que la medición es difícil. Desde la **teoría de sistemas** de Bernstein no se recomiendan los estiramientos para reducir la espasticidad, porque el problema surge de la interacción entre sistemas y no solo del musculoesquelético. Por eso el enfoque debe ser global y orientado a la actividad."},{"pregunta":"¿Cómo abordas el dolor neuropático de la mano y el miedo a caminar desde los principios de plasticidad?","respuesta":"El dolor neuropático se explica por **sensibilización central** (alodinia) y por **desaferenciación**, que **reduce la representación cortical y aumenta el dolor**. El objetivo es **aumentar la representación cortical** con aferencias propioceptivas, táctiles y barométricas, **terapia de espejo** (componente visual y propioceptivo), **imaginería motora** combinada con práctica física, neurodinamia y **educación en dolor**; no con movilización pasiva. El miedo tras la caída es un ejemplo del principio de **interferencia**, lo que obliga a garantizar **protección siempre** y una progresión segura. Para la marcha conviene aplicar **transferencia**, entrenando en entornos parecidos a su casa y a la calle, y **dual task** para aumentar repeticiones variadas. Si no avanza, hay que revisar especificidad, repetición e intensidad, vigilando la fatiga."}]},"glosario":[{"termino":"Neuroplasticidad","definicion":"Capacidad del SN para regenerarse morfológica y funcionalmente y reorganizarse durante el desarrollo, el aprendizaje o tras una lesión, con respuesta adaptativa o maladaptativa (OMS, 1982)."},{"termino":"Neurogénesis","definicion":"Producción de nuevas neuronas y células gliales, principalmente en bulbo olfatorio, hipocampo y áreas corticales. Las células pueden migrar a 1 mm²/día."},{"termino":"Colateralización","definicion":"Formación anatómica de ramificaciones desde axones intactos tras una lesión. Va seguida de la sinaptogénesis reactiva, que es la parte funcional."},{"termino":"Sinapsis silentes","definicion":"Conexiones normalmente inactivas que se activan tras una lesión según la demanda funcional, solo con entrenamiento y repetición."},{"termino":"Reorganización cortical","definicion":"Cambio en la representación cortical de una región en función de su uso: aumenta con más uso y disminuye con menos uso."},{"termino":"Neuroplasticidad maladaptativa","definicion":"Procesos fisiopatológicos que activan áreas compensatorias inadecuadas y generan síntomas adversos como la espasticidad o el dolor neuropático."},{"termino":"Espasticidad","definicion":"Síntoma positivo del síndrome de neurona motora superior por desinhibición de las interneuronas medulares, con aumento del reflejo de estiramiento, hipertonía e hiperreflexia."},{"termino":"Sprouting","definicion":"Creación de nuevas conexiones nervio-músculo en respuesta al bloqueo por toxina botulínica. Puede causar hipertonía reactiva."},{"termino":"Sensibilización central","definicion":"Descenso del umbral de las neuronas medulares nociceptivas que produce hiperalgesia y alodinia."},{"termino":"Desaferenciación","definicion":"Pérdida o alteración de aferencias que reduce la representación cortical y aumenta el dolor neuropático."},{"termino":"Dual task","definicion":"Realización simultánea de una tarea motora y otra cognitiva (caminar y contar). En el temario se vincula al principio «la repetición importa»."},{"termino":"Generadores centrales de patrones","definicion":"Circuitos de la médula espinal que generan patrones rítmicos como la marcha o el alcance sin necesidad de aferencias. Base del Lokomat."},{"termino":"Modelo distributivo","definicion":"Planteamiento de la teoría de sistemas (Bernstein) según el cual el movimiento emerge de la interacción de múltiples sistemas, sin control exclusivamente central ni periférico."},{"termino":"Propiocepción visual","definicion":"Información visual sobre la posición del cuerpo en el espacio, la relación entre sus partes y su movimiento."}],"fuentes":["Organización Mundial de la Salud (OMS), 1982. Definición de neuroplasticidad.","Bisbe et al., 2019.","Kleim JA, Jones TA. (2008) Principles of experience-dependent neural plasticity: implications for rehabilitation after brain damage.","McDonough y Kitchen, 2002.","Cano de la Cuerda R, Collado Vázquez S. Neurorrehabilitación. Métodos específicos de valoración y tratamiento. Madrid: Ed. Panamericana; 2012.","Butler D, Moseley L, arte de Sunyata. Explicando el dolor.","Sociedad Española del Dolor (SED): vídeo traducido sobre dolor.","Autores de las teorías citados en el temario: Sherrington; Magnus (1920); Bernstein; Greene."],"qcm":[{"pregunta":"Un paciente con hemiparesia muestra dificultad marcada en un movimiento que debería ejecutar de forma automática, aunque inicia bien la acción voluntaria. Según el esquema de localización del temario, ¿qué estructuras se asocian a este hallazgo?","opciones":["Cerebelo y coordinación interhemisférica","Corteza motora y espinocerebelo","Región premotora, cerebelo lateral y ganglios basales","Área motora suplementaria y tálamo"],"correcta":3,"explicacion":"En el esquema de la introducción, el problema en un movimiento que debería ser automático se localiza en el área motora suplementaria y el tálamo. Las demás localizaciones corresponden a fallos en el inicio, durante el movimiento o a movimientos bruscos y reacciones asociadas.","por_opcion":["❌ Corresponde a los **movimientos bruscos y reacciones asociadas**.","❌ Corresponde al problema **durante** el movimiento.","❌ Es la localización del problema en el **inicio** del movimiento.","✅ El temario asocia el fallo del movimiento **automático** al área motora suplementaria y al tálamo."]},{"pregunta":"Respecto a la neurogénesis como mecanismo de plasticidad en el ser humano, ¿qué afirmación se ajusta al temario?","opciones":["Se da en bulbo olfatorio, hipocampo y corteza, con migración a 1 mm²/día","Ocurre en médula espinal y corteza, sin capacidad migratoria posterior","Produce neuronas en bulbo olfatorio y tálamo, que migran a 1 mm/hora","Se limita a células gliales y ocurre sobre todo en cerebelo e hipocampo"],"correcta":0,"explicacion":"La neurogénesis produce neuronas y células gliales, principalmente en bulbo olfatorio, hipocampo y áreas de corteza cerebral. Tras una lesión, la célula puede migrar a zonas distales dañadas y adoptar su función, a una velocidad de 1 mm²/día.","por_opcion":["✅ Zonas y velocidad coinciden exactamente con el temario.","❌ Las células **sí migran** a zonas dañadas, y la médula no es una de las zonas citadas.","❌ El tálamo no figura entre las zonas y la velocidad es de **1 mm²/día**, no por hora.","❌ Incluye **neuronas y glía**, y el temario no cita el cerebelo como zona neurogénica."]},{"pregunta":"Sobre la colateralización y la sinaptogénesis reactiva, ¿cuál es la afirmación correcta?","opciones":["Forman un único proceso: primero la conexión anatómica y después la funcional","Parten de axones lesionados que regeneran su trayecto hasta la diana original","Son dos mecanismos independientes y la sinapsis precede a la conexión axonal","Solo ocurren entre axones del mismo tipo que el axón lesionado"],"correcta":0,"explicacion":"El temario las define como un único proceso: se forman ramificaciones desde axones intactos que tienden puentes con neuronas dañadas. La colateralización es la conexión anatómica y, concluida esta, la sinaptogénesis reactiva aporta la parte funcional.","por_opcion":["✅ Coincide con la definición y la secuencia anatómica y luego funcional del temario.","❌ Las ramificaciones parten de axones **intactos**, no de los lesionados.","❌ Es un **único proceso** y el orden es el inverso.","❌ Puede ocurrir en axones del **mismo o de distinto tipo**."]},{"pregunta":"Un fisioterapeuta trata a un paciente con lesión medular incompleta solo con movilizaciones pasivas, con la intención de activar conexiones inactivas que puedan suplir la función perdida. ¿Por qué es un planteamiento erróneo?","opciones":["Las sinapsis silentes se activan solo mediante fármacos moduladores","Las sinapsis silentes solo se activan con entrenamiento y repetición","Las sinapsis silentes únicamente existen en el cerebro inmaduro","Las sinapsis silentes dependen exclusivamente de la neurogénesis"],"correcta":1,"explicacion":"Las sinapsis silentes son conexiones normalmente inactivas que se activan tras una lesión según la demanda funcional. El temario insiste en que esto ocurre mediante entrenamiento y repetición y que de forma pasiva no se produce esa activación.","por_opcion":["❌ Los fármacos actúan sobre los **circuitos modulatorios** y pueden incluso interferir.","✅ El temario lo dice expresamente: de forma pasiva **no** se activan.","❌ La plasticidad se mantiene **toda la vida**, también en el adulto.","❌ Son un mecanismo **distinto** de la neurogénesis."]},{"pregunta":"¿Cuál de las siguientes es una ventaja de la fisioterapia pasiva recogida en el temario?","opciones":["Mejora el dolor neuropático al reorganizar el mapa somatosensorial","Aumenta la modulación inhibitoria de reflejos en circuitos medulares","Favorece la liberación de factores neurotróficos en la corteza","Facilita el aprendizaje motor de tareas funcionales precoces"],"correcta":1,"explicacion":"Las ventajas de la fisioterapia pasiva son su aplicación precoz, que evita la neuroplasticidad maladaptativa, y su acción sobre los circuitos medulares, donde aumenta la modulación inhibitoria de receptores y reflejos. Sus inconvenientes son que actúa solo sobre el sistema musculoesquelético, que no facilita el aprendizaje motor y que no funciona en dolor neuropático.","por_opcion":["❌ La movilización pasiva **no da buenos resultados** en dolor neuropático.","✅ Es una de las ventajas literales de la fisioterapia pasiva.","❌ La liberación de factores neurotróficos es una ventaja de la fisioterapia **activa**.","❌ El temario dice explícitamente que **no facilita el aprendizaje motor**."]},{"pregunta":"En la propuesta de Kleim y Jones (2008), ¿en qué principio sitúa el temario el entrenamiento en doble tarea, por ejemplo caminar mientras se deletrean palabras?","opciones":["La repetición importa","La intensidad importa","Transmisión o transferencia","La especificidad importa"],"correcta":0,"explicacion":"El temario indica que la inducción de plasticidad requiere suficiente repetición y que conviene hacerla con distintas actividades. Pone como ejemplo el dual task (caminar más deletrear o contar).","por_opcion":["✅ El dual task aparece dentro de **la repetición importa**.","❌ La intensidad se asocia a la advertencia sobre la **fatiga** en patologías degenerativas.","❌ La transferencia se refiere a adaptar el entorno del tratamiento a la **vida real** del paciente.","❌ La especificidad se ejemplifica con trabajar la **pinza** mediante ejercicios dirigidos a ella."]},{"pregunta":"Tras una caída en sesión, una paciente con esclerosis múltiple desarrolla miedo que limita la adquisición de nuevas habilidades de marcha. ¿Qué principio de plasticidad ilustra mejor esta situación?","opciones":["Transmisión o transferencia","El tiempo importa","Interferencia","Úsalo o piérdelo"],"correcta":2,"explicacion":"El principio de interferencia dice que la plasticidad inducida por una experiencia puede dificultar la adquisición de otros comportamientos. El temario pone como ejemplo la aparición de miedo tras una caída y concluye la necesidad de protección siempre.","por_opcion":["❌ La transferencia es el efecto **facilitador** sobre comportamientos similares.","❌ El tiempo importa se refiere a la **secuenciación** de objetivos durante el entrenamiento.","✅ Es el ejemplo literal del temario: el miedo tras una caída como **interferencia**.","❌ Úsalo o piérdelo describe la pérdida funcional por **desuso**."]},{"pregunta":"Un paciente recibió toxina botulínica en flexores plantares. Unos tres meses después reaparece el tono, incluso más elevado que antes. ¿Qué mecanismo lo explica según el temario?","opciones":["Sensibilización central por aumento de sustancia P en la médula","Colateralización central de axones corticoespinales hacia el músculo","Activación de sinapsis silentes por el desuso inducido por la toxina","Sprouting nervio-músculo como respuesta al bloqueo de acetilcolina"],"correcta":3,"explicacion":"La toxina bloquea localmente la liberación de acetilcolina, lo que causa parálisis temporal, supersensibilidad y denervación. Como respuesta al bloqueo se crean nuevas conexiones nervio-músculo (sprouting). Por eso el efecto dura unos 3 meses y puede aparecer una hipertonía reactiva.","por_opcion":["❌ La sustancia P y la sensibilización central son mecanismos del **dolor neuropático**.","❌ La colateralización es un mecanismo de plasticidad del **SNC**, no la respuesta periférica a la toxina.","❌ Las sinapsis silentes se activan con **entrenamiento**, no por desuso.","✅ El temario atribuye la **hipertonía reactiva** al **sprouting**."]},{"pregunta":"En la electroterapia para la espasticidad del tríceps sural, aplicar la estimulación sobre el tibial anterior corresponde a la modalidad denominada:","opciones":["Terapia tonolítica refleja cruzada","Terapia tonolítica directa","Terapia tonolítica indirecta","Terapia tonolítica supraliminal"],"correcta":2,"explicacion":"La terapia tonolítica indirecta estimula el músculo antagonista al espástico. Aquí el tibial anterior es el antagonista del tríceps sural espástico.","por_opcion":["❌ Esta denominación **no figura** en el temario.","❌ La directa estimula el **propio músculo espástico** (el agonista).","✅ Estimular el **antagonista** del espástico es la modalidad indirecta.","❌ La supraliminal estimula **otros niveles superiores**."]},{"pregunta":"Según el temario, ¿qué efecto tienen los cambios secundarios a la desaferenciación en el dolor neuropático y qué objetivo terapéutico se deriva de ellos?","opciones":["Reducen la representación cortical; se busca reposo sensitivo","Reducen la representación cortical; se busca aumentar las aferencias","Aumentan la representación cortical; se busca reducir las aferencias","Aumentan la representación cortical; se busca inhibir la sustancia P"],"correcta":1,"explicacion":"La desaferenciación disminuye la representación cortical y aumenta el dolor. Por eso el objetivo del tratamiento es aumentar la representación cortical incrementando las aferencias propioceptivas, táctiles y barométricas.","por_opcion":["❌ El reposo sensitivo es lo contrario de lo indicado: hay que **aumentar** los estímulos.","✅ Coincide con la cascada y con el objetivo terapéutico del temario.","❌ La representación **disminuye**, y reducir aferencias empeoraría el cuadro.","❌ La representación **disminuye**; la sustancia P se relaciona con los impulsos ectópicos."]},{"pregunta":"En el modelo de reflejos jerárquicos, ¿qué emparejamiento entre nivel del SNC y respuesta es correcto?","opciones":["Cortical-cerebral: reflejo tónico laberíntico","Espinal: reflejo tónico cervical asimétrico","Tronco del encéfalo: reacciones de equilibrio ante la inclinación","Mesencefálico: reacciones de enderezamiento tras un giro"],"correcta":3,"explicacion":"El nivel mesencefálico corresponde a las reacciones de enderezamiento: alineación respecto a la gravedad y recuperación de la posición tras un giro. El equilibrio es cortical, los reflejos tónicos son de tronco y los reflejos primitivos y de estiramiento son espinales.","por_opcion":["❌ El tónico laberíntico es de **tronco del encéfalo**.","❌ El tónico cervical asimétrico es de **tronco**; al nivel espinal pertenecen Moro, succión, presión y estiramiento.","❌ Las reacciones de equilibrio son de nivel **cortical-cerebral**.","✅ El enderezamiento es **mesencefálico**."]},{"pregunta":"¿Cuál es la limitación que el temario atribuye específicamente a la teoría jerárquica, y no a la refleja?","opciones":["No predice el movimiento en ausencia de estímulo sensorial","No contempla la interacción con fuerzas como la gravedad","No explica la ejecución de movimientos novedosos","No explica el predominio del reflejo de retirada en adultos sanos"],"correcta":3,"explicacion":"La teoría jerárquica no explica que un reflejo de nivel inferior, presente en adultos normales, domine la función motora en ciertas situaciones, como el reflejo de retirada. No explicar los movimientos novedosos ni el movimiento sin estímulo sensorial son limitaciones de la teoría refleja.","por_opcion":["❌ También es una limitación de la teoría **refleja**.","❌ Las fuerzas externas e internas son la base de la **teoría de sistemas**, no una limitación citada.","❌ Es una limitación de la teoría **refleja** (la sucesión de reflejos no explica lo novedoso).","✅ Es la limitación propia de la **teoría jerárquica** según el temario."]},{"pregunta":"El uso del Lokomat para entrenar la marcha en un paciente con lesión medular se fundamenta en la teoría de la programación motora porque:","opciones":["Defiende que la corteza inhibe la actividad refleja de los centros inferiores","Sostiene que el movimiento emerge del cuerpo como sistema mecánico con inercia","Postula que la integridad somatosensorial es requisito para cualquier respuesta motora","Admite generadores centrales de patrones medulares que actúan sin aferencias"],"correcta":3,"explicacion":"La teoría de la programación motora sostiene que puede obtenerse una respuesta por proceso central incluso sin estímulo aferente. Explica la existencia de generadores centrales de patrones en la médula espinal para la marcha y el alcance, cuyo ejemplo es el Lokomat.","por_opcion":["❌ Es la idea central de la teoría **jerárquica** de Magnus.","❌ Corresponde a la teoría de **sistemas** de Bernstein.","❌ Ese requisito somatosensorial es propio de la teoría **refleja**.","✅ Los **CPG medulares** son el fundamento del Lokomat dentro de la programación motora."]},{"pregunta":"Desde la teoría de sistemas de Bernstein, ¿qué implicación clínica destaca el temario para el paciente espástico?","opciones":["No recomendar estiramientos aislados para reducir la espasticidad","Desencadenar patrones de locomoción refleja desde posturas definidas","Reeducar músculos aislados antes de integrar movimientos funcionales","Priorizar la evaluación de reflejos primitivos para estimar la maduración neural"],"correcta":0,"explicacion":"La teoría de sistemas propone un enfoque global centrado en la interacción entre sistemas, incluido el musculoesquelético. El temario pone como ejemplo que no recomienda estiramientos para reducir la espasticidad, porque el problema no es solo musculoesquelético.","por_opcion":["✅ Es el ejemplo literal del temario para la teoría de **sistemas**.","❌ Corresponde a **Vojta**, dentro de la teoría refleja.","❌ Va en contra de la programación motora, que prioriza los **movimientos clave** frente a los músculos aislados.","❌ Es la implicación clínica de la teoría **jerárquica**."]},{"pregunta":"Según el temario, ¿qué aporta el sistema visual al control motor bajo el término propiocepción visual?","opciones":["Detectar la posición de la cabeza y sus movimientos repentinos","Estabilizar la mirada como requisito previo a la estabilidad postural","Informar de la posición del cuerpo y de la relación entre sus partes","Identificar objetos del entorno y determinar su trayectoria"],"correcta":2,"explicacion":"La propiocepción visual informa de dónde está el cuerpo en el espacio, de la relación entre sus partes y de su movimiento. Identificar objetos y su movimiento corresponde a la sensibilidad exteroceptiva visual.","por_opcion":["❌ Es la función del **sistema vestibular**.","❌ La estabilidad de cabeza y mirada se asocia al **sistema vestibular** y el temario la plantea como requisito para las tareas, no al revés.","✅ Es la definición de **propiocepción visual** del temario.","❌ Es la **sensibilidad exteroceptiva** de la visión."]}],"asignatura":"Fisioterapia neurológica","tema":6,"fecha":"2026-11-04"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const L = 'ABCD';
const secs = F.secciones || [];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="tarjetas">${(b.items||[]).map(t=>`<div class="tarjeta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="def"><b>${md(b.termino)}</b> — ${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota perla"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota alerta"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${md(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const nav = secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`).join('') + (F.caso_clinico?'<a href="#caso">Caso clínico</a>':'') + (F.glosario?.length?'<a href="#glosario">Glosario</a>':'') + `<a class="qcm" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`;

document.getElementById('app').innerHTML = `
<header class="portada"><div class="envoltura">
  <div class="etiquetas">${F.asignatura?`<span class="etiqueta">${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="etiqueta o">Tema ${esc(F.tema)}</span>`:''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="meta">${F.tipo==='grand-qcm'?`<div><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div><b>${secs.length}</b><span>secciones</span></div><div><b>${(F.ideas_clave||[]).length}</b><span>ideas clave</span></div>`}<div><b>${(F.qcm||[]).length}</b><span>preguntas</span></div><div id="ultimo"></div></div>
</div></header>
<nav class="indice" aria-label="Índice"><div class="envoltura">${nav}</div></nav>
<main class="envoltura">
  ${(F.objetivos||[]).length?`<div class="dos">
    <div class="caja"><h3>Objetivos</h3><ul>${(F.objetivos||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>
    <div class="caja"><h3>Lo que hay que saber</h3><ol class="claves">${(F.ideas_clave||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>
  </div>`:''}
  ${F.tipo==='grand-qcm'&&(F.fichas||[]).length?`<div class="caja" style="margin-top:40px"><h3>Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="num">Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd>`).join('')}</dl></section>`:''}
  <section id="qcm"><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="envoltura">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* ---------- esquemas ---------- */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:oscuro?'dark':'neutral',fontFamily:'Spectral, Georgia, serif',flowchart:{htmlLabels:true,curve:'basis'}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* ---------- QCM ---------- */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u) document.getElementById('ultimo').innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; }catch(e){} }
ultimo();
const marco = document.getElementById('marco');

function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${(pos)/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="etiqueta o" style="display:inline-block;margin-bottom:12px">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="btn sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="btn" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'Dominado. Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'Bien, pero repasa las preguntas falladas.':'Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="btn" id="rep">Repetir todo</button>${fallos.length?'<button class="btn sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
