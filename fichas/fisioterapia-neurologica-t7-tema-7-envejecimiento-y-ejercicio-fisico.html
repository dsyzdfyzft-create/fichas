<!DOCTYPE html>
<html lang="es">
<head>

<title>Tema 7: Envejecimiento y ejercicio físico · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#f6f4ef; --hoja:#fffdf9; --tinta:#1b2427; --suave:#5b676b; --linea:#e2ddd2; --acento:#1f6f6b; --acento-suave:#dcebe8;
  --ocre:#b37a1c; --ocre-suave:#f6ead3; --rojo:#a8402f; --rojo-suave:#f5e0db; --verde:#2f7a46; --verde-suave:#dcefe1;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --texto:"Spectral",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:19px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);line-height:1.12;margin:0;font-variation-settings:"SOFT" 50}
h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.9rem;font-weight:600;letter-spacing:-.015em;margin:0 0 18px}
h3{font-size:1.2rem;font-weight:600}
b,strong{font-weight:600}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px}
.envoltura{max-width:820px;margin:0 auto;padding:0 22px}
/* cabecera */
header.portada{padding:64px 0 36px;border-bottom:1px solid var(--linea)}
.etiquetas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.etiqueta{font:600 .78rem/1 var(--serif);padding:7px 11px;border-radius:999px;background:var(--acento-suave);color:var(--acento)}
.etiqueta.o{background:var(--ocre-suave);color:var(--ocre)}
.sub{font-size:1.25rem;color:var(--suave);margin:16px 0 0;max-width:62ch;font-style:italic}
.meta{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap}
.meta div{font-family:var(--serif)}
.meta b{display:block;font-size:1.7rem;font-weight:800;line-height:1}
.meta span{font-size:.8rem;color:var(--suave)}
/* navegación */
nav.indice{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px)}
nav.indice .envoltura{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .envoltura::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .85rem var(--serif);padding:7px 12px;border-radius:999px}
nav.indice a:hover{color:var(--tinta);background:var(--hoja)}
nav.indice a.qcm{background:var(--tinta);color:var(--papel);margin-left:auto}
main section{padding:56px 0 8px}
.num{font:800 .85rem var(--serif);color:var(--ocre);display:block;margin-bottom:6px}
p{margin:0 0 16px;max-width:68ch}
/* bloques */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:14px;padding:22px 24px}
.caja h3{margin-bottom:12px}
.caja ul,.caja ol{margin:0;padding-left:1.2em}
.caja li{margin:6px 0}
.claves{counter-reset:k;list-style:none;padding:0!important}
.claves li{counter-increment:k;padding-left:38px;position:relative;margin:10px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--acento);color:var(--papel);font:800 .8rem/26px var(--serif);text-align:center}
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
.tw{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--linea);border-radius:12px;background:var(--hoja)}
table{border-collapse:collapse;width:100%;font-size:.92rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:600 .95rem var(--serif);padding:14px 16px 4px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--linea)}
th{font:600 .82rem var(--serif);color:var(--suave);border-top:0}
tbody tr:nth-child(odd){background:color-mix(in srgb,var(--papel) 50%,transparent)}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 22px}
.tarjeta{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;font-size:.95rem;line-height:1.5}
.tarjeta .et{font:700 .72rem var(--serif);color:var(--ocre);display:block;margin-bottom:4px}
.tarjeta h3{font-size:1.05rem;margin-bottom:6px}
.def{border-left:3px solid var(--acento);padding:4px 0 4px 16px;margin:0 0 18px}
.def b{font-family:var(--serif);color:var(--acento)}
.nota{border-radius:12px;padding:14px 18px 14px 50px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;font-size:1.15rem}
.nota .t{font:700 .78rem var(--serif);display:block;margin-bottom:2px}
.perla{background:var(--verde-suave)} .perla::before{content:"🩺"} .perla .t{color:var(--verde)}
.alerta{background:var(--rojo-suave)} .alerta::before{content:"⚠️"} .alerta .t{color:var(--rojo)}
/* figuras y esquemas */
figure{margin:8px 0 26px;background:var(--hoja);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:20px 16px 8px;overflow-x:auto;text-align:center}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq .lienzo pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap;text-align:left}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{font-family:var(--serif);color:var(--tinta)}
/* caso clínico */
.caso{background:var(--tinta);color:var(--papel);border-radius:18px;padding:30px 30px 18px}
.caso h2{color:var(--papel)}
.caso p{color:color-mix(in srgb,var(--papel) 85%,transparent)}
.caso details{border-top:1px solid color-mix(in srgb,var(--papel) 18%,transparent);padding:12px 0}
.caso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
.caso details p{margin:10px 0 0}
dl.glosario{display:grid;grid-template-columns:max-content 1fr;gap:10px 20px;margin:0}
dl.glosario dt{font:600 1rem var(--serif);color:var(--acento)}
dl.glosario dd{margin:0}
.fuentes{font-size:.9rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border:1px solid var(--linea);border-radius:18px;padding:28px}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:600 .85rem var(--serif);color:var(--suave)}
.barra{flex:1;height:8px;border-radius:4px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--acento);transition:width .3s}
.pregunta{font:600 1.3rem/1.35 var(--serif);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer}
.op:hover:not([disabled]){border-color:var(--acento)}
.op .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 .9rem var(--serif);background:var(--hoja);border:1px solid var(--linea)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--verde);background:var(--verde-suave)}
.op.bien .l{background:var(--verde);color:#fff;border-color:var(--verde)}
.op.mal{border-color:var(--rojo);background:var(--rojo-suave)}
.op.mal .l{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{font:600 .95rem var(--serif);padding:11px 20px;border-radius:999px;border:0;background:var(--tinta);color:var(--papel);cursor:pointer}
.btn.sec{background:transparent;color:var(--tinta);border:1.5px solid var(--linea)}
.btn[disabled]{opacity:.35;cursor:default}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:800 4.4rem/1 var(--serif);letter-spacing:-.03em}
.resultado .gran small{font-size:1.6rem;color:var(--suave)}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:700px){body{font-size:17.5px}.dos{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}dl.glosario{grid-template-columns:1fr}dl.glosario dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i{transition:none}}
@media print{nav.indice,#qcm{display:none}body{background:#fff}}
</style>

<script id="datos" type="application/json">{"titulo":"Tema 7: Envejecimiento y ejercicio físico","subtitulo":"Deterioros por sistemas en el envejecimiento, adaptación del ejercicio terapéutico en grupo y valoración del riesgo de caídas con la escala de Tinetti.","objetivos":["Al terminar, sabrás definir el envejecimiento como proceso normal, individual, dinámico y complejo, y cuál es el objetivo del ejercicio físico terapéutico en la tercera edad.","Al terminar, sabrás relacionar cada deterioro (respiratorio, musculoesquelético, del sistema nervioso y cardiovascular) con su adaptación concreta del ejercicio.","Al terminar, sabrás organizar una sesión grupal: requisitos previos, composición del grupo, duración y control de la ejecución.","Al terminar, sabrás aplicar e interpretar la escala de Tinetti (ítems, puntuaciones máximas y puntos de corte).","Al terminar, sabrás diferenciar las tablas para pacientes más independientes y más dependientes, y justificar el uso de juegos psicomotrices."],"ideas_clave":["El **objetivo** del ejercicio físico terapéutico en el anciano es **RETRASAR la aparición de la dependencia física**. No es curar el envejecimiento, que **no tiene por qué ser patológico**.","Hay una tendencia general a la **atrofia**: menos peso y volumen de los órganos, pérdida de elasticidad e hidratación, menos vascularización capilar y **más tejido adiposo y fibroso a expensas del muscular**.","**Respiratorio**: la capacidad vital disminuye, por lo que **no se usa el decúbito prono**. El acuñamiento vertebral anterior reduce la movilidad costal, y la respiración pasa a ser **diafragmática y costal inferior**. Por eso la sesión **empieza con ejercicios respiratorios**.","**Musculoesquelético**: la pérdida de elasticidad predomina en **flexores y aductores (sobre todo MMII)**, así que se estira insistiendo en **extensión y abducción**. La artrosis obliga a evitar estar mucho tiempo de pie y los multisaltos. La osteoporosis mejora con ejercicio, pero sin gestos bruscos.","**Cardiovascular**: baja el volumen por latido y sube la FC en compensación. El ejercicio debe ser **aeróbico, submáximo, isotónico y sin apnea**. La HTA se aborda con relajación. El retorno venoso se protege evitando estar de pie estático y con ejercicios circulatorios en sedestación.","Antes del trabajo grupal son obligatorios el **reconocimiento médico** y la **evaluación individual con escalas validadas**. El grupo debe ser **homogéneo**, de unas **10 personas máximo**, con sesiones de **30–45 min más vuelta a la calma**.","**Tinetti**: equilibrio (9 ítems, **máx. 16**) + marcha (**máx. 12**) = **28**. Menos de 19 es **riesgo alto**, 19–24 **riesgo medio** y 25–28 **riesgo bajo**. **A mayor puntuación, menor riesgo**.","Los **juegos psicomotrices** responden al deterioro del SNC: pérdida de capacidades cognitivas y de la calidad del movimiento y los ajustes posturales."],"secciones":[{"id":"definicion-envejecimiento","titulo":"1. Definición e introducción al envejecimiento","bloques":[{"tipo":"definicion","termino":"Envejecimiento","texto":"Conjunto de alteraciones físicas que tienen lugar con el paso de los años. Como proceso vital de acumulación de años **no tiene que ser patológico**. Es un proceso **individual, dinámico y complejo** que afecta a las áreas **fisiológica, psicológica y sociológica**, inseparables y relacionadas entre sí."},{"tipo":"parrafo","texto":"A lo largo del envejecimiento, y por la propia evolución biológica, se producen **cambios considerados normales**. Por eso el fisioterapeuta no plantea el ejercicio para eliminar el envejecimiento. Lo plantea para **retrasar la aparición de la dependencia física** propia de la tercera edad. Ese es el **objetivo** del ejercicio físico terapéutico."},{"tipo":"tabla","titulo":"Cambios del desarrollo frente a cambios del envejecimiento","columnas":["Aspecto","Cambios del desarrollo","Cambios del envejecimiento"],"filas":[["Inicio","Al mismo tiempo que la propia vida","De forma poco aparente"],["Manifestación","Muy notable en los primeros años de vida","Se exteriorizan poco a poco"]]},{"tipo":"alerta","texto":"Trampa típica: el objetivo del ejercicio terapéutico en el anciano según el temario es **RETRASAR** la dependencia física. No es «revertir el envejecimiento» ni «eliminar la dependencia». Tampoco hay que confundir envejecimiento con enfermedad: es un proceso **normal** que no tiene por qué ser patológico."}]},{"id":"cambios-anatomofisiologicos","titulo":"Cambios anatomofisiológicos generales y patrón nutricional","bloques":[{"tipo":"parrafo","texto":"Antes de analizar cada sistema hay aspectos generales que afectan **tanto a la estructura como a la función corporal**. Su denominador común es la **tendencia a la atrofia**. Los órganos pierden masa, los tejidos pierden agua y elasticidad, y disminuye el riego capilar. El resultado global es una **disminución de la eficacia funcional**. A la vez se produce una **sustitución del tejido muscular por tejido adiposo y fibroso**, lo que explica la pérdida de fuerza y tono aunque el peso corporal no cambie."},{"tipo":"tabla","titulo":"Cambios generales del envejecimiento","columnas":["Cambio","Manifestación"],"filas":[["Apariencia externa","Aparición de **arrugas y canas** (característica principal)"],["Atrofia macroscópica","Disminución de **peso y volumen** de los órganos"],["Tejidos","Pérdida de **elasticidad e hidratación**"],["Piel","Las células de la **epidermis adelgazan** y se modifican los **haces del colágeno**"],["Vascularización","**Reducción de la vascularización capilar**"],["Función","**Disminución de la eficacia funcional**"],["Composición corporal","**Aumento del tejido adiposo y fibroso a expensas del tejido muscular**"]]},{"tipo":"parrafo","texto":"**Patrón nutricional-metabólico**: las personas de edad avanzada tienen **necesidades nutricionales específicas**. Alimentarse y nutrirse bien es una **condición esencial para mantener la salud**. La pirámide del temario sitúa el **agua** en la base y destaca en el vértice **calcio, vitamina D y vitamina B12**."},{"tipo":"figura","pagina":10,"pie":"Pirámide nutricional del anciano. Fíjate en el agua como base y en los suplementos del vértice: calcio, vitamina D y B12, relevantes para el hueso (osteoporosis) y el sistema nervioso.","src":"img/fisioterapia-neurologica-t7-tema-7-envejecimiento-y-ejercicio-fisico-p10.jpg"}]},{"id":"deterioro-respiratorio","titulo":"2.I. Deterioro respiratorio","bloques":[{"tipo":"tabla","titulo":"Deterioros respiratorios y consecuencia práctica","columnas":["Deterioro","Consecuencia para el ejercicio"],"filas":[["↓ Capacidad vital","**No usar decúbito prono**"],["↓ Elasticidad del tejido pulmonar","Priorizar la ventilación y la expansión"],["Acuñamiento vertebral anterior → ↓ movilidad costal","La respiración pasa a ser **diafragmática y costal inferior**, por lo que se insiste en la **expansión costal**"],["↑ Frecuencia de patologías respiratorias (bronquitis…)","Trabajar la **musculatura de la tos (abdominales)**"]]},{"tipo":"parrafo","texto":"El mecanismo clave es **mecánico**. El acuñamiento anterior de los cuerpos vertebrales cifosa el tórax y bloquea la parrilla costal superior, de modo que el anciano ventila con el diafragma y las costillas inferiores. Por eso se insiste en la **expansión costal**, mediante **ventilación dirigida** o asociada a **movimientos de MMSS**. A esto se suma la menor capacidad vital y elasticidad pulmonar. El decúbito prono comprime aún más el tórax y queda desaconsejado."},{"tipo":"esquema","titulo":"Cascada del deterioro respiratorio y respuesta terapéutica","mermaid":"flowchart TD\n  A[\"Acuñamiento vertebral anterior\"] --> B[\"Menor movilidad costal\"]\n  B --> C[\"Respiración diafragmática y costal inferior\"]\n  D[\"Menor elasticidad pulmonar\"] --> E[\"Menor capacidad vital\"]\n  E --> P[\"Evitar decúbito prono\"]\n  F[\"Más patologías respiratorias\"] --> G[\"Empezar la tabla con ejercicios respiratorios\"]\n  C --> G\n  E --> G\n  G --> H[\"Expansión costal: ventilación dirigida o con MMSS\"]\n  G --> I[\"Musculatura de la tos: abdominales\"]","pie":"Cada deterioro tiene su traducción práctica: comenzar la sesión con respiratorios, expandir el tórax y fortalecer la tos."},{"tipo":"perla","texto":"En la práctica, la **primera parte de la tabla siempre es respiratoria**. En el grupo dependiente se hace sentado: ventilación dirigida costal superior, respiración con movimiento de MMSS y **espiración forzada inflando un globo**, que además trabaja la musculatura espiratoria y de la tos."},{"tipo":"alerta","texto":"No confundas: el patrón respiratorio **espontáneo** del anciano es **diafragmático y costal inferior**. Precisamente por eso la **ventilación dirigida** que se trabaja en los dependientes es **costal superior**: se entrena la zona que se ha perdido."}]},{"id":"deterioro-musculoesqueletico","titulo":"2.II. Deterioro del aparato musculoesquelético","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"A","titulo":"Osteoporosis","texto":"**Mejora con el ejercicio físico**. Evitar **ejercicios bruscos**."},{"etiqueta":"B","titulo":"Degeneración articular","texto":"↑ de **artrosis**. Evitar estar **mucho tiempo de pie** y los **ejercicios multisalto**. Hacer ejercicios en **sedestación y decúbito** e **hidroterapia**."},{"etiqueta":"C","titulo":"Pérdida de elasticidad","texto":"Mayor en músculos **flexores y aductores**, sobre todo en **MMII**. Estiramientos insistiendo en **extensión y abducción**."},{"etiqueta":"D","titulo":"Disminución del tono muscular","texto":"Es **generalizada**, por lo que se usan **ejercicios globales** y también **ejercicios de expresión facial**."}]},{"tipo":"parrafo","texto":"La lógica es de **protección articular y compensación del patrón retráctil**. La artrosis no tolera la carga mantenida ni los impactos repetidos, y por eso se descarga el trabajo con sedestación, decúbito o agua. El acortamiento predomina en flexores y aductores, lo que empuja al anciano hacia una postura en flexión y aducción. Por eso los estiramientos se orientan hacia la **extensión y la abducción**. Como la hipotonía es **generalizada** y no localizada, el trabajo debe ser **global**, e incluye la musculatura de la cara."},{"tipo":"figura","pagina":13,"pie":"Manos con deformidades por degeneración articular y mano apoyada en bastón. Ilustran el aumento de artrosis y la dependencia de ayudas técnicas, que obligan a evitar la carga prolongada en bipedestación.","src":"img/fisioterapia-neurologica-t7-tema-7-envejecimiento-y-ejercicio-fisico-p13.jpg"},{"tipo":"alerta","texto":"**Hidroterapia** y **ejercicios en sedestación y decúbito** son recomendaciones de la **degeneración articular**, no de la osteoporosis. Para la osteoporosis el temario solo dice: mejora con ejercicio y evitar ejercicios bruscos. Los **ejercicios de expresión facial** pertenecen a la **disminución del tono muscular**."}]},{"id":"deterioro-sistema-nervioso","titulo":"2.III. Deterioro del sistema nervioso","bloques":[{"tipo":"tabla","titulo":"Deterioros del SN y ejercicios del temario","columnas":["Deterioro","Ejercicio propuesto"],"filas":[["A) ↓ Velocidad de reacción","Sillas en círculo y **sentarse rápidamente**; **pasar la pelota** unos a otros"],["B) ↓ Coordinación","**Balanceo con brazos**; **botar una pelota mientras caminan**"],["C) ↓ Esquema corporal","Ejercicios de **autocontacto**"],["D) ↓ Reacciones de equilibrio","**Caminar por una línea**…"],["E) Deterioro de los sentidos","Colocar **delante del fisioterapeuta a los ancianos con hipoacusia**; **experimentar diferentes texturas**"]]},{"tipo":"perla","texto":"La **colocación del grupo** es ya una intervención terapéutica. El anciano con dificultades de audición va **enfrente** del fisioterapeuta, para que pueda apoyarse en la lectura labial y en la demostración visual. Así se evitan errores de ejecución y la frustración."},{"tipo":"alerta","texto":"Botar una pelota **mientras se camina** trabaja la **coordinación**. Pasar la pelota o sentarse rápido en sillas en círculo trabaja la **velocidad de reacción**. El autocontacto trabaja el **esquema corporal**."}]},{"id":"deterioro-cardiovascular","titulo":"2.IV. Deterioro del aparato cardiovascular","bloques":[{"tipo":"tabla","titulo":"Deterioros cardiovasculares y adaptación del ejercicio","columnas":["Deterioro","Mecanismo","Adaptación"],"filas":[["A) ↓ Gasto cardíaco","↓ Volumen en cada latido → ↑ frecuencia cardíaca","Ejercicio **AERÓBICO, SUBMÁXIMO, ISOTÓNICO**, **sin apnea**"],["B) ↑ Tensión arterial","La **pared de los vasos se endurece** con el tiempo","Recomendable alguna **técnica de relajación**"],["C) Problemas de retorno venoso","↓ Retorno venoso","Evitar **ejercicios de pie estáticos**. Hacer **ejercicios circulatorios** sentados: puntillas, talones, círculos con los pies"]]},{"tipo":"parrafo","texto":"El corazón envejecido expulsa **menos volumen por latido** y compensa **aumentando la frecuencia**. Por eso su reserva para esfuerzos intensos es escasa. De ahí que el ejercicio deba ser **aeróbico y submáximo**. También debe ser **isotónico** y **nunca en apnea**: el trabajo isométrico y la apnea elevan bruscamente la presión intratorácica y la tensión arterial, lo que es peligroso en vasos ya endurecidos. Para el retorno venoso se aprovecha el **bombeo muscular de la pantorrilla** en sedestación, en lugar de la bipedestación estática que favorece el estancamiento."},{"tipo":"esquema","titulo":"Deterioro cardiovascular y prescripción","mermaid":"flowchart LR\n  A[\"Menor volumen por latido\"] -->|\"compensación\"| B[\"Aumento de la FC\"]\n  B --> C[\"Aeróbico, submáximo, isotónico, sin apnea\"]\n  D[\"Endurecimiento de la pared vascular\"] --> E[\"Aumento de la TA\"]\n  E --> F[\"Técnica de relajación\"]\n  G[\"Menor retorno venoso\"] --> H[\"Evitar bipedestación estática\"]\n  G --> I[\"Ejercicios circulatorios sentado\"]","pie":"Tres problemas cardiovasculares con tres respuestas distintas: tipo de ejercicio, relajación y ejercicios circulatorios."},{"tipo":"alerta","texto":"Trampa frecuente: el ejercicio en el anciano es **isotónico**, no isométrico. Es **submáximo**, no máximo, y **sin apnea**. La relajación se asocia al **aumento de TA**, no al retorno venoso."}]},{"id":"consideraciones-generales","titulo":"3.I. Consideraciones generales de los ejercicios prácticos","bloques":[{"tipo":"lista","items":["Conocer la **historia clínica** de cada anciano (enfermedades, déficits sensoriales…). Es **OBLIGATORIO un reconocimiento médico**.","Formar un grupo **HOMOGÉNEO**, por patologías, por aptitud o por condiciones físicas.","Que **NO sea muy NUMEROSO**: **unas 10 personas máximo** sería lo ideal.","Adaptar los ejercicios a los ancianos y a una sesión de **30–45 minutos**, **más el periodo de relajación o vuelta a la calma**.","**Pocas repeticiones** de cada ejercicio y **VIGILANCIA** de la ejecución: importa la calidad del movimiento, del gesto y la conciencia del movimiento.","**Evaluación individual** de cada persona **antes de incorporarla al trabajo grupal**, valorando su **estado funcional**.","Usar **escalas de evaluación validadas** para conocer el equilibrio (estático, dinámico y funcional), la marcha y el riesgo de caída. Sirven para **agrupar** y para **seleccionar ejercicios y posiciones** (decúbito, sedestación, bipedestación, marcha). Ejemplos: **Tinetti, Berg, Test de Romberg, Up and Go, MiniBest test**."]},{"tipo":"esquema","titulo":"Algoritmo de incorporación al grupo de ejercicio","mermaid":"flowchart TD\n  A[\"Historia clínica\"] --> B[\"Reconocimiento médico obligatorio\"]\n  B --> C[\"Evaluación individual del estado funcional\"]\n  C --> D[\"Escalas: Tinetti, Berg, Romberg, Up and Go, MiniBest\"]\n  D --> E{\"Nivel funcional\"}\n  E -->|\"más independiente\"| F[\"Tabla en el suelo y de pie\"]\n  E -->|\"más dependiente\"| G[\"Tabla completa en sedestación\"]\n  F --> H[\"Grupo homogéneo de unas 10 personas\"]\n  G --> H\n  H --> I[\"Sesión de 30 a 45 min más vuelta a la calma\"]","pie":"La evaluación previa con escalas determina el grupo, la tabla y las posiciones de trabajo."},{"tipo":"perla","texto":"Las escalas no son solo diagnósticas: deciden la **posición de trabajo**. Un anciano con riesgo alto de caídas hará la sesión en sedestación o decúbito, y uno con riesgo bajo podrá trabajar en bipedestación y marcha."}]},{"id":"escala-tinetti","titulo":"Escala de Tinetti: equilibrio y marcha (riesgo de caídas)","bloques":[{"tipo":"parrafo","texto":"La escala tiene **dos partes**, equilibrio y marcha, cuyos ítems se puntúan **de 0 a 2 según el apartado**. El **máximo es 16 en equilibrio** (9 ítems) y **12 en marcha**, y ambas se **suman** para un total de **28**. **A mayor puntuación, menor riesgo de caídas**."},{"tipo":"tabla","titulo":"Interpretación de la puntuación total","columnas":["Puntuación total (máx. 28)","Riesgo de caídas"],"filas":[["\u003c 19","**Alto**"],["19–24","**Medio**"],["25–28","**Bajo**"]]},{"tipo":"tabla","titulo":"Tinetti – Evaluación del equilibrio (9 ítems; paciente en silla dura sin apoyabrazos)","columnas":["Ítem","Puntuación","Criterios"],"filas":[["1. Equilibrio sentado","0–1","0 se inclina o se desliza en la silla; 1 se mantiene seguro"],["2. Levantarse","0–2","0 imposible sin ayuda; 1 capaz usando los brazos; 2 capaz sin usar los brazos"],["3. Intentos para levantarse","0–2","0 incapaz sin ayuda; 1 necesita más de un intento; 2 un solo intento"],["4. Bipedestación inmediata (primeros 5 s)","0–2","0 inestable (se tambalea, mueve los pies, balanceo de tronco); 1 estable con andador, bastón o agarrándose; 2 estable sin soportes"],["5. Equilibrio en bipedestación","0–2","0 inestable; 1 estable con **apoyo amplio (talones separados más de 10 cm)** o con bastón u otro soporte; 2 apoyo estrecho y sin soporte"],["6. Empujar","0–2","Pies juntos y tronco erecto; empuje suave en el **esternón con la palma, 3 veces**. 0 empieza a caerse; 1 se tambalea y se agarra pero se mantiene; 2 estable"],["7. Ojos cerrados (misma posición que en empujar)","0–1","0 inestable; 1 estable"],["8. Vuelta de 360°","0–2 (dos subítems)","Pasos discontinuos 0 / continuos 1; inestable 0 / estable 1"],["9. Sentarse","0–2","0 inseguro, calcula mal la distancia, cae en la silla; 1 usa los brazos o movimiento brusco; 2 seguro, movimiento suave"]]},{"tipo":"tabla","titulo":"Tinetti – Evaluación de la marcha (unos 8 m a paso normal y regreso a paso rápido pero seguro)","columnas":["Ítem","Puntuación","Criterios"],"filas":[["1. Iniciación de la marcha","0–1","0 vacilaciones o múltiples intentos; 1 no vacila"],["2. Longitud y altura de paso (pie derecho)","0–2 (dos subítems)","Sobrepasa o no al pie izquierdo (0/1); se separa o no completamente del suelo (0/1)"],["3. Longitud y altura de paso (pie izquierdo)","0–2 (dos subítems)","Sobrepasa o no al pie derecho (0/1); se levanta o no completamente del suelo (0/1)"],["4. Simetría del paso","0–1","0 longitud desigual; 1 parece igual"],["5. Fluidez del paso","0–1","0 paradas entre pasos; 1 pasos continuos"],["6. Trayectoria (un pie durante unos 3 m)","0–2","0 desviación grave; 1 leve o moderada, o usa ayudas; 2 sin desviación ni ayudas"],["7. Tronco","0–2","0 balanceo marcado o usa ayudas; 1 no balancea pero flexiona rodillas o espalda o separa los brazos; 2 sin balanceo, sin flexión, sin brazos ni ayudas"],["8. Postura al caminar","0–1","0 talones separados; 1 talones casi juntos"]]},{"tipo":"esquema","titulo":"Estructura e interpretación de Tinetti","mermaid":"flowchart TD\n  A[\"Escala de Tinetti\"] --> B[\"Equilibrio: 9 ítems, máximo 16\"]\n  A --> C[\"Marcha: máximo 12\"]\n  B --> D[\"Suma total sobre 28\"]\n  C --> D\n  D -->|\"menos de 19\"| E[\"Riesgo alto de caídas\"]\n  D -->|\"19 a 24\"| F[\"Riesgo medio de caídas\"]\n  D -->|\"25 a 28\"| G[\"Riesgo bajo de caídas\"]","pie":"Primero se suman ambas partes y después se aplica el punto de corte. A más puntos, menos riesgo."},{"tipo":"figura","pagina":22,"pie":"Hoja de registro de Tinetti con las dos partes (marcha sobre 12 y equilibrio sobre 16). Observa la nota lateral: a mayor puntuación, menor riesgo; menos de 19 es riesgo alto y 19–24 es riesgo.","src":"img/fisioterapia-neurologica-t7-tema-7-envejecimiento-y-ejercicio-fisico-p22.jpg"},{"tipo":"alerta","texto":"Trampas de Tinetti: (1) **equilibrio = 16 y marcha = 12**, no al revés. (2) El 19 **ya es riesgo medio**: el riesgo alto es **estrictamente menor de 19**. (3) **Equilibrio sentado, ojos cerrados, iniciación de la marcha, simetría, fluidez y postura al caminar** solo puntúan **0–1**. (4) Los talones separados **más de 10 cm** puntúan 1 en *equilibrio en bipedestación*. Los *talones separados al caminar* puntúan 0 en *postura al caminar*."}]},{"id":"tablas-ejercicio","titulo":"3.II. Tablas de ejercicio terapéutico: independientes y dependientes","bloques":[{"tipo":"tabla","titulo":"Comparativa de tablas","columnas":["Aspecto","Pacientes más independientes","Pacientes más dependientes"],"filas":[["Posición","En el suelo y de pie","**Toda la tabla puede hacerse SENTADOS**"],["Respiratorios","En el suelo: ejercicios respiratorios","Se **empieza** con ellos: ventilación dirigida (**costal superior**), respiración + MMSS, **espiración forzada (inflar un globo)**"],["Tronco y MMSS","Movimientos de cuello, tronco y MMSS; abdominales (en el suelo)","Manos juntas → flexión de tronco tocando un pie, subir, tocar el otro; manos en la cintura (rotaciones, lateralizaciones); elevar hombros (uno, los dos, círculos); flexo-extensión de MMSS; abrazo; cuello"],["MMII","De pie: puntillas, talones, trote en el sitio, equilibrio sobre una pierna, correr en círculos","Puntillas, talones, puntas-talones; pisar flojo/fuerte; extender rodilla (mantener-bajar, mantener-círculos de tobillo); tijeras (↑ y ↔); flexión de rodilla + flexión de cadera; palmada-abrir piernas-palmada-cerrarlas"],["Mano y muñeca","—","Tocar el piano, contar con los dedos, flexo-extensión y círculos de muñeca, flexo-extensión de codos en supinación y pronación"],["Componente cognitivo-reactivo","Ante una **PALMADA**: agacharse, cambiar de dirección, tocar a un compañero. Juegos con balones: caminar botando, pasarlo por parejas de espaldas, por encima de la cabeza, por los lados","Mímica de emociones, ejercicios con balón, **juegos de psicomotricidad**"]]},{"tipo":"perla","texto":"Fíjate en la coherencia con los deterioros. Puntillas, talones y puntas-talones en sedestación son los **ejercicios circulatorios** del retorno venoso. La mímica de emociones responde a la **hipotonía generalizada** (expresión facial). Inflar un globo trabaja la **espiración forzada y la musculatura de la tos**."}]},{"id":"juegos-psicomotricidad","titulo":"3.II.C. Juegos y psicomotricidad","bloques":[{"tipo":"parrafo","texto":"El **deterioro del SNC** produce **pérdida de muchas capacidades cognitivas** adquiridas a lo largo de la vida y **disminución de la calidad del movimiento y de los ajustes posturales**. Incluir **principios psicomotrices** en forma de **juegos** permite estimular a la vez atención, memoria, lenguaje, velocidad de reacción, coordinación y relación social. El componente lúdico, además, favorece la adherencia."},{"tipo":"tarjetas","items":[{"etiqueta":"Balón","titulo":"Ejercicios con balón","texto":"Pasar el balón y decir un nombre; pasar a la derecha lo más rápido posible y cambiar de sentido al oír «ya»; en dos filas, decir el lugar de nacimiento o pasarlo a quien nació en el pueblo nombrado. Consignas numéricas: **1 rodando**, **2 sin tocar el suelo**, **3 dando un bote**. Saltarse compañeros. Botar en o junto a cuadrados de colores. Consignas con palmadas y colores."},{"etiqueta":"Equipos","titulo":"Relevos por equipos","texto":"Dos filas enfrentadas y dos equipos; gana el que menos tarda. Pasar un balón del primero al último y volver; pasar un aro, meterse dentro y decir un trabalenguas; pasar objetos de una caja a otra."},{"etiqueta":"Dados y letras","titulo":"Dados y letras","texto":"Cada participante tiene una letra. Con los dados se cuentan posiciones (p. ej., 4 a la derecha y 2 a la izquierda) y se dicen palabras de una categoría o con ambas letras, o se lanza un aro. Letras: quienes forman la palabra dicha se ponen de pie o levantan los brazos."},{"etiqueta":"Esquema corporal","titulo":"Esquema corporal y grupo","texto":"Tocar partes del cuerpo con la mano derecha y luego con la izquierda; colocar una cuerda en distintas partes del cuerpo. Conciencia del grupo: nombrar al compañero de la derecha y de la izquierda; quien coge el balón dice su nombre."},{"etiqueta":"Cuerda","titulo":"Cuerda con cartulinas","texto":"Por parejas: **amarilla = subir la cuerda**, **verde = agacharse acercándola al suelo**, después **roja = diagonal**. Progresión: pareja individual, todas a la vez, concurso con eliminación. En grupos de 4–5: amarillo arriba, verde abajo, naranja a la derecha, rojo a la izquierda."},{"etiqueta":"Globos","titulo":"Globos","texto":"Inflar globos en dos filas; pasarlo; relevo hasta el último; subir el globo si coincide con el color del objeto mostrado. Globo agujereado en circuito: quien lo tiene al desinflarse responde una **pregunta de actualidad**."}]},{"tipo":"alerta","texto":"En los juegos de cuerda el significado del **rojo cambia**: en la versión por parejas es **diagonal** y en la de grupos de 4–5 es **a la izquierda**. Amarillo es siempre **arriba** y verde siempre **abajo**."}]}],"caso_clinico":{"titulo":"Incorporación de una residente a un grupo de ejercicio terapéutico","presentacion":"Carmen, 81 años, vive en una residencia de Valencia. Tiene osteoporosis, artrosis bilateral de rodilla, hipertensión arterial controlada e hipoacusia moderada. Refiere hinchazón de tobillos al final del día y presenta cifosis dorsal con respiración de predominio diafragmático y costal inferior. Tras el reconocimiento médico, el fisioterapeuta pasa la escala de Tinetti. En equilibrio obtiene 9/16: se levanta usando los brazos, con apoyo amplio de más de 10 cm y se tambalea en el empuje. En marcha obtiene 8/12. Se quiere incorporar a un programa grupal.","preguntas":[{"pregunta":"¿Cómo interpretas su Tinetti y qué implica para la elección de grupo y posición de trabajo?","respuesta":"Total 9 + 8 = **17/28**, inferior a 19: **riesgo alto de caídas**. Según el temario, las escalas sirven para agrupar y para elegir posiciones. Carmen debe ir a un **grupo homogéneo de pacientes más dependientes**, de unas 10 personas como máximo, donde **toda la tabla puede hacerse sentados**. Quedan descartados el trote, correr en círculos o el equilibrio sobre una pierna."},{"pregunta":"¿Qué características debe tener el ejercicio considerando su perfil musculoesquelético y cardiovascular?","respuesta":"Por la **artrosis**: evitar estar mucho tiempo de pie y los multisaltos, priorizando la sedestación, el decúbito y, si es posible, la hidroterapia. Por la **osteoporosis**: ejercicio sí, pero **sin gestos bruscos**. Por la **HTA**: ejercicio **aeróbico, submáximo, isotónico y sin apnea**, más una **técnica de relajación**. Por el **retorno venoso** (edemas): evitar la bipedestación estática y hacer **ejercicios circulatorios sentada**, como puntillas, talones, puntas-talones y círculos de tobillo."},{"pregunta":"¿Cómo estructurarías el inicio de la sesión y su colocación en el grupo?","respuesta":"La sesión se **inicia con ejercicios respiratorios**. Su cifosis reduce la movilidad costal y la deja con respiración diafragmática y costal inferior. Por eso se hace **ventilación dirigida costal superior**, respiración con movimiento de MMSS y **espiración forzada inflando un globo**, que trabaja la musculatura de la tos. Por su **hipoacusia** se coloca **enfrente del fisioterapeuta**. La sesión dura 30–45 min más la vuelta a la calma, con pocas repeticiones y vigilancia de la calidad del gesto. Puede terminar con juegos psicomotrices sentados (balón, cuerda con cartulinas)."}]},"glosario":[{"termino":"Envejecimiento","definicion":"Proceso vital de acumulación de años, normal, individual, dinámico y complejo, que afecta a las áreas fisiológica, psicológica y sociológica."},{"termino":"Dependencia física","definicion":"Pérdida de autonomía funcional propia de la tercera edad, cuya aparición el ejercicio terapéutico pretende retrasar."},{"termino":"Atrofia","definicion":"Tendencia general del envejecimiento a disminuir el peso y el volumen de los órganos, con pérdida de elasticidad, hidratación y vascularización capilar."},{"termino":"Capacidad vital","definicion":"Volumen pulmonar movilizable que disminuye con la edad, motivo por el que se evita el decúbito prono."},{"termino":"Acuñamiento vertebral anterior","definicion":"Deformidad en cuña de los cuerpos vertebrales que reduce la movilidad costal y deja una respiración diafragmática y costal inferior."},{"termino":"Ventilación dirigida","definicion":"Ejercicio respiratorio que orienta el aire hacia una región torácica concreta; en los dependientes, la costal superior."},{"termino":"Ejercicio isotónico","definicion":"Contracción con movimiento articular; es la modalidad indicada en el anciano, frente al trabajo estático y en apnea."},{"termino":"Ejercicio submáximo","definicion":"Intensidad por debajo del máximo, adecuada a la menor reserva cardíaca del anciano."},{"termino":"Retorno venoso","definicion":"Flujo de sangre venosa al corazón; disminuye con la edad y se favorece con ejercicios circulatorios en sedestación."},{"termino":"Esquema corporal","definicion":"Representación mental del propio cuerpo; se deteriora con la edad y se trabaja con ejercicios de autocontacto."},{"termino":"Escala de Tinetti","definicion":"Escala de equilibrio (máx. 16) y marcha (máx. 12) sobre 28 puntos que estima el riesgo de caídas: menos de 19 alto, 19–24 medio, 25–28 bajo."},{"termino":"Psicomotricidad","definicion":"Principios que integran movimiento y funciones cognitivas, aplicados mediante juegos para compensar el deterioro del SNC."},{"termino":"Vuelta a la calma","definicion":"Periodo final de relajación que se añade a los 30–45 minutos de la sesión."}],"fuentes":["Villarón C, Herrmann C, Chimeno A, Sirvent MA, Izquierdo R. Tema 7: Envejecimiento y ejercicio físico. Fisioterapia neurológica. Universidad Europea de Valencia.","Escalas citadas en el tema: Tinetti, Berg, Test de Romberg, Up and Go, MiniBest test."],"qcm":[{"pregunta":"Un paciente obtiene 13 puntos en la parte de equilibrio y 11 en la de marcha de la escala de Tinetti. ¿Cómo se interpreta su resultado?","opciones":["Riesgo alto de caídas, al no superar los 25 puntos","Riesgo medio de caídas, al situarse en el rango 19–24","No se suma: cada parte se interpreta de forma independiente","Riesgo bajo de caídas, al situarse en el rango 25–28"],"correcta":1,"explicacion":"Las dos partes de Tinetti se suman: 13 + 11 = 24 sobre 28. Según el temario, de 19 a 24 es riesgo medio, menos de 19 es riesgo alto y de 25 a 28 es riesgo bajo.","por_opcion":["❌ El riesgo alto es una puntuación inferior a 19, no inferior a 25.","✅ 24 está dentro del intervalo 19–24, que corresponde a riesgo medio.","❌ El temario indica expresamente que el resultado de ambos apartados se suma.","❌ 24 no alcanza el rango de riesgo bajo, que empieza en 25."]},{"pregunta":"¿En cuál de estos ítems de la parte de equilibrio de Tinetti la puntuación máxima posible es 1 punto?","opciones":["Levantarse de la silla sin ayuda de los brazos","Equilibrio sentado en silla dura sin apoyabrazos","Respuesta al empuje esternal con los pies juntos","Sentarse de nuevo en la silla al final de la prueba"],"correcta":1,"explicacion":"El equilibrio sentado solo puntúa 0 (se inclina o se desliza) o 1 (se mantiene seguro). Levantarse, empujar y sentarse puntúan de 0 a 2. Junto con ojos cerrados, es uno de los ítems de equilibrio con máximo 1.","por_opcion":["❌ Levantarse puntúa 0–2: imposible sin ayuda, usando brazos, o sin brazos.","✅ Puntúa 0–1: se inclina o desliza, o se mantiene seguro.","❌ Empujar puntúa 0–2: empieza a caerse, se tambalea pero se mantiene, o estable.","❌ Sentarse puntúa 0–2: inseguro, usa brazos o brusco, o seguro y suave."]},{"pregunta":"En el ítem «equilibrio en bipedestación» de Tinetti, una paciente se mantiene estable sin bastón pero con los talones separados 12 cm. ¿Qué puntuación recibe?","opciones":["0 puntos, porque el apoyo amplio se considera inestabilidad","2 puntos, porque se mantiene estable sin usar ningún soporte","No puntúa aquí, sino en el ítem postura al caminar","1 punto, porque es estable pero con apoyo amplio de base"],"correcta":3,"explicacion":"En equilibrio en bipedestación, 1 punto corresponde a estable pero con apoyo amplio (talones separados más de 10 cm) o con bastón u otro soporte. Los 2 puntos exigen apoyo estrecho y sin soporte.","por_opcion":["❌ El 0 se reserva para la inestabilidad; el apoyo amplio estable puntúa 1.","❌ Los 2 puntos requieren apoyo estrecho, además de no usar soporte.","❌ Postura al caminar valora los talones durante la marcha, no en bipedestación.","✅ Talones separados más de 10 cm con estabilidad equivale a 1 punto."]},{"pregunta":"Según el temario, ¿cuál es la consecuencia directa del acuñamiento vertebral anterior sobre la ventilación del anciano?","opciones":["Respiración paradójica abdominal por fatiga de la musculatura de la tos","Aumento de la capacidad vital compensando la pérdida de elasticidad","Respiración predominantemente costal superior por bloqueo diafragmático","Respiración diafragmática y costal inferior por menor movilidad costal"],"correcta":3,"explicacion":"El acuñamiento vertebral anterior reduce la movilidad costal, de modo que la respiración pasa a ser diafragmática y costal inferior. Por eso se insiste en ejercicios de expansión costal.","por_opcion":["❌ El temario no describe respiración paradójica; la tos se trabaja con abdominales.","❌ La capacidad vital disminuye con la edad, no aumenta.","❌ Es al revés: se pierde la movilidad costal y predomina el diafragma.","✅ Es la secuencia literal del temario: acuñamiento, menor movilidad costal, respiración diafragmática y costal inferior."]},{"pregunta":"¿Qué posición de trabajo desaconseja el temario por la disminución de la capacidad vital en el anciano?","opciones":["Decúbito supino","Decúbito prono","Bipedestación","Sedestación"],"correcta":1,"explicacion":"El temario asocia la disminución de la capacidad vital a la indicación «NO decúbito prono», porque esta posición limita aún más la expansión torácica. La sedestación y el decúbito se recomiendan en otros contextos, como la artrosis.","por_opcion":["❌ El decúbito se propone incluso como alternativa en la degeneración articular.","✅ El temario indica expresamente que, por la menor capacidad vital, no se use el decúbito prono.","❌ La bipedestación se limita por artrosis o retorno venoso, no por la capacidad vital.","❌ La sedestación es la posición de base de la tabla para pacientes dependientes."]},{"pregunta":"Ante la pérdida de elasticidad muscular del anciano, ¿qué orientación de los estiramientos propone el temario?","opciones":["Insistir en extensión y aducción, al predominar el acortamiento flexor","Insistir en flexión y abducción, al predominar el acortamiento aductor","Insistir en extensión y abducción, al predominar el acortamiento flexor","Insistir en flexión y aducción, al predominar el acortamiento extensor"],"correcta":2,"explicacion":"La pérdida de elasticidad es mayor en los músculos flexores y aductores, sobre todo en MMII. Por eso los estiramientos insisten en los movimientos contrarios: extensión y abducción.","por_opcion":["❌ La aducción no estira los aductores, que también están acortados.","❌ Combina mal: la flexión no estira los flexores acortados.","✅ Flexores y aductores son los más afectados, así que se estira en extensión y abducción.","❌ Los acortados son los flexores, no los extensores; se estira hacia la extensión."]},{"pregunta":"En relación con la disminución del gasto cardíaco del anciano, ¿qué tipo de ejercicio es coherente con el temario?","opciones":["Anaeróbico, submáximo, isotónico y sin apnea","Aeróbico, submáximo, isométrico y sin apnea","Aeróbico, máximo, isotónico y con control de apnea","Aeróbico, submáximo, isotónico y sin apnea"],"correcta":3,"explicacion":"El temario indica que el ejercicio debe ser aeróbico, submáximo, isotónico y sin apnea. Con menos volumen por latido y una FC aumentada, el anciano tiene poca reserva para esfuerzos intensos o con maniobras que eleven la presión.","por_opcion":["❌ Debe ser aeróbico; el trabajo anaeróbico supera la reserva cardíaca.","❌ Debe ser isotónico; la contracción isométrica no figura como indicada.","❌ Debe ser submáximo y sin apnea en ningún caso.","✅ Coincide con los cuatro requisitos del temario."]},{"pregunta":"¿Cuál es la secuencia fisiopatológica que el temario describe para el deterioro del gasto cardíaco?","opciones":["Menor volumen expulsado en cada latido con aumento compensador de la frecuencia","Menor frecuencia cardíaca que obliga a aumentar el volumen de cada latido","Menor retorno venoso que reduce de forma secundaria la frecuencia cardíaca","Endurecimiento de la pared vascular que reduce el volumen de cada latido"],"correcta":0,"explicacion":"En el gasto cardíaco disminuido, el temario indica una reducción del volumen en cada latido con aumento de la frecuencia cardíaca. El endurecimiento vascular se relaciona con el aumento de la tensión arterial, que es otro apartado.","por_opcion":["✅ Es la secuencia literal: menor volumen por latido y aumento de la frecuencia.","❌ Invierte el mecanismo: lo que disminuye es el volumen por latido y lo que sube es la FC.","❌ El retorno venoso es un apartado distinto y no se vincula con un descenso de la FC.","❌ El endurecimiento de la pared vascular explica el aumento de la tensión arterial."]},{"pregunta":"¿Para qué deterioro propone el temario utilizar alguna técnica de relajación?","opciones":["Aumento de la tensión arterial por endurecimiento vascular","Disminución del retorno venoso en los miembros inferiores","Disminución generalizada del tono muscular","Disminución de las reacciones de equilibrio"],"correcta":0,"explicacion":"Ante el aumento de la tensión arterial, debido a que la pared de los vasos se endurece con el tiempo, el temario recomienda alguna técnica de relajación. Los demás deterioros tienen otras pautas.","por_opcion":["✅ La relajación es la recomendación asociada al aumento de la tensión arterial.","❌ El retorno venoso se trata evitando estar de pie estático y con ejercicios circulatorios.","❌ La hipotonía generalizada se aborda con ejercicios globales y de expresión facial.","❌ Las reacciones de equilibrio se trabajan, por ejemplo, caminando por una línea."]},{"pregunta":"Según el temario, la hidroterapia aparece como recomendación específica de:","opciones":["Los problemas de retorno venoso","La osteoporosis","La degeneración articular","La pérdida de elasticidad"],"correcta":2,"explicacion":"En la degeneración articular (aumento de artrosis), el temario recomienda evitar estar mucho tiempo de pie y los multisaltos, hacer ejercicios en sedestación y decúbito, e hidroterapia. Todas son formas de reducir la carga articular.","por_opcion":["❌ El retorno venoso se aborda con ejercicios circulatorios en sedestación.","❌ Para la osteoporosis solo se indica que mejora con ejercicio y que se eviten los ejercicios bruscos.","✅ La hidroterapia figura entre las pautas de la degeneración articular.","❌ La pérdida de elasticidad se aborda con estiramientos en extensión y abducción."]},{"pregunta":"Colocar sillas en círculo y pedir a los ancianos que se sienten rápidamente es, según el temario, un ejercicio dirigido a:","opciones":["La velocidad de reacción","El esquema corporal","La coordinación","Las reacciones de equilibrio"],"correcta":0,"explicacion":"El temario pone como ejemplos para trabajar la disminución de la velocidad de reacción colocar sillas en círculo para sentarse rápidamente o pasar la pelota unos a otros.","por_opcion":["✅ Es el ejemplo literal para la velocidad de reacción.","❌ El esquema corporal se trabaja con ejercicios de autocontacto.","❌ Para la coordinación propone balanceo de brazos o botar una pelota mientras se camina.","❌ Para las reacciones de equilibrio propone caminar por una línea."]},{"pregunta":"En una sesión grupal hay un anciano con hipoacusia. ¿Qué indica el temario sobre su manejo?","opciones":["Excluirlo del grupo y derivarlo a sesión individual","Situarlo al final del grupo para no interrumpir la dinámica","Situarlo en un lateral junto a un compañero que le repita","Situarlo enfrente del fisioterapeuta al organizar el grupo"],"correcta":3,"explicacion":"Dentro del deterioro de los sentidos, el temario pide tenerlo en cuenta al colocar al grupo: los ancianos con dificultades de audición se sitúan enfrente del fisioterapeuta, para facilitar la percepción visual de las consignas.","por_opcion":["❌ La hipoacusia no motiva la exclusión del grupo; se adapta la colocación.","❌ Al final del grupo tendría menos acceso visual y auditivo a las consignas.","❌ El temario no propone la mediación de un compañero, sino la colocación frontal.","✅ Es la indicación literal: enfrente del fisioterapeuta."]},{"pregunta":"¿Qué combinación de características de organización de la sesión grupal coincide con el temario?","opciones":["Grupo homogéneo de unas 10 personas, sesiones de 30–45 min más vuelta a la calma","Grupo homogéneo de unas 15 personas, sesiones de 45–60 min incluida la relajación","Grupo heterogéneo de unas 10 personas, sesiones de 30–45 min con vuelta a la calma","Grupo homogéneo de unas 10 personas, muchas repeticiones para automatizar el gesto"],"correcta":0,"explicacion":"El temario pide un grupo homogéneo (por patologías, aptitud o condiciones físicas), no muy numeroso (unas 10 personas máximo) y sesiones de 30–45 minutos más el periodo de relajación o vuelta a la calma. Además, indica pocas repeticiones con vigilancia de la calidad del gesto.","por_opcion":["✅ Reúne la homogeneidad, el tamaño y la duración que indica el temario.","❌ Tanto el número de participantes como la duración superan lo indicado.","❌ El grupo debe ser homogéneo, no heterogéneo.","❌ El temario pide pocas repeticiones, priorizando la calidad del movimiento."]},{"pregunta":"En la tabla para pacientes más dependientes, la ventilación dirigida que se propone se orienta a la región:","opciones":["Diafragmática","Abdominal","Costal superior","Costal inferior"],"correcta":2,"explicacion":"La tabla para dependientes comienza con ejercicios respiratorios: ventilación dirigida costal superior, respiración con movimiento de MMSS y espiración forzada inflando un globo. Se trabaja la zona superior porque el patrón espontáneo del anciano es diafragmático y costal inferior.","por_opcion":["❌ La respiración diafragmática también forma parte del patrón ya predominante.","❌ La musculatura abdominal se trabaja como musculatura de la tos, no como ventilación dirigida.","✅ El temario especifica ventilación dirigida costal superior.","❌ La costal inferior es el patrón espontáneo, no el que se entrena."]},{"pregunta":"¿Cuál es la justificación que da el temario para incluir juegos de psicomotricidad en el ejercicio del anciano?","opciones":["La pérdida de masa ósea, que exige actividades sin impacto articular","La disminución del gasto cardíaco, que limita el ejercicio aeróbico continuo","El aumento de la tensión arterial, que requiere actividades lúdicas relajantes","El deterioro del SNC, con pérdida cognitiva y de la calidad del movimiento"],"correcta":3,"explicacion":"El deterioro del SNC produce pérdida de capacidades cognitivas adquiridas y disminución de la calidad del movimiento y de los ajustes posturales. Por eso se incluyen principios psicomotrices en forma de juegos para estimular esas capacidades.","por_opcion":["❌ Para la osteoporosis el temario indica evitar ejercicios bruscos, no juegos psicomotrices.","❌ El gasto cardíaco condiciona el tipo de ejercicio (aeróbico, submáximo), no la psicomotricidad.","❌ Para la HTA se recomienda una técnica de relajación, no los juegos.","✅ Es la justificación literal del apartado de juegos."]}],"asignatura":"Fisioterapia neurológica","tema":7,"fecha":"2026-11-04"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const L = 'ABCD';
const secs = F.secciones || [];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="tarjetas">${(b.items||[]).map(t=>`<div class="tarjeta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="def"><b>${md(b.termino)}</b> — ${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota perla"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota alerta"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${md(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const nav = secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`).join('') + (F.caso_clinico?'<a href="#caso">Caso clínico</a>':'') + (F.glosario?.length?'<a href="#glosario">Glosario</a>':'') + `<a class="qcm" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`;

document.getElementById('app').innerHTML = `
<header class="portada"><div class="envoltura">
  <div class="etiquetas">${F.asignatura?`<span class="etiqueta">${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="etiqueta o">Tema ${esc(F.tema)}</span>`:''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="meta">${F.tipo==='grand-qcm'?`<div><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div><b>${secs.length}</b><span>secciones</span></div><div><b>${(F.ideas_clave||[]).length}</b><span>ideas clave</span></div>`}<div><b>${(F.qcm||[]).length}</b><span>preguntas</span></div><div id="ultimo"></div></div>
</div></header>
<nav class="indice" aria-label="Índice"><div class="envoltura">${nav}</div></nav>
<main class="envoltura">
  ${(F.objetivos||[]).length?`<div class="dos">
    <div class="caja"><h3>Objetivos</h3><ul>${(F.objetivos||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>
    <div class="caja"><h3>Lo que hay que saber</h3><ol class="claves">${(F.ideas_clave||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>
  </div>`:''}
  ${F.tipo==='grand-qcm'&&(F.fichas||[]).length?`<div class="caja" style="margin-top:40px"><h3>Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="num">Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd>`).join('')}</dl></section>`:''}
  <section id="qcm"><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="envoltura">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* ---------- esquemas ---------- */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:oscuro?'dark':'neutral',fontFamily:'Spectral, Georgia, serif',flowchart:{htmlLabels:true,curve:'basis'}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* ---------- QCM ---------- */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u) document.getElementById('ultimo').innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; }catch(e){} }
ultimo();
const marco = document.getElementById('marco');

function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${(pos)/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="etiqueta o" style="display:inline-block;margin-bottom:12px">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="btn sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="btn" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'Dominado. Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'Bien, pero repasa las preguntas falladas.':'Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="btn" id="rep">Repetir todo</button>${fallos.length?'<button class="btn sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
