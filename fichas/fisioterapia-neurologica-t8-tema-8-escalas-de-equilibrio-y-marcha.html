<style>
:root{
  --papel:#f6f4ef; --hoja:#fffdf9; --tinta:#1b2427; --suave:#5b676b; --linea:#e2ddd2; --acento:#1f6f6b; --acento-suave:#dcebe8;
  --ocre:#b37a1c; --ocre-suave:#f6ead3; --rojo:#a8402f; --rojo-suave:#f5e0db; --verde:#2f7a46; --verde-suave:#dcefe1;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --texto:"Spectral",Georgia,serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#121615; --hoja:#181d1c; --tinta:#e7ebe9; --suave:#9aa6a3; --linea:#2a3331; --acento:#6cc2b9; --acento-suave:#1c3330;
  --ocre:#e0aa52; --ocre-suave:#3a2e18; --rojo:#e98a78; --rojo-suave:#3c211c; --verde:#7fcf98; --verde-suave:#173322; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:19px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);line-height:1.12;margin:0;font-variation-settings:"SOFT" 50}
h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:800;letter-spacing:-.025em}
h2{font-size:1.9rem;font-weight:600;letter-spacing:-.015em;margin:0 0 18px}
h3{font-size:1.2rem;font-weight:600}
b,strong{font-weight:600}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px}
.envoltura{max-width:820px;margin:0 auto;padding:0 22px}
/* cabecera */
header.portada{padding:64px 0 36px;border-bottom:1px solid var(--linea)}
.etiquetas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.etiqueta{font:600 .78rem/1 var(--serif);padding:7px 11px;border-radius:999px;background:var(--acento-suave);color:var(--acento)}
.etiqueta.o{background:var(--ocre-suave);color:var(--ocre)}
.sub{font-size:1.25rem;color:var(--suave);margin:16px 0 0;max-width:62ch;font-style:italic}
.meta{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap}
.meta div{font-family:var(--serif)}
.meta b{display:block;font-size:1.7rem;font-weight:800;line-height:1}
.meta span{font-size:.8rem;color:var(--suave)}
/* navegación */
nav.indice{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(10px)}
nav.indice .envoltura{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .envoltura::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .85rem var(--serif);padding:7px 12px;border-radius:999px}
nav.indice a:hover{color:var(--tinta);background:var(--hoja)}
nav.indice a.qcm{background:var(--tinta);color:var(--papel);margin-left:auto}
main section{padding:56px 0 8px}
.num{font:800 .85rem var(--serif);color:var(--ocre);display:block;margin-bottom:6px}
p{margin:0 0 16px;max-width:68ch}
/* bloques */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:14px;padding:22px 24px}
.caja h3{margin-bottom:12px}
.caja ul,.caja ol{margin:0;padding-left:1.2em}
.caja li{margin:6px 0}
.claves{counter-reset:k;list-style:none;padding:0!important}
.claves li{counter-increment:k;padding-left:38px;position:relative;margin:10px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:2px;width:26px;height:26px;border-radius:50%;background:var(--acento);color:var(--papel);font:800 .8rem/26px var(--serif);text-align:center}
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
.tw{overflow-x:auto;margin:6px 0 22px;border:1px solid var(--linea);border-radius:12px;background:var(--hoja)}
table{border-collapse:collapse;width:100%;font-size:.92rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:600 .95rem var(--serif);padding:14px 16px 4px}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--linea)}
th{font:600 .82rem var(--serif);color:var(--suave);border-top:0}
tbody tr:nth-child(odd){background:color-mix(in srgb,var(--papel) 50%,transparent)}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:6px 0 22px}
.tarjeta{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;font-size:.95rem;line-height:1.5}
.tarjeta .et{font:700 .72rem var(--serif);color:var(--ocre);display:block;margin-bottom:4px}
.tarjeta h3{font-size:1.05rem;margin-bottom:6px}
.def{border-left:3px solid var(--acento);padding:4px 0 4px 16px;margin:0 0 18px}
.def b{font-family:var(--serif);color:var(--acento)}
.nota{border-radius:12px;padding:14px 18px 14px 50px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;font-size:1.15rem}
.nota .t{font:700 .78rem var(--serif);display:block;margin-bottom:2px}
.perla{background:var(--verde-suave)} .perla::before{content:"🩺"} .perla .t{color:var(--verde)}
.alerta{background:var(--rojo-suave)} .alerta::before{content:"⚠️"} .alerta .t{color:var(--rojo)}
/* figuras y esquemas */
figure{margin:8px 0 26px;background:var(--hoja);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:20px 16px 8px;overflow-x:auto;text-align:center}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq .lienzo pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap;text-align:left}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{font-family:var(--serif);color:var(--tinta)}
/* caso clínico */
.caso{background:var(--tinta);color:var(--papel);border-radius:18px;padding:30px 30px 18px}
.caso h2{color:var(--papel)}
.caso p{color:color-mix(in srgb,var(--papel) 85%,transparent)}
.caso details{border-top:1px solid color-mix(in srgb,var(--papel) 18%,transparent);padding:12px 0}
.caso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
.caso details p{margin:10px 0 0}
dl.glosario{display:grid;grid-template-columns:max-content 1fr;gap:10px 20px;margin:0}
dl.glosario dt{font:600 1rem var(--serif);color:var(--acento)}
dl.glosario dd{margin:0}
.fuentes{font-size:.9rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border:1px solid var(--linea);border-radius:18px;padding:28px}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:600 .85rem var(--serif);color:var(--suave)}
.barra{flex:1;height:8px;border-radius:4px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--acento);transition:width .3s}
.pregunta{font:600 1.3rem/1.35 var(--serif);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer}
.op:hover:not([disabled]){border-color:var(--acento)}
.op .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 .9rem var(--serif);background:var(--hoja);border:1px solid var(--linea)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--verde);background:var(--verde-suave)}
.op.bien .l{background:var(--verde);color:#fff;border-color:var(--verde)}
.op.mal{border-color:var(--rojo);background:var(--rojo-suave)}
.op.mal .l{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.btn{font:600 .95rem var(--serif);padding:11px 20px;border-radius:999px;border:0;background:var(--tinta);color:var(--papel);cursor:pointer}
.btn.sec{background:transparent;color:var(--tinta);border:1.5px solid var(--linea)}
.btn[disabled]{opacity:.35;cursor:default}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:800 4.4rem/1 var(--serif);letter-spacing:-.03em}
.resultado .gran small{font-size:1.6rem;color:var(--suave)}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-family:var(--serif);font-weight:600}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:700px){body{font-size:17.5px}.dos{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}dl.glosario{grid-template-columns:1fr}dl.glosario dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i{transition:none}}
@media print{nav.indice,#qcm{display:none}body{background:#fff}}

<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script id="datos" type="application/json">{"titulo":"Tema 8 · Escalas de equilibrio y marcha","subtitulo":"Medir para decidir: elegir la escala según el nivel del paciente, pasarla como está escrita e interpretar el número sabiendo qué mide y qué no mide.","objetivos":["Al terminar, sabrás explicar por qué se miden el equilibrio y la marcha y dónde encaja la medición en el ciclo clínico y en la CIF.","Al terminar, sabrás diferenciar fiabilidad intra e interobservador, validez de constructo, sensibilidad al cambio, efecto suelo y techo, error de medida, MDC y cambio mínimo importante.","Al terminar, sabrás describir y puntuar Berg, Tinetti, mini-BESTest, CTSIB modificado, FAC, 10MWT, TUG, DGI, FGA y prueba de los 6 minutos, con sus puntos de corte orientativos.","Al terminar, sabrás elegir la batería adecuada para cada perfil de paciente (ictus, anciano con caídas, paciente autónomo con quejas sutiles, Parkinson) y justificar por qué esa y no otra.","Al terminar, sabrás reconocer los errores de pasada que invalidan una escala y registrar un resultado de forma comparable."],"ideas_clave":["Una escala **no diagnostica**: dice **cuánto** falla, no por qué ni dónde está la lesión. Solo el **mini-BESTest** orienta el **por qué** (cuatro sistemas del control postural).","Elegir mal la escala por el nivel del paciente es el error más común y más caro: **efecto suelo** en el grave (todo ceros) y **efecto techo** en el leve (todo máximos). En ambos casos la escala no detecta cambios.","**Berg**: 14 ítems, 0-4 cada uno, **0-56**, 15-20 min, solo equilibrio (no marcha). **\u003c45** asociado a más caídas; **56/56 no significa que no se vaya a caer**, sino que Berg no ve su problema.","**Tinetti (POMA)**: equilibrio **0-16** + marcha **0-12** = **0-28**, 10-15 min. **\u003c19 riesgo alto**, **19-24 moderado**, **25-28 bajo**. El empujón esternal debe ser una fuerza real.","**Mini-BESTest**: 14 ítems, 0-2 cada uno, **0-28**: ajustes anticipatorios, respuestas posturales, orientación sensorial y marcha dinámica. Mismo total puede exigir tratamientos opuestos.","**Velocidad de marcha** (10MWT, se cronometran los **6 m centrales**, del 2 al 8): **\u003c0,4 m/s domiciliaria**, **0,4-0,8 comunitaria limitada**, **>0,8 comunitaria** (Perry); ~**1 m/s** mejor salud; ~**0,1 m/s** = mejoría que el paciente nota.","**TUG**: \u003c10 s normal, desde **~13,5 s** más riesgo de caídas, **>30 s** dependiente fuera de casa; las variantes de **doble tarea** destapan al que anda bien mientras no piensa en otra cosa. **DGI 0-24 (8 tareas, ~19 caídas)**; **FGA 0-30 (10 tareas, menos techo)**.","Un cambio de **1 punto no es mejoría**: en Berg se manejan **~6 puntos** como cambio real en el crónico. Se reevalúa con la **misma escala**, en las **mismas condiciones**, al principio, en los cambios y al final, no en cada sesión."],"secciones":[{"id":"por-que-medir","titulo":"1. Por qué se mide y qué aporta un número","bloques":[{"tipo":"parrafo","texto":"Equilibrio y marcha son los dos dominios que más se miden en fisioterapia neurológica por cuatro razones: **son lo que el paciente pide** («quiero andar», «quiero no caerme»), **predicen autonomía** (si podrá vivir solo), **cambian con el tratamiento** (a diferencia de la lesión) y **se miden barato** (un pasillo, una silla y un cronómetro; no hace falta laboratorio de marcha). La idea central del tema: *una escala mal pasada da un número que parece serio y no vale nada*. Medir es **elegir, pasar e interpretar**."},{"tipo":"tarjetas","items":[{"etiqueta":"Definición","titulo":"Qué es una caída","texto":"Llegar al suelo o a un nivel inferior **de forma no intencionada**, con o sin lesión."},{"etiqueta":"Impacto","titulo":"Por qué importa","texto":"Es la **principal causa de lesión no intencionada** y de pérdida de autonomía en el mayor."},{"etiqueta":"Intrínsecos","titulo":"Factores del paciente","texto":"Equilibrio, fuerza, visión, fármacos, deterioro cognitivo, patología neurológica."},{"etiqueta":"Extrínsecos","titulo":"Factores del entorno","texto":"Alfombras, escalones, iluminación, calzado, ausencia de agarraderas."}]},{"tipo":"esquema","titulo":"El círculo del miedo a caer","mermaid":"flowchart LR\n  A[\"Caída\"] --> B[\"Miedo a caerse\"]\n  B --> C[\"Sale menos de casa\"]\n  C --> D[\"Pierde fuerza y equilibrio\"]\n  D --> A\n  E[\"Escala de equilibrio\"] -->|\"identifica riesgo\"| F[\"Intervenir antes de la caída\"]\n  F -.->|\"rompe el círculo\"| C","pie":"La escala es el filtro que decide sobre quién se actúa: identifica al de más riesgo para intervenir antes de la caída."},{"tipo":"esquema","titulo":"Dónde encaja la medición en el proceso clínico","mermaid":"flowchart TD\n  A[\"1. Valoración inicial: escalas y exploración\"] --> B[\"2. Objetivos medibles\"]\n  B --> C[\"3. Tratamiento\"]\n  C --> D[\"4. Reevaluación con la MISMA escala\"]\n  D --> E{\"5. Decisión\"}\n  E -->|\"seguir\"| C\n  E -->|\"cambiar objetivo\"| B\n  E -->|\"alta\"| F[\"Fin del proceso\"]","pie":"El objetivo se escribe con el número delante: «pasar de 34 a 40 en Berg en seis semanas»."},{"tipo":"tabla","titulo":"La medición en clave CIF","columnas":["Nivel CIF","Ejemplos","Relación con las escalas del tema"],"filas":[["Función y estructura","Tono, fuerza, rango","No es el foco de estas escalas"],["Actividad","Caminar, levantarse, girar","**Aquí están casi todas las escalas del tema**"],["Participación","Salir de casa, trabajar, vida social","Una escala de actividad **no informa por sí sola** de la participación"]]},{"tipo":"tabla","titulo":"Qué aporta medir frente a qué NO hace una escala","columnas":["Lo que aporta medir","Lo que una escala NO hace"],"filas":[["**Fija un punto de partida**: sin línea base no se demuestra mejoría","**No diagnostica**: dice cuánto falla, no por qué ni dónde está la lesión"],["**Convierte la impresión en dato**: «va mejor» no es comparable","**No decide por ti**: un corte es una probabilidad de grupo, no una sentencia"],["**Sostiene una decisión**: alta, ayuda técnica, cambio de objetivo","**No mide lo que no mira**: Berg no valora la marcha; Tinetti no valora la doble tarea"],["**Habla el idioma del equipo**: médico, TO y familia entienden el mismo número","**No sustituye el contexto**: casa, miedo, convivencia no salen en la puntuación"],["Hace el razonamiento **comprobable por otro**","**No vale mal pasada**; **no es un tratamiento**: ocupa tiempo de sesión"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Cuándo","titulo":"Valoración inicial","texto":"Antes de fijar objetivos. Es la referencia contra la que se comparará todo lo demás."},{"etiqueta":"Cuándo","titulo":"Reevaluación","texto":"Al cerrar una fase, al cambiar de objetivo o cuando aparece algo nuevo: **una caída, un fármaco**."}]},{"tipo":"alerta","texto":"Se mide **al principio, en los cambios y al final; no en cada sesión**. Medir demasiado a menudo gasta sesión y solo mide el ruido: el cambio real necesita semanas."}]},{"id":"propiedades-escala","titulo":"2. Qué hace buena a una escala: fiabilidad, validez y cambio real","bloques":[{"tipo":"parrafo","texto":"Una escala sirve si **mide lo que dice medir** (validez), si **dos profesionales sacan lo mismo** (fiabilidad) y si **detecta el cambio cuando el cambio existe** (sensibilidad al cambio). Si no es fiable, el número no se puede comparar; si no es válida, puede estar midiendo la fuerza de las piernas y llamarlo equilibrio."},{"tipo":"tarjetas","items":[{"etiqueta":"Fiabilidad","titulo":"Intraobservador","texto":"El **mismo evaluador** repite la escala y obtiene el mismo resultado."},{"etiqueta":"Fiabilidad","titulo":"Interobservador","texto":"**Dos evaluadores distintos** obtienen el mismo resultado en el mismo paciente."},{"etiqueta":"Validez","titulo":"Validez de constructo","texto":"La escala mide realmente el concepto que dice medir, y no otro parecido."},{"etiqueta":"Seguimiento","titulo":"Sensibilidad al cambio","texto":"La escala se mueve cuando el paciente mejora de verdad. Si no, no sirve para seguir."}]},{"tipo":"tabla","titulo":"Efecto suelo frente a efecto techo","columnas":["Rasgo","Efecto suelo","Efecto techo"],"filas":[["Qué ocurre","Todos los graves sacan el **mínimo**","Todos los leves sacan el **máximo**"],["Consecuencia","No distingue al muy mal del algo menos mal; si mejora, no lo recoge","Si empeora, tampoco lo recoge"],["Ejemplo del tema","Berg a quien no se mantiene sentado: cero en casi todos los ítems","Berg a un adulto sano o con déficit sutil: 56/56"],["Error de elección","**Elegir por encima**: escala demasiado exigente","**Elegir por debajo**: escala demasiado fácil"],["Señal de alarma","No puede ni intentar la mayoría de ítems","Supera todos los ítems sin ningún esfuerzo"],["Ámbito típico","Paciente grave, encamado","**El más frecuente en el ámbito ambulatorio**"]]},{"tipo":"definicion","termino":"Error de medida","texto":"Ruido inherente a toda escala. **Dos puntos arriba o abajo pueden ser solo ruido.**"},{"tipo":"definicion","termino":"Cambio mínimo detectable (MDC)","texto":"El cambio que **ya no se explica por el error del instrumento**."},{"tipo":"definicion","termino":"Cambio mínimo importante","texto":"El cambio que **además el paciente nota en su vida**. No siempre coincide con el MDC."},{"tipo":"perla","texto":"Regla práctica: en **Berg** se manejan **alrededor de 6 puntos** como cambio real en el **paciente crónico**; en **velocidad de marcha**, **~0,1 m/s** es una mejoría que el paciente nota. Los valores exactos dependen de la patología y del estudio, pero **un punto no es una mejoría**."},{"tipo":"tabla","titulo":"Cómo se lee un punto de corte","columnas":["Lo que dice","Lo que NO dice"],"filas":[["«Por debajo de este valor, el riesgo de caerse en el próximo año fue mayor **en el grupo estudiado**»","«Este señor se va a caer»"],["Separa dos grupos con distinta probabilidad","Que por encima del corte el paciente **esté a salvo**"]]},{"tipo":"alerta","texto":"Los cortes se obtienen en **poblaciones concretas**: un corte de ancianos de comunidad no se traslada sin más a un ictus subagudo. Un corte es una probabilidad de grupo, nunca una predicción individual."}]},{"id":"berg","titulo":"3. Escala de equilibrio de Berg (BBS)","bloques":[{"tipo":"tabla","titulo":"Ficha técnica de Berg","columnas":["Aspecto","Dato"],"filas":[["Qué es","**14 tareas** de equilibrio en sedestación, bipedestación y cambios de postura"],["Puntuación","Cada ítem **0-4** según criterio escrito; total **0-56**"],["Duración","**15-20 min** si se pasa bien; de las más largas"],["Material","Silla con y sin apoyabrazos, taburete o escalón, cronómetro, regla o pared"],["Qué no mide","**La marcha** (solo equilibrio)"],["Referencia","Berg, Wood-Dauphinee y Williams, 1992"]]},{"tipo":"tabla","titulo":"Los 14 ítems de Berg","columnas":["Nº","Ítem","Bloque"],"filas":[["1","Pasar de sentado a de pie","Transferencias y sedestación"],["2","Permanecer de pie sin apoyo","Transferencias y sedestación"],["3","Permanecer sentado sin apoyo","Transferencias y sedestación"],["4","Pasar de de pie a sentado","Transferencias y sedestación"],["5","Transferencias entre dos asientos","Transferencias y sedestación"],["6","De pie con los ojos cerrados","Bipedestación de dificultad creciente"],["7","De pie con los pies juntos","Bipedestación"],["8","Alcanzar hacia delante con el brazo","Bipedestación"],["9","Recoger un objeto del suelo","Bipedestación"],["10","Girarse para mirar atrás","Bipedestación"],["11","Girar 360 grados","Bipedestación"],["12","Subir alternando los pies a un escalón","Bipedestación"],["13","De pie con un pie delante del otro","Bipedestación"],["14","Mantenerse sobre una pierna","Bipedestación (la más difícil)"]]},{"tipo":"tabla","titulo":"Interpretación orientativa de Berg","columnas":["Puntuación","Significado"],"filas":[["0-20","Equilibrio muy alterado. Habitualmente dependiente, silla de ruedas"],["21-40","Marcha posible **con ayuda o supervisión**"],["41-56","Marcha independiente. **Aquí empieza el efecto techo**"],["\u003c 45","Asociado clásicamente a **mayor riesgo de caídas**"],["56/56","No significa que no se vaya a caer: **Berg no ve su problema** → subir a prueba más exigente"]]},{"tipo":"lista","items":["**Adornar la instrucción**: añadir «con cuidado» o «cuando puedas» cambia la tarea. Se lee literal.","**Animar con la voz**: el aliento del evaluador mejora el rendimiento y contamina la puntuación.","**Puntuar de memoria**: el criterio se busca en la escala **antes** de poner el número, no después.","**Dejar ítems sin pasar**: el total deja de ser comparable con la valoración anterior."]},{"tipo":"alerta","texto":"Trampa típica: el ítem «permanecer de pie sin apoyo» es el **2** y «permanecer sentado sin apoyo» el **3**; los ítems **1-5** son transferencias y sedestación y los **6-14** bipedestación de dificultad creciente. Berg es **la más usada y estudiada**, y también **la que más se pasa mal por prisa**."}]},{"id":"tinetti","titulo":"4. Escala de Tinetti (POMA)","bloques":[{"tipo":"parrafo","texto":"Tinetti (*Performance-Oriented Mobility Assessment*, Tinetti 1986) nació para valorar el **riesgo de caídas en el mayor**. Tiene **dos partes**, equilibrio y marcha, por lo que da información de ambos dominios en una sola herramienta y en menos tiempo que Berg (**10-15 min**). Se usa mucho en **geriatría y atención primaria**: es la que más probablemente se verá fuera del hospital. Encaja en el **anciano frágil y el paciente neurológico que camina**; hace **techo alto en el joven sano**."},{"tipo":"tabla","titulo":"Qué mira cada parte de Tinetti","columnas":["Equilibrio (0-16)","Marcha (0-12)"],"filas":[["Equilibrio sentado y al levantarse","Inicio de la marcha: ¿duda o arranca?"],["Intentos que necesita para levantarse","Longitud y altura del paso, pie a pie"],["Equilibrio inmediato y mantenido de pie","Simetría entre los dos pasos"],["**Respuesta al empujón esternal**","Continuidad: ¿se para entre pasos?"],["De pie con los ojos cerrados","Trayectoria: ¿se desvía del pasillo?"],["Giro de 360 grados","Tronco: ¿balancea o se agarra?"],["Sentarse","Base de sustentación al caminar"]]},{"tipo":"tabla","titulo":"Interpretación de Tinetti (anciano de comunidad)","columnas":["Total (0-28)","Riesgo de caídas"],"filas":[["\u003c 19","**Alto**"],["19-24","**Moderado**: zona de vigilancia y de intervención"],["25-28","**Bajo con esta escala**; no excluye otras causas de caída"]]},{"tipo":"perla","texto":"El **empujón esternal** se aplica con una **fuerza real**, no un toque: si no, el ítem no mide nada. La parte de **marcha se pasa mirando, sin cronómetro**: hay que saber qué se observa en cada ítem."},{"tipo":"alerta","texto":"**Tinetti responde «cuánto»; el mini-BESTest responde «por qué».** Tinetti no dice por qué falla el equilibrio y **no valora la doble tarea**. Si Tinetti sale **por encima de 24** y la paciente sigue cayéndose, hay que **subir de escala, no repetir la misma**."}]},{"id":"minibestest-ctsib","titulo":"5. Mini-BESTest, componente sensorial (CTSIB) y escalas de miedo","bloques":[{"tipo":"tabla","titulo":"Ficha técnica del mini-BESTest (MBT)","columnas":["Aspecto","Dato"],"filas":[["Qué es","Versión corta del **BESTest**; **14 ítems** en **4 sistemas** del control postural"],["Puntuación","Cada ítem **0-2**; total **0-28**"],["Duración","**10-15 min**"],["Ventaja","Señala **qué sistema falla**; **menos techo que Berg** en el que camina; incluye marcha dinámica"],["Referencia","Franchignoni, Horak, Godi y cols., 2010"]]},{"tipo":"tarjetas","items":[{"etiqueta":"ANTES","titulo":"Ajustes anticipatorios","texto":"Lo que el cuerpo prepara **antes** de moverse: levantarse, ponerse de puntillas, subir un pie."},{"etiqueta":"DESPUÉS","titulo":"Respuestas posturales","texto":"Lo que hace **después de un empujón**: paso de reacción hacia delante, atrás y al lado."},{"etiqueta":"Sentidos","titulo":"Orientación sensorial","texto":"Uso de vista, propiocepción y vestíbulo. Aquí entra la **superficie inestable**."},{"etiqueta":"Marcha","titulo":"Marcha dinámica","texto":"Caminar cambiando de velocidad, girando la cabeza, girando el cuerpo y con obstáculo."}]},{"tipo":"esquema","titulo":"Mismo total, tratamientos opuestos (mini-BESTest 18/28)","mermaid":"flowchart TD\n  A[\"Mini-BESTest 18/28\"] --> B[\"Paciente A\"]\n  A --> C[\"Paciente B\"]\n  B --> B1[\"Falla orientación sensorial\"]\n  B1 --> B2[\"Pierde equilibrio ojos cerrados y colchoneta\"]\n  B2 --> B3[\"Entrenar sin visión y superficies distintas\"]\n  C --> C1[\"Falla respuestas posturales\"]\n  C1 --> C2[\"No da paso de reacción\"]\n  C2 --> C3[\"Pasos de reacción y perturbaciones controladas\"]","pie":"El subapartado que falla es el que hay que entrenar. Esto es lo que un total de Berg o de Tinetti no puede decir."},{"tipo":"tabla","titulo":"CTSIB modificado: las cuatro condiciones","columnas":["Superficie","Ojos abiertos","Ojos cerrados"],"filas":[["Suelo firme","Condición 1","Condición 2: se quita la vista"],["Superficie inestable (espuma, colchoneta doblada o cojín)","Condición 3: se quita el suelo firme","Condición 4: se quitan vista y suelo firme"]]},{"tipo":"perla","texto":"Lectura del CTSIB: el que **solo falla con los ojos cerrados depende de la vista**; el que **falla en la espuma** tiene un **problema propioceptivo o vestibular**. No hace falta material especial: una colchoneta doblada o un cojín."},{"tipo":"tabla","titulo":"Escalas de miedo y confianza (autocumplimentadas)","columnas":["Escala","Qué recoge"],"filas":[["**FES-I** (escala internacional de eficacia en caídas)","**Preocupación por caerse** al hacer cosas"],["**ABC**","**Confianza** del paciente en su equilibrio en **16 situaciones**"]]},{"tipo":"alerta","texto":"FES-I y ABC **las rellena el paciente** y **complementan, no sustituyen**, la escala de ejecución. Equilibrio medido y equilibrio percibido no siempre coinciden: el que puntúa bien y no sale de casa por miedo tiene un problema que la escala de ejecución no ve."}]},{"id":"marcha","titulo":"6. Marcha: FAC, velocidad, TUG, DGI/FGA y 6 minutos","bloques":[{"tipo":"tabla","titulo":"Categorías de deambulación funcional (FAC)","columnas":["Aspecto","Dato"],"filas":[["Qué es","Clasificación de **6 niveles** según la **ayuda humana** que necesita para caminar"],["Puntuación","**0** = no camina; **5** = camina independiente en cualquier superficie"],["Para qué","**Situar** al paciente en un vistazo y comunicarlo al equipo sin ambigüedad"],["Limitación","**Muy gruesa**: no detecta cambios pequeños ni sirve para la evolución fina"]]},{"tipo":"parrafo","texto":"La **velocidad de marcha** (test de los 10 metros, 10MWT) es la medida más simple y rápida y de las que mejor **predicen autonomía**; se la ha llamado el **sexto signo vital del mayor**. Tarda **menos de 5 minutos** y es la prueba con mejor relación entre lo que cuesta y lo que aporta. Da un solo número **comparable entre servicios y entre países**."},{"tipo":"lista","items":["**Marca el suelo**: 10 metros, con marcas en el **2 y el 8**; cuentan los **6 centrales**.","**Explica**: «Camine hasta el final a su paso normal». El paciente arranca **antes** de la marca.","**Cronometra** del metro 2 al 8: **aceleración y frenada quedan fuera**.","**Repite**: **2 pasadas cómodas y 2 máximas**; se promedia cada una. Anota **calzado y ayuda técnica**.","**Cálculo**: velocidad = **6 m / segundos**. Si tarda 10 s → **0,6 m/s**."]},{"tipo":"figura","pagina":33,"pie":"Test de los 10 metros paso a paso: fíjate en que solo se cronometran los 6 m centrales (del 2 al 8) y en la fórmula 6 m entre segundos.","src":"img/fisioterapia-neurologica-t8-tema-8-escalas-de-equilibrio-y-marcha-p33.jpg"},{"tipo":"tabla","titulo":"Velocidad de marcha: clasificación funcional de Perry","columnas":["Velocidad","Categoría"],"filas":[["\u003c 0,4 m/s","**Marcha domiciliaria**: se mueve dentro de casa y poco más"],["0,4-0,8 m/s","**Comunitaria limitada**: sale, pero no cruza un semáforo con holgura"],["> 0,8 m/s","**Comunitaria**: autonomía real fuera de casa"],["~ 1 m/s","Umbral asociado a **mejor estado de salud general** en el mayor"],["Cambio ~ 0,1 m/s","Mejoría que **el paciente nota**"]]},{"tipo":"tabla","titulo":"Timed Up and Go (TUG)","columnas":["Aspecto","Dato"],"filas":[["Tarea","Levantarse de una silla, andar **3 m**, girar, volver y sentarse; se cronometra"],["\u003c 10 s","Normal"],["Desde ~13,5 s","**Más riesgo de caídas**"],["> 30 s","Habitualmente **dependiente para moverse fuera de casa**"],["TUG cognitivo","Restando **de 7 en 7**"],["TUG manual","Con un **vaso de agua**"]]},{"tipo":"tabla","titulo":"Marcha dinámica: DGI frente a FGA","columnas":["Rasgo","Dynamic Gait Index (DGI)","Functional Gait Assessment (FGA)"],"filas":[["Nº de tareas","**8**","**10**"],["Puntuación por tarea","0-3","0-3"],["Total","**0-24**","**0-30**"],["Tareas","Cambiar de velocidad, girar la cabeza, sortear obstáculos, escaleras","Deriva del DGI y le **añade dificultad**"],["Dato clave","**~19** se asocia a más caídas","**Menos efecto techo**; la opción cuando el DGI se queda corto"]]},{"tipo":"definicion","termino":"Prueba de los 6 minutos","texto":"Distancia recorrida en 6 minutos por un pasillo. Mide **resistencia (capacidad de esfuerzo submáximo), no equilibrio**. Se usa cuando la limitación es la **fatiga**: esclerosis múltiple, Parkinson, mayor desacondicionado."},{"tipo":"alerta","texto":"Si el paciente **se para por miedo**, el problema es **equilibrio**; si **se para por cansancio**, es **resistencia**. Y andar en línea recta por un pasillo vacío no es andar: DGI y FGA miden la marcha de la vida real. El **TUG con doble tarea** destapa al paciente que anda bien mientras no piensa en otra cosa."}]},{"id":"elegir","titulo":"7. Cómo elegir la escala según el paciente","bloques":[{"tipo":"tabla","titulo":"Las tres escalas de equilibrio, una al lado de otra","columnas":["Rasgo","Berg","Tinetti","Mini-BESTest"],"filas":[["Ítems / rango","14 · **0-56**","Equilibrio 0-16 + marcha 0-12 · **0-28**","14 · **0-28**"],["Duración","15-20 min","10-15 min","10-15 min"],["¿Valora marcha?","**No**, solo equilibrio","Sí (observacional)","Sí, **marcha dinámica**"],["Techo","**Alto**: el leve satura","Alto en el joven sano","**Menos techo** en el que camina"],["Qué da","Un total","Total y dos partes","Total y **cuatro sistemas** (el porqué)"],["Cuándo elegir","**Grave o encamado**","**Mayor con caídas**, fuera del hospital","**Autónomo o déficit sutil**"]]},{"tipo":"figura","pagina":34,"pie":"Comparativa Berg, mini-BESTest (MBT) y Tinetti: compara rango, duración, si incluyen marcha y dónde hacen techo, y las tres reglas de elección.","src":"img/fisioterapia-neurologica-t8-tema-8-escalas-de-equilibrio-y-marcha-p34.jpg"},{"tipo":"esquema","titulo":"Algoritmo de elección: cuatro preguntas por orden","mermaid":"flowchart TD\n  A[\"Paciente a valorar\"] --> Q1{\"¿Camina?\"}\n  Q1 -->|\"No\"| R1[\"No se mide marcha: Berg o equilibrio de Tinetti\"]\n  Q1 -->|\"Sí\"| Q2{\"¿Con ayuda?\"}\n  Q2 -->|\"Sí\"| R2[\"FAC para situar y velocidad para seguir\"]\n  Q2 -->|\"No\"| Q3{\"¿Autónomo?\"}\n  Q3 -->|\"Sí\"| R3[\"Berg hace techo: mini-BESTest, FGA, TUG doble tarea\"]\n  R3 --> Q4{\"¿Necesito el porqué?\"}\n  Q4 -->|\"Sí\"| R4[\"Mini-BESTest\"]","pie":"La primera pregunta que se responde decide la herramienta. Elegir bien la escala ahorra más tiempo que pasarla rápido."},{"tipo":"tabla","titulo":"Baterías de treinta minutos","columnas":["Perfil","Batería","Razón"],"filas":[["Ictus subagudo que camina con ayuda","**FAC + Berg + velocidad de marcha**","FAC sitúa, Berg mide equilibrio, velocidad permite seguir"],["Anciano de comunidad con caídas","**Tinetti completa + TUG + velocidad**","Cabe en **20 minutos**"],["Autónomo con quejas sutiles","**Mini-BESTest + FGA + TUG con doble tarea**","**Ninguna hace techo**"],["Parkinson","**Mini-BESTest + TUG con doble tarea + 6 minutos**","Mini-BESTest **por los bloqueos**; 6 min por la fatiga"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Caso 1","titulo":"Ictus de tres semanas","texto":"Camina 20 m con bastón y supervisión, se cansa, susto en el baño. **Se pasa**: FAC, Berg, velocidad (seguimiento cada 3 semanas). **No se pasa**: mini-BESTest y FGA (le quedan grandes) ni 6 minutos (no es la limitación principal). Registro: **Berg 34/56, FAC 3, velocidad cómoda 0,45 m/s, con bastón y zapato cerrado**."},{"etiqueta":"Caso 2","titulo":"Mujer de 82 años, dos caídas","texto":"Vive sola, camina sin ayuda agarrándose a muebles, ya no sale. **Se pasa**: Tinetti completa, TUG, velocidad y **FES-I o ABC**. El miedo explica por qué ha dejado de salir."},{"etiqueta":"Caso 3","titulo":"Esclerosis múltiple, quejas sutiles","texto":"Trabaja, tropieza en la calle y al girarse; **Berg 56/56** = efecto techo puro. **Se pasa**: mini-BESTest, FGA, TUG con doble tarea y **6 minutos por la fatiga**. Repetir Berg en un mes tampoco verá el problema."}]},{"tipo":"perla","texto":"Tres herramientas bien elegidas y bien pasadas valen más que seis pasadas con prisa. En el caso 3 la elección de la escala **es toda la valoración**: con la escala equivocada, ese paciente «está bien»."},{"tipo":"alerta","texto":"En el error de las dos direcciones (**elegir por encima** = todo ceros; **elegir por debajo** = todo máximos), el problema **no es el paciente ni la escala: es la elección**. Ojo en el caso 1: Berg 34 cae en el rango **21-40 (marcha con ayuda o supervisión)** y 0,45 m/s en **marcha comunitaria limitada**."}]},{"id":"errores-registro","titulo":"8. Errores típicos y cómo registrar","bloques":[{"tipo":"tabla","titulo":"Errores típicos al pasar escalas","columnas":["Error","Por qué invalida o perjudica"],"filas":[["Acumular escalas","Pasar cinco por si acaso gasta la sesión y cansa al paciente"],["Cambiar la instrucción","Cada evaluador dice una cosa y el resultado deja de ser comparable"],["Ayudar sin darse cuenta","La mano cerca, el gesto, el tono de ánimo: todo mejora la puntuación"],["No anotar las condiciones","Con zapatos o descalzo, con bastón o sin él: cambia el resultado"],["Comparar peras con manzanas","Reevaluar con una escala distinta a la inicial no permite comparar"],["Medir demasiado a menudo","El cambio real necesita semanas; medir cada sesión solo mide el ruido"]]},{"tipo":"lista","items":["**El número y la escala**: no basta con «18»; hay que decir de qué escala y **sobre cuánto**.","**La fecha y las condiciones**: calzado, ayuda técnica, hora del día y **momento del fármaco** si lo hay.","**El desglose si lo tiene**: en mini-BESTest y Tinetti el subapartado dice más que el total.","**La interpretación en una frase**: qué significa ese número para este paciente y qué se va a hacer con él."]},{"tipo":"perla","texto":"Casi todos los errores se resuelven **leyendo la escala antes de pasarla**, no mientras se pasa. Un registro sin condiciones no se puede comparar dentro de seis semanas, ni por ti ni por nadie."},{"tipo":"parrafo","texto":"Enlace con la asignatura: **el tema 3 mira la marcha, el tema 8 la puntúa y el tema 6 explica por qué falla** (control motor). Los temas **9 y 14** usan estas medidas para comprobar si el tratamiento del tono y de la postura funciona."}]}],"caso_clinico":{"titulo":"Hombre de 68 años con enfermedad de Parkinson y bloqueos al girar","presentacion":"Antonio, 68 años, enfermedad de Parkinson de 6 años de evolución. Vive con su mujer, camina sin ayuda técnica, pero refiere bloqueos al girarse en la cocina y al pasar por puertas, se cansa en los paseos largos y ha tenido una caída hace un mes mientras hablaba por teléfono andando. En la primera valoración, otro fisioterapeuta le pasó Berg y obtuvo 53/56. Toma levodopa a las 8:00, 14:00 y 20:00 y acude a sesión unas veces por la mañana y otras por la tarde.","preguntas":[{"pregunta":"¿Qué batería de 30 minutos elegirías y por qué no es suficiente el Berg de 53/56?","respuesta":"Berg en un paciente que camina independiente está en la zona 41-56, donde **empieza el efecto techo**, y además **no valora la marcha**, que es donde aparecen sus bloqueos y su caída. La batería del tema para Parkinson es **mini-BESTest** (por los bloqueos, y porque informa de marcha dinámica y de qué sistema falla), **TUG con doble tarea** (la caída fue andando y hablando: la doble tarea destapa ese déficit) y **prueba de los 6 minutos** (se cansa: la fatiga es una limitación propia que se mide con resistencia, no con equilibrio)."},{"pregunta":"En el mini-BESTest obtiene 17/28 con las pérdidas concentradas en la marcha dinámica y en los ajustes anticipatorios; la orientación sensorial está intacta. ¿Cómo orienta esto el tratamiento?","respuesta":"El mini-BESTest responde al **por qué**: el subapartado que falla es el que hay que entrenar. Fallo en **marcha dinámica** (cambios de velocidad, giros de cabeza y de cuerpo, obstáculo) y en **ajustes anticipatorios** (lo que el cuerpo prepara antes de moverse: levantarse, puntillas, subir un pie) orienta a entrenar giros, cambios de ritmo, sorteo de obstáculos y preparación postural del movimiento. No tendría sentido priorizar trabajo sin visión o sobre espuma, que sería el tratamiento de un fallo de **orientación sensorial**, aquí conservada. Otro paciente con el mismo 17/28 podría necesitar un tratamiento opuesto."},{"pregunta":"¿Qué debes registrar para que la reevaluación dentro de seis semanas sea comparable, y cuándo reevaluarías?","respuesta":"Registrar **número, escala y sobre cuánto** (mini-BESTest 17/28, con su **desglose por sistemas**), TUG con doble tarea en segundos y distancia en 6 minutos; **fecha y condiciones**: calzado, ayuda técnica (ninguna), **hora del día y momento respecto a la levodopa**, porque el rendimiento en Parkinson varía con el fármaco; y una **frase de interpretación**. La reevaluación se hace con **las mismas escalas** y en condiciones equivalentes (misma franja respecto a la toma), al **cerrar la fase**, al cambiar de objetivo o si aparece algo nuevo (otra caída, cambio de medicación), **no en cada sesión**, porque el cambio real necesita semanas y medir a menudo solo mide ruido."}]},"glosario":[{"termino":"Fiabilidad intraobservador","definicion":"Grado en que el mismo evaluador, al repetir la escala, obtiene el mismo resultado."},{"termino":"Fiabilidad interobservador","definicion":"Grado en que dos evaluadores distintos obtienen el mismo resultado en el mismo paciente."},{"termino":"Validez de constructo","definicion":"Propiedad de una escala de medir realmente el concepto que dice medir y no otro parecido."},{"termino":"Sensibilidad al cambio","definicion":"Capacidad de la escala de moverse cuando el paciente mejora o empeora de verdad."},{"termino":"Efecto suelo","definicion":"Todos los pacientes graves obtienen la puntuación mínima; la escala no distingue entre ellos ni recoge mejorías."},{"termino":"Efecto techo","definicion":"Todos los pacientes leves obtienen la puntuación máxima; la escala no recoge ni mejoría ni empeoramiento. Es el problema más frecuente en ámbito ambulatorio."},{"termino":"Cambio mínimo detectable (MDC)","definicion":"Cambio que ya no se explica por el error de medida del instrumento."},{"termino":"Cambio mínimo importante","definicion":"Cambio que, además de superar el error de medida, el paciente nota en su vida."},{"termino":"Punto de corte","definicion":"Valor que separa dos grupos con distinta probabilidad de un desenlace (p. ej. caída) en la población estudiada; no predice al individuo."},{"termino":"Ajustes posturales anticipatorios","definicion":"Lo que el cuerpo prepara antes de moverse (levantarse, ponerse de puntillas, subir un pie); sistema del mini-BESTest."},{"termino":"Respuestas posturales reactivas","definicion":"Lo que hace el cuerpo después de una perturbación, como el paso de reacción hacia delante, atrás o al lado."},{"termino":"CTSIB modificado","definicion":"Prueba de cuatro condiciones (suelo firme o inestable, ojos abiertos o cerrados) que muestra de qué información sensorial depende el equilibrio."},{"termino":"FES-I","definicion":"Escala internacional de eficacia en caídas; autocumplimentada, recoge la preocupación por caerse al hacer actividades."},{"termino":"Escala ABC","definicion":"Escala autocumplimentada de confianza en el propio equilibrio en dieciséis situaciones."},{"termino":"Doble tarea","definicion":"Ejecución simultánea de una tarea motora y otra cognitiva o manual (p. ej. TUG restando de 7 en 7 o llevando un vaso de agua)."}],"fuentes":["Berg K, Wood-Dauphinee S, Williams JI. Measuring balance in the elderly. Can J Public Health, 1992.","Tinetti ME. Performance-oriented assessment of mobility problems. J Am Geriatr Soc, 1986.","Franchignoni F, Horak F, Godi M y cols. Improving the BESTest: the mini-BESTest. J Rehabil Med, 2010.","Shumway-Cook A, Woollacott M. Motor Control: Translating Research into Clinical Practice.","Clasificación funcional de la velocidad de marcha de Perry (citada en el PDF sin referencia completa)."],"qcm":[{"pregunta":"En el test de los 10 metros, un paciente tarda 12 segundos en recorrer el tramo cronometrado según el protocolo del tema. ¿Qué velocidad tiene y cómo se clasifica su marcha?","opciones":["0,67 m/s; marcha comunitaria limitada","0,83 m/s; marcha comunitaria con autonomía real","0,50 m/s; marcha domiciliaria dentro de casa","0,50 m/s; marcha comunitaria limitada"],"correcta":3,"explicacion":"Solo se cronometran los 6 metros centrales (del metro 2 al 8), dejando fuera aceleración y frenada. Velocidad = 6 m / 12 s = 0,5 m/s, que en la clasificación de Perry (0,4-0,8 m/s) corresponde a marcha comunitaria limitada.","por_opcion":["❌ Resulta de dividir 8 m entre 12 s; el tramo cronometrado no son 8 m sino 6 m.","❌ Resulta de dividir 10 m entre 12 s: error típico de no recordar que solo cuentan los 6 m centrales.","❌ La velocidad es correcta, pero la marcha domiciliaria corresponde a menos de 0,4 m/s.","✅ 6 m / 12 s = 0,5 m/s, dentro del rango 0,4-0,8 m/s de marcha comunitaria limitada."]},{"pregunta":"Una paciente con esclerosis múltiple que trabaja refiere tropiezos en la calle y al girarse. Obtiene 56/56 en Berg. ¿Cuál es la interpretación y conducta más correcta según el tema?","opciones":["Riesgo de caída descartado; reevaluar Berg dentro de un mes","Efecto techo; pasar mini-BESTest, FGA y TUG con doble tarea","Baja validez de constructo; repetir Berg con otro evaluador","Efecto suelo; cambiar a FAC para situarla mejor"],"correcta":1,"explicacion":"Un 56/56 en una paciente sintomática es efecto techo puro: Berg no ve su problema y repetirla tampoco lo verá. En el paciente autónomo con quejas sutiles se sube a mini-BESTest, FGA y TUG con doble tarea, que no hacen techo (y 6 minutos si hay fatiga).","por_opcion":["❌ 56/56 no significa que no se vaya a caer, y repetir Berg en un mes no detectará su problema.","✅ Es la conducta del caso 3 del tema: subir a escalas más exigentes sin techo.","❌ El problema no es de validez ni de fiabilidad entre evaluadores, sino de elección de escala por nivel.","❌ El efecto suelo afecta al paciente grave que saca el mínimo; aquí ocurre lo contrario."]},{"pregunta":"Dos pacientes obtienen 18/28 en el mini-BESTest. El primero pierde el equilibrio con ojos cerrados sobre colchoneta pero da bien el paso de reacción; el segundo, al revés. ¿Qué tratamiento corresponde al primero?","opciones":["Pasos de reacción y perturbaciones controladas en varias direcciones","Preparación de levantarse, ponerse de puntillas y subir un pie","Trabajo sin visión y sobre superficies de distinta consistencia","Cambios de velocidad, giros de cabeza y sorteo de obstáculos"],"correcta":2,"explicacion":"El primer paciente falla en orientación sensorial (vista, propiocepción, vestíbulo, superficie inestable), por lo que se entrena sin visión y sobre superficies distintas. El mismo total puede exigir tratamientos opuestos: el subapartado que falla es el que se entrena.","por_opcion":["❌ Es el tratamiento del segundo paciente, con fallo en respuestas posturales.","❌ Corresponde a los ajustes anticipatorios, no descritos como deficitarios.","✅ Fallo de orientación sensorial: trabajo sin visión y sobre superficies distintas.","❌ Corresponde al sistema de marcha dinámica, que no es el alterado."]},{"pregunta":"En el mini-BESTest, un paciente puntúa bajo en las tareas de levantarse, ponerse de puntillas y mantenerse sobre un pie. ¿Qué sistema del control postural está señalando?","opciones":["Ajustes anticipatorios, preparados antes del movimiento","Respuestas posturales, generadas tras la perturbación","Marcha dinámica, con cambios de dirección y ritmo","Orientación sensorial, dependiente de la superficie"],"correcta":0,"explicacion":"Levantarse, ponerse de puntillas y subir un pie son tareas de ajustes anticipatorios: lo que el cuerpo prepara antes de moverse. Las respuestas posturales, en cambio, son lo que ocurre después de un empujón (paso de reacción).","por_opcion":["✅ Son exactamente los ejemplos que da el tema para los ajustes anticipatorios.","❌ Las respuestas posturales se valoran con el paso de reacción tras un empujón.","❌ La marcha dinámica incluye cambiar de velocidad, girar cabeza y cuerpo y obstáculo.","❌ La orientación sensorial se valora quitando vista o suelo firme."]},{"pregunta":"Una mujer de 80 años que vive en la comunidad obtiene exactamente 19 puntos en la escala de Tinetti. ¿Cómo se interpreta según los rangos del tema?","opciones":["Riesgo moderado, zona de vigilancia y de intervención","Riesgo alto de caídas, por estar en el punto de corte","No interpretable sin conocer el desglose de la marcha","Riesgo bajo, al superar la mitad de la puntuación total"],"correcta":0,"explicacion":"En Tinetti, menos de 19 es riesgo alto, de 19 a 24 riesgo moderado y de 25 a 28 riesgo bajo. Un 19 exacto ya entra en la franja moderada, que es zona de vigilancia y de intervención.","por_opcion":["✅ El rango 19-24 corresponde a riesgo moderado.","❌ El riesgo alto es por debajo de 19; el 19 ya pertenece a la franja moderada.","❌ El desglose aporta información, pero el total sí es interpretable con los rangos dados.","❌ El riesgo bajo empieza en 25; superar la mitad del total no es un criterio del tema."]},{"pregunta":"El mismo día, dos fisioterapeutas pasan Berg a un mismo paciente estable y obtienen 38 y 45 puntos. ¿Qué propiedad de la medida queda en entredicho?","opciones":["La fiabilidad intraobservador del instrumento aplicado","La sensibilidad al cambio del instrumento aplicado","La fiabilidad interobservador del instrumento aplicado","La validez de constructo del instrumento aplicado"],"correcta":2,"explicacion":"La fiabilidad interobservador exige que dos evaluadores distintos obtengan el mismo resultado en el mismo paciente. Una discrepancia así suele deberse a errores de pasada, como cambiar la instrucción, animar con la voz o puntuar de memoria.","por_opcion":["❌ La intraobservador se refiere al mismo evaluador repitiendo la escala.","❌ La sensibilidad al cambio valora si la escala se mueve cuando el paciente mejora de verdad.","✅ Son dos evaluadores distintos sobre el mismo paciente: fiabilidad interobservador.","❌ La validez de constructo se pregunta si mide equilibrio y no otra cosa, como fuerza."]},{"pregunta":"Un paciente con ictus crónico pasa de 34 a 37 puntos en Berg tras seis semanas de tratamiento. Según el tema, ¿qué se puede concluir?","opciones":["Empeoramiento enmascarado por el efecto techo de la escala","Mejoría real, porque cambia de rango de interpretación de Berg","Mejoría real, ya que supera el error de medida de dos puntos","No se puede afirmar mejoría real: se manejan unos seis puntos"],"correcta":3,"explicacion":"En Berg se manejan alrededor de seis puntos como cambio real en el paciente crónico. Tres puntos pueden explicarse en gran parte por el error de medida, por lo que no permiten afirmar un cambio real.","por_opcion":["❌ El efecto techo empieza en 41-56; con 37 no hay techo y la puntuación sube.","❌ 34 y 37 están ambos en el rango 21-40; además el rango no define el cambio real.","❌ Que dos puntos puedan ser ruido no implica que tres ya sean cambio real; la referencia son unos seis.","✅ El cambio de 3 puntos no alcanza los aproximadamente 6 que se manejan en el crónico."]},{"pregunta":"Un hombre mayor de comunidad realiza el TUG en 14 segundos. ¿Cuál es la lectura correcta de este resultado?","opciones":["Pertenece a un grupo con más riesgo, sin predecir su caso","Es normal, porque no alcanza el umbral de dependencia de 30 s","Indica dependencia fuera de casa y marcha domiciliaria","Se caerá en el próximo año y precisa ayuda técnica inmediata"],"correcta":0,"explicacion":"Desde unos 13,5 s en el TUG aumenta el riesgo de caídas, pero un punto de corte separa grupos con distinta probabilidad en la población estudiada; no dice «este señor se va a caer». Normal es por debajo de 10 s y dependencia fuera de casa, por encima de 30 s.","por_opcion":["✅ Lectura correcta de un punto de corte: probabilidad de grupo, no predicción individual.","❌ Normal es menos de 10 s; 14 s ya supera el corte de 13,5 s de más riesgo.","❌ La dependencia fuera de casa se asocia a más de 30 s, no a 14 s.","❌ Un corte no es una sentencia individual ni decide por sí solo la ayuda técnica."]},{"pregunta":"Un paciente vestibular obtiene 24/24 en el Dynamic Gait Index pero sigue refiriendo inestabilidad al andar por la calle. ¿Qué herramienta del tema es la más adecuada para seguirle?","opciones":["Parte de equilibrio de Tinetti, con empujón esternal","Categorías de deambulación funcional, por su rapidez","Escala de Berg, por ser la más estudiada en equilibrio","Functional Gait Assessment, con 10 tareas y total de 30"],"correcta":3,"explicacion":"La FGA deriva del DGI y le añade dificultad para reducir el efecto techo (10 tareas, 0-30): es la opción cuando el DGI se queda corto. Las otras alternativas son más fáciles y saturarían igual o peor en un paciente que camina bien.","por_opcion":["❌ Tinetti hace techo en el sujeto sano o leve y no valora la marcha dinámica de la calle.","❌ La FAC es muy gruesa: no detecta cambios pequeños en alguien que ya camina independiente.","❌ Berg tiene techo alto en el que camina bien y no valora la marcha.","✅ Es la evolución del DGI diseñada para reducir su efecto techo."]},{"pregunta":"Durante la prueba de los 6 minutos, una paciente con enfermedad de Parkinson se detiene a los cuatro minutos. ¿Qué dato es decisivo para interpretar esa parada?","opciones":["Si se para por miedo o se para por cansancio","La puntuación total de Berg obtenida en la misma sesión","La distancia que llevaba recorrida en el momento de parar","La velocidad cómoda medida previamente en 10 metros"],"correcta":0,"explicacion":"La prueba de los 6 minutos mide resistencia (esfuerzo submáximo), no equilibrio. Si la paciente se para por miedo, el problema es de equilibrio; si se para por cansancio, es de resistencia: contestan a preguntas distintas.","por_opcion":["✅ Es el criterio que da el tema para distinguir limitación de equilibrio frente a resistencia.","❌ Berg mide solo equilibrio estático y transferencias; no interpreta la parada.","❌ La distancia es el resultado de la prueba, pero no explica la naturaleza de la limitación.","❌ La velocidad cómoda predice autonomía, pero no aclara por qué se detuvo en esta prueba."]},{"pregunta":"Un paciente con ictus subagudo camina con bastón y supervisión. Para seguir su evolución cada tres semanas, ¿qué medida de marcha es la adecuada y por qué?","opciones":["Prueba de los 6 minutos, porque el paciente se cansa","FGA, porque reduce el efecto techo del DGI en la marcha","Velocidad de marcha, porque la FAC es demasiado gruesa","FAC, porque comunica el nivel al equipo sin ambigüedad"],"correcta":2,"explicacion":"En el paciente que camina con ayuda, la FAC sirve para situarlo y la velocidad de marcha para seguirlo. La FAC es muy gruesa y no detecta cambios pequeños; la FGA le queda grande y los 6 minutos no miden su limitación principal.","por_opcion":["❌ Aunque se cansa, la resistencia no es su limitación principal según el caso del tema.","❌ En el caso 1 del tema, FGA y mini-BESTest se descartan porque hoy le quedan grandes.","✅ La velocidad es la medida de seguimiento en este perfil, frente a una FAC poco sensible.","❌ La FAC sitúa al paciente, pero no detecta cambios pequeños ni sirve para la evolución fina."]},{"pregunta":"Una mujer mejora de forma significativa en Berg tras el tratamiento, pero sigue sin salir de casa. Según el tema, ¿cómo se explica mejor esta discrepancia?","opciones":["Berg es una escala de estructura y función, no de actividad","Berg mide actividad; la participación y el miedo quedan fuera","La mejoría de Berg no supera el cambio mínimo detectable","Berg sufre efecto suelo en las tareas fuera del domicilio"],"correcta":1,"explicacion":"Casi todas las escalas del tema se sitúan en el nivel de actividad de la CIF, y una escala de actividad no informa por sí sola de la participación. El miedo a caerse tampoco sale en la puntuación: se recoge con FES-I o ABC, que complementan la escala de ejecución.","por_opcion":["❌ Tono, fuerza y rango son estructura y función; Berg valora tareas, es decir, actividad.","✅ La participación y el miedo no los capta una escala de actividad como Berg.","❌ El enunciado plantea mejoría significativa; el problema es de dominio medido, no de magnitud.","❌ El efecto suelo es propio del paciente grave que saca el mínimo, no de esta situación."]},{"pregunta":"En la valoración inicial se registró Berg 34/56. En la reevaluación, por falta de tiempo, se pasa Tinetti y se obtiene 20/28. ¿Cuál es el principal problema metodológico?","opciones":["Tinetti tiene peor fiabilidad interobservador que Berg","Reevaluar con otra escala impide comparar con la línea base","El intervalo entre ambas mediciones fue demasiado largo","Se ha omitido la parte de marcha de la escala de Berg"],"correcta":1,"explicacion":"El ciclo exige reevaluar con la MISMA escala; comparar Berg con Tinetti es comparar peras con manzanas. Sin la misma herramienta no se puede demostrar mejoría respecto al punto de partida.","por_opcion":["❌ El tema no compara la fiabilidad de ambas escalas; el error es de método de reevaluación.","✅ Es el error «comparar peras con manzanas» descrito en el tema.","❌ El cambio real necesita semanas; un intervalo largo no es el problema planteado.","❌ Berg no tiene parte de marcha: solo valora equilibrio."]},{"pregunta":"¿Cuál de estas tareas se valora en la escala de Tinetti pero NO forma parte de los catorce ítems de la escala de Berg?","opciones":["Responder a un empujón esternal aplicado por el evaluador","Girar 360 grados sobre sí mismo en bipedestación","Pasar de sentado a de pie desde una silla","Mantenerse de pie con los ojos cerrados sin apoyo"],"correcta":0,"explicacion":"La respuesta al empujón esternal es un ítem de la parte de equilibrio de Tinetti, y debe aplicarse con fuerza real. Berg no incluye ninguna perturbación externa; giro de 360 grados, ojos cerrados y levantarse aparecen en ambas escalas.","por_opcion":["✅ El empujón esternal es exclusivo de Tinetti entre estas dos escalas.","❌ Girar 360 grados es el ítem 11 de Berg y también está en Tinetti.","❌ Pasar de sentado a de pie es el ítem 1 de Berg; Tinetti valora levantarse e intentos.","❌ De pie con los ojos cerrados es el ítem 6 de Berg y también se valora en Tinetti."]},{"pregunta":"Un mayor pasa de 0,72 a 0,85 m/s de velocidad cómoda tras el tratamiento, medido en las mismas condiciones. ¿Qué interpretación es la más ajustada al tema?","opciones":["Alcanza el umbral de 1 m/s asociado a mejor estado de salud","No alcanza el cambio que se nota y sigue en comunitaria limitada","Supera el cambio que se nota, pero sigue en comunitaria limitada","Supera el cambio que se nota y pasa a marcha comunitaria"],"correcta":3,"explicacion":"El aumento es de 0,13 m/s, por encima de los aproximadamente 0,1 m/s que se consideran una mejoría que el paciente nota. Además, cruza de 0,4-0,8 m/s (comunitaria limitada) a más de 0,8 m/s (marcha comunitaria), aunque todavía no llega a 1 m/s.","por_opcion":["❌ 0,85 m/s queda por debajo del umbral de 1 m/s de mejor estado de salud.","❌ 0,13 m/s está por encima de los aproximadamente 0,1 m/s de cambio que se nota.","❌ Con 0,85 m/s ya ha superado los 0,8 m/s de la marcha comunitaria limitada.","✅ 0,13 m/s supera el cambio que se nota y 0,85 m/s está por encima de 0,8 m/s."]}],"asignatura":"Fisioterapia neurológica","tema":8,"fecha":"2026-11-04"}</script>

<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const L = 'ABCD';
const secs = F.secciones || [];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="tarjetas">${(b.items||[]).map(t=>`<div class="tarjeta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="def"><b>${md(b.termino)}</b> — ${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota perla"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota alerta"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${md(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const nav = secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`).join('') + (F.caso_clinico?'<a href="#caso">Caso clínico</a>':'') + (F.glosario?.length?'<a href="#glosario">Glosario</a>':'') + `<a class="qcm" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`;

document.getElementById('app').innerHTML = `
<header class="portada"><div class="envoltura">
  <div class="etiquetas">${F.asignatura?`<span class="etiqueta">${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="etiqueta o">Tema ${esc(F.tema)}</span>`:''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="meta">${F.tipo==='grand-qcm'?`<div><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div><b>${secs.length}</b><span>secciones</span></div><div><b>${(F.ideas_clave||[]).length}</b><span>ideas clave</span></div>`}<div><b>${(F.qcm||[]).length}</b><span>preguntas</span></div><div id="ultimo"></div></div>
</div></header>
<nav class="indice" aria-label="Índice"><div class="envoltura">${nav}</div></nav>
<main class="envoltura">
  ${(F.objetivos||[]).length?`<div class="dos">
    <div class="caja"><h3>Objetivos</h3><ul>${(F.objetivos||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>
    <div class="caja"><h3>Lo que hay que saber</h3><ol class="claves">${(F.ideas_clave||[]).map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>
  </div>`:''}
  ${F.tipo==='grand-qcm'&&(F.fichas||[]).length?`<div class="caja" style="margin-top:40px"><h3>Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="num">Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd>`).join('')}</dl></section>`:''}
  <section id="qcm"><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="envoltura">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* ---------- esquemas ---------- */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:oscuro?'dark':'neutral',fontFamily:'Spectral, Georgia, serif',flowchart:{htmlLabels:true,curve:'basis'}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* ---------- QCM ---------- */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u) document.getElementById('ultimo').innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; }catch(e){} }
ultimo();
const marco = document.getElementById('marco');

function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${(pos)/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="etiqueta o" style="display:inline-block;margin-bottom:12px">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="btn sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="btn" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'Dominado. Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'Bien, pero repasa las preguntas falladas.':'Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="btn" id="rep">Repetir todo</button>${fallos.length?'<button class="btn sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
