<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fundamentos básicos del Concepto Bobath · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>
<body>
<div id="lectura"></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

<script id="datos" type="application/json">{"titulo":"Fundamentos básicos del Concepto Bobath","subtitulo":"Enfoque de resolución de problemas para evaluar y tratar la función, el movimiento y el control postural tras una lesión del SNC, basado en la neuroplasticidad y el movimiento normal.","resumen":["Según la **IBITA**, el Concepto Bobath es una **forma de resolución de problemas** para la evaluación y el tratamiento de personas con trastornos de la **función, el movimiento y el control postural** por lesión del **SNC**, aplicable a todas las edades y grados de afectación.","Lo crearon en **Londres en los años 1940** **Berta Bobath** (fisioterapeuta) y **Karel Bobath** (neurofisiólogo), rompiendo con la rehabilitación ortopédica y compensadora de su época al demostrar que **el SNC podía modificarse**.","Su base clásica es **inhibir el tono y la actividad refleja anormal** y **facilitar** patrones normales desde los **puntos clave**, y ha evolucionado hacia un **concepto funcional** centrado en actividades con propósito y en la **participación activa** del paciente.","El **Mecanismo de Control Postural (MCP)** integra **sensibilidad, tono postural, inervación recíproca y coordinación**: la alteración de uno altera todo el mecanismo, por lo que **todo paciente con lesión del SNC tiene alterado su MCP**.","El tratamiento sigue el orden **normalizar el tono → mejorar la inervación recíproca → coordinación normal**, aprovecha la **neuroplasticidad** y el paso del **feedback al feedforward**, y exige un **manejo de 24 horas** coherente entre profesionales y familia."],"objetivos":["Definir el Concepto Bobath según la IBITA y situar su origen histórico y su evolución hacia un concepto funcional.","Explicar el tono postural, los factores que lo modifican y su relación con la estabilidad y la selectividad del movimiento.","Describir el Mecanismo de Control Postural, sus componentes y las consecuencias de la inervación recíproca anormal (espasticidad frente a ataxia/atetosis).","Relacionar neuroplasticidad, aprendizaje motor (feedback/feedforward) y movimiento normal con la planificación del tratamiento.","Aplicar los principios generales (facilitación, puntos clave, manejo 24 h, participación activa) a un paciente neurológico."],"ideas_clave":["Bobath = **resolución de problemas**, no un conjunto de ejercicios preestablecidos: el tratamiento es un **proceso interactivo** terapeuta–paciente (IBITA, 1995).","**Facilitación** = hacer más fácil una función selectiva; se realiza sobre todo con las manos desde los **puntos clave de control** y se **retira** conforme el paciente mejora.","El **tono postural normal** debe ser lo bastante alto para vencer la gravedad y lo bastante bajo para permitir el movimiento: **cuanto más alto el tono, menos selectivo el movimiento**.","A **menor base de sustentación** o **menor estabilidad de la base**, **mayor tono**; el **dolor aumenta el tono** y debe evitarse siempre.","**↑ estabilidad + movimiento insuficiente → espasticidad/hipertonía** (patrones totales); **↑ movilidad + estabilidad insuficiente → ataxia y atetosis** (tono bajo).","Orden del tratamiento tras la evaluación: **1.º normalizar el tono**, después **inervación recíproca**, y con ambas mejora la **coordinación**.","El aprendizaje motor ocurre al pasar **del feedback al feedforward**; los movimientos activos iniciados por el paciente son esenciales.","Los patrones anormales mantenidos en una alineación incorrecta pueden ser **identificados por el SNC como normales**: por eso se trata **desde la fase inicial**."],"secciones":[{"id":"definicion-historia","titulo":"Definición, historia y evolución del concepto","bloques":[{"tipo":"parrafo","texto":"El Concepto Bobath es uno de los enfoques **más utilizados y divulgados** en rehabilitación neurológica de personas con afecciones del **SNC**, tanto en fisioterapia como en terapia ocupacional. No es una técnica cerrada, sino una manera de razonar: se observa al paciente, se identifican los problemas de función, movimiento y control postural, y se diseña un tratamiento individual que se modifica según la respuesta."},{"tipo":"definicion","termino":"Concepto Bobath (IBITA)","texto":"Forma de **resolución de problemas** para la **evaluación y tratamiento** de personas con un **trastorno de la función, el movimiento y el control postural** debido a una **lesión del Sistema Nervioso Central**; puede aplicarse a individuos de **todas las edades** y **todos los grados** de desorden físico o funcional (IBITA 1996, Panturin 2001, Brock et al. 2002, Raine 2006)."},{"tipo":"figura","pagina":4,"pie":"Berta y Karel Bobath, creadores del concepto en Londres en los años 1940. Recuerda el reparto de papeles: ella fisioterapeuta, él neurofisiólogo.","src":"img/fisioterapia-neurologica-t9-fundamentos-basicos-del-concepto-bobath-p4.jpg"},{"tipo":"tabla","titulo":"Los creadores del Concepto Bobath","columnas":["Persona","Profesión","Datos que pide el temario"],"filas":[["**Berta Bobath**","Fisioterapeuta","1907, Berlín – 1991; estudió fisioterapia en Berlín; mucha experiencia con **PCI**"],["**Karel Bobath**","Neurofisiólogo","1906, Berlín – 1991; aportó la base neurofisiológica del método"],["Lugar y fecha","—","**Londres, años 1940**"]]},{"tipo":"parrafo","texto":"La rehabilitación neurológica convencional de la época tenía un carácter **fundamentalmente ortopédico**: se basaba en la **compensación de la discapacidad** y en el uso de **órtesis**. Los Bobath observaron en su práctica clínica cambios que mostraban que **la modificación del SNC era posible**, y propusieron un método **abierto y flexible**, alejado de la estandarización de técnicas, basado en la comprensión del sistema nervioso y la **plasticidad cerebral** para mejorar el control postural y el movimiento funcional."},{"tipo":"dato","valor":"1943–1944","texto":"Primeros pacientes tratados: personas con **hemiparesia y dolor de hombro**. De ahí surge el tratamiento de los **patrones anormales de postura y movimiento**, primero aplicado a niños con **PCI** y después extendido a niños con hemiparesia."},{"tipo":"parrafo","texto":"**Niños y adultos**: los principios de tratamiento son **los mismos**. Las diferencias están en el abordaje: el adulto puede interactuar con **más motivación y atención**, y sobre todo **tiene memoria de movimientos normales** (sabe cómo hacer las cosas), mientras que el niño con lesión congénita **no tiene esa experiencia**: nace con la lesión."},{"tipo":"figura","pagina":13,"pie":"Evolución del método: de proporcionar una base de tono postural más normalizada como preparación del movimiento a un concepto funcional basado en actividades con propósito o significado.","src":"img/fisioterapia-neurologica-t9-fundamentos-basicos-del-concepto-bobath-p13.jpg"},{"tipo":"tarjetas","items":[{"etiqueta":"Antes","titulo":"Bobath clásico","texto":"Proporcionar al paciente una **base más normalizada de tono postural** como **preparador del movimiento normal** (inhibir primero, mover después)."},{"etiqueta":"Ahora","titulo":"Concepto funcional","texto":"Necesidad de que la persona **participe en actividades con un propósito o significado**; se apoya en control motor, aprendizaje motor, plasticidad neuronal y muscular, biomecánica, experiencia clínica y **expectativas del paciente**."}]},{"tipo":"alerta","texto":"Trampa: Bobath **no** nació como método compensador ni ortopédico; fue justamente la **ruptura** con la RHB de su época, que se basaba en compensar la discapacidad y en órtesis. Tampoco es un protocolo estandarizado: es **abierto y flexible**."}]},{"id":"bases-indicaciones","titulo":"En qué se basa e indicaciones","bloques":[{"tipo":"parrafo","texto":"La base clásica es **inhibir el tono anormal** mediante posturas que lo disminuyen y **facilitar las reacciones automáticas** deseadas. Dicho de otro modo: **inhibición de actividades reactivas anormales** presentes en pacientes con lesiones del SNC y **reaprendizaje de movimientos normales** mediante la movilización y facilitación desde los **puntos clave**."},{"tipo":"definicion","termino":"Puntos clave","texto":"Zonas corporales desde donde es **más eficaz la facilitación** de la actividad normalizada. Su **alineación** (postural set) es además uno de los factores que influyen en el tono postural."},{"tipo":"tabla","titulo":"Patologías en las que se utiliza el Concepto Bobath","columnas":["Indicación","Matiz del temario"],"filas":[["**Hemiplejia / ACV**","Parálisis o debilidad de un hemicuerpo; busca restaurar el movimiento y mejorar el control postural"],["**PCI**","Problemas de control motor; mejora la calidad del movimiento y la participación en actividades funcionales"],["**TCE y Esclerosis Múltiple**","Afectan al control motor y al tono; mejora la movilidad y la función"],["**Lesión medular incompleta** y espina bífida","Mejores resultados que la terapia tradicional usada en la lesión medular completa"],["**Guillain-Barré** y polineuropatías","Indicación aunque sean lesiones periféricas"],["Problemas de **ortopedia y traumatología**","Los principios de movimiento normal también se aplican"]]},{"tipo":"alerta","texto":"Aunque la definición de la IBITA habla de lesión del **SNC**, la lista de usos del temario incluye también **Guillain-Barré, polineuropatías** y problemas de **ortopedia/traumatología**. Las indicaciones «comunes» que destaca son **ACV, PCI, TCE y EM**."},{"tipo":"perla","texto":"En una lesión medular **incompleta** el enfoque Bobath tiene sentido porque quedan vías que facilitar y reorganizar; el temario señala **mejores resultados** que con la terapia tradicional empleada en la lesión medular completa."}]},{"id":"caracteristicas-generales","titulo":"Características generales y objetivos del tratamiento","bloques":[{"tipo":"parrafo","texto":"Mediante la **observación y la valoración** se conocen las afecciones neurológicas del paciente (**función, movimiento y tono**) para marcar objetivos y planificar el tratamiento. Además de los problemas motores, se tienen en cuenta las **capacidades cognitivas, perceptivas y adaptativas**, porque el tratamiento busca mejorar el movimiento y la función **a través de la participación activa del paciente**."},{"tipo":"parrafo","texto":"La mejor inhibición de los patrones anormales de movimiento se consigue **enfocando el tratamiento hacia las actividades de la vida diaria**. Por eso el tratamiento se **adapta a cada paciente** —aunque el diagnóstico sea el mismo— y es **flexible** para ir evolucionando según mejora. No hay que dar **falsas expectativas** de recuperación. El tono postural se relaciona con la **sensibilidad**: una variación de la sensibilidad (propioceptores) afecta al tono postural."},{"tipo":"definicion","termino":"Facilitación","texto":"**Hacer más fácil una función selectiva.** Se realiza sobre todo **con las manos desde los puntos clave de control** y se **va retirando** conforme el paciente se recupera. «El tratamiento es un **proceso interactivo** (no ejercicios preestablecidos) entre terapeutas y pacientes en que la facilitación lleva a una mejor función selectiva» (IBITA, 1995)."},{"tipo":"definicion","termino":"Función","texto":"Interacción, **dirigida a un objetivo y coordinada en tiempo y espacio**, de patrones de movimiento de distintas partes del cuerpo."},{"tipo":"parrafo","texto":"**Objetivo del tratamiento Bobath**: optimizar todas las funciones mejorando el **control postural** y los **movimientos selectivos** mediante su **facilitación**, siempre orientado a las **AVD**. Formulado de forma clásica: **inhibir patrones patológicos** de actividad refleja anormal **facilitando patrones más normales** a través de la **normalización del tono postural**, como preparación para una mayor variedad de habilidades funcionales."},{"tipo":"lista","items":["**Interrelación facilitación ↔ inhibición**: no son fases separadas, se dan a la vez.","Conseguir actividad en **ambos hemicuerpos** para que el paciente **no desarrolle compensaciones**.","La **calidad** del trabajo es básica.","Terapia **desde la fase inicial**, para evitar que los patrones de movimiento se vuelvan patológicos.","**Manejo del paciente las 24 horas**: familiares y profesionales envían la **misma información al SN**."]},{"tipo":"esquema","titulo":"Enfoque global del tratamiento Bobath","mermaid":"flowchart LR\n  A[\"Análisis del movimiento normal\"] --> B[\"Análisis de la desviación\"]\n  B --> C[\"Técnicas adaptadas al paciente\"]\n  C --> D[\"Reaprendizaje del movimiento normal\"]\n  D --> E[\"Análisis del efecto de las técnicas\"]\n  E -->|\"el paciente evoluciona\"| C","pie":"Ciclo de razonamiento clínico: «Bobath es el análisis de la normalidad y el tratamiento de la desviación de la misma» (Jenny Bryce)."},{"tipo":"alerta","texto":"Confusión típica: la facilitación **no** se mantiene igual durante todo el tratamiento ni se aumenta; **se retira progresivamente** a medida que el paciente recupera. Y **no** se trabaja solo el hemicuerpo afecto: se busca actividad en **ambos** para evitar compensaciones."},{"tipo":"perla","texto":"El manejo 24 h implica educar a la familia y al resto del equipo (enfermería, TO) en cómo colocar, movilizar y ayudar al paciente: si cada uno lo hace distinto, el SNC recibe información contradictoria y se refuerzan patrones anormales."}]},{"id":"tono-postural","titulo":"Tono postural (TP)","bloques":[{"tipo":"parrafo","texto":"Los Bobath utilizan el término **tono postural** en lugar de tono muscular, porque enfatiza que para mantener una postura, hacer movimientos de transición y desarrollar actividades **el SNC debe activar los músculos en patrones**, no de forma aislada. En la normalidad el TP es **variable** y proporciona tanto **estabilidad** como **movimiento**."},{"tipo":"dato","valor":"Alto ↔ bajo","texto":"TP normal según Berta Bobath: **suficientemente alto para actuar contra la gravedad** y **suficientemente bajo para permitir el movimiento**. Tono alto → estabilidad; tono bajo → movimientos selectivos."},{"tipo":"parrafo","texto":"Regla fundamental: **cuanto más alto es el tono, menos selectivos son los movimientos**. Por eso el paciente hipertónico se mueve en patrones globales y le cuesta aislar segmentos."},{"tipo":"tabla","titulo":"Factores que influyen en el tono postural","columnas":["Factor","Cómo influye"],"filas":[["Alineación de los **puntos clave** (postural set)","Una alineación correcta permite un tono más adaptado"],["**Anchura** de la base de apoyo","**A menor base de apoyo, mayor elevación del tono**"],["**Estabilidad o movilidad** de la base","**A menor estabilidad de la base, mayor tono**"],["Posición respecto a la **gravedad**","Modifica la demanda antigravitatoria"],["**Velocidad** del movimiento","Cada movimiento tiene su **velocidad económica**: tenerla en cuenta"],["Aspectos **psicológicos**","Bienestar / malestar modifican el tono"],["**Dolor**","**Aumenta el tono**: evitarlo siempre"]]},{"tipo":"parrafo","texto":"También influye la **imagen que la persona tiene del movimiento** (conocido, fácil, difícil): en el ACV, un movimiento percibido como difícil eleva el tono. Por eso en terapia se buscan **movimientos que la persona conozca**: el acceso a los patrones guardados en la memoria es mucho más fácil."},{"tipo":"perla","texto":"Para bajar el tono de un paciente espástico antes de una tarea: amplía y estabiliza la base de apoyo (p. ej. sedestación con buen apoyo en lugar de bipedestación sobre superficie inestable), elimina el dolor, trabaja a una velocidad económica y elige una actividad conocida y significativa."},{"tipo":"alerta","texto":"Cuidado con la dirección de las relaciones: **menor** base y **menor** estabilidad → **más** tono (no menos). Y el dolor **sube** el tono."}]},{"id":"mecanismo-control-postural","titulo":"Mecanismo de control postural (MCP) e inervación recíproca","bloques":[{"tipo":"definicion","termino":"Mecanismo de Control Postural (MCP)","texto":"Procesos **internos y externos** que tienen lugar en la consecución de un movimiento o una postura. Debe existir para conseguir la **adecuada y constante adaptación del tono postural** y obtener movimientos variados. Se desarrolla con la **maduración del SNC** como respuesta adaptativa a la interacción con el entorno."},{"tipo":"tarjetas","items":[{"etiqueta":"Regula 1","titulo":"Tono postural normal","texto":"Base sobre la que se construye todo lo demás."},{"etiqueta":"Regula 2","titulo":"Inervación recíproca normal","texto":"Control consecutivo de **agonistas, antagonistas y sinergistas** para la coordinación espacial y temporal del movimiento."},{"etiqueta":"Regula 3","titulo":"Coordinación normal del movimiento","texto":"Coordinación **temporal y espacial de movimientos selectivos** para formar un patrón de movimiento."}]},{"tipo":"definicion","termino":"Inervación recíproca normal","texto":"**Modulación de la inhibición y la excitación del SNC** que lleva a la coordinación normal del movimiento. Requiere: **fijación sinérgica proximal** (estabilidad) que permite la **movilidad distal**; **ajuste automático** de los músculos a los cambios posturales; y **control graduado** de agonistas y antagonistas."},{"tipo":"tabla","titulo":"Inervación recíproca anormal","columnas":["Desequilibrio","Resultado clínico","Características"],"filas":[["**↑ estabilidad + movimiento insuficiente**","**Espasticidad o hipertonía**","Se mueven en **patrones totales**"],["**↑ movilidad + estabilidad insuficiente**","**Ataxia y atetosis**","No tiene los puntos clave de estabilidad; **tono menor de lo normal**"]]},{"tipo":"figura","pagina":29,"pie":"Componentes del MCP: sensibilidad, tono postural, inervación recíproca y coordinación; si se combinan adecuadamente permiten el desarrollo eficaz de la postura o del movimiento.","src":"img/fisioterapia-neurologica-t9-fundamentos-basicos-del-concepto-bobath-p29.jpg"},{"tipo":"esquema","titulo":"Cascada de la alteración del MCP tras una lesión del SNC","mermaid":"flowchart TD\n  L[\"Lesión del SNC\"] --> A[\"Alteración de un componente\"]\n  subgraph M[\"MCP\"]\n    S1[\"Sensibilidad\"]\n    S2[\"Tono postural\"]\n    S3[\"Inervación recíproca\"]\n    S4[\"Coordinación\"]\n  end\n  A --> M\n  M --> T[\"Alteración de todo el mecanismo\"]\n  T --> T1[\"Tono anormal sin control frente a la gravedad\"]\n  T --> T2[\"Inervación recíproca anormal\"]\n  T1 --> P[\"Patrones anormales y estereotipados\"]\n  T2 --> P\n  P -->|\"mantenidos en mala alineación\"| N[\"El SNC los identifica como normales\"]","pie":"La alteración de un solo componente altera todo el MCP; de forma primaria o secundaria, todo paciente con lesión del SNC tiene alterado su MCP."},{"tipo":"figura","pagina":31,"pie":"Consecuencia clave: la presencia prolongada de patrones anormales dentro de una alineación corporal incorrecta puede hacer que el SNC los identifique como normales.","src":"img/fisioterapia-neurologica-t9-fundamentos-basicos-del-concepto-bobath-p31.jpg"},{"tipo":"esquema","titulo":"Orden de tratamiento del MCPN","mermaid":"flowchart LR\n  E[\"Evaluación\"] --> T[\"1. Normalizar el tono postural\"]\n  T --> I[\"2. Mejorar la inervación recíproca\"]\n  I --> C[\"3. Coordinación normal del movimiento\"]","pie":"Tras la evaluación, el primer paso es normalizar el tono; con un tono lo más normal posible mejora la inervación recíproca y, al mejorar ambas, la coordinación."},{"tipo":"alerta","texto":"Trampa: la espasticidad corresponde a **exceso de estabilidad** con movimiento insuficiente, y la ataxia/atetosis a **exceso de movilidad** con estabilidad insuficiente (y tono **bajo**). Es fácil invertirlas."},{"tipo":"perla","texto":"En un paciente atáxico no se busca «relajar»: falta estabilidad proximal. Se trabaja la **fijación sinérgica proximal** (carga, apoyo, cocontracción) para que la movilidad distal pueda ser controlada."}]},{"id":"neuroplasticidad-aprendizaje","titulo":"Neuroplasticidad y aprendizaje motor","bloques":[{"tipo":"parrafo","texto":"Las **experiencias sensoriomotoras anormales** producen una **conciencia y una imagen corporal anormales**. Además, según la **regla de desviación de Magnus**, el SNC refleja fielmente el estado de la musculatura en cada momento de una postura o movimiento. Por tanto, el tratamiento debe encaminarse, gracias a la **neuroplasticidad**, a **organizar/reorganizar el MCP** deteriorado por la lesión."},{"tipo":"definicion","termino":"Regla de desviación de Magnus","texto":"El **SNC refleja fielmente el estado de la musculatura** en cada momento de una postura o de un movimiento."},{"tipo":"lista","items":["**Estímulos específicos**.","**Repetición de los componentes clave** de los distintos patrones de postura y movimiento.","Siempre en la realización de **actividades funcionales**."]},{"tipo":"parrafo","texto":"Esas son las tres vías por las que el fisioterapeuta, **desde el exterior**, puede influir en la reorganización del SNC. El **aprendizaje motor** se apoya en ellas: al moverse, el SNC recibe información sobre el cambio de estado de sus receptores y modifica el movimiento según las sensaciones (**feedback**, retroalimentación). La repetición y el registro permiten desarrollar la **anticipación** (**feedforward**)."},{"tipo":"esquema","titulo":"Del feedback al feedforward","mermaid":"flowchart LR\n  M[\"Movimiento activo del paciente\"] --> R[\"Cambio de estado de los receptores\"]\n  R --> FB[\"Feedback: corrección según sensaciones\"]\n  FB --> REP[\"Repetición y registro\"]\n  REP --> FF[\"Feedforward: anticipación\"]\n  FF -->|\"aprendizaje motor\"| M","pie":"El aprendizaje tiene lugar cuando se avanza del feedback al feedforward: factor fundamental en las intervenciones terapéuticas."},{"tipo":"tabla","titulo":"Autores citados sobre aprendizaje motor","columnas":["Autor","Idea","Consecuencia para Bobath"],"filas":[["**Bobath**","Los **movimientos activos iniciados por el paciente** para solucionar sus problemas son esenciales para el aprendizaje motor y para cambios permanentes","Participación activa"],["**Horak**","Los procesos neurales se organizan en función de **metas funcionales y conductuales**, no de patrones sensoriomotores predeterminados","Trabajar con tareas con objetivo"],["**Jenny Bryce**","«Bobath es el análisis de la normalidad y el tratamiento de la desviación de la misma»","Razonamiento clínico"]]},{"tipo":"alerta","texto":"No confundir: el aprendizaje se produce al pasar **del feedback al feedforward** (no al revés). Y Horak dice que el SNC se organiza por **metas funcionales**, no por patrones predeterminados."}]},{"id":"movimiento-normal","titulo":"Movimiento normal y disfunción del movimiento","bloques":[{"tipo":"definicion","termino":"Movimiento normal","texto":"**Respuesta del mecanismo de control postural central** a un **pensamiento** o a un **estímulo sensitivo-motor intrínseco o extrínseco**. Puede ser **automático, voluntario o automatizado**."},{"tipo":"tabla","titulo":"Tipos de movimiento normal","columnas":["Tipo","Origen","Ejemplos"],"filas":[["**Automático**","Nunca aprendido; **programado genéticamente**; movimientos para la **supervivencia**","Deglución, movimiento palpebral, respiración, tos, **locomoción**"],["**Voluntario**","Se aprende voluntariamente y se repite hasta que se automatiza; al aprender una tarea nueva aparecen **movimientos asociados normales** que disminuyen con la práctica","Cualquier tarea nueva"],["**Automatizado**","**Aprendido** y grabado en el SNC; se realiza como si fuera automático","Pedalear, conducir, escribir"]]},{"tipo":"alerta","texto":"Trampa clásica: **pedalear o conducir** no son automáticos sino **automatizados** (aprendidos). La **locomoción** sí aparece en el temario como movimiento **automático** (programado genéticamente)."},{"tipo":"parrafo","texto":"En Bobath se estudian los **patrones de movimiento normal** que subyacen a las actividades funcionales. En el paciente neurológico, la referencia a lo «normal» expresa **cómo alcanzar la forma más óptima** de movimiento para lograr la función **con el menor esfuerzo y de la manera más eficiente**. Su aprendizaje y los requisitos para el control son la **guía de referencia** para planificar el tratamiento."},{"tipo":"esquema","titulo":"Origen de la disfunción del movimiento","mermaid":"flowchart TD\n  A[\"Daño neuronal\"] --> D[\"Disfunción del movimiento\"]\n  B[\"Cambios musculoesqueléticos\"] --> D\n  C[\"Estrategias de movimiento aprendidas\"] --> D\n  D --> E[\"Dificultad o imposibilidad para iniciar y controlar postura y movimiento\"]","pie":"La combinación de los tres factores varía según el tipo y el tiempo de evolución de cada lesión."},{"tipo":"dato","valor":"3 factores","texto":"La disfunción del movimiento resulta de **daño neuronal + cambios musculoesqueléticos + estrategias de movimiento aprendidas**, variables según tipo y tiempo de evolución de la lesión."},{"tipo":"perla","texto":"En un paciente crónico, las **estrategias aprendidas** (compensaciones) y los **cambios musculoesqueléticos** (acortamientos) pesan tanto como el daño neuronal: la valoración debe separarlos para decidir qué tratar primero."}]}],"caso_clinico":{"titulo":"Hemiparesia izquierda tras ACV","presentacion":"Mujer de 64 años, 3 semanas después de un ACV isquémico derecho. Presenta hemiparesia izquierda con hipertonía en flexión del miembro superior, dolor de hombro izquierdo y tendencia a cargar todo el peso sobre el lado derecho en sedestación. En bipedestación con base estrecha el tono del brazo aumenta claramente. Su hija la ayuda a levantarse tirando del brazo afecto.","preguntas":[{"pregunta":"¿Por qué aumenta el tono del brazo en bipedestación con base estrecha y qué modificarías?","respuesta":"Porque **a menor base de apoyo y menor estabilidad de la base, mayor tono**. Además el dolor de hombro eleva el tono. Comenzaría en una posición con base amplia y estable, con buena alineación de los puntos clave y sin dolor, y progresaría la dificultad."},{"pregunta":"¿Qué problema plantea la forma en que la hija la levanta y cómo lo abordarías?","respuesta":"Rompe el **manejo de 24 horas**: tirar del brazo provoca dolor (que sube el tono) y envía al SNC información distinta a la del tratamiento. Hay que educar a la familia para que todos den la **misma información al SN** y faciliten desde puntos clave."},{"pregunta":"¿Por qué es importante intervenir ya y conseguir actividad en ambos hemicuerpos?","respuesta":"Porque la terapia **desde la fase inicial** evita que los patrones se vuelvan patológicos: mantenidos en mala alineación, el SNC los **identifica como normales**. Trabajar ambos hemicuerpos evita que desarrolle **compensaciones** con el lado sano."}]},"preguntate":[{"pregunta":"Define el Concepto Bobath según la IBITA.","respuesta":"Forma de resolución de problemas para la evaluación y tratamiento de personas con trastorno de la función, el movimiento y el control postural por lesión del SNC, aplicable a todas las edades y grados de afectación."},{"pregunta":"¿Qué aportó el Concepto Bobath frente a la rehabilitación de su época?","respuesta":"Frente a una RHB ortopédica basada en compensar y en órtesis, demostró que el SNC podía modificarse y propuso un método abierto y flexible basado en la plasticidad."},{"pregunta":"¿Cómo ha evolucionado el concepto?","respuesta":"De proporcionar una base de tono postural más normalizada como preparación del movimiento normal a un concepto funcional basado en la participación en actividades con propósito o significado."},{"pregunta":"¿Por qué Bobath habla de tono postural y no de tono muscular?","respuesta":"Porque para mantener posturas, hacer transiciones y actividades el SNC activa los músculos en patrones, no aisladamente."},{"pregunta":"Enumera los factores que modifican el tono postural.","respuesta":"Alineación de puntos clave, área y base de sustentación (anchura y estabilidad), posición respecto a la gravedad, velocidad del movimiento, factores psicológicos y dolor."},{"pregunta":"¿Qué componentes implica el MCP y qué ocurre si uno se altera?","respuesta":"Sensibilidad, tono postural, inervación recíproca y coordinación; la alteración de uno altera todo el mecanismo."},{"pregunta":"¿Qué requisitos tiene la inervación recíproca normal?","respuesta":"Fijación sinérgica proximal que permite la movilidad distal, ajuste automático de los músculos a los cambios posturales y control graduado de agonistas y antagonistas."},{"pregunta":"¿Qué enuncia la regla de desviación de Magnus y qué implica?","respuesta":"Que el SNC refleja fielmente el estado de la musculatura en cada momento; implica que posturas y movimientos anormales mantenidos se graban en el SNC."},{"pregunta":"¿Cuándo se produce el aprendizaje motor?","respuesta":"Cuando se avanza del feedback (corrección según sensaciones) al feedforward (anticipación) gracias a la repetición y el registro."},{"pregunta":"Diferencia movimiento automático y automatizado con un ejemplo de cada uno.","respuesta":"Automático: programado genéticamente, nunca aprendido (deglución, tos). Automatizado: aprendido y grabado en el SNC, realizado como automático (conducir, escribir)."}],"glosario":[{"termino":"IBITA","definicion":"International Bobath Instructors Training Association; define oficialmente el concepto."},{"termino":"Facilitación","definicion":"Hacer más fácil una función selectiva, sobre todo con las manos desde los puntos clave."},{"termino":"Puntos clave","definicion":"Zonas corporales desde donde es más eficaz facilitar la actividad normalizada."},{"termino":"Postural set","definicion":"Alineación de los puntos clave entre sí; influye en el tono postural."},{"termino":"Tono postural","definicion":"Estado de activación muscular en patrones que permite a la vez estabilidad antigravitatoria y movimiento."},{"termino":"MCP","definicion":"Mecanismo de control postural: procesos internos y externos para conseguir una postura o movimiento con adaptación constante del tono."},{"termino":"Inervación recíproca","definicion":"Modulación de excitación e inhibición del SNC que coordina agonistas, antagonistas y sinergistas."},{"termino":"Feedback","definicion":"Retroalimentación: modificación del movimiento según las sensaciones recibidas."},{"termino":"Feedforward","definicion":"Anticipación del movimiento desarrollada por repetición y registro."},{"termino":"Regla de Magnus","definicion":"El SNC refleja fielmente el estado de la musculatura en cada momento."},{"termino":"Movimiento automatizado","definicion":"Movimiento aprendido y grabado en el SNC que se ejecuta como si fuera automático."},{"termino":"Manejo 24 horas","definicion":"Coherencia de todas las personas que manejan al paciente para enviar la misma información al SN."}],"fuentes":["IBITA 1995, 1996","Panturin 2001","Brock et al. 2002","Raine 2006","Horak (aprendizaje motor)","Jenny Bryce","Tema 09: Fundamentos básicos de Bobath — Universidad Europea"],"qcm":[{"pregunta":"Según la definición de la IBITA, el Concepto Bobath se caracteriza esencialmente como:","opciones":["Una técnica de inhibición refleja aplicada solo en la infancia","Un protocolo de ejercicios estandarizado para lesiones del SNC","Una forma de resolución de problemas para evaluar y tratar","Un sistema de compensación funcional mediante órtesis"],"correcta":2,"explicacion":"La IBITA lo define como una forma de resolución de problemas para la evaluación y el tratamiento de personas con trastornos de la función, el movimiento y el control postural por lesión del SNC, aplicable a todas las edades.","por_opcion":["❌ Se aplica a todas las edades y grados de afectación.","❌ Es justo lo contrario: método abierto y flexible, alejado de la estandarización.","✅ Definición literal de la IBITA.","❌ La compensación con órtesis era la RHB de la época contra la que surgió."]},{"pregunta":"Respecto a los creadores del concepto, ¿qué afirmación es correcta?","opciones":["Ambos eran neurólogos y lo desarrollaron en Berlín","Berta era terapeuta ocupacional y Karel neurocirujano","Karel era fisioterapeuta y Berta neurofisióloga, en Viena","Berta era fisioterapeuta y Karel neurofisiólogo, en Londres"],"correcta":3,"explicacion":"Se desarrolló en Londres en los años 1940 por Berta Bobath, fisioterapeuta con mucha experiencia en PCI, y Karel Bobath, neurofisiólogo; ambos nacidos en Berlín.","por_opcion":["❌ Nacieron en Berlín, pero el concepto se desarrolló en Londres y no eran neurólogos.","❌ Profesiones inventadas.","❌ Los papeles están invertidos y la ciudad es errónea.","✅ Reparto correcto de profesiones y lugar."]},{"pregunta":"Un paciente pasa de sedestación con apoyo amplio a bipedestación sobre una colchoneta blanda con pies juntos. Según Bobath, lo esperable es:","opciones":["Tono sin cambios si la alineación es correcta","Aumento de la selectividad de los movimientos distales","Descenso del tono por mayor libertad de movimiento","Aumento del tono por menor base y menor estabilidad"],"correcta":3,"explicacion":"A menor base de apoyo, mayor elevación del tono, y a menor estabilidad de la base, mayor tono. Más tono implica además movimientos menos selectivos.","por_opcion":["❌ La alineación es solo uno de varios factores; base y estabilidad también influyen.","❌ Con más tono los movimientos son menos selectivos.","❌ La relación es inversa: menos base y estabilidad suben el tono.","✅ Se combinan dos factores que elevan el tono."]},{"pregunta":"¿Qué patrón de inervación recíproca anormal corresponde a un paciente con ataxia?","opciones":["Aumento de estabilidad con movimiento insuficiente","Patrones totales con hipertonía antigravitatoria","Exceso de fijación proximal con tono elevado","Aumento de movilidad con estabilidad insuficiente"],"correcta":3,"explicacion":"El aumento de movilidad con estabilidad insuficiente produce ataxia y atetosis: no hay puntos clave de estabilidad y el tono es menor de lo normal.","por_opcion":["❌ Corresponde a espasticidad o hipertonía.","❌ Los patrones totales son propios de la espasticidad.","❌ Describe un cuadro hipertónico, no atáxico.","✅ Ataxia y atetosis."]},{"pregunta":"Tras la evaluación, ¿cuál es el primer paso del tratamiento según el esquema de mecanismos de control postural normal?","opciones":["Mejorar la inervación recíproca agonista-antagonista","Automatizar las actividades de la vida diaria","Entrenar la coordinación de patrones complejos","Normalizar el tono postural"],"correcta":3,"explicacion":"El primer paso tras la evaluación es normalizar el tono; con un tono lo más normal posible mejora la inervación recíproca y, al mejorar ambas, la coordinación.","por_opcion":["❌ Es el segundo paso, una vez normalizado el tono.","❌ Las AVD orientan el tratamiento, pero no son el primer paso del MCPN.","❌ La coordinación es la consecuencia final.","✅ Orden: tono → inervación recíproca → coordinación."]},{"pregunta":"La regla de desviación de Magnus establece que:","opciones":["La hipertonía siempre se desvía hacia la flexión","Las reacciones automáticas inhiben los reflejos tónicos","El SNC refleja fielmente el estado de la musculatura","El tono postural disminuye con la velocidad del gesto"],"correcta":2,"explicacion":"Según la regla de desviación de Magnus, el SNC refleja fielmente el estado de la musculatura en cada momento de una postura o un movimiento; de ahí la importancia de la alineación y de evitar patrones anormales mantenidos.","por_opcion":["❌ No habla de la dirección de la hipertonía.","❌ No es el contenido de la regla de Magnus.","✅ Enunciado del temario.","❌ La velocidad influye en el tono, pero no es esta regla."]},{"pregunta":"¿Cuál de los siguientes es un movimiento automatizado y no automático?","opciones":["Deglución","Escritura","Tos","Locomoción"],"correcta":1,"explicacion":"Los automatizados son aprendidos y grabados en el SNC y se ejecutan como si fueran automáticos (pedalear, conducir, escribir). Deglución, tos y locomoción son automáticos, programados genéticamente.","por_opcion":["❌ Automático, programado genéticamente.","✅ Aprendida y luego automatizada.","❌ Automático, para la supervivencia.","❌ El temario la clasifica como automática."]},{"pregunta":"Según el temario, el aprendizaje motor tiene lugar cuando:","opciones":["Se eliminan los movimientos asociados del inicio","Se pasa del feedforward al feedback consciente","Se sustituye la facilitación por resistencia manual","Se avanza del feedback al feedforward"],"correcta":3,"explicacion":"El SNC corrige el movimiento según las sensaciones (feedback); la repetición y el registro desarrollan la anticipación (feedforward). El aprendizaje ocurre al pasar del primero al segundo.","por_opcion":["❌ Los movimientos asociados disminuyen con la práctica, pero no definen el aprendizaje.","❌ Dirección invertida.","❌ No es lo que define el aprendizaje.","✅ Del feedback al feedforward."]},{"pregunta":"La afirmación «los procesos neurales se organizan en función de metas funcionales y conductuales en vez de patrones sensoriomotores predeterminados» se atribuye a:","opciones":["Horak","Jenny Bryce","Karel Bobath","Magnus"],"correcta":0,"explicacion":"Es la aportación de Horak recogida en el apartado de aprendizaje motor; refuerza el énfasis Bobath en la participación activa en el entorno.","por_opcion":["✅ Horak.","❌ Bryce: análisis de la normalidad y tratamiento de la desviación.","❌ Bobath: movimientos activos iniciados por el paciente.","❌ Magnus: el SNC refleja el estado de la musculatura."]},{"pregunta":"Sobre la facilitación en el Concepto Bobath, es correcto que:","opciones":["Se aplica sobre todo con las manos desde puntos clave","Se incrementa a medida que el paciente progresa","Se reserva para la fase crónica de la lesión","Sustituye a la participación activa del paciente"],"correcta":0,"explicacion":"La facilitación hace más fácil una función selectiva; se realiza sobre todo tocando con las manos desde los puntos clave de control y se va retirando conforme el paciente se recupera.","por_opcion":["✅ Manos y puntos clave.","❌ Se va retirando, no aumentando.","❌ La terapia empieza desde la fase inicial.","❌ El concepto exige participación activa."]},{"pregunta":"Entre las indicaciones del Concepto Bobath, el temario destaca que en la lesión medular:","opciones":["Obtiene mejores resultados en la lesión incompleta","Solo está indicado en la lesión medular completa","Está contraindicado por tratarse de vía periférica","Se limita a pacientes pediátricos con espina bífida"],"correcta":0,"explicacion":"Se utiliza en la lesión medular incompleta, con mejores resultados que la terapia tradicional usada en la lesión medular completa, así como en espina bífida.","por_opcion":["✅ Mejores resultados en lesión incompleta.","❌ Lo destacado es la lesión incompleta.","❌ La médula es SNC y está indicado.","❌ La espina bífida es una indicación más, no la única."]},{"pregunta":"Para que existan patrones de postura y movimiento bien coordinados, la fijación sinérgica proximal:","opciones":["Debe inhibirse para liberar la movilidad del tronco","Equivale al control graduado agonista-antagonista","Aporta estabilidad que permite la movilidad distal","Solo interviene en los movimientos automáticos"],"correcta":2,"explicacion":"La inervación recíproca normal requiere fijación sinérgica proximal (estabilidad) que permite la movilidad distal, ajuste automático a los cambios posturales y control graduado de agonistas y antagonistas.","por_opcion":["❌ Su ausencia produce ataxia, no se busca inhibirla.","❌ Es otro requisito distinto de la misma lista.","✅ Estabilidad proximal → movilidad distal.","❌ Interviene en todo patrón coordinado."]},{"pregunta":"Un adulto con hemiplejia y un niño con PCI se tratan con Bobath. Según el temario:","opciones":["Los principios son iguales; el adulto tiene memoria de movimiento","Los principios difieren porque el niño no tiene tono postural","En el adulto se prioriza la compensación con órtesis","El niño colabora más porque su SNC es más plástico"],"correcta":0,"explicacion":"Los principios de tratamiento son los mismos para niños y adultos; difiere el abordaje porque el adulto interactúa con más motivación y atención y tiene memoria de movimientos normales, mientras el niño nace con la lesión.","por_opcion":["✅ Diferencia clave: memoria de movimiento normal.","❌ Los principios son iguales.","❌ Bobath se opone al enfoque compensador.","❌ Es el adulto quien interactúa con más motivación y atención."]},{"pregunta":"¿Por qué el Concepto Bobath insiste en tratar desde la fase inicial?","opciones":["Porque la plasticidad solo existe en las primeras semanas","Porque el SNC puede identificar patrones anormales como normales","Porque en fase crónica la facilitación está contraindicada","Porque la espasticidad desaparece sola tras tres meses"],"correcta":1,"explicacion":"La presencia prolongada de patrones anormales dentro de una alineación incorrecta puede hacer que el SNC los identifique como normales; la terapia precoz evita que los patrones se vuelvan patológicos.","por_opcion":["❌ El temario no limita la plasticidad a unas semanas.","✅ Riesgo de normalizar patrones anormales.","❌ No existe tal contraindicación en el temario.","❌ Afirmación no recogida y falsa."]},{"pregunta":"Según el temario, la disfunción del movimiento resulta de la combinación de:","opciones":["Espasticidad, dolor y déficit cognitivo","Daño neuronal, cambios musculoesqueléticos y estrategias aprendidas","Lesión periférica, inmovilización y edad","Hipotonía, ataxia y alteraciones perceptivas"],"correcta":1,"explicacion":"La disfunción del movimiento resulta de la disfunción neurológica ocasionada por daño neuronal, cambios musculoesqueléticos y estrategias de movimiento aprendidas, que varían según el tipo y el tiempo de evolución.","por_opcion":["❌ Son posibles consecuencias, no los tres factores.","✅ Los tres factores del temario.","❌ No es la tríada del temario.","❌ Describe manifestaciones, no las causas."]}],"asignatura":"Fisioterapia neurológica","tema":9,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
