<script id="datos" type="application/json">{"titulo":"Tema 9. Fundamentos básicos del Concepto Bobath","subtitulo":"Enfoque de resolución de problemas para evaluar y tratar el trastorno de la función, el movimiento y el control postural tras una lesión del SNC, basado en el tono postural, los puntos clave y la facilitación de movimiento normal funcional.","objetivos":["Al terminar, sabrás definir el Concepto Bobath según la IBITA y situar su origen, autores y evolución desde el tono postural hacia un concepto funcional.","Al terminar, sabrás explicar el tono postural y el mecanismo de control postural (MCP): factores que los modifican, inervación recíproca normal y anormal y orden de abordaje.","Al terminar, sabrás distinguir los puntos clave proximales y distales y sus usos (inhibir, facilitar, estimular).","Al terminar, sabrás diferenciar las técnicas Bobath: TIP, facilitación y estimulación táctil y propioceptiva (placing, holding, tapping, compresión/tracción, transferencia de peso).","Al terminar, sabrás diferenciar reacciones de equilibrio, enderezamiento y apoyo, y reconocer las reacciones asociadas como patológicas."],"ideas_clave":["Bobath es un enfoque de resolución de problemas (evaluación + tratamiento) para el trastorno de función, movimiento y control postural por lesión del SNC, aplicable a todas las edades y grados de afectación (IBITA).","Lo crean en Londres, en los años 40, Berta Bobath (fisioterapeuta) y Karel Bobath (neurofisiólogo), frente a una rehabilitación de carácter ortopédico basada en compensar y usar órtesis.","Se usa el término tono postural: debe ser lo bastante alto para actuar contra la gravedad y lo bastante bajo para permitir el movimiento. Tono alto = estabilidad; tono bajo = movimientos selectivos.","El MCP integra sensibilidad, tono postural, inervación recíproca y coordinación; la alteración de uno altera todo el mecanismo. En el tratamiento se normaliza primero el tono, luego la inervación recíproca y finalmente la coordinación.","Los puntos clave de control (cabeza, cinturas escapulares, PCC esternón, codos, manos, pelvis, rodillas, pies) son las zonas desde las que el fisioterapeuta inhibe, facilita o estimula.","Las técnicas ofrecen experiencias sensoriales: TIP, facilitación (siempre con contacto activo y retirada progresiva) y estimulación táctil y propioceptiva.","El aprendizaje motor ocurre al pasar del feedback al feedforward, con movimientos activos iniciados por el paciente en actividades funcionales con propósito y manejo 24 horas.","Reacciones posturales normales: equilibrio (ajustes mínimos de tono, vestíbulo-espinal, no voluntarias), enderezamiento (contrapesos, cortico-rubro-espinal, voluntarias) y apoyo (última línea de defensa, voluntarias). Las reacciones asociadas son siempre patológicas."],"secciones":[{"id":"concepto-historia","titulo":"Concepto, historia y evolución","bloques":[{"tipo":"definicion","termino":"Concepto Bobath (IBITA)","texto":"Forma de **resolución de problemas** para la **evaluación y el tratamiento** de personas con un trastorno de la **función, el movimiento y el control postural** debido a una **lesión del SNC**. Puede aplicarse a individuos de **todas las edades** y **todos los grados** de desorden físico o funcional (IBITA 1996, Panturin 2001, Brock et al 2002, Raine 2006)."},{"tipo":"tabla","titulo":"Origen del concepto","columnas":["Dato","Contenido"],"filas":[["Lugar y época","Londres, años 1940"],["Berta Bobath","Fisioterapeuta; 1907 (Berlín) – 1991"],["Karel Bobath","Neurofisiólogo; 1906 (Berlín) – 1991; mucha experiencia con PCI; estudió fisioterapia en Berlín"],["1943-1944","Pacientes con hemiparesia y dolor de hombro: tratamiento de los patrones anormales de postura y movimiento"],["Extensión posterior","Concepto de tratamiento para niños con PCI y después niños con hemiparesia"],["Contexto","La RHB neurológica convencional era de carácter fundamentalmente ortopédico, basada en compensación y órtesis"]]},{"tipo":"parrafo","texto":"Los Bobath crearon un método **abierto y flexible**, alejado de la estandarización de técnicas. Observaron en la práctica clínica que la **modificación del SNC era posible**. El enfoque se basa en la comprensión del sistema nervioso y la plasticidad cerebral para mejorar el control postural y el movimiento funcional."},{"tipo":"parrafo","texto":"**¿En qué se basa?** En inhibir el tono anormal mediante posturas que lo disminuyen y facilitar las reacciones automáticas deseadas; es decir, inhibir actividades reactivas anormales y reaprender movimientos normales mediante la movilización y facilitación de los **puntos clave**."},{"tipo":"tarjetas","items":[{"etiqueta":"Inicio","titulo":"Preparar con tono normalizado","texto":"Proporcionar una base más normalizada de tono postural como preparador del movimiento normal."},{"etiqueta":"Actualidad","titulo":"Concepto funcional","texto":"La persona debe participar en actividades con propósito o significado. Se apoya en control motor, aprendizaje motor, plasticidad neuronal del SNC y muscular, biomecánica, experiencia clínica y expectativas del paciente."}]},{"tipo":"tabla","titulo":"Aplicaciones clínicas","columnas":["Patología","Utilidad según el temario"],"filas":[["Hemiplejia / ACV","Parálisis o debilidad de un hemicuerpo: restaurar movimiento y mejorar control postural"],["PCI","Problemas de control motor: mejorar calidad del movimiento y participación funcional"],["TCE y esclerosis múltiple","Alteran control motor y tono: mejorar movilidad y función"],["Lesión medular incompleta y espina bífida","Mejores resultados que con la terapia tradicional usada en lesión medular completa"],["Guillain-Barré y polineuropatías","Incluidas entre sus indicaciones"],["Ortopedia y traumatología","Incluidas entre sus indicaciones"]]},{"tipo":"tabla","titulo":"Niño vs. adulto","columnas":["Aspecto","Niño","Adulto"],"filas":[["Principios de tratamiento","Los mismos","Los mismos"],["Interacción","Menos motivación y atención","Interactúa con más motivación y atención; el abordaje varía"],["Memoria motora","No tiene experiencia: nace con la lesión","Tiene memoria de movimientos normales (sabe cómo hacer las cosas)"]]},{"tipo":"alerta","texto":"No confundas: los **principios** son iguales en niños y adultos; lo que cambia es el **abordaje** (motivación, atención y memoria de movimientos normales). Tampoco es un método de ejercicios estandarizados: es un proceso interactivo (IBITA 1995)."}]},{"id":"caracteristicas-objetivos","titulo":"Características generales y objetivos","bloques":[{"tipo":"lista","items":["La observación y valoración permiten conocer las afecciones neurológicas (función, movimiento y tono) para marcar objetivos y planificar el tratamiento.","Se tienen en cuenta capacidades cognitivas, perceptivas y adaptativas, porque se enfatiza la participación activa del paciente.","La mejor inhibición de patrones anormales se logra orientando el tratamiento a las AVD.","Tratamiento adaptado a cada paciente aunque el diagnóstico sea el mismo, y flexible a medida que mejora.","No dar falsas expectativas de recuperación.","Tono postural relacionado con la sensibilidad (propioceptores).","Terapia desde la fase inicial para evitar que los patrones de movimiento se vuelvan patológicos.","Conseguir actividad en ambos hemicuerpos para que no se desarrollen compensaciones. La calidad del trabajo es básica.","Interrelación facilitación-inhibición."]},{"tipo":"definicion","termino":"Función","texto":"Interacción, dirigida a un objetivo y coordinada en tiempo y espacio, de patrones de movimiento de distintas partes del cuerpo."},{"tipo":"definicion","termino":"Facilitación","texto":"Hacer más fácil una función selectiva. El tratamiento es un **proceso interactivo (no ejercicios preestablecidos)** entre terapeuta y paciente en el que la facilitación lleva a una mejor función selectiva (IBITA, 1995). Se realiza sobre todo con las manos desde los puntos clave y se va **retirando** conforme el paciente se recupera."},{"tipo":"parrafo","texto":"**Objetivo:** optimizar todas las funciones mediante la mejora del control postural y de los movimientos selectivos, facilitándolos y orientándolos siempre a las AVD. Concretamente, inhibir patrones patológicos de actividad refleja anormal y facilitar patrones normales mediante la normalización del tono postural, como preparación para una mayor variedad de habilidades funcionales."},{"tipo":"lista","items":["Análisis del movimiento normal.","Análisis de la desviación del movimiento normal.","Aplicación de técnicas adaptadas a cada paciente para reaprender el movimiento normal.","Análisis del efecto de las técnicas para modificarlas según evoluciona el paciente."]},{"tipo":"perla","texto":"Frase de Jenny Bryce que conviene saber: «Bobath es el análisis de la normalidad y el tratamiento de la desviación de la misma». En la práctica, antes de tratar hay que saber cómo se hace el movimiento normal para detectar dónde se desvía el paciente."}]},{"id":"tono-mcp","titulo":"Tono postural y mecanismo de control postural","bloques":[{"tipo":"definicion","termino":"Tono postural (TP)","texto":"Término usado en Bobath en lugar de tono muscular. En la normalidad es **variable** y proporciona tanto estabilidad como movimiento. Para mantener una postura, realizar transiciones y desarrollar actividades, el SNC debe activar los músculos **en patrones**."},{"tipo":"tabla","titulo":"Tono postural normal (Berta Bobath)","columnas":["Tono","Función","Consecuencia"],"filas":[["Alto","Necesario para dar estabilidad y actuar contra la gravedad","Cuanto más alto, menos selectivos son los movimientos"],["Bajo","Necesario para realizar movimientos selectivos","Debe ser suficientemente bajo para permitir el movimiento"]]},{"tipo":"tabla","titulo":"Factores que influyen en el tono postural","columnas":["Factor","Efecto"],"filas":[["Alineación de puntos clave (postural set)","Determina la postura de base para iniciar el movimiento"],["Área de apoyo y base de sustentación: anchura","A menor base de apoyo, mayor elevación del tono"],["Estabilidad o movilidad de la base","A menor estabilidad de la base, mayor tono"],["Posición respecto a la gravedad","Modifica la calidad del tono"],["Velocidad del movimiento","Cada movimiento tiene su velocidad económica; tenerlo en cuenta en el tratamiento"],["Aspectos psicológicos (bienestar/malestar)","Modulan el tono"],["Dolor","Aumenta el tono (siempre evitar)"]]},{"tipo":"perla","texto":"En la terapia busca movimientos que la persona **conozca**: el acceso a patrones guardados en la memoria es mucho más fácil. Para bajar un tono alto, amplía y estabiliza la base, cuida la alineación, evita el dolor y adapta la velocidad."},{"tipo":"definicion","termino":"Mecanismo de control postural (MCP)","texto":"Procesos internos y externos que tienen lugar en la consecución de un movimiento o una postura, necesarios para la adaptación adecuada y constante del tono postural y obtener movimientos variados. Se desarrolla con la maduración del SNC como respuesta adaptativa a la interacción con el entorno. Implica **sensibilidad, tono postural, inervación recíproca y coordinación**."},{"tipo":"parrafo","texto":"El MCP normal regula el tono postural normal, la **inervación recíproca normal** (control consecutivo de agonistas, antagonistas y sinergistas para la coordinación espacial y temporal) y la **coordinación normal del movimiento** (coordinación temporal y espacial de movimientos selectivos para formar un patrón). Tras una lesión del SNC, de forma primaria o secundaria, **todos los pacientes tienen alterado el MCP**: la alteración de uno de sus componentes altera todo el mecanismo."},{"tipo":"lista","items":["Inervación recíproca normal = modulación de la inhibición y excitación del SNC que lleva a la coordinación normal.","Requiere fijación sinérgica proximal (estabilidad) que permite movilidad distal.","Requiere adaptación/ajuste automático de los músculos a los cambios posturales.","Requiere control graduado de agonistas y antagonistas."]},{"tipo":"tabla","titulo":"Inervación recíproca anormal","columnas":["Alteración","Cuadro","Rasgos"],"filas":[["Exceso de estabilidad + movimiento insuficiente","Espasticidad o hipertonía","Se mueven en patrones totales"],["Exceso de movilidad + estabilidad insuficiente","Ataxia y atetosis","No tienen los puntos clave de estabilidad; tono menor de lo normal"]]},{"tipo":"parrafo","texto":"Con la alteración del MCP aparece tono postural anormal sin posibilidad de control a favor o en contra de la gravedad, inervación recíproca anormal (incoordinación muscular) y patrones de postura y movimiento anormales y estereotipados. Si estos patrones se prolongan en el tiempo con una alineación incorrecta, el SNC puede identificarlos como normales."},{"tipo":"perla","texto":"Orden de tratamiento tras la evaluación: **1.º normalizar el tono, 2.º mejorar la inervación recíproca, 3.º coordinación normal del movimiento**. Si el tono sigue alterado, no esperes coordinación normal."},{"tipo":"alerta","texto":"Espasticidad/hipertonía = exceso de estabilidad con poco movimiento. Ataxia/atetosis = exceso de movilidad con poca estabilidad y tono bajo. No los intercambies."}]},{"id":"neuroplasticidad-aprendizaje","titulo":"Neuroplasticidad y aprendizaje motor","bloques":[{"tipo":"parrafo","texto":"Las experiencias sensoriomotoras anormales producen una conciencia y una imagen corporal anormales. Según la **regla de desviación de Magnus**, el SNC refleja fielmente el estado de la musculatura en cada momento de una postura o movimiento. Por ello el tratamiento debe, gracias a la neuroplasticidad, **organizar/reorganizar el MCP** deteriorado por la lesión."},{"tipo":"lista","items":["Estímulos específicos.","Repetición de los componentes clave de los distintos patrones de postura y movimiento.","Siempre en la realización de actividades funcionales."]},{"tipo":"definicion","termino":"Feedback y feedforward","texto":"Al ejecutar movimientos el SNC recibe información del cambio de estado de sus receptores y modifica el movimiento según las sensaciones (**retroalimentación, feedback**). La repetición y el registro permiten desarrollar la **anticipación (feedforward)**. El aprendizaje tiene lugar cuando se avanza del feedback al feedforward."},{"tipo":"tabla","titulo":"Autores citados en aprendizaje motor","columnas":["Autor","Idea"],"filas":[["Bobath","Los movimientos activos iniciados por el paciente para solucionar sus problemas son esenciales para el aprendizaje motor y para producir cambios permanentes"],["Horak","Los procesos neurales se organizan en función de metas funcionales y conductuales, no de patrones sensoriomotores predeterminados"]]},{"tipo":"perla","texto":"Consecuencia práctica: diseña tareas con meta funcional y deja que el paciente inicie el movimiento. La experiencia de la sensación de movimiento es fundamental: el movimiento no puede aprenderse por sí solo."}]},{"id":"movimiento-normal-24h","titulo":"Movimiento normal, manejo 24 horas, motivación y evaluación","bloques":[{"tipo":"definicion","termino":"Movimiento normal","texto":"Respuesta del mecanismo de control postural central a un pensamiento o a un estímulo sensitivo-motor intrínseco o extrínseco. Su aprendizaje y los requisitos de control son la guía para planificar el tratamiento. En el paciente neurológico, «normal» expresa la forma más óptima de alcanzar la función con el menor esfuerzo y la mayor eficiencia."},{"tipo":"tarjetas","items":[{"etiqueta":"Voluntario","titulo":"Movimiento voluntario","texto":"Se aprende voluntariamente y se repite hasta que se automatiza. En una tarea nueva aparecen movimientos asociados, que son normales y disminuyen con la práctica."},{"etiqueta":"Automático","titulo":"Movimiento automático","texto":"Nunca aprendido, programado genéticamente y para la supervivencia: deglución, movimiento palpebral, respiración, tos, locomoción."},{"etiqueta":"Automatizado","titulo":"Movimiento automatizado","texto":"Aprendido y grabado en el SNC, se realiza como si fuera automático: pedalear, conducir, escribir."}]},{"tipo":"parrafo","texto":"La **disfunción del movimiento** resulta de la combinación de daño neuronal, cambios musculoesqueléticos y estrategias de movimiento aprendidas, que varían según el tipo y el tiempo de evolución de la lesión. Se observa dificultad o imposibilidad para iniciar y controlar la postura o el movimiento."},{"tipo":"definicion","termino":"Manejo 24 horas","texto":"Manejo continuo del paciente a lo largo del día para conseguir una **huella sináptica mayor** y mantener los logros de la terapia. Exige la participación y coordinación del equipo interdisciplinar, la familia y los cuidadores (envían la misma información al SN) y practicar lo aprendido en el **entorno real (AVD) con calidad de movimiento**."},{"tipo":"parrafo","texto":"**Motivación:** la motivación y el estado emocional influyen en el aprendizaje y en la realización de cualquier tarea. La terapia ocupacional ha influido en Bobath con la motivación intrínseca, la actividad con significado, el análisis de la actividad, el procesamiento sensorial y el juego."},{"tipo":"lista","items":["Se evalúan las habilidades y dificultades sensoriomotoras con herramientas estandarizadas y observación clínica detallada, en reposo y durante las actividades.","Patrones de postura y movimiento que interfieren en la evolución.","Circunstancias en las que cambia el tono postural.","Estrategias de compensación que utiliza para lograr su objetivo.","Cómo afecta todo ello a las AVD. El plan se dirige a resolver los problemas que interfieren en su participación con el entorno."]},{"tipo":"alerta","texto":"Los movimientos asociados en el aprendizaje de una tarea nueva son **normales** y disminuyen con la práctica; las **reacciones asociadas** del paciente neurológico son siempre patológicas."}]},{"id":"puntos-clave","titulo":"Puntos clave de control","bloques":[{"tipo":"definicion","termino":"Puntos clave de control","texto":"Regiones del cuerpo desde donde el fisioterapeuta pone las manos para influir en el tono postural y el movimiento, facilitando patrones más normales y funcionales. Presentan una densidad de receptores especialmente alta. Se manejan junto con gravedad, posición y alineación corporal, que influyen en la calidad del tono. Pueden usarse para **inhibir, facilitar y estimular**; también para orientar en la línea media y proporcionar estabilidad proximal."},{"tipo":"lista","items":["Cabeza.","Cinturas escapulares.","Punto central (esternón), PCC, referido al apéndice xifoides y T7.","Codos.","Manos.","Pelvis.","Rodillas.","Pies."]},{"tipo":"tabla","titulo":"Puntos clave proximales (PCP) y distales (PCD)","columnas":["Categoría","Localización y uso","Ejemplos del temario"],"filas":[["Proximales (PCP)","Cerca del centro del cuerpo; influyen en el control postural y el movimiento global (grandes partes, especialmente cabeza y tronco)","Pelvis: control del tronco, estabilidad y movimiento de MMII, distribución de peso en marcha y transferencias. Cintura escapular: MMSS y parte superior del tronco (guía de movimiento funcional en PC con espasticidad de brazo). Cabeza y cuello: control postural global, mirar a ambos lados, bipedestación. Tronco: sentarse, pararse, caminar"],["Distales (PCD)","Lejos del centro (extremidades); más control y precisión en MMSS y MMII","Manos: alcance, agarre y liberación en hemiparesia. Pies: marcha, distribución de peso. Rodillas: estabilizar piernas en sedestación a bipedestación"]]},{"tipo":"definicion","termino":"Postural set","texto":"Alineación de puntos clave: postura de base para iniciar el movimiento, en la que se relacionan los puntos entre sí y con las bases de apoyo."},{"tipo":"alerta","texto":"El temario es ambiguo con la **cabeza**: la diapositiva resumen la lista entre los puntos distales (manos, pies, cabeza), mientras que la descripción de PCP habla de cabeza y tronco y la lista de proximales incluye cabeza y cuello. En el esquema resumen, los proximales son cintura escapular y pelvis y el PCC (esternón) va aparte."}]},{"id":"tecnicas","titulo":"Técnicas como herramienta para facilitar la función","bloques":[{"tipo":"parrafo","texto":"Bobath ofrece al paciente diferentes experiencias sensoriales mediante tres grupos de técnicas: **patrones de influencia del tono (TIP), facilitación y estimulación táctil y propioceptiva**."},{"tipo":"definicion","termino":"Patrones de influencia del tono (TIP)","texto":"Patrones de movimiento normales utilizados para modificar patrones anormales y reducir el tono aumentado, permitiendo adaptación, elongación, alineación y movimiento. El terapeuta envía información al SNC desde la periferia para organizar los procesos excitatorios e inhibitorios. El cambio de tono solo modifica cómo se mueve el paciente **si se acompaña de la experiencia de activar un movimiento optimizado**."},{"tipo":"perla","texto":"Ejemplo del temario: una niña que al alcanzar la pelota aumenta el tono flexor mejora tras un TIP (elongación, cambio de alineación y extensión funcional): alcanza la pelota con más extensión, con simetría y mejor transferencia de carga."},{"tipo":"definicion","termino":"Facilitación","texto":"Uso de la información sensorial aferente para mejorar el efecto del rendimiento motor. A menudo requiere contacto manual para activar aferencias, activar musculatura o guiar el movimiento, y debe basarse **siempre en un contacto activo**. Ejemplo: facilitar la marcha desde el punto clave central."},{"tipo":"parrafo","texto":"**Estimulación táctil y propioceptiva:** sirve para incrementar, regular y estabilizar el tono cuando es demasiado bajo para activarse contra la gravedad (ej.: niños con tono bajo), mantener el control postural activo, facilitar el movimiento o mantener la estabilidad. Con déficit sensorial aporta información táctil y propioceptiva para mantener una postura o movimiento; se usa cuando no pueden moverse o faltan experiencias sensoriomotoras."},{"tipo":"tabla","titulo":"Técnicas de estimulación táctil y propioceptiva","columnas":["Técnica","Descripción"],"filas":[["Placing (colocación)","Trabajo en posturas normalizadoras que el paciente debe mantener; se busca que se integren automáticamente"],["Holding (mantenimiento)","Se demanda al paciente una acción determinada más exigente"],["Tapping","Para aumentar el tono"],["Compresión y tracción articular","Receptores estimulados por compresión en la alineación normal: información a centros superiores (imagen del movimiento/postura); respuestas medulares (la motoneurona alfa depende más de la periferia); activación de sinergias funcionales; tono más fácilmente modulable (ej.: estabilizar la cadera requiere la verticalidad de la bipedestación)"],["Transferencia de peso y puesta en carga","Favorecen la conciencia corporal por la gran estimulación táctil y propioceptiva. Una transferencia con éxito implica alineación, secuencia, velocidad, coordinación y fuerza adecuadas"]]},{"tipo":"alerta","texto":"Tapping = aumentar tono. TIP = reducir tono aumentado. No los confundas, y recuerda que Placing es mantener una postura normalizadora y Holding exige una acción más exigente."}]},{"id":"otros-conceptos","titulo":"Fijación, patrones de movimiento y reacciones posturales","bloques":[{"tipo":"definicion","termino":"Fijación","texto":"Activación de la musculatura mediante excitación del agonista con excitación mínima e inhibición del antagonista. Es inervación recíproca a bajo nivel neurofisiológico."},{"tipo":"tabla","titulo":"Patrón de movimiento (secuencia de movimientos selectivos en una alineación correspondiente)","columnas":["Tipo","Características"],"filas":[["Normal","Movimientos combinados, pueden variarse a voluntad"],["Anormal","Estereotipado; no es posible la variación"],["Total","Agonistas, antagonistas y sinergistas se activan a la vez; suelen aparecer ante gran esfuerzo"]]},{"tipo":"parrafo","texto":"Un patrón se considera anormal si aparece en actividades que requieren poco esfuerzo o si no puede disociarse y fraccionarse al terminar la actividad."},{"tipo":"parrafo","texto":"**Reacciones posturales normales:** base de los movimientos y habilidades funcionales; permiten el control de cabeza y tronco y mantener y establecer la alineación de la cabeza con el cuerpo y del cuerpo con los miembros."},{"tipo":"tabla","titulo":"Equilibrio, enderezamiento y apoyo","columnas":["Reacción","Qué es","Voluntaria","Sistema"],"filas":[["Equilibrio","Ajustes pequeños, finos y selectivos del tono ante desplazamientos mínimos de peso; mantiene la alineación en una postura","No","Vestíbulo-espinal (extensión selectiva contra la gravedad)"],["Enderezamiento","Movimientos automáticos de cabeza, tronco y extremidades como contrapesos ante desplazamientos grandes de peso con desequilibrio claro; el aumento de tono no basta, hay que transferir peso en dirección contraria","Sí","Cortico-rubro-espinal, interactuando con la vía corticoespinal"],["Apoyo","Movimientos automáticos de brazos o piernas que aumentan la base de sustentación; última línea de defensa antes de la caída","Sí","No especificado en el temario"]]},{"tipo":"definicion","termino":"Reacciones asociadas","texto":"Reacciones posturales anormales (ausencia o disminución de las normales) en músculos de control voluntario: aumento anormal del tono en una parte del cuerpo como resultado de un esfuerzo en otra, por lo general menos afectada o sana. **Siempre son patológicas**, se relacionan con pérdida de control postural, a veces solo se detectan a la palpación y, por repetición, el paciente aprende patrones de hipertonía que llevan a modificaciones permanentes de la musculatura y espasticidad."},{"tipo":"perla","texto":"En la valoración, palpa durante el esfuerzo del miembro sano o menos afectado: las reacciones asociadas sutiles pueden pasar inadvertidas a la inspección. Reducir el esfuerzo y mejorar la alineación disminuye su aparición."}]}],"caso_clinico":{"titulo":"Hemiparesia izquierda tras ACV isquémico","presentacion":"Luis, 64 años, jubilado, sufre un ACV isquémico en el territorio de la ACM derecha hace tres semanas. Presenta hemiparesia izquierda con hipertonía en flexores del miembro superior y extensores del inferior. En sedestación, al esforzarse en alcanzar un vaso con la mano derecha, el codo izquierdo se flexiona y aumenta su tono. Transfiere el peso solo sobre el lado derecho, tiene dolor de hombro izquierdo y reduce la base de apoyo para sentirse seguro. Está motivado y su mujer colabora en casa.","preguntas":[{"pregunta":"¿Qué fenómeno describe el aumento de tono en el codo izquierdo durante el esfuerzo del lado derecho y qué implica?","respuesta":"Es una reacción asociada: aumento anormal del tono en una parte del cuerpo como resultado de un esfuerzo en otra. Siempre es patológica y se relaciona con pérdida de control postural. Si se repite, Luis aprenderá patrones de hipertonía, con modificaciones permanentes de la musculatura y espasticidad. Hay que reducir el esfuerzo, mejorar la alineación y lograr actividad en ambos hemicuerpos."},{"pregunta":"Según los factores que modulan el tono postural, ¿qué elementos del caso lo están elevando y cómo actuarías?","respuesta":"La reducción de la base de apoyo y su menor estabilidad, el esfuerzo con velocidad inadecuada y el dolor de hombro elevan el tono. Ampliarías y estabilizarías la base, cuidarías la alineación de los puntos clave (postural set), evitarías el dolor con una posición adecuada del miembro superior y adaptarías la velocidad. Después usarías TIP para reducir el tono y facilitación con contacto activo desde cintura escapular y pelvis."},{"pregunta":"¿Cómo organizarías el tratamiento y el manejo fuera de la sesión según Bobath?","respuesta":"Tras evaluar, primero normalizarías el tono, luego mejorarías la inervación recíproca y después la coordinación, siempre en actividades funcionales con propósito (alcanzar el vaso, transferencias) y con movimientos activos iniciados por él, favoreciendo el paso de feedback a feedforward. Retirarías la facilitación progresivamente. Aplicarías manejo 24 horas: instruir a su mujer y al equipo para que transmitan la misma información al SNC, practicando en las AVD con calidad de movimiento, sin falsas expectativas de recuperación."}]},"glosario":[{"termino":"IBITA","definicion":"International Bobath Instructors Training Association; su definición describe Bobath como resolución de problemas para evaluar y tratar el trastorno de función, movimiento y control postural por lesión del SNC."},{"termino":"Tono postural","definicion":"Tono variable que aporta estabilidad y movimiento; suficientemente alto para vencer la gravedad y suficientemente bajo para permitir el movimiento."},{"termino":"Mecanismo de control postural (MCP)","definicion":"Procesos internos y externos (sensibilidad, tono, inervación recíproca y coordinación) que adaptan el tono postural para lograr posturas y movimientos variados."},{"termino":"Inervación recíproca","definicion":"Modulación de inhibición y excitación del SNC que controla de forma consecutiva agonistas, antagonistas y sinergistas para coordinar el movimiento."},{"termino":"Punto clave de control","definicion":"Zona corporal con alta densidad de receptores desde la que se inhibe, facilita o estimula el tono y el movimiento."},{"termino":"PCC","definicion":"Punto clave central, en el esternón, referido al apéndice xifoides y T7."},{"termino":"Postural set","definicion":"Alineación de puntos clave que constituye la postura de base para iniciar el movimiento."},{"termino":"TIP (tone influence patterns)","definicion":"Patrones de movimiento normales usados para reducir el tono aumentado y mejorar la respuesta activa y funcional."},{"termino":"Facilitación","definicion":"Uso de información sensorial aferente, con contacto activo, para hacer más fácil una función selectiva; se retira conforme el paciente mejora."},{"termino":"Feedback / feedforward","definicion":"Retroalimentación sensorial que corrige el movimiento y anticipación que se desarrolla con la repetición; el aprendizaje avanza del primero al segundo."},{"termino":"Regla de desviación de Magnus","definicion":"El SNC refleja fielmente el estado de la musculatura en cada momento de una postura o movimiento."},{"termino":"Placing / holding / tapping","definicion":"Colocación en postura normalizadora / mantenimiento con demanda de acción más exigente / golpeteo para aumentar el tono."},{"termino":"Reacciones asociadas","definicion":"Aumento anormal de tono en una parte del cuerpo por el esfuerzo en otra; siempre patológicas y generadoras de espasticidad si se repiten."},{"termino":"Reacciones de equilibrio, enderezamiento y apoyo","definicion":"Reacciones posturales normales: ajustes mínimos de tono, contrapesos ante grandes desplazamientos y ampliación de la base de sustentación como última defensa."}],"fuentes":["IBITA (1996), Panturin (2001), Brock et al. (2002), Raine (2006): definición del Concepto Bobath.","IBITA (1995): el tratamiento como proceso interactivo.","Jenny Bryce: «Bobath es el análisis de la normalidad y el tratamiento de la desviación de la misma».","Horak: procesos neurales organizados en función de metas funcionales y conductuales.","Cano de la Cuerda R, Collado Vázquez S. Neurorrehabilitación. Métodos específicos de valoración y tratamiento. Editorial Panamericana, 2018.","Bisbe M, Santoyo C, Segarra V. Fisioterapia en Neurología. Procedimientos para restablecer la capacidad funcional. Editorial Panamericana, 2012."],"qcm":[{"pregunta":"Un paciente con tono postural elevado permanece en sedestación con los pies sin apoyo y el tronco inestable. Según los factores que modulan el tono postural, ¿qué ajuste tendería a reducirlo?","opciones":["Pedirle que cambie de postura más deprisa para disminuir el tiempo de esfuerzo sostenido","Aportar apoyo plantar y ampliar la base de sustentación, aumentando la estabilidad de la base","Estrechar la base de apoyo para exigir un mayor control selectivo del tronco","Mantener la postura sin corregir la alineación hasta que el tono se adapte espontáneamente"],"correcta":1,"explicacion":"A menor base de apoyo y menor estabilidad de la base, mayor elevación del tono. Ampliar y estabilizar la base reduce el tono. La velocidad inadecuada, el dolor y la mala alineación lo mantienen o aumentan.","por_opcion":["❌ La velocidad del movimiento es un factor que modifica el tono, pero cada movimiento tiene su velocidad económica; acelerar no reduce el tono.","✅ Correcta: a menor base y menor estabilidad, mayor tono; ampliar y estabilizar la base lo reduce.","❌ Estrechar la base eleva aún más el tono, justo lo contrario de lo buscado.","❌ La alineación de los puntos clave (postural set) influye en el tono; dejarla sin corregir perpetúa el problema."]},{"pregunta":"Una niña realiza movimientos amplios y mal frenados, con tono menor de lo normal y sin puntos clave de estabilidad proximal eficaces. ¿Qué alteración de la inervación recíproca describe mejor su cuadro?","opciones":["Inervación recíproca normal con alteración aislada de la sensibilidad propioceptiva","Exceso de fijación sinérgica proximal que bloquea la movilidad distal selectiva","Exceso de movilidad con estabilidad insuficiente, propio de la ataxia y la atetosis","Exceso de estabilidad con movimiento insuficiente, propio de la espasticidad con patrones totales"],"correcta":2,"explicacion":"Cuando aumenta la movilidad y la estabilidad es insuficiente aparecen ataxia y atetosis, con menos tono del normal y sin los puntos clave de estabilidad. El exceso de estabilidad con poco movimiento es la espasticidad/hipertonía.","por_opcion":["❌ Una alteración de un componente del MCP altera todo el mecanismo; además la inervación recíproca aquí es claramente anormal.","❌ La fijación sinérgica proximal normal permite la movilidad distal; su exceso sería rigidez/hipertonía, no el cuadro descrito.","✅ Correcta: ↑ movilidad + estabilidad insuficiente → ataxia y atetosis, con tono menor de lo normal.","❌ Es la inervación recíproca anormal de la espasticidad o hipertonía, con tono alto y patrones totales; no encaja con tono bajo."]},{"pregunta":"Tras la evaluación de un paciente con lesión del SNC, ¿qué secuencia propone el enfoque Bobath para restablecer un mecanismo de control postural normal?","opciones":["Coordinación del movimiento, después tono postural y por último inervación recíproca","Coordinación del movimiento, después inervación recíproca y por último tono postural","Inervación recíproca, después tono postural y por último coordinación del movimiento","Tono postural, después inervación recíproca y por último coordinación del movimiento"],"correcta":3,"explicacion":"El primer paso tras la evaluación es normalizar el tono; cuando es lo más normal posible se mejora la inervación recíproca y, al mejorar ambos, la coordinación del movimiento será normal.","por_opcion":["❌ La coordinación no puede mejorar antes que el tono y la inervación recíproca.","❌ Invierte el orden: la coordinación es el resultado final, no el punto de partida.","❌ La inervación recíproca depende de que el tono esté normalizado; no se aborda antes.","✅ Correcta: tono → inervación recíproca → coordinación normal del movimiento."]},{"pregunta":"¿Qué descripción corresponde a las reacciones posturales de equilibrio?","opciones":["Contrapesos de cabeza, tronco y extremidades ante desplazamientos grandes de peso","Amplían la base de sustentación con brazos o piernas ante una caída inminente","Pueden realizarse voluntariamente y dependen del sistema cortico-rubro-espinal","Ajustes mínimos y selectivos del tono ante desplazamientos pequeños, vestíbulo-espinales y no voluntarios"],"correcta":3,"explicacion":"Las reacciones de equilibrio son ajustes pequeños, finos y selectivos del tono postural, no voluntarios, mediados por el sistema vestíbulo-espinal. Las cortico-rubro-espinales corresponden al enderezamiento y la ampliación de la base al apoyo.","por_opcion":["❌ Son las reacciones de enderezamiento, ante desequilibrios claros.","❌ Es la reacción de apoyo, última línea de defensa antes de la caída.","❌ Voluntarias y cortico-rubro-espinales son rasgos del enderezamiento.","✅ Correcta: ajustes finos del tono, vestíbulo-espinales, no voluntarios."]},{"pregunta":"Un paciente sentado en la camilla es desplazado bruscamente hacia un lado; cabeza y tronco no bastan como contrapeso y extiende el brazo apoyando la mano para ampliar su base. ¿Qué reacción postural predomina en ese momento?","opciones":["Reacción de enderezamiento, contrapeso de cabeza, tronco y extremidades","Reacción de apoyo, última línea de defensa antes de la caída","Reacción asociada, aumento anormal de tono por esfuerzo en otro segmento","Reacción de equilibrio, ajuste fino y selectivo del tono postural"],"correcta":1,"explicacion":"Cuando los contrapesos no bastan, aparece el apoyo: movimiento automático de brazos o piernas que aumenta la base de sustentación y busca evitar la caída. Puede ejecutarse de forma voluntaria.","por_opcion":["❌ El enderezamiento compensa con contrapesos desplazamientos grandes, pero no se caracteriza por apoyar para ampliar la base.","✅ Correcta: el apoyo amplía la base de sustentación y es la última defensa antes de la caída.","❌ La reacción asociada es patológica y consiste en un aumento de tono a distancia, no en un apoyo protector.","❌ El equilibrio responde solo a desplazamientos mínimos de peso con ajustes del tono."]},{"pregunta":"Un sujeto sano muestra movimientos asociados al aprender una tarea nueva y un paciente hemipléjico aumenta el tono del miembro afectado al esforzarse con el sano. ¿Qué afirmación es correcta?","opciones":["Ambos fenómenos son reacciones asociadas patológicas que indican hipertonía","Los movimientos asociados del sano son un signo precoz de espasticidad que debe inhibirse","Las reacciones asociadas pueden ser fisiológicas o patológicas según el esfuerzo realizado","Los movimientos asociados del sano son normales y disminuyen con la práctica; las reacciones asociadas del paciente son siempre patológicas"],"correcta":3,"explicacion":"En el aprendizaje de una tarea nueva los movimientos asociados son normales y disminuyen con la práctica. Las reacciones asociadas son aumentos anormales de tono por esfuerzo en otra parte y siempre son patológicas.","por_opcion":["❌ Los movimientos asociados del sujeto sano no son patológicos.","❌ No son signo de espasticidad; disminuyen con la práctica.","❌ Según el temario las reacciones asociadas siempre son patológicas.","✅ Correcta: movimientos asociados = normales; reacciones asociadas = siempre patológicas."]},{"pregunta":"¿Cuál de las siguientes descripciones del punto clave central (PCC) es correcta?","opciones":["Apófisis espinosa de T12 y ombligo, situado entre la pelvis y la cintura escapular","Esternón, con referencia en el apéndice xifoides y T7, distinto de cintura escapular y pelvis","Región pélvica entre las crestas ilíacas, punto proximal junto a la cintura escapular","Manubrio esternal y C7, considerado punto distal junto a manos y pies"],"correcta":1,"explicacion":"El PCC es el punto central en el esternón, con referencia en el apéndice xifoides y T7. En el esquema del temario los proximales son cintura escapular y pelvis.","por_opcion":["❌ Esa localización no corresponde al PCC del temario.","✅ Correcta: PCC en el esternón, referido al apéndice xifoides y T7.","❌ La pelvis es un punto clave proximal distinto del PCC.","❌ El PCC no se sitúa en manubrio/C7 ni es distal."]},{"pregunta":"¿Qué finalidad persigue el manejo de 24 horas del paciente según el enfoque Bobath?","opciones":["Conseguir una huella sináptica mayor y mantener los logros funcionales practicando en su entorno real con calidad de movimiento","Permitir que en casa use las estrategias compensatorias que le resulten más eficaces","Sustituir la terapia formal por el manejo familiar, que aporta más repetición","Concentrar la práctica en la sesión para evitar que cuidadores introduzcan patrones erróneos"],"correcta":0,"explicacion":"El manejo continuo, coordinado entre equipo, familia y cuidadores, busca una huella sináptica mayor y mantener los logros, con práctica en AVD reales y con calidad de movimiento.","por_opcion":["✅ Correcta: huella sináptica mayor, mantenimiento de logros y práctica en el entorno real con calidad.","❌ Bobath busca evitar compensaciones; se practica con calidad de movimiento.","❌ La familia complementa y se coordina con el equipo, no sustituye la terapia.","❌ La participación de familia y cuidadores es fundamental; no se limita la práctica a la sesión."]},{"pregunta":"Tras reducir el tono aumentado con un patrón de influencia del tono (TIP), ¿qué condición hace que ese cambio modifique realmente cómo se mueve el paciente?","opciones":["Que se acompañe de la experiencia de activar un movimiento optimizado","Que se repita siempre el mismo patrón para no generar información sensorial nueva","Que se aplique solo con el paciente en reposo para no activar reacciones asociadas","Que el terapeuta mantenga la posición sin demandar actividad del paciente"],"correcta":0,"explicacion":"El cambio de tono postural anormal permite modificar la forma de moverse solo si se acompaña de la experiencia de la activación de un movimiento optimizado; así el paciente aprende a organizar y controlar sus movimientos.","por_opcion":["✅ Correcta: sin la experiencia de movimiento optimizado, la reducción del tono no se traduce en aprendizaje.","❌ Bobath ofrece variedad de experiencias sensoriales y es flexible, no estereotipado.","❌ El objetivo es obtener respuesta activa y funcional, no limitarse al reposo.","❌ La pasividad contradice la participación activa que exige el método."]},{"pregunta":"Respecto a la facilitación en el Concepto Bobath, ¿cuál es la afirmación correcta?","opciones":["Consiste en ejecutar pasivamente el movimiento para evitar patrones anormales","Se mantiene constante durante todo el proceso para asegurar la calidad del movimiento","Se basa únicamente en la instrucción verbal para no generar dependencia manual","Usa información sensorial aferente, con contacto activo, y se retira conforme el paciente se recupera"],"correcta":3,"explicacion":"La facilitación es el uso de información sensorial aferente para mejorar el rendimiento motor, a menudo con contacto manual desde puntos clave, que debe ser activo. Se va retirando a medida que el paciente mejora.","por_opcion":["❌ El movimiento activo iniciado por el paciente es esencial; no es movilización pasiva.","❌ La facilitación se va retirando conforme el paciente se recupera.","❌ A menudo requiere contacto manual; no es solo verbal.","✅ Correcta: aferencia sensorial, contacto activo y retirada progresiva."]},{"pregunta":"¿Qué efecto neurofisiológico se atribuye a la compresión articular aplicada en la alineación normal de cada articulación?","opciones":["Aumento del tono exclusivamente mediante la estimulación cutánea repetida","Información a centros superiores y respuestas medulares en las que la motoneurona alfa depende más de la periferia, activando sinergias funcionales","Inhibición de los centros superiores para evitar reacciones asociadas","Reducción del tono por estiramiento mantenido de los husos neuromusculares"],"correcta":1,"explicacion":"Los receptores estimulados por la compresión envían información a centros superiores (imagen del movimiento) y generan respuestas medulares, con mayor dependencia periférica de la motoneurona alfa, activando sinergias relacionadas y facilitando la modulación del tono.","por_opcion":["❌ El aumento de tono con golpeteo es el tapping; la compresión estimula receptores articulares y modula el tono.","✅ Correcta: información a centros superiores, respuesta medular y activación de sinergias.","❌ No se describe inhibición de centros superiores; se informa a ellos.","❌ El temario no describe un estiramiento mantenido de husos; describe estimulación de receptores articulares."]},{"pregunta":"Tras varias sesiones, un paciente ajusta la musculatura del tronco antes de elevar el brazo, anticipándose a la perturbación. ¿Qué proceso del aprendizaje motor refleja este cambio?","opciones":["Anticipación (feedforward) desarrollada por repetición y registro de la información","Reacción asociada por esfuerzo excesivo en el miembro menos afectado","Regla de desviación de Magnus aplicada al estado de la musculatura","Retroalimentación (feedback) que corrige el movimiento durante su ejecución"],"correcta":0,"explicacion":"Con la repetición y el registro de la información de los receptores se desarrolla la anticipación o feedforward. El aprendizaje tiene lugar al avanzar del feedback al feedforward.","por_opcion":["✅ Correcta: el ajuste previo al movimiento es feedforward.","❌ La reacción asociada es un aumento patológico de tono, no un ajuste anticipatorio.","❌ La regla de Magnus indica que el SNC refleja el estado de la musculatura; no explica la anticipación.","❌ El feedback corrige según las sensaciones recibidas, no anticipa."]},{"pregunta":"¿Qué implicación terapéutica se deriva de la regla de desviación de Magnus y de la persistencia de patrones anormales con alineación incorrecta?","opciones":["El estado muscular no modifica la información central, por lo que la repetición carece de efecto","La imagen corporal se mantiene intacta tras la lesión, por lo que el tratamiento se centra solo en la fuerza","El SNC registra fielmente un estado muscular anormal prolongado, por lo que hay que ofrecer experiencias sensoriomotoras normales para reorganizar el MCP","El SNC filtra las aferencias anormales, por lo que basta con corregir la alineación pasivamente"],"correcta":2,"explicacion":"Si el SNC refleja fielmente el estado de la musculatura, las experiencias sensoriomotoras anormales generan una imagen corporal anormal y los patrones prolongados pueden tomarse como normales. Por neuroplasticidad se debe reorganizar el MCP con estímulos específicos y repetición en actividades funcionales.","por_opcion":["❌ La repetición de componentes clave es una vía para influir en la reorganización del SNC.","❌ Las experiencias anormales producen una imagen corporal anormal.","✅ Correcta: experiencias normales y repetición funcional para reorganizar el MCP.","❌ El SNC refleja el estado muscular, no lo filtra; además la participación activa es esencial."]},{"pregunta":"¿Qué pareja clasifica correctamente los movimientos según el temario?","opciones":["Deglución y pedalear son automáticos; locomoción y conducir son automatizados","Tos y respiración son automatizados; conducir y escribir son voluntarios","Deglución y locomoción son automáticos; conducir y escribir son automatizados","Locomoción y escribir son automáticos; deglución y pedalear son voluntarios"],"correcta":2,"explicacion":"Los movimientos automáticos están programados genéticamente (deglución, palpebral, respiración, tos, locomoción). Los automatizados son aprendidos y grabados en el SNC (pedalear, conducir, escribir).","por_opcion":["❌ Pedalear es automatizado, no automático.","❌ Tos y respiración son automáticas, no automatizadas.","✅ Correcta: automáticos genéticos frente a automatizados aprendidos.","❌ Escribir es automatizado, no automático."]},{"pregunta":"Respecto a la aplicación del Concepto Bobath en niños y adultos, ¿cuál es la afirmación correcta?","opciones":["Los principios son los mismos; el adulto tiene memoria de movimientos normales y puede interactuar con más motivación y atención","El niño con PCI conserva memoria de movimientos normales que se reactivan con la facilitación","Los principios son distintos porque el adulto no conserva memoria motora útil","El abordaje del adulto es idéntico al del niño porque ambos nacen con la lesión"],"correcta":0,"explicacion":"Los principios de tratamiento son iguales; el abordaje varía porque el adulto sabe cómo hacer las cosas (memoria de movimientos normales) y puede implicarse con más motivación y atención. El niño con PCI nace con la lesión y carece de esa experiencia.","por_opcion":["✅ Correcta: mismos principios, abordaje adaptado por memoria motora y capacidad de interacción.","❌ El niño no tiene experiencia de movimiento normal: nace con la lesión.","❌ Los principios no cambian; lo que varía es el abordaje.","❌ Solo el niño nace con la lesión; el adulto ha tenido movimiento normal."]}],"asignatura":"Fisioterapia neurológica","tema":9,"fecha":"2026-11-04","resumen":["El **Concepto Bobath** (IBITA) es un enfoque de **resolución de problemas** para evaluar y tratar trastornos de la función, el movimiento y el control postural por **lesión del SNC**, aplicable a **todas las edades y grados de afectación**. Lo crearon **Berta y Karel Bobath** en **Londres en los años 40** frente a una rehabilitación ortopédica basada en compensar y usar órtesis.","El **tono postural** debe ser lo bastante **alto para dar estabilidad contra la gravedad** y lo bastante **bajo para permitir movimientos selectivos**. Lo modulan la alineación (*postural set*), la base de apoyo, la gravedad, la velocidad, el estado psicológico y el dolor.","El **mecanismo de control postural** integra **sensibilidad, tono postural, inervación recíproca y coordinación**, y está alterado en todo paciente con lesión del SNC. Se trata en este orden: **1.º tono, 2.º inervación recíproca, 3.º coordinación**.","El fisioterapeuta trabaja desde los **puntos clave de control** (cabeza, cinturas escapulares, PCC esternón, codos, manos, pelvis, rodillas y pies) para **inhibir, facilitar o estimular**. Dispone de tres grupos de técnicas: **TIP, facilitación y estimulación táctil y propioceptiva**.","El aprendizaje motor se produce al pasar del **feedback al feedforward**, con movimientos **iniciados por el paciente** en actividades funcionales con propósito y **manejo 24 horas**. Las reacciones posturales normales son **equilibrio, enderezamiento y apoyo**, mientras que las **reacciones asociadas son siempre patológicas**."],"preguntate":[{"pregunta":"Define el Concepto Bobath según la IBITA.","respuesta":"Es una forma de **resolución de problemas** para la **evaluación y el tratamiento** de personas con trastorno de la función, el movimiento y el control postural debido a una **lesión del SNC**. Se aplica a todas las edades y a todos los grados de desorden físico o funcional."},{"pregunta":"¿En qué contexto de la rehabilitación neurológica surgió el Concepto Bobath y qué observación clínica lo impulsó?","respuesta":"La rehabilitación neurológica de entonces era de carácter **ortopédico**, basada en la compensación y las órtesis. Los Bobath observaron en la práctica clínica que la **modificación del SNC era posible**, y crearon un método abierto y flexible, no estandarizado."},{"pregunta":"Explica la frase de Jenny Bryce sobre Bobath y los cuatro pasos de análisis que se derivan de ella.","respuesta":"«Bobath es el **análisis de la normalidad y el tratamiento de la desviación** de la misma». Los cuatro pasos son: analizar el movimiento normal, analizar la desviación, aplicar técnicas adaptadas y analizar su efecto para **modificarlas según evolucione** el paciente."},{"pregunta":"¿Qué tres requisitos necesita una inervación recíproca normal?","respuesta":"Necesita **fijación sinérgica proximal** que permita la movilidad distal. También requiere el **ajuste automático** de los músculos a los cambios posturales y el **control graduado de agonistas y antagonistas**."},{"pregunta":"Define la fijación y explica qué relación guarda con la inervación recíproca.","respuesta":"Es la activación muscular por **excitación del agonista con excitación mínima e inhibición del antagonista**. Constituye una forma de **inervación recíproca a bajo nivel neurofisiológico**."},{"pregunta":"¿Qué criterios permiten considerar anormal un patrón de movimiento?","respuesta":"Un patrón es anormal si aparece en **actividades que requieren poco esfuerzo**. También lo es si **no puede disociarse ni fraccionarse** al terminar la actividad. Los patrones anormales son estereotipados y no admiten variación."},{"pregunta":"Diferencia el *placing* del *holding* y explica para qué se usa el *tapping*.","respuesta":"En el **placing** el paciente mantiene **posturas normalizadoras** para que se integren automáticamente. En el **holding** se le demanda una **acción más exigente**. El **tapping** sirve para **aumentar el tono**."},{"pregunta":"Un niño con tono bajo no logra activarse contra la gravedad. ¿Qué grupo de técnicas Bobath elegirías y qué buscarías con ellas?","respuesta":"Elegiría la **estimulación táctil y propioceptiva**. Con ella buscaría **incrementar, regular y estabilizar el tono**, mantener el control postural activo y aportar la información sensorial que le falta."},{"pregunta":"Compara la reacción de enderezamiento con la de equilibrio en cuanto a desencadenante, voluntariedad y vía nerviosa.","respuesta":"El **enderezamiento** aparece ante **grandes desplazamientos de peso**: usa la cabeza, el tronco y las extremidades como contrapesos, es voluntario y depende de la vía **cortico-rubro-espinal**. El **equilibrio** consiste en ajustes finos ante desplazamientos mínimos, no es voluntario y depende de la vía **vestíbulo-espinal**."},{"pregunta":"¿Qué tres factores combinados explican la disfunción del movimiento tras una lesión del SNC, y qué aporta Horak al diseño de tareas?","respuesta":"La disfunción combina **daño neuronal, cambios musculoesqueléticos y estrategias de movimiento aprendidas**. Horak sostiene que los procesos neurales se organizan según **metas funcionales y conductuales**, por lo que las tareas deben tener un objetivo funcional."}]}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips">${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
