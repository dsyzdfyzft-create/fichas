<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>

<script id="datos" type="application/json">{"titulo":"Tema 1: Ortesis y prótesis – historia y generalidades","subtitulo":"Qué distingue una prótesis (sustituye lo que falta) de una órtesis (modifica lo que existe), cómo se clasifican y cómo han evolucionado desde el antiguo Egipto hasta la biónica.","resumen":["Una **prótesis** es una extensión artificial que **reemplaza una parte del cuerpo que falta** (amputación o agenesia), mientras que una **órtesis** es un apoyo o dispositivo **externo** que **modifica aspectos funcionales o estructurales** del sistema neuromusculoesquelético.","Las prótesis se dividen en **endoprótesis** (colocación quirúrgica, diseño endoesquelético) y **exoprótesis** (se pueden retirar, son aparatos ortopédicos; motoras o sensoriales), y además por **material** (plástico, titanio, resina, metal) y por **energía** (interna o externa).","Las órtesis se clasifican por **tiempo** (temporales/definitivas), por **segmento** (tronco, MS, MI) y por **función**: **activas/dinámicas** (funcionales dinámicas y activas correctoras) y **estáticas/pasivas** (pasivas correctoras, estabilizadoras y pasivas protectoras).","Sus reacciones adversas son **alergia al material, restricción de la circulación periférica, úlceras y todas las complicaciones de la inmovilización**, por lo que el fisioterapeuta debe vigilar piel, edema y tolerancia.","La historia va de los **egipcios (3000/3500 a.C., Cairo toe)** y la **Capua Leg (300 a.C.)** a **Ambroise Paré (padre de la cirugía de amputación y la protésica moderna)**, Verduyn (1696), Potts/Anglesey (1800), Syme (1843), Parmelee (1863), las guerras y hoy la **microelectrónica, silicona e impresión 3D**."],"objetivos":["Definir con precisión prótesis y órtesis y diferenciarlas por su objetivo (sustituir vs modificar).","Clasificar las prótesis según colocación (endo/exo), tipo de exoprótesis, material y fuente de energía.","Clasificar las órtesis según tiempo de uso, segmento corporal y función (activas/dinámicas vs estáticas/pasivas, con sus subtipos).","Reconocer las reacciones adversas de las órtesis y aplicar su vigilancia en fisioterapia.","Ordenar cronológicamente los hitos históricos y sus protagonistas (Herodoto, Capua, Götz, Paré, Lorrain, Verduyn, Potts, Selpho, Syme, Palmer, Bly, Parmelee, Hermann, Desoutter, Péan, Hanger, Coleman)."],"ideas_clave":["**Prótesis = sustituye** una parte que FALTA (amputación o agenesia) cumpliendo sus mismas funciones; **órtesis = modifica** la función o estructura de una parte que EXISTE.","Hay prótesis **puramente estéticas**: oculares y mamarias.","Funciones de la prótesis: **restaurar la función biomecánica**, **rehabilitación funcional** (AVD, independencia, evitar desbalance del centro de gravedad) y **adaptación estética y psicológica**.","**Endoprótesis**: requieren cirugía, diseño endoesquelético (cadera, hombro invertido, válvula cardiaca, neuroprótesis). **Exoprótesis**: se pueden retirar y se consideran aparatos ortopédicos (motoras o sensoriales).","Energía **interna** = el propio individuo mueve la articulación protésica; **externa** = sistemas mecánicos, hidráulicos o eléctricos con pequeños motores y baterías.","Órtesis **activas correctoras**: corrigen mientras se llevan puestas; **al quitarlas el segmento vuelve a su posición inicial**.","Órtesis estáticas/pasivas: **pasivas correctoras** (corregir deformidad), **estabilizadoras o de soporte** (controlar segmento y ángulo articular) y **pasivas protectoras** (descargar o alinear).","**Ambroise Paré** (s. XVI): padre de la cirugía de amputación y del diseño protésico moderno; amputación moderna 1529, prótesis 1536."],"secciones":[{"id":"protesis-definicion","titulo":"¿Qué es una prótesis? Definición y funciones","bloques":[{"tipo":"definicion","termino":"Prótesis","texto":"**Extensión artificial que reemplaza o provee una parte del cuerpo que falta** por diversas razones (entre ellas, la amputación). Su principal objetivo es **sustituir una parte del cuerpo que haya sido perdida** por amputación **o que no exista por agenesia**, cumpliendo las mismas funciones que la parte faltante."},{"tipo":"parrafo","texto":"La clave conceptual es la **ausencia**: la prótesis entra en juego cuando el segmento **no está** (perdido o nunca formado). Por eso su objetivo no es corregir ni sostener un segmento existente, sino **ocupar su lugar** y reproducir su función. No todas buscan función: existen prótesis cuya función es **estrictamente estética**, como las **prótesis oculares** o las **mamarias**."},{"tipo":"tabla","titulo":"Las 3 funciones de la prótesis","columnas":["Función","Qué incluye","Ejemplo / matiz"],"filas":[["1. Restaurar la función biomecánica","**Suplir funciones perdidas** del miembro amputado (caminar, agarrar, sostener); reproducir el movimiento articular; **proveer soporte y estabilidad** al cuerpo","Flexión de rodilla o codo; prótesis de pierna como soporte"],["2. Rehabilitación funcional","**Reintegración a las AVD** (caminar, vestirse, trabajar); recuperar independencia física y social; **prevenir deformidades posturales** o problemas por desbalance corporal","Control del **centro de gravedad** tras una amputación"],["3. Adaptación estética y psicológica","Imitar la apariencia del miembro (forma, color, textura); **mejorar la autoestima y reducir el impacto psicológico del trauma**; ayudar a aceptar la pérdida corporal","Prótesis oculares y mamarias: función estética pura"]]},{"tipo":"perla","texto":"En el amputado de MI, la prótesis no solo sirve para caminar: al restituir la masa y la longitud del miembro **equilibra el centro de gravedad** y previene compensaciones posturales (inclinación de tronco, sobrecarga del miembro sano). Valora siempre postura y cadena cinética global, no solo la marcha."},{"tipo":"alerta","texto":"Trampa: «la prótesis siempre persigue una función motora». **Falso**: las prótesis oculares y mamarias tienen función **estrictamente estética**, y la función estética/psicológica es una de las tres funciones oficiales de toda prótesis."},{"tipo":"alerta","texto":"La prótesis sustituye una parte perdida por **amputación** pero también la que **no existe por agenesia** (ausencia congénita). Si el enunciado habla de un niño que nace sin mano, el dispositivo que la reemplaza sigue siendo una **prótesis**, no una órtesis."}]},{"id":"clasificacion-protesis","titulo":"Clasificación de las prótesis","bloques":[{"tipo":"parrafo","texto":"El temario clasifica las prótesis con **cuatro criterios** independientes: según su **colocación** (endo- vs exoprótesis), dentro de las exoprótesis según su **modo de acción** (motoras vs sensoriales), según su **material** y según la **energía** que mueve las articulaciones suplidas. Un mismo dispositivo puede describirse con varios criterios a la vez (p. ej., una mano mioeléctrica es una exoprótesis de energía externa)."},{"tipo":"esquema","titulo":"Árbol de clasificación de las prótesis","mermaid":"flowchart TD\n  P[\"Prótesis\"] --> C[\"Según colocación\"]\n  P --> M[\"Según material\"]\n  P --> E[\"Según energía\"]\n  C --> EN[\"Endoprótesis: quirúrgica, endoesquelética\"]\n  C --> EX[\"Exoprótesis: retirable, aparato ortopédico\"]\n  EX --> MO[\"Motoras: acción simple\"]\n  EX --> SE[\"Sensoriales: calculan la fuerza\"]\n  M --> M1[\"Plástico, titanio, resina, metal\"]\n  E --> I[\"Interna: el propio individuo\"]\n  E --> X[\"Externa: mecánica, hidráulica, eléctrica\"]","pie":"Cuatro criterios que se combinan: colocación, tipo de exoprótesis, material y energía."},{"tipo":"tarjetas","items":[{"etiqueta":"Endo","titulo":"Endoprótesis","texto":"Precisan **procedimientos quirúrgicos** para su colocación y tienen un **diseño endoesquelético**. Ejemplos del PDF: prótesis de cadera (cotilo, inserto, cabeza femoral, vástago), **prótesis invertida de hombro**, **válvula cardiaca** mecánica o biológica, **neuroprótesis** (electrodos implantados sobre la corteza que controla el tracto vocal) e implante de retina."},{"etiqueta":"Exo","titulo":"Exoprótesis","texto":"Al contrario que las endoprótesis, **se pueden retirar**; se las considera **aparatos ortopédicos**. Ejemplos: prótesis de pierna, prótesis funcional digital, mano/antebrazo impreso, procesador externo de implante coclear."},{"etiqueta":"Exo-1","titulo":"Motoras","texto":"Son **ejecutadas en una acción simple**."},{"etiqueta":"Exo-2","titulo":"Sensoriales","texto":"Ambas extremidades **informan la relación con el entorno** y de manera **automática se calcula la cantidad de fuerza** que debe aplicar el aparato locomotor del individuo."}]},{"tipo":"figura","pagina":7,"pie":"Implante de retina Argus II (Benito Pascual, 2017): cámara en gafas → microprocesador → receptor → panel de electrodos sobre la retina → el cerebro percibe patrones de luz. Ejemplo de prótesis sensorial con componente implantado.","src":"img/ortesis-t1-tema-1-ortesis-y-protesis-historia-y-generalidades-p7.jpg"},{"tipo":"tabla","titulo":"Clasificación por material y por energía","columnas":["Criterio","Tipos","Clave"],"filas":[["Material","1. Plástico · 2. Láminas de titanio · 3. Resina · 4. Metal","Cuatro materiales citados en el PDF"],["Energía interna","El **propio individuo** mueve la articulación protésica con el resto del aparato locomotor","Sin motor; energía del cuerpo"],["Energía externa","**Sistemas mecánicos, hidráulicos o eléctricos** que actúan de forma indirecta, **movidos por pequeños motores con baterías**","Fuente ajena al cuerpo"]]},{"tipo":"dato","valor":"4 materiales","texto":"Plástico, láminas de titanio, resina y metal."},{"tipo":"alerta","texto":"No confundas «exoprótesis» con «energía externa». Exo/endo se refiere a **dónde se coloca** (retirable vs quirúrgica); interna/externa se refiere a **qué energía mueve la articulación**. Una exoprótesis de pierna puede funcionar con energía **interna**."}]},{"id":"ortesis-definicion","titulo":"¿Qué es una órtesis? Definición y características","bloques":[{"tipo":"definicion","termino":"Órtesis","texto":"**Apoyo u otro dispositivo externo** aplicado al cuerpo para **modificar los aspectos funcionales o estructurales del sistema neuromusculoesquelético**."},{"tipo":"parrafo","texto":"A diferencia de la prótesis, la órtesis actúa sobre un segmento **que existe**: lo sostiene, lo alinea, limita o asiste su movimiento. Es siempre **externa** (collarín, cabestrillo, corsé, rodillera, muñequera, tobillera, plantilla). Se integra en el **manejo rehabilitador** de muchas enfermedades y puede fabricarse **a medida** del segmento (corsé termoplástico, plantillas por molde) o mediante **adaptación de órtesis prefabricadas**, según el tipo de patología."},{"tipo":"tabla","titulo":"Características de las órtesis (según el PDF)","columnas":["Característica","Ejemplos del PDF"],"filas":[["Útiles como parte del **manejo de rehabilitación** en diversas enfermedades","Rodillera articulada postoperatoria; férula dinámica de mano"],["Elaboradas **a medida** o por **adaptación de prefabricadas** según la enfermedad","Corsés infantiles a medida; molde de pie para plantilla"],["Brindan **funcionalidad, confort y estética**","Corrector de juanete de silicona, férula dental, manguito de compresión deportivo"],["**Mejorar una función, restringir o reforzar un movimiento**","Órtesis antiequino (dorsiflexora); collarín semirrígido"]]},{"tipo":"tabla","titulo":"Prótesis vs órtesis: comparación directa","columnas":["Aspecto","Prótesis","Órtesis"],"filas":[["Segmento","**Falta** (amputación/agenesia)","**Existe** pero con déficit funcional o estructural"],["Objetivo","**Sustituir / reemplazar**","**Modificar** función o estructura"],["Ubicación","Endo (quirúrgica) o exo (retirable)","Siempre **externa**"],["Ejemplos","Pierna transtibial, ocular, mamaria, cadera","Collarín, corsé, rodillera, antiequino"]]},{"tipo":"perla","texto":"Antes de proponer una órtesis prefabricada, pregúntate si la patología exige **ajuste a medida** (deformidad estructurada, piel frágil, uso prolongado): una órtesis mal adaptada genera puntos de presión y úlceras, que son precisamente sus reacciones adversas principales."}]},{"id":"clasificacion-ortesis","titulo":"Clasificación de las órtesis","bloques":[{"tipo":"parrafo","texto":"Las órtesis se clasifican con **tres criterios**: **tiempo de uso** (temporales para trastornos limitados en el tiempo; definitivas para déficits o discapacidades definitivas), **segmento corporal** (tronco, miembro superior, miembro inferior) y, sobre todo, **función**, que es la clasificación más preguntada."},{"tipo":"esquema","titulo":"Clasificación funcional de las órtesis","mermaid":"flowchart TD\n  O[\"Órtesis según función\"] --> A[\"Activas / Dinámicas\"]\n  O --> S[\"Estáticas / Pasivas\"]\n  A -->|\"sustituyen función muscular o ligamentosa\"| A1[\"Funcionales dinámicas\"]\n  A --> A2[\"Activas correctoras\"]\n  A1 --> A1t[\"Sustituyen una función muscular\"]\n  A2 --> A2t[\"Corrigen solo mientras se llevan\"]\n  S -->|\"mantienen posición\"| S1[\"Pasivas correctoras\"]\n  S --> S2[\"Estabilizadoras o de soporte\"]\n  S --> S3[\"Pasivas protectoras\"]\n  S2 --> S2t[\"Controlan segmento y ángulo\"]\n  S3 --> S3t[\"Descargan o alinean\"]","pie":"Activas = sustituyen mecánicamente una función; estáticas = mantienen un segmento que no se sostiene solo."},{"tipo":"tabla","titulo":"Subtipos funcionales de órtesis","columnas":["Grupo","Subtipo","Función","Ejemplo del PDF"],"filas":[["Activas / dinámicas (**sustituyen de forma mecánica una función muscular o ligamentosa**)","Funcionales dinámicas","Sustituir una **función muscular**","Órtesis dinámica de muñeca y mano con gomas extensoras de dedos"],["Activas / dinámicas","Activas correctoras","**Corregir una deformidad mientras se llevan puestas**; al quitarlas, el segmento **vuelve a su posición inicial**","Estabilizador de tobillo"],["Estáticas / pasivas (**mantienen un segmento en determinada posición cuando no puede mantenerse por sí mismo**)","Pasivas correctoras","**Corregir alguna deformidad**","Corsé bivalvo termoplástico; corrector de hallux valgus; casco craneal"],["Estáticas / pasivas","Estabilizadoras o de soporte","**Controlar un segmento y un ángulo articular**","Inmovilizador de rodilla"],["Estáticas / pasivas","Pasivas protectoras","**Descargar un miembro o alinearlo**","Órtesis de descarga"]]},{"tipo":"figura","pagina":13,"pie":"Órtesis activas/dinámicas: arriba, órtesis dinámica de muñeca y mano con estabilizadores elásticos (sustituye la función extensora); abajo, estabilizador de tobillo.","src":"img/ortesis-t1-tema-1-ortesis-y-protesis-historia-y-generalidades-p13.jpg"},{"tipo":"figura","pagina":14,"pie":"Órtesis estáticas/pasivas: corsé termoplástico, corrector de hallux valgus, casco craneal de bebé e inmovilizador de rodilla.","src":"img/ortesis-t1-tema-1-ortesis-y-protesis-historia-y-generalidades-p14.jpg"},{"tipo":"dato","valor":"2 + 3","texto":"Las activas/dinámicas tienen **2 subtipos** (funcionales dinámicas y activas correctoras); las estáticas/pasivas tienen **3** (pasivas correctoras, estabilizadoras o de soporte, pasivas protectoras)."},{"tipo":"alerta","texto":"Diferencia fina muy preguntada: la **activa correctora** corrige **solo mientras se lleva** (al retirarla, el segmento vuelve a su posición inicial); la **pasiva correctora** pertenece al grupo estático, cuyo objetivo es **mantener una posición** que el segmento no puede sostener por sí mismo."},{"tipo":"alerta","texto":"«Descargar o alinear» = **pasiva protectora**; «controlar un segmento y un ángulo articular» = **estabilizadora o de soporte**. No las intercambies."},{"tipo":"perla","texto":"En una parálisis del nervio radial (mano caída), una órtesis **funcional dinámica** con gomas extensoras sustituye la función de los extensores y permite usar la mano; en una rotura ligamentosa de rodilla en fase aguda, una órtesis **estabilizadora** controla el ángulo articular. Elegir el subtipo es elegir el objetivo terapéutico."}]},{"id":"reacciones-adversas","titulo":"Reacciones adversas de las órtesis","bloques":[{"tipo":"parrafo","texto":"Toda órtesis ejerce **presión** sobre la piel y **limita el movimiento**. De ahí derivan sus cuatro grupos de reacciones adversas: el contacto con el material (alergia), la compresión (circulación y úlceras) y la falta de movimiento (complicaciones de la inmovilización)."},{"tipo":"lista","items":["**Reacciones alérgicas al material** (dermatitis, urticaria por contacto).","**Restricción de la circulación periférica** → edema distal (leve, moderado o severo).","**Desarrollo de úlceras** por presión (prominencias óseas, juanete, dedos).","**Todas las complicaciones de la inmovilización** (rigidez, atrofia, pérdida de fuerza, etc.)."]},{"tipo":"esquema","titulo":"De la órtesis a la complicación","mermaid":"flowchart LR\n  O[\"Órtesis\"] --> C1[\"Contacto con material\"]\n  O --> C2[\"Presión / compresión\"]\n  O --> C3[\"Restricción de movimiento\"]\n  C1 --> R1[\"Reacción alérgica\"]\n  C2 --> R2[\"Restricción circulación periférica\"]\n  C2 --> R3[\"Úlceras\"]\n  R2 --> R2b[\"Edema distal\"]\n  C3 --> R4[\"Complicaciones de inmovilización\"]","pie":"Cada mecanismo de la órtesis explica una reacción adversa."},{"tipo":"perla","texto":"En cada revisión: inspecciona la piel al retirar la órtesis (enrojecimiento que no desaparece, flictenas), compara el perímetro distal con el contralateral (edema), pregunta por picor y programa movilización de las articulaciones libres para limitar las complicaciones de la inmovilización."}]},{"id":"historia-antiguedad","titulo":"Historia I: de Egipto a la Edad Media","bloques":[{"tipo":"parrafo","texto":"Órtesis y prótesis han servido para **beneficiar a gran parte de la población** y son **indispensables para volver a integrarse en la sociedad** y realizar las AVD. Con el tiempo se han mejorado en **más comodidad, más beneficio funcional y menos riesgo**."},{"tipo":"dato","valor":"3000/3500 a.C.","texto":"Origen aproximado de la protésica. **Los egipcios fueron los primeros pioneros** de la tecnología protésica."},{"tipo":"parrafo","texto":"Los egipcios fabricaban **extremidades protésicas rudimentarias con fibras** y las usaban más por la **sensación de «completitud» que por la función**. Se encontró una **momia con un primer dedo del pie protésico funcional**: el **Greville Chester toe** y el **Cairo toe** (pie de momia de unos 3.000 años, quizá la primera prótesis práctica). También eran enterrados con sandalias de oro con protectores de dedos (≈3.500 años)."},{"tipo":"tabla","titulo":"Antigüedad clásica (424 a.C. → 1 a.C.)","columnas":["Fecha","Hecho","Detalle"],"filas":[["424 a.C.","**Herodoto** describe a un vidente persa condenado a muerte","Se corta su propio pie y escapa con una **plantilla protésica de madera**"],["300 a.C. aprox. (desenterrada en **1858** en Italia)","**Capua Leg**","Pierna de **hierro y bronce con núcleo de madera**, de un **amputado transtibial**"],["218–210 a.C.","**2.ª Guerra Púnica**","**Manos de hierro** a soldados amputados para volver al campo de batalla"]]},{"tipo":"parrafo","texto":"En la **Alta Edad Media (476 → 1000)** hubo **pocos avances**: **gancho en la mano** y **pata de palo**. Las prótesis servían sobre todo para **esconder deformidades o heridas del campo de batalla**, con **poca atención a la funcionalidad**, y **solo los ricos** podían permitírselas para la vida diaria."},{"tipo":"alerta","texto":"Trampa de fechas: la Capua Leg **data del 300 a.C.**, pero **se desenterró en 1858**. Y era de un amputado **transtibial** (por debajo de la rodilla), no transfemoral."}]},{"id":"historia-renacimiento","titulo":"Historia II: Renacimiento y siglo XVI","bloques":[{"tipo":"parrafo","texto":"El **Renacimiento (1400–1800)** trae nuevas perspectivas para el arte, la filosofía, la ciencia y la medicina: es un **renacer de la historia protésica**, con dispositivos de **hierro, acero, cobre y madera**."},{"tipo":"tabla","titulo":"Hitos del siglo XVI","columnas":["Fecha","Protagonista","Aportación"],"filas":[["1508","**Götz von Berlichingen** (mercenario alemán)","Par de **manos de hierro tecnológicamente avanzadas** tras perder el brazo derecho en la batalla de **Landshut**; se fijaban con la mano natural y se movían soltando mecanismos de liberación y resortes, suspendidas con correas de cuero"],["≈1512","Cirujano italiano en Asia","Describe un **amputado bilateral de MS** que podía quitarse el sombrero y abrir la cartera; y un **brazo de plata** para el almirante **Barbarossa** (lucha contra los españoles en Bougie, Argelia)"],["1529","**Ambroise Paré**","Introduce **modernos procedimientos de amputación**"],["1536","**Ambroise Paré**","Prótesis para **amputados de MS e MI**; dispositivo **por encima de la rodilla** (pata de palo flexionable en la rodilla), pie de posición fija, **arnés ajustable, control de bloqueo de rodilla**"],["s. XVI","**Lorrain** (cerrajero francés, compañero de Paré)","Usa **cuero, papel y pegamento en lugar de hierro pesado**"]]},{"tipo":"definicion","termino":"Ambroise Paré","texto":"Barbero y cirujano del Ejército francés considerado **el padre de la cirugía de amputación y del diseño protésico moderno**. Su trabajo demostró por primera vez que se había comprendido **cómo debería funcionar una prótesis**."},{"tipo":"figura","pagina":26,"pie":"Ambroise Paré (centro) y sus diseños: pierna protésica con articulación de rodilla y arnés (izquierda) y mano mecánica articulada (derecha).","src":"img/ortesis-t1-tema-1-ortesis-y-protesis-historia-y-generalidades-p26.jpg"},{"tipo":"alerta","texto":"Paré: **1529 = amputación**, **1536 = prótesis**. Y quien sustituyó el hierro por **cuero, papel y pegamento** fue **Lorrain**, no Paré."}]},{"id":"historia-xvii-xix","titulo":"Historia III: siglos XVII–XIX y era moderna","bloques":[{"tipo":"esquema","titulo":"Línea temporal de la protésica moderna","mermaid":"flowchart TD\n  V[\"1696 Verduyn: transtibial sin bloqueo\"] --> PO[\"1800 Potts: Pierna de Anglesey\"]\n  PO --> SE[\"1839 Selpho: la lleva a EE. UU.\"]\n  SE --> SY[\"1843 Syme: amputación de tobillo\"]\n  SY --> PA[\"1846 Palmer: mejora la pierna Selpho\"]\n  PA --> BL[\"1858 Bly: pierna anatómica\"]\n  BL --> PM[\"1863 Parmelee: encaje de succión\"]\n  PM --> HE[\"1868 Hermann: aluminio\"]\n  HE --> HA[\"1871 Hanger: patente\"]\n  HA --> PE[\"1893 Péan: prótesis de hombro\"]\n  PE --> DE[\"1912 Desoutter: prótesis de aluminio\"]\n  DE --> MO[\"Hoy: microprocesadores, silicona, 3D\"]","pie":"Orden cronológico de los hitos citados en el PDF."},{"tipo":"tabla","titulo":"Hitos de los siglos XVII al XX","columnas":["Año","Protagonista","Aportación clave"],"filas":[["1696","**Pieter Verduyn**","**Primera prótesis por debajo de la rodilla sin mecanismo de bloqueo**; base de los actuales dispositivos de **articulación y corsé**"],["1800","**James Potts** (Londres)","Pierna de madera con encaje, **rodilla de acero** y **pie articulado controlado por tendones de cuerda de tripa de gato**; «**Pierna de Anglesey**» (Marqués de Anglesey, Waterloo)"],["1839","**William Selpho**","Lleva la pierna a EE. UU.: «**Pierna Selpho**»"],["1843","**Sir James Syme**","**Nuevo método de amputación de tobillo** que evita la del muslo: volver a caminar con **prótesis de pie** en lugar de pierna"],["1846","**Benjamin Palmer**","Mejora la pierna Selpho: **resorte anterior, aspecto suave y tendones escondidos**"],["1858","**Douglas Bly**","Patenta la **pierna anatómica Doctor Bly**, «el invento más completo y exitoso»"],["1863","**Dubois Parmelee**","**Encaje de succión, rodilla policéntrica y pie multiarticulado**"],["1868","**Gustav Hermann**","Propone **aluminio en lugar de acero**"],["1893","**Jules Émile Péan**","**Primera prótesis de hombro** (paciente de 37 años con tuberculosis)"],["1912","**Marcel Desoutter** (aviador inglés) y su hermano Charles","**Primera prótesis de aluminio**"]]},{"tipo":"figura","pagina":28,"pie":"Verduyn (prótesis transtibial con encaje de muslo, 1696), pie articulado de Potts (Pierna de Anglesey) y exarticulación de Syme.","src":"img/ortesis-t1-tema-1-ortesis-y-protesis-historia-y-generalidades-p28.jpg"},{"tipo":"figura","pagina":31,"pie":"Patente de Parmelee (1863): encaje de succión, rodilla policéntrica y pie multiarticulado; arriba, prótesis metálicas de la época.","src":""},{"tipo":"parrafo","texto":"**Hacia los tiempos modernos**: la **Guerra Civil estadounidense** multiplicó los amputados y obligó a EE. UU. a entrar en la protésica; **James Hanger**, uno de sus primeros amputados, patentó la «**Extremidad Hanger**» hecha con **duelas de barril cortadas** (patente de 1871). En la **Primera Guerra Mundial**, la escultora **Anna Coleman** creó prótesis y máscaras faciales para «los valientes sin rostro». Tras la **Segunda Guerra Mundial**, los veteranos exigieron mejoras y el gobierno de EE. UU. pactó con **compañías militares** para mejorar la función protésica en lugar de las armas."},{"tipo":"parrafo","texto":"Hoy los dispositivos son **mucho más livianos** (plástico, aluminio, materiales compuestos) y **más funcionales**; los **microprocesadores, chips y la robótica** permiten que el amputado **recupere su estilo de vida**, no solo una funcionalidad básica o un aspecto agradable; las **fundas de silicona** dan realismo (epítesis digitales). Ejemplos actuales: **yeso impreso en 3D «Osteoide»** combinado con ultrasonidos **LIPUS**, que acelera la curación de fracturas **hasta un 40 %**, y prótesis de pierna impresas en 3D."},{"tipo":"dato","valor":"hasta 40 %","texto":"Aceleración de la consolidación de fracturas con el yeso 3D «Osteoide» + ultrasonidos LIPUS (dato del PDF)."},{"tipo":"alerta","texto":"No mezcles las tres piernas: **Anglesey** = Potts (1800), **Selpho** = la misma llevada a EE. UU. (1839), **Palmer** = mejora de la Selpho (1846). El **encaje de succión y la rodilla policéntrica** son de **Parmelee (1863)**."},{"tipo":"perla","texto":"La amputación de **Syme** (desarticulación de tobillo) se valoró porque conserva longitud y permite **apoyo distal**: el paciente puede caminar con una prótesis de pie, con menor gasto energético que con una prótesis de pierna completa (razonamiento aplicado al PDF)."}]}],"caso_clinico":{"titulo":"Lucía, 34 años: de la amputación a la órtesis","presentacion":"Lucía, 34 años, sufrió un accidente de moto con **amputación transtibial derecha** y una **lesión del nervio radial izquierdo** (mano caída). Ingresa en rehabilitación: lleva un encaje provisional en el MI derecho y le han prescrito una férula para la mano izquierda. A las dos semanas refiere picor y enrojecimiento bajo la férula y edema en los dedos.","preguntas":[{"pregunta":"¿Qué dispositivo es prótesis y cuál órtesis? Justifícalo con las definiciones.","respuesta":"El dispositivo del MI derecho es una **prótesis** (exoprótesis) porque **sustituye una parte que falta** por amputación. La férula de la mano es una **órtesis**: dispositivo externo que **modifica la función** de un segmento que existe pero tiene un déficit neuromuscular."},{"pregunta":"¿Qué subtipo funcional de órtesis sería el más adecuado para la mano caída y por qué?","respuesta":"Una órtesis **activa/dinámica funcional dinámica**, con estabilizadores elásticos que **sustituyen la función muscular** de los extensores de muñeca y dedos, permitiendo usar la mano mientras se recupera el nervio. Una estática solo mantendría la posición."},{"pregunta":"¿Cómo interpretas el picor, el enrojecimiento y el edema digital?","respuesta":"Son **reacciones adversas** de la órtesis: posible **alergia al material**, **restricción de la circulación periférica** (edema distal) y riesgo de **úlceras** por presión. Hay que revisar el ajuste y el material, vigilar la piel y movilizar las articulaciones libres para evitar complicaciones de la inmovilización."}]},"preguntate":[{"pregunta":"Define prótesis y órtesis y explica la diferencia esencial.","respuesta":"La prótesis es una extensión artificial que reemplaza una parte del cuerpo que falta (amputación o agenesia). La órtesis es un apoyo externo que modifica aspectos funcionales o estructurales del sistema neuromusculoesquelético de un segmento que existe."},{"pregunta":"¿Cuáles son las tres funciones de una prótesis?","respuesta":"Restaurar la función biomecánica, la rehabilitación funcional (AVD, independencia, prevenir deformidades por desbalance del centro de gravedad) y la adaptación estética y psicológica."},{"pregunta":"¿Qué diferencia una endoprótesis de una exoprótesis? Da ejemplos.","respuesta":"La endoprótesis precisa cirugía y tiene diseño endoesquelético (cadera, hombro invertido, válvula cardiaca, neuroprótesis). La exoprótesis se puede retirar y es un aparato ortopédico (prótesis de pierna, digital)."},{"pregunta":"Explica la diferencia entre exoprótesis motoras y sensoriales.","respuesta":"Las motoras se ejecutan en una acción simple. En las sensoriales ambas extremidades informan de la relación con el entorno y se calcula automáticamente la fuerza que debe aplicar el aparato locomotor."},{"pregunta":"¿Qué es la energía interna y la externa de una prótesis?","respuesta":"Interna: el propio individuo mueve la articulación protésica con su aparato locomotor. Externa: sistemas mecánicos, hidráulicos o eléctricos movidos por pequeños motores con baterías."},{"pregunta":"Enumera los subtipos de órtesis estáticas/pasivas y su función.","respuesta":"Pasivas correctoras (corregir deformidad), estabilizadoras o de soporte (controlar segmento y ángulo articular) y pasivas protectoras (descargar o alinear un miembro)."},{"pregunta":"¿Qué ocurre al retirar una órtesis activa correctora?","respuesta":"El segmento vuelve a su posición inicial: solo corrige la deformidad mientras se lleva puesta."},{"pregunta":"¿Cuáles son las reacciones adversas de las órtesis?","respuesta":"Reacciones alérgicas al material, restricción de la circulación periférica, úlceras y todas las complicaciones de la inmovilización."},{"pregunta":"¿Por qué Ambroise Paré es una figura clave?","respuesta":"Es el padre de la cirugía de amputación y del diseño protésico moderno: introdujo la amputación moderna (1529), prótesis de MS y MI (1536) con bloqueo de rodilla y arnés ajustable."},{"pregunta":"¿Qué aportó Parmelee en 1863 y qué Hermann en 1868?","respuesta":"Parmelee: encaje de succión, rodilla policéntrica y pie multiarticulado. Hermann: propuso el aluminio en lugar del acero para aligerar las prótesis."}],"glosario":[{"termino":"Prótesis","definicion":"Extensión artificial que reemplaza una parte del cuerpo que falta."},{"termino":"Órtesis","definicion":"Dispositivo externo que modifica aspectos funcionales o estructurales del sistema neuromusculoesquelético."},{"termino":"Agenesia","definicion":"Ausencia congénita de un órgano o segmento corporal."},{"termino":"Endoprótesis","definicion":"Prótesis colocada quirúrgicamente, de diseño endoesquelético."},{"termino":"Exoprótesis","definicion":"Prótesis retirable, considerada aparato ortopédico."},{"termino":"Neuroprótesis","definicion":"Dispositivo implantado que interactúa con el sistema nervioso (p. ej., electrodos corticales)."},{"termino":"Amputación transtibial","definicion":"Amputación por debajo de la rodilla, a nivel de la tibia (caso de la Capua Leg)."},{"termino":"Encaje de succión","definicion":"Encaje que se sujeta al muñón por presión negativa; introducido por Parmelee (1863)."},{"termino":"Rodilla policéntrica","definicion":"Articulación protésica de rodilla con varios centros de rotación."},{"termino":"Amputación de Syme","definicion":"Amputación/desarticulación a nivel del tobillo descrita en 1843."},{"termino":"Órtesis funcional dinámica","definicion":"Órtesis activa que sustituye una función muscular."},{"termino":"Órtesis pasiva protectora","definicion":"Órtesis estática que descarga o alinea un miembro."}],"fuentes":["Gorino, C. (2020). A short history of prosthetics. Synergy DMEPOS Blog.","Otte, A., & Hazubski, S. (2021). The Ancient Artificial Leg of Capua: First 3D Print after 2300 Years.","Valentinuzzi, M. E., & López Celani, N. M. (2019). Physical rehabilitation: A historical look. IEEE Pulse, 10(6), 13–16.","Medical College of Wisconsin (2014). History of physical medicine and rehabilitation.","Norton, K. M. (2007). A brief history of prosthetics. In Motion, 17(7).","van den Brand, R. et al. (2015). Neuroprosthetic technologies to augment the impact of neurorehabilitation after spinal cord injury. Ann. Phys. Rehabil. Med., 58(4), 232–237.","Thomas, T. (2023). Prosthetics through the ages. MedlinePlus Magazine.","Benito Pascual, A. M. (2017). Restauración de la función visual con el implante de retina Argus II."],"qcm":[{"pregunta":"Un niño nace sin mano derecha por una malformación congénita y se le adapta un dispositivo que la reemplaza. Según el temario, ¿cómo se denomina ese dispositivo?","opciones":["Órtesis pasiva protectora, porque alinea el antebrazo","Órtesis funcional dinámica, porque asiste la prensión","Endoprótesis, porque se adapta desde el nacimiento","Prótesis, porque sustituye una parte que no existe por agenesia"],"correcta":3,"explicacion":"La prótesis sustituye una parte del cuerpo perdida por amputación o que no existe por agenesia. Al faltar el segmento, el dispositivo es una prótesis, no una órtesis.","por_opcion":["❌ Descargar o alinear es función de órtesis pasiva protectora, sobre un segmento existente.","❌ La órtesis modifica un segmento que existe; aquí falta la mano.","❌ Endoprótesis implica colocación quirúrgica y diseño endoesquelético, no la edad de adaptación.","✅ La agenesia es una de las causas de ausencia que justifican una prótesis."]},{"pregunta":"¿Cuál de los siguientes ejemplos corresponde a una prótesis cuya función es estrictamente estética según el PDF?","opciones":["Válvula cardiaca mecánica","Implante de retina Argus II","Prótesis ocular","Prótesis invertida de hombro"],"correcta":2,"explicacion":"El PDF cita las prótesis oculares y las mamarias como prótesis de función estrictamente estética.","por_opcion":["❌ Es una endoprótesis con función vital (hemodinámica).","❌ Busca restaurar una función sensorial (visión), no solo estética.","✅ Junto a las mamarias, ejemplo de prótesis estética pura.","❌ Es una endoprótesis con función biomecánica."]},{"pregunta":"Prevenir deformidades posturales por desbalance del centro de gravedad se encuadra dentro de qué función de la prótesis:","opciones":["Adaptación estética y psicológica","Restaurar la función biomecánica","Soporte y estabilidad articular","Rehabilitación funcional"],"correcta":3,"explicacion":"El PDF incluye en la rehabilitación funcional la reintegración a las AVD, la independencia y la prevención de deformidades posturales o problemas por desbalance corporal (centro de gravedad).","por_opcion":["❌ Se refiere a imitar la apariencia y mejorar la autoestima.","❌ Incluye suplir funciones perdidas, reproducir movimiento articular y dar soporte.","❌ «Proveer soporte y estabilidad» pertenece a la función biomecánica, no a este ítem.","✅ Es el apartado donde el PDF sitúa el centro de gravedad."]},{"pregunta":"Una prótesis de cadera con cotilo, inserto, cabeza femoral y vástago es un ejemplo de:","opciones":["Exoprótesis sensorial de energía externa","Endoprótesis de diseño endoesquelético","Exoprótesis motora de acción simple","Órtesis estabilizadora de soporte"],"correcta":1,"explicacion":"Las endoprótesis precisan procedimientos quirúrgicos para su colocación y tienen un diseño endoesquelético; la prótesis de cadera es el ejemplo del PDF.","por_opcion":["❌ No es retirable ni calcula fuerzas con información del entorno.","✅ Colocación quirúrgica y diseño endoesquelético.","❌ Las exoprótesis se pueden retirar; la de cadera no.","❌ Sustituye una articulación; una órtesis no reemplaza estructuras."]},{"pregunta":"Respecto a las exoprótesis sensoriales, ¿qué afirmación es correcta según el temario?","opciones":["Requieren siempre colocación quirúrgica de electrodos","Son las que funcionan exclusivamente con energía interna","Se ejecutan en una acción simple sin retroalimentación","Calculan automáticamente la fuerza que debe aplicarse según el entorno"],"correcta":3,"explicacion":"En las exoprótesis sensoriales ambas extremidades informan de la relación con el entorno y se calcula automáticamente la cantidad de fuerza que debe aplicar el aparato locomotor.","por_opcion":["❌ Las exoprótesis son retirables; la cirugía define a las endoprótesis.","❌ La clasificación por energía es un criterio distinto.","❌ Esa es la definición de exoprótesis motora.","✅ Definición literal del PDF."]},{"pregunta":"Una prótesis cuya articulación se mueve mediante pequeños motores alimentados por baterías se clasifica por su energía como:","opciones":["Externa, por usar sistemas eléctricos que actúan de forma indirecta","Externa, porque es una exoprótesis retirable","Interna, porque el motor está dentro del encaje","Interna, porque la activa la contracción del usuario"],"correcta":0,"explicacion":"La energía externa corresponde a sistemas mecánicos, hidráulicos o eléctricos que actúan de forma indirecta, movidos por pequeños motores con baterías.","por_opcion":["✅ Motores y baterías definen la energía externa.","❌ Exo/endo es otro criterio (colocación), no la fuente de energía.","❌ «Interna» se refiere a que el propio individuo mueve la articulación, no a la localización del motor.","❌ En la energía interna el movimiento lo produce el aparato locomotor del individuo, sin motor."]},{"pregunta":"¿Cuál NO figura entre los materiales de prótesis enumerados en el PDF?","opciones":["Fibra de carbono","Láminas de titanio","Plástico","Resina"],"correcta":0,"explicacion":"El PDF enumera cuatro materiales: plástico, láminas de titanio, resina y metal. La fibra de carbono no aparece en esa clasificación.","por_opcion":["✅ No está en la lista del PDF.","❌ Figura como material 2.","❌ Figura como material 1.","❌ Figura como material 3."]},{"pregunta":"Una órtesis corrige una deformidad mientras se lleva puesta, pero al retirarla el segmento vuelve a su posición inicial. Se trata de una órtesis:","opciones":["Estabilizadora o de soporte","Activa correctora","Pasiva correctora","Funcional dinámica"],"correcta":1,"explicacion":"La activa correctora, dentro de las activas/dinámicas, corrige la deformidad mientras se lleva puesta; al quitarla, el segmento vuelve a su posición inicial.","por_opcion":["❌ Controla un segmento y un ángulo articular.","✅ Definición literal del PDF.","❌ Pertenece a las estáticas/pasivas; su definición no incluye el retorno al retirarla.","❌ Sustituye una función muscular, no corrige una deformidad."]},{"pregunta":"Una órtesis cuya función es descargar un miembro o alinearlo pertenece al grupo de:","opciones":["Activas, subtipo activa correctora","Estáticas, subtipo pasiva protectora","Estáticas, subtipo estabilizadora o de soporte","Activas, subtipo funcional dinámica"],"correcta":1,"explicacion":"Las pasivas protectoras, dentro de las estáticas/pasivas, tienen como función descargar un miembro o alinearlo.","por_opcion":["❌ Corrige una deformidad mientras se lleva.","✅ Descargar o alinear = pasiva protectora.","❌ Controla un segmento y un ángulo articular.","❌ Sustituye una función muscular."]},{"pregunta":"Las órtesis activas o dinámicas se definen en el PDF como aquellas que:","opciones":["Controlan un segmento y un ángulo articular determinado","Mantienen un segmento en una posición que no puede sostener por sí mismo","Sustituyen de forma mecánica una función muscular o ligamentosa","Se usan solo en trastornos limitados en el tiempo"],"correcta":2,"explicacion":"Las activas/dinámicas sustituyen de forma mecánica una función muscular o ligamentosa y se dividen en funcionales dinámicas y activas correctoras.","por_opcion":["❌ Corresponde a las estabilizadoras o de soporte.","❌ Es la definición de las estáticas/pasivas.","✅ Definición literal del grupo activo.","❌ Describe las temporales (criterio de tiempo)."]},{"pregunta":"¿Cuál de las siguientes NO es una reacción adversa de las órtesis citada en el PDF?","opciones":["Rechazo inmunológico del implante","Restricción de la circulación periférica","Complicaciones de la inmovilización","Desarrollo de úlceras"],"correcta":0,"explicacion":"El PDF cita alergia al material, restricción de la circulación periférica, úlceras y todas las complicaciones de la inmovilización. El rechazo de un implante no aplica a un dispositivo externo.","por_opcion":["✅ Las órtesis son externas; no hay implante que rechazar.","❌ Sí figura en el PDF.","❌ Sí figura («todas las complicaciones de la inmovilización»).","❌ Sí figura en el PDF."]},{"pregunta":"Sobre la Capua Leg, es correcto que:","opciones":["Fue diseñada por Herodoto en el 424 a.C.","Era de hierro macizo sin componentes de madera","Data de 1858 y era de un amputado transfemoral","Data del 300 a.C. aprox. y era de un amputado transtibial"],"correcta":3,"explicacion":"La Capua Leg se desenterró en Italia en 1858, pero data del 300 a.C. aprox.; era de hierro y bronce con núcleo de madera y pertenecía a un amputado transtibial.","por_opcion":["❌ Herodoto narra la plantilla de madera del vidente persa.","❌ Tenía núcleo de madera recubierto de hierro y bronce.","❌ 1858 es la fecha del hallazgo y era transtibial.","✅ Fecha y nivel de amputación correctos."]},{"pregunta":"¿A quién atribuye el PDF el uso de cuero, papel y pegamento en lugar de hierro pesado para fabricar prótesis?","opciones":["Ambroise Paré","Pieter Verduyn","Lorrain","Götz von Berlichingen"],"correcta":2,"explicacion":"Lorrain, cerrajero francés compañero de Paré, hizo una de las contribuciones más importantes al usar cuero, papel y pegamento en lugar de hierro pesado.","por_opcion":["❌ Paré introdujo la amputación moderna y prótesis con bloqueo de rodilla.","❌ Verduyn creó la primera prótesis transtibial sin bloqueo (1696).","✅ Aportación de Lorrain.","❌ Fue el mercenario que llevó manos de hierro (1508)."]},{"pregunta":"La prótesis con encaje de succión, rodilla policéntrica y pie multiarticulado fue inventada por:","opciones":["Douglas Bly en 1858","Benjamin Palmer en 1846","James Potts en 1800","Dubois Parmelee en 1863"],"correcta":3,"explicacion":"En 1863 Dubois Parmelee inventó una prótesis avanzada con encaje de succión, rodilla policéntrica y pie multiarticulado.","por_opcion":["❌ Bly patentó la pierna anatómica Doctor Bly.","❌ Palmer añadió resorte anterior, aspecto suave y tendones escondidos a la pierna Selpho.","❌ Potts diseñó la pierna de Anglesey con pie controlado por tendones de tripa de gato.","✅ Aportación de Parmelee."]},{"pregunta":"¿Cuál de las siguientes asociaciones es correcta?","opciones":["Hermann (1868): aluminio en lugar de acero","Desoutter (1912): pierna con duelas de barril","Péan (1893): amputación de tobillo","Syme (1843): primera prótesis de hombro"],"correcta":0,"explicacion":"Gustav Hermann sugirió en 1868 el aluminio en lugar del acero; Syme describió la amputación de tobillo (1843), Péan la primera prótesis de hombro (1893) y Hanger la extremidad con duelas de barril.","por_opcion":["✅ Asociación correcta.","❌ Desoutter fabricó la primera prótesis de aluminio; las duelas de barril son de Hanger.","❌ Péan realizó la primera prótesis de hombro.","❌ Syme describió un nuevo método de amputación de tobillo."]}],"asignatura":"Ortesis","tema":1,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
