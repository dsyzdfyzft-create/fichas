<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 10 · Exoprótesis · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 10 · Exoprótesis","subtitulo":"Prótesis craneofaciales y musculoesqueléticas, clasificación K de Medicare, osteointegración, componentes de la prótesis de miembro inferior (liner, encaje, suspensión, rodilla, pie) y prótesis de miembro superior con sus escalas.","resumen":["Una **exoprótesis** reemplaza una parte del cuerpo **desde fuera** (frente a la **endoprótesis**, interna) y puede ser **mecánica, mioeléctrica o híbrida**; las craneofaciales restauran estética y función y se fijan con **adhesivos o implantes osteointegrados**.","Los **K levels (Medicare, 1995)** van de **K0 a K4** y predicen el potencial protésico del amputado de MMII según capacidad de deambular, cadencia y barreras; **no son estáticos** y se apoyan en **AMP (21 ítems, 42 puntos)**, **TUG** y **6MWT**.","La **prótesis osteointegrada** (fixture intraóseo de titanio + abutment transcutáneo + mecanismo de desacoplamiento) **elimina el encaje**, mejora ROM de cadera, marcha y **osteopercepción**, pero está **contraindicada en osteoporosis** o riesgo infeccioso.","La prótesis de MI se compone de **liner/calcetines, encaje, pilón, articulaciones y pie**; el encaje puede ser de **contacto total** o de **carga selectiva (PTB)** y la suspensión por **correa, pin-lock, succión o vacío activo**.","La rodilla se define por **eje (monocéntrica/policéntrica), fricción (constante, variable, hidráulica, microprocesador), ayuda a la extensión y estabilizador**; el pie va del **SACH** (baja función) al **ESAR de fibra de carbono** (estándar de oro en activos), y en MMSS **no hay K levels**: se valora con **SHAP, ARAT y DASH/QuickDASH**."],"objetivos":["Clasificar las prótesis (craneofaciales, endoprótesis, exoprótesis) y describir las principales prótesis craneofaciales.","Asignar un K level a un amputado de MMII y conocer las pruebas que lo justifican.","Explicar la osteointegración: componentes, ventajas e indicaciones/contraindicaciones.","Elegir liner, encaje, suspensión, rodilla y pie según el perfil funcional del paciente.","Diferenciar los tipos de prótesis de MMSS y sus escalas de valoración funcional."],"ideas_clave":["**Endoprótesis** = interna (articulares; la osteosíntesis no es prótesis funcional sino sustituto estructural); **exoprótesis** = externa.","**K0** no deambula ni con ayuda; **K1** doméstico, cadencia fija; **K2** comunitario limitado, barreras bajas; **K3** comunitario, **cadencia variable**; **K4** alto impacto (niños, activos, atletas).","Se asigna el K level según el **potencial real** tras rehabilitación y encaje óptimo, no por lo que hace en la primera semana; **puede subir** (K1/K2 → K3).","**AMP**: 21 ítems, **42 puntos**, versiones **AMPnoPRO** (sin prótesis, predice) y **AMPPRO** (con prótesis, mide); **TUG**: levantarse, **3 m**, girar y sentarse; **6MWT**: distancia en 6 min.","OI: **fixture** (vástago de titanio intramedular), **abutment** (transcutáneo) y **fail-safe release** que protege de la fractura periprotésica.","Encaje de **contacto total** = mejor reparto y control; **carga selectiva (PTB)** = protege zonas frágiles pero menos control.","Rodilla **monocéntrica** = sencilla, baja actividad; **policéntrica** = más fisiológica; fricción **constante → baja**, **variable → moderada**, **hidráulica → alta** actividad.","Pie **SACH** = el más usado, sin movilidad, baja funcionalidad; **ESAR** = efecto muelle, estándar de oro para activos."],"secciones":[{"id":"clasificacion","titulo":"Prótesis: clasificación y prótesis craneofaciales","bloques":[{"tipo":"definicion","termino":"Prótesis","texto":"Dispositivo artificial que reemplaza partes del cuerpo: **craneofaciales** (hemifaciales, auriculares, dentales, nasales, oculares), **órganos internos** (corazón, vejiga, estómago), **cuello** (tráquea, esófago superior) y **extremidades** (MMII, MMSS)."},{"tipo":"parrafo","texto":"La **prótesis facial** es un dispositivo externo que sustituye una parte perdida o deformada del rostro tras **traumatismos, cirugía oncológica, malformaciones congénitas** o enfermedades destructivas (infecciones graves, quemaduras). Sus objetivos: **1)** restaurar la estética facial, **2)** proteger estructuras subyacentes (cavidades nasales u orbitarias), **3)** mejorar la función (respiración, fonación, alimentación) y **4)** favorecer la integración social y emocional."},{"tipo":"tabla","titulo":"Prótesis craneofaciales","columnas":["Prótesis","Indicación","Material","Fijación"],"filas":[["**Nasal**","Pérdida parcial/total de nariz por traumatismo, carcinoma, infección o quemadura","Silicona médica pigmentada, acrílicos o resinas","Adhesivos o implantes osteointegrados en hueso nasal o maxilar"],["**Ocular** (ojo artificial)","Tras **enucleación o evisceración** del globo","**Acrílico**","—"],["**Orbitaria**","Tumores orbitarios, traumatismos, infecciones graves; sustituye párpados, ceja y parte del pómulo","**Silicona médica**","Adhesivos o implantes de titanio en el reborde orbitario"],["**Auricular**","Ausencia congénita (**microtia**) o pérdida traumática/quirúrgica","Silicona médica flexible pigmentada","Adhesivos o implantes en zona **mastoidea**"],["**Labial / maxilofacial parcial**","Resección de labios, mejillas o maxilar; a veces con **obturadores** intraorales","—","—"],["**Combinada (maxilofacial)**","Cirugía oncológica amplia (maxilectomía): componentes intra y extraorales","—","Implantes, adhesivos o sistemas **magnéticos**"]]},{"tipo":"alerta","texto":"Prótesis **ocular** = **acrílico** y sustituye solo el globo; prótesis **orbitaria** = **silicona** y sustituye toda la región periorbitaria. La auricular se ancla en la **mastoides**, la nasal en hueso **nasal o maxilar**."}]},{"id":"endo-exo","titulo":"Prótesis musculoesqueléticas: endoprótesis y exoprótesis","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"Interna","titulo":"Endoprótesis articular","texto":"Sustituye una articulación completa (cadera, rodilla, hombro); titanio, acero, cerámica y polietileno; restaura el movimiento y alivia el dolor por artrosis o fractura."},{"etiqueta":"Interna","titulo":"Osteosíntesis","texto":"Clavos, placas o tornillos: **no son prótesis funcionales**, sino sustitutos estructurales temporales o permanentes del hueso."},{"etiqueta":"Externa","titulo":"Exoprótesis","texto":"Dispositivo que reemplaza o complementa una parte ausente o dañada y se coloca **fuera del cuerpo**: recupera función, mejora la estética y ayuda a la reintegración. Puede ser **mecánica, mioeléctrica o híbrida**."}]},{"tipo":"perla","texto":"Para el fisioterapeuta la exoprótesis es parte del tratamiento: su elección depende de la valoración funcional (K level en MI, escalas en MS) y su uso eficaz depende del entrenamiento (fases protésicas del tema 9)."}]},{"id":"k-levels","titulo":"Clasificación K (Medicare Functional Classification Level)","bloques":[{"tipo":"parrafo","texto":"El **K level** o predictor de movilidad para amputados fue establecido en **1995 por Medicare (EE. UU.)** y hoy se usa en todo el mundo. Evalúa la **necesidad y los beneficios potenciales** de los componentes protésicos en el amputado de **MMII**. Oscila de **0 a 4** y refleja la capacidad de usar una prótesis **si tiene acceso a un dispositivo adecuado y ha completado la rehabilitación**."},{"tipo":"tabla","titulo":"Niveles K","columnas":["Nivel","Capacidad","Perfil típico"],"filas":[["**K0**","Sin capacidad ni potencial para deambular o trasladarse con seguridad, ni con ayuda; la prótesis **no mejora** su calidad de vida ni movilidad","No candidato a prótesis funcional"],["**K1**","Prótesis para **transferencias** o deambular en superficies **planas** a **cadencia fija**","Deambulador **doméstico** limitado e ilimitado"],["**K2**","Deambula y supera **barreras de bajo nivel** (bordillos, escaleras, superficies irregulares)","Deambulador **comunitario limitado**"],["**K3**","Deambula con **cadencia variable**, atraviesa la mayoría de barreras; actividades vocacionales, terapéuticas o de ejercicio","Deambulador **comunitario**"],["**K4**","Supera las habilidades básicas: **alto impacto, estrés o energía**","**Niños, adultos activos o atletas**"]]},{"tipo":"tabla","titulo":"Pruebas funcionales para asignar el K level","columnas":["Prueba","Qué mide","Detalle examinable"],"filas":[["**AMP** (Amputee Mobility Predictor, Gailey)","Equilibrio sentado y de pie, transferencias, levantarse, girar, obstáculos, escaleras","**21 ítems, 42 puntos**; **AMPnoPRO** (sin prótesis: predice potencial) y **AMPPRO** (con prótesis: mide desempeño)"],["**TUG** (Timed Up and Go)","Tiempo en levantarse, caminar **3 m**, girar y volver a sentarse","Movilidad funcional y equilibrio"],["**6MWT**","Distancia recorrida a ritmo normal en **6 min**","Resistencia"]]},{"tipo":"dato","valor":"21 ítems / 42 ptos","texto":"Estructura del **AMP**, la escala clínica de referencia para predecir el K level."},{"tipo":"esquema","titulo":"Asignación del K level","mermaid":"flowchart TD\n  A[\"Amputado de MMII\"] --> B[\"Historia y estado fisico: fuerza proximal, equilibrio, vision, cardiorrespiratorio, pierna sana\"]\n  B --> C[\"Pruebas: AMP, TUG, 6MWT\"]\n  C --> D[\"Entorno y demandas diarias\"]\n  D --> E[\"Potencial tras rehabilitacion y encaje optimo\"]\n  E --> K1[\"Solo casa, superficie plana: K1\"]\n  E --> K2[\"Calle, bordillos, escalones: K2\"]\n  E --> K3[\"Trabajo activo, velocidad variable: K3 o K4\"]\n  K1 -->|\"fisioterapia\"| K2\n  K2 -->|\"fisioterapia\"| K3","pie":"El K level valora el potencial real y puede progresar con la rehabilitación."},{"tipo":"alerta","texto":"Los K levels **no son estáticos ni definitivos**: se valora el **potencial** una vez completado el entrenamiento y con encaje óptimo, no lo que hace la primera semana. Subir de K2 a K3 **justifica cambiar componentes** (p. ej. de rodilla mecánica básica a rodilla con microprocesador)."},{"tipo":"alerta","texto":"Trampa: **cadencia fija** = K1; **cadencia variable** = K3. Las **barreras de bajo nivel** (bordillos, escaleras) son lo que define a K2."}]},{"id":"osteointegracion","titulo":"Prótesis osteointegrada (OI)","bloques":[{"tipo":"definicion","termino":"Osteointegración (Direct Skeletal Fixation, DSF)","texto":"El implante se coloca quirúrgicamente **dentro del hueso** y **atraviesa la piel**, de modo que la prótesis externa se acopla **directamente al esqueleto**. Posible en amputaciones por encima y por debajo de rodilla y de codo, uni o bilaterales, prótesis digitales y, menos habitual, escápula y pelvis."},{"tipo":"tarjetas","items":[{"etiqueta":"Interno","titulo":"Fixture (anclaje)","texto":"Vástago intraóseo de **titanio** insertado en el **canal medular** del hueso residual."},{"etiqueta":"Transcutáneo","titulo":"Abutment (pilar/estoma)","texto":"Pieza que **atraviesa la piel** y sobresale al exterior."},{"etiqueta":"Seguridad","titulo":"Fail-safe release","texto":"Dispositivo de desacoplamiento que se **rompe o suelta ante un impacto brusco o caída grave**, protegiendo al hueso de una **fractura periprotésica**."}]},{"tipo":"figura","pagina":22,"pie":"Esquema de la OI: fixture dentro del hueso, abutment atravesando la piel.","src":"img/ortesis-t10-tema-10-exoprotesis-p22.jpg"},{"tipo":"lista","items":["**1.** Evita los problemas de partes blandas del encaje (presión, sudor, irritación, dolor).","**2.** Mejora el **ROM de cadera** (el borde del encaje puede bloquear la articulación proximal).","**3.** Mejora la velocidad y capacidad de marcha (**TUG y 6MWT**).","**4.** Reduce problemas musculoesqueléticos por mejor alineación hueso-prótesis.","**5.** **Osteopercepción**: fenómeno multisensorial; la vibración de la prótesis en el hueso da sensaciones táctiles a través del implante.","**6.** Mejora la calidad de vida (**LIFE-H, SF-36, Q-TFA**)."]},{"tipo":"perla","texto":"Indicación típica: **primera o segunda opción** en pacientes con **cambios volumétricos del muñón, dolor o lesiones cutáneas por el encaje**, o limitación de flexión de cadera por los bordes rígidos del encaje (Thomson et al., 2019, describen la remodelación ósea proximal tras OI)."},{"tipo":"alerta","texto":"La OI está **contraindicada en osteoporosis** y en pacientes con riesgo de complicaciones **infecciosas o inflamatorias** (riesgo de rechazo muy grande). Un muñón con mala calidad ósea no es candidato aunque tenga muchos problemas de encaje."}]},{"id":"componentes","titulo":"Componentes de la exoprótesis de MI: liner, calcetines, encaje y suspensión","bloques":[{"tipo":"tabla","titulo":"Elementos protésicos","columnas":["Elemento","Función"],"filas":[["**Calcetines y liner**","Funda/recubrimiento interno sobre el muñón antes de colocar la prótesis"],["**Encaje (socket)**","Componente **proximal**: aloja el muñón"],["**Estructura (pylon)**","Equivalente al esqueleto: da solidez"],["**Articulaciones (joint)**","Suplen el movimiento articular"],["**Pie (SACH / prosthetic foot)**","Conjunto terminal que imita la función pie-tobillo"]]},{"tipo":"figura","pagina":25,"pie":"Prótesis transtibial y transfemoral con sus capas: liner de gel, encaje, rodilla, pilón y pie.","src":"img/ortesis-t10-tema-10-exoprotesis-p25.jpg"},{"tipo":"parrafo","texto":"**Calcetines**: los llevan todos los portadores de prótesis **excepto los de succión total o los que usan funda**. Existen en varios grosores (capas) y materiales (algodón, lana, licra). Sirven para **1)** ajustar el encaje a los cambios de volumen del muñón durante el día (si queda flojo se **añaden**, si aprieta se **quitan**), **2)** proteger la piel (sudor, fricción, ampollas), **3)** comodidad térmica e higiene, y **4)** repartir la presión. **Liner**: funda de silicona, gel o poliuretano con los mismos objetivos pero **muy costosa**; por eso, cuando el muñón **decrece**, se añaden calcetines por encima o por debajo."},{"tipo":"tabla","titulo":"Tipos de encaje y de suspensión","columnas":["Tipo","Descripción","Ventajas","Inconvenientes"],"filas":[["**Contacto total**","Toda la superficie del muñón contacta con el encaje","Mejor reparto de cargas, sin presión puntual, más control; uso en TT y TF modernas","—"],["**Carga selectiva** (p. ej. **PTB**, Patellar Tendon Bearing)","Apoya en zonas específicas (patelar, isquiática) y descarga zonas sensibles","Protege áreas frágiles o cicatrices","Menor contacto global → **menor control**"],["**Cinturón o correa**","Banda alrededor del muslo o la pelvis","Fácil de colocar","Menor estética y estabilidad; TT antiguas, poca actividad"],["**Pin-lock**","Liner de silicona con **pin distal** que se bloquea en el encaje","Buena suspensión, fácil de colocar","**Tracción distal** en el muñón"],["**Succión** (vacío pasivo)","Válvulas crean vacío y presión negativa","Muy buena suspensión, sensación natural","Ajuste muy preciso y buen sellado"],["**Vacío activo** (asistido)","Bomba mecánica o electrónica mantiene vacío constante","Excelente ajuste, control y confort","Mayor coste y mantenimiento"]]},{"tipo":"parrafo","texto":"La **suspensión** es lo que mantiene el muñón dentro del encaje e impide que la prótesis se caiga al levantar la pierna. Una buena suspensión mejora la transferencia de energía y el control y reduce molestias y abrasiones; una deficiente produce **heridas o mal uso**. Su elección exige valorar forma y longitud del muñón, **fuerza, destreza manual, vista y equilibrio** en bipedestación."},{"tipo":"figura","pagina":31,"pie":"Encaje de contacto total frente a encaje de carga selectiva PTB.","src":"img/ortesis-t10-tema-10-exoprotesis-p31.jpg"},{"tipo":"perla","texto":"Si un paciente refiere que «la prótesis le baila» por la tarde, piensa primero en **pérdida de volumen** del muñón: añadir capas de calcetín. Si aparece enrojecimiento en el extremo distal con un sistema **pin-lock**, sospecha **tracción distal**."}]},{"id":"rodilla","titulo":"Unidades de rodilla protésica","bloques":[{"tipo":"parrafo","texto":"Las rodillas protésicas se describen por **4 características**: **eje**, **mecanismo de fricción**, **ayuda a la extensión** y **estabilizador mecánico**. El eje determina la libertad de movimiento; la fricción modifica la **velocidad de oscilación** de la rodilla en las distintas fases de la marcha; la ayuda a la extensión **asiste el retorno a la extensión** tras la flexión (p. ej. en el balanceo)."},{"tipo":"tarjetas","items":[{"etiqueta":"Eje","titulo":"Monocéntrica (bisagra de un eje)","texto":"Un único eje de rotación, flexoextensión en un punto correlacionado con el eje anatómico; **más sencilla**, para **menor actividad**."},{"etiqueta":"Eje","titulo":"Policéntrica","texto":"**Varios ejes** de rotación: movimiento más parecido a la rodilla biológica, **más fluidez** al caminar y cambiar de ritmo."}]},{"tipo":"tabla","titulo":"Mecanismos de fricción","columnas":["Mecanismo","Funcionamiento","Paciente ideal"],"filas":[["**Fricción constante**","Resistencia uniforme durante toda la fase","Actividad **baja**"],["**Fricción variable**","Más fricción al inicio y al final del movimiento","Actividad **moderada**"],["**Hidráulico**","Ajusta automáticamente la fricción a la velocidad","Actividad **alta**"],["**Microprocesador** (microtransformadores)","Un chip da respuesta fluida a los cambios de velocidad","Más avanzadas y costosas"]]},{"tipo":"esquema","titulo":"Del nivel de actividad a la rodilla","mermaid":"flowchart LR\n  A[\"Baja actividad K1\"] --> A1[\"Monocentrica + friccion constante\"]\n  B[\"Actividad moderada K2\"] --> B1[\"Friccion variable\"]\n  C[\"Alta actividad K3 K4\"] --> C1[\"Policentrica + hidraulica\"]\n  C1 --> C2[\"Microprocesador si hay recursos\"]","pie":"Relación orientativa entre nivel funcional y tipo de rodilla según el temario."},{"tipo":"figura","pagina":36,"pie":"Rodilla monocéntrica (un eje) frente a policéntrica (varios ejes).","src":"img/ortesis-t10-tema-10-exoprotesis-p36.jpg"},{"tipo":"alerta","texto":"La fricción **hidráulica** se ajusta **automáticamente** a la velocidad (activo); la **variable** solo aumenta la fricción al inicio y final del recorrido (moderado). No las confundas."}]},{"id":"pie","titulo":"Ensamblaje tobillo-pie","bloques":[{"tipo":"parrafo","texto":"El ensamblaje tobillo-pie une la sección distal con el pilón y restaura el contorno del pie; puede ser **fijo** (sin movimiento) o **articulado** (movilidad controlada)."},{"tipo":"tabla","titulo":"Tipos de pie protésico","columnas":["Pie","Características","Indicación / inconvenientes"],"filas":[["**SACH** (Solid Ankle Cushion Heel) – no articulado","Una pieza, tobillo firme y talón almohadillado; **el más utilizado**; ligero, duradero, estético; sin movilidad (bloqueo a 90°), algo de flexión por compresión del talón; talones de varias alturas","**Baja funcionalidad**: TF o TT, uni o bilateral, cadera y desarticulación de rodilla"],["**Eje sencillo** – articulado","Flexión dorsal y plantar; menos esfuerzo para controlar la prótesis porque evita doblar en exceso la rodilla","Altos niveles de amputación, personas que necesitan **estabilidad**; **no recomendable bajo rodilla**; más caro"],["**Eje múltiple** – articulado","Flexión dorsal/plantar + **inversión/eversión**; absorbe impactos y previene problemas dermatológicos","Terreno irregular, más libertad; **mayor tiempo de adaptación**"],["**ESAR** (fibra de carbono)","Almacena y devuelve energía (efecto muelle); diseños **split-toe**","**Estándar de oro** para pacientes activos"]]},{"tipo":"esquema","titulo":"Efecto muelle del pie ESAR","mermaid":"flowchart LR\n  A[\"Apoyo inicial y medio\"] -->|\"carga\"| B[\"Laminas de carbono se flexionan\"]\n  B --> C[\"Almacenan energia cinetica\"]\n  C --> D[\"Despegue toe-off\"]\n  D -->|\"liberan energia\"| E[\"Impulso hacia delante\"]\n  E --> F[\"Imita gemelo-soleo y Aquiles\"]\n  F --> G[\"Menor coste metabolico\"]","pie":"El ESAR reproduce el trabajo excéntrico-concéntrico del tríceps sural."},{"tipo":"lista","items":["**Ventajas del ESAR:** menor fatiga metabólica (menos trabajo de cadera y tronco), marcha más **simétrica y fluida** (rollover suave), **absorción de impactos** que protege rodilla, cadera y muñón, y **split-toe** para terreno irregular y estabilidad lateral (ground compliance)."]},{"tipo":"dato","valor":"SACH: 90°","texto":"El pie SACH está bloqueado a 90° de flexión; solo el talón comprime con la carga."},{"tipo":"figura","pagina":43,"pie":"Pie ESAR de fibra de carbono: fíjate en las láminas que se flexionan en el apoyo y devuelven energía en el despegue.","src":"img/ortesis-t10-tema-10-exoprotesis-p43.jpg"},{"tipo":"perla","texto":"Un amputado vascular mayor (K1–K2) suele ir bien con **SACH**: ligero, duradero y barato. Un paciente joven y deportista (K3–K4) se beneficia del **ESAR**, que reduce el coste energético y protege las articulaciones suprayacentes."}]},{"id":"mmss","titulo":"Exoprótesis de miembro superior","bloques":[{"tipo":"parrafo","texto":"Reemplazan total o parcialmente función y forma de brazo, antebrazo o mano, con papel **funcional, estético y psicológico**. Tienen los mismos componentes que las de MMII y existen de dedos, mano, transradiales, transhumerales o de todo el miembro. La elección depende de **manipulación, agarre, destreza fina e interacción con el entorno**. A diferencia de MMII, **no existen K levels para MMSS**."},{"tipo":"tabla","titulo":"Tipos de prótesis de MMSS","columnas":["Tipo","Control","Ventajas","Inconvenientes / uso"],"filas":[["**Pasivas / cosméticas**","Sin movimiento activo","Ligeras, realistas, bajo mantenimiento; empujar, apoyar, sostener objetos ligeros","Funcionalidad limitada; amputaciones parciales o prioridad estética"],["**Mecánicas** (tracción por cables)","Cables y **arneses** movidos por hombro, espalda o tórax; gancho tipo **split hook**","**Duraderas, bajo coste** y mantenimiento; fuerza y control","Esfuerzo físico considerable, movimiento limitado, menos estéticas; entornos laborales"],["**Mioeléctricas**","Señales **EMG** del músculo residual captadas por sensores en la piel (bebionic, MyoHand, i-Limb)","Movimientos más naturales y precisos","Alto coste, sensibles a **sudor e interferencias**, baterías; requieren buena musculatura residual"],["**Biónicas avanzadas** (contenido extra)","Mioeléctricas multicanal, IA o interfaces neuronales (LUKE Arm, Hero Arm, MPL)","Dedos independientes y retroalimentación sensorial","—"]]},{"tipo":"tabla","titulo":"Escalas funcionales de MMSS","columnas":["Escala","Qué evalúa","Estructura"],"filas":[["**SHAP** (Southampton Hand Assessment Procedure)","Velocidad y capacidad para distintos agarres (esférico, pinza, cilíndrico…)","**6 objetos abstractos + 14 AVD**; cronometrado por el propio participante"],["**ARAT** (Action Research Arm Test)","Coordinación, destreza y función del MS","**19 ítems**; estandarizado en ACV, lesión cerebral, EM y Parkinson"],["**DASH**","Síntomas y capacidad funcional percibida (brazo, hombro, mano)","Autoadministrado, **30 ítems**"],["**QuickDASH**","Versión abreviada del DASH","**11 ítems**"]]},{"tipo":"dato","valor":"30 / 11 / 19","texto":"Ítems del **DASH**, del **QuickDASH** y del **ARAT** respectivamente."},{"tipo":"alerta","texto":"En el SHAP el cronómetro lo maneja **el propio participante**, de modo que no interviene el tiempo de reacción del observador. Y recuerda: el SHAP valora **agarres**; el DASH es **autoinformado** (percepción del paciente)."}]}],"caso_clinico":{"titulo":"Ludovica: amputada transfemoral activa","presentacion":"Mujer de 42 años, ingeniera, con amputación transfemoral izquierda tras un accidente de tráfico hace 8 meses. Hace ejercicio regularmente, tiene excelente fuerza de core y de cadera contralateral y mucha motivación para volver a su vida laboral y recreativa (caso 2 del temario).","preguntas":[{"pregunta":"¿Qué K level le corresponde y por qué?","respuesta":"**K3–K4**: deambuladora comunitaria con **cadencia variable**, que realiza ejercicio y actividades más allá de la simple locomoción; su potencial (fuerza, edad, motivación) apunta incluso a demandas de alto impacto (K4, adulto activo)."},{"pregunta":"¿Qué factores hay que tener en cuenta para elegir los componentes?","respuesta":"Estado físico (fuerza proximal, equilibrio, cardiorrespiratorio, pierna sana), resultados de **AMP, TUG y 6MWT**, demandas del entorno (trabajo, deporte, terreno variable) y **potencial** tras la rehabilitación; además forma, longitud y volumen del muñón y destreza para la suspensión."},{"pregunta":"¿Qué componentes protésicos le convendrían?","respuesta":"Encaje de **contacto total** con suspensión por **succión o vacío activo** (excelente control); rodilla **policéntrica** con control **hidráulico** o **microprocesador** para adaptarse a cambios de velocidad; y pie **ESAR** de fibra de carbono (estándar de oro en activos), eventualmente split-toe para terreno irregular."}]},"preguntate":[{"pregunta":"¿Qué diferencia una endoprótesis de una exoprótesis? Pon un ejemplo de cada una.","respuesta":"La endoprótesis es interna (p. ej. prótesis de cadera); la exoprótesis se coloca fuera del cuerpo (p. ej. prótesis transtibial)."},{"pregunta":"¿Por qué la osteosíntesis no se considera una prótesis funcional?","respuesta":"Porque clavos, placas y tornillos no sustituyen una función articular: son sustitutos estructurales temporales o permanentes del hueso."},{"pregunta":"Describe los cinco K levels con una palabra clave cada uno.","respuesta":"K0 no deambula; K1 doméstico/cadencia fija; K2 comunitario limitado/barreras bajas; K3 comunitario/cadencia variable; K4 alto impacto (niños, activos, atletas)."},{"pregunta":"¿Qué diferencia AMPnoPRO de AMPPRO?","respuesta":"AMPnoPRO se aplica sin prótesis para predecir el potencial protésico; AMPPRO, con prótesis, mide el desempeño tras la rehabilitación."},{"pregunta":"Nombra los tres componentes de una prótesis osteointegrada y su función.","respuesta":"Fixture: vástago de titanio intramedular; abutment: pieza transcutánea; mecanismo fail-safe: se suelta ante impacto para evitar fractura periprotésica."},{"pregunta":"¿Qué es la osteopercepción?","respuesta":"Fenómeno multisensorial de la OI: la vibración de la prótesis transmitida al hueso da sensaciones táctiles que mejoran la percepción del entorno."},{"pregunta":"¿Para qué sirven los calcetines protésicos?","respuesta":"Ajustar el encaje a los cambios de volumen, proteger la piel, mejorar la higiene y el confort térmico y repartir la presión."},{"pregunta":"Compara encaje de contacto total y de carga selectiva.","respuesta":"Contacto total: toda la superficie contacta, mejor reparto y control. Carga selectiva (PTB): apoya en zonas concretas y protege zonas frágiles, pero con menor control."},{"pregunta":"¿Qué cuatro características describen una rodilla protésica?","respuesta":"Eje, mecanismo de fricción, ayuda a la extensión y estabilizador mecánico."},{"pregunta":"¿Por qué el pie ESAR reduce el coste metabólico?","respuesta":"Sus láminas de carbono almacenan energía en el apoyo y la liberan en el despegue, imitando al complejo gemelo-sóleo-Aquiles y reduciendo el trabajo de cadera y tronco."}],"glosario":[{"termino":"Exoprótesis","definicion":"Prótesis externa que reemplaza o complementa una parte del cuerpo ausente o dañada."},{"termino":"Endoprótesis","definicion":"Prótesis interna, p. ej. articular (cadera, rodilla, hombro)."},{"termino":"K level (MFCL)","definicion":"Clasificación funcional de Medicare (1995), de K0 a K4, del potencial protésico del amputado de MMII."},{"termino":"AMP","definicion":"Amputee Mobility Predictor: 21 ítems, 42 puntos; versiones con y sin prótesis."},{"termino":"Osteointegración (DSF)","definicion":"Fijación esquelética directa de la prótesis mediante implante intraóseo transcutáneo."},{"termino":"Liner","definicion":"Funda de silicona, gel o poliuretano colocada directamente sobre el muñón."},{"termino":"Encaje (socket)","definicion":"Componente proximal que aloja el muñón."},{"termino":"Pylon","definicion":"Estructura tubular que hace de esqueleto de la prótesis."},{"termino":"PTB","definicion":"Patellar Tendon Bearing: encaje transtibial de carga selectiva en el tendón rotuliano."},{"termino":"Pin-lock","definicion":"Suspensión con liner de silicona y pin distal bloqueado en el encaje."},{"termino":"Pie SACH","definicion":"Solid Ankle Cushion Heel: pie fijo con talón almohadillado, para baja funcionalidad."},{"termino":"Pie ESAR","definicion":"Energy Storing and Returning: pie de fibra de carbono que almacena y devuelve energía."},{"termino":"SHAP","definicion":"Southampton Hand Assessment Procedure: 6 objetos abstractos y 14 AVD cronometradas."}],"fuentes":["Gailey RS et al. The Amputee Mobility Predictor: an instrument to assess determinants of the lower-limb amputee's ability to ambulate.","Thomson S et al. (2019). Remodelación ósea proximal en amputados de extremidades inferiores reconstruidas con una prótesis osteointegrada. Journal of Orthopaedic Research, 37(12), 2524–2530.","Universidad Europea. Órtesis y Prótesis, Tema 10: Exoprótesis."],"qcm":[{"pregunta":"Un paciente portador de prótesis ocular tras una enucleación pregunta de qué material está hecha. Según el tema, ¿cuál es?","opciones":["Titanio recubierto","Poliuretano flexible","Acrílico","Silicona médica pigmentada"],"correcta":2,"explicacion":"La prótesis ocular (ojo artificial) se fabrica en acrílico; la prótesis orbitaria, que sustituye toda la región periorbitaria, se hace en silicona médica.","por_opcion":["❌ El titanio se usa en los implantes de anclaje, no en el globo artificial.","❌ El poliuretano aparece como material de liners, no de prótesis oculares.","✅ Acrílico para la prótesis ocular.","❌ La silicona médica es el material de la prótesis orbitaria, auricular o nasal."]},{"pregunta":"Niño con microtia que va a recibir una prótesis auricular anclada a hueso. ¿Dónde se colocan los implantes osteointegrados?","opciones":["Hueso nasal","Zona mastoidea","Reborde orbitario","Hueso maxilar"],"correcta":1,"explicacion":"La prótesis auricular puede fijarse con adhesivos o con implantes osteointegrados en la zona mastoidea.","por_opcion":["❌ El hueso nasal ancla la prótesis nasal.","✅ Zona mastoidea para la prótesis auricular.","❌ El reborde orbitario ancla la prótesis orbitaria.","❌ El maxilar es una opción para la prótesis nasal."]},{"pregunta":"Según el tema, ¿cómo se clasifican los clavos, placas y tornillos de osteosíntesis?","opciones":["Prótesis funcionales internas de carga","Exoprótesis estructurales de uso temporal","Endoprótesis articulares de función restauradora","Sustitutos estructurales internos, no prótesis funcionales"],"correcta":3,"explicacion":"La osteosíntesis forma parte del material interno, pero no son prótesis funcionales: son sustitutos estructurales temporales o permanentes del hueso.","por_opcion":["❌ El tema niega expresamente que sean prótesis funcionales.","❌ Son internos, no exoprótesis.","❌ Las endoprótesis articulares sustituyen una articulación completa.","✅ Coincide con el temario."]},{"pregunta":"Amputado transtibial que, con prótesis, camina por casa y la calle a velocidad constante, sube bordillos y algún escalón, pero no puede variar el ritmo. ¿Qué K level le corresponde?","opciones":["K4","K1","K3","K2"],"correcta":3,"explicacion":"K2 define al deambulador comunitario limitado, capaz de superar barreras de bajo nivel como bordillos, escaleras o superficies irregulares, sin la cadencia variable propia de K3.","por_opcion":["❌ K4 implica demandas de alto impacto o energía.","❌ K1 se limita a superficies planas y transferencias (doméstico).","❌ K3 exige cadencia variable.","✅ Supera barreras bajas sin cadencia variable: K2."]},{"pregunta":"¿Qué rasgo distingue específicamente al nivel K3 del K2?","opciones":["La capacidad de deambular con cadencia variable","La capacidad de superar bordillos y escaleras","La capacidad de realizar transferencias seguras","La capacidad de caminar por superficies planas"],"correcta":0,"explicacion":"K3 introduce la cadencia variable y la capacidad de atravesar la mayoría de barreras y realizar actividades vocacionales, terapéuticas o de ejercicio; superar barreras bajas ya es propio de K2.","por_opcion":["✅ La cadencia variable es lo que define K3.","❌ Bordillos y escaleras ya definen K2.","❌ Las transferencias aparecen ya en K1.","❌ Caminar en superficies planas corresponde a K1."]},{"pregunta":"Respecto al Amputee Mobility Predictor (AMP), ¿qué afirmación es correcta?","opciones":["Tiene 21 ítems y su versión sin prótesis predice el potencial","Tiene 11 ítems y mide solo el equilibrio en sedestación","Tiene 30 ítems y se autoadministra por el paciente","Tiene 19 ítems y su versión con prótesis predice el potencial"],"correcta":0,"explicacion":"El AMP tiene 21 ítems (42 puntos). El AMPnoPRO, sin prótesis, predice el potencial protésico; el AMPPRO, con prótesis, mide el desempeño tras la rehabilitación.","por_opcion":["✅ 21 ítems; AMPnoPRO predice.","❌ 11 ítems es el QuickDASH.","❌ 30 ítems autoadministrados es el DASH.","❌ 19 ítems es el ARAT y la versión con prótesis mide, no predice."]},{"pregunta":"Tras la cirugía, un amputado obtiene un perfil K1. A los 6 meses de fisioterapia se desplaza por la comunidad a velocidades variables. ¿Qué implica según el tema?","opciones":["Pasa a K3, lo que justifica actualizar sus componentes protésicos","Solo puede subir a K2 porque no se permiten saltos de nivel","Debe reevaluarse únicamente con el 6MWT antes de cambiar nada","Mantiene K1 porque el nivel se asigna en el postoperatorio"],"correcta":0,"explicacion":"Los K levels no son estáticos ni definitivos: un paciente puede evolucionar de K1/K2 a K3 con fisioterapia, lo que justifica clínicamente cambiar componentes (p. ej. a rodilla con microprocesador).","por_opcion":["✅ Coincide con el tema.","❌ El tema no establece ninguna restricción de saltos.","❌ La asignación combina historia, pruebas (AMP, TUG, 6MWT), entorno y potencial.","❌ Se valora el potencial y el nivel puede cambiar."]},{"pregunta":"En una prótesis osteointegrada, ¿qué componente protege al hueso de una fractura periprotésica en una caída?","opciones":["El mecanismo de desacoplamiento de seguridad","El liner de silicona con pin distal","El abutment transcutáneo","El fixture intramedular de titanio"],"correcta":0,"explicacion":"El mecanismo fail-safe release está diseñado para romperse o soltarse ante un impacto brusco o caída grave, protegiendo al hueso de una fractura periprotésica.","por_opcion":["✅ Fail-safe release mechanism.","❌ El liner con pin pertenece a la suspensión pin-lock, no a la OI.","❌ El abutment es la pieza que atraviesa la piel.","❌ El fixture es el anclaje intraóseo."]},{"pregunta":"¿En cuál de estos pacientes estaría contraindicada la osteointegración según el tema?","opciones":["Amputado con limitación de flexión de cadera por el encaje","Amputado con grandes cambios de volumen del muñón","Amputado transfemoral con osteoporosis","Amputado con úlceras recurrentes por el encaje"],"correcta":2,"explicacion":"La OI está contraindicada en osteoporosis y en riesgo de complicaciones infecciosas o inflamatorias; las lesiones cutáneas, los cambios volumétricos y la limitación por el encaje son precisamente indicaciones.","por_opcion":["❌ La OI mejora el ROM de cadera: es indicación.","❌ Los cambios volumétricos son indicación de primera o segunda opción.","✅ La osteoporosis contraindica la OI.","❌ Las lesiones de piel por encaje son una indicación."]},{"pregunta":"¿Qué ventaja de la osteointegración se explica por la osteopercepción?","opciones":["Ausencia de sudor e irritación en el muñón","Reducción de la fractura periprotésica en caídas","Mejora del rango de flexión de la cadera","Mejora de la conciencia ambiental y la retroalimentación sensorial"],"correcta":3,"explicacion":"La osteopercepción es un fenómeno multisensorial: la vibración de la prótesis en el hueso proporciona sensaciones táctiles que mejoran la percepción del entorno.","por_opcion":["❌ Se debe a que no hay encaje, no a la osteopercepción.","❌ Es función del mecanismo fail-safe.","❌ La mejora del ROM se debe a la ausencia del borde del encaje.","✅ Osteopercepción = mejor feedback sensorial."]},{"pregunta":"Paciente transtibial con cicatriz frágil en la cara anterior del muñón. ¿Qué tipo de encaje permite descargar esa zona y qué inconveniente tiene?","opciones":["Pin-lock; produce tracción distal","Carga selectiva tipo PTB; ofrece menor control","Vacío activo; requiere baterías y bomba","Contacto total; genera presión puntual"],"correcta":1,"explicacion":"El encaje de carga selectiva (p. ej. PTB) apoya el peso en zonas concretas y descarga las sensibles, protegiendo cicatrices, a costa de menor contacto global y menor control.","por_opcion":["❌ El pin-lock es suspensión; su problema es la tracción distal, pero no descarga zonas.","✅ Carga selectiva: protege zonas frágiles, menos control.","❌ El vacío activo es un sistema de suspensión, no de reparto de cargas.","❌ El contacto total evita precisamente la presión puntual."]},{"pregunta":"Un amputado refiere enrojecimiento y molestia en el extremo distal del muñón al levantar la pierna. Usa liner de silicona con un pin que se bloquea en el encaje. ¿Qué inconveniente de su sistema lo explica?","opciones":["Pérdida de vacío por fallo de la bomba","Menor estabilidad por la correa pélvica","Tracción distal sobre el muñón","Falta de sellado de las válvulas"],"correcta":2,"explicacion":"El sistema pin-lock ofrece buena suspensión y es fácil de colocar, pero puede generar tracción distal en el muñón durante la fase de balanceo.","por_opcion":["❌ La bomba pertenece al vacío activo.","❌ La correa corresponde al encaje con cinturón.","✅ Inconveniente típico del pin-lock.","❌ El sellado es crítico en la succión, no en el pin-lock."]},{"pregunta":"Amputado transfemoral con actividad moderada. ¿Qué mecanismo de fricción de rodilla recomienda el tema?","opciones":["Fricción constante","Mecanismo hidráulico","Mecanismo con microprocesador","Fricción variable"],"correcta":3,"explicacion":"La fricción variable aplica más fricción al inicio y al final del movimiento y es ideal para actividad moderada; la constante para baja actividad y la hidráulica para alta.","por_opcion":["❌ La fricción constante se reserva para baja actividad.","❌ El hidráulico es para pacientes más activos.","❌ El microprocesador es la opción más avanzada y costosa, no la indicada para actividad moderada.","✅ Fricción variable = actividad moderada."]},{"pregunta":"¿Qué pie protésico NO se recomienda en amputaciones por debajo de la rodilla según el tema?","opciones":["Pie de eje múltiple","Pie SACH","Pie ESAR de fibra de carbono","Pie de eje sencillo"],"correcta":3,"explicacion":"El pie de eje sencillo (flexión dorsal y plantar) se usa sobre todo en niveles altos de amputación y en quien necesita estabilidad, y el tema lo desaconseja en amputaciones bajo rodilla.","por_opcion":["❌ El eje múltiple sirve para terreno irregular sin esa restricción.","❌ El SACH está indicado en TT y TF de baja funcionalidad.","❌ El ESAR es el estándar de oro en activos, incluidos TT.","✅ No recomendable bajo rodilla."]},{"pregunta":"Un amputado transradial necesita una prótesis duradera, barata y con fuerza para trabajar en una carpintería. ¿Cuál se ajusta mejor?","opciones":["Mioeléctrica con sensores EMG","Mecánica de tracción por cables","Biónica multicanal con IA","Pasiva cosmética"],"correcta":1,"explicacion":"Las prótesis mecánicas, controladas por cables y arneses, son duraderas, de bajo coste y mantenimiento y muy comunes en entornos laborales que requieren fuerza, aunque exigen esfuerzo físico y son menos estéticas.","por_opcion":["❌ La mioeléctrica es cara y sensible al sudor e interferencias.","✅ Mecánica: durable, barata, entornos laborales.","❌ La biónica es la más costosa y compleja.","❌ La pasiva tiene funcionalidad muy limitada."]}],"asignatura":"Ortesis","tema":10,"fecha":"2026-11-10"}</script>

<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
