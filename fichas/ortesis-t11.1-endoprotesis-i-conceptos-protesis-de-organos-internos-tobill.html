<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}

<script id="datos" type="application/json">{"titulo":"Endoprótesis I: conceptos, prótesis de órganos internos, tobillo, pie y rodilla","subtitulo":"Qué es una endoprótesis, cuándo se elige artroplastia frente a artrodesis u osteotomía, y todo sobre las prótesis de tobillo, MTF-1 y rodilla (tipos, indicaciones, rehabilitación y complicaciones).","resumen":["Una **endoprótesis** es un implante interno que sustituye total o parcialmente una articulación o segmento óseo para **restaurar función, estabilidad y aliviar el dolor**, fabricado en titanio/cobalto-cromo, polietileno de alta densidad o cerámica.","La **artroplastia** conserva el movimiento y exige buena calidad ósea y buen estado general; la **artrodesis** fusiona y elimina el movimiento, y sirve de **cirugía de rescate** cuando falla la prótesis.","La prótesis de tobillo (**TAR**, p. ej. **STAR** o HINTEGRA) tiene **placa tibial, componente astragalino e inserto móvil de polietileno**; en el hallux, el orden terapéutico es **osteotomía → artroplastia MTF-1 → artrodesis**.","En rodilla existen prótesis **unicondílea** (compartimento femorotibial, sobre todo medial), **femoropatelar** (\u003c 60 años) y **total (PTR)**, cuya indicación exige **dolor + edad > 60 + Rx con pinzamiento + enfermedad compatible, todo a la vez**.","Tras una PTR la **extensión completa** es la prioridad de las 2 primeras semanas; el **aflojamiento** es la 1.ª causa de fracaso, el **arco preoperatorio** el mejor predictor de movilidad y **todo dolor protésico es infección hasta demostrar lo contrario**."],"objetivos":["Diferenciar endoprótesis, osteotomía, artrodesis y artroplastia, y saber cuándo se elige cada una.","Clasificar las prótesis de órganos internos (estructurales, funcionales/bioelectrónicas y completas) con ejemplos.","Describir los componentes, indicaciones y contraindicaciones de las prótesis de tobillo y metatarsofalángica del hallux.","Clasificar las prótesis de rodilla (parciales y totales; CR/PS/CS; cementadas/no cementadas/híbridas; platillo fijo/móvil) y sus indicaciones.","Planificar la rehabilitación post-PTR por fases y reconocer sus complicaciones principales."],"ideas_clave":["Endoprótesis articular = reemplaza total o parcialmente una articulación por **traumatismo o desgaste** (patología degenerativa o inflamatoria).","Artroplastia: pacientes con degeneración severa y **buen estado general**; no en mala calidad ósea ni patología sistémica. Artrodesis: deformidad severa, inestabilidad ligamentosa o **rescate** de artroplastia fallida.","Hallux valgus: **osteotomía** primero, **artroplastia MTF-1** si falla y se cumplen requisitos, **artrodesis** como último recurso.","Unicondílea: artrosis unicompartimental (sobre todo **medial**), alineación normal y articulación estable; **contraindicada en obesos, déficit de LCA y artritis inflamatoria/condrocalcinosis grave**.","PTR: los 4 criterios (dolor, edad > 60, Rx, enfermedad) **deben darse todos juntos**; el aparato extensor incompetente y la infección activa la contraindican.","Prótesis no constreñidas = las más usadas; **CR** conserva el LCP, **PS** lo sustituye por un poste (semiconstreñida), **CS** compensa ambos cruzados con un inserto ultracongruente.","Rehabilitación: 0–2 semanas dolor/edema y **extensión completa**; 2–6 semanas **90° → 110–120°** de flexión; 6–12 semanas fuerza y propiocepción.","Complicaciones: **aflojamiento** (1.ª causa de fracaso), inestabilidad (1–2 %), lesión neurológica (2–5 %), infección (0,8 %, *S. epidermidis*), rigidez (\u003c 90° a las 6 semanas → movilización bajo anestesia)."],"secciones":[{"id":"conceptos","titulo":"Conceptos básicos: prótesis, endoprótesis y técnicas quirúrgicas","bloques":[{"tipo":"definicion","termino":"Prótesis","texto":"Dispositivo artificial que **reemplaza partes del cuerpo**."},{"tipo":"definicion","termino":"Endoprótesis","texto":"Elemento metálico o plástico destinado a reemplazar **de forma permanente** un hueso, una articulación u otro segmento. Es un **implante interno** que busca restaurar la función, la estabilidad y aliviar el dolor."},{"tipo":"parrafo","texto":"Se distinguen dos grandes grupos: las **endoprótesis de órganos internos** (stent coronario en cirugía cardiovascular; stents y prótesis biliares en ictericias obstructivas por neoplasias pancreáticas o biliares) y las **endoprótesis articulares**, propias de la cirugía ortopédica y traumatología, que reemplazan la totalidad o parte de una articulación tras un accidente traumático o por desgaste (patología degenerativa o inflamatoria)."},{"tipo":"tabla","titulo":"Indicaciones generales y materiales de una endoprótesis","columnas":["Sustituye estructuras dañadas por…","Material","Función en la prótesis"],"filas":[["Artrosis avanzada (degeneración del cartílago)","Titanio o aleaciones de cobalto-cromo","Estructura metálica"],["Fracturas complejas","Polietileno de alta densidad","Superficie articular"],["Tumores óseos (resecciones oncológicas)","Cerámica","Componentes de fricción"],["Necrosis ósea avascular","—","—"],["Malformaciones o secuelas postraumáticas","—","—"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Corta","titulo":"Osteotomía","texto":"Corte **controlado** de un hueso para modificar su forma o posición. Conserva la articulación propia."},{"etiqueta":"Fusiona","titulo":"Artrodesis","texto":"Fusión **permanente** de dos o más huesos con clavos, tornillos o placas de compresión. **Elimina el movimiento** para dar estabilidad y aliviar el dolor."},{"etiqueta":"Sustituye","titulo":"Artroplastia","texto":"Reemplaza o reconstruye una articulación con materiales artificiales (prótesis) o **recubriendo** los extremos óseos. **Conserva el movimiento**."}]},{"tipo":"esquema","titulo":"¿Artroplastia o artrodesis?","mermaid":"flowchart TD\n  A[\"Articulación dañada y dolorosa\"] --> B{\"Buena calidad ósea y buen estado general\"}\n  B -->|\"Sí\"| C[\"Artroplastia: conserva movimiento\"]\n  B -->|\"No: hueso pobre o patología sistémica\"| D[\"Artrodesis\"]\n  A --> E{\"Deformidad severa o inestabilidad ligamentosa\"}\n  E -->|\"Sí\"| D\n  C --> F{\"Fallo, rechazo o infección\"}\n  F -->|\"Rescate\"| D\n  D --> G[\"Sin movimiento, estable e indolora\"]","pie":"La artrodesis es a la vez una opción primaria (deformidad, inestabilidad, hueso pobre) y la cirugía de rescate de la artroplastia fallida."},{"tipo":"alerta","texto":"La artroplastia **no está recomendada** en pacientes con **pobre calidad ósea o patologías sistémicas**: no confundir con la artrodesis, que sí puede indicarse en esos casos."},{"tipo":"perla","texto":"Antes de diseñar el tratamiento, pregunta qué cirugía se hizo: tras una **artrodesis** no se trabaja la ganancia de recorrido en esa articulación (está fusionada), sino las articulaciones vecinas que compensan; tras una **artroplastia**, el objetivo central es recuperar el arco de movimiento."}]},{"id":"organos-internos","titulo":"Prótesis de órganos internos","bloques":[{"tipo":"parrafo","texto":"Una prótesis de órgano interno es un dispositivo **implantado quirúrgicamente** que **sustituye o asiste** la función de un órgano dañado. Se clasifican según lo que aportan: estructura, función o el órgano entero."},{"tipo":"tarjetas","items":[{"etiqueta":"Tipo 1","titulo":"Estructurales","texto":"Reemplazan partes anatómicas: válvulas cardíacas, articulaciones, vasos sanguíneos."},{"etiqueta":"Tipo 2","titulo":"Funcionales o bioelectrónicas","texto":"Restauran una función mediante tecnología: marcapasos, implantes cocleares."},{"etiqueta":"Tipo 3","titulo":"Artificiales completas","texto":"Sustituyen un órgano entero: corazón artificial, riñón artificial."}]},{"tipo":"tabla","titulo":"Ejemplos por sistema","columnas":["Sistema","Prótesis","Datos clave"],"filas":[["Cardíaco","Válvulas artificiales (mitral, aórtica, tricúspide)","**Biológicas** (animal/humano) o **mecánicas** (titanio, carbono, polímeros). Flujo unidireccional. Riesgos: trombosis, infección, **anticoagulación en las mecánicas**"],["Cardíaco","Marcapasos y DAI","Emiten impulsos eléctricos para mantener la frecuencia cardíaca"],["Cardíaco","Corazón artificial total","Sustituye **ambos ventrículos**; puente al trasplante en IC terminal; **no es solución a largo plazo**; batería externa"],["Vascular","Tubos de Dacron o PTFE","Aneurismas, obstrucciones arteriales, trasplantes renales o hepáticos"],["Respiratorio","Prótesis traqueal/bronquial; válvulas endobronquiales","Silicona, titanio o polímeros; tumores, traumatismos, estenosis; válvulas para **enfisema**"],["Digestivo","Stents esofágicos/gástricos, intestinales/colónicos; hígado artificial","Mantienen el paso o el lumen; el hígado artificial es **experimental** y filtra toxinas hasta el trasplante"],["Neurológico","Implante coclear; DBS; implantes retinianos/corticales","Coclear: sordera profunda, estimula el nervio auditivo. DBS: **Parkinson, epilepsia, depresión resistente**"],["Urinario/renal","Hemodiálisis; stents ureterales/vesicales; esfínter urinario artificial","La hemodiálisis **no se implanta** pero reemplaza la función renal; el esfínter, sobre todo en **hombres tras prostatectomía**"]]},{"tipo":"alerta","texto":"El **riñón artificial (hemodiálisis)** es extracorpóreo: reemplaza la función pero **no se implanta**. El **corazón artificial total** no es definitivo: es un puente al trasplante."},{"tipo":"perla","texto":"En pacientes con **marcapasos, DAI o neuroestimulador cerebral (DBS)** hay que revisar las contraindicaciones de la electroterapia antes de aplicar corrientes o diatermia (complemento)."}]},{"id":"tobillo-pie","titulo":"Prótesis de tobillo y de la 1.ª metatarsofalángica","bloques":[{"tipo":"parrafo","texto":"La **artroplastia total de tobillo (TAR, Total Ankle Replacement)** sustituye la articulación **tibioperoneoastragalina** (tibiotalar) para aliviar el dolor crónico y restaurar movilidad y función en artritis avanzada, daño postraumático u otras patologías degenerativas. A diferencia de la artrodesis, **conserva el movimiento**."},{"tipo":"tabla","titulo":"Componentes de la prótesis de tobillo","columnas":["Componente","Localización","Función"],"filas":[["Placa tibial","Parte superior","Fijación en la tibia"],["Inserto de polietileno (móvil)","Entre ambos componentes","Reemplaza la articulación en sí; permite la **flexoextensión**"],["Componente astragalino","Parte inferior","Superficie de deslizamiento sobre el astrágalo"]]},{"tipo":"figura","pagina":19,"pie":"Prótesis STAR de 4.ª generación en visión frontal: fíjate en la fijación tibial, el inserto móvil de polietileno (rojo) y el componente astragalino (azul).","src":"img/ortesis-t11.1-endoprotesis-i-conceptos-protesis-de-organos-internos-tobill-p19.jpg"},{"tipo":"dato","valor":"73 % a 15 años","texto":"Supervivencia del metal de la prótesis **STAR** a los 15 años en la serie mostrada en el tema (Palanca et al., 2018); los procedimientos complementarios fueron frecuentes."},{"tipo":"lista","items":["**Ejemplos:** STAR (Scandinavian Total Ankle Replacement), HINTEGRA.","**Indicaciones:** artrosis postraumática, artritis reumatoide, secuelas deformantes (fracturas de la sindesmosis).","Históricamente la artrodesis era el *gold standard* porque las primeras TAR tenían muchas complicaciones; STAR o Agility se consideran hoy una alternativa razonable a la fusión."]},{"tipo":"parrafo","texto":"En el antepié, la endoprótesis más común es la de la **1.ª metatarsofalángica (MF-1, hallux)**, para hallux valgus o artrosis (hallux rigidus). La artroplastia **devuelve la movilidad** a una articulación que soporta mucha carga."},{"tipo":"esquema","titulo":"Escalera terapéutica del hallux valgus","mermaid":"flowchart LR\n  A[\"Hallux valgus o artrosis MTF-1\"] --> B[\"1. Osteotomía\"]\n  B -->|\"Falla y se cumplen requisitos\"| C[\"2. Artroplastia MTF-1\"]\n  C -->|\"Fracaso\"| D[\"3. Artrodesis: rescate\"]","pie":"La osteotomía es el tratamiento recomendado en la mayoría de los casos; la artrodesis es el último recurso."},{"tipo":"tabla","titulo":"Endoprótesis MTF-1: ventajas y contraindicaciones","columnas":["Ventajas","Contraindicaciones"],"filas":[["Movilidad articular aceptable","Alteraciones vasculares severas"],["Corrige la pérdida de longitud del dedo","Infección activa o antecedente de infección"],["Mejora el apoyo del antepié y las **metatarsalgias de transferencia**","Osteoporosis"],["Buenos resultados en activos, incluso deporte recreativo","Pacientes **jóvenes con alta demanda funcional**"],["Si fracasa, rescate con **artrodesis**","Diabéticos, neuropáticos, enfermedades reumáticas inflamatorias; lesiones cutáneas importantes"]]},{"tipo":"alerta","texto":"Trampa: el tratamiento de elección del hallux valgus **no** es la prótesis sino la **osteotomía**. Y aunque la prótesis MTF-1 permite deporte recreativo, el **paciente joven con alta demanda funcional** es una contraindicación."},{"tipo":"perla","texto":"Tras una prótesis MTF-1, trabaja la **extensión del hallux** necesaria para el despegue de la marcha y vigila la redistribución de cargas del antepié: la mejora de las metatarsalgias de transferencia depende de que el primer radio vuelva a cargar."}]},{"id":"rodilla-parciales","titulo":"Prótesis de rodilla parciales: unicondílea y femoropatelar","bloques":[{"tipo":"figura","pagina":26,"pie":"Los tres tipos de prótesis de rodilla: total (izquierda, con vástago tibial) frente a unicondílea (derecha, solo un compartimento femorotibial).","src":"img/ortesis-t11.1-endoprotesis-i-conceptos-protesis-de-organos-internos-tobill-p26.jpg"},{"tipo":"tabla","titulo":"Comparación de las prótesis parciales","columnas":["","Unicondílea","Femoropatelar"],"filas":[["Qué sustituye","**Solo el compartimento femorotibial afectado**","Cara posterior de la rótula y superficie anterior del fémur"],["Indicación","Artrosis unicompartimental (sobre todo **medial**), alineación normal, articulación estable, no candidatos a osteotomía","**\u003c 60 años** con artrosis femororrotuliana aislada o condromalacia rotuliana y alineación femororrotuliana normal"],["Contraindicaciones","**Obesos**, déficit de **LCA**, artritis inflamatoria o condrocalcinosis grave","—"],["Objetivo","Dejar intacto el resto de la articulación","Mejorar el deslizamiento de las superficies"]]},{"tipo":"figura","pagina":27,"pie":"Prótesis unicondílea: área de hueso que se retira en un solo cóndilo y colocación de los componentes femoral y tibial; el otro compartimento queda intacto.","src":"img/ortesis-t11.1-endoprotesis-i-conceptos-protesis-de-organos-internos-tobill-p27.jpg"},{"tipo":"alerta","texto":"La unicondílea exige **LCA competente**: un déficit de LCA la contraindica, mientras que en la PTR convencional el LCA se **retira casi siempre**. No mezcles ambos conceptos."},{"tipo":"dato","valor":"\u003c 60 años","texto":"Edad para la que se **considera** la prótesis femoropatelar; al contrario, la PTR se indica idealmente en **mayores de 60**."}]},{"id":"ptr","titulo":"Artroplastia total de rodilla (PTR): indicaciones y tipos","bloques":[{"tipo":"parrafo","texto":"La PTR reemplaza la articulación completa con **3 elementos**: parte distal del fémur, parte interna de la rótula y platillo tibial. Sus objetivos son una articulación **indolora**, **alineación mecánica correcta**, **equilibrio ligamentoso** (estabilidad), **línea articular conservada** y un rango desde **0° (extensión completa) hasta 90° o más**."},{"tipo":"tabla","titulo":"Indicaciones de la PTR (¡deben darse TODAS juntas!)","columnas":["Criterio","Contenido"],"filas":[["Dolor","Síntoma fundamental; limita la actividad diaria y la marcha y **no responde a tratamiento conservador**"],["Edad","Idealmente **> 60 años**; en jóvenes se intentan alternativas"],["Radiografía","Confirma la **pérdida del espacio articular**"],["Enfermedad","Artrosis primaria, artritis reumatoide, artropatías inflamatorias, artrosis secundarias (postraumáticas, osteonecrosis), **artropatía hemofílica**"]]},{"tipo":"tabla","titulo":"Contraindicaciones de la PTR","columnas":["Absolutas","Relativas"],"filas":[["Infección articular activa","Deformidad en **recurvatum** por debilidad muscular"],["Compromiso vascular (insuficiencia arterial o venosa)","**Artrodesis previa funcional e indolora**"],["**Aparato extensor incompetente**","—"],["Gran demanda articular (jóvenes, obesos mórbidos) y pacientes que no puedan hacer la rehabilitación postoperatoria","—"]]},{"tipo":"lista","items":["**Check-list pre-PTR:** valorar el dolor, la respuesta a tratamientos previos y si existe alternativa menos invasiva.","Comprobar que **no hay contraindicaciones**.","Evaluar el riesgo quirúrgico (sepsis, anestesia…) y el nivel de actividad previo para informar de resultados y limitaciones.","Valorar **marcha, alineación y estabilidad**.","Explorar la **cadera homolateral y la columna** para descartar dolor referido."]},{"tipo":"esquema","titulo":"Clasificación de la PTR","mermaid":"flowchart TD\n  P[\"PTR\"] --> L[\"Limitación mecánica\"]\n  P --> F[\"Fijación\"]\n  P --> M[\"Polietileno tibial\"]\n  P --> R[\"Rótula sustituida o no\"]\n  L --> L1[\"Constreñida: bisagra\"]\n  L --> L2[\"Semiconstreñida: PS con tetón\"]\n  L --> L3[\"No constreñida: CR y CS\"]\n  F --> F1[\"Cementada\"]\n  F --> F2[\"No cementada\"]\n  F --> F3[\"Híbrida\"]\n  M --> M1[\"Platillo fijo: el más usado\"]\n  M --> M2[\"Platillo móvil\"]","pie":"Cuatro criterios independientes: una misma prótesis puede ser, p. ej., no constreñida CR, híbrida y de platillo fijo."},{"tipo":"tabla","titulo":"Según el grado de limitación mecánica y el manejo de los cruzados","columnas":["Tipo","Cruzados","Constricción","Claves"],"filas":[["Constreñida (bisagra)","—","Máxima","Rodillas **muy inestables** o gran pérdida ósea (**revisiones**)"],["CR (retención de cruzado)","Se **conserva el LCP**","No constreñida","Biomecánica más natural; **conserva más hueso**"],["PS (posteroestabilizada)","LCP sustituido por un **poste**","Semiconstreñida","Consume más hueso; fiabilidad de la estabilización mecánica; el tetón limita varo-valgo y luxación posterior"],["CS (cruzado sacrificado / ultracongruente)","Se sacrifican **ambos**","No constreñida","Inserto de polietileno **más alto y congruente**; opción intermedia entre CR y PS"]]},{"tipo":"dato","valor":"No constreñidas","texto":"Son las prótesis de rodilla **más usadas**. En casi todas las PTR convencionales el **LCA se retira** (suele estar ausente o degenerado)."},{"tipo":"tabla","titulo":"Según la fijación y la movilidad del polietileno","columnas":["Tipo","Ventajas","Inconvenientes"],"filas":[["Cementada","Excelente fijación en **todo tipo de hueso**","A largo plazo, osteólisis o resorción ósea"],["No cementada","Nuevas matrices porosas que se integran con el hueso","Peores resultados en componentes **tibial y patelar** (fatiga del metal, dolor persistente)"],["Híbrida","**Fémur no cementado**, resto cementado","Buena opción solo en **hueso no osteoporótico**"],["Platillo móvil","El polietileno rota: mejor conformidad fémur-tibia y menos desgaste (teórico)","Riesgo de luxación de la meseta y desgaste en la cara inferior del polietileno"],["Platillo fijo","Polietileno unido a la meseta; **el más usado**","—"]]},{"tipo":"perla","texto":"En una prótesis **CR** se conserva el LCP con sus mecanorreceptores: aprovecha ese potencial en la fase de **propiocepción**. En una **PS** vigila el clunk rotuliano al trabajar la extensión."},{"tipo":"figura","pagina":52,"pie":"PTR constreñida in situ: componente femoral, inserto tibial alto con sistema de bisagra y botón rotuliano de polietileno (a la izquierda).","src":"img/ortesis-t11.1-endoprotesis-i-conceptos-protesis-de-organos-internos-tobill-p52.jpg"}]},{"id":"rehabilitacion","titulo":"Rehabilitación tras la artroplastia de rodilla","bloques":[{"tipo":"esquema","titulo":"Fases de la rehabilitación post-PTR","mermaid":"flowchart LR\n  A[\"Fase inicial 0-2 semanas\"] --> B[\"Fase intermedia 2-6 semanas\"]\n  B --> C[\"Fase avanzada 6-12 semanas y más\"]\n  A --- A1[\"Dolor, edema y extensión completa\"]\n  B --- B1[\"Flexión 90 a 110-120 grados, cuádriceps, marcha\"]\n  C --- C1[\"Fuerza, propiocepción, resistencia\"]","pie":"Cada fase tiene una prioridad: extensión, luego flexión y activación, luego fuerza y control neuromuscular."},{"tipo":"tabla","titulo":"Contenido de cada fase","columnas":["Fase","Objetivos","Técnicas"],"filas":[["Inicial (0–2 sem)","Control del dolor y del edema; **extensión completa** (prioridad absoluta)","Crioterapia intermitente y elevación **sin almohada bajo la corva**; movilización pasiva/activo-asistida **desde el día 1** (artromotor, deslizamientos en CCC); isométricos de cuádriceps precoces"],["Intermedia (2–6 sem)","**90°** de flexión en las 2 primeras semanas y **> 110–120°** hacia la semana 6; activar el cuádriceps; reeducar la marcha","Movilización de rótula (evita fibrosis del tendón rotuliano); isométricos, electroestimulación, *straight leg raises*; retirada progresiva de muletas según estabilidad y control monopodal"],["Avanzada (6–12 sem y más)","Fuerza de MMII, propiocepción, resistencia cardiovascular","Sentadillas, prensa, subir/bajar escalones; superficies estables → inestables; bicicleta estática (primero hacia atrás o sin resistencia) y marcha continua"]]},{"tipo":"alerta","texto":"No colocar la almohada **bajo la corva**: favorece la flexión estática y el flexo. La **extensión completa** es la prioridad de la fase inicial porque un déficit de extensión altera la marcha y sobrecarga el cuádriceps."},{"tipo":"dato","valor":"90° → 110–120°","texto":"Objetivos de flexión: **90°** en las primeras dos semanas y superar **110–120°** hacia la semana 6."},{"tipo":"perla","texto":"La **inhibición artrogénica** del cuádriceps se combate con isométricos, **electroestimulación** si hace falta y elevaciones con pierna estirada; sin cuádriceps activo no se puede retirar la ayuda técnica."},{"tipo":"figura","pagina":55,"pie":"Artromotor (movilización pasiva continua) en la fase hospitalaria para prevenir rigidez y adherencias desde el primer día.","src":"img/ortesis-t11.1-endoprotesis-i-conceptos-protesis-de-organos-internos-tobill-p55.jpg"}]},{"id":"complicaciones","titulo":"Complicaciones de la PTR","bloques":[{"tipo":"tabla","titulo":"Complicaciones principales","columnas":["Complicación","Datos clave"],"filas":[["Lesión neurológica","**2–5 %**; neuroma"],["Compromiso vascular","Infección, hemorragia"],["Inestabilidad","**1–2 %** sintomática; más frecuente la **anteroposterior**; sensación de fallo y dolor; causas: **desequilibrio ligamentoso** y **tamaño inadecuado**"],["Aflojamiento","**Primera causa de fracaso**; línea **radiolucente periprotésica progresiva** + dolor mecánico en la zona del componente"],["Desgaste del polietileno","Asociado a inestabilidad y aflojamiento"],["Aparato extensor","Dolor anterior, inestabilidad, **clunk rotuliano**, rotura (tendón rotuliano, cuadricipital o fractura de rótula)"],["Rigidez","Artrofibrosis, sobredimensión del implante, cortes óseos insuficientes"],["Infección","**0,8 %**; *S. epidermidis* > *S. aureus*"],["Otras","Osificación heterotópica, fractura periprotésica"]]},{"tipo":"definicion","termino":"Síndrome de clunk rotuliano","texto":"Nódulo fibroso **detrás del tendón del cuádriceps** que se engancha en el cajetín femoral al extender la rodilla. Más típico de las prótesis **PS**; palpable a **30–45°** de extensión."},{"tipo":"esquema","titulo":"Manejo de la rigidez post-PTR","mermaid":"flowchart TD\n  A[\"Rigidez tras PTR\"] --> B{\"Menos de 90 grados de flexoextensión a las 6 semanas sin mejoría\"}\n  B -->|\"Sí\"| C[\"Manipulación bajo anestesia\"]\n  B -->|\"No\"| D[\"Continuar fisioterapia\"]\n  C --> E[\"Riesgos: lesión del aparato extensor o fractura periprotésica\"]","pie":"El mejor predictor de la movilidad final es el arco de movimiento preoperatorio."},{"tipo":"dato","valor":"Arco preoperatorio","texto":"Es el **factor pronóstico más importante** de la movilidad postoperatoria."},{"tipo":"alerta","texto":"**Todo paciente con dolor protésico es una infección hasta que se demuestre lo contrario.** Diagnóstico: **VSG, PCR** y estudio del líquido articular. El **cemento con antibiótico** reduce la tasa de infección."},{"tipo":"perla","texto":"Mayor riesgo de infección en **diabéticos, hemofílicos, obesos, revisiones e inmunodeprimidos**: ante dolor, calor o mala evolución en estos pacientes, deriva al traumatólogo en lugar de insistir con la cinesiterapia."}]}],"caso_clinico":{"titulo":"Mujer de 72 años con gonartrosis tricompartimental","presentacion":"Mujer de 72 años, con sobrepeso moderado, gonalgia derecha de 5 años que ya no responde a AINE, infiltraciones ni fisioterapia y le impide caminar más de 300 m. La Rx muestra pinzamiento femorotibial medial y lateral y artrosis femoropatelar. LCA degenerado. Se le implanta una PTR posteroestabilizada (PS) cementada de platillo fijo. Antes de la cirugía tenía un arco de 5–95°.","preguntas":[{"pregunta":"¿Por qué está indicada una PTR y no una prótesis unicondílea?","respuesta":"Cumple los cuatro criterios a la vez (dolor refractario, > 60 años, Rx con pérdida del espacio y artrosis primaria) y la afectación es **tricompartimental**; además, la unicondílea exige afectación de un solo compartimento, alineación normal y **LCA competente**, y está contraindicada en obesos."},{"pregunta":"¿Cuál es la prioridad de fisioterapia en las dos primeras semanas y qué error postural debe evitarse?","respuesta":"Conseguir la **extensión completa** junto con el control del dolor y el edema (crioterapia, elevación) y los isométricos de cuádriceps precoces. Debe evitarse la **almohada bajo la corva**, que favorece la flexión estática y un flexo residual."},{"pregunta":"A las 6 semanas solo alcanza 80° de flexión, sin mejoría, y nota un chasquido doloroso al extender hacia los 30–45°. ¿Qué piensas?","respuesta":"Rigidez con \u003c 90° a las 6 semanas sin mejoría: se plantea **manipulación bajo anestesia** (riesgo de lesión del aparato extensor o fractura periprotésica). El chasquido a 30–45° en una prótesis PS sugiere **síndrome de clunk rotuliano**. Si apareciera dolor no explicado, hay que descartar **infección** (VSG, PCR, líquido articular)."}]},"preguntate":[{"pregunta":"¿Qué diferencia una osteotomía, una artrodesis y una artroplastia?","respuesta":"La osteotomía corta el hueso para cambiar su forma o posición; la artrodesis fusiona huesos y elimina el movimiento; la artroplastia reemplaza o reconstruye la articulación conservando el movimiento."},{"pregunta":"¿En qué situaciones se prefiere la artrodesis a la artroplastia?","respuesta":"Deformidad severa, inestabilidad ligamentosa, casos en que la prótesis no es adecuada (mala calidad ósea, patología sistémica) y como cirugía de rescate cuando la artroplastia fracasa."},{"pregunta":"Nombra los tres tipos de prótesis de órganos internos con un ejemplo de cada uno.","respuesta":"Estructurales (válvula cardíaca), funcionales o bioelectrónicas (marcapasos, implante coclear) y artificiales completas (corazón artificial, riñón artificial)."},{"pregunta":"¿Cuáles son los tres componentes de una prótesis total de tobillo y qué hace cada uno?","respuesta":"Placa tibial (superior), componente astragalino (inferior) e inserto móvil de polietileno entre ambos, que reemplaza la articulación y permite la flexoextensión."},{"pregunta":"Ordena las opciones quirúrgicas del hallux valgus.","respuesta":"Primero osteotomía; si falla y se cumplen los requisitos, artroplastia MTF-1; como último recurso o rescate, artrodesis."},{"pregunta":"¿Qué requisitos debe cumplir un paciente para una prótesis unicondílea?","respuesta":"Artrosis de un solo compartimento femorotibial (sobre todo medial), alineación normal, articulación estable y no ser candidato a osteotomía; sin obesidad, sin déficit de LCA y sin artritis inflamatoria ni condrocalcinosis grave."},{"pregunta":"Explica la diferencia entre una prótesis CR, PS y CS.","respuesta":"CR conserva el LCP (más hueso, biomecánica natural); PS lo sustituye por un poste (semiconstreñida, más resección ósea); CS sacrifica ambos cruzados y compensa con un inserto ultracongruente."},{"pregunta":"¿Cuáles son los objetivos de flexión en la rehabilitación tras PTR?","respuesta":"90° en las dos primeras semanas y superar 110–120° hacia la semana 6, siempre sin perder la extensión completa."},{"pregunta":"¿Cómo se diagnostica el aflojamiento protésico y por qué es importante?","respuesta":"Por una línea radiolucente periprotésica progresiva con dolor mecánico en la zona del componente aflojado; es la primera causa de fracaso de la PTR."},{"pregunta":"¿Qué germen es el más frecuente en la infección de una PTR y cómo se estudia?","respuesta":"Staphylococcus epidermidis, seguido de S. aureus; se estudia con VSG, PCR y análisis del líquido articular."}],"glosario":[{"termino":"Endoprótesis","definicion":"Implante interno que reemplaza de forma permanente un hueso, una articulación u otro segmento."},{"termino":"Artroplastia","definicion":"Reemplazo o reconstrucción de una articulación que conserva el movimiento."},{"termino":"Artrodesis","definicion":"Fusión quirúrgica permanente de dos o más huesos que elimina el movimiento."},{"termino":"Osteotomía","definicion":"Corte controlado de un hueso para modificar su forma o posición."},{"termino":"TAR / STAR","definicion":"Total Ankle Replacement; la STAR es la Scandinavian Total Ankle Replacement."},{"termino":"Prótesis unicondílea","definicion":"Prótesis parcial que sustituye solo el compartimento femorotibial afectado."},{"termino":"Prótesis CR","definicion":"Prótesis de rodilla con retención del ligamento cruzado posterior; no constreñida."},{"termino":"Prótesis PS","definicion":"Prótesis posteroestabilizada: un poste sustituye la función del LCP; semiconstreñida."},{"termino":"Prótesis CS","definicion":"Prótesis de cruzado sacrificado con inserto de polietileno ultracongruente."},{"termino":"Prótesis híbrida","definicion":"Fémur no cementado y resto de componentes cementados."},{"termino":"Aflojamiento protésico","definicion":"Pérdida de fijación del implante; primera causa de fracaso de la PTR."},{"termino":"Clunk rotuliano","definicion":"Nódulo fibroso retrocuadricipital que se engancha en el cajetín femoral, sobre todo en prótesis PS."},{"termino":"Inhibición artrogénica","definicion":"Inhibición refleja de la activación del cuádriceps tras la cirugía de rodilla."},{"termino":"Artromotor","definicion":"Aparato de movilización pasiva continua usado desde la fase hospitalaria."}],"fuentes":["Universidad Europea de Valencia. Órtesis y Prótesis. Tema 11: Endoprótesis, parte 1 (pie y rodilla).","Pfeiff C. The Scandinavian total ankle replacement (STAR). Orthop Nurs. 2006.","Palanca A, Mann RA, Mann JA, Haskell A. Scandinavian Total Ankle Replacement: 15-Year Follow-up. Foot Ankle Int. 2018.","Arbuthnot JE et al. Replacement arthroplasty of the first metatarsophalangeal joint using a ceramic-coated endoprosthesis for the treatment of hallux rigidus.","Vanore, 2003 (imagen de fusión de la 1.ª AMTF).","Mallen-Trejo A et al. Artroplastia unicompartimental medial de rodilla con prótesis Oxford fase 3. Resultados con seguimiento de 2 a 11 años."],"qcm":[{"pregunta":"Paciente de 58 años con artrosis de tobillo y mala calidad ósea por enfermedad sistémica. ¿Qué opción quirúrgica es la más coherente con el temario?","opciones":["Artrodesis tibioastragalina","Prótesis HINTEGRA no cementada","Osteotomía de realineación tibial","Artroplastia total de tobillo tipo STAR"],"correcta":0,"explicacion":"La artroplastia exige buena calidad ósea y buen estado general; no se recomienda en pacientes con pobre calidad ósea o patologías sistémicas. En esos casos se prefiere la artrodesis, que estabiliza y alivia el dolor eliminando el movimiento.","por_opcion":["✅ La artrodesis es la opción cuando la prótesis no es adecuada (hueso pobre, patología sistémica).","❌ HINTEGRA es otra prótesis de tobillo: comparte la contraindicación de la artroplastia.","❌ La osteotomía modifica forma o posición del hueso; no trata una artrosis avanzada con hueso de mala calidad.","❌ La TAR requiere buena calidad ósea y buen estado general, que este paciente no tiene."]},{"pregunta":"Respecto a las prótesis de órganos internos, ¿qué afirmación es correcta?","opciones":["Las válvulas mecánicas obligan a anticoagular al paciente","El corazón artificial total es una solución definitiva a largo plazo","El implante coclear es una prótesis estructural del oído medio","El riñón artificial de hemodiálisis es una prótesis implantada completa"],"correcta":0,"explicacion":"Las válvulas cardíacas mecánicas (titanio, carbono, polímeros) conllevan riesgo de trombosis y necesitan anticoagulación. La hemodiálisis no se implanta y el corazón artificial es un puente al trasplante.","por_opcion":["✅ Las válvulas mecánicas requieren anticoagulantes por el riesgo de trombosis.","❌ El corazón artificial total no es una solución a largo plazo; es un puente al trasplante con batería externa.","❌ El implante coclear es una prótesis funcional/bioelectrónica que sustituye la función de la cóclea (oído interno).","❌ La hemodiálisis es extracorpórea: reemplaza la función renal pero no se implanta."]},{"pregunta":"En una prótesis total de tobillo tipo STAR, ¿qué componente permite propiamente la flexoextensión?","opciones":["El vástago intramedular peroneo","El inserto móvil de polietileno","La placa de fijación tibial","El componente astragalino metálico"],"correcta":1,"explicacion":"La TAR tiene placa tibial (superior), componente astragalino (inferior) e inserto móvil de polietileno entre ambos, que reemplaza la articulación en sí y permite la flexoextensión.","por_opcion":["❌ La prótesis de tobillo descrita no tiene componente peroneo.","✅ El inserto de polietileno es el componente móvil que permite la flexoextensión.","❌ La placa tibial es el componente superior de fijación.","❌ El componente astragalino es la parte inferior sobre la que desliza el inserto."]},{"pregunta":"Paciente con hallux valgus sintomático sin cirugías previas. Según el temario, ¿cuál es el tratamiento quirúrgico recomendado en la mayoría de los casos?","opciones":["Osteotomía del primer metatarsiano","Artroplastia de la primera metatarsofalángica","Prótesis cerámica de hallux rigidus","Artrodesis de la primera metatarsofalángica"],"correcta":0,"explicacion":"El tratamiento recomendado actualmente para el hallux valgus es la osteotomía; si falla y se cumplen los requisitos se hace una artroplastia, y la artrodesis queda como último recurso.","por_opcion":["✅ La osteotomía es el tratamiento de primera línea en la mayoría de los casos.","❌ La artroplastia MTF-1 es el segundo escalón, tras fallo de la osteotomía.","❌ La prótesis cerámica es un tipo de artroplastia, segundo escalón.","❌ La artrodesis es el último recurso, en rescate de cirugías previas."]},{"pregunta":"¿Cuál de estos pacientes presenta una contraindicación para la endoprótesis metatarsofalángica?","opciones":["Mujer de 68 años con artrosis MTF-1 y metatarsalgia de transferencia","Varón de 32 años, corredor de alto nivel, con hallux rigidus","Varón de 70 años que desea caminar y practicar golf recreativo","Mujer de 65 años con acortamiento del primer dedo por la deformidad"],"correcta":1,"explicacion":"Los pacientes jóvenes con alta demanda funcional son una contraindicación de la endoprótesis MTF. La mejora de metatarsalgias de transferencia, la corrección de la longitud del dedo y el deporte recreativo son ventajas.","por_opcion":["❌ La mejora de las metatarsalgias de transferencia es una ventaja de la prótesis.","✅ Joven con alta demanda funcional: contraindicación explícita.","❌ Algunos autores refieren buenos resultados con deporte recreacional en pacientes activos.","❌ Corregir la pérdida de longitud del dedo es una ventaja."]},{"pregunta":"¿Cuál de las siguientes situaciones contraindica una prótesis unicondílea de rodilla?","opciones":["Paciente no candidato a osteotomía","Alineación femorotibial normal","Déficit del ligamento cruzado anterior","Artrosis aislada del compartimento medial"],"correcta":2,"explicacion":"La unicondílea está contraindicada en obesos, en déficit de LCA y en artritis inflamatoria o condrocalcinosis grave; se indica en artrosis unicompartimental (sobre todo medial) con alineación normal y articulación estable.","por_opcion":["❌ No ser candidato a osteotomía forma parte de la indicación.","❌ La alineación normal es un requisito, no una contraindicación.","✅ El déficit de LCA es una contraindicación de la unicondílea.","❌ La artrosis unicompartimental medial es la indicación típica."]},{"pregunta":"Mujer de 52 años con artrosis femororrotuliana aislada y alineación femororrotuliana normal. ¿Qué prótesis se considera?","opciones":["Prótesis parcial femoropatelar","PTR constreñida en bisagra","PTR posteroestabilizada","Prótesis unicondílea medial"],"correcta":0,"explicacion":"La prótesis femoropatelar se considera en menores de 60 años con artrosis femororrotuliana aislada o condromalacia rotuliana y alineación normal; sustituye la cara posterior de la rótula y la anterior del fémur.","por_opcion":["✅ Femoropatelar: \u003c 60 años, artrosis FP aislada, alineación normal.","❌ La constreñida se reserva para rodillas muy inestables o revisiones con pérdida ósea.","❌ La PTR se indica idealmente en > 60 años y con afectación global.","❌ La unicondílea trata un compartimento femorotibial, no el femoropatelar."]},{"pregunta":"Paciente de 66 años con dolor intenso de rodilla refractario al tratamiento conservador y artrosis primaria, pero con Rx que conserva el espacio articular. Según el temario:","opciones":["Está indicada la PTR si además existe artrosis secundaria","Está indicada una prótesis constreñida para evitar inestabilidad","Está indicada la PTR porque predominan el dolor y la edad","No cumple la indicación porque los criterios deben darse juntos"],"correcta":3,"explicacion":"Las indicaciones de la PTR (dolor, edad, radiografía con pérdida del espacio articular y enfermedad compatible) deben darse todas juntas. Sin pérdida del espacio articular en la Rx no se cumple la indicación.","por_opcion":["❌ El tipo de artrosis no sustituye al criterio radiológico.","❌ La constreñida no tiene relación con la indicación; se usa en inestabilidad grave o revisiones.","❌ Dolor y edad no bastan: falta la confirmación radiológica.","✅ Los cuatro criterios deben darse a la vez; falta el radiológico."]},{"pregunta":"¿Cuál de las siguientes es una contraindicación RELATIVA de la prótesis total de rodilla?","opciones":["Infección articular activa","Aparato extensor incompetente","Artrodesis previa funcional e indolora","Insuficiencia arterial del miembro"],"correcta":2,"explicacion":"Las contraindicaciones relativas son el recurvatum por debilidad muscular y la artrodesis previa funcional e indolora. Infección activa, compromiso vascular y aparato extensor incompetente son contraindicaciones absolutas.","por_opcion":["❌ La infección activa es contraindicación absoluta.","❌ El aparato extensor incompetente es contraindicación absoluta.","✅ La artrodesis previa funcional e indolora es contraindicación relativa.","❌ El compromiso vascular es contraindicación absoluta."]},{"pregunta":"¿Qué prótesis de rodilla sacrifica ambos ligamentos cruzados pero sigue siendo no constreñida gracias a la geometría del inserto?","opciones":["Prótesis CR","Prótesis CS","Prótesis PS","Prótesis en bisagra"],"correcta":1,"explicacion":"La prótesis CS (cruzado sacrificado o ultracongruente) sacrifica ambos cruzados y logra la estabilidad con un inserto de polietileno más alto y congruente; es una opción intermedia entre CR y PS y se considera no constreñida.","por_opcion":["❌ La CR conserva el LCP.","✅ La CS sacrifica ambos cruzados y usa un inserto ultracongruente; no constreñida.","❌ La PS sustituye el LCP con un poste y es semiconstreñida.","❌ La bisagra es constreñida."]},{"pregunta":"Paciente con hueso no osteoporótico. ¿Qué configuración de fijación describe el temario como buena opción en este caso?","opciones":["Todos cementados con platillo móvil","Fémur cementado y tibia no cementada","Todos los componentes no cementados","Fémur no cementado y resto cementado"],"correcta":3,"explicacion":"La prótesis híbrida (fémur no cementado, resto cementado) es una buena opción en huesos no osteoporóticos. Las no cementadas tienen peores resultados en los componentes tibial y patelar.","por_opcion":["❌ El platillo móvil no es el más usado y la descripción no corresponde a la híbrida.","❌ Es la combinación inversa a la híbrida descrita.","❌ Las no cementadas tienen peores resultados en tibia y rótula por fatiga del metal y dolor persistente.","✅ Es la definición de prótesis híbrida, indicada en hueso no osteoporótico."]},{"pregunta":"Durante la primera semana tras una PTR, ¿qué medida es INCORRECTA?","opciones":["Crioterapia intermitente con elevación","Movilización pasiva con artromotor","Isométricos de cuádriceps lo antes posible","Almohada bajo la corva para el confort"],"correcta":3,"explicacion":"En la fase inicial se eleva el miembro evitando colocar almohadas bajo la corva, porque favorecen la flexión estática y comprometen la extensión completa, que es la prioridad absoluta.","por_opcion":["❌ Frío intermitente y elevación controlan dolor y edema.","❌ La movilización pasiva desde el día 1 previene rigidez y adherencias.","❌ Los isométricos precoces forman parte de la fase inicial.","✅ La almohada bajo la corva favorece la flexión estática: está desaconsejada."]},{"pregunta":"¿Cuál es la primera causa de fracaso de una prótesis total de rodilla?","opciones":["Infección periprotésica","Inestabilidad anteroposterior","Síndrome de clunk rotuliano","Aflojamiento protésico"],"correcta":3,"explicacion":"El aflojamiento es la primera causa de fracaso de una PTR; se diagnostica por una línea radiolucente periprotésica progresiva y dolor mecánico en la zona del componente aflojado.","por_opcion":["❌ La infección tiene una incidencia del 0,8 %; no es la primera causa de fracaso.","❌ La inestabilidad sintomática afecta al 1–2 %; es la más frecuente dentro de las inestabilidades, no la primera causa de fracaso.","❌ El clunk es un problema del aparato extensor, sobre todo en prótesis PS.","✅ El aflojamiento es la primera causa de fracaso."]},{"pregunta":"A las 6 semanas de una PTR el paciente tiene 80° de flexoextensión sin progresión. ¿Qué indica el temario?","opciones":["Manipulación bajo anestesia","Artrodesis de rescate inmediata","Infiltración y reposo de 4 semanas","Recambio a prótesis constreñida"],"correcta":0,"explicacion":"Si hay menos de 90° de flexoextensión en las primeras 6 semanas sin signos de mejoría se recomienda la manipulación bajo anestesia, con riesgo de lesión del aparato extensor o fractura periprotésica.","por_opcion":["✅ \u003c 90° a las 6 semanas sin mejoría: manipulación bajo anestesia.","❌ La artrodesis es una cirugía de rescate del fracaso protésico, no la respuesta a una rigidez precoz.","❌ El reposo agravaría la rigidez; no es lo que indica el temario.","❌ La constreñida se usa en inestabilidad grave o revisiones con pérdida ósea, no en rigidez."]},{"pregunta":"Sobre la infección de una PTR, ¿qué afirmación es correcta?","opciones":["Se diagnostica principalmente con la radiografía simple","Su incidencia ronda el 5 % de las artroplastias","El cemento con antibiótico reduce la tasa de infección","El germen más frecuente es Staphylococcus aureus"],"correcta":2,"explicacion":"El uso de cemento con antibióticos reduce la tasa de infecciones. El germen más frecuente es S. epidermidis, la incidencia es del 0,8 % y el diagnóstico se apoya en VSG, PCR y líquido articular.","por_opcion":["❌ El diagnóstico se basa en VSG, PCR y estudio del líquido articular.","❌ La incidencia es del 0,8 %; el 2–5 % corresponde a la lesión neurológica.","✅ El cemento con antibióticos reduce la tasa de infecciones.","❌ El más frecuente es S. epidermidis; S. aureus es el segundo."]}],"asignatura":"Ortesis","tema":11.1,"fecha":"2026-11-19"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
