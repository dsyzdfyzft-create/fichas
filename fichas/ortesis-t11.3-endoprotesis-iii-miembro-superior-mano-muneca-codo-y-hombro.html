<!DOCTYPE html>
<html lang="es">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>

<script id="datos" type="application/json">{"titulo":"Endoprótesis III: miembro superior (mano, muñeca, codo y hombro)","subtitulo":"Prótesis MCP/IFP y trapeciometacarpiana, artroplastia de muñeca y de codo, y los cuatro tipos de prótesis de hombro (anatómica, hemiartroplastia, superficie e invertida) con su elección según el manguito rotador.","resumen":["En la mano se protetizan sobre todo las **MCP e IFP**; las **IFD casi siempre se artrodesan**, y la prótesis **trapeciometacarpiana** (sobre todo **total**) trata la **rizartrosis grado III–IV** en pacientes de **50–70 años** con buen hueso trapecial.","La prótesis de muñeca (total o hemiartroplastia) da una **flexoextensión moderada** y está pensada para **> 60 años** con artritis inflamatoria o artrosis avanzada, actividad moderada y **sin cargar mucho peso**.","La prótesis de codo tiene **componente humeral, ulnar (± radial) y sistema articulado**; las **con charnela** (constreñidas/semiconstreñidas) son las más usadas, y las **sin charnela** exigen **ligamentos colaterales intactos**.","En el hombro, la elección depende del **manguito rotador**: **anatómica (TSA)** si está intacto y hay buen hueso; **invertida (RSA)** si está roto de forma irreparable, porque usa el **deltoides** para elevar el brazo.","La **hemiartroplastia** de hombro no lleva glena (glena sana, típicamente **fractura** sin artrosis); el posoperatorio usa **cabestrillo 3–6 semanas**, rehabilitación formal a las **4–6 semanas** y evita **ABD + RE**."],"objetivos":["Describir las endoprótesis de mano (MCP, IFP, IFD) y trapeciometacarpiana con sus indicaciones.","Enumerar los principios de una prótesis de muñeca, sus componentes y su perfil de paciente.","Diferenciar las prótesis de codo con y sin charnela según la integridad de los ligamentos colaterales.","Elegir entre TSA, hemiartroplastia, prótesis de superficie y RSA según el manguito, la glena, la edad y la calidad ósea.","Conocer la valoración preoperatoria y las pautas postoperatorias de la artroplastia de hombro."],"ideas_clave":["Mecanismo común en mano/muñeca: **destrucción del cartílago, deformidad y pérdida de congruencia** → dolor y pérdida de la función fina.","Mano: MCP e IFP se protetizan; **IFD → artrodesis** casi siempre.","TMC: rizartrosis **III–IV**, dolor resistente, **50–70 años**, pérdida de pinza/agarre, **buen hueso trapecial**, pacientes activos; la **total** es la más usada.","Muñeca: **> 60 años**, actividad moderada, no levantar mucho peso; componente carpal fijado al **semilunar, grande y piramidal**.","Codo: **con charnela** = estabilidad, las más usadas (AR, destrucción severa, hueso malo, inestabilidad); **sin charnela** = ligamentos colaterales intactos, riesgo de luxación.","Hombro: **TSA** = manguito intacto + buen hueso; **HA** = glena sana (fractura), contraindicada con manguito no funcional; **superficie** = sin vástago, joven, hueso muy bueno; **RSA** = manguito roto irreparable, usa el deltoides.","RSA: primera indicación en **> 70 años** con rotura masiva del manguito e impotencia funcional; **consume más hueso** → poco adecuada en jóvenes.","Implantes **no cementados** en jóvenes (más fáciles de recambiar); **cementados** en osteopenia o edad avanzada; la **glena suele cementarse**."],"secciones":[{"id":"conceptos","titulo":"Conceptos generales","bloques":[{"tipo":"definicion","termino":"Endoprótesis","texto":"Implante interno que reemplaza total o parcialmente una articulación o segmento óseo para **restaurar la función, la estabilidad y aliviar el dolor**; fabricada con titanio o cobalto-cromo, polietileno de alta densidad o cerámica."},{"tipo":"tarjetas","items":[{"etiqueta":"Corta","titulo":"Osteotomía","texto":"Corte controlado del hueso para modificar su forma o posición."},{"etiqueta":"Fusiona","titulo":"Artrodesis","texto":"Fusión permanente de dos o más huesos; elimina el movimiento para dar estabilidad y aliviar el dolor; es la **cirugía de rescate** de la artroplastia fallida."},{"etiqueta":"Sustituye","titulo":"Artroplastia","texto":"Reemplaza o reconstruye la articulación conservando el movimiento; requiere buena calidad ósea y buen estado general."}]},{"tipo":"parrafo","texto":"En el miembro superior, la elección entre artroplastia y artrodesis depende sobre todo de **cuánto movimiento necesita esa articulación** para la función: en la mano y la muñeca se pierde la capacidad de cocinar, escribir o hacer movimientos finos; en el hombro, la clave es el estado de las **estructuras tendinosas** (manguito rotador) que sostienen la articulación."}]},{"id":"mano","titulo":"Prótesis de mano: MCP, IFP, IFD y trapeciometacarpiana","bloques":[{"tipo":"parrafo","texto":"Las patologías que llevan a una prótesis de mano o muñeca comparten un mecanismo: **destrucción progresiva del cartílago articular, deformidad y pérdida de congruencia**. El resultado es una pérdida rápida de función e independencia, con dolor prolongado e incapacidad para las actividades finas (cocinar, escribir…). Se indica en **artrosis, artrosis postraumática, artritis reumatoide y necrosis avascular** (escafoides)."},{"tipo":"tabla","titulo":"Articulaciones de los dedos","columnas":["Articulación","Tratamiento habitual","Comentario"],"filas":[["MCP (metacarpofalángica)","**Artroplastia** (frecuente)","Ejemplo del tema: artroplastia MCP de 2.º y 3.er dedo"],["IFP (interfalángica proximal)","**Artroplastia** (frecuente)","Junto con las MCP, las más protetizadas"],["IFD (interfalángica distal)","**Artrodesis casi siempre**","Rara vez se reemplazan"],["MCP del pulgar","Puede artrodesarse","Ejemplo del tema: artrodesis MCP del pulgar"]]},{"tipo":"parrafo","texto":"La **prótesis trapeciometacarpiana (TMC)** trata la **rizartrosis**: mejora la sintomatología, la función y la deformidad de la base del pulgar. Existen la **artroplastia total** (la más usada: reemplaza la cabeza del primer metacarpiano y la cavidad del trapecio), la **hemiartroplastia** (solo la base del primer metacarpiano) y la de **superficie**."},{"tipo":"figura","pagina":9,"pie":"Prótesis trapeciometacarpiana total: Rx antes y después, implante y test de pinza pre y postartroplastia.","src":"img/ortesis-t11.3-endoprotesis-iii-miembro-superior-mano-muneca-codo-y-hombro-p9.jpg"},{"tipo":"tabla","titulo":"Indicaciones de la artroplastia TMC","columnas":["Criterio","Detalle"],"filas":[["Grado radiológico","Rizartrosis **grado III–IV**"],["Dolor","Severo, **resistente al tratamiento conservador**"],["Edad","**50–70 años** (antes: tratamiento conservador u osteotomía)"],["Función","Pérdida funcional significativa (**pinza, agarre**)"],["Hueso","**Buen hueso trapecial**"],["Perfil","Pacientes **activos que requieren movilidad preservada**"]]},{"tipo":"dato","valor":"III–IV · 50–70 años","texto":"Grado de rizartrosis y franja de edad en que se indica la prótesis trapeciometacarpiana."},{"tipo":"alerta","texto":"No confundas: las **IFD** casi nunca se protetizan (se **artrodesan**); las prótesis frecuentes son **MCP e IFP**. Y en la TMC la **hemiartroplastia** sustituye solo la **base del primer metacarpiano**, mientras que la **total** sustituye metacarpiano + cavidad del trapecio."},{"tipo":"perla","texto":"Tras una prótesis TMC, el objetivo funcional es la **pinza y el agarre**: valora la fuerza de pinza antes y después (el tema muestra el test en pinza pre y postartroplastia) y reeduca la oposición del pulgar sin sobrecargar la prótesis."},{"tipo":"parrafo","texto":"La elección entre artroplastia y artrodesis en los dedos sigue la función: la **MCP y la IFP** aportan la mayor parte del arco de flexión necesario para el agarre, por lo que merece la pena conservar su movimiento con una prótesis; la **IFD** aporta menos y se estabiliza mejor fusionándola (complemento). En el **pulgar**, el tema muestra tanto la artrodesis de la MCP como la artroplastia de la trapeciometacarpiana, cuya movilidad es esencial para la oposición y la pinza."}]},{"id":"muneca","titulo":"Prótesis de muñeca","bloques":[{"tipo":"parrafo","texto":"La artroplastia de muñeca permite una **flexoextensión moderada** (mucho menor que la de una muñeca normal). Está diseñada para **artritis inflamatoria y artrosis avanzada** y es ideal en **mayores de 60 años** con actividad moderada que **no levantan mucho peso**. Frente a la técnica convencional (**artrodesis**, que elimina el dolor pero pierde la movilidad), la prótesis busca conservar la función."},{"tipo":"lista","items":["1. Reconstruir los **ejes de rotación** anatómicos de la muñeca.","2. Restaurar la relación de **longitud carpo-metacarpiana**.","3. Disminuir el dolor.","4. Mejorar el rango de movilidad.","5. Proporcionar una **fijación estable y duradera**.","6. Ofrecer una técnica quirúrgica no complicada y fácilmente reproducible.","7. Dejar disponibles **opciones de rescate** si la prótesis falla."]},{"tipo":"alerta","texto":"El temario anuncia «**6 principios**» pero enumera **7**: el último es dejar opciones de rescate en caso de fallo. Apréndelos todos."},{"tipo":"tabla","titulo":"Tipos de artroplastia de muñeca","columnas":["Tipo","Componentes","Uso"],"filas":[["Total","**Componente radial**; **componente carpal** fijado a la primera línea del carpo (normalmente **semilunar, grande y piramidal**) con placa o vástago; **superficie de articulación**","La habitual"],["Hemiartroplastia","Solo el **radial** o solo el **carpal** (p. ej., semilunar)","**Menos usadas**"]]},{"tipo":"figura","pagina":13,"pie":"Prótesis de muñeca frente a artrodesis: componente radio, bola carpiana y componente carpo; dirigida a mayores de 65 años que no hacen actividades de impacto ni levantan grandes pesos.","src":"img/ortesis-t11.3-endoprotesis-iii-miembro-superior-mano-muneca-codo-y-hombro-p13.jpg"},{"tipo":"dato","valor":"> 60 años","texto":"Perfil ideal de la prótesis de muñeca: mayor de 60 años, actividad moderada y sin levantar mucho peso."},{"tipo":"perla","texto":"Educa al paciente con prótesis de muñeca para **evitar cargas pesadas e impactos**: el implante tolera la actividad moderada, y sobrecargarlo compromete la fijación, que es uno de sus principios básicos."}]},{"id":"codo","titulo":"Prótesis de codo","bloques":[{"tipo":"parrafo","texto":"Según Mansat (2024), la prótesis de codo está indicada cuando la destrucción de las superficies articulares provoca **dolor crónico y pérdida progresiva de movilidad y función**. Las patologías comparten **destrucción del cartílago, deformidad y pérdida de congruencia, dolor persistente e inflamación, y rigidez, bloqueo o inestabilidad**: artritis reumatoide, artrosis postraumática, **fracturas conminutas de húmero distal** y artropatías destructivas."},{"tipo":"parrafo","texto":"La elección del implante depende de la **edad**, de la articulación afectada dentro del codo (**radiocapitelar, ulnohumeral o ambas**) y de la causa de la artrosis. Pueden ser **totales** (componente humeral, ulnar ± radial y sistema articulado; **no suelen cementarse**) o **hemiartroplastias**, que sustituyen solo el **componente radial proximal** (prótesis de cúpula radial)."},{"tipo":"figura","pagina":19,"pie":"Prótesis total de codo primaria con componente humeral, ulnar y radial unidos por el sistema articulado (Mansat, 2024).","src":"img/ortesis-t11.3-endoprotesis-iii-miembro-superior-mano-muneca-codo-y-hombro-p19.jpg"},{"tipo":"tabla","titulo":"Prótesis total de codo según la conexión entre componentes","columnas":["Tipo","Conexión","Ventajas / riesgos","Indicaciones"],"filas":[["Constreñida o semiconstreñida «con charnela»","Humeral y ulnar unidos mecánicamente por un **eje**","**Estabilidad** → **las más usadas**","**AR**, destrucción severa, **mala calidad ósea**, inestabilidad"],["No constreñida «sin charnela»","Componentes **independientes**","Menos estrés en el implante, pero **riesgo de luxación**","**Artrosis primaria** o ligamentos sanos; exige **ligamentos colaterales intactos**"]]},{"tipo":"esquema","titulo":"Elección de la prótesis de codo","mermaid":"flowchart TD\n  A[\"Codo destruido y doloroso\"] --> B{\"Afecta solo la cabeza radial\"}\n  B -->|\"Sí\"| C[\"Hemiartroplastia: cúpula radial\"]\n  B -->|\"No\"| D{\"Ligamentos colaterales intactos\"}\n  D -->|\"Sí, artrosis primaria\"| E[\"Total sin charnela: no constreñida\"]\n  D -->|\"No: AR, hueso malo, inestabilidad\"| F[\"Total con charnela: la más usada\"]","pie":"La integridad de los ligamentos colaterales decide el tipo de conexión."},{"tipo":"alerta","texto":"La prótesis **sin charnela** genera **menos estrés** en el implante, pero solo es posible con **ligamentos colaterales intactos**; si no, se luxa. Las **con charnela** son las más usadas precisamente porque aportan la estabilidad que el codo patológico ha perdido."},{"tipo":"perla","texto":"Antes de movilizar un codo protetizado, pregunta qué tipo de conexión tiene: en una prótesis **sin charnela** la estabilidad depende de los **ligamentos colaterales**, por lo que conviene evitar estrés en varo-valgo durante la fase precoz (complemento)."}]},{"id":"hombro-tipos","titulo":"Prótesis de hombro: los cuatro tipos","bloques":[{"tipo":"parrafo","texto":"Hay dos grandes modalidades, **anatómica e invertida**, y el tipo de cirugía depende ante todo del **daño de las estructuras tendinosas** que sostienen la articulación (manguito rotador). En total se describen **4 tipos**: anatómica (total), parcial o hemiartroplastia, de superficie (anclaje metafisario) e invertida."},{"tipo":"tabla","titulo":"Resumen de artroplastias de hombro (tabla del temario)","columnas":["Tipo","Cuándo se usa","Tipo de paciente","Características"],"filas":[["Hemiartroplastia (HA)","Fracturas complejas de húmero proximal; necrosis de la cabeza humeral","Jóvenes o ancianos con **glenoides sano**","Solo reemplaza la cabeza humeral; **depende de la reparación de las tuberosidades**"],["Total anatómica (TSA)","Artrosis primaria o postraumática con **manguito íntegro**","Adultos jóvenes o mayores con manguito funcional","Reemplaza cabeza + glenoides; **mejor movilidad** pero depende del manguito"],["Reversa (RSA)","Rotura masiva del manguito; artropatía por manguito; fracturas en ancianos","Mayores; manguito no funcional","**Invierte la biomecánica**; el deltoides eleva el brazo; muy utilizada hoy"],["Resurfacing","Artrosis leve o lesión focal en jóvenes","Adultos jóvenes","**Preserva hueso**; menor vida útil que TSA/RSA"]]},{"tipo":"tabla","titulo":"Comparación de las prótesis de hombro","columnas":["Tipo","Qué sustituye","Requisitos / indicación","Claves"],"filas":[["Anatómica total (TSA)","**Vástago humeral + cabeza** (casquete esférico) + **glena de polietileno** cóncava","**Buena calidad ósea y manguito intacto** (hombro estable): artrosis primaria, AR sin rotura del manguito, artrosis postraumática con manguito sano, necrosis avascular con glenoides preservado","Imita la anatomía; mejor movilidad pero **depende del manguito**"],["Hemiartroplastia (HA)","Como la TSA pero **sin glena**","**Cartílago glenoideo sano**: típico de **fractura** de cabeza humeral sin artrosis; necrosis de la cabeza","Menor tiempo quirúrgico y **sin aflojamiento glenoideo**; **contraindicada con manguito no funcional**; depende de la reparación de las tuberosidades"],["Superficie / anclaje metafisario","**Solo la cabeza humeral, sin vástago**","**Jóvenes con artrosis inicial**, lesiones focales, preservar hueso; **muy buena calidad ósea**","Consume poco hueso, facilita recambios; no si hay daño glenoideo; menor vida útil que TSA/RSA"],["Invertida (RSA)","Glena **convexa** (glenosfera) y húmero **cóncavo**: al revés de lo natural","**Manguito roto e irreparable**, artropatía por desgarro, fracturas de húmero proximal en ancianos, fallo de TSA, luxaciones crónicas en mayores","El **deltoides** eleva el brazo; **consume mucho hueso**; muy usada hoy"]]},{"tipo":"definicion","termino":"Prótesis invertida (RSA)","texto":"El húmero se **excava** para alojar y articularse sobre un componente escapular **semiesférico**, al revés de la disposición natural. Así el **deltoides** pasa a ser el motor que **eleva y estabiliza** el brazo cuando el manguito ya no funciona."},{"tipo":"figura","pagina":30,"pie":"Prótesis total (anatómica) frente a invertida: en la invertida la glenosfera es convexa y el cuerpo humeral con polietileno es cóncavo.","src":"img/ortesis-t11.3-endoprotesis-iii-miembro-superior-mano-muneca-codo-y-hombro-p30.jpg"},{"tipo":"alerta","texto":"Trampa: una prótesis anatómica puede **quitar el dolor** a un paciente con el manguito roto, pero **no le devuelve la movilidad**; por eso en rotura irreparable se elige la **invertida**. Además, la **hemiartroplastia está contraindicada** si el manguito no es funcional."},{"tipo":"dato","valor":"> 70 años","texto":"La **RSA es la primera indicación** en pacientes de más de 70 años con artropatía secundaria a **rotura masiva del manguito e impotencia funcional**; en ese caso la **TSA está contraindicada**."},{"tipo":"perla","texto":"En el paciente con prótesis invertida, el **deltoides** es el músculo clave: su fortalecimiento progresivo (cuando lo autorice el protocolo) es el que devuelve la elevación del brazo, porque el manguito ya no participa."},{"tipo":"parrafo","texto":"La lógica de la **glena** explica por qué existen la hemiartroplastia y la prótesis de superficie: el componente glenoideo es **responsable de muchos fracasos** de las prótesis de hombro (aflojamiento glenoideo), así que, cuando el cartílago de la glena está sano, no sustituirla evita problemas. Al revés, cuando la glena está dañada (artrosis glenohumeral), una prótesis que solo cambie la cabeza humeral dará peores resultados y se prefiere la total."},{"tipo":"parrafo","texto":"En la **RSA**, el componente escapular es semiesférico (glenosfera) y el humeral es cóncavo; existen versiones **con vástago** y **sin vástago (stemless)**, como se ve en las radiografías del tema. Sus indicaciones son: rotura masiva e irreparable del manguito, artropatía por desgarro del manguito, **fracturas proximales de húmero en ancianos** (alternativa superior a la hemiartroplastia), artrosis glenohumeral con manguito insuficiente, **fallo de una artroplastia anatómica previa** y **luxaciones crónicas** del hombro en mayores."}]},{"id":"hombro-eleccion","titulo":"Indicaciones, elección del implante y posoperatorio del hombro","bloques":[{"tipo":"tabla","titulo":"Indicaciones de la artroplastia de hombro","columnas":["Patología","Condición clínica"],"filas":[["Artrosis glenohumeral primaria o secundaria a fracturas","**Dolor intenso** (criterio destacado)"],["Necrosis avascular de la cabeza humeral","**Déficits funcionales que no mejoran con el tratamiento conservador**"],["Artropatía degenerativa secundaria a rotura crónica del manguito","—"],["Artropatías inflamatorias","—"]]},{"tipo":"esquema","titulo":"Algoritmo de elección de la prótesis de hombro","mermaid":"flowchart TD\n  A[\"Hombro candidato a prótesis\"] --> B{\"Manguito rotador funcional\"}\n  B -->|\"No, rotura irreparable\"| R[\"Prótesis invertida RSA\"]\n  B -->|\"Sí\"| C{\"Glena sana\"}\n  C -->|\"Sí, fractura sin artrosis\"| H[\"Hemiartroplastia\"]\n  C -->|\"No, artrosis glenohumeral\"| T[\"Anatómica total TSA\"]\n  B -->|\"Sí, joven con artrosis inicial y hueso muy bueno\"| S[\"Prótesis de superficie\"]","pie":"El manguito decide entre anatómica e invertida; la glena, entre total y hemiartroplastia."},{"tipo":"tabla","titulo":"Criterios de elección y valoración del paciente","columnas":["Criterio","Qué valorar"],"filas":[["Indicaciones/contraindicaciones","Conocerlas para cada tipo"],["Imagen","Radiografía: morfología de la **cabeza humeral y de la glena**"],["Edad y demanda","Edad y **demanda funcional** del paciente"],["Manguito rotador","Su estado; **RM si hay dudas**"],["Anamnesis y exploración","Movilidad **activa y pasiva**, **deltoides** y manguito, dolor, calidad de vida, nivel de actividad, patologías subyacentes"]]},{"tipo":"tabla","titulo":"Decisiones según edad y hueso","columnas":["Pregunta","Respuesta del temario"],"filas":[["¿Parcial o total?","En **jóvenes, mejor parcial**: a más demanda, más desgaste del polietileno y más riesgo de recambio"],["¿Cementado o no?","**No cementados en jóvenes** (más fáciles de recambiar); **cementados en osteopenia o edad avanzada**"],["¿Y la glena?","El componente glenoideo **suele ser cementado**"]]},{"tipo":"tabla","titulo":"Seguimiento y educación postoperatoria","columnas":["Momento","Pauta"],"filas":[["Preoperatorio","Explicar expectativas y pauta de movilización; conviene que el **fisioterapeuta instruya ya antes de la cirugía**"],["Poco después de la cirugía","Ejercicios suaves de **movilización pasiva**"],["3–6 semanas","**Cabestrillo** o inmovilizador según el tipo de prótesis"],["4–6 semanas","Comienza la **rehabilitación propiamente dicha**"],["Siempre","Evitar movimientos forzados en **ABD + RE** (riesgo de luxación)"]]},{"tipo":"dato","valor":"3–6 / 4–6 semanas","texto":"**3–6 semanas** de cabestrillo; la rehabilitación formal empieza a las **4–6 semanas** tras la operación."},{"tipo":"alerta","texto":"La combinación peligrosa tras una prótesis de hombro es **abducción + rotación externa** forzadas: no la incluyas en la movilización precoz."},{"tipo":"perla","texto":"Antes de la cirugía, explora siempre **deltoides y manguito**: si el deltoides es débil, la prótesis invertida perderá su motor; si el manguito está roto, la anatómica no devolverá la movilidad. Esa exploración orienta qué implante tiene sentido y qué expectativas dar."}]}],"caso_clinico":{"titulo":"Mujer de 76 años con artropatía de manguito","presentacion":"Mujer de 76 años, diestra, con dolor intenso en el hombro derecho de dos años que no mejora con infiltraciones ni fisioterapia. No consigue elevar el brazo por encima de 60° de forma activa, aunque pasivamente llega a 150°. La RM muestra una rotura masiva e irreparable del supraespinoso e infraespinoso con artrosis glenohumeral secundaria. El deltoides está conservado. Tiene osteopenia.","preguntas":[{"pregunta":"¿Qué prótesis está indicada y por qué no una anatómica?","respuesta":"Una **prótesis invertida (RSA)**: es la primera indicación en **> 70 años con rotura masiva del manguito e impotencia funcional**. La **TSA está contraindicada** en la artropatía por rotura masiva: podría quitar el dolor, pero **no devolvería la movilidad** porque depende del manguito."},{"pregunta":"¿Por qué es importante que el deltoides esté conservado?","respuesta":"Porque la RSA invierte la biomecánica para que el **deltoides** sea el que **eleve y estabilice** el brazo; sin deltoides funcional el implante no aportaría elevación."},{"pregunta":"¿Qué pautas darás en las primeras semanas?","respuesta":"Instrucción ya en el preoperatorio, **movilización pasiva suave** poco después de la cirugía, **cabestrillo 3–6 semanas**, inicio de la rehabilitación formal a las **4–6 semanas** y evitar **abducción + rotación externa forzadas**. Por la osteopenia y la edad es probable un implante **cementado**."}]},"preguntate":[{"pregunta":"¿Qué mecanismo comparten las patologías que llevan a una prótesis de mano o muñeca?","respuesta":"Destrucción progresiva del cartílago articular, deformidad y pérdida de congruencia, con dolor y pérdida de la función fina."},{"pregunta":"¿Qué articulaciones de los dedos se protetizan y cuál se artrodesa casi siempre?","respuesta":"Se protetizan sobre todo las MCP y las IFP; las IFD casi siempre se artrodesan."},{"pregunta":"Enumera las indicaciones de la artroplastia trapeciometacarpiana.","respuesta":"Rizartrosis grado III–IV, dolor severo resistente al tratamiento conservador, 50–70 años, pérdida significativa de pinza o agarre, buen hueso trapecial y pacientes activos que necesitan movilidad."},{"pregunta":"¿Qué paciente es el candidato ideal a una prótesis de muñeca?","respuesta":"Mayor de 60 años con artritis inflamatoria o artrosis avanzada, nivel de actividad moderado y que no levanta mucho peso."},{"pregunta":"¿A qué huesos se fija el componente carpal de una prótesis total de muñeca?","respuesta":"A la primera línea del carpo, normalmente semilunar, grande y piramidal, mediante placa o vástago."},{"pregunta":"Compara las prótesis de codo con charnela y sin charnela.","respuesta":"Con charnela: humeral y ulnar unidos por un eje, dan estabilidad, son las más usadas (AR, hueso malo, inestabilidad). Sin charnela: componentes independientes, menos estrés pero riesgo de luxación, exigen ligamentos colaterales intactos."},{"pregunta":"¿Qué dos condiciones exige una prótesis anatómica total de hombro?","respuesta":"Buena calidad ósea y manguito de los rotadores intacto (hombro estable)."},{"pregunta":"¿Cuándo se usa una hemiartroplastia de hombro y cuándo está contraindicada?","respuesta":"Cuando el cartílago de la glena está sano, típicamente en fractura de la cabeza humeral sin artrosis; está contraindicada si el manguito rotador no es funcional."},{"pregunta":"Explica por qué la prótesis invertida funciona aunque el manguito esté roto.","respuesta":"Porque invierte la articulación (glena convexa, húmero cóncavo) y permite que el deltoides eleve y estabilice el brazo, sustituyendo la función del manguito."},{"pregunta":"¿Qué movimientos se evitan tras una prótesis de hombro y cuándo empieza la rehabilitación formal?","respuesta":"Se evitan la abducción con rotación externa forzadas; la rehabilitación propiamente dicha empieza a las 4–6 semanas, tras 3–6 semanas de cabestrillo."}],"glosario":[{"termino":"Rizartrosis","definicion":"Artrosis de la articulación trapeciometacarpiana, en la base del pulgar."},{"termino":"Prótesis TMC","definicion":"Prótesis trapeciometacarpiana; la total sustituye la cabeza del primer metacarpiano y la cavidad del trapecio."},{"termino":"Hemiartroplastia","definicion":"Artroplastia que sustituye solo una de las dos superficies articulares."},{"termino":"Componente carpal","definicion":"Parte de la prótesis de muñeca fijada a semilunar, grande y piramidal."},{"termino":"Prótesis con charnela","definicion":"Prótesis de codo constreñida o semiconstreñida con humeral y ulnar unidos por un eje."},{"termino":"Prótesis de cúpula radial","definicion":"Hemiartroplastia de codo que sustituye solo el radio proximal."},{"termino":"TSA","definicion":"Total Shoulder Arthroplasty: prótesis anatómica total de hombro."},{"termino":"RSA","definicion":"Reverse Shoulder Arthroplasty: prótesis invertida de hombro."},{"termino":"Glenosfera","definicion":"Componente glenoideo convexo de la prótesis invertida."},{"termino":"Anclaje metafisario","definicion":"Fijación sin vástago de la prótesis de superficie de hombro."},{"termino":"Manguito rotador","definicion":"Conjunto tendinoso que estabiliza el hombro; su estado decide entre TSA y RSA."},{"termino":"Impotencia funcional","definicion":"Incapacidad de realizar el movimiento activo, p. ej. elevar el brazo."}],"fuentes":["Universidad Europea de Valencia. Órtesis y Prótesis. Tema 11: Endoprótesis, parte 3 (miembro superior).","Mansat, 2024. Prótesis total de codo primaria.","Novoa, 2024. Total elbow arthroplasty in extreme cases and post-traumatic osteoarthritis.","Fontg Manzano F. Functional outcomes in Total Wrist Arthroplasties.","Clínica Universidad de Navarra, 2019 (infografía de prótesis de muñeca)."],"qcm":[{"pregunta":"En la mano, ¿qué articulación se trata casi siempre mediante artrodesis en lugar de prótesis?","opciones":["Metacarpofalángica de los dedos largos","Trapeciometacarpiana","Interfalángica distal","Interfalángica proximal"],"correcta":2,"explicacion":"Las prótesis más frecuentes en la mano son las MCP y las IFP; las IFD rara vez se reemplazan y se artrodesan casi siempre.","por_opcion":["❌ La MCP es una de las más protetizadas.","❌ La TMC dispone de prótesis total, hemiartroplastia o de superficie.","✅ La IFD se artrodesa casi siempre.","❌ La IFP es, junto con la MCP, de las más protetizadas."]},{"pregunta":"¿Qué sustituye la hemiartroplastia trapeciometacarpiana?","opciones":["La cabeza del primer metacarpiano y el trapecio","La superficie del escafoides y el trapecio","Solo la cavidad del trapecio","Solo la base del primer metacarpiano"],"correcta":3,"explicacion":"La hemiartroplastia TMC reemplaza solo la base del primer metacarpiano; la artroplastia total (la más usada) reemplaza la cabeza del primer metacarpiano y la cavidad del trapecio.","por_opcion":["❌ Eso corresponde a la artroplastia total.","❌ El escafoides no forma parte de la prótesis TMC.","❌ La hemiartroplastia descrita actúa sobre el metacarpiano, no sobre el trapecio.","✅ Solo la base del primer metacarpiano."]},{"pregunta":"¿Cuál de estos pacientes cumple mejor el perfil de indicación de una prótesis trapeciometacarpiana?","opciones":["Mujer de 62 años con rizartrosis grado IV y pinza muy limitada","Mujer de 45 años con rizartrosis grado II y dolor leve","Varón de 80 años con trapecio osteoporótico y baja demanda","Varón de 58 años con rizartrosis grado III sin dolor"],"correcta":0,"explicacion":"La artroplastia TMC se indica en rizartrosis III–IV con dolor severo resistente, entre 50 y 70 años, con pérdida funcional de pinza o agarre, buen hueso trapecial y pacientes activos.","por_opcion":["✅ Edad, grado y pérdida de pinza encajan con la indicación.","❌ Grado II y dolor leve no cumplen los criterios.","❌ Fuera de la franja de edad y sin buen hueso trapecial.","❌ Sin dolor no se cumple el criterio de dolor severo resistente."]},{"pregunta":"Sobre la prótesis de muñeca, ¿qué afirmación es correcta?","opciones":["Es ideal en jóvenes que levantan cargas pesadas","Su componente carpal se fija a la primera línea del carpo","La hemiartroplastia es el tipo más utilizado","Recupera una flexoextensión similar a la muñeca sana"],"correcta":1,"explicacion":"El componente carpal se fija a la primera línea del carpo, normalmente semilunar, grande y piramidal, con placa o vástago. La movilidad es moderada, el paciente ideal es > 60 años sin cargar peso y las hemiartroplastias son menos usadas.","por_opcion":["❌ Es ideal en > 60 años que no levantan mucho peso.","✅ Se fija a semilunar, grande y piramidal.","❌ Las hemiartroplastias de muñeca son las menos usadas.","❌ La flexoextensión es moderada, mucho menor que la normal."]},{"pregunta":"¿Cuál de los siguientes NO figura entre los principios básicos de una prótesis de muñeca?","opciones":["Permitir la carga de grandes pesos","Dejar opciones de rescate si falla","Restaurar la longitud carpo-metacarpiana","Reconstruir los ejes de rotación anatómicos"],"correcta":0,"explicacion":"Los principios son reconstruir los ejes de rotación, restaurar la longitud carpo-metacarpiana, disminuir el dolor, mejorar la movilidad, fijación estable y duradera, técnica reproducible y dejar opciones de rescate. Cargar grandes pesos no es un objetivo: el paciente ideal no levanta mucho peso.","por_opcion":["✅ No es un principio; de hecho, el paciente ideal no levanta mucho peso.","❌ Es el último principio enumerado.","❌ Es uno de los principios.","❌ Es el primer principio."]},{"pregunta":"Paciente con artritis reumatoide de codo, destrucción severa y mala calidad ósea. ¿Qué prótesis es la más adecuada?","opciones":["Prótesis de superficie humeral","Prótesis total con charnela","Prótesis total no constreñida sin charnela","Hemiartroplastia de cúpula radial"],"correcta":1,"explicacion":"Las prótesis constreñidas o semiconstreñidas con charnela unen humeral y ulnar con un eje, ofrecen estabilidad, son las más usadas y se indican en AR, destrucción severa, mala calidad ósea e inestabilidad.","por_opcion":["❌ La prótesis de superficie descrita en el tema es de hombro, no de codo.","✅ Con charnela: AR, destrucción severa y hueso malo.","❌ La no constreñida exige ligamentos colaterales intactos y se indica en artrosis primaria.","❌ La cúpula radial solo sustituye el radio proximal."]},{"pregunta":"¿Qué requisito imprescindible tiene una prótesis total de codo sin charnela?","opciones":["Ligamentos colaterales intactos","Edad superior a 70 años","Buena calidad ósea humeral cementada","Componente radial asociado"],"correcta":0,"explicacion":"Las prótesis no constreñidas tienen componentes independientes y requieren estabilidad ligamentaria colateral intacta; generan menos estrés en el implante pero tienen riesgo de luxación.","por_opcion":["✅ Requieren ligamentos colaterales intactos.","❌ El temario no fija una edad para este tipo.","❌ Las prótesis de codo no suelen cementarse y no es el requisito clave.","❌ El componente radial es opcional en la total."]},{"pregunta":"¿Qué componentes forman una prótesis anatómica total de hombro (TSA)?","opciones":["Glenosfera convexa y cuerpo humeral cóncavo","Vástago humeral y cabeza sin componente glenoideo","Vástago humeral, cabeza humeral y glena de polietileno","Solo la cabeza humeral sin vástago"],"correcta":2,"explicacion":"La TSA imita la anatomía: vástago humeral, cabeza humeral en casquete esférico y glena cóncava de polietileno fijada a la escápula.","por_opcion":["❌ Corresponde a la prótesis invertida.","❌ Corresponde a la hemiartroplastia.","✅ Son los tres componentes de la TSA.","❌ Corresponde a la prótesis de superficie."]},{"pregunta":"Varón de 45 años con fractura conminuta de cabeza humeral, sin artrosis previa y con manguito funcional. ¿Qué opción describe el temario para este escenario?","opciones":["Prótesis anatómica total con glena","Prótesis de superficie sin vástago","Prótesis invertida de hombro","Hemiartroplastia de hombro"],"correcta":3,"explicacion":"La hemiartroplastia se usa cuando el cartílago de la glena no está desgastado, como en la fractura de la cabeza humeral sin artrosis; evita la glena, responsable de muchos fracasos. Requiere manguito funcional.","por_opcion":["❌ Con glena sana no es necesario sustituirla.","❌ La de superficie es para artrosis inicial o lesiones focales con hueso muy bueno.","❌ La RSA se reserva a manguito irreparable o fracturas en ancianos.","✅ Glena sana + fractura sin artrosis: hemiartroplastia."]},{"pregunta":"¿Cuál es una ventaja de la hemiartroplastia de hombro frente a la prótesis anatómica total?","opciones":["Mejor elevación gracias al deltoides","Mayor duración en pacientes muy activos","Menor riesgo de aflojamiento glenoideo","Funciona aunque el manguito esté roto"],"correcta":2,"explicacion":"Al no colocar glena, la hemiartroplastia tiene menor tiempo quirúrgico y menor riesgo de aflojamiento glenoideo. Está contraindicada con manguito no funcional.","por_opcion":["❌ La elevación por deltoides es propia de la RSA.","❌ El temario no le atribuye mayor duración.","✅ Sin glena no hay aflojamiento glenoideo.","❌ Está contraindicada con manguito no funcional."]},{"pregunta":"¿Qué limitación tiene la prótesis de superficie o de anclaje metafisario de hombro?","opciones":["Exige una calidad ósea muy buena por carecer de vástago","Dificulta los recambios futuros","Está indicada en daño glenoideo importante","Consume mucho hueso humeral"],"correcta":0,"explicacion":"No tiene vástago y solo sustituye la cabeza humeral, por lo que requiere muy buena calidad ósea; consume poco hueso, facilita recambios y no está indicada si hay daño glenoideo importante.","por_opcion":["✅ La falta de vástago exige hueso muy bueno.","❌ Facilita los recambios futuros.","❌ No está indicada si hay daño glenoideo importante.","❌ Al contrario: consume poco hueso."]},{"pregunta":"Mujer de 74 años con rotura masiva irreparable del manguito e impotencia funcional para elevar el brazo. ¿Qué prótesis está CONTRAINDICADA?","opciones":["Ninguna, todas son válidas","Prótesis invertida sin vástago","Prótesis invertida con vástago","Prótesis anatómica total"],"correcta":3,"explicacion":"En la artropatía secundaria a rotura crónica masiva del manguito, la prótesis total anatómica está contraindicada; la invertida es la primera indicación en mayores de 70 años con rotura masiva e impotencia funcional.","por_opcion":["❌ La TSA sí está contraindicada.","❌ Existen invertidas sin vástago (stemless) y son válidas.","❌ La invertida es la indicación de elección.","✅ La TSA está contraindicada con rotura masiva del manguito."]},{"pregunta":"¿Por qué muchos traumatólogos no consideran la prótesis invertida adecuada para pacientes relativamente jóvenes?","opciones":["Porque no permite la elevación del brazo","Porque consume mucho más hueso y complica revisiones","Porque depende de un manguito rotador íntegro","Porque solo se puede implantar cementada"],"correcta":1,"explicacion":"La RSA consume mucho más hueso que una anatómica, lo que complica futuras revisiones; por eso muchos traumatólogos no la consideran adecuada en pacientes relativamente jóvenes.","por_opcion":["❌ Ofrece excelente elevación gracias al deltoides.","✅ El mayor consumo óseo complica las revisiones.","❌ Funciona aunque el manguito esté roto.","❌ El temario no lo describe así."]},{"pregunta":"Según el temario, ¿cómo se elige la fijación en la artroplastia de hombro?","opciones":["La glena suele implantarse sin cemento","Cementados solo en pacientes con manguito roto","Cementados en jóvenes por su mayor durabilidad","No cementados en jóvenes por ser más fáciles de recambiar"],"correcta":3,"explicacion":"Los implantes no cementados son más fáciles de recambiar y se usan más en jóvenes; los cementados en osteopenia o edad avanzada. El componente glenoideo suele ser cementado.","por_opcion":["❌ La glena suele ser cementada.","❌ El criterio es la edad y la calidad ósea, no el manguito.","❌ En jóvenes se prefieren no cementados.","✅ No cementados en jóvenes por facilidad de recambio."]},{"pregunta":"Tras una prótesis de hombro, ¿qué pauta postoperatoria es correcta?","opciones":["Cabestrillo 3–6 semanas y rehabilitación formal a las 4–6 semanas","Sin intervención del fisioterapeuta antes de la cirugía","Rehabilitación activa intensa desde la primera semana","Movilización precoz en abducción con rotación externa"],"correcta":0,"explicacion":"Se usa cabestrillo o inmovilizador 3–6 semanas, se hacen movilizaciones pasivas suaves poco después de la cirugía y la rehabilitación propiamente dicha comienza a las 4–6 semanas. Se evitan ABD + RE forzadas y conviene que el fisioterapeuta instruya ya en el preoperatorio.","por_opcion":["✅ Cabestrillo 3–6 semanas y rehabilitación a las 4–6 semanas.","❌ Conviene instruir al paciente ya en el preoperatorio.","❌ Al principio solo movilización pasiva suave.","❌ ABD + RE forzadas tienen riesgo de luxación."]}],"asignatura":"Ortesis","tema":11.3,"fecha":"2026-11-19"}</script>

<script>

const L = 'ABCD';

const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */

const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;

const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">

  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
