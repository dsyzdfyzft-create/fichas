<!DOCTYPE html>
<html lang="es">
<head>

<title>Tema 2: Alteraciones del eje de la columna y sus órtesis · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 2: Alteraciones del eje de la columna y sus órtesis","subtitulo":"Ejes y planos anatómicos, escoliosis, hipercifosis, hiperlordosis y rectificaciones, su tratamiento y las órtesis de la escoliosis idiopática y de la cifosis de Scheuermann.","resumen":["La columna tiene **33 vértebras** (7 cervicales, 12 torácicas, 5 lumbares, 5 sacras, 4 coccígeas) y sus alteraciones del eje son **anormalidades de alineación**: escoliosis, hipercifosis, hiperlordosis y rectificaciones.","La **escoliosis** es una desviación **tridimensional** con rotación vertebral (giba en el lado convexo); es idiopática en el **80%**, afecta al **2%** de la población y es **5 veces** más frecuente en mujeres.","Se sospecha con el **test de Adams** y el **escoliómetro de Bunnell** (≥ 10º → traumatólogo y telerradiografía) y se cuantifica con el **ángulo de Cobb**: leve \u003c 20º, moderada 20–40º, severa > 40º (quirúrgica).","En la escoliosis idiopática del adolescente se prescribe órtesis si **Risser ≤ 2 y curva de 30–45º**, o de inmediato si **Risser 0/premenarquia con > 25º**; el corsé de **Boston** es tan eficaz como el de **Milwaukee** y se lleva **18–23 h/día**, mientras que los nocturnos **Charleston/Providence** solo 8–10 h.","La **cifosis de Scheuermann** (osteocondrosis juvenil) exige **acuñamiento anterior > 5º en 3 vértebras consecutivas**; se trata con **Milwaukee** en curvas dorsales de **50–70º** (3 puntos de fuerza, el último activo con el anillo cervical) o con **TLSO termoplástica** en las dorsolumbares."],"objetivos":["Describir los ejes y planos anatómicos y los movimientos que se producen en cada uno.","Diferenciar escoliosis, hipercifosis, hiperlordosis y rectificaciones por su definición, valores angulares y etiología.","Valorar una escoliosis con test de Adams, escoliómetro de Bunnell, ángulo de Cobb y grados de Risser.","Indicar el tratamiento conservador, ortésico o quirúrgico según la edad, la madurez esquelética y la magnitud de la curva.","Comparar las principales órtesis (Milwaukee, Boston, Wilmington, Charleston, Providence, TLSO) en la escoliosis idiopática y la cifosis de Scheuermann."],"ideas_clave":["Escoliosis = desviación **tridimensional**: inclinación frontal + rotación vertebral; la giba aparece en el **lado convexo** y la espinosa se desvía hacia el **cóncavo**.","Diagnóstico de escoliosis: curva de **más de 10º**; escoliómetro ≥ 10º ≈ **15–20º de Cobb** → derivación y telerradiografía.","Cobb: **\u003c 20º leve**, **20–40º moderada**, **> 40º severa** (suele ser quirúrgica).","Idiopática por edad: infantil **\u003c 3 años** (0,5–5%), juvenil **3–10 años** (7–10,5%), adolescente **> 10 años** (89%), adulto tras la madurez.","Órtesis en el adolescente: **Risser ≤ 2 + 30–45º**, o inmediata si **Risser 0 + > 25º**; curvas de **> 45–50º** en crecimiento no se estabilizan con órtesis.","Las TLSO de perfil bajo (Boston, Wilmington) solo sirven si el ápex está en **D7 o por debajo**; Charleston/Providence son **nocturnas (8–10 h)** y no se usan de pie.","Scheuermann: **> 5º de acuñamiento anterior en 3 cuerpos consecutivos**, platillos irregulares y nódulos de **Schmorl**; deformidad **rígida**.","En Scheuermann, **Milwaukee** para curvas dorsales **50–70º** (cesta pélvica, almohadilla posterior bajo el ápex, anillo cervical activo); **TLSO termoplástica** para cifosis dorsales bajas/dorsolumbares."],"secciones":[{"id":"anatomia-ejes-planos","titulo":"Introducción anatómica: columna, ejes y planos","bloques":[{"tipo":"parrafo","texto":"La columna vertebral está formada por **33 vértebras**: **7 cervicales, 12 torácicas, 5 lumbares, 5 sacras y 4 coccígeas**. Sus funciones principales son el **soporte estructural** del tronco y la **protección de la médula espinal**. Para describir cualquier desviación del eje hay que partir de un lenguaje común: la **posición anatómica** y los ejes y planos de referencia."},{"tipo":"definicion","termino":"Posición anatómica","texto":"Posición de referencia del cuerpo para describir la localización de las estructuras (Richard L et al., 2020): **bipedestación**, cabeza y ojos hacia delante, pies apoyados y hacia delante, brazos a los costados con las **palmas hacia el frente**."},{"tipo":"tabla","titulo":"Ejes anatómicos (Kapandji, 2012)","columnas":["Eje","Orientación","Movimiento que permite"],"filas":[["Longitudinal o vertical (Y)","Cráneo-caudal, perpendicular al suelo","**Rotaciones**"],["Transversal (X)","Horizontal, paralelo al suelo","**Flexión–extensión**"],["Sagital o anteroposterior (Z)","De delante atrás","**Abducción–aducción** (e inclinaciones laterales)"]]},{"tipo":"tabla","titulo":"Planos anatómicos (Kapandji, 2012)","columnas":["Plano","Divide el cuerpo en","Contiene los ejes"],"filas":[["Frontal o coronal","Anterior y posterior (ventral y dorsal)","Transversal y longitudinal"],["Sagital","Derecha e izquierda","Longitudinal y sagital"],["Transversal, horizontal o axial","Superior e inferior","Transversal y sagital"]]},{"tipo":"alerta","texto":"Trampa clásica: un movimiento ocurre **en un plano** y **alrededor del eje perpendicular** a él. La flexión–extensión se hace en el plano **sagital** alrededor del eje **transversal**; la abducción en el plano **frontal** alrededor del eje **sagital**; la rotación en el plano **transversal** alrededor del eje **longitudinal**."},{"tipo":"perla","texto":"Esta lógica se aplica directamente a la columna: la **escoliosis** se ve en el plano **frontal** (pero tiene rotación en el transversal), mientras que **cifosis y lordosis** son alteraciones del plano **sagital**. Valorar al paciente de frente, de espaldas y de perfil es imprescindible."}]},{"id":"alteraciones-generalidades","titulo":"Las alteraciones vertebrales: concepto y tipos","bloques":[{"tipo":"definicion","termino":"Alteración vertebral","texto":"**Anormalidad en la alineación** de la columna vertebral. Puede ser dolorosa y, a medio–largo plazo, afecta a la **movilidad y estabilidad vertebral**, generando disfunciones; por eso su valoración y tratamiento correctos son esenciales."},{"tipo":"parrafo","texto":"En su origen intervienen diversos factores: el más destacado es la **edad** (origen **degenerativo**), aunque con frecuencia el origen es **idiopático**; la práctica de ciertos **deportes** también puede estar implicada. Las cuatro alteraciones más comunes son la **escoliosis**, la **hipercifosis**, la **hiperlordosis** y las **rectificaciones**."},{"tipo":"figura","pagina":13,"pie":"Comparación de la lordosis, la cifosis y la escoliosis con la posición normal: observa que lordosis y cifosis se ven de perfil (plano sagital) y la escoliosis de espaldas (plano frontal).","src":"img/ortesis-t2-tema-2-alteraciones-del-eje-de-la-columna-y-sus-ortesis-p13.jpg"},{"tipo":"tarjetas","items":[{"etiqueta":"Frontal + rotación","titulo":"Escoliosis","texto":"Desviación tridimensional, la más frecuente; giba costal en el lado convexo."},{"etiqueta":"Sagital dorsal","titulo":"Hipercifosis","texto":"Aumento de la concavidad anterior de la columna dorsal (\"chepa\")."},{"etiqueta":"Sagital lumbar/cervical","titulo":"Hiperlordosis","texto":"Aumento de la concavidad posterior; en lumbar se asocia a anteversión pélvica."},{"etiqueta":"Sagital (aplanamiento)","titulo":"Rectificación","texto":"Disminución de la curva fisiológica: tramo plano, menos móvil."}]},{"tipo":"tabla","titulo":"Valores normales de las curvas sagitales (Passias, 2022)","columnas":["Región","Curva fisiológica","Rango normal"],"filas":[["Cervical","Lordosis","**20–40º**"],["Dorsal","Cifosis","**20–50º**"],["Lumbar","Lordosis","**40–60º**"]]}]},{"id":"escoliosis","titulo":"Escoliosis: definición, etiología y valoración","bloques":[{"tipo":"definicion","termino":"Escoliosis","texto":"Desviación **tridimensional** más frecuente de la columna (Kaelin, 2020). La **rotación vertebral** provoca a nivel torácico una **gibosidad en el lado convexo** de la curva, mientras que la apófisis **espinosa se desvía hacia el lado cóncavo** (Ostéopathique, 2021)."},{"tipo":"dato","valor":"80% · 2% · ×5","texto":"La escoliosis **idiopática** supone el **80%** de los casos (Kuznia et al., 2020; Miralles, 2019); su prevalencia es del **2%** de la población y es **5 veces más frecuente en mujeres** (Álvarez García de Quesada, 2011)."},{"tipo":"tabla","titulo":"Etiología de la escoliosis","columnas":["Tipo","Mecanismo"],"filas":[["De adaptación","Situación de **compensación** (p. ej., de otra alteración)"],["Por malformación","Origen **congénito** que fuerza al raquis a adaptarse"],["Neurológica","Debida a **trastornos neuromusculares**"],["Antiálgica","Por **dolor**, habitualmente de origen **lumbar o sacroilíaco**"],["Idiopática","Causa **desconocida**; la más frecuente (80%)"]]},{"tipo":"parrafo","texto":"Para considerar que existe escoliosis, la curva debe tener **más de 10º** de angulación (Fontcheca, 2013). El cribado clínico se hace con el **test de Adams** (flexión anterior del tronco, que pone de manifiesto la giba) y el **escoliómetro de Bunnell** (inclinómetro), que mide la **inclinación del tronco**. Si marca **10º o más**, se remite al traumatólogo y se solicita una **telerradiografía** de columna completa."},{"tipo":"dato","valor":"Bunnell ≥ 10º ≈ 15–20º Cobb","texto":"Un ángulo de inclinación del tronco de más de 10º con el escoliómetro corresponde aproximadamente a una curva de **15–20º de Cobb** (Álvarez García de Quesada, 2011)."},{"tipo":"figura","pagina":17,"pie":"Escoliómetro de Bunnell e imagen del test de Adams: fíjate en la asimetría de hombros, escápulas y triángulos del talle en bipedestación y en la giba al flexionar el tronco.","src":"img/ortesis-t2-tema-2-alteraciones-del-eje-de-la-columna-y-sus-ortesis-p17.jpg"},{"tipo":"definicion","termino":"Ángulo de Cobb","texto":"Mide la **magnitud de la curva** (Horne et al., 2014; Pan et al., 2019): se trazan líneas por la **plataforma superior de la vértebra límite proximal** y la **plataforma inferior de la vértebra límite distal** (las más inclinadas) y se mide el ángulo que forman sus perpendiculares."},{"tipo":"tabla","titulo":"Clasificación según el ángulo de Cobb (Miralles, 2019)","columnas":["Gravedad","Ángulo de Cobb","Implicación"],"filas":[["Leve","**\u003c 20º**","Observación y fisioterapia"],["Moderada","**20–40º**","Zona de tratamiento ortésico (según madurez)"],["Severa","**> 40º**","Suele requerir **tratamiento quirúrgico** de corrección"]]},{"tipo":"figura","pagina":19,"pie":"Medición del ángulo de Cobb: vértebras más inclinadas superior e inferior, ápice de la curva y equivalencia entre el ángulo de las tangentes y el de sus perpendiculares.","src":"img/ortesis-t2-tema-2-alteraciones-del-eje-de-la-columna-y-sus-ortesis-p19.jpg"},{"tipo":"alerta","texto":"No confundas **escoliómetro** con **Cobb**: el escoliómetro mide la **inclinación del tronco** (clínico, rotación/giba) y el Cobb mide la **curva radiológica**. Escoliómetro 10º ≠ Cobb 10º: equivale a unos **15–20º de Cobb**."},{"tipo":"perla","texto":"En consulta de fisioterapia, ante una asimetría de talle o de escápulas en un adolescente, realiza **Adams + escoliómetro**: un valor ≥ 10º justifica la derivación al traumatólogo para telerradiografía antes de iniciar cualquier programa específico."}]},{"id":"cifosis-lordosis-rectificaciones","titulo":"Hipercifosis, hiperlordosis y rectificaciones","bloques":[{"tipo":"definicion","termino":"Hipercifosis","texto":"**Aumento de la concavidad anterior de la columna dorsal** (\"chepa\"), con curvatura sagital en torno a **35–40º** que la curva lumbar compensa (Bueno Sánchez et al., 2016). Aparece sobre todo entre los **12 y 16 años**, con predominio en el **sexo masculino**."},{"tipo":"tabla","titulo":"Tipos de hipercifosis","columnas":["Tipo","Origen","Manejo"],"filas":[["Congénita","El bebé nace con la alteración; tiende a **empeorar**","Con frecuencia **cirugía en los primeros años**"],["Adquirida","Secundaria a **osteomielitis, osteoporosis o traumatismos**","Según la causa"],["Postural","**Malos hábitos posturales**; se corrige al ponerse de pie con buena postura","Corrección postural, **fortalecimiento de extensores** y dieta si sobrepeso"]]},{"tipo":"lista","items":["Causas favorecedoras: problemas psicológicos (baja autoestima, depresión), malos hábitos posturales (sentado encorvado), falta de acondicionamiento físico (debilidad de extensores), traumatismos, fractura por compresión vertebral, espondilitis anquilosante, osteoporosis senil, tumores y defectos congénitos asociados a síndromes neurológicos.","Teorías explicativas: **vertebral** (equilibrio alterado por causas osteoarticulares), **mental** (la falta de actividad se expresa con una espalda no recta) y **muscular** (debilidad de los extensores)."]},{"tipo":"definicion","termino":"Hiperlordosis","texto":"**Aumento de la concavidad posterior** de la columna. En la región lumbar, un ángulo lordótico **\u003c 23º** es una **hipolordosis** y uno **> 68º** una **hiperlordosis** (Brito-Hernández, 2018)."},{"tipo":"dato","valor":"\u003c 23º / > 68º","texto":"Límites del ángulo lordótico lumbar: por debajo de 23º hipolordosis, por encima de 68º hiperlordosis (Brito-Hernández, 2018)."},{"tipo":"parrafo","texto":"En la **hiperlordosis lumbar**, la columna torácica se desplaza hacia atrás para compensar y los **hombros se retraen**; además afecta a la pelvis y muchos pacientes presentan **anteversión pélvica** (Torre, 2021). En la región **cervical** el mecanismo de sobrecarga es diferente según el sentido de la alteración (Campos, 2017): si la lordosis se **rectifica**, el peso de la cabeza recae por completo sobre los **discos** y favorece la **patología discal** (protrusión, hernia); si está **aumentada**, el peso recae casi totalmente sobre los **arcos posteriores**, favoreciendo una **artrosis precoz** (facetaria)."},{"tipo":"alerta","texto":"Cervical: **rectificación → disco** (protrusión/hernia); **hiperlordosis → arcos posteriores** (artrosis precoz). Es una pregunta de examen fácil de invertir."},{"tipo":"definicion","termino":"Rectificación","texto":"**Disminución de la curvatura fisiológica**: un tramo vertebral **aplanado** respecto a la curva normal, con zonas de **menor movilidad**, posibles patologías asociadas y adaptación de grupos vertebrales a otras disfunciones."}]},{"id":"tratamientos","titulo":"Tratamiento conservador, ortopédico y quirúrgico","bloques":[{"tipo":"parrafo","texto":"Los objetivos generales del tratamiento son la **corrección postural y de la pelvis** y el **fortalecimiento de la faja abdominal y lumbar**. Las bases del tratamiento fisioterápico combinan control postural, respiración, estiramientos, fortalecimiento y analgesia, y deben integrarse en las actividades de la vida diaria."},{"tipo":"tabla","titulo":"Bases del tratamiento conservador","columnas":["Componente","Contenido"],"filas":[["Control postural","Ejercicios de **autoelongación** y **retroversión pélvica** para corregir la lordosis en decúbito supino, sedestación y bipedestación"],["Respiratorio","Ejercicios respiratorios"],["Estiramientos","Musculatura acortada: **flexores de cadera y paravertebrales**"],["Fortalecimiento","**Abdominales, erectores lumbares, glúteos y pelvitrocantéreos**"],["Antiálgico","Masoterapia, termoterapia, etc. si hay dolor"],["Educación","Integración de la corrección postural en las AVD y **consejos ergonómicos**"]]},{"tipo":"alerta","texto":"Deportes **contraindicados** según el temario: **gimnasia rítmica, patinaje y natación estilo mariposa**. No digas \"natación en general\": el PDF especifica **mariposa**."},{"tipo":"perla","texto":"El temario remite a métodos como la **RPG** y el **método Schroth** dentro del tratamiento ortopédico/conservador: en la práctica, el ejercicio específico se combina con el corsé, no lo sustituye cuando la curva está en rango ortésico."},{"tipo":"tabla","titulo":"Tratamiento quirúrgico de la escoliosis (Bioeng. Biotechnol., 2020)","columnas":["Aspecto","Contenido"],"filas":[["Indicaciones","Curvas **> 40º**; fracaso del tratamiento conservador con **progresión a pesar del corsé**"],["Varillas extensibles","Cuando la escoliosis avanza muy rápido (más en **jóvenes**): dos varillas que se alargan cada **3–6 meses**"],["Fusión espinal (artrodesis)","Unión de dos o más vértebras con **varillas, ganchos, tornillos o cables**"],["Técnica de Shilla","Técnica de crecimiento guiado descrita en el temario (Cunin, 2015)"]]},{"tipo":"esquema","titulo":"Algoritmo de decisión en la escoliosis según Cobb","mermaid":"flowchart TD\n  A[\"Sospecha clínica: Adams + escoliómetro\"] --> B{\"Escoliómetro 10º o más\"}\n  B -->|\"No\"| C[\"Seguimiento y educación postural\"]\n  B -->|\"Sí\"| D[\"Traumatólogo: telerradiografía y Cobb\"]\n  D --> E[\"Cobb menor de 20º: leve\"]\n  D --> F[\"Cobb 20-40º: moderada\"]\n  D --> G[\"Cobb mayor de 40º: severa\"]\n  E --> H[\"Fisioterapia y vigilancia\"]\n  F --> I[\"Órtesis según Risser y edad\"]\n  G --> J[\"Valorar cirugía: varillas o fusión\"]\n  I -->|\"Progresa pese al corsé\"| J","pie":"La decisión combina la magnitud (Cobb) con la madurez esquelética (Risser): el corsé solo tiene sentido mientras queda crecimiento."}]},{"id":"escoliosis-idiopatica","titulo":"Escoliosis idiopática: clasificación, Risser e indicación ortésica","bloques":[{"tipo":"parrafo","texto":"En la escoliosis idiopática **se desconoce la causa** y es la **más frecuente (80%)**. Debe diferenciarse la **escoliosis funcional** (defectos de postura, contracturas antálgicas, dismetría de miembros) de la **estructural**, en la que están alteradas **vértebras, ligamentos y músculos**; dentro de las estructurales están la idiopática, típica de **preadolescentes**, y las patológicas (poliomielitis, parálisis cerebral) (Lenke, 2005; Álvarez García de Quesada, 2011)."},{"tipo":"tabla","titulo":"Clasificación de la escoliosis idiopática por edad de comienzo","columnas":["Tipo","Edad","% de casos"],"filas":[["Infantil","**Antes de los 3 años**","**0,5–5%**"],["Juvenil","**3–10 años**","**7–10,5%**"],["Del adolescente","**Después de los 10 años**","**89%**"],["Del adulto","Después de la madurez esquelética","—"]]},{"tipo":"parrafo","texto":"Otra clasificación relaciona el **ritmo de crecimiento vertebral** con la **progresión de la deformidad**: de **comienzo precoz** (diagnóstico antes de los 6 meses de vida, según el temario) y de **comienzo tardío**. La madurez esquelética se estima con los **grados de Risser**, que valoran la osificación de la apófisis de la cresta ilíaca."},{"tipo":"tabla","titulo":"Grados de Risser","columnas":["Grado","Osificación de la cresta ilíaca"],"filas":[["Risser 0","**Sin osificación**"],["Risser 1","Osificación del **cuarto anterior**"],["Risser 2","Osificación de la **mitad anterior**"],["Risser 3","Osificación de los **¾ anteriores**"],["Risser 4","Osificación **completa**"],["Risser 5","Núcleo de osificación **completamente fusionado**"]]},{"tipo":"figura","pagina":41,"pie":"Grados de Risser: la osificación progresa de anterior (lateral) a posterior (medial) sobre la cresta ilíaca; Risser 0 = esqueleto inmaduro, Risser 5 = fusión completa.","src":"img/ortesis-t2-tema-2-alteraciones-del-eje-de-la-columna-y-sus-ortesis-p41.jpg"},{"tipo":"tabla","titulo":"Recomendaciones terapéuticas según el tipo de escoliosis idiopática","columnas":["Tipo","Recomendación"],"filas":[["Infantil","Tratamiento conservador **inmediato** en lactantes con curva **progresiva**; la órtesis busca **controlar la progresión** hasta que el niño tenga tamaño suficiente para una estabilización quirúrgica en un tiempo; niño pequeño con curva flexible: **TLSO a medida o Milwaukee modificada a tiempo completo**. Puede usarse **yeso** con tracción ligera bajo anestesia (Cunin, 2015)"],["Juvenil","**Más probabilidad de progresión y menos respuesta a la órtesis**; la altura de la vértebra más rotada en el ápex es el principal factor pronóstico: ápex en **D8, D9 o D10 → 80%** de probabilidad de **artrodesis hacia los 15 años**"],["Adolescente","Crecimiento activo (**Risser ≤ 2**) con curvas de **30–45º**: órtesis **en la primera visita**; inmaduro (**Risser 0 y premenarquia**) con **> 25º**: órtesis **inmediata**; la mayoría se trata con órtesis si la curva es **\u003c 40º**; con **> 45–50º** en crecimiento la órtesis no estabiliza"],["Adulto","Esqueléticamente maduros con curvas **> 50–55º** siguen expuestos a progresión → **candidatos a cirugía**; **observación continua** (Negrini et al., 2018)"]]},{"tipo":"alerta","texto":"\"Una curva que se resuelve con una órtesis probablemente se hubiera resuelto sin tratamiento\": en la escoliosis infantil el objetivo del corsé es **controlar la progresión**, no curar. Cuidado con preguntas que digan que el corsé \"corrige definitivamente\" la curva."},{"tipo":"dato","valor":"D8–D10 → 80%","texto":"En la escoliosis juvenil, si el ápex de la curva primaria está en D8, D9 o D10, hay un 80% de posibilidades de requerir artrodesis vertebral hacia los 15 años."},{"tipo":"esquema","titulo":"Indicación de órtesis en la escoliosis idiopática del adolescente","mermaid":"flowchart TD\n  A[\"Adolescente con escoliosis idiopática\"] --> B{\"Madurez: Risser\"}\n  B -->|\"Risser 0 y premenarquia\"| C{\"Cobb mayor de 25º\"}\n  C -->|\"Sí\"| D[\"Órtesis inmediata\"]\n  B -->|\"Risser 2 o menos\"| E{\"Cobb 30-45º\"}\n  E -->|\"Sí\"| F[\"Órtesis desde la primera visita\"]\n  B -->|\"Maduro\"| G{\"Cobb mayor de 50-55º\"}\n  G -->|\"Sí\"| H[\"Candidato quirúrgico y vigilancia\"]\n  E -->|\"Más de 45-50º\"| I[\"La órtesis no estabiliza: cirugía\"]","pie":"Cuanto más inmaduro es el esqueleto, menor es el umbral de Cobb para colocar el corsé."}]},{"id":"ortesis-escoliosis","titulo":"Órtesis en la escoliosis idiopática","bloques":[{"tipo":"parrafo","texto":"Para que un tratamiento ortésico se considere **eficaz** debe **evitar la progresión** en los pacientes de mayor riesgo (**25–45º con Risser 0 o 1**), lograr una **apariencia clínica aceptable** al final y **disminuir la necesidad de cirugía**. Los candidatos deben presentar deformidades estéticamente aceptables y estar **dispuestos a llevar la órtesis**. El técnico ortésico diseña y adapta cada órtesis de forma individual a partir de la **telerradiografía** del paciente."},{"tipo":"lista","items":["Muchas órtesis se nombran por su lugar de origen: **Milwaukee, Boston, Wilmington, TLSO de Miami, Rosenberger, Charleston, Providence, SpineCor** (corsé **dinámico**, Canadá) y **Chêneau** (Europa)."]},{"tipo":"tabla","titulo":"Comparación de las principales órtesis para la escoliosis","columnas":["Órtesis","Características","Indicación / limitaciones"],"filas":[["Milwaukee (CTLSO)","Desarrollado en **1946** (Blount, Schmidt, Bidwell); con anillo cervical; los principios de fuerzas correctoras se mantienen","Buena reducción del Cobb; inconvenientes: ↓ tono muscular, limita el movimiento, puede afectar a la eficiencia **cardiopulmonar**; en desuso por la imagen"],["Boston (TLSO perfil bajo)","**Misma eficacia que Milwaukee**; de las más usadas actualmente","Curvas simples y dobles con ápex en **D7 o por debajo**; **18–23 h/día** en inmaduros con curvas progresivas"],["Wilmington","Se confecciona a partir de un **molde positivo del tronco**","**Mismas indicaciones y limitaciones que Boston**"],["Charleston / Providence","Concepto de uso **a tiempo parcial nocturno**: en decúbito desplaza la convexidad al máximo hacia la línea media","**No se puede usar de pie** por la gran fuerza lateral; ventaja: solo **8–10 h/día**"],["SpineCor","Corsé **dinámico** (Canadá)","Alternativa flexible citada en el temario"],["Chêneau","Corsé de origen **europeo**","Citado en el temario"]]},{"tipo":"figura","pagina":49,"pie":"Corsé de Milwaukee: observa el anillo cervical con apoyos occipitales/mentonianos y las barras que lo unen a la cesta pélvica; explica su mala aceptación estética.","src":"img/ortesis-t2-tema-2-alteraciones-del-eje-de-la-columna-y-sus-ortesis-p49.jpg"},{"tipo":"dato","valor":"18–23 h/día","texto":"Tiempo de uso diario recomendado del corsé (p. ej., Boston) en adolescentes inmaduros con curvas progresivas; los nocturnos Charleston/Providence solo 8–10 h/día."},{"tipo":"alerta","texto":"Las **TLSO de perfil bajo** (Boston, Wilmington) solo están indicadas si el **ápex está en D7 o por debajo**. Una curva torácica alta (ápex por encima de D7) no se controla con ellas: requiere extensión superior tipo Milwaukee."},{"tipo":"perla","texto":"La adherencia es el principal determinante del éxito: un corsé de 18–23 h no sirve si el adolescente no lo lleva. El fisioterapeuta refuerza la motivación, trabaja la musculatura (para compensar la pérdida de tono) y la respiración, y vigila zonas de presión."}]},{"id":"scheuermann","titulo":"Cifosis de Scheuermann y su tratamiento ortésico","bloques":[{"tipo":"definicion","termino":"Cifosis de Scheuermann","texto":"Patología vertebral con **irregularidades y acuñamientos de los platillos vertebrales**: deformidad cifótica **rígida** (no se corrige razonablemente con manipulación pasiva ni extensión activa), por **acuñamiento anterior** de los cuerpos secundario a **trastornos del crecimiento de los platillos**. Se denomina también **osteocondrosis juvenil**."},{"tipo":"tabla","titulo":"Criterios radiológicos de Scheuermann","columnas":["Criterio","Detalle"],"filas":[["Acuñamiento","**> 5º de acuñamiento anterior** en **tres cuerpos vertebrales consecutivos** en la punta de la cifosis"],["Apófisis","Líneas apofisarias vertebrales **irregulares**, con aplanamiento y acuñamiento"],["Disco","**Estrechamiento** de los espacios discales y presencia de **nódulos de Schmorl**"]]},{"tipo":"dato","valor":"> 5º × 3 vértebras","texto":"Criterio radiológico clave de la cifosis de Scheuermann: acuñamiento anterior de más de 5º en tres vértebras consecutivas del ápex."},{"tipo":"parrafo","texto":"La inmovilización se indica en **niños** con la enfermedad; la **cifosis grave** puede **comprimir la médula o las raíces** y entonces necesita cirugía. La órtesis ejerce una **influencia positiva** sobre la evolución natural: sus objetivos son **disminuir el dolor, controlar la deformidad y reconstruir la altura vertebral anterior** aplicando fuerzas de **extensión**. Idealmente se usa en **fases iniciales**, cuando la flexibilidad en extensión permite reducir la deformidad con la órtesis puesta. Es un **reto mayor incluso que la escoliosis**: como suelen afectarse segmentos **dorsales proximales**, la órtesis debe extenderse a la parte alta del tórax o incluso llevar **anillo cervical**, y es **mal tolerada**."},{"tipo":"esquema","titulo":"Los tres puntos de fuerza del corsé de Milwaukee en Scheuermann","mermaid":"flowchart LR\n  A[\"1. Cesta pélvica ajustada\"] -->|\"Punto más bajo: reduce la lordosis lumbar\"| B[\"2. Almohadilla posterior\"]\n  B -->|\"Empuja hacia delante bajo las vértebras apicales\"| C[\"3. Anillo cervical\"]\n  C -->|\"Fuerza hacia atrás por respuesta ACTIVA del paciente\"| D[\"Extensión dorsal y menos cifosis\"]","pie":"Milwaukee combina fuerzas pasivas (cesta y almohadilla) y activas (el paciente se aleja del anillo cervical extendiendo el tronco)."},{"tipo":"tabla","titulo":"Órtesis en la cifosis de Scheuermann","columnas":["Órtesis","Indicación","Principio y fabricación"],"filas":[["Corsé de Milwaukee","Curvas **dorsales de 50–70º**","Fuerzas **activas y pasivas**: cesta pélvica (sin comprimir crestas ilíacas, evitando la migración), almohadilla posterior inmediatamente **inferior al ápex**, y anillo cervical con respuesta activa"],["TLSO termoplástica","Cifosis **dorsales bajas o dorsolumbares**","Corrección **pasiva**; prolongaciones esternales anteriores; molde de escayola en **decúbito supino con travesaño en la punta de la cifosis y caderas flexionadas**; almohadillas en la pared interna posterior **en y por debajo del ápex**"]]},{"tipo":"figura","pagina":61,"pie":"Paciente con corsé de Milwaukee para Scheuermann: localiza la cesta pélvica (punto de presión inferior), la almohadilla dorsal y las barras hacia el anillo cervical.","src":""},{"tipo":"alerta","texto":"En el Milwaukee para Scheuermann, el **tercer punto (hacia atrás)** depende de la **respuesta activa** del paciente al anillo cervical, **no** de una presión pasiva. Y la almohadilla se coloca **por debajo** del ápex, no sobre él."},{"tipo":"perla","texto":"Como la deformidad es rígida y la órtesis mal tolerada, el fisioterapeuta debe insistir en la **extensión activa** del tronco dentro del corsé, el fortalecimiento de extensores y la flexibilización: es precisamente la respuesta activa la que hace eficaz el Milwaukee."}]}],"caso_clinico":{"titulo":"Lucía, 12 años: asimetría de escápulas en la revisión escolar","presentacion":"Lucía, 12 años, premenárquica, acude derivada por su pediatra tras observar asimetría de hombros. En el test de Adams aparece una giba dorsal derecha y el escoliómetro de Bunnell marca 11º. La telerradiografía muestra una curva torácica derecha con ápex en D9 y un ángulo de Cobb de 28º; la cresta ilíaca no muestra osificación (Risser 0). Practica gimnasia rítmica.","preguntas":[{"pregunta":"¿Cómo se interpreta la exploración clínica y qué indica el valor del escoliómetro?","respuesta":"La giba en el test de Adams refleja la rotación vertebral (giba en el lado convexo). Un escoliómetro ≥ 10º obliga a derivar al traumatólogo para telerradiografía y equivale aproximadamente a 15–20º de Cobb; aquí la radiografía confirma una escoliosis moderada (28º, rango 20–40º)."},{"pregunta":"¿Está indicada una órtesis y de qué tipo?","respuesta":"Sí: es una paciente inmadura (Risser 0 y premenarquia) con una curva de más de 25º, criterio de órtesis inmediata. Con ápex en D9 (por debajo de D7) puede usarse una TLSO de perfil bajo tipo Boston, tan eficaz como Milwaukee, llevándola 18–23 h/día; una alternativa nocturna sería Charleston/Providence (8–10 h)."},{"pregunta":"¿Qué recomendaciones de fisioterapia y actividad física darías?","respuesta":"Control postural con autoelongación, ejercicios respiratorios, estiramiento de la musculatura acortada y fortalecimiento de abdominales, extensores y glúteos, integrando la corrección en las AVD (métodos como Schroth o RPG). La gimnasia rítmica figura entre los deportes contraindicados, junto con el patinaje y la natación estilo mariposa, por lo que conviene orientarla hacia otra actividad."}]},"preguntate":[{"pregunta":"¿Por qué la escoliosis se define como una deformidad tridimensional?","respuesta":"Porque además de la inclinación lateral en el plano frontal hay rotación vertebral en el plano transversal, que produce la giba costal en el lado convexo con la espinosa desviada hacia el cóncavo."},{"pregunta":"¿Qué cinco tipos etiológicos de escoliosis recoge el temario?","respuesta":"De adaptación (compensación), por malformación (congénita), neurológica (neuromuscular), antiálgica (dolor lumbar o sacroilíaco) e idiopática (la más frecuente, 80%)."},{"pregunta":"¿Cómo se mide el ángulo de Cobb y cómo se clasifica la escoliosis según él?","respuesta":"Con líneas por la plataforma superior de la vértebra límite proximal y la inferior de la distal; \u003c 20º leve, 20–40º moderada, > 40º severa (suele ser quirúrgica)."},{"pregunta":"Describe los grados de Risser.","respuesta":"0: sin osificación de la cresta; 1: cuarto anterior; 2: mitad anterior; 3: tres cuartos; 4: osificación completa; 5: fusión completa del núcleo de osificación."},{"pregunta":"¿Cuándo se prescribe una órtesis en la escoliosis idiopática del adolescente?","respuesta":"Con crecimiento activo (Risser ≤ 2) y curvas de 30–45º desde la primera visita, y de forma inmediata en inmaduros (Risser 0, premenarquia) con más de 25º; con más de 45–50º en crecimiento la órtesis no estabiliza."},{"pregunta":"¿Qué diferencia una escoliosis funcional de una estructural?","respuesta":"La funcional se debe a defectos de postura, contracturas antálgicas o dismetrías, sin lesión estructural; en la estructural están alteradas vértebras, ligamentos y músculos (idiopática o patológica)."},{"pregunta":"¿Por qué las curvaturas cervicales alteradas favorecen patologías distintas?","respuesta":"En la rectificación el peso de la cabeza recae sobre los discos (protrusión, hernia); en la hiperlordosis recae sobre los arcos posteriores y favorece la artrosis precoz."},{"pregunta":"¿En qué se basan los corsés de Charleston y Providence?","respuesta":"En el uso a tiempo parcial nocturno: en decúbito desplazan la convexidad hacia la línea media con gran fuerza, por lo que no se pueden usar de pie; se llevan solo 8–10 h al día."},{"pregunta":"¿Cuáles son los criterios radiológicos de la cifosis de Scheuermann?","respuesta":"Acuñamiento anterior de más de 5º en tres cuerpos vertebrales consecutivos, líneas apofisarias irregulares con aplanamiento, y estrechamiento discal con nódulos de Schmorl."},{"pregunta":"¿Cómo se fabrica la TLSO termoplástica para Scheuermann y dónde van sus almohadillas?","respuesta":"Sobre un molde de escayola obtenido en decúbito supino con un travesaño en la punta de la cifosis y caderas flexionadas; las almohadillas se montan en la pared interna posterior en y por debajo del ápex."}],"glosario":[{"termino":"Ángulo de Cobb","definicion":"Ángulo formado por las líneas de las plataformas de las vértebras límite de una curva; mide su magnitud radiológica."},{"termino":"Escoliómetro de Bunnell","definicion":"Inclinómetro que mide la inclinación del tronco en el test de Adams; ≥ 10º obliga a derivar."},{"termino":"Test de Adams","definicion":"Flexión anterior del tronco que pone de manifiesto la giba costal o lumbar de la escoliosis."},{"termino":"Giba","definicion":"Prominencia costal o paravertebral del lado convexo producida por la rotación vertebral."},{"termino":"Grados de Risser","definicion":"Escala 0–5 de madurez esquelética según la osificación de la apófisis de la cresta ilíaca."},{"termino":"Ápex","definicion":"Vértebra más desplazada y rotada de la curva; su altura condiciona el pronóstico y el tipo de órtesis."},{"termino":"TLSO","definicion":"Órtesis toraco-lumbo-sacra; las de perfil bajo (Boston, Wilmington) sirven si el ápex está en D7 o por debajo."},{"termino":"CTLSO / Milwaukee","definicion":"Órtesis cérvico-toraco-lumbo-sacra con anillo cervical, desarrollada en 1946."},{"termino":"Nódulo de Schmorl","definicion":"Herniación del disco a través del platillo vertebral; criterio radiológico de Scheuermann."},{"termino":"Osteocondrosis juvenil","definicion":"Otro nombre de la cifosis de Scheuermann, por trastorno del crecimiento de los platillos vertebrales."},{"termino":"Artrodesis (fusión espinal)","definicion":"Unión quirúrgica de dos o más vértebras con varillas, ganchos, tornillos o cables."},{"termino":"Anteversión pélvica","definicion":"Basculación anterior de la pelvis, frecuente en la hiperlordosis lumbar."}],"fuentes":["Kapandji (2012). Fisiología articular.","Richard L et al. (2020).","Kaelin, A. J. (2020).","Kuznia et al. (2020); Miralles (2019).","Álvarez García de Quesada, L. I., & Núñez Giralda, A. (2011). Escoliosis idiopática. Pediatría Atención Primaria, 13(49), 135-146.","Fontcheca (2013); Horne et al. (2014); Pan et al. (2019).","Bueno Sánchez, A. M. et al. (2016); Brito-Hernández (2018); Torre (2021); Campos (2017); Passias (2022).","Lenke, L. G. (2005). Lenke classification system of adolescent idiopathic scoliosis: treatment recommendations. Instructional Course Lectures, 54, 537-542.","Cunin, V. (2015); Negrini et al. (2018); Weiss et al. (2021).","Pantoja, T. S., & Chamorro, L. M. (2015). Escoliosis en niños y adolescentes. Revista Médica Clínica Las Condes, 26(1), 99-108.","Cazals, L.; Valmy, M. (2021). La place du corset hyper correcteur de nuit dans le traitement conservateur des scolioses idiopathiques. Université catholique de Louvain."],"qcm":[{"pregunta":"En la escoliosis torácica, ¿hacia dónde se desvían la giba costal y la apófisis espinosa de la vértebra apical?","opciones":["Giba en el lado cóncavo y espinosa hacia el lado convexo","Giba y espinosa ambas hacia el lado cóncavo de la curva","Giba y espinosa ambas hacia el lado convexo de la curva","Giba en el lado convexo y espinosa hacia el lado cóncavo"],"correcta":3,"explicacion":"La rotación vertebral de la escoliosis lleva el cuerpo vertebral hacia la convexidad, de modo que las costillas forman una giba en el lado convexo y la espinosa queda desviada hacia el lado cóncavo.","por_opcion":["❌ Invierte ambos lados.","❌ La giba no aparece en el lado cóncavo.","❌ La espinosa no va hacia la convexidad: rota en sentido contrario al cuerpo.","✅ Es la descripción del temario: giba convexa, espinosa hacia la concavidad."]},{"pregunta":"Un escoliómetro de Bunnell marca 11º en un adolescente. ¿Qué se corresponde mejor con el temario?","opciones":["Equivale a unos 15–20º de Cobb y obliga a derivar para telerradiografía","Equivale a unos 25–30º de Cobb y justifica órtesis inmediata","Equivale a unos 11º de Cobb y basta con revisión clínica anual","Equivale a unos 5–10º de Cobb y descarta una escoliosis real"],"correcta":0,"explicacion":"Según Álvarez García de Quesada (2011), una inclinación del tronco ≥ 10º con el escoliómetro supone una curva de aproximadamente 15–20º de Cobb, y se remite al traumatólogo para telerradiografía.","por_opcion":["✅ Correspondencia y conducta del temario.","❌ Sobrestima la curva y la indicación de corsé exige radiografía y Risser.","❌ Escoliómetro y Cobb no son equivalentes grado a grado.","❌ Subestima la curva; ≥ 10º obliga a estudio."]},{"pregunta":"Según la clasificación de Miralles (2019), una curva de 40º exactos de Cobb se clasifica como:","opciones":["Severa, por alcanzar el umbral quirúrgico","Leve, al no superar los 45º del corsé","Moderada-severa, categoría intermedia propia","Moderada, en el intervalo de 20º a 40º"],"correcta":3,"explicacion":"Leve \u003c 20º, moderada 20–40º y severa > 40º; un valor de 40º queda dentro del intervalo moderado, y la severa se define por superar los 40º.","por_opcion":["❌ La severa es > 40º, no ≥ 40º.","❌ La leve es \u003c 20º; 45º no es un límite de la clasificación.","❌ No existe esa categoría en el temario.","✅ 40º pertenece al rango 20–40º."]},{"pregunta":"¿Qué distribución por edad de comienzo de la escoliosis idiopática es correcta?","opciones":["Infantil \u003c 3 años (0,5–5%), juvenil 3–10 años (7–10,5%), adolescente > 10 años (89%)","Infantil \u003c 2 años (2%), juvenil 2–10 años (18%), adolescente > 10 años (80%)","Infantil \u003c 3 años (7–10,5%), juvenil 3–10 años (0,5–5%), adolescente > 10 años (89%)","Infantil \u003c 5 años (10%), juvenil 5–12 años (20%), adolescente > 12 años (70%)"],"correcta":0,"explicacion":"El temario sitúa la infantil antes de los 3 años (0,5–5%), la juvenil entre 3 y 10 años (7–10,5%) y la del adolescente después de los 10 años (89%).","por_opcion":["✅ Cortes y porcentajes del temario.","❌ El 80% es la proporción de idiopáticas sobre el total, no de la forma adolescente.","❌ Intercambia los porcentajes de infantil y juvenil.","❌ Cortes de edad y porcentajes inventados."]},{"pregunta":"Chica de 11 años, premenárquica, Risser 0, con una curva de 27º. ¿Cuál es la conducta indicada?","opciones":["Observar hasta alcanzar Risser 2","Colocar una órtesis de inmediato","Indicar cirugía por riesgo de progresión","Esperar a superar los 30º para el corsé"],"correcta":1,"explicacion":"En pacientes inmaduros (Risser 0 y premenarquia) con una curva de más de 25º se debe colocar la órtesis inmediatamente; el umbral de 30–45º se aplica a Risser ≤ 2 en general.","por_opcion":["❌ Esperar en el periodo de máximo riesgo permite la progresión.","✅ Criterio Risser 0 + premenarquia + > 25º.","❌ La cirugía se plantea en curvas > 40–50º.","❌ El umbral de 30º no aplica al paciente más inmaduro."]},{"pregunta":"En la escoliosis idiopática juvenil, ¿qué factor señala el temario como el de mayor importancia pronóstica?","opciones":["El valor del escoliómetro en el test de Adams inicial","La diferencia de longitud entre los miembros inferiores","La altura de la vértebra más rotada en el ápex de la curva primaria","El grado de Risser en el momento del diagnóstico inicial"],"correcta":2,"explicacion":"La altura de la vértebra más rotada en el ápex de la curva primaria es el factor de mayor importancia: con el ápex en D8, D9 o D10 hay un 80% de posibilidades de artrodesis hacia los 15 años.","por_opcion":["❌ El escoliómetro es un cribado, no el factor pronóstico.","❌ La dismetría se relaciona con escoliosis funcional.","✅ Factor pronóstico señalado para la forma juvenil.","❌ Risser orienta la indicación ortésica en el adolescente, no es el factor citado aquí."]},{"pregunta":"¿Por qué el corsé de Boston no es adecuado para una curva torácica con ápex en D5?","opciones":["El Boston solo se usa de noche y no puede corregir curvas torácicas","El Boston solo está indicado en la cifosis dorsolumbar de Scheuermann","El Boston es menos eficaz que el Milwaukee en cualquier tipo de curva","Las TLSO de perfil bajo solo controlan curvas con ápex en D7 o por debajo"],"correcta":3,"explicacion":"Las TLSO de perfil bajo, como Boston o Wilmington, se restringen a curvas cuyo ápex se sitúa en D7 o por debajo; una curva más alta requiere extensión superior.","por_opcion":["❌ Los nocturnos son Charleston y Providence.","❌ En Scheuermann dorsolumbar se usa la TLSO termoplástica, y el Boston es para escoliosis.","❌ El temario dice que Boston tiene la misma eficacia que Milwaukee.","✅ Limitación de las TLSO de perfil bajo."]},{"pregunta":"¿Qué característica distingue a los corsés de Charleston y Providence?","opciones":["Se fabrican a partir de un molde positivo del tronco del paciente","Incorporan un anillo cervical para inducir la extensión activa","Se usan en decúbito nocturno 8–10 h y no pueden llevarse de pie","Son corsés dinámicos elásticos desarrollados en Canadá"],"correcta":2,"explicacion":"Charleston y Providence se basan en el uso a tiempo parcial: aprovechan el decúbito nocturno para desplazar la convexidad al máximo hacia la línea media; por la gran fuerza lateral no se pueden usar de pie y solo se llevan 8–10 h/día.","por_opcion":["❌ El molde positivo caracteriza al Wilmington.","❌ El anillo cervical es propio del Milwaukee.","✅ Concepto hipercorrector nocturno.","❌ Corresponde al SpineCor."]},{"pregunta":"¿Cuál de los siguientes es un inconveniente atribuido al corsé de Milwaukee en el temario?","opciones":["Requiere un molde de escayola en decúbito prono","Solo puede utilizarse en curvas con ápex lumbar bajo","Puede afectar a la eficiencia cardiopulmonar del paciente","No consigue una reducción apreciable del ángulo de Cobb"],"correcta":2,"explicacion":"El Milwaukee consigue buena reducción del Cobb, pero tiene inconvenientes: disminuye el tono muscular, limita el movimiento y puede afectar a la eficiencia cardiopulmonar; además, su impacto estético ha reducido su uso.","por_opcion":["❌ El molde en decúbito (supino) corresponde a la TLSO termoplástica de Scheuermann.","❌ Precisamente sirve para curvas altas gracias a su anillo cervical.","✅ Inconveniente citado.","❌ El temario dice que reduce bien el Cobb."]},{"pregunta":"En la región cervical, ¿qué consecuencia se asocia a una hiperlordosis según Campos (2017)?","opciones":["Sobrecarga de los arcos posteriores con artrosis precoz","Sobrecarga discal con tendencia a protrusión y hernia","Hipermovilidad segmentaria por laxitud ligamentosa","Compresión medular directa por acuñamiento anterior"],"correcta":0,"explicacion":"Con la lordosis cervical aumentada el peso de la cabeza recae casi por completo sobre los arcos posteriores, favoreciendo artrosis precoz; la rectificación, en cambio, carga los discos.","por_opcion":["✅ Hiperlordosis → arcos posteriores → artrosis.","❌ Es la consecuencia de la rectificación.","❌ No es el mecanismo descrito.","❌ La compresión medular se cita en la cifosis grave de Scheuermann."]},{"pregunta":"¿Qué valores del ángulo lordótico lumbar definen hipolordosis e hiperlordosis según Brito-Hernández (2018)?","opciones":["Hipolordosis \u003c 40º e hiperlordosis > 60º","Hipolordosis \u003c 20º e hiperlordosis > 50º","Hipolordosis \u003c 35º e hiperlordosis > 40º","Hipolordosis \u003c 23º e hiperlordosis > 68º"],"correcta":3,"explicacion":"El temario sitúa la hipolordosis por debajo de 23º y la hiperlordosis por encima de 68º; el rango 40–60º es el valor normal de lordosis lumbar de Passias (2022).","por_opcion":["❌ Es el rango normal lumbar (40–60º) de otra fuente.","❌ 20–50º es el rango normal dorsal.","❌ 35–40º se cita para la hipercifosis.","✅ Cifras de Brito-Hernández."]},{"pregunta":"¿Qué conjunto de deportes considera contraindicados el temario en estas alteraciones del eje?","opciones":["Gimnasia rítmica, patinaje y natación estilo mariposa","Halterofilia, remo y natación estilo braza","Natación estilo crol, ciclismo y marcha nórdica","Fútbol, baloncesto y natación estilo espalda"],"correcta":0,"explicacion":"Dentro de los consejos para la práctica deportiva, el temario cita como contraindicados la gimnasia rítmica, el patinaje y la natación en estilo mariposa.","por_opcion":["✅ Lista del temario.","❌ No es la lista citada.","❌ No figuran como contraindicados.","❌ No figuran como contraindicados."]},{"pregunta":"¿Cuál es el criterio radiológico de acuñamiento de la cifosis de Scheuermann?","opciones":["Más de 10º de acuñamiento anterior en dos vértebras contiguas","Más de 5º de acuñamiento anterior en tres vértebras consecutivas","Más de 15º de acuñamiento anterior en una vértebra apical","Más de 5º de acuñamiento posterior en tres vértebras apicales"],"correcta":1,"explicacion":"Scheuermann requiere más de 5º de acuñamiento anterior de tres cuerpos vertebrales consecutivos en la punta de la cifosis, junto con platillos irregulares, estrechamiento discal y nódulos de Schmorl.","por_opcion":["❌ Cifra y número de vértebras incorrectos.","✅ Criterio del temario.","❌ Se exigen tres vértebras, no una.","❌ El acuñamiento es anterior."]},{"pregunta":"En el corsé de Milwaukee para Scheuermann, ¿de qué depende el tercer punto de fuerza, dirigido hacia atrás?","opciones":["De la respuesta activa del paciente al anillo cervical","De la almohadilla colocada directamente sobre el ápex","De la presión pasiva del anillo cervical sobre el mentón","Del ajuste de la cesta pélvica sobre las crestas ilíacas"],"correcta":0,"explicacion":"El Milwaukee combina fuerzas pasivas (cesta pélvica, almohadilla que empuja hacia delante bajo el ápex) y activas: el tercer punto depende de la reacción activa del paciente al anillo cervical más que de una presión pasiva.","por_opcion":["✅ Componente activo del sistema.","❌ La almohadilla va inmediatamente por debajo del ápex y empuja hacia delante.","❌ El temario insiste en que no es una presión pasiva.","❌ La cesta es el punto más bajo y no debe comprimir las crestas."]},{"pregunta":"Adolescente con cifosis de Scheuermann dorsolumbar flexible. ¿Qué órtesis y método de confección describe el temario?","opciones":["Corsé de Milwaukee con anillo cervical moldeado en bipedestación con tracción","TLSO termoplástica moldeada en supino con travesaño en el ápex y caderas flexionadas","Corsé de Boston prefabricado ajustado según la telerradiografía en carga","Corsé de Providence nocturno moldeado en decúbito lateral sobre la convexidad"],"correcta":1,"explicacion":"Para cifosis dorsales bajas o dorsolumbares se prefiere una TLSO termoplástica con prolongaciones esternales, de corrección pasiva, confeccionada sobre un molde de escayola en decúbito supino con un travesaño en la punta de la cifosis y caderas flexionadas.","por_opcion":["❌ El Milwaukee se reserva para curvas dorsales de 50–70º, y el molde no es así.","✅ Indicación y fabricación del temario.","❌ El Boston es una órtesis para escoliosis.","❌ Providence es un corsé nocturno de escoliosis."]}],"asignatura":"Ortesis","tema":2,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>

  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}

  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>

<main class="env">

  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}

  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}

  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');

try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
