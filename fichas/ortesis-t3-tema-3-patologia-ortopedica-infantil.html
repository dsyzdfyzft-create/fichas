<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 3: Patología ortopédica infantil · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 3: Patología ortopédica infantil","subtitulo":"Principales patologías ortopédicas del niño y el adolescente —cráneo, cuello, columna, cadera, rodilla y pie— con su diagnóstico y su tratamiento conservador, ortésico o quirúrgico.","resumen":["La **ortopedia infantil** trata los trastornos musculoesqueléticos de niños y adolescentes (hereditarios, congénitos o adquiridos); como el esqueleto está en crecimiento (**Risser \u003c 4/5**), el **diagnóstico precoz** es la clave, con especial atención a los cartílagos de crecimiento y las **entesis** en los primeros 20 años.","Las deformidades craneales pueden ser **posicionales** (plagiocefalia, braquicefalia: fuerzas externas, benignas) o por **craneosinostosis** (cierre prematuro de suturas, quirúrgica); el **casco** se pauta si fracasa el tratamiento postural, **3–4 meses a 23 h/día** con ajuste mensual.","La **tortícolis muscular congénita** (acortamiento del **ECOM**, más el derecho, 0,4–1,9% de recién nacidos) se resuelve en **2–6 meses** con manipulación suave precoz y estímulos desde el lado afectado; la **escoliosis idiopática infantil** (\u003c 3 años, \u003c 1%) se trata con ejercicio, corsé o cirugía a los 10–12 años según gravedad.","La **espondilolistesis** es la causa más común de dolor de espalda entre **10 y 15 años** (TLSO antilordosis o fusión in situ); en la cadera destacan **Perthes** (osteocondrosis de la cabeza femoral, órtesis en **abducción**), **Meyer** (asintomática, órtesis en RE + ABD), la **sinovitis transitoria** (3–10 años, cede en una semana) y la **cadera en resorte**.","Las apofisitis por tracción son **Osgood-Schlatter** (tuberosidad tibial, **14:1** varones, 10–15 años en niños y 8–12 en niñas, grados 1–3) y **Sever** (calcáneo, 8–15 años, **3,7/1000**, alza de talón **≥ 5 mm**); el **quiste de Baker** y el **fibroma plantar** suelen no requerir tratamiento."],"objetivos":["Definir la ortopedia infantil y justificar la importancia del diagnóstico precoz durante el crecimiento.","Diferenciar las deformidades craneales posicionales de la craneosinostosis y conocer las indicaciones del casco craneal.","Reconocer la clínica, la epidemiología y el tratamiento de la tortícolis congénita, la escoliosis infantil, la espondilolistesis y la espina bífida.","Distinguir las patologías de cadera infantil (Perthes, Meyer, sinovitis, cadera en resorte) y sus órtesis.","Identificar las apofisitis (Osgood-Schlatter, Sever) y otras lesiones de rodilla y pie, con sus datos de examen."],"ideas_clave":["Diagnóstico precoz: en el niño en crecimiento (**Risser \u003c 4/5**) la zona más vulnerable son los extremos óseos de crecimiento y las **entesis** (primeros **20 años**).","**Plagiocefalia/braquicefalia** posicional = fuerzas externas, benigna, sin afectación neurológica; **craneosinostosis** = fusión sutural prematura, puede dar hipertensión intracraneal, tratamiento **quirúrgico**.","Casco craneal: si fracasa la fisioterapia postural, **3–4 meses, 23 h/día**, ajuste **mensual**; el **TAC 3D** es la prueba más precisa para las suturas.","Tortícolis muscular congénita: **ECOM** (más el derecho), aparece a las **2–4 semanas**, bulto **no doloroso en el tercio inferior**, incidencia **0,4–1,9%**, se resuelve en **2–6 meses**.","Espondilolistesis: causa más común de dolor de espalda a los **10–15 años**, precedida de espondilólisis; corsé sin diferencia significativa frente a no corsé.","Espina bífida: **meningocele** (LCR + meninges, operable) vs **mielomeningocele** (+ médula, incapacidad permanente); se produce antes de los **26 días** de gestación.","Perthes = osteocondritis deformante juvenil / coxa plana → **órtesis en abducción**; Meyer = displasia epifisaria femoral, asintomática, bloqueo en **rotación interna** → órtesis en **RE + ABD**.","Osgood-Schlatter: osteocondrosis apofisaria más común de la rodilla, **14:1** varones; Sever = apofisitis del calcáneo, **8–15 años**, alza de talón **mínimo 5 mm**."],"secciones":[{"id":"introduccion","titulo":"Introducción a la ortopedia infantil","bloques":[{"tipo":"parrafo","texto":"Los primeros aparatos ortopédicos infantiles datan del **200 d. C.**: aparatos de madera y barras de hierro con ruedas colocados sobre las piernas de los niños. Vuelven a aparecer imágenes a finales del **siglo XV** y su forma apenas cambió durante más de **10 siglos**; en el **siglo XX** se simplificaron hasta parecerse a los andadores actuales."},{"tipo":"definicion","termino":"Ortopedia infantil","texto":"Especialidad de la cirugía ortopédica y traumatológica que se encarga de las **lesiones y trastornos musculoesqueléticos de niños y adolescentes** (también llamada traumatología infantil o cirugía ortopédica infantil). Abarca todas las subespecialidades de la ortopedia del adulto, con formación específica en problemas **congénitos o adquiridos**; los problemas pueden ser **hereditarios, congénitos o adquiridos**."},{"tipo":"parrafo","texto":"En la infancia músculos y huesos están en **continuo crecimiento**; por eso los principios de ortopedia establecen que en el niño en crecimiento (**Risser \u003c 4/5**) es fundamental el **diagnóstico precoz**, que permite un mejor tratamiento y una corrección más rápida. Trata deformidades del cráneo y la columna, de brazos y piernas, y deformidades secundarias a enfermedades **neuromusculares o metabólicas**. Los motivos más frecuentes son las deformidades de los pies (plano, cavo), las alteraciones de la marcha (dismetrías), la displasia de cadera, las alteraciones angulares de los miembros inferiores, la escoliosis idiopática y las deformidades craneales."},{"tipo":"figura","pagina":6,"pie":"Motivos de consulta en ortopedia pediátrica por edad: el desarrollo de cadera domina el primer año (50%), la deformidad de los pies y el patrón de marcha la primera infancia y la edad preescolar, y el dolor y la deformidad de columna la edad escolar y la adolescencia.","src":"img/ortesis-t3-tema-3-patologia-ortopedica-infantil-p6.jpg"},{"tipo":"tabla","titulo":"Motivo de consulta predominante por grupo de edad (tabla del temario)","columnas":["Edad","Motivo destacado","Dato"],"filas":[["Primer año de vida","Desarrollo de cadera","**50%**"],["Primera infancia","Deformidad de los pies / patrón de marcha","34% / 32%"],["Edad preescolar","Deformidad de los pies","40%"],["Edad escolar","Dolor musculoesquelético; deformidad de columna","43%; 15%"],["Adolescencia","Dolor musculoesquelético; deformidad de columna","51%; **27%**"]]},{"tipo":"perla","texto":"En la exploración del niño hay que valorar los **rangos de movilidad articular**, localizar el **dolor**, buscar **derrame** y comprobar la **estabilidad** articular, centrándose en los **extremos óseos de crecimiento** y las **entesis**, la zona más susceptible de lesión en los primeros **20 años**."}]},{"id":"deformidades-craneales","titulo":"Deformidades craneales","bloques":[{"tipo":"parrafo","texto":"Tienen dos causas principales. La **deformación craneal posicional** (plagiocefalia, braquicefalia) es el resultado de **fuerzas externas prolongadas**. La **craneosinostosis** es una **anomalía del desarrollo** por fusión sutural **anormal y no fisiológica**; su prevalencia ha aumentado significativamente sin una causa evidente."},{"tipo":"tarjetas","items":[{"etiqueta":"Posicional","titulo":"Plagiocefalia","texto":"\"Síndrome de la cabeza plana\": aplanamiento o asimetría posterior, anterior o lateral por la presión constante de la superficie donde duerme. Benigna, no afecta al desarrollo neurológico."},{"etiqueta":"Posicional","titulo":"Braquicefalia","texto":"Aplanamiento **simétrico** posterior: cráneo más ancho y más corto anteroposteriormente; por decúbito supino constante o, en casos graves, fusión prematura."},{"etiqueta":"Sinostosis","titulo":"Craneosinostosis","texto":"Cierre prematuro de una o más suturas antes de que el cerebro esté desarrollado: forma anormal, posible hipertensión intracraneal, retraso y daño cerebral."}]},{"tipo":"lista","items":["Etiología de la **plagiocefalia posicional**: primer nacimiento, parto asistido, embarazo múltiple, lesiones de nacimiento, malformaciones congénitas y **tortícolis muscular congénita**.","Etiología de la **craneosinostosis** – factores ambientales: limitación intrauterina de la cabeza, posición anormal, **oligohidramnios**, teratógenos (p. ej., **talidomida, 1960**), tabaquismo, **fármacos antiepilépticos** (Schneider, 2013). Factores genéticos (**20%**): mutaciones de un gen, anomalías cromosómicas, antecedentes poligénicos."]},{"tipo":"figura","pagina":21,"pie":"Clasificación de las formas craneales a partir de la normocefalia: trigonocefalia, escafocefalia, braquicefalia y plagiocefalia anterior y posterior; las flechas rojas indican crecimiento detenido en la sutura afectada.","src":"img/ortesis-t3-tema-3-patologia-ortopedica-infantil-p21.jpg"},{"tipo":"tabla","titulo":"Diagnóstico por imagen de las deformidades craneales","columnas":["Prueba","Utilidad"],"filas":[["Clínica","Diagnóstico habitual, durante el **primer año de vida**"],["TAC con reconstrucción 3D","Imagen **más completa y precisa** de las suturas"],["Radiografía simple","Menos precisa para las suturas, pero **rentable**"],["Resonancia magnética","Excelente para evaluar el **cerebro**"]]},{"tipo":"dato","valor":"3–4 meses · 23 h/día","texto":"Duración y uso diario del casco u órtesis craneal, con adaptación cada mes (American Academy of Pediatrics, 2006; Caballero et al., 2017; Grunstein-Bistre et al., 2019)."},{"tipo":"parrafo","texto":"El tratamiento puede ser conservador (fisioterapia y órtesis) o quirúrgico. El **casco** se diseña a partir de la medición de la cabeza del bebé y ejerce una **presión correctiva personalizada** que redirige el crecimiento natural; se pauta, con buenos resultados, en pacientes que **no mejoran con el tratamiento postural** (fisioterapia). La fisioterapia incluye **ejercicios de cuello y parte superior del cuerpo**, **técnicas de manipulación craneal** y **estimulación en prono** para reducir la preferencia posicional. En la craneosinostosis el tratamiento principal es **quirúrgico**, para dar espacio al cerebro y corregir la forma."},{"tipo":"alerta","texto":"El casco **no** es el primer escalón en la plagiocefalia posicional: primero tratamiento postural/fisioterapia (cambios de posición, tiempo boca abajo supervisado); el casco se pauta si **no mejora**. Y la craneosinostosis **no** se corrige con casco: es quirúrgica."},{"tipo":"esquema","titulo":"Decisión ante un bebé con la cabeza deformada","mermaid":"flowchart TD\n  A[\"Bebé con cráneo asimétrico o aplanado\"] --> B{\"Fusión sutural prematura\"}\n  B -->|\"Sí: craneosinostosis\"| C[\"TAC 3D y cirugía\"]\n  B -->|\"No: posicional\"| D[\"Fisioterapia y cambios posturales\"]\n  D --> E[\"Estimulación en prono y ejercicios de cuello\"]\n  E --> F{\"Mejora\"}\n  F -->|\"Sí\"| G[\"Seguimiento\"]\n  F -->|\"No\"| H[\"Casco 3-4 meses, 23 h al día\"]\n  D --> I[\"Descartar tortícolis congénita\"]","pie":"La tortícolis congénita es una causa frecuente de plagiocefalia posicional y debe tratarse a la vez."}]},{"id":"torticolis-escoliosis-infantil","titulo":"Tortícolis muscular congénita y escoliosis idiopática infantil","bloques":[{"tipo":"definicion","termino":"Tortícolis muscular congénita","texto":"Deformidad del cuello del recién nacido y primeros meses (aparece entre las **2 y 4 semanas**) por **acortamiento del ECOM**, con más frecuencia el **derecho**. Causas: **malposición intrauterina** o **sobrepresión del ECOM durante el parto → fibrosis**; se asocia a **plagiocefalia**."},{"tipo":"dato","valor":"0,4–1,9%","texto":"Incidencia de la tortícolis muscular congénita en recién nacidos (Kuo et al., 2014); se resuelve espontáneamente en 2–6 meses."},{"tipo":"parrafo","texto":"A la palpación se encuentra un **abultamiento no doloroso en el tercio inferior** del músculo (Sytsma et al., 2016). El tratamiento consiste en la **manipulación suave y precoz** para ir distendiendo la masa muscular; se aconseja que **todos los estímulos procedan del lado afectado** (para provocar la rotación hacia él) y se debe **involucrar a los padres** con juegos y estímulos constantes."},{"tipo":"perla","texto":"Coloca juguetes, la luz, la voz de los padres y la alimentación del lado afectado: el bebé gira la cabeza hacia ese lado y estira de forma activa el ECOM acortado, complementando la manipulación suave."},{"tipo":"parrafo","texto":"La **escoliosis idiopática infantil** es una curvatura anormal de la columna que se desarrolla **antes de los 3 años**, puede asociar malformaciones y supone **menos del 1%** de las escoliosis idiopáticas. La escoliosis es la deformidad espinal pediátrica más común y sus complicaciones son **dolor, disfunción respiratoria y alteración de la salud mental**. Por cronología se clasifica en infantil (0–3 años), juvenil (3–10) y adolescente (10–18)."},{"tipo":"tabla","titulo":"Gravedad según el ángulo de Cobb (clasificación de este tema)","columnas":["Grado","Cobb"],"filas":[["Ligera","5–15º"],["Ligera a moderada","16–24º"],["Moderada","25–34º"],["Moderada a severa","35–44º"],["Severa","45–49º"],["Muy severa","> 60º"]]},{"tipo":"tabla","titulo":"Tratamiento de la escoliosis infantil (Matamoros Rodríguez, 2021)","columnas":["Gravedad","Tratamiento"],"filas":[["Leve","**Ejercicios de fisioterapia**: relajar la musculatura contraída y fortalecer la debilitada para una postura y movimientos simétricos"],["Moderada","Lo anterior + **corsé hasta el final del crecimiento**"],["Grave","**Cirugía entre los 10 y 12 años** y después rehabilitación con los ejercicios de la escoliosis leve"]]},{"tipo":"alerta","texto":"Este tema usa una clasificación del Cobb **más fina** (ligera 5–15º… muy severa > 60º) que la de tres grupos del tema 2 (\u003c 20º, 20–40º, > 40º). Fíjate en qué escala pide la pregunta."}]},{"id":"espondilolistesis-espina-bifida","titulo":"Espondilolistesis y espina bífida","bloques":[{"tipo":"definicion","termino":"Espondilolistesis","texto":"**Desplazamiento de una vértebra respecto a la caudal**. Es la **causa más común de dolor de espalda en niños de 10 a 15 años**; antes de ser una patología suele manifestarse como lumbalgia y está precedida a menudo por una **espondilólisis** (causa identificable más común)."},{"tipo":"parrafo","texto":"Se atribuye a espina bífida, genética, hiperlordosis, trastornos posicionales, actividad física y traumatismos directos. El tratamiento es **conservador (TLSO antilordosis)** o **quirúrgico (fusión in situ)**. Según Mora-de Sambricio et al. (2014), la efectividad de la órtesis se atribuyó hasta un **80%** de los casos, pero **ninguna órtesis ha demostrado disminuir eficazmente el movimiento distal de L4-L5** y no hay diferencias clínicas ni radiológicas **significativas** entre grupos con y sin corsé: la mejoría se debe a la **restricción de actividades** con fuerzas de **extensión y torsión** y al **curso natural benigno**."},{"tipo":"tabla","titulo":"Condiciones ideales para la cirugía de la espondilolistesis","columnas":["Condición","Valor"],"filas":[["Indicación","Síntomas persistentes sin mejora con tratamiento conservador"],["Edad","**Menos de 20 años**"],["Separación del segmento","**\u003c 2 mm**"],["Vértebra afectada","**L4**"],["Elementos posteriores","Sin displasia"],["Disco","Sin discopatía"],["Listesis","Mínima"]]},{"tipo":"alerta","texto":"Trampa: el \"80% de eficacia\" del corsé en la espondilolistesis está **cuestionado**: no hay diferencia significativa con/sin corsé; lo que funciona es **restringir la extensión y la torsión**."},{"tipo":"definicion","termino":"Espina bífida","texto":"Afección de la columna, generalmente evidente desde el nacimiento, que afecta al sistema nervioso por un **déficit de cierre de la parte posterior** de la columna; se produce durante la gestación (**\u003c 26 días**). Formas: **oculta, meningocele y mielomeningocele**."},{"tipo":"tabla","titulo":"Formas abiertas de espina bífida","columnas":["Forma","Contenido del saco","Pronóstico"],"filas":[["Meningocele","LCR + meninges","**Operable**"],["Mielomeningocele","LCR + meninges + **médula espinal**","**Incapacidad permanente**"]]},{"tipo":"perla","texto":"En la espina bífida, que cursa con **rigidez, espasticidad y desviaciones** de los miembros inferiores, una órtesis adaptada al paciente **mejora la marcha** y **reduce la fatiga y el coste de oxígeno**."}]},{"id":"rodilla-cadera","titulo":"Rodillas valgas o varas y patología de cadera infantil","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"Rodillas separadas","titulo":"Genu varo","texto":"Los **maléolos se tocan** pero las **rodillas están separadas**."},{"etiqueta":"Maléolos separados","titulo":"Genu valgo","texto":"Las **rodillas están en contacto** pero los **maléolos separados**."}]},{"tipo":"parrafo","texto":"Ambas alteraciones pueden conllevar problemas articulares como **artrosis**. Se han utilizado órtesis para su corrección y seguimiento con frecuencia, aunque **sin mucho éxito**: hace falta más investigación para demostrar efectos **estructurales** más allá de los funcionales o sintomáticos (Zeighami et al., 2020). La opción quirúrgica citada es la **osteotomía** (p. ej., de varización)."},{"tipo":"tabla","titulo":"Patología de cadera infantil","columnas":["Entidad","Mecanismo y clínica","Tratamiento / órtesis"],"filas":[["Síndrome de Perthes (osteocondritis deformante juvenil, coxa plana)","Osteocondrosis **idiopática de la cabeza femoral**: debilidad progresiva por falta de **vascularización y osificación**; mejora con reposo, duele con el ejercicio; rigidez y dolor en **ingle, muslo o rodilla**; puede dejar deformidad permanente","Conservador; **órtesis en abducción** de cadera"],["Displasia de Meyer (displasia epifisaria femoral)","Osificación **irregular** de la cabeza femoral con **bloqueo en rotación interna**; **asintomática**, diagnóstico casual; causa desconocida (genética/congénita) con alteraciones vasculares → retraso de osificación y **varios núcleos**","Órtesis en **rotación externa y abducción forzada** (Calatayud, 2022; Méndez et al., 2007)"],["Sinovitis de cadera","Inflamación de la sinovial; asociada a **infecciones respiratorias, digestivas** o traumatismo; dolor y molestia en carga; **3–10 años**","Conservador: reposo + antiinflamatorios; cede en **una semana**; órtesis posible en abducción (como Perthes)"],["Cadera en resorte (coxa saltans, cadera de bailarín)","Chasquido audible o palpable con el movimiento, sobre todo al **rotar y levantar al niño**; más en **niñas adolescentes** (danza, saltos)","Descanso, estirar hipertónicos, fortalecer hipotónicos, AINE, ejercicios acuáticos; cirugía mínimamente invasiva si fracasa"]]},{"tipo":"figura","pagina":44,"pie":"Órtesis en abducción para el síndrome de Perthes: mantiene ambas caderas separadas para centrar la cabeza femoral en el acetábulo durante la remodelación.","src":"img/ortesis-t3-tema-3-patologia-ortopedica-infantil-p44.jpg"},{"tipo":"tabla","titulo":"Tipos de cadera en resorte","columnas":["Tipo","Estructura","¿Audible?"],"filas":[["Intraarticular","Desgarros, daño muscular y/o **cuerpos sueltos**","—"],["Extraarticular externo","**Banda iliotibial** o tendón del **glúteo mayor** sobre el **trocánter mayor**","**Inaudible**"],["Extraarticular interno","Tendón del **iliopsoas** sobre la **eminencia iliopectínea** o la cabeza femoral","**Audible**"]]},{"tipo":"alerta","texto":"Cadera en resorte: el tipo **externo** (cintilla iliotibial/glúteo mayor sobre el trocánter) es **inaudible** según el temario, y el **interno** (iliopsoas) es **audible**. Es fácil invertirlo."},{"tipo":"alerta","texto":"Perthes y Meyer afectan ambas a la cabeza femoral, pero Perthes es **dolorosa** (duele con el ejercicio) y Meyer es **asintomática**; la órtesis de Meyer añade **rotación externa** porque la cadera está bloqueada en **rotación interna**."},{"tipo":"esquema","titulo":"Orientación de una cojera o dolor de cadera infantil","mermaid":"flowchart TD\n  A[\"Niño con molestias de cadera\"] --> B{\"Dolor\"}\n  B -->|\"No, hallazgo casual\"| C[\"Displasia de Meyer: RE y ABD\"]\n  B -->|\"Sí\"| D{\"Infección reciente, 3-10 años\"}\n  D -->|\"Sí\"| E[\"Sinovitis: reposo y AINE, 1 semana\"]\n  D -->|\"No\"| F{\"Chasquido al mover\"}\n  F -->|\"Sí\"| G[\"Cadera en resorte\"]\n  F -->|\"No\"| H[\"Perthes: dolor con ejercicio, órtesis en ABD\"]","pie":"Esquema didáctico construido con los rasgos diferenciales del temario; el diagnóstico definitivo requiere exploración e imagen."}]},{"id":"osgood-baker","titulo":"Rodilla del adolescente: Osgood-Schlatter y quiste de Baker","bloques":[{"tipo":"definicion","termino":"Enfermedad de Osgood-Schlatter (de Lannelongue)","texto":"**Osteocondrosis apofisaria más común de la rodilla** (Herrero-Morín et al., 2017): la **tracción repetida del tendón rotuliano** sobre la espina tibial produce inflamación y/o rotura de su inserción en la **tuberosidad tibial anterior** y dolor."},{"tipo":"parrafo","texto":"Produce dolor en la cara **anterosuperior de la tibia**, ligado a la actividad física: primero aparece **tras el ejercicio** y luego se vuelve **permanente** e independiente de ella. Afecta a **1 de cada 10 adolescentes deportistas** y supone el **13,6%** de las patologías de rodilla en futbolistas de 12–15 años."},{"tipo":"dato","valor":"14:1","texto":"Proporción varones:mujeres en Osgood-Schlatter; edad de 10–15 años en niños y 8–12 años en niñas."},{"tipo":"lista","items":["Factores de riesgo: fase de crecimiento óseo, **desequilibrio cuádriceps–isquiotibiales**, sexo masculino (14:1) y deportes **explosivos, anaeróbicos y con cambios de dirección** (fútbol, baloncesto, balonmano)."]},{"tipo":"tabla","titulo":"Diagnóstico de Osgood-Schlatter","columnas":["Herramienta","Contenido"],"filas":[["Grado 1","Ligera **elevación** de la tuberosidad"],["Grado 2","**Radiolucidez** de la tuberosidad"],["Grado 3","**Fragmentación** de la tuberosidad"],["Radiografía","Densidad irregular y despegamiento de la cortical"],["Prueba de Ely","Valora la **flexibilidad del recto femoral**"]]},{"tipo":"figura","pagina":55,"pie":"Grados diagnósticos de Osgood-Schlatter, prueba de Ely (flexión de rodilla en prono que eleva la pelvis si el recto femoral está acortado) y radiografías laterales con irregularidad de la tuberosidad tibial.","src":"img/ortesis-t3-tema-3-patologia-ortopedica-infantil-p55.jpg"},{"tipo":"parrafo","texto":"El tratamiento es sobre todo **conservador**: estiramientos y fortalecimiento de **cuádriceps, isquiotibiales y gastrocnemios**, modificación de la actividad causante, **órtesis antivibraciones del tendón rotuliano**, frío local y AINE; la **inmovilización** (yeso u órtesis) reduce la tensión sobre la tuberosidad. La **cirugía** solo se plantea si el dolor no remite, para retirar las estructuras óseas causantes."},{"tipo":"dato","valor":"14,5 vs 29 meses","texto":"Duración de los síntomas en casos avanzados de Osgood-Schlatter: 14 meses y medio con yeso frente a 29 meses en los no inmovilizados."},{"tipo":"definicion","termino":"Quiste de Baker (quiste poplíteo)","texto":"Saco de líquido sinovial fuera de la rodilla causado por **distensión y extravasación de la bursa del gastrocnemio-semimembranoso**, que comunica con la cavidad articular (Nanduri et al., 2021). Asociado a **lesiones meniscales**; suele descubrirse por casualidad; si da síntomas, duele más en **extensión o flexión máximas** o con la actividad."},{"tipo":"parrafo","texto":"En la gran mayoría de casos **no requiere tratamiento** (se reabsorbe). Con tratamiento conservador (restricción de actividad, AINE orales o tópicos, fisioterapia, aspiración articular) hay remisión parcial o total en aproximadamente **la mitad** de los pacientes; con cirugía la **recurrencia** en niños es de alrededor del **40%**."}]},{"id":"pie-talon","titulo":"Pie y talón: fibroma plantar y enfermedad de Sever","bloques":[{"tipo":"definicion","termino":"Fibroma plantar del talón","texto":"Pequeña prominencia **no dolorosa** en la zona **anterointerna** del talón: nódulos subcutáneos **incoloros, bilaterales y simétricos**, de **0,5–1 cm**, en la parte posterior de la planta. Etiología desconocida; **no requiere tratamiento** y, si da síntomas, biopsia cutánea y extirpación."},{"tipo":"definicion","termino":"Enfermedad de Sever (apofisitis del calcáneo)","texto":"Inflamación e irritación de los **cartílagos de crecimiento del talón**: dolor calcáneo de tipo **entesis**, unilateral (pie dominante) o bilateral, en niños de **8 a 15 años**."},{"tipo":"parrafo","texto":"Tiene una incidencia de **3,7/1000** pacientes y no suele relacionarse con traumatismos sino con la **actividad física y la carga**. Mecanismo: el **crecimiento óseo acelerado supera al de la unidad musculotendinosa**, que no puede estirarse lo suficiente, aumenta la tensión sobre la apófisis y la irrita. Clínica: dolor a la palpación y al iniciar la actividad durante varias semanas, y **engrosamiento del tendón de Aquiles**. El diagnóstico se basa en anamnesis, examen físico y la **prueba de compresión del talón**."},{"tipo":"tabla","titulo":"Enfermedad de Sever: factores de riesgo y tratamiento","columnas":["Factores de riesgo","Tratamiento conservador"],"filas":[["Deformidades del pie (equino, cavo…)","**Plantillas con alza de talón** en cada pie (**mínimo 5 mm**)"],["Deportes que sobrecargan el gastrosóleo (taekwondo)","Disminución de la actividad deportiva"],["Alto impacto en talón (fútbol, gimnasia, marcha, ballet, tenis) o explosivos (baloncesto, atletismo)","**Crioterapia 15 minutos**"],["Malos hábitos (sin estiramientos), mal calzado, superficies duras","Estiramientos de la musculatura posterior, ejercicios, kinesiotaping"]]},{"tipo":"perla","texto":"El alza de talón (≥ 5 mm) acorta la distancia de inserción del tríceps sural y reduce la tracción del Aquiles sobre la apófisis calcánea; combínala con estiramientos posteriores, igual que en Osgood-Schlatter se trabaja la flexibilidad del cuádriceps."},{"tipo":"esquema","titulo":"Mecanismo común de las apofisitis por tracción","mermaid":"flowchart LR\n  A[\"Pico de crecimiento óseo\"] --> B[\"Unidad músculo-tendinosa relativamente corta\"]\n  B --> C[\"Más tensión en la apófisis\"]\n  D[\"Deporte explosivo o de impacto\"] --> C\n  C --> E[\"Osgood: tuberosidad tibial\"]\n  C --> F[\"Sever: calcáneo\"]\n  E --> G[\"Estiramientos, descarga, órtesis\"]\n  F --> G","pie":"Osgood-Schlatter (tendón rotuliano) y Sever (Aquiles) comparten mecanismo de tracción sobre una apófisis inmadura."},{"tipo":"alerta","texto":"Sever = **calcáneo**, 8–15 años, **no traumática**; Osgood = **tuberosidad tibial**, 14:1 varones. El fibroma plantar, en cambio, **no duele** a la palpación."}]}],"caso_clinico":{"titulo":"Marcos, 13 años, futbolista con dolor bajo la rótula","presentacion":"Marcos, 13 años, juega al fútbol 5 días por semana y ha crecido 8 cm en el último año. Refiere dolor en la cara anterosuperior de la tibia derecha que al principio aparecía después de entrenar y ahora persiste en reposo. Se palpa una prominencia dolorosa en la tuberosidad tibial; la prueba de Ely es positiva. La radiografía muestra radiolucidez de la tuberosidad sin fragmentos. Su hermana de 10 años, gimnasta, se queja de dolor en ambos talones al empezar a entrenar.","preguntas":[{"pregunta":"¿Cuál es el diagnóstico de Marcos y en qué grado se encuentra?","respuesta":"Enfermedad de Osgood-Schlatter, osteocondrosis apofisaria por tracción del tendón rotuliano sobre la tuberosidad tibial. La radiolucidez sin fragmentación corresponde al grado 2. Tiene factores de riesgo: varón (14:1), pico de crecimiento y deporte explosivo."},{"pregunta":"¿Qué tratamiento propones?","respuesta":"Conservador: modificar la actividad causante, estirar el recto femoral (Ely positiva), los isquiotibiales y los gastrocnemios y fortalecer la rodilla, frío local y AINE, y una órtesis antivibraciones del tendón rotuliano; la inmovilización puede acortar los síntomas (14,5 meses con yeso frente a 29 sin inmovilizar). La cirugía solo se plantea si el dolor no remite."},{"pregunta":"¿Qué sospechas en su hermana y cómo la tratarías?","respuesta":"Enfermedad de Sever (apofisitis del calcáneo): 8–15 años, deporte de impacto en el talón, dolor al iniciar la actividad; se confirma con la compresión del talón. Plantillas con alza de talón de al menos 5 mm, reducir la actividad, crioterapia 15 min y estiramientos de la musculatura posterior."}]},"preguntate":[{"pregunta":"¿Por qué es tan importante el diagnóstico precoz en ortopedia infantil?","respuesta":"Porque huesos y músculos están en crecimiento (Risser \u003c 4/5): detectar pronto permite un tratamiento mejor y una corrección más rápida, y las zonas de crecimiento y las entesis son las más vulnerables hasta los 20 años."},{"pregunta":"Diferencia plagiocefalia posicional y craneosinostosis.","respuesta":"La posicional se debe a fuerzas externas prolongadas, es benigna y no afecta al desarrollo neurológico; la craneosinostosis es el cierre prematuro de suturas, puede elevar la presión intracraneal y su tratamiento es quirúrgico."},{"pregunta":"¿Cuándo y cómo se pauta el casco craneal?","respuesta":"Cuando el bebé no mejora con el tratamiento postural; se diseña a medida, se lleva 3–4 meses a 23 h/día y se ajusta cada mes."},{"pregunta":"Describe la tortícolis muscular congénita y su tratamiento.","respuesta":"Acortamiento del ECOM (más el derecho) por malposición o sobrepresión en el parto con fibrosis; bulto no doloroso en el tercio inferior; se trata con manipulación suave precoz, estímulos desde el lado afectado e implicación de los padres; se resuelve en 2–6 meses."},{"pregunta":"¿Por qué el corsé en la espondilolistesis infantil es discutido?","respuesta":"Porque ninguna órtesis reduce eficazmente el movimiento de L4-L5 y no hay diferencias significativas con y sin corsé; la mejoría se debe a restringir extensión y torsión y al curso benigno."},{"pregunta":"¿Qué diferencia meningocele de mielomeningocele?","respuesta":"El meningocele contiene LCR y meninges y es operable; el mielomeningocele contiene además médula espinal y deja incapacidad permanente."},{"pregunta":"¿Qué órtesis se usan en Perthes y en Meyer y por qué?","respuesta":"En Perthes, órtesis en abducción para centrar la cabeza femoral; en Meyer, órtesis en rotación externa y abducción forzada porque la cadera está bloqueada en rotación interna."},{"pregunta":"Clasifica los tipos de cadera en resorte.","respuesta":"Intraarticular (desgarros, cuerpos sueltos) y extraarticular: externo (cintilla iliotibial o glúteo mayor sobre el trocánter, inaudible) e interno (iliopsoas sobre la eminencia iliopectínea o la cabeza femoral, audible)."},{"pregunta":"¿Cuáles son los tres grados diagnósticos de Osgood-Schlatter?","respuesta":"Grado 1: ligera elevación de la tuberosidad; grado 2: radiolucidez; grado 3: fragmentación."},{"pregunta":"Explica el mecanismo de la enfermedad de Sever.","respuesta":"El crecimiento óseo acelerado supera al de la unidad musculotendinosa, que queda relativamente corta y aumenta la tensión sobre la apófisis calcánea, irritándola e inflamándola, sobre todo con deportes de impacto."}],"glosario":[{"termino":"Entesis","definicion":"Zona de inserción de tendones y ligamentos en el hueso; muy vulnerable durante el crecimiento."},{"termino":"Plagiocefalia","definicion":"Aplanamiento asimétrico del cráneo, generalmente posicional."},{"termino":"Braquicefalia","definicion":"Aplanamiento simétrico posterior: cráneo ancho y corto."},{"termino":"Craneosinostosis","definicion":"Cierre prematuro de una o más suturas craneales."},{"termino":"Oligohidramnios","definicion":"Baja cantidad de líquido amniótico; factor ambiental de craneosinostosis."},{"termino":"ECOM","definicion":"Músculo esternocleidomastoideo, acortado en la tortícolis congénita."},{"termino":"Espondilólisis","definicion":"Defecto del istmo vertebral que suele preceder a la espondilolistesis."},{"termino":"Mielomeningocele","definicion":"Forma de espina bífida con LCR, meninges y médula en el saco."},{"termino":"Coxa plana","definicion":"Sinónimo del síndrome de Perthes (osteocondritis deformante juvenil)."},{"termino":"Coxa saltans","definicion":"Cadera en resorte o de bailarín: chasquido durante el movimiento."},{"termino":"Apofisitis","definicion":"Inflamación de una apófisis de crecimiento por tracción tendinosa (Osgood, Sever)."},{"termino":"Prueba de Ely","definicion":"Prueba de flexibilidad del recto femoral usada en Osgood-Schlatter."}],"fuentes":["American Academy of Pediatrics (2006); Caballero et al. (2017); Grunstein-Bistre et al. (2019).","Schneider, M. G. (2013). Efectos teratogénicos de fármacos antiepilépticos.","SEDAR (2023). Ejemplos de craneosinostosis.","Sytsma et al. (2016); Kuo et al. (2014).","Matamoros Rodríguez (2021).","Mora-de Sambricio et al. (2014).","Zeighami et al. (2020).","Calatayud (2022); Méndez et al. (2007); Nouri et al. (2014); Molina (2011).","Musick & Varacallo (2022); Walker et al. (2021).","Herrero-Morín et al. (2017); Nanduri et al. (2021)."],"qcm":[{"pregunta":"Según el temario, ¿en qué zona debe centrarse especialmente el ortopedista pediátrico por ser la más susceptible de lesión en los primeros 20 años?","opciones":["La diáfisis de los huesos largos en fase de remodelación","Las áreas de crecimiento de los extremos óseos y las entesis","Los meniscos y ligamentos cruzados de la rodilla en carga","Los discos intervertebrales lumbares en flexión repetida"],"correcta":1,"explicacion":"El temario insiste en que el especialista debe centrarse en las áreas de crecimiento de los extremos de los huesos (entesis), la zona más susceptible de lesión en los primeros 20 años.","por_opcion":["❌ La diáfisis no es la zona destacada.","✅ Zona señalada en el temario.","❌ No es la zona de mayor riesgo en el niño según el tema.","❌ No se cita como zona principal."]},{"pregunta":"¿Qué rasgo diferencia la braquicefalia de la plagiocefalia posicional?","opciones":["El aplanamiento afecta solo a la región frontal unilateral","El aplanamiento posterior es simétrico, con cráneo ancho y corto","Se debe siempre a la fusión prematura de la sutura sagital","Altera el desarrollo neurológico y requiere siempre cirugía"],"correcta":1,"explicacion":"La braquicefalia provoca un aplanamiento simétrico de la parte posterior, con un cráneo más ancho y más corto anteroposteriormente; la plagiocefalia es una asimetría.","por_opcion":["❌ Describe más bien una plagiocefalia anterior.","✅ Definición del temario.","❌ Habitualmente es posicional; la fusión solo en casos graves.","❌ Las posicionales no afectan al desarrollo neurológico."]},{"pregunta":"Un bebé con plagiocefalia posicional no mejora tras el tratamiento postural. ¿Qué pauta de casco recoge el temario?","opciones":["6–8 meses, 12 h/día, con adaptación trimestral","1–2 meses, solo nocturno, sin necesidad de ajustes","3–4 meses, 23 h/día, con adaptación mensual","3–4 meses, 16 h/día, con adaptación semanal"],"correcta":2,"explicacion":"El casco se diseña a medida y se lleva durante 3–4 meses, 23 h/día, con adaptación cada mes; se pauta cuando falla el tratamiento postural.","por_opcion":["❌ Duración, horas y ajustes incorrectos.","❌ No es de uso nocturno.","✅ Pauta del temario.","❌ Horas y frecuencia de ajuste incorrectas."]},{"pregunta":"¿Qué prueba se considera la imagen más completa y precisa para estudiar las suturas craneales?","opciones":["Tomografía computarizada con reconstrucción tridimensional","Ecografía transfontanelar en el primer trimestre de vida","Radiografía simple de cráneo en dos proyecciones","Resonancia magnética craneal con contraste de gadolinio"],"correcta":0,"explicacion":"El TAC con reconstrucción 3D es la imagen más completa y precisa; la radiografía es menos precisa aunque rentable, y la RM es excelente para el cerebro.","por_opcion":["✅ Prueba de referencia para suturas.","❌ No se cita en el temario.","❌ Menos precisa, aunque rentable.","❌ La RM es excelente para el cerebro, no para las suturas."]},{"pregunta":"¿Qué porcentaje del origen de la craneosinostosis atribuye el temario a los genes?","opciones":["5%","50%","20%","80%"],"correcta":2,"explicacion":"Los factores genéticos (mutaciones monogénicas, anomalías cromosómicas, antecedentes poligénicos) suponen un 20%; el resto se relaciona con factores ambientales.","por_opcion":["❌ No es la cifra citada.","❌ No es la cifra citada.","✅ Cifra del temario.","❌ El 80% corresponde a la proporción de escoliosis idiopáticas (tema 2)."]},{"pregunta":"En la tortícolis muscular congénita, ¿qué hallazgo palpatorio describe el temario?","opciones":["Nódulo duro y doloroso en la inserción mastoidea del ECOM","Masa dolorosa en el tercio superior del trapecio","Cordón fibroso indoloro en los escalenos anteriores","Abultamiento no doloroso en el tercio inferior del ECOM"],"correcta":3,"explicacion":"A la palpación se observa un abultamiento no doloroso en el tercio inferior del ECOM (Sytsma et al., 2016), secundario a fibrosis por malposición o sobrepresión en el parto.","por_opcion":["❌ No es doloroso ni está en la mastoides según el tema.","❌ No afecta al trapecio y no es doloroso.","❌ No se trata de los escalenos.","✅ Hallazgo descrito."]},{"pregunta":"¿Qué recomendación clave del tratamiento de la tortícolis congénita es correcta?","opciones":["Que los estímulos procedan del lado sano para relajar el ECOM","Inmovilizar con collarín rígido durante los primeros 3 meses","Esperar sin intervenir hasta los 6 meses de vida","Que todos los estímulos procedan del lado afectado"],"correcta":3,"explicacion":"El tratamiento es la manipulación suave y precoz y se aconseja que todos los estímulos procedan del lado afectado, implicando a los padres con juegos y estímulos constantes.","por_opcion":["❌ Es el lado contrario.","❌ No se pauta inmovilización.","❌ El tratamiento debe ser precoz.","✅ Recomendación del temario."]},{"pregunta":"Según la clasificación de Cobb de este tema, una curva de 30º se considera:","opciones":["Moderada","Severa","Moderada a severa","Ligera a moderada"],"correcta":0,"explicacion":"La escala del tema: ligera 5–15º, ligera a moderada 16–24º, moderada 25–34º, moderada a severa 35–44º, severa 45–49º y muy severa > 60º.","por_opcion":["✅ 30º está en 25–34º.","❌ Corresponde a 45–49º.","❌ Corresponde a 35–44º.","❌ Corresponde a 16–24º."]},{"pregunta":"¿Cuál es la causa identificable más común que precede a la espondilolistesis en el niño?","opciones":["La hernia discal L5-S1","La espondilólisis","La cifosis de Scheuermann","El síndrome de Perthes"],"correcta":1,"explicacion":"La espondilolistesis suele manifestarse antes como lumbalgia precedida por una espondilólisis, la causa identificable más común.","por_opcion":["❌ No se cita como precursor.","✅ Precursor citado.","❌ Es otra patología vertebral.","❌ Es una patología de cadera."]},{"pregunta":"Respecto a las condiciones ideales para la cirugía de la espondilolistesis, ¿cuál es correcta?","opciones":["Menos de 15 años, vértebra S1 y listesis de grado alto","Cualquier edad, presencia de discopatía y displasia posterior","Menos de 20 años, vértebra L4 y separación menor de 2 mm","Más de 20 años, vértebra L5 y separación mayor de 5 mm"],"correcta":2,"explicacion":"Las condiciones ideales son: menos de 20 años, separación del segmento menor de 2 mm, vértebra afectada L4, sin displasia posterior, sin discopatía y listesis mínima.","por_opcion":["❌ La listesis debe ser mínima.","❌ Deben estar ausentes la discopatía y la displasia.","✅ Condiciones del temario.","❌ Invierte edad, vértebra y separación."]},{"pregunta":"¿Qué distingue la displasia de Meyer del síndrome de Perthes?","opciones":["Es asintomática y bloquea la cadera en rotación interna","Afecta a la tuberosidad tibial y no a la cabeza femoral","Se asocia a infecciones respiratorias y cede en una semana","Es dolorosa con el ejercicio y mejora con el reposo"],"correcta":0,"explicacion":"Meyer (displasia epifisaria femoral) es una osificación irregular asintomática, de diagnóstico casual, con bloqueo en rotación interna; se trata con órtesis en rotación externa y abducción forzada.","por_opcion":["✅ Rasgos de Meyer.","❌ Corresponde a Osgood-Schlatter.","❌ Corresponde a la sinovitis de cadera.","❌ Es la clínica de Perthes."]},{"pregunta":"En la cadera en resorte extraarticular externa, ¿qué estructura produce el resalte y cómo es el chasquido según el temario?","opciones":["Iliopsoas sobre la eminencia iliopectínea; audible","Banda iliotibial sobre la cabeza femoral; audible","Cuerpos sueltos intraarticulares; inaudible","Banda iliotibial o glúteo mayor sobre el trocánter; inaudible"],"correcta":3,"explicacion":"El tipo externo se debe al movimiento de la banda iliotibial o del glúteo mayor sobre el trocánter mayor y es inaudible; el interno (iliopsoas) es audible.","por_opcion":["❌ Es el tipo interno.","❌ Estructura y audibilidad mal combinadas.","❌ Corresponde al tipo intraarticular.","✅ Tipo externo."]},{"pregunta":"En Osgood-Schlatter, ¿qué hallazgo define el grado 3?","opciones":["Radiolucidez de la tuberosidad tibial","Engrosamiento del tendón rotuliano","Ligera elevación de la tuberosidad tibial","Fragmentación de la tuberosidad tibial"],"correcta":3,"explicacion":"Los grados son: 1 ligera elevación, 2 radiolucidez y 3 fragmentación de la tuberosidad.","por_opcion":["❌ Grado 2.","❌ No es un grado de la clasificación.","❌ Grado 1.","✅ Grado 3."]},{"pregunta":"¿Qué dato sobre la duración de los síntomas en Osgood-Schlatter avanzado recoge el temario?","opciones":["6 meses con órtesis frente a 12 meses sin órtesis","29 meses con yeso frente a 14,5 meses sin inmovilizar","Igual duración con y sin inmovilización, unos 18 meses","14,5 meses con yeso frente a 29 meses sin inmovilizar"],"correcta":3,"explicacion":"La inmovilización reduce la tensión sobre la tuberosidad: los síntomas duran 14 meses y medio con yeso frente a 29 meses en los no inmovilizados.","por_opcion":["❌ Cifras inventadas.","❌ Invierte los grupos.","❌ El temario sí muestra una diferencia.","✅ Cifras del temario."]},{"pregunta":"En la enfermedad de Sever, ¿qué medida ortésica concreta indica el temario?","opciones":["Plantillas con alza de talón de al menos 5 mm en cada pie","Férula nocturna en flexión dorsal máxima del tobillo","Órtesis antivibraciones sobre el tendón de Aquiles","Alza de talón de 15 mm solo en el pie sintomático"],"correcta":0,"explicacion":"El tratamiento conservador incluye plantillas con pieza elevadora de talón en cada pie (mínimo 5 mm), menos actividad, crioterapia de 15 minutos y estiramientos posteriores.","por_opcion":["✅ Medida del temario.","❌ No se cita en el temario.","❌ La órtesis antivibraciones se cita para el tendón rotuliano en Osgood.","❌ Cifra y lateralidad incorrectas."]}],"asignatura":"Ortesis","tema":3,"fecha":"2026-11-10"}</script>

const L = 'ABCD';

/* color de la asignatura */

const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
