<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Tema 4: Patología degenerativa osteoarticular – artrosis, artritis reumatoide y osteoporosis · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>

<script id="datos" type="application/json">{"titulo":"Tema 4: Patología degenerativa osteoarticular – artrosis, artritis reumatoide y osteoporosis","subtitulo":"Patogenia, clínica, clasificación, diagnóstico y tratamiento de la artrosis, diferencias con la artritis reumatoide, fisiología ósea y osteoporosis, y órtesis indicadas.","resumen":["Las enfermedades degenerativas osteoarticulares, las más frecuentes, destruyen el **cartílago articular** (con **osteofitos** y nódulos) y se relacionan con **actividad física, edad, genética y peso**; la más frecuente es la **artrosis**.","La **artrosis** es un proceso **multifactorial**: lesión del cartílago, **esclerosis del hueso subcondral**, **senescencia de condrocitos (SASP)** e **inflamación sinovial (DAMPs → IL-1β, TNF-α, MMPs)**; cursa con **dolor mecánico**, **rigidez \u003c 30 min**, crepitación y deformidad.","Se gradúa de **0 a 4** (en cadera, **Tönnis 0–3**), con formas típicas en **mano (Heberden en IFD, Bouchard en IFP, rizartrosis)**, **coxartrosis** (dolor inguinal), **gonartrosis** y **espondiloartrosis**; se trata con **pérdida de peso, ejercicio de resistencia 3–6 meses**, fármacos y cirugía.","La **artritis reumatoide** es **autoinmune**, **simétrica y periférica**, **2–3 veces más en mujeres**, con **rigidez matutina > 1 h**, manifestaciones **extraarticulares**, **FR y anti-CCP** y erosiones; se trata con **DMARDs (metotrexato, biológicos)**.","La **osteoporosis** afecta al **35 % de mujeres > 50 años y 52 % > 70 años**; se diagnostica con **DXA (T-score \u003c −2,5)**, el pico de masa ósea es a los **30 años**, y se trata con **antirresortivos, formadores de hueso, calcio y vitamina D** y **ejercicio de bajo impacto (\u003c 130 lpm)**."],"objetivos":["Clasificar las principales enfermedades musculoesqueléticas y los tipos de articulación.","Explicar la patogenia, clínica, clasificación y tratamiento de la artrosis y sus localizaciones.","Diferenciar la artritis reumatoide de la artrosis.","Describir la fisiología ósea (células y regulación) y la osteoporosis: factores de riesgo, diagnóstico y tratamiento.","Conocer las órtesis empleadas en la patología degenerativa."],"ideas_clave":["Articulaciones: **sinartrosis** (sin movimiento), **anfiartrosis** (poco), **sinoviales** (mucho).","Artrosis: **↓ espacio articular, esclerosis subcondral con quistes y osteofitos, engrosamiento sinovial**.","Dolor artrósico **aumenta con el uso y cede en reposo**; rigidez matutina **breve (\u003c 30 min)**.","**Heberden = IFD**, **Bouchard = IFP**; **rizartrosis = trapeciometacarpiana**.","AR: **rigidez > 1 h**, simétrica, pequeñas articulaciones, **FR/anti-CCP +**, **osteopenia periarticular** y erosiones.","**Osteoblastos forman**, **osteoclastos reabsorben**; **PTH → resorción**, **calcitonina → formación**; **estrógenos inhiben** los osteoclastos.","DXA: **T-score > −1 normal**, **−1 a −2,5 osteopenia (riesgo ×2)**, **\u003c −2,5 osteoporosis (riesgo ×4)**.","Fracturas osteoporóticas más frecuentes: **cadera, muñeca y columna**."],"secciones":[{"id":"generalidades","titulo":"Generalidades","bloques":[{"tipo":"tabla","titulo":"Principales enfermedades articulares","columnas":["Grupo","Ejemplos"],"filas":[["Infantojuveniles","Espina bífida; sindactilia, polidactilia; coxa vara/valga; pie cavo, equino varo; luxación congénita de cadera; **Legg-Calvé-Perthes**; escoliosis idiopática; artritis juvenil"],["Adulto: partes blandas","Síndromes miofasciales; sinovial y tendones"],["Adulto: artropatías","Infecciosas, poliartropatías inflamatorias, **artrosis**"],["Adulto: osteopatías y condropatías","**Osteoporosis**, osteomalacia, Paget"],["Adulto: tejido conectivo sistémico","Esclerodermia, dermatopolimiositis, lupus, poliarteritis nodosa"],["Adulto: dorsopatías","Hipercifosis, hiperlordosis, espondilopatías"]]},{"tipo":"definicion","termino":"Articulación","texto":"Unión entre dos o más huesos o entre cartílago y hueso; **favorece el movimiento** y **estabiliza**. Según su movilidad: **sinartrosis** (inmóviles), **anfiartrosis** (poco móviles) y **sinoviales** (muy móviles)."},{"tipo":"parrafo","texto":"Las **enfermedades degenerativas osteoarticulares** son las más frecuentes de las sociedades pasadas y presentes: **destrucción del cartílago** con producción de **osteofitos** y nódulos, en correlación con **actividad física, edad, factores genéticos y peso**. La más frecuente es la **artrosis**."}]},{"id":"artrosis-patogenia","titulo":"Artrosis: patogenia y anatomía patológica","bloques":[{"tipo":"definicion","termino":"Artrosis u osteoartritis (OA)","texto":"El **trastorno articular más común**, debido al **envejecimiento, desgaste y ruptura** de la articulación; implica **cartílago, hueso subcondral, meniscos y líquido sinovial**."},{"tipo":"esquema","titulo":"Patogenia de la artrosis","mermaid":"flowchart TD\n  A[\"1 Lesion del cartilago superficial\"] --> B[\"Perdida de equilibrio hidrico y de carga\"]\n  B --> C[\"Degradacion de colageno y proteoglicanos\"]\n  C --> D[\"Citocinas: apoptosis de condrocitos\"]\n  D --> E[\"2 Esclerosis y remodelacion subcondral\"]\n  E -->|\"exosomas\"| F[\"Genes catabolicos en condrocitos\"]\n  F --> G[\"3 Senescencia: SASP con TGF-beta e IL-6\"]\n  G --> H[\"4 Sinovial: DAMPs activan RAGE y TLR\"]\n  H --> I[\"IL-1beta, TNF-alfa, MMPs\"]\n  I -->|\"retroalimentacion\"| C","pie":"Ciclo sinovial–cartílago que perpetúa el daño: inflamación, senescencia y biomecánica interactúan."},{"tipo":"definicion","termino":"Senescencia celular","texto":"La célula **pierde su capacidad de dividirse** pero sigue **metabólicamente activa**; los condrocitos senescentes secretan **SASP** (TGF-β, IL-6) que perpetúa la inflamación."},{"tipo":"lista","items":["**Disminución del grosor** y **pérdida del cartílago**.","**Disminución del espacio articular**.","**Esclerosis del hueso subcondral** → **quistes y osteofitos**.","**Engrosamiento sinovial**.","**Deformidad y laxitud** articular."]},{"tipo":"figura","pagina":14,"pie":"Factores que conducen de la articulación normal a la artrósica: edad, sexo, genética, sobrepeso, profesión, traumatismos, actividad deportiva, fuerza muscular, densidad mineral ósea…","src":"img/ortesis-t4-tema-4-patologia-degenerativa-osteoarticular-artrosis-artrit-p14.jpg"},{"tipo":"figura","pagina":12,"pie":"Prevalencia de artrosis sintomática en España (EPISER2016): aumenta con la edad y es mayor en mujeres, superando el 60 % a partir de los 80 años.","src":"img/ortesis-t4-tema-4-patologia-degenerativa-osteoarticular-artrosis-artrit-p12.jpg"}]},{"id":"artrosis-clinica","titulo":"Artrosis: clínica, clasificación y diagnóstico","bloques":[{"tipo":"lista","items":["El **dolor** es el síntoma más frecuente: **sordo, difuso, poco definido**, puede irradiarse.","**Aumenta con el uso y disminuye en reposo** (dolor mecánico).","Puede haber **derrame articular**.","**Rigidez** tras descansos prolongados → **rigidez matutina** (breve).","**Crepitaciones y bloqueos** (“arena en la articulación”).","**Deformidad articular** por la degeneración."]},{"tipo":"tabla","titulo":"Grados radiológicos de la artrosis","columnas":["Grado","Hallazgos"],"filas":[["0","Sin signos de artrosis"],["1","Cambios mínimos, posible estrechamiento"],["2","**Osteofitos visibles** y leve estrechamiento"],["3","Osteofitos grandes, estrechamiento moderado, deformidad ósea"],["4","Gran pérdida del espacio, deformidad y **dolor intenso**"]]},{"tipo":"parrafo","texto":"Diagnóstico: **anamnesis, exploración física** y **RX convencional**. Criterios del Colegio Americano de Reumatología: rodilla (dolor + osteofitos o, en > 40 años, líquido sinovial de OA, **rigidez \u003c 30 min** y crepitaciones; S 94 %, E 88 %); cadera (dolor + 2 de: **VSG \u003c 20 mm/h**, osteofitos, reducción del espacio; S 89 %, E 91 %); mano (S 93 %, E 97 %)."},{"tipo":"figura","pagina":18,"pie":"Tipos de artrosis: idiopática localizada (manos, pies, rodilla, cadera, columna…) o generalizada, y secundaria (congénita, metabólica, por cristales, postraumática…).","src":"img/ortesis-t4-tema-4-patologia-degenerativa-osteoarticular-artrosis-artrit-p18.jpg"}]},{"id":"artrosis-localizaciones","titulo":"Localizaciones y tratamiento de la artrosis","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"Mano","titulo":"Artrosis de mano","texto":"Predomina en **IFD**, sobre todo en **mujeres**. **Heberden** = IFD; **Bouchard** = IFP. **Rizartrosis** = artrosis **trapeciometacarpiana**, con deformidad y disfunción de la base del pulgar."},{"etiqueta":"Cadera","titulo":"Coxartrosis","texto":"Dolor sobre todo en la **ingle**, irradiado a cara anterior del muslo hasta la rodilla o a la nalga; rigidez matutina y problemas para caminar. Clasificación de **Tönnis (0–3)**."},{"etiqueta":"Rodilla","titulo":"Gonartrosis","texto":"Diagnóstico **clínico** (gold standard): dolor, rigidez matutina, limitación, **crepitación**, movilidad dolorosa, agrandamiento óseo. RX y laboratorio solo si hay rasgos atípicos (p. ej., pirofosfato cálcico, eritema, dolor nocturno)."},{"etiqueta":"Columna","titulo":"Espondiloartrosis","texto":"Cambios degenerativos con dolor y rigidez; puede causar **espondilolistesis** o **estenosis de canal**; > 60 años, cargas axiales, sobrepeso; osteofitos que comprimen **raíces nerviosas**."}]},{"tipo":"alerta","texto":"**Heberden en IFD, Bouchard en IFP** (B de Bouchard va “antes”, más proximal). La rizartrosis es la **trapeciometacarpiana**, no la metacarpofalángica."},{"tipo":"figura","pagina":22,"pie":"Clasificación de Tönnis: 0 sin artrosis; 1 leve disminución de la interlínea y esclerosis; 2 quistes subcondrales y esclerosis moderada; 3 contacto hueso con hueso y osteofitos.","src":"img/ortesis-t4-tema-4-patologia-degenerativa-osteoarticular-artrosis-artrit-p22.jpg"},{"tipo":"lista","items":["**Hábitos de vida**: pérdida de peso, cambios laborales.","**Fármacos**: **ácido hialurónico (precoz)** e **inhibidores de la COX-2**.","**Cirugía**: desbridamiento, osteotomías y **artroplastias**.","**Fisioterapia y ejercicio**: técnicas analgésicas y funcionales."]},{"tipo":"dato","valor":"3–6 meses","texto":"Duración de los programas de ejercicio de resistencia que mejoran dolor y función en artrosis de rodilla y cadera (rodilla: > 6 y \u003c 12 meses)."},{"tipo":"perla","texto":"Las mejoras con el ejercicio **no dependen del volumen ni de una adherencia rígida** a una dosis: lo importante es que el paciente se mueva de forma sostenida."}]},{"id":"ar","titulo":"Artritis reumatoide","bloques":[{"tipo":"definicion","termino":"Artritis reumatoide (AR)","texto":"Enfermedad **autoinmune** con inflamación crónica de las articulaciones, **generalmente simétrica y periférica**; trastorno **sistémico** con manifestaciones extraarticulares. Su cronicidad y destrucción progresiva generan **discapacidad severa**. **2–3 veces más en mujeres**; puede aparecer a cualquier edad."},{"tipo":"parrafo","texto":"Diagnóstico **clínico, radiológico** (partes blandas + / tejido óseo −) y de **laboratorio**: **VSG, PCR, factor reumatoide y anti-CCP**."},{"tipo":"tabla","titulo":"Manifestaciones de la AR","columnas":["Extraarticulares","Intraarticulares"],"filas":[["**Fatiga**","Compromiso **simétrico y poliarticular**"],["Anorexia, pérdida de peso","Dolor y rigidez"],["Febrícula, anemia","Limitación del movimiento, luxación"],["**Nódulos reumatoides**","**Deformaciones**"],["**Lesiones oculares**","**Rigidez matutina**"],["Complicaciones cardiacas y respiratorias","Tumefacción"]]},{"tipo":"tabla","titulo":"Artritis reumatoide vs artrosis","columnas":["Rasgo","Artritis reumatoide","Artrosis"],"filas":[["Naturaleza","Autoinmune: ataca la **membrana sinovial**","Degenerativa: desgaste del **cartílago**"],["Edad","30–50 años, más en mujeres","> 50 años"],["Articulaciones","Pequeñas (manos, muñecas, pies), **simétrica**","De carga (rodilla, cadera, columna, manos), **asimétrica**"],["Síntomas","**Rigidez > 1 h**, inflamación, calor, rubor","Dolor mecánico, **rigidez \u003c 30 min**, crepitación"],["Extraarticular","Sí (nódulos, pulmón, ojo, corazón)","No"],["Laboratorio","**FR +, anti-CCP, VSG y PCR ↑**","Normal"],["Radiología","**Erosiones**, pérdida de espacio, **osteopenia periarticular**","**Osteofitos**, esclerosis subcondral, quistes"],["Tratamiento","**DMARDs** (metotrexato, biológicos), corticoides, AINE","Ejercicio, fisio, peso, AINE, infiltraciones, prótesis"]]},{"tipo":"alerta","texto":"La duración de la **rigidez matutina** es el mejor discriminador clínico: **> 1 h → AR**; **\u003c 30 min → artrosis**."}]},{"id":"osteoporosis","titulo":"Osteoporosis: epidemiología, fisiología y factores de riesgo","bloques":[{"tipo":"dato","valor":"35 % · 52 %","texto":"Mujeres afectadas de más de 50 años y de más de 70 años; sobre todo postmenopáusicas, blancas y asiáticas."},{"tipo":"tabla","titulo":"Factores de riesgo","columnas":["Grupo","Factores"],"filas":[["Genéticos/constitucionales","Edad, sexo, raza caucásica o asiática, antecedentes familiares"],["Estilo de vida","Baja ingesta de calcio, déficit de vitamina D, **IMC \u003c 19**, tabaco, alcohol, sedentarismo"],["Hormonales","↓ **estrógenos** postmenopausia, menopausia precoz"],["Fármacos crónicos","**Glucocorticoides**, anticonvulsivantes, andrógenos, heparina"],["Enfermedades","Diabetes mellitus, talasemia, acromegalia"],["Otros","Fracturas previas por traumas leves"]]},{"tipo":"parrafo","texto":"El hueso tiene **matriz** (inorgánica **65 %**, orgánica **35 %**) y **células**: **osteoprogenitoras** (células madre en periostio, endostio y canales vasculares), **osteoblastos** (forman hueso y secretan osteoide; al quedar rodeados se convierten en **osteocitos** o en células de revestimiento), **osteocitos** (mantienen el tejido e intercambian con la sangre) y **osteoclastos** (reabsorben: multinucleados de origen medular, borde en cepillo, ácido y enzimas)."},{"tipo":"dato","valor":"5–10 % / año","texto":"Renovación ósea anual por el ciclo resorción–formación."},{"tipo":"esquema","titulo":"Ciclo de remodelación ósea","mermaid":"flowchart LR\n  A[\"1 Reclutamiento de osteoclastos\"] --> B[\"2 Resorcion\"]\n  B --> C[\"3 Osteoblastos producen osteoide\"]\n  C --> D[\"4 Hueso formado\"]\n  D -->|\"5-10 por ciento al ano\"| A","pie":"En la osteoporosis la resorción supera a la formación."},{"tipo":"tabla","titulo":"Regulación hormonal","columnas":["Hormona","Efecto"],"filas":[["PTH","Inhibe osteoblastos, estimula osteoclastos y la osteólisis: **↑ resorción** y paso de calcio al plasma"],["Calcitonina","Inhibe osteoclastos y estimula osteoblastos: **↓ resorción**, ↑ síntesis de colágeno"],["Vitamina D","Aumenta la actividad de **ambos** tipos: ↑ velocidad de remodelación sin gran cambio de masa"],["Estrógenos","**Inhiben** los osteoclastos"]]},{"tipo":"alerta","texto":"Trampa: el tema lista la **calcitonina** como **estimulante** del osteoclasto en una diapositiva, pero en la tabla y en el resumen la describe como **inhibidora** de osteoclastos (y es un fármaco **antirresortivo**). Para el examen: **calcitonina ↓ resorción**."},{"tipo":"parrafo","texto":"Con la edad y la menopausia disminuyen la producción de **vitamina D** en respuesta a la PTH y la absorción de calcio: menor mineralización (**osteomalacia/osteoporosis**), fracturas y dolor óseo."}]},{"id":"osteoporosis-clinica","titulo":"Osteoporosis: clínica, diagnóstico, tratamiento y órtesis","bloques":[{"tipo":"parrafo","texto":"Signos y síntomas: **pérdida de estatura, postura encorvada, dolor de espalda, huesos frágiles**. Las fracturas son más frecuentes en **cadera, muñeca y columna**. El **pico de masa ósea es a los 30 años**; a los **50** aumenta mucho la enfermedad. **No tiene cura**, pero se puede frenar la pérdida."},{"tipo":"definicion","termino":"Densitometría ósea (DXA)","texto":"Prueba cuantitativa que mide la masa ósea por la **absorción de rayos X** del mineral óseo (en g/cm²). En España el estudio estándar incluye **columna lumbar y cadera izquierda**. Sustituyó a la biopsia (dolorosa, lenta y cara)."},{"tipo":"tabla","titulo":"Interpretación del T-score","columnas":["T-score","Diagnóstico","Riesgo de fractura"],"filas":[["> −1 DE","Normal","Normal"],["−1 a −2,5 DE","**Osteopenia**","**Doble**"],["\u003c −2,5 DE","**Osteoporosis**","**Cuádruple**"]]},{"tipo":"alerta","texto":"**T-score** compara con **adultos jóvenes (20–40) sanos del mismo sexo** (es el que diagnostica); **Z-score** compara con personas de la **misma edad y sexo**."},{"tipo":"tabla","titulo":"Tratamiento farmacológico","columnas":["Grupo","Acción","Ejemplos"],"filas":[["Antirresortivos","Inhiben osteoclastos","**Calcitonina, bifosfonatos**"],["Formadores de hueso","Actúan sobre osteoblastos","**Teriparatida**"],["Mixtos","Ambos efectos","**Ranelato de estroncio**"]]},{"tipo":"perla","texto":"No farmacológico: **calcio y vitamina D**; **ejercicio de bajo impacto, moderado y regular**, adaptado a edad, actividad habitual y patologías, sin superar **130 lpm**, para mantener el peso, controlar el dolor, **reducir caídas** y frenar la pérdida ósea. Retirar fármacos que aceleran la fragilidad."},{"tipo":"dato","valor":"\u003c 130 lpm","texto":"Límite de frecuencia cardiaca en el ejercicio para osteoporosis."},{"tipo":"figura","pagina":66,"pie":"Órtesis dorsolumbar con tirantes de hombro: contención fuerte y efecto descifosante con retropulsión de los hombros.","src":"img/ortesis-t4-tema-4-patologia-degenerativa-osteoarticular-artrosis-artrit-p66.jpg"},{"tipo":"parrafo","texto":"Órtesis: de **columna** (protección, sujeción y adaptación a anomalías); **dorsolumbares con tirantes** (efecto **descifosante**); para osteoporosis transitoria de cadera (ligera compresión abdominal, limitan el raquis lumbar y disminuyen la carga); de **muñeca** para artrosis u osteoporosis; y de **cadera o rodilla** para artrosis."}]}],"caso_clinico":{"titulo":"Dolor de manos en una mujer de 58 años","presentacion":"Mujer de 58 años, postmenopáusica, IMC 18, fumadora, en tratamiento con corticoides por asma. Refiere dolor en ambas manos que empeora al usarlas y rigidez matutina de unos 15 minutos; presenta nódulos duros en las interfalángicas distales y dolor en la base del pulgar. VSG y PCR normales, FR negativo.","preguntas":[{"pregunta":"¿Artrosis o artritis reumatoide?","respuesta":"**Artrosis de mano**: dolor mecánico, rigidez **\u003c 30 min**, **nódulos de Heberden** (IFD), dolor en la base del pulgar (**rizartrosis**) y laboratorio normal (FR −, VSG/PCR normales). La AR daría rigidez > 1 h, inflamación simétrica de pequeñas articulaciones y FR/anti-CCP +."},{"pregunta":"¿Qué riesgo óseo añadido presenta y cómo lo confirmarías?","respuesta":"Alto riesgo de **osteoporosis**: mujer postmenopáusica, **IMC \u003c 19**, **tabaco** y **glucocorticoides**. Se confirma con **DXA** (columna lumbar y cadera izquierda): osteoporosis si **T-score \u003c −2,5**."},{"pregunta":"¿Qué medidas de fisioterapia y órtesis propones?","respuesta":"Ejercicio de resistencia para la mano y **ejercicio de bajo impacto** general (\u003c 130 lpm), prevención de caídas, calcio y vitamina D según indicación médica, y una **órtesis de pulgar/muñeca** para la rizartrosis."}]},"preguntate":[{"pregunta":"Clasifica las articulaciones según su movilidad.","respuesta":"Sinartrosis (inmóviles), anfiartrosis (poco móviles) y sinoviales (muy móviles)."},{"pregunta":"Resume las fases de la patogenia de la artrosis.","respuesta":"Lesión y degradación del cartílago, esclerosis y remodelación subcondral, senescencia de condrocitos con SASP e inflamación sinovial por DAMPs que activa citocinas y MMPs."},{"pregunta":"¿Qué hallazgos tiene una articulación artrósica?","respuesta":"Pérdida de grosor y de cartílago, menor espacio articular, esclerosis subcondral con quistes y osteofitos, engrosamiento sinovial, deformidad y laxitud."},{"pregunta":"Diferencia nódulos de Heberden y de Bouchard.","respuesta":"Heberden en las interfalángicas distales; Bouchard en las interfalángicas proximales."},{"pregunta":"¿Cuándo se piden RX o laboratorio en la gonartrosis?","respuesta":"Solo ante síntomas atípicos (rigidez prolongada, dolor en reposo, eritema, hinchazón, dolor nocturno) o empeoramiento inesperado."},{"pregunta":"Compara la rigidez matutina en AR y artrosis.","respuesta":"AR: más de 1 hora; artrosis: menos de 30 minutos."},{"pregunta":"¿Qué pruebas de laboratorio apoyan la AR?","respuesta":"VSG, PCR, factor reumatoide y anticuerpos anti-CCP."},{"pregunta":"Explica el papel de PTH y calcitonina en el hueso.","respuesta":"La PTH aumenta la resorción (estimula osteoclastos, inhibe osteoblastos); la calcitonina la disminuye (inhibe osteoclastos, estimula osteoblastos)."},{"pregunta":"Interpreta un T-score de −2,0.","respuesta":"Osteopenia, con riesgo de fractura doble."},{"pregunta":"Nombra un fármaco de cada grupo para la osteoporosis.","respuesta":"Antirresortivo: bifosfonatos o calcitonina; formador: teriparatida; mixto: ranelato de estroncio."}],"glosario":[{"termino":"Osteofito","definicion":"Proliferación ósea marginal en la articulación artrósica."},{"termino":"Esclerosis subcondral","definicion":"Endurecimiento del hueso bajo el cartílago."},{"termino":"SASP","definicion":"Fenotipo secretor asociado a senescencia."},{"termino":"DAMPs","definicion":"Patrones moleculares asociados al daño que activan la inflamación."},{"termino":"MMPs","definicion":"Metaloproteinasas de matriz que degradan el cartílago."},{"termino":"Rizartrosis","definicion":"Artrosis trapeciometacarpiana."},{"termino":"Coxartrosis","definicion":"Artrosis de cadera."},{"termino":"Gonartrosis","definicion":"Artrosis de rodilla."},{"termino":"Espondiloartrosis","definicion":"Artrosis de la columna."},{"termino":"Anti-CCP","definicion":"Anticuerpos antipéptido cíclico citrulinado, marcador de AR."},{"termino":"DMARDs","definicion":"Fármacos modificadores de la enfermedad (metotrexato, biológicos)."},{"termino":"Osteoide","definicion":"Matriz ósea orgánica no mineralizada secretada por osteoblastos."},{"termino":"DXA","definicion":"Densitometría ósea por absorciometría de rayos X."},{"termino":"T-score","definicion":"Comparación de la DMO con adultos jóvenes sanos del mismo sexo."},{"termino":"Osteopenia","definicion":"Masa ósea baja con T-score entre −1 y −2,5."}],"fuentes":["Blanco FJ et al. Prevalencia de artrosis sintomática en España: estudio EPISER2016.","Rodríguez Solís J, Palomo Martínez VM, Bartolomé Blanco S, Hornillos Calvo M. Osteoartrosis. En: Manual SER de las Enfermedades Reumáticas, 4.ª ed. Panamericana; 2004. p. 689-696.","Kovalenko B, Bremjit P, Fernando N. Classifications in Brief: Tönnis Classification of Hip Osteoarthritis. Clin Orthop Relat Res. 2018;476(8):1680-1684.","Sociedad Española de Geriatría y Gerontología. Criterios del Colegio Americano de Reumatología.","Combe B (2015); Martínez MR (2021).","T4- Patología degenerativa osteoarticular (Universidad Europea)."],"qcm":[{"pregunta":"¿Qué tipo de articulación tiene poca movilidad?","opciones":["Sinovial","Anfiartrosis","Diartrosis plana","Sinartrosis"],"correcta":1,"explicacion":"Sinartrosis: sin movimiento; anfiartrosis: poco movimiento; sinoviales: mucho movimiento.","por_opcion":["❌ Muy móvil.","✅ Poco móvil.","❌ No es la clasificación del tema.","❌ Inmóvil."]},{"pregunta":"En la progresión de la artrosis, los exosomas liberados por osteoblastos subcondrales escleróticos:","opciones":["Activan genes catabólicos en los condrocitos","Inhiben la senescencia celular","Bloquean los receptores TLR","Protegen el cartílago estimulando proteoglicanos"],"correcta":0,"explicacion":"Los exosomas de osteoblastos escleróticos favorecen la degradación del cartílago al activar genes catabólicos en condrocitos.","por_opcion":["✅ Literal.","❌ No se describe.","❌ Los TLR son activados por los DAMPs.","❌ Efecto contrario."]},{"pregunta":"¿Qué factores secretan los condrocitos senescentes (SASP) según el tema?","opciones":["TGF-β e IL-6","Calcitonina y PTH","Proteoglicanos y colágeno II","IL-10 y TGF-α"],"correcta":0,"explicacion":"Los condrocitos senescentes producen SASP, liberando TGF-β e IL-6 que perpetúan la inflamación.","por_opcion":["✅ Literal.","❌ Son hormonas óseas.","❌ Son componentes del cartílago sano.","❌ No se citan."]},{"pregunta":"¿Qué rasgo clínico es propio de la artrosis?","opciones":["Fiebre y nódulos subcutáneos","Dolor que mejora con la actividad","Rigidez matutina superior a una hora","Dolor que aumenta con el uso y disminuye en reposo"],"correcta":3,"explicacion":"El dolor artrósico es mecánico: aumenta con el uso y cede en reposo; la rigidez es breve.","por_opcion":["❌ Manifestaciones extraarticulares de AR.","❌ Es al revés.","❌ Típico de AR.","✅ Literal."]},{"pregunta":"Grado radiológico con osteofitos visibles y leve estrechamiento articular:","opciones":["1","4","2","3"],"correcta":2,"explicacion":"Grado 2: osteofitos visibles y leve estrechamiento; grado 3: osteofitos grandes con estrechamiento moderado y deformidad.","por_opcion":["❌ Cambios mínimos.","❌ Gran pérdida de espacio y dolor intenso.","✅ Literal.","❌ Osteofitos grandes."]},{"pregunta":"Los nódulos de Bouchard se localizan en:","opciones":["Interfalángicas proximales","Metacarpofalángicas","Interfalángicas distales","Trapeciometacarpiana"],"correcta":0,"explicacion":"Heberden en IFD, Bouchard en IFP.","por_opcion":["✅ Literal.","❌ No se citan nódulos ahí.","❌ Nódulos de Heberden.","❌ Rizartrosis."]},{"pregunta":"El dolor de la coxartrosis se localiza fundamentalmente en:","opciones":["La ingle","La región trocantérea lateral","La región lumbar","El hueco poplíteo"],"correcta":0,"explicacion":"Se localiza sobre todo en la ingle y puede irradiarse a la cara anterior del muslo hasta la rodilla o a la nalga.","por_opcion":["✅ Literal.","❌ No es la localización principal descrita.","❌ Sugiere origen raquídeo.","❌ No se describe."]},{"pregunta":"En la clasificación de Tönnis, el grado con quistes subcondrales, esclerosis moderada y disminución moderada del espacio es:","opciones":["0","1","3","2"],"correcta":3,"explicacion":"Tönnis 2: quistes subcondrales, esclerosis moderada y disminución moderada del espacio; el 3 tiene contacto hueso con hueso y osteofitos.","por_opcion":["❌ Sin artrosis.","❌ Leve disminución y esclerosis.","❌ Artrosis avanzada.","✅ Literal."]},{"pregunta":"Para la gonartrosis, el gold standard para confirmar el diagnóstico es:","opciones":["La artroscopia","El diagnóstico clínico (síntomas + breve exploración)","El factor reumatoide","La resonancia magnética"],"correcta":1,"explicacion":"El diagnóstico clínico, basado en síntomas y un breve examen físico, es el gold standard; RX y laboratorio solo en casos atípicos.","por_opcion":["❌ No se cita.","✅ Literal.","❌ Es un marcador de AR.","❌ No es el gold standard citado."]},{"pregunta":"Paciente de 40 años con artritis simétrica de manos, rigidez matutina de 2 horas, nódulos subcutáneos y anti-CCP positivo:","opciones":["Espondiloartrosis","Artrosis generalizada","Artritis reumatoide","Osteoporosis"],"correcta":2,"explicacion":"Afectación simétrica de pequeñas articulaciones, rigidez > 1 h, nódulos reumatoides y anti-CCP + son típicos de AR.","por_opcion":["❌ Afecta a la columna.","❌ La artrosis no tiene rigidez prolongada ni anticuerpos.","✅ Cuadro típico.","❌ No causa artritis."]},{"pregunta":"Hallazgo radiológico propio de la artritis reumatoide:","opciones":["Quistes subcondrales con osteofitos","Osteopenia periarticular y erosiones","Esclerosis subcondral","Osteofitos marginales"],"correcta":1,"explicacion":"La AR muestra erosiones óseas, pérdida de espacio y osteopenia periarticular; osteofitos, esclerosis y quistes son de artrosis.","por_opcion":["❌ Artrosis.","✅ AR.","❌ Artrosis.","❌ Artrosis."]},{"pregunta":"¿Qué efecto tiene la PTH sobre el hueso?","opciones":["Alarga la vida media de los osteoblastos","Inhibe los osteoclastos y estimula los osteoblastos","Aumenta la resorción ósea estimulando los osteoclastos","Aumenta la toma de fosfato por el hueso"],"correcta":2,"explicacion":"La PTH inhibe el desarrollo de osteoblastos, cambia la actividad de los osteocitos a resorción y estimula a los osteoclastos.","por_opcion":["❌ La PTH la disminuye.","❌ Es el efecto de la calcitonina.","✅ Literal.","❌ La PTH la inhibe; la calcitonina la estimula."]},{"pregunta":"Un T-score de −2,8 DE indica:","opciones":["Osteomalacia","Osteopenia con riesgo de fractura doble","Normalidad","Osteoporosis con riesgo de fractura cuádruple"],"correcta":3,"explicacion":"Menos de −2,5 DE es osteoporosis con riesgo de fractura cuádruple.","por_opcion":["❌ La DXA no diagnostica osteomalacia por T-score.","❌ Osteopenia entre −1 y −2,5.","❌ Normal es > −1.","✅ Literal."]},{"pregunta":"¿Con quién compara la masa ósea el T-score?","opciones":["Con adultos jóvenes (20–40) sanos del mismo sexo","Con personas de la misma edad y sexo","Con la media de la población general","Con la DMO previa del propio paciente"],"correcta":0,"explicacion":"El T-score compara con adultos jóvenes sanos del mismo sexo; el Z-score con personas de la misma edad y sexo.","por_opcion":["✅ Literal.","❌ Es el Z-score.","❌ No se describe así.","❌ No es la definición."]},{"pregunta":"La teriparatida es un fármaco:","opciones":["Inhibidor de la COX-2","Antirresortivo que inhibe osteoclastos","De efecto mixto","Formador de hueso que actúa sobre los osteoblastos"],"correcta":3,"explicacion":"Formadores de hueso: teriparatida; antirresortivos: calcitonina y bifosfonatos; mixto: ranelato de estroncio.","por_opcion":["❌ Fármaco para la artrosis.","❌ Calcitonina, bifosfonatos.","❌ Ranelato de estroncio.","✅ Literal."]}],"asignatura":"Ortesis","tema":4,"fecha":"2026-11-09"}</script>

<script>
(function(){

}

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">

<main class="env">

  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}

</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},

let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
