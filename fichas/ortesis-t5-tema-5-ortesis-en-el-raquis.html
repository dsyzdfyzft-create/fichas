<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 5: Órtesis en el raquis · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 5: Órtesis en el raquis","subtitulo":"Funciones, mecanismos, tipos y complicaciones de las órtesis vertebrales: lumbosacras y sacroilíacas, collarines y órtesis cervicales y cervicotorácicas (Minerva, SOMI, Halo), corsés para deformidades y órtesis para la osteoporosis.","resumen":["Las órtesis del raquis sirven para **soporte, restricción de movilidad, corrección, estabilización, calentar tejidos y propiocepción**, y actúan sobre todo mediante el **principio de apoyo en tres puntos**; a mayor rigidez, **más protección y menos movimiento**.","Sus complicaciones (úlceras, **atrofia muscular**, restricción respiratoria, dependencia psicológica; en las lumbares además ↑ TA y FC, trastornos gastrointestinales y ↓ capacidad vital) obligan a usarlas de forma **intermitente** junto con **ejercicios abdominales y reeducación postural**.","En la región lumbosacra, la lumbalgia es **inespecífica en el 85–90%**; las **SIO** se indican en fracturas de pelvis estables y distensiones de la sínfisis y las **LSO** en lumbalgias, espondilolistesis, hernias o patología degenerativa, ambas **contraindicadas en fracturas inestables**.","En el cuello, el collarín **blando** limita poco (flexoextensión 5–15%), el **semirrígido Philadelphia** 20–25% y las órtesis con control de cabeza (**Minerva, SOMI**) ~**60%**; las **CTO** llegan a **T1–T3** y el **Halo-chaleco** controla bien **occipucio–C1** hasta T3 (fracturas de Jefferson, del ahorcado y de odontoides).","Para deformidades se usa **Milwaukee (CTLSO)** si el ápex está en **T8 o por encima** y **Boston (TLSO)** si es más bajo; en la osteoporosis solo dos órtesis tienen respaldo científico, la **PTS/DHB** (peso ≤ **1 kg** bajo las escápulas) y la **Spinomed**, mientras que la **Jewett** de tres puntos (esternón, pubis, región lumbar) se indica en fracturas por compresión **T6–L1** pero se tolera mal."],"objetivos":["Enumerar las indicaciones, funciones y mecanismos de acción de las órtesis vertebrales y relacionar su rigidez con sus efectos.","Reconocer las complicaciones de las órtesis vertebrales y cómo prevenirlas.","Usar la nomenclatura estandarizada (CO, CTO, TLSO, LSO, SIO…) y elegir la órtesis según la región y la estabilidad de la lesión.","Comparar los collarines y órtesis cervicales y cervicotorácicas por su grado de restricción e indicaciones, incluidas las fracturas del axis.","Seleccionar la órtesis adecuada en deformidades vertebrales y en la osteoporosis (PTS, Spinomed, Jewett)."],"ideas_clave":["Seis funciones: **soporte, restricción de movilidad, corrección, estabilización, calentar tejidos subyacentes y propiocepción/feedback**.","Mecanismo principal: **apoyo en tres puntos**; además ↑ propiocepción (inputs cutáneos), relajación por calor, control del edema, soporte del tronco y mejora postural.","Blanda (baja rigidez, propiocepción y calor) → semirrígida (descarga parcial, movilidad funcional) → rígida (inmoviliza, favorece la consolidación): **+ protección, − movimiento**.","Las órtesis deben usarse de forma **intermitente** y asociadas a **ejercicios abdominales y reeducación postural** para evitar atrofia y dependencia.","SIO y LSO: indicadas en fracturas **estables**, contraindicadas en fracturas **inestables**; la LSO tampoco sirve en lesiones **por encima** de la región lumbar.","Restricción cervical: blando 5–15% flexoextensión, **Philadelphia 20–25%**, **Minerva/SOMI ~60%** (unión C0–C2, inestabilidad atlantoaxoidea, fractura de C2).","**Halo**: 4 postes, controla hasta **T3**, buen control **occipucio–C1**, pobre en la región **cervical media**; fracturas de **Jefferson (C1), ahorcado y odontoides (C2)**.","Osteoporosis: solo **PTS/DHB** y **Spinomed** tienen respaldo científico; la **Jewett** (esternón–pubis–lumbar) se indica en fracturas por compresión **T6–L1** y se contraindica en fracturas inestables o problemas respiratorios severos."],"secciones":[{"id":"introduccion","titulo":"Introducción: indicaciones, funciones y mecanismo de acción","bloques":[{"tipo":"parrafo","texto":"Las órtesis del raquis se indican en un amplio abanico de procesos: **espondilólisis y espondilolistesis**, **escoliosis y alteraciones del eje vertebral**, **fracturas vertebrales**, **osteoporosis**, **reumatismos**, **lesión neurológica o enfermedad muscular** y **debilidad muscular crónica**. Según F. Vargas Negrín (2017) se agrupan en cuatro tipos: para el **dolor de origen vertebral**, para las **deformidades vertebrales**, para la **osteoporosis** y para los **traumatismos vertebrales y cuidados postoperatorios**."},{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Soporte","texto":"Aumentan el soporte del tronco."},{"etiqueta":"2","titulo":"Restricción de movilidad","texto":"Limitan el rango mediante apoyo en tres puntos."},{"etiqueta":"3","titulo":"Corrección","texto":"Aplican fuerzas correctoras (deformidades)."},{"etiqueta":"4","titulo":"Estabilización","texto":"Protegen estructuras lesionadas o inestables."},{"etiqueta":"5","titulo":"Calentar tejidos","texto":"El calor favorece la relajación muscular."},{"etiqueta":"6","titulo":"Propiocepción / feedback","texto":"Los inputs cutáneos mejoran la percepción postural."}]},{"tipo":"lista","items":["Mecanismos de acción: **restricción del rango de movilidad** mediante el **principio de apoyo en tres puntos**; **aumento de la propiocepción** por aumento de los inputs cutáneos; **relajación muscular** por aumento de la temperatura; **control del edema** de los tejidos subyacentes; **aumento del soporte del tronco**; **mejora postural**."]},{"tipo":"tabla","titulo":"Tipos de órtesis según su rigidez","columnas":["Tipo","Rigidez","Mecanismo principal","Efectos fisiológicos"],"filas":[["Blandas o flexibles","**Baja**","Compresión elástica; ↑ presión **intraabdominal**; mejora la propiocepción","Estimula la musculatura, mejora la percepción postural, **confort térmico**"],["Semirrígidas","**Media**","Soporte parcial con refuerzos plásticos o metálicos; restringe parcialmente la flexoextensión","Descarga parcial lumbar; estabiliza **sin inmovilizar**; favorece la movilidad funcional"],["Rígidas","**Alta**","Estructura sólida (termoplástico o aluminio); inmoviliza segmentos toracolumbares","Limita casi totalmente el movimiento, ↓ cargas; favorece la **consolidación ósea** o reparación tisular"]]},{"tipo":"esquema","titulo":"Relación entre rigidez, protección y movimiento","mermaid":"flowchart LR\n  A[\"Blanda: propiocepción y calor\"] -->|\"más rigidez\"| B[\"Semirrígida: descarga parcial\"]\n  B -->|\"más rigidez\"| C[\"Rígida: inmovilización\"]\n  C --> D[\"Más protección y consolidación\"]\n  C --> E[\"Menos movimiento: atrofia y rigidez\"]\n  A --> F[\"Más movilidad funcional\"]","pie":"Cuanto más rígida es la órtesis, más protege, pero más restringe el movimiento y más riesgo de complicaciones por inmovilización."},{"tipo":"definicion","termino":"Principio de apoyo en tres puntos","texto":"Aplicación de **dos fuerzas en un sentido y una tercera, intermedia, en sentido opuesto**, que crea un momento que limita o corrige el movimiento del segmento comprendido entre ellas. Es la base de la mayoría de órtesis vertebrales (p. ej., la Jewett)."}]},{"id":"complicaciones-nomenclatura","titulo":"Complicaciones y nomenclatura de las órtesis vertebrales","bloques":[{"tipo":"tabla","titulo":"Complicaciones de las órtesis vertebrales","columnas":["Comunes a todas","Específicas de las órtesis lumbares"],"filas":[["Lesiones en la piel (**úlceras**)","**Aumento de la tensión arterial y de la frecuencia cardiaca**"],["**Inmovilización excesiva** y **atrofia muscular**","**Trastornos gastrointestinales**"],["**Restricción respiratoria**","**Disminución de la capacidad vital**"],["Dolor y molestias musculoesqueléticas","Además, todas las comunes"],["Complicaciones **psicológicas** (dependencia)","—"]]},{"tipo":"alerta","texto":"Regla de oro del temario: las órtesis **solo deberían usarse de forma intermitente** y **asociadas a un programa de ejercicios abdominales y reeducación postural**. Una pregunta que proponga su uso continuo y aislado para la lumbalgia crónica es falsa."},{"tipo":"perla","texto":"Al pautar una faja lumbar, el fisioterapeuta debe programar su retirada progresiva y el trabajo de la musculatura abdominal y extensora: así se evita la atrofia y la dependencia psicológica, y se aprovecha el efecto propioceptivo sin sus inconvenientes."},{"tipo":"tabla","titulo":"Nomenclatura estandarizada según la región incluida","columnas":["Sigla","Significado","Región"],"filas":[["CO","Cervical Orthosis","Cervical"],["CTO","Cervico-Thoracic Orthosis","Cabeza/cuello hasta T1–T3"],["TO","Thoracic Orthosis","Torácica"],["LO","Lumbar Orthosis","Lumbar"],["CTLSO","Cervical Thoracic Lumbosacral Orthosis","Cuello a pelvis (p. ej., Milwaukee)"],["TLSO","Thoracic Lumbosacral Orthosis","Tórax a pelvis (p. ej., Boston, Spinomed)"],["LSO","Lumbosacral Orthosis","Lumbosacra"],["SIO","Sacro Iliac Orthosis","Sacroilíaca / pelvis"]]},{"tipo":"parrafo","texto":"Cada uno de estos dispositivos puede subdividirse en **diseños flexibles y rígidos** según el material empleado. La sigla indica las regiones que **abarca** la órtesis, de modo que permite deducir qué segmentos controla: una LSO no controla la columna torácica y una CTLSO incluye un componente cervical."}]},{"id":"lumbosacra","titulo":"Órtesis para el dolor de origen vertebral: región lumbosacra","bloques":[{"tipo":"definicion","termino":"Lumbalgia","texto":"Dolor lumbar (\"low back pain\"): **síntoma multifactorial, no una enfermedad única**, de origen mecánico, degenerativo, inflamatorio, neoplásico, infeccioso o referido visceral; es uno de los procesos invalidantes más habituales (Hartvigsen et al., 2018; Hoy et al., 2012)."},{"tipo":"dato","valor":"85–90% / 10%","texto":"En el 85–90% de los casos no se identifica una causa específica (lumbalgia inespecífica); en torno al 10% se asocia a lesiones demostrables (traumáticas, inflamatorias, hernias discales, espondilosis…)."},{"tipo":"parrafo","texto":"El estrés, la ansiedad, la depresión y la insatisfacción laboral influyen en la sintomatología y en el **umbral de dolor**, por lo que el temario subraya la importancia del **modelo biopsicosocial**: la órtesis es solo una parte del abordaje."},{"tipo":"tabla","titulo":"SIO frente a LSO","columnas":["Órtesis","Indicaciones","Contraindicaciones"],"filas":[["SIO (sacroilíaca), p. ej. semirrígida","**Fracturas de pelvis estables**; distensiones de la **sínfisis púbica**; control del movimiento y del dolor (Morrisette et al., 2020)","**Fracturas inestables**; afectaciones de la **región lumbar**"],["LSO (lumbosacra), rígida o semirrígida","**Fracturas estables**; **lumbalgias**; **espondilolistesis**; **hernias o inestabilidad lumbar**; patologías **degenerativas**; control del movimiento y del dolor (Cholewicki y McGill, 1996)","**Fracturas inestables**; afectaciones **superiores** a la región lumbar"]]},{"tipo":"alerta","texto":"La SIO está **contraindicada** si la afectación es **lumbar** (no la cubre), y la LSO lo está si la lesión es **superior** a la región lumbar. Ninguna de las dos se usa en **fracturas inestables**."},{"tipo":"perla","texto":"En la lumbalgia inespecífica, la LSO flexible aporta sobre todo **propiocepción, calor y aumento de la presión intraabdominal**: úsala como apoyo temporal en fases dolorosas, dentro de un programa activo y con enfoque biopsicosocial."}]},{"id":"cervicales","titulo":"Órtesis cervicales: collarines, Minerva y SOMI","bloques":[{"tipo":"parrafo","texto":"La OMS (2023) reconoce la **cervicalgia** como una de las principales causas de discapacidad musculoesquelética junto con el dolor lumbar. Sus causas más frecuentes son la **discopatía degenerativa** con o sin hernia y la **artrosis facetaria cervical**; otras menos frecuentes son el **latigazo cervical** postraumático y la cervicalgia por **actividad laboral repetitiva**. Al igual que en la lumbalgia, los factores psicológicos modulan el dolor (modelo biopsicosocial)."},{"tipo":"definicion","termino":"Órtesis cervical (CO)","texto":"Dispositivo que **estabiliza, inmoviliza o limita** los movimientos del cuello en flexión, extensión, rotación y lateroflexión, para **reducir el dolor, proteger estructuras lesionadas y favorecer la cicatrización** tras traumatismo o cirugía (Hsu et al., 2008). Funciones: limitar el movimiento, disminuir la carga muscular y articular, dar soporte y alineación, y prevenir lesiones secundarias o desplazamientos."},{"tipo":"tabla","titulo":"Tipos de collarín e indicación terapéutica","columnas":["Tipo (ejemplo)","Inmovilización","Comodidad","Indicaciones principales"],"filas":[["Blando (espuma)","**Muy baja**: flexoextensión 5–15%, inclinación 5–10%, rotación 10–17%","Muy cómodo","Dolor leve, esguinces menores, soporte ligero"],["Semirrígido (Philadelphia)","**Moderada**: flexoextensión 20–25%","Moderadamente cómodo","Esguinces moderados, patologías crónicas, postoperatorio leve"],["Rígido (Minerva)","**Alta** (casi total)","Menos cómodo","Fracturas, luxaciones, postoperatorio mayor"]]},{"tipo":"figura","pagina":19,"pie":"Collarín blando, semirrígido (Philadelphia) y rígido (Minerva) con sus porcentajes de restricción: observa cómo aumentan el apoyo mentoniano y occipital al subir la rigidez.","src":"img/ortesis-t5-tema-5-ortesis-en-el-raquis-p19.jpg"},{"tipo":"dato","valor":"5–15% · 20–25% · ~60%","texto":"Restricción aproximada de la flexoextensión: collarín blando 5–15%, Philadelphia 20–25%, órtesis con control de cabeza (Minerva, SOMI) en torno al 60% en todos los planos."},{"tipo":"parrafo","texto":"Las **CO con componente de control de la cabeza** añaden un sistema de soporte craneal unido al collar mediante barras o apoyos **occipitales y mentonianos**. Limitan flexión, extensión, inclinación y rotación en un **60%** aproximadamente y se usan cuando se necesita mayor restricción de la cabeza y la columna cervical **alta**: lesiones o inestabilidades de la unión **occipitocervical (C0–C2)**, como la **inestabilidad atlantoaxoidea** o las **fracturas de C2** (Hsu et al., 2008; AAOS, 2020). Ejemplos: **Minerva** y **SOMI**."},{"tipo":"tabla","titulo":"Componentes de la SOMI (Sterno-Occipito-Mandibular Immobilizer)","columnas":["Componente","Función"],"filas":[["Apoyo **mentoniano**","Limita la **flexión** del cuello"],["Apoyo **occipital**","Restringe la **extensión**"],["Collar o base cervical","Estabiliza la columna cervical **media e inferior**"],["Soportes laterales o barras metálicas/termoplásticas","Unen los apoyos craneales al collar"]]},{"tipo":"figura","pagina":23,"pie":"Órtesis SOMI: localiza el apoyo mentoniano (limita la flexión), el occipital (limita la extensión) y la placa esternal unida por barras.","src":"img/ortesis-t5-tema-5-ortesis-en-el-raquis-p23.jpg"},{"tipo":"alerta","texto":"En la SOMI es fácil invertirlo: el apoyo **mentoniano limita la flexión** y el **occipital limita la extensión**. Y el collar blando apenas restringe: no sirve para inmovilizar una fractura."}]},{"id":"cto-halo","titulo":"Órtesis cervicotorácicas, Halo y fracturas del axis","bloques":[{"tipo":"definicion","termino":"Órtesis cervicotorácica (CTO)","texto":"Extensión de la órtesis cervical que abarca **desde la cabeza hasta T1–T3**; restringe más que las CO, sobre todo en la **columna cervical baja y la unión cervicotorácica** (Neumann, 2022). Controla la flexión, extensión y rotación, aporta estabilidad cervicotorácica y protege tras fracturas, luxaciones o cirugía. Su aplicación más frecuente es **inmovilizar fracturas vertebrales tratables de forma conservadora**. Ejemplos: **Minerva, SOMI, Philadelphia con extensión torácica y Halo-vest**."},{"tipo":"tabla","titulo":"Características del Halo-chaleco","columnas":["Aspecto","Detalle"],"filas":[["Estructura","Anillo craneal + **4 postes** de control unidos a un chaleco"],["Extensión","Controla **hasta T3**"],["Mejor control","**Occipucio–C1**"],["Punto débil","**Pobre control en la región cervical media**"],["Indicaciones","Fracturas de **Jefferson (C1)**, del **ahorcado/Hangman (C2)** y de **odontoides (C2)**"]]},{"tipo":"figura","pagina":26,"pie":"Halo-chaleco en adulto y niño: anillo fijado al cráneo, cuatro postes verticales y chaleco torácico que transmite la carga al tronco.","src":"img/ortesis-t5-tema-5-ortesis-en-el-raquis-p26.jpg"},{"tipo":"parrafo","texto":"Las **fracturas del axis (C2)** son **frecuentes y las más graves** de la columna superior, causadas por **impactos violentos**, y suponen el **20%** de las fracturas vertebrales. Se distinguen las fracturas del **istmo** (del ahorcado y en lágrima) y las de la **odontoides**."},{"tipo":"tabla","titulo":"Fracturas del axis (C2)","columnas":["Fractura","Mecanismo","Rasgos clave"],"filas":[["Del ahorcado (Hangman)","**Hiperextensión + distracción** del cuello; frecuente en **accidentes de tráfico**","Lesiones neurológicas **poco frecuentes** (canal medular **ensanchado** a nivel de C2)"],["En lágrima (tear drop)","Traumatismo por **hiperextensión**","Poco frecuente pero **grave**: **avulsión** del borde anterior del cuerpo; asociada a **lesiones neurológicas**"],["De la odontoides","**Cizallamiento** anterior/posterior + **compresión axial**","**Muy frecuente**; riesgo de **muerte** importante; posible desplazamiento y complicaciones neurológicas graves"]]},{"tipo":"figura","pagina":28,"pie":"Esquema de las fracturas del axis: del ahorcado y en lágrima (istmo) y de la odontoides, con su mecanismo y su gravedad neurológica.","src":"img/ortesis-t5-tema-5-ortesis-en-el-raquis-p28.jpg"},{"tipo":"dato","valor":"20%","texto":"Proporción de las fracturas vertebrales que corresponden a fracturas del axis (C2)."},{"tipo":"alerta","texto":"Paradoja típica: la fractura del **ahorcado** rara vez da lesión neurológica porque el canal medular está **ensanchado** en C2; la **en lágrima** es poco frecuente pero **sí** se asocia a lesión neurológica."},{"tipo":"perla","texto":"El caso del triatleta **Tim Don** (2017) ilustra el Halo: tras un atropello sufrió una **fractura tipo II de odontoides** (potencialmente inestable) y fue tratado con Halo, una lesión típica en la que el buen control occipucio–C1 del dispositivo es decisivo."},{"tipo":"esquema","titulo":"Elegir la órtesis cervical según la lesión","mermaid":"flowchart TD\n  A[\"Lesión cervical\"] --> B{\"Estable y leve\"}\n  B -->|\"Dolor leve, esguince menor\"| C[\"Collarín blando\"]\n  B -->|\"Esguince moderado, postoperatorio leve\"| D[\"Philadelphia semirrígido\"]\n  A --> E{\"Fractura o inestabilidad\"}\n  E -->|\"Unión C0-C2\"| F[\"Minerva o SOMI, 60 por ciento\"]\n  E -->|\"Cervical baja o cervicotorácica\"| G[\"CTO hasta T1-T3\"]\n  E -->|\"Jefferson, ahorcado, odontoides\"| H[\"Halo-chaleco\"]","pie":"La restricción necesaria crece con la inestabilidad y con la altura de la lesión en la unión craneocervical."}]},{"id":"deformidades","titulo":"Órtesis para las deformidades vertebrales: escoliosis y Scheuermann","bloques":[{"tipo":"definicion","termino":"Corsé de Milwaukee (CTLSO)","texto":"Aparato **rígido desde la pelvis hasta el cuello** (incluye **anillo cervical**), con barras metálicas verticales y almohadillas de corrección; aplica fuerzas correctoras en los planos **sagital, coronal y de rotación** mediante puntos de presión estratégicos (Kaelin, 2020; Stephens Richards, 2009)."},{"tipo":"tabla","titulo":"Milwaukee frente a Boston","columnas":["Criterio","Milwaukee (CTLSO)","Boston (TLSO)"],"filas":[["Altura del ápex","**T8 o por encima**, o curvas que incluyen regiones altas donde la TLSO no actúa","Ápex **más bajo (> T8)**; cifosis y escoliosis menos altas"],["Paciente","**Inmaduro**, curvas ≈ **20–40º** (hasta ≈ 45º) en progresión","Curvas **moderadas**"],["Estética y tolerancia","Visible (anillo cervical)","**Menos visible y mejor tolerado**"],["Objetivo","**Evitar la progresión** hasta niveles quirúrgicos, no \"curar\"","Alternativa aceptable en curvas moderadas (Yamaguchi, 2014)"]]},{"tipo":"alerta","texto":"El objetivo del Milwaukee **no es la curación completa** sino **evitar que la curva progrese** a niveles quirúrgicos. Y su indicación se define por un **ápex alto (T8 o superior)**; recuerda que el tema 2 sitúa el límite de las TLSO de perfil bajo en **D7**."},{"tipo":"dato","valor":"≈ 20–40º (hasta 45º)","texto":"Rango de curvas en progresión de pacientes inmaduros en el que está indicado el corsé de Milwaukee."},{"tipo":"perla","texto":"Elegir entre CTLSO y TLSO depende de dónde está el ápex: si la TLSO no puede actuar sobre una curva alta, se pierde eficacia; si la curva es baja, la TLSO consigue lo mismo con mejor aceptación estética, lo que mejora la adherencia del adolescente."}]},{"id":"osteoporosis","titulo":"Órtesis para la osteoporosis: PTS, Spinomed y Jewett","bloques":[{"tipo":"parrafo","texto":"Lo primero es distinguir si el paciente presenta un **dolor agudo por una fractura vertebral osteoporótica nueva** (se trata como una órtesis postraumática) o un **dolor crónico** (diagnóstico diferencial). Existen **pocas recomendaciones ortésicas** para la osteoporosis: **órtesis dinámicas de entrenamiento postural**, **Spinomed** y **órtesis de hiperextensión de tres puntos**."},{"tipo":"definicion","termino":"Sistema de entrenamiento postural (PTS)","texto":"También llamado **\"cifoórtesis con peso suspendido\"** o **Dynamic Hyperextension Brace (DHB)**: una de las **dos** órtesis vertebrales para la osteoporosis con **respaldo científico**; suspende un **peso de máximo 1 kg inmediatamente por debajo de las escápulas** (Shariatzadeh et al., 2017)."},{"tipo":"definicion","termino":"Spinomed (TLSO, control del plano sagital)","texto":"La **segunda** órtesis con respaldo científico: órtesis **dinámica** (no totalmente rígida) que combina **soporte pasivo + estímulo activo** de la musculatura espinal mediante **biofeedback postural**: sus bandas ejercen una ligera tensión cuando el usuario se inclina hacia delante y provocan la activación automática de los **extensores del tronco**."},{"tipo":"lista","items":["Efectos de Spinomed: descarga activa de la columna en el plano **sagital** (menos flexión anterior), fortalece la musculatura **dorsal y abdominal**, mejora la postura, **reduce el ángulo de cifosis** y alivia el dolor (p. ej., fracturas vertebrales osteoporóticas).","Evidencia citada: Pfeifer et al. (2011) – adherencia excelente (**> 92%**), ↑ fuerza del tronco, menos dolor y mejor calidad de vida; Hosseinabadi et al. (2020) – **3 meses** de Spinomed mejoran postura, sentido de posición, resistencia muscular y equilibrio en ancianos hipercifóticos."]},{"tipo":"definicion","termino":"Órtesis de hiperextensión en tres puntos (tipo Jewett)","texto":"Órtesis de hiperextensión toracolumbar que **limita la flexión** y mantiene la columna extendida o neutra con tres fuerzas: **anterior superior en el esternón** (placa esternal), **anterior inferior en el pubis** (placa pélvica) y **posterior en la región lumbar** (placa dorsal), que crean un **momento de extensión** (Bono y Garfin, 2004). Inconveniente: **mala tolerancia** en uso prolongado por presión en el esternón o el pubis."},{"tipo":"tabla","titulo":"Órtesis de hiperextensión en tres puntos (Bono y Garfin, 2004)","columnas":["Indicaciones","Contraindicaciones"],"filas":[["Fracturas **por compresión vertebral**, sobre todo **T6–L1**","Fracturas **inestables o con compromiso neurológico** (cirugía o dispositivos más rígidos)"],["**Osteoporosis** con colapso vertebral leve","Lesiones en la **zona de apoyo esternal o púbica**"],["**Postoperatorio** de columna toracolumbar","**Obesidad extrema** o **úlceras por presión** en las zonas de contacto"],["**Cifosis postraumática** o degenerativa leve; **espondilitis anquilosante** temprana (algunos casos)","**Problemas respiratorios severos** (limita la expansión torácica)"]]},{"tipo":"figura","pagina":38,"pie":"Órtesis tipo Jewett con sus indicaciones y contraindicaciones: localiza la placa esternal, la placa púbica y el apoyo lumbar posterior que generan el momento de extensión.","src":"img/ortesis-t5-tema-5-ortesis-en-el-raquis-p38.jpg"},{"tipo":"esquema","titulo":"Elección ortésica en el paciente osteoporótico","mermaid":"flowchart TD\n  A[\"Paciente con osteoporosis y dolor dorsal\"] --> B{\"Fractura vertebral nueva\"}\n  B -->|\"Sí, dolor agudo\"| C{\"Estable, por compresión T6-L1\"}\n  C -->|\"Sí\"| D[\"Hiperextensión 3 puntos: Jewett\"]\n  C -->|\"Inestable o neurológica\"| E[\"Cirugía o órtesis más rígida\"]\n  B -->|\"No, dolor crónico o hipercifosis\"| F[\"Órtesis dinámicas con evidencia\"]\n  F --> G[\"PTS o DHB: peso hasta 1 kg\"]\n  F --> H[\"Spinomed: biofeedback sagital\"]","pie":"El primer paso es el diagnóstico diferencial entre fractura aguda nueva y dolor crónico."},{"tipo":"alerta","texto":"Solo **dos** órtesis para la osteoporosis tienen respaldo científico según el temario: **PTS/DHB** y **Spinomed**. La Jewett no está entre ellas y además se tolera mal y está contraindicada en problemas respiratorios severos."}]}],"caso_clinico":{"titulo":"Carmen, 72 años, hipercifosis osteoporótica","presentacion":"Carmen, 72 años, con osteoporosis posmenopáusica, consulta por dolor dorsal crónico y aumento progresivo de la cifosis. Hace dos años tuvo una fractura vertebral por compresión en T12, ya consolidada; no hay fracturas nuevas en la radiografía actual. Tiene EPOC moderada y refiere inestabilidad al caminar. Su traumatólogo duda entre una órtesis tipo Jewett y una Spinomed.","preguntas":[{"pregunta":"¿Cuál es el primer paso para elegir su órtesis?","respuesta":"Diferenciar si el dolor es agudo por una fractura osteoporótica nueva (manejo postraumático) o crónico. En Carmen no hay fractura nueva: se trata de dolor crónico con hipercifosis, por lo que se buscan órtesis dinámicas posturales."},{"pregunta":"¿Por qué Spinomed es preferible a la Jewett en este caso?","respuesta":"Spinomed es una de las dos órtesis con respaldo científico en osteoporosis: con biofeedback activa los extensores, reduce la cifosis y el dolor, y en ancianos hipercifóticos mejora equilibrio y sentido de posición en 3 meses, con adherencia superior al 92%. La Jewett se tolera mal en uso prolongado y está contraindicada en problemas respiratorios severos al limitar la expansión torácica."},{"pregunta":"¿Qué complementos y precauciones deben acompañar la órtesis?","respuesta":"Uso intermitente asociado a ejercicios de fortalecimiento de extensores y abdominales, reeducación postural y trabajo de equilibrio, para evitar atrofia y dependencia. Hay que vigilar la piel y la tolerancia respiratoria; una alternativa con evidencia sería la PTS/DHB con un peso máximo de 1 kg bajo las escápulas."}]},"preguntate":[{"pregunta":"¿Cuáles son las seis funciones de una órtesis vertebral?","respuesta":"Soporte, restricción de movilidad, corrección, estabilización, calentar los tejidos subyacentes y propiocepción/feedback."},{"pregunta":"Explica cómo cambian los efectos de una órtesis según su rigidez.","respuesta":"La blanda aumenta la presión intraabdominal, la propiocepción y el calor; la semirrígida descarga parcialmente y estabiliza sin inmovilizar; la rígida inmoviliza y favorece la consolidación. Más rigidez = más protección y menos movimiento."},{"pregunta":"¿Qué complicaciones son propias de las órtesis lumbares?","respuesta":"Además de úlceras, atrofia, restricción respiratoria, dolor y problemas psicológicos, aumentan la tensión arterial y la frecuencia cardiaca, producen trastornos gastrointestinales y disminuyen la capacidad vital."},{"pregunta":"Compara las indicaciones y contraindicaciones de SIO y LSO.","respuesta":"SIO: fracturas de pelvis estables, distensión de la sínfisis, contraindicada en fracturas inestables y afectación lumbar. LSO: fracturas estables, lumbalgia, espondilolistesis, hernias, inestabilidad o degeneración, contraindicada en fracturas inestables y lesiones por encima de la región lumbar."},{"pregunta":"¿Cuánto restringen el collarín blando y el Philadelphia?","respuesta":"El blando limita la flexoextensión un 5–15%, la inclinación un 5–10% y la rotación un 10–17%; el Philadelphia limita la flexoextensión un 20–25%."},{"pregunta":"¿Cuándo se usa una CO con control de la cabeza y cuánto restringe?","respuesta":"Cuando se requiere más restricción de la cabeza y la columna cervical alta, en lesiones de la unión C0–C2 (inestabilidad atlantoaxoidea, fractura de C2); limita los movimientos en torno al 60%."},{"pregunta":"Describe las ventajas y la limitación del Halo-chaleco.","respuesta":"Tiene 4 postes, controla hasta T3 y ofrece buen control occipucio–C1 (Jefferson, ahorcado, odontoides), pero su control de la región cervical media es pobre."},{"pregunta":"Diferencia la fractura del ahorcado de la fractura en lágrima.","respuesta":"Ambas afectan al istmo de C2. La del ahorcado (hiperextensión + distracción, tráfico) rara vez da lesión neurológica porque el canal está ensanchado; la en lágrima (hiperextensión con avulsión del borde anterior) es poco frecuente pero grave y se asocia a lesión neurológica."},{"pregunta":"¿Cómo funciona Spinomed?","respuesta":"Es una TLSO dinámica de control sagital: sus bandas se tensan cuando el paciente se flexiona hacia delante y activan de forma refleja los extensores, combinando soporte pasivo y estímulo activo para reducir la cifosis y el dolor."},{"pregunta":"¿Dónde aplica sus fuerzas la órtesis tipo Jewett y cuándo está contraindicada?","respuesta":"En el esternón y el pubis (anteriores) y en la región lumbar (posterior), creando un momento de extensión; contraindicada en fracturas inestables o con compromiso neurológico, lesiones en las zonas de apoyo, obesidad extrema o úlceras, y problemas respiratorios severos."}],"glosario":[{"termino":"Apoyo en tres puntos","definicion":"Principio biomecánico en el que tres fuerzas opuestas generan un momento que limita o corrige el movimiento."},{"termino":"CO","definicion":"Cervical Orthosis: órtesis cervical (collarines)."},{"termino":"CTO","definicion":"Cervico-Thoracic Orthosis: de la cabeza hasta T1–T3 (Minerva, SOMI, Halo)."},{"termino":"CTLSO","definicion":"Órtesis cérvico-toraco-lumbo-sacra, como el corsé de Milwaukee."},{"termino":"TLSO","definicion":"Órtesis toraco-lumbo-sacra, como el corsé de Boston o la Spinomed."},{"termino":"LSO","definicion":"Órtesis lumbosacra, indicada en lumbalgias, espondilolistesis y fracturas estables."},{"termino":"SIO","definicion":"Órtesis sacroilíaca para fracturas de pelvis estables y distensión de la sínfisis."},{"termino":"SOMI","definicion":"Sterno-Occipito-Mandibular Immobilizer: órtesis con apoyos mentoniano, occipital y esternal."},{"termino":"Halo-chaleco","definicion":"Anillo craneal con 4 postes unidos a un chaleco; control occipucio–C1 hasta T3."},{"termino":"Fractura de Jefferson","definicion":"Fractura del atlas (C1), indicación de Halo."},{"termino":"Fractura del ahorcado (Hangman)","definicion":"Fractura del istmo de C2 por hiperextensión y distracción."},{"termino":"PTS / DHB","definicion":"Sistema de entrenamiento postural o cifoórtesis con peso suspendido (≤ 1 kg)."},{"termino":"Jewett","definicion":"Órtesis de hiperextensión toracolumbar en tres puntos (esternón, pubis, lumbar)."}],"fuentes":["F. Vargas Negrín (2017).","Hartvigsen, J., et al. (2018). What low back pain is and why we need to pay attention.","Hoy, D., et al. (2012). The global burden of low back pain: Estimates from the Global Burden of Disease 2010 study.","Morrisette, D. C., et al. (2020). Sacroiliac joint dysfunction: Diagnosis and management. JOSPT, 50(1), 21–30.","Cholewicki, J., & McGill, S. M. (1996). Mechanical stability of the in vivo lumbar spine. Clinical Biomechanics, 11(1), 1–15.","World Health Organization (2023). Musculoskeletal conditions; Cohen, S. P. (2015); Neck pain: Revision 2017 clinical practice guidelines (APTA).","Hsu et al. (2008); Neumann (2022); American Academy of Orthopaedic Surgeons (2020). Orthoses and spinal supports. OKU: Spine 5, 135–152.","Kaelin, A. J. (2020). Adolescent idiopathic scoliosis: indications for bracing and conservative treatments. Ann Transl Med.","Stephens Richards, B. (2009). Bracing for Scheuermann's kyphosis; Yamaguchi, K. T. (2014). Successful brace treatment of Scheuermann's kyphosis in skeletally mature patients.","Shariatzadeh, H., Modaghegh, B. S., & Mirzaei, A. (2017). The effect of Dynamic Hyperextension Brace on osteoporosis and hyperkyphosis reduction in postmenopausal osteoporotic women. Arch Bone Jt Surg, 5(3), 181–185.","Pfeifer, M., et al. (2011); Hosseinabadi et al. (2020). Effect of a Spinomed orthosis in elderly people with hyperkyphotic posture: a randomized controlled trial.","Bono, C. M., & Garfin, S. R. (2004). Spine orthoses. JAAOS, 12(6), 407–416."],"qcm":[{"pregunta":"¿Qué efecto fisiológico corresponde específicamente a una órtesis lumbar blanda o flexible?","opciones":["Inmovilización casi total que favorece la consolidación ósea","Aumento de la presión intraabdominal y de la propiocepción con confort térmico","Corrección tridimensional de la curva mediante almohadillas de presión","Descarga parcial lumbar restringiendo parcialmente la flexoextensión"],"correcta":1,"explicacion":"Las órtesis blandas, de baja rigidez, actúan por compresión elástica: aumentan la presión intraabdominal, mejoran la propiocepción y la percepción postural y aportan confort térmico.","por_opcion":["❌ Corresponde a las rígidas.","✅ Efecto de las órtesis blandas.","❌ Es propio de los corsés correctores de deformidades.","❌ Corresponde a las semirrígidas."]},{"pregunta":"¿Qué complicación atribuye el temario específicamente a las órtesis lumbares y no a las vertebrales en general?","opciones":["Atrofia muscular por inmovilización excesiva","Aumento de la tensión arterial y de la frecuencia cardiaca","Complicaciones psicológicas de dependencia","Lesiones cutáneas con úlceras por presión"],"correcta":1,"explicacion":"Las complicaciones comunes son úlceras, inmovilización excesiva y atrofia, restricción respiratoria, dolor y problemas psicológicos; las lumbares añaden aumento de TA y FC, trastornos gastrointestinales y disminución de la capacidad vital.","por_opcion":["❌ Común a todas.","✅ Propia de las órtesis lumbares.","❌ Común a todas.","❌ Común a todas."]},{"pregunta":"Un paciente con una fractura de pelvis estable y afectación lumbar asociada. ¿Qué dice el temario sobre la SIO?","opciones":["Está indicada porque la fractura de pelvis es estable","Está indicada siempre que sea una SIO semirrígida","Está contraindicada solo si existe distensión de la sínfisis","Está contraindicada por la afectación de la región lumbar"],"correcta":3,"explicacion":"La SIO está indicada en fracturas de pelvis estables y distensiones de la sínfisis, pero contraindicada en fracturas inestables y en afectaciones de la región lumbar.","por_opcion":["❌ La estabilidad no basta si hay afectación lumbar.","❌ El tipo de rigidez no cambia la contraindicación.","❌ La distensión de la sínfisis es una indicación.","✅ La afectación lumbar la contraindica."]},{"pregunta":"¿Cuál de las siguientes NO es una indicación de LSO según el temario?","opciones":["Fractura estable de T8","Lumbalgia de origen degenerativo","Espondilolistesis lumbar","Hernia o inestabilidad lumbar"],"correcta":0,"explicacion":"La LSO está indicada en fracturas estables, lumbalgias, espondilolistesis, hernias o inestabilidad lumbar y patologías degenerativas, pero contraindicada en afectaciones superiores a la región lumbar, como una lesión de T8.","por_opcion":["✅ T8 está por encima de la región que cubre la LSO.","❌ Es indicación.","❌ Es indicación.","❌ Es indicación."]},{"pregunta":"¿En qué porcentaje de casos la lumbalgia es inespecífica según el temario?","opciones":["10–15%","85–90%","95–99%","50–60%"],"correcta":1,"explicacion":"En el 85–90% de los casos no se identifica una causa específica; en torno al 10% se asocia a lesiones demostrables.","por_opcion":["❌ Corresponde aproximadamente a las lumbalgias específicas.","✅ Cifra del temario.","❌ Sobrestima.","❌ Infraestima."]},{"pregunta":"¿Qué restricción de la flexoextensión proporciona un collarín semirrígido tipo Philadelphia?","opciones":["20–25%","Alrededor del 60%","Casi total","5–15%"],"correcta":0,"explicacion":"El collarín blando limita la flexoextensión un 5–15%, el Philadelphia un 20–25% y las órtesis con control de cabeza en torno al 60%.","por_opcion":["✅ Philadelphia.","❌ Minerva/SOMI.","❌ Corresponde a dispositivos rígidos como el Halo.","❌ Collarín blando."]},{"pregunta":"Paciente con inestabilidad atlantoaxoidea. ¿Qué tipo de órtesis recomienda el temario?","opciones":["CO con componente de control de la cabeza tipo Minerva o SOMI","Collarín blando de espuma durante el día","Collarín semirrígido Philadelphia sin extensión torácica","LSO rígida con extensión dorsal alta"],"correcta":0,"explicacion":"Las CO con control de la cabeza (apoyos occipitales y mentonianos) limitan los movimientos en torno al 60% y se usan en lesiones de la unión occipitocervical C0–C2, como la inestabilidad atlantoaxoidea o la fractura de C2.","por_opcion":["✅ Indicación del temario.","❌ Restricción insuficiente.","❌ Restricción insuficiente para C0–C2.","❌ No controla la región cervical."]},{"pregunta":"En la órtesis SOMI, ¿qué componente limita la flexión del cuello?","opciones":["Las barras laterales","El apoyo occipital","La base cervical","El apoyo mentoniano"],"correcta":3,"explicacion":"El apoyo mentoniano limita la flexión, el occipital restringe la extensión, la base cervical estabiliza la columna cervical media e inferior y las barras unen los apoyos al collar.","por_opcion":["❌ Unen los apoyos craneales al collar.","❌ Limita la extensión.","❌ Estabiliza la columna cervical media e inferior.","✅ Mentón → flexión."]},{"pregunta":"¿Hasta qué nivel llega una órtesis cervicotorácica (CTO) y cuál es su aplicación más frecuente?","opciones":["Hasta C7; tratar la cervicalgia inespecífica crónica","Hasta L1; corregir la escoliosis torácica alta","Hasta T8; estabilizar las fracturas de pelvis","Hasta T1–T3; inmovilizar fracturas tratables de forma conservadora"],"correcta":3,"explicacion":"La CTO abarca desde la cabeza hasta T1–T3 y restringe más que la CO, sobre todo en la unión cervicotorácica; su aplicación más frecuente es inmovilizar fracturas vertebrales tratables de forma conservadora.","por_opcion":["❌ Nivel e indicación incorrectos.","❌ Corresponde a otros corsés.","❌ No se usa para la pelvis.","✅ Definición del temario."]},{"pregunta":"¿Qué limitación tiene el Halo-chaleco según el temario?","opciones":["No está indicado en fracturas de odontoides","Pobre control en la unión occipucio–C1","Pobre control en la región cervical media","No controla por debajo de C7"],"correcta":2,"explicacion":"El Halo tiene 4 postes, controla hasta T3 y ofrece buen control occipucio–C1, pero su control de la región cervical media es pobre; está indicado en fracturas de Jefferson, del ahorcado y de odontoides.","por_opcion":["❌ Es una de sus indicaciones.","❌ Es justamente donde controla bien.","✅ Limitación descrita.","❌ Controla hasta T3."]},{"pregunta":"¿Por qué la fractura del ahorcado (Hangman) se asocia poco a lesión neurológica?","opciones":["Porque nunca se desplaza el fragmento del istmo","Porque se produce por flexión y no por hiperextensión","Porque el canal medular está ensanchado a nivel de C2","Porque afecta solo a la apófisis espinosa del axis"],"correcta":2,"explicacion":"La fractura del ahorcado (hiperextensión + distracción, frecuente en accidentes de tráfico) da pocas lesiones neurológicas porque el canal medular está ensanchado a nivel de C2.","por_opcion":["❌ No es la razón citada.","❌ Se produce por hiperextensión y distracción.","✅ Explicación del temario.","❌ Afecta al istmo de C2."]},{"pregunta":"¿Qué fractura del axis se describe como muy frecuente, por cizallamiento más compresión axial y con riesgo importante de muerte?","opciones":["Fractura de la odontoides","Fractura en lágrima","Fractura de Jefferson","Fractura del ahorcado"],"correcta":0,"explicacion":"La fractura de la odontoides es muy frecuente, se produce por cizallamiento anterior/posterior con compresión axial, puede desplazarse y tiene un riesgo de muerte importante.","por_opcion":["✅ Odontoides.","❌ Poco frecuente, por hiperextensión con avulsión.","❌ Es una fractura de C1, no del axis.","❌ Hiperextensión + distracción, pocas lesiones neurológicas."]},{"pregunta":"Según el temario, ¿cuándo está indicado el corsé de Milwaukee en lugar de una TLSO?","opciones":["Cuando el ápice de la curva está en T8 o por encima","Cuando la curva supera los 60º y es rígida","Cuando el ápice de la curva está por debajo de L2","Cuando el paciente es esqueléticamente maduro"],"correcta":0,"explicacion":"El Milwaukee (CTLSO) se indica cuando el ápice está en T8 o por encima o la curva incluye regiones altas donde la TLSO no actúa, en pacientes inmaduros con curvas de ≈ 20–40º en progresión.","por_opcion":["✅ Criterio del temario.","❌ Rango fuera de la indicación ortésica.","❌ Las curvas bajas son terreno de la TLSO.","❌ Se indica en pacientes inmaduros."]},{"pregunta":"¿Qué caracteriza al sistema de entrenamiento postural (PTS) en la osteoporosis?","opciones":["Una estructura rígida termoplástica desde la pelvis hasta T3","Tres placas en esternón, pubis y región lumbar","Un peso de máximo 1 kg suspendido justo por debajo de las escápulas","Bandas elásticas que se tensan al flexionar el tronco hacia delante"],"correcta":2,"explicacion":"La PTS, cifoórtesis con peso suspendido o DHB, suspende un peso de máximo 1 kg inmediatamente por debajo de las escápulas; es una de las dos órtesis con respaldo científico en la osteoporosis.","por_opcion":["❌ No corresponde a la PTS.","❌ Describe la Jewett.","✅ Definición de la PTS.","❌ Describe la Spinomed."]},{"pregunta":"¿Cuál es una contraindicación de la órtesis de hiperextensión en tres puntos tipo Jewett?","opciones":["Fractura por compresión estable en T10","Espondilitis anquilosante en fase temprana","Postoperatorio de columna toracolumbar","Problemas respiratorios severos"],"correcta":3,"explicacion":"La Jewett está contraindicada en fracturas inestables o con compromiso neurológico, lesiones de las zonas de apoyo, obesidad extrema o úlceras, y problemas respiratorios severos porque limita la expansión torácica.","por_opcion":["❌ Indicación (fracturas por compresión T6–L1).","❌ Indicación en algunos casos.","❌ Indicación.","✅ Contraindicación."]}],"asignatura":"Ortesis","tema":5,"fecha":"2026-11-10"}</script>

(function(){

document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',

  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
