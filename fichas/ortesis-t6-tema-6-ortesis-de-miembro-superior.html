<!DOCTYPE html>
<html lang="es">
<head>

<title>Tema 6: Órtesis de miembro superior · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>

<body>

<script id="datos" type="application/json">{"titulo":"Tema 6: Órtesis de miembro superior","subtitulo":"Lesiones más frecuentes del miembro superior, cuándo y para qué prescribir una órtesis, complicaciones, órtesis estáticas, dinámicas y semidinámicas, nomenclatura (HO, WO, WHO, EO, SO, SEWHO…) y órtesis de dedos, mano, muñeca, codo, hombro y clavícula.","resumen":["El miembro superior se simplifica en **hombro** (la articulación **más móvil e inestable**, con patología del **manguito rotador**, tendones y bursa subacromial), **codo** (patología **tendinosa o por compresión nerviosa**) y **muñeca** (eje clave para órtesis y prótesis).","Las órtesis de MMSS se indican para **inmovilizar** durante la consolidación, **aliviar el dolor**, **proteger y favorecer la cicatrización**, **prevenir o tratar deformidades**, **limitar la movilidad excesiva** o **aumentarla**, y **tratar anomalías neuromusculares**; en traumatología su uso es **continuo pero de corta duración**.","Se clasifican por función en **estáticas** (rígidas, impiden todo movimiento), **dinámicas** (permiten, guían, limitan o resisten movimientos con fuerzas **internas o externas**) y **semidinámicas** (no permiten movimiento pero **posicionan para optimizar la función**, **sin fuerzas externas**, p. ej. **férula de fijación del pulgar**).","Por regiones se nombran **HO, WO, EO, SO, WHO, EWHO y SEWHO**; en la mano destacan la **férula de Stack** (IFD en extensión en el **dedo en martillo**), la de **cuello de cisne** (bloquea la IFP y deja flexionar la IFD), la **boutonnière** (corrige la flexión de IFP con **apoyo en tres puntos**) y la **Kleinert** dinámica; en muñeca, la **cock-up**.","En codo existen órtesis de inmovilización, **articuladas con bisagras**, elásticas, **cinchas epicondíleas**, dinámicas y correctoras; en hombro, el **cabestrillo** (lesiones leves), la **órtesis de abducción SEWHO** (**30–90°**: postoperatorio del **manguito**, **plexo braquial**, **capsulitis adhesiva**) y la órtesis **en 8** para la **clavícula** o semirrígida para prevenir la **subluxación del hemipléjico**."],"objetivos":["Reconocer las lesiones más frecuentes del miembro superior (fracturas, esguinces, luxaciones, síndromes compresivos, artrosis, De Quervain, manguito rotador) y su relación con la prescripción ortésica.","Explicar cuándo y con qué objetivo se prescribe una órtesis de MMSS y sus posibles complicaciones.","Diferenciar órtesis estáticas, dinámicas y semidinámicas y aplicar la nomenclatura HO, WO, EO, SO, WHO, EWHO, SEWHO.","Seleccionar la órtesis adecuada de dedos, mano, muñeca, codo y hombro según la patología."],"ideas_clave":["Hombro = **más móvil y más inestable**; codo = estabilidad + **pronosupinación**, patología **tendinosa o compresiva**.","**Esguince**: grado 1 estiramiento, grado 2 **desgarro parcial**, grado 3 **rotura total**.","**De Quervain** = tenosinovitis del **APL + EPB** en el lado **radial** de la muñeca; se explora con **Finkelstein**.","**Estática** = inmoviliza; **dinámica** = permite/guía/limita/resiste con fuerzas internas o externas; **semidinámica** = posiciona sin fuerzas externas (**férula del pulgar**).","Una órtesis estática debe inmovilizar **solo la articulación deseada**, seguir los contornos y **no presionar prominencias óseas ni trayectos vasculonerviosos**.","**Stack/mallet** → IFD en extensión; **cuello de cisne** = hiperextensión IFP + hiperflexión IFD; **boutonnière** = hiperflexión IFP, corrección por **tres puntos**.","**Kleinert** y **Saebo Stretch** = dinámicas: muñeca en dorsiflexión funcional, **flexión activa** de dedos y **extensión pasiva**; sustituyen la falta de extensión.","**SEWHO de abducción**: **30–90°**; postoperatorio del manguito, plexo braquial, capsulitis adhesiva. **Órtesis en 8 (Gilchrist)**: clavícula."],"secciones":[{"id":"introduccion-indicaciones","titulo":"Introducción e indicaciones generales","bloques":[{"tipo":"parrafo","texto":"El miembro superior puede simplificarse en **tres grandes articulaciones**: hombro, codo y muñeca. El **hombro** es la articulación **con mayor movilidad** del cuerpo pero **una de las más inestables**; sus patologías más frecuentes afectan al **manguito rotador**, a las **estructuras tendinosas** y a la **bursa subacromial**. El **codo** combina **estabilidad articular** con movimientos finos de **pronosupinación**, y sus patologías más comunes son de origen **tendinoso** o por **compresión nerviosa**. La **muñeca** conecta la mano con el antebrazo y permite una amplia gama de movimientos; su relevancia funcional la convierte en un **punto clave para órtesis y prótesis**, sobre todo tras lesiones o procesos degenerativos que afectan a su estabilidad o movilidad."},{"tipo":"tarjetas","items":[{"etiqueta":"Hombro","titulo":"Movilidad máxima","texto":"Más móvil y una de las más inestables. Patología: **manguito rotador**, tendones, **bursa subacromial**."},{"etiqueta":"Codo","titulo":"Estabilidad + pronosupinación","texto":"Patología sobre todo **tendinosa** o por **compresión nerviosa**."},{"etiqueta":"Muñeca","titulo":"Eje mano-antebrazo","texto":"Articulación compleja; **punto clave** para el uso de órtesis y prótesis."}]},{"tipo":"tabla","titulo":"Indicaciones generales de las órtesis de MMSS","columnas":["Objetivo","Ejemplo de aplicación"],"filas":[["Disminuir el dolor","Patología reumática, artrosis, tendinopatías"],["Proteger tejido y promover la cicatrización","Fracturas, roturas tendinosas, quemaduras, postoperatorio"],["Prevenir o tratar deformidades","Cuello de cisne, boutonnière, pacientes neurológicos"],["Prevenir una movilidad articular excesiva","Inestabilidad, esguinces"],["Aumentar la movilidad de la articulación","Contracturas (férulas correctoras o dinámicas)"],["Tratar anomalías de la función neuromuscular","Debilidad de extensores, hemiparesia, lesiones nerviosas"]]},{"tipo":"parrafo","texto":"Las órtesis de MMSS sirven para **inmovilizar la extremidad** cuando es necesario o para **aliviar los síntomas** durante determinadas acciones dolorosas. Se usan en **patologías traumáticas** (esguince, fractura, tendinopatía, quemadura), en **patologías reumáticas** (inflamación articular o desgaste del cartílago que provocan dolor), **mientras se espera una cirugía** (para inmovilizar o estabilizar) y como **apoyo a la rehabilitación tras una operación**."},{"tipo":"parrafo","texto":"En **traumatología** el objetivo es, sobre todo, **inmovilizar una articulación o un miembro durante el tiempo de consolidación o curación**, y después, eventualmente, **recuperar la función**. El uso de la órtesis es **generalmente continuo pero de corta duración**. Lo que el paciente pide sobre todo es **recuperar el uso de la mano, los dedos o la muñeca lo más rápido posible**."},{"tipo":"dato","valor":"Continuo · corta duración","texto":"Patrón de uso típico de la órtesis en traumatología del miembro superior."}]},{"id":"lesiones-comunes","titulo":"Lesiones más comunes del miembro superior","bloques":[{"tipo":"parrafo","texto":"Las lesiones comunes se clasifican en **traumáticas**, **por sobreuso** o **degenerativas**. Las **fracturas** son de las más frecuentes, especialmente la del **radio distal** o la del **húmero**, habitualmente por **caída sobre el miembro extendido**; producen dolor intenso y a veces deformidad visible. También son relevantes las fracturas de los **huesos del carpo**, sobre todo la del **escafoides**, por impacto o torsión excesiva."},{"tipo":"tabla","titulo":"Grados del esguince según la gravedad","columnas":["Grado","Lesión del ligamento"],"filas":[["Grado 1","Ligamento **ligeramente estirado**"],["Grado 2","Ligamento **parcialmente desgarrado**"],["Grado 3","**Rotura total**"]]},{"tipo":"tabla","titulo":"Otras lesiones frecuentes","columnas":["Lesión","Mecanismo / características"],"filas":[["**Esguince**","Estiramiento o desgarro de ligamentos, generalmente por caída; dolor, inflamación y aumento de los síntomas con el movimiento"],["**Luxación**","Golpes o torsiones violentas que desplazan los huesos de su eje; dolor, inflamación y **deformidad importante**. **Tienden a repetirse** en el mismo punto porque ligamentos o tendones quedan dañados"],["**Síndromes compresivos**","**N. mediano en el túnel carpiano**, **N. cubital en el túnel epitroclear**…: entumecimiento, parestesias y debilidad de la mano"],["**Artrosis (osteoartritis)**","Degenerativa: el desgaste del cartílago produce **deformación permanente** y pérdida de movilidad y función"],["**Tenosinovitis de De Quervain**","Inflamación de la vaina del **APL y EPB** en el lado **radial**; dolor al mover el pulgar, al agarrar o en desviación radial"],["**Tendinopatía del manguito rotador**","Lesión **degenerativa o inflamatoria** por **sobrecarga, microtraumatismos repetidos o envejecimiento**"]]},{"tipo":"figura","pagina":7,"pie":"Tenosinovitis de De Quervain: vaina tendinosa inflamada de APL y EPB en el borde radial de la muñeca, y prueba de Finkelstein (pulgar en la palma + desviación cubital que reproduce el dolor radial).","src":"img/ortesis-t6-tema-6-ortesis-de-miembro-superior-p7.jpg"},{"tipo":"definicion","termino":"Tenosinovitis de De Quervain","texto":"Inflamación de la **vaina sinovial** que rodea los tendones del **abductor largo del pulgar (APL)** y del **extensor corto del pulgar (EPB)**, en el lado **radial** de la muñeca. Se explora con la **prueba de Finkelstein**."},{"tipo":"figura","pagina":8,"pie":"Tendinopatía del manguito rotador y arco doloroso del síndrome subacromial: el dolor aparece entre 60° y 120° de abducción, cuando los tendones pasan bajo el acromion.","src":"img/ortesis-t6-tema-6-ortesis-de-miembro-superior-p8.jpg"},{"tipo":"dato","valor":"60–120°","texto":"Arco doloroso del *impingement* subacromial: los tendones del manguito se deslizan por debajo del acromion."},{"tipo":"alerta","texto":"De Quervain afecta al **abductor largo** y al **extensor corto** del pulgar (APL + EPB), **no al extensor largo** (EPL). Es la tenosinovitis del **primer compartimento dorsal, lado radial** (complemento)."}]},{"id":"complicaciones-tipos-funcionales","titulo":"Complicaciones y tipos funcionales de órtesis","bloques":[{"tipo":"tabla","titulo":"Complicaciones de las órtesis de MMSS","columnas":["Complicación","Origen probable"],"filas":[["Irritación de la piel y alteraciones dermatológicas","Roce, humedad, presión mantenida"],["Compresión nerviosa y trastornos neurovasculares","Presión sobre trayectos nerviosos o vasculares"],["Problemas circulatorios","Cinchas demasiado apretadas, edema"],["Atrofia muscular y pérdida de movilidad","Inmovilización prolongada"],["Problemas musculoesqueléticos secundarios","Compensaciones en articulaciones vecinas"],["Dependencia excesiva de la órtesis","Uso más allá de lo necesario"],["Efecto psicológico","Vivencia de discapacidad o imagen corporal"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Estática","titulo":"Posicional","texto":"Dispositivo **rígido** que **impide el movimiento** manteniendo una postura. Previene o corrige deformidades; soporte en **fracturas, tendinitis, partes blandas y lesiones nerviosas**. Permite el **descanso** de la zona."},{"etiqueta":"Dinámica","titulo":"Funcional","texto":"**Permite o facilita** el movimiento; ayuda a músculos debilitados. **Permite, guía, limita o resiste** movimientos y previene otros. Fuerzas **internas** (acción muscular) o **externas** (bandas elásticas, resortes, varillas tensoras, dispositivos eléctricos)."},{"etiqueta":"Semidinámica","titulo":"De posicionamiento funcional","texto":"**No permite el movimiento** pero **posiciona** las partes inmovilizadas para **optimizar la función**; **sin fuerzas externas**. Ej.: **férula de fijación del pulgar** (bloquea la abducción-oposición y deja libres los demás movimientos y la articulación distal)."}]},{"tipo":"esquema","titulo":"Clasificación funcional de las órtesis de MMSS","mermaid":"flowchart TD\n  A[\"Ortesis de MMSS\"] --> E[\"Estatica: impide el movimiento\"]\n  A --> D[\"Dinamica: permite o facilita\"]\n  A --> S[\"Semidinamica: posiciona sin fuerzas externas\"]\n  E --> E1[\"Fracturas, tendinitis, lesion nerviosa\"]\n  D --> D1[\"Fuerzas internas: musculo\"]\n  D --> D2[\"Fuerzas externas: elasticos, resortes\"]\n  S --> S1[\"Ferula de fijacion del pulgar\"]","pie":"El criterio es si la órtesis impide, permite o solo posiciona el movimiento, y si usa fuerzas externas."},{"tipo":"alerta","texto":"La **semidinámica** no es una dinámica «suave»: **no permite movimiento** en la articulación inmovilizada y **no usa fuerzas externas**; su función es **posicionar para optimizar la función** del resto de la mano (ej. férula del pulgar)."},{"tipo":"perla","texto":"Una órtesis **estática** bien diseñada debe **inmovilizar únicamente la articulación** cuyo movimiento se quiere limitar, seguir los **contornos anatómicos** y **no presionar prominencias óseas ni zonas de paso vasculonervioso**: revisa siempre la piel y la sensibilidad en las primeras horas de uso para prevenir compresiones."}]},{"id":"nomenclatura-mano","titulo":"Nomenclatura y órtesis de dedos y mano (HO)","bloques":[{"tipo":"tabla","titulo":"Nomenclatura estandarizada de las órtesis de MMSS","columnas":["Sigla","Región incluida"],"filas":[["**HO**","Hand Orthosis: mano (y dedos)"],["**WO**","Wrist Orthosis: muñeca (y antebrazo)"],["**EO**","Elbow Orthosis: codo"],["**SO**","Shoulder Orthosis: hombro"],["**WHO**","Wrist Hand Orthosis: muñeca y mano"],["**EWHO**","Elbow Wrist Hand Orthosis: codo, muñeca y mano"],["**SEWHO**","Shoulder Elbow Wrist Hand Orthosis: hombro, codo, muñeca y mano"]]},{"tipo":"parrafo","texto":"Cada dispositivo puede subdividirse en **diseños flexibles y rígidos** según el material. Las **órtesis de dedos** inmovilizan, alinean, protegen o ayudan al movimiento de uno o más dedos y se usan en **lesiones tendinosas, fracturas, deformidades** y rehabilitación. La más sencilla es la **férula estática de dedo** (p. ej. fracturas)."},{"tipo":"tabla","titulo":"Órtesis de dedos y mano","columnas":["Órtesis","Tipo","Acción","Indicación"],"filas":[["**Stack (mallet)**","Estática","Mantiene la **IFD en extensión**","**Dedo en martillo** (rotura del tendón extensor distal)"],["**Férula dorsal o volar**","Estática","Mantiene o corrige la posición articular; dorsal si apoya detrás del dedo, volar si por la palma","Contracturas, rehabilitación, **procesos reumáticos**"],["**Cuello de cisne**","Estática","**Bloquea la IFP** (impide su hiperextensión) y **permite la flexión de la IFD**","Deformidad en cuello de cisne"],["**Boutonnière**","Estática","Corrige la **hiperflexión de la IFP** con **apoyo en tres puntos**","Deformidad en ojal"],["**Bennet / semirrígidas**","Posicionamiento funcional","Mano y dedos en postura funcional","**Rizartrosis**, artrosis leve, **De Quervain**, neurológicos"],["**Kleinert**, **Saebo Stretch**","Dinámicas (movilización asistida)","Muñeca en **dorsiflexión funcional**; **flexión activa de dedos (MCF) con extensión pasiva**","**Ausencia o debilidad de la extensión**"]]},{"tipo":"definicion","termino":"Deformidad en cuello de cisne","texto":"**Hiperextensión de la IF proximal** con **hiperflexión de la IF distal**. Su órtesis permite el movimiento de una articulación en una dirección y bloquea la otra."},{"tipo":"figura","pagina":19,"pie":"Órtesis para cuello de cisne (anillo en ocho): bloquea la hiperextensión de la IFP y deja flexionar la IFD; abajo, esquema de la deformidad (IFP en hiperextensión, IFD en flexión).","src":"img/ortesis-t6-tema-6-ortesis-de-miembro-superior-p19.jpg"},{"tipo":"esquema","titulo":"De la deformidad digital a la órtesis","mermaid":"flowchart LR\n  A[\"IFD caida: rotura del extensor distal\"] --> A1[\"Ferula Stack: IFD en extension\"]\n  B[\"IFP en hiperextension + IFD en flexion\"] --> B1[\"Ortesis cuello de cisne: bloquea IFP\"]\n  C[\"IFP en hiperflexion\"] --> C1[\"Ortesis boutonniere: tres puntos\"]\n  D[\"Debilidad de la extension\"] --> D1[\"Kleinert o Saebo: dinamicas\"]","pie":"Relaciona cada deformidad o déficit con su órtesis."},{"tipo":"figura","pagina":22,"pie":"Órtesis dinámicas de movilización asistida: Kleinert (tracción elástica desde un soporte dorsal) y Saebo Stretch; mantienen la muñeca en dorsiflexión y sustituyen la extensión ausente o débil.","src":"img/ortesis-t6-tema-6-ortesis-de-miembro-superior-p22.jpg"},{"tipo":"alerta","texto":"No inviertas las deformidades: **cuello de cisne** = IFP en **hiperextensión** (se bloquea la IFP); **boutonnière** = IFP en **hiperflexión** (se corrige con **tres puntos**). La **Stack** actúa sobre la **IFD**, no sobre la IFP."},{"tipo":"perla","texto":"En la órtesis de Kleinert, el paciente **flexiona activamente** los dedos y la goma los **devuelve pasivamente a extensión**: así se moviliza el tendón sin pedir una extensión activa que el paciente no tiene o que no debe hacer."}]},{"id":"muneca","titulo":"Órtesis de muñeca (WO) y de muñeca-mano (WHO)","bloques":[{"tipo":"parrafo","texto":"La **WO** mantiene la posición funcional o corrige desviaciones del complejo **muñeca-antebrazo**, aportando soporte, estabilidad o asistencia. Se usa para la **inmovilización regional** en **esguinces de muñeca**, **tendinopatías**, **neuropatías**, **fracturas de muñeca o antebrazo**, **postoperatorio de fusiones de muñeca** y **artritis**. Tipos: **cock-up**, **órtesis de extensión de muñeca** y **órtesis para neuropatía cubital**."},{"tipo":"parrafo","texto":"La **WHO** estabiliza, alinea o inmoviliza **antebrazo, muñeca y mano**, favoreciendo la recuperación funcional, la **prevención de deformidades** y el **alivio del dolor**. Tipos específicos: **funcional de reposo**, **estática de mano**, **de descarga de peso**, **de reposo de mano** y **para quemados**."},{"tipo":"tabla","titulo":"Indicaciones de la WHO","columnas":["Grupo","Ejemplos"],"filas":[["Traumáticas","**Fracturas estables de radio distal**, **luxaciones carpianas**"],["Neurológicas","**Hemiparesia**, lesión del **nervio radial o mediano**"],["Inflamatorias / degenerativas","**Artritis reumatoide**, artrosis"],["Recuperación","Postquirúrgica o postinmovilización"]]},{"tipo":"perla","texto":"En un paciente con **hemiparesia** y mano espástica, una **WHO de reposo** nocturna mantiene muñeca y dedos en posición funcional y ayuda a **prevenir deformidades**; durante el día se puede combinar con una órtesis dinámica si hay déficit de extensión."},{"tipo":"alerta","texto":"La **WO** incluye muñeca y antebrazo pero **deja libres los dedos** (cock-up); cuando la órtesis **abarca también la mano**, es una **WHO** (reposo, quemados, descarga)."},{"tipo":"dato","valor":"5 tipos de WHO","texto":"Funcional de reposo, estática de mano, de descarga de peso, de reposo de mano y para quemados."}]},{"id":"codo-hombro","titulo":"Órtesis de codo (EO) y de hombro (SO)","bloques":[{"tipo":"parrafo","texto":"Las **órtesis de codo** inmovilizan, estabilizan, protegen o asisten el movimiento del codo. Tipos: **de inmovilización** (férulas o cabestrillos rígidos), **funcional o articulada con bisagras** (dinámica), **elásticas o de compresión**, **cinchas o brazaletes epicondíleos**, **dinámicas** (asistencia o resistencia elástica) y **correctoras o de posicionamiento prolongado**. En el **deporte** se usan sobre todo las **elásticas de compresión** y las **cinchas epicondíleas**."},{"tipo":"parrafo","texto":"La **órtesis de hombro** sostiene, inmoviliza, estabiliza o asiste la articulación **glenohumeral y escapulotorácica** tras una lesión, cirugía o en enfermedades neuromusculares. **Funciones**: inmovilizar tras **luxación, fractura o cirugía**; estabilizar en **inestabilidad glenohumeral** o tras reparación tendinosa; **soportar el peso** del miembro en lesiones musculares o nerviosas; **corregir posturas**; **asistir el movimiento** con debilidad. **Indicaciones**: luxación/subluxación, **fracturas de húmero proximal o clavícula**, lesiones del **manguito rotador**, postoperatorio, **parálisis del nervio axilar o del plexo braquial**."},{"tipo":"tabla","titulo":"Órtesis de hombro y clavícula","columnas":["Órtesis","Características","Indicaciones"],"filas":[["**Cabestrillo** (simple, Vietnam)","Tela o material blando; sostiene antebrazo y codo y **descarga parcialmente** el hombro; cómodo y ligero","Lesiones **leves**, esguinces, contusiones, postoperatorio"],["**Órtesis de abducción SEWHO** (cojín, *airplane splint*)","Mantiene el brazo en **abducción de 30° a 90°** con un cojín o estructura que lo separa del tronco","Postoperatorio de **reparación del manguito rotador**, **plexo braquial**, **capsulitis adhesiva**"],["**Semirrígidas de hombro y clavícula**","Sostienen la cintura escapular en posición **neutra y horizontal**","**Prevenir la subluxación** en **hemiplejía/tetraplejía**; tendinopatías del manguito"],["**Órtesis en 8 (Gilchrist)**","Tipo «en ocho» para la clavícula","**Fracturas de clavícula**, luxaciones/subluxaciones **esternoclaviculares**"]]},{"tipo":"figura","pagina":32,"pie":"Órtesis de abducción: cojín de ABD y SEWHO tipo airplane splint, que separan el brazo del tronco entre 30° y 90° tras la reparación del manguito rotador.","src":"img/ortesis-t6-tema-6-ortesis-de-miembro-superior-p32.jpg"},{"tipo":"dato","valor":"30°–90°","texto":"Rango de abducción en que la órtesis SEWHO de abducción mantiene el brazo."},{"tipo":"esquema","titulo":"Elección de la órtesis de hombro","mermaid":"flowchart TD\n  A[\"Patologia de hombro\"] --> B{\"Situacion\"}\n  B -->|\"lesion leve, contusion\"| C[\"Cabestrillo\"]\n  B -->|\"sutura del manguito, plexo, capsulitis\"| D[\"SEWHO en abduccion 30 a 90\"]\n  B -->|\"hemiplejia: riesgo de subluxacion\"| E[\"Ortesis semirrigida de hombro\"]\n  B -->|\"fractura de clavicula\"| F[\"Ortesis en 8 o Gilchrist\"]","pie":"Cada situación clínica tiene su órtesis de hombro preferente según el temario."},{"tipo":"alerta","texto":"Tras una **reparación del manguito rotador** no basta un cabestrillo simple: el temario indica la **órtesis de abducción (SEWHO)**, que mantiene el brazo **separado del tronco** (30–90°) para no tensar la sutura. Un detalle formal: esta órtesis abarca hombro, codo, muñeca y mano, de ahí la sigla **SEWHO** aunque se clasifique entre las SO."},{"tipo":"perla","texto":"En el **hemipléjico** con hombro flácido, una órtesis semirrígida que sostenga la cintura escapular en posición neutra ayuda a **prevenir la subluxación inferior** y el hombro doloroso; vigila la piel y la sensibilidad, alterada en estos pacientes."}]}],"caso_clinico":{"titulo":"Paciente con artritis reumatoide y deformidades digitales","presentacion":"Mujer de 58 años con artritis reumatoide de larga evolución. Presenta en el índice derecho hiperextensión de la IFP con flexión de la IFD; en el anular izquierdo, flexión mantenida de la IFP. Refiere además dolor en el borde radial de la muñeca al agarrar la taza, que se reproduce al cerrar el puño sobre el pulgar y desviar la muñeca en sentido cubital. Hace poco se cayó y un dedo quedó con la falange distal caída, sin poder extenderla.","preguntas":[{"pregunta":"Identifica las dos deformidades digitales y la órtesis para cada una.","respuesta":"Índice: **cuello de cisne** (hiperextensión IFP + hiperflexión IFD) → órtesis que **bloquea la IFP** y permite la flexión de la IFD. Anular: **boutonnière** (hiperflexión IFP) → órtesis estática con **apoyo en tres puntos**."},{"pregunta":"¿Qué patología sugiere el dolor radial y qué órtesis puede usarse?","respuesta":"**Tenosinovitis de De Quervain** (APL + EPB), con **Finkelstein positivo**. Órtesis **semirrígida de posicionamiento funcional para De Quervain**, que inmoviliza el pulgar y la muñeca radial."},{"pregunta":"¿Qué ocurre en el dedo tras la caída y cómo se trata ortésicamente? ¿Qué complicaciones vigilarás?","respuesta":"**Dedo en martillo** por rotura del tendón extensor distal → **férula de Stack** con la **IFD en extensión**. Vigilar **irritación cutánea**, **compresión neurovascular**, problemas circulatorios, rigidez/atrofia por inmovilización y **dependencia excesiva** de la órtesis."}]},"preguntate":[{"pregunta":"¿Qué patologías predominan en hombro y en codo según el temario?","respuesta":"Hombro: manguito rotador, estructuras tendinosas y bursa subacromial. Codo: patología tendinosa o por compresión nerviosa."},{"pregunta":"¿Cómo se gradúan los esguinces?","respuesta":"Grado 1: ligamento ligeramente estirado; grado 2: desgarro parcial; grado 3: rotura total."},{"pregunta":"¿Qué tendones afecta la tenosinovitis de De Quervain y cómo se explora?","respuesta":"Abductor largo y extensor corto del pulgar, en el lado radial de la muñeca; con la prueba de Finkelstein."},{"pregunta":"Diferencia una órtesis estática, una dinámica y una semidinámica.","respuesta":"Estática: rígida, impide el movimiento. Dinámica: permite, guía, limita o resiste con fuerzas internas o externas. Semidinámica: no permite movimiento pero posiciona para optimizar la función, sin fuerzas externas."},{"pregunta":"¿Qué requisitos de diseño debe cumplir una órtesis estática?","respuesta":"Inmovilizar solo la articulación deseada, seguir los contornos anatómicos y no presionar prominencias óseas ni trayectos vasculonerviosos."},{"pregunta":"Enumera al menos cinco complicaciones de las órtesis de MMSS.","respuesta":"Irritación cutánea, compresión nerviosa/neurovascular, problemas circulatorios, atrofia y pérdida de movilidad, problemas musculoesqueléticos secundarios, dependencia excesiva y efecto psicológico."},{"pregunta":"¿Qué hace la férula de Stack y en qué lesión se usa?","respuesta":"Mantiene la IFD en extensión; se usa en el dedo en martillo por rotura del tendón extensor distal."},{"pregunta":"¿Cómo funciona la órtesis de Kleinert?","respuesta":"Mantiene la muñeca en dorsiflexión funcional y permite la flexión activa de los dedos con extensión pasiva, sustituyendo la extensión ausente o débil."},{"pregunta":"¿Qué diferencia una WO de una WHO? Pon ejemplos.","respuesta":"La WO abarca muñeca-antebrazo (cock-up, neuropatía cubital); la WHO incluye también la mano (reposo de mano, quemados, descarga)."},{"pregunta":"¿Cuándo se indica la órtesis de abducción SEWHO y en qué rango?","respuesta":"Postoperatorio de reparación del manguito rotador, lesiones del plexo braquial y capsulitis adhesiva; mantiene la abducción entre 30° y 90°."}],"glosario":[{"termino":"Órtesis estática","definicion":"Dispositivo rígido que impide el movimiento y mantiene una postura."},{"termino":"Órtesis dinámica","definicion":"Órtesis que permite, guía, limita o resiste movimientos con fuerzas internas o externas."},{"termino":"Órtesis semidinámica","definicion":"Posiciona sin permitir movimiento ni usar fuerzas externas, para optimizar la función."},{"termino":"SEWHO","definicion":"Shoulder Elbow Wrist Hand Orthosis: abarca hombro, codo, muñeca y mano."},{"termino":"Férula de Stack","definicion":"Férula estática que mantiene la IFD en extensión (dedo en martillo)."},{"termino":"Cuello de cisne","definicion":"Deformidad con hiperextensión de la IFP e hiperflexión de la IFD."},{"termino":"Boutonnière","definicion":"Deformidad en ojal con hiperflexión de la IFP; se corrige con apoyo en tres puntos."},{"termino":"Órtesis de Kleinert","definicion":"Órtesis dinámica con flexión activa y extensión pasiva de los dedos."},{"termino":"Cock-up","definicion":"Órtesis de muñeca que la mantiene en extensión dejando libres los dedos."},{"termino":"Prueba de Finkelstein","definicion":"Maniobra que reproduce el dolor radial en la tenosinovitis de De Quervain."},{"termino":"Airplane splint","definicion":"Órtesis SEWHO que mantiene el hombro en abducción de 30–90°."},{"termino":"Órtesis de Gilchrist / en 8","definicion":"Órtesis de clavícula para fracturas y lesiones esternoclaviculares."}],"fuentes":["Tema 6. Órtesis en miembro superior. Ortesis y Prótesis, Universidad Europea de Valencia, 2026-2027."],"qcm":[{"pregunta":"¿Qué rasgo define a una órtesis semidinámica según el temario?","opciones":["Impide todo movimiento para el descanso de la zona","Permite el movimiento mediante bandas elásticas o resortes","Resiste movimientos específicos con fuerza muscular interna","Posiciona sin permitir movimiento y sin fuerzas externas"],"correcta":3,"explicacion":"La semidinámica no permite el movimiento, pero posiciona las partes inmovilizadas para optimizar la función, sin fuerzas externas (p. ej. férula de fijación del pulgar).","por_opcion":["❌ Describe una órtesis estática.","❌ Describe una dinámica con fuerzas externas.","❌ Describe una dinámica con fuerzas internas.","✅ Posiciona sin movimiento ni fuerzas externas."]},{"pregunta":"La férula de fijación del pulgar, que bloquea la abducción-oposición y deja libres los demás movimientos, es un ejemplo de órtesis:","opciones":["Semidinámica","Estática posicional","Dinámica de movilización asistida","Correctora de posicionamiento prolongado"],"correcta":0,"explicacion":"El temario la pone como ejemplo de órtesis semidinámica.","por_opcion":["✅ Es el ejemplo de semidinámica del temario.","❌ La estática impide todo movimiento de la zona.","❌ No usa fuerzas para movilizar.","❌ No es el ejemplo dado para ese grupo."]},{"pregunta":"¿Qué tendones están implicados en la tenosinovitis de De Quervain?","opciones":["Extensor largo y extensor corto del pulgar","Abductor largo y extensor largo del pulgar","Abductor largo y extensor corto del pulgar","Flexor largo y abductor corto del pulgar"],"correcta":2,"explicacion":"Es la inflamación de la vaina sinovial del abductor largo (APL) y del extensor corto (EPB) del pulgar, en el lado radial.","por_opcion":["❌ El extensor largo no forma parte del cuadro.","❌ El extensor largo no forma parte del cuadro.","✅ APL + EPB.","❌ No son tendones del primer compartimento dorsal."]},{"pregunta":"Un esguince con desgarro parcial del ligamento corresponde al grado:","opciones":["3","2","1","4"],"correcta":1,"explicacion":"Grado 1: estiramiento leve; grado 2: desgarro parcial; grado 3: rotura total.","por_opcion":["❌ Grado 3: rotura total.","✅ Grado 2: desgarro parcial.","❌ Grado 1: ligamento ligeramente estirado.","❌ No existe grado 4 en esta clasificación."]},{"pregunta":"Según el temario, ¿por qué las luxaciones tienden a repetirse en el mismo punto?","opciones":["Por la atrofia muscular secundaria a la órtesis","Porque ligamentos o tendones pueden quedar dañados","Porque la inmovilización suele ser insuficiente en duración","Por la pérdida de cartílago articular asociada"],"correcta":1,"explicacion":"Las luxaciones se repiten con frecuencia porque los ligamentos o tendones pueden quedar dañados tras el desplazamiento.","por_opcion":["❌ La atrofia es una complicación de la órtesis, no la causa de la recidiva.","✅ Es la explicación del temario.","❌ No es la causa señalada.","❌ El desgaste del cartílago corresponde a la artrosis."]},{"pregunta":"¿Qué requisito NO corresponde al diseño correcto de una órtesis estática?","opciones":["Seguir los contornos anatómicos de la zona","Evitar presiones sobre prominencias óseas","No comprimir zonas de paso vasculonervioso","Inmovilizar las articulaciones vecinas para mayor estabilidad"],"correcta":3,"explicacion":"Debe inmovilizar únicamente la articulación cuyo movimiento se quiere limitar, seguir los contornos y no presionar prominencias ni trayectos vasculonerviosos.","por_opcion":["❌ Sí es un requisito.","❌ Sí es un requisito.","❌ Sí es un requisito.","✅ Debe inmovilizar solo la articulación necesaria."]},{"pregunta":"Paciente con rotura del tendón extensor distal de un dedo. ¿Qué órtesis corresponde?","opciones":["Férula volar de mano para procesos reumáticos","Órtesis para cuello de cisne que bloquea la IFP","Férula de Stack con la IFD en extensión","Órtesis boutonnière con apoyo en tres puntos"],"correcta":2,"explicacion":"El dedo en martillo (rotura del extensor distal) se trata con la férula de Stack o de mallet, que mantiene la IFD en extensión.","por_opcion":["❌ Se usa en contracturas o en procesos reumáticos.","❌ Esa órtesis se usa en el cuello de cisne.","✅ Stack: IFD en extensión.","❌ La boutonnière corrige la hiperflexión de la IFP."]},{"pregunta":"¿Cómo actúa la órtesis para la deformidad en cuello de cisne?","opciones":["Bloquea la IFD en extensión y libera la IFP","Extiende pasivamente las MCF con bandas elásticas","Corrige la flexión de la IFP con apoyo en tres puntos","Bloquea la IFP y permite la flexión de la IFD"],"correcta":3,"explicacion":"En el cuello de cisne (hiperextensión IFP + hiperflexión IFD), la órtesis bloquea la IFP y permite la flexión de la IFD.","por_opcion":["❌ Describe la férula de Stack.","❌ Describe una órtesis dinámica de extensión.","❌ Describe la órtesis boutonnière.","✅ Bloquea la IFP y deja flexionar la IFD."]},{"pregunta":"La órtesis boutonnière corrige:","opciones":["La hiperflexión de la IFD","La hiperflexión de la IFP","La hiperextensión de la IFP","La desviación cubital de las MCF"],"correcta":1,"explicacion":"Es una férula estática que corrige la hiperflexión de la IFP mediante el principio de apoyo en tres puntos.","por_opcion":["❌ La caída de la IFD se trata con la Stack.","✅ Hiperflexión de la IFP.","❌ La hiperextensión de IFP es propia del cuello de cisne.","❌ No es la deformidad descrita."]},{"pregunta":"¿Qué describe correctamente la órtesis de Kleinert?","opciones":["Estática de reposo con dedos en extensión completa","Semidinámica que fija el pulgar en oposición","Dinámica con extensión activa y flexión pasiva de dedos","Dinámica con flexión activa de dedos y extensión pasiva"],"correcta":3,"explicacion":"Mantiene la muñeca en dorsiflexión funcional y permite una flexión activa de los dedos (MCF) con extensión pasiva; sustituye la extensión ausente o débil.","por_opcion":["❌ No es estática.","❌ Esa es la férula del pulgar.","❌ Invierte el patrón activo/pasivo.","✅ Flexión activa, extensión pasiva."]},{"pregunta":"¿Cuál de estas órtesis es una WO y no una WHO?","opciones":["Órtesis de muñeca tipo cock-up","Órtesis para quemados","Órtesis de descarga de peso","Órtesis de reposo de mano"],"correcta":0,"explicacion":"La cock-up, la de extensión de muñeca y la de neuropatía cubital son WO; reposo de mano, quemados y descarga de peso son WHO.","por_opcion":["✅ La cock-up es una WO.","❌ Es una WHO.","❌ Es una WHO.","❌ Es una WHO."]},{"pregunta":"Una fractura estable de radio distal en un paciente con hemiparesia previa. ¿Qué tipo de órtesis aparece indicada para ambos grupos en el temario?","opciones":["WHO (muñeca-mano)","HO de posicionamiento funcional","EO articulada con bisagras","SO semirrígida"],"correcta":0,"explicacion":"La WHO está indicada en lesiones traumáticas (fracturas estables de radio distal, luxaciones carpianas) y en patologías neurológicas (hemiparesia, lesión radial o mediana).","por_opcion":["✅ La WHO cubre ambas indicaciones.","❌ No abarca la muñeca.","❌ Es una órtesis de codo.","❌ Es una órtesis de hombro."]},{"pregunta":"Tras la reparación quirúrgica del manguito rotador, ¿qué órtesis de hombro indica el temario?","opciones":["Órtesis de abducción SEWHO de 30–90°","Cabestrillo simple tipo Vietnam","Órtesis en 8 de Gilchrist","Órtesis semirrígida en posición neutra"],"correcta":0,"explicacion":"La órtesis de abducción (cojín o airplane splint) mantiene el brazo en abducción de 30° a 90° y está indicada en el postoperatorio del manguito, en el plexo braquial y en la capsulitis adhesiva.","por_opcion":["✅ La SEWHO de abducción.","❌ El cabestrillo es para lesiones leves.","❌ Es una órtesis de clavícula.","❌ Se usa para prevenir la subluxación en el hemipléjico."]},{"pregunta":"¿Cuál es la finalidad principal de la órtesis semirrígida de hombro en un paciente hemipléjico?","opciones":["Mantener una abducción de 60° para evitar la capsulitis","Asistir activamente la elevación con resortes","Inmovilizar la clavícula en retropulsión","Prevenir la subluxación del hombro"],"correcta":3,"explicacion":"Sostiene la cintura escapular en posición neutra y horizontal y ayuda a prevenir la subluxación del hombro en hemiplejía y tetraplejía.","por_opcion":["❌ La abducción corresponde a la SEWHO.","❌ No es una órtesis dinámica.","❌ Esa es la función de la órtesis en 8.","✅ Prevención de la subluxación."]},{"pregunta":"¿Cuál de estas complicaciones de las órtesis de MMSS es de naturaleza no física según el temario?","opciones":["Atrofia muscular","Problemas circulatorios","Efecto psicológico","Compresión nerviosa"],"correcta":2,"explicacion":"El temario incluye entre las complicaciones el efecto psicológico, además de las cutáneas, neurovasculares, circulatorias, musculares y la dependencia excesiva.","por_opcion":["❌ Es una complicación física por inmovilización.","❌ Es una complicación física.","✅ El efecto psicológico.","❌ Es una complicación física."]}],"asignatura":"Ortesis","tema":6,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
