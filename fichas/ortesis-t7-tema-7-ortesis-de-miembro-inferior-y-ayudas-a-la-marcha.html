<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 7: Órtesis de miembro inferior y ayudas a la marcha · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 7: Órtesis de miembro inferior y ayudas a la marcha","subtitulo":"Funciones y nomenclatura (FO, AFO, KO, KAFO, HKAFO), órtesis de pie, tobillo, rodilla y cadera, bitutores y grandes aparatos de marcha, y uso correcto de bastones, bastones ingleses, muletas y andador.","resumen":["Una órtesis de miembro inferior es un **dispositivo externo** que modifica aspectos funcionales o estructurales del sistema neuromusculoesquelético con cinco funciones: **soporte, control, descarga, corrección y sustitución**.","Se nombran según las regiones que abarcan: **FO** (pie: plantillas, taloneras, almohadilla metatarsiana, anti-hallux valgus, suelas basculantes), **AFO** (tobillo-pie: anti-equinas y tobilleras), **KO** (rodilla), **KAFO** (rodilla-tobillo-pie: bitutores largos) y **HKAFO** (con **cinturón pélvico**).","Las **AFO anti-equinas** tratan el pie que no apoya el talón (debilidad del **tibial anterior**, espasticidad, lesión de **L5**, Aquiles corto); las tobilleras escalan de **elásticas** (esguince leve) a **semirrígidas/rígidas** (esguince grado 2–3) y a la **bota Walker** (máxima estabilidad: sindesmosis, fracturas maleolares).","En rodilla se usan la **cincha rotuliana** (tendinopatías, Osgood-Schlatter), la **rodillera femoropatelar** con centrado rotuliano y la **rodillera articulada** que controla los grados de flexoextensión; en cadera, la **HO postquirúrgica** mantiene la **distancia isquion-rodilla** y evita el desplazamiento lateral tras una prótesis.","Entre las ayudas a la marcha: el **bastón** se lleva en el **lado contralateral** y avanza **con la pierna afectada**, su caña mide **trocánter mayor–suelo**; el **bastón inglés** tiene la abrazadera **a 5 cm del codo** y el segmento antebraquial **a 30°**; la **muleta axilar** se apoya **5 cm por debajo** de la axila con el codo a **30°** de flexión sin colgarse; y el **andador** da máxima seguridad."],"objetivos":["Enumerar las cinco funciones de las órtesis de miembro inferior y aplicar la nomenclatura estandarizada FO, AFO, KO, KAFO, HKAFO (y HO).","Elegir la órtesis de pie, tobillo o rodilla adecuada según la patología y el grado de control articular necesario.","Diferenciar los tipos de bitutores (articulación bloqueable, libre, rígido, con cinturón pélvico) y los grandes aparatos de marcha como el parapodium.","Indicar y ajustar bastones, bastones ingleses, trípodes, muletas y andador, y enseñar los patrones de marcha y de escaleras."],"ideas_clave":["5 funciones: **soporte, control, descarga, corrección y sustitución** (esta última compensa déficits motores, p. ej. parálisis).","Nomenclatura por regiones incluidas: **FO → AFO → KO → KAFO → HKAFO**; la «H» implica **cinturón pélvico**.","**Almohadilla metatarsiana**: proximal a las cabezas de los metatarsianos, soporta el **arco transverso**; para **metatarsalgias y neuroma de Morton**.","**Pie equino**: talón sin apoyo, flexión plantar excesiva ± inversión; causas: **tibial anterior débil**, espasticidad, **L5**, Aquiles corto. La **férula de resorte anterior** es la **más utilizada**.","Escalada de tobilleras: **elástica** (leve) → **semirrígida/rígida** (grado 2–3) → **Walker** (máxima estabilidad).","**Rodillera articulada**: protege los **ligamentos laterales** y controla los **grados de flexoextensión** (pre/postoperatorio, esguince grave, debilidad de cuádriceps).","Bastón: **lado contralateral**, avanza **con la pierna afectada**; caña = **trocánter mayor–suelo**; contera **ancha, cóncava, de caucho**.","Bastón inglés: abrazadera **5 cm** por debajo del codo, antebrazo **30°**; muleta axilar: **5 cm bajo la axila**, codo **30°**, **no colgarse** (compresión nerviosa)."],"secciones":[{"id":"concepto-nomenclatura","titulo":"Concepto, funciones y nomenclatura","bloques":[{"tipo":"definicion","termino":"Órtesis","texto":"**Dispositivo externo** que se aplica al cuerpo para **modificar aspectos funcionales o estructurales** del sistema neuromusculoesquelético."},{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Soporte","texto":"Mantener la **alineación adecuada** del miembro."},{"etiqueta":"2","titulo":"Control","texto":"**Limitar o guiar** movimientos articulares."},{"etiqueta":"3","titulo":"Descarga","texto":"**Disminuir la carga de peso** en una zona afectada."},{"etiqueta":"4","titulo":"Corrección","texto":"Ayudar a **corregir deformidades** estructurales."},{"etiqueta":"5","titulo":"Sustitución","texto":"**Compensar déficits motores**, por ejemplo en parálisis."}]},{"tipo":"parrafo","texto":"Las órtesis de MMII se clasifican **según la región del cuerpo que incorporan**, con una denominación estandarizada en inglés que se lee de distal a proximal: cada letra añadida es una articulación más que queda abarcada por el dispositivo. Así, una KAFO controla rodilla, tobillo y pie, y una HKAFO añade la cadera mediante un cinturón pélvico."},{"tipo":"tabla","titulo":"Nomenclatura estandarizada de las órtesis de MMII","columnas":["Sigla","Significado","Ejemplos del temario"],"filas":[["**FO**","Foot Orthosis (pie)","Plantillas, cuñas, almohadillas, calzados especiales"],["**AFO**","Ankle Foot Orthosis (tobillo-pie)","Órtesis anti-equinas, tobilleras"],["**KO**","Knee Orthosis (rodilla)","Rodilleras"],["**HO**","Hip Orthosis (cadera)","Órtesis postquirúrgica de cadera"],["**KAFO**","Knee Ankle Foot Orthosis","Aparatos termoconformados de control de tobillo y rodilla; bitutor largo por encima de la rodilla"],["**HKAFO**","Hip Knee Ankle Foot Orthosis","Bitutor largo con cinturón pélvico; grandes aparatos de marcha; ayudas para la marcha"]]},{"tipo":"esquema","titulo":"Lógica de la nomenclatura: cada letra añade una articulación","mermaid":"flowchart LR\n  FO[\"FO: pie\"] --> AFO[\"AFO: + tobillo\"]\n  AFO --> KAFO[\"KAFO: + rodilla\"]\n  KAFO --> HKAFO[\"HKAFO: + cadera, cinturon pelvico\"]\n  KO[\"KO: solo rodilla\"] -.-> KAFO\n  HO[\"HO: solo cadera\"] -.-> HKAFO","pie":"Las siglas se leen de distal a proximal; KO y HO son órtesis de una sola articulación."},{"tipo":"alerta","texto":"La sigla describe **qué articulaciones abarca**, no el material ni la rigidez: un **bitutor largo por encima de la rodilla** es una **KAFO**, y solo pasa a **HKAFO** cuando se le añade el **cinturón pélvico**."}]},{"id":"ortesis-pie","titulo":"Órtesis de pie (FO)","bloques":[{"tipo":"tabla","titulo":"Taloneras o cuñas: indicaciones","columnas":["Objetivo","Indicación / mecanismo"],"filas":[["Amortiguación del impacto","**Fascitis plantar, tendinitis aquílea, espolón calcáneo, talalgia**: absorben parte de la presión al caminar o correr"],["Compensación de dismetrías","Dismetría **real o funcional**: talonera **en un solo pie** para **nivelar la pelvis** y evitar molestias lumbares o pélvicas"],["Descarga del tendón de Aquiles","**Tendinopatías** aquíleas"],["Rendimiento o confort","Deportistas: mejorar la postura o reducir la fatiga en entrenamientos de alto impacto"]]},{"tipo":"parrafo","texto":"Las **plantillas ortopédicas** pueden ser de distintos tipos y materiales, **hechas a medida por un podólogo** o comerciales. En el **pie plano** buscan **aumentar el arco plantar**; en el **pie cavo**, **sostener el arco**; también se usan en asimetrías de arcos, inestabilidad o tras cirugía del pie. **Se revaloran cada año** según el tratamiento prescrito y deben llevarse en **zapato cerrado con buena sujeción del tobillo**."},{"tipo":"dato","valor":"1 vez / año","texto":"Frecuencia de revaloración de las plantillas ortopédicas."},{"tipo":"definicion","termino":"Almohadilla metatarsiana","texto":"Soporte que empieza cerca del **centro de la superficie plantar** y se extiende **justo proximal a las cabezas de los metatarsianos**; abarca del **1.º al 5.º metatarsiano** y se estrecha hacia proximal. **Soporta el arco transverso** y limita carga e impacto. Indicada en **metatarsalgias y neuroma de Morton**."},{"tipo":"alerta","texto":"La almohadilla metatarsiana se coloca **proximal** a las cabezas de los metatarsianos, **nunca debajo** de ellas: su función es elevar el arco transverso y **descargar** las cabezas, no apoyarlas."},{"tipo":"parrafo","texto":"La **órtesis anti-hallux valgus** es un dispositivo **corrector o preventivo** que alinea el primer dedo y reduce la presión o fricción sobre el juanete. Se usa **pre o postoperatoriamente** y como prevención: corregir la desviación (**solo en etapas iniciales**), disminuir dolor e inflamación, **prevenir el avance** de la deformidad y **mantener la alineación postquirúrgica**."},{"tipo":"parrafo","texto":"Las **suelas basculantes** (*rocker soles* o suelas mecedoras) son modificaciones del calzado con una **curvatura en la planta**, sobre todo en la parte delantera y/o trasera, que hacen que el pie **«ruede»** durante la marcha, **reduciendo la flexión de las articulaciones** y facilitando el movimiento. Existen **anterior, completa y posterior**."},{"tipo":"perla","texto":"Ante un paciente con dolor lumbar y una **dismetría**, una **talonera unilateral** en el lado corto puede nivelar la pelvis; antes de pautarla, distingue si la dismetría es **real o funcional**, porque ambas están contempladas en el temario y cambian la valoración."}]},{"id":"ortesis-tobillo","titulo":"Órtesis de tobillo-pie (AFO): anti-equinas y tobilleras","bloques":[{"tipo":"definicion","termino":"Pie equino","texto":"Alteración postural o funcional en la que el **talón no puede apoyarse completamente** en el suelo: el pie queda en **flexión plantar excesiva** («de puntillas»), a veces con **inversión** y con rigidez o flacidez articular."},{"tipo":"esquema","titulo":"Causas del pie equino y respuesta ortésica","mermaid":"flowchart TD\n  A[\"Pie equino: talon sin apoyo\"] --> C1[\"Paralisis o debilidad del tibial anterior\"]\n  A --> C2[\"Espasticidad: PC, hemiplejia\"]\n  A --> C3[\"Lesion neurologica: ictus, L5, neuropatia\"]\n  A --> C4[\"Acortamiento del Aquiles\"]\n  C1 --> O[\"Ortesis antiequina AFO\"]\n  C2 --> O\n  C3 --> O\n  C4 --> O\n  O --> F[\"Flexible: se adapta al calzado\"]\n  O --> R[\"Rigida: fija la dorsiflexion\"]","pie":"Las anti-equinas pueden ser flexibles (adaptadas al calzado) o rígidas (fijan la dorsiflexión)."},{"tipo":"tabla","titulo":"Tipos de órtesis anti-equinas","columnas":["Tipo","Descripción","Aplicación clínica"],"filas":[["AFO rígida (Rancho de los Amigos)","Férula de **polipropileno** que mantiene el tobillo **en ángulo recto**","Debilidad o parálisis del **tibial anterior**"],["AFO articulada","Permite cierta movilidad **controlada** en flexión dorsal o plantar","Mantener **función parcial** del tobillo"],["AFO *leaf spring* (resorte anterior)","Material flexible que **almacena energía** al apoyar y la **libera al despegar**","**Pie caído leve o moderado**; es la **más utilizada**"],["AFO dinámica de carbono","Ligera, elástica y resistente; favorece una **marcha fluida**","Rehabilitación o deporte adaptado"],["Férula posterior **nocturna**","Mantiene el pie en **posición neutra** mientras descansa","**Previene la retracción del Aquiles**"]]},{"tipo":"figura","pagina":12,"pie":"Órtesis anti-equinas: férula de resorte anterior (la más utilizada), AFO dinámica de carbono, férula rígida Rancho de los Amigos y férula anti-equina nocturna, con la tabla de tipos, descripción y aplicación clínica.","src":"img/ortesis-t7-tema-7-ortesis-de-miembro-inferior-y-ayudas-a-la-marcha-p12.jpg"},{"tipo":"dato","valor":"L5","texto":"Nivel de lesión medular citado como causa neurológica de pie equino (déficit de la dorsiflexión)."},{"tipo":"tabla","titulo":"Escalada de tobilleras según el control articular necesario","columnas":["Tipo","Aporte","Indicaciones"],"filas":[["**Elásticas y de compresión**","Poco soporte articular","Esguinces **leves**, inestabilidad crónica, procesos reumatoides, **uso preventivo** en actividad física"],["**Semirrígidas y rígidas de descarga**","Mayor control: **inmovilización y compresión**","Esguinces **grado 2 o 3**, inestabilidad crónica, **tendinopatías degenerativas del Aquiles**"],["**Bota Walker** (rígida)","**Máxima estabilidad articular**","Postoperatorio de tendinopatía aquílea, **rotura de la sindesmosis**, esguinces graves, **fracturas de maléolos, astrágalo, calcáneo**"]]},{"tipo":"alerta","texto":"La **inestabilidad crónica** de tobillo aparece en las indicaciones **tanto de las elásticas como de las semirrígidas/rígidas**: la elección depende del grado de control que se necesite, no del diagnóstico solo. En cambio, la **rotura de la sindesmosis** y las **fracturas** son indicación de **bota Walker**."},{"tipo":"perla","texto":"En un paciente con **ictus** y pie caído leve, la **férula de resorte anterior** (*leaf spring*) aprovecha la energía almacenada en el apoyo para levantar el antepié en la oscilación; si además hay riesgo de **retracción del Aquiles**, se complementa con una **férula posterior nocturna**."}]},{"id":"ortesis-rodilla-cadera","titulo":"Órtesis de rodilla (KO) y de cadera (HO)","bloques":[{"tipo":"tabla","titulo":"Órtesis de rodilla","columnas":["Órtesis","Acción","Indicaciones"],"filas":[["**Cincha rotuliana**","Rígida o semirrígida, **control de vibración a nivel del tendón rotuliano**","Procesos inflamatorios, **tendinopatías**, **Osgood-Schlatter**"],["**Rodillera femoropatelar** (elástica con centrado rotuliano)","Control de la patela: **compresión**, disminuye la movilidad (**controla la hiperextensión**), estabiliza lateralmente","Inflamación, tendinopatías, **síndrome femoropatelar**, **condromalacia/osteocondritis**, **subluxación patelar**, esguince **leve**"],["**Rodillera articulada** (rígida)","Protege los **ligamentos laterales** y **controla los grados de flexoextensión**","Pre/postoperatorio, inflamación, **esguinces graves**, fracturas, **debilidad de cuádriceps**, inestabilidad marcada"]]},{"tipo":"figura","pagina":20,"pie":"Rodillera articulada con control de los grados de flexoextensión (izquierda) frente a la rodillera Zimmer, inmovilizadora en extensión (derecha).","src":"img/ortesis-t7-tema-7-ortesis-de-miembro-inferior-y-ayudas-a-la-marcha-p20.jpg"},{"tipo":"alerta","texto":"La **cincha rotuliana** actúa sobre el **tendón rotuliano** (tendinopatías, Osgood-Schlatter), mientras que la **rodillera femoropatelar** actúa sobre la **rótula** (síndrome femoropatelar, condromalacia, subluxación). No confundas «tendón» con «patela»."},{"tipo":"parrafo","texto":"La **órtesis postquirúrgica de cadera (HO)** es una órtesis dinámica con control de movimiento. Su efectividad se basa en **dos puntos**: **mantener la distancia del isquion a la rodilla** (distensión articular) y el **efecto compresivo funcional de la muslera** (estímulo muscular). La sujeción de la pelvis, unida por una articulación mecánica a la pieza del muslo, **evita el desplazamiento lateral de la cadera durante la marcha**."},{"tipo":"lista","items":["Postoperatorio de **prótesis de cadera** en pacientes débiles.","**Recambios complicados** y **montajes defectuosos**.","**Fracturas periprotésicas** y **mala calidad ósea**.","**Inestabilidad protésica** cuando la reintervención está contraindicada.","**Limitar la movilidad tras reducir una luxación protésica**."]},{"tipo":"dato","valor":"Isquion → rodilla","texto":"Distancia que la HO postquirúrgica debe mantener (distensión articular), junto con el efecto compresivo de la muslera."},{"tipo":"perla","texto":"Tras la reducción de una **luxación de prótesis de cadera** en un paciente frágil, la HO limita los movimientos luxantes durante la marcha y la rehabilitación; el fisioterapeuta debe comprobar que la órtesis no se desplaza y que la muslera comprime sin generar puntos de presión."}]},{"id":"bitutores-grandes-aparatos","titulo":"Bitutores (KAFO, HKAFO) y grandes aparatos de marcha","bloques":[{"tipo":"parrafo","texto":"Los **bitutores largos por encima de la rodilla** (KAFO) sujetan y estabilizan la pierna en personas con **debilidad muscular, parálisis, lesiones neurológicas o problemas articulares**. Se indican en **parálisis o debilidad muscular** (poliomielitis, PCI, lesiones neurológicas), **inestabilidad de rodilla** (laxitud ligamentosa, artrosis severa, traumatismos), **corrección o prevención de deformidades** (genu valgo o varo), **soporte postoperatorio** y **lesiones medulares o espásticas** para permitir la marcha asistida (secuelas de polio, **mielomeningocele**, PCI)."},{"tipo":"tarjetas","items":[{"etiqueta":"KAFO","titulo":"Articulación de rodilla bloqueable","texto":"Bisagra que se **bloquea al caminar** (rodilla rígida, p. ej. debilidad muscular) y se **desbloquea al sentarse** para permitir la flexión."},{"etiqueta":"KAFO","titulo":"Sin articulación (rígido)","texto":"Mantiene la pierna **completamente recta**: **fracturas**, **inmovilizaciones prolongadas** o cuando no se desea movimiento de rodilla."},{"etiqueta":"KAFO","titulo":"Articulación libre","texto":"La rodilla se **flexiona y extiende libremente** con estabilidad lateral: **debilidad leve o inestabilidad moderada**."},{"etiqueta":"KAFO","titulo":"Bitutor con sistema KAFO","texto":"Soporte de **rodilla, tobillo y pie** para casos neurológicos: polio, PCI, **esclerosis múltiple**, lesión medular."},{"etiqueta":"HKAFO","titulo":"Bitutor con cinturón pélvico","texto":"Del pie a la pelvis: **controla la cadera** (evita desplazamientos hacia fuera o dentro), da **estabilidad en bipedestación y marcha** y **reparte el peso**. Muy útil en **niños con secuelas paralíticas**."},{"etiqueta":"Gran aparato","titulo":"Parapodium","texto":"Para **grandes déficits motores** paralíticos (polio, mielomeningocele, PCI) en los que **sin la órtesis la bipedestación y la marcha son imposibles**; ayuda al equilibrio en las **primeras fases de verticalización**, en niños y adultos."}]},{"tipo":"figura","pagina":26,"pie":"Bitutor largo con articulación de rodilla bloqueable (izquierda) frente a bitutor largo sin articulación, rígido (derecha): compara la bisagra a la altura de la rodilla.","src":"img/ortesis-t7-tema-7-ortesis-de-miembro-inferior-y-ayudas-a-la-marcha-p26.jpg"},{"tipo":"esquema","titulo":"Elección del bitutor según la necesidad de control","mermaid":"flowchart TD\n  A[\"Paciente que necesita bitutor\"] --> B{\"Control de cadera necesario\"}\n  B -->|\"si\"| H[\"HKAFO con cinturon pelvico\"]\n  B -->|\"no\"| C{\"Movimiento de rodilla deseado\"}\n  C -->|\"ninguno: fractura o inmovilizacion\"| R[\"Bitutor rigido sin articulacion\"]\n  C -->|\"rigida al andar, flexion al sentarse\"| BL[\"Articulacion bloqueable\"]\n  C -->|\"libre con estabilidad lateral\"| LI[\"Articulacion libre: debilidad leve\"]\n  H --> P{\"Bipedestacion imposible sin ortesis\"}\n  P -->|\"si\"| PA[\"Parapodium\"]","pie":"Del mayor al menor control: parapodium, HKAFO, bitutor rígido, bloqueable y libre."},{"tipo":"alerta","texto":"El bitutor con **articulación bloqueable** se **bloquea para caminar** y se **desbloquea para sentarse**, no al revés. El **libre** es para debilidad **leve**, y el **rígido** para **fracturas o inmovilizaciones prolongadas**."}]},{"id":"ayudas-marcha","titulo":"Ayudas a la marcha: bastones, muletas y andador","bloques":[{"tipo":"parrafo","texto":"Las ayudas a la marcha tienen como indicaciones: **tratar deformidades**, **mejorar el equilibrio**, **cooperar a una deambulación correcta**, **aumentar la movilidad articular**, **facilitar el impulso**, **marchar con menos gasto energético** y **tratar anomalías de la función neuromuscular**."},{"tipo":"tabla","titulo":"Indicaciones de uno o dos bastones","columnas":["1 bastón","2 bastones"],"filas":[["Parálisis de la musculatura de la **raíz del miembro**: sobre todo **glúteo mayor** y **tríceps sural**","Parálisis de la musculatura de la raíz del miembro inferior **de ambos lados**"],["Desequilibrios de la marcha: **hemipléjicos**","Necesidad de **descarga parcial de ambas extremidades** (postoperatorio, fracturas, esguinces graves)"],["**Descarga parcial** de una articulación (traumatismo, postoperatorio, artrosis)","—"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Bastón 1","titulo":"Empuñadura","texto":"Curvada o en **T**. Si hay **déficit muscular de dedos o radiales**, conviene un **tope anterior**."},{"etiqueta":"Bastón 2","titulo":"Caña","texto":"Longitud ≈ **distancia trocánter mayor–suelo**; si la marcha es **oscilante**, algo **más larga**."},{"etiqueta":"Bastón 3","titulo":"Contera","texto":"De **caucho, ancha y cóncava**; las pequeñas, duras y convexas **resbalan**. **Cuanto menos estable el paciente, más ancho el apoyo**."},{"etiqueta":"Modificado","titulo":"Trípode","texto":"Permite subir y bajar escaleras; **raramente definitivo**, suele ser **paso intermedio** entre paralelas/andador y bastones ingleses; sobre todo en **ancianos tras fractura de cadera**."}]},{"tipo":"tabla","titulo":"Bastón inglés (5 partes) y muleta axilar","columnas":["Elemento","Característica clave"],"filas":[["Abrazadera de antebrazo","Región **posterior proximal** del antebrazo, **a 5 cm del codo**; rígida, semirrígida, fija o articulada"],["Segmento del antebrazo","Inclinado **30° sobre la vertical**, regulable o no"],["Empuñadura","Con depresiones para los dedos; en **poliartríticos o parálisis del tríceps braquial** se modifica para apoyar con **codos a 90°** y puño vertical"],["Caña","Metálica y **regulable en altura**"],["Contera","Como la del bastón; **articulada** en terrenos especiales (nieve, arena)"],["Muleta axilar","**Peor aceptada**; con la mano en la empuñadura, codo a **30° de flexión**; apoyo axilar **almohadillado**, **5 cm por debajo y algo por delante** del hueco axilar; apoyar contra el tórax, **no colgarse de la axila**"]]},{"tipo":"figura","pagina":35,"pie":"Bastón inglés con sus 5 partes numeradas: abrazadera de antebrazo (1), segmento del antebrazo a 30° (2), empuñadura (3), caña regulable (4) y contera (5).","src":"img/ortesis-t7-tema-7-ortesis-de-miembro-inferior-y-ayudas-a-la-marcha-p35.jpg"},{"tipo":"dato","valor":"5 cm · 30°","texto":"Bastón inglés: abrazadera a 5 cm del codo y segmento antebraquial a 30° de la vertical. Muleta: apoyo 5 cm bajo la axila y codo a 30° de flexión."},{"tipo":"parrafo","texto":"El **andador** permite una marcha semejante a la de las **paralelas**, pero desplazándose con el aparato, lo que da **independencia**. Aporta **gran seguridad** (equilibrio y **tranquilidad psicológica**) y hace posible la deambulación en pacientes que sin él no podrían andar. Hay modelos fijos, articulados, con conteras o con ruedas. **Precauciones**: nivel de **autonomía/equilibrio**, **altura** del andador (atención a la **hipercifosis**), **peso y estabilidad**."},{"tipo":"alerta","texto":"En la **muleta axilar** el paciente **no debe quedar suspendido por las axilas**: el apoyo axilar está **5 cm por debajo** del hueco axilar y bien almohadillado para **evitar la compresión nerviosa**; el peso se carga en las manos y la muleta se aprieta contra el tórax."}]},{"id":"patrones-marcha","titulo":"Cómo andar con bastón, bastones o andador","bloques":[{"tipo":"parrafo","texto":"**Marcha con un bastón** (reducir la carga de una extremidad): el bastón se coloca **en el lado contralateral** al afectado. Se **inicia la marcha con la pierna afectada y el bastón a la vez** para repartir la carga, y después la **extremidad sana**, que soporta todo el esfuerzo, avanza por delante del bastón y de la pierna afectada."},{"tipo":"esquema","titulo":"Secuencias de marcha con bastones","mermaid":"flowchart TD\n  subgraph S1[\"Un baston, lado contralateral\"]\n    A1[\"Baston + pierna afectada\"] --> A2[\"Pierna sana avanza\"]\n  end\n  subgraph S2[\"Dos bastones, un solo pie de apoyo\"]\n    B1[\"1. Apoyo de los bastones\"] --> B2[\"2. Bascula de la extremidad\"]\n    B2 --> B3[\"3. Apoyo de la extremidad\"]\n    B3 --> B4[\"4. Elevacion de los bastones\"]\n  end\n  subgraph S3[\"Dos bastones, carga parcial bilateral\"]\n    C1[\"Cada baston se mueve a la inversa de su pierna\"]\n  end","pie":"Tres patrones de marcha descritos en el tema."},{"tipo":"figura","pagina":39,"pie":"Marcha con bastones y un solo pie de apoyo en cuatro tiempos: apoyo de los bastones, báscula de la extremidad (fase aérea), apoyo de la extremidad y elevación de los bastones.","src":"img/ortesis-t7-tema-7-ortesis-de-miembro-inferior-y-ayudas-a-la-marcha-p39.jpg"},{"tipo":"parrafo","texto":"**Marcha con bastones y un solo pie de apoyo** (descarga total de un miembro): **1)** apoyo de los bastones, **2)** báscula de la extremidad (fase aérea), **3)** apoyo de la extremidad, **4)** elevación de los bastones. **Marcha con bastones y carga parcial de ambas extremidades**: **cada bastón se mueve a la inversa de su extremidad correspondiente** (patrón alterno). **Escaleras**: el bastón va en el **lado contralateral** al afectado; si hay **barandilla**, la pierna afectada se coloca **del lado de la pared**, y se suben los peldaños **uno a uno**."},{"tipo":"alerta","texto":"Error típico: llevar el bastón en el **mismo lado** de la pierna operada. Va en el **lado contralateral** y se adelanta **a la vez que la pierna afectada**; así la base de apoyo se ensancha y el patrón recíproco brazo-pierna se conserva."},{"tipo":"perla","texto":"En la **reeducación de la marcha** tras una fractura de cadera en un anciano, una progresión lógica es **paralelas → andador o trípode → bastones ingleses → un bastón contralateral**, adaptando la contera (más ancha cuanto menos estable) y la altura (trocánter mayor–suelo)."},{"tipo":"dato","valor":"Trocánter mayor–suelo","texto":"Referencia para la longitud de la caña del bastón (algo más larga si la marcha es oscilante)."}]}],"caso_clinico":{"titulo":"Hemiplejía tras ictus con pie caído","presentacion":"Mujer de 68 años, 3 meses después de un ictus con hemiparesia derecha. Camina con el pie derecho en flexión plantar e inversión, engancha la punta en la fase de oscilación y no apoya bien el talón. Presenta desequilibrio en la marcha y tiene una hipercifosis dorsal moderada. Su hija pregunta si necesita «un bastón o un andador» y qué hacer con el pie.","preguntas":[{"pregunta":"¿Qué alteración presenta en el pie y qué órtesis sería de primera elección?","respuesta":"Un **pie equino** (talón sin apoyo, flexión plantar e inversión) de origen neurológico por debilidad del **tibial anterior**. Una **AFO anti-equina**; la **férula de resorte anterior** (*leaf spring*), la más utilizada, es ideal en el pie caído leve-moderado, y puede añadirse una **férula posterior nocturna** para prevenir la retracción del Aquiles."},{"pregunta":"Si se le pauta un bastón, ¿en qué mano y cómo debe andar?","respuesta":"Los **desequilibrios de la marcha en hemipléjicos** son indicación de **un bastón**, que va en el **lado contralateral** al afectado (mano izquierda). Avanza **a la vez que la pierna derecha**, y luego la pierna sana da el paso. Caña a la altura del **trocánter mayor** y contera **ancha, cóncava, de caucho**."},{"pregunta":"Si se optara por un andador, ¿qué precauciones habría que vigilar en ella?","respuesta":"Su **nivel de autonomía y equilibrio**, la **altura del andador** (importante por su **hipercifosis**) y el **peso y la estabilidad** del aparato. Le aportaría seguridad y tranquilidad psicológica."}]},"preguntate":[{"pregunta":"¿Cuáles son las cinco funciones de una órtesis de miembro inferior?","respuesta":"Soporte (alineación), control (limitar o guiar movimientos), descarga, corrección de deformidades y sustitución de déficits motores."},{"pregunta":"¿Qué diferencia una KAFO de una HKAFO?","respuesta":"La HKAFO añade la cadera mediante un cinturón pélvico, que controla el movimiento de cadera, estabiliza la bipedestación y reparte el peso."},{"pregunta":"¿Dónde se coloca la almohadilla metatarsiana y para qué sirve?","respuesta":"Desde cerca del centro plantar hasta justo proximal a las cabezas de los metatarsianos; soporta el arco transverso y limita la carga. Indicada en metatarsalgia y neuroma de Morton."},{"pregunta":"Define el pie equino y enumera sus causas.","respuesta":"Talón que no apoya por flexión plantar excesiva, ± inversión. Causas: parálisis o debilidad del tibial anterior, espasticidad, lesiones neurológicas (ictus, L5, neuropatías) y acortamiento del Aquiles."},{"pregunta":"¿Cómo eliges entre tobillera elástica, semirrígida y bota Walker?","respuesta":"Según el control necesario: elástica en esguince leve o prevención; semirrígida/rígida en esguinces grado 2–3 y tendinopatía aquílea degenerativa; Walker en sindesmosis, fracturas o postoperatorio, por su máxima estabilidad."},{"pregunta":"¿En qué dos puntos se basa la eficacia de la HO postquirúrgica de cadera?","respuesta":"Mantener la distancia isquion-rodilla (distensión articular) y el efecto compresivo funcional de la muslera (estímulo muscular)."},{"pregunta":"¿Cómo funciona un bitutor con articulación de rodilla bloqueable?","respuesta":"Se bloquea para mantener la rodilla rígida al caminar (debilidad muscular) y se desbloquea para permitir la flexión al sentarse."},{"pregunta":"¿Qué medidas debe cumplir un bastón inglés y una muleta axilar?","respuesta":"Bastón inglés: abrazadera posterior a 5 cm del codo, segmento antebraquial a 30°. Muleta: apoyo 5 cm bajo la axila y algo por delante, codo a 30°, sin colgarse."},{"pregunta":"Describe la marcha con dos bastones y un solo pie de apoyo.","respuesta":"Apoyo de los bastones, báscula de la extremidad en fase aérea, apoyo de la extremidad y elevación de los bastones."},{"pregunta":"¿Cómo se suben escaleras con un bastón y barandilla?","respuesta":"Bastón en el lado contralateral al afectado, pierna afectada del lado de la pared (barandilla) y peldaños uno a uno."}],"glosario":[{"termino":"FO","definicion":"Foot Orthosis: órtesis de pie (plantillas, taloneras, almohadillas, calzado)."},{"termino":"AFO","definicion":"Ankle Foot Orthosis: órtesis de tobillo y pie (anti-equinas, tobilleras)."},{"termino":"KAFO","definicion":"Knee Ankle Foot Orthosis: abarca rodilla, tobillo y pie (bitutores largos)."},{"termino":"HKAFO","definicion":"Hip Knee Ankle Foot Orthosis: bitutor largo con cinturón pélvico."},{"termino":"Pie equino","definicion":"Pie en flexión plantar excesiva que impide el apoyo del talón."},{"termino":"Leaf spring","definicion":"AFO de resorte anterior que almacena energía en el apoyo y la libera en el despegue."},{"termino":"Suela basculante","definicion":"Rocker sole: suela curva que hace rodar el pie y reduce la flexión articular."},{"termino":"Bota Walker","definicion":"Órtesis rígida de tobillo de máxima estabilidad articular."},{"termino":"Cincha rotuliana","definicion":"Banda que controla la vibración del tendón rotuliano (tendinopatías, Osgood-Schlatter)."},{"termino":"Parapodium","definicion":"Gran aparato de marcha para déficits motores graves en los que la bipedestación es imposible sin él."},{"termino":"Trípode","definicion":"Bastón modificado de tres pies, paso intermedio entre andador y bastones ingleses."},{"termino":"Contera","definicion":"Extremo distal del bastón; de caucho, ancha y cóncava para no resbalar."}],"fuentes":["Tema 7. Órtesis en miembro inferior. Ortesis y Prótesis, Universidad Europea de Valencia, 2026-2027."],"qcm":[{"pregunta":"Un bitutor largo por encima de la rodilla al que se añade un cinturón pélvico pasa a denominarse:","opciones":["KAFO","HO","HKAFO","AFO"],"correcta":2,"explicacion":"La nomenclatura añade una letra por articulación abarcada: el cinturón pélvico incorpora la cadera, convirtiendo la KAFO en HKAFO.","por_opcion":["❌ KAFO es el bitutor largo sin cinturón pélvico.","❌ HO es una órtesis solo de cadera.","✅ El cinturón pélvico añade la cadera: HKAFO.","❌ AFO abarca solo tobillo y pie."]},{"pregunta":"¿Cuál de estas funciones de las órtesis corresponde a compensar un déficit motor, por ejemplo en una parálisis?","opciones":["Soporte","Corrección","Sustitución","Control"],"correcta":2,"explicacion":"La sustitución compensa déficits motores; el soporte mantiene la alineación, el control limita o guía movimientos y la corrección actúa sobre deformidades.","por_opcion":["❌ El soporte mantiene la alineación del miembro.","❌ La corrección ayuda a corregir deformidades estructurales.","✅ La sustitución compensa déficits motores.","❌ El control limita o guía movimientos articulares."]},{"pregunta":"En un neuroma de Morton, la almohadilla metatarsiana debe colocarse:","opciones":["Justo proximal a las cabezas de los metatarsianos","Directamente bajo las cabezas metatarsianas","Bajo el arco longitudinal interno","Bajo la base del primer metatarsiano"],"correcta":0,"explicacion":"Se extiende desde cerca del centro plantar hasta justo proximal a las cabezas metatarsianas, soportando el arco transverso y descargándolas.","por_opcion":["✅ Proximal a las cabezas, sosteniendo el arco transverso.","❌ Bajo las cabezas aumentaría la presión que se quiere reducir.","❌ Eso corresponde al soporte del arco longitudinal (plantillas).","❌ Abarca del 1.º al 5.º metatarsiano, no solo el primero."]},{"pregunta":"Según el temario, ¿qué AFO anti-equina es la más utilizada?","opciones":["La férula de resorte anterior","La férula rígida Rancho de los Amigos","La AFO dinámica de carbono","La férula posterior nocturna"],"correcta":0,"explicacion":"La diapositiva señala la férula de resorte anterior (leaf spring) como la más utilizada; es ideal en el pie caído leve o moderado.","por_opcion":["✅ Marcada como la más utilizada.","❌ La rígida se usa en debilidad o parálisis del tibial anterior.","❌ La de carbono se usa en rehabilitación o deporte adaptado.","❌ La nocturna previene la retracción del Aquiles en reposo."]},{"pregunta":"¿Cuál es la indicación principal de la férula posterior nocturna?","opciones":["Devolver energía en el despegue del pie","Prevenir la retracción del tendón de Aquiles","Favorecer la marcha fluida en deporte adaptado","Mantener una función parcial del tobillo"],"correcta":1,"explicacion":"Mantiene el pie en posición neutra durante el descanso para prevenir la retracción del Aquiles.","por_opcion":["❌ Describe la AFO de resorte anterior.","✅ Previene la retracción del Aquiles.","❌ Corresponde a la AFO dinámica de carbono.","❌ Corresponde a la AFO articulada."]},{"pregunta":"¿Qué nivel de lesión medular cita el temario como causa de pie equino?","opciones":["L4","L3","S1","L5"],"correcta":3,"explicacion":"Entre las lesiones neurológicas que producen pie equino, el temario cita la lesión medular L5.","por_opcion":["❌ No es el nivel citado.","❌ No es el nivel citado.","❌ S1 se relaciona con la flexión plantar, no con su déficit.","✅ L5 es el nivel citado."]},{"pregunta":"Paciente con rotura de la sindesmosis tibioperonea. ¿Qué órtesis de tobillo corresponde?","opciones":["Férula de resorte anterior","Tobillera semirrígida de descarga","Bota Walker","Tobillera elástica de compresión"],"correcta":2,"explicacion":"La bota Walker aporta la máxima estabilidad articular y está indicada en la rotura de la sindesmosis, esguinces graves, fracturas y postoperatorio aquíleo.","por_opcion":["❌ Es una órtesis anti-equina.","❌ La semirrígida es para esguinces grado 2–3.","✅ Máxima estabilidad: rotura de sindesmosis.","❌ La elástica es para esguinces leves y prevención."]},{"pregunta":"¿Cuál de estas patologías es indicación de cincha rotuliana y no de rodillera femoropatelar?","opciones":["Esguince leve de rodilla","Enfermedad de Osgood-Schlatter","Condromalacia rotuliana","Subluxación patelar"],"correcta":1,"explicacion":"La cincha rotuliana controla la vibración del tendón rotuliano (inflamación, tendinopatías, Osgood-Schlatter); las demás figuran en la rodillera femoropatelar.","por_opcion":["❌ Indicación de la rodillera femoropatelar.","✅ Osgood-Schlatter es indicación de la cincha.","❌ Indicación de la rodillera femoropatelar.","❌ Indicación de la rodillera femoropatelar."]},{"pregunta":"¿Qué aporta específicamente la rodillera articulada según el temario?","opciones":["Mantenimiento de la distancia isquion-rodilla","Centrado de la patela y control de la hiperextensión","Control de la vibración del tendón rotuliano","Protección de los ligamentos laterales y control de la flexoextensión"],"correcta":3,"explicacion":"La rodillera articulada (rígida) protege los ligamentos laterales y controla los grados de flexoextensión; se indica en esguinces graves, fracturas o debilidad de cuádriceps.","por_opcion":["❌ Corresponde a la HO postquirúrgica de cadera.","❌ Corresponde a la rodillera femoropatelar.","❌ Es la acción de la cincha rotuliana.","✅ Protección lateral y control de flexoextensión."]},{"pregunta":"La HO postquirúrgica de cadera basa su eficacia en:","opciones":["Mantener la distancia isquion-rodilla y la compresión de la muslera","Bloquear la rotación interna y la aducción de forma rígida","Fijar la cadera en abducción mediante una barra entre muslos","Descargar totalmente la cadera mediante apoyo isquiático"],"correcta":0,"explicacion":"Sus dos puntos son mantener la distancia del isquion a la rodilla (distensión articular) y el efecto compresivo funcional de la muslera (estímulo muscular).","por_opcion":["✅ Los dos puntos de su eficacia.","❌ No es el mecanismo descrito.","❌ No describe esta órtesis.","❌ No es una órtesis de descarga isquiática."]},{"pregunta":"En un bitutor con articulación de rodilla bloqueable, ¿cuándo se desbloquea?","opciones":["Durante la fase de apoyo de la marcha","Para permitir la flexión al sentarse","Para subir escaleras con barandilla","En la fase de oscilación de la marcha"],"correcta":1,"explicacion":"Se bloquea para mantener la rodilla rígida al caminar y se desbloquea para permitir la flexión cuando el paciente se sienta.","por_opcion":["❌ Al caminar permanece bloqueada.","✅ Se desbloquea al sentarse.","❌ No es la situación descrita en el temario.","❌ Al caminar permanece bloqueada."]},{"pregunta":"Paciente con secuelas de mielomeningocele que no puede mantenerse de pie sin ayuda ortésica, en fase inicial de verticalización. ¿Qué dispositivo describe el temario para este caso?","opciones":["Parapodium","Bastones ingleses con contera articulada","Andador con ruedas","Bitutor largo con articulación libre"],"correcta":0,"explicacion":"El parapodium se indica en grandes déficits motores paralíticos en los que sin la órtesis son imposibles la bipedestación y la marcha, y ayuda al equilibrio en las primeras fases de verticalización.","por_opcion":["✅ Gran aparato de marcha para la verticalización.","❌ Requieren un control que este paciente no tiene.","❌ Requiere capacidad de bipedestación y equilibrio.","❌ La articulación libre es para debilidad leve o inestabilidad moderada."]},{"pregunta":"¿Cuál de estas es indicación de un solo bastón y no de dos?","opciones":["Esguinces graves bilaterales de tobillo","Parálisis bilateral de la musculatura de la raíz del miembro","Descarga parcial de ambas extremidades tras una fractura","Desequilibrio de la marcha en un hemipléjico"],"correcta":3,"explicacion":"Un bastón se indica en parálisis unilaterales de la raíz del miembro (glúteo mayor, tríceps sural), desequilibrios de hemipléjicos y descarga parcial de una articulación; las situaciones bilaterales requieren dos.","por_opcion":["❌ Situación bilateral: dos bastones.","❌ La afectación bilateral requiere dos bastones.","❌ La descarga de ambas extremidades requiere dos bastones.","✅ Hemipléjicos: un bastón."]},{"pregunta":"Sobre el ajuste del bastón inglés, ¿qué afirmación es correcta?","opciones":["El segmento del antebrazo está inclinado 30° sobre la vertical","La caña es fija y la regulación se hace en la abrazadera","La empuñadura se coloca con el codo a 90° en todos los pacientes","La abrazadera se sitúa en la cara anterior, a 10 cm del codo"],"correcta":0,"explicacion":"La abrazadera va en la parte posterior proximal del antebrazo, a 5 cm del codo; el segmento antebraquial está inclinado 30°; la caña es metálica y regulable. El codo a 90° solo se usa en poliartríticos o parálisis del tríceps.","por_opcion":["✅ Inclinación de 30° sobre la vertical.","❌ La caña es regulable en altura.","❌ Solo en poliartríticos o parálisis del tríceps braquial.","❌ Es posterior y a 5 cm del codo."]},{"pregunta":"Paciente con prótesis de rodilla derecha que usa un bastón. ¿Cuál es la técnica correcta?","opciones":["Bastón en la mano derecha, avanzando con la pierna derecha","Bastón en la mano izquierda, avanzando antes que ambas piernas","Bastón en la mano derecha, avanzando con la pierna izquierda","Bastón en la mano izquierda, avanzando con la pierna derecha"],"correcta":3,"explicacion":"El bastón se lleva en el lado contralateral al afectado y se adelanta a la vez que la pierna afectada para repartir la carga; después avanza la pierna sana.","por_opcion":["❌ El bastón no va en el lado afectado.","❌ El bastón avanza junto con la pierna afectada, no solo.","❌ Lado homolateral e incorrecto acoplamiento.","✅ Contralateral y a la vez que la pierna afectada."]}],"asignatura":"Ortesis","tema":7,"fecha":"2026-11-10"}</script>

const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
