<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 8: Órtesis y prótesis en el deporte · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 8: Órtesis y prótesis en el deporte","subtitulo":"Juegos Paralímpicos y marco normativo, deficiencias elegibles y clasificación funcional (ejemplo de la natación y del paratriatlón), prótesis deportivas y estudio Brüggemann, órtesis deportivas más frecuentes y ética del dopaje tecnológico.","resumen":["**«La misma deficiencia no produce la misma limitación en todos los deportes»**: la clasificación paralímpica es **específica de cada deporte** y la indicación ortoprotésica también debe serlo.","Los Juegos Paralímpicos nacen en **1948** como Juegos de **Stoke Mandeville** de **Sir Ludwig Guttmann**; el **IPC** fija las bases de la clasificación y cada Federación Internacional adapta su sistema al **Código de Clasificación** y decide el **Criterio de Mínima Deficiencia**.","Hay **10 deficiencias elegibles** (8 físicas: hipertonía, atetosis, ataxia, potencia muscular, rango pasivo, deficiencia de extremidad, diferencia de longitud de piernas, baja estatura; más **visual** e **intelectual**) que pasan **tres filtros**: deficiencia elegible, criterio mínimo y clase deportiva.","En natación paralímpica las clases **S1-S10/SB1-SB9** son físicas (S1 = mayor limitación), **11-13** visuales y **14** intelectual; el prefijo **S** (libre, espalda, mariposa), **SB** (braza) y **SM** (estilos) explica que un nadador pueda ser **S9 y SB8**.","El **estudio Brüggemann** sobre **Pistorius** mostró **~25 % menos gasto energético**, **igual resistencia al sprint** y una **mecánica distinta** (menos fuerza, durante más tiempo y con más frecuencia); las órtesis deportivas son **ligeras, fáciles de colocar y adaptadas al reglamento**, y el **dopaje tecnológico** (LZR Racer, Vaporfly) plantea dilemas éticos."],"objetivos":["Conocer el origen de los Juegos Paralímpicos y el marco legal y reglamentario de la clasificación.","Explicar las 10 deficiencias elegibles y los tres filtros de clasificación (elegibilidad, criterio mínimo, clase).","Interpretar las clases de la natación paralímpica (S, SB, SM; físicas, visuales, intelectual) y del paratriatlón.","Analizar los resultados del estudio Brüggemann y el debate ético sobre prótesis y dopaje tecnológico.","Identificar las órtesis deportivas más frecuentes por región corporal y sus requisitos."],"ideas_clave":["La clasificación paralímpica se basa en el **impacto funcional** en el deporte, **no en el diagnóstico**.","Tres filtros: ¿**deficiencia elegible** en ese deporte? → ¿alcanza el **criterio mínimo**? → ¿qué **clase deportiva** según su impacto?","Algunos deportes son para un solo tipo de deficiencia (**goalball**: solo visual); atletismo y natación admiten las **10**.","Natación: S1-S10 / SB1-SB9 físicas; S/SB11-13 visuales (**S11 con gafas opacas y tapper obligatorio**); S/SB14 intelectual. El número **no compara gravedad** entre grupos.","Prótesis más usadas en **ciclismo, salto de longitud y carrera**; órtesis en **todos** los deportes.","Brüggemann: gasto energético **~25 % menor**, resistencia al sprint **igual**, mecánica de carrera **diferente**.","Sin prótesis, la energía elástica la aporta el **tendón de Aquiles**; con prótesis de carbono, **glúteo + cuádriceps** y la lámina devuelve energía como **resorte**.","Dopaje tecnológico: **LZR Racer** (2008, **93 récords** en 2 años, prohibido en **2010**) y **Nike Vaporfly** (2020, ventaja del **4 %**, 3 placas de carbono)."],"secciones":[{"id":"juegos-paralimpicos","titulo":"Juegos Paralímpicos y marco normativo","bloques":[{"tipo":"parrafo","texto":"La idea rectora del tema es que **la misma deficiencia no produce la misma limitación en todos los deportes**: por eso la clasificación es específica de cada deporte, y la prescripción de una órtesis o prótesis deportiva también. La práctica regular de deporte aporta **beneficios físicos y psicológicos** a las personas amputadas; el deporte debe incluirse en los programas de **rehabilitación**, animando a mantener una vida activa tras el alta, e iniciarse en una **fase temprana** para mejorar la autonomía y la calidad de vida (Bragaru et al., 2011)."},{"tipo":"tabla","titulo":"Historia de los Juegos Paralímpicos","columnas":["Hito","Dato"],"filas":[["Origen","Juegos de **Stoke Mandeville** en silla de ruedas (Inglaterra), **1948**, por **Sir Ludwig Guttmann** para veteranos heridos de la **II Guerra Mundial**"],["Internacionalización","Cuatro años después llegan participantes de los **Países Bajos**: primera marca de movimiento internacional"],["Mismo año que los Olímpicos","Salvo las primeras ediciones, siempre"],["Mismas sedes","Desde **Seúl 1988** (verano) y **Albertville 1992** (invierno)"]]},{"tipo":"dato","valor":"1948","texto":"Año de los primeros Juegos de Stoke Mandeville, origen de los Juegos Paralímpicos."},{"tipo":"tabla","titulo":"Marco vigente: ley, código y reglamento","columnas":["Nivel","Norma","Función"],"filas":[["1 · Derechos","**Ley 39/2022 del Deporte** y **RDL 1/2013**","Inclusión, igualdad, accesibilidad y ajustes razonables: la ley **reconoce derechos**"],["2 · Gobernanza","**Código de Clasificación IPC 2025** y estándares internacionales","Bases de la clasificación"],["3 · Deporte","Reglas de clasificación y competición (p. ej. **World Para Swimming**, febrero 2026)","La federación **regula la competición**"],["4 · Aplicación","Cada **FEDDF**: convocatoria, lista de clases y estatus","La clasificación asigna **elegibilidad, clase y estatus**"]]},{"tipo":"tarjetas","items":[{"etiqueta":"IPC","titulo":"Comité Paralímpico Internacional","texto":"Estipula las **bases conceptuales** (investigación) y prácticas de la clasificación en todos los deportes paralímpicos."},{"etiqueta":"FI","titulo":"Federación Internacional","texto":"Revisa el sistema de **su** deporte, lo adapta al **Código de Clasificación (IPC, 2015)** y decide qué deficiencias pueden competir (**Criterio de Mínima Deficiencia**)."},{"etiqueta":"FN","titulo":"Federación Deportiva Nacional","texto":"Fija el reglamento competitivo **nacional**, distinto de la clasificación internacional."}]},{"tipo":"alerta","texto":"Los sistemas de clasificación son **diferentes en cada deporte** paralímpico (salvo excepciones donde perviven los sistemas **médicos**). No existe una clase «universal» que el deportista lleve de un deporte a otro."}]},{"id":"clasificacion","titulo":"Del diagnóstico a la participación: deficiencias elegibles y filtros","bloques":[{"tipo":"esquema","titulo":"Del diagnóstico a la clase deportiva","mermaid":"flowchart LR\n  A[\"Condicion de salud: diagnostico\"] --> B[\"Deficiencia: tipo elegible\"]\n  B --> C[\"Impacto: limitacion en la tarea\"]\n  C --> D[\"Adaptacion: tecnica, entorno, producto\"]\n  D --> E[\"Regla: clase y equipamiento\"]\n  B --> F{\"Tres filtros\"}\n  F -->|\"1\"| G[\"Deficiencia elegible en ese deporte\"]\n  F -->|\"2\"| H[\"Criterio minimo\"]\n  F -->|\"3\"| I[\"Clase deportiva\"]","pie":"Cinco preguntas encadenadas; la deficiencia debe superar los tres filtros para competir en una clase."},{"tipo":"parrafo","texto":"El enfoque es funcional y sigue el modelo **función corporal → actividad → participación → contexto**: fuerza, rango, control y sensibilidad condicionan actividades (nadar, caminar, transferirse, correr), que permiten participar (entrenar, competir, ocio) dentro de un contexto (reglas, instalación, agua, coste y apoyo). **El éxito no es «llevar un dispositivo»**, sino participar con **seguridad, autonomía y rendimiento significativo**. No todos los deportes tienen una categoría predeterminada para ciertas deficiencias."},{"tipo":"tabla","titulo":"Las 10 deficiencias elegibles (IPC)","columnas":["Grupo","Deficiencia (abreviatura)","Ejemplo"],"filas":[["Física","Deficiente **potencia muscular** (DPM)","Lesión medular, distrofias, pospolio"],["Física","Deficiencia de **extremidad** (DE)","Amputación o ausencia congénita"],["Física","Diferencia de **longitud de piernas** (DLP)","Alteración congénita o traumática"],["Física","**Baja estatura** (BE)","Acondroplasia"],["Física","Deficiente **rango pasivo** de movimiento (ROM)","Contracturas, artrogriposis"],["Física","**Hipertonía** (Hip)","Lesión del SNC"],["Física","**Ataxia** (Ata)","Movimiento descoordinado"],["Física","**Atetosis** (Ate)","Movimientos involuntarios lentos"],["Visual","Deficiencia visual (DV)","Ojo, nervio/vías ópticas o corteza"],["Intelectual","Discapacidad intelectual (DI)","Funcionamiento y conducta adaptativa"]]},{"tipo":"figura","pagina":12,"pie":"Tabla del IPC: deficiencias elegibles por deporte paralímpico. Observa que atletismo y natación abren casi todas las columnas, mientras que goalball solo admite deficiencia visual.","src":"img/ortesis-t8-tema-8-ortesis-y-protesis-en-el-deporte-p12.jpg"},{"tipo":"dato","valor":"10 deficiencias","texto":"8 físicas + visual + intelectual. **Goalball** solo admite deficiencia **visual**; **atletismo y natación**, las 10."},{"tipo":"alerta","texto":"En el temario, la **baja estatura** y la **diferencia de longitud de piernas** son deficiencias **físicas** elegibles, no «otras». Y la **discapacidad intelectual** sí es elegible (S14 en natación)."}]},{"id":"natacion-paratriatlon","titulo":"Ejemplo: natación paralímpica y paratriatlón","bloques":[{"tipo":"tabla","titulo":"Cómo se asigna una clase en natación paralímpica","columnas":["Paso","Contenido"],"filas":[["1. Documentación","Condición de salud y diagnóstico"],["2. Evaluación física","Fuerza, rango, coordinación y medidas: **primer orden**, cuantifica la funcionalidad"],["3. Evaluación en agua","Impacto sobre las técnicas de nado: **segundo orden** pero necesaria"],["4. Observación en competición","Confirmación"],["5. Clase y estatus","Confirmada o **revisable** cuando las reglas lo requieran"]]},{"tipo":"alerta","texto":"El tema advierte de un **sesgo de disfuncionalidad forzada consciente**: algunos deportistas exageran su limitación para obtener una **clase más baja** y optar a **ayudas económicas** y mayor éxito. Por eso existe la observación en competición y el estatus revisable."},{"tipo":"tarjetas","items":[{"etiqueta":"Transiciones","titulo":"Salida, viraje, llegada","texto":"Salida, viraje, impulso de pared y llegada."},{"etiqueta":"Posición","titulo":"Alineación","texto":"Flotación, control de tronco y resistencia al avance."},{"etiqueta":"Propulsión","titulo":"Brazada y patada","texto":"Simetría, amplitud y continuidad."},{"etiqueta":"Coordinación","titulo":"Secuencia","texto":"Entre segmentos y capacidad de mantener la técnica."}]},{"tipo":"tabla","titulo":"Grupos de clases en natación","columnas":["Grupo","Clases","Claves"],"filas":[["Deficiencia física","**S1-S10 · SB1-SB9**","Depende del **impacto funcional**, no del diagnóstico; **S1-S4** mayor limitación, **S5-S7** intermedia, **S8-S10** menor limitación elegible"],["Deficiencia visual","**S/SB11-13**","**S11**: gafas opacas y **tapper** obligatorio"],["Deficiencia intelectual","**S/SB14**","La limitación afecta a procesos relevantes para el rendimiento"]]},{"tipo":"tabla","titulo":"Prefijos S, SB y SM","columnas":["Prefijo","Pruebas","Demanda técnica"],"filas":[["S","Libre, espalda, mariposa","Libre/espalda: propulsión alterna, rol del tronco, posibilidad de compensar entre segmentos; mariposa: acción simultánea, ondulación"],["SB","Braza","Patada simultánea con alta demanda de **simetría, rango y propulsión de miembros inferiores**"],["SM","Estilos individual","Índice calculado a partir de S y SB"]]},{"tipo":"tabla","titulo":"Ejemplos de nadadores","columnas":["Deportista","Clase","Deficiencia","Enseñanza"],"filas":[["Íñigo Llopis","S8 · SB8 · SM8","Diferencia congénita: fémur y brazo derechos más cortos","Efecto combinado de MS y MI; diagnósticos distintos pueden compartir clase"],["Sarai Gascón","S9 · SB9 · SM9","Ausencia congénita de mano y antebrazo izquierdos","Deficiencia unilateral de MS afecta tracción y simetría; S y SB coinciden. Fuera del agua: **prótesis transradial mioeléctrica** con mano biónica multiarticulada (Zeus V1)"],["Núria Marquès","S9 · **SB8** · SM9","Amputación de una pierna","La braza (patada) penaliza más la deficiencia de MI → clase SB más baja. Fuera del agua: **prótesis transfemoral**"]]},{"tipo":"alerta","texto":"El número **no compara gravedad entre grupos distintos**: un S12 (visual) no está «menos afectado» que un S5 (físico). Y dentro de las físicas, **cuanto menor el número, mayor la limitación**."},{"tipo":"tabla","titulo":"Paratriatlón: 9 clases en 3 familias","columnas":["Familia","Clases","Claves"],"filas":[["Silla","**PTWC1-2**","**Handbike** en ciclismo y silla de atletismo en carrera"],["Ambulantes con discapacidad física","**PTS2-5**","Pueden usar **prótesis** u otras adaptaciones autorizadas"],["Discapacidad visual","**PTVI1-3**","**Guía** durante la prueba y **tándem** en el ciclismo"]]},{"tipo":"figura","pagina":28,"pie":"Paratriatlón: handbike (PTWC), deportista ambulante con órtesis y muleta, y triatleta con prótesis de carrera (PTS).","src":"img/ortesis-t8-tema-8-ortesis-y-protesis-en-el-deporte-p28.jpg"},{"tipo":"perla","texto":"Un fisioterapeuta que trabaje con un nadador paralímpico debe analizar **cada estilo por separado**: una amputación de pierna puede apenas limitar el crol (S9) y limitar mucho más la braza (SB8). La planificación del entrenamiento y la valoración funcional se adaptan al estilo."}]},{"id":"protesis-deporte","titulo":"Prótesis en el deporte y estudio Brüggemann","bloques":[{"tipo":"parrafo","texto":"Los tres paradeportes en los que más se usan **prótesis** son el **ciclismo, el salto de longitud y la carrera**, mientras que las **órtesis** se usan en **todos** los deportes. Las prótesis deportivas se han especializado hacia la competición de alto nivel y cada deporte exige propiedades distintas."},{"tipo":"tabla","titulo":"Requisitos del dispositivo según el deporte","columnas":["Deporte","Qué debe aportar la órtesis/prótesis"],"filas":[["Carrera","**Almacenamiento y retorno de energía**, rigidez, altura, alineación"],["Ciclismo","Interfaz con el pedal, estabilidad, **liberación segura** y repetición del gesto"],["Deportes de raqueta","Terminal, ángulo, liberación, absorción y seguridad de contacto"],["Otros","Escalada, tiro con arco… también practicables con órtesis/prótesis"]]},{"tipo":"tabla","titulo":"Hitos con prótesis de carrera","columnas":["Atleta","Dato del tema"],"filas":[["Oscar Pistorius «Blade Runner»","**400 m en 45,44 s** (2012); autorizado para el Mundial de 2011 y los JJ. OO. de **Londres 2012**"],["Johannes Floors","Récord de 100 m en **10,54 s** (2019); récord mundial de 200 m (junio 2021) y oro en **Tokio 2021**"],["Markus Rehm","La federación alemana rechazó su participación con atletas sin discapacidad alegando que su pierna ortopédica le da **ventaja** (salto de longitud)"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Sin prótesis","titulo":"Tendón de Aquiles","texto":"Actúa como «prótesis» natural: almacena y devuelve energía con ayuda de gemelos y pie."},{"etiqueta":"Con prótesis","titulo":"Glúteo + cuádriceps","texto":"Generan la fuerza; la forma de la lámina de **carbono** permite llegar a la punta y **liberar la energía como un resorte**."}]},{"tipo":"tabla","titulo":"Estudio Brüggemann: tres hipótesis","columnas":["Hipótesis","Prueba","Resultado"],"filas":[["1. **Menor gasto energético** (menos masa por la doble amputación)","Pistorius vs 4 atletas sanos; test progresivo y discontinuo en cinta (**5-7 min** de carrera, **3-5 min** de descanso) hasta la fatiga; intercambio de gases","A la misma velocidad, **~25 % menos gasto energético**; tras cierta velocidad, correr con prótesis requiere menos energía adicional"],["2. **Mayor resistencia al sprint** (las prótesis no se fatigan)","Sprints de **3 a 300 s** en cinta","**Sin diferencias**: la velocidad máxima cae con la duración igual que en los sanos"],["3. **Mecánica de sprint similar** (prótesis que imitan el «resorte de choque»)","5 atletas, sprints de **2 a 10 m/s** y de 2 a 30 s en cinta con **plataforma de fuerza**","**Diferencias significativas**: fuerza al suelo **menor**, durante **más tiempo** y con **mayor frecuencia**"]]},{"tipo":"figura","pagina":37,"pie":"Curvas de fuerza vertical y horizontal frente al tiempo durante el sprint: compara la curva de Pistorius (pico más bajo y contacto más largo) con la del atleta sin discapacidad, y las fases de contacto, aire, reposicionamiento y zancada.","src":"img/ortesis-t8-tema-8-ortesis-y-protesis-en-el-deporte-p37.jpg"},{"tipo":"esquema","titulo":"Conclusión del estudio Brüggemann","mermaid":"flowchart TD\n  A[\"Estudio Bruggemann: Pistorius vs 4 sanos\"] --> B[\"Variables fisiologicas\"]\n  A --> C[\"Mecanica del sprint\"]\n  B --> B1[\"Gasto energetico 25 por ciento menor\"]\n  B --> B2[\"Resistencia al sprint igual\"]\n  C --> C1[\"Menos fuerza al suelo\"]\n  C --> C2[\"Mas tiempo de contacto y mas frecuencia\"]\n  C1 --> D[\"Velocidad maxima similar\"]\n  C2 --> D","pie":"Fisiología similar (salvo el menor gasto energético), mecánica distinta: compensa la menor fuerza con contactos más largos y frecuentes."},{"tipo":"dato","valor":"~25 %","texto":"Menor gasto energético de Pistorius corriendo a la misma velocidad que los velocistas sin discapacidad."},{"tipo":"alerta","texto":"Trampa: la hipótesis de que «las prótesis no se fatigan» y darían **más resistencia al sprint** **no se confirmó**. Lo que difiere es la **mecánica** (fuerza menor, contacto más largo, más frecuencia), y la conclusión global habla de variables fisiológicas **similares**."},{"tipo":"figura","pagina":39,"pie":"Selector de prótesis de Ottobock: elige componentes según nivel de amputación (transtibial o transfemoral), longitud y forma del muñón y grupo de usuario por nivel de actividad.","src":"img/ortesis-t8-tema-8-ortesis-y-protesis-en-el-deporte-p39.jpg"},{"tipo":"perla","texto":"Para orientar la elección de una prótesis deportiva el fisioterapeuta recoge los mismos datos que usa el selector de Ottobock: **nivel de amputación (TT/TF)**, **longitud del muñón** (corto, medio, largo), **forma** (cónico o cilíndrico) y **nivel de actividad** (moderadamente activo, activo, muy activo)."}]},{"id":"ortesis-deporte","titulo":"Órtesis en el deporte","bloques":[{"tipo":"definicion","termino":"Órtesis deportiva","texto":"Artículo creado **para el deporte o para cada deporte**: **más ligero**, **más fácil de colocar y adaptar**, y **adaptado a cada reglamento**."},{"tipo":"tabla","titulo":"Órtesis deportivas más frecuentes por región","columnas":["Región","Órtesis"],"filas":[["Mano y muñeca","Muñequeras, **finger-trapper**, órtesis de dedos"],["Codo","Codera, **bandas para epicondilitis**"],["Hombro","Clavicular, hombrera"],["Columna","Cinturón lumbar de halterofilia, protector de espalda (motocross)"],["Rodilla","Rodillera blanda, **banda rotuliana**"],["Tobillo y pie","Tobillera, corrector de hallux valgus, soporte para pie, **órtesis plantar**"],["Cara y nariz","Órtesis de protección facial"],["Boca y ojos","**Protector bucal**, gafas de protección"]]},{"tipo":"figura","pagina":44,"pie":"Órtesis de columna en el deporte: cinturón lumbar en halterofilia y protector dorsolumbar en motocross.","src":"img/ortesis-t8-tema-8-ortesis-y-protesis-en-el-deporte-p44.jpg"},{"tipo":"perla","texto":"Antes de prescribir una órtesis a un deportista federado, comprueba que el **reglamento** de su deporte la permite: el requisito «adaptado a cada reglamento» es tan importante como la ligereza o la facilidad de colocación."}]},{"id":"etica","titulo":"Ética y dopaje tecnológico","bloques":[{"tipo":"parrafo","texto":"Según **Howe (2017)**, la tecnología de movilidad que mejora el rendimiento beneficia a quienes pueden pasar por el proceso de **«robotización»**, pero **margina aún más** a los atletas que no usan tecnología en su rendimiento o **no pueden permitírsela económicamente**. Existe además controversia sobre la participación de atletas con prótesis en los Juegos **Olímpicos** frente a personas sin discapacidad (casos **Pistorius** y **Rehm**; Beckman et al., 2017; McNamee et al., 2021)."},{"tipo":"tabla","titulo":"Dopaje tecnológico","columnas":["Caso","Tecnología","Consecuencia"],"filas":[["Speedo **LZR Racer** (natación, **2008**)","Imita la piel de tiburón; **poliuretano** que mejora revestimiento y flotabilidad y reduce el arrastre por fricción","**93 récords del mundo en 2 años**; prohibido por la federación internacional en **2010**"],["Nike **Vaporfly** (running, **2020**)","**3 placas de fibra de carbono**: más rigidez a la flexión y saltos verticales más altos","Prohibidas en competición por una ventaja del **4 %**, sobre todo en larga distancia"]]},{"tipo":"dato","valor":"93 récords · 4 %","texto":"Récords mundiales con el LZR Racer en 2 años y ventaja atribuida a las Nike Vaporfly."},{"tipo":"alerta","texto":"No confundas fechas: el LZR Racer **aparece en 2008** y se **prohíbe en 2010**; las Vaporfly se prohíben en **2020**. El término «dopaje tecnológico» nace con el traje de natación."},{"tipo":"dato","valor":"45,44 s","texto":"Marca de Pistorius en 400 m (2012), base del debate sobre si sus prótesis daban ventaja."}]}],"caso_clinico":{"titulo":"Nadadora amputada transfemoral que quiere competir","presentacion":"Mujer de 22 años con amputación transfemoral derecha tras un accidente de tráfico hace dos años. Usa prótesis transfemoral en su vida diaria, nada a buen nivel y quiere iniciarse en natación paralímpica y quizá en paratriatlón. Acude al fisioterapeuta del club para orientar su preparación.","preguntas":[{"pregunta":"¿Qué filtros tiene que superar para competir en natación paralímpica?","respuesta":"Que su deficiencia (**deficiencia de extremidad**) sea **elegible** en natación, que alcance el **criterio mínimo** específico de natación y que, según su **impacto funcional**, se le asigne una **clase deportiva**, tras documentación, evaluación física, evaluación en agua y observación en competición."},{"pregunta":"¿Por qué podría tener una clase S distinta de su clase SB?","respuesta":"Porque la **braza (SB)** exige patada simultánea con alta demanda de **simetría, rango y propulsión de miembros inferiores**, que penaliza más la amputación de pierna que el crol, la espalda o la mariposa (S). Es el caso de Núria Marquès: **S9 · SB8**."},{"pregunta":"Si decide hacer paratriatlón, ¿en qué familia competirá y qué dispositivo podrá usar?","respuesta":"Como deportista **ambulante con discapacidad física** competiría en **PTS2-5**, donde puede usar **prótesis** u otras adaptaciones autorizadas; para la carrera, una prótesis de almacenamiento y retorno de energía, y para el ciclismo, una interfaz con el pedal estable y de liberación segura."}]},"preguntate":[{"pregunta":"¿Qué significa que «la misma deficiencia no produce la misma limitación en todos los deportes»?","respuesta":"Que el impacto de una deficiencia depende de las demandas del deporte; por eso la clasificación y la indicación ortoprotésica son específicas de cada deporte."},{"pregunta":"¿Quién creó los Juegos de Stoke Mandeville, cuándo y para quién?","respuesta":"Sir Ludwig Guttmann en 1948, para veteranos heridos de la Segunda Guerra Mundial, en silla de ruedas."},{"pregunta":"¿Qué papel tienen el IPC y las Federaciones Internacionales en la clasificación?","respuesta":"El IPC fija las bases conceptuales y prácticas; cada Federación Internacional adapta su sistema al Código de Clasificación y decide las deficiencias elegibles (Criterio de Mínima Deficiencia)."},{"pregunta":"Enumera las 10 deficiencias elegibles.","respuesta":"Hipertonía, ataxia, atetosis, deficiente potencia muscular, deficiente rango pasivo, deficiencia de extremidad, diferencia de longitud de piernas, baja estatura, deficiencia visual y discapacidad intelectual."},{"pregunta":"¿Cuáles son los tres filtros de clasificación?","respuesta":"Deficiencia elegible en ese deporte, criterio mínimo y clase deportiva según el impacto funcional."},{"pregunta":"¿Qué indican S, SB y SM en natación paralímpica?","respuesta":"S: libre, espalda y mariposa; SB: braza; SM: estilos individual, calculado a partir de S y SB."},{"pregunta":"¿Cuáles fueron las tres hipótesis del estudio Brüggemann y qué se confirmó?","respuesta":"Menor gasto energético (sí, ~25 %), mayor resistencia al sprint (no, sin diferencias) y mecánica similar (no, diferencias significativas)."},{"pregunta":"¿Cómo compensa Pistorius la menor fuerza aplicada al suelo?","respuesta":"Aplicándola durante más tiempo y con mayor frecuencia, lo que le permite una velocidad máxima similar."},{"pregunta":"¿Qué características comparten las órtesis deportivas?","respuesta":"Son más ligeras, fáciles de colocar y adaptar, y adaptadas al reglamento de cada deporte."},{"pregunta":"¿Qué es el dopaje tecnológico? Pon dos ejemplos.","respuesta":"Ventaja de rendimiento obtenida por la tecnología del equipamiento: el traje LZR Racer (93 récords, prohibido en 2010) y las Nike Vaporfly (ventaja del 4 %, prohibidas en 2020)."}],"glosario":[{"termino":"IPC","definicion":"International Paralympic Committee: establece las bases de la clasificación en el deporte paralímpico."},{"termino":"Criterio de Mínima Deficiencia","definicion":"Umbral específico de cada deporte que la deficiencia debe alcanzar para ser elegible."},{"termino":"Clase deportiva","definicion":"Categoría asignada según el impacto funcional de la deficiencia en el rendimiento de ese deporte."},{"termino":"S / SB / SM","definicion":"Prefijos de clase en natación: estilos libre, espalda y mariposa / braza / estilos individual."},{"termino":"Tapper","definicion":"Persona que avisa al nadador ciego (S11) de la llegada a la pared; obligatorio en S11."},{"termino":"PTWC, PTS, PTVI","definicion":"Familias de clases del paratriatlón: silla, ambulantes con discapacidad física y discapacidad visual."},{"termino":"Disfuncionalidad forzada","definicion":"Exageración consciente de la limitación para lograr una clase más baja."},{"termino":"Prótesis transradial mioeléctrica","definicion":"Prótesis de antebrazo de potencia externa controlada por señales musculares."},{"termino":"Estudio Brüggemann","definicion":"Análisis biomecánico y fisiológico de Pistorius frente a velocistas sin discapacidad."},{"termino":"Dopaje tecnológico","definicion":"Ventaja deportiva obtenida mediante la tecnología del equipamiento."},{"termino":"Finger-trapper","definicion":"Órtesis deportiva de dedos de la mano."}],"fuentes":["L'histoire des Jeux Paralympiques (2017)","IPC (2015). Código de Clasificación de Deportistas","Bragaru et al. (2011)","Howe, D. P. (2017)","Beckman, E. M., Connick, M. J., McNamee, M. J., Parnell, R., & Tweedy, S. M. (2017). Should Markus Rehm be permitted to compete in the long jump at the Olympic Games? British Journal of Sports Medicine, 51(14), 1048-1049","McNamee, M., Parnell, R., & Vanlandewijck, Y. (2021). Fairness, technology and the ethics of Paralympic sport classification. European Journal of Sport Science, 21(11), 1510-1517","Estudio Brüggemann (citado en el tema)","Ley 39/2022 del Deporte; RDL 1/2013"],"qcm":[{"pregunta":"¿Cuál es el origen de los Juegos Paralímpicos según el tema?","opciones":["Juegos de Roma de 1960, del Comité Olímpico","Juegos de Stoke Mandeville de 1948, de Ludwig Guttmann","Juegos de Albertville de 1992, primeros de invierno","Juegos de Seúl de 1988, primera sede compartida"],"correcta":1,"explicacion":"Los Juegos Paralímpicos eran antes los Juegos de Stoke Mandeville en silla de ruedas, creados en 1948 por Sir Ludwig Guttmann para veteranos heridos de la Segunda Guerra Mundial.","por_opcion":["❌ No es el origen que recoge el tema.","✅ Stoke Mandeville, 1948, Guttmann.","❌ Albertville 1992 marca las sedes compartidas en invierno.","❌ Seúl 1988 marca el inicio de las sedes compartidas en verano, no el origen."]},{"pregunta":"¿Quién decide qué deficiencias elegibles pueden competir en un deporte paralímpico concreto?","opciones":["La Federación Deportiva Nacional de cada país","Cada Federación Internacional, aplicando el Criterio de Mínima Deficiencia","El Tribunal de Arbitraje del Deporte","El Comité Paralímpico Internacional directamente"],"correcta":1,"explicacion":"El IPC fija las bases conceptuales y prácticas, pero cada Federación Internacional revisa el sistema de su deporte, lo adapta al Código de Clasificación y decide qué deficiencias pueden competir (Criterio de Mínima Deficiencia).","por_opcion":["❌ La federación nacional fija el reglamento competitivo nacional.","✅ La FI decide aplicando el Criterio de Mínima Deficiencia.","❌ El TAS intervino en el caso Pistorius, no en la elegibilidad.","❌ El IPC establece las bases, no la elegibilidad concreta de cada deporte."]},{"pregunta":"¿Cuál de estas afirmaciones sobre el marco normativo es correcta según el tema?","opciones":["El Código IPC regula la convocatoria nacional","La ley asigna la clase deportiva de cada atleta","La clasificación asigna elegibilidad, clase y estatus","La federación reconoce los derechos de inclusión"],"correcta":2,"explicacion":"El tema resume: la ley reconoce derechos; la federación regula la competición; la clasificación asigna elegibilidad, clase y estatus.","por_opcion":["❌ La convocatoria y la lista de clases corresponden a cada FEDDF.","❌ La ley (Ley 39/2022, RDL 1/2013) reconoce derechos.","✅ Función de la clasificación.","❌ La federación regula la competición."]},{"pregunta":"¿Qué deporte paralímpico cita el tema como diseñado para un solo tipo de deficiencia?","opciones":["Goalball","Boccia","Natación","Atletismo"],"correcta":0,"explicacion":"El goalball es solo para deportistas con deficiencia visual; atletismo y natación están abiertos a las 10 deficiencias elegibles.","por_opcion":["✅ Goalball: solo deficiencia visual.","❌ No es el ejemplo del tema.","❌ La natación admite las 10 deficiencias.","❌ El atletismo admite las 10 deficiencias."]},{"pregunta":"¿Cuál de las siguientes NO figura entre las deficiencias físicas elegibles del IPC?","opciones":["Baja estatura","Diferencia en la longitud de piernas","Dolor crónico musculoesquelético","Deficiente rango de movimiento pasivo"],"correcta":2,"explicacion":"Las ocho deficiencias físicas elegibles son hipertonía, atetosis, ataxia, deficiente potencia muscular, deficiente rango pasivo, deficiencia de extremidad, diferencia de longitud de piernas y baja estatura.","por_opcion":["❌ Es deficiencia física elegible (BE).","❌ Es deficiencia física elegible (DLP).","✅ El dolor crónico no está entre las deficiencias elegibles.","❌ Es deficiencia física elegible (ROM)."]},{"pregunta":"En la asignación de una clase de natación paralímpica, ¿cómo se ordenan las evaluaciones según el tema?","opciones":["La observación en competición sustituye a la evaluación física","La evaluación en agua es de primer orden y la física, opcional","La evaluación física es de primer orden y la evaluación en agua, de segundo orden pero necesaria","Basta la documentación diagnóstica para asignar la clase"],"correcta":2,"explicacion":"Las evaluaciones físicas son de primer orden para cuantificar funcionalidad, pero es necesario, de segundo orden, evaluar en el agua el estilo de nado; después se observa en competición y se asigna clase y estatus.","por_opcion":["❌ La observación en competición confirma, no sustituye.","❌ Invierte el orden del tema.","✅ Física de primer orden; agua de segundo orden pero necesaria.","❌ La clase depende del impacto funcional, no solo del diagnóstico."]},{"pregunta":"¿Qué sesgo describe el tema en la clasificación paralímpica?","opciones":["Disfuncionalidad forzada consciente para obtener clases más bajas","Infravalorar la deficiencia visual frente a la física","Sobreestimar la función para competir en clases superiores","Clasificar según el diagnóstico en lugar del impacto"],"correcta":0,"explicacion":"Existe un sesgo de disfuncionalidad forzada consciente para conseguir clasificaciones más bajas y optar a ayudas económicas y mayor éxito deportivo.","por_opcion":["✅ Disfuncionalidad forzada consciente.","❌ El tema no describe este sesgo.","❌ El incentivo es el contrario: clases más bajas.","❌ Es un error de concepto, no el sesgo descrito."]},{"pregunta":"Un nadador ciego total compite en S11. ¿Qué es obligatorio para él?","opciones":["Salida desde dentro del agua","Guía atado por la muñeca","Bañador sin poliuretano homologado","Gafas opacas y tapper"],"correcta":3,"explicacion":"En natación, S11 usa gafas opacas y tapper obligatorio; las clases visuales son S/SB11-13.","por_opcion":["❌ No es el requisito del tema.","❌ El guía es propio del paratriatlón visual (PTVI).","❌ No es el requisito de la clase S11.","✅ S11: gafas opacas y tapper obligatorio."]},{"pregunta":"¿Por qué Núria Marquès, amputada de una pierna, es S9 pero SB8?","opciones":["Porque la braza exige patada simultánea con gran simetría y propulsión de miembros inferiores","Porque la clase SB solo se usa en deficiencias de miembro superior","Porque la clase SM obliga a bajar un punto la clase de braza","Porque en braza se compara con nadadores con deficiencia visual"],"correcta":0,"explicacion":"La braza (SB) exige una patada simultánea con elevada demanda de simetría, rango y propulsión de los miembros inferiores; una deficiencia de MI la penaliza más que los estilos S, por lo que su clase SB es más baja.","por_opcion":["✅ Demanda de patada simétrica en braza.","❌ SB se aplica a cualquier deficiencia física en braza.","❌ SM se calcula a partir de S y SB, no las modifica.","❌ Las clases visuales son 11-13, un grupo distinto."]},{"pregunta":"En paratriatlón, ¿qué familia de clases incluye a deportistas ambulantes que pueden usar prótesis?","opciones":["PTHC1-2","PTWC1-2","PTVI1-3","PTS2-5"],"correcta":3,"explicacion":"El paratriatlón tiene nueve clases en tres familias: PTWC1-2 (silla, handbike), PTS2-5 (ambulantes con discapacidad física, pueden usar prótesis u otras adaptaciones autorizadas) y PTVI1-3 (visual, con guía y tándem).","por_opcion":["❌ No es una familia del paratriatlón en el tema.","❌ PTWC compite en silla y handbike.","❌ PTVI: discapacidad visual con guía.","✅ PTS2-5: ambulantes, pueden usar prótesis."]},{"pregunta":"En los tres paradeportes en los que más se usan prótesis según el tema, NO se incluye:","opciones":["La carrera","La natación","El ciclismo","El salto de longitud"],"correcta":1,"explicacion":"Los tres paradeportes en los que más se usan prótesis son el ciclismo, el salto de longitud y la carrera; las órtesis, en cambio, se usan en todos los deportes.","por_opcion":["❌ La carrera es uno de los tres.","✅ La natación no está entre ellos: se nada sin prótesis.","❌ El ciclismo es uno de los tres.","❌ El salto de longitud es uno de los tres."]},{"pregunta":"En el estudio Brüggemann, ¿qué hipótesis NO se confirmó?","opciones":["Que Pistorius mantendría mayor resistencia al sprint","Que Pistorius tendría menor gasto energético corriendo","Que el contacto con el suelo sería más prolongado","Que existirían diferencias en la fuerza aplicada al suelo"],"correcta":0,"explicacion":"Se esperaba que, al no fatigarse las prótesis, mantuviera un mayor porcentaje de su velocidad máxima, pero no hubo diferencias en la resistencia al sprint. Sí se confirmó un gasto energético ~25 % menor y diferencias mecánicas.","por_opcion":["✅ Sin diferencias en resistencia al sprint.","❌ Se confirmó: ~25 % menos gasto energético.","❌ Sí: contacto más largo y mayor frecuencia.","❌ Sí hubo diferencias: fuerza menor."]},{"pregunta":"Según Brüggemann, ¿cómo aplica la fuerza un atleta con dos prótesis frente a un atleta sin discapacidad?","opciones":["Igual fuerza, menos tiempo y mayor frecuencia","Mayor fuerza, menos tiempo y menor frecuencia","Mayor fuerza, más tiempo y menor frecuencia","Menor fuerza, más tiempo y mayor frecuencia"],"correcta":3,"explicacion":"El atleta con dos prótesis aplica una fuerza menor al suelo, pero durante más tiempo y con mayor frecuencia; esta compensación le permite alcanzar una velocidad máxima similar.","por_opcion":["❌ La fuerza es menor y el contacto más largo.","❌ Invierte los tres parámetros.","❌ La fuerza es menor y la frecuencia mayor.","✅ Menor fuerza, más tiempo, mayor frecuencia."]},{"pregunta":"En la carrera con prótesis de carbono, ¿de dónde procede principalmente la energía según el tema?","opciones":["Del tibial anterior y la musculatura intrínseca del pie","Del tendón de Aquiles y los gemelos","De los isquiotibiales y el psoas exclusivamente","De glúteo y cuádriceps, con retorno elástico de la lámina"],"correcta":3,"explicacion":"Sin prótesis el tendón de Aquiles actúa como «prótesis» con ayuda de gemelos y pie; con prótesis la fuerza viene de glúteo y cuádriceps y la forma de la lámina permite llegar a la punta y liberar la energía como un resorte.","por_opcion":["❌ No es la fuente que cita el tema.","❌ Es la fuente de energía sin prótesis.","❌ No es la fuente que cita el tema.","✅ Glúteo + cuádriceps y efecto resorte de la lámina."]},{"pregunta":"¿Qué dato sobre dopaje tecnológico es correcto según el tema?","opciones":["El LZR Racer permitió 93 récords mundiales y se prohibió en 2010","Las Nike Vaporfly se prohibieron en 2008 por una ventaja del 10 %","Las Vaporfly llevan una única placa de poliuretano","El LZR Racer estaba hecho de fibra de carbono para reducir arrastre"],"correcta":0,"explicacion":"El traje Speedo LZR Racer (2008), de poliuretano e inspirado en la piel de tiburón, permitió 93 récords del mundo en 2 años antes de su prohibición en 2010. Las Nike Vaporfly, con 3 placas de carbono, se prohibieron en 2020 por una ventaja del 4 %.","por_opcion":["✅ 93 récords en 2 años; prohibido en 2010.","❌ Las Vaporfly se prohibieron en 2020 por una ventaja del 4 %.","❌ Las Vaporfly llevan 3 placas de fibra de carbono.","❌ El LZR Racer era de poliuretano."]}],"asignatura":"Ortesis","tema":8,"fecha":"2026-11-10"}</script>

  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
