<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 9 · Amputaciones · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 9 · Amputaciones","subtitulo":"Etiología, niveles y técnicas de amputación, miembro fantasma y rehabilitación fisioterápica del amputado desde el preoperatorio hasta la fase protésica.","resumen":["La **amputación** es la pérdida total o parcial de un miembro; si se hace a nivel articular es una **desarticulación** y si es congénita se denomina **agenesia**.","La causa más frecuente es la **enfermedad vascular/arterial periférica (82 %)**, con la **diabetes mellitus** como gran factor de riesgo, seguida de los **traumatismos (22 %)** y los tumores (**4 %**).","En el traumatismo, la **escala MESS (Johansen, 1990)** puntúa lesión, shock, isquemia y edad: una puntuación **≥ 7** indica que puede ser necesaria la amputación.","En miembro inferior predomina la **transtibial (47 %)** sobre la **transfemoral (31 %)**; en miembro superior (**15 %** del total) la más importante es la **transradial (8 %)**, y cuanto más distal, más ROM se conserva.","La rehabilitación empieza **antes de la cirugía**, sigue con higiene, cicatriz, **vendaje distal→proximal** y prevención del **flexo**, y culmina en **4 fases protésicas** que van de las paralelas al terreno irregular."],"objetivos":["Definir amputación, desarticulación y agenesia, y enumerar las causas de amputación con sus porcentajes.","Aplicar la escala MESS e interpretar su punto de corte para indicar la amputación traumática.","Reconocer los niveles de amputación de miembro superior e inferior y sus frecuencias relativas.","Diferenciar dolor de miembro fantasma, sensación de miembro fantasma y dolor de muñón, y conocer la terapia de espejo.","Planificar el tratamiento fisioterápico pre, postoperatorio, preprotésico y protésico del paciente amputado."],"ideas_clave":["**Desarticulación** = amputación a la altura de una articulación; **agenesia** = ausencia congénita, no adquirida.","Causa n.º 1: **enfermedad vascular periférica (82 %)**; factores de riesgo: **diabetes, HTA, dislipemia, tabaco, isquemia crítica**.","Lesión traumática **severa** si se afectan **al menos 2 de los 4 sistemas** (óseo, vasculonervioso, musculotendinoso y piel); **MESS ≥ 7** sugiere amputar.","Cierres quirúrgicos: **miodesis** (músculo a hueso/periostio), **cierre miofascial** (músculo a fascia), **mioplastia** (músculo a su antagonista bajo tensión).","MI: **transtibial 47 %**, transfemoral 31 %; MS: **15 %** del total, **transradial** la más importante; **+ distal = + ROM**.","Dolor de miembro fantasma = **neuropático**, más severo en **amputaciones proximales**; distinto de la sensación fantasma (no dolorosa) y del dolor de muñón (localizado).","Vendaje del muñón: **de distal a proximal**, forma **cónica**, sin pliegues, recolocar cada **4–6 h** y nunca dormir con él muy apretado.","No siempre el muñón **más largo** es el mejor: debe ser estable, con buen balance articular, piel sana, extremos óseos biselados y sin neuromas."],"secciones":[{"id":"concepto","titulo":"Concepto de amputación y equipo multidisciplinar","bloques":[{"tipo":"definicion","termino":"Amputación","texto":"Pérdida de parte o de la totalidad de un miembro; extirpación total o parcial de un miembro o parte del cuerpo, generalmente **quirúrgica**, para tratar una condición médica o un trauma severo. Puede afectar a MS (brazo, antebrazo, mano), MI (muslo, pierna, pie), dedos o incluso partes internas dañadas."},{"tipo":"tarjetas","items":[{"etiqueta":"Adquirida","titulo":"Amputación","texto":"Sección a través de un segmento óseo (p. ej. transtibial, transhumeral)."},{"etiqueta":"Articular","titulo":"Desarticulación","texto":"La pérdida se produce **a la altura de la articulación** (p. ej. desarticulación de rodilla, de hombro)."},{"etiqueta":"Congénita","titulo":"Agenesia","texto":"Ausencia del miembro **no adquirida**, presente desde el nacimiento."}]},{"tipo":"parrafo","texto":"El objetivo final del abordaje no es solo cerrar el muñón, sino la **reinserción social del paciente**. Para ello interviene un **equipo multidisciplinar**: cirujano ortopédico/general, médico rehabilitador y fisioterapeuta, técnico ortopédico, psicólogo y asistente social. Cada uno actúa en un momento: el cirujano decide nivel y técnica de cierre, el fisioterapeuta prepara al paciente y el muñón, el técnico ortopédico adapta la prótesis y el psicólogo y el asistente social facilitan la aceptación y el retorno a la vida diaria."},{"tipo":"alerta","texto":"No confundas **desarticulación** (nivel articular, adquirida) con **agenesia** (congénita). Una desarticulación de rodilla en un adulto tras un accidente NO es una agenesia aunque «falte» la pierna desde la rodilla."}]},{"id":"etiologia","titulo":"Etiología de las amputaciones","bloques":[{"tipo":"parrafo","texto":"El temario resume la etiología con la cadena **EPV → diabetes mellitus → riesgo +++**: la patología vascular periférica, sobre todo en el diabético, es la vía que más amputaciones produce. Otras causas: traumatismos, quemaduras, oncología, infección, deformidad congénita, alteración neurológica y, raramente, motivos estéticos."},{"tipo":"tabla","titulo":"Principales causas de amputación","columnas":["Causa","Frecuencia (PDF)","Mecanismo / comentario"],"filas":[["Enfermedad vascular periférica (EVP) / arterial periférica (EAP)","**82 %** (la más frecuente)","Obstrucción del flujo arterial de MMII → isquemia → **necrosis**"],["Traumatismos","**22 %**","Accidentes de tráfico, laborales o militares que dañan irreversiblemente tejidos y hueso"],["Oncológica","**4 %** (España: 1–4 % de incidencia)","Tumores malignos óseos o de partes blandas no tratables por otros métodos"],["Infecciones graves","—","Gangrena o infección (p. ej. en el diabético) que no responde al tratamiento y necrosa el miembro"],["Deformidades congénitas","—","Anomalías desde el nacimiento que afectan a la funcionalidad y pueden acabar en extracción"]]},{"tipo":"dato","valor":"82 % · 22 % · 4 %","texto":"Porcentajes del PDF para causa vascular, traumática y oncológica respectivamente (la vascular es siempre la primera)."},{"tipo":"lista","items":["**Factores de riesgo de la amputación vascular:** diabetes mellitus, hipertensión, dislipemia (colesterol alto), tabaco e isquemia crítica.","**Amputación traumática primaria:** el propio traumatismo ha producido la amputación.","**Amputación traumática secundaria:** se realiza **a posteriori**, cuando no se ha podido salvar el miembro (gran lesión ósea, riesgo de infección, edad…).","**Oncológica:** típica de **tumores malignos sin metástasis en la adolescencia**; se busca evitar el dolor. Dos opciones: **cirugía conservadora** (más riesgo de infección y complicaciones) o **cirugía de amputación**."]},{"tipo":"esquema","titulo":"De la causa a la decisión de amputar","mermaid":"flowchart TD\n  A[\"Miembro comprometido\"] --> V[\"Vascular 82 por ciento\"]\n  A --> T[\"Traumatico 22 por ciento\"]\n  A --> O[\"Oncologico 4 por ciento\"]\n  V --> V1[\"DM, HTA, dislipemia, tabaco\"]\n  V1 --> V2[\"Obstruccion arterial e isquemia critica\"]\n  V2 --> N[\"Necrosis o gangrena\"]\n  T --> T1[\"Al menos 2 de 4 sistemas lesionados\"]\n  T1 --> T2[\"MESS mayor o igual a 7\"]\n  O --> O1[\"Tumor maligno sin metastasis\"]\n  O1 --> O2[\"Conservadora o amputacion\"]\n  N --> AM[\"Amputacion\"]\n  T2 --> AM\n  O2 --> AM","pie":"Las tres grandes vías que llevan a la amputación y el criterio clave de cada una."}]},{"id":"traumatica","titulo":"Amputación traumática y escala MESS","bloques":[{"tipo":"parrafo","texto":"Ante un traumatismo grave **se intenta salvar el miembro**, pero no siempre es posible. Todo miembro está formado por **4 sistemas**: óseo, vasculonervioso, musculotendinoso y piel. Se habla de **lesión severa** cuando se ven afectados **al menos 2 de estos 4 sistemas**. Para objetivar la decisión se usa la **MESS (Mangled Extremity Severity Score, Johansen et al., 1990)**, recogida por Combalía Aleu (2000) en la clasificación de fracturas abiertas."},{"tipo":"tabla","titulo":"Escala MESS (Mangled Extremity Severity Score)","columnas":["Componente","Categoría","Descripción","Puntos"],"filas":[["Lesión esquelética y de partes blandas","Baja energía","Herida punzante, fractura cerrada simple, HPAF de baja velocidad","1"],["","Mediana energía","Fractura expuesta o múltiple, luxación, aplastamiento","2"],["","Alta energía","Onda expansiva (corta distancia), HPAF de alta velocidad","3"],["","Aplastamiento masivo","Arrollamiento, ferrocarril, vehículo de transporte","4"],["Shock","Normotensión","Presión arterial estable","0"],["","Hipotensión transitoria","PA inestable, responde a líquidos IV","1"],["","Hipotensión prolongada","PAS \u003c 90 mmHg, no responde a líquidos IV en quirófano","2"],["Isquemia","No","Pulso presente, sin signos de isquemia","0*"],["","Leve","Disminución del pulso, sin signos de isquemia","1*"],["","Moderada","Sin pulso (doppler), relleno capilar lento, parestesia, menor actividad motriz","2*"],["","Avanzada","Sin pulso, frío, parálisis, entumecimiento","3*"],["Edad","\u003c 30 años","—","0"],["","30–50 años","—","1"],["","> 50 años","—","2"]]},{"tipo":"dato","valor":"MESS ≥ 7","texto":"Puntuación total a partir de la cual **puede ser necesaria una amputación**."},{"tipo":"alerta","texto":"En la MESS el **shock** puntúa de **0 a 2** y la **edad** también de **0 a 2**, mientras que la **lesión** va de **1 a 4** (nunca 0). El asterisco de la isquemia indica que esa puntuación se modifica según el tiempo de isquemia (clásicamente se **duplica si supera 6 h**, complemento)."},{"tipo":"definicion","termino":"HPAF","texto":"Herida por proyectil de arma de fuego; su velocidad (baja o alta) cambia la categoría de energía en la MESS."},{"tipo":"figura","pagina":9,"pie":"Tabla MESS completa: fíjate en las cuatro categorías (lesión, shock, isquemia, edad) y en el punto de corte de 7.","src":"img/ortesis-t9-tema-9-amputaciones-p9.jpg"},{"tipo":"perla","texto":"El temario muestra también el «contraejemplo» del **bitrasplante de piernas** (Hospital de Manises, Valencia) y el primer **trasplante bilateral de brazo y hombro** (Felix Gretarsson, enero 2021): la amputación no es siempre definitiva y el fisioterapeuta puede intervenir también en la reeducación tras un trasplante."}]},{"id":"cirugia","titulo":"Tipos de cirugía de cierre del muñón","bloques":[{"tipo":"parrafo","texto":"La forma en que el cirujano fija la musculatura seccionada determina la **estabilidad y el control** del muñón. Un músculo que queda libre se retrae, pierde palanca y deja el hueso mal acolchado; por eso se ancla a hueso, a fascia o a su antagonista."},{"tipo":"tabla","titulo":"Técnicas de cierre","columnas":["Técnica","Qué se une","Idea clave"],"filas":[["**Miodesis**","Músculo **al hueso o periostio**","Fijación más firme; conserva la palanca (p. ej. aductores en la transfemoral)"],["**Cierre miofascial**","Músculo **a la fascia**","Unión a planos fasciales"],["**Mioplastia**","Músculo **con su antagonista** u otro grupo muscular","Sutura **bajo tensión adecuada**; acolcha el extremo óseo"]]},{"tipo":"figura","pagina":12,"pie":"Miodesis de aductores en la amputación transfemoral y esquema de colgajos (miodesis frente a mioplastia).","src":"img/ortesis-t9-tema-9-amputaciones-p12.jpg"},{"tipo":"alerta","texto":"Trampa clásica: **mioplastia** ≠ **miodesis**. Mioplastia = músculo con músculo (antagonista); miodesis = músculo con hueso/periostio. El cierre miofascial es la opción intermedia: músculo con fascia."}]},{"id":"niveles","titulo":"Niveles de amputación","bloques":[{"tipo":"tabla","titulo":"Miembro superior (de proximal a distal)","columnas":["Nivel","Frecuencia (PDF)"],"filas":[["Interescapulotorácica","—"],["Desarticulación del hombro","1,5 %"],["Transhumeral","4 %"],["Desarticulación del codo","0,5 %"],["**Transradial**","**8 %**"],["Desarticulación de la muñeca","—"],["Mano entera","2 %"],["Parcial de mano, de un dedo o parcial de dedo","—"]]},{"tipo":"lista","items":["El **MS** supone el **15 %** de las amputaciones.","Afecta **indiferentemente** al lado dominante o no dominante.","La **transradial** es la más importante.","**+ distal = + ROM**: cuanto más distal el nivel, más movilidad y función se conservan."]},{"tipo":"tabla","titulo":"Miembro inferior (de proximal a distal)","columnas":["Nivel","Frecuencia (PDF)"],"filas":[["Hemipelvectomía y desarticulación de cadera","2 %"],["Transfemoral (por encima de la rodilla)","**31 %**"],["Desarticulación de rodilla","1 %"],["**Transtibial**","**47 %**"],["Amputación de **Syme** + **Pirogoff**","3 %"],["Parcial del pie (transmetatarsiana), del dedo gordo u otros dedos","—"]]},{"tipo":"dato","valor":"47 % / 31 %","texto":"Transtibial y transfemoral: los dos niveles más frecuentes del miembro inferior."},{"tipo":"figura","pagina":20,"pie":"Niveles de MI: amputación de dedos con ortoprótesis, prótesis transfemoral, muñón transtibial vendado y esquemas de Pirogoff y Syme (amputaciones a nivel del tobillo).","src":"img/ortesis-t9-tema-9-amputaciones-p20.jpg"},{"tipo":"perla","texto":"En el pie diabético la amputación suele empezar por dedos o transmetatarsiana; preservar la **rodilla** (transtibial frente a transfemoral) reduce mucho el gasto energético de la marcha protésica (complemento), de ahí la importancia de evitar el **flexo de rodilla** en el muñón transtibial."}]},{"id":"fantasma","titulo":"Miembro fantasma","bloques":[{"tipo":"parrafo","texto":"Históricamente, **Ambroise Paré** describió el «dolor tras amputación» en **1551** y **Weir Mitchell** acuñó el término «**miembro fantasma**» en **1864** (guerra civil americana). Hoy se distinguen tres fenómenos que el examen suele mezclar."},{"tipo":"tarjetas","items":[{"etiqueta":"Dolor","titulo":"Dolor de miembro fantasma","texto":"Dolor **neuropático** procedente del miembro **amputado**; **más severo en amputaciones proximales**."},{"etiqueta":"No dolor","titulo":"Sensación de miembro fantasma","texto":"Cualquier percepción **no dolorosa** del miembro amputado (picor, hormigueo, «zapatos estrechos»); puede ser tan molesta como el dolor."},{"etiqueta":"Muñón","titulo":"Dolor de muñón","texto":"Dolor **localizado en la extremidad residual**: prótesis mal colocada, traumatismo, insuficiencia vascular o **neuromas**."}]},{"tipo":"tabla","titulo":"Factores relacionados con el dolor de miembro fantasma","columnas":["Nivel","Factores"],"filas":[["Periféricos","Impulsos ectópicos del neuroma del muñón y del ganglio de la raíz dorsal; alteraciones estructurales del ganglio y del cuerno dorsal; conexiones no funcionales; activación simpática; regulación al alza/baja de neurotransmisores; alteración de canales; pérdida selectiva de fibras tipo C"],["Centrales","Reorganización cortical; desenmascaramiento de conexiones; neuroplasticidad; **incongruencia sensorial y motora**; alteraciones de la actividad glial y neuronal"],["Psicológicos","Reorganización de áreas afectivas del dolor: ínsula, giro cingulado anterior y corteza frontal"]]},{"tipo":"esquema","titulo":"Terapia de espejo: cómo reduce el dolor","mermaid":"flowchart LR\n  A[\"Espejo refleja el miembro sano\"] --> B[\"Ilusion optica de miembro intacto\"]\n  B --> C[\"Activa neuronas espejo\"]\n  C --> D[\"Feedback visual positivo\"]\n  D --> E[\"Cambios plasticos cerebrales\"]\n  E --> F[\"Corrige incongruencia sensoriomotora\"]\n  F --> G[\"Reduce el dolor fantasma\"]","pie":"Mecanismo de la terapia de espejo: tratamiento no farmacológico y de bajo coste."},{"tipo":"perla","texto":"La **terapia de espejo** es un tratamiento **no farmacológico y de bajo coste**, más eficaz en el **miembro superior** y en el **dolor somático profundo**: el paciente mueve el miembro sano frente al espejo mientras «ve» moverse el amputado."},{"tipo":"figura","pagina":24,"pie":"Tabla de factores periféricos, centrales y psicológicos del dolor fantasma e infografía de la terapia de espejo.","src":"img/ortesis-t9-tema-9-amputaciones-p24.jpg"},{"tipo":"alerta","texto":"Si el paciente refiere dolor **en el extremo del muñón** al apoyar en la prótesis, NO es dolor fantasma sino **dolor de muñón** (revisar encaje, piel, neuroma). El dolor fantasma se localiza en la parte **que ya no existe**."}]},{"id":"pre-post","titulo":"Tratamiento fisioterápico preoperatorio y postoperatorio","bloques":[{"tipo":"parrafo","texto":"La rehabilitación **se inicia antes de la amputación**: un paciente que llega a quirófano con buena capacidad cardiorrespiratoria, fuerza y conocimiento del proceso se rehabilita antes y mejor."},{"tipo":"lista","items":["**Preoperatorio:** terapia respiratoria y trabajo cardiorrespiratorio (respiración abdominodiafragmática, costal, acompañada de brazos); cambios de postura; vendaje de la zona que será amputada; aprendizaje del uso protésico y preparación mental; series intermitentes de movilizaciones (activas, pasivas) y estabilización/fortalecimiento de las extremidades."]},{"tipo":"tabla","titulo":"Postoperatorio y fase preprotésica","columnas":["Bloque","Pautas del temario"],"filas":[["1. Higiene diaria","Lavar con agua tibia y jabón neutro; secar sin frotar (toalla suave o gasa); piel limpia y seca; evitar cremas perfumadas o alcohol; revisar el muñón **cada día frente al espejo**"],["2. Cicatriz","Mantenerla flexible y **no adherida** a planos profundos (masaje suave una vez cicatrizada); evitar sol directo y fricción; **no usar prótesis hasta cierre completo** y sin infección"],["3. Moldeado y vendaje","Venda elástica/crepé o funda compresiva; objetivo: **forma cónica**, menos edema y preparar la piel a la presión; corregir posturas antiálgicas, evitar flexo, favorecer retorno venoso, activar musculatura"],["4. Preparación psicológica","Aceptación, expectativas realistas sobre la prótesis, apoyo si hay ansiedad, depresión o estrés postraumático"],["5. Ejercicio y fuerza","Fortalecer músculos proximales y postura; equilibrio y transferencia de peso; entrenar miembro contralateral y tronco"]]},{"tipo":"dato","valor":"Cada 4–6 h","texto":"Retirar y volver a colocar el vendaje del muñón (antes si se afloja); siempre de **distal a proximal**, sin pliegues ni presiones desiguales, y nunca dormir con él muy apretado."},{"tipo":"figura","pagina":30,"pie":"«Do not»: posturas a evitar (muñón colgando de la cama, almohada bajo la rodilla o entre los muslos, muñón apoyado en la muleta, abducción del muñón transfemoral, sentado con el muñón flexionado).","src":"img/ortesis-t9-tema-9-amputaciones-p30.jpg"},{"tipo":"alerta","texto":"La almohada **bajo la rodilla** del transtibial o **bajo la cadera/entre los muslos** del transfemoral parece cómoda pero produce **flexo** y abducción: contracturas que luego impiden encajar y usar la prótesis."},{"tipo":"perla","texto":"Al vendar, la presión debe ser **mayor en distal** y decreciente hacia proximal: un vendaje más apretado arriba actúa como torniquete, aumenta el edema distal y deforma el muñón en «reloj de arena»."}]},{"id":"munon-protesica","titulo":"Muñón ideal y fase protésica","bloques":[{"tipo":"parrafo","texto":"El muñón debe **encajarse en la prótesis e impulsarla**. Por eso no basta con que cicatrice: tiene que ser un brazo de palanca útil, estable y tolerante a la presión."},{"tipo":"lista","items":["**Nivel adecuado:** no siempre el muñón de mayor longitud es el mejor.","**Estable:** los grupos musculares de la articulación proximal deben estar equilibrados; si no, aparecen **actitudes viciosas** que dificultan la prótesis.","**Balance articular** conservado en las articulaciones proximales.","**Potencia muscular** óptima.","**Piel en buen estado**, sin úlceras ni injertos cutáneos.","**Biselado correcto** de los extremos óseos distales.","**Ausencia de neuromas** dolorosos."]},{"tipo":"esquema","titulo":"Progresión de la fase protésica","mermaid":"flowchart TD\n  P0[\"Munon cicatrizado, conico y sin dolor\"]\n  subgraph S1[\"Paralelas\"]\n  F1[\"Fase 1: poner y quitar protesis, cargar peso, patron de marcha\"] --> F2[\"Fase 2: marcha y postura entre paralelas, espejo, bastones\"]\n  end\n  subgraph S2[\"Fuera de paralelas\"]\n  F3[\"Fase 3: terreno plano, reducir ayudas\"] --> F4[\"Fase 4: terreno irregular, escaleras, rampas, sedestacion a bipedestacion\"]\n  end\n  P0 --> F1\n  F2 --> F3","pie":"Cuatro fases: de aprender a colocarse la prótesis a la marcha en terreno irregular."},{"tipo":"tabla","titulo":"Objetivos de cada fase protésica","columnas":["Fase","Objetivos"],"filas":[["Primera","Colocar y quitar la prótesis; transmitir el peso a la prótesis y mantener el equilibrio; establecer un patrón de marcha moviendo la prótesis con el muñón (fuerza interna); corrección postural frente al espejo (compensación con el tronco); repartir el peso en ambos miembros"],["Segunda","Dinámica de la marcha y postura **entre paralelas**; bipedestación frente al espejo; destreza con bastones; corregir fases de la marcha; carga alterna prótesis/pierna sana"],["Tercera","Marcha y postura **fuera de las paralelas**; incremento de marcha en **terreno plano**; **disminuir la ayuda ortopédica**"],["Cuarta","Marcha **en terreno irregular**; subir/bajar escalones y planos inclinados; pasar de sedestación a bipedestación desde distintas alturas y terrenos"]]},{"tipo":"perla","texto":"La fase protésica **solo comienza** cuando el muñón está **completamente cicatrizado, con forma adecuada y sin dolor**; empezar antes expone a ulceraciones y a dolor de muñón que retrasan todo el proceso."}]}],"caso_clinico":{"titulo":"Varón diabético con amputación transtibial","presentacion":"Hombre de 68 años, diabético tipo 2, fumador e hipertenso, con isquemia crítica y gangrena del antepié derecho. Se le realiza una amputación transtibial. A los 5 días el muñón está edematoso, el paciente pasa el día en la cama con una almohada bajo la rodilla y refiere «calambres en los dedos del pie que ya no tiene».","preguntas":[{"pregunta":"¿Qué etiología y factores de riesgo explican su amputación?","respuesta":"Etiología **vascular** (EVP/EAP, la causa más frecuente, 82 %), con **diabetes**, tabaco, HTA e isquemia crítica como factores de riesgo: la obstrucción arterial evolucionó a necrosis/gangrena."},{"pregunta":"¿Qué corregirías de su postura y de su manejo del edema?","respuesta":"Retirar la almohada bajo la rodilla (riesgo de **flexo** que impediría la prótesis), mantener la rodilla en extensión, vendaje elástico **de distal a proximal** con forma cónica, recolocado cada **4–6 h**, activación muscular y favorecer el retorno venoso."},{"pregunta":"¿Cómo clasificas sus «calambres en los dedos» y qué técnica podrías usar?","respuesta":"Es **dolor de miembro fantasma** (neuropático, en la parte amputada), no dolor de muñón. Puede abordarse con **terapia de espejo**, no farmacológica y de bajo coste, que crea una ilusión visual del miembro intacto y favorece la reorganización cortical."}]},"preguntate":[{"pregunta":"¿Qué diferencia una desarticulación de una agenesia?","respuesta":"La desarticulación es una amputación adquirida a nivel articular; la agenesia es una ausencia congénita, no adquirida."},{"pregunta":"¿Cuáles son los 4 sistemas de un miembro y cuándo se considera la lesión severa?","respuesta":"Óseo, vasculonervioso, musculotendinoso y piel; severa si se afectan al menos 2 de los 4."},{"pregunta":"¿Qué cuatro componentes puntúa la MESS y cuál es su punto de corte?","respuesta":"Lesión esquelética/partes blandas, shock, isquemia y edad; ≥ 7 indica posible amputación."},{"pregunta":"Diferencia amputación traumática primaria y secundaria.","respuesta":"Primaria: el traumatismo produce la amputación. Secundaria: se amputa a posteriori al no poder salvar el miembro."},{"pregunta":"Define miodesis, cierre miofascial y mioplastia.","respuesta":"Miodesis: músculo a hueso/periostio. Miofascial: músculo a fascia. Mioplastia: músculo con su antagonista bajo tensión adecuada."},{"pregunta":"¿Cuál es el nivel más frecuente en MI y cuál el más importante en MS?","respuesta":"En MI la transtibial (47 %); en MS la transradial (8 %)."},{"pregunta":"¿En qué se diferencian dolor fantasma, sensación fantasma y dolor de muñón?","respuesta":"Dolor fantasma: neuropático en la parte amputada. Sensación fantasma: percepción no dolorosa. Dolor de muñón: localizado en la extremidad residual (prótesis, neuroma, vascular)."},{"pregunta":"Enumera las reglas del vendaje del muñón.","respuesta":"De distal a proximal, sin pliegues ni presión desigual, recolocar cada 4–6 h o si se afloja, nunca dormir con él muy apretado; busca forma cónica y menos edema."},{"pregunta":"¿Qué características debe tener un muñón adecuado?","respuesta":"Nivel adecuado (no necesariamente el más largo), estable, balance articular y fuerza conservados, piel sana, extremos óseos biselados y sin neuromas dolorosos."},{"pregunta":"¿Qué diferencia la tercera de la cuarta fase protésica?","respuesta":"La tercera trabaja fuera de paralelas en terreno plano reduciendo ayudas; la cuarta añade terreno irregular, escaleras, rampas y transferencias desde distintas alturas."}],"glosario":[{"termino":"Amputación","definicion":"Pérdida total o parcial de un miembro, generalmente quirúrgica."},{"termino":"Desarticulación","definicion":"Amputación realizada a la altura de una articulación."},{"termino":"Agenesia","definicion":"Ausencia congénita, no adquirida, de un miembro o segmento."},{"termino":"MESS","definicion":"Mangled Extremity Severity Score (Johansen, 1990): escala para decidir la amputación en el miembro catastrófico; ≥ 7 sugiere amputar."},{"termino":"Miodesis","definicion":"Fijación del músculo seccionado al hueso o al periostio."},{"termino":"Mioplastia","definicion":"Sutura de un músculo con su antagonista u otro grupo muscular bajo tensión adecuada."},{"termino":"Cierre miofascial","definicion":"Unión del músculo a la fascia."},{"termino":"Muñón","definicion":"Extremidad residual tras la amputación, que debe encajar e impulsar la prótesis."},{"termino":"Neuroma","definicion":"Engrosamiento del extremo de un nervio seccionado; causa de dolor de muñón e impulsos ectópicos."},{"termino":"Dolor de miembro fantasma","definicion":"Dolor neuropático percibido en el segmento amputado, más severo en amputaciones proximales."},{"termino":"Terapia de espejo","definicion":"Técnica no farmacológica que usa el reflejo del miembro sano para reducir el dolor fantasma."},{"termino":"Amputación de Syme / Pirogoff","definicion":"Amputaciones a nivel del tobillo (3 % de las de MI según el PDF)."}],"fuentes":["Johansen K et al. (1990). Mangled Extremity Severity Score.","Combalía Aleu A. (2000). Fracturas abiertas (I): evaluación inicial y clasificación.","Universidad Europea. Órtesis y Prótesis, Tema 9: Amputaciones."],"qcm":[{"pregunta":"Un paciente nace sin la mano izquierda. Según la terminología del tema, ¿cómo se denomina esta situación?","opciones":["Amputación parcial de la mano","Agenesia","Amputación transradial primaria","Desarticulación de muñeca"],"correcta":1,"explicacion":"La ausencia de un miembro que no es adquirida sino congénita se denomina agenesia. La desarticulación y la amputación son pérdidas adquiridas.","por_opcion":["❌ Describe un nivel de amputación adquirida, no una ausencia congénita.","✅ Agenesia = ausencia congénita, no adquirida.","❌ Primaria se refiere a la amputación producida por el propio traumatismo.","❌ La desarticulación es una pérdida adquirida a nivel articular."]},{"pregunta":"¿Cuál de los siguientes datos sobre etiología coincide con el temario?","opciones":["La causa oncológica supone el 22 % de las amputaciones","Las deformidades congénitas son la segunda causa con un 15 %","Los traumatismos suponen el 82 % de las amputaciones","La enfermedad vascular periférica supone el 82 % de las amputaciones"],"correcta":3,"explicacion":"Según el PDF, la enfermedad vascular/arterial periférica causa el 82 % de las amputaciones, los traumatismos el 22 % y los tumores el 4 %.","por_opcion":["❌ El 22 % es traumático; el oncológico es el 4 %.","❌ El 15 % es la proporción de amputaciones de miembro superior, no de causas congénitas.","❌ El 82 % corresponde a la causa vascular; los traumatismos son el 22 %.","✅ La EVP/EAP es la causa más frecuente (82 %)."]},{"pregunta":"En un politraumatizado, ¿qué combinación define por sí sola una lesión severa del miembro según el tema?","opciones":["Afectación musculotendinosa con herida punzante","Afectación de un único sistema con pérdida de pulso","Afectación ósea aislada con fractura conminuta","Afectación de la piel y del sistema vasculonervioso"],"correcta":3,"explicacion":"Se considera lesión severa cuando se afectan al menos 2 de los 4 sistemas del miembro (óseo, vasculonervioso, musculotendinoso y piel).","por_opcion":["❌ Herida punzante y tendón pueden afectar solo a un sistema; no se cumple el criterio explícito de dos sistemas.","❌ Sigue siendo un único sistema, aunque grave.","❌ Un solo sistema afectado no cumple el criterio de 2 de 4.","✅ Piel + vasculonervioso = 2 sistemas: lesión severa."]},{"pregunta":"Varón de 55 años, arrollado por un tren, PAS \u003c 90 mmHg que no responde a líquidos en quirófano y miembro sin pulso con relleno capilar lento y parestesias. Sin modificar la isquemia por tiempo, ¿qué MESS obtiene?","opciones":["10 puntos","8 puntos","7 puntos","9 puntos"],"correcta":0,"explicacion":"Aplastamiento masivo 4 + hipotensión prolongada 2 + isquemia moderada 2 + edad > 50 años 2 = 10 puntos, por encima del umbral de 7.","por_opcion":["✅ 4 + 2 + 2 + 2 = 10.","❌ Subestima un componente (probablemente la edad o el shock).","❌ 7 es el punto de corte, no el resultado de este caso.","❌ Falta un punto: revisa que la edad > 50 años suma 2."]},{"pregunta":"En la escala MESS, ¿qué componente NO puede puntuar 0?","opciones":["Edad","Isquemia","Lesión esquelética y de partes blandas","Shock"],"correcta":2,"explicacion":"La lesión esquelética y de partes blandas va de 1 (baja energía) a 4 (aplastamiento masivo); shock, isquemia y edad tienen una categoría de 0 puntos.","por_opcion":["❌ Menos de 30 años puntúa 0.","❌ Sin isquemia (pulso presente) puntúa 0.","✅ Su mínimo es 1 punto (baja energía).","❌ La normotensión puntúa 0."]},{"pregunta":"¿Qué distingue a una amputación traumática secundaria?","opciones":["Se produce directamente por el agente traumático","Se realiza a posteriori, tras intentar salvar el miembro","Se realiza siempre en las primeras seis horas","Se indica solo si la MESS es inferior a 7"],"correcta":1,"explicacion":"La amputación traumática primaria la produce el propio traumatismo; la secundaria se realiza a posteriori, cuando no ha sido posible conservar el miembro.","por_opcion":["❌ Es la definición de amputación primaria.","✅ Secundaria = a posteriori.","❌ El tema no define la secundaria por un plazo horario.","❌ Una MESS \u003c 7 apoya precisamente intentar conservar el miembro."]},{"pregunta":"Respecto a la amputación de origen oncológico, ¿qué afirmación es correcta según el tema?","opciones":["Es típica de tumores malignos sin metástasis en la adolescencia","La cirugía conservadora tiene menos complicaciones que la amputación","Es más típica en ancianos con metástasis óseas","Supone el 22 % de todas las amputaciones en España"],"correcta":0,"explicacion":"El temario la asocia a tumores malignos sin metástasis durante la adolescencia, con una incidencia en España del 1–4 %; la cirugía conservadora conlleva más riesgo de infección y complicaciones.","por_opcion":["✅ Coincide con el PDF.","❌ Es al contrario: la conservadora tiene más riesgo de infección y complicaciones.","❌ El tema la asocia a la adolescencia y sin metástasis.","❌ El 22 % es la causa traumática; la oncológica es 1–4 %."]},{"pregunta":"El cirujano sutura los aductores seccionados al fémur en una transfemoral. ¿Qué técnica realiza?","opciones":["Tenodesis","Mioplastia","Miodesis","Cierre miofascial"],"correcta":2,"explicacion":"La miodesis es la fijación del músculo al hueso o al periostio; la imagen del tema muestra precisamente la miodesis de aductores en la amputación transfemoral.","por_opcion":["❌ La tenodesis fija un tendón y no es una de las técnicas de cierre del tema.","❌ Mioplastia une el músculo con su antagonista.","✅ Músculo a hueso = miodesis.","❌ El cierre miofascial une el músculo a la fascia."]},{"pregunta":"¿Qué técnica consiste en suturar un músculo con su antagonista bajo tensión adecuada?","opciones":["Miodesis","Mioplastia","Cierre miofascial","Biselado óseo"],"correcta":1,"explicacion":"La mioplastia une el músculo con su antagonista u otro grupo muscular bajo tensión adecuada, acolchando el extremo del muñón.","por_opcion":["❌ La miodesis fija músculo a hueso/periostio.","✅ Definición literal de mioplastia.","❌ El cierre miofascial une músculo y fascia.","❌ El biselado es el tallado de los extremos óseos, no un cierre muscular."]},{"pregunta":"Según los porcentajes del tema, ¿qué nivel de amputación de miembro superior es más frecuente?","opciones":["Desarticulación del hombro","Transhumeral","Mano entera","Transradial"],"correcta":3,"explicacion":"La transradial (8 %) es la más frecuente y la más importante del MS, frente a transhumeral (4 %), mano entera (2 %) y desarticulación de hombro (1,5 %).","por_opcion":["❌ Desarticulación de hombro: 1,5 %.","❌ Transhumeral: 4 %.","❌ Mano entera: 2 %.","✅ Transradial: 8 %."]},{"pregunta":"¿Qué afirmación sobre la amputación de miembro superior es correcta?","opciones":["La desarticulación de codo es la más frecuente","Afecta predominantemente al lado dominante","Cuanto más proximal, más ROM se conserva","Representa el 15 % de las amputaciones"],"correcta":3,"explicacion":"El MS supone el 15 % de las amputaciones, afecta indiferentemente al lado dominante o no dominante y cuanto más distal es el nivel, más ROM se conserva.","por_opcion":["❌ La desarticulación de codo es de las menos frecuentes (0,5 %).","❌ Afecta indiferentemente a ambos lados.","❌ Es al revés: + distal = + ROM.","✅ Dato del PDF."]},{"pregunta":"Paciente amputado que describe hormigueo y sensación de «zapato estrecho» en el pie amputado, sin dolor. ¿Cómo se clasifica?","opciones":["Sensación de miembro fantasma","Dolor de muñón por neuroma","Dolor de muñón por mala adaptación protésica","Dolor de miembro fantasma"],"correcta":0,"explicacion":"La sensación de miembro fantasma es cualquier percepción no dolorosa del miembro amputado (picor, hormigueo, zapatos estrechos), aunque puede resultar tan molesta como el dolor.","por_opcion":["✅ Percepción no dolorosa del segmento amputado.","❌ El dolor de muñón se localiza en la extremidad residual.","❌ Se localizaría en el muñón y sería doloroso.","❌ El dolor fantasma implica dolor neuropático."]},{"pregunta":"¿Qué característica del dolor de miembro fantasma recoge el tema?","opciones":["Es neuropático y exclusivo de amputaciones vasculares","Es nociceptivo y más intenso en amputaciones distales","Es neuropático y más severo en amputaciones proximales","Es nociceptivo y se origina en el extremo del muñón"],"correcta":2,"explicacion":"El dolor de miembro fantasma es un dolor neuropático procedente del miembro amputado, más severo en las amputaciones proximales.","por_opcion":["❌ No es exclusivo de ninguna etiología.","❌ No es nociceptivo y es más severo en proximales.","✅ Coincide con la definición del PDF.","❌ El dolor originado en el muñón es dolor de muñón."]},{"pregunta":"Durante la fase postoperatoria, ¿qué pauta de vendaje del muñón es correcta?","opciones":["De proximal a distal para empujar el edema hacia el extremo","Mantenerlo muy apretado por la noche para moldear el muñón","Retirarlo y recolocarlo cada 12 horas para no irritar la piel","De distal a proximal, recolocándolo cada 4–6 horas"],"correcta":3,"explicacion":"El vendaje se coloca de distal a proximal, sin pliegues, se retira y recoloca cada 4–6 h (o si se afloja) y nunca se duerme con él muy apretado; busca forma cónica y reducir el edema.","por_opcion":["❌ La dirección es de distal a proximal.","❌ Nunca se debe dormir con el vendaje muy apretado.","❌ El intervalo indicado es 4–6 h.","✅ Reglas básicas del PDF."]},{"pregunta":"¿En qué fase protésica se introduce por primera vez la marcha fuera de las paralelas en terreno plano con reducción de la ayuda ortopédica?","opciones":["Tercera fase","Primera fase","Segunda fase","Cuarta fase"],"correcta":0,"explicacion":"La tercera fase trabaja la marcha fuera de las paralelas en terreno plano y disminuye la ayuda ortopédica; la cuarta añade terreno irregular, escaleras y rampas.","por_opcion":["✅ Fuera de paralelas + terreno plano + menos ayudas.","❌ La primera se centra en colocar la prótesis, cargar peso y crear un patrón de marcha.","❌ La segunda se realiza entre paralelas.","❌ La cuarta corresponde al terreno irregular, escalones y planos inclinados."]}],"asignatura":"Ortesis","tema":9,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
