<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 1. Introducción a la Historia Clínica · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 1. Introducción a la Historia Clínica","subtitulo":"De los conceptos de salud y enfermedad a la anamnesis estructurada, la exploración, las pruebas complementarias y el diagnóstico diferencial.","resumen":["La OMS (1948) definió la salud como **un estado de completo bienestar físico, mental y social, y no solamente la ausencia de enfermedad**, y hoy se añade la capacidad de adaptarse y autogestionarse.","La enfermedad se entiende como una cadena **etiología → patogenia → fisiopatología → signos y síntomas → diagnóstico**, y se manifiesta por una respuesta constitucional y una respuesta personal.","La anamnesis, completa, estructurada y centrada en el paciente, aporta **el 60–80 % de la información diagnóstica**: escucha activa, preguntas abiertas, luego dirigidas, e hipótesis.","La historia clínica es un **documento médico-legal obligatorio** con filiación, anamnesis (proceso actual, antecedentes personales y familiares, por aparatos), exploración física y pruebas complementarias.","Las pruebas complementarias solo se piden **si su resultado puede cambiar diagnóstico, tratamiento o pronóstico**, y el diagnóstico que siempre debe aplicarse es el **diferencial**."],"objetivos":["Al terminar, sabrás definir salud, enfermedad, etiología, patogenia y fisiopatología y encadenarlas hasta el diagnóstico.","Al terminar, sabrás interpretar las escalas de Karnofsky, Barthel, ECOG, Rankin modificada y Glasgow y distinguir sus sentidos de puntuación.","Al terminar, sabrás realizar una anamnesis estructurada (preguntas hipocráticas, OPQRST, situación previa) evitando los errores frecuentes.","Al terminar, sabrás enumerar los apartados de la historia clínica, las partes de la exploración física y los tipos de pruebas complementarias.","Al terminar, sabrás diferenciar sensibilidad y especificidad y los tipos de diagnóstico, y las fases del tratamiento."],"ideas_clave":["Salud (OMS, 1948): completo bienestar físico, mental y social; componentes **subjetivo, funcional y adaptativo**.","Cadena clínica: **etiología → patogenia → fisiopatología → signos y síntomas → diagnóstico** (ejemplo: rotura muscular).","La patogenia tiene 3 componentes: la acción de la causa, el **proceso reactivo** y la situación basal del individuo (ejemplo: anafilaxia).","Karnofsky y Barthel: 0–100, **más puntos = mejor**; ECOG (0–5) y Rankin modificada (0–6): **menos puntos = mejor**.","Glasgow: 3–15 puntos (ocular 4, verbal 5, motora 6); **13–15 leve, 9–12 moderado, 3–8 grave**.","Anamnesis = 60–80 % del diagnóstico: primero escuchar sin interrumpir, luego preguntas abiertas, después dirigidas, y no inducir respuestas.","Las pruebas complementarias sirven para **confirmar, descartar, guiar tratamiento y evaluar pronóstico**; solo si cambian la conducta.","Sensibilidad = detecta enfermos (positivo si enfermo); especificidad = detecta sanos (negativo si sano)."],"secciones":[{"id":"salud-enfermedad","titulo":"Salud, enfermedad y sus manifestaciones","bloques":[{"tipo":"definicion","termino":"Salud (OMS, 1948)","texto":"\"Un estado de **completo bienestar físico, mental y social**, y no solamente la ausencia de enfermedad\". Actualmente se entiende también como la **capacidad de adaptarse y autogestionar** los cambios físicos, emocionales y sociales a lo largo de la vida."},{"tipo":"tarjetas","items":[{"etiqueta":"Componente 1","titulo":"Subjetivo","texto":"Percepción individual que cada persona tiene de su propia salud."},{"etiqueta":"Componente 2","titulo":"Funcional","texto":"Estado de **capacidad y autonomía** adecuado para la vida diaria."},{"etiqueta":"Componente 3","titulo":"Adaptativo","texto":"Depende del **entorno**: capacidad de ajustarse a él."}]},{"tipo":"parrafo","texto":"El esquema del tema sitúa la salud en la intersección de cuatro esferas: **física, mental, social y funcional**. Para el fisioterapeuta la esfera funcional es central, porque es la que se mide y se mejora con el tratamiento."},{"tipo":"definicion","termino":"Enfermedad","texto":"Modo de vivir aflictivo ante una alteración que puede **no permitir la vida** (enfermedad letal), **impedir o entorpecer** la vida personal (enfermedad curable) o **limitarla de forma definitiva** (enfermedad incurable). También: alteración estructural o funcional que produce signos, síntomas o limitación funcional y modifica el estado de salud."},{"tipo":"tabla","titulo":"Tipos de enfermedad según su repercusión sobre la vida","columnas":["Tipo","Repercusión"],"filas":[["Letal","No permite la vida"],["Curable","Impide o entorpece la realización de la vida personal (de forma transitoria)"],["Incurable","Limita la vida de forma definitiva"]]},{"tipo":"parrafo","texto":"La enfermedad sigue la secuencia **alteración biológica → manifestaciones clínicas → limitación funcional**, y se manifiesta mediante dos respuestas: la **respuesta constitucional** (cómo se defiende el organismo: componente genético, sistema inmunitario) y la **respuesta personal** (componente subjetivo, actitud ante la situación)."},{"tipo":"perla","texto":"\"Dos pacientes con la misma enfermedad pueden presentar diferente impacto funcional y emocional\". En la **gonartrosis**, el paciente que se mantiene activo tiene mejor calidad de vida que el que se queda en casa sin moverse: la respuesta personal es un objetivo terapéutico del fisioterapeuta."},{"tipo":"alerta","texto":"No confundas las dos respuestas: el **sistema inmunitario y la genética** pertenecen a la respuesta **constitucional**; la **ansiedad, la actitud o la conformidad** con el medio, a la respuesta **personal**."}]},{"id":"etiologia-patogenia","titulo":"Etiología, patogenia y fisiopatología","bloques":[{"tipo":"definicion","termino":"Etiología","texto":"Ciencia que estudia las **causas** que producen una enfermedad. Suele haber una causa principal y otras accesorias, aunque no siempre se conocen."},{"tipo":"tabla","titulo":"Tipos de causas","columnas":["Tipo","Ejemplos"],"filas":[["Internas","Herencia (genética), autoinmunes"],["Externas","Ambientales, infecciosas, traumáticas"],["Multifactoriales","Combinación de causas internas y externas"]]},{"tipo":"perla","texto":"Ejemplo de etiología: la **úlcera gastroduodenal**. Antes se atribuía al tabaco y la acidez; el descubrimiento de **Helicobacter pylori** cambió el conocimiento de la enfermedad. Hoy sus causas principales son **H. pylori y los AINEs**, aunque no toda dispepsia o reflujo se debe a H. pylori."},{"tipo":"definicion","termino":"Patogenia","texto":"Ciencia que estudia los **mecanismos** por los que se producen las enfermedades. Componentes: **la acción de la causa**, el **proceso reactivo** (que puede controlar, agravar o modular la acción de la causa) y la **situación basal del individuo**."},{"tipo":"perla","texto":"Ejemplo de patogenia: el **shock anafiláctico**. No mata el agente, sino la propia reacción inmunitaria: la liberación masiva de mediadores provoca **vasodilatación, aumento de la permeabilidad vascular y broncoconstricción**, con compromiso vital."},{"tipo":"definicion","termino":"Fisiopatología","texto":"Ciencia que estudia el **funcionamiento anormal** de órganos y sistemas, desde cambios estructurales, bioquímicos o genéticos celulares hasta la disfunción de aparatos; explica **cómo** las alteraciones originan los signos y síntomas. Es el **puente** entre la enfermedad y lo que se observa en la anamnesis y la exploración."},{"tipo":"esquema","titulo":"Cadena clínica aplicada a una rotura muscular","mermaid":"flowchart TD\n  E[\"Etiología: contracción muscular brusca\"] --> P[\"Patogenia: rotura de fibras musculares\"]\n  P --> F[\"Fisiopatología: hemorragia local, inflamación, pérdida de continuidad y función\"]\n  F --> S[\"Signos y síntomas: dolor brusco, edema, hematoma, pérdida de fuerza\"]\n  S --> D[\"Diagnóstico: anamnesis, exploración, ecografía o RM\"]\n  D --> R[\"Rotura muscular\"]","pie":"Cada nivel responde a una pregunta: por qué (etiología), cómo (patogenia), qué funciona mal (fisiopatología), qué se ve (clínica) y qué es (diagnóstico)."},{"tipo":"figura","pagina":14,"pie":"Ejemplo de la rotura muscular: fíjate en cómo cada nivel de la cadena (izquierda) se corresponde con un paso concreto del caso (centro) y en la ecografía como prueba de confirmación.","src":"img/patologia-quirurgica-i-t1-tema-1-introduccion-a-la-historia-clinica-p14.jpg"},{"tipo":"alerta","texto":"Trampa clásica: **patogenia** = mecanismos (cómo se produce); **fisiopatología** = funcionamiento anormal que explica signos y síntomas. La etiología es la **causa**, no el mecanismo."}]},{"id":"escalas","titulo":"Escalas de valoración","bloques":[{"tipo":"parrafo","texto":"La **calidad de vida relacionada con la salud (CVRS / HRQoL)** evalúa cómo una enfermedad afecta a la percepción de bienestar. Es una valoración **cualitativa** con tres dimensiones, que se mide con cuestionarios validados genéricos o específicos y con **PROMs** (Patient Reported Outcome Measures)."},{"tipo":"tabla","titulo":"Dimensiones de la calidad de vida relacionada con la salud","columnas":["Dimensión","Qué percibe el paciente"],"filas":[["Física","Estado físico: ausencia de enfermedad, síntomas producidos por ella y efectos adversos del tratamiento"],["Psicológica","Estado cognitivo y afectivo (miedo, ansiedad, autoestima), creencias personales y religiosas, depresión, control de la enfermedad, afrontamiento"],["Social","Relaciones interpersonales: apoyo familiar, relación médico-paciente, desempeño laboral o académico, participación social"]]},{"tipo":"parrafo","texto":"La valoración **cuantitativa** puede ser **global** (cuantifica autonomía y capacidad funcional con escalas estandarizadas; sirve para valorar el **coste-beneficio** de una terapia, p. ej. un tratamiento oncológico) o **específica** (centrada en manifestaciones de la enfermedad, para decidir si actuar de forma agresiva y valorar cambios por el tratamiento; ejemplo: **Glasgow**)."},{"tipo":"tabla","titulo":"Escalas funcionales globales","columnas":["Escala","Qué evalúa","Pacientes","Rango y sentido"],"filas":[["Karnofsky (KPS)","Estado funcional y capacidad para actividades habituales","Oncología, enfermedades crónicas","0–100 (más = mejor)"],["Índice de Barthel","Independencia en ABVD","Rehabilitación, geriatría, neurología","0–100 (más = más independiente)"],["ECOG Performance Status","Limitación funcional por la enfermedad","Oncología","0–5 (menos = mejor)"],["Rankin modificada (mRS)","Discapacidad tras ictus u otras enfermedades neurológicas","Neurología","0–6 (menos = menor discapacidad)"]]},{"tipo":"dato","valor":"100 · 80 · 60 · 40 · 20 · 0","texto":"Karnofsky simplificada: 100 actividad normal; 80 normal con esfuerzo; 60 necesita ayuda ocasional; 40 incapacidad importante; 20 muy enfermo; 0 fallecido."},{"tipo":"alerta","texto":"Sentido inverso: en **Karnofsky y Barthel** una puntuación alta es buena; en **ECOG y Rankin** una puntuación alta es mala (ECOG 5 y Rankin 6 = muerte). Es la trampa más frecuente con estas escalas."},{"tipo":"tabla","titulo":"Escala de coma de Glasgow (GCS)","columnas":["Componente","Respuestas y puntos","Máximo"],"filas":[["Apertura ocular (E)","Espontánea 4 · al hablarle 3 · al dolor 2 · ninguna 1","4"],["Respuesta verbal (V)","Orientado 5 · confuso 4 · palabras inapropiadas 3 · sonidos incomprensibles 2 · ninguna 1","5"],["Respuesta motora (M)","Obedece órdenes 6 · localiza el dolor 5 · retirada al dolor 4 · flexión anormal (decorticación) 3 · extensión anormal (descerebración) 2 · ninguna 1","6"]]},{"tipo":"dato","valor":"13–15 / 9–12 / 3–8","texto":"Glasgow: traumatismo craneoencefálico **leve**, **moderado** y **grave** respectivamente. Mínimo posible 3, máximo 15."},{"tipo":"figura","pagina":22,"pie":"Tabla completa de la escala de Glasgow: memoriza los máximos por componente (4-5-6) y los cortes de gravedad del TCE.","src":"img/patologia-quirurgica-i-t1-tema-1-introduccion-a-la-historia-clinica-p22.jpg"},{"tipo":"alerta","texto":"En Glasgow, la **flexión anormal (decorticación) vale 3** y la **extensión anormal (descerebración) vale 2**: la descerebración es de peor pronóstico. El mínimo es **3, no 0**."}]},{"id":"comunicacion","titulo":"Comunicación clínica e interferencias","bloques":[{"tipo":"tabla","titulo":"Interferencias en la comunicación profesional-paciente","columnas":["Origen","Interferencias"],"filas":[["Paciente","Tensión emocional (pérdida de datos); problemática física (hipoacusia, incapacidades), barrera idiomática, baja alfabetización sanitaria; problemática psíquica (somatizaciones, ansiedad)"],["Profesional sanitario","Tensión emocional (**burn-out**, muy peligroso); fatiga, sobrecarga asistencial, sesgos cognitivos, interferencias sociales, económicas, científicas"],["Medio","Escaso tiempo por saturación; historia clínica electrónica; interrupciones (llamadas, alertas informáticas, administración); mal ambiente (ruido, temperatura, falta de privacidad)"]]},{"tipo":"esquema","titulo":"Comunicación clínica eficaz en 5 pasos","mermaid":"flowchart LR\n  A[\"1. Saludar\"] --> B[\"2. Escuchar sin interrumpir\"]\n  B --> C[\"3. Exploración física\"]\n  C --> D[\"4. Explicar con lenguaje claro\"]\n  D --> E[\"5. Verificar comprensión\"]","pie":"La escucha activa del paso 2 es la que permite recopilar la información; el paso 5 cierra el circuito comprobando que el paciente ha entendido."},{"tipo":"perla","texto":"Traduce siempre el diagnóstico: \"cervicalgia\" → \"dolor en la parte posterior del cuello\"; \"tendinopatía del supraespinoso\" → \"parece que hay una irritación en uno de los tendones del hombro\". Después, **comprueba que lo ha entendido**."},{"tipo":"lista","items":["**Contacto visual**: el paciente se siente escuchado.","**Tono de voz tranquilo**: disminuye la ansiedad.","**Gestos pausados**: transmiten confianza.","Cuidar postura, orientación del tronco, expresión facial, distancia interpersonal y silencios."]}]},{"id":"anamnesis","titulo":"Anamnesis: normas y recogida de información","bloques":[{"tipo":"dato","valor":"60–80 %","texto":"Proporción aproximada de la información necesaria para el diagnóstico que aporta la anamnesis en muchos procesos, sobre todo si es estructurada."},{"tipo":"parrafo","texto":"La anamnesis debe ser **completa, ordenada/estructurada y centrada en el paciente**: primero se deja que explique el motivo de consulta **sin interrupciones** (escucha activa), después se usan **preguntas abiertas**, luego **dirigidas**, y por último se organiza y jerarquiza la información para formular **hipótesis diagnósticas**."},{"tipo":"esquema","titulo":"Del relato del paciente al tratamiento","mermaid":"flowchart TD\n  A[\"Anamnesis: escucha activa\"] --> B[\"Preguntas abiertas y luego dirigidas\"]\n  B --> C[\"Jerarquización de problemas\"]\n  C --> D[\"Diagnóstico sindrómico\"]\n  D --> E[\"Diagnóstico diferencial\"]\n  E --> F[\"Hipótesis diagnóstica\"]\n  F --> G[\"Solicitud de exploraciones complementarias\"]\n  G --> H[\"Diagnóstico y tratamiento\"]","pie":"Las pruebas complementarias llegan al final: se piden para contrastar una hipótesis, nunca en lugar de la anamnesis y la exploración."},{"tipo":"figura","pagina":33,"pie":"Algoritmo del profesor: de la anamnesis a la jerarquización de problemas, diagnóstico sindrómico, diferencial, hipótesis, exploraciones complementarias y, por último, diagnóstico y tratamiento.","src":"img/patologia-quirurgica-i-t1-tema-1-introduccion-a-la-historia-clinica-p33.jpg"},{"tipo":"lista","items":["Hablar de manera clara y audible; sin jerga ni palabras emotivas.","**No incluir las respuestas en la pregunta** (no inducir): abiertas al inicio, cerradas para precisar.","Si se pregunta por un síntoma y **no lo tiene, reflejarlo** en la historia clínica.","Negociar objetivos comunes y sintetizar la información.","**Precisión**: comprobar qué entiende el paciente por artritis, fatiga, migraña, mareo, vértigo…","Diferenciar **síntomas (subjetivos)** de **signos (objetivos)**."]},{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Preguntas hipocráticas","texto":"¿Qué le pasa? ¿Desde cuándo? ¿A qué lo atribuye? La última aporta información valiosa sobre el inicio del problema."},{"etiqueta":"2","titulo":"Manifestaciones subjetivas y objetivas","texto":"Qué alivia (posiciones, reposo), qué empeora (flexión, marcha de 2 km), dolor nocturno."},{"etiqueta":"3","titulo":"Fuente de la información","texto":"Si procede de familiares (consciencia alterada, nerviosismo) puede estar sesgada: valorar la **fiabilidad del informador**."},{"etiqueta":"4","titulo":"Situación previa","texto":"Movilidad (p. ej. claudicación intermitente), actividad física, MMSS, labores domésticas, AVD, participación social y laboral."},{"etiqueta":"5","titulo":"Repercusiones","texto":"Ámbito laboral y social; hábitos tóxicos que pueden agravar la enfermedad (alcohol, tabaco, fármacos)."}]},{"tipo":"tabla","titulo":"Caracterización del síntoma (esquema OPQRST del tema)","columnas":["Elemento","Pregunta tipo"],"filas":[["Inicio","¿Cuándo comenzó el problema?"],["Localización","¿Dónde le duele?"],["Duración","¿Cuánto duran los síntomas cuando aparecen?"],["Intensidad","¿Qué intensidad? Escala **EVA 0–10**"],["Factores desencadenantes","¿A qué relaciona el inicio del dolor?"],["Factores de alivio / agravantes","¿Qué lo alivia? ¿Qué lo empeora?"],["Evolución","¿Cómo ha cambiado desde el inicio?"]]},{"tipo":"perla","texto":"En fisioterapia es clave registrar la **situación previa** y escalas de funcionalidad, fuerza y equilibrio **antes** del tratamiento: sin ese punto de partida no se puede demostrar la mejora funcional."},{"tipo":"alerta","texto":"Errores frecuentes: interrumpir demasiado pronto, **preguntas dirigidas desde el inicio**, terminología incomprensible, no explorar expectativas ni preocupaciones, no valorar el impacto funcional y **pedir pruebas antes de completar anamnesis y exploración**."}]},{"id":"historia-clinica","titulo":"La historia clínica y sus apartados","bloques":[{"tipo":"definicion","termino":"Historia clínica","texto":"**Documento médico-legal obligatorio** que registra **cronológicamente** la información de salud de un paciente: su \"biografía médica\" (antecedentes, síntomas, diagnósticos, tratamientos y evolución)."},{"tipo":"tabla","titulo":"Apartados de la historia clínica","columnas":["Apartado","Contenido"],"filas":[["1. Datos de filiación","Nombre, apellidos y DNI; fecha de nacimiento; sexo; dirección; teléfono o correo; trabajo u ocupación"],["2. Anamnesis","Proceso actual; antecedentes personales y hábitos; antecedentes familiares; anamnesis por aparatos"],["3. Exploración física","Según la anamnesis, valora el grado de disfunción y localiza el problema"],["4. Pruebas complementarias","Solo si anamnesis y exploración no bastan (imagen, sangre…)"]]},{"tipo":"tabla","titulo":"Qué datos recoger","columnas":["Bloque","Contenido"],"filas":[["Antecedentes personales","Médico-quirúrgicos; **medicación** (p. ej. corticoides y su efecto antiinflamatorio); hábitos tóxicos; estilo de vida (dieta, ejercicio)"],["Antecedentes familiares","Hereditarios; oncológicos (mama, útero, colon, próstata); cardiovasculares y metabólicos (HTA, DM, infartos, ictus, dislipemias); respiratorios y alérgicos (asma); neuropsiquiátricos (epilepsia, Alzheimer, salud mental)"],["Anamnesis por aparatos","Cardiovascular/respiratorio (dolor torácico, disnea, palpitaciones); respiratorio (hemoptisis, tos, expectoración); digestivo (pirosis, epigastralgia, estreñimiento, diarrea); genitourinario (disuria, poliaquiuria, prostatismo, dismenorrea); musculoesquelético (rigidez, atrofia, dolor); endocrino (glucemia, obesidad, delgadez); neurológico (atrofia, síncopes, parestesias)"]]},{"tipo":"parrafo","texto":"La anamnesis por aparatos busca datos frecuentes que el paciente **no cuenta por no considerarlos relevantes**. Se justifica por el **efecto acumulativo y efecto dominó**: el organismo funciona como un todo interconectado aunque se estudie por sistemas (ejemplo del tema: HTA y respiración)."},{"tipo":"tabla","titulo":"Situaciones especiales en la anamnesis","columnas":["Situación","Clave"],"filas":[["Transferencia","El profesional también tiene problemas: no transmitirlos al paciente ni viceversa"],["Familiares","La enfermedad supone un problema para el entorno del paciente"],["Dar malas noticias","No precipitarse; estar seguro antes de comunicar, sobre todo en casos graves"],["Dificultad comunicativa","Problemas físicos (sordera, ceguera) o culturales (formación, analfabetismo)"],["Conocimiento transcultural","Idioma, sobre todo, y creencias religiosas"]]}]},{"id":"exploracion","titulo":"Exploración física y pruebas complementarias","bloques":[{"tipo":"lista","items":["**Precauciones** para prevenir infecciones: higiene de manos entre pacientes; EPI (guantes ante mucosas, heridas o higiene pobre; mascarilla, bata, gafas); apartarse si el paciente tose; prácticas seguras de inyección (contacto sangre-sangre); limpieza del entorno."]},{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Inspección","texto":"Observación."},{"etiqueta":"2","titulo":"Palpación","texto":"Búsqueda de densidades anormales en los tejidos."},{"etiqueta":"3","titulo":"Percusión","texto":"Detecta aire donde no debería o sonido mate donde no debería."},{"etiqueta":"4","titulo":"Auscultación","texto":"Búsqueda de ruidos anormales."},{"etiqueta":"5","titulo":"Oler","texto":"En heridas que puedan estar infectadas."}]},{"tipo":"tabla","titulo":"Aspectos a valorar en la exploración","columnas":["Aspecto","Qué observar"],"filas":[["Aspecto general","Higiene, nerviosismo, postura"],["Coloración cutáneo-mucosa","Cianosis, rojez excesiva"],["Perfusión del lecho capilar","Temperatura de extremidades, test de relleno capilar"],["Patrón respiratorio","Tranquila, taquipnea, bradipnea"],["Nivel de consciencia / estado mental","Estado de alerta / orientación"],["FC y pulso / tensión arterial","Taquicardia, bradicardia / hipertensión, hipotensión"]]},{"tipo":"parrafo","texto":"Las pruebas complementarias son **herramientas estratégicas** para resolver dudas concretas tras la evaluación inicial; su uso correcto optimiza recursos y minimiza riesgos. Sirven para **confirmar** sospechas, **descartar** patologías graves con síntomas similares, **guiar el tratamiento** y **evaluar el pronóstico**."},{"tipo":"tabla","titulo":"Tipos de pruebas complementarias","columnas":["Tipo","Ejemplos"],"filas":[["Líquidos biológicos","Sangre, orina, secreciones, líquidos en cavidades"],["Células o tejidos","Biopsias, punciones aspirativas, citologías"],["Registro de actividad","EMG, ECG, EEG, doppler"],["Imagen","Ecografía, radiografía, TC, RM, endoscopia"],["Cutáneas","Parches (48 h), prick test (pinchazos)"],["Otras","Genéticas, moleculares, estudios urodinámicos"]]},{"tipo":"dato","valor":"48 h","texto":"Duración de las pruebas epicutáneas de parches."},{"tipo":"alerta","texto":"El **doppler** se clasifica en el tema como prueba de **registro de actividad** (junto a EMG, ECG, EEG), no como prueba de imagen; y la **endoscopia** aparece entre las pruebas de **imagen**."},{"tipo":"tarjetas","items":[{"etiqueta":"Detecta enfermos","titulo":"Sensibilidad","texto":"Probabilidad de que la prueba sea **positiva cuando la persona sí tiene** la enfermedad."},{"etiqueta":"Detecta sanos","titulo":"Especificidad","texto":"Probabilidad de que la prueba sea **negativa cuando la persona no tiene** la enfermedad."}]}]},{"id":"diagnostico-tratamiento","titulo":"Diagnóstico y fases del tratamiento","bloques":[{"tipo":"tabla","titulo":"Tipos de diagnóstico","columnas":["Tipo","Fundamento"],"filas":[["Intuitivo","Basado en la experiencia"],["Hipotético","Plantea una hipótesis que se confirma con exploraciones complementarias"],["Inductivo","Parte de aspectos particulares para conocer las generalidades del proceso"],["Diferencial","**El más importante y el que ha de aplicarse**: descartar y confirmar"]]},{"tipo":"perla","texto":"El diagnóstico **debe compartirse con el paciente** (salvo menores, incapacitados o en coma). Hay que ser cuidadoso y dejar hueco a la esperanza, **pero nunca mentir**."},{"tipo":"esquema","titulo":"Fases del tratamiento","mermaid":"flowchart LR\n  A[\"1. Decisión y planificación consensuada\"] --> B[\"2. Aplicación\"]\n  B --> C[\"3. Seguimiento de efectos y efectos secundarios\"]\n  C --> D[\"4. Finalización: alta\"]\n  C -->|\"si no responde\"| A","pie":"La planificación se consensúa con el paciente; el seguimiento puede obligar a replantear el plan."},{"tipo":"dato","valor":"4 fases","texto":"Tratamiento: decisión y planificación, aplicación, seguimiento, finalización (alta)."}]}],"caso_clinico":{"titulo":"Lumbalgia en un trabajador de almacén","presentacion":"Hombre de 52 años, mozo de almacén, acude a fisioterapia acompañado de su hija porque tiene dolor lumbar desde hace 3 semanas. Al llegar, la hija empieza a contestar por él. Toma corticoides orales por un asma. Fuma 15 cigarrillos al día. Trae una RM pedida por su cuenta en una clínica privada.","preguntas":[{"pregunta":"¿Cómo debe empezar la entrevista y qué problema plantea la presencia de la hija?","respuesta":"Hay que saludar y dejar que el **propio paciente** explique el motivo de consulta sin interrupciones (escucha activa), con preguntas abiertas antes de las dirigidas. La información aportada por un familiar puede estar **sesgada**: se debe valorar la fiabilidad del informador y registrar de quién procede."},{"pregunta":"¿Qué datos de antecedentes y hábitos son relevantes y por qué?","respuesta":"La **medicación con corticoides** (efecto antiinflamatorio, puede modificar la respuesta al tratamiento y la recuperación) y el **tabaco** como hábito tóxico que puede agravar la enfermedad. Además, la situación previa (actividad, AVD, trabajo) y las repercusiones laborales."},{"pregunta":"¿Qué valor tiene la RM que trae y cómo se llega al diagnóstico?","respuesta":"Las pruebas complementarias solo tienen sentido si pueden **modificar diagnóstico, tratamiento o pronóstico** y deben llegar tras completar anamnesis y exploración. El diagnóstico se construye con la información de anamnesis y exploración, jerarquizando problemas y aplicando el **diagnóstico diferencial**."}]},"preguntate":[{"pregunta":"¿Cómo definió la OMS la salud en 1948 y qué se añade hoy?","respuesta":"Estado de completo bienestar físico, mental y social, y no solo ausencia de enfermedad. Hoy se añade la capacidad de adaptarse y autogestionar los cambios a lo largo de la vida."},{"pregunta":"¿Qué diferencia la respuesta constitucional de la respuesta personal ante la enfermedad?","respuesta":"La constitucional es la defensa biológica del organismo (genética, inmunidad); la personal es la actitud subjetiva del individuo, que explica que la misma enfermedad tenga distinto impacto."},{"pregunta":"¿Cuáles son los tres componentes de la patogenia?","respuesta":"La acción de la causa, el proceso reactivo (que puede controlar, agravar o modular) y la situación basal del individuo."},{"pregunta":"Encadena los cinco niveles clínicos para un esguince o rotura muscular.","respuesta":"Etiología (contracción brusca) → patogenia (rotura de fibras) → fisiopatología (hemorragia, inflamación, pérdida de función) → signos y síntomas (dolor, edema, hematoma, debilidad) → diagnóstico (anamnesis, exploración, ecografía/RM)."},{"pregunta":"¿Qué escalas funcionales puntúan mejor con valores bajos?","respuesta":"ECOG (0–5) y Rankin modificada (0–6). Karnofsky y Barthel (0–100) puntúan mejor con valores altos."},{"pregunta":"¿Cuáles son los tres componentes de Glasgow y sus máximos?","respuesta":"Apertura ocular 4, respuesta verbal 5, respuesta motora 6; total 3–15, con TCE leve 13–15, moderado 9–12 y grave 3–8."},{"pregunta":"¿Por qué no se deben usar preguntas dirigidas al inicio de la anamnesis?","respuesta":"Porque inducen respuestas y cortan el relato del paciente; primero se escucha sin interrumpir y con preguntas abiertas, y las cerradas sirven después para precisar."},{"pregunta":"¿Qué cuatro apartados tiene la historia clínica?","respuesta":"Datos de filiación, anamnesis (proceso actual, antecedentes personales y familiares, por aparatos), exploración física y pruebas complementarias."},{"pregunta":"¿Para qué cuatro fines se usan las pruebas complementarias y cuándo deben pedirse?","respuesta":"Confirmar, descartar, guiar tratamiento y evaluar pronóstico; solo cuando su resultado pueda modificar el diagnóstico, el tratamiento o el pronóstico."},{"pregunta":"Define sensibilidad y especificidad.","respuesta":"Sensibilidad: probabilidad de resultado positivo en un enfermo (detecta enfermos). Especificidad: probabilidad de resultado negativo en un sano (detecta sanos)."}],"glosario":[{"termino":"Anamnesis","definicion":"Entrevista clínica estructurada que recoge la información del paciente; aporta el 60–80 % de los datos diagnósticos."},{"termino":"Etiología","definicion":"Estudio de las causas de una enfermedad (internas, externas o multifactoriales)."},{"termino":"Patogenia","definicion":"Estudio de los mecanismos por los que se produce la enfermedad."},{"termino":"Fisiopatología","definicion":"Estudio del funcionamiento anormal que explica los signos y síntomas."},{"termino":"Signo","definicion":"Manifestación objetiva de la enfermedad, observable por el explorador."},{"termino":"Síntoma","definicion":"Manifestación subjetiva referida por el paciente."},{"termino":"CVRS / HRQoL","definicion":"Calidad de vida relacionada con la salud, con dimensiones física, psicológica y social."},{"termino":"PROMs","definicion":"Patient Reported Outcome Measures: resultados comunicados por el propio paciente mediante cuestionarios."},{"termino":"Datos de filiación","definicion":"Datos personales de identificación del paciente en la historia clínica."},{"termino":"Transferencia","definicion":"Riesgo de que el profesional traslade sus problemas personales al paciente o viceversa."},{"termino":"Sensibilidad","definicion":"Capacidad de una prueba para dar positivo en los enfermos."},{"termino":"Especificidad","definicion":"Capacidad de una prueba para dar negativo en los sanos."},{"termino":"Diagnóstico diferencial","definicion":"Proceso de descartar y confirmar entre entidades con clínica similar; el que siempre debe aplicarse."}],"fuentes":["Universidad Europea de Valencia. Patología Quirúrgica I (PQRI 2026-2027). Tema 1: Introducción a la Historia Clínica.","Organización Mundial de la Salud (1948). Definición de salud."],"qcm":[{"pregunta":"Según el tema, ¿qué componente de la salud se refiere a la capacidad de ajustarse al entorno?","opciones":["Componente adaptativo","Componente social","Componente funcional","Componente subjetivo"],"correcta":0,"explicacion":"El tema distingue tres componentes de la salud: subjetivo (percepción individual), funcional (capacidad y autonomía) y adaptativo (según el entorno).","por_opcion":["✅ El adaptativo es el que depende del entorno.","❌ Lo social es una esfera de la definición de la OMS, no uno de los tres componentes enumerados.","❌ El funcional se refiere a un estado de capacidad y autonomía adecuado.","❌ El subjetivo es la percepción individual de cada persona."]},{"pregunta":"Dos pacientes con gonartrosis de igual gravedad radiológica presentan distinto impacto funcional porque uno se mantiene activo. ¿Qué manifestación de la enfermedad explica la diferencia?","opciones":["La respuesta constitucional","La respuesta personal","La respuesta inmunitaria","La respuesta fisiopatológica"],"correcta":1,"explicacion":"La respuesta personal es el componente subjetivo, la actitud que adopta el individuo; el tema usa precisamente la gonartrosis para ilustrar que la misma enfermedad se manifiesta de forma distinta según la persona.","por_opcion":["❌ La constitucional es la defensa biológica (genética, inmunidad), no la actitud.","✅ La actitud y el nivel de actividad pertenecen a la respuesta personal.","❌ El sistema inmunitario forma parte de la respuesta constitucional.","❌ La fisiopatología explica signos y síntomas, no la diferente actitud del paciente."]},{"pregunta":"En la anafilaxia grave, el compromiso vital lo produce sobre todo la propia reacción inmunitaria. ¿Qué componente de la patogenia ejemplifica?","opciones":["El proceso reactivo","La acción directa de la causa","La situación basal del individuo","El agente etiológico externo"],"correcta":0,"explicacion":"El proceso reactivo puede controlar, agravar o modular la acción de la causa; en la anafilaxia es la liberación masiva de mediadores (vasodilatación, permeabilidad, broncoconstricción) lo que amenaza la vida.","por_opcion":["✅ La reacción inmunitaria es el proceso reactivo que agrava la acción de la causa.","❌ El tema subraya que no es el agente el que mata, sino la reacción.","❌ La situación basal es el estado previo del individuo, otro componente distinto.","❌ El agente externo pertenece a la etiología, no a la patogenia."]},{"pregunta":"¿Qué disciplina explica cómo las alteraciones celulares y orgánicas originan los signos y síntomas y actúa como puente hacia la clínica?","opciones":["Etiología","Patogenia","Semiología","Fisiopatología"],"correcta":3,"explicacion":"La fisiopatología estudia el funcionamiento anormal de células, tejidos, órganos y sistemas y explica cómo originan los signos y síntomas; el tema la define como el puente entre enfermedad y manifestaciones clínicas.","por_opcion":["❌ La etiología estudia las causas.","❌ La patogenia estudia los mecanismos de producción de la enfermedad.","❌ No es el término que el tema define como puente con la clínica.","✅ Es la definición literal del tema."]},{"pregunta":"¿Qué pareja de escalas comparte que una puntuación más baja indica mejor estado del paciente?","opciones":["Barthel y Rankin modificada","Karnofsky y Barthel","ECOG y Rankin modificada","Karnofsky y ECOG"],"correcta":2,"explicacion":"ECOG (0–5) y Rankin modificada (0–6) puntúan peor cuanto más alto; Karnofsky y Barthel (0–100) puntúan mejor cuanto más alto.","por_opcion":["❌ Barthel: más puntos = más independencia.","❌ En ambas una puntuación alta es mejor.","✅ Ambas: menor puntuación = mejor estado o menor discapacidad.","❌ Karnofsky va en sentido contrario a ECOG."]},{"pregunta":"Un paciente oncológico obtiene 60 en la escala de Karnofsky simplificada. ¿Qué significa?","opciones":["Incapacidad importante","Actividad normal con esfuerzo","Necesita ayuda ocasional","Requiere cuidados continuos"],"correcta":2,"explicacion":"En la versión simplificada del tema: 100 actividad normal, 80 normal con esfuerzo, 60 necesita ayuda ocasional, 40 incapacidad importante, 20 muy enfermo, 0 fallecido.","por_opcion":["❌ Corresponde a 40.","❌ Corresponde a 80.","✅ 60 = necesita ayuda ocasional.","❌ No figura como nivel de la escala simplificada del tema."]},{"pregunta":"Paciente con TCE: abre los ojos al dolor, emite palabras inapropiadas y retira el miembro ante el dolor. ¿Puntuación y gravedad en Glasgow?","opciones":["8 puntos, TCE grave","10 puntos, TCE moderado","7 puntos, TCE grave","9 puntos, TCE moderado"],"correcta":3,"explicacion":"Apertura al dolor = 2, palabras inapropiadas = 3, retirada al dolor = 4; total 9, que entra en el rango 9–12 de TCE moderado.","por_opcion":["❌ Supondría puntuar la retirada como 3, que es la flexión anormal.","❌ Requeriría que abriera los ojos al hablarle (3).","❌ Infraestima dos componentes.","✅ 2 + 3 + 4 = 9, TCE moderado."]},{"pregunta":"En la respuesta motora de Glasgow, ¿qué valor corresponde a la extensión anormal (descerebración)?","opciones":["4 puntos","1 punto","2 puntos","3 puntos"],"correcta":2,"explicacion":"Motora: obedece 6, localiza 5, retirada 4, flexión anormal (decorticación) 3, extensión anormal (descerebración) 2, ninguna 1.","por_opcion":["❌ 4 es la retirada al dolor.","❌ 1 es ausencia de respuesta.","✅ La descerebración vale 2.","❌ 3 es la flexión anormal o decorticación."]},{"pregunta":"Según el tema, ¿qué escala se cita como ejemplo de valoración cuantitativa específica, centrada en manifestaciones de la enfermedad?","opciones":["Índice de Barthel","Escala de Glasgow","Escala ECOG","Escala de Karnofsky"],"correcta":1,"explicacion":"La valoración cuantitativa global (Karnofsky, Barthel, ECOG) mide autonomía y coste-beneficio; la específica se centra en manifestaciones de la enfermedad y el tema la ejemplifica con Glasgow.","por_opcion":["❌ Barthel aparece entre las globales.","✅ Es el ejemplo de valoración específica del tema.","❌ ECOG aparece entre las globales.","❌ Karnofsky es el ejemplo de valoración global."]},{"pregunta":"¿Qué proporción aproximada de la información diagnóstica aporta la anamnesis estructurada según el tema?","opciones":["85–95 %","40–50 %","30–40 %","60–80 %"],"correcta":3,"explicacion":"El tema indica que la anamnesis aporta aproximadamente el 60–80 % de la información necesaria para el diagnóstico en muchos procesos, sobre todo si es estructurada.","por_opcion":["❌ Sobrestima; el tema da 60–80 %.","❌ Infravalora el peso de la anamnesis.","❌ Infravalora el peso de la anamnesis.","✅ Es la cifra del tema."]},{"pregunta":"En el algoritmo del tema, ¿qué paso precede inmediatamente a la hipótesis diagnóstica?","opciones":["Jerarquización de problemas","Diagnóstico sindrómico","Solicitud de exploraciones complementarias","Diagnóstico diferencial"],"correcta":3,"explicacion":"La secuencia es anamnesis → jerarquización de problemas → diagnóstico sindrómico → diagnóstico diferencial → hipótesis diagnóstica → exploraciones complementarias → diagnóstico y tratamiento.","por_opcion":["❌ La jerarquización es el primer paso tras la anamnesis.","❌ El sindrómico precede al diferencial.","❌ Las exploraciones van después de la hipótesis.","✅ El diferencial precede a la hipótesis."]},{"pregunta":"¿Cuál de las siguientes conductas figura entre los errores frecuentes de la anamnesis?","opciones":["Solicitar pruebas antes de completar anamnesis y exploración","Comprobar qué entiende el paciente por mareo","Reflejar en la historia los síntomas que el paciente niega","Usar preguntas cerradas para precisar datos"],"correcta":0,"explicacion":"Pedir pruebas complementarias antes de completar la anamnesis y la exploración es uno de los errores listados; las otras opciones son recomendaciones del tema.","por_opcion":["✅ Es un error frecuente explícito.","❌ Es la recomendación de precisión.","❌ Es una recomendación: si no tiene el síntoma, se refleja.","❌ Las preguntas cerradas son adecuadas para precisar tras las abiertas."]},{"pregunta":"¿En qué bloque de la historia clínica se recogería que el paciente toma corticoides de forma crónica?","opciones":["Antecedentes personales","Antecedentes familiares","Anamnesis por aparatos","Datos de filiación"],"correcta":0,"explicacion":"Los antecedentes personales incluyen médico-quirúrgicos, medicación (el tema pone el ejemplo de los corticoides), hábitos tóxicos y estilo de vida.","por_opcion":["✅ La medicación forma parte de los antecedentes personales.","❌ Los familiares recogen enfermedades de la familia.","❌ Por aparatos se recogen síntomas por sistemas.","❌ La filiación recoge datos de identificación."]},{"pregunta":"Según la clasificación del tema, ¿a qué tipo de prueba complementaria pertenece el doppler?","opciones":["Otras pruebas","Registro de la actividad de células u órganos","Estudio de células o tejidos","Pruebas de imagen"],"correcta":1,"explicacion":"El tema agrupa EMG, ECG, EEG y doppler como pruebas de registro de la actividad de células, órganos o tejidos.","por_opcion":["❌ Otras: genéticas, moleculares, urodinámicas.","✅ Es la clasificación del tema.","❌ Esa categoría incluye biopsias, punciones y citologías.","❌ En imagen el tema incluye ecografía, radiografía, TC, RM y endoscopia."]},{"pregunta":"Una prueba con especificidad muy alta es especialmente útil porque:","opciones":["Da negativo en casi todos los sanos","Reduce la necesidad de exploración física","Detecta precozmente a los enfermos","Da positivo en casi todos los enfermos"],"correcta":0,"explicacion":"La especificidad es la probabilidad de un resultado negativo cuando la persona no tiene la enfermedad: se dedica a detectar sujetos sanos.","por_opcion":["✅ Es la definición de especificidad.","❌ Ninguna prueba sustituye a la exploración; se piden tras ella.","❌ Detectar enfermos es propio de la sensibilidad.","❌ Eso describe la sensibilidad."]}],"asignatura":"Patología quirúrgica I","tema":1,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
