<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tema 10: Rodilla y deporte · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>

<script id="datos" type="application/json">{"titulo":"Tema 10: Rodilla y deporte","subtitulo":"Síndrome de la cintilla iliotibial, hiperpresión rotuliana, tendinopatía rotuliana, lesiones meniscales, pata de ganso, fracturas por sobrecarga, ligamentos laterales (LLI y LLE), tendinopatía poplítea, plica sinovial y lesión del LCP.","resumen":["El **síndrome de la cintilla iliotibial** (“limpiaparabrisas”) es una **fricción** entre la fascia lata y el **cóndilo femoral externo** en corredores y ciclistas con **genu varo**: dolor externo que aparece **a la misma distancia o tiempo** y cede con reposo (tests de **Renne** y **Noble**); la **hiperpresión rotuliana** da dolor anterior difuso con **signo de la butaca**, al bajar escaleras, por desequilibrio **vasto externo/vasto interno**, **ángulo Q** aumentado o patela alta.","La **tendinopatía rotuliana** sigue el **modelo continuum de Cook** (normal, reactivo, desestructurado, degenerativo = punto de no retorno) y se trata con **gestión de carga en 4 fases**: **isométricos → isotónicos → almacenamiento de energía → retorno al deporte**.","La **lesión meniscal** se produce por **torsión**, con derrame **tardío** (al día siguiente; si es inmediato, lesión vascular periférica o cartílago; en pocas horas, **LCA**) y bloqueo en **asa de cubo**; ningún test es patognomónico (**McMurray**, el más fiable, **63 %**), la **RM** tiene **90–98 %** de precisión pero **“nunca operar una resonancia”**.","El **LLI** (superficial, estabilizador medial primario) se lesiona por **valgo** y **cicatriza bien**; se gradúa **I–III** (bostezo **\u003c 5, 6–10, > 10 mm**) y la positividad **solo a 30°** indica lesión **aislada** (en extensión, asociada a LCA o cápsula); el **LLE** (cordonal, extracapsular) se lesiona por **varo** y **cicatriza peor**; los grados 1–2 son conservadores.","El **LCP** aporta el **90 %** de la resistencia al desplazamiento posterior de la tibia, se rompe por **impacto anterior en la tibia con la rodilla flexionada** (portero) y se diagnostica con el **cajón posterior** (el más fiable); las roturas aisladas grado 1–2 van bien con tratamiento **conservador**, y tras la reconstrucción la complicación más frecuente es la **pérdida de movilidad**."],"objetivos":["Diagnosticar y tratar el síndrome de la cintilla iliotibial y la hiperpresión rotuliana.","Aplicar el modelo continuum y la progresión de carga en la tendinopatía rotuliana.","Reconocer la lesión meniscal por anamnesis, exploración y RM, y su diagnóstico diferencial.","Clasificar y tratar las lesiones del LLI y LLE.","Identificar la pata de ganso, las fracturas por sobrecarga, la tendinopatía poplítea, la plica sinovial y la lesión del LCP."],"ideas_clave":["Cintilla iliotibial: **genu varo**, flexo-extensión repetida, dolor **a la misma distancia**; **Renne** (unipodal 30–40°) y **Noble** (presión + extensión hasta 30°).","Hiperpresión rotuliana: dolor **anterior difuso** (el paciente tapa toda la rodilla), **bilateral**, **signo de la butaca**, bajar escaleras; **genu valgo**.","Tendón rotuliano **degenerativo = punto de no retorno**, pero el tejido sano restante puede asumir la función.","Derrame meniscal **tardío**; **inmediato** = periférico o cartílago; **en pocas horas** = **LCA**.","**McMurray** 63 % de fiabilidad; **RM 90–98 %**, pero hay falsos positivos: **la clínica manda**.","LLI: grado I **\u003c 5 mm**, II **6–10 mm**, III **> 10 mm**; positivo **solo a 30°** = aislado.","LLE: **cordonal**, se rompe en **varo**, **cicatriza peor**; grado 3 → **cirugía** y explorar la **esquina posterolateral**.","LCP: **90 %** de la resistencia posterior; **cajón posterior** = signo más fiable; Rx en estrés **≥ 8 mm** = rotura completa."],"secciones":[{"id":"cintilla","titulo":"Síndrome de la cintilla iliotibial","bloques":[{"tipo":"parrafo","texto":"Típico de deportes con **flexo-extensión repetida** (carrera, ciclismo) y del **genu varo**: síndrome del “**limpiaparabrisas**”. Dolor por **fricción** entre la aponeurosis femoral y el **cóndilo femoral externo**, con inflamación de la bursa subyacente."},{"tipo":"lista","items":["Dolor en la **cara externa** con la flexo-extensión repetida y a la presión sobre el cóndilo externo.","Característico: aparece **a la misma distancia o tiempo** de ejercicio y **cede con el reposo**.","Derrame **mínimo o nulo**; diagnóstico diferencial con la **meniscopatía externa**."]},{"tipo":"tabla","titulo":"Tests de la cintilla iliotibial","columnas":["Test","Técnica","Positivo"],"filas":[["**Renne**","Bipedestación en **apoyo unipodal**, flexionar **30–40°**","Dolor"],["**Noble**","Supino, rodilla a 90°, **presión en el epicóndilo lateral** y extensión gradual hasta **30°**","Dolor"]]},{"tipo":"perla","texto":"La **ecografía** localiza la lesión, permite la evaluación dinámica y descarta otras patologías. Tratamiento **conservador (fisioterapia)**; si fracasa, **Z-plastia** de la cintilla."}]},{"id":"rotula","titulo":"Síndrome de hiperpresión rotuliana","bloques":[{"tipo":"parrafo","texto":"La rótula se mantiene por las **dos vertientes trocleares**, el **equilibrio vasto interno-externo** y los **alerones** y la aponeurosis femoral: un fallo de cualquiera altera la alineación. Las fuerzas femoropatelares son muy altas y la menor incongruencia produce trastornos severos."},{"tipo":"tabla","titulo":"Factores de hiperpresión","columnas":["Tipo","Factores"],"filas":[["Hipertonía","**Vasto externo**, aponeurosis femoral, **alerón rotuliano externo**"],["Hipotonía","**Vasto interno**"],["Anatómicos","**Aumento del ángulo Q**, **patela alta**, alteraciones de la rótula"]]},{"tipo":"lista","items":["Dolor **sordo, impreciso**, de opresión o pesadez en la **cara anterior**: el paciente **cubre con la mano toda la cara anterior**.","Frecuentemente **bilateral**; aumenta con el reposo en cama.","Típico con la flexión mantenida (**signo de la butaca**), al **bajar escaleras o cuestas**.","Inestabilidad por fallo o atrofia del cuádriceps, pseudobloqueos, crujidos o resalte femoropatelar."]},{"tipo":"tabla","titulo":"Exploración","columnas":["Maniobra","Detalle"],"filas":[["Inspección","**Genu valgo**, rótulas centradas o “**bizcas/estrábicas**” (alteración rotacional), patela alta prominente sentado"],["Cuádriceps","Perímetro a **10 cm** del polo superior de la rótula"],["**Zöhlen** (cepillo/aprehensión)","Supino: presión superior de la rótula y contracción del cuádriceps → **aprehensión**"],["**Sage**","Palpación dolorosa del **alerón externo**; inestabilidad rotuliana"],["**Báscula patelar**","Si el borde externo queda **por debajo de la horizontal**: exceso de tensión del **retináculo externo**"]]},{"tipo":"parrafo","texto":"Imagen: RX AP, lateral y **axial de rótula**, **TC** (relación femoropatelar), **RM** (cartílago), gammagrafía. Tratamiento: **fisioterapia intensa**; si fracasa, cirugía según la causa: **trocleoplastia de Dejour** (displasia troclear), **realineación proximal de Insall** (displasia muscular), **osteotomía desrotadora** (torsión) o **apertura artroscópica del alerón** (báscula con retracción)."}]},{"id":"rotuliana","titulo":"Tendinopatía rotuliana","bloques":[{"tipo":"parrafo","texto":"Lesión común por sobreuso con **cambios estructurales negativos** que reducen la capacidad de carga. Influyen las características individuales, tolerancia, entrenamiento, edad, género, genética, **adiposidad** y enfermedades."},{"tipo":"tabla","titulo":"Estados del tendón (Cook y Purdam)","columnas":["Estado","Clave"],"filas":[["1. Normal","Adaptado a la carga"],["2. Reactivo","Respuesta a sobrecarga, reversible"],["3. Desestructurado","Matriz desorganizada"],["4. **Degenerativo**","**Punto de no retorno**: no vuelve a su estado original, pero el **tendón restante** puede asumir la función"]]},{"tipo":"parrafo","texto":"**Ecografía**: engrosamiento (bulging), **pérdida del patrón fibrilar**, **zonas hipoecoicas** y **neovascularización** (respuesta adaptativa para aumentar el flujo ante una demanda superior a la capacidad)."},{"tipo":"esquema","titulo":"Progresión de carga (Malliaras, Cook, Purdam, Rio 2015)","mermaid":"flowchart LR\n  F1[\"Fase 1: isometricos\"] --> F2[\"Fase 2: isotonicos\"]\n  F2 --> F3[\"Fase 3: almacenamiento de energia\"]\n  F3 --> F4[\"Fase 4: retorno progresivo al deporte\"]","pie":"Gestión y adaptación de la carga como eje del tratamiento."}]},{"id":"menisco","titulo":"Lesión meniscal","bloques":[{"tipo":"parrafo","texto":"**Aguda** (la más frecuente; en un tercio, el gesto inicial es deportivo) o **crónica** (sin gesto reconocible). Mecanismo de **torsión o cambio de dirección** con dolor."},{"tipo":"tabla","titulo":"Cronología del derrame","columnas":["Momento","Sospecha"],"filas":[["**Inmediato**","Lesión **vascular** de la parte **periférica** del menisco o lesión de **cartílago**"],["**A las pocas horas**","Lesión del **LCA**"],["**Tardío (al día siguiente)**","**Lesión meniscal**"]]},{"tipo":"lista","items":["**Dolor en la interlínea** (4/5 casos), que puede impedir la carga.","Limitación, fallos, **bloqueos**: el **bloqueo completo** sugiere rotura **en asa de cubo** (reductible o no).","**Atrofia del cuádriceps** si es antigua (**inhibición muscular artrogénica**)."]},{"tipo":"tabla","titulo":"Maniobras meniscales","columnas":["Test","Técnica"],"filas":[["**McMurray**","El más conocido y fiable (**63 %**): supino, desde flexión completa se extiende lentamente en **valgo y rotación interna** palpando las interlíneas; dolor o **clic externo** = menisco **externo**"],["**Steinmann**","Sentado: **valgo/varo + flexo-extensión**; **varo y rotación externa** → menisco **interno**"],["**Apley**","Prono, rodilla a 90°: **compresión axial + rotaciones**"],["**Payr**","Similar a Apley, centrado en la **tracción** durante la RI"],["Peloteo","Valoración del **derrame**"]]},{"tipo":"alerta","texto":"**Ningún signo es patognomónico** de lesión meniscal y, asociada a rotura del **LCA**, es aún más difícil de diagnosticar: explora siempre la **estabilidad ligamentosa**."},{"tipo":"parrafo","texto":"**RX** simple y en carga (incluida la femoropatelar) **obligada** para descartar otras lesiones. **RM**: la prueba más fiable (**90–98 %**, mejor para el menisco **medial**), no invasiva y sin radiación; un aumento de señal que **comunica con una cara articular** define la rotura."},{"tipo":"alerta","texto":"La RM tiene **falsos positivos** en asintomáticos: **la clínica domina** la decisión terapéutica. **“¡No operar nunca una resonancia!”**"},{"tipo":"parrafo","texto":"**Diagnóstico diferencial**: plica sinovial medial, pinzamiento de la **grasa de Hoffa**, cuerpos libres, **osteocondritis disecante**, patología femoropatelar, lesión del LLI, condrosis, necrosis ósea, **tendinitis del poplíteo**, lesiones tibioperoneas proximales, patología reumática o metabólica."}]},{"id":"otras","titulo":"Pata de ganso, sobrecarga, poplíteo y plica","bloques":[{"tipo":"tabla","titulo":"Otras patologías","columnas":["Patología","Rasgos","Tratamiento"],"filas":[["**Pata de ganso**","Inserción anteromedial proximal de la tibia del **sartorio, recto interno y semitendinoso**; bolsa **anserina** la separa del LLI; dolor y ligero engrosamiento a la palpación","Readaptación, estiramientos, hielo, fisioterapia, AINE, infiltraciones; cirugía si persiste"],["**Fracturas por sobrecarga**","Asociadas a **genu varo**; edema del platillo tibial; **tercio proximal de la tibia**","—"],["**Tendinopatía poplítea**","Poplíteo del **cóndilo externo** (delante del LLE) a la tibia; pies **hiperpronados**, carrera **cuesta abajo**; dolor **posterior**","**Conservador**; diferencial con menisco externo"],["**Plica sinovial**","Repliegue en el receso medial, normalmente asintomático; la **fibrosis** la vuelve patológica: resalte doloroso parapatelar interno entre **40–60°**","**Exéresis artroscópica**"]]},{"tipo":"perla","texto":"**Signo del poplíteo**: supino, pierna en rotación externa con el pie cruzado sobre la rodilla sana; el pulgar en la interlínea externa bajo el LLE; al extender activamente, el menisco externo se aproxima y la compresión duele."}]},{"id":"laterales","titulo":"Ligamentos laterales: LLI y LLE","bloques":[{"tipo":"tabla","titulo":"LLI vs LLE","columnas":["Rasgo","LLI (medial)","LLE (lateral)"],"filas":[["Anatomía","**Superficial**: estabilizador primario medial, del cóndilo interno a la tibia (6–7 cm bajo la interlínea); **profundo**: refuerzo capsular unido al menisco medial","**Cordonal cilíndrico, extracapsular**, del cóndilo externo (delante del poplíteo) a la **cabeza del peroné**"],["Mecanismo","Fuerza en la cara **externa** → **valgo** (esquí, fútbol)","Fuerza en la cara **interna** → **varo**"],["Cicatrización","**Favorable** (disminuye si hay lesión del LCA)","**Desfavorable** (fibras cordonales)"],["Exploración","**Valgo** en extensión y a 30°","**Varo** en extensión y a 30°"]]},{"tipo":"tabla","titulo":"Grados de lesión del LLI","columnas":["Grado","Clínica","Bostezo radiográfico"],"filas":[["I","Rotura parcial de algunas fibras, dolor puntual, **sin inestabilidad**","**\u003c 5 mm**"],["II","Más fibras rotas, dolor más intenso, sin inestabilidad","**6–10 mm**"],["III","**Rotura completa**, inestabilidad franca","**> 10 mm**"]]},{"tipo":"alerta","texto":"Maniobra **positiva a 30° y negativa en extensión** = rotura **aislada** del ligamento colateral. **Positiva en extensión** = rotura **asociada** a estabilizadores secundarios (cápsula posterointerna/externa y **LCA**)."},{"tipo":"parrafo","texto":"**RX** (2 proyecciones) descarta avulsiones; las Rx forzadas están en desuso. La **RM** es la más usada: localiza la rotura y lesiones asociadas (contusión del **cóndilo externo**); es frecuente **LLI + LCA y/o menisco interno** (complemento: la clásica tríada)."},{"tipo":"tabla","titulo":"Tratamiento","columnas":["Lesión","Tratamiento"],"filas":[["LLI grado 1–2","**Conservador**"],["LLI grado 3 aislado","Conservador; **cirugía** si deportista con desinserción tibial de ambos fascículos, **genu valgo** o desinserción capsular posterointerna con inestabilidad rotacional"],["LLI crónico o insuficiente","Plastia autóloga (**semitendinoso**) o injerto de cadáver"],["LLE grado 1–2","Calza de yeso u **órtesis en extensión 4 semanas**, AINE, carga según tolerancia; luego rehabilitación y férula articulada **4 semanas más**"],["LLE grado 3","**Quirúrgico** lo antes posible (avance de la inserción femoral, tenodesis del bíceps, injertos) y explorar la **esquina posterolateral**"]]}]},{"id":"lcp","titulo":"Lesión del ligamento cruzado posterior","bloques":[{"tipo":"parrafo","texto":"El **LCP** limita el desplazamiento **posterior** de la tibia (**90 %** de la resistencia); cerca de la extensión otras estructuras ayudan, lo que explica que algunas roturas aisladas se toleren bien. Supone el **3–20 %** de las lesiones ligamentosas de rodilla. Mide **33 × 13 mm** y es **más resistente que el LCA**."},{"tipo":"tabla","titulo":"Fascículos del LCP","columnas":["Fascículo","Función"],"filas":[["**Anterolateral**","Resiste el cajón posterior a **90°**; relajado en extensión; aspecto **curvado** en RM; el que se reconstruye con **un fascículo**"],["**Posteromedial**","**Tenso en extensión** (resiste la hiperextensión), se relaja en flexión media y se tensa en flexión completa"],["Meniscofemorales","**Humphrey** (anterior) y **Wrisberg** (posterior)"]]},{"tipo":"parrafo","texto":"Mecanismo típico: **impacto en la cara anterior de la tibia proximal con la rodilla flexionada** (el **portero** que sale contra el delantero) o **caída sobre la tuberosidad tibial con el pie en flexión plantar**."},{"tipo":"tabla","titulo":"Exploración del LCP","columnas":["Test","Rasgos"],"filas":[["**Cajón posterior**","**El más fiable**; la tibia ya parte subluxada atrás: puede parecer negativo, y un cajón **anterior** aparente puede confundirse con lesión del **LCA**"],["Prueba activa del cuádriceps","Supino, extensión contra resistencia: deslizamiento anterior excesivo = positivo"],["Recurvatum-rotación externa (**Hughston**)","Suspender la pierna por el dedo gordo: la tibia cae en recurvatum y RE; **inestabilidad posterolateral**"],["Escalón tibial","Normal: la tibia **1 cm por delante** del cóndilo interno; grado I sigue delante (~5 mm), II al mismo nivel (5–10 mm), III **por detrás** (> 10 mm)"]]},{"tipo":"dato","valor":"≥ 8 mm · 96 %","texto":"Traslación posterior en Rx de estrés que indica rotura completa; fiabilidad de la RM en lesiones agudas (menor en parciales y crónicas)."},{"tipo":"parrafo","texto":"Historia natural **controvertida**: muchas roturas aisladas (intersticiales) evolucionan bien a corto plazo y pueden cicatrizar con discreta laxitud; otros autores describen artrosis medial y femoropatelar. La actividad más limitada es **bajar escaleras**. Tratamiento **conservador** en aisladas grado 1–2; **quirúrgico** en **fracturas por arrancamiento**, lesiones **combinadas** y grado 2–3 **sintomáticas** (injerto HTH rotuliano o aloinjerto, uno o dos fascículos)."},{"tipo":"alerta","texto":"La complicación **más frecuente** tras reconstruir el LCP es la **pérdida de movilidad** (10–20° de flexión) por mala posición del injerto o rehabilitación inadecuada; otras: neuroapraxias, lesión del **nervio tibial** o de la **arteria poplítea** al labrar el túnel tibial."}]}],"caso_clinico":{"titulo":"Futbolista con dolor medial tras un giro","presentacion":"Futbolista de 24 años que gira con el pie apoyado y siente dolor en la interlínea medial. La rodilla se hincha al día siguiente. Refiere episodios de bloqueo. La maniobra de valgo es dolorosa pero estable a 30° y en extensión.","preguntas":[{"pregunta":"¿Qué lesión sugiere la cronología del derrame?","respuesta":"Un derrame **tardío (al día siguiente)** sugiere **lesión meniscal**; si hubiera aparecido en pocas horas, sospecharíamos **LCA**, e inmediato, lesión periférica o de cartílago."},{"pregunta":"¿Qué maniobras harías y qué limitación tienen?","respuesta":"**McMurray** (el más fiable, 63 %), Steinmann, Apley y Payr, además de la estabilidad ligamentosa; **ninguna es patognomónica**."},{"pregunta":"Si la RM muestra una rotura pero el paciente está asintomático, ¿operas?","respuesta":"**No**: la RM tiene falsos positivos y **la clínica domina** la decisión (“nunca operar una resonancia”); se operaría ante clínica compatible, p. ej., **bloqueos** por rotura en asa de cubo."}]},"preguntate":[{"pregunta":"¿Por qué se llama limpiaparabrisas al síndrome de la cintilla iliotibial?","respuesta":"Porque la cintilla roza repetidamente el cóndilo femoral externo en la flexo-extensión, como un limpiaparabrisas."},{"pregunta":"Describe los tests de Renne y Noble.","respuesta":"Renne: apoyo unipodal con flexión de 30–40°; Noble: presión en el epicóndilo lateral extendiendo la rodilla hasta 30° de flexión; positivos si duelen."},{"pregunta":"¿Qué factores producen hiperpresión rotuliana?","respuesta":"Hipertonía del vasto externo y alerón externo, hipotonía del vasto interno, ángulo Q aumentado, patela alta y alteraciones rotulianas."},{"pregunta":"¿Qué es el signo de la butaca?","respuesta":"Dolor femoropatelar al mantener la rodilla flexionada sentado mucho tiempo."},{"pregunta":"Describe las 4 fases de carga en la tendinopatía rotuliana.","respuesta":"Isométricos, isotónicos, ejercicios de almacenamiento de energía y retorno progresivo al deporte."},{"pregunta":"Interpreta la cronología del derrame en la rodilla.","respuesta":"Inmediato: periférico meniscal o cartílago; pocas horas: LCA; al día siguiente: lesión meniscal."},{"pregunta":"¿Por qué no se debe operar una resonancia?","respuesta":"Porque la RM tiene falsos positivos en asintomáticos; la decisión depende de la clínica."},{"pregunta":"Clasifica las lesiones del LLI por bostezo.","respuesta":"Grado I \u003c 5 mm, II 6–10 mm, III > 10 mm."},{"pregunta":"¿Qué significa una maniobra de valgo positiva en extensión?","respuesta":"Rotura asociada a estabilizadores secundarios (cápsula posterointerna y LCA), no aislada."},{"pregunta":"¿Cuál es el mecanismo típico y el test más fiable del LCP?","respuesta":"Impacto anterior en la tibia con la rodilla flexionada (portero); el cajón posterior."}],"glosario":[{"termino":"Cintilla iliotibial","definicion":"Banda de la fascia lata que se inserta en la tibia lateral."},{"termino":"Ángulo Q","definicion":"Ángulo entre el eje del cuádriceps y el del tendón rotuliano."},{"termino":"Signo de la butaca","definicion":"Dolor anterior al mantener la rodilla flexionada sentado."},{"termino":"Asa de cubo","definicion":"Rotura meniscal longitudinal que puede bloquear la rodilla."},{"termino":"Inhibición muscular artrogénica","definicion":"Inhibición refleja del cuádriceps por lesión articular."},{"termino":"McMurray","definicion":"Maniobra meniscal en flexión-extensión con rotación."},{"termino":"Bolsa anserina","definicion":"Bursa bajo la pata de ganso."},{"termino":"Plica sinovial","definicion":"Repliegue sinovial que puede volverse doloroso por fibrosis."},{"termino":"Bostezo articular","definicion":"Apertura de la interlínea al forzar varo o valgo."},{"termino":"Esquina posterolateral","definicion":"Complejo estabilizador posteroexterno de la rodilla."},{"termino":"Ligamento de Humphrey","definicion":"Ligamento meniscofemoral anterior."},{"termino":"Ligamento de Wrisberg","definicion":"Ligamento meniscofemoral posterior."},{"termino":"HTH","definicion":"Injerto hueso-tendón-hueso del tendón rotuliano."}],"fuentes":["Cook JL, Purdam CR. Is tendon pathology a continuum? Br J Sports Med.","Malliaras P, Cook J, Purdam C, Rio E (2015). Patellar Tendinopathy: Clinical Diagnosis, Load Management, and Advice for Challenging Case Presentations. JOSPT, 45(11), 887-898.","Cummings & Cushman. Tendinopathy in Athletes. Curr Phys Med Rehabil Rep, 7, 227–.","Amis AA, Bull. Biomechanics of the PCL and related structures.","Kennedy NI, Wijdicks CA, Goldsmith MT et al. Kinematic analysis of the posterior cruciate ligament. Am J Sports Med 2013;41(12):2828-2838.","Tewes DP et al. Chronically injured posterior cruciate ligament. Clin Orthop 1997;335:224-232.","Iwata S, Suda Y, Nagura T et al. Clinical disability in PCL deficient patients."],"qcm":[{"pregunta":"El síndrome de la cintilla iliotibial es más frecuente en:","opciones":["Genu varo","Patela alta","Pie cavo exclusivamente","Genu valgo"],"correcta":0,"explicacion":"Es frecuente en genu varo y en deportes con flexo-extensión repetida (carrera, ciclismo).","por_opcion":["✅ Literal.","❌ Factor femoropatelar.","❌ No.","❌ Asociado a hiperpresión rotuliana."]},{"pregunta":"Un rasgo característico del dolor en el síndrome de la cintilla iliotibial es que:","opciones":["Se acompaña de gran derrame","Empeora con el reposo","Aparece siempre a la misma distancia o tiempo de ejercicio","Es anterior y difuso"],"correcta":2,"explicacion":"El dolor aparece en la misma distancia recorrida o tiempo de ejercicio y cede con el reposo; no hay derrame relevante.","por_opcion":["❌ Mínimo.","❌ Cede.","✅ Literal.","❌ Es externo."]},{"pregunta":"El test de Noble se realiza:","opciones":["En supino con presión en el epicóndilo lateral extendiendo la rodilla hasta 30°","En apoyo unipodal con 30–40° de flexión","Suspendiendo la pierna por el dedo gordo","En prono con compresión axial"],"correcta":0,"explicacion":"Noble: supino, rodilla a 90°, presión sobre el epicóndilo lateral y extensión gradual hasta 30°; Renne es en apoyo unipodal.","por_opcion":["✅ Literal.","❌ Renne.","❌ Hughston.","❌ Apley."]},{"pregunta":"En la hiperpresión rotuliana, el paciente al localizar el dolor típicamente:","opciones":["Señala la interlínea medial","Cubre con la mano toda la cara anterior de la rodilla","Señala con un dedo el polo inferior de la rótula","Señala la cara posterior"],"correcta":1,"explicacion":"El dolor es sordo, impreciso, en la cara anterior: el paciente cubre con su mano toda la cara anterior de la rodilla.","por_opcion":["❌ Meniscal o LLI.","✅ Literal.","❌ Más propio de la tendinopatía rotuliana.","❌ Poplíteo."]},{"pregunta":"¿Qué factor muscular favorece la hiperpresión rotuliana?","opciones":["Hipertonía de los isquiotibiales","Hipertonía del vasto externo e hipotonía del vasto interno","Hipertonía del vasto interno","Hipotonía del vasto externo"],"correcta":1,"explicacion":"Hipertonía del vasto externo, aponeurosis y alerón externo e hipotonía del vasto interno desplazan la rótula lateralmente.","por_opcion":["❌ No se cita.","✅ Literal.","❌ Al revés.","❌ Al revés."]},{"pregunta":"Si en el test de báscula patelar el borde externo de la rótula queda por debajo de la horizontal, indica:","opciones":["Patela baja","Exceso de tensión del retináculo externo","Plica sinovial","Rotura del LLI"],"correcta":1,"explicacion":"Traduce un exceso de tensión del retináculo externo.","por_opcion":["❌ No.","✅ Literal.","❌ No.","❌ No."]},{"pregunta":"En la progresión de carga de la tendinopatía rotuliana, la primera fase consiste en:","opciones":["Ejercicios de almacenamiento de energía","Retorno al deporte","Ejercicios isotónicos","Ejercicios isométricos"],"correcta":3,"explicacion":"Fase 1 isométricos, fase 2 isotónicos, fase 3 almacenamiento de energía, fase 4 retorno progresivo al deporte.","por_opcion":["❌ Fase 3.","❌ Fase 4.","❌ Fase 2.","✅ Literal."]},{"pregunta":"Un derrame de rodilla que aparece a las pocas horas del traumatismo hace sospechar:","opciones":["Plica sinovial","Lesión meniscal","Síndrome de la cintilla iliotibial","Lesión del LCA"],"correcta":3,"explicacion":"Derrame inicial a las pocas horas: LCA; tardío (al día siguiente): menisco; inmediato: lesión periférica o cartílago.","por_opcion":["❌ No.","❌ Derrame tardío.","❌ Sin derrame.","✅ Literal."]},{"pregunta":"Un bloqueo completo de la rodilla sugiere:","opciones":["Lesión del LLE grado 1","Pata de ganso","Tendinopatía poplítea","Rotura en asa de cubo"],"correcta":3,"explicacion":"El bloqueo completo sugiere una rotura meniscal en asa de cubo, reductible o no.","por_opcion":["❌ No.","❌ No.","❌ No.","✅ Literal."]},{"pregunta":"¿Qué maniobra meniscal es la más conocida y fiable según el tema?","opciones":["Steinmann","Payr","McMurray","Apley"],"correcta":2,"explicacion":"McMurray es el más conocido y fiable (63 %), aunque ningún signo es patognomónico.","por_opcion":["❌ No.","❌ No.","✅ Literal.","❌ No."]},{"pregunta":"Respecto a la RM en la lesión meniscal:","opciones":["Tiene 90–98 % de precisión, pero con falsos positivos: la clínica domina","Solo es útil para el menisco externo","Siempre indica cirugía si muestra rotura","Es inferior a la radiografía"],"correcta":0,"explicacion":"La RM es la más fiable (90–98 %, mejor para el medial), pero hay falsos positivos en asintomáticos: no operar nunca una resonancia.","por_opcion":["✅ Literal.","❌ Mejor para el medial.","❌ No.","❌ No."]},{"pregunta":"Una lesión del LLI con bostezo articular de 8 mm corresponde al grado:","opciones":["I","III","IV","II"],"correcta":3,"explicacion":"Grado I \u003c 5 mm, II 6–10 mm, III > 10 mm.","por_opcion":["❌ \u003c 5 mm.","❌ > 10 mm.","❌ No existe.","✅ 6–10 mm."]},{"pregunta":"Una maniobra de valgo positiva a 30° de flexión y negativa en extensión indica:","opciones":["Rotura aislada del LLI","Rotura del LLI asociada al LCA","Lesión del LCP","Lesión meniscal externa"],"correcta":0,"explicacion":"Positiva a 30° y negativa en extensión: rotura aislada; positiva en extensión: asociada a estabilizadores secundarios y LCA.","por_opcion":["✅ Literal.","❌ Sería positiva en extensión.","❌ No.","❌ No."]},{"pregunta":"¿Por qué el LLE cicatriza peor que el LLI?","opciones":["Porque es intracapsular","Porque está unido al menisco","Porque su disposición cordonal no favorece la cicatrización","Porque se lesiona en valgo"],"correcta":2,"explicacion":"El LLE es cordonal y extracapsular; la disposición de sus fibras no favorece la cicatrización, a diferencia del LLI.","por_opcion":["❌ Es extracapsular.","❌ Es el LLI profundo.","✅ Literal.","❌ Se lesiona en varo."]},{"pregunta":"El signo más fiable para diagnosticar la rotura del LCP es:","opciones":["Cajón posterior","McMurray","Test de Noble","Cajón anterior"],"correcta":0,"explicacion":"El cajón posterior es el más fiable; cuidado porque la tibia parte subluxada atrás y un cajón anterior aparente puede confundirse con lesión del LCA.","por_opcion":["✅ Literal.","❌ Meniscal.","❌ Cintilla iliotibial.","❌ Puede inducir a error."]}],"asignatura":"Patología quirúrgica I","tema":10,"fecha":"2026-11-09"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips">${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
