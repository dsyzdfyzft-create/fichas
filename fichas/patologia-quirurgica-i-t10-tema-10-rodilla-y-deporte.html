<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 10 · Rodilla y deporte · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 10 · Rodilla y deporte","subtitulo":"Patología deportiva de la rodilla: cintilla iliotibial, hiperpresión rotuliana, tendinopatía rotuliana, meniscos, pata de ganso, fracturas por sobrecarga, ligamentos laterales, poplíteo, plica sinovial y LCP.","resumen":["El **síndrome de la cintilla iliotibial** («limpiaparabrisas») da dolor externo por fricción sobre el **cóndilo femoral externo**, aparece siempre a la **misma distancia o tiempo** de carrera, se explora con **Renne y Noble** y es conservador (Z-plastia si fracasa).","La **hiperpresión rotuliana** produce dolor anterior difuso, a menudo bilateral, con **signo de la butaca** y al bajar escaleras, por hipertonía del **vasto externo/alerón externo**, hipotonía del **vasto interno**, **ángulo Q** aumentado o **patela alta**.","La **tendinopatía rotuliana** sigue el **continuum de Cook y Purdam** (normal → reactiva → desestructurada → degenerativa, punto de no retorno) y se trata gestionando la carga en **4 fases**: isométricos, isotónicos, almacenamiento de energía y retorno al deporte.","En el **menisco** el derrame es **tardío (al día siguiente)**, el bloqueo completo sugiere **asa de cubo**, ningún test es patognomónico (**McMurray**, el más fiable, 63 %) y la **RM (90–98 %)** tiene falsos positivos: **nunca se opera una resonancia**.","En **LLI/LLE** la maniobra positiva **solo a 30°** indica rotura aislada y **positiva en extensión** lesión asociada; el **LCP** aporta el **90 %** de la resistencia al desplazamiento posterior, se diagnostica con el **cajón posterior** (cuidado con la subluxación previa) y su principal complicación quirúrgica es la **pérdida de flexión (10–20°)**."],"objetivos":["Reconocer la clínica y las pruebas de exploración de la cintilla iliotibial, la hiperpresión rotuliana y la tendinopatía rotuliana.","Diagnosticar una lesión meniscal por la anamnesis (cronología del derrame) y la exploración, y saber interpretar la RM.","Clasificar las lesiones de LLI, LLE y LCP por grados y elegir entre tratamiento conservador y quirúrgico.","Diferenciar pata de ganso, tendinopatía poplítea, plica sinovial y fracturas por sobrecarga.","Aplicar la progresión de cargas en la tendinopatía y las pautas postoperatorias del LCP."],"ideas_clave":["Cintilla iliotibial: flexoextensión repetida (carrera, ciclismo), **genu varo**, dolor a **distancia fija** que cede con reposo; DD con **meniscopatía externa**.","Hiperpresión rotuliana: dolor anterior, **bilateral**, aumenta con el **reposo sentado** (butaca) y al bajar; **genu valgo**, rótulas estrábicas; tests de **Zöhlen**, **Sage** y **báscula**.","Tendinopatía: el tendón **degenerativo no vuelve atrás**, pero el tendón sano restante puede asumir la función; tratar con **cargas progresivas**.","Menisco: derrame **al día siguiente**; inmediato → lesión periférica vascular o cartílago; a las pocas horas → **LCA**.","LLI grados por bostezo: **\u003c 5 mm, 6–10 mm, > 10 mm**; LLI cicatriza bien (fibras), LLE **cordonal cicatriza mal**.","Grado 3 de LLI aislado: conservador salvo **deportista con desinserción tibial de ambos fascículos**, **genu valgo** o lesión capsular posterointerna.","Plica sinovial patológica: **parapatelar interna**, resalte doloroso a **40–60°** de flexión; tratamiento: **exéresis artroscópica**.","LCP: fascículo **anterolateral** tenso a **90°** (se reconstruye en técnica de 1 fascículo); **posteromedial** tenso en extensión; Rx en estrés **≥ 8 mm** = rotura completa."],"secciones":[{"id":"cintilla","titulo":"Síndrome de la cintilla iliotibial","bloques":[{"tipo":"parrafo","texto":"Típico de deportes con **flexoextensión repetida** de rodilla (carrera continua, ciclismo) y frecuente en **genu varo**. Es el síndrome del «**limpiaparabrisas**»: la aponeurosis femoral (cintilla) roza el **cóndilo femoral externo** en cada ciclo, inflamando la **bursa** que hay debajo."},{"tipo":"lista","items":["Dolor en la **cara externa** ligado a la flexoextensión repetida.","Dolor selectivo a la presión sobre la cintilla en el cóndilo externo.","**Característico:** aparece siempre a la **misma distancia o tiempo** de ejercicio y **cede con el reposo**.","Sin derrame articular (mínimo).","**Diagnóstico diferencial: meniscopatía externa.**"]},{"tipo":"tabla","titulo":"Tests de fricción de la cintilla iliotibial","columnas":["Test","Posición","Maniobra","Positivo"],"filas":[["**Renne**","Bipedestación, **apoyo unipodal**","Flexionar a **30–40°**","Dolor"],["**Noble**","Decúbito supino, rodilla a **90°**","Presión en epicóndilo lateral + extensión gradual hasta **30°** de flexión","Dolor"]]},{"tipo":"parrafo","texto":"La **ecografía** localiza la lesión, permite evaluación dinámica, identifica anomalías estructurales, descarta otras patologías y guía el tratamiento. El tratamiento es **conservador (fisioterapia)**; la **Z-plastia** de la cintilla se reserva para el fracaso del conservador."},{"tipo":"dato","valor":"44 % → 91,7 %","texto":"Revisión de Beals y Flanigan citada en el PDF: el conservador (reposo 2–6 semanas, estiramientos, analgesia, modificar la carrera) logra un 44 % de curación completa con vuelta al deporte a las 8 semanas y un 91,7 % a los 6 meses; la escisión/liberación quirúrgica, un 100 % de retorno a las 7 semanas y a los 3 meses."},{"tipo":"figura","pagina":10,"pie":"Revisión de tratamientos del síndrome de la cintilla iliotibial: subrayados los porcentajes de curación conservadora y quirúrgica.","src":"img/patologia-quirurgica-i-t10-tema-10-rodilla-y-deporte-p10.jpg"},{"tipo":"alerta","texto":"Dolor externo de rodilla en un corredor: si aparece **siempre al mismo kilómetro** y desaparece al parar, piensa en **cintilla**; si hay **derrame, bloqueos** o mecanismo de torsión, piensa en **menisco externo**."}]},{"id":"hiperpresion","titulo":"Síndrome de hiperpresión rotuliana","bloques":[{"tipo":"parrafo","texto":"Desplazamiento anormal de la rótula en la tróclea. La rótula se mantiene por **las dos vertientes trocleares**, el **equilibrio vasto interno–externo** y la fijación de los **alerones rotulianos** y la aponeurosis femoral; el fallo de cualquiera produce defectos de alineación. Como las fuerzas femoropatelares son muy altas, **pequeñas pérdidas de congruencia producen trastornos severos**."},{"tipo":"tabla","titulo":"Factores anatómicos y biomecánicos","columnas":["Tipo","Estructuras"],"filas":[["**Hipertonía**","Vasto externo, aponeurosis femoral, **alerón rotuliano externo**"],["**Hipotonía**","**Vasto interno**"],["Morfología","**Aumento del ángulo Q**, **patela alta**, alteraciones anatómicas de la rótula"]]},{"tipo":"lista","items":["Dolor **sordo**, impreciso, de opresión o pesadez en la **cara anterior**: el paciente cubre con la mano toda la cara anterior.","Frecuentemente **bilateral**.","Aumenta con el reposo; típico el **signo de la butaca** (flexión mantenida) y al **bajar escaleras o cuestas**.","Inestabilidad por fallo o atrofia del cuádriceps, pseudobloqueos, **crujido o resalte** femoropatelar."]},{"tipo":"tabla","titulo":"Exploración física","columnas":["Prueba","Cómo","Positivo / significado"],"filas":[["Inspección","Bipedestación y sedestación","**Genu valgo**; rótulas centradas, **bizcas o estrábicas** (alteración rotacional); patela alta = rótulas prominentes"],["Trofismo","Perímetro a **10 cm** del polo superior de la rótula","Atrofia del cuádriceps"],["**Signo del cepillo / Zöhlen** (aprehensión)","Supino; presión en el polo superior + contracción del cuádriceps","**Aprehensión**"],["**Signo de Sage**","Supino, extensión, se pide flexión; palpación del alerón externo","Alerón externo **doloroso**"],["**Báscula patelar**","Supino; mano sobre la rótula durante la flexión","Borde externo **por debajo de la horizontal** = retináculo externo tenso"]]},{"tipo":"parrafo","texto":"Imagen: **Rx** AP-L y **axial de rótula**; **TAC** (relación femoropatelar); **RM** (estado del **cartílago**); gammagrafía. Tratamiento inicial: **fisioterapia intensa**, sobre todo si el origen es musculoesquelético. Si fracasa, cirugía sobre la causa."},{"tipo":"tabla","titulo":"Cirugía según la causa","columnas":["Causa","Técnica"],"filas":[["Displasia troclear","**Trocleoplastia de Dejour**"],["Displasia muscular","**Realineación proximal de Insall**"],["Alteración torsional","**Osteotomía desrotadora**"],["Báscula con retracción del alerón","**Apertura del alerón** por artroscopia"]]},{"tipo":"alerta","texto":"Cruce de epónimos: **Dejour** = tróclea (trocleoplastia); **Insall** = músculo (realineación proximal). Y la báscula patelar se debe a un **retináculo externo** tenso, no interno."}]},{"id":"tendinopatia","titulo":"Tendinopatía rotuliana","bloques":[{"tipo":"parrafo","texto":"Lesión por **sobreuso** con cambios estructurales negativos que reducen la **capacidad de carga y tolerancia** del tendón. La carga tiene efectos positivos y negativos sobre su homeostasis, y influyen características individuales, entrenamiento, edad, género, genética, adiposidad y comorbilidad."},{"tipo":"esquema","titulo":"Continuum de la tendinopatía (Cook y Purdam, 2009)","mermaid":"flowchart TD\n  N[\"Tendon normal\"] -->|\"carga optima\"| AD[\"Adaptacion\"]\n  N -->|\"carga excesiva + factores intrinsecos\"| R[\"Tendinopatia reactiva\"]\n  N -->|\"sin carga\"| DC[\"Menor capacidad tendinosa\"]\n  DC -->|\"carga normal o excesiva\"| R\n  R -->|\"modificar carga\"| N\n  R --> DS[\"Tendon desestructurado\"]\n  DS --> DG[\"Tendinopatia degenerativa\"]\n  DG -->|\"carga excesiva\"| RD[\"Reactiva en degenerativa\"]\n  RD -->|\"modificar carga\"| DG","pie":"La fase degenerativa es el punto de no retorno; desde la reactiva aún se puede volver al tendón normal."},{"tipo":"alerta","texto":"La **degeneración** es el **punto de no retorno**: el tendón no vuelve a su estado original. Pero el **tendón restante sano** puede asumir la función de todo el tendón y comportarse como normal: el objetivo es aumentar su capacidad, no «curar» la imagen."},{"tipo":"figura","pagina":28,"pie":"Modelo del continuum de Cook y Purdam y ecografía del tendón rotuliano (rótula, Hoffa, TTA).","src":"img/patologia-quirurgica-i-t10-tema-10-rodilla-y-deporte-p28.jpg"},{"tipo":"parrafo","texto":"Evaluación (Malliaras et al., 2015): **¿cómo?** sentadilla unipodal declinada; **¿dónde?** polo inferior de la rótula; **¿DD?** síndrome femoropatelar, síndrome de la grasa de Hoffa, roturas meniscales, lesiones de cartílago y dolor referido; **¿imagen?** ecografía y RM. Clasificación clínica: **I** dolor solo después del deporte; **II** dolor al inicio que desaparece al calentar y reaparece con la fatiga; **III** dolor constante en reposo y actividad; **IV** rotura completa."},{"tipo":"lista","items":["**Ecografía:** engrosamiento (*bulging*), pérdida del patrón fibrilar, **zonas hipoecoicas** (negras) y **neovascularización**.","**Neovascularización:** mecanismo adaptativo por el que el cuerpo aumenta el flujo sanguíneo de una zona para responder a una demanda que supera su capacidad."]},{"tipo":"tabla","titulo":"Progresión de cargas (Malliaras, Cook, Purdam y Rio, 2015)","columnas":["Fase","Criterio de inicio","Dosis"],"filas":[["**1. Isométricos**","Dolor más que mínimo durante el ejercicio isotónico","**5 × 45 s**, 2–3 veces/día, progresando al **70 % de la CVM** según dolor"],["**2. Isotónicos**","Dolor mínimo en isotónico","**3–4 series de 15 RM** progresando a **6 RM**, cada 48 h, hasta la fatiga"],["**3. Almacenamiento de energía**","Fuerza adecuada y simétrica (p. ej. ~150 % del peso corporal 4 × 8) y tolerancia: dolor mínimo que vuelve a basal en 24 h","Aumentar primero volumen y luego intensidad de gestos pliométricos del deporte"],["**4. Retorno al deporte**","Tolera la progresión de almacenamiento que replica el entrenamiento","Añadir ejercicios de entrenamiento y luego competición"]]},{"tipo":"dato","valor":"≤ 3/10","texto":"Definición de «dolor mínimo» en la tabla de progresión: 3 sobre 10 o menos."},{"tipo":"figura","pagina":35,"pie":"Tabla de fases de rehabilitación, criterios de progresión y dosificación de la tendinopatía rotuliana.","src":"img/patologia-quirurgica-i-t10-tema-10-rodilla-y-deporte-p35.jpg"},{"tipo":"perla","texto":"Usa la **respuesta a las 24 h** como guía: si el dolor en los tests de carga vuelve a su nivel basal al día siguiente, la carga se tolera y se puede progresar; si no, se retrocede de fase."}]},{"id":"menisco","titulo":"Afectación meniscal","bloques":[{"tipo":"parrafo","texto":"En la anamnesis se busca el **gesto desencadenante**. La **lesión aguda** es la más frecuente (en un tercio de los casos el gesto ocurre haciendo deporte): **torsión o cambio de dirección** con dolor. En el **cuadro crónico** no se reconoce gesto y la clínica es paulatina."},{"tipo":"esquema","titulo":"Cronología del derrame: qué sospechar","mermaid":"flowchart TD\n  A[\"Torsion de rodilla con dolor\"] --> B{\"Cuando aparece el derrame\"}\n  B -->|\"inmediato\"| C[\"Lesion vascular periferica del menisco o cartilago\"]\n  B -->|\"pocas horas\"| D[\"Sospechar LCA\"]\n  B -->|\"al dia siguiente\"| E[\"Lesion meniscal tipica\"]\n  E --> F[\"Bloqueo completo\"]\n  F --> G[\"Asa de cubo\"]","pie":"El momento de aparición del derrame orienta el diagnóstico."},{"tipo":"lista","items":["Dolor en la **interlínea** (4/5 casos) que puede impedir la carga.","Limitación, fallos, **bloqueos**: el bloqueo completo sugiere rotura en **asa de cubo** (reductible o no).","**Atrofia del cuádriceps** si es antigua (inhibición muscular artrogénica).","Edema: maniobra del **peloteo**."]},{"tipo":"tabla","titulo":"Maniobras meniscales","columnas":["Test","Técnica","Interpretación"],"filas":[["**McMurray**","Supino, desde flexión completa se extiende lentamente en **valgo y rotación interna** palpando las interlíneas","Dolor o **clic** en interlínea externa = **menisco externo**; el más conocido y fiable (**63 %**)"],["**Steinmann**","Sedestación al borde de la camilla; **valgo/varo + flexoextensión**","**Varo + rotación externa** = menisco **interno** (diferencia cuerno anterior/posterior)"],["**Apley**","**Prono**, rodilla a 90°; **compresión axial** + RI/RE","Dolor"],["**Payr**","Similar al Apley, centrado en la **tracción durante la RI**","Dolor"]]},{"tipo":"alerta","texto":"**Ningún signo es patognomónico** de lesión meniscal. Con rotura de **LCA** asociada es aún más difícil de diagnosticar: explora siempre la **estabilidad ligamentosa**."},{"tipo":"parrafo","texto":"**Rx simple y en carga, incluida la femoropatelar: OBLIGADA** para descartar otras lesiones. **RM**: precisión **90–98 %**, mejor para el **menisco medial**, no invasiva y sin radiación; la rotura se define por un aumento de señal que **comunica con una superficie articular** del menisco. Tiene **falsos positivos** en asintomáticos: **la clínica manda**."},{"tipo":"dato","valor":"RM 90–98 %","texto":"Precisión diagnóstica de la RM en el menisco; aun así, «¡no operar nunca una resonancia!»."},{"tipo":"lista","items":["**Diagnóstico diferencial:** plica sinovial medial, pinzamiento de la grasa de **Hoffa**, cuerpos libres, osteocondritis disecante, patología femoropatelar, lesión del **LLI**, condrosis, necrosis ósea, tendinitis del **poplíteo**, lesión tibioperonea proximal, patología reumática/metabólica."]}]},{"id":"pata-ganso-fracturas","titulo":"Pata de ganso y fracturas por sobrecarga","bloques":[{"tipo":"definicion","termino":"Pata de ganso","texto":"Inserción de **semitendinoso, sartorio y recto interno** en la cara **anteromedial proximal de la tibia**. La **bolsa anserina** separa estas inserciones de la del **ligamento lateral interno**."},{"tipo":"lista","items":["**Clínica:** dolor en la inserción, ligero engrosamiento y palpación dolorosa.","**Conservador:** readaptación deportiva, estiramientos, hielo, fisioterapia, AINE e infiltraciones locales.","**Quirúrgico:** dolor persistente tras el conservador.","**Resorte:** sacudida repentina al movilizar la articulación; **más frecuente en la región lateral** de la rodilla."]},{"tipo":"parrafo","texto":"Las **fracturas por sobrecarga** se asocian frecuentemente al **genu varo**, con **edema del platillo tibial** y localización en el **tercio proximal de la tibia**. La Rx inicial puede ser normal; la RM muestra el edema óseo y la gammagrafía la hipercaptación."},{"tipo":"figura","pagina":57,"pie":"Fractura por sobrecarga de tibia: Rx, RM con edema del platillo tibial y gammagrafía con hipercaptación.","src":"img/patologia-quirurgica-i-t10-tema-10-rodilla-y-deporte-p57.jpg"},{"tipo":"perla","texto":"En un corredor con dolor medial proximal de tibia, diferencia **pata de ganso** (dolor en la inserción tendinosa, partes blandas) de **fractura por sobrecarga** (dolor óseo, genu varo, edema en RM): la segunda exige descarga."}]},{"id":"ligamentos-laterales","titulo":"Lesiones de los ligamentos lateral interno (LLI) y lateral externo (LLE)","bloques":[{"tipo":"parrafo","texto":"Muy ligadas al deporte. El tratamiento pasó de una actitud **agresiva** a mediados del siglo XX a otra **conservadora** a finales de siglo; la clave es conocer el **alcance exacto** de la lesión y de las estructuras vecinas."},{"tipo":"tarjetas","items":[{"etiqueta":"LLI","titulo":"Anatomía","texto":"**Superficial**: estabilizador primario medial, del cóndilo interno a la tibia **6–7 cm** bajo la interlínea. **Profundo**: refuerzo capsular, del fémur al **menisco medial** y de este a la tibia."},{"etiqueta":"LLI","titulo":"Mecanismo","texto":"Fuerza sobre la **cara externa** (valgo) en extensión o ligera flexión + rotación externa (esquí, fútbol). Sus fibras **favorecen la cicatrización**, menos si hay lesión del LCA."},{"etiqueta":"LLE","titulo":"Anatomía","texto":"Cordón cilíndrico **extracapsular**, del cóndilo externo (delante del poplíteo) a la **cabeza del peroné**."},{"etiqueta":"LLE","titulo":"Mecanismo","texto":"Fuerza sobre la **cara interna** (varo) en extensión o ligera flexión. Su disposición **cordonal no favorece** la cicatrización."}]},{"tipo":"tabla","titulo":"Grados de lesión del LLI","columnas":["Grado","Lesión","Clínica","Bostezo radiográfico"],"filas":[["**1**","Rotura parcial de algunas fibras","Dolor puntual, sin inestabilidad","**\u003c 5 mm**"],["**2**","Rotura de más fibras","Más dolor, sin inestabilidad","**6–10 mm**"],["**3**","Rotura completa","**Inestabilidad franca**","**> 10 mm**"]]},{"tipo":"tabla","titulo":"Interpretación del bostezo (LLI en valgo / LLE en varo)","columnas":["Resultado","LLI","LLE"],"filas":[["**+ a 30°** y **– en extensión**","Rotura **aislada**","Rotura **aislada**"],["**+ en extensión**","Asociada a estabilizadores secundarios: **cápsula posterointerna y LCA**","Asociada a estabilizadores secundarios: **cápsula posteroexterna**"]]},{"tipo":"alerta","texto":"Un bostezo en valgo **en extensión completa** nunca es una lesión aislada del LLI: implica cápsula posterointerna y **LCA**. La prueba aislada del ligamento se hace a **30°** de flexión."},{"tipo":"parrafo","texto":"Imagen LLI: **Rx simple** (2 proyecciones) para descartar avulsiones o lesiones osteocondrales; las **Rx forzadas** están en desuso (irradian las manos y la fuerza no es reproducible). La **RM** es la más usada: localiza la rotura y lesiones asociadas (contusión del **cóndilo femoral externo**); es frecuente la asociación **LLI + LCA y/o menisco interno**."},{"tipo":"esquema","titulo":"Decisión terapéutica en la rotura del LLI","mermaid":"flowchart TD\n  A[\"Lesion aguda del LLI\"] --> B[\"Grado 1 o 2\"]\n  A --> C[\"Grado 3\"]\n  B --> CO[\"Conservador\"]\n  C --> D[\"Aislado\"]\n  C --> E[\"Con desinsercion capsular posterointerna e inestabilidad rotacional\"]\n  D --> CO\n  D --> Q1[\"Cirugia si deportista con desinsercion tibial de ambos fasciculos o genu valgo\"]\n  E --> Q[\"Quirurgico\"]\n  Q1 --> T[\"Agudo: puntos transoseos, grapas, tornillo con arandela\"]\n  Q --> T\n  CO -->|\"insuficiencia cronica\"| P[\"Plastia de semitendinoso o injerto de cadaver\"]","pie":"La mayoría de lesiones del LLI son conservadoras; la cirugía se reserva a supuestos concretos."},{"tipo":"tabla","titulo":"Tratamiento del LLE","columnas":["Lesión","Pauta"],"filas":[["**Grados 1 y 2**","Calza de yeso u ortesis en extensión **4 semanas**, AINE, **carga según tolerancia desde el día 1**; a las 4 semanas se retira, rehabilitación de movilidad y balance muscular y **férula articulada 4 semanas más**"],["**Grado 3** (± complejo posteroexterno)","**Quirúrgico**: sutura precoz + medida suplementaria (adelantar inserción femoral, **tenodesis del bíceps**, injerto de fascia lata o tendones); explorar siempre la **esquina posterolateral**"]]},{"tipo":"perla","texto":"La distinta respuesta al conservador se explica por la anatomía: el **LLI** (ancho, en contacto con cápsula y menisco) cicatriza bien; el **LLE** (cordonal y extracapsular) cicatriza mal, por eso el grado 3 del LLE es quirúrgico."}]},{"id":"popliteo-plica","titulo":"Tendinopatía poplítea y plica sinovial","bloques":[{"tipo":"parrafo","texto":"El **tendón del poplíteo** se inserta en el **cóndilo femoral externo por delante del LLE** y se dirige hacia atrás, por debajo de él, hasta la tibia. Su tendinopatía aparece en deportistas con **pies hiperpronados** y en **carreras cuesta abajo**: dolor en la **cara posterior** de la rodilla y palpación dolorosa del tendón. DD con **menisco externo**. Tratamiento **conservador**."},{"tipo":"definicion","termino":"Signo del poplíteo","texto":"Explora el **menisco externo**: supino, pierna en rotación externa con el pie cruzado sobre la rodilla sana (posición en «4»); el pulgar en la interlínea externa bajo el LLE (que se palpa como un cordón); al **extender activamente** la rodilla el menisco externo se aproxima y la compresión es dolorosa."},{"tipo":"parrafo","texto":"La **plica sinovial** es un repliegue sinovial del receso medial y del fondo de saco, normalmente **asintomático**. La **fibrosis** convierte una plica fisiológica en patológica: dolor en la cara anterior y, al palpar el borde del **cóndilo femoral interno**, un **resalte doloroso**."},{"tipo":"dato","valor":"40–60°","texto":"Arco de flexión en el que la plica patológica (zona **parapatelar interna**) roza el cóndilo y produce el resalte doloroso."},{"tipo":"lista","items":["**Tratamiento de la plica sintomática:** exéresis por **cirugía artroscópica**."]}]},{"id":"lcp","titulo":"Lesión del ligamento cruzado posterior (LCP)","bloques":[{"tipo":"parrafo","texto":"El LCP es el principal limitador del **desplazamiento posterior de la tibia**: aporta el **90 %** de la resistencia en todo el arco de movimiento, aunque cerca de la extensión otras estructuras toman protagonismo, lo que explica que algunas roturas aisladas sean **poco sintomáticas**. Su incidencia real se desconoce (**3–20 %** de las lesiones ligamentosas). Mide de media **33 × 13 mm**, es **más resistente que el LCA** y su inserción tibial (detrás y debajo de la superficie articular) se funde con el **cuerno posterior del menisco externo**."},{"tipo":"tabla","titulo":"Componentes del complejo LCP","columnas":["Componente","Tensión","Detalle"],"filas":[["**Fascículo anterolateral (FAE)**","Tenso a **90°** de flexión; relajado en extensión","Aspecto curvado en RM; inserción en el **techo de la escotadura**; se reconstruye en técnica de **1 fascículo**"],["**Fascículo posteromedial**","Tenso en **extensión completa** (resiste hiperextensión), se relaja en flexión media y se tensa en flexión completa","Inserción en la **pared medial** de la escotadura; se añade en técnica de **2 fascículos**"],["**Ligamentos meniscofemorales**","—","Anterior = **Humphrey**; posterior = **Wrisberg**"]]},{"tipo":"lista","items":["**Mecanismo deportivo típico:** **portero de fútbol** que sale en posición flexionada («casi fetal») y recibe un golpe en la cara anterior proximal de la pierna.","**Caída con impacto directo sobre la TTA** con el pie en flexión plantar (suele romperse el **FAE**)."]},{"tipo":"tabla","titulo":"Exploración del LCP","columnas":["Prueba","Técnica","Positivo / matiz"],"filas":[["**Recurvatum-rotación externa de Hughston**","Suspender la pierna por el **dedo gordo** y observar","Tibia en **recurvatum y rotación externa**: inestabilidad **posterolateral**"],["**Cajón posterior**","Empuje posterior de la tibia","**Signo más fiable**; ojo: la tibia parte **subluxada hacia atrás** (puede parecer negativo) y el cajón anterior puede simular una lesión de **LCA**"],["**Prueba activa del cuádriceps**","Supino; contracción del cuádriceps contra resistencia","**Deslizamiento anterior excesivo** de la tibia"],["**Escalón tibial**","Comparar platillo interno con cóndilo femoral (normal: tibia **1 cm por delante**)","Grado 1: tibia aún delante (~5 mm); grado 2: al mismo nivel (5–10 mm); grado 3: por detrás (> 10 mm)"]]},{"tipo":"dato","valor":"≥ 8 mm","texto":"Traslación posterior en **Rx de estrés** indicativa de **rotura completa** del LCP; la RM tiene una fiabilidad del **96 %** en lesiones agudas (menor en parciales y crónicas)."},{"tipo":"alerta","texto":"Trampa del cajón: en una rotura de LCP la tibia ya está **caída hacia atrás**; al tirar hacia delante se «reduce» y parece un **cajón anterior** positivo, lo que lleva a diagnosticar erróneamente un **LCA**."},{"tipo":"parrafo","texto":"**Historia natural** discutida: algunos pacientes sin tratamiento tienen síntomas mínimos durante años; otros desarrollan **artrosis medial y femoropatelar**. Las roturas aisladas suelen ser **intersticiales**, evolucionan bien a corto plazo y un porcentaje **cicatriza** con discreta laxitud. La actividad más limitada es **bajar escaleras** (carga en flexión → sobrecarga posterior)."},{"tipo":"esquema","titulo":"Tratamiento del LCP","mermaid":"flowchart TD\n  A[\"Rotura del LCP\"] --> B[\"Aislada grado 1 o 2\"]\n  A --> C[\"Fractura por arrancamiento\"]\n  A --> D[\"Lesiones combinadas\"]\n  A --> E[\"Grado 2 o 3 sintomatica\"]\n  B --> CO[\"Conservador\"]\n  C --> Q[\"Quirurgico\"]\n  D --> Q\n  E --> Q\n  Q --> V[\"Via: artrotomia, artroscopia o inlay tibial posterior\"]\n  Q --> I[\"Injerto: HTH rotuliano o aloinjerto, 1 o 2 fasciculos\"]","pie":"Conservador en lesiones aisladas de bajo grado; quirúrgico en arrancamientos, lesiones combinadas y grados 2–3 sintomáticos."},{"tipo":"tabla","titulo":"Postoperatorio del LCP","columnas":["Técnica","Pautas"],"filas":[["**HTH rotuliano artroscópico**","1.ª semana: **reducir edema y recuperar movilidad**; arco activo precoz; **carga total con rodillera en extensión**; rodillera **3 semanas** si se repararon también estructuras capsuloligamentosas; fortalecimiento escalonado"],["**Abordaje posterior en decúbito lateral**","Rodillera en extensión **2 semanas** con carga parcial y bastones; carga total a las 2 semanas con arco **0–90°**; isométricos de cuádriceps a **70–90°**; a las **6 semanas** marcha sin muletas e isquiotibiales en todo el arco"]]},{"tipo":"perla","texto":"La complicación más frecuente tras reconstruir el LCP es la **pérdida de movilidad**: media de **10–20° de flexión** por mala posición del injerto o rehabilitación inadecuada; la pérdida de **extensión** se ve tras inmovilizar en flexión. Otras: neuroapraxias por isquemia prolongada, lesión del **nervio tibial** al labrar el túnel y lesiones de la **arteria poplítea** (laceración, trombosis)."}]}],"caso_clinico":{"titulo":"Portero de fútbol con dolor posterior de rodilla","presentacion":"Varón de 24 años, portero, que en una salida chocó con el delantero recibiendo un golpe en la cara anterior proximal de la pierna con la rodilla flexionada. Una semana después refiere molestias al bajar escaleras. En supino con la rodilla a 90° la tuberosidad tibial queda al mismo nivel que el cóndilo femoral interno.","preguntas":[{"pregunta":"¿Qué estructura sospechas y qué grado presenta?","respuesta":"**LCP**, por el mecanismo típico del portero (golpe anterior con rodilla flexionada). La tibia al **mismo nivel** que el cóndilo (pierde su 1 cm anterior normal) corresponde a un **grado 2** (laxitud de 5–10 mm)."},{"pregunta":"¿Qué error puede cometerse al hacer el cajón y cómo confirmarías la lesión?","respuesta":"Como la tibia parte **subluxada hacia atrás**, el cajón posterior puede parecer negativo y el anterior positivo, simulando un **LCA**. Se confirma con la **prueba activa del cuádriceps**, la **RM** (96 % de fiabilidad en agudas) o **Rx de estrés** (≥ 8 mm = rotura completa)."},{"pregunta":"¿Qué tratamiento y qué riesgos postoperatorios debes vigilar si se opera?","respuesta":"Si es aislado y poco sintomático, **conservador**; si el grado 2 es **sintomático** o hay lesiones combinadas, **reconstrucción** (HTH o aloinjerto). Tras la cirugía vigilar la **pérdida de flexión (10–20°)**, la pérdida de extensión si se inmoviliza en flexión, y complicaciones neurovasculares (nervio tibial, arteria poplítea)."}]},"preguntate":[{"pregunta":"¿Por qué se llama «limpiaparabrisas» al síndrome de la cintilla iliotibial y qué lo caracteriza clínicamente?","respuesta":"Porque la cintilla barre el cóndilo femoral externo en cada flexoextensión. El dolor externo aparece a la misma distancia o tiempo de ejercicio y cede con el reposo."},{"pregunta":"Diferencia los tests de Renne y Noble.","respuesta":"Renne: apoyo unipodal y flexión a 30–40°. Noble: supino a 90°, presión en el epicóndilo lateral y extensión hasta 30°."},{"pregunta":"¿Qué tres estructuras mantienen la rótula centrada?","respuesta":"Las dos vertientes trocleares femorales, el equilibrio vasto interno-externo y los alerones rotulianos con la aponeurosis femoral."},{"pregunta":"¿Qué cirugía se indica para cada causa de hiperpresión rotuliana?","respuesta":"Displasia troclear: trocleoplastia de Dejour; muscular: realineación de Insall; torsional: osteotomía desrotadora; alerón retraído: apertura artroscópica."},{"pregunta":"Describe los estadios del continuum tendinoso y cuál es irreversible.","respuesta":"Normal, reactivo, desestructurado y degenerativo; el degenerativo es el punto de no retorno."},{"pregunta":"¿Qué sugiere un derrame inmediato, a las pocas horas o al día siguiente tras una torsión?","respuesta":"Inmediato: lesión periférica vascular del menisco o cartílago; pocas horas: LCA; al día siguiente: lesión meniscal típica."},{"pregunta":"¿Por qué se dice «no operar nunca una resonancia»?","respuesta":"Porque la RM, aunque precisa (90–98 %), da falsos positivos en asintomáticos; la decisión terapéutica la marca la clínica."},{"pregunta":"¿Cómo interpretas un bostezo en valgo positivo a 30° y negativo en extensión?","respuesta":"Rotura aislada del LLI; si fuera positivo en extensión indicaría lesión asociada de cápsula posterointerna y LCA."},{"pregunta":"¿Qué diferencia funcional hay entre los dos fascículos del LCP?","respuesta":"El anterolateral se tensa a 90° y se reconstruye en técnicas de un fascículo; el posteromedial se tensa en extensión completa y en flexión completa."},{"pregunta":"¿Cuál es la complicación más frecuente tras reconstruir el LCP y por qué ocurre?","respuesta":"La pérdida de movilidad (10–20° de flexión), por mala posición del injerto o rehabilitación inadecuada."}],"glosario":[{"termino":"Síndrome del limpiaparabrisas","definicion":"Fricción repetida de la cintilla iliotibial sobre el cóndilo femoral externo."},{"termino":"Z-plastia","definicion":"Alargamiento quirúrgico de la cintilla iliotibial cuando fracasa el conservador."},{"termino":"Signo de la butaca","definicion":"Dolor femoropatelar al permanecer sentado con la rodilla flexionada."},{"termino":"Báscula patelar","definicion":"Inclinación lateral de la rótula por tensión excesiva del retináculo externo."},{"termino":"Neovascularización","definicion":"Aumento adaptativo del flujo sanguíneo en un tendón sometido a una demanda superior a su capacidad."},{"termino":"Asa de cubo","definicion":"Rotura meniscal longitudinal desplazada que produce bloqueo completo."},{"termino":"Inhibición muscular artrogénica","definicion":"Inhibición refleja del cuádriceps por lesión articular, que lleva a atrofia."},{"termino":"Bolsa anserina","definicion":"Bolsa serosa entre los tendones de la pata de ganso y el LLI."},{"termino":"Bostezo articular","definicion":"Apertura de la interlínea ante una fuerza en varo o valgo; gradúa la lesión ligamentosa."},{"termino":"Esquina posterolateral","definicion":"Complejo estabilizador posteroexterno que debe explorarse en las roturas graves del LLE."},{"termino":"Plica sinovial","definicion":"Repliegue sinovial, patológico cuando se fibrosa (parapatelar interno, resalte a 40–60°)."},{"termino":"Ligamentos de Humphrey y Wrisberg","definicion":"Meniscofemorales anterior y posterior del complejo del LCP."},{"termino":"HTH","definicion":"Injerto hueso-tendón-hueso rotuliano usado en la reconstrucción ligamentosa."}],"fuentes":["Beals C, Flanigan D. A review of treatments for iliotibial band syndrome in the athletic population.","Cook JL, Purdam CR (2009). Is tendon pathology a continuum? Br J Sports Med.","Malliaras P, Cook J, Purdam C, Rio E (2015). Patellar tendinopathy: clinical diagnosis, load management, and advice for challenging case presentations. JOSPT 45(11):887–898.","Cummings K, Cushman DM (2019). Patellar tendinopathy in athletes. Curr Phys Med Rehabil Rep 7:227–236.","Amis AA, Bull AMJ et al. (2003). Biomechanics of the PCL and related structures. Knee Surg Sports Traumatol Arthrosc 11:271–281.","Kennedy NI, Wijdicks CA, Goldsmith MT et al. (2013). Kinematic analysis of the posterior cruciate ligament, part 1. Am J Sports Med 41(12):2828–2838.","Tewes DP, Fritts HM, Fields RD et al. (1997). Chronically injured posterior cruciate ligament: MRI. Clin Orthop 335:224–232.","Iwata S, Suda Y et al. Clinical disability in PCL-deficient patients relates to dynamic knee function during stair descent."],"qcm":[{"pregunta":"Corredora con genu varo y dolor en la cara externa de la rodilla que aparece siempre hacia el kilómetro 6 y cede al parar; no hay derrame. ¿Qué test confirma mejor la sospecha?","opciones":["Steinmann en varo y rotación externa","Signo del poplíteo con el pie cruzado","McMurray en valgo y rotación interna","Noble con extensión desde 90° y presión lateral"],"correcta":3,"explicacion":"El dolor externo a distancia fija que cede con reposo, en genu varo y sin derrame, sugiere síndrome de la cintilla iliotibial; el test de Noble (supino, 90°, presión en epicóndilo lateral y extensión hasta 30°) reproduce la fricción.","por_opcion":["❌ Steinmann en varo y RE explora el menisco interno.","❌ El signo del poplíteo explora el menisco externo.","❌ McMurray explora el menisco externo, el diagnóstico diferencial.","✅ Noble es un test de fricción de la cintilla."]},{"pregunta":"En el test de Renne para la cintilla iliotibial, ¿qué posición y maniobra se emplean?","opciones":["Supino con presión en el epicóndilo y extensión hasta 30°","Apoyo unipodal con flexión de rodilla a 30–40°","Sedestación con valgo y varo en flexoextensión","Prono a 90° con compresión axial y rotaciones"],"correcta":1,"explicacion":"Renne se realiza en bipedestación con apoyo unipodal flexionando la rodilla a 30–40°; es positivo si reproduce el dolor.","por_opcion":["❌ Es el test de Noble.","✅ Renne: unipodal y 30–40° de flexión.","❌ Es la maniobra de Steinmann.","❌ Corresponde al test de Apley (menisco)."]},{"pregunta":"¿Qué combinación de factores favorece el síndrome de hiperpresión rotuliana según el tema?","opciones":["Hipertonía del vasto interno e hipotonía del alerón externo","Hipertonía del vasto externo y disminución del ángulo Q","Hipertonía del alerón externo y aumento del ángulo Q","Hipotonía del vasto interno y patela baja"],"correcta":2,"explicacion":"Favorecen la hiperpresión la hipertonía del vasto externo, la aponeurosis femoral y el alerón externo, la hipotonía del vasto interno, el aumento del ángulo Q, la patela alta y las alteraciones de la rótula.","por_opcion":["❌ Invierte los papeles: el hipotónico es el vasto interno y el hipertónico el alerón externo.","❌ El ángulo Q está aumentado.","✅ Ambos factores aparecen en el PDF.","❌ La patela es alta, no baja."]},{"pregunta":"Paciente con dolor anterior bilateral que empeora tras el cine y al bajar cuestas. En supino, al flexionar, el borde externo de la rótula queda por debajo de la horizontal. ¿Qué indica este hallazgo?","opciones":["Atrofia aislada del vasto externo","Insuficiencia del alerón rotuliano externo","Displasia de la vertiente troclear interna","Exceso de tensión del retináculo externo"],"correcta":3,"explicacion":"En el test de báscula patelar, que el borde externo quede por debajo de la horizontal traduce un exceso de tensión del retináculo externo; si fracasa el conservador se indica la apertura artroscópica del alerón.","por_opcion":["❌ La hipertonía, no la atrofia, del vasto externo favorece la báscula.","❌ Es justo lo contrario: el alerón está retraído, no insuficiente.","❌ La displasia troclear no se valora con este test.","✅ Interpretación literal del test de báscula."]},{"pregunta":"Ante un síndrome de hiperpresión rotuliana por displasia troclear refractaria al conservador, ¿qué técnica propone el tema?","opciones":["Trocleoplastia de Dejour","Realineación proximal de Insall","Apertura artroscópica del alerón","Osteotomía desrotadora"],"correcta":0,"explicacion":"Se actúa sobre la causa: displasia troclear → trocleoplastia de Dejour; displasia muscular → realineación de Insall; torsional → osteotomía desrotadora; báscula con alerón retraído → apertura del alerón.","por_opcion":["✅ Dejour = tróclea.","❌ Insall corrige la displasia muscular.","❌ La apertura del alerón trata la báscula con retracción.","❌ La osteotomía corrige la alteración torsional."]},{"pregunta":"Según el continuum de Cook y Purdam, ¿qué afirmación es correcta?","opciones":["El tendón reactivo es irreversible y evoluciona siempre a degenerativo","El tendón degenerativo puede volver a ser normal con isométricos","La degeneración es un punto de no retorno, pero el tendón sano restante puede asumir la función","El tendón desestructurado aparece antes que el reactivo"],"correcta":2,"explicacion":"Las fases son normal, reactivo, desestructurado y degenerativo. La degeneración es el punto de no retorno, aunque el tendón restante puede asumir la función de todo el tendón y comportarse como normal.","por_opcion":["❌ La fase reactiva puede volver a normal modificando la carga.","❌ La degeneración no revierte al estado original.","✅ Coincide con el PDF.","❌ El orden es reactivo → desestructurado."]},{"pregunta":"Saltador con tendinopatía rotuliana y dolor de 6/10 durante la prensa de piernas. Según la progresión de Malliaras et al., ¿qué pauta inicial corresponde?","opciones":["3–4 series de 15 RM cada 48 h","Isométricos de 5 × 45 s, 2–3 veces al día","Ejercicios específicos del deporte sin competición","Pliometría progresiva en volumen y luego intensidad"],"correcta":1,"explicacion":"Con dolor más que mínimo (> 3/10) durante el isotónico se empieza por la fase 1: isométricos de 5 repeticiones de 45 s, 2–3 veces al día, progresando al 70 % de la CVM.","por_opcion":["❌ Es la fase 2 (isotónicos), que exige dolor mínimo.","✅ Fase 1: isométricos.","❌ Es la fase 4 (retorno al deporte).","❌ Es la fase 3 (almacenamiento de energía)."]},{"pregunta":"Tras una torsión jugando al baloncesto, la rodilla se hincha a las pocas horas. ¿Qué lesión debe sospecharse primero según el tema?","opciones":["Lesión de la parte periférica del menisco","Síndrome de la plica sinovial medial","Rotura meniscal en asa de cubo","Lesión del LCA"],"correcta":3,"explicacion":"En la lesión meniscal el derrame es tardío (al día siguiente). El derrame inmediato sugiere lesión periférica vascular del menisco o del cartílago, y el que aparece a las pocas horas hace sospechar lesión del LCA.","por_opcion":["❌ La lesión periférica vascular da derrame inmediato.","❌ La plica no produce hemartros agudo postorsional.","❌ El asa de cubo se sospecha por bloqueo completo, no por el derrame precoz.","✅ Derrame a las pocas horas → LCA."]},{"pregunta":"Durante la maniobra de McMurray en valgo y rotación interna se percibe un clic doloroso en la interlínea externa. ¿Qué indica y qué fiabilidad le atribuye el tema?","opciones":["Rotura del menisco externo; 90–98 %","Rotura del menisco interno; 63 %","Rotura del menisco interno; 90–98 %","Rotura del menisco externo; 63 %"],"correcta":3,"explicacion":"McMurray, el test más conocido y fiable (63 %), indica rotura del menisco externo si aparece dolor o clic en la interlínea externa al extender en valgo y rotación interna. El 90–98 % es la precisión de la RM.","por_opcion":["❌ 90–98 % es la precisión de la RM, no del test.","❌ El clic es en la interlínea externa: menisco externo.","❌ Lado y cifra incorrectos.","✅ Menisco externo y 63 %."]},{"pregunta":"Paciente asintomático con una RM que muestra aumento de señal intrameniscal que no alcanza la superficie articular. ¿Qué actitud es correcta?","opciones":["Repetir la RM con contraste antes de operar","Meniscectomía artroscópica por riesgo de progresión","No intervenir: no define rotura y la clínica manda","Sutura meniscal preventiva"],"correcta":2,"explicacion":"La rotura se define por un aumento de señal que comunica con una cara articular del menisco; además, la RM da falsos positivos en asintomáticos y la clínica domina la decisión: nunca se opera una resonancia.","por_opcion":["❌ El problema no es técnico: sin clínica no se opera.","❌ No hay rotura ni síntomas que justifiquen cirugía.","✅ Coincide con el criterio del tema.","❌ No existe indicación preventiva sin clínica."]},{"pregunta":"Esquiador con bostezo en valgo positivo a 30° de flexión y también positivo en extensión completa. ¿Qué indica?","opciones":["Rotura del LLI con afectación de la cápsula posterointerna y el LCA","Rotura de grado 1 del LLI con contusión ósea","Rotura aislada de grado 3 del LLI","Rotura aislada del LLE con esquina posterolateral"],"correcta":0,"explicacion":"Si la maniobra es positiva a 30° y negativa en extensión, la rotura es aislada; si es positiva en extensión, se asocia a lesión de estabilizadores secundarios: estructura capsular posterointerna y LCA.","por_opcion":["✅ Interpretación del PDF.","❌ Un grado 1 no produce bostezo en extensión.","❌ La positividad en extensión excluye la lesión aislada.","❌ El valgo explora el LLI, no el LLE."]},{"pregunta":"Rx forzada con apertura medial de 8 mm en una lesión del LLI. ¿Qué grado y qué tratamiento corresponden?","opciones":["Grado 2; conservador","Grado 3; quirúrgico en todos los casos","Grado 1; conservador","Grado 3; conservador si es aislado"],"correcta":0,"explicacion":"El bostezo de 6–10 mm corresponde al grado 2; las roturas de grado 1 y 2 del LLI se tratan de forma conservadora.","por_opcion":["✅ 6–10 mm = grado 2, conservador.","❌ El grado 3 supera los 10 mm y no siempre es quirúrgico.","❌ El grado 1 tiene menos de 5 mm.","❌ 8 mm no alcanza el grado 3."]},{"pregunta":"¿Por qué el tema justifica una actitud más quirúrgica en la rotura de grado 3 del LLE que en la del LLI?","opciones":["Porque su disposición cordonal no favorece la cicatrización","Porque el LLE se lesiona por fuerzas en valgo de alta energía","Porque el LLE es intracapsular y queda bañado en líquido sinovial","Porque el LLE se inserta en la tibia 6–7 cm bajo la interlínea"],"correcta":0,"explicacion":"El LLE es un cordón cilíndrico extracapsular cuya disposición no favorece la cicatrización; el LLI, en cambio, tiene fibras que favorecen la curación, por lo que incluso su grado 3 aislado suele ser conservador.","por_opcion":["✅ Motivo anatómico recogido en el PDF.","❌ El LLE se lesiona por fuerzas en varo (sobre la cara interna).","❌ El LLE es extracapsular.","❌ Esa inserción distal corresponde al LLI superficial."]},{"pregunta":"Respecto al fascículo anterolateral del LCP, ¿qué afirmación es correcta?","opciones":["Corresponde al ligamento meniscofemoral de Wrisberg","Se reconstruye en técnicas de un solo fascículo y se tensa a 90°","Se inserta en la pared medial de la escotadura intercondílea","Está tenso en extensión completa y resiste la hiperextensión"],"correcta":1,"explicacion":"El fascículo anterolateral resiste el desplazamiento posterior de la tibia a 90° de flexión, está relajado en extensión, se inserta en el techo de la escotadura y es el que se reconstruye en técnicas de un fascículo.","por_opcion":["❌ Wrisberg es el meniscofemoral posterior.","✅ Coincide con el PDF.","❌ La pared medial corresponde al posteromedial.","❌ Describe al fascículo posteromedial."]},{"pregunta":"En la exploración del LCP con la rodilla a 90°, la tibia puede llevarse por detrás del cóndilo femoral interno. ¿Qué grado y laxitud se estiman?","opciones":["Grado 3; más de 10 mm","Grado 1; unos 5 mm","Grado 2; más de 10 mm","Grado 2; 5–10 mm"],"correcta":0,"explicacion":"Normalmente la tibia está 1 cm por delante del cóndilo. Grado 1: sigue por delante (~5 mm); grado 2: al mismo nivel (5–10 mm); grado 3: puede llevarse por detrás (> 10 mm).","por_opcion":["✅ Por detrás del cóndilo = grado 3, > 10 mm.","❌ En el grado 1 la tibia sigue por delante.","❌ Mezcla el grado 2 con la laxitud del grado 3.","❌ En el grado 2 queda al mismo nivel."]}],"asignatura":"Patología quirúrgica I","tema":10,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
