<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Tema 12. Inestabilidad glenohumeral aguda y crónica · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>

<script id="datos" type="application/json">{"titulo":"Tema 12. Inestabilidad glenohumeral aguda y crónica","subtitulo":"Pérdida de la relación entre cabeza humeral y glena: estabilizadores, clasificaciones (Rockwood, Neer, Matsen), clínica de la luxación anterior, posterior e inferior, exploración, lesiones asociadas y tratamiento.","resumen":["El hombro es la articulación **más móvil** y la diartrosis **más luxable (45 % de las luxaciones)**: dos superficies poco congruentes que dependen de **estabilizadores estáticos** (labrum, ligamentos glenohumerales, cápsula, presión negativa) y **dinámicos** (manguito rotador, periescapulares, bíceps).","La luxación **anterior** domina (hasta el **85-95 %**), la **subcoracoidea** es la más frecuente por **abducción + extensión + rotación externa** y da **hombro en charretera** con brazo en leve abducción y RE; la **posterior** (~**5 %**) pasa desapercibida hasta en un **50 %** y se sospecha por la **RE limitada**.","El diagnóstico es **clínico**: el **test de la sorpresa** es el más exacto, la **recolocación** tiene S 81 %/E 92 % y la **aprehensión** S 72 %/E 96 %; la **artroRM es el patrón oro** para confirmar y valorar lesiones asociadas.","Las lesiones clave son **Bankart** (desinserción del labrum anteroinferior, **97 %** de las lesiones del labrum) y **Hill-Sachs** (impactación **posterolateral** de la cabeza humeral); la recidiva depende sobre todo de la **edad** (hasta un **90 % en \u003c 20 años**).","La luxación aguda se trata con **reducción urgente** (mejor la **tracción simple en el eje**), valoración de lesiones, **inmovilización según la edad** (\u003c 20 años 3-4 semanas) y **rehabilitación**; la crónica con rehabilitación (AMBRI) o cirugía (**Bankart artroscópico**, **Latarjet** si hay gran defecto glenoideo, **remplissage**, plicatura)."],"objetivos":["Definir la inestabilidad glenohumeral y sus grados, y explicar el papel de los estabilizadores estáticos y dinámicos.","Aplicar las clasificaciones de Rockwood, Gerber y Nyffeler, Neer y Thomas y Matsen (TUBS/AMBRI).","Reconocer la clínica de la luxación anterior, posterior e inferior y las pruebas de exploración con su sensibilidad y especificidad.","Identificar las lesiones asociadas (Bankart, Bankart óseo, Hill-Sachs, ALPSA, Perthes, GLAD, HAGL, SLAP) y el algoritmo de imagen.","Describir el tratamiento de la luxación aguda (reducción, inmovilización, rehabilitación) y de la inestabilidad crónica."],"ideas_clave":["Hombro: articulación más móvil y **diartrosis más luxable (45 %)**; cabeza humeral = **1/3 de esfera**, ángulo cervicodiafisario **130°**.","**LGHI**: el estabilizador **más importante**; estabiliza en **ABD 90° + RE** (anteroinferior). LGHM: anterior **\u003c 90°**. LGHS: traslación **superior**.","Anterior **subcoracoidea** (ABD + extensión + RE) → **charretera**; posterior (convulsiones, alta energía) → brazo en **aducción + RI**, RE bloqueada, **subacromial**.","**Recidiva según edad** del primer episodio: \u003c 20 años **90 %** (80 % en 13-20 años según otra tabla del tema), > 40 años **10 %** con muchas roturas del manguito.","Test de la **sorpresa** = la prueba **más exacta**; **surco** que desaparece en RE = **intervalo rotador incompetente**; **Gagey** > 105° = LGHI/cápsula inferior incompetente.","**Bankart** = labrum anteroinferior (97 % de lesiones del labrum); **Hill-Sachs** = impactación posterolateral de la cabeza; **SLAP** = labrum superior + bíceps (tipo II el más frecuente).","Reducción anterior: **tracción simple en el eje** (mejores resultados, menos complicaciones); posterior: **rotación interna en aducción**.","**TUBS** → cirugía (Bankart); **AMBRI** → rehabilitación; **Latarjet** si gran defecto óseo glenoideo; la cirugía está **contraindicada en luxadores voluntarios**."],"secciones":[{"id":"definicion","titulo":"1. Definición, grados y epidemiología","bloques":[{"tipo":"parrafo","texto":"El miembro superior se considera la «prolongación del cerebro» por las actividades de la mano, y el hombro es su base: **posiciona la mano en el espacio**. Es la **articulación más móvil del cuerpo**, la **diartrosis más luxable (45 % de las luxaciones)** y causa muy frecuente de dolor e impotencia funcional."},{"tipo":"definicion","termino":"Inestabilidad glenohumeral","texto":"**Pérdida de la relación articular** entre la cabeza humeral y la cavidad glenoidea; **incapacidad para mantener el centro de la cabeza humeral dentro de la glena durante el movimiento**."},{"tipo":"tarjetas","items":[{"etiqueta":"Grado 1","titulo":"Hiperlaxitud","texto":"Aumento de la movilidad, sin síntomas."},{"etiqueta":"Grado 2","titulo":"Inestabilidad","texto":"Inicio de los síntomas."},{"etiqueta":"Grado 3","titulo":"Aprehensión","texto":"Miedo por la facilidad para la luxación."},{"etiqueta":"Grado 4","titulo":"Subluxación","texto":"Pérdida de congruencia **parcial** de las superficies articulares."},{"etiqueta":"Grado 5","titulo":"Luxación","texto":"Pérdida de congruencia **completa** de las superficies articulares."}]},{"tipo":"parrafo","texto":"Es una lesión frecuente en **población joven**, más frecuente entre la **2.ª y la 6.ª década**, y el **95 % es traumática**. El riesgo de reincidencia es máximo en los menores de 20 años."},{"tipo":"tabla","titulo":"Recurrencia según la edad (dos tablas del tema)","columnas":["Edad","Tasa de recurrencia (epidemiología)","Edad del 1.er episodio","Luxación recidivante"],"filas":[["\u003c 20 años","**90 %**","13-20 años","**80 %**"],["20-40 años","**60 %**","20-30 años","**50 %**"],["> 40 años","**10 %**, con altas tasas de **rotura del manguito rotador**","> 30 años","**20 %**"]]},{"tipo":"alerta","texto":"El tema da **dos tablas de recidiva** con cifras distintas (90/60/10 % por décadas y 80/50/20 % según la edad del primer episodio). La idea constante es: **cuanto más joven, más recidiva**. En el **> 40 años** la recidiva es baja, pero hay que buscar una **rotura del manguito rotador**."}]},{"id":"anatomia","titulo":"2. Anatomía y estabilizadores","bloques":[{"tipo":"parrafo","texto":"A nivel óseo, la **cabeza humeral** equivale a **1/3 de la superficie de una esfera** con un **ángulo cabeza-diáfisis de 130°**, frente a una **cavidad glenoidea** pequeña. Son **dos superficies poco congruentes**: gran movilidad, pero gran inestabilidad y necesidad de otras estructuras estabilizadoras que mantengan la cabeza en el centro de la glena."},{"tipo":"tabla","titulo":"Rangos articulares del hombro","columnas":["Movimiento","Rango"],"filas":[["Flexión / extensión","**0-180°** / **0-60°**"],["Abducción / aducción","**0-180°** / **0-45°** (más de 90° de ABD exige RE del húmero y giro de la escápula)"],["Flexión / extensión horizontal (brazo a 90°)","**130°** / **40-50°**"],["Rotaciones con el brazo pegado","RE **0-40/60°**; RI **0-90°**"],["Rotaciones en ABD de 90°","RE **70°**; RI **70°**"]]},{"tipo":"tabla","titulo":"Estabilizadores de la articulación glenohumeral","columnas":["Tipo","Estructura","Función"],"filas":[["Estático","**Labrum glenoideo**","Anillo que **aumenta el área y la profundidad** de la glena y la superficie de contacto (el tema lo describe como cartílago hialino)"],["Estático","**LGHS** (superior)","Principal estabilizador en **traslación superior**"],["Estático","**LGHM** (medio)","Estabilizador **anterior** en posiciones **\u003c 90°**"],["Estático","**LGHI** (inferior)","Estabiliza el brazo en **ABD de 90°**; anteroinferior en **RE + ABD**. **El más importante**"],["Estático","Cápsula posterior, **intervalo rotador**","Contención capsular"],["Estático","**Presión intraarticular negativa**","Solo si la **cápsula está íntegra**"],["Estático","**Adhesión/cohesión**","Como dos cristales con una gota de agua (líquido articular)"],["Dinámico","**Manguito rotador**, músculos **periescapulares**, **tendón largo del bíceps**","**Compresión** de la articulación"]]},{"tipo":"figura","pagina":9,"pie":"Vista de la glena con los ligamentos glenohumerales: superior (rojo), medio (gris) y el complejo inferior (amarillo, LGHAI y LGHPI) que hace de hamaca bajo la cabeza en abducción.","src":"img/patologia-quirurgica-i-t12-tema-12-inestabilidad-glenohumeral-aguda-y-cronica-p9.jpg"},{"tipo":"dato","valor":"1/3 de esfera · 130°","texto":"Geometría de la cabeza humeral: superficie de un tercio de esfera y ángulo cabeza-diáfisis de 130°, frente a una glena pequeña y poco congruente."},{"tipo":"perla","texto":"En la rehabilitación del hombro inestable el fisioterapeuta trabaja precisamente los **estabilizadores dinámicos** (manguito rotador, estabilizadores de la escápula, deltoides): son los únicos que se pueden entrenar, y compensan unos estabilizadores estáticos dañados."}]},{"id":"clasificacion","titulo":"3. Clasificaciones","bloques":[{"tipo":"tabla","titulo":"Criterios generales de clasificación","columnas":["Según","Tipos"],"filas":[["Grado","**Luxación**, **subluxación**"],["Frecuencia","**Aguda** y **crónica** (esta última **recurrente** o **fija**)"],["Dirección","**Unidireccional**, **bidireccional** o **multidireccional**"],["Etiología","**Traumática**, **atraumática** (voluntaria o involuntaria), adquirida, congénita o neuromuscular"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Rockwood","titulo":"Añade la voluntad","texto":"**I**: subluxación traumática **sin** luxación previa. **II**: subluxación traumática **con** luxación previa. **IIIA**: subluxación voluntaria **con** problemas psiquiátricos. **IIIB**: voluntaria **sin** problemas psiquiátricos. **IV**: subluxación **atraumática involuntaria**."},{"etiqueta":"Gerber y Nyffeler","titulo":"Tres clases","texto":"**Estática (A)**, **dinámica (B)** o **voluntaria (C)**."},{"etiqueta":"Neer","titulo":"Dirección","texto":"**Anterior**, **posterior**, **inferior** y **multidireccional**."},{"etiqueta":"Thomas y Matsen","titulo":"Etiología","texto":"Dos cuadros típicos en los extremos de un abanico: **TUBS** y **AMBRI** (con pacientes laxos que sufren un traumatismo en la zona intermedia)."}]},{"tipo":"esquema","titulo":"Matsen: los dos cuadros típicos","mermaid":"flowchart LR\n  A[\"Inestabilidad glenohumeral\"] --> T[\"TUBS\"]\n  A --> M[\"AMBRI\"]\n  T --> T1[\"T: episodio traumático\"]\n  T --> T2[\"U: unidireccional\"]\n  T --> T3[\"B: lesión de Bankart\"]\n  T --> T4[\"S: tratamiento quirúrgico\"]\n  M --> M1[\"A: atraumática\"]\n  M --> M2[\"M: multidireccional\"]\n  M --> M3[\"B: bilateral\"]\n  M --> M4[\"R: responde a rehabilitación\"]\n  M --> M5[\"I: intervalo rotador o shift capsular inferior\"]","pie":"TUBS = traumática y quirúrgica; AMBRI = atraumática y rehabilitadora. Es la clasificación que más orienta el tratamiento."},{"tipo":"figura","pagina":13,"pie":"Algoritmo que reúne todas las clasificaciones: voluntaria frente a involuntaria, después la dirección (anterior, posterior, multidireccional) y la etiología (traumática o atraumática por uso excesivo o hiperlaxitud).","src":"img/patologia-quirurgica-i-t12-tema-12-inestabilidad-glenohumeral-aguda-y-cronica-p13.jpg"},{"tipo":"dato","valor":"95 % / 5 %","texto":"Traumáticas anteroinferiores ~**95 %** (96 % anteriores en el esquema); posteriores, atraumáticas y multidireccionales juntas ~**5 %**."},{"tipo":"alerta","texto":"En **AMBRI** la «I» se refiere al tratamiento quirúrgico si fracasa la rehabilitación (**shift capsular inferior** con reparación del **intervalo rotador**), no a «inestabilidad inferior». Y el tipo **III de Rockwood** es el **voluntario**, dividido según haya o no **problemas psiquiátricos**."}]},{"id":"clinica","titulo":"4. Clínica según la dirección de la luxación","bloques":[{"tipo":"tabla","titulo":"Comparación de las luxaciones glenohumerales","columnas":["","Anterior","Posterior","Inferior (luxatio erecta)"],"filas":[["Frecuencia","Hasta el **85 %** de las luxaciones de hombro (95 % anteroinferiores)","~**5 %**","Rara"],["Mecanismo","**ABD + extensión + RE**; luxación traumática o **microtraumatismos repetitivos**","**Convulsiones** (epilepsia, alcohol, shock eléctrico), alta energía; en deportistas, subluxación por microtraumatismos","Húmero con la diáfisis hacia arriba y cabeza encastrada **bajo la glena**"],["Posición de la cabeza","**Subcoracoidea** (la más frecuente)","**Subacromial** (la más frecuente), subglenoidea o subespinosa","Subglenoidea"],["Inspección","**Hombro en charretera**; brazo en **leve ABD y RE**; impotencia para RI y aducción completas; muy doloroso","Sin deformidad llamativa; prominencia posterior palpable; hombro más redondeado; brazo en **aducción y RI**","Brazo en elevación, cuadro muy característico"],["Particularidades","Si no se trata bien puede quedar inestabilidad recurrente o permanente","**Pasa desapercibida hasta en un 50 %**; signo de sospecha: **RE activa y pasiva limitada**","Frecuentes **lesiones graves de partes blandas**, fractura de húmero proximal y **lesiones neurovasculares**"]]},{"tipo":"figura","pagina":20,"pie":"Luxación anterior: radiografía con la cabeza humeral fuera de la glena y deformidad en «charretera» por la pérdida del relieve del deltoides bajo el acromion.","src":"img/patologia-quirurgica-i-t12-tema-12-inestabilidad-glenohumeral-aguda-y-cronica-p20.jpg"},{"tipo":"alerta","texto":"Ante un paciente que tras una **crisis convulsiva** o una electrocución tiene dolor de hombro con el brazo en **aducción y rotación interna** y **no puede rotar externamente**, piensa en **luxación posterior** aunque no veas deformidad: hasta la mitad se pasan por alto."},{"tipo":"alerta","texto":"La causa **más frecuente de inestabilidad anterior recidivante** es una **inestabilidad multidireccional no diagnosticada**, no una nueva lesión traumática."}]},{"id":"exploracion","titulo":"5. Exploración física y diagnóstico por imagen","bloques":[{"tipo":"tabla","titulo":"Pruebas de exploración de la inestabilidad","columnas":["Prueba","Cómo se hace / qué indica","S / E"],"filas":[["**Cajón anterior y posterior** (test del desplazamiento)","Desplazar la cabeza humeral adelante y atrás; **positivo si > 25 %** del grosor de la cabeza","**53 % / 85 %**"],["**Prueba del surco** (laxitud inferior)","Surco bajo el acromion al traccionar el brazo hacia abajo → inestabilidad **inferior o multidireccional**; si **desaparece en RE** → **intervalo rotador incompetente**","—"],["**Aprehensión** (fulcro, manivela)","ABD + extensión + RE; positiva si el paciente **impide continuar por miedo** a luxarse","**72 % / 96 %**"],["**Recolocación**","En la posición de aprehensión se presiona el húmero hacia abajo/atrás y **el miedo desaparece**","**81 % / 92 %**"],["**Sorpresa**","En la posición de recolocación se **suelta súbitamente** la presión y reaparece la aprehensión: **la prueba más exacta**","—"],["**Jerk test**","Chasquido al empujar el codo hacia atrás desde antepulsión → **inestabilidad posterior**","—"],["**Hiperabducción de Gagey**","ABD glenohumeral pasiva normal \u003c 90°; si **> 105°** o **20° mayor** que la contralateral → incompetencia de **cápsula y ligamentos inferiores**","—"],["**Inspección muscular**","**Atrofia asimétrica del deltoides** → lesión del **nervio circunflejo**","—"]]},{"tipo":"perla","texto":"Antes de movilizar un hombro tras una luxación, inspecciona el **deltoides** y explora la sensibilidad de su cara lateral: una atrofia asimétrica orienta a **lesión del nervio circunflejo**, que condiciona el pronóstico y el plan de fortalecimiento."},{"tipo":"parrafo","texto":"El diagnóstico es **clínico**; las pruebas complementarias solo **confirman** y valoran **lesiones asociadas**. Se usan **Rx y TAC**; la **artroRM aumenta la sensibilidad y es el patrón oro**; la **ecografía** es operador-dependiente y útil en lesiones del **manguito rotador**."},{"tipo":"esquema","titulo":"Algoritmo diagnóstico por imagen","mermaid":"flowchart TD\n  A[\"Rx simple\"] --> B{\"¿Lesiones óseas?\"}\n  B -->|\"sí\"| C[\"TAC\"]\n  B --> D{\"¿Inestabilidad recidivante, alto riesgo de recidiva o sospecha de lesión del manguito?\"}\n  D -->|\"no\"| E[\"Fin del estudio\"]\n  D -->|\"sí\"| F[\"RMN\"]\n  F -->|\"sospecha de defecto óseo significativo\"| C\n  F -->|\"dudas, multidireccional o recidiva\"| G[\"Artro-RMN\"]","pie":"La Rx abre siempre el estudio; el TAC caracteriza el hueso y la artro-RMN resuelve dudas, inestabilidad multidireccional y recidivas."}]},{"id":"lesiones","titulo":"6. Lesiones asociadas","bloques":[{"tipo":"parrafo","texto":"Acompañando a la luxación pueden aparecer **lesiones óseas** (Bankart óseo, Hill-Sachs), **lesiones del labrum, ligamentosas, capsulares y/o condrales**, **quistes paralabrales**, **cuerpos intraarticulares** y **roturas del manguito rotador**."},{"tipo":"definicion","termino":"Lesión de Bankart","texto":"**Rotura o desinserción del labrum anteroinferior** con desgarro asociado del periostio: durante un traumatismo fuerte la cabeza humeral «arranca» el rodete, dejando un hombro inestable. Supone el **97 % de las lesiones del labrum**. Su tratamiento es la **reparación anatómica** para recuperar la estabilidad, prevenir la recidiva y retomar el deporte."},{"tipo":"definicion","termino":"Lesión de Hill-Sachs","texto":"**Fractura por compresión con impactación del margen posterolateral de la cabeza humeral**, producida por su contacto anormal y repetido con la porción anterior de la glena durante la luxación."},{"tipo":"figura","pagina":42,"pie":"Variantes de lesión del complejo labrum-ligamento glenohumeral inferior: Bankart, Bankart óseo, ALPSA, Perthes, GLAD, HAGL y BHAGL; fíjate en dónde queda desinsertado el labrum o el ligamento.","src":"img/patologia-quirurgica-i-t12-tema-12-inestabilidad-glenohumeral-aguda-y-cronica-p42.jpg"},{"tipo":"tabla","titulo":"Lesiones del complejo labrum-LGHI","columnas":["Lesión","Descripción del temario"],"filas":[["**Bankart**","Desinserción del labrum **anteroinferior** + desgarro del periostio"],["**Bankart óseo**","**Fractura-avulsión del margen anteroinferior de la glena** acompañada de la lesión del labrum"],["**ALPSA**","Avulsión anterior del labrum y el periostio, con desplazamiento hacia el **cuello glenoideo**; **elevado riesgo de inestabilidad**"],["**Perthes**","El **periostio de la escápula se alza** y se desprende medialmente con el labrum anterior separado"],["**GLAD**","**Defecto osteocondral**"],["**HAGL**","**Avulsión humeral** del ligamento glenohumeral"]]},{"tipo":"dato","valor":"80 % / 65 %","texto":"La resección del labrum anteroinferior **reduce la altura de la glena un 80 %** y **la estabilidad un 65 %**."},{"tipo":"alerta","texto":"En una diapositiva el **Bankart óseo** se describe como «fragmento de hueso, generalmente de la cabeza del húmero»; la definición precisa del tema es la **avulsión del margen anteroinferior de la glena**. El hueso de la **cabeza** humeral (posterolateral) corresponde al **Hill-Sachs**. No los confundas."},{"tipo":"parrafo","texto":"**Lesión SLAP** (*superior labrum anterior and posterior*): lesión del **labrum anterosuperior + LGH superior y medio + tendón de la cabeza larga del bíceps**. El labrum superior tiene una **inserción meniscoide**, lo que lo hace susceptible a lesiones degenerativas y traumáticas, y sirve de **origen a la cabeza larga del bíceps**. No se tuvo en cuenta hasta la **artroscopia**: prevalencia del **3,9-6 %** en artroscopias de hombro, edad media **38 años**, **91 % varones**; el **tipo II** (desinserción sin desgarro) es el más frecuente. Se explora con los tests de **tensión del bíceps**, **compresión-rotación**, **compresión activa** (en RI y en supinación) y **provocación de nuevo dolor**."},{"tipo":"tarjetas","items":[{"etiqueta":"Atraumáticas","titulo":"Lesiones del labrum por gran esfuerzo","texto":"Deportes de gran exigencia: **fútbol, tenis, natación, béisbol**."},{"etiqueta":"Traumáticas","titulo":"Lesiones del labrum por trauma","texto":"**Luxaciones recurrentes, laxitud, caídas, traumatismo directo** en el hombro."}]},{"tipo":"figura","pagina":38,"pie":"Lesión de Hill-Sachs en TAC coronal y RM: muesca por impactación en la cara posterolateral de la cabeza humeral; a la izquierda, reconstrucción 3D de un Bankart óseo de la glena.","src":"img/patologia-quirurgica-i-t12-tema-12-inestabilidad-glenohumeral-aguda-y-cronica-p38.jpg"},{"tipo":"lista","items":["Lesiones de **Hill-Sachs**","Fracturas o **defectos glenoideos**","Alteración de la **versión humeral o glenoidea**","Lesiones de **Bankart**","**Hiperlaxitud**"]}]},{"id":"aguda","titulo":"7. Tratamiento de la luxación aguda","bloques":[{"tipo":"esquema","titulo":"Secuencia terapéutica de la luxación aguda","mermaid":"flowchart TD\n  A[\"1. Reducción: urgencia ortopédica\"] --> B[\"2. Valoración de lesiones asociadas\"]\n  B --> C[\"3. Inmovilización en cabestrillo según la edad\"]\n  C --> D[\"4. Rehabilitación\"]\n  A --> A1[\"Anterior: sedación y analgesia; tracción simple en el eje\"]\n  A --> A2[\"Posterior: sedación y relajantes; rotación interna en aducción\"]\n  D --> D1[\"Fase 1, semanas 1-4: movilidad pasiva y luego activa, sin RE\"]\n  D1 --> D2[\"Fase 2, desde la 5.ª semana: rotaciones, resistidos y propiocepción\"]","pie":"El orden es fijo: primero reducir, después buscar lesiones, inmovilizar el tiempo que marque la edad y rehabilitar."},{"tipo":"parrafo","texto":"**Luxación anterior**: con el paciente **relajado, sedado y analgesiado**. Existen varias técnicas (**Hipócrates, Stimson, Kocher, Saha**), pero en las últimas revisiones la de **mayor índice de resultados satisfactorios con menor tasa de complicaciones es la tracción simple en el eje**. **Luxación posterior**: paciente **sedado y con relajantes musculares**; maniobra de **rotación interna en aducción** del brazo."},{"tipo":"tabla","titulo":"Indicaciones de cirugía aguda","columnas":["Luxación anterior","Luxación posterior"],"filas":[["**Interposición de partes blandas**","**Tuberosidad menor** fracturada y desplazada"],["**Fractura desplazada**; **fractura de glenoides**","**Fractura importante del reborde posterior** de la glenoides"],["**Lesiones del manguito**","**Irreductible** o **inestable tras la reducción**"],["**Bankart confirmado por RMN**; **luxación crónica** (> 2-3 semanas)","—"]]},{"tipo":"tabla","titulo":"Inmovilización en cabestrillo según la edad","columnas":["Edad","Duración"],"filas":[["**\u003c 20 años**","**3-4 semanas**"],["**20-30 años**","**2-3 semanas**"],["**> 30 años**","**10 días - 2 semanas**"],["**> 40 años**","**3-5 días**"]]},{"tipo":"dato","valor":"\u003c 20 años: 3-4 sem","texto":"Los jóvenes requieren **más tiempo de inmovilización** para mejorar los resultados (mayor riesgo de recidiva); en > 40 años bastan 3-5 días (prima evitar la rigidez)."},{"tipo":"parrafo","texto":"**Rehabilitación en dos fases.** **Primera (3-4 semanas)**: movilidad inicialmente **pasiva** y después **activa** y elasticidad, con **termoterapia previa**, **crioterapia al final** y **electroterapia excitomotora y analgésica**, **limitando siempre la rotación externa** hasta pasada esta fase. **Segunda (desde la 5.ª semana)**: **rotaciones glenohumerales** primero pasivas y luego activas, **ejercicios activos resistidos** de cintura escapular y **propiocepción** para disminuir el riesgo de recidiva."},{"tipo":"perla","texto":"Objetivos de la rehabilitación tras la inmovilización: **fuerza, potencia y resistencia**, **propiocepción** y **movilidad completa**, evitando las posiciones que empeoran la inestabilidad (ABD + RE). Refuerza **manguito rotador, estabilizadores de la escápula y deltoides** hasta recuperar el **70-80 % de la fuerza** antes del programa sistemático de **retorno a la actividad**."},{"tipo":"alerta","texto":"La **rotación externa** es el movimiento que reproduce el mecanismo de la luxación anterior: **no la fuerces durante las primeras 3-4 semanas**. Las rotaciones glenohumerales se introducen a partir de la **5.ª semana**."}]},{"id":"cronica","titulo":"8. Tratamiento de la inestabilidad crónica","bloques":[{"tipo":"parrafo","texto":"**Luxación anterior recidivante — tratamiento conservador**: rehabilitación intensa para fortalecer los **estabilizadores externos**, indicada sobre todo en la **luxación recidivante tipo AMBRI**, **atletas con alto componente de rotación externa** y **luxadores voluntarios**."},{"tipo":"parrafo","texto":"**Tratamiento quirúrgico**: las **técnicas artroscópicas** tienen ventajas frente a la cirugía abierta (**mínima disección de partes blandas**, **menor daño a los tejidos** y mejor cicatrización), lo que permite una **incorporación más temprana a la rehabilitación** y mayor arco de movilidad."},{"tipo":"tabla","titulo":"Técnicas quirúrgicas de la inestabilidad crónica","columnas":["Técnica","En qué consiste","Indicación"],"filas":[["**Cirugía de Bankart** (artroscópica)","Anclajes en el borde de la glena; las suturas se pasan por **labrum y cápsula** hasta reinsertar el labrum en su posición original","Lesión de Bankart: **la cirugía más frecuente**"],["**Latarjet**","Trasladar la **apófisis coracoides** con sus inserciones tendinosas y fijarla **a través del subescapular** en la parte **anteroinferior de la glena** («tope óseo»)","**Gran defecto óseo glenoideo**"],["**Remplissage**","Llevar parte de la **cápsula posterior y del tendón del manguito** dentro de la **lesión de Hill-Sachs**","Hill-Sachs"],["**Plicatura capsular**","Suturar la cápsula para **reducir su diámetro**","Laxitud capsular; en multidireccional, **plicatura pancapsular** abierta"]]},{"tipo":"figura","pagina":64,"pie":"Técnica de Latarjet: corte de la coracoides con sus tendones, paso a través del subescapular y fijación con tornillos en la glena anteroinferior como tope óseo.","src":""},{"tipo":"parrafo","texto":"**Inestabilidad multidireccional**: lo más indicado es el **tratamiento rehabilitador**, fortaleciendo los **estabilizadores dinámicos** con entrenamiento **propioceptivo y cinemático**, durante al menos **3-6 meses** antes de plantear cirugía. La cirugía se indica cuando el **dolor o la inestabilidad interfieren con las actividades de la vida diaria**; está **contraindicada en las luxaciones voluntarias**, y la técnica abierta de elección es la **plicatura pancapsular** con o sin cierre del **intervalo rotador**."},{"tipo":"dato","valor":"3-6 meses","texto":"Duración mínima del tratamiento rehabilitador en la inestabilidad multidireccional antes de plantear cirugía."},{"tipo":"perla","texto":"El hombro **AMBRI** o multidireccional es terreno del fisioterapeuta: el tratamiento de elección es un programa largo (≥ 3-6 meses) de **control neuromuscular, propiocepción y fortalecimiento de estabilizadores dinámicos**, y la cirugía solo llega si ese programa fracasa."}]}],"caso_clinico":{"titulo":"Jugador de balonmano de 18 años con primera luxación","presentacion":"Varón de 18 años, jugador de balonmano, que al lanzar con el brazo en abducción y rotación externa nota un chasquido y dolor intenso. Llega a urgencias con el hombro en charretera, el brazo en ligera abducción y rotación externa, e imposibilidad para llevar la mano al abdomen. Tras la reducción, la exploración muestra atrofia incipiente y menor sensibilidad en la cara lateral del deltoides. Semanas después refiere miedo al armar el brazo para lanzar.","preguntas":[{"pregunta":"¿Qué tipo de luxación presenta y qué estructura estabilizadora se ha visto sometida a mayor tensión?","respuesta":"Luxación **anterior**, probablemente **subcoracoidea** (la más frecuente), por el mecanismo de **abducción + extensión + rotación externa**, con el típico **hombro en charretera**. En ABD de 90° y RE el principal estabilizador anteroinferior es el **LGHI**, el más importante; la lesión asociada más probable es un **Bankart** (desinserción del labrum anteroinferior)."},{"pregunta":"¿Qué te sugiere la alteración del deltoides y cómo enfocarías la inmovilización y la rehabilitación?","respuesta":"La atrofia asimétrica del deltoides sugiere **lesión del nervio circunflejo**. Por tener **\u003c 20 años** se inmoviliza en cabestrillo **3-4 semanas**. Rehabilitación en dos fases: **3-4 semanas** de movilidad pasiva y luego activa, con termoterapia, crioterapia y electroterapia, **sin rotación externa**; desde la **5.ª semana**, rotaciones, ejercicios resistidos y **propiocepción**."},{"pregunta":"Su miedo al lanzar persiste. ¿Cómo lo confirmarías clínicamente y qué opciones terapéuticas existen?","respuesta":"Con la **aprehensión** (S 72 %, E 96 %), la **recolocación** (S 81 %, E 92 %) y el **test de la sorpresa**, el más exacto. Su riesgo de recidiva es muy alto (**80-90 %** en menores de 20 años). Se confirmaría la lesión con **artro-RMN** (patrón oro). Es un cuadro **TUBS**, de tratamiento **quirúrgico**: **reparación de Bankart artroscópica**, o **Latarjet** si existiera un **gran defecto óseo glenoideo**."}]},"preguntate":[{"pregunta":"Define inestabilidad glenohumeral y enumera sus grados de menor a mayor.","respuesta":"Incapacidad para mantener el centro de la cabeza humeral dentro de la glena durante el movimiento. Grados: **hiperlaxitud → inestabilidad → aprehensión → subluxación** (pérdida parcial de congruencia) **→ luxación** (pérdida completa)."},{"pregunta":"¿Qué función tiene cada ligamento glenohumeral y cuál es el más importante?","respuesta":"**LGHS**: traslación superior. **LGHM**: anterior en posiciones \u003c 90°. **LGHI**: estabilizador en ABD de 90° y anteroinferior en RE + ABD; es **el más importante**."},{"pregunta":"Clasifica los estabilizadores en estáticos y dinámicos.","respuesta":"Estáticos: **labrum**, estructuras cápsulo-ligamentosas (LGH, cápsula posterior, intervalo rotador), **presión intraarticular negativa** y **adhesión/cohesión**. Dinámicos (comprimen la articulación): **manguito rotador**, **músculos periescapulares** y **tendón largo del bíceps**."},{"pregunta":"Describe los tipos de inestabilidad de Rockwood.","respuesta":"I: subluxación traumática sin luxación previa. II: subluxación traumática con luxación previa. IIIA: voluntaria con problemas psiquiátricos. IIIB: voluntaria sin problemas psiquiátricos. IV: atraumática involuntaria."},{"pregunta":"¿Qué significan las siglas TUBS y AMBRI y qué tratamiento orientan?","respuesta":"**TUBS**: Traumática, Unidireccional, Bankart, Surgery → cirugía. **AMBRI**: Atraumática, Multidireccional, Bilateral, responde a Rehabilitación, e Inferior capsular shift con reparación del intervalo rotador si fracasa → rehabilitación."},{"pregunta":"Compara la presentación clínica de la luxación anterior y la posterior.","respuesta":"Anterior: charretera, brazo en **leve ABD y RE**, no puede hacer RI ni aducción completas, cabeza **subcoracoidea**. Posterior: sin deformidad llamativa, brazo en **aducción y RI**, **RE limitada** activa y pasiva, prominencia posterior, cabeza **subacromial**; se pasa por alto hasta en un 50 %."},{"pregunta":"¿En qué se diferencian las pruebas de aprehensión, recolocación y sorpresa?","respuesta":"Aprehensión: ABD + extensión + RE provoca miedo a luxarse. Recolocación: en esa posición, presionar el húmero hace desaparecer el miedo. Sorpresa: soltar de golpe la presión hace reaparecer la aprehensión; es la prueba **más exacta**."},{"pregunta":"Diferencia la lesión de Bankart de la de Hill-Sachs.","respuesta":"**Bankart**: desinserción del **labrum anteroinferior** (lado glenoideo), con o sin fragmento óseo de la glena (Bankart óseo). **Hill-Sachs**: fractura por **impactación posterolateral de la cabeza humeral** contra el borde anterior de la glena."},{"pregunta":"¿Cuánto tiempo se inmoviliza una luxación anterior según la edad y por qué?","respuesta":"\u003c 20 años 3-4 semanas; 20-30 años 2-3 semanas; > 30 años 10 días-2 semanas; > 40 años 3-5 días. Los jóvenes necesitan más tiempo porque su riesgo de **recidiva** es mucho mayor; en los mayores prima evitar la rigidez."},{"pregunta":"¿Cuándo se elige un Latarjet, un remplissage o una plicatura capsular?","respuesta":"**Latarjet**: gran **defecto óseo glenoideo** (coracoides como tope óseo). **Remplissage**: rellenar la lesión de **Hill-Sachs** con cápsula posterior y manguito. **Plicatura**: reducir el volumen capsular (pancapsular abierta en la multidireccional)."}],"glosario":[{"termino":"Labrum glenoideo","definicion":"Anillo que rodea la glena y aumenta su área y profundidad para mejorar el contacto con la cabeza humeral."},{"termino":"LGHI","definicion":"Ligamento glenohumeral inferior: estabilizador principal en abducción de 90° y rotación externa."},{"termino":"Intervalo rotador","definicion":"Zona capsular entre supraespinoso y subescapular; si es incompetente, el signo del surco no desaparece en rotación externa."},{"termino":"Hombro en charretera","definicion":"Deformidad de la luxación anterior por pérdida del relieve del deltoides bajo el acromion."},{"termino":"Lesión de Bankart","definicion":"Desinserción del labrum anteroinferior con desgarro del periostio; 97 % de las lesiones del labrum."},{"termino":"Bankart óseo","definicion":"Fractura-avulsión del margen anteroinferior de la glena asociada a la lesión del labrum."},{"termino":"Hill-Sachs","definicion":"Fractura por impactación del margen posterolateral de la cabeza humeral."},{"termino":"SLAP","definicion":"Lesión del labrum superior, de anterior a posterior, que afecta al origen de la cabeza larga del bíceps."},{"termino":"ALPSA","definicion":"Avulsión anterior del labrum y el periostio desplazada hacia el cuello glenoideo; alto riesgo de inestabilidad."},{"termino":"HAGL","definicion":"Avulsión humeral del ligamento glenohumeral."},{"termino":"Latarjet","definicion":"Transferencia de la coracoides a la glena anteroinferior a través del subescapular, como tope óseo."},{"termino":"Remplissage","definicion":"Relleno de la lesión de Hill-Sachs con cápsula posterior y tendón del manguito rotador."},{"termino":"Luxatio erecta","definicion":"Luxación inferior con la diáfisis humeral hacia arriba y la cabeza bajo la glena."}],"fuentes":["Tema 12. Inestabilidad Glenohumeral Aguda y Crónica. Patología Quirúrgica I (PQRI 2026-2027), Universidad Europea.","Moore et al. (2013) — figura de los estabilizadores dinámicos citada en el tema.","Clasificaciones citadas: Rockwood; Gerber y Nyffeler; Neer; Thomas y Matsen."],"qcm":[{"pregunta":"Con el brazo en abducción de 90° y rotación externa, ¿qué estructura es el principal estabilizador anteroinferior de la articulación glenohumeral?","opciones":["Ligamento glenohumeral inferior","Tendón de la cabeza larga del bíceps","Ligamento glenohumeral medio","Ligamento glenohumeral superior"],"correcta":0,"explicacion":"El **LGHI** estabiliza el brazo en **ABD de 90°** y es el estabilizador **anteroinferior en RE + ABD**; el temario lo señala como **el más importante**.","por_opcion":["✅ El LGHI es el estabilizador en ABD de 90° y RE, el más importante.","❌ El bíceps es un estabilizador **dinámico** por compresión, no el principal anteroinferior en esta posición.","❌ El LGHM estabiliza anteriormente en posiciones **menores de 90°**.","❌ El LGHS es el principal estabilizador frente a la **traslación superior**."]},{"pregunta":"Según las últimas revisiones citadas en el tema, ¿qué técnica de reducción de la luxación anterior ofrece más resultados satisfactorios con menos complicaciones?","opciones":["Maniobra de Hipócrates con el pie en la axila","Rotación interna en aducción del brazo","Tracción simple en el eje del miembro","Maniobra de Kocher con rotaciones secuenciales"],"correcta":2,"explicacion":"Existen varias técnicas (Hipócrates, Stimson, Kocher, Saha), pero la de **mayor índice de resultados satisfactorios y menor tasa de complicaciones** es la **tracción simple en el eje**, con el paciente relajado, sedado y analgesiado.","por_opcion":["❌ Hipócrates es otra técnica clásica, no la preferida.","❌ La rotación interna en aducción es la maniobra de la luxación **posterior**.","✅ La tracción simple en el eje es la de mejores resultados y menos complicaciones.","❌ Kocher es una de las técnicas clásicas, pero no la mejor según las revisiones."]},{"pregunta":"Paciente que tras una crisis epiléptica refiere dolor de hombro, sin deformidad evidente, con el brazo en aducción y rotación interna y la rotación externa activa y pasiva bloqueada. ¿Cuál es el diagnóstico más probable?","opciones":["Luxación posterior glenohumeral","Rotura aguda del manguito rotador","Luxación anterior subcoracoidea","Luxación inferior o luxatio erecta"],"correcta":0,"explicacion":"La luxación **posterior** se asocia a **convulsiones**, carece de deformidad llamativa (se pasa por alto hasta en un **50 %**), el paciente sostiene el brazo en **aducción y RI** y el signo de sospecha es la **limitación de la RE activa y pasiva**.","por_opcion":["✅ Convulsión + aducción y RI + RE bloqueada = luxación posterior.","❌ La rotura del manguito no bloquea la RE pasiva ni encaja con el mecanismo convulsivo.","❌ La anterior produce charretera y brazo en leve abducción y **rotación externa**.","❌ La luxatio erecta deja el brazo en elevación, con un cuadro muy llamativo."]},{"pregunta":"En la luxación posterior de hombro, ¿en qué posición queda con mayor frecuencia la cabeza humeral?","opciones":["Subacromial","Subcoracoidea","Subglenoidea","Subespinosa"],"correcta":0,"explicacion":"En la luxación posterior la cabeza puede quedar **subacromial (la más frecuente)**, subglenoidea o subespinosa. La subcoracoidea es la forma más frecuente de la luxación **anterior**.","por_opcion":["✅ La posición subacromial es la más frecuente en la luxación posterior.","❌ La subcoracoidea corresponde a la luxación **anterior** más frecuente.","❌ Es una posición posible pero menos frecuente.","❌ Es una posición posible pero menos frecuente."]},{"pregunta":"¿Cuál de las siguientes pruebas se considera, según el tema, la más exacta para el diagnóstico de la inestabilidad?","opciones":["Prueba de aprehensión","Test de la recolocación","Cajón anterior y posterior","Test de la sorpresa"],"correcta":3,"explicacion":"En la posición del test de recolocación se **suelta de forma súbita** la presión posterior sobre el húmero y reaparece la aprehensión: el **test de la sorpresa** es la prueba **más exacta**.","por_opcion":["❌ La aprehensión tiene S 72 % y E 96 %.","❌ La recolocación tiene S 81 % y E 92 %, pero no es la más exacta según el tema.","❌ El cajón es la menos sensible (S 53 %, E 85 %).","✅ El test de la sorpresa es la prueba más exacta."]},{"pregunta":"¿Qué prueba de inestabilidad presenta una sensibilidad del 81 % y una especificidad del 92 %?","opciones":["Cajón anterior y posterior","Prueba de aprehensión","Prueba del surco","Test de la recolocación"],"correcta":3,"explicacion":"Recolocación: **S 81 %, E 92 %**. Aprehensión: **S 72 %, E 96 %**. Cajón: **S 53 %, E 85 %**.","por_opcion":["❌ El cajón tiene S 53 % y E 85 %.","❌ La aprehensión tiene S 72 % y E 96 %.","❌ El tema no da sensibilidad ni especificidad para la prueba del surco.","✅ La recolocación: S 81 %, E 92 %."]},{"pregunta":"Al traccionar hacia abajo el brazo aparece un surco bajo el acromion que desaparece al colocar el hombro en rotación externa. ¿Qué indica este hallazgo?","opciones":["Lesión SLAP tipo II asociada","Incompetencia del ligamento glenohumeral inferior","Lesión de Hill-Sachs significativa","Intervalo rotador incompetente"],"correcta":3,"explicacion":"La prueba del surco indica inestabilidad **inferior o multidireccional**; si el surco **desaparece en rotación externa**, el temario lo interpreta como **intervalo rotador incompetente**.","por_opcion":["❌ El SLAP se explora con pruebas de tensión del bíceps y compresión activa.","❌ La incompetencia de cápsula y ligamentos inferiores se valora con la **hiperabducción de Gagey**.","❌ El Hill-Sachs es una lesión ósea que se ve en imagen, no con el surco.","✅ Surco que desaparece en RE = intervalo rotador incompetente."]},{"pregunta":"En el test de hiperabducción de Gagey, ¿qué resultado indica incompetencia de la cápsula y los ligamentos inferiores?","opciones":["Dolor anterior al llegar a 90° de abducción activa","Abducción pasiva mayor de 105° o 20° más que el lado sano","Abducción pasiva entre 90° y 100°","Abducción pasiva inferior a 90°"],"correcta":1,"explicacion":"La abducción glenohumeral pasiva normal es **\u003c 90°**; si es **> 105°** o **20° mayor que la contralateral**, indica **incompetencia** de los estabilizadores de la cápsula y los ligamentos **inferiores**.","por_opcion":["❌ El test es pasivo y valora amplitud, no dolor en abducción activa.","✅ > 105° o 20° más que el lado sano = cápsula y ligamentos inferiores incompetentes.","❌ El tema no fija este rango como criterio patológico.","❌ Menos de 90° es el valor **normal**."]},{"pregunta":"¿Qué describe correctamente la lesión de Hill-Sachs?","opciones":["Avulsión humeral del ligamento glenohumeral inferior","Desinserción del labrum anteroinferior con su periostio","Impactación del margen posterolateral de la cabeza humeral","Avulsión ósea del margen anteroinferior de la glena"],"correcta":2,"explicacion":"Hill-Sachs es una **fractura por compresión con impactación del margen posterolateral de la cabeza humeral**, por su contacto anormal y repetido con la porción anterior de la glena durante la luxación.","por_opcion":["❌ Es la lesión **HAGL**.","❌ Es la **lesión de Bankart**.","✅ Impactación posterolateral de la cabeza humeral.","❌ Es el **Bankart óseo**."]},{"pregunta":"Dentro de las lesiones del complejo labrum-ligamento glenohumeral inferior, ¿cuál corresponde a un defecto osteocondral?","opciones":["Lesión de Perthes","Lesión ALPSA","Lesión HAGL","Lesión GLAD"],"correcta":3,"explicacion":"Según el tema, la **lesión GLAD** es un **defecto osteocondral**. ALPSA es la avulsión anterior del labrum y el periostio hacia el cuello glenoideo, Perthes el despegamiento del periostio escapular con el labrum, y HAGL la avulsión humeral del ligamento.","por_opcion":["❌ Perthes: el periostio de la escápula se alza y se desprende medialmente con el labrum.","❌ ALPSA: avulsión anterior de labrum y periostio desplazada hacia el cuello glenoideo.","❌ HAGL: avulsión humeral del ligamento glenohumeral.","✅ GLAD: defecto osteocondral."]},{"pregunta":"Sobre la lesión SLAP, señala la afirmación que recoge el temario.","opciones":["Su prevalencia en artroscopias de hombro ronda el 25 %","El tipo II, desinserción sin desgarro, es el más frecuente","Predomina claramente en mujeres de edad avanzada","Afecta sobre todo al labrum anteroinferior y al LGHI"],"correcta":1,"explicacion":"La SLAP afecta al **labrum superior** (anterosuperior + LGH superior y medio + cabeza larga del bíceps); prevalencia del **3,9-6 %** en artroscopias, edad media **38 años**, **91 % varones**; el **tipo II** (desinserción sin desgarro) es el más común.","por_opcion":["❌ La prevalencia es del 3,9-6 %.","✅ El tipo II es el más común.","❌ El 91 % son varones, con edad media de 38 años.","❌ Afecta al labrum **superior**; el anteroinferior es el territorio del Bankart."]},{"pregunta":"Paciente de 25 años tras su primera luxación anterior reducida. ¿Cuánto tiempo de inmovilización en cabestrillo indica el tema?","opciones":["2-3 semanas","10 días - 2 semanas","3-4 semanas","3-5 días"],"correcta":0,"explicacion":"Inmovilización según la edad: **\u003c 20 años 3-4 semanas**, **20-30 años 2-3 semanas**, **> 30 años 10 días-2 semanas**, **> 40 años 3-5 días**. Los jóvenes requieren más tiempo para mejorar los resultados.","por_opcion":["✅ Entre 20 y 30 años: 2-3 semanas.","❌ 10 días-2 semanas es para **mayores de 30 años**.","❌ 3-4 semanas corresponde a los **menores de 20 años**.","❌ 3-5 días es para **mayores de 40 años**."]},{"pregunta":"En la rehabilitación tras una luxación anterior aguda, ¿a partir de cuándo se añaden las rotaciones glenohumerales según el tema?","opciones":["Desde la primera semana, de forma activa","Únicamente tras tres meses de inmovilización","Al terminar la segunda semana, solo en pasivo","A partir de la quinta semana, primero pasivas"],"correcta":3,"explicacion":"La primera fase (3-4 semanas) se centra en la movilidad pasiva y luego activa **limitando la rotación externa**; en la **segunda fase, desde la 5.ª semana**, se añaden las **rotaciones glenohumerales**, inicialmente pasivas y luego activas, con ejercicios resistidos y propiocepción.","por_opcion":["❌ En la primera fase se limita la rotación externa.","❌ No se describe una inmovilización de tres meses.","❌ La primera fase dura 3-4 semanas, no 2.","✅ Desde la 5.ª semana, primero pasivas y luego activas."]},{"pregunta":"Paciente con inestabilidad anterior recidivante y un gran defecto óseo en la glenoides. ¿Qué técnica quirúrgica indica el tema?","opciones":["Reparación artroscópica de Bankart","Remplissage de la lesión","Cirugía de Latarjet","Plicatura pancapsular abierta"],"correcta":2,"explicacion":"La **cirugía de Latarjet** traslada la **coracoides** con sus inserciones tendinosas a través del subescapular a la **glena anteroinferior** y se utiliza en casos con **gran defecto óseo en la glenoides**.","por_opcion":["❌ La reparación de Bankart repara el labrum; es la más frecuente, pero no resuelve un gran defecto óseo.","❌ El remplissage rellena la lesión de **Hill-Sachs** (lado humeral).","✅ Latarjet: indicada en el gran defecto óseo glenoideo.","❌ La plicatura pancapsular es la técnica abierta de la inestabilidad **multidireccional**."]},{"pregunta":"En la inestabilidad glenohumeral multidireccional, ¿qué afirmación es correcta según el temario?","opciones":["La reparación de Bankart es la técnica abierta de elección","La cirugía está contraindicada en las luxaciones voluntarias","El Latarjet es la técnica de elección en estos pacientes","La rehabilitación basta con 4-6 semanas antes de operar"],"correcta":1,"explicacion":"En la multidireccional lo más indicado es la **rehabilitación** (estabilizadores dinámicos, propiocepción) durante **al menos 3-6 meses**; la cirugía se indica si dolor o inestabilidad interfieren con las AVD, está **contraindicada en las luxaciones voluntarias** y la técnica abierta de elección es la **plicatura pancapsular**.","por_opcion":["❌ La técnica abierta de elección es la **plicatura pancapsular**.","✅ La cirugía está contraindicada en las luxaciones voluntarias.","❌ El Latarjet se reserva para el gran defecto óseo glenoideo.","❌ Se exigen **al menos 3-6 meses** de rehabilitación."]}],"asignatura":"Patología quirúrgica I","tema":12,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
