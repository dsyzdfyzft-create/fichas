<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Síndromes de atrapamiento neurológico del miembro superior · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Síndromes de atrapamiento neurológico del miembro superior","subtitulo":"Fisiopatología, diagnóstico y tratamiento de las neuropatías compresivas de los nervios mediano, radial y cubital.","resumen":["Una neuropatía compresiva combina **factores mecánicos** (paso por un canal osteofibroso, compartimento rígido o prominencia ósea) y **factores vasculares** que crean un círculo vicioso **obstrucción venosa → anoxia → edema → fibrosis**.","La clínica empieza con **parestesias** en el territorio del nervio, dolor que irradia a distal y, al progresar, **déficit sensitivo-motor**; el **signo de Tinel** y las pruebas de provocación localizan el punto de compresión.","El diagnóstico se confirma con el **estudio neurofisiológico** (EMG, conducción, latencia): la **velocidad de conducción es lo primero en afectarse y lo último en recuperarse**, y un estudio normal **no excluye** la compresión.","El **nervio mediano** se atrapa en el ligamento de Struther, el interóseo anterior (Kiloh-Nevin, motor puro, signo del «OK»), el pronador redondo y, sobre todo, el **túnel carpiano** (neuropatía focal más común, **3-4 %** de adultos, **3:1** mujeres).","El **radial** se atrapa en la **arcada de Frohse** (interóseo posterior motor sin dolor / túnel radial doloroso que imita una epicondilitis) y en Wartenberg (rama sensitiva); el **cubital** en el **túnel cubital** y el **canal de Guyón** (Froment, mano en garra); la cirugía se reserva al fracaso conservador y siempre se sigue de **fisioterapia**."],"objetivos":["Al terminar, sabrás explicar el círculo vicioso mecánico-vascular que lleva de la compresión a la fibrosis del nervio.","Al terminar, sabrás orientar el diagnóstico con anamnesis, Tinel, pruebas de provocación, estudio neurofisiológico e imagen.","Al terminar, sabrás localizar y diferenciar cada punto de atrapamiento del mediano, radial y cubital por su clínica y sus signos.","Al terminar, sabrás cuándo indicar tratamiento conservador, infiltración o cirugía y qué hace el fisioterapeuta antes y después de la intervención."],"ideas_clave":["Compresión mecánica → congestión venosa epi/perineural → anoxia → edema y proliferación de fibroblastos → fibrosis que **agrava** la compresión (círculo vicioso).","Con una caída del flujo del **30-50 %** baja la fosforilación oxidativa: falla la bomba de sodio, el transporte axoplasmático y la membrana.","La **velocidad de conducción** es lo primero que se afecta y lo último que se recupera; un estudio electroneurológico no concluyente **no descarta** la compresión.","Liberación **precoz** = recuperación completa (remielinización y regeneración axonal); liberación **tardía** = sin regeneración por obstrucción de los conductos endoneurales.","Túnel carpiano: síntomas **nocturnos** en 1.º-3.º dedo y mitad radial del 4.º; signos de **Flick** (alto valor predictivo), **Phalen** (1-2 min) y **Tinel**.","Cirugía del túnel carpiano (sección del ligamento transverso) si no hay mejoría tras **3 meses**, clínica grave con **atrofia tenar** o EMG con afectación motora moderada-grave.","Interóseo anterior (Kiloh-Nevin) e interóseo posterior son **motores puros**: déficit sin trastorno sensitivo; Wartenberg es **sensitivo**: no hay atrofia.","Cubital: parestesias en 5.º dedo y mitad cubital del 4.º, empeora con el **codo en flexión**; **signo de Froment** (aductor del pulgar) y **mano en garra** en la parálisis completa."],"secciones":[{"id":"fisiopatologia","titulo":"1. Fisiopatología de la compresión nerviosa","bloques":[{"tipo":"parrafo","texto":"Los mecanismos fisiopatológicos de un atrapamiento son de dos tipos que se potencian: **factores mecánicos** y **factores vasculares**. La compresión física del nervio no es solo un «aplastamiento»: su principal consecuencia es desencadenar trastornos vasculares que, a su vez, aumentan la presión dentro del tronco nervioso."},{"tipo":"tarjetas","items":[{"etiqueta":"Mecánico","titulo":"Compresión física","texto":"Traumatismo directo o **irritación mecánica** por una estructura anatómica, de duración e intensidad variables. El factor más común es el paso del nervio por un **compartimento rígido**, un **canal osteofibroso donde cambia de dirección** o **sobre una prominencia ósea**."},{"etiqueta":"Vascular","titulo":"Isquemia y edema","texto":"La **obstrucción venosa** (secundaria a inflamación) congestiona los **plexos epineurales y perineurales** y enlentece la circulación del tronco nervioso; la anoxia dilata vasos y capilares y genera **edema** (Spinner et al., 1985)."}]},{"tipo":"parrafo","texto":"La anoxia induce además una **proliferación de fibroblastos** que termina en **fibrosis** del nervio. Esa tumefacción aumenta la compresión inicial y enlentece todavía más el retorno venoso, cerrando el **ciclo obstrucción venosa – anoxia – edema**. A la vez se altera el intercambio de nutrientes entre los vasos y las fibras nerviosas."},{"tipo":"esquema","titulo":"Círculo vicioso de la neuropatía compresiva","mermaid":"flowchart TD\n  A[\"Compresión mecánica del nervio\"] --> B[\"Obstrucción venosa\"]\n  B --> C[\"Congestión de plexos epi y perineurales\"]\n  C --> D[\"Anoxia del tronco nervioso\"]\n  D --> E[\"Dilatación capilar y edema\"]\n  D --> F[\"Proliferación de fibroblastos\"]\n  F --> G[\"Fibrosis intraneural\"]\n  E --> H[\"Aumento de presión interna\"]\n  G --> H\n  H -->|\"agrava\"| B\n  D --> I[\"Flujo reducido 30-50 por ciento\"]\n  I --> J[\"Menos fosfatos de alta energía\"]\n  J --> K[\"Pérdida de conducción y transmisión\"]","pie":"La fibrosis y el edema cierran el ciclo: la compresión se autoperpetúa si no se trata."},{"tipo":"dato","valor":"30–50 %","texto":"Disminución del flujo sanguíneo a partir de la cual se reduce la **fosforilación oxidativa** y la producción de fosfatos de alta energía."},{"tipo":"lista","items":["Disminución de la eficacia de la **bomba de sodio**.","Alteración del **transporte axoplasmático**.","Alteración de la **membrana celular**.","Sin tratamiento: **pérdida de la conducción y transmisión** de la fibra nerviosa (Eversmann W. W., 1993)."]},{"tipo":"definicion","termino":"Segmento de axón isquémico","texto":"Resumen del mecanismo según el temario: un tramo del axón queda isquémico por un **cambio de posición** o por alteraciones de la **anatomía intrínseca o extrínseca**; los cambios de la fibra alteran sus relaciones con el entorno y agravan la presión interna del tronco nervioso."},{"tipo":"alerta","texto":"La obstrucción que inicia el componente vascular es **venosa**, no arterial: la congestión venosa precede a la anoxia. Y la fibrosis no es un resultado final «estable»: **agrava** el ciclo."}]},{"id":"etiologia","titulo":"2. Etiología: causas de la compresión","bloques":[{"tipo":"parrafo","texto":"Cualquier factor que **reduzca el continente** (canal, túnel, desfiladero) o **aumente el contenido** (edema, masa, hipertrofia) puede desencadenar un atrapamiento. Identificar la causa es clave porque condiciona el tratamiento (por ejemplo, controlar una enfermedad sistémica)."},{"tipo":"tabla","titulo":"Causas de compresión nerviosa","columnas":["Grupo","Ejemplos del temario"],"filas":[["Edema de origen hormonal/sistémico","Hipotiroidismo, embarazo, cardiopatías, desnutrición, linfedemas"],["Partes blandas","Retracciones fasciales o miotendinosas; hipertrofia muscular secundaria al ejercicio"],["Inflamación postraumática","Contusiones, sobreesfuerzos"],["Inflamación sistémica","Reumatismos, lupus"],["Estructura osteoarticular","Fracturas consolidadas en posición viciosa, luxaciones, subluxaciones"],["Cambios postraumáticos","Fibrosis o retracciones compartimentales"],["Variantes anatómicas","Musculares, óseas, tendinosas (p. ej. apófisis supracondílea)"],["Cambios de tamaño / metabólicos","Aumento de tamaño de un canal o espacio; enfermedades metabólicas (gota)"]]},{"tipo":"perla","texto":"En una embarazada o en un paciente hipotiroideo con parestesias nocturnas en la mano, piensa en un edema hormonal que comprime el mediano: la fisioterapia ayuda, pero el **control de la enfermedad sistémica** forma parte del tratamiento conservador."}]},{"id":"clinica-diagnostico","titulo":"3. Clínica y diagnóstico","bloques":[{"tipo":"parrafo","texto":"En la **anamnesis** hay que precisar inicio, duración y progresión: lo típico es un **comienzo gradual** con aumento de síntomas a lo largo de **meses**. Valora siempre si la afectación es **bilateral**, porque orienta hacia una causa más **central** (raíz, plexo, sistémica). Busca traumatismos previos, la **actividad laboral** (qué gesto repite), patologías asociadas (DM2, hipertiroidismo…) y hábitos tóxicos (alcohol, tabaco)."},{"tipo":"tarjetas","items":[{"etiqueta":"Fase inicial","titulo":"Parestesias","texto":"Pinchazos, entumecimiento, quemazón, **limitados al territorio del nervio**. Dolor (incluso en reposo) en la zona de compresión que irradia a distal."},{"etiqueta":"Fase avanzada","titulo":"Déficit sensitivo-motor","texto":"A medida que la lesión avanza aparecen déficits sensitivos y motores. En casos leves o en **nervios puramente sensitivos** puede no haber afectación motora."}]},{"tipo":"definicion","termino":"Signo de Tinel","texto":"Al comprimirse de forma repetida, el nervio **se engruesa**; al **percutirlo** se produce dolor local y **parestesias en su distribución cutánea**. Localiza el punto de atrapamiento."},{"tipo":"parrafo","texto":"La **exploración sensitivo-motora** permite distinguir si la lesión es **periférica, radicular o del plexo braquial**. Se recorre el trayecto del nervio buscando puntos de compresión y se usan **pruebas de provocación** (presión directa o movimiento articular que aumenta la compresión). Según **McKinnon**, conviene un cuestionario subjetivo y una **EVA de 0 a 10**."},{"tipo":"tabla","titulo":"Pruebas complementarias","columnas":["Prueba","Utilidad según el temario"],"filas":[["Estudio neurofisiológico (EMG, pruebas de conducción, tiempo de latencia)","**Confirma** el diagnóstico en la mayoría de casos; objetiva y cuantifica la neuropatía y permite valorar la recuperación (pronóstico)"],["Radiografía","Descartar etiologías **traumáticas**"],["RMN","Sospecha de compresión por una **masa** intrínseca o extrínseca"],["TC","Sospecha de causa **muy proximal**: tumor de Pancoast, escapular, clavicular, costal"]]},{"tipo":"dato","valor":"1.º / último","texto":"La **velocidad de conducción** es lo **primero** que se afecta y lo **último** en recuperarse."},{"tipo":"alerta","texto":"Un estudio electroneurológico **normal o no concluyente NO excluye** la compresión: la conclusión se basa entonces en **repetir cuidadosamente la anamnesis y la exploración física**."},{"tipo":"esquema","titulo":"Algoritmo diagnóstico de un atrapamiento","mermaid":"flowchart TD\n  A[\"Parestesias en territorio nervioso\"] --> B[\"Anamnesis: inicio, evolución, trabajo, patologías\"]\n  B --> C{\"Bilateral\"}\n  C -->|\"sí\"| D[\"Buscar causa central o sistémica\"]\n  C -->|\"no\"| E[\"Exploración sensitivo-motora\"]\n  E --> F[\"Recorrer trayecto: Tinel y provocación\"]\n  F --> G[\"Estudio neurofisiológico\"]\n  G -->|\"alterado\"| H[\"Diagnóstico confirmado y cuantificado\"]\n  G -->|\"normal\"| I[\"No excluye: repetir anamnesis y exploración\"]\n  F --> J[\"Imagen: Rx, RMN o TC según sospecha\"]","pie":"La exploración decide si la lesión es periférica, radicular o del plexo."}]},{"id":"tratamiento-general","titulo":"4. Tratamiento general","bloques":[{"tipo":"tabla","titulo":"Conservador frente a quirúrgico","columnas":["","Conservador","Quirúrgico"],"filas":[["Medidas","AINES, vitaminas del grupo B (B12), férulas nocturnas, control de enfermedades sistémicas","Descompresión de las estructuras que comprimen el nervio"],["Fisioterapia","Neurodinámica, neuromodulación, tratamiento de los desfiladeros","**Siempre después**: calidad tisular, evitar fibrosis y retracción cicatricial, recuperar función y **deslizamiento** del nervio"],["Indicación","Primera línea","Compresión **cronificada** con **fracaso** del conservador"]]},{"tipo":"parrafo","texto":"El pronóstico depende del **momento** de la liberación. Si el nervio se libera **pronto**, se recupera por completo gracias a la regeneración de la **mielina** y de los **axones** dañados. Si la liberación es **tardía**, la regeneración axonal no se produce porque los **conductos endoneurales** están obstruidos. De ahí el mensaje del temario: **diagnóstico y tratamiento precoz**."},{"tipo":"perla","texto":"Tras cualquier descompresión, el objetivo del fisioterapeuta no es solo la fuerza: hay que **devolver la capacidad de deslizamiento** al nervio (neurodinámica) y trabajar la cicatriz para que la fibrosis no reproduzca el atrapamiento."},{"tipo":"figura","pagina":23,"pie":"Plexo braquial (raíces C5-T1, troncos, divisiones, fascículos): sigue de dónde salen el musculocutáneo, axilar, mediano, cubital y radial para entender por qué un síntoma bilateral o proximal obliga a pensar en raíz o plexo.","src":"img/patologia-quirurgica-i-t13-sindromes-de-atrapamiento-neurologico-del-miembro-superior-p23.jpg"}]},{"id":"nervio-mediano","titulo":"5. Nervio mediano","bloques":[{"tipo":"parrafo","texto":"El temario describe **4 zonas de compresión** del mediano, de proximal a distal: **ligamento de Struther**, **síndrome interóseo anterior (Kiloh-Nevin)**, **síndrome del pronador redondo** y **síndrome del túnel carpiano**."},{"tipo":"tabla","titulo":"Atrapamientos del nervio mediano","columnas":["Síndrome","Localización","Clínica clave","Exploración / diagnóstico"],"filas":[["Ligamento de Struther","Entre el ligamento de Struther y la **apófisis supracondílea**, tercio distal del húmero","Dolor cara antero-interna del codo; dolor y parestesias en territorio mediano con la **extensión (forzada) del codo**","Rx: a veces apófisis supracondílea de dirección **anterior y medial**"],["Interóseo anterior (Kiloh-Nevin)","Rama **motora** del mediano en el antebrazo","Neuropatía **motora**, poco frecuente; debilidad aislada de la flexión de la **IF del pulgar**; pinza pulgar-índice","Imposibilidad del **signo del «OK»**; RMN y EMG confirman"],["Pronador redondo","Paso a través del músculo pronador redondo (antebrazo)","Dolor anterior proximal del antebrazo que aumenta con la actividad; parestesias en palma, 3 dedos radiales y mitad radial del 4.º","**Pronación forzada**; debilidad de músculos del antebrazo; **Tinel +** sobre el pronador"],["Túnel carpiano","Muñeca, bajo el ligamento transverso del carpo","Dolor, entumecimiento, parestesias **nocturnas** en 1.º-3.º dedo y cara radial del 4.º; pérdida de fuerza y destreza tardía","Flick, Phalen, Tinel; EMG y ecografía"]]},{"tipo":"definicion","termino":"Nervio interóseo anterior","texto":"Rama **motora** del mediano que inerva al **flexor largo del pulgar**, al **flexor común profundo de los dedos** y al **pronador cuadrado**."},{"tipo":"figura","pagina":30,"pie":"Signo del «OK»: a la izquierda la pinza normal (círculo redondo); a la derecha la pinza anormal del síndrome de Kiloh-Nevin, con IF del pulgar y IFD del índice en extensión por fallo del flexor largo del pulgar y del flexor profundo.","src":"img/patologia-quirurgica-i-t13-sindromes-de-atrapamiento-neurologico-del-miembro-superior-p30.jpg"},{"tipo":"alerta","texto":"El **pronador redondo** y el **ligamento de Struther** son difíciles de diferenciar en la exploración. La pista: Struther provoca síntomas con la **extensión forzada del codo** (y puede verse la apófisis en Rx); el pronador, con la **pronación forzada** y Tinel sobre el músculo."},{"tipo":"alerta","texto":"En el Kiloh-Nevin **no hay parestesias** (es motor puro). Si el paciente refiere hormigueo en los dedos radiales, ese no es un síndrome interóseo anterior aislado."}]},{"id":"tunel-carpiano","titulo":"6. Síndrome del túnel carpiano","bloques":[{"tipo":"parrafo","texto":"Es la **neuropatía periférica focal más común**: el mediano se comprime en la muñeca, bajo el **ligamento transverso del carpo**, junto con los tendones flexores. Hay altas prevalencias en trabajos con **movimientos repetitivos de muñeca** (oficina, ordenador)."},{"tipo":"dato","valor":"3–4 % · 3:1","texto":"Afecta aproximadamente al **3-4 % de la población adulta** y es **tres veces más frecuente en mujeres**."},{"tipo":"figura","pagina":33,"pie":"Túnel carpiano normal frente a nervio mediano comprimido bajo el ligamento transverso del carpo; a la derecha, relación del mediano con los tendones flexores y el retináculo.","src":"img/patologia-quirurgica-i-t13-sindromes-de-atrapamiento-neurologico-del-miembro-superior-p33.jpg"},{"tipo":"tabla","titulo":"Signos diagnósticos del túnel carpiano","columnas":["Signo","Cómo se hace","Positivo si"],"filas":[["Flick","Se pregunta: «¿Qué hace con la mano cuando los síntomas están peor?»","El paciente **agita la mano** como para bajar un termómetro (**alto valor predictivo**)"],["Phalen","**Flexión palmar máxima de ambos carpos a la vez** durante **1-2 minutos**","Parestesias en la distribución del mediano"],["Tinel","Percusión ligera sobre el túnel carpiano en su región palmar","Disestesias u hormigueo"]]},{"tipo":"tabla","titulo":"Exploración complementaria","columnas":["Prueba","Aporta"],"filas":[["EMG","Diferencia lesión **sensitiva o mixta** e intensidad de la compresión (estudio sensitivo y motor); **necesaria para confirmar**"],["Ecografía","Aumento del **área de sección** del nervio, aplanamiento, edema"],["Cuándo","Clínica **atípica**, fracaso del conservador o cuando **está indicada la cirugía**"]]},{"tipo":"esquema","titulo":"Escalera terapéutica del túnel carpiano","mermaid":"flowchart TD\n  A[\"Túnel carpiano diagnosticado\"] --> B[\"Férula de muñeca salvo casos graves\"]\n  B --> C[\"Fisioterapia: neurodinámica y neuromodulación\"]\n  C -->|\"sin mejoría\"| D[\"Infiltración de corticoides\"]\n  D --> E[\"Mejoría 49-81 por ciento, recidiva 50-86 por ciento\"]\n  D -->|\"fracaso\"| F{\"Criterios quirúrgicos\"}\n  F --> G[\"3 meses sin mejoría\"]\n  F --> H[\"Clínica grave con atrofia tenar\"]\n  F --> I[\"EMG motora moderada o grave\"]\n  G --> J[\"Sección del ligamento transverso\"]\n  H --> J\n  I --> J\n  J --> K[\"Fisioterapia postoperatoria\"]","pie":"Máximo 3 infiltraciones al año; la cirugía es definitiva si la compresión está realmente en el túnel."},{"tipo":"dato","valor":"≤ 3 / año","texto":"No se recomiendan **más de 3 infiltraciones** de corticosteroides por año. Mejoran el **49-81 %** de los casos pero recidivan el **50-86 %**."},{"tipo":"lista","items":["Complicaciones de la cirugía: traumatismo de la **rama motora, palmar cutánea o recurrente** del mediano.","Cicatrización hipertrófica; adherencia tendinosa; rigidez.","Laceración del **arco palmar superficial**; lesión arterial; hematoma.","Infección postoperatoria."]},{"tipo":"perla","texto":"Los síntomas que **despiertan por la noche** y se alivian sacudiendo la mano (Flick) son la firma del túnel carpiano: una **férula nocturna** en posición neutra es la primera medida que el fisioterapeuta puede proponer, salvo en casos graves."},{"tipo":"alerta","texto":"El Phalen se hace con **flexión** palmar **máxima** de **ambos** carpos **a la vez** y dura **1-2 minutos**; no confundir con la percusión (Tinel) ni con la pregunta (Flick). La **atrofia tenar** es criterio quirúrgico, no un signo inicial."}]},{"id":"nervio-radial","titulo":"7. Nervio radial","bloques":[{"tipo":"parrafo","texto":"Procede de los **troncos posteriores** del plexo braquial (**C5, C6, C7 y C8**). Desciende por la parte interna del brazo y a **10 cm del codo se hace lateral**. A **3 cm del codo**, tras dar ramas motoras, se divide en una **rama sensitiva superficial** y una **rama motora profunda (nervio interóseo posterior)**, que pasa por la **arcada de Frohse**."},{"tipo":"figura","pagina":47,"pie":"División del radial en el codo: la rama profunda (interóseo posterior) se introduce bajo la arcada de Frohse del supinador, mientras la rama superficial sensitiva sigue hacia la muñeca.","src":"img/patologia-quirurgica-i-t13-sindromes-de-atrapamiento-neurologico-del-miembro-superior-p47.jpg"},{"tipo":"dato","valor":"10 cm / 3 cm","texto":"A **10 cm** del codo el radial se hace lateral; a **3 cm** se divide en rama superficial sensitiva y rama profunda motora."},{"tipo":"parrafo","texto":"El **síndrome de la arcada de Frohse** es una neuropatía compresiva del **nervio interóseo posterior** por atrapamiento en el desfiladero del **músculo supinador corto** (endurecido o fibrosado). Factores de riesgo: túnel radial pequeño, fuerza deficiente en brazo y muñeca, gestos repetitivos, quistes o tumores, edema y traumatismos. Engloba **dos presentaciones clínicas**."},{"tipo":"tabla","titulo":"Las dos caras de la arcada de Frohse (y Wartenberg)","columnas":["","Sd. del nervio interóseo posterior","Sd. del túnel radial","Sd. de Wartenberg"],"filas":[["Rama","Motora profunda","Motora profunda (arcada de Frohse)","**Rama sensitiva** superficial"],["Tipo","Mononeuropatía **motora**","Predominio **doloroso**","Sensitiva, **poco frecuente**"],["Clínica","Parálisis **no dolorosa** con **sensibilidad preservada**; déficit de extensión de dedos y muñeca","Dolor proximal y radial del antebrazo que aumenta con la **pronosupinación repetida** y mejora con reposo; **sin** alteraciones motoras","Dolor y parestesias en el dorso radial del antebrazo → dorso del pulgar, 2.º y 3.º dedo; aumenta con extensión y desviaciones laterales de muñeca"],["Diagnóstico","**EMG = mejor método**; Rx (trauma), ecografía, RMN (masas)","EMG alterada solo en **15-20 %**; RMN: denervación y descartar epicondilitis","**Tinel +** en la cara latero-dorsal del radio distal (descarga sobre la estiloides); **no hay atrofia**"],["Confusión típica","—","**Epicondilitis**","—"]]},{"tipo":"dato","valor":"15–20 %","texto":"Porcentaje de pacientes con **síndrome del túnel radial** en los que la **EMG** sale alterada: una EMG normal no descarta el cuadro."},{"tipo":"tabla","titulo":"Tratamiento de los atrapamientos del radial","columnas":["Síndrome","Conservador","Quirúrgico"],"filas":[["Arcada de Frohse","Observación **1-3 meses**; reposo + AINES en fases iniciales; ejercicio terapéutico y flexibilidad de la **musculatura supinadora**; evitar pronosupinación repetitiva; fisioterapia","Descompresión / liberación del túnel radial"],["Wartenberg","**Tratamiento de elección**: reposo con férulas + AINES, modificar la actividad laboral, infiltraciones con corticoides, fisioterapia (neurodinámica)","Exploración y descompresión del nervio"]]},{"tipo":"alerta","texto":"Dolor en la cara lateral del codo que empeora con la pronosupinación, con EMG normal: no etiquetes de entrada «epicondilitis». El **túnel radial** se confunde a menudo con ella y la EMG solo es positiva en el 15-20 %."},{"tipo":"perla","texto":"En el túnel radial el fisioterapeuta trabaja **flexibilidad del supinador**, ejercicio terapéutico y **educación para evitar la pronosupinación repetida**, dejando 1-3 meses de observación antes de plantear cirugía."}]},{"id":"nervio-cubital","titulo":"8. Nervio cubital","bloques":[{"tipo":"parrafo","texto":"En el codo, el cubital pasa por el **túnel cubital**, por debajo de la **epitróclea**; al entrar en la mano atraviesa el **canal de Guyón**. Inerva musculatura del antebrazo y de la palma, sobre todo la **eminencia hipotenar** y el **5.º dedo**, además de los **interóseos** y el **aductor del pulgar**."},{"tipo":"figura","pagina":65,"pie":"Territorios sensitivos de la mano: mediano (amarillo), cubital (azul: 5.º dedo y mitad cubital del 4.º) y radial (rojo, dorso radial); a la derecha, ramas del nervio en la palma.","src":"img/patologia-quirurgica-i-t13-sindromes-de-atrapamiento-neurologico-del-miembro-superior-p65.jpg"},{"tipo":"tabla","titulo":"Zonas de compresión del cubital","columnas":["Zona","Nivel","Causas"],"filas":[["Túnel cubital","Codo","Traumatismos, luxaciones o fracturas; presión excesiva en el túnel; **hueso heterotópico**; aponeurosis del **flexor cubital del carpo**; **arcada de Struther** (banda fascial del tríceps al septo intermuscular medial)"],["Canal de Guyón","Muñeca","Traumatismos, luxaciones o fracturas; presión excesiva en el canal; **fibrosis de la banda fascial**"]]},{"tipo":"alerta","texto":"Trampa de nombres: el **ligamento de Struther** (con la apófisis supracondílea) atrapa al **mediano**; la **arcada de Struther** (banda fascial tríceps–septo intermuscular medial) atrapa al **cubital**."},{"tipo":"lista","items":["Dolor en la **cara medial del codo**.","Parestesias en **4.º (cara cubital) y 5.º dedo**.","Empeora con el **codo en flexión** (aumenta la tensión del nervio); puede despertar por la noche.","Dificultad para **ABD/ADD de los dedos** por afectación de los **interóseos**.","Casos avanzados: afectación motora grave con **atrofia hipotenar**."]},{"tipo":"definicion","termino":"Mano en garra","texto":"Deformidad de la **parálisis completa** del cubital: atrofia y debilidad muscular con **hiperextensión de las metacarpofalángicas** y **flexión de las interfalángicas**."},{"tipo":"tarjetas","items":[{"etiqueta":"Interóseos","titulo":"Separación de dedos","texto":"Fuerza contra resistencia de la separación de los dedos 2.º y 5.º. Su paresia aparece en lesiones del cubital **tanto en el codo como en el carpo**."},{"etiqueta":"Froment","titulo":"Pinza de papel","texto":"El paciente sujeta un papel entre pulgares e índices flexionados y tira. Con paresia del **aductor del pulgar** el papel se escapa y el pulgar se flexiona por compensación del **flexor largo del pulgar** (mediano)."}]},{"tipo":"tabla","titulo":"Tratamiento quirúrgico del cubital","columnas":["Técnica","En qué consiste"],"filas":[["Descompresión del túnel cubital","Se corta el «techo» del túnel cubital"],["Transposición anterior","Se lleva el nervio a una posición **anterior al epicóndilo medial**"],["Epicondilectomía medial","Se extirpa parte del **epicóndilo medial**"],["Liberación del canal de Guyón","Bajo **anestesia regional**, se libera el nervio en su paso por el canal"]]},{"tipo":"parrafo","texto":"El tratamiento **conservador** combina **AINES + inmovilización/reposo** y fisioterapia; la cirugía se reserva al fracaso."},{"tipo":"esquema","titulo":"Rehabilitación tras cirugía del cubital","mermaid":"flowchart LR\n  A[\"Cirugía\"] --> B[\"Vendaje o férula 5-7 días\"]\n  B --> C[\"Retirada de puntos\"]\n  C --> D[\"Terapia manual cicatricial\"]\n  A --> E[\"Ejercicio sin carga desde 1 semana\"]\n  E --> F[\"Ejercicio con carga desde 2 semanas\"]\n  D --> G[\"Fuerza y ROM recuperados\"]\n  F --> G","pie":"La férula protege los puntos; la terapia cicatricial solo tras retirar la sutura."},{"tipo":"dato","valor":"5–7 d · 1 / 2 sem","texto":"Vendaje o férula **5-7 días**; ejercicios terapéuticos desde **1 semana** tras la cirugía, **2 semanas** si son con carga."},{"tipo":"perla","texto":"Objetivos postquirúrgicos: reducir el tiempo de curación, disminuir el dolor, **minimizar la cicatriz y sus adherencias** y recuperar fuerza y ROM lo antes posible. La terapia manual cicatricial **nunca antes de retirar los puntos**."}]}],"caso_clinico":{"titulo":"Administrativa con hormigueo nocturno","presentacion":"Mujer de 46 años, administrativa (8 h/día de teclado y ratón), con hipotiroidismo. Desde hace 5 meses la despiertan por la noche hormigueos en pulgar, índice, medio y mitad radial del anular de la mano derecha; dice que «sacude la mano» para aliviarse. No hay atrofia tenar. Phalen positivo a los 50 segundos y Tinel positivo en la región palmar del carpo. Lleva 3 meses con férula nocturna y fisioterapia (neurodinámica) sin mejoría clara.","preguntas":[{"pregunta":"¿Qué síndrome sospechas y qué datos lo apoyan frente a un síndrome del pronador redondo?","respuesta":"Síndrome del **túnel carpiano**: síntomas **nocturnos**, territorio 1.º-3.º dedo + mitad radial del 4.º, **Flick** positivo, Phalen y Tinel en el carpo. El pronador redondo da dolor en la cara anterior proximal del antebrazo que aumenta con la actividad, Tinel sobre el pronador y se provoca con pronación forzada; además, el túnel carpiano es mucho más frecuente (mujer, trabajo repetitivo de muñeca, hipotiroidismo como causa de edema)."},{"pregunta":"¿Qué pruebas complementarias pedirías ahora y por qué?","respuesta":"**EMG** (confirma, diferencia lesión sensitiva o mixta y gradúa la intensidad) y opcionalmente **ecografía** (área de sección aumentada, aplanamiento, edema). Están indicadas porque ha **fracasado el tratamiento conservador** y se plantea infiltración o cirugía. Si la EMG fuera normal, no excluiría la compresión."},{"pregunta":"Si se infiltra y recae, ¿cuándo estaría indicada la cirugía y qué papel tendría la fisioterapia después?","respuesta":"Cirugía (sección del ligamento transverso) si **no mejora tras 3 meses** de conservador, si aparece clínica grave y progresiva con **atrofia tenar** o si la **EMG** muestra afectación motora moderada o grave con clínica compatible; no más de 3 infiltraciones al año (recidiva 50-86 %). Después, fisioterapia para mejorar la calidad tisular, evitar fibrosis y retracción de la cicatriz, prevenir adherencias tendinosas y rigidez y recuperar el **deslizamiento** del nervio. Además, controlar el hipotiroidismo."}]},"preguntate":[{"pregunta":"Explica el círculo vicioso vascular de una neuropatía compresiva.","respuesta":"La compresión produce obstrucción venosa y congestión de los plexos epi/perineurales; la anoxia dilata capilares (edema) y estimula fibroblastos (fibrosis). Edema y fibrosis aumentan la presión interna y empeoran el retorno venoso."},{"pregunta":"¿Qué ocurre a nivel celular cuando el flujo del nervio cae un 30-50 %?","respuesta":"Disminuye la fosforilación oxidativa y los fosfatos de alta energía: falla la bomba de sodio, el transporte axoplasmático y la membrana; sin tratamiento se pierde la conducción."},{"pregunta":"¿Por qué importa que la afectación sea bilateral?","respuesta":"Porque orienta a una causa más central (radicular, plexo o sistémica) en lugar de un atrapamiento periférico aislado."},{"pregunta":"¿Qué parámetro neurofisiológico se altera primero y cuál es la consecuencia de un estudio normal?","respuesta":"La velocidad de conducción (primera en afectarse, última en recuperarse). Un estudio normal o no concluyente no excluye la compresión: se repiten anamnesis y exploración."},{"pregunta":"¿Por qué una liberación tardía tiene peor pronóstico?","respuesta":"Porque los conductos endoneurales se obstruyen y la regeneración axonal ya no se produce; la liberación precoz permite remielinización y regeneración completas."},{"pregunta":"Describe el signo de Flick y el de Phalen.","respuesta":"Flick: al preguntar qué hace con la mano cuando empeora, el paciente la sacude como un termómetro (alto valor predictivo). Phalen: flexión palmar máxima de ambos carpos a la vez 1-2 min; positivo si hay parestesias en territorio mediano."},{"pregunta":"¿Qué músculos inerva el nervio interóseo anterior y qué signo pierde el paciente?","respuesta":"Flexor largo del pulgar, flexor común profundo de los dedos y pronador cuadrado. No puede hacer el signo del «OK» (pinza pulgar-índice redonda)."},{"pregunta":"Compara el síndrome del interóseo posterior con el del túnel radial.","respuesta":"Ambos en la arcada de Frohse. El interóseo posterior es motor: parálisis indolora de la extensión de dedos y muñeca con sensibilidad preservada (EMG = mejor prueba). El túnel radial es doloroso, sin déficit motor, empeora con la pronosupinación y se confunde con epicondilitis (EMG alterada solo en 15-20 %)."},{"pregunta":"¿Qué explora el signo de Froment y por qué se flexiona el pulgar?","respuesta":"Explora el aductor del pulgar (cubital). Si está parético, el papel se escapa y el flexor largo del pulgar (mediano) compensa flexionando la IF."},{"pregunta":"Enumera las cuatro opciones quirúrgicas del cubital.","respuesta":"Descompresión del túnel cubital (cortar el techo), transposición anterior al epicóndilo medial, epicondilectomía medial y liberación del canal de Guyón bajo anestesia regional."}],"glosario":[{"termino":"Neuropatía compresiva","definicion":"Lesión de un nervio periférico por compresión mecánica y trastornos vasculares secundarios en un punto de su trayecto."},{"termino":"Canal osteofibroso","definicion":"Conducto formado por hueso y tejido fibroso donde el nervio suele cambiar de dirección; lugar típico de atrapamiento."},{"termino":"Plexos epineural y perineural","definicion":"Redes vasculares que rodean el tronco y los fascículos nerviosos; su congestión venosa inicia la isquemia."},{"termino":"Transporte axoplasmático","definicion":"Movimiento de sustancias a lo largo del axón; se altera con la caída de fosfatos de alta energía."},{"termino":"Signo de Tinel","definicion":"Parestesias en la distribución cutánea de un nervio al percutir su punto de compresión."},{"termino":"Apófisis supracondílea","definicion":"Prominencia ósea anterior y medial del húmero distal, unida al ligamento de Struther; puede comprimir el mediano."},{"termino":"Arcada de Frohse","definicion":"Borde proximal del supinador corto por donde pasa el nervio interóseo posterior."},{"termino":"Queiralgia parestésica (Wartenberg)","definicion":"Atrapamiento de la rama sensitiva superficial del radial en la muñeca."},{"termino":"Canal de Guyón","definicion":"Túnel de la muñeca por el que el nervio cubital entra en la mano."},{"termino":"Signo de Froment","definicion":"Flexión compensadora del pulgar al sujetar un papel por paresia del aductor del pulgar (cubital)."},{"termino":"Mano en garra","definicion":"Hiperextensión MCF y flexión IF por parálisis completa del cubital."},{"termino":"Transposición anterior del cubital","definicion":"Cirugía que desplaza el nervio por delante del epicóndilo medial para descomprimirlo."}],"fuentes":["Spinner et al., 1985","Eversmann W. W., 1993","McKinnon (cuestionario subjetivo y EVA en la compresión nerviosa)","Khoo et al., 1996 (figura del proceso supracondilar)","Universidad Europea. Tema 13. Síndromes de Atrapamiento Neurológico. Patología Quirúrgica I, 2026-2027"],"qcm":[{"pregunta":"Según el temario, ¿qué fenómeno inicia el componente vascular de una neuropatía compresiva?","opciones":["Oclusión arterial de los vasa nervorum","Desmielinización segmentaria del axón","Obstrucción venosa con congestión epi y perineural","Proliferación de fibroblastos endoneurales"],"correcta":2,"explicacion":"La obstrucción venosa, secundaria a inflamación, congestiona los plexos epineurales y perineurales y enlentece la circulación; de ahí deriva la anoxia, el edema y, después, la fibrosis.","por_opcion":["❌ El temario no habla de oclusión arterial: el bloqueo inicial es del retorno venoso.","❌ La desmielinización es un efecto de la lesión, no el inicio del componente vascular.","✅ Es el primer eslabón vascular del ciclo obstrucción venosa–anoxia–edema.","❌ La proliferación de fibroblastos es una consecuencia tardía de la anoxia."]},{"pregunta":"¿A partir de qué reducción del flujo sanguíneo nervioso disminuye la fosforilación oxidativa según el tema?","opciones":["Del 50-70 %","Del 30-50 %","Del 10-20 %","Del 20-30 %"],"correcta":1,"explicacion":"Con una caída del flujo del 30-50 % se reduce la fosforilación oxidativa y la producción de fosfatos de alta energía, con fallo de la bomba de sodio, del transporte axoplasmático y de la membrana.","por_opcion":["❌ Supera el umbral: los cambios ya aparecen antes.","✅ Es el intervalo exacto del temario.","❌ Cifra inferior a la indicada por el temario.","❌ Se queda corta respecto al umbral descrito."]},{"pregunta":"Un estudio electroneurológico no concluyente en un paciente con clínica típica de compresión implica que:","opciones":["Se descarta la neuropatía y se busca una causa radicular","La compresión no se excluye y se repite anamnesis y exploración","Se indica directamente la descompresión quirúrgica","Hay que pedir una TC para confirmar la compresión"],"correcta":1,"explicacion":"El temario insiste: si el estudio no es concluyente no se excluye la compresión; la conclusión final debe basarse en la repetición cuidadosa de anamnesis y exploración física.","por_opcion":["❌ Un estudio normal no descarta el atrapamiento.","✅ Es la conducta literal del temario.","❌ La cirugía exige cronificación y fracaso conservador, no un estudio dudoso.","❌ La TC se reserva para sospecha de causa muy proximal (Pancoast, tumores)."]},{"pregunta":"¿Qué parámetro neurofisiológico es el primero en alterarse y el último en recuperarse?","opciones":["El tiempo de latencia distal motora","La amplitud del potencial motor","La actividad espontánea en la EMG","La velocidad de conducción"],"correcta":3,"explicacion":"Los estudios electroneurológicos muestran que la velocidad de conducción es lo primero que se afecta y lo último en recuperarse, por eso sirve de marcador precoz y pronóstico.","por_opcion":["❌ La latencia se estudia, pero el temario atribuye esta propiedad a la velocidad de conducción.","❌ La caída de amplitud refleja pérdida axonal, más tardía.","❌ La actividad espontánea indica denervación, fase avanzada.","✅ Dato literal del temario."]},{"pregunta":"Ante la sospecha de una compresión de origen muy proximal, como un tumor de Pancoast, la prueba de imagen indicada en el tema es:","opciones":["Ecografía de alta resolución","Tomografía computarizada","Radiografía simple","Resonancia magnética"],"correcta":1,"explicacion":"El temario reserva la TC para la sospecha de causa muy proximal (Pancoast, tumor escapular, clavicular o costal); la RMN para masas intrínsecas o extrínsecas y la Rx para etiologías traumáticas.","por_opcion":["❌ La ecografía se cita en túnel carpiano y radial, no para causas proximales.","✅ Es la indicación que da el temario para causas muy proximales.","❌ La Rx sirve sobre todo para descartar traumatismos.","❌ La RMN se indica ante sospecha de masa compresiva."]},{"pregunta":"¿Por qué una liberación quirúrgica tardía puede no lograr la recuperación del nervio?","opciones":["Porque la bomba de sodio queda abolida de forma definitiva","Porque la cicatriz quirúrgica vuelve a comprimir el nervio","Porque los conductos endoneurales están obstruidos","Porque la mielina ya no puede regenerarse en adultos"],"correcta":2,"explicacion":"Si la liberación es tardía la regeneración axonal no se produce debido a la obstrucción de los conductos endoneurales; si es precoz se regeneran mielina y axones y la recuperación es completa.","por_opcion":["❌ El fallo de la bomba es un efecto de la isquemia, no la causa de la falta de regeneración.","❌ La fibrosis cicatricial es un riesgo postoperatorio, no la explicación del mal pronóstico tardío.","✅ Es el mecanismo que da el temario.","❌ La mielina sí se regenera tras una liberación temprana."]},{"pregunta":"Un paciente con dolor en la cara antero-interna del codo refiere parestesias en territorio mediano al extender el codo de forma forzada. La Rx muestra una prominencia ósea anteromedial en el húmero distal. ¿Qué atrapamiento sospechas?","opciones":["Síndrome de Kiloh-Nevin","Compresión por la arcada de Struther","Síndrome del pronador redondo","Compresión por el ligamento de Struther"],"correcta":3,"explicacion":"La compresión del mediano entre el ligamento de Struther y la apófisis supracondílea (tercio distal del húmero) da dolor anterointerno del codo y parestesias con la extensión forzada; la Rx puede mostrar la apófisis de dirección anterior y medial.","por_opcion":["❌ El Kiloh-Nevin es motor puro, sin parestesias.","❌ La arcada de Struther comprime el cubital, no el mediano.","❌ El pronador se provoca con pronación forzada y da dolor en el antebrazo proximal.","✅ Coinciden localización, maniobra y hallazgo radiológico."]},{"pregunta":"¿Cuál de estos músculos NO depende del nervio interóseo anterior según el temario?","opciones":["Pronador redondo","Pronador cuadrado","Flexor largo del pulgar","Flexor común profundo de los dedos"],"correcta":0,"explicacion":"El interóseo anterior, rama motora del mediano, inerva el flexor largo del pulgar, el flexor común profundo y el pronador cuadrado. El pronador redondo es el músculo a través del cual pasa el mediano (lugar de otro atrapamiento).","por_opcion":["✅ El pronador redondo es un punto de compresión del mediano, no una diana del interóseo anterior.","❌ Sí lo inerva.","❌ Sí lo inerva: su fallo impide flexionar la IF del pulgar.","❌ Sí lo inerva (porción del índice en la pinza)."]},{"pregunta":"En el síndrome del túnel carpiano, ¿cuál es el signo descrito como de alto valor predictivo?","opciones":["Signo de Froment","Signo de Tinel en el carpo","Signo de Flick","Signo de Phalen"],"correcta":2,"explicacion":"El signo de Flick (el paciente sacude la mano como un termómetro cuando empeoran los síntomas) se describe en el temario como de alto valor predictivo.","por_opcion":["❌ Froment explora el aductor del pulgar (cubital).","❌ Tinel también se usa, sin esa mención.","✅ Dato literal del temario.","❌ Phalen es diagnóstico, pero el temario no le asigna ese calificativo."]},{"pregunta":"Respecto a las infiltraciones de corticoides en el túnel carpiano, es correcto que:","opciones":["Mejoran el 49-81 % y recidivan el 50-86 %","Pueden repetirse hasta 5 veces por año","Mejoran el 50-86 % y recidivan el 49-81 %","Son la primera línea antes de la férula"],"correcta":0,"explicacion":"La infiltración local se indica si no hay mejoría con el conservador; mejora el 49-81 % de los casos pero recidiva en el 50-86 %, y no se recomiendan más de 3 por año.","por_opcion":["✅ Cifras exactas del temario.","❌ El límite recomendado es de 3 al año.","❌ Intercambia las cifras de mejoría y recidiva.","❌ Se usan tras fracaso del tratamiento conservador."]},{"pregunta":"¿Cuál de las siguientes situaciones NO figura entre las indicaciones quirúrgicas del túnel carpiano?","opciones":["EMG con afectación motora moderada y clínica compatible","Clínica progresiva con atrofia de la eminencia tenar","Ausencia de mejoría tras 3 meses de conservador","Phalen positivo en menos de 30 segundos"],"correcta":3,"explicacion":"El temario indica cirugía si no hay mejoría a los 3 meses, si hay clínica grave y progresiva con atrofia tenar o si la EMG muestra afectación motora moderada-grave con clínica compatible. La rapidez del Phalen no es criterio.","por_opcion":["❌ Es una indicación literal.","❌ Es una indicación literal.","❌ Es una indicación literal.","✅ No aparece como criterio quirúrgico en el temario."]},{"pregunta":"Un paciente presenta parálisis indolora de la extensión de dedos y muñeca, con sensibilidad conservada. ¿Qué cuadro y qué prueba son los más adecuados?","opciones":["Síndrome del interóseo posterior; EMG","Túnel radial; ecografía","Túnel radial; RMN","Síndrome de Wartenberg; Tinel en la estiloides"],"correcta":0,"explicacion":"El síndrome del nervio interóseo posterior es una mononeuropatía motora: parálisis no dolorosa con sensibilidad preservada y déficit de extensión; la EMG es el mejor método diagnóstico.","por_opcion":["✅ Clínica y prueba coinciden con el temario.","❌ Mismo error de cuadro que la primera opción.","❌ El túnel radial es doloroso y no suele dar déficit motor.","❌ Wartenberg es sensitivo, sin déficit motor ni atrofia."]},{"pregunta":"En el síndrome del túnel radial, la EMG aparece alterada aproximadamente en:","opciones":["El 5-10 % de los pacientes","El 49-81 % de los pacientes","El 30-50 % de los pacientes","El 15-20 % de los pacientes"],"correcta":3,"explicacion":"La EMG solo sale alterada en el 15-20 % de los pacientes con túnel radial; por eso la RMN ayuda a ver denervación y a descartar una epicondilitis.","por_opcion":["❌ Cifra inferior a la del temario.","❌ Corresponde a la mejoría tras infiltración en el túnel carpiano.","❌ Corresponde a la caída de flujo que altera el metabolismo nervioso.","✅ Dato literal."]},{"pregunta":"Dolor y parestesias en el dorso radial del antebrazo que irradian al dorso del pulgar, empeoran con la desviación lateral de la muñeca y con Tinel positivo sobre el radio distal, sin atrofia. ¿Cuál es el tratamiento de elección?","opciones":["Liberación quirúrgica de la arcada de Frohse","Transposición del nervio a nivel del codo","Observación aislada durante 1-3 meses","Conservador: férula, AINES, adaptación laboral"],"correcta":3,"explicacion":"Es un síndrome de Wartenberg (rama sensitiva del radial). El temario señala el tratamiento conservador como de elección: reposo con férulas + AINES, modificación laboral, infiltraciones y fisioterapia (neurodinámica).","por_opcion":["❌ La arcada de Frohse afecta a la rama profunda, no a la sensitiva.","❌ La transposición es una técnica del cubital.","❌ La observación 1-3 meses es pauta de la arcada de Frohse.","✅ Es el tratamiento de elección del Wartenberg."]},{"pregunta":"En la prueba de Froment, la flexión de la interfalángica del pulgar se debe a:","opciones":["Compensación del flexor largo del pulgar por paresia del aductor","Paresia de los interóseos dorsales del primer espacio","Contractura del aductor del pulgar por irritación cubital","Hiperactividad del flexor corto por lesión del mediano"],"correcta":0,"explicacion":"Si el aductor del pulgar (cubital) está parético, el papel se escapa y el flexor largo del pulgar actúa de forma compensadora, dando la posición anómala del pulgar.","por_opcion":["✅ Mecanismo literal del temario.","❌ Los interóseos se exploran con la separación de los dedos 2.º y 5.º.","❌ El aductor está débil, no contracturado.","❌ El mediano está sano; es él quien compensa a través del flexor largo."]}],"asignatura":"Patología quirúrgica I","tema":13,"fecha":"2026-11-13"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
