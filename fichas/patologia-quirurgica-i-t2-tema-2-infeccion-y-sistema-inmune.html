<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 2. Infección y sistema inmune · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 2. Infección y sistema inmune","subtitulo":"Qué es una infección, los postulados de Koch y sus límites, los cinco tipos de agentes infecciosos y la organización de la inmunidad innata y adaptativa.","resumen":["La **infección** es la entrada, desarrollo y multiplicación de un agente infeccioso en un huésped; no hay que confundirla con la **infestación**, y **no toda infección produce una enfermedad contagiosa**.","**Pasteur (1859)** demostró que la fermentación se debe a microorganismos y no a la generación espontánea; **Koch** formuló **4 postulados** que hoy se consideran **obsoletos desde los años 50** (portadores asintomáticos, virus, causalidad compleja), revisados por ejemplo por **Evans**.","Los agentes infecciosos son **bacterias** (procariotas de 0,5–5 μm, pared de peptidoglicano), **hongos**, **virus** (ADN o ARN en cubierta proteica, parásitos obligados, sin respuesta a antibióticos), **protozoos** (unicelulares con núcleo) y **metazoos** (pluricelulares eucariotas).","Los **órganos linfoides primarios** (timo y médula ósea) forman linfocitos T y B maduros; los **secundarios** (bazo, ganglios, GALT y MALT) son donde se producen las respuestas; el **anillo de Waldeyer** es la primera barrera de las vías digestiva y respiratoria.","La **inmunidad innata** tiene una primera línea (piel y mucosas) y una segunda (fagocitos, NK, proteínas antimicrobianas, inflamación, fiebre); la **adaptativa** es específica y con **memoria**, humoral (**linfocitos B**/anticuerpos) o celular (**linfocitos T**), y puede ser **activa o pasiva, natural o artificial**."],"objetivos":["Definir infección y distinguirla de infestación y de enfermedad contagiosa.","Enunciar los cuatro postulados de Koch y explicar sus limitaciones.","Clasificar los agentes infecciosos y las bacterias según su morfología.","Identificar los órganos linfoides y la función de cada tipo de leucocito.","Diferenciar inmunidad innata y adaptativa, y los tipos de inmunidad activa y pasiva."],"ideas_clave":["Infección ≠ infestación, e infección ≠ enfermedad contagiosa.","Los **4 postulados de Koch**: presencia en todos los enfermos, aislamiento en cultivo puro, reproducción en un sano, re-aislamiento idéntico; obsoletos desde los años 50.","Cada postulado tiene su fallo: 1.º portadores asintomáticos; 2.º virus (parásitos obligados); 3.º no todo expuesto enferma.","Bacterias: procariotas, **0,5–5 μm**, sin núcleo definido ni orgánulos membranosos, pared de **peptidoglicano (mureína)**.","Los **antibióticos no son eficaces contra los virus**.","Órganos primarios: **timo y médula ósea**; secundarios: **bazo, ganglios, GALT y MALT**.","Las **NK** no son fagocíticas: destruyen la membrana de la célula diana.","La memoria (linfocitos B de memoria) hace que la respuesta secundaria sea **más rápida e intensa**."],"secciones":[{"id":"infeccion","titulo":"Infección: concepto e historia","bloques":[{"tipo":"definicion","termino":"Infección","texto":"**Entrada, desarrollo y multiplicación** de un agente infeccioso en el cuerpo de una persona o un animal (**huésped**). Es importante diferenciar infección de **infestación**."},{"tipo":"alerta","texto":"No siempre que hay una infección se produce una **enfermedad contagiosa**: el temario lo destaca como idea a recordar. Un individuo puede albergar el patógeno sin enfermar (portador) y una infección puede no transmitirse."},{"tipo":"parrafo","texto":"**Louis Pasteur** demostró en **1859** que la fermentación era causada por el crecimiento de microorganismos y no por **generación espontánea**, como se creía. Las levaduras, mohos y hongos asociados a la fermentación no son bacterias. Pasteur y su contemporáneo **Robert Koch** defendieron la **teoría microbiana de la enfermedad**; Koch, pionero de la microbiología médica, estableció los **postulados** que llevan su nombre."},{"tipo":"dato","valor":"1859","texto":"Año en que Pasteur demostró que la fermentación se debe a microorganismos y no a la generación espontánea."},{"tipo":"tabla","titulo":"Pioneros de la teoría microbiana","columnas":["Autor","Aportación","Vigencia"],"filas":[["Louis Pasteur","Demostró en 1859 que la fermentación la causa el crecimiento de microorganismos y refutó la generación espontánea","Base de la teoría microbiana de la enfermedad"],["Robert Koch","Pionero de la microbiología médica; formuló los postulados que relacionan un microorganismo con una enfermedad","Se siguen utilizando parcialmente hoy; obsoletos como modelo general desde los años 50"]]},{"tipo":"parrafo","texto":"El modelo de Koch concebía la relación **patógeno → enfermedad** de forma **lineal**: un microbio, una enfermedad. Hoy se sabe que la relación causal es mucho más compleja: hay patógenos que provocan **enfermedades diferentes de un individuo a otro**, enfermedades que requieren la presencia de **dos patógenos distintos** e individuos que portan el patógeno pero **nunca manifestarán la enfermedad**. Por eso el temario insiste en separar tres conceptos: la presencia del agente (infección), la aparición de síntomas (enfermedad) y la capacidad de transmisión (contagio)."}]},{"id":"koch","titulo":"Postulados de Koch y sus limitaciones","bloques":[{"tipo":"tabla","titulo":"Los cuatro postulados de Koch","columnas":["Postulado","Enunciado","Limitación principal"],"filas":[["1.º","El microorganismo se encuentra en abundancia en todos los enfermos y no en los sanos","Descartado rápidamente por los **portadores asintomáticos**"],["2.º","Puede extraerse, aislarse y cultivarse en cultivo puro; no aparece de forma fortuita en otras enfermedades","Falla con los **virus**: parásitos obligados que necesitan células para hospedarse"],["3.º","El microorganismo cultivado debe causar la enfermedad al introducirlo en un organismo sano","\"Debería\" no es \"siempre\": en **tuberculosis o cólera** no todos los expuestos enferman"],["4.º","El patógeno re-aislado de los inoculados debe ser idéntico al del primer enfermo","Relación causal más compleja que la lineal propuesta"]]},{"tipo":"esquema","titulo":"Lógica experimental de los postulados de Koch","mermaid":"flowchart LR\n  A[\"1. Presente en todos los enfermos\"] --> B[\"2. Aislado en cultivo puro\"]\n  B --> C[\"3. Inoculado en sano reproduce la enfermedad\"]\n  C --> D[\"4. Re-aislado e identico al original\"]\n  A -.->|\"Falla\"| X1[\"Portadores asintomaticos\"]\n  B -.->|\"Falla\"| X2[\"Virus: parasitos obligados\"]\n  C -.->|\"Falla\"| X3[\"Inmunidad, vacunacion, buena salud\"]","pie":"La aplicación experimental empieza con el segundo postulado; cada eslabón tiene una excepción conocida."},{"tipo":"parrafo","texto":"Que un individuo con el patógeno no enferme (fallo del 3.er postulado) puede deberse a **factores del individuo**: buena salud física, sistema inmune sano, exposición previa con inmunidad desarrollada o **vacunación**."},{"tipo":"lista","items":["Concebidos en el **siglo XIX**, con limitaciones tecnológicas.","El descubrimiento de los **virus** (acelulares y parásitos obligados) y de bacterias que no encajaban en el modelo de **Koch-Henle** obligó a revisarlos: ejemplo, la **propuesta de Evans**.","Considerados **fundamentalmente obsoletos desde los años 50** del siglo XX, aunque con gran importancia histórica.","Existen patógenos que causan enfermedades distintas según el individuo, enfermedades con **dos patógenos** y portadores que nunca enfermarán."]},{"tipo":"dato","valor":"Años 50 (s. XX)","texto":"Desde entonces los postulados de Koch se consideran fundamentalmente obsoletos."},{"tipo":"alerta","texto":"Trampa de examen: el postulado que **falla con los virus** es el **segundo** (no se podían cultivar aislados en el s. XIX porque necesitan células), mientras que el que cae por los **portadores asintomáticos** es el **primero**."},{"tipo":"parrafo","texto":"El **segundo postulado** tiene un matiz que suele olvidarse: además de aislar y cultivar el microorganismo, estipula que el patógeno **no se da en otros contextos infecciosos ni de forma fortuita**; es decir, no debería aislarse de pacientes con otras enfermedades en los que pueda encontrarse como **parásito no patogénico**. La aplicación experimental de los postulados **empieza con este segundo enunciado**, ya que el primero es solo observacional."},{"tipo":"parrafo","texto":"El **tercer postulado** está formulado con un \"debería\", que no equivale a \"siempre tendría que ser\". El propio Koch observó que en la **tuberculosis** y el **cólera** no todos los organismos expuestos al agente desarrollaban la infección. El **cuarto postulado** cierra el círculo: el patógeno que se recupera de los individuos inoculados experimentalmente debe ser **idéntico** al extraído del primer enfermo."},{"tipo":"perla","texto":"La **vacunación** es uno de los factores del individuo que explican por qué un expuesto no enferma (excepción al 3.er postulado): en el ámbito sanitario, el fisioterapeuta vacunado protege a pacientes frágiles y a sí mismo."}]},{"id":"agentes","titulo":"Agentes infecciosos","bloques":[{"tipo":"tabla","titulo":"Comparación de los cinco grupos de agentes infecciosos","columnas":["Agente","Organización","Rasgos clave del temario","Ejemplos"],"filas":[["Bacterias","Procariotas unicelulares (0,5–5 μm)","Sin núcleo definido ni orgánulos membranosos; pared de peptidoglicano; muchas con flagelos","Cocos, bacilos, vibrios, espirilos, espiroquetas"],["Hongos","Multicelulares parecidos a plantas","Nutrientes de plantas, alimentos y animales en ambientes húmedos y cálidos; graves en inmunodeprimidos","Pie de atleta"],["Virus","No son células completas","ADN o ARN en cubierta proteica; necesitan células para reproducirse; mueren pronto fuera del huésped; no responden a antibióticos","Resfriado, gripe, viruela, VIH"],["Protozoos","Unicelulares eucariotas","Mayores que las bacterias, con núcleo y orgánulos; ambientes húmedos; transmisión por agua contaminada","Amebiasis, giardiasis"],["Metazoos","Pluricelulares eucariotas heterótrofos","Células coordinadas que forman tejidos, órganos y aparatos","—"]]},{"tipo":"dato","valor":"0,5–5 μm","texto":"Longitud de las bacterias, microorganismos procariotas."},{"tipo":"dato","valor":"×10","texto":"En el cuerpo humano hay aproximadamente diez veces más células bacterianas que células humanas, sobre todo en piel y tubo digestivo."},{"tipo":"tarjetas","items":[{"etiqueta":"Cocos","titulo":"Esféricos","texto":"**Diplococos** (de dos), **tetracocos** (de cuatro), **estreptococos** (en cadena), **estafilococos** (en racimo)."},{"etiqueta":"Bacilos","titulo":"En barra","texto":"Forma alargada de bastón."},{"etiqueta":"Helicoidales","titulo":"Curvados o espirales","texto":"**Vibrios** (filamento curvado, en coma), **espirilos** y **espiroquetas** (en tirabuzón)."}]},{"tipo":"figura","pagina":17,"pie":"Cocos al microscopio electrónico: agrupaciones en racimo típicas de los estafilococos. Relaciona la agrupación con el nombre (cadena = estreptococo, racimo = estafilococo).","src":"img/patologia-quirurgica-i-t2-tema-2-infeccion-y-sistema-inmune-p17.jpg"},{"tipo":"figura","pagina":18,"pie":"Bacterias helicoidales: a la izquierda formas en coma (vibrios), a la derecha una espiroqueta en tirabuzón.","src":"img/patologia-quirurgica-i-t2-tema-2-infeccion-y-sistema-inmune-p18.jpg"},{"tipo":"alerta","texto":"Protozoos y bacterias son **ambos unicelulares**, pero el protozoo es **eucariota** (núcleo y orgánulos) y mayor; la bacteria es **procariota**. Los hongos del temario se describen como **multicelulares**."},{"tipo":"perla","texto":"En el paciente **inmunodeprimido** (SIDA, cáncer) una infección fúngica banal puede volverse grave: en fisioterapia hospitalaria extrema la higiene de manos, superficies y material compartido."},{"tipo":"parrafo","texto":"Las **bacterias** son los organismos **más abundantes del planeta**: viven en todos los hábitats terrestres y acuáticos, incluso en los más extremos (manantiales de aguas calientes y ácidas, desechos radiactivos, profundidades del mar y de la corteza terrestre), y algunas sobreviven en el espacio exterior. Muchas disponen de **flagelos** u otros sistemas de locomoción. Se clasifican por su forma en **cocos** (esferas), **bacilos** (barras), **vibrios** (filamentos curvados) y **espirilos y espiroquetas** (helicoidales)."},{"tipo":"parrafo","texto":"Los **virus** son más pequeños que las bacterias y ni siquiera son células completas: solo material genético (**ADN o ARN**) empaquetado en una **cubierta proteica**. Fuera de células vivas sobreviven muy poco tiempo: en fluidos corporales sobre mostradores, mesas o asientos de inodoro mueren enseguida salvo que invadan a otro huésped. Pero una vez dentro del cuerpo **proliferan rápidamente**. Causan desde enfermedades leves (resfriado común) y habituales (gripe) hasta graves (viruela, SIDA por el VIH). Existen **antivirales** solo para un grupo reducido y específico de virus."},{"tipo":"definicion","termino":"Metazoos","texto":"Organismos **heterótrofos y eucariotas** formados por varias células unidas de manera coordinada y con interrelación química, con morfología y funciones determinadas, que forman **tejidos**, después **órganos** y **aparatos** para cumplir las funciones vitales (respiración, alimentación, locomoción)."},{"tipo":"alerta","texto":"Los **antibióticos no son eficaces contra los virus**. Es una pregunta clásica: no confundas antibiótico (bacterias) con antiviral (grupo reducido y específico de virus)."}]},{"id":"anatomia","titulo":"Sistema inmune: recuerdo anatómico y leucocitos","bloques":[{"tipo":"tabla","titulo":"Órganos y tejidos linfoides","columnas":["Tipo","Órganos","Función"],"filas":[["Primarios","Timo y médula ósea","División de células madre hasta linfocitos T y B maduros"],["Secundarios","Bazo, ganglios linfáticos, nódulos linfáticos (GALT y MALT)","Lugar donde se llevan a cabo las respuestas inmunitarias"]]},{"tipo":"definicion","termino":"Anillo linfático de Waldeyer","texto":"Conjunto de tejido linfoide con las **amígdalas palatinas y faríngeas** que actúa como **primera barrera defensiva** contra la entrada de antígenos por vía **digestiva y respiratoria**."},{"tipo":"figura","pagina":27,"pie":"Órganos linfoides (amígdalas, timo, médula ósea, bazo, placas de Peyer, ganglios) y anillo de Waldeyer. A la izquierda, la célula M de la placa de Peyer capta antígenos en la mucosa intestinal (GALT).","src":"img/patologia-quirurgica-i-t2-tema-2-infeccion-y-sistema-inmune-p27.jpg"},{"tipo":"tabla","titulo":"Tipos de leucocitos","columnas":["Leucocito","Localización","Función"],"filas":[["Neutrófilos","Sangre","Fagocíticos"],["Eosinófilos","Sangre","Procesos inflamatorios, alérgicos e infecciones parasitarias"],["Basófilos / Mastocitos","Sangre / tejidos","Procesos inflamatorios y alérgicos"],["Monocitos / Macrófagos","Sangre / tejidos","Fagocíticos"],["Linfocitos T","—","Respuesta inmunitaria celular: citotóxicos, colaboradores y supresores"],["Linfocitos B","—","Se convierten en células plasmáticas productoras de anticuerpos"],["Natural Killers","—","Destruyen células infectadas y cancerosas y regulan respuestas; no fagocíticas: destruyen la membrana"]]},{"tipo":"alerta","texto":"Pareja sangre/tejido: **basófilo → mastocito** y **monocito → macrófago**. Y ojo: las **NK no fagocitan**; destruyen la membrana celular del patógeno."},{"tipo":"tarjetas","items":[{"etiqueta":"LT","titulo":"T citotóxicos","texto":"Mediadores de la respuesta celular: atacan directamente a las células diana."},{"etiqueta":"LT","titulo":"T colaboradores (helper)","texto":"Coordinan y activan la respuesta inmunitaria (forman clones de células T helper y de memoria)."},{"etiqueta":"LT","titulo":"T supresores","texto":"Tercer subtipo de linfocito T citado en el temario."},{"etiqueta":"LB","titulo":"Linfocitos B","texto":"Evolucionan a **células plasmáticas** productoras de anticuerpos."}]},{"tipo":"perla","texto":"Los ganglios linfáticos son órganos linfoides **secundarios**: tras cirugía con vaciamiento ganglionar (p. ej., oncológica) disminuye la capacidad de respuesta inmunitaria local de ese territorio, lo que exige extremar la vigilancia de infecciones en la zona."}]},{"id":"innata","titulo":"Inmunidad innata","bloques":[{"tipo":"parrafo","texto":"La inmunidad innata es inespecífica y se organiza en dos líneas. La **primera línea** son la **piel y las mucosas**, barreras físicas y químicas. La **segunda línea** son las **defensas internas** (procesos y células), divididas en inmunidad innata **celular** (fagocitos y NK) y **humoral** (proteínas antimicrobianas, inflamación y fiebre)."},{"tipo":"esquema","titulo":"Organización de la inmunidad innata","mermaid":"flowchart TD\n  A[\"Inmunidad innata\"] --> B[\"1a linea: piel y mucosas\"]\n  A --> C[\"2a linea: defensas internas\"]\n  B --> B1[\"Barreras fisicas y quimicas\"]\n  C --> D[\"Celular\"]\n  C --> E[\"Humoral\"]\n  D --> D1[\"Fagocitos\"]\n  D --> D2[\"Celulas NK\"]\n  E --> E1[\"Proteinas antimicrobianas\"]\n  E --> E2[\"Inflamacion\"]\n  E --> E3[\"Fiebre\"]","pie":"Fíjate en que inflamación y fiebre se clasifican como inmunidad innata humoral."},{"tipo":"tabla","titulo":"Barreras de la primera línea","columnas":["Barrera","Ejemplos del temario"],"filas":[["Piel","Queratina, glándulas sebáceas, sudor"],["Mucosas y secreciones","Lágrimas, saliva, mucosa ciliada de las vías aéreas, secreciones vaginales, ácidos gástricos"],["Mecanismos de expulsión","Vómito, defecación"]]},{"tipo":"alerta","texto":"La **fiebre** y la **inflamación** pertenecen a la **inmunidad innata humoral** (segunda línea), no a la adaptativa; y los **fagocitos y NK** son la parte **celular** de la innata."},{"tipo":"perla","texto":"La piel íntegra es la primera barrera: en fisioterapia vigila la integridad cutánea (úlceras, heridas quirúrgicas, maceración) antes de técnicas manuales, porque una solución de continuidad abre la puerta a la infección."}]},{"id":"adaptativa","titulo":"Inmunidad adaptativa","bloques":[{"tipo":"definicion","termino":"Inmunidad adaptativa","texto":"Inmunidad **específica o adquirida** dirigida contra un invasor concreto: se crea una respuesta específica para cada antígeno y se **guarda memoria** de él. Puede ser **humoral** (anticuerpos producidos por linfocitos B) o **celular** (mediada por linfocitos T)."},{"tipo":"figura","pagina":34,"pie":"Esquema de la inmunidad adaptativa: las células pre-T maduran en el timo y las B en la médula ósea; en los órganos secundarios se forman clones de T citotóxicos, T helper y células plasmáticas productoras de anticuerpos, además de células de memoria.","src":"img/patologia-quirurgica-i-t2-tema-2-infeccion-y-sistema-inmune-p34.jpg"},{"tipo":"esquema","titulo":"Ramas de la inmunidad adaptativa","mermaid":"flowchart TD\n  A[\"Antigeno\"] --> B[\"Linfocitos B\"]\n  A --> C[\"Linfocitos T\"]\n  B --> B1[\"Celulas plasmaticas\"]\n  B1 --> B2[\"Anticuerpos: respuesta humoral\"]\n  B --> B3[\"Linfocitos B de memoria\"]\n  C --> C1[\"Citotoxicos, colaboradores, supresores\"]\n  C1 --> C2[\"Respuesta celular\"]\n  B3 --> M[\"Respuesta secundaria mas rapida e intensa\"]","pie":"La memoria explica por qué la varicela suele padecerse una sola vez."},{"tipo":"parrafo","texto":"La presencia de **linfocitos B de memoria** proporciona inmunidad específica durante muchos años, lo que explica que la **varicela** se padezca normalmente una sola vez. Por eso las respuestas **secundarias** son mucho más **rápidas e intensas** que la primera."},{"tipo":"tabla","titulo":"Tipos de inmunidad adaptativa","columnas":["Tipo","Natural","Artificial","Activa linfocitos B y T"],"filas":[["Activa","Infección, contagio con patógenos","Vacunas","Sí: genera anticuerpos y linfocitos de memoria"],["Pasiva","Paso de anticuerpos madre-hijo o por la leche materna","Suero","No"]]},{"tipo":"alerta","texto":"**Vacuna = activa artificial**; **suero = pasiva artificial**; anticuerpos maternos (placenta o leche) = **pasiva natural**. Solo la inmunidad **activa** genera memoria porque es la única que activa linfocitos B y T."},{"tipo":"perla","texto":"Un paciente que ha recibido anticuerpos (suero) está protegido de inmediato pero de forma transitoria; uno vacunado tarda en responder pero desarrolla memoria. Tenlo en cuenta al valorar el riesgo infeccioso en unidades hospitalarias."},{"tipo":"tabla","titulo":"Inmunidad humoral frente a celular (esquema de la p. 34)","columnas":["","Humoral","Celular"],"filas":[["Célula responsable","Linfocitos B → células plasmáticas","Linfocitos T (citotóxicos, helper)"],["Efector","Anticuerpos que se unen a antígenos en líquidos corporales y los neutralizan","Células T citotóxicas activas que abandonan el tejido linfático para atacar"],["Dirigida contra","Microorganismos patógenos extracelulares","Patógenos intracelulares, algunas células cancerosas y tejido trasplantado"],["Origen","Médula ósea roja","Células pre-T maduradas en el timo"]]},{"tipo":"dato","valor":"Primaria \u003c Secundaria","texto":"La respuesta adaptativa secundaria (segundo contacto con el antígeno) es mucho más rápida e intensa que la primaria gracias a los linfocitos de memoria."}]}],"caso_clinico":{"titulo":"Paciente oncológico con infección fúngica en planta de cirugía","presentacion":"Hombre de 58 años, en quimioterapia por un cáncer de colon, operado hace 5 días. Presenta una infección por hongos en los pies y fiebre. Un familiar pregunta si es \"contagioso\" y si se le puede dar un antibiótico \"por si acaso es un virus\".","preguntas":[{"pregunta":"¿Por qué una infección fúngica banal en otra persona es preocupante en este paciente?","respuesta":"Porque el temario indica que las infecciones por hongos no suelen ser peligrosas en personas sanas, pero en inmunodeprimidos (cáncer, SIDA) pueden ser graves; la quimioterapia debilita su sistema inmune."},{"pregunta":"¿Qué responderías sobre el antibiótico frente a un virus?","respuesta":"Que los antibióticos no son eficaces contra los virus; solo existen antivirales para un grupo reducido y específico de virus."},{"pregunta":"La fiebre del paciente, ¿a qué tipo de inmunidad pertenece?","respuesta":"A la inmunidad innata, segunda línea de defensa, en su vertiente humoral junto con la inflamación y las proteínas antimicrobianas."}]},"preguntate":[{"pregunta":"Define infección y explica por qué no equivale a enfermedad contagiosa.","respuesta":"Es la entrada, desarrollo y multiplicación de un agente infeccioso en un huésped; puede no causar enfermedad (portadores) ni transmitirse."},{"pregunta":"¿Qué demostró Pasteur en 1859?","respuesta":"Que la fermentación se debe al crecimiento de microorganismos y no a la generación espontánea."},{"pregunta":"Enuncia los cuatro postulados de Koch.","respuesta":"Presencia del microorganismo en todos los enfermos y no en sanos; aislamiento y cultivo puro; reproducción de la enfermedad al inocularlo en un sano; re-aislamiento idéntico del inoculado."},{"pregunta":"¿Por qué el segundo postulado falla con los virus?","respuesta":"Porque son parásitos obligados que necesitan células para hospedarse y con las técnicas del siglo XIX no podían cultivarse aislados."},{"pregunta":"¿Qué factores explican que un expuesto no desarrolle la enfermedad?","respuesta":"Buena salud física, sistema inmune sano, exposición previa con inmunidad o vacunación."},{"pregunta":"Diferencia bacteria, protozoo y virus.","respuesta":"La bacteria es procariota sin núcleo con pared de peptidoglicano; el protozoo es unicelular eucariota con núcleo; el virus no es una célula, solo ADN o ARN en cubierta proteica."},{"pregunta":"¿Cuáles son los órganos linfoides primarios y secundarios?","respuesta":"Primarios: timo y médula ósea. Secundarios: bazo, ganglios linfáticos y nódulos linfáticos (GALT y MALT)."},{"pregunta":"¿Qué diferencia a las NK de los macrófagos?","respuesta":"Los macrófagos son fagocíticos; las NK no fagocitan, destruyen la membrana de células infectadas o cancerosas y regulan respuestas."},{"pregunta":"¿Qué componentes forman la segunda línea de la inmunidad innata?","respuesta":"Celular: fagocitos y NK. Humoral: proteínas antimicrobianas, inflamación y fiebre."},{"pregunta":"Clasifica vacuna, suero y lactancia materna según el tipo de inmunidad.","respuesta":"Vacuna: activa artificial. Suero: pasiva artificial. Lactancia materna: pasiva natural."}],"glosario":[{"termino":"Huésped","definicion":"Persona o animal en cuyo cuerpo entra y se multiplica el agente infeccioso."},{"termino":"Portador asintomático","definicion":"Individuo que alberga el patógeno sin manifestar la enfermedad."},{"termino":"Cultivo puro","definicion":"Cultivo de un único microorganismo aislado en condiciones controladas."},{"termino":"Procariota","definicion":"Célula sin núcleo definido ni orgánulos membranosos internos, como la bacteria."},{"termino":"Peptidoglicano","definicion":"Componente de la pared celular bacteriana, también llamado mureína."},{"termino":"Parásito obligado","definicion":"Agente que solo puede reproducirse dentro de células de otro organismo, como los virus."},{"termino":"GALT / MALT","definicion":"Tejido linfoide asociado al intestino / a mucosas; órganos linfoides secundarios."},{"termino":"Anillo de Waldeyer","definicion":"Tejido linfoide con amígdalas palatinas y faríngeas, primera barrera de vías digestiva y respiratoria."},{"termino":"Célula plasmática","definicion":"Linfocito B diferenciado que produce anticuerpos."},{"termino":"Natural Killer","definicion":"Linfocito que destruye células infectadas y cancerosas sin fagocitarlas."},{"termino":"Memoria inmunológica","definicion":"Capacidad de responder de forma más rápida e intensa a un antígeno ya conocido gracias a los linfocitos de memoria."},{"termino":"Inmunidad pasiva","definicion":"Protección por anticuerpos recibidos (madre-hijo, suero) sin activar linfocitos B y T."}],"fuentes":["Pasteur, L. (1859): fermentación y teoría microbiana.","Koch, R.: postulados de Koch (modelo de Koch-Henle); revisión de Evans.","Universidad Europea. Patología quirúrgica I (PQRI 2026-2027) — Tema 2. Sistema inmune."],"qcm":[{"pregunta":"¿Qué postulado de Koch quedó rápidamente descartado por la existencia de portadores asintomáticos?","opciones":["El primero, sobre la presencia en todos los enfermos y no en sanos","El segundo, sobre el aislamiento en cultivo puro","El cuarto, sobre el re-aislamiento idéntico","El tercero, sobre la reproducción en un sano"],"correcta":0,"explicacion":"El primer postulado exige que el microorganismo no se encuentre en individuos sanos; los portadores asintomáticos lo tienen sin enfermar, lo que lo invalida.","por_opcion":["✅ Los portadores sanos contradicen que el microbio no esté en sanos.","❌ El segundo falla con los virus (parásitos obligados).","❌ El cuarto se refiere a la identidad del patógeno re-aislado.","❌ El tercero falla porque no todos los expuestos enferman, no por los portadores."]},{"pregunta":"¿Por qué el segundo postulado de Koch no podía aplicarse a los virus con las técnicas del siglo XIX?","opciones":["Porque no todos los inoculados desarrollan la enfermedad","Porque los virus mutan y el re-aislado no es idéntico","Porque los virus se encuentran también en individuos sanos","Porque son parásitos obligados que necesitan células para hospedarse"],"correcta":3,"explicacion":"El segundo postulado requiere cultivar el microbio aislado; los virus, parásitos obligados, necesitan células vivas, algo imposible en cultivos controlados de finales del siglo XIX.","por_opcion":["❌ Es la limitación del tercer postulado.","❌ Hace referencia al cuarto postulado, no al segundo.","❌ Es el argumento de los portadores contra el primer postulado.","✅ Necesitan células: no se podían cultivar aislados."]},{"pregunta":"Según el temario, ¿desde cuándo se consideran los postulados de Koch fundamentalmente obsoletos?","opciones":["Desde 1859, con los trabajos de Pasteur","Desde los años 50 del siglo XX","Desde el descubrimiento de los antibióticos en los años 20","Desde finales del siglo XIX, con el modelo de Koch-Henle"],"correcta":1,"explicacion":"El temario indica que se consideran obsoletos desde los años 50 del siglo pasado, aunque conservan gran importancia histórica; fueron revisados, por ejemplo, por Evans.","por_opcion":["❌ 1859 es la fecha de la demostración de Pasteur sobre la fermentación.","✅ Años 50 del siglo XX.","❌ El temario no vincula su obsolescencia a los antibióticos.","❌ Koch-Henle es el modelo original, no su superación."]},{"pregunta":"¿Qué característica corresponde a las bacterias según el temario?","opciones":["Núcleo definido y pared de quitina","Unicelulares eucariotas con orgánulos","Cubierta proteica que envuelve ADN o ARN","Ausencia de núcleo definido y pared de peptidoglicano"],"correcta":3,"explicacion":"Las bacterias son procariotas de 0,5–5 μm, sin núcleo definido ni orgánulos membranosos, y su pared se compone de peptidoglicano (mureína).","por_opcion":["❌ Las bacterias carecen de núcleo definido.","❌ Describe a los protozoos.","❌ Describe a los virus.","✅ Procariotas con pared de peptidoglicano."]},{"pregunta":"Un cultivo muestra cocos dispuestos en cadena. ¿Cómo se denominan?","opciones":["Tetracocos","Diplococos","Estafilococos","Estreptococos"],"correcta":3,"explicacion":"Entre los cocos, los estreptococos se agrupan en cadena, los estafilococos en racimo, los diplococos de dos en dos y los tetracocos de cuatro en cuatro.","por_opcion":["❌ Los tetracocos forman grupos de cuatro.","❌ Los diplococos forman grupos de dos.","❌ Los estafilococos se agrupan en racimo.","✅ Cadena = estreptococo."]},{"pregunta":"¿Qué rasgo diferencia a los protozoos de las bacterias si ambos son unicelulares?","opciones":["Los protozoos tienen pared de peptidoglicano","Los protozoos son parásitos obligados como los virus","Los protozoos tienen núcleo y otras estructuras celulares","Los protozoos son más pequeños y carecen de pared"],"correcta":2,"explicacion":"Los protozoos son mayores que las bacterias y contienen núcleo y otras estructuras celulares, lo que los acerca a las células animales y vegetales.","por_opcion":["❌ El peptidoglicano es propio de la pared bacteriana.","❌ Solo algunos son parásitos; no son parásitos obligados como los virus.","✅ Eucariotas con núcleo y orgánulos.","❌ Son de mayor tamaño que las bacterias."]},{"pregunta":"¿Cuál de las siguientes enfermedades se transmite típicamente por agua contaminada y la causa un protozoo?","opciones":["Viruela","Gripe","Pie de atleta","Giardiasis"],"correcta":3,"explicacion":"Los protozoos proliferan en ambientes húmedos; la amebiasis y la giardiasis se suelen transmitir por agua contaminada.","por_opcion":["❌ Enfermedad grave causada por un virus.","❌ Enfermedad vírica habitual.","❌ Infección por hongos.","✅ Giardiasis: protozoo, agua contaminada."]},{"pregunta":"¿Dónde se dividen las células madre para convertirse en linfocitos T y B maduros?","opciones":["En el timo y la médula ósea","En el anillo de Waldeyer","En el GALT y el MALT","En el bazo y los ganglios linfáticos"],"correcta":0,"explicacion":"Los órganos linfoides primarios (timo y médula ósea) son donde maduran los linfocitos; en los secundarios se llevan a cabo las respuestas inmunitarias.","por_opcion":["✅ Órganos linfoides primarios.","❌ Es una barrera defensiva de vías digestiva y respiratoria.","❌ Son nódulos linfáticos secundarios asociados a mucosas.","❌ Son órganos secundarios: lugar de las respuestas."]},{"pregunta":"¿Qué leucocito participa en procesos inflamatorios, alérgicos y en infecciones parasitarias?","opciones":["Linfocito B","Eosinófilo","Monocito","Neutrófilo"],"correcta":1,"explicacion":"El temario atribuye a los eosinófilos la participación en procesos inflamatorios, alérgicos y en infecciones parasitarias.","por_opcion":["❌ Los linfocitos B producen anticuerpos como células plasmáticas.","✅ Eosinófilo: inflamación, alergia y parásitos.","❌ Los monocitos son fagocíticos (macrófagos en tejidos).","❌ Los neutrófilos se describen como fagocíticos."]},{"pregunta":"Respecto a las células Natural Killer, es correcto afirmar que:","opciones":["Destruyen células infectadas destruyendo su membrana, sin fagocitarlas","Son fagocitos de los tejidos derivados de los monocitos","Pertenecen a la inmunidad adaptativa celular","Se transforman en células plasmáticas productoras de anticuerpos"],"correcta":0,"explicacion":"Las NK destruyen células infectadas y cancerosas y regulan respuestas; no son fagocíticas, sino que destruyen la membrana celular. Forman parte de la inmunidad innata celular.","por_opcion":["✅ No fagocíticas: destruyen la membrana.","❌ Describe a los macrófagos.","❌ Se clasifican en la inmunidad innata celular.","❌ Describe a los linfocitos B."]},{"pregunta":"La fiebre forma parte de:","opciones":["La inmunidad adaptativa humoral","La inmunidad innata celular","La inmunidad innata humoral","La primera línea de la inmunidad innata"],"correcta":2,"explicacion":"La segunda línea de la inmunidad innata incluye la parte celular (fagocitos, NK) y la humoral (proteínas antimicrobianas, inflamación y fiebre).","por_opcion":["❌ La adaptativa humoral está mediada por anticuerpos.","❌ La innata celular son fagocitos y NK.","✅ Fiebre: innata humoral, segunda línea.","❌ La primera línea son piel y mucosas."]},{"pregunta":"¿Cuál de los siguientes elementos es una barrera de la primera línea de defensa?","opciones":["Células NK","Proteínas antimicrobianas","Inflamación","Mucosa ciliada de las vías aéreas"],"correcta":3,"explicacion":"La primera línea son piel y mucosas: queratina, glándulas sebáceas, sudor, lágrimas, saliva, mucosa ciliada, ácidos gástricos, secreciones vaginales, vómito y defecación.","por_opcion":["❌ Segunda línea, innata celular.","❌ Segunda línea, innata humoral.","❌ Segunda línea, innata humoral.","✅ Barrera física de las mucosas."]},{"pregunta":"¿Por qué una persona suele padecer la varicela una sola vez?","opciones":["Porque el virus queda eliminado por la fiebre","Por la acción de las células NK sobre el virus","Por los linfocitos B de memoria, que dan inmunidad durante años","Por los anticuerpos recibidos por la leche materna"],"correcta":2,"explicacion":"Los linfocitos B de memoria proporcionan inmunidad específica durante muchos años; por eso las respuestas secundarias son más rápidas e intensas.","por_opcion":["❌ La fiebre es una defensa innata inespecífica.","❌ Las NK son innatas y carecen de memoria específica.","✅ Memoria inmunológica de los linfocitos B.","❌ La inmunidad pasiva materna es transitoria y no genera memoria."]},{"pregunta":"La administración de un suero con anticuerpos corresponde a una inmunidad:","opciones":["Pasiva artificial","Pasiva natural","Activa natural","Activa artificial"],"correcta":0,"explicacion":"La inmunidad pasiva no activa linfocitos B y T; es natural si los anticuerpos pasan de madre a hijo y artificial si se administran con un suero.","por_opcion":["✅ Suero = pasiva artificial.","❌ Pasiva natural = anticuerpos maternos (placenta o leche).","❌ Activa natural = infección o contagio.","❌ Activa artificial = vacunas."]},{"pregunta":"¿Qué diferencia fundamental tiene la inmunidad activa respecto a la pasiva?","opciones":["La activa solo se adquiere por vacunación","La activa implica activación de linfocitos B y T y genera memoria","La activa no requiere contacto con el antígeno","La activa se transmite por la leche materna"],"correcta":1,"explicacion":"La inmunidad activa (natural por infección o artificial por vacuna) activa linfocitos B y T para generar anticuerpos y linfocitos de memoria; la pasiva no los activa.","por_opcion":["❌ También se adquiere de forma natural por infección.","✅ Activación de B y T con memoria.","❌ La activa precisa el contacto con el antígeno (infección o vacuna).","❌ La leche materna transmite inmunidad pasiva natural."]}],"asignatura":"Patología quirúrgica I","tema":2,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>
(function(){

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
