<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 3. Heridas y Quemaduras · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 3. Heridas y Quemaduras","subtitulo":"Cicatrización, clasificación, valoración y tratamiento de las heridas, y grados, extensión, gravedad, complicaciones y manejo de las quemaduras.","resumen":["Una herida es una **solución de continuidad de la piel** y cicatriza en tres fases: **inflamatoria (2–3 días), proliferativa (desde el 2.º día) y de remodelación (hasta 2 años)**.","Para curar, la herida debe estar **libre de infección, bien vascularizada, con humedad correcta y sin tejido desvitalizado**; se considera crónica si tarda **más de 30 días**.","El cierre por **primera intención** se hace en las **primeras 24 h** con bordes regulares y sin contaminación; pasado ese plazo se cierra por **segunda intención** (procedimiento de Friedrich).","Las quemaduras se gradúan en **1.º (epidermis, 2–3 días), 2.º superficial (7–14 días, tracción de pelo negativa), 2.º profundo (>15 días, tracción positiva) y 3.º (hipodermis, anestesia, injertos)**.","La extensión se calcula con la **regla de los 9 de Wallace** (palma = 1 %) y son graves, entre otras, las de **3.º grado >10 %**, **2.º grado >30 %**, con lesión de vía aérea o en **\u003c5 o >55 años**."],"objetivos":["Al terminar, sabrás describir las fases de la cicatrización, las condiciones para curar y los factores que cronifican una herida.","Al terminar, sabrás clasificar las heridas por tiempo, agente, espesor, dirección, forma y tipo de cierre.","Al terminar, sabrás evaluar una herida, reconocer la infección y aplicar el protocolo de limpieza, desbridamiento, antisepsia y cura húmeda.","Al terminar, sabrás distinguir los grados de quemadura, calcular su extensión con la regla de los 9 y clasificar su gravedad.","Al terminar, sabrás explicar la fisiopatología local y sistémica de las quemaduras, sus complicaciones y su tratamiento."],"ideas_clave":["Cicatrización: **inflamatoria** (vasoconstricción ~20 min, trombo plaquetario, 2–3 días) → **proliferativa** (colágenos menores 8, 9, 10) → **remodelación** (colágenos 1 y 3, hasta 2 años).","\"Siempre habrá bacterias, pero eso no significa infección\": **colonización** sin respuesta del huésped, **colonización crítica 10⁵ organismos/g**, **infección** con respuesta del huésped.","Primera intención: **\u003c24 h**, la más frecuente y de mejor calidad; segunda intención: **>24 h**, peor cicatriz (Friedrich).","Cura húmeda con apósitos: mantiene la humedad, reduce dolor, infección y tiempo de cicatrización; antisépticos **2–3 veces/día hasta ~72 h**, sin mezclarlos.","Cicatriz **hipertrófica** (tracción excesiva, no sobrepasa) frente a **queloide** (más grande, prurito y ardor, predisposición genética).","Quemaduras: 2.º superficial **duele más** que 2.º profundo; si un 2.º profundo **no epiteliza en 15 días → cirugía**; 3.º grado = anestesia.","Complicaciones: **shock hipovolémico**, hipermetabolismo, **úlcera de Curling** (duodeno), inhalación (mortalidad **20 % → 70 %**), CO e hipoxia.","Fluidoterapia con **Ringer lactato** hasta diuresis **35–50 ml/h** en el adulto; enfriamiento **10–45 min**."],"secciones":[{"id":"cicatrizacion","titulo":"Herida, condiciones de curación y fisiología de la cicatrización","bloques":[{"tipo":"definicion","termino":"Herida","texto":"**Solución de continuidad en la piel** por falta de absorción de la fuerza traumática que la ha provocado. Según la lesión, afecta a capas superficiales o profundas, y el organismo activa mecanismos para recuperar la integridad y evitar la infección."},{"tipo":"lista","items":["**Libre de infección**.","**Vascularización** correcta.","**Humedad** correcta.","**Sin tejido desvitalizado**."]},{"tipo":"alerta","texto":"\"Siempre habrá presencia de bacterias, pero eso no significa infección\": la presencia de gérmenes (colonización) no equivale a infección; esta exige **respuesta del huésped**."},{"tipo":"tabla","titulo":"Fases de la cicatrización","columnas":["Fase","Acontecimientos","Tiempo"],"filas":[["1. Inflamatoria","Hemostasia e inflamación: **vasoconstricción ~20 min**; agregación plaquetaria (vasodilatación) y trombo plaquetario","2–3 días"],["2. Proliferativa","Depósito de **colágenos menores (8, 9, 10)** y fibroblastos; factores de crecimiento y citocinas atraen neutrófilos, linfocitos y macrófagos → **desbridamiento natural**","Empieza el 2.º día, al bajar la inflamación"],["3. Remodelación (madurativa)","Llegan **colágenos resistentes (1 y 3)** y fibroblastos que reparan y remodelan","Hasta **2 años** (p. ej. útero tras cesárea)"]]},{"tipo":"esquema","titulo":"Fases de la cicatrización","mermaid":"flowchart LR\n  A[\"Inflamatoria: vasoconstricción 20 min y trombo plaquetario\"] -->|\"desde el día 2\"| B[\"Proliferativa: colágenos 8, 9, 10, fibroblastos, macrófagos\"]\n  B -->|\"cede la inflamación\"| C[\"Remodelación: colágenos 1 y 3\"]\n  C --> D[\"Cicatriz madura hasta 2 años\"]\n  A -.->|\"inflamación persistente o insuficiente\"| X[\"Herida crónica\"]","pie":"Una herida se cronifica cuando la inflamación persiste, es demasiado baja para resolverse o algo bloquea una de las fases."},{"tipo":"parrafo","texto":"Las heridas se **cronifican** cuando la inflamación persiste o es baja y no resuelve, o cuando algo impide una fase. Por eso hay que **preservar la piel circundante**: desde ella proliferan las células de la cicatrización. La **nicotina** produce vasoconstricción y frena la vasodilatación necesaria (atención en cirugía)."},{"tipo":"tabla","titulo":"Factores de riesgo para la cicatrización","columnas":["Tipo","Factores"],"filas":[["Metabólicos","Infección, tabaquismo, envejecimiento, desnutrición, sedentarismo, enfermedades vasculares (edemas), **diabetes** (los neutrófilos no se mueven bien por la hiperglucemia), obesidad"],["Medicamentosos","Terapia inmunosupresora, **corticoides**"]]},{"tipo":"perla","texto":"En un paciente fumador, diabético o en tratamiento con corticoides, espera una cicatrización más lenta: adapta los plazos de carga y movilización sobre la cicatriz y vigila signos de infección."}]},{"id":"clasificacion-heridas","titulo":"Etiología y clasificación de las heridas","bloques":[{"tipo":"parrafo","texto":"**Etiología**: caídas; accidentes (deportivos, de tráfico, domésticos); enfermedades agudas y crónicas; arma de fuego o pirotecnia; mordeduras."},{"tipo":"dato","valor":"30 días","texto":"Límite entre herida **aguda (\u003c30 días)** y **crónica (>30 días)** según el tiempo de curación."},{"tipo":"tabla","titulo":"Clasificaciones de las heridas","columnas":["Criterio","Tipos"],"filas":[["Contacto con el exterior","**Abiertas** (contacto con el medio externo) / **cerradas** (hemorragias internas)"],["Complejidad","**Simples** (sin gran complicación) / **complicadas** (extensas y profundas, posible afectación de órganos y perforación de vísceras)"],["Espesor","**Epidérmicas** (arañazos, desprendimiento de epidermis), **erosión** (pérdida de sustancia), **profundas** (subcutáneo y planos profundos), **perforantes** (vísceras huecas, empalamiento, orificio anal o vaginal)"],["Dirección","Longitudinales, transversales, espiroideas, oblicuas"],["Forma","Simples, **angulares** (quirúrgicas), **estrelladas** (destornilladores), avulsiones o con colgajos (**scalp**: arrancamiento), pérdida de sustancia"],["Agente","**Incisas** (cortante, bordes limpios), **contusas** (romo, bordes irregulares y desflecados), **punzantes** (clavos, tornillos)"],["Otras","Punzocortantes, abrasivas, lacerantes, avulsivas, arma de fuego, amputaciones, aplastamientos"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Clavo","titulo":"Punzante","texto":"Dolorosa, **poca hemorragia**, peligrosa por la **profundidad**."},{"etiqueta":"Bisturí","titulo":"Incisa o cortante","texto":"**Bordes limpios** que facilitan la sutura."},{"etiqueta":"Caída de moto","titulo":"Abrasiva","texto":"Raspones por fricción; **se infectan con frecuencia**."},{"etiqueta":"Objeto romo","titulo":"Contusa","texto":"Suele no romper la piel pero puede generar lesiones profundas; bordes irregulares y desflecados."}]},{"tipo":"tabla","titulo":"Clasificación por cierre","columnas":["Cierre","Características"],"filas":[["1.ª intención","Sutura y reparación adecuada de los tejidos"],["2.ª intención","Heridas muy grandes que no cierran con sutura; tienden a infectarse y necesitan más cuidados"],["3.ª intención","Muy grandes, con colgajos, contracción de la piel…"]]}]},{"id":"tratamiento-heridas","titulo":"Cicatrización por intención, evaluación e infección","bloques":[{"tipo":"parrafo","texto":"El objetivo del tratamiento es **afrontar por planos los bordes** de la herida y mantenerlos en contacto y en reposo el tiempo suficiente para que el organismo cicatrice."},{"tipo":"tabla","titulo":"Primera frente a segunda intención","columnas":["","Primera intención","Segunda intención"],"filas":[["Momento","Inmediata, **en las primeras 24 h**","Cierre demorado **más de 24 h**"],["Frecuencia","La más frecuente","Menos frecuente"],["Requisitos","Herida **no contaminada** y bordes regulares que permitan afrontarlos","Se deja cerrar sin intervención o tras procedimiento de Friedrich"],["Resultado","Cicatriz de **mejor calidad** en el menor tiempo","Cicatriz de **peor calidad** y más lenta"]]},{"tipo":"definicion","termino":"Procedimiento de Friedrich","texto":"Eliminación del **tejido desvitalizado y necrótico de los bordes** para dejar solo tejido sano; **disminuye considerablemente el riesgo de infección**."},{"tipo":"lista","items":["Evaluación global: tipo de paciente, tipo de herida, diagnóstico preliminar, consideraciones inmediatas (¿desbridamiento?), tratamiento inicial, control del exudado y la infección, estimulación de los bordes.","Evaluación local: **morfología, topografía, exudado, bordes, lecho** (tras lavar), hipergranulación y humedad, escaras por necrosis."]},{"tipo":"tabla","titulo":"Color del lecho","columnas":["Color","Significado"],"filas":[["Rosado","Granulación correcta (angiogénesis)"],["Amarillo","Presencia de **fibrina**"],["Negro / escara","Necrosis"]]},{"tipo":"alerta","texto":"Signos de infección: **mal olor o pus**, mal aspecto, **ausencia de signos de cicatrización**, **dolor persistente** incluso con estímulos suaves, **fiebre** local o general con enrojecimiento. Los **cambios en el dolor** son información valiosa."},{"tipo":"tabla","titulo":"Grados de contaminación","columnas":["Estado","Definición"],"filas":[["Colonización","Multiplicación de gérmenes **sin respuesta del huésped**"],["Colonización crítica","**10⁵ organismos/gramo**: aumento considerable de gérmenes"],["Infección","Colonización **con respuesta del huésped**"]]},{"tipo":"dato","valor":"10⁵ org/g","texto":"Umbral de colonización crítica."}]},{"id":"protocolo-heridas","titulo":"Protocolo de tratamiento, apósitos y antisépticos","bloques":[{"tipo":"esquema","titulo":"Protocolo de tratamiento de una herida","mermaid":"flowchart TD\n  A[\"Anestesia local\"] --> B[\"Limpieza profusa y extracción de cuerpos extraños\"]\n  B --> C[\"Rasurado\"]\n  C --> D[\"Observación y control\"]\n  D --> E[\"Sutura\"]\n  E --> F[\"Curación: evitar infección, controlar glucemia, desbridar\"]\n  F --> G[\"Cubrimiento con apósitos y cura húmeda\"]\n  G --> H{\"Retraso en la cicatrización\"}\n  H -->|\"sí\"| I[\"Buscar siempre la causa\"]","pie":"Una buena evaluación determina el manejo; cada herida y cada paciente requieren un abordaje específico."},{"tipo":"dato","valor":"≤140 / ≤180 mg/dl","texto":"Control de glucemia en la curación: máximo **140 preprandial** y **180 postprandial** (vigilar ancianos y diabéticos)."},{"tipo":"parrafo","texto":"**Desbridamiento**: retirar el tejido contaminado mediante desbridamiento **quirúrgico, enzimático o biológico**, e irrigación con agua a **presión suave**."},{"tipo":"parrafo","texto":"**Cubrimiento**: es mejor tener las heridas cubiertas. Con gasas humedecidas en suero y cubiertas con gasas secas que se retiran a los 2–3 días, el inconveniente es que **al retirar las gasas secas se arrastra tejido de granulación**. La elección del apósito se estudia en cada caso."},{"tipo":"tarjetas","items":[{"etiqueta":"Apósito","titulo":"Mantiene la humedad","texto":"Sin humedad las células se deshidratan y necrosan y la cicatrización se retrasa."},{"etiqueta":"Apósito","titulo":"Menos dolor","texto":"La cura húmeda disminuye el dolor y evita la fricción."},{"etiqueta":"Apósito","titulo":"Barrera","texto":"Efecto barrera frente a microorganismos: menor riesgo de infección."},{"etiqueta":"Apósito","titulo":"Más rápida","texto":"Los apósitos avanzados disminuyen el tiempo de cicatrización."}]},{"tipo":"lista","items":["Limpiar idealmente con **suero fisiológico o agua y jabón**; **evitar agua fría** (retarda la cicatrización).","**No irrigar con agua a presión** para no lesionar el tejido de granulación.","Antisépticos: **2–3 veces al día** o en cada cambio de apósito, hasta **~72 h**, hasta que aparezca tejido de granulación.","**No mezclar antisépticos**."]},{"tipo":"tabla","titulo":"Principales antisépticos","columnas":["Antiséptico","Inicio / efecto residual","Materia orgánica","Seguridad y contraindicaciones"],"filas":[["Alcohol 70°","2 min / nulo","Inactivo","Inflamable, irritante; contraindicado en **heridas abiertas**"],["Clorhexidina","15–30 s / **6 h**","**Activo**","Amplio espectro (incluye esporas y hongos); >4 % puede dañar el tejido; no tóxico; sin contraindicaciones descritas"],["Povidona yodada","3 min / 3 h","Inactivo","**Retrasa el tejido de granulación**; irritación y absorción sistémica de yodo; contraindicada en embarazo, neonatos, lactantes y alteraciones tiroideas"],["Peróxido de hidrógeno 1,5–3 %","Inmediato / nulo","Inactivo","Irritante en mucosas; peligro en cavidades cerradas y riesgo de **embolia gaseosa**"],["Mercurocromo","Inmediato / varios días","Inactivo","No interfiere con la granulación; **incompatible con el yodo**; hipersensibilidad a merbromina"]]},{"tipo":"figura","pagina":38,"pie":"Tabla de antisépticos: compara inicio de acción, efecto residual y acción frente a materia orgánica; la clorhexidina es la única activa en presencia de materia orgánica y con efecto residual de 6 h.","src":"img/patologia-quirurgica-i-t3-tema-3-heridas-y-quemaduras-p38.jpg"},{"tipo":"figura","pagina":40,"pie":"Evolución de una herida con apósitos avanzados (día 1, día 28, quinto mes): observa cómo el lecho pasa de fibrina amarilla a granulación roja y se reduce la superficie.","src":"img/patologia-quirurgica-i-t3-tema-3-heridas-y-quemaduras-p40.jpg"}]},{"id":"cicatrices","titulo":"Tropismo de las cicatrices","bloques":[{"tipo":"tabla","titulo":"Tipos de cicatriz","columnas":["Tipo","Mecanismo","Características"],"filas":[["Normotrófica","Curación con contracción del tejido","Puede limitar la funcionalidad (restricción de movilidad)"],["Atrófica","Tejido conectivo nuevo **insuficiente** por desorganización de la cicatrización","**Por debajo** de la piel circundante; p. ej. secuelas de **acné**"],["Hipertrófica","**Hiperproducción** de tejido conectivo; herida sometida a **grandes fuerzas de tracción** (exceso de movilidad)","**Por encima** de la piel, elevada, gruesa, con **picor**"],["Queloide","Hiperproducción de tejido conectivo con **predisposición genética**","**Más grande** que la hipertrófica; prurito, **ardor intenso**, sensibilidad al contacto"]]},{"tipo":"alerta","texto":"Hipertrófica y queloide comparten la hiperproducción de tejido conectivo; el **queloide es más grande, más sintomático y con predisposición genética**, y la hipertrófica se relaciona con la **tracción excesiva** durante la cicatrización."},{"tipo":"perla","texto":"Control de la movilidad durante la cicatrización: el exceso de tracción favorece la cicatriz hipertrófica, mientras que la contracción de una normotrófica puede restringir la movilidad. El fisioterapeuta trabaja la cicatriz (p. ej. de cesárea) dosificando técnicas, tiempos y aparatos."}]},{"id":"quemaduras-grados","titulo":"Quemaduras: etiología y grados","bloques":[{"tipo":"definicion","termino":"Quemadura","texto":"Lesión por **transferencia excesiva de calor** a los tejidos, por contacto o a distancia. También se consideran quemaduras las lesiones por **electricidad, sustancias químicas, radiaciones ionizantes y frío extremo (congelación)**."},{"tipo":"tabla","titulo":"Cuadro resumen de los grados","columnas":["Grado","Profundidad","Sensibilidad","Color / signos","Curación"],"filas":[["1.º","Epidermis","Normal (molestia); dolor, prurito, escozor","Eritema rosado, **sin flictenas**, piel seca y caliente, sin exudado","**2–3 días** sin cicatriz"],["2.º superficial","Dermis superficial","**Hiperalgesia e hiperestesia** (muy dolorosas)","Rojo brillante, **flictenas**, muy exudativa, **tracción del pelo negativa**","**7–14 días**, discromías temporales"],["2.º profundo","Dermis profunda","**Disminuida** (menos dolorosa)","Rojo oscuro o blanquecino, brillante, exudativa, **tracción del pelo positiva**","**>15 días**, secuelas importantes"],["3.º","Hipodermis","**Anestesia**; dolor en tejidos adyacentes","Escara, momificación; blanco nacarado, marrón oscuro o negro",">15 días a meses; cirugía y autoinjertos"]]},{"tipo":"tarjetas","items":[{"etiqueta":"1.º","titulo":"Exposición solar","texto":"Ejemplo típico de quemadura de primer grado."},{"etiqueta":"2.º superficial","titulo":"Horno","texto":"Ejemplo del tema."},{"etiqueta":"2.º profundo","titulo":"Agua hirviendo","texto":"Ejemplo del tema."},{"etiqueta":"3.º","titulo":"Fuego","texto":"Ejemplo del tema."}]},{"tipo":"dato","valor":"15 días","texto":"Si una quemadura de 2.º grado profundo **no epiteliza en 15 días**, se deriva a cirugía (desbridamiento y autoinjertos)."},{"tipo":"alerta","texto":"Paradoja del dolor: la de **2.º superficial duele más** que la de 2.º profundo, y la de **3.º es anestésica** porque destruye las terminaciones nerviosas. Un dolor menor no indica menor gravedad. La **tracción del pelo positiva** indica 2.º profundo."}]},{"id":"quemaduras-fisiopatologia","titulo":"Fisiopatología y complicaciones de las quemaduras","bloques":[{"tipo":"tabla","titulo":"Fisiopatología local","columnas":["Mecanismo","Consecuencia"],"filas":[["Destrucción de la barrera cutánea","Pérdida de líquidos y electrolitos; predisposición a infecciones"],["Vasodilatación inicial","Eritema, edema, flictenas"],["Estimulación neurológica","Por calor, sustancias vasoactivas y edema: dolor intenso"]]},{"tipo":"esquema","titulo":"Fisiopatología sistémica: el shock de la quemadura","mermaid":"flowchart TD\n  Q[\"Quemadura\"] --> M[\"Mediadores inflamatorios: histamina, bradicinina, prostaglandinas\"]\n  Q --> MV[\"Cambios microvasculares: más permeabilidad y presión hidrostática\"]\n  MV --> E[\"Edema: aumento del líquido extracelular\"]\n  MV --> V[\"Descenso del volumen intravascular\"]\n  V --> H[\"Hemoconcentración\"]\n  V --> HD[\"Menor gasto cardíaco y más resistencia vascular\"]\n  HD --> SH[\"Shock hipovolémico\"]\n  M --> SC[\"Shock celular\"]\n  SH --> SQ[\"Shock de la quemadura\"]\n  SC --> SQ\n  SQ --> O[\"Objetivo: restaurar la perfusión tisular\"]","pie":"La fuga capilar vacía el compartimento intravascular: de ahí el shock hipovolémico y la necesidad de fluidoterapia."},{"tipo":"figura","pagina":62,"pie":"Esquema del tema de la fisiopatología sistémica: sigue las flechas desde los cambios microvasculares hasta el shock de la quemadura y el objetivo final de restaurar la perfusión.","src":"img/patologia-quirurgica-i-t3-tema-3-heridas-y-quemaduras-p62.jpg"},{"tipo":"tabla","titulo":"Fisiopatología sistémica","columnas":["Sistema","Alteración"],"filas":[["Vascular","**Shock hipovolémico** por deshidratación"],["Endocrino-metabólico","Desnutrición; respuesta adrenérgica suprarrenal"],["Inmunitario","Pérdida de la barrera dérmica, hipoproteinemia, inmunosupresión"]]},{"tipo":"tabla","titulo":"Complicaciones","columnas":["Tipo","Mecanismo y consecuencias"],"filas":[["Endocrinas","Catecolaminas elevadas de forma prolongada; alteración del eje hipotálamo-hipofisario; desbalance de hormonas adrenales, insulina, glucagón y tiroideas → desbalance hidroelectrolítico, **hipermetabolismo**, intolerancia a la glucosa"],["Digestivas","Vasoconstricción esplácnica → isquemia intestinal, destrucción de vellosidades, infecciones y disbiosis; **úlcera de Curling** (más frecuente en **duodeno**); hemorragia digestiva alta, íleo paralítico"],["Pulmonares","Inhalación de humo y gases: distrés, insuficiencia respiratoria aguda; **CO** (más afín a la hemoglobina que el O₂) → hipoxia; **CO₂** → hiperventilación y acidosis respiratoria"],["Cutáneas","Carcinomas"],["Infecciosas","Por pérdida de barrera e inmunosupresión"]]},{"tipo":"dato","valor":"20 % → 70 %","texto":"Aumento de la mortalidad cuando se asocia lesión por inhalación de gases y quemadura de vías respiratorias."},{"tipo":"perla","texto":"En un gran quemado con inhalación, la fisioterapia respiratoria es prioritaria: la afectación de la vía aérea es la complicación que más dispara la mortalidad."}]},{"id":"quemaduras-extension","titulo":"Extensión y gravedad de las quemaduras","bloques":[{"tipo":"parrafo","texto":"La **regla de los 9 de Wallace** determina la extensión y la gravedad: cabeza 9 %, cada miembro superior 9 %, cara anterior y posterior del tronco 18 % cada una, cada miembro inferior 18 % y periné 1 %. La **palma de la mano equivale al 1 %** de la superficie corporal."},{"tipo":"figura","pagina":67,"pie":"Regla de los 9 de Wallace: localiza los porcentajes por segmento (4,5 % por cara de cabeza y de miembro superior, 9 % por cara de cada miembro inferior y bloques del tronco, 1 % genitales).","src":"img/patologia-quirurgica-i-t3-tema-3-heridas-y-quemaduras-p67.jpg"},{"tipo":"dato","valor":"Palma = 1 %","texto":"Referencia rápida para estimar quemaduras pequeñas o dispersas."},{"tipo":"tabla","titulo":"Clasificación de la gravedad","columnas":["Gravedad","Criterios"],"filas":[["Grave","3.º grado en **manos, pies, cara, vía aérea superior y/o genitales**; 3.º grado **>10 %**; 2.º grado **>30 %**; quemadura + **lesión de vía aérea**; quemadura + **fracturas**; edad **\u003c5 o >55 años**"],["Moderada","3.º grado fuera de zonas especiales; 2.º grado **15–30 %**; 1.º grado **>50 %**"],["Leve","3.º grado fuera de zonas especiales y **\u003c2 %**; 2.º grado **\u003c15 %**; 1.º grado **\u003c50 %**"]]},{"tipo":"alerta","texto":"La gravedad no depende solo del porcentaje: una quemadura pequeña de 3.º grado en **mano o cara**, una lesión de **vía aérea**, una **fractura asociada** o la edad **\u003c5 o >55 años** la convierten en grave."}]},{"id":"quemaduras-tratamiento","titulo":"Tratamiento de las quemaduras","bloques":[{"tipo":"lista","items":["**Valoración inicial**: seguridad del escenario, número de pacientes, severidad, aislamiento, recursos adicionales.","**Secuencia**: apartar al paciente de la fuente → quitar la ropa que pueda quitarse → **cortar la ropa alrededor de la quemadura y dejarla allí**."]},{"tipo":"tabla","titulo":"Niveles de tratamiento","columnas":["Nivel","Medidas"],"filas":[["Local","Alejar del calor, valorar extensión, analgesia, asepsia, desbridamiento, cobertura con antimicrobiano local, protección y vendaje"],["Sistémico","Vía aérea (ventilación), **fluidoterapia**, nutrición, antibioterapia, asepsia, profilaxis de lesiones digestivas, endocrinas y respiratorias"],["Quirúrgico","Retirar la fuente de células muertas contaminantes que pueden generar compresión; enfriamiento 10–45 min; sin anestesia ni quirófano; después cubrir con antimicrobiano"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Antiséptico","titulo":"Furacín","texto":"Antiséptico y antimicrobiano: quemaduras de **2.º y 3.º grado**, infecciones, preparación de la piel para injertos."},{"etiqueta":"Antibiótico","titulo":"Flammazine","texto":"Antibacteriano: indicado en **infecciones bacterianas**."}]},{"tipo":"dato","valor":"35–50 ml/h","texto":"Diuresis objetivo en el adulto durante la reposición con **Ringer lactato** en la Unidad de Quemados."},{"tipo":"dato","valor":"10–45 min","texto":"Tiempo de enfriamiento con agua de la quemadura, hasta que cede el dolor."},{"tipo":"figura","pagina":81,"pie":"Enfriamiento de la quemadura bajo el agua del grifo hasta aliviar el dolor; el rótulo indica que suele durar 10–45 minutos.","src":"img/patologia-quirurgica-i-t3-tema-3-heridas-y-quemaduras-p81.jpg"},{"tipo":"alerta","texto":"No arranques la ropa pegada: se **corta alrededor** de la quemadura y se deja allí. Y recuerda que Furacín es **antiséptico** (2.º y 3.º grado, injertos) y Flammazine **antibiótico** (infección bacteriana)."}]}],"caso_clinico":{"titulo":"Quemadura doméstica en una mujer de 58 años","presentacion":"Mujer de 58 años, diabética y fumadora, se vuelca agua hirviendo sobre el antebrazo y la mano derechos (aprox. 4 palmas). Presenta flictenas, lecho rojo-blanquecino brillante y exudativo, y los pelos se arrancan con facilidad. Refiere menos dolor del esperado.","preguntas":[{"pregunta":"¿Qué grado de quemadura presenta y qué datos lo indican?","respuesta":"**2.º grado profundo**: lecho rojo o blanquecino brillante y exudativo, **tracción del pelo positiva** y sensibilidad **disminuida** (menos dolor que una superficial). El agente (agua hirviendo) coincide con el ejemplo del tema."},{"pregunta":"¿Cómo se clasifica su gravedad?","respuesta":"La extensión es ~4 % (palma = 1 %), lo que por porcentaje sería leve, pero la paciente tiene **más de 55 años**, criterio de **quemadura grave**. Además afecta a la mano (zona especial si progresara a 3.º grado)."},{"pregunta":"¿Qué factores pueden retrasar su cicatrización y qué plazo vigilarás?","respuesta":"La **diabetes** (los neutrófilos se mueven mal; control glucémico ≤140 preprandial y ≤180 postprandial) y el **tabaco** (vasoconstricción). Si no epiteliza en **15 días**, debe derivarse a cirugía para desbridamiento y autoinjerto."}]},"preguntate":[{"pregunta":"¿Cuáles son las cuatro condiciones para que una herida cure?","respuesta":"Libre de infección, vascularización correcta, humedad correcta y ausencia de tejido desvitalizado."},{"pregunta":"Describe las tres fases de la cicatrización con sus colágenos y tiempos.","respuesta":"Inflamatoria (vasoconstricción ~20 min, trombo, 2–3 días); proliferativa (desde el día 2, colágenos 8, 9, 10, fibroblastos, desbridamiento natural); remodelación (colágenos 1 y 3, hasta 2 años)."},{"pregunta":"¿Por qué la diabetes y el tabaco retrasan la cicatrización?","respuesta":"En la diabetes la hiperglucemia impide la correcta movilidad de los neutrófilos; la nicotina produce vasoconstricción que frena la vasodilatación necesaria para cicatrizar."},{"pregunta":"Diferencia colonización, colonización crítica e infección.","respuesta":"Colonización: multiplicación sin respuesta del huésped. Crítica: 10⁵ organismos/g. Infección: colonización con respuesta del huésped."},{"pregunta":"¿Qué diferencia la cicatrización por primera y por segunda intención?","respuesta":"Primera: en las primeras 24 h, herida limpia con bordes regulares, cicatriz mejor y más rápida. Segunda: cierre demorado >24 h, peor cicatriz y más lenta, a veces tras procedimiento de Friedrich."},{"pregunta":"¿Qué ventajas tiene la cura húmeda con apósitos?","respuesta":"Evita la deshidratación y necrosis celular, reduce el dolor y la fricción, actúa como barrera, disminuye el riesgo de infección y el tiempo de cicatrización."},{"pregunta":"¿Cómo distingues una cicatriz hipertrófica de un queloide?","respuesta":"Ambas por hiperproducción de tejido conectivo; el queloide es más grande, con prurito, ardor intenso y predisposición genética; la hipertrófica se asocia a tracción excesiva."},{"pregunta":"¿Qué signos separan una quemadura de 2.º grado superficial de una profunda?","respuesta":"Superficial: rojo brillante, flictenas, muy dolorosa, tracción del pelo negativa, cura en 7–14 días. Profunda: rojo oscuro o blanquecino, menos dolorosa, tracción positiva, más de 15 días."},{"pregunta":"Enumera los criterios de quemadura grave.","respuesta":"3.º grado en manos, pies, cara, vía aérea o genitales; 3.º >10 %; 2.º >30 %; lesión de vía aérea; fracturas asociadas; edad \u003c5 o >55 años."},{"pregunta":"¿Qué es la úlcera de Curling y por qué aparece?","respuesta":"Úlcera de estrés del gran quemado, más frecuente en el duodeno, por vasoconstricción esplácnica e isquemia intestinal con mayor sensibilidad al ácido gástrico."}],"glosario":[{"termino":"Solución de continuidad","definicion":"Interrupción de la integridad de un tejido, en este caso la piel."},{"termino":"Desbridamiento","definicion":"Retirada de tejido necrótico o contaminado: quirúrgico, enzimático o biológico."},{"termino":"Procedimiento de Friedrich","definicion":"Escisión del tejido desvitalizado de los bordes para dejar solo tejido sano."},{"termino":"Fibrina","definicion":"Material de color amarillo en el lecho de la herida."},{"termino":"Tejido de granulación","definicion":"Tejido rosado, fruto de la angiogénesis, signo de buena cicatrización."},{"termino":"Flictena","definicion":"Ampolla con líquido típica de la quemadura de 2.º grado."},{"termino":"Escara","definicion":"Tejido necrótico, momificado, típico de la quemadura de 3.º grado o de necrosis en heridas."},{"termino":"Signo de tracción del pelo","definicion":"Positivo (el pelo se arranca fácilmente) en la quemadura de 2.º grado profundo."},{"termino":"Queloide","definicion":"Cicatriz muy engrosada, mayor que la hipertrófica, con predisposición genética."},{"termino":"Regla de los 9 de Wallace","definicion":"Método para estimar la superficie corporal quemada en múltiplos de 9 %."},{"termino":"Úlcera de Curling","definicion":"Úlcera gastroduodenal de estrés en grandes quemados, sobre todo duodenal."},{"termino":"Ringer lactato","definicion":"Solución usada en la fluidoterapia del gran quemado hasta diuresis de 35–50 ml/h."}],"fuentes":["Universidad Europea de Valencia. Patología Quirúrgica I (PQRI 2026-2027). Tema 3: Heridas y Quemaduras."],"qcm":[{"pregunta":"¿Qué tipos de colágeno se depositan en la fase proliferativa de la cicatrización según el tema?","opciones":["Colágenos 2 y 4","Colágenos 8, 9 y 10","Colágenos 5 y 7","Colágenos 1 y 3"],"correcta":1,"explicacion":"En la fase proliferativa se depositan colágenos menores (8, 9, 10) y fibroblastos; los colágenos resistentes 1 y 3 llegan en la fase de remodelación.","por_opcion":["❌ No se citan en el tema.","✅ Son los colágenos menores de la fase proliferativa.","❌ No se citan en el tema.","❌ Los colágenos 1 y 3 son los resistentes de la fase de remodelación."]},{"pregunta":"¿Cuánto dura aproximadamente la vasoconstricción inicial de la fase inflamatoria?","opciones":["2–3 días","72 horas","20 minutos","5 minutos"],"correcta":2,"explicacion":"La hemostasia empieza con una vasoconstricción de unos 20 minutos, seguida de agregación plaquetaria con vasodilatación; la fase inflamatoria completa dura 2–3 días.","por_opcion":["❌ Es la duración de toda la fase inflamatoria.","❌ Es el tiempo aproximado de uso de antisépticos.","✅ Es la cifra del tema.","❌ Valor no indicado en el tema."]},{"pregunta":"Una herida presenta 10⁵ organismos por gramo sin signos de respuesta del huésped. ¿Cómo se clasifica?","opciones":["Contaminación superficial","Colonización simple","Infección local","Colonización crítica"],"correcta":3,"explicacion":"La colonización crítica se define por 10⁵ organismos/g; la infección requiere respuesta del huésped y la colonización simple es multiplicación sin respuesta y sin ese umbral.","por_opcion":["❌ No es una categoría del tema.","❌ La colonización simple no alcanza ese aumento considerable.","❌ La infección exige respuesta del huésped.","✅ 10⁵ org/g es el umbral de colonización crítica."]},{"pregunta":"Una herida contusa de 30 horas de evolución con bordes contaminados. ¿Qué tipo de cierre y técnica corresponden?","opciones":["Primera intención tras sutura inmediata","Tercera intención con injerto obligatorio","Primera intención diferida a 48 horas","Segunda intención tras procedimiento de Friedrich"],"correcta":3,"explicacion":"Pasadas 24 h el cierre es por segunda intención; el procedimiento de Friedrich elimina el tejido desvitalizado de los bordes y reduce el riesgo de infección.","por_opcion":["❌ La primera intención exige \u003c24 h y herida no contaminada.","❌ La tercera intención se reserva a heridas muy grandes con colgajos.","❌ La primera intención no se difiere más allá de 24 h.","✅ Más de 24 h y contaminación → segunda intención con Friedrich."]},{"pregunta":"¿Qué color del lecho de la herida indica presencia de fibrina?","opciones":["Rojo brillante","Negro","Amarillo","Rosado"],"correcta":2,"explicacion":"La granulación correcta es rosada (angiogénesis), el amarillo indica fibrina y las escaras negras indican necrosis.","por_opcion":["❌ Rojo brillante describe el lecho de una quemadura de 2.º superficial.","❌ Negro = escara por necrosis.","✅ Amarillo = fibrina.","❌ Rosado = granulación correcta."]},{"pregunta":"¿Cuál es el principal inconveniente de cubrir la herida con gasas secas sobre gasas con suero?","opciones":["Al retirarlas arrastran tejido de granulación","Impiden la aplicación de antisépticos","Aumentan la colonización crítica","Retrasan la fase inflamatoria"],"correcta":0,"explicacion":"El tema señala como desventaja que retirar las gasas secas puede arrastrar el tejido de granulación.","por_opcion":["✅ Es la desventaja literal del tema.","❌ Los antisépticos se aplican en cada cambio de apósito.","❌ No es la desventaja citada.","❌ No es la desventaja citada."]},{"pregunta":"¿Qué antiséptico es el único activo en presencia de materia orgánica y con efecto residual de 6 horas?","opciones":["Povidona yodada","Clorhexidina","Alcohol 70°","Peróxido de hidrógeno"],"correcta":1,"explicacion":"La clorhexidina actúa en 15–30 s, tiene efecto residual de 6 h y es activa frente a materia orgánica; las demás son inactivas.","por_opcion":["❌ Efecto residual de 3 h e inactiva frente a materia orgánica.","✅ Es la única activa frente a materia orgánica, con 6 h de efecto residual.","❌ Efecto residual nulo.","❌ Efecto residual nulo."]},{"pregunta":"¿Qué antiséptico está contraindicado en embarazadas, neonatos y personas con alteraciones tiroideas?","opciones":["Povidona yodada","Clorhexidina","Alcohol 70°","Mercurocromo"],"correcta":0,"explicacion":"La povidona yodada puede absorberse a nivel sistémico (yodo), por lo que está contraindicada en embarazo, neonatos, lactantes y alteraciones tiroideas.","por_opcion":["✅ Por la absorción sistémica de yodo.","❌ No tiene contraindicaciones descritas.","❌ Su contraindicación es la herida abierta.","❌ Su contraindicación es la hipersensibilidad a merbromina."]},{"pregunta":"¿Qué rasgo diferencia el queloide de la cicatriz hipertrófica según el tema?","opciones":["Se sitúa por debajo de la piel circundante","Se produce por exceso de tracción en la cicatrización","Se debe a una cantidad insuficiente de tejido conectivo","Es más grande y tiene predisposición genética"],"correcta":3,"explicacion":"Ambas se deben a hiperproducción de tejido conectivo, pero el queloide es más grande, con prurito y ardor intenso, y tiene predisposición genética.","por_opcion":["❌ Describe la cicatriz atrófica.","❌ La tracción excesiva se asocia a la hipertrófica.","❌ Describe la atrófica.","✅ Es lo que define al queloide."]},{"pregunta":"Quemadura con flictenas, lecho rojo intenso, muy exudativa, muy dolorosa y tracción del pelo negativa. ¿Pronóstico esperado?","opciones":["Curación en 7–14 días con discromías temporales","Curación en 2–3 días sin cicatriz","Requiere autoinjerto por su escasa curación espontánea","Curación a partir de 15 días con secuelas"],"correcta":0,"explicacion":"Son los signos de la quemadura de 2.º grado superficial, que cura en 7–14 días con ligeras discromías temporales.","por_opcion":["✅ Es el pronóstico del 2.º grado superficial.","❌ Corresponde al 1.º grado, sin flictenas.","❌ Corresponde al 3.º grado, anestésico.","❌ Corresponde al 2.º profundo, con tracción positiva."]},{"pregunta":"¿Qué conducta indica el tema ante una quemadura de 2.º grado profundo que no ha epitelizado a los 15 días?","opciones":["Derivar a cirugía para desbridamiento y autoinjerto","Cambiar de antiséptico a clorhexidina","Iniciar fluidoterapia con Ringer lactato","Mantener cura húmeda otras dos semanas"],"correcta":0,"explicacion":"Si una quemadura de 2.º grado profundo no epiteliza en 15 días, se deriva a cirugía para desbridamiento y autoinjertos.","por_opcion":["✅ Es la indicación del tema.","❌ No resuelve la falta de epitelización.","❌ La fluidoterapia es para quemados graves hospitalizados.","❌ Retrasaría el tratamiento indicado."]},{"pregunta":"Paciente de 40 años con quemadura de 2.º grado en el 20 % de la superficie, sin otras lesiones. ¿Gravedad?","opciones":["Moderada","Leve","Grave","Crítica"],"correcta":0,"explicacion":"Las quemaduras de 2.º grado entre el 15 y el 30 % son moderadas; serían graves por encima del 30 % y leves por debajo del 15 %.","por_opcion":["✅ 15–30 % de 2.º grado = moderada.","❌ Leve exige \u003c15 % en 2.º grado.","❌ Grave exige >30 % en 2.º grado o criterios adicionales.","❌ No es una categoría del tema."]},{"pregunta":"¿Cuál de las siguientes convierte una quemadura en grave independientemente de su extensión?","opciones":["Quemadura de 3.º grado del 1 % en el muslo","Fractura asociada","Quemadura de 1.º grado del 40 %","Paciente de 50 años"],"correcta":1,"explicacion":"Quemadura + fracturas es criterio de gravedad; la edad debe ser \u003c5 o >55 años, y un 3.º grado pequeño fuera de zonas especiales es leve.","por_opcion":["❌ 3.º grado \u003c2 % fuera de zonas especiales es leve.","✅ Quemadura + fractura es grave.","❌ 1.º grado \u003c50 % es leve.","❌ El criterio de edad es >55 años."]},{"pregunta":"¿Dónde aparece con más frecuencia la úlcera de Curling y cuál es su mecanismo?","opciones":["Colon, por íleo paralítico prolongado","Estómago, por exceso de flora bacteriana","Duodeno, por vasoconstricción esplácnica e isquemia","Esófago, por reflujo inducido por el decúbito"],"correcta":2,"explicacion":"Las alteraciones endocrinas producen vasoconstricción esplácnica e isquemia intestinal, con mayor sensibilidad al ácido gástrico y úlceras de Curling, más frecuentes en el duodeno.","por_opcion":["❌ El íleo paralítico es otra complicación distinta.","❌ El tema la sitúa más frecuentemente en el duodeno y por isquemia.","✅ Es la localización y el mecanismo del tema.","❌ No es el mecanismo descrito."]},{"pregunta":"En la fluidoterapia del gran quemado adulto, ¿qué objetivo de diuresis se busca con Ringer lactato?","opciones":["10–20 ml/h","60–80 ml/h","20–30 ml/h","35–50 ml/h"],"correcta":3,"explicacion":"Se administra Ringer lactato hasta conseguir una diuresis efectiva de 35–50 ml/h en el adulto.","por_opcion":["❌ Insuficiente según el tema.","❌ Superior al objetivo del tema.","❌ Insuficiente según el tema.","✅ Es la cifra del tema."]}],"asignatura":"Patología quirúrgica I","tema":3,"fecha":"2026-11-10"}</script>

<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',

  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
