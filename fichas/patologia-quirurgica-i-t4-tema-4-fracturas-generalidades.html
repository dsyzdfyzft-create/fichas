<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 4. Fracturas. Generalidades · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 4. Fracturas. Generalidades","subtitulo":"Tejido óseo, clasificación de las fracturas, consolidación primaria y secundaria, diagnóstico clínico y por imagen, y complicaciones locales, regionales y generales.","resumen":["El hueso es un tejido conjuntivo muy resistente (**206 huesos**) con un componente **orgánico del 35 %** (colágeno y células: osteoblasto, osteocito, osteoclasto) y uno **inorgánico del 65 %** (minerales y agua).","Las fracturas se clasifican por **etiología, mecanismo, relación con el exterior (Gustilo I–III), desplazamiento, estabilidad, localización y trazo** (incompletas como tallo verde o torus; completas como espiroidea o conminuta).","La **consolidación secundaria** (tratamiento conservador) forma **callo**: lesión-inflamación (1–2 sem), callo blando (4–6 sem), callo duro (completo a las **8–12 sem**) y remodelación (meses-años); la **primaria** (fijación rígida) no forma callo.","El diagnóstico se basa en **anamnesis, exploración física** (dolor a punta de dedo, crepitación, función vascular y neurológica distal) y **radiología** con la **regla del 2 de Apley**.","Las complicaciones son **locales** (infección, pseudoartrosis, osteonecrosis, SDRC…), **regionales** (síndrome compartimental con contractura de Volkmann, lesiones vasculares y nerviosas) y **generales** (shock traumático, **embolia grasa \u003c72 h**, tromboembolismo)."],"objetivos":["Al terminar, sabrás describir la composición, estructura, vascularización y remodelado del tejido óseo.","Al terminar, sabrás clasificar una fractura según los siete criterios del tema, incluida la clasificación de Gustilo.","Al terminar, sabrás explicar las fases y plazos de la consolidación secundaria y diferenciarla de la primaria.","Al terminar, sabrás realizar la valoración clínica de una fractura y aplicar la regla del 2 de Apley y las pruebas complementarias adecuadas.","Al terminar, sabrás reconocer y priorizar las complicaciones locales, regionales y generales de las fracturas."],"ideas_clave":["Hueso: **35 % orgánico / 65 % inorgánico**; esponjoso (trabéculas, compresión y cizallamiento, gran actividad metabólica) frente a cortical (osteonas, conducto de Havers, resistencia longitudinal).","Gustilo: **I herida \u003c1 cm limpia**, **II laceración >1 cm sin daño extenso**, **III brechas amplias con daño extenso** de partes blandas.","Consolidación **secundaria = callo** (tratamiento conservador); **primaria = sin callo** (osteosíntesis rígida), con unión directa menos resistente.","Callo blando **4–6 sem**, callo duro completo **8–12 sem**, remodelación **meses-años**; en la fractura desplazada la circulación pasa de **centrífuga a centrípeta**.","Regla del 2 de Apley: **2 proyecciones, 2 articulaciones, 2 ocasiones, 2 miembros**.","Gammagrafía para **fracturas por estrés**, metástasis e infección ósea; densitometría para **osteoporosis**; TAC para fracturas complejas.","Osteonecrosis típica en **cabeza femoral, cuerpo del astrágalo y polo proximal del escafoides**.","Mayor pérdida hemática: **fémur 1.300–2.000 cc** y **pelvis 1.000–2.500 cc**; embolia grasa **antes de 72 h** con petequias."],"secciones":[{"id":"tejido-oseo","titulo":"Tejido óseo: composición, estructura y metabolismo","bloques":[{"tipo":"definicion","termino":"Hueso","texto":"Tejido **conjuntivo de gran resistencia**; los huesos son unidades anatómicas, **206** en total, repartidos entre el eje axial y las extremidades."},{"tipo":"tabla","titulo":"Funciones del hueso","columnas":["Tipo","Funciones"],"filas":[["Mecánicas","Protección de órganos vitales, estabilidad, participación en el movimiento"],["Biológicas","Almacén de minerales, regulación del metabolismo de iones, **hematopoyesis** (ciertos huesos)"]]},{"tipo":"dato","valor":"35 % / 65 %","texto":"Componente **orgánico** (matriz de colágeno y proteínas + osteoblastos, osteocitos, osteoclastos) / componente **inorgánico** (minerales como Ca, P, Na, y agua)."},{"tipo":"parrafo","texto":"Estructura de un hueso largo: **epífisis, metáfisis, diáfisis**, periostio, hueso cortical, hueso trabecular y médula ósea (roja o amarilla). En el hueso en crecimiento la **fisis (cartílago de crecimiento)** separa epífisis y metáfisis; se vasculariza por **vasos epifisarios y metafisarios** y se organiza en área de crecimiento, de transformación y de osificación. El crecimiento es longitudinal en la fisis, en anchura en la metáfisis (**anillo de Ranvier**) y en anchura y remodelación en la diáfisis."},{"tipo":"figura","pagina":8,"pie":"Partes de un hueso en crecimiento: localiza epífisis, fisis (placa de crecimiento), metáfisis y diáfisis en el radio distal y en el fémur distal.","src":"img/patologia-quirurgica-i-t4-tema-4-fracturas-generalidades-p8.jpg"},{"tipo":"tabla","titulo":"Hueso esponjoso frente a cortical","columnas":["","Esponjoso (trabecular)","Compacto (cortical)"],"filas":[["Organización","Red 3D de trabéculas","Láminas concéntricas: **osteona o sistema haversiano**, con conducto de Havers central"],["Localización","Epífisis y metáfisis de huesos largos, huesos cortos","Diáfisis"],["Resistencia","Fuerzas de **compresión y cizallamiento**","Resistencia en el **eje longitudinal**"],["Otras","Médula ósea entre trabéculas, **gran actividad metabólica**","—"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Hasta la madurez","titulo":"Crecimiento / modelación","texto":"Proceso celular que incrementa masa y volumen del hueso."},{"etiqueta":"Toda la vida","titulo":"Remodelación","texto":"Formación-reabsorción continua **sin modificar la forma** del hueso."}]},{"tipo":"tabla","titulo":"Regulación del remodelado y vascularización","columnas":["Aspecto","Contenido"],"filas":[["Factor intracelular","Genética"],["Factores extracelulares sistémicos","Nutrición, vitamina D, PTH, estrógenos, testosterona, calcitonina"],["Factores extracelulares locales","Mecánica, pH"],["Irrigación","Arterias **nutricias, periostales y metafisarias**; retorno venoso; intercambio por capilares"]]}]},{"id":"clasificacion","titulo":"Clasificación de las fracturas","bloques":[{"tipo":"tabla","titulo":"1. Según la etiología","columnas":["Tipo","Características"],"filas":[["Generales o habituales","Traumatismo directo o indirecto con fuerza **superior a la que soporta un hueso sano**"],["Patológicas o por insuficiencia","Fuerza de **baja intensidad** sobre hueso patológicamente afectado"],["Por estrés","Hueso sano o patológico sometido a **fuerzas o movimientos repetitivos**"],["Infantiles","Propias del hueso en crecimiento"]]},{"tipo":"tabla","titulo":"2. Según el mecanismo de producción","columnas":["Mecanismo","Tipos"],"filas":[["Directo","Fractura de trazo simple; fractura compleja"],["Indirecto","**Flexión**; **compresión** (aplastamiento); **tracción o tensión** (arrancamiento); **rotación o torsión** (espiroidea); **cizallamiento**"]]},{"tipo":"figura","pagina":24,"pie":"Mecanismos indirectos: relaciona cada fuerza con su trazo típico (compresión → aplastamiento, tracción → arrancamiento, torsión → espiroideo).","src":"img/patologia-quirurgica-i-t4-tema-4-fracturas-generalidades-p24.jpg"},{"tipo":"tabla","titulo":"3. Clasificación de Gustilo (fractura abierta)","columnas":["Tipo","Herida"],"filas":[["I","Herida **\u003c1 cm, limpia**"],["II","Laceración **>1 cm**, sin daño extenso de tejidos blandos"],["III","**Brechas amplias** con daño extenso de tejidos blandos"]]},{"tipo":"dato","valor":"1 cm","texto":"Límite de la herida que separa Gustilo I (\u003c1 cm, limpia) de Gustilo II (>1 cm)."},{"tipo":"lista","items":["**4. Desplazamiento**: no desplazada o desplazada por angulación, desplazamiento lateral, acortamiento, alargamiento (distracción), acortamiento + angulación + rotación, desplazamiento lateral + rotación.","**5. Estabilidad**: estable o inestable.","**6. Localización** (huesos largos): diafisaria (tercio proximal, medio o distal), metafisaria y **epifisaria o intraarticular** (más grave, a menudo **conminuta**, con posible lesión de partes blandas y **hemartrosis**)."]},{"tipo":"tabla","titulo":"7. Según el trazo","columnas":["Tipo","Variantes"],"filas":[["Incompleta","Aplastamiento, fisura, **tallo verde**, **torus o rodete**"],["Completa","Transversa, con tercer fragmento (**alas de mariposa**), oblicua, espiroidea, conminuta, por arrancamiento, longitudinal"]]},{"tipo":"figura","pagina":30,"pie":"Trazos de fractura completa numerados del 1 al 7: transversa, con tercer fragmento, oblicua, espiroidea, conminuta, arrancamiento y longitudinal.","src":"img/patologia-quirurgica-i-t4-tema-4-fracturas-generalidades-p30.jpg"},{"tipo":"alerta","texto":"No confundas criterio con tipo: **espiroidea** es un trazo y se asocia al mecanismo indirecto de **torsión**; **arrancamiento** es un trazo y se asocia a **tracción**; **aplastamiento** se asocia a **compresión** y es una fractura incompleta."}]},{"id":"consolidacion","titulo":"Consolidación ósea","bloques":[{"tipo":"parrafo","texto":"La consolidación es el proceso biológico de reparación del hueso fracturado y depende del **tipo de hueso** (esponjoso o cortical) y del **grado de inmovilización**: el tratamiento conservador da **consolidación secundaria (con callo óseo)** y el quirúrgico con fijación rígida, **consolidación primaria (sin callo)**. Evolución típica: **lesión (inflamación) → reparación (callo) → remodelación** según las fuerzas."},{"tipo":"parrafo","texto":"**Hueso esponjoso**: necrosis de trabéculas, intensa reacción inflamatoria y tejido de granulación de la médula del hueso vivo que invade la del hueso muerto (trabéculas con **lagunas vacías**, sin osteocitos). Hay **aumento de la densidad radiográfica**; la consolidación es **rápida** y la remodelación **lenta** según las líneas de fuerza."},{"tipo":"esquema","titulo":"Consolidación secundaria del hueso cortical","mermaid":"flowchart TD\n  A[\"Lesión: necrosis de los extremos y hematoma\"] --> B[\"Inflamatoria 1-2 sem: granulación, macrófagos, osteoclastos y luego osteoblastos\"]\n  B --> C[\"Callo blando 4-6 sem: fibroso, cartílago y algo de hueso\"]\n  C --> D[\"Callo duro hasta 8-12 sem: osteoblastos mineralizan, hueso desorganizado\"]\n  D --> E[\"Remodelación meses-años: hueso laminar organizado\"]","pie":"Tras la fase inflamatoria la estructura se debilita (actúan primero los osteoclastos); el callo blando da una unión elástica y el duro devuelve las propiedades mecánicas."},{"tipo":"tabla","titulo":"Fases de la consolidación secundaria","columnas":["Fase","Acontecimientos","Tiempo"],"filas":[["Lesión-inflamatoria","Necrosis de extremos + hematoma; granulación y macrófagos; periostio abombado; **primero osteoclastos**, después osteoblastos; se debilita la estructura","1–2 semanas"],["Callo blando","Células indiferenciadas y vasos → granulación → tejido fibroso → cartilaginoso → osteoide; condroblastos y fibroblastos; **unión elástica**","4–6 semanas"],["Callo duro","Osteoblastos mineralizan el callo blando; hueso **desorganizado**; retorno de propiedades mecánicas","Desde 4–6 sem, **completo a 8–12 sem**"],["Remodelación","Osteoclastos reabsorben el exceso de callo; hueso desorganizado sustituido por **hueso bien organizado**","Meses-años"]]},{"tipo":"figura","pagina":41,"pie":"Remodelación del callo: en A el callo ya está calcificado y los osteoclastos empiezan a eliminar el exceso; en B se observa la sustitución por hueso laminar y la remodelación del canal medular.","src":"img/patologia-quirurgica-i-t4-tema-4-fracturas-generalidades-p41.jpg"},{"tipo":"tarjetas","items":[{"etiqueta":"Tratamiento conservador","titulo":"Consolidación secundaria","texto":"Con **callo óseo**; pasa por callo blando y duro."},{"etiqueta":"Fijación rígida","titulo":"Consolidación primaria","texto":"Hueso laminar directamente entre los fragmentos corticales, **sin callo**; unión **menos resistente (punto débil)**. Osteosíntesis con placas, enclavado endomedular acerrojado o fijación externa."}]},{"tipo":"alerta","texto":"Trampa: la consolidación **primaria** se asocia al tratamiento **quirúrgico** y **no** forma callo; la **secundaria** al **conservador** y **sí** forma callo. Que la primaria no tenga callo la hace un **punto débil**, no más resistente."},{"tipo":"parrafo","texto":"**Revascularización**: la circulación diafisaria normal es **centrífuga**; una fractura desplazada interrumpe el sistema medular y lesiona las partes blandas, por lo que el aporte se **invierte y predomina el centrípeto**; si la viabilidad es adecuada, el aporte periférico se asocia al sistema intramedular reconstruido."},{"tipo":"lista","items":["Factores que afectan a la consolidación: **edad y nutrición**, separación del foco, tipo de hueso, características del propio hueso, **lesión de partes blandas**, tipo de fractura, **fractura intraarticular**."]},{"tipo":"perla","texto":"Los plazos del callo guían la progresión de la carga y del ejercicio: durante el callo blando (4–6 sem) la unión aún es elástica; no se recupera la resistencia mecánica hasta el callo duro (8–12 sem)."}]},{"id":"diagnostico-clinico","titulo":"Diagnóstico clínico: anamnesis y exploración","bloques":[{"tipo":"parrafo","texto":"Un diagnóstico correcto exige **anamnesis, exploración física y exploración radiológica**. En la anamnesis se pregunta **cómo** (mecanismo directo o indirecto), **cuánto** (tiempo desde el traumatismo), **dónde** (localización) y las características del **dolor** (qué alivia o empeora)."},{"tipo":"tabla","titulo":"Exploración física","columnas":["Paso","Qué buscar"],"filas":[["Inspección","Alteraciones de posición, postura antiálgica, **impotencia funcional**, lesión de partes blandas, tumefacción, hematoma, equimosis"],["Palpación","Dolor selectivo **a punta de dedo**, **crepitación**, movilidad del foco (**con precaución**), movilidad activa y pasiva"],["Distal","Función **vascular** (pulsos, coloración, temperatura) y **neurológica** (parestesias, incapacidad de movimiento)"]]},{"tipo":"tabla","titulo":"Síntomas y signos de fractura","columnas":["Síntomas","Signos"],"filas":[["Dolor","Dolor provocado, equimosis"],["Incapacidad funcional","Deformidad, **movilidad anómala**, **crepitación**"]]},{"tipo":"perla","texto":"Antes y después de cualquier manipulación o inmovilización, explora siempre **pulsos, coloración, temperatura y sensibilidad distales**: es la forma de detectar a tiempo una complicación vascular, nerviosa o un síndrome compartimental."},{"tipo":"alerta","texto":"La movilidad del foco de fractura se explora **con precaución**: forzarla puede desplazar la fractura o lesionar vasos y nervios adyacentes."}]},{"id":"imagen","titulo":"Exploración radiológica y pruebas complementarias","bloques":[{"tipo":"parrafo","texto":"La radiografía sirve para el diagnóstico, para conocer características y localización, y para detectar lesiones asociadas; exige conocer la **anatomía radiológica** (densidades aire, grasa, agua, calcio) y el **desarrollo óseo u osificación** en el niño."},{"tipo":"tarjetas","items":[{"etiqueta":"2","titulo":"Proyecciones","texto":"Al menos dos proyecciones (p. ej. AP y lateral)."},{"etiqueta":"2","titulo":"Articulaciones","texto":"Incluir la articulación proximal y la distal."},{"etiqueta":"2","titulo":"Ocasiones","texto":"Repetir en dos momentos."},{"etiqueta":"2","titulo":"Miembros","texto":"Comparar con el contralateral (alargamiento, angulación)."}]},{"tipo":"tabla","titulo":"Otras pruebas complementarias","columnas":["Prueba","Fundamento","Uso principal"],"filas":[["TAC","Múltiples imágenes Rx combinadas en cortes","Fracturas **complejas o quirúrgicas**, canal medular"],["RMN","Campo electromagnético + ondas de radio + ordenador","Patología discal, hombro, rodilla, roturas musculares"],["Ecografía","Ultrasonidos, **sin radiación ionizante**","Manguito rotador, roturas fibrilares musculares y tendinosas"],["Gammagrafía","Rx + marcador **radiactivo** intravenoso","**Fracturas por estrés**, metástasis óseas, infección ósea"],["Artrografía","Rx articular + contraste yodado","Hombro, rodilla, cadera, tobillo, muñeca"],["Electromiografía","Actividad bioeléctrica muscular con electrodos de bajo voltaje","Estudio neurofisiológico"],["Densitometría","Escaneo de la densidad ósea","Pérdida de densidad (**osteoporosis**)"],["Rx funcional","Rx durante el movimiento","Segmento inestable o integridad articular"]]},{"tipo":"parrafo","texto":"En la radiografía se buscan alteraciones de **número, tamaño y forma, continuidad, alineación, localización y densidad**, sin confundir diferencias patológicas (tamaño, forma, densidad, partes blandas, continuidad, grosor, trabeculación, implante) con no patológicas (**edad, variaciones anatómicas**)."},{"tipo":"alerta","texto":"Ante sospecha de **fractura por estrés** con radiografía normal, la prueba que cita el tema es la **gammagrafía**, no la densitometría (que mide la densidad mineral)."}]},{"id":"complicaciones-locales","titulo":"Complicaciones locales","bloques":[{"tipo":"tabla","titulo":"Complicaciones locales","columnas":["Complicación","Claves"],"filas":[["Infección (osteomielitis)","Cerradas operadas **1–4 %**; abiertas **5–20 %**: extirpación, irrigación, antibioterapia, estabilización, cobertura cutánea"],["Consolidación viciosa","Defecto de reducción o alineación → consolida en deformidad (angular, rotación)"],["Refractura","Unión inadecuada o carga precoz; osteosíntesis con actividad intensa; retirada del implante y desmineralización"],["Fracaso del implante","Por **fatiga** cuando no consolida en el plazo habitual; prevenir con placas con tornillos suficientes y férulas"],["Cierre epifisario traumático","Lesión de un lado de la fisis → **angulación**; de toda la fisis → **acortamiento**"],["Rigidez articular","Inmovilización prolongada, mala alineación, fractura intraarticular (adherencias)"],["Artrosis secundaria","Degeneración del cartílago hialino tras fractura intraarticular o extraarticular con deformidad"],["Pseudoartrosis","Retraso o falta de callo: **hipertrófica** o **hipotrófica**; tratamiento quirúrgico"],["Osteonecrosis (necrosis avascular)","Interrupción del aporte sanguíneo: **cabeza femoral, cuerpo del astrágalo, polo proximal del escafoides**"]]},{"tipo":"dato","valor":"1–4 % / 5–20 %","texto":"Riesgo de infección en fracturas **cerradas tratadas quirúrgicamente** frente a fracturas **abiertas**."},{"tipo":"definicion","termino":"Síndrome de dolor regional complejo","texto":"También **algodistrofia simpático refleja** o **atrofia de Sudeck**. Activación anormal del sistema simpático. Inicio: **alodinia, hiperestesia, aumento de sudoración**, inflamación y enrojecimiento; Rx con **osteoporosis local en parches**. Después: rigidez, atrofia muscular severa, pérdida de función, **frialdad y palidez extrema**."},{"tipo":"perla","texto":"En el SDRC el tratamiento incluye **movilidad activa temprana** y control del dolor, junto con fármacos (antidepresivos, bloqueadores simpáticos): el fisioterapeuta es protagonista desde la fase inicial."},{"tipo":"alerta","texto":"En el cierre epifisario traumático: **lesión parcial de la fisis → angulación**; **lesión de toda la fisis → acortamiento**. Es fácil invertirlos."}]},{"id":"complicaciones-regionales","titulo":"Complicaciones regionales","bloques":[{"tipo":"definicion","termino":"Síndrome compartimental agudo","texto":"Síntomas y signos por **aumento de presión en un compartimento fascial** con **disminución de la perfusión**. Causas: acumulación de líquido, **compresión externa prolongada** (p. ej. yeso), **constricción por cierre quirúrgico**."},{"tipo":"esquema","titulo":"Del síndrome compartimental a la contractura de Volkmann","mermaid":"flowchart TD\n  A[\"Aumento del volumen o disminución del compartimento\"] --> B[\"Aumento de presión intracompartimental\"]\n  B --> C[\"Disminución de la presión capilar\"]\n  C --> D[\"Isquemia muscular\"]\n  C --> E[\"Isquemia nerviosa\"]\n  D --> F[\"Necrosis muscular, fibrosis y contractura\"]\n  E --> G[\"Necrosis nerviosa: parestesia y paresia\"]\n  G --> H[\"Anestesia y parálisis\"]\n  F --> V[\"Contractura isquémica de Volkmann\"]\n  H --> V","pie":"La secuencia sensitiva es parestesia → hiperestesia → anestesia; las secuelas musculares y nerviosas convergen en la contractura de Volkmann."},{"tipo":"figura","pagina":93,"pie":"Esquema del síndrome compartimental agudo: sigue las dos ramas (isquemia muscular e isquemia nerviosa) hasta el síndrome de Volkmann.","src":"img/patologia-quirurgica-i-t4-tema-4-fracturas-generalidades-p93.jpg"},{"tipo":"lista","items":["Manifestaciones: **presión, tumefacción, tensión** a la palpación, **dolor**, **parestesia → hiperestesia → anestesia**.","**Contractura isquémica de Volkmann**: secuelas morfológicas y funcionales por necrosis muscular y nerviosa; sin tratamiento adecuado → alteraciones neurológicas, cutáneas y musculares."]},{"tipo":"tabla","titulo":"Otras complicaciones regionales","columnas":["Complicación","Claves"],"filas":[["Vasculares","Compresión, sección o desgarro arterial; vaso próximo al hueso y poco móvil; clínica en **24–48 h**; zonas: **espacio subclavio, flexura del codo, hueco poplíteo, conducto de Hunter**"],["Nerviosas","Sección o desgarro, manipulación del foco, **atrapamiento por el callo**"],["Viscerales","Traumatismos abdominales o craneales, atropellos, politraumatizados; **graves y difíciles de diagnosticar**"],["Miositis osificante","Masa cálcica junto a la articulación, **más frecuente en el codo**, se resuelve espontáneamente; forma neurológica en paraplejia, hemiplejia, coma prolongado, polineuritis"],["Roturas tendinosas","Agudas o crónicas; **supraespinoso** y **extensor largo del pulgar**"]]},{"tipo":"perla","texto":"Dolor desproporcionado, tensión y parestesias bajo un yeso son una urgencia: hay que retirar la compresión y derivar, porque la isquemia evoluciona hacia la contractura de Volkmann."}]},{"id":"complicaciones-generales","titulo":"Complicaciones generales","bloques":[{"tipo":"definicion","termino":"Shock traumático","texto":"Alteración hemodinámica por hemorragia externa o interna: **disminuye la volemia y el rendimiento cardíaco** con hipoxia tisular. Clínica en **24–72 h**: respiración rápida y superficial, palidez, extremidades frías, **pulso rápido y débil**, hipotensión, taquicardia."},{"tipo":"tabla","titulo":"Pérdidas de sangre según la fractura","columnas":["Fractura","Pérdida estimada"],"filas":[["Pelvis","**1.000–2.500 cc**"],["Muslo (fémur)","**1.300–2.000 cc**"],["Columna","500–1.000 cc"],["Pierna (tibia-peroné)","100–1.000 cc"],["Brazo (húmero)","100–800 cc"],["Antebrazo (cúbito-radio)","50–400 cc"],["Costillas","120 cc por costilla"]]},{"tipo":"definicion","termino":"Embolia grasa","texto":"Glóbulos de grasa de la **médula ósea** en sangre → embolia pulmonar o cerebral. Clínica **antes de 72 h**: taquicardia, disnea, hipoxia, **confusión mental** y **petequias** (tórax, espalda, conjuntivas). Tratamiento preventivo: monitorizar la presión arterial de O₂, fluidoterapia, ventilación asistida, anticoagulantes."},{"tipo":"alerta","texto":"La tríada que orienta a **embolia grasa** frente a tromboembolismo pulmonar es la combinación de **hipoxia + confusión mental + petequias** en las primeras 72 h tras una fractura de hueso largo."},{"tipo":"tabla","titulo":"Tromboembolismo","columnas":["Aspecto","Contenido"],"filas":[["Mecanismo","Obstrucción por trombo (in situ o del sistema venoso)"],["TVP","Dolor, calor, color"],["TEP","Dolor torácico, disnea, **hemoptisis**"],["Prevención","**Elevar MMII, compresión, movilización precoz**, farmacología"]]},{"tipo":"dato","valor":"\u003c 72 h","texto":"Ventana de aparición de la embolia grasa; el shock traumático se manifiesta en 24–72 h."},{"tipo":"perla","texto":"La **movilización precoz** es una de las medidas de prevención del tromboembolismo en la que interviene directamente el fisioterapeuta, junto con la elevación y la compresión de los miembros inferiores."}]}],"caso_clinico":{"titulo":"Fractura diafisaria de tibia en un motorista","presentacion":"Varón de 24 años, accidente de moto. Presenta fractura diafisaria de tibia con una herida de 3 cm sin pérdida extensa de partes blandas. Se inmoviliza provisionalmente con férula. A las 36 h refiere dolor creciente que no cede con analgesia, tensión de la pantorrilla y hormigueo en el pie; además está taquicárdico, algo confuso y con petequias en el tórax.","preguntas":[{"pregunta":"¿Cómo se clasifica la fractura por su relación con el exterior?","respuesta":"Fractura **abierta tipo II de Gustilo**: laceración **>1 cm** sin daño extenso de partes blandas. Tiene un riesgo de infección del **5–20 %**, que exige limpieza, irrigación, antibioterapia, estabilización y cobertura cutánea."},{"pregunta":"¿Qué complicación regional sugieren el dolor, la tensión y las parestesias?","respuesta":"Un **síndrome compartimental agudo**: aumento de presión en un compartimento fascial con disminución de la perfusión. Las parestesias evolucionan a hiperestesia y anestesia; sin tratamiento puede llevar a la **contractura isquémica de Volkmann**."},{"pregunta":"¿Qué complicación general explica la taquicardia, la confusión y las petequias?","respuesta":"Una **embolia grasa**, que aparece **antes de 72 h** tras fracturas de huesos largos por glóbulos de grasa de la médula ósea; cursa con taquicardia, disnea, hipoxia, confusión y petequias. Su manejo incluye monitorizar la oxigenación, fluidoterapia, ventilación asistida y anticoagulantes."}]},"preguntate":[{"pregunta":"¿Qué proporción del hueso es orgánica e inorgánica y qué contiene cada parte?","respuesta":"35 % orgánica (colágeno, proteínas, osteoblastos, osteocitos, osteoclastos) y 65 % inorgánica (minerales como Ca, P, Na, y agua)."},{"pregunta":"Compara hueso esponjoso y cortical.","respuesta":"Esponjoso: trabéculas 3D en epífisis y metáfisis, resiste compresión y cizallamiento, gran actividad metabólica. Cortical: osteonas con conducto de Havers en la diáfisis, resiste en el eje longitudinal."},{"pregunta":"Define fractura patológica y fractura por estrés.","respuesta":"Patológica: fuerza de baja intensidad sobre hueso patológicamente afectado. Por estrés: fuerzas o movimientos repetitivos sobre hueso sano o patológico."},{"pregunta":"Describe la clasificación de Gustilo.","respuesta":"I: herida \u003c1 cm limpia. II: laceración >1 cm sin daño extenso de partes blandas. III: brechas amplias con daño extenso."},{"pregunta":"Enumera las fases de la consolidación secundaria con sus plazos.","respuesta":"Lesión-inflamatoria (1–2 sem), callo blando (4–6 sem), callo duro (completo a 8–12 sem) y remodelación (meses-años)."},{"pregunta":"¿En qué se diferencia la consolidación primaria de la secundaria?","respuesta":"La primaria ocurre con fijación rígida, forma hueso laminar directamente entre los fragmentos sin callo y deja un punto débil; la secundaria, con tratamiento conservador, forma callo."},{"pregunta":"¿Qué ocurre con la circulación diafisaria tras una fractura desplazada?","respuesta":"La circulación normal centrífuga se interrumpe y se invierte, predominando el aporte centrípeto, hasta que se reconstruye el sistema intramedular."},{"pregunta":"Enuncia la regla del 2 de Apley.","respuesta":"Dos proyecciones, dos articulaciones, dos ocasiones y dos miembros (comparar con el contralateral)."},{"pregunta":"¿Cuáles son las primeras manifestaciones del síndrome de dolor regional complejo?","respuesta":"Alodinia, hiperestesia, aumento de sudoración, inflamación y enrojecimiento, con osteoporosis en parches en la Rx, por activación anormal del simpático."},{"pregunta":"¿Qué fracturas producen más pérdida hemática y por qué importa?","respuesta":"Pelvis (1.000–2.500 cc) y fémur (1.300–2.000 cc); pueden provocar shock traumático por descenso de la volemia y del gasto cardíaco."}],"glosario":[{"termino":"Osteona","definicion":"Unidad del hueso cortical formada por láminas concéntricas alrededor del conducto de Havers."},{"termino":"Fisis","definicion":"Cartílago o placa de crecimiento situado entre epífisis y metáfisis."},{"termino":"Anillo de Ranvier","definicion":"Estructura responsable del crecimiento en anchura a nivel de la metáfisis."},{"termino":"Fractura en tallo verde","definicion":"Fractura incompleta típica del niño en la que una cortical se rompe y la otra se dobla."},{"termino":"Torus o rodete","definicion":"Fractura incompleta por compresión con abombamiento de la cortical."},{"termino":"Gustilo","definicion":"Clasificación de las fracturas abiertas en tipos I, II y III según la herida y el daño de partes blandas."},{"termino":"Callo óseo","definicion":"Tejido de reparación de la consolidación secundaria: blando (fibrocartilaginoso) y luego duro (mineralizado)."},{"termino":"Osteosíntesis","definicion":"Fijación quirúrgica de los fragmentos con placas, clavos endomedulares acerrojados o fijadores externos."},{"termino":"Pseudoartrosis","definicion":"Falta de consolidación, hipertrófica o hipotrófica, que requiere cirugía."},{"termino":"Osteonecrosis","definicion":"Muerte de células óseas por interrupción del aporte sanguíneo."},{"termino":"Contractura de Volkmann","definicion":"Secuelas de la necrosis muscular y nerviosa por síndrome compartimental."},{"termino":"Atrofia de Sudeck","definicion":"Sinónimo de algodistrofia simpático refleja o síndrome de dolor regional complejo."},{"termino":"Miositis osificante","definicion":"Masa cálcica en partes blandas periarticulares, más frecuente en el codo."}],"fuentes":["Universidad Europea de Valencia. Patología Quirúrgica I (PQRI 2026-2027). Tema 4: Fracturas. Generalidades."],"qcm":[{"pregunta":"¿Qué característica corresponde al hueso esponjoso y no al cortical?","opciones":["Localización principal en la diáfisis","Gran actividad metabólica con médula entre trabéculas","Resistencia predominante en el eje longitudinal","Organización en osteonas con conducto de Havers"],"correcta":1,"explicacion":"El hueso esponjoso forma una red 3D de trabéculas en epífisis y metáfisis, resiste compresión y cizallamiento, aloja médula entre las trabéculas y tiene gran actividad metabólica.","por_opcion":["❌ La diáfisis es cortical.","✅ Es rasgo del hueso esponjoso.","❌ La resistencia longitudinal es propia del cortical.","❌ Las osteonas son propias del hueso cortical."]},{"pregunta":"Una corredora con aumento brusco de kilometraje presenta dolor en el 2.º metatarsiano. ¿Cómo se clasifica la fractura por su etiología?","opciones":["Fractura habitual por mecanismo indirecto","Fractura por insuficiencia","Fractura por estrés","Fractura patológica"],"correcta":2,"explicacion":"Las fracturas por estrés se deben a fuerzas o movimientos repetitivos sobre hueso sano o patológico.","por_opcion":["❌ La habitual requiere una fuerza única superior a la que soporta el hueso.","❌ El tema la usa como sinónimo de patológica.","✅ Carga repetitiva = fractura por estrés.","❌ La patológica exige hueso patológicamente afectado con traumatismo de baja intensidad."]},{"pregunta":"¿Con qué trazo se asocia el mecanismo indirecto de tracción o tensión?","opciones":["Arrancamiento","Alas de mariposa","Aplastamiento","Espiroideo"],"correcta":0,"explicacion":"En los mecanismos indirectos, la tracción produce arrancamiento, la compresión aplastamiento y la torsión un trazo espiroideo.","por_opcion":["✅ Tracción = arrancamiento.","❌ El tercer fragmento en alas de mariposa es un trazo completo, no el típico de tracción.","❌ El aplastamiento corresponde a compresión.","❌ El espiroideo corresponde a rotación o torsión."]},{"pregunta":"Fractura abierta de tibia con una laceración de 2 cm sin daño extenso de partes blandas. ¿Tipo de Gustilo?","opciones":["Tipo I","No clasificable sin conocer el trazo","Tipo III","Tipo II"],"correcta":3,"explicacion":"Gustilo II: laceración mayor de 1 cm sin daño extenso de tejidos blandos; el tipo I es \u003c1 cm y limpia, y el III presenta brechas amplias con daño extenso.","por_opcion":["❌ Tipo I exige herida \u003c1 cm.","❌ Gustilo depende de la herida, no del trazo.","❌ Tipo III exige daño extenso de partes blandas.","✅ >1 cm sin daño extenso = tipo II."]},{"pregunta":"¿Cuál de las siguientes es una fractura incompleta según el trazo?","opciones":["Fractura con tercer fragmento","Fractura conminuta","Fractura por arrancamiento","Fractura en torus o rodete"],"correcta":3,"explicacion":"Son incompletas el aplastamiento, la fisura, el tallo verde y el torus o rodete; el resto de opciones son trazos completos.","por_opcion":["❌ Es completa.","❌ Es completa.","❌ Es completa.","✅ El torus es incompleta."]},{"pregunta":"¿Qué rasgo caracteriza a la consolidación primaria?","opciones":["Formación de hueso laminar entre los fragmentos sin callo","Asociación con el tratamiento conservador con yeso","Unión más resistente que la secundaria","Paso obligado por un callo fibrocartilaginoso"],"correcta":0,"explicacion":"La consolidación primaria requiere fijación rígida y forma hueso laminar directamente entre los fragmentos corticales, sin callo; es menos resistente (punto débil).","por_opcion":["✅ Es la definición del tema.","❌ El tratamiento conservador da consolidación secundaria.","❌ El tema indica que es menos resistente.","❌ El callo es propio de la consolidación secundaria."]},{"pregunta":"En la consolidación secundaria del hueso cortical, ¿cuándo se completa el callo duro?","opciones":["A las 1–2 semanas","A las 8–12 semanas","A las 4–6 semanas","Entre 6 y 12 meses"],"correcta":1,"explicacion":"El callo duro se inicia hacia las 4–6 semanas y se completa a las 8–12 semanas; la remodelación dura meses-años.","por_opcion":["❌ Es la fase inflamatoria.","✅ Es el plazo de callo duro completo.","❌ Es la fase de callo blando o el inicio del duro.","❌ Corresponde a la remodelación."]},{"pregunta":"En la fase inflamatoria de la consolidación cortical, ¿qué secuencia celular describe el tema?","opciones":["Osteocitos antes que fibroblastos, formando hueso laminar","Osteoblastos antes que osteoclastos, reforzando el foco","Osteoclastos antes que osteoblastos, debilitando la estructura","Condroblastos antes que macrófagos, formando callo blando"],"correcta":2,"explicacion":"Tras la lesión prolifera tejido de granulación con macrófagos; actúan primero los osteoclastos y después los osteoblastos, y la estructura ósea se debilita.","por_opcion":["❌ No es la secuencia descrita.","❌ El orden está invertido y la estructura se debilita.","✅ Es la secuencia del tema.","❌ Los condroblastos intervienen en el callo blando, posterior."]},{"pregunta":"Tras una fractura diafisaria desplazada, ¿qué ocurre con el aporte sanguíneo del hueso?","opciones":["Se invierte y predomina el aporte centrípeto","Pasa a depender solo de las arterias nutricias","Se anula hasta la fase de remodelación","Se mantiene centrífugo pero aumenta"],"correcta":0,"explicacion":"La circulación diafisaria normal es centrífuga; la fractura desplazada interrumpe el sistema medular y el aporte se invierte, predominando el centrípeto desde la periferia.","por_opcion":["✅ Es el mecanismo de revascularización del tema.","❌ El sistema medular (nutricio) queda interrumpido.","❌ El aporte periférico se mantiene y se asocia al intramedular reconstruido.","❌ El sentido se invierte."]},{"pregunta":"¿Qué elemento NO forma parte de la regla del 2 de Apley?","opciones":["Dos técnicas de imagen distintas","Dos proyecciones","Dos miembros","Dos articulaciones"],"correcta":0,"explicacion":"La regla del 2 de Apley exige dos proyecciones, dos articulaciones, dos ocasiones y dos miembros.","por_opcion":["✅ La regla no exige dos técnicas distintas, sino dos ocasiones.","❌ Forma parte de la regla.","❌ Forma parte de la regla.","❌ Forma parte de la regla."]},{"pregunta":"Ante sospecha de fractura por estrés con radiografía normal, ¿qué prueba de las citadas en el tema está indicada?","opciones":["Densitometría","Gammagrafía","Radiografía funcional","Artrografía"],"correcta":1,"explicacion":"La gammagrafía (marcador radiactivo intravenoso) se usa para fracturas por estrés, metástasis óseas e infección ósea.","por_opcion":["❌ Mide la densidad ósea (osteoporosis).","✅ Es la indicación del tema.","❌ Valora inestabilidad o integridad articular en movimiento.","❌ Estudia articulaciones con contraste yodado."]},{"pregunta":"Un niño sufre una lesión que afecta a toda la placa de crecimiento. ¿Qué secuela es más probable?","opciones":["Pseudoartrosis hipertrófica","Miositis osificante","Angulación del miembro","Acortamiento del miembro"],"correcta":3,"explicacion":"En el cierre epifisario traumático, la afectación de un solo lado de la fisis produce angulación y la de toda la fisis, acortamiento.","por_opcion":["❌ Es un retraso de consolidación, no una lesión fisaria.","❌ Es una complicación musculotendinosa regional.","❌ La angulación aparece si solo se afecta un lado.","✅ Toda la fisis afectada = acortamiento."]},{"pregunta":"¿Qué localización NO figura entre las más frecuentes de osteonecrosis en el tema?","opciones":["Cabeza femoral","Polo proximal del escafoides","Cabeza del radio","Cuerpo del astrágalo"],"correcta":2,"explicacion":"Las localizaciones más frecuentes de osteonecrosis citadas son la cabeza femoral, el cuerpo del astrágalo y el polo proximal del escafoides.","por_opcion":["❌ Sí figura.","❌ Sí figura.","✅ No aparece en el tema.","❌ Sí figura."]},{"pregunta":"¿Cuál de estas manifestaciones es propia de la fase inicial del síndrome de dolor regional complejo?","opciones":["Aumento de la sudoración y alodinia","Frialdad y palidez extrema","Atrofia muscular severa","Rigidez articular establecida"],"correcta":0,"explicacion":"Las primeras manifestaciones son alodinia, hiperestesia, aumento de sudoración, inflamación y enrojecimiento; la frialdad, palidez, atrofia y rigidez son posteriores.","por_opcion":["✅ Es propia de la fase inicial, por activación simpática.","❌ Es una manifestación posterior.","❌ Es una manifestación posterior.","❌ Es una manifestación posterior."]},{"pregunta":"Paciente con fractura de fémur que a las 48 h presenta taquicardia, disnea, confusión y petequias conjuntivales. ¿Diagnóstico más probable?","opciones":["Síndrome compartimental","Shock traumático hipovolémico","Trombosis venosa profunda","Embolia grasa"],"correcta":3,"explicacion":"La embolia grasa aparece antes de 72 h por glóbulos de grasa de la médula ósea y cursa con taquicardia, disnea, hipoxia, confusión mental y petequias.","por_opcion":["❌ Es local: dolor, tensión y parestesias en un compartimento.","❌ El shock no produce petequias; cursa con palidez, frialdad e hipotensión.","❌ La TVP cursa con dolor, calor y color en el miembro.","✅ Las petequias y la confusión orientan a embolia grasa."]}],"asignatura":"Patología quirúrgica I","tema":4,"fecha":"2026-11-10"}</script>

<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
