<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 5: Fracturas en adultos · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 5: Fracturas en adultos","subtitulo":"Definición y clínica de la fractura, clasificaciones (etiología, mecanismo, trazo, foco, Gustilo-Anderson, estabilidad), diagnóstico por imagen, fases de la reparación ósea y sus complicaciones, y principios del tratamiento ortopédico y quirúrgico.","resumen":["Una **fractura** es la pérdida de continuidad de un hueso **sumada a la lesión de partes blandas y neurovasculares**; el **foco de fractura** es el conjunto de ambas.","Se clasifican por **etiología** (traumáticas vs patológicas: sobre enfermedad de base, por **insuficiencia** u osteoporosis y por **estrés**, la más típica en el **2.º metatarsiano**), por **mecanismo** (compresión, flexión con **ala de mariposa**, cizallamiento, **torsión → espiroidea**, tracción → transversa), por **trazo**, por **foco** (abierta/cerrada, **Gustilo-Anderson I-IIIC**) y por **estabilidad** (oblicuas **\u003c 45º estables, > 45º inestables**).","La **radiografía simple** es imprescindible (**mínimo 2 proyecciones** e incluir las articulaciones adyacentes); el **TC** sirve para fracturas articulares y complejas y la **RMN** para fracturas de **estrés**, **ocultas** (edema óseo), patológicas y lesiones de partes blandas.","El hueso repara **ad integrum sin cicatriz** en 5 fases (**impacto/hematoma, inflamatoria, callo blando, callo óseo y remodelación**, esta de meses a años); la consolidación exige **contacto (≤ 5 mm)**, **estabilidad elástica**, **masa celular** y **vascularización**.","El tratamiento sigue las **3 R** (**Reducción, Retención, Recuperación funcional**): la rotación es lo más difícil y lo último que se corrige; se retiene con vendajes, férulas/yesos, tracciones u **osteosíntesis** (Kirschner y obenques, placas de compresión o bloqueadas, **clavo de Küntscher** de elección en diáfisis de húmero, fémur y tibia, fijación externa e Ilizarov, artroplastias)."],"objetivos":["Definir fractura y foco de fractura y reconocer su clínica, incluida la obligación de explorar el estado neurovascular distal.","Clasificar una fractura según etiología, mecanismo, patrón de trazo, foco (Gustilo-Anderson), estabilidad y localización.","Elegir la técnica de imagen adecuada (Rx, TC, RMN) según el tipo de fractura sospechada.","Describir las fases de la reparación ósea, los factores que la favorecen o dificultan y sus complicaciones (rigidez, pseudoartrosis, Sudeck).","Explicar las 3 R del tratamiento y las indicaciones de cada método de inmovilización y osteosíntesis."],"ideas_clave":["Fractura = hueso + partes blandas + estructuras neurovasculares: siempre se explora pulso y nervios distales y se **documenta** antes de cualquier maniobra (para dejar claro que una lesión no es iatrogénica).","Fractura de estrés: hueso **sano**, sin traumatismo previo, dolor progresivo con el ejercicio que cede en reposo, Rx a menudo **normal** → TC/RMN; localización más frecuente: **2.º metatarsiano**.","El hueso resiste más la **compresión** que la **tracción**: en flexión rompe primero por la convexidad y puede aislar un tercer fragmento en **ala de mariposa** en la concavidad.","Gustilo-Anderson: I \u003c 1 cm limpia; II 1-10 cm moderada; IIIA > 10 cm con cobertura ósea posible; IIIB pérdida de cobertura (cirugía plástica); IIIC con **lesión vascular que requiere reparación** (59 % de amputaciones).","Estabilidad: trazos transversales u oblicuos **\u003c 45º estables**; oblicuos **> 45º inestables**.","Reparación en 5 fases; la **rigidez** es la complicación más frecuente y la **pseudoartrosis** es la ausencia absoluta de consolidación con falsa articulación (más frecuente en diáfisis).","3 R: Reducción (acortamiento → traslación → angulación → **rotación al final**), Retención, Recuperación funcional.","El clavo endomedular (Küntscher) es de elección en diáfisis de **húmero, fémur y tibia**; las placas bloqueadas, en fracturas **epifisarias u osteoporóticas**."],"secciones":[{"id":"introduccion","titulo":"Concepto, clínica y biomecánica de la fractura","bloques":[{"tipo":"definicion","termino":"Fractura","texto":"Solución de continuidad **total o parcial** de un hueso: pérdida de la continuidad de su estructura normal **sumada a la alteración del tejido blando y de los tejidos neurovasculares** circundantes."},{"tipo":"definicion","termino":"Foco de fractura","texto":"Conjunto formado por la **lesión ósea** y las **partes blandas vecinas** lesionadas."},{"tipo":"tabla","titulo":"Clínica de las fracturas","columnas":["Elemento","Qué se encuentra"],"filas":[["Antecedente","Traumatismo; lesión local por el impacto (hematoma)"],["Dolor","Constante en el foco"],["Impotencia funcional","Parcial o total (cojera, bipedestación imposible)"],["Deformidad","Acortamiento, angulación, ensanchamiento, rotación…"],["Signos de fractura completa desplazada","Movilidad anormal y **crepitación** del foco"],["Partes blandas","Fractura cerrada o abierta"],["Exploración neurovascular distal","Obligatoria; luxaciones/fracturas de mayor riesgo: **hombro, codo y rodilla**"]]},{"tipo":"perla","texto":"En toda fractura desplazada (sobre todo hombro, codo o rodilla) se palpa el **pulso distal** y se comprueba la función de los nervios distales **antes** de manipular, y se deja por escrito: así queda claro que una lesión posterior **no es iatrogénica**. El fisioterapeuta repite esta comprobación tras cada inmovilización."},{"tipo":"alerta","texto":"La fractura **abierta** no es solo «una herida más»: dificulta la **consolidación** y favorece la **infección**, porque se pierde periostio y masa celular y el foco queda contaminado."},{"tipo":"tabla","titulo":"Factores de los que depende la fractura y complicaciones graves","columnas":["Factores del hueso","Complicaciones generales graves"],"filas":[["Capacidad de deformación","Tromboembolismo"],["Resistencia","Shock hipovolémico"],["Elasticidad","Embolia grasa"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Stress","titulo":"Esfuerzo","texto":"Relación entre la **fuerza aplicada y el área** de aplicación; tiende a deformar el hueso."},{"etiqueta":"Strain","titulo":"Deformidad","texto":"Relación entre la **longitud final y la inicial** tras aplicar la carga."},{"etiqueta":"Elasticidad","titulo":"Módulo elástico","texto":"Distinta para cada hueso; depende de la **densidad** (cortical ≠ esponjoso). La **osteoporosis la disminuye**."}]},{"tipo":"parrafo","texto":"En el hueso cortical las **osteonas** se disponen en varias direcciones, lo que lo hace **más resistente a la compresión** y **menos a la tracción y al cizallamiento**. Esta asimetría explica por qué, en los mecanismos de flexión, el hueso empieza a romperse siempre por el lado sometido a tracción (convexidad)."}]},{"id":"etiologia","titulo":"Clasificación etiológica: traumáticas y patológicas","bloques":[{"tipo":"parrafo","texto":"Las fracturas se clasifican según **etiología, mecanismo de producción, patrón de interrupción, foco, afectación de partes blandas, estabilidad y localización**. Etiológicamente se distinguen las **traumáticas o habituales** y las **patológicas**, que a su vez pueden ser sobre enfermedad de base, por insuficiencia o por estrés."},{"tipo":"tabla","titulo":"Tipos etiológicos de fractura","columnas":["Tipo","Hueso","Traumatismo","Ejemplos / claves"],"filas":[["Traumática o habitual","De cualquier calidad","Único traumatismo, suficiente","Las **más frecuentes**; pronóstico ligado al traumatismo"],["Patológica sobre enfermedad de base","Enfermo","Mínimo o ninguno","Fractura sobre **Paget**"],["Por insuficiencia","Insuficiente o débil","Mínimo","Generales: **osteoporosis**; locales: **tumores**"],["Por fatiga o estrés","**Sano**","Ausente: solicitaciones mecánicas repetidas","Fractura del **recluta**; 2.º metatarsiano"]]},{"tipo":"definicion","termino":"Osteoporosis (OMS)","texto":"Estado patológico del esqueleto con **resistencia ósea deficiente** y riesgo de fractura elevado; esqueleto osteoporótico cuando la masa ósea está **por debajo de −2,5 desviaciones estándar** del pico de masa ósea del adulto joven. Trabéculas más finas y hueso de peor calidad, que también dificulta la cirugía."},{"tipo":"dato","valor":"40 % · 16 / 32 / 15 / > 50 %","texto":"El **40 %** de las mujeres posmenopáusicas tiene osteoporosis. Por encima de 50 años: **16 %** de riesgo de fractura de cadera, **32 %** vertebral, **15 %** de muñeca y **> 50 %** de sufrir al menos una fractura osteoporótica."},{"tipo":"dato","valor":"60-80 % · +20 %","texto":"El **60-80 %** de la masa ósea está determinado genéticamente; la **actividad física la aumenta un 20 %**. En la mujer el crecimiento acaba ~2 años tras la menarquia (≈ 15 años); en el varón sigue hasta los 18-20 años."},{"tipo":"tabla","titulo":"Fractura por fatiga o estrés","columnas":["Aspecto","Características"],"filas":[["Grupos de riesgo","Jóvenes de **20-30 años** (deportistas, bailarines, reclutas) y adultos de **40-60 años** con esfuerzos ocasionales (viaje, montañismo)"],["Sexo y localización","Más en **mujeres** y en **miembros inferiores**"],["Clínica","Sin traumatismo previo; **dolor progresivo** que aumenta con el ejercicio causante y **cede con el reposo**; dolor «a punta de dedo»"],["Imagen","Rx a menudo **normal** → TC y/o **RMN**"],["Localizaciones","**2.º metatarsiano (la más frecuente)**, cuello femoral, tibia, diáfisis femoral en tercio proximal"]]},{"tipo":"alerta","texto":"No confundas **fractura por insuficiencia** (hueso **débil**, p. ej. osteoporótico, que rompe con carga normal) con **fractura por estrés** (hueso **sano** sometido a cargas repetidas excesivas). Ambas se agrupan como «patológicas» en el temario, pero el hueso de base es opuesto."},{"tipo":"perla","texto":"Corredor o bailarina con dolor metatarsal a punta de dedo, sin caída, que empeora al correr y mejora en reposo, y con Rx normal: sospecha **fractura de estrés del 2.º metatarsiano** y deriva para RMN antes de seguir cargando."}]},{"id":"mecanismo-trazo","titulo":"Mecanismo de producción y patrón de trazo","bloques":[{"tipo":"parrafo","texto":"El mecanismo puede ser **directo** (la fractura se produce en el mismo sitio del impacto) o **indirecto** (a distancia). Los mecanismos indirectos son la **compresión, flexión, cizallamiento, torsión y tracción**, y cada uno deja un trazo característico."},{"tipo":"figura","pagina":23,"pie":"Modo de carga y tipo de trazo: tracción → transversa; compresión → oblicua; flexión (bending) → ala de mariposa; torsión → espiroidea.","src":"img/patologia-quirurgica-i-t5-tema-5-fracturas-en-adultos-p23.jpg"},{"tipo":"tabla","titulo":"Mecanismo indirecto → trazo","columnas":["Mecanismo","Trazo resultante","Claves"],"filas":[["Compresión","Oblicuo; aplastamiento","Más en hueso **esponjoso**/epifisario y huesos cortos; adulto: **vertebral**; niño: fractura en **rodete** (ceden trabéculas y se ensancha el diámetro)"],["Flexión (bending)","~3 fragmentos con **cuña o ala de mariposa**","**El más habitual**; mecanismo fundamental de los huesos largos"],["Cizallamiento","Oblicuo","Fuerzas **paralelas y convergentes**, efecto **guillotina**"],["Torsión","**Espiroideo**","Pie fijo en el suelo y giro brusco del cuerpo; muy frecuente en **tibia**"],["Tracción o extensión","**Transversal**","Poco frecuente; **arrancamientos/avulsiones** por contracción muscular en deportistas"]]},{"tipo":"parrafo","texto":"En la **flexión** la fuerza actúa perpendicular al eje diafisario: la **concavidad** se comprime y la **convexidad** se tracciona. Como el hueso resiste peor la tracción, se rompe primero en el punto de convexidad máxima y el trazo avanza hacia la concavidad; al sobrepasar la **línea neutra** puede seguir único o dividirse aislando un fragmento triangular, el **tercer fragmento o ala de mariposa**. En el **cizallamiento**, la gravedad depende de la energía: si se agota en la fractura, trazo simple con desplazamiento limitado por el periostio; si es mayor, rotura completa del periostio, desplazamiento y desgarro de músculo y piel (fractura abierta)."},{"tipo":"esquema","titulo":"Del mecanismo al trazo","mermaid":"flowchart LR\n  M[\"Mecanismo indirecto\"] --> C[\"Compresion\"]\n  M --> F[\"Flexion\"]\n  M --> Z[\"Cizallamiento\"]\n  M --> T[\"Torsion\"]\n  M --> R[\"Traccion\"]\n  C --> C1[\"Oblicuo o aplastamiento vertebral\"]\n  F --> F1[\"Ala de mariposa\"]\n  Z --> Z1[\"Oblicuo efecto guillotina\"]\n  T --> T1[\"Espiroideo tibia\"]\n  R --> R1[\"Transversal por avulsion\"]","pie":"Cada fuerza deja una firma en el trazo: sabiendo el trazo deduces el mecanismo y viceversa."},{"tipo":"tabla","titulo":"Patrón de interrupción","columnas":["Grupo","Tipos"],"filas":[["Incompletas","**Fisuras**, **tallo verde** (típica de niños), **caña de bambú**"],["Completas","Simples no desplazadas, desplazadas, **conminutas**"],["Otros trazos completos","Arrancamiento, vertical, por compresión"]]},{"tipo":"figura","pagina":49,"pie":"Desplazamientos de los fragmentos entre sí y cómo se miden: angulación (grados), desplazamiento lateral (%), acortamiento (cm) y rotación (grados).","src":"img/patologia-quirurgica-i-t5-tema-5-fracturas-en-adultos-p49.jpg"},{"tipo":"alerta","texto":"Tracción pura → trazo **transversal**, no oblicuo. Es la compresión de un hueso largo la que da trazo **oblicuo**, y la torsión la que da trazo **espiroideo**."}]},{"id":"foco-estabilidad","titulo":"Foco, partes blandas (Gustilo-Anderson), estabilidad y localización","bloques":[{"tipo":"parrafo","texto":"Según la relación del foco con el exterior, las fracturas son **cerradas** o **abiertas** (incluidas las fracturas por arma de fuego). La gravedad de la lesión de partes blandas en las abiertas se gradúa con la clasificación de **Gustilo y Anderson**."},{"tipo":"tabla","titulo":"Clasificación de Gustilo y Anderson (fracturas abiertas)","columnas":["Tipo","Herida","Contaminación","Partes blandas","Daño óseo"],"filas":[["I","\u003c 1 cm","Limpia","Mínimo","Simple, conminución mínima"],["II","1-10 cm","Moderada","Moderado, algún daño muscular","Conminución moderada"],["IIIA","> 10 cm","Severa","Aplastamiento severo pero las partes blandas **permiten la cobertura ósea**","Usualmente conminutas"],["IIIB","> 10 cm","Severa","Pérdida extensa que **no permite la cobertura**; precisa **cirugía plástica reconstructiva**","Moderada a severa"],["IIIC","> 10 cm","Severa","Lo de IIIB + **lesión vascular que necesita reparación**","Moderada a severa"]]},{"tipo":"figura","pagina":46,"pie":"Ilustración de los tipos de Gustilo-Anderson en la pierna: fíjate en el tamaño de la herida, la exposición ósea con denudación de periostio (IIIB) y la lesión arterial (IIIC).","src":"img/patologia-quirurgica-i-t5-tema-5-fracturas-en-adultos-p46.jpg"},{"tipo":"dato","valor":"59 %","texto":"Porcentaje de **amputaciones** en las lesiones **IIIC**: «mejor una amputación temprana que una tardía»."},{"tipo":"perla","texto":"La reconstrucción arterial de un IIIC solo tiene sentido si las partes blandas son recuperables y los **nervios** (tibial posterior, ciático) están intactos, porque se regeneran mal. Se valora explorando la **sensibilidad de la planta del pie**."},{"tipo":"tabla","titulo":"Estabilidad tras la reducción","columnas":["Tipo","Comportamiento","Trazo"],"filas":[["Estable","Tras la reducción **no tiende a desplazarse**","Transversal u oblicuo **\u003c 45º**"],["Inestable","Tras la reducción **tiende a desplazarse**","Oblicuo **> 45º**"]]},{"tipo":"parrafo","texto":"Por localización se distinguen fracturas **diafisarias, metafisarias y epifisarias**. El temario propone un **check-list** para describir cualquier fractura: ¿hay fractura?, ¿abierta o cerrada?, ¿transversa, oblicua…?, ¿angulada, acortada, rotada?, ¿epifisaria, diafisaria…?, ¿completa o incompleta?, ¿traumática o patológica?, ¿mecanismo directo o indirecto?"},{"tipo":"tabla","titulo":"Diagnóstico de la fractura","columnas":["Paso","Contenido"],"filas":[["Historia","Caída, golpe, accidente; síntomas más notorios cuanto más **inestable** (crujidos, deformidad, crepitación)"],["Manifestaciones","Dolor, deformidad, tumefacción, impotencia funcional"],["Exploración física","Inspección, palpación, lesiones vasculares o nerviosas, lesiones a distancia"],["Imagen","Rx, TC, RMN"]]}]},{"id":"radiologia","titulo":"Diagnóstico por imagen","bloques":[{"tipo":"tabla","titulo":"Técnica de imagen e indicaciones","columnas":["Técnica","Características","Indicaciones"],"filas":[["Radiografía simple","**Imprescindible**, confirma el diagnóstico y establece las características","**Mínimo 2 proyecciones**; **incluir las articulaciones adyacentes**"],["TC","Como una Rx de alta resolución (**64 cortes**); **reconstrucción 3D**","Fracturas **articulares y complejas**; patológicas"],["RMN","Ve edema y partes blandas","Fracturas por **estrés**, **ocultas (edema óseo)**, con lesión de partes blandas (p. ej. osteocondral rotuliana), **patológicas** (tumores, metástasis)"]]},{"tipo":"dato","valor":"2 proyecciones","texto":"Mínimo de proyecciones radiográficas para estudiar una fractura, incluyendo las articulaciones vecinas."},{"tipo":"alerta","texto":"Una Rx normal **no descarta** una fractura de estrés ni una fractura oculta: la prueba de elección para verlas es la **RMN** (edema óseo), no el TC."}]},{"id":"reparacion","titulo":"Fisiopatología: fases de la reparación ósea","bloques":[{"tipo":"definicion","termino":"Reparación ad integrum","texto":"El hueso consolida **sin formación de cicatriz**, regenerando tejido óseo idéntico al original."},{"tipo":"esquema","titulo":"Fases de la reparación ósea","mermaid":"flowchart TD\n  A[\"1 Impacto inicial: hematoma y necrosis\"] --> B[\"2 Inflamatoria: limpieza del foco\"]\n  B --> C[\"3 Callo blando: periostio, endostio, tejidos vecinos\"]\n  C --> D[\"4 Callo oseo: mineralizacion, hueso fibrilar\"]\n  D --> E[\"5 Remodelacion: hueso laminar y Havers\"]\n  A -.->|\"factores\"| F[\"Quimiotacticos, mitogenicos, inductores\"]\n  E -.->|\"duracion\"| G[\"Meses a anos\"]","pie":"Cinco fases encadenadas; el hematoma libera los factores que ponen en marcha la migración, proliferación y diferenciación celular."},{"tipo":"tabla","titulo":"Fases de la reparación","columnas":["Fase","Qué ocurre"],"filas":[["Impacto inicial","**Hematoma fractuario**, hemorragia y necrosis in situ; factores **quimiotácticos** (migración), **mitogénicos** (proliferación) e **inductores** (diferenciación)"],["Inflamatoria","Finalidad: **limpiar el foco**; ↑ permeabilidad capilar (fagocitos) y proliferación vascular que invade el foco"],["Callo blando","Proliferación de periostio (capa interna o **cambium** y externa), endostio y tejidos vecinos; aparecen condroblastos, osteoblastos y osteoclastos; hacia los **10 días** collarín celular alrededor de cada fragmento"],["Callo óseo","Mineralización del callo blando: tejido **osteoide** (osificación directa, hidroxiapatita) o **cartilaginoso** (osificación osteocondral) → **tejido óseo fibrilar**"],["Remodelación","Hueso fibrilar → **laminar trabecular** (epífiso-metáfisis) y **sistemas de Havers** (cortical); reorganización interna; **meses a años**"]]},{"tipo":"figura","pagina":79,"pie":"Fase inflamatoria y de callo blando: hematoma, periostio, endostio y osteoblastos; después cartílago, osteoide y hematoma organizado.","src":"img/patologia-quirurgica-i-t5-tema-5-fracturas-en-adultos-p79.jpg"},{"tipo":"tarjetas","items":[{"etiqueta":"Externo","titulo":"Callo perióstico","texto":"Las células del **cambium** proliferan, forman un **collarete** en ambos extremos y se unen; parte externa más fibrosa, interna formadora de callo."},{"etiqueta":"Interno","titulo":"Callo endóstico o medular","texto":"Células del **endostio y la médula** (amalgama pluripotencial) con **diferenciación osteoblástica**."}]},{"tipo":"parrafo","texto":"Algunas fracturas desgarran **arterias terminales** y producen un **infarto óseo** extenso: el ejemplo mayor es la **necrosis de la cabeza femoral** tras una fractura **subcapital**, pero también ocurre en cabeza humeral, **escafoides** y **astrágalo**. El hueso necrótico se elimina por osteoclasia y se sustituye progresivamente por hueso vivo."},{"tipo":"dato","valor":"~10 días","texto":"Momento en que se ha formado un collarín de tejido muy celular alrededor de cada fragmento; la zona central queda libre de callo hasta que se completan los puentes fibrosos."}]},{"id":"consolidacion-complicaciones","titulo":"Factores de consolidación y complicaciones","bloques":[{"tipo":"tabla","titulo":"Condiciones favorables a la consolidación","columnas":["Condición","Por qué"],"filas":[["Contacto óseo","Fragmentos separados **no más de 5 mm**; si es mayor, no consolida"],["Estabilidad","Ni rigidez absoluta ni hipermovilidad: **estabilidad y elasticidad** para que el estímulo mecánico favorezca el callo"],["Masa celular regeneradora","Periostio y partes blandas como fuente de células; en abiertas con pérdida muscular falta"],["Vascularización","Fragmentos suficientemente irrigados; zonas de riesgo (p. ej. **odontoides**)"]]},{"tipo":"tabla","titulo":"Factores desfavorables","columnas":["Grupo","Ejemplos"],"filas":[["Mecánicos","Movilidad del foco, separación de fragmentos, interposición de partes blandas"],["Biológicos","Vascularización precaria, infección, denervación, edad avanzada"],["Hábitos tóxicos","Tabaco, alcohol, drogas, malnutrición"],["Fármacos","**AINE (indometacina)**, corticoides, antibióticos, quimioterapia/citostáticos"],["Enfermedades y otros","Tumores, **diabetes**, metabólicas óseas, déficit de GH, **irradiación**"]]},{"tipo":"figura","pagina":96,"pie":"Resumen de factores que promueven (hormonas como GH, insulina, calcitonina; vitaminas A y D; factores de crecimiento; carga controlada, campos electromagnéticos, ultrasonidos de baja frecuencia; oxígeno hiperbárico) y que dificultan la consolidación.","src":"img/patologia-quirurgica-i-t5-tema-5-fracturas-en-adultos-p96.jpg"},{"tipo":"perla","texto":"El **ejercicio y la carga controlados**, los campos electromagnéticos y los **ultrasonidos de baja frecuencia** figuran entre los factores físicos que **promueven** la consolidación: el fisioterapeuta aporta estímulo mecánico dosificado, nunca hipermovilidad del foco."},{"tipo":"tabla","titulo":"Complicaciones de las fracturas","columnas":["Tempranas","Tardías"],"filas":[["Lesiones vasculares","Articulares: **rigidez**, artrosis"],["Lesiones nerviosas","Óseas: retraso de consolidación, **pseudoartrosis**, **Sudeck**, dismetrías, consolidación viciosa, osteomielitis, refracturas"],["Lesión de órganos vitales","Musculares: atrofias, **miositis osificante**, roturas tendinosas"],["Shock traumático; embolia grasa","Lesiones neurológicas tardías"]]},{"tipo":"tabla","titulo":"Rigidez: la complicación más frecuente","columnas":["Fase","Causa","Tratamiento"],"filas":[["Reductible","Limitación por causa **activa**","**Fisioterapia y ejercicio**"],["Irreductible relativa","Retracciones fibrosas, adherencias de partes blandas","Conservador; pueden quedar secuelas"],["Irreductible (anquilosis)","No se mueve en todo su recorrido","**Artrolisis** o **movilización bajo anestesia**"]]},{"tipo":"definicion","termino":"Pseudoartrosis","texto":"**Ausencia absoluta de consolidación** con una **falsa articulación** en el foco; puede ser epifisaria, metafisaria o **diafisaria (la más frecuente)**. Signos: cierre del canal medular por un **opérculo óseo** (diafisarias), **esclerosis** de bordes con pseudocápsula perióstica y **movilidad anómala indolora** del foco."},{"tipo":"tabla","titulo":"Sudeck o distrofia simpático-refleja (DSR)","columnas":["Aspecto","Contenido"],"filas":[["Frecuencia","**2-3 %** de lesiones traumáticas; fisiopatología desconocida; típica en **mujeres de 40-60 años**"],["Síntomas","Edema, inflamación, dolor continuo/quemazón/calambres, alteraciones de color, piel, sudoración y temperatura, rigidez"],["Fase aguda","Dolor intenso y **desproporcionado** de toda la extremidad, enrojecimiento, hiperestesia; **gammagrafía (rastreo óseo) +++, termografía +++**"],["Fase crónica","Dolor, **atrofia, rigidez, palidez y enfriamiento**; reposo antiálgico; analgésicos potentes"],["Duración","**6-12 meses**"],["Tratamiento más eficaz","**Fisioterapia precoz** (electroterapia, ejercicio, diatermia, terapia manual), analgésicos, antidepresivos, bloqueantes simpáticos, apoyo psicológico"]]},{"tipo":"alerta","texto":"Trampa clásica: la **pseudoartrosis** tiene movilidad del foco **indolora**; el **retraso de consolidación** todavía puede consolidar. Y la complicación más frecuente de las fracturas no es la pseudoartrosis sino la **rigidez**."},{"tipo":"dato","valor":"≤ 5 mm","texto":"Separación máxima entre fragmentos principales compatible con la consolidación."}]},{"id":"tratamiento","titulo":"Generalidades del tratamiento: las 3 R, inmovilización y osteosíntesis","bloques":[{"tipo":"esquema","titulo":"Las 3 R y la toma de decisión","mermaid":"flowchart TD\n  A[\"Fractura\"] --> B[\"1 Reduccion\"]\n  B --> C{\"Tipo de reduccion\"}\n  C -->|\"Estable\"| D[\"2 Retencion ortopedica: venda, ferula, yeso\"]\n  C -->|\"Inestable\"| E[\"Traccion u osteosintesis\"]\n  C -->|\"Imposible\"| F[\"Cirugia: interposicion de partes blandas\"]\n  D --> G[\"3 Recuperacion funcional\"]\n  E --> G\n  F --> G","pie":"Primero se reduce; según la reducción sea estable, inestable o imposible, se retiene de forma ortopédica o quirúrgica; después, recuperación funcional cuando la fractura es estable."},{"tipo":"tabla","titulo":"Corrección de los desplazamientos (por orden)","columnas":["Desplazamiento","Maniobra"],"filas":[["1. Acortamiento","**Tracción en el eje**: tirar del fragmento distal sujetando el proximal (el tono muscular siempre acorta)"],["2. Traslación lateral","Presión lateral sobre el fragmento distal"],["3. Angulación","Corrección del eje"],["4. Rotación","**La más difícil** (sobre todo en el brazo) y **lo último que se corrige**; mal tolerada y **no se corrige con el crecimiento**"]]},{"tipo":"tarjetas","items":[{"etiqueta":"Estable","titulo":"Reducción estable","texto":"Al dejar de hacer fuerza la fractura **queda enganchada** con deformidad tolerable."},{"etiqueta":"Inestable","titulo":"Reducción inestable","texto":"Al cesar las maniobras **se vuelve a desplazar** por tracciones musculares (p. ej. diáfisis femoral) → cirugía."},{"etiqueta":"Imposible","titulo":"Reducción imposible","texto":"**Interposición de partes blandas** → tratamiento quirúrgico."}]},{"tipo":"tabla","titulo":"Vendajes y férulas de yeso","columnas":["Método","Claves"],"filas":[["Vendaje de soporte","Apretado pero no tenso (exceso → compresión vascular; defecto → no cumple función)"],["Vendaje compresivo","Presión suficiente para evitar tumefacción; corto plazo; **de distal a proximal**"],["Recomendaciones","Seco, movilizar articulaciones libres, **miembro elevado**, vigilar circulación distal, qué hacer ante erupción o fiebre, cuándo retirarlo"],["Férula de yeso: composición","Vendas de muselina endurecida con **sulfato cálcico semihidratado**"],["Férula de yeso: ventajas","Permite la **expansión por tumefacción**, aplicar frío, inmovilización de urgencia"],["Férula de yeso: inconvenientes","Excesiva movilidad; **contraindicada como tratamiento definitivo en fracturas inestables**"],["Aplicación del yeso","Mojar **3-5 s**, escurrir, siempre en el mismo sentido, grosor uniforme, **mejor ajuste proximal que distal**"]]},{"tipo":"alerta","texto":"El **yeso circular** inmoviliza la diáfisis y las **2 articulaciones vecinas** (antebrazo, tibia → incluir tobillo), pero **nunca se cierra en las primeras 48 h** si hay inflamación: comprimiría las celdas aponeuróticas y provocaría un **síndrome compartimental**."},{"tipo":"tabla","titulo":"Tracciones","columnas":["Aspecto","Contenido"],"filas":[["Objetivos","Mantener longitud, alinear y estabilizar; aliviar el dolor (vencer la contracción muscular); permite movilidad articular"],["Tipos","Percutáneas, **esqueléticas o transesqueléticas**, mixtas"],["Transesquelética","Aguja metálica o de **Kirschner** a través del hueso + **estribo** en herradura con el peso; puede mantenerse hasta la consolidación"],["Uso típico","Fracturas de **fémur en niños** (sobre partes blandas y ambos miembros); en adultos sobre hueso"]]},{"tipo":"tabla","titulo":"Osteosíntesis","columnas":["Material","Indicación y mecanismo"],"filas":[["Agujas de Kirschner con **obenque**","Fracturas con tracción divergente (**rótula, olécranon**): el obenque **transforma la tracción en compresión** interfragmentaria. Rótula: 2 agujas de **1,6-2 mm** paralelas a ~**5 mm** de la superficie anterior + cerclaje en **8**"],["Placas de compresión","Rígidas, fricción placa-hueso; **desperiostización**, rigidez excesiva y mala presa en hueso osteoporótico; consolidación **per primam**"],["Placas bloqueadas","El tornillo se solidariza con la placa y actúa como **fijador externo**; no necesitan contacto placa-hueso; más elásticas; indicadas en fracturas **epifisarias u osteoporóticas**"],["Clavo endomedular (**Küntscher**)","**Elección** en diáfisis de **húmero, fémur y tibia**; fresado y bloqueado; ocupa el eje mecánico y resiste bien flexión y compresión"],["Fijación externa","Inmovilización inicial de **fracturas abiertas** y diafisarias en **politraumatizados graves**; las cargas saltan el foco"],["Fijador de **Ilizarov**","Agujas elásticas tensadas sobre aros: fijación elástica que permite **carga precoz** (andar al día siguiente); fracturas articulares y reconstrucciones"],["Artroplastia","Sustitución articular cuando está severamente dañada; cadera, rodilla, hombro"]]},{"tipo":"dato","valor":"\u003c 2 mm","texto":"Escalón articular máximo tolerado tras la reducción anatómica de una fractura articular: un escalón mayor provoca **artrosis precoz**."},{"tipo":"perla","texto":"El paciente con **Ilizarov** puede cargar muy pronto porque el montaje absorbe las cargas con estabilidad elástica: la reeducación de la marcha empieza casi de inmediato, cuidando los trayectos de las agujas."},{"tipo":"alerta","texto":"No inviertas las indicaciones: placa **bloqueada** = hueso osteoporótico/epifisario (no necesita apoyo sobre el hueso); placa de **compresión** = rígida, desperiostiza y hace mala presa en hueso osteoporótico."}]}],"caso_clinico":{"titulo":"Motorista con fractura abierta de tibia","presentacion":"Varón de 34 años, fumador, que sufre un accidente de moto. Presenta una herida de 12 cm en la cara anterior de la pierna con exposición de una fractura diafisaria de tibia, conminuta, con fragmentos expuestos y amplia denudación de periostio; los pulsos distales están presentes y la sensibilidad plantar conservada. Se coloca un fijador externo y, semanas después, se plantea un enclavado endomedular.","preguntas":[{"pregunta":"¿Qué tipo de Gustilo-Anderson presenta y qué implica?","respuesta":"Herida > 10 cm, contaminación severa y pérdida de partes blandas con denudación perióstica que no permite cubrir el hueso: **IIIB**. Precisará **cirugía plástica reconstructiva**. No es IIIC porque no hay lesión vascular que requiera reparación (pulsos presentes)."},{"pregunta":"¿Por qué se elige primero un fijador externo y después un clavo de Küntscher?","respuesta":"La **fijación externa** está indicada para la inmovilización **inicial de las fracturas abiertas**: estabiliza sin introducir material en un foco contaminado. Una vez controladas las partes blandas, el **clavo endomedular** es el tratamiento de elección en las **fracturas diafisarias de tibia**."},{"pregunta":"¿Qué factores ponen en riesgo la consolidación y qué complicación debe vigilarse?","respuesta":"Fractura **abierta** (infección, pérdida de periostio y masa celular), conminución con posible separación de fragmentos, **tabaquismo** y vascularización comprometida. Riesgo de **retraso de consolidación y pseudoartrosis** (sobre todo diafisaria), además de osteomielitis y rigidez de rodilla y tobillo."}]},"preguntate":[{"pregunta":"¿Por qué decimos que una fractura no es solo una lesión ósea?","respuesta":"Porque la definición incluye la **alteración de partes blandas y tejidos neurovasculares**; el foco de fractura es la lesión ósea más las partes blandas vecinas."},{"pregunta":"¿En qué se diferencian la fractura por insuficiencia y la de estrés?","respuesta":"La de insuficiencia asienta sobre hueso **débil** (osteoporosis, tumor) con traumatismo mínimo; la de estrés, sobre hueso **sano** sometido a solicitaciones mecánicas repetidas, sin traumatismo previo."},{"pregunta":"Explica cómo se forma un ala de mariposa.","respuesta":"En la flexión la convexidad se tracciona y la concavidad se comprime; el hueso cede primero en la convexidad y, al sobrepasar la línea neutra, el trazo se divide aislando un fragmento triangular en la concavidad."},{"pregunta":"¿Qué trazo produce la torsión y en qué hueso es típica?","respuesta":"Un trazo **espiroideo**, muy frecuente en la **tibia** (pie fijo y giro brusco del cuerpo)."},{"pregunta":"¿Cuál es la diferencia clave entre Gustilo IIIB y IIIC?","respuesta":"En IIIB la pérdida de partes blandas impide cubrir el hueso; IIIC añade una **lesión vascular que necesita reparación** (59 % de amputaciones)."},{"pregunta":"¿Qué angulación de trazo separa una fractura estable de una inestable?","respuesta":"**45º**: transversales u oblicuas \u003c 45º son estables; oblicuas > 45º, inestables."},{"pregunta":"Enumera las 5 fases de la reparación ósea.","respuesta":"Impacto inicial (hematoma), inflamatoria, callo blando, callo óseo y remodelación."},{"pregunta":"¿Cuáles son los signos que definen una pseudoartrosis?","respuesta":"Cierre del canal medular por un opérculo óseo, esclerosis de los bordes con pseudocápsula perióstica y movilidad anómala **indolora** en el foco."},{"pregunta":"¿En qué orden se corrigen los desplazamientos y cuál es el más difícil?","respuesta":"Acortamiento, traslación lateral, angulación y rotación; la **rotación** es la más difícil y la última, y no se corrige con el crecimiento."},{"pregunta":"¿Cómo funciona un obenque en una fractura de olécranon?","respuesta":"Las agujas y el alambre convierten la tracción del **tríceps**, que separaría los fragmentos, en **compresión interfragmentaria**."}],"glosario":[{"termino":"Foco de fractura","definicion":"Lesión ósea más partes blandas vecinas."},{"termino":"Fractura en rodete","definicion":"Fractura por compresión del niño en la que ceden las trabéculas y se ensancha el diámetro óseo."},{"termino":"Tallo verde","definicion":"Fractura incompleta típica del niño."},{"termino":"Ala de mariposa","definicion":"Tercer fragmento triangular producido por un mecanismo de flexión."},{"termino":"Conminuta","definicion":"Fractura completa con múltiples fragmentos."},{"termino":"Gustilo-Anderson","definicion":"Clasificación de las fracturas abiertas (I, II, IIIA, IIIB, IIIC) según herida, contaminación, partes blandas y daño óseo."},{"termino":"Cambium","definicion":"Capa interna del periostio cuyas células forman el callo perióstico externo."},{"termino":"Pseudoartrosis","definicion":"Ausencia absoluta de consolidación con falsa articulación en el foco."},{"termino":"Sudeck (DSR)","definicion":"Distrofia simpático-refleja postraumática con dolor desproporcionado y alteraciones vasomotoras y tróficas."},{"termino":"Obenque","definicion":"Montaje con agujas de Kirschner y alambre que transforma la tracción en compresión interfragmentaria."},{"termino":"Enclavado de Küntscher","definicion":"Clavo endomedular fresado y bloqueado, de elección en diáfisis de húmero, fémur y tibia."},{"termino":"Ilizarov","definicion":"Fijador externo circular con agujas tensadas sobre aros que da fijación elástica y permite carga precoz."},{"termino":"Artrolisis","definicion":"Intervención quirúrgica para liberar adherencias en una rigidez irreductible."}],"fuentes":["Tema 5. Fracturas en adultos. Patología Quirúrgica I (PQRI 2026-2027), Universidad Europea de Valencia","Clasificación de Gustilo y Anderson (citada en el tema)"],"qcm":[{"pregunta":"Una bailarina de 24 años refiere dolor progresivo en el antepié que aumenta al ensayar y cede en reposo, sin caída previa; la radiografía es normal. ¿Qué afirmación es correcta según el tema?","opciones":["Asienta sobre hueso sano y la prueba indicada es la RMN o el TC","La localización más probable es el quinto metatarsiano proximal","La Rx normal descarta la fractura y orienta a tendinopatía","Es una fractura por insuficiencia y debe estudiarse la masa ósea"],"correcta":0,"explicacion":"Es el cuadro típico de fractura por fatiga o estrés: hueso sano, solicitaciones mecánicas repetidas, dolor que aumenta con el ejercicio y cede con el reposo. La Rx suele ser normal y se recurre a TC y/o RMN; la localización más frecuente es el 2.º metatarsiano.","por_opcion":["✅ Fractura de estrés sobre hueso sano; Rx habitualmente normal → TC/RMN.","❌ El tema señala el 2.º metatarsiano como la localización más frecuente.","❌ Una Rx normal es lo habitual en la fractura de estrés y no la descarta.","❌ La fractura por insuficiencia asienta sobre hueso débil (osteoporosis, tumores), no sobre hueso sano de una joven deportista."]},{"pregunta":"En un mecanismo de flexión de un hueso largo, ¿dónde se inicia la rotura y por qué?","opciones":["En la convexidad, porque el hueso resiste peor la tracción que la compresión","En el punto de aplicación de la fuerza, por mecanismo directo de impacto","En la línea neutra, porque allí se concentran las fuerzas de cizallamiento","En la concavidad, porque el hueso resiste peor la compresión que la tracción"],"correcta":0,"explicacion":"En la flexión la concavidad se comprime y la convexidad se tracciona; como el tejido óseo es menos resistente a la tracción, pierde cohesión en el punto de convexidad máxima y el trazo progresa hacia la concavidad, donde puede aislar el ala de mariposa.","por_opcion":["✅ La convexidad soporta tracción, que es la carga peor tolerada por el hueso.","❌ La rotura empieza en la convexidad máxima, se trate de mecanismo directo o indirecto.","❌ La línea neutra es donde el trazo puede dividirse, no donde se inicia.","❌ Invierte la resistencia: el hueso resiste mejor la compresión."]},{"pregunta":"Un futbolista gira bruscamente el cuerpo con el pie bloqueado en el césped y se fractura la tibia. ¿Qué trazo cabe esperar?","opciones":["Conminuto con tercer fragmento en cuña","Espiroideo a lo largo de la diáfisis","Oblicuo corto por compresión axial","Transversal por avulsión"],"correcta":1,"explicacion":"Dos fuerzas de tracción en sentido inverso alrededor del eje longitudinal (pie fijo, giro del cuerpo) producen un mecanismo torsional con trazo espiroideo, muy frecuente en la tibia.","por_opcion":["❌ El tercer fragmento en cuña es la firma de la flexión.","✅ La torsión genera una línea espiroidea en la que las laminillas se separan por tracción.","❌ El trazo oblicuo por compresión es propio de cargas axiales.","❌ El trazo transversal corresponde a la tracción pura (arrancamientos)."]},{"pregunta":"Fractura abierta de pierna con herida de 15 cm, fragmentos expuestos, amplia denudación perióstica, pulsos pedios presentes. Clasificación de Gustilo-Anderson:","opciones":["Tipo II","Tipo IIIC","Tipo IIIA","Tipo IIIB"],"correcta":3,"explicacion":"El IIIB es herida > 10 cm con pérdida extensa de partes blandas que no permite la cobertura ósea (denudación del periostio) y necesidad de cirugía plástica. Sin lesión vascular que requiera reparación no es IIIC.","por_opcion":["❌ El tipo II tiene herida de 1-10 cm y daño moderado.","❌ IIIC exige lesión vascular que necesite reparación; los pulsos están presentes.","❌ En IIIA las partes blandas aún permiten la cobertura ósea.","✅ Pérdida de cobertura con fragmentos expuestos y denudación perióstica = IIIB."]},{"pregunta":"Según el tema, ¿qué porcentaje de amputaciones se asocia a las fracturas abiertas tipo IIIC?","opciones":["59 %","49 %","39 %","29 %"],"correcta":0,"explicacion":"El análisis pormenorizado de las lesiones IIIC acaba con un 59 % de amputaciones; el tema añade que es mejor una amputación temprana que una tardía.","por_opcion":["✅ 59 % de amputaciones en IIIC.","❌ Cifra no recogida en el tema.","❌ Cifra no recogida en el tema.","❌ Cifra no recogida en el tema."]},{"pregunta":"Para decidir si tiene sentido la reconstrucción arterial en una fractura IIIC de pierna, ¿qué exploración destaca el tema?","opciones":["La sensibilidad de la planta del pie","El reflejo aquíleo del lado afecto","La fuerza de la flexión dorsal del tobillo","El relleno capilar del primer dedo"],"correcta":0,"explicacion":"La reconstrucción solo tiene sentido si las partes blandas son recuperables y los nervios (tibial posterior, ciático) están intactos, porque se regeneran mal; para evaluarlo se explora la sensibilidad plantar, territorio del tibial.","por_opcion":["✅ La sensibilidad plantar informa de la integridad del nervio tibial.","❌ El reflejo aquíleo no es el criterio citado en el tema.","❌ La flexión dorsal depende del peroneo profundo, no del tibial.","❌ El relleno capilar valora la perfusión, no la viabilidad nerviosa que decide la reconstrucción."]},{"pregunta":"Tras reducir una fractura diafisaria, el trazo es oblicuo a 55º. ¿Cómo se clasifica y qué comportamiento cabe esperar?","opciones":["Inestable solo si existe interposición de partes blandas","Estable, si el trazo no es conminuto ni abierto","Estable: tras la reducción no tiende a desplazarse","Inestable: tras la reducción tiende a desplazarse"],"correcta":3,"explicacion":"Las fracturas con trazos oblicuos de más de 45º son inestables: tras la reducción tienden a desplazarse. Las transversales u oblicuas de menos de 45º son estables.","por_opcion":["❌ La interposición de partes blandas hace la reducción imposible, que es otro concepto.","❌ El criterio del tema es la angulación del trazo, no la conminución.","❌ La estabilidad corresponde a trazos \u003c 45º.","✅ Oblicuo > 45º = inestable."]},{"pregunta":"¿Cuál es la indicación de la RMN frente al TC en las fracturas, según el tema?","opciones":["Fracturas articulares complejas que requieren reconstrucción 3D","Confirmación inicial de toda fractura con dos proyecciones","Fracturas ocultas con edema óseo y fracturas por estrés","Valoración de fracturas diafisarias simples desplazadas"],"correcta":2,"explicacion":"La RMN está indicada en fracturas por estrés, ocultas (edemas óseos), con lesión de partes blandas y patológicas. El TC, con reconstrucción 3D, se reserva para fracturas articulares y complejas.","por_opcion":["❌ Es la indicación típica del TC.","❌ Esa es la función de la radiografía simple.","✅ Estrés y fracturas ocultas con edema óseo son indicaciones de RMN.","❌ Una diáfisis simple desplazada se estudia con Rx."]},{"pregunta":"¿En qué fase de la reparación ósea se forma el tejido óseo fibrilar?","opciones":["Fase de remodelación","Fase de callo óseo","Fase de callo blando","Fase inflamatoria"],"correcta":1,"explicacion":"En la fase de callo óseo se mineraliza el callo blando (osificación directa del osteoide o osteocondral del cartílago) y el hueso formado es tejido óseo fibrilar, que la remodelación transformará en hueso laminar y sistemas de Havers.","por_opcion":["❌ La remodelación transforma el hueso fibrilar en laminar y Havers.","✅ La mineralización del callo blando da hueso fibrilar.","❌ El callo blando es aún tejido celular, cartilaginoso y osteoide sin mineralizar.","❌ La fase inflamatoria limpia el foco."]},{"pregunta":"¿Qué factor liberado en el impacto inicial es responsable de la proliferación celular?","opciones":["Factores inductores","Factores mitogénicos","Factores osteoclásticos","Factores quimiotácticos"],"correcta":1,"explicacion":"El hematoma libera tres tipos de factores locales: quimiotácticos (migración celular), mitogénicos (proliferación) e inductores (diferenciación).","por_opcion":["❌ Los inductores producen la diferenciación celular.","✅ Los mitogénicos inducen la proliferación.","❌ No figuran entre los tres grupos de factores del tema.","❌ Los quimiotácticos atraen células a la zona del hematoma."]},{"pregunta":"¿Cuál de los siguientes signos NO forma parte de los criterios de pseudoartrosis del tema?","opciones":["Esclerosis de los bordes con pseudocápsula","Opérculo óseo que cierra el canal medular","Movilidad anómala dolorosa en el foco","Falsa articulación en el foco de fractura"],"correcta":2,"explicacion":"La pseudoartrosis es la ausencia absoluta de consolidación con falsa articulación; sus signos son el opérculo óseo medular en diafisarias, la esclerosis de bordes con pseudocápsula perióstica y la movilidad anómala INDOLORA.","por_opcion":["❌ Sí es criterio.","❌ Sí es criterio en fracturas diafisarias.","✅ La movilidad anómala de la pseudoartrosis es indolora.","❌ La falsa articulación define la pseudoartrosis."]},{"pregunta":"Una paciente de 52 años, tras fractura de muñeca, presenta dolor urente desproporcionado de toda la mano, edema, enrojecimiento e hiperestesia. ¿Qué es cierto?","opciones":["Está en fase crónica, con gammagrafía y termografía positivas","Debe tratarse con reposo absoluto hasta que remita el dolor","Afecta al 12 % de los traumatismos y dura más de dos años","Está en fase aguda, y el tratamiento más eficaz incluye fisioterapia precoz"],"correcta":3,"explicacion":"Dolor intenso y desproporcionado de toda la extremidad con enrojecimiento, inflamación e hiperestesia es la fase aguda del Sudeck. El tratamiento más eficaz combina fisioterapia precoz, medicación y apoyo psicológico.","por_opcion":["❌ La fase crónica cursa con atrofia, palidez y frialdad; la gammagrafía y termografía +++ son de la fase aguda.","❌ El reposo antiálgico es un rasgo de la fase crónica, no el tratamiento.","❌ Afecta al 2-3 % y dura 6-12 meses.","✅ Fase aguda; fisioterapia precoz como pilar del tratamiento."]},{"pregunta":"Al reducir una fractura diafisaria desplazada, ¿cuál es el orden correcto de corrección?","opciones":["Acortamiento, traslación, angulación y rotación","Rotación, angulación, traslación y acortamiento","Traslación, acortamiento, rotación y angulación","Angulación, acortamiento, rotación y traslación"],"correcta":0,"explicacion":"Primero se corrige el acortamiento con tracción en el eje, luego la traslación lateral por presión, la angulación y, en último lugar, la rotación, que es la más difícil y la peor tolerada.","por_opcion":["✅ Orden del tema: acortamiento → traslación → angulación → rotación.","❌ La rotación es lo último que se corrige.","❌ Sin tracción previa no pueden afrontarse los fragmentos.","❌ El acortamiento debe corregirse primero, venciendo el tono muscular."]},{"pregunta":"Paciente de 78 años con osteoporosis y fractura epifisaria de radio distal que se trata quirúrgicamente. ¿Qué implante encaja mejor con el tema?","opciones":["Clavo endomedular fresado de Küntscher","Placa de compresión rígida apoyada sobre la cortical","Obenque con dos agujas de Kirschner y cerclaje","Placa bloqueada que actúa como un fijador interno"],"correcta":3,"explicacion":"En las placas bloqueadas el tornillo se solidariza con la placa y no se necesita contacto placa-hueso: evitan la desperiostización, dan más elasticidad, se anclan bien en hueso osteoporótico y están indicadas en fracturas epifisarias u osteoporóticas.","por_opcion":["❌ El clavo de Küntscher es de elección en diáfisis de húmero, fémur y tibia.","❌ La placa de compresión hace mala presa en hueso osteoporótico y desperiostiza.","❌ El obenque se reserva a fracturas con tracción divergente (rótula, olécranon).","✅ Placa bloqueada: indicada en fracturas epifisarias y osteoporóticas."]},{"pregunta":"Respecto al yeso circular en una fractura de tibia, ¿qué afirmación es correcta?","opciones":["Se aplica cerrado de inmediato para controlar la tumefacción","Debe ajustar más en la zona distal que en la proximal","No se cierra en las primeras 48 h si hay inflamación","Inmoviliza solo la diáfisis para no rigidizar rodilla ni tobillo"],"correcta":2,"explicacion":"El yeso circular inmoviliza la diáfisis y las dos articulaciones vecinas, pero no debe cerrarse en las primeras 48 horas si hay inflamación, porque comprimiría las celdas aponeuróticas y podría producir un síndrome compartimental.","por_opcion":["❌ Cerrarlo de inmediato con inflamación arriesga un síndrome compartimental.","❌ El tema indica mejor ajuste proximal que distal.","✅ Nunca cerrado en las primeras 48 h si hay inflamación.","❌ Debe incluir las dos articulaciones vecinas (en la tibia, también el tobillo)."]}],"asignatura":"Patología quirúrgica I","tema":5,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){

    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
