<!DOCTYPE html>
<html lang="es">
<head>

<title>Tema 5: Fracturas en adultos · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}

<script id="datos" type="application/json">{"titulo":"Tema 5: Fracturas en adultos","subtitulo":"Clínica y biomecánica de la fractura, clasificación (etiología, mecanismo, patrón, partes blandas, estabilidad), radiología, fases de la reparación, complicaciones (rigidez, pseudoartrosis, Sudeck), factores de consolidación y tratamiento (las 3 R, yesos, tracción, osteosíntesis).","resumen":["La fractura es la **pérdida de continuidad del hueso** junto con la alteración de los **tejidos blandos y neurovasculares**; ante toda fractura desplazada (sobre todo **hombro, codo, rodilla**) hay que explorar y **registrar el estado neurovascular distal** para descartar iatrogenia.","Las **patológicas** asientan sobre enfermedad de base, **insuficiencia** (osteoporosis: **40 %** de posmenopáusicas, **T-score \u003c −2,5**) o **estrés** (jóvenes 20–30 y adultos 40–60, más mujeres y MMII; la más frecuente en el **2.º metatarsiano**, RX normal → **RM/TC**); por mecanismo, la **flexión** da el **ala de mariposa**, la **torsión** la **espiroidea** y la **tracción** el **arrancamiento**.","Gustilo-Anderson distingue **I** (\u003c 1 cm), **II** (> 1 cm, poca lesión), **IIIA** (buena cobertura), **IIIB** (exposición ósea, denudación perióstica) y **IIIC** (lesión arterial: **59 % de amputaciones**); son **estables** los trazos transversos u oblicuos **\u003c 45°** e **inestables** los **> 45°**.","El hueso repara **“ad integrum”, sin cicatriz**: impacto (hematoma, factores quimiotácticos, mitogénicos e inductores) → inflamación → **callo blando** (perióstico y endóstico, collarete a los **~10 días**) → **callo óseo** → **remodelación**; la **rigidez** es la complicación más frecuente y la **pseudoartrosis** es una falsa articulación con canal cerrado, esclerosis y **movilidad indolora**.","El tratamiento sigue las **3 R** (**reducción, retención, recuperación funcional**), corrigiendo el **desplazamiento rotatorio en último lugar**; los fragmentos no deben separarse **> 5 mm**, el escalón articular debe ser **\u003c 2 mm**, el **enclavado endomedular (Küntscher)** es de elección en diáfisis de húmero, fémur y tibia y el **fijador externo** en fracturas abiertas y politraumatizados."],"objetivos":["Describir la clínica y la biomecánica (stress, strain, elasticidad) de la fractura.","Clasificar las fracturas por etiología, mecanismo, patrón, partes blandas, estabilidad y localización.","Elegir la técnica de imagen adecuada (RX, TC, RM).","Explicar las fases de la reparación ósea y sus complicaciones (rigidez, pseudoartrosis, Sudeck).","Aplicar los principios del tratamiento: 3 R, vendajes, yesos, tracción y osteosíntesis."],"ideas_clave":["Siempre explorar y **registrar el estado neurovascular distal** en fracturas desplazadas.","Osteoporosis: **40 %** de posmenopáusicas; riesgo de fractura de cadera **16 %**, vertebral **32 %**, muñeca **15 %**.","El hueso resiste mejor la **compresión** que la **tracción** y el cizallamiento.","Fractura por estrés más frecuente: **2.º metatarsiano**; RX normal → **TC/RM**.","Gustilo **IIIC** = lesión arterial: **59 %** de amputaciones; mejor amputación **temprana**.","**Estables \u003c 45°**, **inestables > 45°** de oblicuidad.","Rigidez = complicación **más frecuente**: reductible, irreductible relativa, irreductible (anquilosis).","Consolidación: separación **≤ 5 mm**; escalón articular **\u003c 2 mm**; ni rigidez absoluta ni hipermovilidad."],"secciones":[{"id":"introduccion","titulo":"Definición, clínica y biomecánica","bloques":[{"tipo":"definicion","termino":"Fractura","texto":"**Pérdida de continuidad** de la estructura normal de un hueso **sumada a la alteración** del tejido blando y neurovascular circundante. **Foco de fractura**: conjunto de la lesión ósea y las partes blandas vecinas."},{"tipo":"lista","items":["**Clínica**: antecedente traumático, **dolor**, **impotencia funcional** (cojera, bipedestación imposible), hematomas, **movilidad anormal y crepitación**, **deformidad** (acortamiento, angulación, ensanchamiento, rotación).","**Partes blandas**: fractura cerrada o abierta (la abierta consolida peor y se infecta).","**Exploración neurovascular distal**: obligatoria y documentada, sobre todo en **hombro, codo y rodilla**, para dejar claro que la lesión **no es iatrogénica**.","**Complicaciones graves**: tromboembolismo, **shock hipovolémico**, **embolia grasa**."]},{"tipo":"parrafo","texto":"**Biomecánica**: la fuerza produce un **esfuerzo (stress)** = fuerza / área, que genera una **deformidad (strain)** = longitud final / inicial. El **módulo elástico** depende de la **densidad**: cortical y esponjoso difieren y la **osteoporosis reduce la elasticidad**. Las osteonas del cortical resisten mejor la **compresión** que la **tracción** y la **cizalla**."}]},{"id":"etiologia","titulo":"Clasificación por etiología","bloques":[{"tipo":"tabla","titulo":"Tipos etiológicos","columnas":["Tipo","Rasgos"],"filas":[["**Traumáticas o habituales**","Las más frecuentes; un único traumatismo capaz de romper cualquier hueso; pronóstico ligado al traumatismo"],["**Patológicas sobre enfermedad**","Traumatismo mínimo o nulo sobre hueso enfermo (p. ej., **Paget**)"],["**Por insuficiencia**","Hueso débil: general (**osteoporosis**) o local (**tumores**)"],["**Por fatiga o estrés**","**Sin traumatismo previo**, solicitaciones mecánicas repetidas sobre **hueso sano**"]]},{"tipo":"dato","valor":"40 % · 16 / 32 / 15 %","texto":"Mujeres posmenopáusicas con osteoporosis y su riesgo de fractura de cadera, vertebral y de muñeca (> 50 % de al menos una)."},{"tipo":"parrafo","texto":"La OMS define el esqueleto osteoporótico por una masa **\u003c −2,5 DE** respecto al pico de un adulto joven. La masa ósea está determinada **60–80 % genéticamente**; la **actividad física la aumenta un 20 %**. Las mujeres tienen menos masa porque su crecimiento termina **~2 años tras la menarquia (~15 años)**, frente a **18–20 años** en varones."},{"tipo":"tabla","titulo":"Fracturas por estrés","columnas":["Aspecto","Detalle"],"filas":[["Grupos","**Jóvenes 20–30** (deportistas, bailarines, **reclutas**) y **adultos 40–60** con esfuerzos ocasionales; más **mujeres** y **MMII**"],["Clínica","**Dolor progresivo** que aumenta con el ejercicio causante y **cede con reposo**; dolor a punta de dedo"],["Imagen","**RX normal** → **TC y/o RM**"],["Localizaciones","**2.º metatarsiano (la más frecuente)**, cuello femoral, tibia, diáfisis femoral proximal"]]}]},{"id":"mecanismo-patron","titulo":"Mecanismo, patrón, partes blandas y estabilidad","bloques":[{"tipo":"tabla","titulo":"Mecanismos indirectos","columnas":["Mecanismo","Trazo resultante","Claves"],"filas":[["**Compresión**","Aplastamiento (vertebral en adultos), **rodete** en niños; trazo oblicuo en hueso largo","Mecanismo fundamental del **esponjoso**, epífisis y huesos cortos; la diáfisis rara vez se rompe así"],["**Flexión**","**Tercer fragmento en ala de mariposa** (cuña en la concavidad)","El **más habitual** en huesos largos: la convexidad sufre **tracción** (cede antes) y la concavidad compresión"],["**Cizallamiento**","**Oblicua**","Fuerzas paralelas y opuestas (**guillotina**); a más energía, más desplazamiento y fractura abierta"],["**Torsión**","**Espiroidea**","Muy frecuente en **tibia** (pie fijo y giro del cuerpo)"],["**Tracción**","**Transversa / arrancamiento**","Poco frecuente; **avulsión** muscular en deportistas"]]},{"tipo":"parrafo","texto":"**Patrón**: incompletas (**fisura, tallo verde** —típica del niño—, **caña de bambú**) y completas (simples no desplazadas, desplazadas, **conminutas**). Según el foco: **abiertas** (incluidas las de arma de fuego) o **cerradas**. Según localización: diafisarias, epifisarias, metafisarias."},{"tipo":"figura","pagina":46,"pie":"Clasificación de Gustilo y Anderson: I herida \u003c 1 cm sin contaminación; II > 1 cm, poca lesión; IIIA buena cobertura; IIIB fragmentos expuestos y denudación del periostio; IIIC grave lesión arterial.","src":"img/patologia-quirurgica-i-t5-tema-5-fracturas-en-adultos-p46.jpg"},{"tipo":"alerta","texto":"**Gustilo IIIC** (lesión arterial) termina en amputación en el **59 %**: “mejor una amputación **temprana** que tardía”. La reconstrucción arterial solo tiene sentido si las partes blandas son recuperables y el **nervio tibial posterior/ciático** está intacto (valorar la **sensibilidad plantar**)."},{"tipo":"tabla","titulo":"Estabilidad","columnas":["Tipo","Rasgos"],"filas":[["**Estable**","Tras reducir **no tiende a desplazarse**; trazos transversos u oblicuos **\u003c 45°**"],["**Inestable**","Tras reducir **tiende a desplazarse**; trazos oblicuos **> 45°**"]]},{"tipo":"perla","texto":"Checklist de una fractura: ¿abierta o cerrada? ¿trazo? ¿angulada, acortada, rotada? ¿epifisaria, diafisaria? ¿completa o incompleta? ¿traumática o patológica? ¿mecanismo directo o indirecto?"}]},{"id":"radiologia","titulo":"Radiología","bloques":[{"tipo":"tabla","titulo":"Técnicas de imagen","columnas":["Técnica","Uso"],"filas":[["**RX simple**","**Imprescindible**, confirma el diagnóstico; **mínimo 2 proyecciones** e incluir **articulaciones adyacentes**"],["**TC**","Radiografía de alta resolución con **reconstrucción 3D**: fracturas **articulares y complejas**, patológicas"],["**RM**","Fracturas **por estrés**, **ocultas** (edema óseo), con lesión de **partes blandas** (osteocondral), patológicas (tumores, metástasis)"]]}]},{"id":"reparacion","titulo":"Fisiopatología de la reparación ósea","bloques":[{"tipo":"perla","texto":"El hueso repara **“ad integrum”**, **sin formar cicatriz**: es uno de los pocos tejidos que se regenera con el mismo tejido."},{"tipo":"esquema","titulo":"Fases de la reparación ósea","mermaid":"flowchart TD\n  A[\"Impacto: hematoma, necrosis, factores quimiotacticos, mitogenicos, inductores\"] --> B[\"Inflamacion: limpieza del foco, permeabilidad y vasos\"]\n  B --> C[\"Callo blando: periostico externo y endostico, collarete a los 10 dias\"]\n  C --> D[\"Callo oseo: mineralizacion, tejido oseo fibrilar\"]\n  D --> E[\"Remodelacion: hueso laminar y Havers, meses a anos\"]","pie":"El periostio (capa cambium), el endostio, la médula y las partes blandas aportan las células."},{"tipo":"parrafo","texto":"En el **impacto**, el hematoma libera factores **quimiotácticos** (migración), **mitogénicos** (proliferación) e **inductores** (diferenciación). Algunas fracturas producen **infarto óseo** por desgarro de arterias terminales: el ejemplo mayor es la **necrosis de la cabeza femoral tras fractura subcapital**, también en cabeza humeral, escafoides y astrágalo. En el **callo blando**, la capa interna del periostio (**cambium**) forma un **collarete** que da el **callo perióstico externo** y el endostio y la médula el **callo endóstico**; hacia los **10 días** hay un collarín celular alrededor de cada fragmento. El **callo óseo** mineraliza el callo (osificación directa del osteoide o encondral del cartílago) y la **remodelación** transforma el hueso fibrilar en laminar trabecular o sistemas de Havers."},{"tipo":"tabla","titulo":"Complicaciones de la reparación","columnas":["Tempranas","Tardías"],"filas":[["Lesiones vasculares","Articulares: **rigidez**, artrosis"],["Lesiones nerviosas","Óseas: retraso, **pseudoartrosis**, **Sudeck**, dismetrías, consolidación viciosa, osteomielitis, refracturas"],["Lesión de órganos vitales","Musculares: atrofia, **miositis osificante**, roturas tendinosas"],["Shock traumático, embolia grasa","Neurológicas tardías"]]},{"tipo":"tabla","titulo":"Rigidez (la complicación más frecuente)","columnas":["Fase","Causa","Tratamiento"],"filas":[["**Reductible**","Limitación por causa activa","Fisioterapia y ejercicio"],["**Irreductible relativa**","Retracciones fibrosas, adherencias","Conservador, posibles secuelas"],["**Irreductible** (anquilosis)","La articulación no recorre su arco","**Artrólisis** o **movilización bajo anestesia**"]]},{"tipo":"definicion","termino":"Pseudoartrosis","texto":"**Ausencia absoluta de consolidación** con una **falsa articulación** en el foco; más frecuente en la **diáfisis**. Signos: **cierre del canal medular** por un opérculo óseo, **esclerosis** de los bordes con pseudocápsula perióstica y **movilidad anómala indolora**."},{"tipo":"parrafo","texto":"**Sudeck (distrofia simpático-refleja)**: fisiopatología desconocida, **2–3 %** de los traumatismos, típicamente **mujeres de 40–60 años**, dura **6–12 meses**. Clínica: edema, dolor continuo urente, cambios de color, sudoración y temperatura, rigidez. **Fase aguda**: dolor desproporcionado de toda la extremidad, rubor, hiperestesia, gammagrafía y termografía muy positivas. **Fase crónica**: dolor, atrofia, rigidez, **palidez y frialdad**. Tratamiento: **fisioterapia precoz**, analgésicos, antidepresivos, bloqueadores simpáticos y apoyo psicológico."}]},{"id":"factores","titulo":"Factores de la consolidación","bloques":[{"tipo":"tabla","titulo":"Factores favorables y desfavorables","columnas":["Favorecen","Dificultan"],"filas":[["Hormonas: GH, insulina, esteroides anabolizantes, tiroideas, calcitonina","Diabetes, déficit de GH, **corticoides**"],["Vitaminas A y D","Malnutrición"],["Factores de crecimiento (IL-1, IL-6, BMPs, TGF-β, IGF, PDGF)","Perturbación del hematoma, **indometacina (AINE)**"],["Ejercicio y carga controlados, campos electromagnéticos, ultrasonidos de baja frecuencia","Distracción, compresión o cizalla excesivas; interposición de partes blandas; radioterapia"],["Oxígeno hiperbárico","Hipoxia, mala vascularización, anemia, **tabaco**; citostáticos, infección, denervación, edad avanzada"]]},{"tipo":"figura","pagina":96,"pie":"Resumen de los factores que promueven y que dificultan la consolidación.","src":"img/patologia-quirurgica-i-t5-tema-5-fracturas-en-adultos-p96.jpg"},{"tipo":"lista","items":["**Contacto óseo**: fragmentos separados **no más de 5 mm**.","**Estabilidad elástica**: ni rigidez absoluta ni hipermovilidad; los estímulos mecánicos controlados favorecen el callo.","**Masa celular regeneradora**: periostio y partes blandas como fuente de células (falta en abiertas con pérdida muscular).","**Vascularización** suficiente (riesgo en zonas como la **odontoides**)."]},{"tipo":"dato","valor":"≤ 5 mm","texto":"Separación máxima entre fragmentos para que la fractura pueda consolidar."}]},{"id":"tratamiento","titulo":"Generalidades del tratamiento","bloques":[{"tipo":"esquema","titulo":"Las 3 R","mermaid":"flowchart LR\n  R1[\"1 Reduccion: afrontar los extremos\"] --> R2[\"2 Retencion o inmovilizacion\"]\n  R2 --> R3[\"3 Recuperacion funcional cuando es estable\"]","pie":"Objetivo: recuperar forma y función del segmento fracturado."},{"tipo":"parrafo","texto":"El **tono muscular acorta** las fracturas. Se corrige por orden: **1) acortamiento** (tracción del distal sujetando el proximal), **2) traslación lateral** (presión lateral), **3) angulación**, **4) rotación** (la más difícil, **mal tolerada**, **no se corrige con el crecimiento**; **se corrige la última**). La reducción puede ser **estable**, **inestable** (se desplaza al soltar, p. ej. diáfisis femoral) o **imposible** (interposición de partes blandas) → cirugía."},{"tipo":"tabla","titulo":"Métodos de retención","columnas":["Método","Claves"],"filas":[["**Vendaje**","Sostén o compresión; apretado pero no tenso; compresión de **distal a proximal**; mantener seco, movilizar lo libre, elevar, vigilar la circulación"],["**Férula/yeso**","Sulfato cálcico semihidratado; mojar **3–5 s**, sentido único, grosor uniforme, **mejor ajuste proximal**; permite la tumefacción y el frío, pero **no es definitivo en fracturas inestables**"],["Yeso circular","Inmoviliza la diáfisis y las **2 articulaciones vecinas**; **nunca cerrado en las primeras 48 h** si hay inflamación (riesgo de **síndrome compartimental**)"],["**Tracción**","Percutánea, **transesquelética** (aguja de **Kirschner** y estribo) o mixta; vence el tono, mantiene longitud y alineación; fracturas de fémur en niños"],["**Osteosíntesis**","Agujas de Kirschner, placas, enclavado endomedular, fijación externa, artroplastia"]]},{"tipo":"tabla","titulo":"Osteosíntesis","columnas":["Técnica","Indicación / mecanismo"],"filas":[["**Obenque** (Kirschner + alambre en 8)","Fracturas con **tracción divergente** (**rótula, olécranon**): convierte la tracción en **compresión interfragmentaria**"],["**Placa de compresión**","Rígida, exige desperiostizar; agarra mal en hueso osteoporótico; consolidación **per primam**; reducción anatómica con escalón **\u003c 2 mm**"],["**Placa bloqueada**","El tornillo se bloquea en la placa (**fijador interno**): sin contacto placa-hueso, menos desperiostización, más elasticidad; **epifisarias y osteoporóticas**"],["**Enclavado endomedular (Küntscher)**","**De elección en diáfisis de húmero, fémur y tibia**; fresado y bloqueado; ocupa el eje mecánico y resiste flexión y compresión"],["**Fijador externo**","Inmovilización inicial de **fracturas abiertas** y diafisarias del **politraumatizado** grave"],["**Ilizarov**","Agujas tensadas sobre aros: **fijación elástica** y **carga precoz**; fracturas articulares y reconstrucciones"],["**Artroplastia**","Sustitución articular (cadera, rodilla, hombro) cuando está muy dañada"]]},{"tipo":"dato","valor":"\u003c 2 mm","texto":"Escalón articular máximo tolerable tras la reducción para evitar artrosis precoz."}]}],"caso_clinico":{"titulo":"Fractura de tibia por giro en el fútbol","presentacion":"Hombre de 34 años que, con el pie fijo en el césped, gira bruscamente el cuerpo. Presenta dolor, deformidad e impotencia en la pierna. RX: fractura diafisaria de tibia de trazo espiroideo, oblicuidad > 45°, cerrada, con pulsos y sensibilidad distales normales (registrados). Fumador.","preguntas":[{"pregunta":"¿Qué mecanismo y qué estabilidad tiene la fractura?","respuesta":"Mecanismo indirecto de **torsión** (pie fijo + giro), que produce un trazo **espiroideo**; con oblicuidad **> 45°** es **inestable** (tiende a desplazarse tras reducir)."},{"pregunta":"¿Qué tratamiento de osteosíntesis es de elección?","respuesta":"El **enclavado endomedular** (Küntscher), de elección en las fracturas diafisarias de tibia; un yeso no es tratamiento definitivo en fracturas inestables."},{"pregunta":"¿Qué factores pueden retrasar la consolidación y qué vigilarás?","respuesta":"El **tabaco** (hipoxia y mala vascularización); evitar la indometacina y los corticoides si es posible. Vigilar **síndrome compartimental** precoz y, más tarde, **rigidez**, retraso de consolidación o **pseudoartrosis**."}]},"preguntate":[{"pregunta":"Define fractura y foco de fractura.","respuesta":"Pérdida de continuidad del hueso con alteración de partes blandas y neurovasculares; el foco es el conjunto de la lesión ósea y las partes blandas vecinas."},{"pregunta":"¿Por qué hay que registrar el estado neurovascular distal?","respuesta":"Para detectar lesiones (sobre todo en hombro, codo y rodilla) y dejar constancia de que no son iatrogénicas."},{"pregunta":"Diferencia stress y strain.","respuesta":"Stress: fuerza aplicada por área; strain: deformación, relación entre la longitud final y la inicial."},{"pregunta":"Describe la fractura por estrés.","respuesta":"Sin traumatismo previo, dolor progresivo con el ejercicio que cede con reposo, RX normal (TC/RM), más en mujeres y MMII, sobre todo en el 2.º metatarsiano."},{"pregunta":"¿Cómo se produce el ala de mariposa?","respuesta":"Por flexión: la convexidad cede por tracción y el trazo se divide al llegar a la concavidad aislando una cuña."},{"pregunta":"Describe Gustilo IIIA, IIIB y IIIC.","respuesta":"IIIA herida grande con buena cobertura; IIIB fragmentos expuestos y denudación perióstica; IIIC lesión arterial grave (59 % de amputaciones)."},{"pregunta":"¿Qué distingue una fractura estable de una inestable?","respuesta":"La estable no se desplaza tras reducir (trazo transverso u oblicuo \u003c 45°); la inestable sí (oblicua > 45°)."},{"pregunta":"Enumera las fases de la reparación ósea.","respuesta":"Impacto, inflamación, callo blando, callo óseo y remodelación."},{"pregunta":"¿Qué signos definen una pseudoartrosis?","respuesta":"Cierre del canal medular, esclerosis de los bordes con pseudocápsula y movilidad anómala indolora."},{"pregunta":"¿En qué orden se corrigen los desplazamientos al reducir?","respuesta":"Acortamiento, traslación lateral, angulación y, en último lugar, rotación."}],"glosario":[{"termino":"Foco de fractura","definicion":"Lesión ósea y de partes blandas vecinas."},{"termino":"Stress","definicion":"Fuerza aplicada por unidad de área."},{"termino":"Strain","definicion":"Deformación relativa del cuerpo sometido a carga."},{"termino":"Fractura del recluta","definicion":"Fractura por estrés del metatarsiano."},{"termino":"Ala de mariposa","definicion":"Tercer fragmento en cuña por flexión."},{"termino":"Caña de bambú","definicion":"Fractura incompleta por compresión."},{"termino":"Cambium","definicion":"Capa interna osteogénica del periostio."},{"termino":"Ad integrum","definicion":"Reparación con el mismo tejido, sin cicatriz."},{"termino":"Artrólisis","definicion":"Liberación quirúrgica de adherencias articulares."},{"termino":"Obenque","definicion":"Montaje que transforma tracción en compresión interfragmentaria."},{"termino":"Placa bloqueada","definicion":"Placa cuyos tornillos se fijan a ella como un fijador interno."},{"termino":"Enclavado de Küntscher","definicion":"Clavo endomedular para fracturas diafisarias."},{"termino":"Ilizarov","definicion":"Fijador externo circular con agujas tensadas."}],"fuentes":["Clasificación de Gustilo y Anderson de las fracturas abiertas.","Organización Mundial de la Salud: definición de osteoporosis.","Tema 5. Fracturas en adultos, PQRI 2026-2027 (Universidad Europea)."],"qcm":[{"pregunta":"¿Por qué hay que explorar y registrar siempre el estado neurovascular distal en fracturas desplazadas?","opciones":["Porque condiciona la clasificación de Gustilo","Para decidir el tipo de yeso","Solo por motivos estéticos","Para detectar lesiones y dejar constancia de que no son iatrogénicas"],"correcta":3,"explicacion":"Sobre todo en hombro, codo o rodilla hay que comprobar pulso y nervios distales y reflejarlo, dejando claro que una lesión no es iatrogénica.","por_opcion":["❌ No.","❌ No.","❌ No.","✅ Literal."]},{"pregunta":"Según el tema, ¿qué porcentaje de mujeres posmenopáusicas presentan osteoporosis?","opciones":["10 %","40 %","25 %","70 %"],"correcta":1,"explicacion":"Aproximadamente el 40 % de las mujeres posmenopáusicas presentan osteoporosis.","por_opcion":["❌ No.","✅ Literal.","❌ No.","❌ No."]},{"pregunta":"¿Cuál es la localización más frecuente de las fracturas por estrés?","opciones":["Tibia","Cuello femoral","Diáfisis femoral proximal","2.º metatarsiano"],"correcta":3,"explicacion":"El 2.º metatarsiano es la más frecuente; también cuello femoral, tibia y diáfisis femoral proximal.","por_opcion":["❌ Igual.","❌ Frecuente pero no la que más.","❌ Igual.","✅ Literal."]},{"pregunta":"En una fractura por estrés con dolor típico y radiografía normal, la prueba indicada es:","opciones":["Electromiografía","TC y/o RM","Repetir la RX al mes sin más","Densitometría"],"correcta":1,"explicacion":"La imagen radiográfica suele ser normal y se recurre a TC y/o RMN.","por_opcion":["❌ No.","✅ Literal.","❌ No es lo indicado.","❌ No."]},{"pregunta":"El mecanismo de flexión en un hueso largo produce típicamente:","opciones":["Tercer fragmento en ala de mariposa","Arrancamiento","Fractura espiroidea","Fractura en rodete"],"correcta":0,"explicacion":"En flexión la convexidad cede por tracción y al llegar a la concavidad el trazo se divide aislando una cuña.","por_opcion":["✅ Literal.","❌ Tracción.","❌ Torsión.","❌ Compresión infantil."]},{"pregunta":"¿Por qué la convexidad es la primera en romperse en una fractura por flexión?","opciones":["Porque tiene menos periostio","Porque es la zona de la línea neutra","Porque el hueso es menos resistente a la tracción que a la compresión","Porque sufre compresión"],"correcta":2,"explicacion":"La convexidad sufre tracción; como el tejido óseo resiste menos la tracción que la compresión, pierde la cohesión allí primero.","por_opcion":["❌ No.","❌ No.","✅ Literal.","❌ Sufre tracción."]},{"pregunta":"Una fractura abierta con herida grande, fragmentos expuestos y amplia denudación del periostio es Gustilo:","opciones":["IIIA","IIIC","II","IIIB"],"correcta":3,"explicacion":"IIIA: buena cobertura; IIIB: fragmentos expuestos y amplia denudación perióstica; IIIC: grave lesión arterial.","por_opcion":["❌ Buena cobertura.","❌ Lesión arterial.","❌ > 1 cm, poca lesión.","✅ Literal."]},{"pregunta":"En las fracturas Gustilo IIIC, el análisis citado muestra un porcentaje de amputaciones del:","opciones":["9 %","59 %","29 %","89 %"],"correcta":1,"explicacion":"El análisis de las IIIC acaba con un 59 % de amputaciones; es mejor una amputación temprana que tardía.","por_opcion":["❌ No.","✅ Literal.","❌ No.","❌ No."]},{"pregunta":"Una fractura oblicua de más de 45° se considera:","opciones":["Incompleta","Estable","Inestable","Patológica"],"correcta":2,"explicacion":"Estables: transversas u oblicuas \u003c 45°; inestables: oblicuas > 45°.","por_opcion":["❌ No.","❌ \u003c 45°.","✅ Literal.","❌ No."]},{"pregunta":"¿Qué técnica de imagen es de elección para detectar fracturas ocultas con edema óseo?","opciones":["RM","Radiografía simple","Ecografía","TC"],"correcta":0,"explicacion":"La RM se usa en fracturas por estrés, ocultas (edema óseo), con lesión de partes blandas y patológicas.","por_opcion":["✅ Literal.","❌ Puede ser normal.","❌ No se cita para esto.","❌ Fracturas complejas y articulares."]},{"pregunta":"¿Cuál es la complicación más frecuente de las fracturas según el tema?","opciones":["Rigidez","Pseudoartrosis","Sudeck","Osteomielitis"],"correcta":0,"explicacion":"La rigidez es la complicación más frecuente, en fases reductible, irreductible relativa e irreductible.","por_opcion":["✅ Literal.","❌ No.","❌ 2–3 %.","❌ No."]},{"pregunta":"¿Qué signo NO es propio de la pseudoartrosis?","opciones":["Esclerosis de los bordes","Cierre del canal medular por un opérculo","Callo hipertrófico doloroso en remodelación normal","Movilidad anómala indolora en el foco"],"correcta":2,"explicacion":"Signos de pseudoartrosis: canal medular cerrado, esclerosis de bordes con pseudocápsula y movilidad anómala indolora.","por_opcion":["❌ Es un signo.","❌ Es un signo.","✅ No lo es.","❌ Es un signo."]},{"pregunta":"Para que una fractura consolide, los fragmentos principales no deben estar separados más de:","opciones":["5 mm","1 mm","10 mm","2 cm"],"correcta":0,"explicacion":"Si la distancia supera los 5 mm la fractura no puede consolidar.","por_opcion":["✅ Literal.","❌ No.","❌ No.","❌ No."]},{"pregunta":"Al reducir una fractura, ¿qué desplazamiento se corrige en último lugar?","opciones":["Angulación","Acortamiento","Traslación lateral","Rotación"],"correcta":3,"explicacion":"La rotación es la más difícil, mal tolerada y no se corrige con el crecimiento: es lo último que se corrige.","por_opcion":["❌ No.","❌ Es lo primero.","❌ No.","✅ Literal."]},{"pregunta":"¿Cuál es el tratamiento de elección en las fracturas diafisarias de fémur y tibia?","opciones":["Enclavado endomedular","Placa de compresión","Obenque","Yeso circular"],"correcta":0,"explicacion":"El enclavado endomedular (Küntscher) es de elección en las diafisarias de húmero, fémur y tibia.","por_opcion":["✅ Literal.","❌ Epífiso-metafisarias y antebrazo.","❌ Para rótula y olécranon.","❌ No definitivo en inestables."]}],"asignatura":"Patología quirúrgica I","tema":5,"fecha":"2026-11-09"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips">${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  if(n===Q.length) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado! Marca el tema como « Maîtrisé » en Notion.':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
