<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 6. Fracturas infantiles · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 6. Fracturas infantiles","subtitulo":"Por qué el hueso del niño se rompe, consolida y remodela de forma distinta al del adulto, los tipos especiales de fractura infantil, la clasificación de Salter y Harris y los principios de tratamiento.","resumen":["**El niño no es un adulto en miniatura**: su hueso tiene **fisis**, un **periostio más grueso y vascularizado**, más **agua y componente orgánico** y **epífisis no osificadas** invisibles en la radiografía.","Ante una fractura, el hueso infantil **consolida rápido** (fémur: neonato 3–4 sem, adolescente 10–12, adulto 18–20), **remodela** sobre todo deformidades angulares (75 % en la fisis), se reduce con facilidad, puede presentar **hipercrecimiento** (tibia y fémur) o **lesión fisaria**, y rara vez queda rígido o atrófico.","El **42 % de los niños y el 27 % de las niñas** sufren alguna fractura en el crecimiento, con predominio **varón 2:1**, en **MMSS** (antebrazo 35 %) y entre los **6 y 11 años (40 %)**; el **20 %** de las fracturas en **menores de 2 años** se debe a **maltrato**.","Los tipos especiales son el **tallo verde** (angulación sin separación, deformidad grotesca), el **rodete o torus** (compresión de la cortical a 2–3 cm de la fisis, sin deformidad), la **deformidad plástica** (incurvación sin rotura) y la **epifisiolisis** (separación a través del cartílago de crecimiento).","**Salter y Harris** clasifica la epifisiolisis de **tipo I a V** con riesgo fisario creciente: II es la **más frecuente**, I la segunda, III–IV de peor pronóstico y V **siempre** lesiona la fisis; el tratamiento es mayoritariamente **ortopédico**, con **reducción perfecta**, cirugía si falla la reducción cerrada y **vigilancia de 1 año**."],"objetivos":["Explicar las cuatro características del hueso infantil y su repercusión biomecánica.","Describir las seis respuestas del hueso infantil ante la fractura con sus cifras.","Conocer la epidemiología y los signos de alarma de maltrato infantil.","Diferenciar tallo verde, torus, deformidad plástica y epifisiolisis.","Clasificar la epifisiolisis según Salter y Harris y decidir el tratamiento ortopédico o quirúrgico."],"ideas_clave":["El niño **no** es un adulto en miniatura: diferencias anatómicas, fisiológicas y biomecánicas.","La **capa hipertrófica** de la fisis es la zona más débil, donde ocurre la epifisiolisis.","Periostio grueso → reducción fácil, menos desplazamiento, consolidación rápida, a veces fiebre tras la fractura.","Hueso con menor módulo de elasticidad: más deformación antes de romperse y **más fractura fisaria que esguince o luxación**.","Remodelación: corrige sobre todo **angulaciones**, poco las **rotaciones**; mejor si quedan **> 2 años** de crecimiento.","**Salter-Harris II** es el más común; **V** tiene siempre lesión fisaria y diagnóstico tardío.","Sospecha de maltrato: > 2 fracturas, hematomas múltiples, lesiones en distintos estadios, retraso injustificado.","Cirugía si no se logra reducción cerrada, hay tendencia al desplazamiento o se exige reducción anatómica, **siempre evitando el cartílago de crecimiento**."],"secciones":[{"id":"generalidades","titulo":"Generalidades: la fractura en el niño","bloques":[{"tipo":"parrafo","texto":"La idea guía del tema es que **el niño NO es un adulto en miniatura**. Una fractura se define como la **solución de continuidad total o parcial de un hueso**; en el niño, la **fractura infantil** es la pérdida de la continuidad de la estructura normal de un hueso **sumada a la alteración de los tejidos blandos y neurovasculares circundantes**."},{"tipo":"definicion","termino":"Fractura infantil","texto":"Pérdida de la continuidad de la estructura normal de un hueso en crecimiento, **junto con** la afectación de partes blandas y estructuras neurovasculares vecinas."},{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Anatómicas","texto":"Fisis, epífisis cartilaginosas, periostio grueso."},{"etiqueta":"2","titulo":"Fisiológicas","texto":"Metabolismo óseo muy activo: consolidación y remodelación rápidas."},{"etiqueta":"3","titulo":"Biomecánicas","texto":"Hueso más poroso y elástico, que se deforma más antes de romperse."}]}]},{"id":"hueso-infantil","titulo":"Características del hueso infantil","bloques":[{"tipo":"tabla","titulo":"Las cuatro características del hueso infantil","columnas":["Característica","Consecuencia clínica"],"filas":[["1. Cartílago de crecimiento (fisis)","Crecimiento en longitud; zona vulnerable a la epifisiolisis"],["2. Periostio más grueso y vascularizado","Reducción y mantenimiento fáciles, consolidación rápida"],["3. Composición más rica en agua y componente orgánico","Más deformación antes de romperse; menos conminución"],["4. Epífisis no osificadas en niños pequeños","Fracturas que pueden pasar desapercibidas en la radiografía"]]},{"tipo":"definicion","termino":"Fisis o cartílago de crecimiento","texto":"Placa cartilaginosa situada **entre la epífisis y la metáfisis** por la que el hueso **crece en longitud**."},{"tipo":"figura","pagina":10,"pie":"Placa de crecimiento: a la izquierda su posición entre epífisis y metáfisis (y la apófisis de inserción tendinosa); a la derecha, el corte histológico con las zonas proliferativa e hipertrófica sobre el hueso trabecular.","src":"img/patologia-quirurgica-i-t6-tema-6-fracturas-infantiles-p10.jpg"},{"tipo":"tabla","titulo":"Capas del cartílago de crecimiento (de epífisis a metáfisis)","columnas":["Capa","Qué ocurre"],"filas":[["Germinativa","Zona quiescente donde se forman las células cartilaginosas"],["Proliferativa","Las células se multiplican"],["Hipertrófica","Las células crecen en tamaño; **lugar más débil**, donde sucede la epifisiolisis"],["Calcificación","Próxima a la metáfisis, donde se osifica"]]},{"tipo":"alerta","texto":"La epifisiolisis se produce en la **capa hipertrófica** (la más débil), no en la germinativa ni en la de calcificación. Pregunta muy frecuente."},{"tipo":"parrafo","texto":"El **periostio** es la membrana que envuelve los huesos: **más grueso en la diáfisis** y más delgado en metáfisis y epífisis, aporta **vascularización** y actúa como **reservorio celular** para la reparación ósea. En el niño es más grueso y vascularizado, lo que **facilita la reducción**, da un **soporte extra** que evita el desplazamiento de fragmentos, acelera el crecimiento y la remodelación, produce una **mayor reacción inflamatoria** (a veces **fiebre tras la fractura**), puede **estimular el crecimiento fisario** y logra una **consolidación rápida**."},{"tipo":"tabla","titulo":"Composición rica en agua y componente orgánico","columnas":["Propiedad","Efecto"],"filas":[["Mayor proporción de células, menor mineralización","Hueso más poroso, sobre todo en la metáfisis"],["Módulo de elasticidad más bajo","Absorbe más energía y se deforma más antes de romperse"],["Menor tendencia a la fractura conminuta","Patrones incompletos (tallo verde, torus, deformidad plástica)"],["Fisis más débil que ligamentos","Más frecuente la fractura fisaria que el esguince o la luxación"]]},{"tipo":"parrafo","texto":"Las **epífisis de los huesos largos** se osifican siguiendo un **patrón cronológico definido** que sustituye el tejido cartilaginoso por hueso. Como el **cartílago no es visible en la radiografía**, algunas fracturas pueden **pasar desapercibidas** en niños pequeños."},{"tipo":"figura","pagina":16,"pie":"Osificación progresiva de la rodilla desde el recién nacido hasta los 15,5–18 años: los núcleos de osificación epifisarios aparecen y crecen con la edad; antes de ello la epífisis es cartílago radiotransparente.","src":"img/patologia-quirurgica-i-t6-tema-6-fracturas-infantiles-p16.jpg"},{"tipo":"perla","texto":"Ante un niño pequeño con dolor e impotencia funcional tras un traumatismo y **radiografía normal**, no descartes la fractura: la epífisis cartilaginosa no se ve. Trata como fractura hasta que se demuestre lo contrario y evita movilizaciones forzadas."}]},{"id":"respuesta","titulo":"Respuesta del hueso infantil ante las fracturas","bloques":[{"tipo":"esquema","titulo":"Seis respuestas del hueso infantil a la fractura","mermaid":"flowchart TD\n  A[\"Fractura en hueso infantil\"] --> B[\"1. Consolidacion rapida\"]\n  A --> C[\"2. Remodelacion\"]\n  A --> D[\"3. Facil reduccion y mantenimiento\"]\n  A --> E[\"4. Hipercrecimiento en longitud\"]\n  A --> F[\"5. Posible lesion fisaria\"]\n  A --> G[\"6. Rigidez y atrofia poco frecuentes\"]\n  C --> C1[\"Angulaciones si, rotaciones poco\"]\n  E --> E1[\"Tibia y femur\"]\n  F --> F1[\"Crecimiento anomalo y deformidad\"]","pie":"Cuatro respuestas son ventajas (1, 2, 3 y 6); dos son riesgos propios del niño (4 y 5)."},{"tipo":"tabla","titulo":"Tiempo de consolidación de una fractura de fémur","columnas":["Edad","Consolidación"],"filas":[["Neonato","3–4 semanas"],["Adolescente","10–12 semanas"],["Adulto","18–20 semanas"]]},{"tipo":"dato","valor":"3–4 / 10–12 / 18–20 sem","texto":"Consolidación del fémur en neonato, adolescente y adulto."},{"tipo":"definicion","termino":"Remodelación","texto":"Fenómeno por el que, durante el crecimiento, se **corrigen deformidades tras una fractura**. Corrige sobre todo las **deformidades angulares** y **poco las rotaciones**; es mayor si quedan **más de 2 años de crecimiento**."},{"tipo":"dato","valor":"75 % fisis · 25 % foco","texto":"Reparto de la remodelación: el 75 % sucede en la fisis y el 25 % en el foco de fractura."},{"tipo":"parrafo","texto":"La **facilidad de reducción y mantenimiento** se debe a la **menor masa muscular**, que permite manipular los fragmentos con más facilidad, y al **manguito perióstico íntegro**, que facilita la reducción y la mantiene. El **hipercrecimiento en longitud** es un crecimiento excesivo del hueso fracturado: frecuente en **tibia y fémur**, **más intenso si hay tratamiento quirúrgico** y **poco relevante en extremidades superiores**."},{"tipo":"parrafo","texto":"Si el trazo de fractura **cruza la fisis**, esta puede lesionarse y provocar un **crecimiento anómalo y deformidad** en el crecimiento posterior. En la epifisiolisis el riesgo de lesión aumenta del **tipo I (bajo riesgo) al tipo V (alto riesgo)**. Por último, la **rigidez y la atrofia son poco frecuentes**: los niños toleran muy bien las inmovilizaciones prolongadas, presentan menos rigidez articular y responden bien a la rehabilitación."},{"tipo":"figura","pagina":24,"pie":"Secuela de lesión fisaria: tibia vara en un niño de 13 años, 12 meses después de un traumatismo grave de rodilla (deformidad tibial proximal de 22°); la resonancia muestra el puente óseo fisario causante (flechas).","src":"img/patologia-quirurgica-i-t6-tema-6-fracturas-infantiles-p24.jpg"},{"tipo":"alerta","texto":"La remodelación **no corrige bien las rotaciones**: una mala rotación debe corregirse en la reducción, no confiar en el crecimiento. Además, el hipercrecimiento es relevante en **miembro inferior**, no en el superior."},{"tipo":"perla","texto":"En rehabilitación infantil puedes ser menos agresivo que en el adulto con la movilización tras la inmovilización (la rigidez es rara), pero debes **vigilar la longitud y el eje** de los miembros inferiores tras fracturas de fémur o tibia por el riesgo de hipercrecimiento o lesión fisaria."}]},{"id":"epidemiologia","titulo":"Epidemiología y síndrome del niño maltratado","bloques":[{"tipo":"dato","valor":"42 % ♂ · 27 % ♀","texto":"Porcentaje de niños y niñas que sufren alguna fractura durante su crecimiento."},{"tipo":"tabla","titulo":"Frecuencia de fractura por edad","columnas":["Edad","Porcentaje"],"filas":[["Antes de los 2 años","4 %"],["De 2 a 6 años","16 %"],["De 6 a 11 años","40 %"],["Después de los 11 años","20 %"]]},{"tipo":"tabla","titulo":"Datos epidemiológicos generales","columnas":["Parámetro","Dato"],"filas":[["Frecuencia","20–25 % de todas las fracturas de la infancia"],["Edad","Cualquiera, incluso obstétrica; más frecuente en pre- o adolescencia"],["Sexo","2:1 a favor del varón"],["Localización","Más frecuente MMSS: radio distal, falanges de los dedos y tibia distal"]]},{"tipo":"tabla","titulo":"Distribución por localización","columnas":["Localización","Porcentaje"],"filas":[["Antebrazo","35 %"],["Manos y falanges","18 %"],["Tibia y peroné","15 %"],["Húmero","10 %"],["Clavícula","8 %"],["Fémur","4 %"]]},{"tipo":"alerta","texto":"No confundas las dos cifras de edad: el **40 %** de las fracturas ocurre **entre los 6 y 11 años**, mientras que el **20 %** es la proporción **después de los 11 años** y, por otra parte, el **20 %** de las fracturas en **menores de 2 años** se debe a **maltrato**."},{"tipo":"definicion","termino":"Síndrome del niño maltratado","texto":"El **20 % de las fracturas en menores de 2 años** se debe a maltrato. Alta sospecha si hay **más de dos fracturas**, **múltiples hematomas**, **hematomas o callos de fractura en diferentes estadios de evolución** o **retraso injustificado en el tratamiento**."},{"tipo":"perla","texto":"El fisioterapeuta que ve a un lactante con varias fracturas o callos en distintas fases de consolidación debe comunicarlo al equipo médico: es un signo de alarma de maltrato con obligación de protección del menor."}]},{"id":"tipos-especiales","titulo":"Tipos especiales de fracturas infantiles","bloques":[{"tipo":"parrafo","texto":"Gracias a su elasticidad y a su periostio, el hueso infantil produce cuatro patrones propios: **tallo verde**, **rodete o torus**, **deformidad plástica** y **epifisiolisis** (esta última se desarrolla en la sección siguiente)."},{"tipo":"tabla","titulo":"Comparación de tallo verde, torus y deformidad plástica","columnas":["","Tallo verde","Rodete o torus","Deformidad plástica"],"filas":[["Mecanismo","Angulación sin separación: periostio íntegro y menor mineralización","Trauma indirecto por compresión; fallo de la cortical a 2–3 cm de la fisis","Traumatismo longitudinal que incurva el hueso sin romperlo pero supera su recuperación elástica"],["Localización","Diáfisis finas y metáfisis de huesos largos: radio, cúbito, clavícula (lesión obstétrica)","Metáfisis próxima a la fisis (radio distal)","Huesos largos: radio, cúbito, peroné"],["Clínica","Deformidad grotesca","Dolor, impotencia funcional y signos locales sin deformidad ostensible","Escaso dolor e impotencia funcional si no hay fractura asociada"],["Reducción","Fácil, mediante manipulación","No requiere","Fuerza mantenida unos minutos para enderezar la curvatura"],["Tratamiento","Yeso o férula 3–4 semanas","Yeso o férula corto 3 semanas","Reducción e inmovilización"],["Pronóstico","Excelente","Excelente","—"]]},{"tipo":"figura","pagina":33,"pie":"Fractura en tallo verde de radio y cúbito: el hueso se angula y la cortical de la convexidad se rompe mientras la de la concavidad se mantiene (flechas).","src":"img/patologia-quirurgica-i-t6-tema-6-fracturas-infantiles-p33.jpg"},{"tipo":"definicion","termino":"Rodete o torus","texto":"Del latín *tori*, protuberancia o abultamiento. Fallo de la cortical por **compresión** a **2–3 cm de la fisis**: se **arruga la cortical dorsal** mientras la cortical y el periostio del lado opuesto quedan **intactos**."},{"tipo":"figura","pagina":37,"pie":"Deformidad plástica del antebrazo: radio y cúbito incurvados en arco de amplio radio sin trazo de fractura visible.","src":"img/patologia-quirurgica-i-t6-tema-6-fracturas-infantiles-p37.jpg"},{"tipo":"alerta","texto":"El **tallo verde** produce **deformidad grotesca**; el **torus** **no** tiene deformidad ostensible y **no requiere reducción**. La **deformidad plástica** no tiene trazo de fractura y se reduce con **fuerza mantenida unos minutos**, no con una maniobra brusca."},{"tipo":"dato","valor":"3–4 sem / 3 sem","texto":"Inmovilización del tallo verde (yeso o férula 3–4 semanas) y del torus (yeso o férula corto 3 semanas)."},{"tipo":"parrafo","texto":"La **deformidad plástica** es típica de **niños pequeños**, aunque también se ha descrito aisladamente en **adultos jóvenes**. El traumatismo, directo o indirecto, supera la capacidad de recuperación elástica del hueso sin llegar a su punto de rotura, por lo que queda una **incurvación de amplio radio**."}]},{"id":"epifisiolisis","titulo":"Epifisiolisis: clasificación de Salter y Harris","bloques":[{"tipo":"definicion","termino":"Epifisiolisis","texto":"**Separación traumática de la epífisis a través del cartílago de crecimiento**, con posibilidad de **cierre fisario** durante la consolidación y consiguiente **crecimiento anómalo**."},{"tipo":"parrafo","texto":"La **clasificación de Salter y Harris** valora **3 parámetros**: **anatomía de la lesión**, **clínica** y **pronóstico**. Cuanto más atraviesa el trazo la fisis y la epífisis hacia la articulación, o si hay compresión de la fisis, mayor es el riesgo de lesión del cartílago de crecimiento."},{"tipo":"figura","pagina":40,"pie":"Los cinco tipos de Salter y Harris: I separación pura por la fisis; II fisis + fragmento metafisario; III fisis + epífisis hasta la articulación; IV trazo que cruza epífisis, fisis y metáfisis; V compresión de la fisis.","src":""},{"tipo":"tabla","titulo":"Clasificación de Salter y Harris","columnas":["Tipo","Anatomía","Frecuencia / clínica","Pronóstico"],"filas":[["I","Separación epifiso-metafisaria completa; normalmente conserva el periostio","Segunda en frecuencia","Bueno"],["II","Separación de parte de la línea epifiso-metafisaria con trazo en la metáfisis","La más común; > 10 años y tobillos","Bueno"],["III","Separación de parte de la línea con trazo en la epífisis hasta la articulación","Más rara que I y II","Peor; alto riesgo de lesión fisaria"],["IV","La línea de fractura atraviesa epífisis y metáfisis","Más rara que I y II; frecuente en extremidad inferior del húmero (fracturas condíleas)","Peor; alto riesgo de lesión fisaria"],["V","Traumatismo fisario por compresión; no suele verse en Rx","Muy rara (algunos autores dudan que exista); diagnóstico tardío por su secuela","Muy malo; lesión fisaria siempre"]]},{"tipo":"esquema","titulo":"Riesgo fisario y manejo según Salter y Harris","mermaid":"flowchart LR\n  A[\"Epifisiolisis\"] --> B[\"Tipos I y II\"]\n  A --> C[\"Tipos III y IV\"]\n  A --> D[\"Tipo V\"]\n  B --> B1[\"Bajo riesgo: mejor pronostico\"]\n  C --> C1[\"Trazo articular: alto riesgo\"]\n  D --> D1[\"Compresion: lesion fisaria siempre\"]\n  B1 --> E[\"Reduccion perfecta en forma y tiempo\"]\n  C1 --> E\n  D1 --> E\n  E --> F[\"Vigilancia 1 ano\"]","pie":"Riesgo creciente de I a V; en todos los casos, reducción perfecta y seguimiento de un año."},{"tipo":"alerta","texto":"El tipo **más frecuente es el II**, no el I (el I es el **segundo**). El tipo **V** **no se ve en la radiografía** inicial y se diagnostica tarde, por su **secuela** (deformidad o acortamiento)."},{"tipo":"lista","items":["**Siempre reducción perfecta** para evitar lesiones en el crecimiento, **en forma y en tiempo**.","**Mejor pronóstico**: tipos I y II.","**Peor pronóstico**: tipos III, IV y V.","**Vigilancia durante 1 año** para detectar alteraciones de la fisis."]},{"tipo":"dato","valor":"1 año","texto":"Tiempo de vigilancia tras una epifisiolisis para detectar alteraciones fisarias."}]},{"id":"tratamiento","titulo":"Tratamiento de las fracturas infantiles","bloques":[{"tipo":"tabla","titulo":"Tratamiento ortopédico frente a quirúrgico","columnas":["","Ortopédico","Quirúrgico"],"filas":[["Cuándo","La gran mayoría de las veces: reducción sencilla","No se consigue la reducción cerrada; tendencia al desplazamiento; localizaciones que exigen reducción anatómica"],["Por qué funciona / técnicas","Periostio grueso que impide la separación y mantiene la reducción; remodelación que tolera ciertas deformidades","Técnicas percutáneas o abiertas"],["Ventajas / precauciones","Consolidación rápida y segura; menos tiempo de inmovilización; pseudoartrosis y rigideces excepcionales","Evitar siempre lesionar el cartílago de crecimiento"]]},{"tipo":"tarjetas","items":[{"etiqueta":"OS 1","titulo":"Agujas de Kirschner","texto":"Fijación percutánea habitual en el niño."},{"etiqueta":"OS 2","titulo":"Tornillos","texto":"Osteosíntesis de fragmentos."},{"etiqueta":"OS 3","titulo":"Enclavijamiento intramedular","texto":"Clavo intramedular (fémur en mayores de 13–14 años) o clavos elásticos."},{"etiqueta":"OS 4","titulo":"Fijadores externos","texto":"Estabilización a distancia del foco."}]},{"tipo":"dato","valor":"> 13–14 años","texto":"Edad a partir de la cual se indica el clavo intramedular en el fémur; antes se usan clavos elásticos."},{"tipo":"esquema","titulo":"Algoritmo de decisión terapéutica","mermaid":"flowchart TD\n  A[\"Fractura infantil\"] --> B{\"Reduccion cerrada posible y estable\"}\n  B -->|\"Si\"| C[\"Tratamiento ortopedico: yeso o ferula\"]\n  B -->|\"No\"| D[\"Tratamiento quirurgico\"]\n  E[\"Requiere reduccion anatomica\"] --> D\n  D --> F[\"Percutaneo o abierto\"]\n  F --> G[\"Kirschner, tornillos, clavos, fijador externo\"]\n  G --> H[\"Respetar el cartilago de crecimiento\"]","pie":"La mayoría se resuelve con reducción cerrada; la cirugía queda para fracasos, inestabilidad o reducción anatómica obligada."},{"tipo":"alerta","texto":"En el niño las **pseudoartrosis** y las **rigideces post-inmovilización** son **excepcionales**: si aparecen en una pregunta como complicación típica, es una trampa. La complicación propia es la **alteración del crecimiento**."},{"tipo":"perla","texto":"Tras retirar la inmovilización, el niño suele recuperar la movilidad espontáneamente con el juego: prioriza la actividad funcional y lúdica y el control del crecimiento y del eje, en lugar de una movilización pasiva intensa."}]}],"caso_clinico":{"titulo":"Niño de 11 años con fractura de tobillo jugando al fútbol","presentacion":"Niño de 11 años que sufre un traumatismo en el tobillo jugando al fútbol. La radiografía muestra una separación de parte de la fisis tibial distal con un pequeño fragmento metafisario. Se trata con reducción cerrada e inmovilización. A las 4 semanas acude a fisioterapia.","preguntas":[{"pregunta":"¿Qué tipo de Salter y Harris presenta y cuál es su pronóstico?","respuesta":"Un **tipo II**: separación de parte de la línea epifiso-metafisaria con trazo en la metáfisis. Es el tipo más común, típico de > 10 años y del tobillo, y tiene **buen pronóstico**."},{"pregunta":"¿Qué seguimiento hay que hacer y por qué?","respuesta":"Vigilancia durante **1 año** para detectar alteraciones de la fisis, porque toda epifisiolisis puede producir un cierre fisario con crecimiento anómalo, aunque el riesgo sea menor en los tipos I y II."},{"pregunta":"¿Qué esperas en cuanto a rigidez y cómo enfocas la rehabilitación?","respuesta":"Los niños toleran bien la inmovilización y la rigidez es poco frecuente con buena respuesta a la rehabilitación; el enfoque es funcional y progresivo, vigilando la longitud y el eje del miembro."}]},"preguntate":[{"pregunta":"Enumera las cuatro características del hueso infantil.","respuesta":"Cartílago de crecimiento (fisis), periostio más grueso y vascularizado, composición más rica en agua y componente orgánico, y epífisis no osificadas en niños pequeños."},{"pregunta":"Nombra las capas de la fisis y di cuál es la más débil.","respuesta":"Germinativa, proliferativa, hipertrófica y de calcificación; la hipertrófica es la más débil y donde se produce la epifisiolisis."},{"pregunta":"¿Qué ventajas aporta el periostio grueso del niño?","respuesta":"Facilita la reducción, evita el desplazamiento de fragmentos, da mayor vascularización, consolidación rápida y remodelación activa; también más reacción inflamatoria e incluso fiebre."},{"pregunta":"¿Por qué en el niño es más frecuente la fractura fisaria que el esguince?","respuesta":"Porque la fisis es más débil que los ligamentos, y el hueso, con menor módulo de elasticidad, absorbe energía y se deforma antes de romperse."},{"pregunta":"¿Qué deformidades corrige la remodelación y de qué depende?","respuesta":"Sobre todo las angulares, poco las rotacionales; es mayor si quedan más de 2 años de crecimiento, y ocurre un 75 % en la fisis y un 25 % en el foco."},{"pregunta":"Compara el tiempo de consolidación del fémur en neonato, adolescente y adulto.","respuesta":"Neonato 3–4 semanas, adolescente 10–12 semanas y adulto 18–20 semanas."},{"pregunta":"¿Cuándo debes sospechar un síndrome del niño maltratado?","respuesta":"En menores de 2 años con más de dos fracturas, hematomas múltiples, hematomas o callos en distintos estadios o retraso injustificado en el tratamiento."},{"pregunta":"Diferencia tallo verde y torus.","respuesta":"El tallo verde es una angulación sin separación con deformidad grotesca que se reduce manipulando; el torus es un abultamiento de la cortical por compresión a 2–3 cm de la fisis, sin deformidad y sin necesidad de reducción."},{"pregunta":"Describe los cinco tipos de Salter y Harris.","respuesta":"I separación completa por la fisis; II fisis con trazo metafisario; III fisis con trazo epifisario hasta la articulación; IV trazo que cruza epífisis y metáfisis; V compresión fisaria."},{"pregunta":"¿Cuáles son las indicaciones del tratamiento quirúrgico?","respuesta":"Fracaso de la reducción cerrada, tendencia al desplazamiento y localizaciones que exigen reducción anatómica, siempre evitando lesionar el cartílago de crecimiento."}],"glosario":[{"termino":"Fisis","definicion":"Cartílago de crecimiento entre epífisis y metáfisis responsable del crecimiento longitudinal."},{"termino":"Periostio","definicion":"Membrana que envuelve el hueso, aporta vascularización y células para la reparación."},{"termino":"Módulo de elasticidad","definicion":"Rigidez del material; más bajo en el hueso infantil, que se deforma más antes de romperse."},{"termino":"Remodelación","definicion":"Corrección espontánea de deformidades tras una fractura durante el crecimiento."},{"termino":"Hipercrecimiento","definicion":"Crecimiento excesivo en longitud del hueso fracturado, frecuente en tibia y fémur."},{"termino":"Tallo verde","definicion":"Fractura con angulación sin separación por periostio íntegro."},{"termino":"Torus","definicion":"Fractura por compresión con abultamiento de la cortical cerca de la fisis."},{"termino":"Deformidad plástica","definicion":"Incurvación traumática de un hueso largo sin rotura."},{"termino":"Epifisiolisis","definicion":"Separación traumática de la epífisis a través del cartílago de crecimiento."},{"termino":"Salter y Harris","definicion":"Clasificación en cinco tipos de las lesiones fisarias según anatomía, clínica y pronóstico."},{"termino":"Pseudoartrosis","definicion":"Falta de consolidación de una fractura; excepcional en el niño."},{"termino":"Agujas de Kirschner","definicion":"Material de osteosíntesis percutánea muy usado en fracturas infantiles."}],"fuentes":["Salter, R. B. y Harris, W. R.: clasificación de las lesiones fisarias.","Universidad Europea. Patología quirúrgica I (PQRI 2026-2027) — Tema 6. Fracturas infantiles."],"qcm":[{"pregunta":"¿En qué capa del cartílago de crecimiento se produce típicamente la epifisiolisis?","opciones":["Capa hipertrófica","Capa germinativa","Capa proliferativa","Capa de calcificación"],"correcta":0,"explicacion":"La capa hipertrófica, donde las células crecen en tamaño, es el lugar más débil de la fisis y donde sucede la epifisiolisis.","por_opcion":["✅ Zona más débil: lugar de la epifisiolisis.","❌ Zona quiescente donde se forman las células cartilaginosas.","❌ Zona donde las células se multiplican.","❌ Zona próxima a la metáfisis donde se osifica."]},{"pregunta":"¿Cuál de los siguientes efectos NO se atribuye al periostio grueso y vascularizado del niño?","opciones":["Soporte extra que evita el desplazamiento","Mayor tendencia a la pseudoartrosis","Mayor reacción inflamatoria, a veces con fiebre","Posibilidad de estimular el crecimiento fisario"],"correcta":1,"explicacion":"El periostio grueso favorece una consolidación rápida; las pseudoartrosis son excepcionales en el niño.","por_opcion":["❌ Sí se atribuye: evita el desplazamiento de fragmentos.","✅ Las pseudoartrosis son excepcionales en el niño.","❌ Sí se atribuye: mayor reacción inflamatoria y fiebre tras la fractura.","❌ Sí se atribuye: puede estimular el crecimiento fisario."]},{"pregunta":"¿Por qué en el niño es más frecuente una fractura fisaria que un esguince o una luxación?","opciones":["Porque el cartílago no es visible en la radiografía","Porque su periostio es más delgado en la epífisis","Porque la fisis es una zona más débil y el hueso es más elástico","Porque sus ligamentos son más débiles que el hueso"],"correcta":2,"explicacion":"Por su composición rica en agua y componente orgánico, con menor módulo de elasticidad, el hueso infantil se deforma antes de romperse y es más frecuente la fractura fisaria que el esguince o la luxación.","por_opcion":["❌ Explica que pasen desapercibidas, no su frecuencia.","❌ El periostio es más fino en metáfisis y epífisis, pero no explica la frecuencia.","✅ Fisis vulnerable y hueso elástico.","❌ Es al revés: la fisis cede antes que los ligamentos."]},{"pregunta":"¿Cuánto tarda aproximadamente en consolidar una fractura de fémur en un adolescente?","opciones":["18–20 semanas","3–4 semanas","10–12 semanas","6–8 semanas"],"correcta":2,"explicacion":"Consolidación del fémur: neonato 3–4 semanas, adolescente 10–12 semanas y adulto 18–20 semanas.","por_opcion":["❌ Corresponde al adulto.","❌ Corresponde al neonato.","✅ Adolescente: 10–12 semanas.","❌ No es una cifra del temario."]},{"pregunta":"Respecto a la remodelación del hueso infantil, es correcto que:","opciones":["Es más relevante en extremidades superiores","Corrige igual las deformidades angulares y rotacionales","Sucede en un 75 % en el foco de fractura","Es mayor si quedan más de 2 años de crecimiento"],"correcta":3,"explicacion":"La remodelación corrige sobre todo angulaciones y poco las rotaciones; es mayor si quedan más de 2 años de crecimiento, y el 75 % ocurre en la fisis.","por_opcion":["❌ La poca relevancia en MMSS se refiere al hipercrecimiento, no a la remodelación.","❌ Corrige poco las rotaciones.","❌ El 75 % sucede en la fisis y el 25 % en el foco.","✅ Mayor con más de 2 años de crecimiento restante."]},{"pregunta":"El hipercrecimiento en longitud tras una fractura infantil:","opciones":["Es frecuente en húmero y radio","Es la complicación típica del torus","Es más intenso si hay tratamiento quirúrgico","Se debe al cierre precoz de la fisis"],"correcta":2,"explicacion":"El hipercrecimiento sucede con frecuencia en tibia y fémur, es más intenso si hay tratamiento quirúrgico y es poco relevante en extremidades superiores.","por_opcion":["❌ Es poco relevante en extremidades superiores.","❌ El temario no lo asocia al torus.","✅ Más intenso con tratamiento quirúrgico.","❌ El cierre fisario produce acortamiento o deformidad, no hipercrecimiento."]},{"pregunta":"¿Entre qué edades se concentra el mayor porcentaje de fracturas infantiles?","opciones":["De 2 a 6 años","De 6 a 11 años","Antes de los 2 años","Después de los 11 años"],"correcta":1,"explicacion":"Antes de los 2 años 4 %, de 2 a 6 años 16 %, de 6 a 11 años 40 % y después de los 11 años 20 %.","por_opcion":["❌ 16 %.","✅ 40 %.","❌ 4 %.","❌ 20 %."]},{"pregunta":"¿Cuál es la localización más frecuente de las fracturas infantiles según su distribución?","opciones":["Antebrazo","Clavícula","Manos y falanges","Tibia y peroné"],"correcta":0,"explicacion":"Distribución: antebrazo 35 %, manos y falanges 18 %, tibia y peroné 15 %, húmero 10 %, clavícula 8 %, fémur 4 %.","por_opcion":["✅ 35 %.","❌ 8 %.","❌ 18 %.","❌ 15 %."]},{"pregunta":"Lactante de 14 meses con dos fracturas y callos en diferente estadio de consolidación. ¿Qué dato del temario justifica la sospecha de maltrato?","opciones":["La relación varón:mujer es 2:1","El 20 % de las fracturas en menores de 2 años se debe a maltrato","El 4 % de las fracturas ocurre antes de los 2 años","El 42 % de los niños sufre alguna fractura"],"correcta":1,"explicacion":"El 20 % de las fracturas en menores de 2 años se debe a maltrato; la presencia de callos en diferentes estadios es un criterio de alta sospecha.","por_opcion":["❌ Es la distribución por sexo.","✅ Dato específico del síndrome del niño maltratado.","❌ Es la frecuencia de fractura por edad, no un dato de maltrato.","❌ Es la prevalencia general en varones."]},{"pregunta":"¿Qué rasgo distingue la fractura en rodete o torus del tallo verde?","opciones":["El torus se inmoviliza 6 semanas","El torus requiere reducción por manipulación","El torus produce deformidad grotesca","El torus no presenta deformidad ostensible ni requiere reducción"],"correcta":3,"explicacion":"El torus, por compresión a 2–3 cm de la fisis, causa dolor, impotencia funcional y signos locales sin deformidad ostensible y no requiere reducción; se trata con yeso o férula corto 3 semanas.","por_opcion":["❌ Se inmoviliza 3 semanas.","❌ La reducción por manipulación es del tallo verde.","❌ La deformidad grotesca es propia del tallo verde.","✅ Sin deformidad ni reducción."]},{"pregunta":"Una deformidad plástica del antebrazo se reduce mediante:","opciones":["Osteotomía abierta sistemática","Manipulación brusca y rápida del foco","Tracción cutánea durante varios días","Fuerza mantenida unos minutos para enderezar la curvatura"],"correcta":3,"explicacion":"La deformidad plástica es una incurvación sin rotura; su reducción consiste en aplicar fuerza mantenida unos minutos para enderezar la curvatura.","por_opcion":["❌ No es el tratamiento indicado en el temario.","❌ La maniobra es sostenida, no brusca.","❌ El temario no describe tracción.","✅ Fuerza mantenida unos minutos."]},{"pregunta":"¿Cuál es el tipo de epifisiolisis más común según Salter y Harris?","opciones":["Tipo III","Tipo I","Tipo IV","Tipo II"],"correcta":3,"explicacion":"El tipo II (trazo por la fisis con fragmento metafisario) es el más común, típico de mayores de 10 años y del tobillo; el tipo I es el segundo en frecuencia.","por_opcion":["❌ Más raro que I y II.","❌ Segundo en frecuencia.","❌ Más raro que I y II.","✅ El más común."]},{"pregunta":"Fractura condílea de la extremidad inferior del húmero cuyo trazo atraviesa epífisis y metáfisis. ¿Qué tipo de Salter y Harris es y qué pronóstico tiene?","opciones":["Tipo III, buen pronóstico","Tipo V, lesión fisaria siempre","Tipo II, buen pronóstico","Tipo IV, alto riesgo de lesión fisaria"],"correcta":3,"explicacion":"En el tipo IV la línea de fractura atraviesa epífisis y metáfisis; es frecuente en la extremidad inferior del húmero (fracturas condíleas) y tiene peor pronóstico con alto riesgo de lesión fisaria.","por_opcion":["❌ El tipo III no cruza la metáfisis y su pronóstico es peor, no bueno.","❌ El tipo V es una compresión fisaria sin trazo visible.","❌ El tipo II no afecta a la epífisis.","✅ Tipo IV, peor pronóstico."]},{"pregunta":"¿Qué característica corresponde al tipo V de Salter y Harris?","opciones":["Traumatismo por compresión que no suele verse en Rx y se diagnostica por su secuela","Es el tipo más frecuente en el tobillo","Trazo epifisario hasta la articulación con buen pronóstico","Separación epifiso-metafisaria completa con periostio conservado"],"correcta":0,"explicacion":"El tipo V es un traumatismo fisario por compresión, muy raro, que no suele verse en la radiografía y se diagnostica tarde por su secuela; siempre hay lesión fisaria.","por_opcion":["✅ Compresión invisible en Rx, diagnóstico tardío.","❌ El más frecuente en el tobillo es el tipo II.","❌ El trazo epifisario hasta la articulación es el tipo III, de peor pronóstico.","❌ Describe el tipo I."]},{"pregunta":"¿Cuál de las siguientes situaciones es indicación de tratamiento quirúrgico en una fractura infantil?","opciones":["Tendencia al desplazamiento tras la reducción","Deformidad angular en un niño con más de 2 años de crecimiento","Fractura en rodete del radio distal","Fiebre tras la fractura"],"correcta":0,"explicacion":"La cirugía está indicada cuando no se consigue la reducción cerrada, hay tendencia al desplazamiento o la localización exige reducción anatómica.","por_opcion":["✅ Tendencia al desplazamiento: indicación quirúrgica.","❌ La remodelación tolera ciertas deformidades angulares.","❌ El torus no requiere reducción y se trata con yeso corto.","❌ La fiebre es una reacción inflamatoria posible del periostio."]}],"asignatura":"Patología quirúrgica I","tema":6,"fecha":"2026-11-10"}</script>

<script>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;

    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';

    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),

document.getElementById('app').innerHTML = `

  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
