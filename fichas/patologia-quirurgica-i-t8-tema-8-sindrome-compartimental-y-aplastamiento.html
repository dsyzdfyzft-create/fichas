<script id="datos" type="application/json">{"titulo":"Tema 8. Síndrome compartimental y aplastamiento","subtitulo":"Aumento de presión en una celda fascial cerrada que compromete la perfusión capilar: formas aguda, por aplastamiento y crónica, con su diagnóstico clínico y la fasciotomía como tratamiento.","resumen":["El síndrome compartimental es el **aumento de presión dentro de un espacio anatómico cerrado** (celda fascial poco elástica) que reduce la perfusión capilar y causa isquemia de músculos y nervios; afecta sobre todo a **pierna y antebrazo** y en el **70 %** es de origen traumático.","Por encima de **30 mmHg** se colapsan linfáticos y arteriolas: la secuencia es ↑presión compartimental → ↑presión venosa → ↓flujo → ↓perfusión tisular; el músculo tolera **4 h** (reversible) y a las **8 h** el daño es irreversible, el nervio a **6-8 h** sufre axonotmesis.","El diagnóstico es **fundamentalmente clínico**: el síntoma más importante es el **dolor desproporcionado** que aumenta con el estiramiento pasivo; de las 6 P la **parestesia** es la primera y palidez, parálisis y ausencia de pulso son **signos tardíos** de daño irreparable.","El tratamiento empieza retirando vendajes y yesos (**bivalva: −50 %** de presión), extremidad en **posición neutra** y TA normal; si no mejora, **fasciotomía** abierta completa (pierna: 4 compartimentos con 2 incisiones; antebrazo: 1 incisión volar), idealmente en las **primeras 6 h**, y se evita si el SCA lleva **> 10 h** (valorar amputación).","El **síndrome por aplastamiento** añade rabdomiólisis con **mioglobinuria, hiperkalemia y acidosis** que llevan al fracaso renal; el **crónico** (deportista joven, bilateral en 75-95 %) se diagnostica con los criterios de presión de **Pedowitz** (≥15 reposo, 30 a 1 min, ≥20 a 5 min)."],"objetivos":["Definir el síndrome compartimental y explicar su fisiopatología, incluida la injuria por isquemia-reperfusión.","Clasificar las causas en aumento del contenido y disminución del continente, y diferenciar las formas aguda, por aplastamiento y crónica.","Reconocer la clínica (regla de las 6 P), distinguir signos precoces y tardíos e interpretar la presión intracompartimental y la CK.","Describir las medidas iniciales, la técnica de fasciotomía en pierna y antebrazo, sus cuidados y complicaciones.","Identificar el síndrome compartimental crónico del deportista, sus criterios diagnósticos y su diagnóstico diferencial."],"ideas_clave":["Presión normal del tejido **0-8 mmHg** (CN 0-10); patológica **> 30 mmHg** (30-40 según la diapositiva) = indicación de fasciotomía.","El **dolor desproporcionado** a la lesión, que empeora con el estiramiento pasivo y la elevación y no cede con opiáceos, es el síntoma clave.","La **parestesia es el primer síntoma**; la **palidez es el signo más tardío**; palidez, parálisis y ausencia de pulso indican SC ya establecido.","Ventanas de isquemia: músculo **4 h reversible / 8 h irreversible**; nervio **1 h normal, 1-4 h neuroapraxia, 6-8 h axonotmesis**.","No hay que retrasar el tratamiento para medir la presión: el diagnóstico del SC es **CLÍNICO**.","Medidas iniciales: retirar vendaje/yeso (bivalva > 50 %), extremidad **neutra** (ni elevada ni en declive), normalizar TA; luego **fasciotomía**.","Pierna: **4 compartimentos** (anterior, lateral, posterior superficial y profundo) por **2 incisiones**; antebrazo: volar (superficial y profundo) y dorsal por **1 incisión** volar.","Aplastamiento: rabdomiólisis → **mioglobinuria, hiperkalemia, acidosis** → fracaso renal; importa más la **magnitud** de la compresión que su duración."],"secciones":[{"id":"generalidades","titulo":"1. Generalidades: definición, tipos y epidemiología","bloques":[{"tipo":"definicion","termino":"Síndrome compartimental (SC)","texto":"**Aumento de presión en el interior de un espacio anatómico cerrado** que causa cambios isquémicos de los tejidos incluidos en dicho espacio. Es el conjunto de signos y síntomas secundarios al aumento de presión en una **celda fascial de un miembro**, hasta disminuir o eliminar la **presión de perfusión capilar**, comprometiendo la viabilidad de los tejidos."},{"tipo":"parrafo","texto":"Los compartimentos con estructura **fascial u ósea poco elástica** son los más afectados: al no poder distenderse, cualquier aumento de volumen (edema, sangre) se traduce directamente en aumento de presión. Las implicaciones fisiopatológicas son tres: **disminución de la perfusión capilar**, **viabilidad tisular comprometida** y **anomalías de la función neuromuscular**."},{"tipo":"tarjetas","items":[{"etiqueta":"Agudo","titulo":"La mayoría","texto":"Riesgo para la **viabilidad de la extremidad**. Origen traumático en la mayoría (fracturas de antebrazo, supracondíleas humerales y diafisarias de tibia)."},{"etiqueta":"Aplastamiento","titulo":"Crush syndrome","texto":"SC agudo por trauma con aplastamiento: la necrosis muscular masiva causa **mioglobinuria, hiperkalemia y acidosis** → **fracaso renal** y posible éxitus."},{"etiqueta":"Crónico","titulo":"Subgrupo recurrente","texto":"Presentación **recurrente** desencadenada por la actividad deportiva. **No** ocasiona pérdida de la extremidad pero sí **disminución del rendimiento** deportivo."}]},{"tipo":"tabla","titulo":"Epidemiología del síndrome compartimental","columnas":["Dato","Valor"],"filas":[["Incidencia en hombres","**7,3 / 100 000**"],["Incidencia en mujeres","**0,7 / 100 000**"],["Localizaciones más frecuentes","**Pierna y antebrazo** (puede darse en cualquier parte del cuerpo)"],["Fractura de tibia","**36 %**"],["Lesión de tejido blando sin fractura","**23 %**"],["Anticoagulantes","**10 %**"],["Radio distal","**9,8 %**"],["Origen traumático global","**70 %** de los casos"]]},{"tipo":"dato","valor":"7,3 vs 0,7 / 100 000","texto":"Incidencia del SC en hombres frente a mujeres: unas **10 veces más frecuente en el varón**."},{"tipo":"alerta","texto":"Un **23 %** de los SC aparecen **sin fractura** (lesión de partes blandas). No descartes un SC porque la radiografía sea normal: el contexto (contusión, anticoagulación) basta para sospecharlo."}]},{"id":"rabdomiolisis","titulo":"2. La rabdomiólisis","bloques":[{"tipo":"definicion","termino":"Rabdomiólisis","texto":"Síndrome clínico que implica la **degradación del tejido muscular esquelético**, con liberación de su contenido (mioglobina, potasio, CK) a la circulación."},{"tipo":"parrafo","texto":"Sus síntomas y signos son **debilidad muscular, mialgias y orina de color marrón rojizo**, aunque esta tríada está presente en **menos del 10 %** de los pacientes. El diagnóstico se basa en la anamnesis y se confirma con laboratorio: **CK elevada, típicamente > 5 veces el límite superior normal**. El tratamiento es **sintomático con líquidos intravenosos**, junto con el manejo de la causa incitadora y de las complicaciones."},{"tipo":"tabla","titulo":"Causas frecuentes de rabdomiólisis","columnas":["Grupo","Ejemplos del temario"],"filas":[["Traumatismo mecánico o isquemia muscular","Lesiones por **aplastamiento**, **descargas eléctricas**, **convulsiones**, **síndrome compartimental**"],["Fármacos y toxinas","**Estatinas**, antibióticos, ansiolíticos, antipsicóticos, **cocaína**, anfetaminas, **alcohol**"],["Infección","Gripes **A y B**, virus **Coxsackie**, *Staphylococcus aureus*"]]},{"tipo":"alerta","texto":"El temario da dos umbrales de CK: en la rabdomiólisis general se confirma con **CK > 5 veces** el límite normal, y en el apartado de aplastamiento se dice que la rabdomiólisis **se inicia con CK 4 veces** la normal. Lee bien qué te preguntan antes de elegir."}]},{"id":"etiologia","titulo":"3. Etiología del SC agudo: contenido frente a continente","bloques":[{"tipo":"parrafo","texto":"Todas las causas se agrupan en dos mecanismos: o **aumenta el contenido** del compartimento (causas **intracompartimentales**: sangre, edema, músculo) o **disminuye el continente** (causas **extracompartimentales**: algo que comprime desde fuera o reduce la capacidad de la celda)."},{"tipo":"esquema","titulo":"Clasificación etiológica del síndrome compartimental","mermaid":"flowchart TD\n  A[\"Síndrome compartimental\"] --> B[\"Aumento del contenido intracompartimental\"]\n  A --> C[\"Disminución del continente extracompartimental\"]\n  B --> B1[\"Agudo: sangrado, trauma, isquemia-reperfusión\"]\n  B --> B2[\"Agudo: lesión eléctrica, TVP, ejercicio intenso\"]\n  B --> B3[\"Agudo: síndrome nefrótico, extravasación yatrogénica\"]\n  B --> B4[\"Crónico: más volumen en la celda, hipertrofia muscular\"]\n  C --> C1[\"Vendaje o yeso compresivo\"]\n  C --> C2[\"Escara de quemadura o congelación\"]\n  C --> C3[\"Cierre fascial a tensión, torniquete prolongado\"]\n  C --> C4[\"Aplastamiento, inmovilización prolongada\"]","pie":"Primero pregunta: ¿sobra contenido o falta continente? La respuesta orienta la causa y la primera medida (p. ej., retirar el yeso)."},{"tipo":"tabla","titulo":"Causas según el mecanismo","columnas":["Aumento del contenido (intracompartimentales)","Disminución del continente (extracompartimentales)"],"filas":[["**Sangrado**: trastorno de coagulación, anticoagulantes, hemofilia; hemorragia por fracturas u osteotomías","**Compresión externa**"],["**Trauma**: fractura cerrada o abierta, lesión vascular","**Vendajes circunferenciales**, yesos constrictivos"],["**Isquemia-reperfusión / edema postisquemia**: lesión arterial, embolia, trombosis, cateterismo arterial","**Escara** por quemadura o congelación (dura, no elástica)"],["**Lesiones eléctricas**","**Cierre quirúrgico** de defectos fasciales con excesiva tensión"],["**Trombosis venosas**","**Uso prolongado del torniquete**"],["**Ejercicio físico intenso**","**Inmovilización prolongada** en una postura (intoxicación etílica, drogas)"],["**↓ Osmolaridad del suero** (síndrome nefrótico)","**Aplastamiento**"],["**Extravasaciones** venosas o arteriales yatrogénicas; **contaminación por mordedura**","—"]]},{"tipo":"parrafo","texto":"Entre las fracturas, favorecen el SC las de **alta energía**: **conminución severa, extensión articular, fracturas segmentarias, gran desplazamiento, rodilla flotante y fracturas expuestas**. En la forma **crónica**, el aumento de contenido se debe a **mayor volumen de los tejidos de la celda aponeurótica** e **hipertrofia muscular**."},{"tipo":"perla","texto":"En el paciente quemado con escara circunferencial dura, la prevención del SC consiste en **quitar las escaras**: la escara actúa como un yeso que no cede. Vigila igualmente cualquier vendaje que coloques tú en fisioterapia: un vendaje circunferencial demasiado apretado es una causa extracompartimental evitable."},{"tipo":"alerta","texto":"El **torniquete prolongado** y el **cierre fascial a tensión** son causas por **disminución del continente**, no por aumento del contenido; en cambio la **trombosis venosa** y el **síndrome nefrótico** aumentan el contenido. Es una trampa de clasificación clásica."}]},{"id":"fisiopatologia","titulo":"4. Fisiopatología e isquemia-reperfusión","bloques":[{"tipo":"parrafo","texto":"A medida que el **edema y el sangrado** incrementan la presión, se compromete la circulación, disminuye la oxigenación tisular y se altera el metabolismo celular; si persiste, se produce **muerte celular**, siendo los tejidos **nervioso y muscular los más sensibles**. Cuando la presión supera los **30 mmHg**, los **vasos linfáticos se colapsan** (el músculo queda sin drenaje y se edematiza más) y se produce un **colapso arteriolar** por compresión que reduce aún más el aporte de oxígeno: es un círculo vicioso."},{"tipo":"esquema","titulo":"Cascada fisiopatológica del SC agudo","mermaid":"flowchart TD\n  A[\"Edema o sangrado en celda cerrada\"] --> B[\"1. Aumento de la presión del compartimento\"]\n  B --> C[\"2. Aumento de la presión venosa\"]\n  C --> D[\"3. Disminución del flujo\"]\n  D --> E[\"4. Disminución de la perfusión tisular\"]\n  B -->|\"más de 30 mmHg\"| F[\"Colapso linfático: más edema muscular\"]\n  F --> B\n  B -->|\"más de 30 mmHg\"| G[\"Colapso arteriolar: menos oxígeno\"]\n  E --> H[\"Isquemia de músculo y nervio\"]\n  G --> H\n  H --> I[\"Muerte celular y daño irreversible\"]","pie":"Los dos bucles a partir de 30 mmHg explican por qué el SC se autoperpetúa y por qué el tiempo es decisivo."},{"tipo":"tabla","titulo":"Tolerancia a la isquemia","columnas":["Tejido","Tiempo","Consecuencia"],"filas":[["Músculo","**4 h**","Daño **reversible**"],["Músculo","**4-8 h**","Variable"],["Músculo","**8 h**","Daño **irreversible**"],["Nervio","**1 h**","Conducción nerviosa **normal**"],["Nervio","**1-4 h**","Daño **neuroapráxico reversible**"],["Nervio","**6-8 h**","**Axonotmesis** y daño irreversible"]]},{"tipo":"dato","valor":"4 h / 8 h","texto":"Isquemia muscular: a las **4 h** el daño todavía es reversible; a las **8 h** es irreversible (entre ambas, variable)."},{"tipo":"parrafo","texto":"**Injuria por isquemia-reperfusión.** La isquemia prolongada **disminuye la fosforilación oxidativa**, consume el ATP y falla la resíntesis de ATP y **fosfocreatina** (fosfatos de alta energía). Fallan las **bombas iónicas** dependientes de ATP y entran **Ca²⁺, Na⁺ y agua** en la célula; se altera el potencial de membrana, **aumenta el volumen intracelular**, disminuye la fluidez de la membrana y empeora el citoesqueleto de las células endoteliales."},{"tipo":"tabla","titulo":"Cambios endoteliales en la isquemia","columnas":["Disminuye / se suprime","Aumenta / se expresa"],"filas":[["**Prostaciclina**, **óxido nítrico**","**Endotelina**, **tromboxano A2**"],["**Trombomodulina**, **cNOS**","**Moléculas de adhesión**, **citoquinas** (proinflamatorios)"]]},{"tipo":"parrafo","texto":"Muchas de estas respuestas se **exacerban con la reoxigenación**: en el periodo inicial tras la reperfusión aparece una **disfunción endotelial severa**, incluso **sin cambios morfológicos evidentes** de injuria celular. Es decir, la isquemia induce un **estado proinflamatorio** que hace al tejido más vulnerable a una mayor lesión con la reperfusión."}]},{"id":"clinica","titulo":"5. Diagnóstico clínico: la regla de las 6 P","bloques":[{"tipo":"parrafo","texto":"**Diagnóstico de sospecha**: considerar el SCA en el contexto del paciente. Ante un traumatismo, sospéchalo si hay **dolor desproporcionado** a la gravedad de la lesión, **dolor al estiramiento pasivo** del grupo muscular implicado y/o **palpación de una región con excesiva tensión**. **El síntoma más importante es el dolor desproporcionado al esperado para la lesión.**"},{"tipo":"tabla","titulo":"Regla de las 6 P","columnas":["P","Características","Momento"],"filas":[["**Parestesias**","Disestesias, quemazón, entumecimiento, **pérdida de la discriminación de dos puntos**; aumentan con la isquemia nerviosa","**Primer síntoma**"],["**Pain (dolor)**","**Desproporcionado**; se exacerba con el **movimiento pasivo** o la compresión directa; **empeora con la elevación**; puede persistir pese a **dosis altas de opiáceos**","Precoz, el más importante"],["**Presión**","Compartimento **tenso y caliente**; piel **tensa y brillante**; PIC **> 30-40 mmHg** (normal 0-10)","Objetivable"],["**Palidez**","Piel **fría y acartonada**; **relleno capilar > 3 s**","**Signo más tardío**"],["**Parálisis**","Movimiento lento o ausente de articulaciones distales; sin respuesta a la estimulación neurológica","Tardío"],["**Pulselessness**","Ausencia de pulso; en lesión reciente obliga a **descartar etiología vascular** (arteriografía)","Tardío"]]},{"tipo":"alerta","texto":"Los signos clásicos **NO son fiables**: palidez, parálisis y ausencia de pulso son **signos tardíos** de un SC **ya establecido** con **daño irreparable**. Esperar a perder el pulso para actuar es un error: el pulso distal puede mantenerse con el compartimento a presión patológica."},{"tipo":"perla","texto":"Como fisioterapeuta, si un paciente con yeso o vendaje refiere **dolor que no cuadra con la lesión**, que **aumenta al estirar pasivamente** los dedos o el tobillo y **empeora al elevar** el miembro, detén la sesión y deriva de urgencia: no lo atribuyas a mala tolerancia al dolor."},{"tipo":"alerta","texto":"En el SC el dolor **empeora con la elevación** de la extremidad (se reduce la presión arterial de perfusión). No apliques el reflejo de «elevar para bajar el edema» en un SC sospechado: la extremidad debe quedar **neutra**."}]},{"id":"pruebas","titulo":"6. Presión compartimental, laboratorio y síndrome por aplastamiento","bloques":[{"tipo":"parrafo","texto":"**Medición de la presión compartimental**: se usan **monitores manuales comercializados** (aguja conectada a un transductor). **No se requiere** medir la presión si ello **demora el tratamiento**: el diagnóstico del SC es **fundamentalmente CLÍNICO**."},{"tipo":"figura","pagina":41,"pie":"Monitor manual de presión intracompartimental: aguja, jeringa con suero y lector digital en mmHg que se pone a cero antes de puncionar el compartimento.","src":"img/patologia-quirurgica-i-t8-tema-8-sindrome-compartimental-y-aplastamiento-p41.jpg"},{"tipo":"tabla","titulo":"Interpretación de la presión intracompartimental","columnas":["Situación","Valor","Interpretación"],"filas":[["Presión normal del tejido","**0-8 mmHg**","Normal"],["Presión patológica","**> 30 mmHg**","**Indicación de fasciotomía**"],["Fractura aislada, primeras 24 h","Hasta **35 mmHg**","Puede ocurrir **sin SCA clínico**: una medición aislada **no justifica** la cirugía"]]},{"tipo":"dato","valor":"> 30 mmHg","texto":"Umbral de presión intracompartimental patológica que indica fasciotomía (normal 0-8 mmHg)."},{"tipo":"parrafo","texto":"**Fasciotomía profiláctica**: indicada cuando hay alto riesgo de evolución a SCA: **fracturas complejas de extremidades, aplastamientos, reimplante de extremidades e isquemia > 6 horas**."},{"tipo":"parrafo","texto":"**Síndrome por aplastamiento (SA)**: se caracteriza por **rabdomiólisis**, que produce **insuficiencia renal aguda por mioglobinuria**. Suelen necesitarse **4 a 6 horas de compresión mantenida**, pero el tiempo total de atrapamiento **no refleja necesariamente la gravedad**: es más importante la **magnitud de la compresión y el tamaño de los músculos comprimidos**. El paciente presenta **debilidad muscular, malestar y fiebre**, descripción que **infravalora** los graves efectos **cardiovasculares** de la alteración electrolítica y de la insuficiencia renal."},{"tipo":"tabla","titulo":"Pruebas complementarias","columnas":["Prueba","Datos clave","Utilidad"],"filas":[["**CK (creatin-kinasa)**","Normal **\u003c 130 UI**; rabdomiólisis desde **4 veces** la normal; en el SCA **1000-5000 UI**; **100 000 UI = necrosis muscular**","Se eleva en lesión muscular; **NO sirve para el diagnóstico precoz** del SCA"],["**Arteriografía**","Solo si se sospecha **lesión arterial**","Con **inestabilidad hemodinámica**, hacerla **tras la fasciotomía**"],["**Presión intracompartimental**","Monitor manual","Apoyo; no debe retrasar el tratamiento"]]},{"tipo":"alerta","texto":"Una **CK normal no descarta** un SCA en fase precoz: la CK refleja necrosis ya producida. Y la **duración** del atrapamiento no predice la gravedad del aplastamiento: manda la **magnitud** de la compresión y la **masa muscular** afectada."}]},{"id":"tratamiento","titulo":"7. Tratamiento del SC agudo: medidas iniciales y fasciotomía","bloques":[{"tipo":"esquema","titulo":"Algoritmo de manejo del SC agudo","mermaid":"flowchart TD\n  A[\"Sospecha clínica de SCA\"] --> B[\"Retirar todo vendaje o yeso: bivalva hasta la piel\"]\n  B --> C[\"Extremidad neutra y TA normalizada\"]\n  C --> D[\"Reevaluar clínicamente en 30-60 min\"]\n  D -->|\"mejora\"| E[\"Vigilancia clínica\"]\n  D -->|\"no mejora\"| F{\"Evolución del SCA establecido\"}\n  F -->|\"menos de 10 h\"| G[\"Fasciotomía urgente, ideal antes de 6 h\"]\n  F -->|\"más de 10 h\"| H[\"Evitar fasciotomía: valorar amputación\"]\n  G --> I[\"Herida abierta, apósito estéril y férula\"]\n  I --> J[\"Revisión en quirófano a los 2-5 días\"]","pie":"Orden de las conclusiones del tema: retirar vendajes y yesos, reevaluar en 30-60 minutos y, si persiste, fasciotomía."},{"tipo":"tabla","titulo":"Medidas iniciales","columnas":["Medida","Detalle y motivo"],"filas":[["**Retirar todo vendaje o yeso**","Apertura **longitudinal** del yeso: **−30 %** de presión; apertura en **bivalva** cortando toda la envoltura hasta la piel: **> 50 %** → se recomienda la bivalva. Si el SCA ya está establecido, abrir el yeso **no evita su progresión**"],["**Ingreso en UCI**","Manejo agresivo de **líquidos**; **hemodiálisis** si fuera necesario"],["**Extremidad en posición neutra**","Elevarla o colocarla **por debajo del corazón agrava** el SCA"],["**Normalizar la tensión arterial**","La **hipotensión agrava la isquemia**"]]},{"tipo":"dato","valor":"−30 % vs > 50 %","texto":"Reducción de la presión compartimental con la apertura longitudinal del yeso frente a la apertura en bivalva hasta la piel."},{"tipo":"definicion","termino":"Fasciotomía","texto":"Descompresión de un compartimento mediante su **apertura longitudinal y completa**, incluidos **piel, tejido celular subcutáneo y fascia**. Puede ser necesario abrir varios compartimentos."},{"tipo":"figura","pagina":46,"pie":"Fasciotomía de pierna: obsérvese la apertura longitudinal y amplia de piel y fascia, con el músculo edematoso protruyendo por la herida, que se deja abierta.","src":"img/patologia-quirurgica-i-t8-tema-8-sindrome-compartimental-y-aplastamiento-p46.jpg"},{"tipo":"parrafo","texto":"La fasciotomía por **pequeñas incisiones cutáneas** tiene beneficio estético pero **puede ser ineficaz** con graves consecuencias; deben **evitarse las incisiones subcutáneas**. La herida se **deja abierta** y se cubre con apósito estéril; a los **3-5 días** se reexamina en quirófano y se sutura la piel si el edema ha disminuido y puede aproximarse **sin tensión**. El tratamiento debe instaurarse en las **primeras 6 horas**: demorar la cirugía puede causar daño permanente."},{"tipo":"dato","valor":"> 10 h","texto":"SCA establecido con más de 10 h de evolución: **se debe evitar la fasciotomía** (riesgo elevado de septicemia y reperfusión agresiva) y es preferible **valorar la amputación**."}]},{"id":"tecnica","titulo":"8. Fasciotomía de pierna y antebrazo, cuidados y complicaciones","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"Pierna","titulo":"4 compartimentos","texto":"**Anterior, lateral, posterior superficial y posterior profundo**. Algunos autores usan una sola incisión, pero la mayoría prefiere **2 incisiones**."},{"etiqueta":"Antebrazo","titulo":"2 compartimentos","texto":"**Volar** (dividido en superficial y profundo) y **dorsal**. Se recomienda **UNA incisión** desde la **fosa antecubital** hasta el **pliegue de la muñeca**."}]},{"tipo":"figura","pagina":53,"pie":"Corte transversal de la pierna con los 4 compartimentos: 1 anterior y 2 lateral se abordan por la incisión anterolateral; 3 posterior superficial y 4 posterior profundo, por la posteromedial.","src":"img/patologia-quirurgica-i-t8-tema-8-sindrome-compartimental-y-aplastamiento-p53.jpg"},{"tipo":"tabla","titulo":"Técnica de dos incisiones en la pierna","columnas":["Incisión","Localización","Compartimentos","Estructura a proteger"],"filas":[["**Anterolateral**","Longitudinal, **inmediatamente por delante de la diáfisis del peroné**","**Anterior y lateral**","**Nervio peroneo superficial**"],["**Posteromedial**","**2,5 cm por dentro del borde interno de la tibia**","**Posterior superficial** (fácil en los 2/3 proximales) y **posterior profundo** (superficial en el **tercio distal**, justo detrás de la tibia)","**Vena y nervio safeno**"]]},{"tipo":"figura","pagina":55,"pie":"Incisión medial: fasciotomía del compartimento posterior superficial y del posterior profundo detrás de la tibia; nótese el trayecto de la vena y el nervio safeno que hay que proteger.","src":"img/patologia-quirurgica-i-t8-tema-8-sindrome-compartimental-y-aplastamiento-p55.jpg"},{"tipo":"parrafo","texto":"En el **antebrazo**, si tras la descompresión volar el **compartimento dorsal sigue tenso**, se añade una **incisión dorsal** que se inicia en un punto **distal al epicóndilo lateral** y continúa hasta la parte distal del antebrazo."},{"tipo":"figura","pagina":58,"pie":"Fasciotomía volar del antebrazo: trazado sinuoso desde la fosa antecubital hasta el pliegue de la muñeca y apertura de la fascia volar.","src":"img/patologia-quirurgica-i-t8-tema-8-sindrome-compartimental-y-aplastamiento-p58.jpg"},{"tipo":"parrafo","texto":"**Cuidados posteriores**: es muy importante **disminuir el riesgo de infección y sepsis** (y en casos graves la pérdida de la extremidad). Se aplican **gasas humedecidas estériles** y una **férula** para inmovilizar. **Revisión en quirófano a los 2-5 días**: se **desbrida todo el tejido necrótico**; si no hay necrosis, cierre superficial; si no se consigue el cierre, se repite el desbridamiento a las **72 h** y después se puede hacer sutura o **injertos de piel**."},{"tipo":"lista","items":["Infección de la herida","Trombosis venosa profunda","Lesión neurovascular","Disestesias en el borde de la herida","Úlceras cutáneas recurrentes","Hernias musculares"]},{"tipo":"perla","texto":"En la rehabilitación tras fasciotomía de pierna, explora la **sensibilidad del dorso del pie** (n. peroneo superficial, incisión lateral) y de la **cara medial de pierna y pie** (n. safeno, incisión medial): las disestesias del borde de la herida y la lesión neurovascular son complicaciones descritas que debes registrar antes de movilizar y cargar."}]},{"id":"cronico","titulo":"9. Síndrome compartimental crónico","bloques":[{"tipo":"definicion","termino":"SC crónico (del deportista, recurrente o subagudo)","texto":"**Incremento transitorio** de la presión compartimental **después de una actividad**, que se manifiesta con **dolor, debilidad y déficits neurológicos** temporales."},{"tipo":"parrafo","texto":"Suele darse en las **extremidades inferiores**. El paciente típico es **joven (20-30 años)**, **atleta** (corredor de larga distancia) o **recluta militar** forzado más allá de los límites normales de tolerancia funcional. La presentación es **bilateral en el 75-95 %** y hay **hernias musculares en el 15-60 %**."},{"tipo":"tabla","titulo":"Criterios de presión intracompartimental (Pedowitz et al.)","columnas":["Momento","Valor diagnóstico"],"filas":[["Reposo, antes del ejercicio","**≥ 15 mmHg**"],["**1 minuto** después del ejercicio","**30 mmHg**"],["**5 minutos** después del ejercicio","**≥ 20 mmHg**"]]},{"tipo":"esquema","titulo":"Abordaje del SC crónico","mermaid":"flowchart LR\n  A[\"Dolor de pierna al esfuerzo en corredor joven\"] --> B[\"Diagnóstico diferencial\"]\n  B --> B1[\"Periostitis\"]\n  B --> B2[\"Atrapamiento del n. peroneo superficial\"]\n  B --> B3[\"Tendinitis del tibial posterior\"]\n  B --> B4[\"Fractura de estrés de tibia\"]\n  B --> B5[\"Claudicación intermitente\"]\n  A --> C[\"Presión intracompartimental: criterios de Pedowitz\"]\n  C --> D[\"No quirúrgico: AINE, fisioterapia, relajantes, reposo deportivo\"]\n  D -->|\"fracasa\"| E[\"Fasciotomía de incisión única o doble\"]","pie":"La medición de la presión intracompartimental es la prueba clave del SC crónico, a diferencia del agudo, donde manda la clínica."},{"tipo":"perla","texto":"El fisioterapeuta forma parte del **tratamiento no quirúrgico** del SC crónico (junto a AINE, relajantes musculares y **reposo deportivo**): adaptar la carga de carrera y reeducar el gesto es la primera línea antes de plantear la fasciotomía."},{"tipo":"alerta","texto":"En el SC **crónico** la medición de presión es el **pilar del diagnóstico** (criterios de Pedowitz), mientras que en el **agudo** el diagnóstico es **clínico** y no se debe retrasar el tratamiento para medir. No mezcles ambos enfoques."},{"tipo":"parrafo","texto":"**Conclusiones del tema**: el diagnóstico diferencial del SC agudo debe hacerse sobre todo con la **oclusión arterial** y la **neuropraxia**. Las complicaciones más severas son las **lesiones permanentes de nervios y músculos** y, en los casos más graves, la **amputación**."}]}],"caso_clinico":{"titulo":"Fractura de tibia con yeso y dolor que no cede","presentacion":"Varón de 24 años, motorista, con fractura diafisaria de tibia conminuta por alta energía, tratada con yeso cerrado inguinopédico. A las 7 horas refiere dolor intensísimo en la pierna que no mejora con opiáceos a dosis altas, hormigueo y quemazón en el dorso del pie, y el dolor se dispara cuando la enfermera le extiende pasivamente los dedos. El pulso pedio se palpa y el relleno capilar es de 2 segundos. La enfermera ha elevado la pierna sobre dos almohadas «para bajar la inflamación».","preguntas":[{"pregunta":"¿Descarta la presencia de pulso pedio y de relleno capilar normal un síndrome compartimental agudo? Razónalo.","respuesta":"No. El pulso y la palidez son **signos tardíos** de un SC ya establecido y los signos clásicos **no son fiables**. Aquí están presentes los signos **precoces**: **dolor desproporcionado** resistente a opiáceos, **dolor al estiramiento pasivo** y **parestesias** (primer síntoma). El contexto (fractura tibial de alta energía, conminuta, yeso cerrado) lo hace muy probable."},{"pregunta":"¿Qué medidas iniciales tomarías de inmediato, y es correcta la elevación de la pierna?","respuesta":"Retirar el yeso abriéndolo **en bivalva** hasta la piel (reduce la presión **> 50 %**, frente a un 30 % de la apertura longitudinal), colocar la extremidad en **posición neutra** —la **elevación agrava** el SCA al reducir la presión de perfusión— y **normalizar la tensión arterial**, ya que la hipotensión agrava la isquemia. Después, reevaluar en 30-60 minutos."},{"pregunta":"Si no mejora, ¿qué tratamiento se indica, cómo se realiza y qué estructuras deben protegerse?","respuesta":"**Fasciotomía urgente**, idealmente en las primeras **6 h** (lleva 7 h, pero \u003c 10 h, por lo que sigue indicada). En la pierna se abren los **4 compartimentos con 2 incisiones**: **anterolateral** por delante del peroné (compartimentos anterior y lateral, cuidando el **nervio peroneo superficial**) y **posteromedial** a 2,5 cm del borde interno tibial (posterior superficial y profundo, protegiendo **vena y nervio safeno**). La herida se deja abierta con apósito estéril y férula, con revisión en quirófano a los 2-5 días."}]},"preguntate":[{"pregunta":"Define síndrome compartimental y explica por qué afecta más a pierna y antebrazo.","respuesta":"Aumento de presión en un espacio anatómico cerrado que reduce la perfusión capilar y causa isquemia de sus tejidos. Afecta sobre todo a compartimentos con fascia o hueso **poco elásticos**, como los de pierna y antebrazo, donde cualquier aumento de volumen eleva la presión."},{"pregunta":"Describe la secuencia fisiopatológica en 4 pasos y qué ocurre al superar 30 mmHg.","respuesta":"↑presión compartimental → ↑presión venosa → ↓flujo → ↓perfusión tisular. Por encima de **30 mmHg** se colapsan los **linfáticos** (más edema muscular) y las **arteriolas** (menos oxígeno), cerrando un círculo vicioso."},{"pregunta":"¿Cuáles son los tiempos de tolerancia isquémica del músculo y del nervio?","respuesta":"Músculo: **4 h** reversible, **4-8 h** variable, **8 h** irreversible. Nervio: **1 h** conducción normal, **1-4 h** neuroapraxia reversible, **6-8 h** axonotmesis irreversible."},{"pregunta":"Enumera las 6 P e indica cuál aparece primero y cuál es el signo más tardío.","respuesta":"Parestesias, Pain (dolor), Presión, Palidez, Parálisis y Pulselessness. La **parestesia** es el **primer síntoma** y la **palidez** el **signo más tardío**; palidez, parálisis y ausencia de pulso indican SC establecido."},{"pregunta":"¿Por qué no hay que esperar a medir la presión intracompartimental para tratar un SCA?","respuesta":"Porque el diagnóstico del SC es **fundamentalmente clínico** y la demora en la cirugía produce daño permanente; la medición solo es un apoyo y además una cifra aislada (p. ej., 35 mmHg en fractura las primeras 24 h) puede darse sin SCA."},{"pregunta":"Explica la diferencia entre causas por aumento del contenido y por disminución del continente con dos ejemplos de cada una.","respuesta":"Aumento del contenido (intracompartimental): sangrado por anticoagulantes, edema postisquemia, trombosis venosa, ejercicio intenso. Disminución del continente (extracompartimental): yeso o vendaje constrictivo, escara de quemadura, torniquete prolongado, cierre fascial a tensión."},{"pregunta":"¿Qué complicaciones metabólicas definen el síndrome por aplastamiento y por qué son peligrosas?","respuesta":"La rabdomiólisis por necrosis muscular masiva causa **mioglobinuria, hiperkalemia y acidosis**, que llevan a **fracaso renal** y efectos **cardiovasculares** graves por la alteración electrolítica; sin tratamiento pueden causar el éxitus."},{"pregunta":"¿Cómo se realiza la fasciotomía del antebrazo y cuándo se añade una incisión dorsal?","respuesta":"Una **incisión volar** desde la **fosa antecubital** hasta el **pliegue de la muñeca**, que descomprime el compartimento volar (superficial y profundo). Si el **dorsal sigue tenso**, se añade una incisión dorsal desde distal al **epicóndilo lateral** hasta la parte distal del antebrazo."},{"pregunta":"¿Cuándo se debe evitar la fasciotomía y qué alternativa se plantea?","respuesta":"En un SCA **establecido con más de 10 h** de evolución, por el riesgo elevado de **septicemia y reperfusión agresiva**; es preferible **valorar la amputación**."},{"pregunta":"Describe al paciente típico del SC crónico y cómo se diagnostica.","respuesta":"Joven de **20-30 años**, corredor de larga distancia o recluta militar, con dolor, debilidad y déficit neurológico transitorios tras el ejercicio, **bilateral en el 75-95 %**. Se confirma con la presión intracompartimental según **Pedowitz**: ≥ 15 mmHg en reposo, 30 mmHg al minuto y ≥ 20 mmHg a los 5 minutos del ejercicio."}],"glosario":[{"termino":"Compartimento (celda fascial)","definicion":"Espacio anatómico cerrado por fascia y hueso poco elásticos que contiene músculos, vasos y nervios."},{"termino":"Presión intracompartimental","definicion":"Presión dentro de la celda: normal **0-8 mmHg**; patológica **> 30 mmHg**."},{"termino":"Fasciotomía","definicion":"Apertura longitudinal y completa de piel, tejido subcutáneo y fascia para descomprimir un compartimento."},{"termino":"Bivalva","definicion":"Apertura del yeso en dos valvas cortando toda la envoltura hasta la piel; reduce la presión **más del 50 %**."},{"termino":"Rabdomiólisis","definicion":"Degradación del músculo esquelético con liberación de mioglobina, potasio y CK; puede causar insuficiencia renal."},{"termino":"Mioglobinuria","definicion":"Presencia de mioglobina en orina (orina marrón rojiza), responsable del fracaso renal en el aplastamiento."},{"termino":"Crush syndrome","definicion":"Síndrome compartimental agudo por aplastamiento con rabdomiólisis, hiperkalemia, acidosis y fracaso renal."},{"termino":"Isquemia-reperfusión","definicion":"Lesión que agrava la isquemia al restablecer el flujo: disfunción endotelial y estado proinflamatorio."},{"termino":"Neuroapraxia","definicion":"Lesión nerviosa reversible por bloqueo de conducción; en el SC aparece entre **1 y 4 h** de isquemia."},{"termino":"Axonotmesis","definicion":"Lesión nerviosa con daño axonal; en el SC aparece a las **6-8 h** de isquemia y es irreversible."},{"termino":"Escara","definicion":"Tejido duro y no elástico tras quemadura o congelación que puede comprimir el compartimento; se debe retirar."},{"termino":"CK (creatin-kinasa)","definicion":"Enzima muscular: normal \u003c 130 UI, 1000-5000 UI en el SCA y 100 000 UI en necrosis; no útil para el diagnóstico precoz."}],"fuentes":["Tema 8. Síndrome Compartimental y Aplastamiento. Patología Quirúrgica I (PQRI 2026-2027), Universidad Europea.","Pedowitz et al. — criterios de presión intracompartimental del síndrome compartimental crónico (citado en el tema)."],"qcm":[{"pregunta":"Paciente con fractura diafisaria de tibia enyesada que comienza a desarrollar un síndrome compartimental agudo. Según el temario, ¿cuál es la primera manifestación que suele aparecer?","opciones":["Ausencia de pulso pedio en la exploración distal","Parálisis de la flexión dorsal de los dedos del pie","Palidez con relleno capilar superior a 3 segundos","Parestesias y pérdida de la discriminación de dos puntos"],"correcta":3,"explicacion":"La **parestesia es el primer síntoma** del SC: aumenta conforme progresa la isquemia del tejido nervioso, que es de los más sensibles. Palidez, parálisis y ausencia de pulso son **signos tardíos** de SC establecido.","por_opcion":["❌ La ausencia de pulso es un signo tardío y obliga a descartar una etiología vascular.","❌ La parálisis es un signo tardío que indica daño ya establecido.","❌ La palidez con relleno capilar > 3 s es el **signo más tardío** de las 6 P.","✅ Las parestesias (disestesias, quemazón, entumecimiento, falta de discriminación de dos puntos) son el primer síntoma."]},{"pregunta":"Un nervio periférico incluido en un compartimento a presión patológica lleva 3 horas en isquemia. ¿Qué lesión cabe esperar según la cronología del tema?","opciones":["Neurotmesis completa con sección axonal","Daño neuroapráxico todavía reversible","Axonotmesis con daño ya irreversible","Conducción nerviosa todavía normal, sin lesión"],"correcta":1,"explicacion":"Isquemia nerviosa: **1 h** conducción normal, **1-4 h** daño **neuroapráxico reversible**, **6-8 h** axonotmesis e irreversibilidad. A las 3 h estamos en la ventana de neuroapraxia.","por_opcion":["❌ El tema no describe neurotmesis; la lesión irreversible citada es la axonotmesis a las 6-8 h.","✅ Entre 1 y 4 h el daño es neuroapráxico y reversible.","❌ La axonotmesis aparece a las **6-8 h** de isquemia.","❌ La conducción solo se mantiene normal durante aproximadamente la **primera hora**."]},{"pregunta":"Ante un SCA sospechado en un miembro enyesado, ¿qué reducción aproximada de la presión compartimental consigue abrir el yeso en bivalva cortando toda la envoltura hasta la piel?","opciones":["Más de un 50 %","Aproximadamente un 10 %","Aproximadamente un 30 %","Cerca de un 90 %"],"correcta":0,"explicacion":"La apertura **longitudinal** reduce la presión un **30 %** y la apertura en **bivalva** la reduce **más del 50 %**; por eso se recomienda la bivalva hasta la piel. Si el SCA ya está establecido, no evitará su progresión.","por_opcion":["✅ La bivalva reduce la presión compartimental más de un 50 %.","❌ Cifra no recogida en el temario; subestima el efecto de la descompresión.","❌ Un 30 % corresponde a la apertura **longitudinal** simple, no a la bivalva.","❌ Sobreestima el efecto; además, en un SCA establecido abrir el yeso no frena la progresión."]},{"pregunta":"Mientras se prepara el quirófano para un SCA de antebrazo, ¿cuál es la posición recomendada de la extremidad?","opciones":["En posición neutra, a la altura del corazón","Elevada por encima del corazón para reducir el edema","Elevada con un vendaje compresivo suave y frío local","En declive, por debajo del corazón, para mejorar el aporte arterial"],"correcta":0,"explicacion":"La extremidad debe estar en **posición neutra**: si se **eleva o se coloca por debajo del corazón se agrava** el SCA. También hay que normalizar la tensión arterial porque la hipotensión agrava la isquemia.","por_opcion":["✅ Posición neutra: ni elevada ni en declive.","❌ La elevación reduce la presión de perfusión y **agrava** el SCA; el dolor empeora con la elevación.","❌ Elevarla agrava el cuadro y cualquier vendaje compresivo es una causa extracompartimental.","❌ Colocarla por debajo del corazón también agrava el SCA según el temario."]},{"pregunta":"En la fasciotomía de pierna con dos incisiones, ¿qué estructura hay que proteger especialmente en la incisión posteromedial?","opciones":["El nervio peroneo superficial","El nervio sural y la vena safena menor","El nervio tibial y la arteria tibial posterior","La vena y el nervio safeno"],"correcta":3,"explicacion":"La incisión posteromedial (2,5 cm por dentro del borde interno de la tibia) aborda los compartimentos posteriores; el temario insiste en **proteger la vena y el nervio safeno**, que discurren por detrás de la tibia.","por_opcion":["❌ El nervio peroneo superficial es el riesgo de la incisión **anterolateral**, por delante del peroné.","❌ Estructuras posterolaterales que no se mencionan en la técnica descrita.","❌ Son estructuras del compartimento posterior profundo, pero no las que el tema señala como riesgo de la incisión.","✅ Vena y nervio safeno: estructura a proteger en la incisión medial."]},{"pregunta":"Sobre el síndrome compartimental crónico, ¿cuál de las siguientes afirmaciones recoge el temario?","opciones":["Es bilateral en el 75-95 % de los casos","Afecta sobre todo a las extremidades superiores","Hay hernias musculares en más del 80 % de los casos","Predomina en mayores de 50 años sedentarios"],"correcta":0,"explicacion":"El SC crónico (del deportista, recurrente o subagudo) es **bilateral en el 75-95 %**, presenta **hernias musculares en el 15-60 %**, afecta típicamente a **jóvenes de 20-30 años** y suele darse en **extremidades inferiores**.","por_opcion":["✅ Presentación bilateral en el 75-95 % de los casos.","❌ Suele darse en las **extremidades inferiores**.","❌ Las hernias musculares aparecen en el **15-60 %**.","❌ El paciente típico es joven (20-30 años), corredor o recluta militar."]},{"pregunta":"Corredor de fondo con dolor en ambas piernas al esfuerzo. ¿Qué hallazgo de presión intracompartimental apoya el SC crónico según los criterios de Pedowitz?","opciones":["8 mmHg tras diez minutos de reposo","15 mmHg cinco minutos después del ejercicio","10 mmHg en reposo antes del ejercicio","30 mmHg un minuto después del ejercicio"],"correcta":3,"explicacion":"Criterios de Pedowitz: **≥ 15 mmHg** en reposo antes del ejercicio, **30 mmHg** al **minuto** tras el ejercicio y **≥ 20 mmHg** a los **5 minutos**.","por_opcion":["❌ Valor dentro del rango normal del tejido (0-8 mmHg).","❌ A los 5 minutos el criterio exige **20 mmHg o más**.","❌ En reposo hacen falta **15 mmHg o más**.","✅ Una presión de 30 mmHg al minuto del ejercicio es criterio diagnóstico."]},{"pregunta":"Respecto a la creatin-kinasa (CK) en el síndrome compartimental y el aplastamiento, ¿qué afirmación es correcta?","opciones":["Es el marcador de elección para el diagnóstico precoz del SCA","Cifras en torno a 100 000 UI indican necrosis muscular","En el SCA rara vez supera el doble del valor normal","Su valor normal se sitúa entre 1000 y 5000 UI"],"correcta":1,"explicacion":"La CK normal es **\u003c 130 UI**; en un SCA puede llegar a **1000-5000 UI** y cifras de **100 000 UI indican necrosis muscular**. **No es útil para el diagnóstico precoz** del SCA.","por_opcion":["❌ El temario dice expresamente que **NO** es útil en el diagnóstico precoz del SCA.","✅ 100 000 UI indican necrosis muscular.","❌ En el SCA alcanza 1000-5000 UI, muy por encima del doble de lo normal.","❌ 1000-5000 UI son las cifras que puede alcanzar en un SCA; lo normal es \u003c 130 UI."]},{"pregunta":"Paciente con un síndrome compartimental agudo establecido que lleva 14 horas de evolución. ¿Cuál es la actitud que propone el temario?","opciones":["Evitar la fasciotomía y valorar la amputación","Fasciotomía urgente de todos los compartimentos afectados","Abrir el yeso en bivalva y reevaluar en 30-60 minutos","Fasciotomía por pequeñas incisiones para reducir la infección"],"correcta":0,"explicacion":"Se debe **evitar la fasciotomía** en un SCA establecido con **más de 10 horas** de evolución, porque conlleva un riesgo elevado de **septicemia y reperfusión agresiva**; es preferible **valorar la amputación**.","por_opcion":["✅ Más de 10 h de SCA establecido: evitar fasciotomía y valorar amputación.","❌ Pasadas 10 h la fasciotomía expone a septicemia y reperfusión agresiva.","❌ Si el SCA está establecido, abrir el yeso **no evita su progresión**.","❌ Las pequeñas incisiones pueden ser **ineficaces** y no están indicadas en ningún caso."]},{"pregunta":"En el síndrome por aplastamiento, ¿qué factor tiene más peso en la gravedad de la lesión según el temario?","opciones":["El tiempo total de atrapamiento, siempre superior a 6 horas","La edad del paciente y su función renal previa","La magnitud de la compresión y el tamaño de los músculos comprimidos","La presencia de una fractura ósea asociada al aplastamiento"],"correcta":2,"explicacion":"Suelen necesitarse 4-6 h de compresión, pero **el tiempo total de atrapamiento no refleja necesariamente la gravedad**: es más importante la **magnitud de la compresión y el tamaño de los músculos comprimidos**.","por_opcion":["❌ El tema advierte que el tiempo total **no refleja necesariamente** la gravedad.","❌ No se mencionan como factor principal en el temario.","✅ Magnitud de la compresión y masa muscular comprimida son lo más importante.","❌ No se cita como determinante de la gravedad del aplastamiento."]},{"pregunta":"¿Cuál de las siguientes causas produce un síndrome compartimental por disminución del continente?","opciones":["Síndrome nefrótico con hipoosmolaridad sérica","Trombosis venosa profunda de la extremidad","Ejercicio físico intenso no habitual","Uso prolongado de un torniquete"],"correcta":3,"explicacion":"Las causas por **disminución del continente** (extracompartimentales) son compresión externa, vendajes circunferenciales, escaras, cierre de defectos fasciales a tensión, **torniquete prolongado** e inmovilización prolongada. Las demás opciones aumentan el contenido.","por_opcion":["❌ La disminución de la osmolaridad del suero (síndrome nefrótico) aumenta el contenido.","❌ Las trombosis venosas son causa de **aumento del contenido**.","❌ El ejercicio intenso aumenta el contenido del compartimento.","✅ El torniquete prolongado figura entre las causas por disminución del continente."]},{"pregunta":"Paciente con fractura aislada de tibia, sin clínica sugestiva, en el que se mide una presión de 35 mmHg a las 12 horas. ¿Qué interpretación es correcta?","opciones":["Indica fasciotomía inmediata por superar los 30 mmHg","No justifica por sí sola la cirugía; prima la vigilancia clínica","Indica fasciotomía profiláctica por tratarse de una fractura","Obliga a repetir la medición solo si desaparece el pulso"],"correcta":1,"explicacion":"Las **fracturas aisladas pueden elevar la presión a 35 mmHg durante las primeras 24 h sin evidencia clínica** de SCA; por eso **una medición aislada no justifica** el tratamiento quirúrgico. El diagnóstico es clínico.","por_opcion":["❌ El umbral de 30 mmHg no se aplica de forma aislada a una fractura en las primeras 24 h sin clínica.","✅ Una medición aislada no justifica la cirugía; el diagnóstico es clínico.","❌ La fasciotomía profiláctica se reserva para fracturas **complejas**, aplastamientos, reimplantes o isquemia > 6 h.","❌ La ausencia de pulso es un signo tardío: esperar a ella supone llegar tarde."]},{"pregunta":"¿En cuál de estas situaciones está indicada una fasciotomía profiláctica según el temario?","opciones":["Dolor de esfuerzo bilateral en un corredor","Contusión muscular con CK de 300 UI","Isquemia de la extremidad de más de 6 horas","Fractura de radio distal no desplazada"],"correcta":2,"explicacion":"La fasciotomía profiláctica se indica cuando hay alto riesgo de SCA: **fracturas complejas de extremidades, aplastamientos, reimplante de extremidades e isquemia mayor de 6 horas**.","por_opcion":["❌ Sugiere SC crónico, cuyo tratamiento inicial es no quirúrgico.","❌ Una CK discretamente elevada no es indicación de fasciotomía.","✅ La isquemia > 6 h es una de las indicaciones de fasciotomía profiláctica.","❌ Una fractura simple no desplazada no es fractura compleja de alto riesgo."]},{"pregunta":"Sobre la fasciotomía del antebrazo descrita en el tema, señala la opción correcta.","opciones":["Se recomiendan de entrada dos incisiones, volar y dorsal","La incisión dorsal parte del epicóndilo medial y llega al carpo","Se recomienda una incisión de fosa antecubital a pliegue de muñeca","El antebrazo tiene cuatro compartimentos que exigen dos abordajes"],"correcta":2,"explicacion":"El antebrazo tiene **dos compartimentos** (volar, dividido en superficial y profundo, y dorsal). Se recomienda **UNA incisión** desde la **fosa antecubital hasta el pliegue de la muñeca**; solo si el dorsal sigue tenso se añade una incisión dorsal desde distal al **epicóndilo lateral**.","por_opcion":["❌ La incisión dorsal solo se añade si el compartimento dorsal sigue tenso tras la descompresión volar.","❌ La incisión dorsal se inicia distal al epicóndilo **lateral** y llega a la parte distal del antebrazo.","✅ Una incisión volar de fosa antecubital a pliegue de la muñeca.","❌ Cuatro compartimentos y dos incisiones corresponde a la **pierna**."]},{"pregunta":"Durante la isquemia que precede a la reperfusión, ¿qué cambio en los agentes bioactivos endoteliales describe el temario?","opciones":["Descenso de la prostaciclina y aumento de la endotelina","Aumento de la trombomodulina y de la cNOS","Aumento del óxido nítrico y de la prostaciclina","Descenso de la endotelina y del tromboxano A2"],"correcta":0,"explicacion":"La isquemia **disminuye** la producción de **prostaciclina y óxido nítrico** y **acelera** la de **endotelina y tromboxano A2**; además suprime trombomodulina y cNOS y expresa moléculas de adhesión y citoquinas: un estado proinflamatorio.","por_opcion":["✅ Cae la prostaciclina (y el NO) y aumenta la endotelina (y el TXA2).","❌ La trombomodulina y la cNOS se **suprimen**.","❌ El óxido nítrico y la prostaciclina **disminuyen** en la isquemia.","❌ La endotelina y el tromboxano A2 **aumentan**."]}],"asignatura":"Patología quirúrgica I","tema":8,"fecha":"2026-11-10"}</script>
<div id="app"></div>
<script>
(function(){
const F = JSON.parse(document.getElementById('datos').textContent);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => `<span class="md">${esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}</span>`;
const L = 'ABCD';
const secs = F.secciones || [];
const grande = F.tipo === 'grand-qcm';

/* color de la asignatura */
const asig = (F.asignatura||'').toLowerCase();
const tono = /neuro/.test(asig)?285 : /biolog/.test(asig)?168 : /drenaje|linf/.test(asig)?205 : /quir|patolog/.test(asig)?350 : /ortes|prot/.test(asig)?32 : 248;
document.documentElement.style.setProperty('--h', tono);
const icono = /neuro/.test(asig)?'🧠':/biolog/.test(asig)?'🔬':/drenaje|linf/.test(asig)?'💧':/quir|patolog/.test(asig)?'🩺':/ortes|prot/.test(asig)?'🦿':'📘';
const ICS = ['🧩','⚙️','🔎','🧪','📐','🧭','💡','🗂️','🫀','🦴'];

function bloque(b){
  switch(b.tipo){
    case 'parrafo': return `<p>${md(b.texto)}</p>`;
    case 'lista': return `<ul class="lista">${(b.items||[]).map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
    case 'tabla': return `<div class="tw"><table>${b.titulo?`<caption>${md(b.titulo)}</caption>`:''}<thead><tr>${(b.columnas||[]).map(c=>`<th>${md(c)}</th>`).join('')}</tr></thead><tbody>${(b.filas||[]).map(f=>`<tr>${f.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'tarjetas': return `<div class="cartas">${(b.items||[]).map(t=>`<div class="carta">${t.etiqueta?`<span class="et">${md(t.etiqueta)}</span>`:''}<h3>${md(t.titulo)}</h3>${md(t.texto)}</div>`).join('')}</div>`;
    case 'definicion': return `<div class="nota n-def"><span class="t">${md(b.termino)}</span>${md(b.texto)}</div>`;
    case 'perla': return `<div class="nota n-cli"><span class="t">Perla clínica</span>${md(b.texto)}</div>`;
    case 'alerta': return `<div class="nota n-ojo"><span class="t">Ojo en el examen</span>${md(b.texto)}</div>`;
    case 'dato': return `<div class="nota n-dato"><span class="t">Dato para memorizar</span>${b.valor?`<span class="v">${esc(b.valor)}</span>`:''}${md(b.texto)}</div>`;
    case 'esquema': return b.mermaid ? `<figure class="esq"><div class="lienzo"><pre class="mermaid">${esc(b.mermaid)}</pre></div>${b.titulo||b.pie?`<figcaption>${b.titulo?`<b>${esc(b.titulo)}</b>${b.pie?' — ':''}`:''}${md(b.pie||'')}</figcaption>`:''}</figure>` : '';
    case 'figura': return b.src ? `<figure><img src="${esc(b.src)}" alt="${esc(b.pie||'Figura del curso')}" loading="lazy">${b.pie?`<figcaption>${md(b.pie)}</figcaption>`:''}</figure>` : '';
    default: return b.texto ? `<p>${md(b.texto)}</p>` : '';
  }
}

const resumen = F.resumen || [];
const preg = F.preguntate || [];
const nav = [
  resumen.length?'<a href="#resumen">En 30 s</a>':'',
  ...secs.map(s=>`<a href="#${esc(s.id)}">${esc(s.titulo)}</a>`),
  F.caso_clinico?'<a href="#caso">Caso clínico</a>':'',
  preg.length?'<a href="#preguntate">Pregúntate</a>':'',
  F.glosario?.length?'<a href="#glosario">Glosario</a>':'',
  `<a class="fuerte" href="#qcm">QCM · ${(F.qcm||[]).length}</a>`].join('');

document.getElementById('app').innerHTML = `
<header class="portada">${F.tema!=null?`<div class="numero" aria-hidden="true">${esc(F.tema)}</div>`:''}<div class="env">
  <div class="chips"><a class="chip" href="../index.html" style="text-decoration:none">← Mis fichas</a>${F.asignatura?`<span class="chip">${icono} ${esc(F.asignatura)}</span>`:''}${F.tema!=null?`<span class="chip">Tema ${esc(F.tema)}</span>`:''}${grande?'<span class="chip">🎯 Gran QCM</span>':''}</div>
  <h1>${esc(F.titulo)}</h1>
  ${F.subtitulo?`<p class="sub">${md(F.subtitulo)}</p>`:''}
  <div class="cifras">${grande?`<div class="cifra"><b>${(F.fichas||[]).length}</b><span>temas</span></div>`:`<div class="cifra"><b>${secs.length}</b><span>secciones</span></div><div class="cifra"><b>${preg.length||(F.ideas_clave||[]).length}</b><span>${preg.length?'preguntas clave':'ideas clave'}</span></div>`}<div class="cifra"><b>${(F.qcm||[]).length}</b><span>preguntas QCM</span></div><div class="cifra" id="ultimo" hidden></div></div>
  <div class="herram">${grande?'':`<button class="bot sec" onclick="window.print()">🖨️ Versión imprimible</button>`}<a class="bot" href="#qcm">✍️ Hacer el QCM</a></div>
  ${grande?'':`<div class="leyenda"><span><i style="background:var(--def)"></i>Definición</span><span><i style="background:var(--cli)"></i>Clínica</span><span><i style="background:var(--ojo)"></i>Trampa de examen</span><span><i style="background:var(--dato)"></i>Dato a memorizar</span></div>`}
</div></header>
<nav class="indice" aria-label="Índice"><div class="env">${nav}</div></nav>
<main class="env">
  ${resumen.length?`<section id="resumen" style="padding-top:34px"><div class="flash"><h3>⚡ Todo el tema en 30 segundos</h3><ol>${resumen.map(r=>`<li>${md(r)}</li>`).join('')}</ol></div></section>`:''}
  ${(F.objetivos||[]).length||(F.ideas_clave||[]).length?`<div class="duo">
    ${(F.objetivos||[]).length?`<div class="tarjeta"><h3>🎯 Objetivos</h3><ul>${F.objetivos.map(o=>`<li>${md(o)}</li>`).join('')}</ul></div>`:''}
    ${(F.ideas_clave||[]).length?`<div class="tarjeta"><h3>⭐ Lo que hay que saber</h3><ol class="claves">${F.ideas_clave.map(o=>`<li>${md(o)}</li>`).join('')}</ol></div>`:''}
  </div>`:''}
  ${grande&&(F.fichas||[]).length?`<div class="tarjeta" style="margin-top:34px"><h3>📚 Temas incluidos</h3><ul>${F.fichas.map(f=>`<li><a href="../fichas/${esc(f.slug)}.html">${esc(f.titulo)}</a></li>`).join('')}</ul></div>`:''}
  ${secs.map((s,i)=>`<section id="${esc(s.id)}"><span class="kicker"><i>${ICS[i%ICS.length]}</i>Parte ${i+1}</span><h2>${md(s.titulo)}</h2>${(s.bloques||[]).map(bloque).join('')}</section>`).join('')}
  ${F.caso_clinico?`<section id="caso"><div class="caso"><span class="kicker"><i>🧑‍⚕️</i>Caso clínico</span><h2>${md(F.caso_clinico.titulo)}</h2><p>${md(F.caso_clinico.presentacion)}</p>${(F.caso_clinico.preguntas||[]).map(q=>`<details><summary>${md(q.pregunta)}</summary><p>${md(q.respuesta)}</p></details>`).join('')}</div></section>`:''}
  ${preg.length?`<section id="preguntate"><span class="kicker"><i>🧠</i>Recuerdo activo</span><div class="preg-cab"><h2 style="margin:0">Pregúntate</h2><span class="marcador" id="marc">Responde de memoria y destapa la respuesta</span></div>
    <div class="pregs">${preg.map((p,i)=>`<div class="preg" data-i="${i}"><button class="q" aria-expanded="false"><span class="num">${i+1}</span><span>${md(p.pregunta)}</span><span class="ojo">Ver respuesta</span></button><div class="r">${md(p.respuesta)}<div class="auto"><button data-v="si">✓ Lo sabía</button><button data-v="no">✗ A repasar</button></div></div></div>`).join('')}</div></section>`:''}
  ${F.glosario?.length?`<section id="glosario"><span class="kicker"><i>📖</i>Vocabulario</span><h2>Glosario</h2><dl class="glosario">${F.glosario.map(g=>`<div><dt>${md(g.termino)}</dt><dd>${md(g.definicion)}</dd></div>`).join('')}</dl></section>`:''}
  <section id="qcm"><span class="kicker"><i>✍️</i>Autoevaluación</span><h2>QCM</h2><p>${(F.qcm||[]).length} preguntas de nivel examen. Responde sin mirar la ficha.</p><div class="marco" id="marco"></div></section>
  ${F.fuentes?.length?`<section><h3>Fuentes</h3><ul class="lista fuentes">${F.fuentes.map(f=>`<li>${md(f)}</li>`).join('')}</ul></section>`:''}
</main>
<footer class="env">Ficha generada a partir del PDF del curso${F.fecha?` · ${esc(F.fecha)}`:''}. Verifica siempre con el material oficial.</footer>`;

/* barra de lectura */
const barraL=document.getElementById('lectura');
addEventListener('scroll',()=>{const h=document.documentElement;barraL.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* pregúntate */
const estado={};
function marcador(){const v=Object.values(estado);const m=document.getElementById('marc');if(m&&v.length)m.innerHTML=`<b>${v.filter(x=>x==='si').length}</b> / ${preg.length} sabidas · ${v.filter(x=>x==='no').length} a repasar`}
document.querySelectorAll('.preg').forEach(el=>{
  const q=el.querySelector('.q');
  q.onclick=()=>{const a=el.classList.toggle('abierta');q.setAttribute('aria-expanded',a)};
  el.querySelectorAll('.auto button').forEach(b=>b.onclick=()=>{estado[el.dataset.i]=b.dataset.v;el.classList.remove('si','no');el.classList.add(b.dataset.v);marcador()});
});

/* esquemas */
(async function(){
  const els=[...document.querySelectorAll('pre.mermaid')];
  if(!els.length||!window.mermaid) return;
  const oscuro=matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',fontFamily:'Figtree, system-ui, sans-serif',
    themeVariables:oscuro?{primaryColor:`hsl(${tono} 30% 24%)`,primaryBorderColor:`hsl(${tono} 70% 65%)`,primaryTextColor:'#ecebf2',lineColor:`hsl(${tono} 50% 70%)`,clusterBkg:'#1c1b24',clusterBorder:'#2c2a37',edgeLabelBackground:'#14131a'}
      :{primaryColor:`hsl(${tono} 85% 95%)`,primaryBorderColor:`hsl(${tono} 60% 60%)`,primaryTextColor:'#1d1b26',lineColor:`hsl(${tono} 40% 55%)`,clusterBkg:'#fbfaf7',clusterBorder:'#ebe8f0',edgeLabelBackground:'#ffffff'},
    flowchart:{htmlLabels:true,curve:'basis',padding:14}});
  for(const el of els){ try{ await mermaid.parse(el.textContent); }catch(e){ el.closest('figure').remove(); } }
  try{ await mermaid.run({querySelector:'pre.mermaid'}); }catch(e){}
})();

/* dernière fiche ouverte + carnet d'erreurs + envoi du score vers Notion */
const slugPag = location.pathname.split('/').pop().replace(/\.html$/, '');
const carpeta = grande ? 'qcm' : 'fichas';
try{ localStorage.setItem('ultima', JSON.stringify({href:`${carpeta}/${slugPag}.html`, titulo:F.titulo, t:Date.now()})); }catch(e){}
function errorGuardar(k, fallo){
  try{
    const E = JSON.parse(localStorage.getItem('errores')||'{}'), id = `${slugPag}#${k}`;
    if(fallo){ const q = Q[k]; E[id] = {id, curso:F.asignatura, tema:(F.tema ?? q.tema ?? null), titulo:F.titulo, href:`${carpeta}/${slugPag}.html`, q:{pregunta:q.pregunta, opciones:q.opciones, correcta:q.correcta, explicacion:q.explicacion, por_opcion:q.por_opcion}, n:(E[id]?.n||0)+1, t:Date.now()}; }
    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));
  }catch(e){}
}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

/* QCM */
const Q = F.qcm || [];
const clave = 'qcm:' + location.pathname;
let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
