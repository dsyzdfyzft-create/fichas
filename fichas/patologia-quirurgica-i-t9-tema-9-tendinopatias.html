<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tema 9. Tendinopatías · Ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --h:262; /* tono de la asignatura, se ajusta por JS */
  --papel:#fbfaf7; --hoja:#ffffff; --tinta:#1d1b26; --suave:#63606f; --linea:#ebe8f0;
  --acento:hsl(var(--h) 62% 52%); --acento-2:hsl(calc(var(--h) + 40) 75% 60%);
  --acento-suave:hsl(var(--h) 80% 96%); --acento-tinta:hsl(var(--h) 55% 34%);
  --def:#2f6fed; --def-s:#eaf1ff; --cli:#1f9d61; --cli-s:#e5f6ec; --ojo:#e0453a; --ojo-s:#fdecea; --dato:#c7850f; --dato-s:#fdf3df;
  --sombra:0 1px 2px rgba(29,27,38,.04),0 8px 24px -12px rgba(29,27,38,.12);
  --display:"Fraunces",Georgia,serif; --texto:"Figtree",-apple-system,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--papel:#14131a; --hoja:#1c1b24; --tinta:#ecebf2; --suave:#a3a0b2; --linea:#2c2a37;
  --acento:hsl(var(--h) 75% 70%); --acento-2:hsl(calc(var(--h) + 40) 75% 66%); --acento-suave:hsl(var(--h) 30% 20%); --acento-tinta:hsl(var(--h) 80% 82%);
  --def:#7aa6ff; --def-s:#1b2640; --cli:#5fd396; --cli-s:#16301f; --ojo:#ff8a80; --ojo-s:#3a1d1b; --dato:#f2bd55; --dato-s:#372a12;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--papel);color:var(--tinta);font:17.5px/1.65 var(--texto);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;font-variation-settings:"SOFT" 100}
a{color:var(--acento-tinta)}
b,strong{font-weight:700}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.env{max-width:860px;margin:0 auto;padding:0 22px}
#lectura{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));z-index:30}
/* portada */
.portada{position:relative;overflow:hidden;padding:72px 0 46px;background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 90% 88% / .9),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 90% 88% / .7),transparent 70%),var(--papel)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .portada{background:radial-gradient(ellipse 60% 80% at 85% 0%,hsl(var(--h) 60% 30% / .55),transparent 70%),radial-gradient(ellipse 50% 70% at 0% 100%,hsl(calc(var(--h) + 40) 60% 28% / .45),transparent 70%),var(--papel)}}
.portada .numero{position:absolute;right:-10px;top:10px;font:900 clamp(9rem,28vw,17rem)/1 var(--display);color:hsl(var(--h) 70% 60% / .13);pointer-events:none;letter-spacing:-.05em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .78rem/1 var(--texto);padding:8px 12px;border-radius:999px;background:var(--hoja);box-shadow:var(--sombra);color:var(--acento-tinta)}
.portada h1{font-size:clamp(2.2rem,5.4vw,3.7rem);font-weight:800;letter-spacing:-.03em;max-width:20ch;position:relative}
.portada .sub{font-size:1.2rem;color:var(--suave);margin:16px 0 0;max-width:58ch;position:relative}
.cifras{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;position:relative}
.cifra{background:var(--hoja);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:96px}
.cifra b{display:block;font:800 1.6rem/1.1 var(--display)}
.cifra span{font-size:.8rem;color:var(--suave)}
.herram{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;position:relative}
.bot{font:700 .9rem var(--texto);padding:10px 16px;border-radius:12px;border:0;cursor:pointer;background:var(--tinta);color:var(--papel);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.bot.sec{background:var(--hoja);color:var(--tinta);box-shadow:var(--sombra)}
.bot[disabled]{opacity:.35;cursor:default}
/* navegación */
nav.indice{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:color-mix(in srgb,var(--papel) 85%,transparent);backdrop-filter:blur(14px)}
nav.indice .env{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:10px;padding-bottom:10px}
nav.indice .env::-webkit-scrollbar{display:none}
nav.indice a{white-space:nowrap;text-decoration:none;color:var(--suave);font:600 .86rem var(--texto);padding:7px 12px;border-radius:10px}
nav.indice a:hover{background:var(--hoja);color:var(--tinta)}
nav.indice a.fuerte{background:var(--acento);color:#fff}
main section{padding:52px 0 6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font:700 .78rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--acento-tinta);margin-bottom:10px}
.kicker i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--acento-suave);font-size:.95rem;letter-spacing:0}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
p{margin:0 0 16px;max-width:70ch}
mark,.md b{background:linear-gradient(transparent 58%,hsl(var(--h) 90% 80% / .55) 58%);color:inherit;padding:0 1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md b{background:linear-gradient(transparent 58%,hsl(var(--h) 60% 45% / .45) 58%)}}
/* código de colores */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--suave);margin:18px 0 0}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:block}
/* resumen 30 s */
.flash{margin-top:34px;border-radius:22px;padding:24px 26px;background:linear-gradient(135deg,var(--acento),var(--acento-2));color:#fff;box-shadow:var(--sombra)}
.flash h3{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.flash ol{margin:0;padding-left:1.3em}
.flash li{margin:6px 0;font-weight:500}
.flash .md b{text-decoration:underline;text-decoration-color:rgba(255,255,255,.5);text-underline-offset:3px}
.duo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.4fr);gap:16px;margin-top:18px;align-items:start}
.tarjeta{background:var(--hoja);border-radius:18px;padding:20px 22px;box-shadow:var(--sombra)}
.tarjeta h3{font-size:1.15rem;margin-bottom:10px}
.tarjeta ul{margin:0;padding-left:1.15em}
.tarjeta li{margin:5px 0}
.claves{list-style:none;padding:0!important;counter-reset:k}
.claves li{counter-increment:k;padding-left:36px;position:relative;margin:9px 0}
.claves li::before{content:counter(k);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/25px var(--texto);text-align:center}
/* bloques */
ul.lista{padding-left:1.2em;margin:0 0 18px}
ul.lista li{margin:6px 0}
ul.lista li::marker{color:var(--acento)}
.tw{overflow-x:auto;margin:6px 0 24px;border-radius:16px;background:var(--hoja);box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.45}
caption{caption-side:top;text-align:left;font:800 1rem var(--display);padding:16px 18px 6px}
th,td{padding:11px 16px;text-align:left;vertical-align:top}
thead th{background:var(--acento-suave);color:var(--acento-tinta);font:700 .8rem var(--texto);letter-spacing:.03em;text-transform:uppercase}
tbody tr+tr td{border-top:1px solid var(--linea)}
tbody td:first-child{font-weight:600}
.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:6px 0 24px}
.carta{background:var(--hoja);border-radius:16px;padding:16px 18px;box-shadow:var(--sombra);font-size:.95rem;line-height:1.5;border-top:4px solid var(--acento)}
.carta:nth-child(3n+2){border-top-color:var(--acento-2)}
.carta:nth-child(3n+3){border-top-color:hsl(calc(var(--h) - 40) 70% 60%)}
.carta .et{font:700 .7rem var(--texto);letter-spacing:.06em;text-transform:uppercase;color:var(--suave);display:block;margin-bottom:4px}
.carta h3{font-size:1.05rem;margin-bottom:6px}
.nota{border-radius:16px;padding:14px 18px 14px 54px;margin:0 0 20px;position:relative;font-size:.97rem}
.nota::before{position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:.95rem}
.nota .t{font:800 .74rem var(--texto);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.nota .md b,.flash .md b{background:none}
.n-def{background:var(--def-s)}.n-def::before{content:"📘";background:#fff8}.n-def .t{color:var(--def)}
.n-cli{background:var(--cli-s)}.n-cli::before{content:"🩺";background:#fff8}.n-cli .t{color:var(--cli)}
.n-ojo{background:var(--ojo-s)}.n-ojo::before{content:"⚠️";background:#fff8}.n-ojo .t{color:var(--ojo)}
.n-dato{background:var(--dato-s)}.n-dato::before{content:"🔢";background:#fff8}.n-dato .t{color:var(--dato)}
.n-dato .v{font:800 1.5rem/1.1 var(--display);color:var(--dato);display:block;margin:2px 0 4px}
figure{margin:8px 0 26px;background:var(--hoja);border-radius:18px;overflow:hidden;box-shadow:var(--sombra)}
figure img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#fff}
figure.esq .lienzo{padding:22px 16px 10px;overflow-x:auto}
figure.esq .lienzo svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.esq pre.mermaid{margin:0;font-size:.8rem;color:var(--suave);white-space:pre-wrap}
figcaption{padding:12px 18px 14px;font-size:.92rem;color:var(--suave);border-top:1px solid var(--linea)}
figcaption b{color:var(--tinta)}
/* pregúntate */
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marcador{font:700 .85rem var(--texto);color:var(--suave)}
.marcador b{color:var(--cli)}
.pregs{display:grid;gap:12px}
.preg{background:var(--hoja);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.preg button.q{all:unset;box-sizing:border-box;display:flex;gap:12px;width:100%;padding:16px 18px;cursor:pointer;font-weight:600;align-items:flex-start}
.preg button.q:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.preg .num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--acento-suave);color:var(--acento-tinta);font:800 .8rem/26px var(--texto);text-align:center}
.preg .ojo{margin-left:auto;font-size:.8rem;color:var(--suave);white-space:nowrap;font-weight:500}
.preg .r{display:none;padding:0 18px 16px 56px}
.preg.abierta .r{display:block}
.preg.abierta .ojo{display:none}
.preg .auto{display:flex;gap:8px;margin-top:10px}
.preg .auto button{border:0;border-radius:10px;padding:6px 12px;font:700 .8rem var(--texto);cursor:pointer;background:var(--papel);color:var(--tinta)}
.preg.si{box-shadow:inset 4px 0 0 var(--cli),var(--sombra)}
.preg.no{box-shadow:inset 4px 0 0 var(--ojo),var(--sombra)}
/* caso clínico */
.caso{border-radius:24px;padding:30px 30px 18px;background:linear-gradient(160deg,hsl(var(--h) 40% 22%),hsl(calc(var(--h) + 30) 45% 18%));color:#f4f2fa;box-shadow:var(--sombra)}
.caso h2{color:#fff}
.caso .kicker{color:hsl(var(--h) 90% 85%)}
.caso .kicker i{background:rgba(255,255,255,.12)}
.caso details{border-top:1px solid rgba(255,255,255,.14);padding:12px 0}
.caso summary{cursor:pointer;font-weight:700}
.caso details p{margin:10px 0 0;color:#e2deee}
dl.glosario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0}
dl.glosario div{background:var(--hoja);border-radius:14px;padding:12px 16px;box-shadow:var(--sombra)}
dl.glosario dt{font:800 1rem var(--display);color:var(--def)}
dl.glosario dd{margin:4px 0 0;font-size:.93rem}
.fuentes{font-size:.88rem;color:var(--suave)}
/* QCM */
#qcm .marco{background:var(--hoja);border-radius:24px;padding:28px;box-shadow:var(--sombra)}
.progreso{display:flex;align-items:center;gap:14px;margin-bottom:20px;font:700 .85rem var(--texto);color:var(--suave)}
.barra{flex:1;height:10px;border-radius:5px;background:var(--linea);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--acento-2));transition:width .35s}
.tema-q{display:inline-block;margin-bottom:12px;font:700 .75rem var(--texto);padding:5px 10px;border-radius:999px;background:var(--dato-s);color:var(--dato)}
.pregunta{font:700 1.3rem/1.35 var(--display);margin:0 0 20px}
.opciones{display:grid;gap:10px}
.op{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta);font:inherit;font-size:1rem;line-height:1.45;cursor:pointer;transition:border-color .15s,transform .15s}
.op:hover:not([disabled]){border-color:var(--acento);transform:translateY(-1px)}
.op .l{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:800 .9rem var(--texto);background:var(--hoja);box-shadow:var(--sombra)}
.op[disabled]{cursor:default}
.op.bien{border-color:var(--cli);background:var(--cli-s)}
.op.bien .l{background:var(--cli);color:#fff}
.op.mal{border-color:var(--ojo);background:var(--ojo-s)}
.op.mal .l{background:var(--ojo);color:#fff}
.op .ex{grid-column:2;font-size:.92rem;color:var(--suave);margin-top:6px;display:none}
.op.visto .ex{display:block}
.explic{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--acento-suave);font-size:.98rem;display:none}
.explic.ver{display:block}
.acciones{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.resultado{text-align:center;padding:10px 0}
.resultado .gran{font:900 4.6rem/1 var(--display);background:linear-gradient(135deg,var(--acento),var(--acento-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.resultado .gran small{font-size:1.6rem}
.repaso{text-align:left;margin-top:24px}
.repaso details{border-top:1px solid var(--linea);padding:12px 0}
.repaso summary{cursor:pointer;font-weight:700}
footer{padding:60px 0 80px;color:var(--suave);font-size:.85rem}
@media (max-width:720px){body{font-size:16.5px}.duo{grid-template-columns:1fr}.caso{padding:24px 20px 12px}#qcm .marco{padding:20px 16px}.portada{padding-top:52px}.preg .r{padding-left:18px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.barra i,.op{transition:none}}
/* versión imprimible */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:10.5pt;line-height:1.45;color:#000}
  nav.indice,#qcm,.herram,#lectura,.preg .ojo,.preg .auto,.preg-cab .bot,.portada .numero,.cifras{display:none!important}
  .portada{padding:0 0 10px;background:none}.portada h1{font-size:22pt;max-width:none}
  main section{padding:14px 0 0;break-inside:auto}
  h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .tarjeta,.carta,.tw,figure,.preg,.nota,dl.glosario div{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .flash{background:none;color:#000;border:2px solid #000;box-shadow:none}
  .preg .r{display:block!important;padding-left:56px}
  .caso{background:none;color:#000;border:1px solid #999}.caso h2{color:#000}.caso details>*{display:block}.caso details p{color:#000}
  details>summary{list-style:none}details{display:block}details>p{display:block!important}
  a{color:#000;text-decoration:none}
}
</style>
</head>

<script id="datos" type="application/json">{"titulo":"Tema 9. Tendinopatías","subtitulo":"Del tendón sano al modelo continuum: estructura, mecanismos lesionales, clasificación, patología inflamatoria de la vaina y tratamiento basado en la carga (isométricos y excéntricos).","resumen":["El tendón es sobre todo **agua (55-70 %)** y, en peso seco, **colágeno (60-85 %)**, del que el **tipo I es el 95 %**; los tenocitos responden a la carga local sin depender del SNC.","El **cuerpo del tendón** es la zona más vulnerable porque está **peor perfundida**: recibe sangre del tejido conectivo circundante (paratenon o vaina) que **no penetra** en el tendón.","Según el consenso **ICON 2019**, *tendinopatía* es el término preferido para el **dolor tendinoso persistente y la pérdida de función relacionados con la carga mecánica**; la *tendinosis* es solo una descripción estructural de imagen.","El **modelo continuum** (Cook y Purdam) describe tres estadios reversibles y convivientes: **reactiva → desestructurada (dysrepair) → degenerativa**, y el **97 % de las roturas** tendinosas presentan cambios degenerativos.","El tratamiento se basa en **educación, carga, ejercicio y monitorización**: **isométricos** (40-60 s × 4-5 rep, 25-50 % 1RM) para analgesia y **excéntricos** (Alfredson: **3×15, 2 veces/día, 7 días/semana, 12 semanas**)."],"objetivos":["Describir la composición macro y microscópica del tendón, su irrigación e inervación, y relacionarlas con la localización de las lesiones.","Diferenciar tendinitis, paratendinitis, tenosinovitis, tendinosis, paratendinopatía y tendinopatía según la terminología actual (ICON 2019).","Explicar los tres estadios del modelo continuum y los hallazgos histológicos de la tendinopatía crónica por sobreuso.","Reconocer las tenosinovitis agudas y crónicas (De Quervain, dedo en resorte, reumatoidea, tuberculosa) y su manejo.","Aplicar los protocolos de ejercicio isométrico y excéntrico (Curwin y Stanish, Alfredson) y conocer las limitaciones de los tratamientos químicos y físicos."],"ideas_clave":["Composición: agua 55-70 %; colágeno 60-85 % del peso seco (tipo I = 95 %; tipo III segundo más abundante); elastina 1-2 %; proteoglicanos y GAGs 5-10 %.","Los primeros cambios histológicos de la tendinopatía no son del colágeno sino un **aumento de proteoglicanos/GAGs** (efecto Donnan → más agua → tendón engrosado).","Irrigación por 3 zonas (UMT, UOT y tejido conectivo circundante); el cuerpo del tendón es la zona peor perfundida y más sensible a la lesión.","Mecanismos mecánicos: compresión reiterada (impingement), tracción/sobreuso (microtraumatismos) y contusión/macrotraumatismo.","En la tendinopatía crónica por sobreuso **no hay células inflamatorias**: fibroblastos aumentados, colágeno desorganizado, hiperplasia vascular y microcalcificaciones.","Modelo continuum: reactiva (reversible, sin desorganización de matriz) → dysrepair (matriz desorganizada, suele ser asintomático) → degenerativa (zonas mecánicamente inservibles, riesgo de rotura).","Los isométricos de larga duración tienen un potente efecto analgésico; el excéntrico es la técnica fisioterápica con mejores resultados en tendinopatía crónica (≈70 % buenos resultados en rotuliana, Visnes y Bahr 2007).","Los medios físicos dan resultados ciertos a corto plazo e inciertos a largo plazo; los factores de crecimiento solo tienen estudios experimentales en animales."],"secciones":[{"id":"estructura","titulo":"Estructura del tendón","bloques":[{"tipo":"parrafo","texto":"Macroscópicamente, el tendón sano es **blanco, brillante y rígido**, aunque con cierto grado de flexibilidad. Está constituido **predominantemente por agua (55-70 %)** y la mayor parte de su peso seco es **colágeno (60-85 %)**, rodeado de matriz extracelular (MEC). Los haces se agrupan en estructuras de tejido conjuntivo que permiten nutrición, inervación y deslizamiento."},{"tipo":"figura","pagina":3,"pie":"Organización jerárquica del tendón: fibrillas de colágeno → haces envueltos por el endotenon → fascículos rodeados por epitenon y paratenon. Fíjate en que el endotenon lleva vasos y nervios entre los haces.","src":"img/patologia-quirurgica-i-t9-tema-9-tendinopatias-p3.jpg"},{"tipo":"definicion","termino":"Endotenon","texto":"Agrupación de los haces primarios rodeados por una capa de tejido conjuntivo **irrigado e inervado**."},{"tipo":"definicion","termino":"Peritenon","texto":"Unión de dos fascículos con **dos capas de conjuntivo** (paratendón y epitenon) que permiten el deslizamiento entre sí. Las estructuras paratendinosas varían según las fuerzas mecánicas: **paratendón** en el tendón rotuliano, **vaina sinovial** en los tendones peroneos."},{"tipo":"tabla","titulo":"Composición microscópica del tendón","columnas":["Componente","Proporción / tipos","Función"],"filas":[["Tenocitos (fibroblastos)","Células fusiformes, sección estrellada","Sintetizan y mantienen la MEC; reaccionan a fuerzas mecánicas locales (no dependen del SNC)"],["Metaloproteinasas (MMPs)","Enzimas","Degradan la matriz extracelular"],["Colágeno","60-85 % del peso seco; tipo I = 95 %; 5 % restante tipos III, IV, V, VI, XII","Soportar tensión (triple hélice con enlaces cruzados)"],["Elastina","1-2 %","Elasticidad"],["Proteoglicanos y GAGs","5-10 % (agrecano, decorina, biglicano; ácido hialurónico, condroitín sulfato)","Captar agua, viscosidad, resistencia a la compresión, organizar el colágeno"],["Glicoproteínas","Pocos azúcares (p. ej. fibronectina)","Conectar estructuras: unión célula-matriz, migración celular, reparación"]]},{"tipo":"tarjetas","items":[{"etiqueta":"GAGs","titulo":"Ácido hialurónico","texto":"Cadenas largas de azúcares repetidos: captan agua, dan viscosidad y resisten la compresión."},{"etiqueta":"PG","titulo":"Decorina","texto":"Proteína con muchos GAGs unidos: organiza el colágeno, regula la hidratación y participa en la mecanotransducción."},{"etiqueta":"GP","titulo":"Fibronectina","texto":"Proteína con pocos azúcares: no hidrata, conecta estructuras (unión célula-matriz, reparación tisular)."}]},{"tipo":"parrafo","texto":"El **colágeno tipo I** es el predominante y el **tipo III** el segundo más abundante. Es una cadena de polipéptidos en **triple hélice** unida por **enlaces cruzados** que se forman durante el metabolismo normal; con el tiempo el tendón se vuelve **más rígido y menos elástico**. Cada tendón tiene concentraciones diferentes para ajustarse a su biomecánica. El metabolismo del colágeno es **lento** y requiere equilibrio síntesis/destrucción, con aporte de proteínas, carbohidratos, **vitamina C** y minerales (hierro, cobre, zinc, manganeso)."},{"tipo":"dato","valor":"24-72 h","texto":"Pico de síntesis de colágeno tras el ejercicio o durante los procesos de lesión-reparación."},{"tipo":"alerta","texto":"Los **primeros cambios histológicos** importantes de una tendinopatía **no son del colágeno**, sino un **aumento de proteoglicanos, GAGs y glicoproteínas**. No confundas: la desorganización del colágeno es posterior."},{"tipo":"perla","texto":"**Efecto Donnan**: los proteoglicanos atrapados en la red de colágeno tienen alta carga negativa, atraen iones positivos y después agua. Por eso el tendón patológico suele tener un **diámetro mayor que el contralateral** en la ecografía: compara siempre con el lado sano."}]},{"id":"irrigacion-inervacion-funcion","titulo":"Irrigación, inervación y función","bloques":[{"tipo":"tabla","titulo":"Las 3 fuentes de irrigación del tendón","columnas":["Zona","Características","Relevancia clínica"],"filas":[["Unión miotendinosa (UMT)","Expansión de vasos del músculo a los fascículos del tendón","No suele ser zona de tendinopatías"],["Unión osteotendinosa (UOT)","Vasos de hueso y tendón que no se comunican por una membrana fibrocartilaginosa","Aporte menor; no vasculariza el cuerpo del tendón"],["Tejido conectivo circundante","**Principal aporte**; llega vía paratenon o vaina sinovial, **sin penetrar** en el tendón","El cuerpo del tendón está peor perfundido → zona más sensible a la lesión"]]},{"tipo":"alerta","texto":"Trampa típica: el **principal aporte** sanguíneo procede del **tejido conectivo circundante** (paratenon/vaina), no de la UMT ni de la UOT, y **no penetra** en la estructura tendinosa."},{"tipo":"parrafo","texto":"La inervación es **esencialmente aferente de tipo propioceptivo**, con 4 tipos de receptores: **corpúsculos de Ruffini, corpúsculos de Pacini, órganos tendinosos de Golgi** (convierten la deformación mecánica en información aferente) y **terminaciones nerviosas libres**. Las fibras proceden de la UMT y penetran en paratenon y epitenon, pero **no se introducen en el espesor del tendón**."},{"tipo":"parrafo","texto":"La función principal del tendón es **dispersar las fuerzas tensiles y estabilizar la articulación**. Con tensión se estira en la dirección de la carga y, cuando la carga disminuye, sus propiedades elásticas facilitan la reorientación de las fibras. Como su metabolismo es lento, la readaptación fisiológica de una tendinopatía depende de **tiempo** y **adaptación a la carga**."},{"tipo":"definicion","termino":"Tendinopatía (ICON 2019)","texto":"Término preferido para el **dolor tendinoso persistente y la pérdida de función relacionada con la carga mecánica**. Es genérico y no implica una etiología, bioquímica ni histología concreta."}]},{"id":"epidemiologia-factores","titulo":"Epidemiología, clínica y factores de riesgo","bloques":[{"tipo":"dato","valor":"15-30 %","texto":"Proporción de las tendinopatías sobre el total de patologías en deportistas."},{"tipo":"dato","valor":"14-16 % · hasta 50 %","texto":"La tendinopatía rotuliana es la más frecuente (14-16 %) y llega hasta el 50 % en deportes con salto como el voleibol (Zwerver, 2011)."},{"tipo":"parrafo","texto":"También se asocian a lesiones complejas de tejidos blandos (lesión del aductor largo en deportistas con pubalgia, Muth 2017). Los saltadores con tendinopatía rotuliana **doblan más la rodilla en la recepción** del salto y la **disquinesia escapular** se relaciona con tendinopatías del manguito rotador."},{"tipo":"lista","items":["**Dolor y rigidez a primera hora** del día o tras un periodo largo de menor actividad (p. ej. después de comer).","Fase inicial: dolor solo en los **primeros minutos de actividad**, que luego se reduce o desaparece (el tendón «se calienta»).","Progresión: dolor constante durante toda la actividad o posterior a ella.","Puede volverse un dolor de largo plazo (crónico) aunque empezara como un dolor agudo puntual."]},{"tipo":"tabla","titulo":"Factores de riesgo","columnas":["Intrínsecos","Extrínsecos"],"filas":[["Factores metabólicos (diabetes, sobrepeso)","**Errores de entrenamiento: hasta un 60 %** por mala planificación"],["Alteraciones biomecánicas (dismetrías, debilidad, menor flexibilidad, laxitud)","Falta de reposo"],["Edad; nutrición/hidratación","Equipación"],["Factores genéticos (polimorfismos en la síntesis de colágeno)","Factores medioambientales"],["Enfermedades sistémicas; medicación (AINEs y corticoides); hipertermia (fase plástica del tendón)","—"]]},{"tipo":"perla","texto":"No solo importa el volumen: un Aquiles se lesiona tras muchos kilómetros, pero también con pocos si el **glúteo medio no controla** y el retropié no controla la pronación; un supraespinoso, con pocas elevaciones si el **trapecio eleva el acromion**. El movimiento alterado hace que cada repetición suponga más carga: revisa siempre la cadena cinética."}]},{"id":"mecanismos-biomecanica","titulo":"Mecanismos lesionales y biomecánica","bloques":[{"tipo":"tarjetas","items":[{"etiqueta":"1","titulo":"Compresión reiterada (impingement)","texto":"Fricción o atrapamiento por anatomía vecina o trastornos posturales. Lesiona primero lo peritendinoso: vaina, paratenon, bolsa, grasas protectoras. Ej.: Aquiles contra el fulcro del calcáneo en flexión dorsal; supraespinoso contra el acromion."},{"etiqueta":"2","titulo":"Microtraumatismos (sobreuso)","texto":"Cargas de tensión repetitivas, compresión y abrasión, cambios rápidos de fuerzas, reposo insuficiente y fallo de reparación. El estadio sintomático aparece tras estadios subclínicos."},{"etiqueta":"3","titulo":"Macrotraumatismo","texto":"Una sola fuerza produce un desgarro aislado del tendón o de la UMT; en un tendón débil, fuerzas de una actividad habitual bastan."}]},{"tipo":"tabla","titulo":"Localización de la lesión y fuerza predominante","columnas":["Zona / fuerza","Lesión o ejemplo"],"filas":[["Unión osteotendinosa","Entesitis"],["Unión miotendinosa","Desgarro miotendinoso"],["Cuerpo del tendón","Tendinopatía nodular o corporal"],["Tracción","Aquiles, rotuliano"],["Pinzamiento","Manguito rotador"],["Rozamiento","Tibial posterior"]]},{"tipo":"figura","pagina":27,"pie":"Curva tensión-deformación del tendón (Wang, 2006): región «toe» (fibras onduladas que se alinean, ~2 %), región lineal (rango fisiológico hasta ~4 %), fallo microscópico y, más allá de ~8 %, fallo macroscópico y rotura.","src":"img/patologia-quirurgica-i-t9-tema-9-tendinopatias-p27.jpg"},{"tipo":"esquema","titulo":"Fases de la regeneración tendinosa","mermaid":"flowchart TD\n  A[\"Lesion tendinosa\"] --> B[\"Respuesta inflamatoria: 2-4 dias\"]\n  B --> C[\"Fase fibroblastica: 3 horas a 3-4 semanas\"]\n  C --> C1[\"Proliferacion de fibroblastos\"]\n  C --> C2[\"Sintesis de colageno\"]\n  C --> C3[\"Neovascularizacion\"]\n  C --> D[\"Remodelacion: desde la 3a semana el tejido puede ser firme\"]\n  D --> E[\"Maduracion: de 12 meses a varios anos\"]","pie":"La maduración del tendón dura de 12 meses a varios años: explica la lentitud de la readaptación."}]},{"id":"clasificacion","titulo":"Terminología y clasificación","bloques":[{"tipo":"tabla","titulo":"Términos clásicos y su significado actual","columnas":["Término","Tipo","Definición / rasgos"],"filas":[["Tendinitis","Aguda","Término histórico para dolor, engrosamiento y deterioro funcional; no implica un proceso patológico concreto"],["Paratendonitis","Aguda","Inflamación de las capas externas (tenosinovitis/paratendinitis: capa serosa única; tenovaginitis: vaina de doble capa). Edema, exudado fibroso, crepitación; si persiste, adherencias (red de fibrina)"],["Tendinopatía por sobreuso","Crónica","Lesión degenerativa **sin células inflamatorias**: más fibroblastos, colágeno fragmentado, hiperplasia vascular, microcalcificaciones; no siempre dolorosa"],["Paratendinopatía","Crónica","Degeneración intratendinosa sin inflamación **asociada a paratenonitis externa** con inflamación"],["Tendinosis","Imagen","Alteración estructural en pruebas de imagen; puede existir sin dolor. Es factor de riesgo, **no un diagnóstico clínico**"]]},{"tipo":"alerta","texto":"La **tendinosis** no basta para diagnosticar una tendinopatía: hace falta **dolor relacionado con la actividad y/o pérdida de función** en la exploración clínica. Imagen alterada ≠ paciente con tendinopatía."},{"tipo":"tabla","titulo":"Clasificación según el aparato de deslizamiento","columnas":["Rasgo","Extrasinoviales","Intrasinoviales"],"filas":[["Fricción","Zona de menor fricción","Zona de mayor fricción"],["Recorrido","Rectilíneo y corto","Largo, con cambios de dirección (muñeca, tobillo) por túneles osteofibrosos con poleas"],["Deslizamiento","Simple: paratendón","Complejo: vaina sinovial; mesotendón discontinuo con *vincula tendinae* por donde entran los vasos"],["Ejemplo","Tendón de Aquiles","Flexores de los dedos"],["Sección: cirugía","Conviene para recuperar fuerza muscular","Única manera de restablecer la función"]]},{"tipo":"parrafo","texto":"Según la **potencia del músculo**: los músculos potentes y proximales tienen tendones **anchos, aplanados y cortos**; los distales y débiles, tendones **largos, cilíndricos y estrechos**."},{"tipo":"parrafo","texto":"Las **heridas/secciones tendinosas** son frecuentes en la mano (traumatismos abiertos, tendones superficiales). Se diagnostican por inspección: el **cabo proximal se retrae hacia el músculo** por su tono, aparece una actitud anómala por predominio de los antagonistas y déficit del movimiento. Suelen tratarse quirúrgicamente para restaurar la continuidad con rapidez y evitar adherencias."}]},{"id":"patologia-inflamatoria","titulo":"Patología inflamatoria: tenosinovitis y paratendinitis","bloques":[{"tipo":"parrafo","texto":"Etiología: **irritación mecánica** del tendón sobre su vaina y poleas por sobreutilización (la más frecuente), propagación por continuidad, **inoculación de gérmenes** por herida o punción, y procesos generales (artritis reumatoide, enfermedades eruptivas). Las **tenosinovitis** afectan a tendones intrasinoviales; las **paratendinitis** (serosa, supurada, seca/crepitante) a los extrasinoviales."},{"tipo":"esquema","titulo":"Clasificación de la patología inflamatoria del tendón","mermaid":"flowchart TD\n  A[\"Patologia inflamatoria del tendon\"] --> B[\"Tenosinovitis (intrasinovial)\"]\n  A --> C[\"Paratendinitis (extrasinovial)\"]\n  B --> B1[\"Agudas\"]\n  B --> B2[\"Cronicas\"]\n  B1 --> S1[\"Serosa\"]\n  B1 --> S2[\"Supurada\"]\n  B2 --> K1[\"Tuberculosa\"]\n  B2 --> K2[\"Reumatoidea\"]\n  B2 --> K3[\"Estenosantes: De Quervain y dedo en resorte\"]\n  C --> P1[\"Serosa / supurada\"]\n  C --> P2[\"Seca o crepitante\"]","pie":"Intrasinovial = tenosinovitis; extrasinovial = paratendinitis."},{"tipo":"tabla","titulo":"Tenosinovitis: formas y rasgos clave","columnas":["Forma","Localización","Origen / mecanismo","Clínica y tratamiento"],"filas":[["Aguda serosa","Extensores de mano y pie","Enfermedad infecciosa general (gonorrea, sarampión, escarlatina)","Derrame seroso en la vaina; benigna, evoluciona con la enfermedad de base"],["Aguda supurada","Flexores de la mano","Inoculación directa (más frecuente) o propagación; estreptococos y estafilococos","Pus → trombosis de *vincula* → necrosis isquémica y rotura. Fiebre, impotencia funcional absoluta, dedo en gatillo antiálgico. Antibióticos, inmovilización y **cirugía obligada**"],["Crónica tuberculosa","Casi siempre la mano","Inoculación directa; profesionales en contacto con bovino (bacilo de Koch)","Muy rara, crónica y recidivante; pesadez, crepitación, tumefacción, rotura y fistulización. Dx por biopsia; extirpación completa"],["Crónica reumatoidea","Extensor largo del pulgar (tubérculo de Lister)","Acción enzimática, hipertrofia sinovial y vasculitis","Puede ser la primera expresión de la AR. Tratamiento de la AR (inmunosupresores, MTX) y sinovectomía si gran hipertrofia"],["Estenosante de De Quervain","Extensor corto y abductor largo del pulgar","Estenosis en el primer compartimento","Dolor y tumefacción en la base del pulgar; **Finkelstein**. Férula, reposo, corticoides; cirugía de liberación"],["Estenosante: dedo en resorte","Flexores de la mano, polea a nivel de la MCF","Nódulo del tendón en el túnel osteofibroso","Comienzo insidioso, chasquido y bloqueo. Conservador; cirugía"]]},{"tipo":"alerta","texto":"En la **tenosinovitis supurada** de los flexores la cirugía es **obligada**: el pus trombosa los vasos de la vaina y provoca necrosis isquémica y rotura del tendón. No es un cuadro para tratar solo con fisioterapia."},{"tipo":"perla","texto":"En De Quervain el dolor empeora al **pellizcar, asir** y con movimientos repetitivos de pulgar y muñeca (jardinería, golf, raqueta, levantar a un bebé): la educación sobre estas actividades forma parte del tratamiento conservador."}]},{"id":"modelo-continuum","titulo":"Modelo continuum y respuesta a la carga","bloques":[{"tipo":"parrafo","texto":"Hasta los años 90 se hablaba de *tendinitis* porque se asociaba el dolor a inflamación. Los análisis histopatológicos mostraron **ausencia de células inflamatorias**, de modo que hoy se descarta la inflamación como factor clave; se entiende como un proceso de alteración de la matriz y respuesta celular, de causa desconocida. Aunque los modelos incluyan una fase inflamatoria, en tendones lesionados sí se encuentra **mayor concentración de células apoptóticas y proinflamatorias**."},{"tipo":"figura","pagina":55,"pie":"Teoría de la carga mecánica (Wang et al., 2006): compresión, cizallamiento y estiramiento → mecanotransducción → expresión genética. Según la carga, la vía lleva a depósito de MEC y reparación, o a MMPs, mediadores lipídicos y citoquinas proinflamatorias que degeneran la MEC.","src":"img/patologia-quirurgica-i-t9-tema-9-tendinopatias-p55.jpg"},{"tipo":"figura","pagina":68,"pie":"Modelo continuum: la carga excesiva lleva del tendón normal a la tendinopatía reactiva, al dysrepair y a la degenerativa; la carga adecuada y modificada permite volver hacia el tendón normal y la adaptación. La descarga total (stress shielded) también es perjudicial.","src":"img/patologia-quirurgica-i-t9-tema-9-tendinopatias-p68.jpg"},{"tipo":"esquema","titulo":"Modelo continuum de Cook y Purdam","mermaid":"flowchart LR\n  N[\"Tendon normal\"] -->|\"Carga excesiva o subita\"| R[\"Tendinopatia reactiva\"]\n  R --> D[\"Tendon desestructurado (dysrepair)\"]\n  D --> G[\"Tendinopatia degenerativa\"]\n  R -->|\"Reducir la sobrecarga\"| N\n  D -->|\"Carga adecuada\"| R\n  G -->|\"Sobrecarga de la parte sana\"| RG[\"Reactiva sobre degenerado\"]\n  G -->|\"Degeneracion extensa y altas cargas\"| X[\"Rotura\"]\n  N -->|\"Carga optimizada\"| A[\"Adaptacion\"]","pie":"Los estadios son reversibles (sobre todo el reactivo) y pueden convivir en un mismo tendón."},{"tipo":"tabla","titulo":"Los tres estadios del continuum","columnas":["Estadio","Causas / histología","Imagen y clínica","Pronóstico"],"filas":[["1. Reactiva","Aumento repentino de carga, contusión, vuelta tras descarga, sedentario que inicia actividad. Hiperactividad celular, aumento de tenocitos y proteoglicanos (agua)","Tendón abultado con mayor diámetro, **sin desorganización de matriz**","Puede volver a la normalidad si se reduce la sobrecarga"],["2. Desestructurado (dysrepair)","Recuperación fallida: tenocitos redondeados, más PG y colágeno, colágeno no alineado, aumento de vasos y nervios","ECO: áreas focales hipoecoicas y discontinuidad de fascículos; RM: tendón engrandecido con más señal. **Suele ser asintomático**","Solo se diferencia del degenerado por la **ausencia de cambios vasculares**"],["3. Degenerativa","Zonas sin estructura fibrilar alineada, mezcladas con tendón sano y otras fases","Áreas nodulares con o sin engrosamiento; sin clínica hasta una sobrecarga","Zonas mecánicamente inservibles; rotura si la degeneración es extensa"]]},{"tipo":"figura","pagina":65,"pie":"Tendinopatía degenerativa: frente a las fibras de colágeno tipo I bien empaquetadas del tendón normal, aparecen celularidad aumentada (miofibroblastos), neovasos, más proteína de matriz y fibras de colágeno desordenadas.","src":"img/patologia-quirurgica-i-t9-tema-9-tendinopatias-p65.jpg"},{"tipo":"dato","valor":"97 %","texto":"Porcentaje de roturas tendinosas que presentan cambios degenerativos previos."},{"tipo":"perla","texto":"Un tendón degenerado suele ser **asintomático** hasta que una sobrecarga de su **parte sana y funcional** genera un cuadro **reactivo sobre tendón degenerado**: en ese momento el objetivo es calmar la reactividad modulando la carga, no «eliminar» la degeneración de la imagen."}]},{"id":"histologia-fisiopatologia","titulo":"Histología de la tendinopatía crónica y ciclo de la tendinosis","bloques":[{"tipo":"tabla","titulo":"Hallazgos histológicos más comunes en la tendinopatía crónica por sobreuso","columnas":["Grupo","Hallazgos"],"filas":[["Hipoxia","Vacuolas lipídicas y necrosis en tenocitos; cambios hipóxicos; necrosis focal y microcalcificaciones en la UOT; episodios isquémicos de repetición"],["Degeneración","Mixoide o mucoide (gel de células degradadas y desechos); fibrinoide y lipoide; adherencias irregulares en la cara profunda del paratenon y grasa retrotendinosa"],["Alteración","Cambios de tamaño y forma de mitocondrias y núcleo; colágeno desorganizado con rotura de puentes de enlace; hipervascularidad por hiperplasia vascular; liberación de neurotransmisores nociceptivos"]]},{"tipo":"parrafo","texto":"**Respuesta fisiológica a la carga**: la MEC es sensible al estrés mecánico y genera una señal (citoquinas, factores de crecimiento) que llega al fibroblasto por la unión **fibronectina-integrina** y activa la síntesis proteica de MEC. **Respuesta patológica**: el almacenamiento y liberación repetida de energía junto con la **compresión** son claves; la **hipoxia** promueve citoquinas proinflamatorias y mediadores apoptóticos y desvía la síntesis hacia **colágeno tipo III**, de peores propiedades que el tipo I. Con la edad aumenta el diámetro de las fibras, se pierde capacidad tensil y perfusión, y puede acumularse sustancia mucoide, lípidos o calcio (Svensson et al., 2016)."},{"tipo":"esquema","titulo":"Ciclo de la tendinosis (Yinghun et al., 2008)","mermaid":"flowchart TD\n  A[\"Sobrecarga mecanica repetida\"] --> B[\"Estres oxidativo del tenocito\"]\n  B --> C[\"Metabolismo anaerobico: mas lactato\"]\n  C --> D[\"Mas GAG, agrecano, elastina y agua; colageno tipo III\"]\n  D --> E[\"Tendon edematoso, engrosado y fragil\"]\n  E --> F[\"Apoptosis del tenocito\"]\n  F --> G[\"Catecolaminas y VEGF: neoangiogenesis\"]\n  G --> H[\"Desequilibrio MMPs e inhibidores\"]\n  G --> I[\"Neoinervacion: glutamato, NMDA, sustancia P\"]\n  I --> J[\"Dolor y mas vasodilatacion\"]\n  J --> K[\"Deterioro de la MEC y de la viscoelasticidad\"]\n  K --> A","pie":"Círculo vicioso: la neovascularización intenta reparar, pero trae neoinervación y dolor."},{"tipo":"alerta","texto":"En el ciclo de la tendinosis el colágeno producido es de **menor calidad (tipo III en lugar de tipo I)**. No digas que el tendón patológico «deja de producir colágeno»: produce más, pero peor."}]},{"id":"tratamiento","titulo":"Tratamiento","bloques":[{"tipo":"parrafo","texto":"Antes de tratar: **anamnesis amplia** e identificación de los factores extrínsecos e intrínsecos más relevantes. Los pilares son **educación, carga, ejercicio y monitorización**. El descanso ayuda a la reparación, pero la poca actividad metabólica alarga la curación y, cuando hay clínica, el daño ya es más extenso. Si la clínica es leve: reducir intensidad, frecuencia y duración, y aplicar el régimen **«drop and stop» (Stanish, 1986)**, aumentando gradualmente velocidad e intensidad a medida que desaparece el dolor."},{"tipo":"tabla","titulo":"Tratamientos farmacológicos, biológicos y físicos","columnas":["Opción","Autor(es)","Lo que hay que saber"],"filas":[["AINEs","—","Disminuyen inflamación y dolor; útiles en la rehabilitación"],["Corticoides intratendinosos","Nirschl, 1992 / Kannus y Józsa, 1991","Controvertidos: muerte celular, atrofia y efectos mecánicos negativos; sin diferencias en roturas entre infiltrados y no infiltrados"],["Aprotinina","Capasso, 1997","Inhibidor de proteasas"],["Polifosfato de glucosaminoglicano","Dow, 1996","Constituyente de la sustancia matricial"],["Trinitrato de glicerol tópico","Nelson, 2004","Tratamiento químico tópico"],["Agentes esclerosantes","Ohberg, 2002","Reducen la proliferación vascular y la neoformación neural"],["Factores de crecimiento","Dahlgren 2002; Nakamura 1998; Chang 2006","**Solo estudios experimentales en animales**; dudas sobre dosis y momento"],["Terapia génica","Lou 1997; Forslund 2003; Aspenberg 2000; Fu 2003","FAK, CDMP-2, BMP-12/13/14: experimental"],["Células troncales","Caplan 2001; Dejardin 2001","Genes de diferenciación del tendón **no identificados**"],["Medios físicos (US, láser, calor, campos, electroestimulación, ondas de choque, radiofrecuencia)","Sharma y Maffulli, 2005","**Resultados ciertos a corto plazo e inciertos a largo plazo**"]]},{"tipo":"dato","valor":"40-60 s × 4-5","texto":"Isométricos de Cook y Purdam: contracciones de larga duración a 25-50 % de 1RM, varias veces al día; reducen el dolor (inhibición cortical) y mantienen la capacidad del tendón."},{"tipo":"parrafo","texto":"El **excéntrico** se ha mostrado más eficaz que cualquier otra técnica fisioterápica en la tendinopatía crónica porque las cargas que soporta el tendón son diferentes a las del concéntrico. En la fase de regeneración favorece la **correcta alineación del colágeno**, aumenta la resistencia, estimula la síntesis de los fibroblastos (más **colágeno tipo I**), previene adherencias peritendinosas y mejora la coordinación neuromuscular. En el dolor, parece modificar los **receptores NMDA** (no los niveles de glutamato) y reducir la neovascularización por el estrechamiento repetido de los neovasos."},{"tipo":"tabla","titulo":"Protocolos excéntricos clásicos","columnas":["Rasgo","Curwin y Stanish (1984)","Alfredson (1998)"],"filas":[["Tendón / ejercicio","Sentadilla excéntrica de extensión a 90° de flexión de rodilla","Aquiles: bajada en escalón hacia flexión dorsal con rodilla extendida y con rodilla flexionada; subida con la pierna sana"],["Progresión","Días 1-2 bajada lenta; días 3-7 más **velocidad**; semana 2 +10 % del peso corporal; semanas 3-6 de 4,5 a 13,5 kg","Bajada lenta; progresa la **carga** (mochila lastrada, máquina), **no la velocidad**"],["Dosis","3×10 una vez al día; desde la semana 6, 3×10 tres veces por semana","**3×15, 2 veces/día, 7 días/semana, 12 semanas**"],["Dolor","**Sin dolor**","Se permite el dolor; parar solo si es fuerte; las dos primeras semanas es normal que duela"],["Complementos","Calentamiento, estiramiento de cuádriceps e isquios (3×30 s) antes y después; 5 min de crioterapia","Instrucción del paciente"]]},{"tipo":"alerta","texto":"Diferencia clásica de examen: **Curwin y Stanish** progresan primero la **velocidad** y exigen ejercicio **sin dolor**; **Alfredson** mantiene la bajada **lenta**, progresa la **carga** y **permite el dolor**."},{"tipo":"dato","valor":"≈70 %","texto":"Buenos resultados en dolor y función con el excéntrico en tendinopatía rotuliana (Visnes y Bahr, 2007: 7 estudios, 162 pacientes), a interpretar con cautela."},{"tipo":"perla","texto":"En fase muy dolorosa (reactiva) empieza por **isométricos** para la analgesia y para mantener la capacidad del tendón; introduce después la carga excéntrica y corrige los factores causales (equipamiento, ortesis, entrenamiento; Jorgensen, 1988)."}]}],"caso_clinico":{"titulo":"Jugadora de voleibol con dolor infrarrotuliano","presentacion":"Mujer de 22 años, jugadora de voleibol, que tras volver de 2 meses de parón por un esguince de tobillo ha duplicado sus sesiones de salto. Refiere dolor en el polo inferior de la rótula y rigidez por la mañana; el dolor aparece al empezar a entrenar, mejora al calentar y reaparece al terminar. En la ecografía, el tendón rotuliano es más grueso que el contralateral, sin áreas hipoecoicas ni neovasos. Al aterrizar del salto flexiona mucho la rodilla.","preguntas":[{"pregunta":"¿En qué estadio del modelo continuum la situarías y por qué?","respuesta":"En **tendinopatía reactiva**: aumento brusco de carga tras un periodo de descarga, tendón engrosado (aumento de proteoglicanos y agua, efecto Donnan) pero sin desorganización de la matriz ni cambios vasculares, que corresponderían al dysrepair o degenerativo."},{"pregunta":"¿Qué factores de riesgo identificas?","respuesta":"Extrínsecos: **error de entrenamiento** (incremento rápido de saltos tras la lesión, causa de hasta el 60 %). Intrínsecos/biomecánicos: recepción con más flexión de rodilla, típica de saltadores con tendinopatía rotuliana, y posible déficit de control del tobillo tras el esguince."},{"pregunta":"¿Cómo plantearías el tratamiento inicial?","respuesta":"Educación y **reducción de la carga** de salto (no reposo absoluto), **isométricos** de cuádriceps de 40-60 s × 4-5 repeticiones al 25-50 % de 1RM varias veces al día para la analgesia y, al calmar la reactividad, progresión a ejercicio de carga/excéntrico con monitorización del dolor. Al ser reactiva, tiene potencial de volver a la normalidad."}]},"preguntate":[{"pregunta":"¿Cuál es la composición del tendón en agua, colágeno y proteoglicanos?","respuesta":"Agua 55-70 %; colágeno 60-85 % del peso seco (95 % tipo I); elastina 1-2 %; proteoglicanos y GAGs 5-10 %."},{"pregunta":"¿Por qué el cuerpo del tendón es la zona más vulnerable?","respuesta":"Porque su irrigación principal procede del tejido conectivo circundante (paratenon o vaina) que no penetra en el tendón, y es la zona peor perfundida."},{"pregunta":"Explica el efecto Donnan y su repercusión ecográfica.","respuesta":"Los proteoglicanos, con alta carga negativa, atraen iones positivos y agua al interior del tendón; aumenta el contenido hídrico y el diámetro del tendón patológico respecto al sano."},{"pregunta":"¿Qué define el consenso ICON 2019 como tendinopatía?","respuesta":"El dolor tendinoso persistente y la pérdida de función relacionados con la carga mecánica, sin implicar una histología concreta."},{"pregunta":"¿Por qué la tendinosis no es un diagnóstico clínico?","respuesta":"Porque describe alteraciones estructurales de imagen que pueden existir sin dolor; el diagnóstico exige dolor con la actividad y/o pérdida de función."},{"pregunta":"Compara tendinopatía reactiva y tendón desestructurado.","respuesta":"La reactiva es una respuesta celular hiperactiva con engrosamiento sin desorganización de la matriz y reversible; en el dysrepair la matriz se desorganiza, hay áreas hipoecoicas y suele ser asintomático."},{"pregunta":"¿Qué diferencia histológicamente el tendón desestructurado del degenerativo?","respuesta":"Solo la ausencia de cambios en la vascularización en el desestructurado."},{"pregunta":"Diferencia tendones intrasinoviales y extrasinoviales y su manejo tras una sección.","respuesta":"Los extrasinoviales tienen recorrido corto y rectilíneo con paratendón; los intrasinoviales, recorrido largo con vaina y poleas. Tras una sección, en los intrasinoviales la cirugía es la única manera de restablecer la función."},{"pregunta":"¿Por qué la tenosinovitis supurada puede romper el tendón?","respuesta":"El pus trombosa los vasos de la vaina (vincula) y provoca necrosis isquémica aguda del tendón; por eso la cirugía es obligada."},{"pregunta":"¿En qué se diferencian los protocolos de Curwin-Stanish y Alfredson?","respuesta":"Curwin-Stanish: sentadilla, progresión de velocidad y luego carga, sin dolor, 3×10. Alfredson: Aquiles en escalón con rodilla extendida y flexionada, bajada lenta con progresión de carga, permite dolor, 3×15 dos veces al día durante 12 semanas."}],"glosario":[{"termino":"Tenocito","definicion":"Fibroblasto del tendón que sintetiza y mantiene la matriz extracelular y responde a la carga local."},{"termino":"Endotenon","definicion":"Tejido conjuntivo irrigado e inervado que rodea los haces primarios."},{"termino":"Peritenon","definicion":"Conjunto de paratendón y epitenon que permite el deslizamiento entre fascículos."},{"termino":"Metaloproteinasas (MMPs)","definicion":"Enzimas que degradan la matriz extracelular."},{"termino":"Efecto Donnan","definicion":"Atracción de iones y agua por la carga negativa de los proteoglicanos, que engrosa el tendón patológico."},{"termino":"Tendinosis","definicion":"Descripción estructural en imagen; factor de riesgo, no diagnóstico clínico."},{"termino":"Paratendinopatía","definicion":"Degeneración intratendinosa sin inflamación asociada a paratenonitis externa inflamatoria."},{"termino":"Dysrepair","definicion":"Tendón desestructurado: recuperación fallida con desorganización de la matriz."},{"termino":"Vincula tendinae","definicion":"Pedículos del mesotendón por los que entran los vasos en los tendones intrasinoviales."},{"termino":"Finkelstein","definicion":"Maniobra diagnóstica de la tenosinovitis estenosante de De Quervain."},{"termino":"Drop and stop","definicion":"Régimen de Stanish (1986) que aumenta gradualmente velocidad e intensidad a medida que desaparece el dolor."},{"termino":"Neoangiogénesis","definicion":"Formación de nuevos vasos (mediada por VEGF) que acompaña a neoinervación y dolor en la tendinosis."}],"fuentes":["Tema 9. Tendinopatías. Patología Quirúrgica I, Universidad Europea de Valencia, 2026-2027.","Consenso ICON 2019 sobre terminología de la tendinopatía.","Wang JH. Mechanobiology of tendon. J Biomech 2006; 39(9):1563-82.","Sharma P, Maffulli N. Tendon injury and tendinopathy: healing and repair. J Bone Joint Surg Br 2005; 87A:187-202 (cita tal como aparece en el temario).","Zwerver, 2011; Muth, 2017; Svensson et al., 2016; Yinghun et al., 2008.","Curwin y Stanish, 1984; Stanish, 1986; Alfredson, 1998 y 2003; Visnes y Bahr, 2007; Cook y Purdam."],"qcm":[{"pregunta":"En el tendón, ¿qué proporción del colágeno corresponde al tipo I según el temario?","opciones":["El 85-90 % del total de colágeno","El 95 % del total de colágeno","El 60-85 % del total de colágeno","El 55-70 % del total de colágeno"],"correcta":1,"explicacion":"El colágeno supone el 60-85 % del peso seco del tendón y, de él, el tipo I representa el 95 %; el 5 % restante son los tipos III, IV, V, VI y XII.","por_opcion":["❌ No es una cifra del temario; el tipo I es el 95 %.","✅ El tipo I es el 95 % del colágeno tendinoso.","❌ 60-85 % es la proporción de colágeno respecto al peso seco del tendón, no la del tipo I.","❌ 55-70 % es el contenido de agua del tendón."]},{"pregunta":"Según el temario, ¿cuáles son los primeros cambios histológicos importantes en una tendinopatía?","opciones":["Aumento de proteoglicanos, GAGs y glicoproteínas","Rotura de los enlaces cruzados del colágeno tipo I","Neovascularización con neoinervación del cuerpo tendinoso","Infiltrado de neutrófilos y macrófagos en el endotenon"],"correcta":0,"explicacion":"Los primeros cambios no son del colágeno sino un aumento de proteoglicanos, GAGs y glicoproteínas, que atraen agua (efecto Donnan) y engrosan el tendón.","por_opcion":["✅ Es el cambio precoz descrito en el temario.","❌ La desorganización del colágeno es posterior a los cambios de la matriz no fibrilar.","❌ La neovascularización aparece en estadios avanzados (degenerativo, ciclo de la tendinosis).","❌ En la tendinopatía no se encuentran células inflamatorias."]},{"pregunta":"¿De dónde procede el principal aporte sanguíneo del tendón?","opciones":["De la unión osteotendinosa a través de la membrana fibrocartilaginosa","De vasos intratendinosos que recorren el endotenon desde el hueso","Del tejido conectivo circundante, vía paratenon o vaina sinovial","De la unión miotendinosa por expansión de vasos musculares"],"correcta":2,"explicacion":"El principal aporte procede de los vasos del tejido conectivo circundante, que llegan por el paratenon o la vaina sinovial sin penetrar en la estructura tendinosa; por eso el cuerpo es la zona peor perfundida.","por_opcion":["❌ En la UOT los vasos no se comunican por la membrana fibrocartilaginosa y el aporte es menor.","❌ Los vasos de la UOT no contribuyen a vascularizar el cuerpo del tendón.","✅ Es el principal aporte sanguíneo según el temario.","❌ La UMT aporta vasos pero no es el aporte principal ni zona habitual de tendinopatía."]},{"pregunta":"¿Cuál de estos receptores NO figura entre los cuatro tipos descritos en la inervación del tendón?","opciones":["Husos neuromusculares","Órganos tendinosos de Golgi","Corpúsculos de Ruffini","Terminaciones nerviosas libres"],"correcta":0,"explicacion":"Los cuatro receptores del tendón son Ruffini, Pacini, órganos tendinosos de Golgi y terminaciones nerviosas libres. Los husos neuromusculares son receptores del músculo.","por_opcion":["✅ Los husos neuromusculares pertenecen al vientre muscular, no al tendón.","❌ Los órganos de Golgi convierten la deformación mecánica en información aferente.","❌ Ruffini es uno de los cuatro receptores tendinosos.","❌ Las terminaciones libres son el cuarto tipo de receptor."]},{"pregunta":"Según el consenso ICON 2019, el término tendinopatía se reserva para:","opciones":["La inflamación de las capas externas del tendón","La degeneración intratendinosa con microcalcificaciones en la entesis","El dolor tendinoso persistente y la pérdida de función ligados a la carga","La alteración estructural visible en ecografía o resonancia"],"correcta":2,"explicacion":"ICON 2019 define tendinopatía como el término preferido para el dolor tendinoso persistente y la pérdida de función relacionada con la carga mecánica.","por_opcion":["❌ Eso es la paratendonitis.","❌ Es un hallazgo histológico de la tendinopatía crónica, no la definición.","✅ Es la definición ICON 2019.","❌ Eso corresponde a la tendinosis, descripción estructural de imagen."]},{"pregunta":"Un tendón con discontinuidad de fascículos y áreas focales hipoecoicas en ecografía, sin cambios vasculares y asintomático, corresponde a:","opciones":["Reactividad sobre tendón degenerado","Tendinopatía degenerativa","Tendinopatía reactiva","Tendón desestructurado (dysrepair)"],"correcta":3,"explicacion":"El dysrepair muestra desorganización de la matriz con áreas hipoecoicas, suele ser asintomático y solo se diferencia del degenerado por la ausencia de cambios en la vascularización.","por_opcion":["❌ La reactividad sobre degenerado es sintomática.","❌ La degenerativa sí presenta cambios vasculares.","❌ La reactiva no presenta desorganización de la matriz.","✅ Cuadro típico de tendón desestructurado."]},{"pregunta":"¿Qué porcentaje de las roturas tendinosas presenta cambios degenerativos según el temario?","opciones":["El 70 %","El 97 %","El 60 %","El 85 %"],"correcta":1,"explicacion":"El 97 % de las roturas tendinosas presentan cambios degenerativos: una degeneración extensa sometida a altas cargas lleva a la rotura.","por_opcion":["❌ 70 % son los buenos resultados del excéntrico en rotuliana.","✅ Cifra del temario.","❌ 60 % es el porcentaje atribuido a errores de entrenamiento.","❌ 85 % es el límite superior del colágeno en peso seco."]},{"pregunta":"¿Qué caracteriza histológicamente a la tendinopatía crónica por sobreuso?","opciones":["Disminución del número de tenocitos con colágeno tipo I bien alineado","Infiltrado inflamatorio con exudado fibrinoso intravaina","Edema seroso con crepitación y adherencias por red de fibrina","Más fibroblastos, colágeno desorganizado e hiperplasia vascular sin inflamación"],"correcta":3,"explicacion":"Es una lesión degenerativa sin células inflamatorias, con aumento de fibroblastos, colágeno fragmentado y desorganizado, hiperplasia vascular y a menudo microcalcificaciones.","por_opcion":["❌ El colágeno está desorganizado, no alineado.","❌ El exudado intravaina corresponde a la paratendonitis/tenosinovitis aguda.","❌ Edema, crepitación y adherencias son propios de la paratendonitis.","✅ Describe la tendinopatía por sobreuso."]},{"pregunta":"En la tenosinovitis reumatoidea, ¿qué rotura tendinosa es la más frecuente?","opciones":["Extensor corto del pulgar en el primer compartimento","Flexor profundo de los dedos en la polea A1","Extensor largo del pulgar sobre el tubérculo de Lister","Abductor largo del pulgar en la estiloides radial"],"correcta":2,"explicacion":"La rotura más frecuente es la del extensor largo del pulgar sobre el tubérculo de Lister, punto de mayor inflexión del tendón, por acción enzimática, hipertrofia sinovial y vasculitis.","por_opcion":["❌ El extensor corto se afecta en De Quervain, sin rotura típica reumatoidea.","❌ El nódulo en la polea MCF corresponde al dedo en resorte.","✅ Es la rotura más frecuente en la AR.","❌ El abductor largo se afecta en De Quervain."]},{"pregunta":"¿Qué rasgo define a la tenosinovitis aguda supurada frente a la serosa?","opciones":["Se diagnostica por biopsia y se trata con extirpación completa","Su evolución sigue a la de una enfermedad infecciosa general","Afecta sobre todo a extensores de mano y pie","Puede causar necrosis isquémica y rotura, y requiere cirugía"],"correcta":3,"explicacion":"En la supurada el pus trombosa los vasos de la vaina y produce necrosis isquémica aguda y rotura; el tratamiento es antibiótico, inmovilización y cirugía obligada.","por_opcion":["❌ Biopsia y extirpación corresponden a la tuberculosa.","❌ Esa evolución paralela a la enfermedad de base es propia de la serosa.","❌ Los extensores de mano y pie son la localización de la serosa; la supurada afecta a flexores.","✅ Rasgo diferencial de la supurada."]},{"pregunta":"Respecto a los tendones intrasinoviales, es correcto que:","opciones":["Su ejemplo característico es el tendón de Aquiles","Tienen un recorrido corto y rectilíneo con deslizamiento simple","Están rodeados por paratendón en zonas de baja fricción","Tras una sección, la cirugía es la única manera de restablecer la función"],"correcta":3,"explicacion":"Los intrasinoviales están en zonas de mayor fricción, con recorrido largo por túneles osteofibrosos y aparato de deslizamiento complejo; tras una sección, la cirugía es la única forma de recuperar la función.","por_opcion":["❌ El Aquiles es extrasinovial.","❌ Recorrido corto y deslizamiento simple definen a los extrasinoviales.","❌ El paratendón y la baja fricción son de los extrasinoviales.","✅ Afirmación del temario."]},{"pregunta":"En el ciclo de la tendinosis de Yinghun (2008), ¿qué tipo de colágeno se sintetiza de forma preferente?","opciones":["Colágeno tipo III, de menor calidad","Colágeno tipo IV de membrana basal","Colágeno tipo II de tipo cartilaginoso","Colágeno tipo I con más enlaces cruzados"],"correcta":0,"explicacion":"El metabolismo anaeróbico del tenocito altera la MEC: aumentan GAG, agrecano, elastina y agua y se produce colágeno de menor calidad, tipo III en lugar de tipo I.","por_opcion":["✅ Colágeno tipo III de peores propiedades.","❌ El tipo IV es minoritario y no es el que se desvía.","❌ El tipo II no se menciona en el ciclo de la tendinosis.","❌ La síntesis de tipo I se reduce en favor del tipo III."]},{"pregunta":"¿Qué dosis de isométricos proponen Cook y Purdam para el efecto analgésico?","opciones":["3 series de 15 repeticiones, dos veces al día","Contracciones de 10 s × 10 repeticiones al 80 % de 1RM","3 series de 10 repeticiones, una vez al día","Contracciones de 40-60 s × 4-5 repeticiones, varias veces al día"],"correcta":3,"explicacion":"Los isométricos de larga duración y baja-moderada intensidad (25-50 % de 1RM), de 40-60 s × 4-5 repeticiones varias veces al día, reducen el dolor por inhibición cortical y mantienen la capacidad del tendón.","por_opcion":["❌ 3×15 dos veces al día es el protocolo excéntrico de Alfredson.","❌ Intensidad demasiado alta y contracciones demasiado cortas.","❌ 3×10 una vez al día es el protocolo de Curwin y Stanish.","✅ Dosis de Cook y Purdam."]},{"pregunta":"¿Qué diferencia el protocolo de Alfredson del de Curwin y Stanish?","opciones":["Alfredson mantiene la bajada lenta, progresa la carga y permite el dolor","Alfredson progresa la velocidad de la bajada antes que la carga","Alfredson se basa en la sentadilla excéntrica hasta 90° de flexión","Alfredson exige que el ejercicio se realice siempre sin dolor"],"correcta":0,"explicacion":"Alfredson define una bajada lenta, introduce carga y no velocidad, y permite realizar el ejercicio con dolor salvo que sea fuerte; Curwin y Stanish progresaban la velocidad y exigían ausencia de dolor.","por_opcion":["✅ Diferencia clave entre ambos protocolos.","❌ La progresión de velocidad es propia de Curwin y Stanish.","❌ La sentadilla excéntrica es el ejercicio de Curwin y Stanish.","❌ Curwin y Stanish preconizaban el ejercicio sin dolor."]},{"pregunta":"Según el temario, ¿cómo podría explicar el excéntrico la mejoría del dolor tendinoso?","opciones":["Reduce los niveles de glutamato intratendinoso","Modifica los receptores NMDA y cierra los neovasos","Induce un infiltrado antiinflamatorio en la vaina","Aumenta la sustancia P y los opiáceos endógenos"],"correcta":1,"explicacion":"Al trabajar buscando molestias, las fibras nerviosas se acomodan: los niveles de glutamato no cambian pero sí sus receptores NMDA; además, el estrechamiento repetido de la neovascularización haría que los vasos se cierren.","por_opcion":["❌ El temario indica que los niveles de glutamato no se alteran.","✅ Las dos hipótesis del temario.","❌ No hay infiltrado inflamatorio en la tendinopatía.","❌ El desequilibrio sustancia P/opiáceos forma parte del ciclo del dolor, no de su mejoría."]}],"asignatura":"Patología quirúrgica I","tema":9,"fecha":"2026-11-10"}</script>

    else delete E[id];
    localStorage.setItem('errores', JSON.stringify(E));

}
async function enviarScore(ok, n){
  const el = document.getElementById('envio'); if(!el) return;
  if(grande || !window.FICHAS_RELAY){ el.textContent = ''; return; }
  el.textContent = 'Enregistrement dans Notion…';
  try{
    const r = await fetch(window.FICHAS_RELAY, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:location.origin+location.pathname, score:ok, total:n})});
    const j = await r.json();
    el.textContent = j.ok ? '✓ Score enregistré dans Notion' + (j.proxima ? ` · prochaine révision : ${j.proxima}` : '') : 'Score non enregistré dans Notion (' + (j.error||'erreur') + ')';
  }catch(e){ el.textContent = 'Score non enregistré dans Notion (hors ligne ?)'; }
}

let orden = Q.map((_,i)=>i), pos = 0, resp = {};
function guardar(r){ try{ localStorage.setItem(clave, JSON.stringify({r, t:Date.now()})); }catch(e){} }
function ultimo(){ try{ const u = JSON.parse(localStorage.getItem(clave)||'null'); if(u){ const el=document.getElementById('ultimo'); el.hidden=false; el.innerHTML = `<b>${u.r}/${Q.length}</b><span>último intento</span>`; } }catch(e){} }
ultimo();
const marco = document.getElementById('marco');
function pintar(){
  if(pos >= orden.length) return fin();
  const k = orden[pos], q = Q[k], hecho = resp[k] != null;
  marco.innerHTML = `
    <div class="progreso"><span>${pos+1} / ${orden.length}</span><div class="barra"><i style="width:${pos/orden.length*100}%"></i></div><span id="okc">${Object.values(resp).filter(x=>x.ok).length} ✓</span></div>
    ${q.tema?`<span class="tema-q">${esc(q.tema)}</span>`:''}<p class="pregunta">${md(q.pregunta)}</p>
    <div class="opciones">${q.opciones.map((o,i)=>`<button class="op" data-i="${i}"><span class="l">${L[i]}</span><span>${md(o)}</span><span class="ex">${md(q.por_opcion?.[i]||'')}</span></button>`).join('')}</div>
    <div class="explic">${md(q.explicacion)}</div>
    <div class="acciones"><button class="bot sec" id="atras" ${pos===0?'disabled':''}>Anterior</button><button class="bot" id="sig" ${hecho?'':'disabled'}>${pos===orden.length-1?'Ver resultado':'Siguiente →'}</button></div>`;
  marco.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>elegir(k,+b.dataset.i)));
  marco.querySelector('#sig').onclick=()=>{pos++;pintar();marco.scrollIntoView({block:'start'});};
  marco.querySelector('#atras').onclick=()=>{pos--;pintar();};
  if(hecho) marcar(k);
}
function elegir(k,i){ if(resp[k]!=null) return; resp[k]={i,ok:i===Q[k].correcta}; errorGuardar(k, !resp[k].ok); marcar(k); marco.querySelector('#sig').disabled=false; }
function marcar(k){
  const q=Q[k], r=resp[k];
  marco.querySelectorAll('.op').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add('visto');if(i===q.correcta)b.classList.add('bien');else if(i===r.i)b.classList.add('mal');});
  marco.querySelector('.explic').classList.add('ver');
  marco.querySelector('.barra i').style.width=((pos+1)/orden.length*100)+'%';
  marco.querySelector('#okc').textContent=Object.values(resp).filter(x=>x.ok).length+' ✓';
}
function fin(){
  const ok = orden.filter(k=>resp[k]?.ok).length, n = orden.length;
  const completo = n===Q.length;
  if(completo) { guardar(ok); ultimo(); }
  const fallos = orden.filter(k=>!resp[k]?.ok);
  const msg = ok/n>=.8?'🎉 ¡Dominado!':ok/n>=.6?'💪 Bien, pero repasa las preguntas falladas.':'📖 Vuelve a la ficha antes de repetir.';
  marco.innerHTML = `<div class="resultado"><div class="gran">${ok}<small> / ${n}</small></div><p>${msg}</p><p id="envio" style="font-size:.9rem;color:var(--suave);margin:0 auto 14px"></p>
    <div class="acciones" style="justify-content:center"><button class="bot" id="rep">Repetir todo</button>${fallos.length?'<button class="bot sec" id="falla">Repetir solo los fallos</button>':''}</div></div>
    ${fallos.length?`<div class="repaso"><h3>Repaso de errores</h3>${fallos.map(k=>{const q=Q[k];return `<details><summary>${md(q.pregunta)}</summary><p><b>${L[q.correcta]}. ${md(q.opciones[q.correcta])}</b></p><p>${md(q.explicacion)}</p></details>`}).join('')}</div>`:''}`;
  if(completo) enviarScore(ok, n);
  marco.querySelector('#rep').onclick=()=>{orden=Q.map((_,i)=>i);resp={};pos=0;pintar();};
  const f=marco.querySelector('#falla'); if(f) f.onclick=()=>{orden=fallos;fallos.forEach(k=>delete resp[k]);pos=0;pintar();};
}
pintar();
})();
</script>
</body>
</html>
